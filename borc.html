/* ⚠ AW · DUZENLEME MODU acikca PARAMETREYLE tasiniyor, modul degiskeniyle
   DEGIL: kartDetayAc kaydetme/belge ekleme sonrasi da cagriliyor ve modul
   degiskeni orada temizlenmezse ekran duzenleme modunda ASILI kalirdi. */
/* ==================================================================
   DE · KART GECMISI · AY x KART TABLOSU
   ==================================================================
   Kullanicinin sorusu: "ödedikten sonra ne oluyor ben görmüyorum ki,
   hangi ay ne kadar ödeme yapılmış, yüklediğim ekstreler ne olmuş".
   Hakliydi — boyle bir ekran YOKTU. Kartlar sekmesi yalniz her kartin
   BUGUNKU halini gosteriyordu; gecmis icin kart kart acip donem
   tablosuna bakmak gerekiyordu (yedi kart × oniki ay).
   ⚠ VERI ZATEN VAR, YENI HESAP YOK: rakamlar kart_donem'den OLDUGU
     GIBI okunuyor (donem_odemesi · yeni_harcama · faiz_tutari +
     vergi_masraf_tutari). Yeni toplam tanimi icat edilmedi.
   ⚠ BOS HUCRE ile SIFIR AYRI: o ay o kartta donem YOKSA hucre BOS
     kalir, "0,00" YAZILMAZ. Bu ayrimi mukerrer donem olayinda
     pahaliya ogrendik — "0" ile "girilmemis" ayni sey degil.
   ⚠ ODEME TARIHI DURUSTLUGU: donem_odemesi_tarih donem BASINA tek
     tarih. Agustos ekstresine eylulde yapilan odeme AGUSTOS satirinda
     durur; sebebi tablonun altinda yazili, yoksa kullanici "eylulde
     odedim, neden agustosta yaziyor" der.
   ⚠ KATLANIR: ekran birikmesi kurali. Serit kapaliyken de yilin
     odeme toplamini gosteriyor — bir dokunus uzakta. */
let KG_GORUNUM = 'odeme', KG_YIL = null;
const KG_BASLIK = { odeme:'ÖDEME', harcama:'HARCAMA', maliyet:'MALİYET' };
function kgDeger(d, gorunum){
  if (!d) return null;                       // donem YOK -> bos hucre
  if (gorunum === 'odeme')
    return d.donem_odemesi == null ? null : kr(d.donem_odemesi);
  if (gorunum === 'harcama')
    return d.yeni_harcama == null ? null : kr(d.yeni_harcama);
  /* MALIYET = faiz + vergi/masraf. IKISI DE girilmemisse bos —
     "faiz islememis" ile "faiz girilmemis" ayni sey degil. */
  if (d.faiz_tutari == null && d.vergi_masraf_tutari == null) return null;
  return kr(d.faiz_tutari || 0) + kr(d.vergi_masraf_tutari || 0);
}
function kartGecmisiSeridi(v){
  const kartlar = v.kart.kartlar, donemler = v.kart.donemler;
  const yillar = [...new Set(donemler.map(d => d.donem.slice(0,4)))].sort().reverse();
  const kap = document.createElement('div');
  if (!yillar.length){
    return kap;                              // hic donem yok: serit de yok
  }
  if (!KG_YIL || !yillar.includes(KG_YIL))
    KG_YIL = yillar.includes(bugun().slice(0,4)) ? bugun().slice(0,4) : yillar[0];

  const ac = el('button','serit-ozet'); ac.type = 'button';
  ac.setAttribute('aria-expanded','false');
  const yilOdeme = donemler.filter(d => d.donem.slice(0,4) === KG_YIL
      && d.donem_odemesi != null).reduce((s,d) => s + kr(d.donem_odemesi), 0);
  const p1 = el('span','so-p');
  p1.appendChild(el('span','so-et','geçmiş · ' + KG_YIL));
  p1.appendChild(el('span','so-dg', tlk(yilOdeme) + ' ödendi'));
  ac.appendChild(p1);
  const okI = el('span','so-ok','▾'); ac.appendChild(okI);
  ac.setAttribute('aria-label', KG_YIL + ' yılında kartlara ödenen ' + tlk(yilOdeme)
    + '. Ay ay dökümü aç.');
  kap.appendChild(ac);
  const kutu = el('div'); kutu.hidden = true; kap.appendChild(kutu);
  const ciz = () => { kutu.textContent = ''; kutu.appendChild(kartGecmisi(v, yillar)); };
  ac.onclick = () => {
    if (kutu.hidden){ ciz(); kutu.hidden = false; okI.textContent = '▴';
      ac.setAttribute('aria-expanded','true'); }
    else { kutu.hidden = true; okI.textContent = '▾';
      ac.setAttribute('aria-expanded','false'); }
  };
  return kap;
}
function kartGecmisi(v, yillar){
  const kartlar = v.kart.kartlar, donemler = v.kart.donemler;
  const k = el('div','kart');
  k.appendChild(el('div','kbaslik','Kart geçmişi — ay ay'));

  /* --- gorunum secici + yil secici --- */
  const ust = el('div','kg-ust');
  const grup = el('div','kg-sec');
  grup.setAttribute('role','group');
  grup.setAttribute('aria-label','Hangi rakam gösterilsin');
  for (const g of ['odeme','harcama','maliyet']){
    const b = el('button','btn-mini' + (KG_GORUNUM === g ? ' secili' : ''), KG_BASLIK[g]);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(KG_GORUNUM === g));
    b.onclick = () => { KG_GORUNUM = g; ciz(); };
    grup.appendChild(b);
  }
  ust.appendChild(grup);
  if (yillar.length > 1){
    const ys = document.createElement('select');
    ys.setAttribute('aria-label','Yıl');
    yillar.forEach(y => { const o = document.createElement('option');
      o.value = y; o.textContent = y; if (y === KG_YIL) o.selected = true; ys.appendChild(o); });
    ys.onchange = () => { KG_YIL = ys.value; ciz(); };
    ust.appendChild(ys);
  }
  k.appendChild(ust);
  const govde = el('div'); k.appendChild(govde);

  const ciz = () => {
    govde.textContent = '';
    /* ⚠ AYLAR VERIDEN KURULUR, oniki satir ZORLANMAZ. */
    const aylar = [...new Set(donemler.filter(d => d.donem.slice(0,4) === KG_YIL)
      .map(d => d.donem))].sort().reverse();
    if (!aylar.length){
      govde.appendChild(el('div','bos', KG_YIL + ' yılında kayıtlı dönem yok.'));
      return;
    }
    const bul = (kid, ay) => donemler.find(d => d.kart_id === kid && d.donem === ay);
    const sar = el('div','tablo-sar');
    const t = document.createElement('table'); t.className = 'kg-t';
    const hr = document.createElement('tr');
    hr.appendChild(el('th', null, 'AY'));
    kartlar.forEach(c2 => hr.appendChild(el('th','sag', c2.ad)));
    hr.appendChild(el('th','sag','TOPLAM'));
    t.appendChild(hr);

    const kartTop = kartlar.map(() => 0), kartVar = kartlar.map(() => false);
    let genel = 0, tarihsiz = 0, ekstresiz = 0;
    for (const ay of aylar){
      const tr = document.createElement('tr');
      tr.appendChild(td(ayAdi(ay)));
      let satirTop = 0, satirVar = false;
      kartlar.forEach((c2, i) => {
        const d = bul(c2.id, ay);
        const deg = kgDeger(d, KG_GORUNUM);
        const h = document.createElement('td'); h.className = 'sag';
        if (!d){ h.appendChild(el('span','gri','')); tr.appendChild(h); return; }
        /* Donem VAR ama bu gorunumun alani girilmemis: gri tire.
           BOS hucre (donem yok) ile ayri gorunur. */
        if (deg == null) h.appendChild(el('span','gri','—'));
        else {
          const b = el('button','kg-h', tlk(deg));
          b.type = 'button';
          b.onclick = () => kgDonemAc(v, c2, d);
          kutuErisim(b, c2.ad + ' · ' + ayAdi(ay) + ' · ' + KG_BASLIK[KG_GORUNUM]
            + ' ' + tlk(deg) + (d.foto_path ? ', ekstresi var' : ', ekstresi yok')
            + ', dönemi aç');
          h.appendChild(b);
          satirTop += deg; satirVar = true;
          kartTop[i] += deg; kartVar[i] = true; genel += deg;
        }
        /* ⚠ EKSTRESI OLMAYAN DONEM ISARETLI: kullanici hangi ayin
           belgesinin eksik oldugunu gormeli. */
        if (!d.foto_path){ h.appendChild(el('span','kg-nok','')); ekstresiz++; }
        if (KG_GORUNUM === 'odeme' && d.donem_odemesi != null
            && d.donem_odemesi_tarih == null){
          h.appendChild(el('span','kg-tarihsiz','?')); tarihsiz++;
        }
        tr.appendChild(h);
      });
      const ht = document.createElement('td'); ht.className = 'sag kg-top';
      ht.textContent = satirVar ? tlk(satirTop) : '';
      tr.appendChild(ht);
      t.appendChild(tr);
    }
    /* --- sutun toplamlari --- */
    const tf = document.createElement('tr'); tf.className = 'kg-alt';
    tf.appendChild(td('KART TOPLAMI'));
    kartTop.forEach((x, i) => {
      const h = document.createElement('td'); h.className = 'sag';
      h.textContent = kartVar[i] ? tlk(x) : '';
      tf.appendChild(h);
    });
    const hg = document.createElement('td'); hg.className = 'sag kg-top';
    hg.textContent = tlk(genel); tf.appendChild(hg);
    t.appendChild(tf);
    sar.appendChild(t); govde.appendChild(sar);

    govde.appendChild(el('div','kucuk',
      'Boş hücre: o ay o kartta dönem YOK. "—": dönem var ama bu alan girilmemiş '
    + '(0,00 ile aynı şey değil). Soluk nokta: o dönemin ekstresi yüklenmemiş'
    + (ekstresiz ? ' (' + ekstresiz + ' dönem)' : '') + '. '
    + 'Bir rakama dokununca o dönem açılır, ekstresi varsa oradan görürsün.'));
    if (KG_GORUNUM === 'odeme')
      govde.appendChild(el('div','kucuk',
        'ÖDEME satırı EKSTRENİN ayıdır, paranın çıktığı ay değil: ağustos '
      + 'ekstresine eylülde yapılan ödeme AĞUSTOS satırında durur, çünkü o '
      + 'ekstreye karşılık yapılmıştır. Her dönem için tek ödeme tarihi '
      + 'tutuluyor.' + (tarihsiz ? ' "?" işaretli ' + tarihsiz
      + ' ödemenin tarihi girilmemiş.' : '')));
  };
  ciz();
  return k;
}
/* Hucreden donem detayina — ve ekstreye. */
function kgDonemAc(v, kart, d){
  const dlg = document.createElement('dialog'); dlg.className = 'pm';
  dlg.setAttribute('aria-modal','true');
  const bas = el('div','pm-bas sakin', ayAdi(d.donem)); bas.id = 'kgBas';
  dlg.setAttribute('aria-labelledby', bas.id); dlg.appendChild(bas);
  dlg.appendChild(el('div','pm-ad', kart.ad + (kart.banka ? ' · ' + kart.banka : '')));
  const sat = (et, dg) => { const s = el('div','oy-satir');
    s.appendChild(el('span','oy-et', et));
    s.appendChild(el('span','oy-dg', dg)); dlg.appendChild(s); };
  const g = (x) => x == null ? 'girilmedi' : tl(x);
  sat('Devir', g(d.devir));
  sat('Yeni harcama', g(d.yeni_harcama));
  sat('Düzeltme', g(d.duzeltme));
  sat('Alacak kayıtları', g(d.odenen));
  sat('KALAN', g(d.kalan));
  sat('Asgari', g(d.asgari_tutar));
  sat('Bu ekstreye ödediğim', g(d.donem_odemesi));
  sat('Ödemenin günü', d.donem_odemesi_tarih ? trGun(d.donem_odemesi_tarih)
    : (d.donem_odemesi == null ? '—' : 'girilmedi'));
  sat('KAPANMAMIŞ', g(d.kapanmamis));
  sat('Faiz', g(d.faiz_tutari));
  sat('Faiz vergisi/masrafı', g(d.vergi_masraf_tutari));
  const ey = el('div','pm-ey');
  if (d.foto_path){
    const be = el('button','btn2','Ekstreyi aç');
    be.type = 'button';
    be.onclick = () => belgeAc(d.foto_path, 'kartMsg');
    ey.appendChild(be);
  } else dlg.appendChild(el('div','kucuk','Bu dönemin ekstresi yüklenmemiş. '
    + 'Kartın kendi ekranındaki "+ Ekstre" düğmesiyle ekleyebilirsin.'));
  const bd = el('button','btn2','Dönemi aç'); bd.type = 'button';
  bd.onclick = () => { dlg.close(); dlg.remove(); kartDetayAc(kart.id, d.donem_id); };
  ey.appendChild(bd);
  const kapat = el('button','btn','Kapat'); kapat.type = 'button';
  kapat.onclick = () => { dlg.close(); dlg.remove(); };
  ey.appendChild(kapat);
  dlg.appendChild(ey);
  dlg.addEventListener('cancel', (e) => { e.preventDefault(); dlg.close(); dlg.remove(); });
  document.body.appendChild(dlg); dlg.showModal();
  return dlg;
}
async function kartDetayAc(kartId, duzenlenenId){
  seritiHizala();          // AL1 · ekranAc'tan gecmiyor, serit kaymis kalirdi
  const c = document.getElementById('icerik');
  c.textContent = ''; c.appendChild(el('div','bos','Yükleniyor...'));
  try{
    const { kartlar, donemler } = await kartGetir();
    const kart = kartlar.find(x => x.id === kartId);
    if (!kart){ c.textContent=''; c.appendChild(el('div','uyari-agir','Kart bulunamadı.')); return; }
    const liste = donemler.filter(d => d.kart_id === kartId).sort((a,b) => b.donem.localeCompare(a.donem));

    c.textContent = '';
    const geri = el('button','btn2','← Kartlara dön');
    geri.onclick = () => ekranAc('kartlar');
    c.appendChild(geri);

    const bas = el('div','kart');
    const bl = el('div','kbaslik');
    bl.appendChild(el('span', null, kart.ad + (kart.banka ? ' · ' + kart.banka : '')));
    bl.appendChild(document.createTextNode(' '));
    bl.appendChild(el('span', sahipSinif(kart.sahip), sahipKisa(kart.sahip)));
    bas.appendChild(bl);
    const sat = (e2,d) => { const s = el('div','satir');
      s.appendChild(el('span','et', e2)); s.appendChild(el('span','dg', d)); bas.appendChild(s); };
    sat('Son ödeme günü', kart.son_odeme_gunu ? 'ayın ' + kart.son_odeme_gunu + '. günü' : 'girilmemiş');
    sat('Kesim günü', kart.kesim_gunu ? 'ayın ' + kart.kesim_gunu + '. günü' : 'girilmemiş');
    /* ⚠ "girilmemiş" · SIFIR YAZILMAZ. Orani olmayan kartin devreden
       borcunun maliyeti hesaplanamiyor; bunu 0 gostermek devretmeyi
       bedavaymis gibi okutur (takvimdeki devretti satirinin kurali). */
    sat('Aylık faiz oranı', kart.faiz_orani == null ? 'girilmemiş'
      : '%' + String(kart.faiz_orani).replace('.', ','));
    sat('Girilen dönem', liste.length + ' ay');
    if (kart.kart_limiti != null) sat('Kart limiti', tl(kart.kart_limiti));
    /* ⚠ AV · ARSIVLEME · mevcut desen KOPYALANDI (Krediyi arsivle /
       Maden borcunu arsivle): digerMenu + pasifeAlAc, gerekce zorunlu.
       ⚠ Sahibin karari: kart DONEMLERIYLE BIRLIKTE arsivlenir. Kredi
         tarafindaki "tek odeme varsa arsivlenemez" kurali BURAYA
         KOPYALANMADI — kartta her donem bir ekstredir, o kural
         ekstresi olan hicbir karti arsivlenemez yapardi. */
    bas.appendChild(digerMenu([['Kartı sil', (a) => kartSil(kart, liste, a)]]));
    if (liste.length) sat('Son kalan', tl(liste[0].kalan) + ' (' + liste[0].donem + ')');
    c.appendChild(bas);

    const msg = el('div','msg'); msg.id = 'kartMsg'; c.appendChild(msg);
    c.appendChild(kartUyarisi());
    c.appendChild(donemFormu(kart, liste, liste.find(d => d.donem_id === duzenlenenId) || null));

    const k = el('div','kart');
    k.appendChild(el('div','kbaslik','Ay ay döküm'));
    if (!liste.length){
      k.appendChild(el('div','bos','Bu kartta henüz dönem yok. Yukarıdaki formdan ekle.'));
    } else {
      const sar = el('div','tablo-sar');
      const t = document.createElement('table');
      const hr = document.createElement('tr');
      /* AV · uc sutun eklendi: ASGARI · BU EKSTREYE ÖDENEN · KAPANMAMIŞ */
      ['DÖNEM','DEVİR','YENİ','DÜZELTME','ALACAK KAYITLARI','KALAN','ASGARİ','BU EKSTREYE ÖDEDİĞİM','KAPANMAMIŞ','DURUM','FAİZ','VERGİ','EKSTRE',''].forEach((h,i) =>
        hr.appendChild(el('th', ((i>=1 && i<=8) || i===10 || i===11) ? 'sag' : null, h)));
      t.appendChild(hr);
      for (const d of liste){
        const tr = document.createElement('tr');
        const dh = document.createElement('td');
        dh.appendChild(el('span', null, d.donem));
        if (d.devir_tutarsiz){
          dh.appendChild(document.createElement('br'));
          dh.appendChild(el('span','rozet rz-eksik','DEVİR TUTMUYOR'));
        }
        tr.appendChild(dh);
        tr.appendChild(td(tl(d.devir),'sag'));
        tr.appendChild(td(tl(d.yeni_harcama),'sag'));
        tr.appendChild(td(tl(d.duzeltme),'sag'));
        tr.appendChild(td(tl(d.odenen),'sag'));
        const kh = td(tl(d.kalan),'sag'); kh.style.fontWeight = '900'; tr.appendChild(kh);
        /* ⚠ NULL ile 0 AYNI GORUNMEZ: girilmemis alan gri "—". */
        tr.appendChild(td(d.asgari_tutar == null ? '—' : tl(d.asgari_tutar),'sag'));
        tr.appendChild(td(d.donem_odemesi == null ? '—' : tl(d.donem_odemesi),'sag'));
        tr.appendChild(td(d.donem_odemesi == null ? '—' : tl(d.kapanmamis),'sag'));
        /* ⚠ 'girilmedi' ROZET DEGIL — rozet bir BEYANDIR, veri yoksa beyan
           da yok. O halde gri "—". Digerleri rozet. */
        const dh2 = document.createElement('td');
        /* ⚠ BILINMEYEN deger de 'girilmedi' gibi ele alinir: eski bir
           satirda ya da eski gorunumde odeme_turu YOKSA BOS ROZET ciziliyordu
           (olculdu). Adsiz rozet, icerigi olmayan bir BEYANDIR. */
        const RZ = { tam:['rz-yesil','TAM'], kismi:['rz-sari','KISMİ'],
                     eksik:['rz-eksik','ASGARİNİN ALTINDA'], odenmedi:['rz-eksik','ÖDENMEDİ'] }[d.odeme_turu];
        if (!RZ) dh2.appendChild(el('span','gri','—'));
        else dh2.appendChild(el('span','rozet ' + RZ[0], RZ[1]));
        tr.appendChild(dh2);
        /* ⚠ NULL = girilmedi (gri —), 0 = faiz islememis (0,00). AYNI DEGIL. */
        tr.appendChild(td(d.faiz_tutari == null ? '—' : tl(d.faiz_tutari),'sag'));
        tr.appendChild(td(d.vergi_masraf_tutari == null ? '—' : tl(d.vergi_masraf_tutari),'sag'));
        const eh = document.createElement('td');
        if (d.foto_path){
          const a = el('button','btn-mini','Aç');
          a.onclick = () => belgeAc(d.foto_path,'kartMsg');
          eh.appendChild(a);
        } else {
          eh.appendChild(el('span','rozet rz-sari','EKSTRE EKSİK'));
        }
        tr.appendChild(eh);
        const ey = document.createElement('td');
        const be = el('button','btn-mini', d.foto_path ? 'Değiştir' : '+ Ekstre');
        be.onclick = () => dekontEkle('kart_donem', d.donem_id, 'kart_ekstre','kartMsg',
                                      !!d.foto_path, () => kartDetayAc(kartId));
        ey.appendChild(be);
        /* ⚠ CN · ODEMESI GIRILMEMIS DONEMDE KISA YOL.
           Odeme girmek icin donemi DUZENLEMEK gerekiyordu; sahip
           "ekstreyi yukledikten sonra odeme yap dugmesi olsun" dedi.
           Dugme YALNIZ donem_odemesi bos satirda cikar — girilmis
           donemde rakami degistirmek hala Düzenle'nin isi (tek yol,
           tek denetim). */
        /* ⚠ DC · DUGME HER DONEMDE. Once yalniz donem_odemesi BOS satirda
           cikiyordu; ikinci odemede kullanici Duzenle'ye dusuyor ve
           KUMULATIF toplami yazmak zorunda kaliyordu. Bir ekstreye
           birden cok odeme yapilmasi NORMAL hal — istisna degil.
           Girilen tutar mevcudun UZERINE EKLENIR.
           ⚠ Rakami DEGISTIRMEK hala Duzenle'nin isi (tek denetim yolu);
             eklemek ayri, duzeltmek ayri. */
        const bo = el('button','btn-mini','Ödeme yap');
        bo.onclick = () => odemeYapAc(kart, d);
        ey.appendChild(bo);
        const bd = el('button','btn-mini','Düzenle');
        bd.onclick = () => kartDetayAc(kartId, d.donem_id);
        ey.appendChild(bd);
        const ba = el('button','btn-mini','Sil');
        ba.onclick = () => donemSil(kart, d, ba);
        ey.appendChild(ba);
        tr.appendChild(ey);
        t.appendChild(tr);
      }
      sar.appendChild(t); k.appendChild(sar);
      k.appendChild(el('div','kucuk',
        'KALAN = devir + yeni harcama + düzeltme − alacak kayıtları. Ayrı bir sütunda tutulmaz, '
      + 'girdilerden hesaplanır; böylece girdilerle ayrışamaz.'));
      const tut = liste.filter(d => d.devir_tutarsiz);
      if (tut.length)
        k.appendChild(el('div','uyari-agir',
          tut.length + ' dönemde devir, önceki ayın kalanından KÜÇÜK: '
          + tut.map(d => d.donem).join(', ')
          + '. Ya bir ay eksik ya da bir rakam yanlış girilmiş.'));
      /* ⚠ AV · BUYUYEN DEVIR ARTIK UYARI DEGIL ama SESSIZ de degil.
         Kismi/asgari odenen kartta bir sonraki devir faiz kadar buyur —
         bu NORMAL. "Uyari yok" ile "fark su kadar, muhtemelen faiz"
         AYNI SEY DEGIL; fark yaziliyor, dogrulamayi kullanici yapiyor. */
      const buyuyen = liste.filter(d => d.devir_farki != null && kr(d.devir_farki) > 0);
      if (buyuyen.length)
        k.appendChild(el('div','kucuk',
          buyuyen.length + ' dönemde devir, önceki ayın kalanından BÜYÜK: '
          + buyuyen.map(d => d.donem + ' (+' + tl(d.devir_farki) + ')').join(' · ')
          + '. Kısmi ödenen kartta bu normaldir — fark büyük ihtimalle faiz.'));
      /* ⚠ AW · Faiz artik GIRILEBILIYOR; "sen karsilastir" demek yerine
         KARSILASTIRILIYOR. devir_farki(M) ≈ faiz(M) + vergi(M) tutmuyorsa
         ya bir rakam yanlis yazilmis ya da ekstrede baska bir kalem var.
         ⚠ Faiz GIRILMEMIS donem bu denetime SOKULMUYOR — girilmemis alan
           "tutmuyor" degildir. */
      const fk = buyuyen.filter(d => d.faiz_tutari != null || d.vergi_masraf_tutari != null)
        .map(d => ({ donem:d.donem, f: kr(d.devir_farki),
                     g: kr(d.faiz_tutari || 0) + kr(d.vergi_masraf_tutari || 0) }));
      const tutmaz = fk.filter(x => x.f !== x.g);
      if (fk.length && !tutmaz.length)
        k.appendChild(el('div','kucuk', fk.length + ' dönemde devir farkı, girilen faiz+vergi ile BİREBİR tutuyor: '
          + fk.map(x => x.donem + ' (' + tlk(x.g) + ')').join(' · ') + '.'));
      if (tutmaz.length)
        k.appendChild(el('div','uyari-agir', tutmaz.length + ' dönemde devir farkı, girilen faiz+vergi ile TUTMUYOR: '
          + tutmaz.map(x => x.donem + ' (fark ' + tlk(x.f) + ' · faiz+vergi ' + tlk(x.g) + ')').join(' · ')
          + '. Ya bir rakam yanlış yazılmış ya da ekstrede başka bir kalem var.'));
      /* ⚠ ASGARININ ALTINDA odeme ucuz bir hata degil: kart kapanir ve
         gecikme faizi isler. Gorunur uyari. */
      const eksikOd = liste.filter(d => d.odeme_turu === 'eksik');
      if (eksikOd.length)
        k.appendChild(el('div','uyari-agir',
          eksikOd.length + ' dönemde bu ekstreye ödediğim tutar ASGARİNİN ALTINDA: '
          + eksikOd.map(d => d.donem).join(', ')
          + '. Asgarinin altı ödeme, kartın gecikmeye düşmesi ve ceza faizi demektir.'));
    }
    c.appendChild(k);
  }catch(e){
    c.textContent = '';
    c.appendChild(el('div','uyari-agir','Kart açılamadı: ' + hataTr(e && e.message)));
  }
}

/* ==================================================================
   DD · DONEM ETIKETI BUGUNUN AYI DEGIL, EKSTRENIN AYI
   ==================================================================
   Eski hal: dn.value = bugun().slice(0,7). Agustos ekstresini 4 Eylul'de
   girince 2026-09 yaziyordu. MUKERRER DONEMLERIN DOGRUDAN SEBEBI BU:
   canli veride dort kartta AYNI ekstre iki kez, kurusuna kadar ayni
   kalanla duruyor (Black 122.748,91 · Enpara 467.567,96 ·
   KTU 347.386,08 · Ziraat Ticari 580.551,85). Odemeler ikiye bolunmus;
   toplaninca dordu de TAM kapaniyor, gercek kart borcu 0 — ama bant
   249.079,75, takvim 1.818.254,80 diyordu.
   Kaynak sirasi:
     a) Okuyucudan gelen HESAP KESIM ayi (ekstreKaydet yolu zaten bunu
        kullaniyor: "DONEM = KESIM AYI, son odeme ayindan DEGIL")
     b) Kartin kesim_gunu biliniyorsa: bugunun gunu >= kesim_gunu ise
        bu ay, degilse gecen ay. (4 Eylul, kesim 15 -> son kesim 15.08
        -> 2026-08 ✓)
     c) Hicbiri yoksa bugunun ayi (eski hal) */
function oncekiAy(ay){
  const [y,m] = ay.split('-').map(Number);
  const d = new Date(Date.UTC(y, m - 2, 1));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2,'0');
}
function donemVarsayilan(kart, okunanKesimAy){
  const b = bugun(), buAy = b.slice(0,7);
  if (okunanKesimAy && /^\d{4}-\d{2}$/.test(okunanKesimAy))
    return { ay: okunanKesimAy, kaynak: 'Dönem ekstrenin hesap kesim tarihinden geldi.' };
  if (kart && kart.kesim_gunu != null){
    const gun = Number(b.slice(8,10));
    const ay = gun >= Number(kart.kesim_gunu) ? buAy : oncekiAy(buAy);
    return { ay, kaynak: 'Dönem kartın kesim gününden (ayın ' + kart.kesim_gunu
      + '.) türetildi: bugün ' + Number(b.slice(8,10)) + '. gün, son kesim '
      + ayAdi(ay) + '. Yanlışsa değiştir.' };
  }
  return { ay: buAy, kaynak: 'Kartın kesim günü girilmemiş; bugünün ayı yazıldı. '
    + 'Ekstrenin hesap kesim ayını kontrol et.' };
}
function donemFormu(kart, liste, duz){
  const k = el('div','kart');
  k.appendChild(el('div','kbaslik', duz ? duz.donem + ' düzeltiliyor' : 'Yeni ay ekle'));
  if (duz) k.appendChild(el('div','bilgi',
    'Var olan ekstre yeniden yazılıyor. Bir rakamı düzeltmek için 8 rakamı yeniden '
  + 'yazman gerekmiyor — dolu gelen alanlarda yalnız yanlış olanı değiştir.'));

  const alan = (etiket, id, deger, mod) => {
    k.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input');
    i.id = id; i.type = 'text';
    if (deger !== undefined && deger !== null) i.value = deger;
    if (mod) i.setAttribute('inputmode', mod);
    k.appendChild(i); return i;
  };

  k.appendChild(el('label', null, 'Dönem (YYYY-AA)')).setAttribute('for','kdDonem');
  const dn = document.createElement('input');
  dn.id = 'kdDonem'; dn.type = 'month';
  const vd = duz ? { ay: duz.donem, kaynak: null } : donemVarsayilan(kart);
  dn.value = vd.ay;
  k.appendChild(dn);
  /* ⚠ DD · DEGERIN NEREDEN GELDIGI YAZILI. Alan KILITLI DEGIL — yalniz
     dogru deger onde duruyor; kullanici neye baktigini bilmeli. */
  if (vd.kaynak) k.appendChild(el('div','kucuk', vd.kaynak));
  /* ⚠ Kurus -> form metni. tl() nokta/binlik ekliyor, paraCoz onu geri
     okuyabiliyor ama gidip gelen bicimlendirme bir gun yuvarlar; ham
     "1234,56" yaziliyor. NULL alan BOS kaliyor — 0,00 YAZILMIYOR, cunku
     "girilmedi" ile "sifir" ayni sey degil. */
  const fm = (x) => x == null ? '' : (kr(x)/100).toFixed(2).replace('.', ',');
  const dv = alan('Devir (geçen aydan kalan)', 'kdDevir', duz ? fm(duz.devir) : '', 'decimal');
  const ipucu = el('div','kucuk'); ipucu.id = 'kdIpucu'; k.appendChild(ipucu);

  /* Donem secilince devir ONCEKI DONEMIN KALANIYLA on doldurulur.
     Kullanici degistirebilir; degistirir ve zincir kirilirsa asagidaki
     uyari cikar — sessizce gecilmez. */
  const onDoldur = () => {
    if (duz) { canliKalan(); return; }   // duzenlemede devir ZATEN kayitli deger
    const d = dn.value;
    const onceki = liste.filter(x => x.donem < d).sort((a,b) => b.donem.localeCompare(a.donem))[0];
    if (onceki){
      dv.value = (kr(onceki.kalan)/100).toFixed(2).replace('.', ',');
      ipucu.textContent = onceki.donem + ' kalanı ' + tl(onceki.kalan) + ' — devir olarak dolduruldu.';
    } else {
      ipucu.textContent = 'Bu dönemden önce kayıt yok; devir bilinen açılış tutarıdır.';
    }
    zinciriDenetle();
  };
  const zinciriDenetle = () => {
    const d = dn.value;
    const onceki = liste.filter(x => x.donem < d).sort((a,b) => b.donem.localeCompare(a.donem))[0];
    const u = document.getElementById('kdZincir');
    if (!u) return;
    if (!onceki){ u.className = 'kucuk'; u.textContent = ''; return; }
    const g = paraCoz(dv.value);
    if (!g.ok){ u.className = 'kucuk'; u.textContent = ''; return; }
    if (g.kurus !== kr(onceki.kalan)){
      u.className = 'uyari-agir';
      u.textContent = 'DEVİR TUTMUYOR: ' + onceki.donem + ' kalanı ' + tl(onceki.kalan)
        + ', sen ' + tlk(g.kurus) + ' yazdın. Kaydedilir ama listede işaretli kalır.';
    } else { u.className = 'kucuk'; u.textContent = ''; }
  };
  dn.onchange = () => { onDoldur(); canliKalan(); };
  dv.oninput = () => { zinciriDenetle(); canliKalan(); };

  /* ⚠ Alanlar HENUZ BELGEYE EKLENMEDI (k kopuk bir div). document.getElementById
     ile aranirsa null doner ve canli ayna sessizce hic baglanmaz — alan()'in
     dondurdugu ogeye dogrudan baglaniyor. */
  const yn = alan('Yeni harcama', 'kdYeni', duz ? fm(duz.yeni_harcama) : '', 'decimal');
  const dz2 = alan('Düzeltme (iade/indirim eksi yazılır)', 'kdDuzeltme', duz ? fm(duz.duzeltme) : '', 'decimal');
  const od = alan('Alacak kayıtları (ekstreden · dönem içinde geçen ödemeler)', 'kdOdenen', duz ? fm(duz.odenen) : '', 'decimal');
  /* ⚠ AV/BN · IKI FARKLI "ODEME". Yukaridaki "Alacak kayıtları" EKSTRENIN
     kendi kelimesi (Is Bankasi: Devreden Bakiye · Alacak Kayitlari · Borc
     Kayitlari · Hesap Ozeti Borcu) — kalan'i HESAPLAR. Asagidaki, bu
     ekstreye KARSILIK kesimden SONRA yapilan odeme — kalan'i DEGISTIRMEZ.
     Ikisine de "odenen" denince kullanici eslestiremedi (BN); artik ayni
     ekranda "oden" kokunden tek etiket var. Alan adi `odenen` DEGISMEDI. */
  alan('Asgari tutar (ekstreden, bilinmiyorsa boş)', 'kdAsgari', duz ? fm(duz.asgari_tutar) : '', 'decimal');
  alan('Bu ekstreye karşılık ödediğim (bilinmiyorsa boş)', 'kdOdedim', duz ? fm(duz.donem_odemesi) : '', 'decimal');
  /* ⚠ CG · v113 · ODEMENIN GUNU. Varsayilan BUGUN — tek dokunusla
     degistirilir; tutar girildiyse tarih de dolu GITMEK ZORUNDA (veri
     eksik kalmasin), tutar bosken tarih GONDERILMEZ (null gider —
     UPDATE'te eski tarihi de temizler, yoksa kd_odeme_tarih_chk
     "tarihli-tutarsiz" satiri reddederdi).
     ⚠ Duzenlemede MEVCUT tarih v_kart_donem'de YOK (gorunum v113'te
       bilerek genisletilmedi); tek satirlik sorguyla tablodan cekilir
       ve hem alana hem duz'a yazilir — yoksa her duzenleme bugunu
       koyup eski tarihi sessizce EZERDI. */
  k.appendChild(el('label', null, 'Ödemenin günü')).setAttribute('for','kdOdedimTarih');
  const odTarih = document.createElement('input');
  odTarih.id = 'kdOdedimTarih'; odTarih.type = 'date'; odTarih.value = bugun();
  k.appendChild(odTarih);
  if (duz && duz.donem_id)
    sb.from('kart_donem').select('donem_odemesi_tarih').eq('id', duz.donem_id).maybeSingle()
      .then(r => { if (r.data && r.data.donem_odemesi_tarih){
        odTarih.value = r.data.donem_odemesi_tarih;
        duz.donem_odemesi_tarih = r.data.donem_odemesi_tarih; } });
  /* ⚠ AW · FAIZ ve VERGI AYRI TUTULUYOR, tek "maliyet" alaninda
     BIRLESTIRILMEDI — ev kalibi kredi_taksit'te de anapara/faiz/vergi
     diye uce bolunmus. Ekstrede de ayri yaziyor: FZ:... VR/FN:...
     ⚠ Bunlar KALAN'A GIRMEZ: faiz zaten "yeni harcama" icinde bankanin
       ekstresinde toplanmis durumda. Burada AYRICA saklanmasinin sebebi
       devir buyumesini aciklayabilmek. Iki kez toplanmiyor. */
  /* ⚠ ETIKET DEGISTI · TESHIS EDILMIS BIR KUSURUN SEBEBIYDI.
     Olculdu (28.08): Ziraat Şahıs 2026-08 doneminde faiz_tutari = 3.25
     kayitli; o kartin FAIZ ORANI da %3,25 ve ekstresinde faizKesinti 0,
     yani o donem HIC faiz islememis. Okuyucu suclu DEGIL — gercek PDF
     ile calistirildi, `faiz: YOK` donduruyor (asagida kanit). Deger
     ELLE bu alana yazilmis.
     Sebep etiketti: "FZ" yalniz Maximum/Is Bankasi ekstresinin isareti.
     Ziraat ekstresinde FZ: diye bir satir YOK; oradaki faize benzeyen
     tek sayi "Alışveriş Faizi 3,25" — yani ORAN. Etiket, kullaniciyi
     tam olarak o sayiya bakmaya gonderiyordu.
     Yeni etiket bankaya ozel isaret ADI vermiyor ve TUTAR oldugunu
     soyluyor; ipucu satiri orani ayrica disliyor. */
  alan('Ekstrede bu döneme işlemiş faiz TUTARI (yoksa boş)', 'kdFaiz',
    duz ? fm(duz.faiz_tutari) : '', 'decimal');
  k.appendChild(el('div','kucuk',
    'Faiz ORANI değil, TUTARI. Ekstrede "Kredi faizi" / "Alışveriş faizi" / '
  + '"FZ:" satırındaki para tutarı. "Alışveriş Faizi %3,25" gibi bir satır '
  + 'ORANDIR, buraya yazılmaz. O dönem faiz işlemediyse BOŞ bırak.'));
  alan('Faiz vergisi/masrafı — TUTAR (yoksa boş)', 'kdVergi',
    duz ? fm(duz.vergi_masraf_tutari) : '', 'decimal');
  /* CO · ekstre alanlari. kdDuzeltme EKSI kabul eder -> eksiVar. */
  paraBaglaHepsi(k, ['kdDevir','kdYeni','kdOdenen','kdAsgari','kdOdedim','kdFaiz','kdVergi']);
  paraBagla(paraAl(k, 'kdDuzeltme'), null, true);
  ['kdDevir','kdYeni','kdOdenen','kdAsgari','kdOdedim','kdFaiz','kdVergi']
    .forEach(i => paraBicimle(paraAl(k, i)));
  paraBicimle(paraAl(k, 'kdDuzeltme'), true);
  const zn = el('div','kucuk'); zn.id = 'kdZincir'; k.appendChild(zn);

  /* ⚠ AW · C · CANLI AYNA — KAPI DEGIL. Kullanici yazdikca kalani gorur;
     hicbir sey engellenmiyor, uyari da verilmiyor. Ekstrede olmayan bir
     hesap UYDURULMUYOR: kullanicinin kendi girdigi dort rakamin toplami.
     Dogrulamayi banka ekstresine bakarak kullanici yapar. */
  const cy = el('div','bilgi'); cy.id = 'kdCanli'; k.appendChild(cy);
  const canliKalan = () => {
    const g = (id) => { const h = document.getElementById(id); return h ? h.value.trim() : ''; };
    const c1 = paraCoz(g('kdDevir')), c2 = paraCoz(g('kdYeni')), c4 = paraCoz(g('kdOdenen'));
    const dh = g('kdDuzeltme'), c3 = paraCoz(dh);
    if (!c1.ok || !c2.ok || !c3.ok || !c4.ok){ cy.textContent = 'Kalan hesaplanamıyor — bir alanda sayı olmayan bir şey var.'; return; }
    const dz = /^\s*[-−]/.test(dh) ? -c3.kurus : c3.kurus;
    const kl = c1.kurus + c2.kurus + dz - c4.kurus;
    cy.textContent = '';
    cy.appendChild(el('div', null, 'KALAN = ' + tlk(c1.kurus) + ' + ' + tlk(c2.kurus)
      + (dz < 0 ? ' − ' + tlk(-dz) : ' + ' + tlk(dz)) + ' − ' + tlk(c4.kurus) + ' = ' + tlk(kl)));
    cy.appendChild(el('div','kucuk', 'Ekstredeki "Hesap Özeti Borcu" ile aynı mı?'));
  };
  [yn, dz2, od].forEach(h => { h.oninput = canliKalan; });

  /* ⚠ AL4 · Kullanici "belge yukleme yeri yok" dedi. VAR: kaydedilmis her
     donem satirinda "+ Ekstre" dugmesi cikiyor. Ama form doluyken liste
     BOS oldugu icin dugme hic gorunmuyordu. Forma IKINCI bir dosya alani
     EKLENMEDI — ayni belge iki yerden girilirse hangisi dogru belli olmaz;
     yalnizca nerede oldugu soyleniyor. */
  k.appendChild(el('div','kucuk',
    'Ekstre görselini ay kaydedildikten sonra aşağıdaki listeden ekleyebilirsin.'));

  const on = el('button','btn2','Kalanı hesapla (kaydetme)');
  on.onclick = () => donemOnizle(kart, liste, false, duz);
  const kay = el('button','btn', duz ? 'Değişikliği göster' : 'Ayı kaydet'); kay.id = 'kdKaydet';
  kay.onclick = () => donemOnizle(kart, liste, true, duz);
  k.appendChild(on); k.appendChild(kay);
  if (duz){
    const vz = el('button','btn2','Vazgeç');
    vz.onclick = () => kartDetayAc(kart.id);
    k.appendChild(vz);
  }
  const ov = el('div'); ov.id = 'kdOnizleme'; k.appendChild(ov);

  setTimeout(onDoldur, 0);   // ilk acilista da doldur
  setTimeout(canliKalan, 0);
  return k;
}

function donemSatiriUret(kart){
  const donem = document.getElementById('kdDonem').value;
  if (!/^\d{4}-\d{2}$/.test(donem || '')) return { ok:false, hata:'Dönem YYYY-AA biçiminde olmalı.' };
  const oku = (id, etiket, eksiOlabilir) => {
    const r = paraCoz(document.getElementById(id).value);
    if (!r.ok) return { ok:false, hata: etiket + ': ' + r.hata };
    if (!eksiOlabilir && r.kurus < 0) return { ok:false, hata: etiket + ' eksi olamaz.' };
    return r;
  };
  const dev = oku('kdDevir','Devir', false);       if (!dev.ok) return dev;
  const yen = oku('kdYeni','Yeni harcama', false); if (!yen.ok) return yen;
  const odn = oku('kdOdenen','Alacak kayıtları', false);     if (!odn.ok) return odn;
  /* Duzeltme EKSI olabilir — paraCoz eksi isareti okumaz, ayrica bakiyoruz */
  const dzH = document.getElementById('kdDuzeltme').value.trim();
  const eksi = /^\s*-/.test(dzH);
  const dzR = paraCoz(dzH);
  if (!dzR.ok) return { ok:false, hata:'Düzeltme: ' + dzR.hata };
  const dzKurus = eksi ? -dzR.kurus : dzR.kurus;

  /* ⚠ AV · EKSI ISARETI paraCoz'DEN GECMEZ: [^\d.,] suzgeci '-' atiyor,
     "-5" SESSIZCE 5,00 oluyor (AS turunda olculdu). Isarete paraCoz'DEN
     ONCE bakiliyor — dzH'deki kalibin aynisi. */
  const secmeli = (id, etiket) => {
    const h = document.getElementById(id).value.trim();
    if (!h) return { ok:true, deger:null };
    if (/^\s*[-−]/.test(h)) return { ok:false, hata: etiket + ' eksi olamaz. Bilinmiyorsa BOŞ bırak.' };
    const r = paraCoz(h);
    if (!r.ok) return { ok:false, hata: etiket + ': ' + r.hata };
    return { ok:true, deger:(r.kurus/100).toFixed(2), kurus:r.kurus };
  };
  const asg = secmeli('kdAsgari','Asgari tutar');   if (!asg.ok) return asg;
  const odm = secmeli('kdOdedim','Bu ekstreye ödediğim'); if (!odm.ok) return odm;
  const fz  = secmeli('kdFaiz','Faiz tutarı');       if (!fz.ok)  return fz;
  const vr  = secmeli('kdVergi','Faiz vergisi/masrafı'); if (!vr.ok) return vr;

  /* CG · v113 tarih kurali: tutar VARSA tarih zorunlu; tutar yoksa null. */
  const odTar = document.getElementById('kdOdedimTarih');
  const odTarih = odTar ? odTar.value : '';
  if (odm.deger != null && !odTarih)
    return { ok:false, hata:'Ödeme tutarını girdin; gününü de seç (varsayılan bugündü, silinmiş).' };

  const kalan = dev.kurus + yen.kurus + dzKurus - odn.kurus;
  return { ok:true, donem, kalan, asgariKurus: asg.kurus, odemeKurus: odm.kurus,
    satir: { kart_id: kart.id, donem,
      devir:(dev.kurus/100).toFixed(2), yeni_harcama:(yen.kurus/100).toFixed(2),
      duzeltme:(dzKurus/100).toFixed(2), odenen:(odn.kurus/100).toFixed(2),
      asgari_tutar: asg.deger, donem_odemesi: odm.deger,
      donem_odemesi_tarih: odm.deger != null ? odTarih : null,
      faiz_tutari: fz.deger, vergi_masraf_tutari: vr.deger,
      giren_id: PROFIL ? PROFIL.id : null } };
}

/* ⚠ CN · EKSTRE ODEMESI · KISA YOL
   Iki alan sorar (tutar + gun) ve KAPANMAMISIN nereye inecegini
   ANINDA yazar. Sahibin sorunu "odeme kaydedilmiyor" degildi —
   kaydediliyordu; ekran yanlis sutunu gosterdigi icin oyle
   goruluyordu.
   ⚠ YENI KAYIT YOLU DEGIL: donem duzenleme yolunun yazdigi ayni iki
     alani (donem_odemesi, donem_odemesi_tarih) ayni mekanizmayla
     (kart_donem update) yaziyor. Donem duzenleme yolu aynen duruyor.
   ⚠ v113: tarih girilecekse tutar da girilmis olmali. Bu yuzden
     ONCE TUTAR isteniyor; tutar gecerli degilse Kaydet kapali ve
     sunucuya hicbir sey gitmiyor. */
/* ==================================================================
   DC · EKSTRE ODEMESI — BANKANIN CUMLESIYLE SORULUR
   ==================================================================
   OLCULDU (Ziraat ekrani + dekont, 04.09.2026):
     Banka  : "Son Ekstreden Kalan Borç 0,00"
     Sistem : 2026-08 · kalan 580.551,85 · donem_odemesi 80.551,85
              · kapanmamis 500.000,00
     Dekont : 04.09.2026 · 500.000,00
   Kullanici 500.000 yazdi ve 80.551,85 hayalet borc kaldi. Hatasi
   DEGIL: alan KUMULATIF toplam istiyordu (580.551,85), oysa onceki
   odemeyi kimse ezbere bilmiyor. Kullanicinin sozu: "borcu tam
   cikartamiyoruz".
   ⚠ ASIL COZUM HESAP DEGIL, KOPYALAMA: ikinci bir giris yolu var —
     "Bankada yazan: Son Ekstreden Kalan Borç". Kullanici zaten o
     ekrana bakiyor; ayni kelimeler, ayni sira. Ezber gerekmiyor.
     donem_odemesi = kalan − yazilan.
   ⚠ IKI ALAN AYNI SATIRIN IKI YUZU: biri yazilinca oteki CANLI
     guncellenir. Programla yazilan deger 'input' URETMEZ (olculdu),
     bu yuzden bicimleme elle cagriliyor.
   ⚠ TUTAR EKLENIR, EZILMEZ: bir ekstreye birden cok odeme yapilir. */
function odemeYapAc(kart, d){
  const kalan   = kr(d.kalan);
  const onceki  = kr(d.donem_odemesi || 0);
  const kapanmamis = kalan - onceki;
  const dlg = document.createElement('dialog'); dlg.className = 'pm';
  dlg.setAttribute('aria-modal','true');
  const bas = el('div','pm-bas sakin', 'Ekstre ödemesi'); bas.id = 'oyBas';
  dlg.setAttribute('aria-labelledby', bas.id); dlg.appendChild(bas);
  dlg.appendChild(el('div','pm-ad', kart.ad + (kart.banka ? ' · ' + kart.banka : '') + ' · ' + d.donem));
  dlg.appendChild(el('div','pm-tutar', 'Kapanmamış ' + tlk(kapanmamis)));
  dlg.appendChild(el('div','kucuk','KALAN ' + tl(d.kalan)
    + ' — ekstrenin tutarı, ödeme bunu değiştirmez.'
    + (onceki > 0 ? '\nBu ekstreye daha önce ' + tlk(onceki)
                    + ' ödenmiş; yazdığın tutar bunun ÜZERİNE eklenir.' : '')));

  const alan = (etiket, id, tip) => {
    const l = el('label', null, etiket); l.setAttribute('for', id); dlg.appendChild(l);
    const i = document.createElement('input'); i.id = id; i.type = tip === 'date' ? 'date' : 'text';
    if (tip !== 'date') i.setAttribute('inputmode','decimal');
    dlg.appendChild(i); return i;
  };
  const gTutar = alan('Şimdi ödediğin tutar', 'oyTutar');
  const gBanka = alan('ya da — bankada yazan: Son Ekstreden Kalan Borç', 'oyBanka');
  dlg.appendChild(el('div','kucuk',
    'İkisinden BİRİNİ yaz, öteki kendiliğinden dolar. Bankadaki rakamı '
  + 'kopyalamak daha kolaydır: hesaplama yapmadan, ekranda ne yazıyorsa o.'));
  const gGun = alan('Ödemenin günü', 'oyGun', 'date');
  gGun.value = bugun(); gGun.max = bugun();
  const oniz = el('div','bilgi'); dlg.appendChild(oniz);
  const hata = el('div','uyari-agir'); hata.hidden = true; dlg.appendChild(hata);

  const ey = el('div','pm-ey');
  const vaz = el('button','btn2','Vazgeç'), kay = el('button','btn','Kaydet');
  vaz.type = kay.type = 'button';
  ey.appendChild(vaz); ey.appendChild(kay); dlg.appendChild(ey);

  /* Iki alan birbirini guncellerken sonsuz donguye girmesin */
  let esitleniyor = false;
  const yazVe = (inp, kurus) => { esitleniyor = true;
    inp.value = (kurus/100).toFixed(2).replace('.', ',');
    paraBicimle(inp); esitleniyor = false; };

  /* Bu odeme (X) tek gercek girdi; banka alani X = kalan − onceki − B
     denkleminden okunur. denetle() hangisinin yazildigina gore otekini
     doldurur ve onizlemeyi kurar. */
  const denetle = (kaynak) => {
    hata.hidden = true; kay.disabled = true;
    oniz.textContent = '';
    const hT = gTutar.value.trim(), hB = gBanka.value.trim();
    let x = null;
    if (kaynak === 'banka' || (!hT && hB)){
      if (!hB){ oniz.textContent = 'Tutarı ya da bankadaki kalan borcu yaz.'; return; }
      if (/^\s*[-−]/.test(hB)){ hata.hidden = false;
        hata.textContent = 'Bankadaki kalan borç eksi olamaz.'; return; }
      const rb = paraCoz(hB);
      if (!rb.ok){ hata.hidden = false; hata.textContent = rb.hata; return; }
      x = kapanmamis - rb.kurus;
      if (x < 0){ hata.hidden = false;
        hata.textContent = 'Bankadaki kalan borç (' + tlk(rb.kurus)
          + ') kapanmamıştan (' + tlk(kapanmamis) + ') büyük — bu ekstreye '
          + 'ödeme değil, yeni harcama eklenmiş olabilir. Dönemi Düzenle ile gözden geçir.';
        return; }
      if (!esitleniyor) yazVe(gTutar, x);
    } else {
      if (!hT){ oniz.textContent = 'Tutarı ya da bankadaki kalan borcu yaz.'; return; }
      if (/^\s*[-−]/.test(hT)){ hata.hidden = false;
        hata.textContent = 'Ödeme eksi olamaz.'; return; }
      const r = paraCoz(hT);
      if (!r.ok){ hata.hidden = false; hata.textContent = r.hata; return; }
      x = r.kurus;
      if (!esitleniyor) yazVe(gBanka, Math.max(0, kapanmamis - x));
    }
    const toplam = onceki + x, yeni = kalan - toplam;
    /* ⚠ UC SATIR: kullanicinin kafasindaki hesabin AYNISI ekranda.
       "Toplamı sen bul" demek, hayalet borcu ureten seyin ta kendisiydi.
       ⚠ BOSLUKLA HIZALAMA YOK: .bilgi white-space:pre-line — satir sonu
         korunuyor ama ARDISIK BOSLUK cokuyor (olculdu). Hizalama DOM'la. */
    oniz.textContent = '';
    const st = (et, dg, kalin) => { const s = el('div','oy-satir');
      s.appendChild(el('span','oy-et', et));
      const v = el('span','oy-dg', dg); if (kalin) v.style.fontWeight = '800';
      s.appendChild(v); oniz.appendChild(s); };
    st('Önceki ödeme', tlk(onceki));
    st('Bu ödeme', tlk(x));
    st('Toplam', tlk(toplam), true);
    st('KAPANMAMIŞ', tlk(yeni), true);
    if (yeni < 0){ hata.hidden = false;
      hata.textContent = 'Toplam ödeme ekstre tutarından ' + tlk(-yeni)
        + ' fazla — yine de kaydedilir.'; }
    if (!gGun.value){ hata.hidden = false;
      hata.textContent = 'Ödemenin gününü seç.'; return; }
    kay.disabled = false;
    return toplam;
  };
  /* CO · bicimlenince onizleme tazelenir */
  paraBagla(gTutar, () => { if (!esitleniyor) denetle('tutar'); });
  paraBagla(gBanka, () => { if (!esitleniyor) denetle('banka'); });
  gTutar.oninput = () => { if (!esitleniyor) denetle('tutar'); };
  gBanka.oninput = () => { if (!esitleniyor) denetle('banka'); };
  gGun.onchange = gGun.oninput = () => denetle();
  /* ⚠ TAM ODEME KOLAYLIGI: alana dokununca kapanmamisin TAMAMI oneri
     olarak gelir, uzerine yazilabilir. Dolu alan EZILMEZ.
     ⚠ Olculdu: 'focus' ile deger yazmak 'input' URETMEZ — onizleme
       "Tutarı yaz" yazili kalir ve Kaydet kapali durur; denetle() elle. */
  gTutar.onfocus = () => { if (!gTutar.value.trim() && !gBanka.value.trim() && kapanmamis > 0){
    yazVe(gTutar, kapanmamis); denetle('tutar'); } };
  denetle();

  const kapat = () => { dlg.close(); dlg.remove(); };
  vaz.onclick = kapat;
  dlg.addEventListener('cancel', (e) => { e.preventDefault(); kapat(); });
  kay.onclick = async () => {
    const toplam = denetle();
    if (toplam == null || !gGun.value) return;        // kapi: sunucuya GITMEZ
    kay.disabled = true; kay.textContent = 'Kaydediliyor...';
    /* ⚠ EKLENEREK yazilir: donem_odemesi kumulatif alandir, ustune
       tek odeme yazmak onceki odemeyi silerdi. */
    const { error } = await sb.from('kart_donem')
      .update({ donem_odemesi: (toplam/100).toFixed(2), donem_odemesi_tarih: gGun.value })
      .eq('id', d.donem_id);
    if (error){ kay.disabled = false; kay.textContent = 'Kaydet';
      hata.hidden = false; hata.textContent = hataTr(error.message); return; }
    kapat();
    await kartDetayAc(kart.id);
    mesaj('kartMsg','ok', d.donem + ' ödemesi yazıldı: bu ödeme '
      + tlk(toplam - onceki) + ' · toplam ' + tlk(toplam)
      + ' · kapanmamış ' + tlk(kalan - toplam));
  };
  document.body.appendChild(dlg); dlg.showModal();
  return dlg;
}

async function donemOnizle(kart, liste, kaydet, duz){
  mesajTemizle('kartMsg');
  const r = donemSatiriUret(kart);
  const ov = document.getElementById('kdOnizleme');
  ov.textContent = '';
  if (!r.ok){ mesaj('kartMsg','hata', r.hata); return; }

  ov.appendChild(el('div','bilgi',
    r.donem + ' · KALAN = devir + yeni + düzeltme − alacak kayıtları = ' + tlk(r.kalan)));

  /* ⚠ ORAN-TUTAR KARISMASI NOBETCISI · teshis edilmis kusur (28.08:
     Ziraat Şahıs faiz_tutari = 3.25 = kartin faiz orani). Girilen faiz
     kartin AYLIK ORANIYLA BIREBIR ayniysa neredeyse kesin oran
     yazilmistir — bir faiz tutarinin kurusuna kadar orana esit cikmasi
     tesadufi olurdu.
     ⚠ ENGELLEMIYOR, SOYLUYOR: mesru bir tutar da o rakama esit olabilir
       (ornegin gercekten 3,25 TL faiz islemis). Kapi degil nobetci. */
  const oranTutarKarismis = kart.faiz_orani != null && r.satir.faiz_tutari != null
      && Number(r.satir.faiz_tutari) === Number(kart.faiz_orani);
  const OT_METIN = !oranTutarKarismis ? '' :
      'Girdiğin faiz tutarı (' + tl(r.satir.faiz_tutari) + ') bu kartın AYLIK FAİZ ORANIYLA '
    + '(%' + String(kart.faiz_orani).replace('.', ',') + ') birebir aynı. '
    + 'Oranı tutar sanmış olabilirsin — ekstredeki faiz TUTARINI yaz, '
    + 'o dönem faiz işlemediyse alanı BOŞ bırak.';
  if (oranTutarKarismis)
    ov.appendChild(el('div','uyari-agir', OT_METIN + ' Yine de kaydedilir.'));

  const onceki = liste.filter(x => x.donem < r.donem).sort((a,b) => b.donem.localeCompare(a.donem))[0];
  if (onceki && kr(r.satir.devir) !== kr(onceki.kalan))
    ov.appendChild(el('div','uyari-agir',
      'Devir tutmuyor: ' + onceki.donem + ' kalanı ' + tl(onceki.kalan)
      + ', girilen devir ' + tl(r.satir.devir) + '. Kaydedilir ama listede işaretli kalır.'));

  if (!kaydet) return;

  /* ⚠ AW · SESSIZ UPDATE YOK. Duzenleme mali bir kaydi degistiriyor;
     hangi alan neydi, ne oluyor ve KALAN nasil degisiyor GORULMEDEN
     yazilmiyor. Gerekce ISTENMIYOR — bu bir mali islem degil, ekstrenin
     yeniden yazimi; kim/ne zaman/eski deger/yeni deger zaten
     trg_audit_kart_donem ile audit_log'a dusuyor. */
  if (duz){
    const ALAN = [['donem','Dönem',0],['devir','Devir',1],['yeni_harcama','Yeni harcama',1],
                  ['duzeltme','Düzeltme',1],['odenen','Alacak kayıtları',1],['asgari_tutar','Asgari',1],
                  ['donem_odemesi','Bu ekstreye ödediğim',1],
                  ['donem_odemesi_tarih','Ödemenin günü',0],
                  ['faiz_tutari','Faiz',1],
                  ['vergi_masraf_tutari','Faiz vergisi',1]];
    const gos = (v, para) => v == null || v === '' ? '—' : (para ? tl(v) : v);
    const esit = (a, b, para) => (a == null ? null : (para ? kr(a) : a)) === (b == null ? null : (para ? kr(b) : b));
    const dgs = ALAN.filter(([f,,pr]) => !esit(duz[f], r.satir[f], pr));
    const dk = el('div','kart');
    dk.appendChild(el('div','kbaslik', dgs.length ? dgs.length + ' alan değişiyor' : 'Hiçbir alan değişmiyor'));
    if (!dgs.length){
      dk.appendChild(el('div','kucuk','Girilen değerler kayıtlıyla birebir aynı. Güncellemeye gerek yok.'));
      ov.appendChild(dk); return;
    }
    const t = document.createElement('table');
    const hr = document.createElement('tr');
    ['ALAN','ÖNCE','SONRA'].forEach((h,i) => hr.appendChild(el('th', i ? 'sag' : null, h)));
    t.appendChild(hr);
    for (const [f, ad, pr] of dgs){
      const tr = document.createElement('tr');
      tr.appendChild(td(ad)); tr.appendChild(td(gos(duz[f], pr),'sag')); tr.appendChild(td(gos(r.satir[f], pr),'sag'));
      t.appendChild(tr);
    }
    /* ⚠ CN · ODEME GIRILDIYSE BASLIK KAPANMAMIS OLUR.
       Sahip odemenin islemedigini saniyordu: onizleme basligi KALAN'i
       gosteriyor ve "Kalan değişmiyor" diyordu. Dogru — ama yaniltici:
         KALAN      = devir + yeni + duzeltme − alacak kayitlari
         KAPANMAMIS = kalan − donem_odemesi
       Odemenin dusurdugu sutun KAPANMAMIS; KALAN ekstrenin tutari ve
       odemeyle zaten degismez. Odeme alani doluyken basa KAPANMAMIS
       cikiyor, KALAN ikincil satirda ne oldugu yazili duruyor ve
       "Kalan değişmiyor" cumlesi GOSTERILMIYOR. */
    const satirEkle = (ad, once, sonra, kalin) => {
      const x = document.createElement('tr');
      x.appendChild(td(ad)); x.appendChild(td(once,'sag')); x.appendChild(td(sonra,'sag'));
      if (kalin) x.style.fontWeight = '900';
      t.appendChild(x); return x;
    };
    const odemeVar = r.odemeKurus != null;
    const kapOnce  = kr(duz.kalan) - kr(duz.donem_odemesi || 0);
    const kapSonra = r.kalan - (r.odemeKurus || 0);
    if (odemeVar){
      satirEkle('KAPANMAMIŞ', tl(kapOnce/100), tlk(kapSonra), true);
      satirEkle('KALAN', tl(duz.kalan), tlk(r.kalan), false);
    } else satirEkle('KALAN', tl(duz.kalan), tlk(r.kalan), true);
    const sar2 = el('div','tablo-sar'); sar2.appendChild(t); dk.appendChild(sar2);
    const fark = r.kalan - kr(duz.kalan);
    if (odemeVar){
      const kf = kapSonra - kapOnce;
      dk.appendChild(el('div', kapSonra === 0 ? 'bilgi' : (kf ? 'bilgi' : 'kucuk'),
        kapSonra === 0
          ? 'KAPANMAMIŞ 0,00 — bu ekstre tamamen kapanıyor.'
          : (kf ? 'KAPANMAMIŞ ' + (kf > 0 ? 'ARTIYOR' : 'AZALIYOR') + ': ' + tlk(Math.abs(kf))
                : 'Kapanmamış değişmiyor.')));
      dk.appendChild(el('div','kucuk',
        'KALAN ekstrenin tutarı — ödeme bunu değiştirmez. Ödemenin düşürdüğü sütun KAPANMAMIŞ. '
      + 'Sonraki ayın devri KALAN ile karşılaştırılır.'));
      if (kapSonra < 0)
        dk.appendChild(el('div','uyari-agir', 'Ödeme ekstre tutarından ' + tlk(-kapSonra)
          + ' fazla. Yanlış rakam girmiş olabilirsin — yine de kaydedilir.'));
    } else
      dk.appendChild(el('div', fark ? 'uyari-agir' : 'kucuk', fark
        ? 'KALAN ' + (fark > 0 ? 'ARTIYOR' : 'AZALIYOR') + ': ' + tlk(Math.abs(fark))
          + '. Sonraki ayın devri bu rakamla karşılaştırılacak.'
        : 'Kalan değişmiyor.'));
    const ok = el('button','btn','Onayla ve güncelle');
    ok.onclick = async () => {
      ok.disabled = true; ok.textContent = 'Güncelleniyor...';
      const y = Object.assign({}, r.satir); delete y.kart_id; delete y.giren_id;
      const { error } = await sb.from('kart_donem').update(y).eq('id', duz.donem_id);
      if (error){ ok.disabled = false; ok.textContent = 'Onayla ve güncelle';
        hataYaz('kartMsg','Ay güncellenemedi.', error); return; }
      await kartDetayAc(kart.id);
      mesaj('kartMsg','ok', r.donem + ' güncellendi.');
    };
    dk.appendChild(ok);
    ov.appendChild(dk);
    return;
  }

  /* ==================================================================
     ⚠ DD · KAYDETMEDEN ONCE IKI NOBETCI — ENGELLEMEZ, SORAR
     ==================================================================
     Kayit dogrudan insert ile gidiyordu, hicbir sey sormuyordu. Canli
     veride dort kartta ayni ekstre iki kez girilmis.
     ⚠ OLCULDU — KISIT VAR: taban.sql:6339
         CREATE UNIQUE INDEX ux_kart_donem ON kart_donem (kart_id, donem)
         WHERE (NOT is_deleted)
       Yani ayni donem ikinci kez GIRILEMIYOR; sistem bu yuzden 2026-09'a
       kaymis. Kisit YENIDEN YAZILMIYOR — buradaki nobetci onun
       yakalayamadigini yakaliyor: AYNI TUTAR, BASKA DONEM.
     ⚠ ENGELLEME, SOR: gercekten iki ay ust uste ayni tutar cikabilir.
       Karar kullanicinin; sistemin isi gormezden gelmemek.
     ⚠ YENI KURAL ICAT EDILMEDI: devir denetimi v_kart_donem'in
       devir_farki/devir_tutarsiz hesabinin AYNISI (devir − onceki
       kalan), yalnizca giris aninda yapiliyor. Kaydettikten sonra
       fark etmek gec. */
  const ayniTutar = liste.filter(x => x.donem !== r.donem && kr(x.kalan) === r.kalan);
  if (ayniTutar.length){
    if (!(await onaySor({
      baslik:'Aynı ekstre ikinci kez mi giriliyor?',
      metin:'Bu tutar (' + tlk(r.kalan) + ') '
        + ayniTutar.map(x => x.donem).join(', ') + ' döneminde zaten var. '
        + 'Aynı ekstreyi ikinci kez giriyor olabilirsin.\n\n'
        + 'Gerçekten iki ay üst üste aynı tutar çıkmışsa devam et.',
      onayMetni:'Yine de kaydet', tehlikeli:false }))) return;
  }
  if (onceki && kr(r.satir.devir) !== kr(onceki.kalan)){
    const fark = kr(r.satir.devir) - kr(onceki.kalan);
    if (!(await onaySor({
      baslik:'Devir önceki ayla tutmuyor',
      metin:'Devir ' + tlk(kr(r.satir.devir)) + ' ama önceki dönemin ('
        + onceki.donem + ') kalanı ' + tl(onceki.kalan) + ' — arada '
        + tlk(Math.abs(fark)) + ' fark var.\n\n'
        + 'Kısmi ödenen kartta bu fark faiz olabilir. Ekstreye bakıp karar ver.',
      onayMetni:'Yine de kaydet', tehlikeli:false }))) return;
  }

  const btn = document.getElementById('kdKaydet');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kart_donem').insert(r.satir);
  btn.disabled = false; btn.textContent = 'Ayı kaydet';
  if (error){ hataYaz('kartMsg','Ay kaydedilemedi.', error); return; }
  /* ⚠ ONCE tazele SONRA mesaj: ters sirada kartDetayAc #kartMsg'i yeniden
     kurup mesaji siliyor ve kayit sessizce gecmis gibi gorunuyordu. */
  await kartDetayAc(kart.id);
  /* ⚠ OLCULDU: yeni ay eklerken onizleme YOK — insert dogrudan kosuyor,
     sonra kartDetayAc #kdOnizleme'yi komple siliyor. Nobetci oraya
     yazilinca kullanici goremeden ucuyordu; 3.25 tam bu yoldan girdi.
     Bu yuzden uyari, yeniden kurulan #kartMsg'e tasiniyor. */
  if (oranTutarKarismis)
    mesaj('kartMsg','uyari', r.donem + ' kaydedildi — AMA KONTROL ET: ' + OT_METIN
      + ' Düzeltmek için ayın "Düzenle" düğmesini kullan.');
  else
    mesaj('kartMsg','ok', r.donem + ' kaydedildi. Ekstreyi eklemeyi unutma.');
}

/* AW · donem arsivleme — kart/kredi/maden arsivlemesiyle AYNI mekanik.
   ⚠ Duzenleme mi arsivleme mi diye SORULMUYOR; ikisi ayri dugme. Soran
     bir pencere, kullanicinin zaten bildigi seyi bir kez daha tiklatir. */
function donemSil(kart, d, acan){
  pasifeAlAc(acan, { tur:'Dönem', ad: kart.ad + ' · ' + d.donem,
    kim:'Bu ay tamamen kayıttan düşecek', tutar: tl(d.kalan),
    uygula: (neden) => pasifeAlUygula(
      () => sb.rpc('rpc_kart_donem_pasife_al',{p_donem:d.donem_id,p_neden:neden}),
      async () => { await kartDetayAc(kart.id); mesaj('kartMsg','ok',
        d.donem + ' silindi. Aynı ay yeniden girilebilir.'); },
      'kart_donem')});
}

/* ================== 7 · FINANS ==================
   Sahibin sorusu: "bu yil ne kazandik, ne kadar vergi odedik, net
   elimizde ne kaldi" — kalem kalem, dokununca detay.

   ⚠ HIC YENI HESAP YOK. Butun rakamlar 1. turda cikarilan haritadaki
     kaynaklardan geliyor; kar formulu (gercek_ay_kari) DEGISTIRILMEDI,
     yalniz OKUNUYOR. Yeni tablo/RPC/migration yok.

   ⚠ CIFT SAYMA · 1. turda OLCULDU, ekran bunlari COZUYOR:
     1. SGK iki yerde: personel_gider.sgk (TAHAKKUK) ve vergi_odeme
        tur='sgk' (ODENEN). Ayni paranin iki zamani. Karda DUSULEN
        tahakkuktur (personel_toplam icinde); odenen hali NAKIT
        tarafinda. Ekran hangisinin nereye girdigini satirda YAZAR.
     2. Arac gideri (gider.arac_id dolu) ZATEN gider_net icinde.
        Kalem gorunur ama toplama IKINCI KEZ GIRMEZ — "giderlerin
        icinde" etiketi tasir.
     3. Tedarikciye ODENEN nakit cikisidir, ALIS maliyettir. Kar
        tarafinda alis (SMM uzerinden), nakit tarafinda odeme
        kullanilir; ikisi TOPLANMAZ.
     4. banka_mutabakat tutarlari EKSI saklaniyor. Isaret CALISMA
        ANINDA olculuyor (isaretDuzelt); "dus" diye tekrar eksiyle
        carpmak kara EKLERDI.
     5. MTV yalniz arac yolunda — vergiler kaleminde MTV ARANMIYOR.

   ⚠ SIFIR YAZILMAZ: verisi olmayan kalem "girilmemiş" der. Sifir,
     olmayan bir gercegi IDDIA eder.
   ================================================================= */
let FIN_KAPSAM = 'ay', FIN_DONEM = null, FIN_ACIK = {};

/* banka_mutabakat eksi saklıyor; hangi isaretle geldigini OLCUP
   mutlak degere ceviriyoruz. Iki kez eksiye cevirme tuzagi burada
   kapali — cagiran taraf her zaman POZITIF bir "kesinti" aliyor. */
const isaretDuzelt = (x) => Math.abs(kr(x || 0));

async function finansGetir(donemler){
  const [oz, vo, bm, pg, am] = await Promise.all([
    sb.from('v_aylik_ozet').select('*').in('donem', donemler),
    sb.from('vergi_odeme').select('tur,donem,odeme_tarihi,tutar')
      .eq('is_deleted', false),
    sb.from('banka_mutabakat').select('donem,komisyon,maxipuan,okc_ucret,kesinti_toplam,durum')
      .eq('is_deleted', false).in('donem', donemler),
    sb.from('personel_gider').select('donem,personel_adi,maas,sgk,prim,yemek,avans')
      .eq('is_deleted', false).in('donem', donemler),
    sb.from('v_arac_maliyet').select('donem,plaka,kategori,tutar,kayit')
      .in('donem', donemler)
  ]);
  /* ⚠ HATA YUTULMUYOR. Bir kaynak okunamazsa o kalem "okunamadı" der;
     sessizce 0 gostermek en tehlikeli hata olurdu. */
  return {
    ozet: oz.error ? null : (oz.data || []),
    vergi: vo.error ? null : (vo.data || []).filter(x =>
      donemler.includes(String(x.odeme_tarihi || '').slice(0,7))),
    kesinti: bm.error ? null : (bm.data || []),
    personel: pg.error ? null : (pg.data || []),
    arac: am.error ? null : (am.data || []),
    hata: [oz.error && 'aylık özet', vo.error && 'vergi ödemeleri',
           bm.error && 'banka mutabakatı', pg.error && 'personel',
           am.error && 'araç'].filter(Boolean)
  };
}

async function vFinans(){
  const c = document.getElementById('icerik');
  const buAy = bugun().slice(0,7), buYil = bugun().slice(0,4);
  if (!FIN_DONEM) FIN_DONEM = buAy;
  const donemler = FIN_KAPSAM === 'ay' ? [FIN_DONEM]
    : Array.from({length:12}, (_,i) => FIN_DONEM.slice(0,4) + '-' + String(i+1).padStart(2,'0'));
  const d = await finansGetir(donemler);
  c.textContent = '';

  /* ---- DONEM SECICI ---- */
  const sec = el('div','kart');
  const sr = el('div','satir');
  const sol = el('div');
  for (const [k, ad] of [['ay','Ay'],['yil','Yıl']]){
    const b = el('button','btn2' + (FIN_KAPSAM === k ? ' yy-aktif' : ''), ad);
    b.type = 'button';
    b.onclick = () => { FIN_KAPSAM = k;
      FIN_DONEM = k === 'ay' ? (FIN_DONEM.length === 7 ? FIN_DONEM : buAy) : FIN_DONEM.slice(0,4) + '-01';
      FIN_ACIK = {}; vFinans(); };
    sol.appendChild(b);
  }
  sr.appendChild(sol);
  const inp = document.createElement('input');
  if (FIN_KAPSAM === 'ay'){ inp.type = 'month'; inp.value = FIN_DONEM; }
  else { inp.type = 'number'; inp.min = '2020'; inp.max = '2100';
         inp.value = FIN_DONEM.slice(0,4); inp.style.width = '92px'; }
  inp.onchange = () => {
    FIN_DONEM = FIN_KAPSAM === 'ay' ? (inp.value || buAy) : (inp.value || buYil) + '-01';
    FIN_ACIK = {}; vFinans();
  };
  sr.appendChild(inp);
  sec.appendChild(sr);
  c.appendChild(sec);

  if (d.hata.length)
    c.appendChild(el('div','uyari-agir','Şu kaynaklar okunamadı: ' + d.hata.join(', ')
      + '. O kalemler eksik görünüyor — sıfır sanma, ekranı yenile.'));
  if (d.ozet === null){
    c.appendChild(el('div','uyari-agir',
      'Aylık özet okunamadı. Bu görünüm yalnız işletme sahibine açıktır; '
    + 'oturumun süresi dolmuş olabilir — çıkıp yeniden gir.'));
    return;
  }

  /* ---- DOLULUK · ekran kac ayin dolu oldugunu SOYLER ---- */
  const dolu = d.ozet.filter(x => Number(x.gun_sayisi) > 0);
  const toplaOz = (alan) => dolu.reduce((s,x) => s + kr(x[alan]), 0);
  if (!dolu.length){
    c.appendChild(el('div','bos', FIN_KAPSAM === 'ay'
      ? ayAdi(FIN_DONEM) + ' için gün sonu girilmemiş — bu ayın hiçbir rakamı hesaplanamıyor.'
      : FIN_DONEM.slice(0,4) + ' yılında hiç gün sonu girilmemiş.'));
    return;
  }
  const gunTop = dolu.reduce((s,x) => s + Number(x.gun_sayisi || 0), 0);
  if (FIN_KAPSAM === 'yil')
    c.appendChild(el('div','uyari-orta', FIN_DONEM.slice(0,4) + ' yılında '
      + dolu.length + ' ay dolu (' + dolu.map(x => ayAdi(x.donem)).join(', ')
      + ') · toplam ' + gunTop + ' gün. Öteki aylar boş — bu rakamlar '
      + 'yılın tamamı DEĞİL, yalnız dolu ayların toplamı.'));
  else {
    const ayGun = new Date(Number(FIN_DONEM.slice(0,4)), Number(FIN_DONEM.slice(5,7)), 0).getDate();
    const bitmis = FIN_DONEM < buAy;
    const hedef = bitmis ? ayGun : Number(bugun().slice(8,10));
    if (gunTop < hedef)
      c.appendChild(el('div','uyari-orta', ayAdi(FIN_DONEM) + ' için ' + gunTop + '/'
        + hedef + ' gün girilmiş — ' + (hedef - gunTop) + ' gün eksik, tutarlar eksik.'));
  }

  /* ---- CIRO · en ustte, en buyuk ---- */
  const ciroKurus = toplaOz('gercek_ciro');
  const ck = el('div','kart');
  ck.appendChild(el('div','kbaslik', (FIN_KAPSAM === 'ay' ? ayAdi(FIN_DONEM)
    : FIN_DONEM.slice(0,4) + ' (' + dolu.length + ' ay)') + ' · CİRO'));
  ck.appendChild(el('div','cek-buyuk', tlk(ciroKurus)));
  ck.appendChild(el('div','cek-alt', gunTop + ' gün · Z cirosu ' + tk(toplaOz('ciro'))
    + ' + Z dışı nakit ' + tk(toplaOz('z_disi_nakit'))));
  c.appendChild(ck);

  const msg = el('div','msg'); msg.id = 'finansMsg'; c.appendChild(msg);

  /* ---- KALEM SATIRI · katli baslar, dokununca acilir ----
     ⚠ Desen ICAT EDILMEDI: ozetCiz'in serit-ozet kalibi. */
  const kalemKart = el('div','kart');
  kalemKart.appendChild(el('div','kbaslik','Kalemler'));
  const kalem = (anahtar, ad, tutarMetin, etiket, detayCiz) => {
    const b = el('button','serit-ozet'); b.type = 'button';
    b.setAttribute('aria-expanded', FIN_ACIK[anahtar] ? 'true' : 'false');
    const p = el('span','so-p');
    p.appendChild(el('span','so-et', ad));
    p.appendChild(el('span','so-dg', tutarMetin));
    b.appendChild(p);
    if (etiket) b.appendChild(el('span','kucuk', etiket));
    const okI = el('span','so-ok', FIN_ACIK[anahtar] ? '▴' : '▾'); b.appendChild(okI);
    b.setAttribute('aria-label', ad + ' ' + tutarMetin + (etiket ? ', ' + etiket : '') + '. Detayı aç.');
    kalemKart.appendChild(b);
    const kutu = el('div'); kutu.hidden = !FIN_ACIK[anahtar]; kalemKart.appendChild(kutu);
    const kur = () => { if (!kutu.firstChild) detayCiz(kutu); };
    if (FIN_ACIK[anahtar]) kur();
    b.onclick = () => {
      if (kutu.hidden){ kur(); kutu.hidden = false; okI.textContent = '▴';
        b.setAttribute('aria-expanded','true'); FIN_ACIK[anahtar] = true; }
      else { kutu.hidden = true; okI.textContent = '▾';
        b.setAttribute('aria-expanded','false'); FIN_ACIK[anahtar] = false; }
    };
  };
  const dSatir = (kutu, et, dg, not) => {
    const s = el('div','satir');
    s.appendChild(el('span','et', et));
    const g = el('span','dg', dg);
    if (not){ g.appendChild(document.createTextNode(' ')); g.appendChild(el('span','kucuk', not)); }
    s.appendChild(g); kutu.appendChild(s);
  };
  /* ⚠ "girilmemiş" ile "0,00" AYRI. Kaynak hic satir vermediyse
     rakam YAZILMAZ — sifir olmayan bir gercegi iddia eder. */
  const yaz = (varMi, kurus) => varMi ? tlk(kurus) : 'girilmemiş';

  /* 1 · GUNLUK NAKIT */
  kalem('nakit','Günlük nakit', tlk(toplaOz('toplam_nakit')), 'ciro içinde', (k) => {
    dSatir(k,'Sayılan kasa nakdi', tlk(toplaOz('toplam_nakit')));
    dSatir(k,'Z dışı nakit', tlk(toplaOz('z_disi_nakit')), 'kâra eklenir');
    const say = dolu.reduce((s,x) => s + Number(x.kasa_sayilmayan_gun || 0), 0);
    if (say) k.appendChild(el('div','uyari-orta', say + ' günde kasa sayılmamış — nakit eksik olabilir.'));
    k.appendChild(el('div','kucuk','Ciro içinde zaten var; ayrıca düşülmez.'));
  });

  /* 2 · KREDI KARTI */
  kalem('kart','Kredi kartı', tlk(toplaOz('kart')), 'ciro içinde', (k) => {
    dSatir(k,'Karttan geçen', tlk(toplaOz('kart')));
    dSatir(k,'Nakit', tlk(toplaOz('nakit')));
    k.appendChild(el('div','kucuk','POS kesintisi ayrı kalemde — bu rakam kesinti ÖNCESİdir.'));
  });

  /* 3 · KESINTILER · isaret olculerek duzeltilir */
  const kesVar = d.kesinti !== null && d.kesinti.length > 0;
  const kesToplam = kesVar ? d.kesinti.reduce((s,x) => s + isaretDuzelt(x.kesinti_toplam), 0) : 0;
  kalem('kesinti','Kesintiler', yaz(kesVar, kesToplam), 'kârda YOK', (k) => {
    if (!kesVar){ k.appendChild(el('div','bos','Bu dönem için banka mutabakatı girilmemiş.')); return; }
    for (const x of d.kesinti){
      dSatir(k, ayAdi(x.donem), tlk(isaretDuzelt(x.kesinti_toplam)),
        (x.durum === 'farkli' ? 'mutabakat TUTMUYOR' : ''));
      dSatir(k, '  komisyon', tlk(isaretDuzelt(x.komisyon)));
      if (x.okc_ucret) dSatir(k, '  ÖKC ücreti', tlk(isaretDuzelt(x.okc_ucret)));
      if (x.maxipuan)  dSatir(k, '  puan/iade', tlk(isaretDuzelt(x.maxipuan)));
    }
    k.appendChild(el('div','uyari-orta',
      'Bu tutar kâr formülünde YOK — banka kesintisi hiçbir yerde düşülmüyor. '
    + 'Nakit hesabında bankaya geçenden düşüldü.'));
  });

  /* 4 · GIDERLER */
  kalem('gider','Giderler', tlk(toplaOz('gider_net')), 'kârdan düşülü', (k) => {
    dSatir(k,'Gider toplamı (KDV dahil)', tlk(toplaOz('gider_toplam')));
    dSatir(k,'İndirilebilir gider KDV', tlk(toplaOz('gider_kdv_ind')));
    dSatir(k,'Kâra giren (net)', tlk(toplaOz('gider_net')));
    k.appendChild(el('div','kucuk','Araç masrafları BU RAKAMIN İÇİNDE — araç kalemi ayrıca düşülmez.'));
  });

  /* 5 · TEDARIKCI ODEMELERI */
  kalem('tedarikci','Tedarikçi ödemeleri', tlk(toplaOz('odenen_tedarikci')),
    'nakitte · kârda değil', (k) => {
    dSatir(k,'Fiilen ödenen', tlk(toplaOz('odenen_tedarikci')), 'nakit çıkışı');
    dSatir(k,'Dönemin alışı', tlk(toplaOz('alis_toplam')), 'maliyet');
    const fark = toplaOz('odenen_tedarikci') - toplaOz('alis_toplam');
    if (fark > 0)
      k.appendChild(el('div','kucuk','Ödenen alıştan ' + tk(fark)
        + ' fazla — aradaki fark önceki dönemlerden devreden borcun kapatılması.'));
    k.appendChild(el('div','kucuk',
      'İkisi AYNI PARA DEĞİL ve TOPLANMAZ: alış kâra maliyet olarak (SMM), '
    + 'ödeme nakit çıkışı olarak girer.'));
  });

  /* 6 · SGK · iki zaman, tek para */
  const sgkTahakkuk = d.personel === null ? null
    : d.personel.reduce((s,x) => s + kr(x.sgk), 0);
  const sgkOdenen = d.vergi === null ? null
    : d.vergi.filter(x => x.tur === 'sgk').reduce((s,x) => s + kr(x.tutar), 0);
  kalem('sgk','SGK', sgkTahakkuk === null ? 'okunamadı' : tlk(sgkTahakkuk),
    'personel içinde düşülü', (k) => {
    dSatir(k,'Tahakkuk (bu dönemin yükü)', sgkTahakkuk === null ? 'okunamadı' : tlk(sgkTahakkuk),
      'kârdan düşülen BU');
    dSatir(k,'Ödenen (SGK dekontu)', sgkOdenen === null ? 'okunamadı'

let MADEN_DETAY = null;

/* ==================================================================
   ⚠ CK · GRAM FIYATI SILME. Kullanici yanlis bir gram fiyati girdi
   (gumus) ve ekrandan silemedi — duzeltmek icin veritabanina inildi.
   Fiyat gecmisi satirlarina silme yolu aciliyor.

   ⚠⚠ FIZIKSEL DELETE YAPILAMIYOR — OLCULDU, brifin varsaydigi yol
      KAPALI: taban dosyasi `GRANT SELECT,INSERT,UPDATE ON maden_fiyat
      TO authenticated` diyor, DELETE YOK; ustelik v96a (2026-08-16)
      authenticated'in fiziksel DELETE ayricaligini 41 tablodan
      BILEREK kaldirmis ve maden_fiyat o listede. `delete()` cagrisi
      canlida 42501 ile duserdi. Hard delete GRANT DELETE migration'i
      ister, bu tur migration KAPSAM DISI.
      Bu yuzden is_deleted ile silinir. GORUNUR SONUC AYNI:
        · sorgular zaten `.eq('is_deleted',false)` suzuyor — satir her
          yerden kalkar, rayic yeni son fiyattan hesaplanir
        · ux_maden_fiyat KISMI tekil (WHERE NOT is_deleted) oldugu icin
          ayni tur+tarihe DOGRU fiyat yeniden girilebilir — kullanicinin
          asil ihtiyaci buydu
      ⚠ PARA KAYITLARINDAKI yumusak silme kurali zaten AYNEN duruyor;
        burada bir istisna ACILMADI, aksine mevcut desen kullanildi. */
function madenFiyatSil(f, fiyatlar, tazele){
  const adTur = f.tur === 'altin' ? 'Altın' : 'Gümüş';
  const ayniTur = fiyatlar.filter(x => x.tur === f.tur);
  const sonuncu = ayniTur.length <= 1;
  const d = document.createElement('dialog'); d.className = 'pm';
  d.setAttribute('aria-modal','true');
  const bas = el('div','pm-bas'); bas.id = 'mfSilBas';
  bas.appendChild(el('span','pm-ikon','⚠'));
  bas.appendChild(document.createTextNode(' Gram fiyatı silinecek'));
  d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
  /* ⚠ SILINEN SATIR YAZIYOR — geri yazmak gerekirse kullanici gorsun. */
  d.appendChild(el('div','pm-ad', adTur + ' · ' + trGun(f.tarih)));
  d.appendChild(el('div','pm-tutar', tl(f.gram_fiyat) + '/gr'));
  if (f.kaynak_notu) d.appendChild(el('div','pm-kim', f.kaynak_notu));
  /* ⚠ SON FIYATI SILMENIN SONUCU SOYLENIR — engellenmez. */
  if (sonuncu)
    d.appendChild(el('div','uyari-agir', 'Bu türün başka fiyatı yok — silersen '
      + adTur.toLowerCase() + ' için bugünkü değer HESAPLANAMAZ olur.'));
  const ey = el('div','pm-ey');
  const vaz = el('button','btn2','Vazgeç'), ona = el('button','btn-kirmizi','Sil');
  vaz.type = ona.type = 'button';
  ey.appendChild(vaz); ey.appendChild(ona); d.appendChild(ey);
  const hata = el('div','pm-hata'); hata.hidden = true; d.appendChild(hata);
  document.body.appendChild(d); d.showModal();
  const kapat = () => { d.close(); d.remove(); };
  vaz.onclick = kapat;
  ona.onclick = async () => {
    ona.disabled = true; ona.textContent = 'Siliniyor...';
    const { error } = await sb.from('maden_fiyat')
      .update({ is_deleted:true, silme_nedeni:'ekrandan silindi' }).eq('id', f.id);
    if (error){ ona.disabled = false; ona.textContent = 'Sil';
                hata.hidden = false; hata.textContent = hataTr(error.message); return; }
    kapat();
    await tazele();                    // detaydan silindiyse DETAYDA kalir
    mesaj('madenMsg','ok', adTur + ' · ' + trGun(f.tarih) + ' fiyatı silindi.');
  };
}
