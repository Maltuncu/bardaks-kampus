async function krediKaydet(){
  const btn = document.getElementById('kKaydet');
  mesajTemizle('krediMsg');
  const banka = document.getElementById('kBanka').value.trim();
  const ad    = document.getElementById('kAd').value.trim();
  const tur   = document.getElementById('kTur').value;
  const bas   = document.getElementById('kBas').value;
  const anap  = paraCoz(document.getElementById('kAnapara').value);
  const faizH = document.getElementById('kFaiz').value.trim();
  const adet  = parseInt(document.getElementById('kAdet').value.trim(), 10);

  if (!banka) return mesaj('krediMsg','hata','Banka adı zorunlu.');
  if (!ad)    return mesaj('krediMsg','hata','Kredi adı zorunlu.');
  if (!tur)   return mesaj('krediMsg','hata','Tür seçmelisin: ticari, şahsi ya da limited.');
  if (!bas)   return mesaj('krediMsg','hata','Başlangıç tarihi zorunlu.');
  if (!anap.ok) return mesaj('krediMsg','hata','Anapara: ' + anap.hata);
  if (anap.kurus <= 0) return mesaj('krediMsg','hata','Anapara sıfırdan büyük olmalı.');
  if (!Number.isFinite(adet) || adet <= 0) return mesaj('krediMsg','hata','Taksit sayısı sıfırdan büyük bir tam sayı olmalı.');
  let faiz = null;
  if (faizH){
    const f = parseFloat(faizH.replace(',','.'));
    if (!isFinite(f) || f < 0) return mesaj('krediMsg','hata','Faiz oranı geçersiz. Bilinmiyorsa boş bırak.');
    faiz = f;
  }
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kredi').insert({
    banka, ad, tur, anapara:(anap.kurus/100).toFixed(2), faiz_orani:faiz,
    taksit_sayisi:adet, baslangic_tarihi:bas,
    aciklama: document.getElementById('kAciklama').value.trim() || null,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Krediyi kaydet';
  if (error){ hataYaz('krediMsg','Kredi kaydedilemedi.', error); return; }
  mesaj('krediMsg','ok','Kredi kaydedildi.');
  await vKrediler();
}

/* ===== P0-A1 · "⋯ diger islemler" menusu =====
   Yikici eylem birincil eylemin YANINDA durmayacak.

   ⚠ DINLEYICI YASAM DONGUSU — olculmus kusurun duzeltmesi.
   Onceki hal her digerMenu() cagrisinda document'a bir click dinleyicisi
   EKLIYOR ve HICBIRINI kaldirmiyordu. Olculdu: 101 render sonrasi 202
   click dinleyicisi; her kapali menunun closure'i kopmus DOM dugumlerini
   canli tutuyordu (bellek sizintisi).
   AbortController KULLANILMADI: bu dosyada abort()'u cagiracak bir yikim
   yasam dongusu YOK — ekranlar `c.textContent=''` ile siliniyor, yani
   abort hicbir zaman calismazdi. Cozum: modul duzeyinde BIR KEZ kurulan
   delege dinleyici + tek ACIK_MENU referansi. */
let ACIK_MENU = null, MENU_SON_KAPANAN = null, DM_SAYAC = 0;
function menuKapat(odakla){
  if (!ACIK_MENU) return;
  const { mn, bt } = ACIK_MENU;
  mn.classList.remove('acik'); bt.setAttribute('aria-expanded','false');
  ACIK_MENU = null;
  if (odakla && bt.isConnected) bt.focus();
}
/* YAKALAMA (capture) evresinde: dugmenin kendi isleyicisinden ONCE calisir,
   boylece "acik olan onceki menu kapansin" kurali YAPISAL olur — her
   menuye ayrica kod yazmak gerekmez. */
document.addEventListener('click', () => {
  MENU_SON_KAPANAN = ACIK_MENU ? ACIK_MENU.mn : null;
  menuKapat(false);
}, true);
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') menuKapat(true); });

function digerMenu(ogeler){
  const sar = el('div','dm');
  const bt = el('button','dm-bt','⋯'); bt.type = 'button';
  bt.setAttribute('aria-label','Diğer işlemler'); bt.setAttribute('aria-expanded','false');
  bt.setAttribute('aria-haspopup','true');
  const mn = el('div','dm-mn');
  /* ⚠ role="menu"/"menuitem" BILEREK YOK. WAI-ARIA sozlesmesi geregi
     role="menu" ok tuslariyla gezinmeyi (roving tabindex ya da
     aria-activedescendant) ZORUNLU kilar. Ok tuslari olmadan role="menu"
     koymak hic koymamaktan DAHA KOTU: ekran okuyucu kullanicisina
     calismayan bir menu vaat eder. Tam desen kapsam disi. */
  mn.id = 'dm' + (++DM_SAYAC);
  bt.setAttribute('aria-controls', mn.id);
  /* ⚠ AQ · UCUNCU alan: PASIF NEDENI. Eylemi GIZLEMEK kullaniciyi
     "neden yok?" diye arattirir; gorunur ama pasif ve NEDENI yazili. */
  for (const [metin, islev, pasifNeden] of ogeler){
    const o = el('button','dm-o', metin); o.type = 'button';
    if (pasifNeden){
      o.disabled = true;
      mn.appendChild(o); mn.appendChild(el('div','dm-neden', pasifNeden));
      continue;
    }
    /* stopPropagation YOK: yakalama evresi menuyu zaten kapatti. */
    o.onclick = () => islev(bt);
    mn.appendChild(o);
  }
  /* ⚠ stopPropagation KALDIRILDI. Onceki hal tiklamayi document'a hic
     ulastirmiyordu, bu yuzden ACIK olan diger menu KAPANMIYORDU —
     olculdu: iki menu ayni anda ACIK kalabiliyordu. */
  bt.onclick = () => {
    if (MENU_SON_KAPANAN === mn) return;      // ayni dugme: kapat-ac degil, kapali kal
    mn.classList.add('acik'); bt.setAttribute('aria-expanded','true');
    ACIK_MENU = { mn, bt };
    (mn.querySelector('button:not([disabled])') || bt).focus();   // pasif ogeye odak GITMEZ
  };
  sar.appendChild(bt); sar.appendChild(mn);
  return sar;
}

/* ===== P0-A1 · GUVENLI PASIFE ALMA (prompt() YOK) =====
   ⚠ SOZCUK 28.08.2026'da "ARSIVLE"DEN "SIL"E DONDU. Onceki gerekce
   "silinecek demek yalan olurdu" idi; olculdu ki asil yanilticilik
   OTEKI TARAFTAYDI: sistemde arsiv diye bir yer YOK — hicbir ekranda
   arsivlenmisler listesi acilmiyor, geri getirme yolu yok. "Arsivle"
   olmayan bir ozelligi vaat ediyordu. MEKANIK DEGISMEDI: islem hala
   soft-delete (is_deleted=true), satir fiziksel silinmiyor, audit_log'da
   old_data/new_data ile duruyor; kullaniciya bunu asagidaki PM_ETKI
   metni soyluyor ("denetim amaciyla sistemde korunacaktir").
   Gerekce `silme_nedeni` SUTUNU oldugu icin new_data ile audit'e dusuyor.
   ⚠ Bu kapi ARAYUZ kapisidir; sunucuda gerekce hala ZORUNLU DEGIL (P0-A2). */
const PM_ETKI = 'Bu kayıt aktif listelerden kaldırılacak ve ilgili aktif toplamların '
  + 'dışında tutulacaktır. Kayıt denetim amacıyla sistemde korunacaktır.';
const PM_TOKEN = 'SİL';
/* Turkce noktali/noktasiz I: kullanici hangisini yazarsa yazsin kabul. */
const pmNorm = s => (s||'').trim().toLocaleUpperCase('tr').replace(/İ/g,'I');
/* ⚠ NOKTASIZ YAZIM DA KABUL. pmNorm I/İ'yi esitliyor: 'sil' Turkce
   buyuk harfte 'SİL' olur, sonra İ->I ile 'SIL'e duser; 'sıl' zaten
   'SIL'. Yani her iki yazim da AYNI jetona iner ve Turkce klavyesi
   olmayan cihazda kullanici kapiya takilmaz. Liste yine de acik
   yaziliyor — davranis kod okunurken gorunsun.
   pmNorm'a DOKUNULMUYOR (kredi/maden/sahis/kart/cek hepsinde ortak).
   Kasitli yazma kapisi zayiflamiyor: iki yazim da bilincli yazmayi
   gerektiriyor. */
const PM_KABUL = ['SİL','SIL'].map(pmNorm);

function pasifeAlAc(acan, { tur, ad, kim, tutar, uygula }){
  let n = 0; const kimlik = (e) => (e.id = 'pm' + (++n));
  const d = document.createElement('dialog'); d.className = 'pm';
  d.setAttribute('aria-modal','true');

  d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
  d.appendChild(el('div','pm-ad', ad));
  if (kim)   d.appendChild(el('div','pm-kim', kim));
  if (tutar) d.appendChild(el('div','pm-tutar', tutar));
  const etki = el('div','pm-etki', PM_ETKI); kimlik(etki);
  d.setAttribute('aria-describedby', etki.id); d.appendChild(etki);

  const alan = (etiket, tag) => {
    const g = document.createElement(tag); kimlik(g);
    const l = el('label', null, etiket); l.setAttribute('for', g.id);
    const h = el('div','pm-hata'); kimlik(h); h.hidden = true;
    g.setAttribute('aria-describedby', h.id);
    d.appendChild(l); d.appendChild(g); d.appendChild(h);
    return [g, h];
  };
  const [ta, taH] = alan('Gerekçe (zorunlu)', 'textarea'); ta.rows = 2;
  const [dg, dgH] = alan('Onaylamak için "' + PM_TOKEN + '" yazın', 'input');

  const ey = el('div','pm-ey');
  const vaz = el('button','btn2','Vazgeç'), ona = el('button','btn-kirmizi','Sil');
  vaz.type = ona.type = 'button'; ona.disabled = true;
  ey.appendChild(vaz); ey.appendChild(ona);          // Vazgec SOLDA
  const hataK = el('div','uyari-agir'); hataK.hidden = true; kimlik(hataK);
  ona.setAttribute('aria-describedby', hataK.id);
  d.appendChild(ey); d.appendChild(hataK);
  document.body.appendChild(d); d.showModal();       // gercek <dialog>

  const denetle = () => {
    const g = ta.value.trim(), t = pmNorm(dg.value);
    taH.hidden = !(g.length > 0 && g.length < 10);
    taH.textContent = 'Gerekçe çok kısa — ne olduğunu yaz (en az 10 karakter).';
    dgH.hidden = !(t.length > 0 && !PM_KABUL.includes(t));
    dgH.textContent = 'Doğrulama metni eşleşmiyor.';
    ona.disabled = !(g.length >= 10 && PM_KABUL.includes(t));
  };
  ta.oninput = dg.oninput = denetle;
  /* Enter TEK BASINA islem yapmaz: dogrulama alaninda Enter yutulur. */
  dg.onkeydown = (e) => { if (e.key === 'Enter') e.preventDefault(); };
  /* ⚠ ODAK: basari yolunda liste tazelendigi icin acan ⋯ dugmesi YOK
     EDILIYOR; odak <body>'ye dusuyordu ve ekran okuyucu yerini
     kaybediyordu. Dugme yoksa odak icerik kapsayicisina tasiniyor. */
  let isleniyor = false;      // kapat() bunu okur, kapat'tan ONCE tanimli olmali
  const kapat = (uyari) => {
    /* ⚠ ISLEM SURERKEN KAPANMAZ. Olculdu: mutation yoldayken Escape
       modali kapatiyordu; kullanici IPTAL ETTIGINI saniyor, PATCH yine
       de tamamlaniyor ve sonuc KOPMUS dugumlere yaziliyordu — sessiz,
       istenmeyen finansal durum degisikligi. `isleniyor` finally'de
       false'a cekilir ve finally kendisinden SONRAKI kapat() cagrisindan
       ONCE calisir; bu yuzden basari yolu dogal olarak kapanir, yaris
       durumu olusmaz. `zorla` parametresi YOK — olsaydi ayni deligi
       ikinci bir yoldan geri acardi. */
    if (isleniyor) return;
    d.close(); d.remove();
    if (acan && acan.isConnected) acan.focus();
    else {
      /* Gecici tabindex: #icerik odaklanabilir degil, odagi devretmek
         icin bir kereligine veriliyor. Devirden sonra GERI ALINIYOR —
         kalici birakmak sekme sirasina sahte bir durak eklerdi.
         Onceden gercek bir deger varsa EZILMEZ. */
      /* ⚠ GECICI tabindex HIC KULLANILMIYOR — sorun yonetilmedi, ORTADAN
         KALDIRILDI. Olculdu: odaktan hemen sonra kaldirmak odagi <body>'ye
         dusuruyor; `blur`/`focusout` ile kaldirmak ise bu ortamda HIC
         atesle(n)miyor (ikisi de olculdu, tabindex="-1" KALICI kaliyordu).
         Onun yerine ZATEN odaklanabilir ve anlamli bir oge seciliyor:
         bulundugumuz bolumun serit dugmesi. Boylece DOM'a hicbir gecici
         oznitelik yazilmiyor ve ekran okuyucu yerini kaybetmiyor. */
      const hedef = document.querySelector('#bolumSerit button.aktif')
                 || document.querySelector('#bolumSerit button');
      if (hedef) hedef.focus();
    }
    /* ⚠ YALNIZ GERCEK STRING. Onceki hal `vaz.onclick = kapat` yuzunden
       PointerEvent aliyor ve "[object PointerEvent]" diye KIRMIZI AGIR
       HATA bandi basiyordu (olculdu, uc kez tekrarlandiginda uc bant). */
    const gercekUyari = (typeof uyari === 'string' && uyari.trim()) ? uyari.trim() : null;
    if (gercekUyari){
      const c = document.getElementById('icerik');
      if (c){
        /* TEKIL: P0-A1'in KENDI bandi. Baska modullerin uyarilari ve
           finansal hata mesajlari SILINMEZ. */
        c.querySelectorAll('.pm-sonuc').forEach(n => n.remove());
        const b = el('div','uyari-agir pm-sonuc');
        b.setAttribute('role','alert');
        b.textContent = gercekUyari;          // HTML degil, duz metin
        c.prepend(b);
      }
    }
  };
  vaz.onclick = () => kapat();               // olay nesnesi GECMEZ
  /* ⚠ ESCAPE ELDE ELE ALINIYOR. Olculdu: bu Chromium'da <dialog>'un
     yerel `cancel` olayi Escape'te ATESLENMEDI (keydown geldi, cancel
     gelmedi) — yerel davranisa guvenmek kapatilamayan modal demekti.
     `cancel` yine de dinleniyor; iki yol da mutation URETMEZ.
     Arka alan tiklamasi <dialog>'da varsayilan olarak islem yapmaz. */
  d.addEventListener('cancel', (e) => { e.preventDefault(); kapat(); });
  d.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ e.preventDefault(); kapat(); return; }
    if (e.key !== 'Tab') return;                     // odak tuzagi
    const od = [...d.querySelectorAll('textarea,input,button')].filter(x => !x.disabled);
    if (!od.length) return;                          // ⚠ islem surerken od BOS: od[NaN].focus() -> TypeError
    const i = od.indexOf(document.activeElement); e.preventDefault();
    od[(i + (e.shiftKey ? -1 : 1) + od.length) % od.length].focus();
  });

  ona.onclick = async () => {
    if (isleniyor || ona.disabled) return;           // cift tiklama TEK mutation
    isleniyor = true;
    ona.disabled = vaz.disabled = ta.disabled = dg.disabled = true;
    /* ⚠ ODAK PENCEREYE ALINIYOR. Olculdu: odaklanan oge disabled olunca
       tarayici odagi <body>'ye tasiyor; dinleyici <dialog>'a bagli ve
       olaylar YUKARI kabardigi icin keydown pencereye HIC ULASMIYORDU
       (0/2 olculdu) — odak tuzagi islem suresince etkisizdi ve ekran
       okuyucu yerini kaybediyordu. Pencerenin kendisi odaklanabilir
       yapilip odak ona veriliyor; olay artik ULASIYOR. */
    d.tabIndex = -1; d.focus();
    ona.textContent = 'İşleniyor...'; hataK.hidden = true;
    /* ⚠ EXCEPTION GUVENLIGI. Onceki hal ciplakti: uygula() firlatirsa
       isleniyor=true kaliyor, dort kontrol de disabled kaliyor ve buton
       "İşleniyor..." donuyordu — CIKIS YOLU YOKTU, sayfa yenilemek
       gerekiyordu. finally kontrollerin HER iki yolda da acilmasini
       garanti eder. Faz ayrimi uygula() icinde: mutation hatasi ile
       tazeleme hatasi AYNI SEY DEGILDIR. */
    let s = null;
    try { s = await uygula(ta.value.trim()); }
    catch(e){ console.error('P0-A1 arsivleme', e);
              s = { ok:false, mesaj:'Beklenmeyen hata — ayrıntı konsolda.' }; }
    finally {
      isleniyor = false;
      vaz.disabled = ta.disabled = dg.disabled = false;
      ona.textContent = 'Sil';
      denetle();                       // onay dugmesinin DOGRU durumu geri gelir
    }
    if (s && s.ok){ kapat(s.uyari); return; }
    hataK.hidden = false; hataK.textContent = (s && s.mesaj) || 'İşlem tamamlanamadı.';
    ta.focus();
  };
  vaz.focus();                                       // acilista odak VAZGEC
  return { d, ta, dg, vaz, ona, hataK, taH, dgH };
}

/* ⚠ IKI FAZ AYRI. Duz bir try/catch koymak BASARILI islemi
   "Islem tamamlanamadi" diye gosterirdi ve kullanici ayni kaydi IKINCI
   KEZ pasife alirdi — cunku firlatan sey mutation degil, ondan SONRAKI
   tazelemedir (vMaden/vSahis ciplak, ekranAc kendi try/catch'ine sahip). */
async function pasifeAlUygula(mutasyon, tazele, tabloAdi){
  try {
    const { error } = await mutasyon();
    if (error){ console.error('P0-A1 mutation ' + tabloAdi, error);
                return { ok:false, mesaj: hataTr(error.message) }; }
  } catch(e){ console.error('P0-A1 mutation ' + tabloAdi, e);
              return { ok:false, mesaj: hataTr(e.message || String(e)) }; }
  /* Buraya gelindiyse kayit ZATEN pasife alinmistir. */
  try { await tazele(); }
  catch(e){ console.error('P0-A1 tazeleme ' + tabloAdi, e);
            return { ok:true, uyari:'Kayıt silindi. Liste tazelenemedi — sayfayı yenileyin.' }; }
  return { ok:true };
}

      /* FAZ 1 · mutation. v98: ham update yerine sunucu sozlesmesi.

      () => sb.rpc('rpc_kredi_pasife_al',{p_kredi:kredi.id,p_neden:neden}),

/* ---------- tek kredinin taksit ekrani ---------- */
async function taksitEkraniAc(krediId){
  seritiHizala();          // AL1 · ekranAc'tan gecmiyor, serit kaymis kalirdi
  const c = document.getElementById('icerik');
  c.textContent = ''; c.appendChild(el('div','bos','Yükleniyor...'));
  try{
    const kredi = (await krediGetir()).find(x => x.id === krediId);
    if (!kredi){ c.textContent=''; c.appendChild(el('div','uyari-agir','Kredi bulunamadı.')); return; }
    SECILI_KREDI = kredi;
    const taksitler = await taksitGetir(krediId);
    const b = bugun(), buAy = b.slice(0,7);
    const o = krediOzet(taksitler);

    c.textContent = '';
    const geri = el('button','btn2','← Kredilere dön');
    geri.onclick = () => ekranAc('krediler');
    c.appendChild(geri);

    const bas = el('div','kart');
    const bl = el('div','kbaslik');
    bl.appendChild(el('span', null, kredi.banka + ' · ' + kredi.ad));
    bl.appendChild(document.createTextNode(' '));
    bl.appendChild(el('span', turSinif(kredi.tur), turKisa(kredi.tur)));
    bas.appendChild(bl);
    const sat = (e2,d) => { const s = el('div','satir');
      s.appendChild(el('span','et', e2)); s.appendChild(el('span','dg', d)); bas.appendChild(s); };
    /* ⚠ UST BLOK · sirasi degisti: once KALAN ANAPARA (bugun kapatsam ne
       oderim), sonra taksit sayaci. Alis anaparasi ve faiz orani
       kunye bilgisi — asagi alindi; ust satirlar karar verdiren
       rakamlar icin. */
    if (o.kirilimsizAdet === 0 && o.kalanAdet > 0)
      sat('Kalan anapara', tlk(o.anaparaKurus));
    else if (o.kalanAdet > 0)
      sat('Kalan anapara', 'hesaplanamıyor — ' + o.kirilimsizAdet + ' taksitte kırılım yok');
    sat('Kalan (nominal)', tlk(o.kalanKurus) + ' (' + o.kalanAdet + ' taksit)');
    sat('Taksit', taksitler.length + ' / ' + kredi.taksit_sayisi + ' girildi · '
        + o.odenenAdet + ' ödendi');
    sat('Alış anaparası', tl(kredi.anapara));
    sat('Faiz oranı', (kredi.faiz_orani === null || kredi.faiz_orani === undefined)
        ? 'girilmemiş' : String(kredi.faiz_orani).replace('.',',') + ' %');
    if (kredi.tur !== 'ticari')
      bas.appendChild(el('div','bilgi', turAdi(kredi.tur) + ' — bu kredinin hiçbir kalemi gidere yazılmaz.'));
    bas.appendChild(digerMenu([['Krediyi sil', (a) => krediSil(kredi, a)]]));
    c.appendChild(bas);

    const msg = el('div','msg'); msg.id = 'taksitMsg'; c.appendChild(msg);

    /* =================================================================
       SIRADAKI TAKSIT · EKRANIN EN USTUNDE, KAYDIRMADAN BASILABILIR
       =================================================================
       ⚠ OLCULDU: bu blok eklenmeden once ilk "Ödeme gir" dugmesi
         sayfanin 5032. pikselindeydi — 812px'lik ekranda ilk goruntude
         SIFIR odeme dugmesi vardi. Sahibin en sik yaptigi is bu.
       ⚠ YENI ODEME YOLU YAZILMADI: dugme mevcut odemeFormuAc'i aciyor,
         o da rpc_taksit_odeme_kaydet'i cagiriyor. Ikinci bir yol acmak,
         kirilim ve gider kontrollerini atlayan bir kapi olurdu.
       ================================================================= */
    if (o.sonraki){
      const s = sonrakiTaksitMetni(o.sonraki, b);
      const sk = el('div','kart');
      const sb2 = el('div','kbaslik','SIRADAKİ TAKSİT');
      sk.appendChild(sb2);
      const su = el('div','tk-ust');
      const sad = el('div','tk-ad');
      sad.appendChild(el('span', null, o.sonraki.sira + '. taksit · ' + s.tarih + ' '));
      /* ⚠ toLocaleUpperCase('tr') SART: duz toUpperCase() "geçti" -> "GEÇTI"
         yapiyor, noktali I kayboluyor. Olculdu, ekranda "54 GÜN GEÇTI"
         yaziyordu. */
      if (s.gecikti) sad.appendChild(el('span','rozet rz-eksik', s.gunMetni.toLocaleUpperCase('tr-TR')));
      else sad.appendChild(el('span','rozet rz-yesil', s.gunMetni));
      su.appendChild(sad);
      su.appendChild(el('div','tk-tutar', s.tutar));
      sk.appendChild(su);
      if (o.sonraki.durum === 'kismi')
        sk.appendChild(el('div','tk-orta','Kısmi ödenmiş · ödenen '
          + tl(o.sonraki.odenen) + ' · kalan ' + tl(o.sonraki.kalan)));
      const sey = el('div','tk-eylem');
      const sbt = el('button','btn', o.sonraki.durum === 'kismi' ? 'Ödeme ekle' : 'Ödedim');
      /* Form BU kartin icine aciliyor; odemeFormuAc kabi disaridan alir. */
      sbt.onclick = () => odemeFormuAc(sk, o.sonraki);
      sey.appendChild(sbt);
      sk.appendChild(sey);
      c.appendChild(sk);
    }

    const k = el('div','kart');
    k.appendChild(el('div','kbaslik','Bu kredinin taksitleri'));
    if (!taksitler.length) k.appendChild(el('div','bos','Bu kredide henüz taksit yok.'));
    else {
      /* ⚠ ODENMISLER KATLANIR · ekran birikmesi kurali. 24 taksitli bir
         kredide 14 odenmis kutu, sıradakini 5000 piksel asagi itiyordu.
         Kaybolmuyorlar — TEK SATIRA katlaniyor ve acilabiliyor.
         ⚠ DESEN ICAT EDILMEDI: ozetCiz'in serit-ozet kalibi (buton +
           hidden div + aria-expanded + ▾/▴ + icerigi ILK ACILISTA kur)
           birebir kopyalandi. */
      const odenmis = taksitler.filter(t => t.durum === 'kapali');
      const acik    = taksitler.filter(t => t.durum !== 'kapali');
      if (odenmis.length){
        const kat = el('button','serit-ozet'); kat.type = 'button';
        kat.setAttribute('aria-expanded','false');
        const p = el('span','so-p');
        p.appendChild(el('span','so-et','ödendi'));
        p.appendChild(el('span','so-dg', String(odenmis.length)));
        kat.appendChild(p);
        kat.appendChild(el('span', null, ' taksit · göster'));
        const kok = el('span','so-ok','▾'); kat.appendChild(kok);
        kat.setAttribute('aria-label', odenmis.length + ' ödenmiş taksit. Listeyi aç.');
        k.appendChild(kat);
        const kutu = el('div'); kutu.hidden = true; k.appendChild(kutu);
        kat.onclick = () => {
          if (kutu.hidden){
            if (!kutu.firstChild)
              for (const t of odenmis) kutu.appendChild(taksitKarti(t, kredi, b, buAy));
            kutu.hidden = false; kok.textContent = '▴';
            kat.setAttribute('aria-expanded','true');
          } else {
            kutu.hidden = true; kok.textContent = '▾';
            kat.setAttribute('aria-expanded','false');
          }
        };
      }
      if (!acik.length) k.appendChild(el('div','bos','Ödenmemiş taksit yok.'));
      else for (const t of acik) k.appendChild(taksitKarti(t, kredi, b, buAy));
    }
    c.appendChild(k);

    /* ⚠ TOPLU FORM EN ALTA ALINDI: taksitler bir kez uretilir, odeme her
       ay yapilir. Sik yapilan isin onunde durmasi icin sebep yok. */
    c.appendChild(topluFormu(kredi, taksitler));
    /* CW · Esit olmayan taksit uretici, eskisinin YANINA gelir.
       Esit taksitli krediler icin ustteki form dogru calisiyor. */
    c.appendChild(planFormu(kredi, taksitler));
  }catch(e){
    c.textContent = '';
    c.appendChild(el('div','uyari-agir','Taksitler açılamadı: ' + hataTr(e && e.message)));
  }
}

/* Toplu taksit uretimi — PERIYOT SECILEBILIR.
   Bir kredi 3 AYDA BIR odeniyor (esnaf); aylik varsaymak yanlis olurdu. */
function topluFormu(kredi, mevcut){
  const k = el('div','kart');

  const sonSira = mevcut.reduce((a,x) => Math.max(a, x.sira), 0);

    k.appendChild(el('div','bilgi','Bu kredide zaten ' + sonSira + ' sıra var. Yeni satırlar ' + (sonSira+1) + '. sıradan devam eder.'));

  const alan = (etiket, id, tip, deger, mod) => {
    k.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input');
    i.id = id; i.type = tip || 'text';
    if (deger) i.value = deger;
    if (mod) i.setAttribute('inputmode', mod);
    k.appendChild(i); return i;
  };
  alan('İlk vade tarihi','tBas','date', kredi.baslangic_tarihi);
  alan('Taksit tutarı (her taksit aynı)','tTutar','text','','decimal');
  alan('Adet','tAdet','text','','numeric');

  k.appendChild(el('label', null, 'Periyot — kaç ayda bir ödeniyor')).setAttribute('for','tPeriyot');
  const sp = document.createElement('select'); sp.id = 'tPeriyot';
  [['1','Her ay'],['3','3 ayda bir'],['6','6 ayda bir'],['12','Yılda bir']]
    .forEach(([v,t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sp.appendChild(o); });
  k.appendChild(sp);
  k.appendChild(el('div','kucuk','Bütün krediler aylık değil — esnaf kredisi 3 ayda bir ödeniyor.'));

  alan('Taksit başına FAİZ (isteğe bağlı)','tFaiz','text','','decimal');
  alan('Taksit başına VERGİ / MASRAF (isteğe bağlı)','tVergi','text','','decimal');
  paraBaglaHepsi(k, ['tTutar','tFaiz','tVergi']);   /* CO */
  k.appendChild(el('label', null, 'Vergi/masraf kırılımı — belgedeki gibi yaz')).setAttribute('for','tNot');
  const nt = document.createElement('input'); nt.id = 'tNot'; nt.type = 'text';
  nt.placeholder = 'BSMV ve KKDF gibi kalemleri belgedeki gibi yaz';
  k.appendChild(nt);
  k.appendChild(el('div','kucuk',
    'Faiz ve vergi/masraf yazarsan anapara = tutar − faiz − vergi/masraf olarak hesaplanır.\n'
  + 'İkisini de boş bırakırsan kırılım KAYDEDİLMEZ ve o taksitlerin gideri hesaplanamaz.'));

  const on = el('button','btn2','Önce göster (kaydetme)');
  on.onclick = () => topluOnizle(kredi, sonSira, false);
  const kay = el('button','btn','Taksitleri kaydet'); kay.id = 'tKaydet';
  kay.onclick = () => topluOnizle(kredi, sonSira, true);
  k.appendChild(on); k.appendChild(kay);
  const ov = el('div'); ov.id = 'tOnizleme'; k.appendChild(ov);
  return k;
}

function topluSatirlariUret(kredi, sonSira){
  const bas   = document.getElementById('tBas').value;
  const tut   = paraCoz(document.getElementById('tTutar').value);
  const adet  = parseInt(document.getElementById('tAdet').value.trim(), 10);
  const per   = parseInt(document.getElementById('tPeriyot').value, 10);
  const faizH = document.getElementById('tFaiz').value.trim();
  const vrgH  = document.getElementById('tVergi').value.trim();
  const not   = document.getElementById('tNot').value.trim();

  if (!bas) return { ok:false, hata:'İlk vade tarihi zorunlu.' };
  if (!tut.ok) return { ok:false, hata:'Taksit tutarı: ' + tut.hata };
  if (tut.kurus <= 0) return { ok:false, hata:'Taksit tutarı sıfırdan büyük olmalı.' };
  if (!Number.isFinite(adet) || adet <= 0) return { ok:false, hata:'Adet sıfırdan büyük bir tam sayı olmalı.' };
  if (adet > 600) return { ok:false, hata:'Adet çok büyük (en fazla 600).' };
  if (!Number.isFinite(per) || per <= 0) return { ok:false, hata:'Periyot seçilmedi.' };

  let faizKurus = null, vrgKurus = null;
  if (faizH){
    const f = paraCoz(faizH);
    if (!f.ok) return { ok:false, hata:'Faiz: ' + f.hata };
    faizKurus = f.kurus;
  }
  if (vrgH){
    const g = paraCoz(vrgH);
    if (!g.ok) return { ok:false, hata:'Vergi/masraf: ' + g.hata };
    vrgKurus = g.kurus;
  }
  /* kt_ayrim_chk'i EKRANDA da uygula — sunucuya hatali satir gondermeyelim */
  if (vrgKurus !== null && faizKurus === null)
    return { ok:false, hata:'Vergi/masraf yazdın ama faiz boş. Kırılım girilecekse faiz de zorunlu.' };
  if (faizKurus !== null){
    const toplamPay = faizKurus + (vrgKurus || 0);
    if (toplamPay > tut.kurus)
      return { ok:false, hata:'Faiz + vergi/masraf, taksit tutarından büyük olamaz.' };
  }

  const satirlar = [];
  for (let i = 0; i < adet; i++){
    satirlar.push({
      kredi_id: kredi.id,
      sira: sonSira + i + 1,
      vade_tarihi: ayEkle(bas, i * per),
      toplam_tutar: (tut.kurus/100).toFixed(2),
      anapara_tutar: faizKurus === null ? null : ((tut.kurus - faizKurus - (vrgKurus||0))/100).toFixed(2),
      faiz_tutar:    faizKurus === null ? null : (faizKurus/100).toFixed(2),
      vergi_masraf_tutar: vrgKurus === null ? null : (vrgKurus/100).toFixed(2),
      vergi_masraf_notu:  (vrgKurus !== null && not) ? not : null,
      odendi: false
    });
  }
  return { ok:true, satirlar, toplamKurus: tut.kurus * adet };
}

/* ==================================================================
   CW · BANKA PLANINDAN URET — ESIT OLMAYAN TAKSIT
   ==================================================================
   topluSatirlariUret (yukarida) N adet AYNI satir uretir; esit taksitli
   krediler icin dogrudur ve YERINDE DURUYOR. Ama banka planlarinda
   taksit sabit, KIRILIM degiskendir: eldeki planda taksit hep
   167.322,78 iken anapara 63.897,78'den 160.463,11'e cikiyor, faiz
   98.500,00'den 6.532,99'a iniyor. Esit kirilimla girilirse toplam
   dogru, kalan anapara 23 satirda YANLIS olur — yani "bugun kapatsam
   ne oderim" rakami bozulur.

   OLCULEN FORMUL (Is Bankasi plani):
     gun_i     = tarih_i − tarih_(i-1)   (ilki: plan tarihi -> ilk taksit)
     faiz_i    = round(kalan_(i-1) × aylik_oran × gun_i / 30, 2)
     vergi_i   = round(faiz_i × vergi_orani, 2)
     anapara_i = taksit − faiz_i − vergi_i
     kalan_i   = kalan_(i-1) − anapara_i
     SON SATIR: anapara = kalan_(n-1); taksit = anapara + faiz + vergi

   ⚠ TAKSIT TUTARI KULLANICIDAN ALINIR, HESAPLANMAZ. Annuite formulunu
     kendimiz kurup taksiti turetmek, bankanin yuvarlama ve gun sayma
     yontemini BILDIGIMIZI varsaymak olurdu. Belgede yazan rakam
     gercektir; hesaplanan rakam varsayimdir.
   ⚠ URETIM BIR VARSAYIMDIR, KANIT DIP TOPLAMLARIDIR. Mutabakat kapisi
     tutmazsa KAYDEDILMEZ ve TOLERANS YOKTUR — "yakin" diye gecirmek,
     sessizce yanlis plan yazmaktir. */
function planUretCekirdek({ anaparaKurus, aylikOran, vergiOran,
                            taksitKurus, planTarihi, tarihler }){
  const gunFark = (a, b) => Math.round(
    (Date.parse(b + 'T00:00:00Z') - Date.parse(a + 'T00:00:00Z')) / 86400000);
  const n = tarihler.length;
  const satirlar = [];
  let kalan = anaparaKurus, onceki = planTarihi;
  for (let i = 0; i < n; i++){
    const g = gunFark(onceki, tarihler[i]);
    const faiz  = Math.round(kalan * (aylikOran / 100) * g / 30);
    const vergi = Math.round(faiz * (vergiOran / 100));
    let anapara, taksit;
    if (i === n - 1){
      /* Son satir artigi kapatir — bankanin plani da boyle: son taksit
         167.322,75, otekilerden 3 kurus farkli. Esitlemek kalan
         anaparayi sifirdan farkli birakirdi. */
      anapara = kalan; taksit = anapara + faiz + vergi;
    } else {
      anapara = taksitKurus - faiz - vergi; taksit = taksitKurus;
    }
    kalan -= anapara;
    satirlar.push({ sira:i+1, tarih:tarihler[i], gun:g, taksit, anapara, faiz, vergi, kalan });
    onceki = tarihler[i];
  }
  const toplam = satirlar.reduce((a,s) => ({ faiz:a.faiz+s.faiz, vergi:a.vergi+s.vergi,
    anapara:a.anapara+s.anapara, genel:a.genel+s.taksit }), { faiz:0, vergi:0, anapara:0, genel:0 });
  return { satirlar, toplam, sonKalan:kalan };
}

/* Ayin kaci -> ISO tarih; ay o gunu tasimiyorsa ayin son gunu. */
function planTarihUret(ilk, adet, gunNo){
  const d0 = new Date(ilk + 'T00:00:00Z');
  const y0 = d0.getUTCFullYear(), m0 = d0.getUTCMonth();
  const gn = gunNo || d0.getUTCDate();
  const out = [ilk];
  for (let i = 1; i < adet; i++){
    const sonGun = new Date(Date.UTC(y0, m0 + i + 1, 0)).getUTCDate();
    out.push(new Date(Date.UTC(y0, m0 + i, Math.min(gn, sonGun))).toISOString().slice(0,10));
  }
  return out;
}

function planUret(kredi, sonSira){
  mesajTemizle('planMsg');
  const oku = (id) => document.getElementById(id).value.trim();
  const para = (id, ad) => { const r = paraCoz(oku(id));
    return r.ok ? { ok:true, kurus:r.kurus } : { ok:false, hata: ad + ': ' + r.hata }; };
  /* ⚠ ORAN PARA DEGIL: paraCoz'a sokmak "3,940" degerini bozardi
     (uc ondalik). Oran ayri okunur — gram ve faiz orani alanlarina
     para bicimleyicisi baglanmiyor, ayni gerekce. */
  const oran = (id, ad) => { const s = oku(id).replace(',', '.');
    const n = Number(s);
    return (s && Number.isFinite(n) && n >= 0) ? { ok:true, deger:n }
         : { ok:false, hata: ad + ' geçersiz.' };
  };
  const ana = para('pAnapara','Anapara');
  const tak = para('pTaksit','Taksit tutarı');
  const ao  = oran('pOran','Aylık faiz oranı');
  const vo  = oran('pVergi','Vergi oranı');
  const adet = parseInt(oku('pAdet'), 10);
  const planT = oku('pPlanT'), ilkT = oku('pIlkT');
  const gunNo = oku('pGun') ? parseInt(oku('pGun'), 10) : null;
  for (const r of [ana, tak, ao, vo]) if (!r.ok) return mesaj('planMsg','hata', r.hata);
  if (!Number.isFinite(adet) || adet < 2 || adet > 600)
    return mesaj('planMsg','hata','Taksit sayısı 2 ile 600 arasında olmalı.');
  if (!planT) return mesaj('planMsg','hata','Plan hazırlama tarihi zorunlu.');
  if (!ilkT)  return mesaj('planMsg','hata','İlk taksit tarihi zorunlu.');
  if (ilkT <= planT) return mesaj('planMsg','hata','İlk taksit, plan tarihinden sonra olmalı.');
  if (gunNo !== null && (!Number.isFinite(gunNo) || gunNo < 1 || gunNo > 31))
    return mesaj('planMsg','hata','Ödeme günü 1 ile 31 arasında olmalı.');
  if (ana.kurus <= 0 || tak.kurus <= 0)
    return mesaj('planMsg','hata','Anapara ve taksit tutarı sıfırdan büyük olmalı.');

  PLAN = { kredi, sonSira,
    girdi: { anaparaKurus:ana.kurus, aylikOran:ao.deger, vergiOran:vo.deger,
             taksitKurus:tak.kurus, planTarihi:planT },
    tarihler: planTarihUret(ilkT, adet, gunNo) };
  planHesapla();
}

/* Tarih duzeltilince de buraya donulur: tablo ve kapi bastan kurulur. */
function planHesapla(){
  const ov = document.getElementById('pOnizleme');
  ov.textContent = '';
  document.getElementById('pKaydet').disabled = true;
  if (!PLAN) return;
  /* ⚠ TARIH SIRASI BOZULURSA NEGATIF GUN CIKAR ve faiz eksiye doner.
     Sessizce hesaplamak yerine soyleyip duruyoruz. */
  let onceki = PLAN.girdi.planTarihi;
  for (const t of PLAN.tarihler){
    if (t <= onceki){
      mesaj('planMsg','hata','Tarihler artan sırada olmalı: ' + trGun(t)
        + ' bir öncekinden (' + trGun(onceki) + ') sonra değil.');
      return;
    }
    onceki = t;
  }
  const r = planUretCekirdek({ ...PLAN.girdi, tarihler: PLAN.tarihler });
  PLAN.sonuc = r;

  /* --- ic tutarlilik: anapara toplami girilen anaparaya esit mi --- */
  const icTutarli = r.toplam.anapara === PLAN.girdi.anaparaKurus && r.sonKalan === 0;
  const icGenel   = r.toplam.anapara + r.toplam.faiz + r.toplam.vergi === r.toplam.genel;

  /* --- MUTABAKAT KAPISI --- */
  const bel = (id) => { const v = document.getElementById(id).value.trim();
    if (!v) return null; const p = paraCoz(v); return p.ok ? p.kurus : NaN; };
  const bFaiz = bel('pTFaiz'), bVergi = bel('pTVergi'),
        bFon = bel('pTFon'),  bGenel = bel('pTGenel');
  const eksik = [bFaiz, bVergi, bFon, bGenel].some(x => x === null);
  const bozuk = [bFaiz, bVergi, bFon, bGenel].some(x => Number.isNaN(x));

  const sar = el('div','tablo-sar');
  const t = document.createElement('table');
  const hr = document.createElement('tr');
  ['#','VADE','GÜN','TAKSİT','ANAPARA','FAİZ','VERGİ','KALAN'].forEach((h,i) =>
    hr.appendChild(el('th', i>=2 ? 'sag' : null, h)));
  t.appendChild(hr);
  r.satirlar.forEach((s,i) => {
    const tr = document.createElement('tr');
    tr.appendChild(td(s.sira));
    /* ⚠ TARIH DUZENLENEBILIR: banka tatilde ileri kaydiriyor ve bunu
       tahmin etmeye calismak (resmi tatil takvimi uydurmak) yanlis
       olurdu. Kullanici belgedekini yazar, gun sayisi degisir ve
       O SATIRDAN SONRASININ faizi yeniden hesaplanir. */
    const tdT = document.createElement('td');
    const inp = document.createElement('input');
    inp.type = 'date'; inp.value = s.tarih;
    inp.style.cssText = 'min-height:36px;padding:4px 6px;font-size:12px;margin:0';
    inp.setAttribute('aria-label', s.sira + '. taksit vade tarihi');
    inp.onchange = () => { PLAN.tarihler[i] = inp.value; planHesapla(); };
    tdT.appendChild(inp); tr.appendChild(tdT);
    tr.appendChild(td(String(s.gun),'sag'));
    tr.appendChild(td(tlk(s.taksit),'sag'));
    tr.appendChild(td(tlk(s.anapara),'sag'));
    tr.appendChild(td(tlk(s.faiz),'sag'));
    tr.appendChild(td(tlk(s.vergi),'sag'));
    tr.appendChild(td(tlk(s.kalan),'sag'));
    t.appendChild(tr);
  });
  sar.appendChild(t); ov.appendChild(sar);

  const oz = el('div','bilgi',
    'ÜRETİLEN\n'
  + '→ Toplam faiz  ' + tlk(r.toplam.faiz) + '\n'
  + '→ Toplam vergi ' + tlk(r.toplam.vergi) + '\n'
  + '→ Toplam fon   ' + tlk(0) + '  (bu üretici fon üretmiyor)\n'
  + '→ Genel toplam ' + tlk(r.toplam.genel) + '\n'
  + '→ Anapara      ' + tlk(r.toplam.anapara)
  + (icTutarli ? ' · girilen anaparaya eşit, kalan sıfır'
               : ' · ⚠ girilen anapara ' + tlk(PLAN.girdi.anaparaKurus)
                 + ', son kalan ' + tlk(r.sonKalan)));
  ov.appendChild(oz);
  if (!icTutarli || !icGenel){
    ov.appendChild(el('div','uyari-agir',
      'Plan kendi içinde tutarsız: anapara toplamı girilen anaparayı vermiyor. '
    + 'Girdilerden biri yanlış — kaydedilemez.'));
    return;
  }
  if (eksik || bozuk){
    ov.appendChild(el('div','uyari-orta',
      'Mutabakat için belgenin dört dip toplamı da yazılmalı: Toplam Faiz, '
    + 'Toplam Vergi, Toplam Fon, Genel Toplam. Biri eksikken kaydedilmez — '
    + 'üretilen plan bir varsayımdır, kanıt belgedir.'));
    return;
  }

  const fark = [
    ['Toplam faiz',  r.toplam.faiz,  bFaiz],
    ['Toplam vergi', r.toplam.vergi, bVergi],
    ['Toplam fon',   0,              bFon],
    ['Genel toplam', r.toplam.genel, bGenel]];
  const sapan = fark.filter(([,u,b]) => u !== b);
  if (!sapan.length){
    ov.appendChild(el('div','bilgi',
      'MUTABAKAT TUTTU — dört dip toplam da kuruşu kuruşuna aynı. '
    + r.satirlar.length + ' satır kaydedilebilir.'));
    document.getElementById('pKaydet').disabled = false;
    return;
  }
  /* ⚠ FARKI KALEM KALEM SOYLE, "yakin" DEME. Kumulatif faiz belgedeki
     toplami hangi satirda astiysa sapmanin orada basladigini soyler —
     kullanici duzeltmeyi nereden arayacagini bilir. */
  let sapmaSatiri = null;
  if (bFaiz !== null && !Number.isNaN(bFaiz)){
    let kum = 0;
    for (const s of r.satirlar){ kum += s.faiz;
      if ((r.toplam.faiz > bFaiz && kum > bFaiz) || (r.toplam.faiz < bFaiz && kum > bFaiz)){
        sapmaSatiri = s.sira; break; }
    }
  }
  /* ⚠ SATIRLAR AYRI <div>: .uyari-agir'da white-space:pre-wrap YOK,
     "\n" ile yazilinca dort kalem tek paragrafa cokuyordu (olculdu —
     ekran goruntusunde farklar birbirine giriyor). Kaliba dokunmadan,
     her kalemi kendi satirina koyuyoruz. */
  const u = el('div','uyari-agir');
  u.appendChild(el('div', null, 'MUTABAKAT TUTMADI — KAYDEDİLMEZ.'));
  for (const [ad, uret, belg] of sapan)
    u.appendChild(el('div', null, '→ ' + ad + ': üretilen ' + tlk(uret)
      + ' · belgede ' + tlk(belg) + ' · fark '
      + (uret > belg ? tlk(uret - belg) + ' FAZLA' : tlk(belg - uret) + ' EKSİK')));
  if (sapmaSatiri)
    u.appendChild(el('div', null, 'Üretilen kümülatif faiz ' + sapmaSatiri
      + '. satırda belgedeki toplamı geçiyor — sapma orada ya da öncesinde başlıyor.'));
  u.appendChild(el('div', null, 'Oran, vergi oranı ya da vade tarihleri belgedekinden '
    + 'farklı. Tutmuyorsa bu bankanın gün sayma yöntemi başkadır; üretim kullanılmaz, '
    + '"yakın" diye kaydedilmez.'));
  ov.appendChild(u);
}

async function planKaydet(kredi){
  if (!PLAN || !PLAN.sonuc) return;
  const btn = document.getElementById('pKaydet');
  if (btn.disabled) return;                      // kapi acilmadan kaydedilmez
  const r = PLAN.sonuc;
  if (!(await onaySor({ baslik:'Plan kaydedilecek',
    metin: r.satirlar.length + ' taksit kaydedilecek. Genel toplam '
         + tlk(r.toplam.genel) + ', dip toplamlar belgeyle birebir tuttu.',
    onayMetni:'Kaydet', tehlikeli:false }))) return;
  const satirlar = r.satirlar.map(s => ({
    kredi_id: kredi.id, sira: PLAN.sonSira + s.sira, vade_tarihi: s.tarih,
    toplam_tutar: (s.taksit/100).toFixed(2),
    anapara_tutar: (s.anapara/100).toFixed(2),
    faiz_tutar: (s.faiz/100).toFixed(2),
    vergi_masraf_tutar: (s.vergi/100).toFixed(2),
    vergi_masraf_notu: 'banka planı · vergi oranı %' + PLAN.girdi.vergiOran,
    odendi: false }));
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kredi_taksit').insert(satirlar);
  btn.textContent = 'Planı kaydet';
  if (error){ btn.disabled = false;
    hataYaz('planMsg','Plan kaydedilemedi. HİÇBİRİ yazılmadı.', error); return; }
  PLAN = null;
  /* ⚠ MESAJ EKRAN YENILENDIKTEN SONRA — odemeKaydet'te olculen tuzagin
     aynisi: taksitEkraniAc #icerik'i bastan kuruyor ve onceden yazilan
     planMsg'i SILIYOR; kullanici hicbir onay gormuyordu (olculdu). */
  await taksitEkraniAc(kredi.id);
  mesaj('planMsg','ok', satirlar.length + ' taksit kaydedildi.');
}

async function topluOnizle(kredi, sonSira, kaydet){
  mesajTemizle('taksitMsg');
  const r = topluSatirlariUret(kredi, sonSira);
  const ov = document.getElementById('tOnizleme');
  ov.textContent = '';
  if (!r.ok){ mesaj('taksitMsg','hata', r.hata); return; }

  ov.appendChild(el('div','bilgi',
    r.satirlar.length + ' taksit · ilk vade ' + trGun(r.satirlar[0].vade_tarihi)
    + ' · son vade ' + trGun(r.satirlar[r.satirlar.length-1].vade_tarihi)
    + ' · toplam ' + tlk(r.toplamKurus)));

  if (!kaydet){
    const sar = el('div','tablo-sar');
    const t = document.createElement('table');
    const hr = document.createElement('tr');
    ['#','VADE','TUTAR','ANAPARA','FAİZ','VERGİ/MASRAF'].forEach((h,i) =>
      hr.appendChild(el('th', i>=2 ? 'sag' : null, h)));
    t.appendChild(hr);
    r.satirlar.slice(0,12).forEach(s => {
      const tr = document.createElement('tr');
      tr.appendChild(td(s.sira));
      tr.appendChild(td(trGun(s.vade_tarihi)));
      tr.appendChild(td(tl(s.toplam_tutar),'sag'));
      tr.appendChild(td(s.anapara_tutar === null ? '—' : tl(s.anapara_tutar),'sag'));
      tr.appendChild(td(s.faiz_tutar === null ? '—' : tl(s.faiz_tutar),'sag'));
      tr.appendChild(td(s.vergi_masraf_tutar === null ? '—' : tl(s.vergi_masraf_tutar),'sag'));
      t.appendChild(tr);
    });
    sar.appendChild(t); ov.appendChild(sar);
    if (r.satirlar.length > 12)
      ov.appendChild(el('div','kucuk','İlk 12 satır gösteriliyor; kaydedilecek toplam ' + r.satirlar.length + ' satır.'));
    return;
  }

  if (!(await onaySor({
        baslik:'Taksitler kaydedilecek',
        metin: r.satirlar.length + ' taksit kaydedilecek. Toplam '
             + tl(r.satirlar.reduce((s,x) => s + Number(x.toplam_tutar || 0), 0)) + '.',
        onayMetni:'Kaydet', tehlikeli:false }))) return;
  const btn = document.getElementById('tKaydet');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kredi_taksit').insert(r.satirlar);
  btn.disabled = false; btn.textContent = 'Taksitleri kaydet';
  if (error){ hataYaz('taksitMsg','Taksitler kaydedilemedi. HİÇBİRİ yazılmadı.', error); return; }
  mesaj('taksitMsg','ok', r.satirlar.length + ' taksit kaydedildi.');
  await taksitEkraniAc(kredi.id);
}

                  'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u' };

  T[0x40] = ' ';
  const tek = { 0x4A:'¢', 0x4B:'.', 0x4C:'<', 0x4D:'(', 0x4E:'+', 0x4F:'|',

    0xA1:'~', 0xC0:'{', 0xD0:'}', 0xE0:'\\' };

  koy(0x81,'abcdefghi'); koy(0x91,'jklmnopqr'); koy(0xA2,'stuvwxyz');

/* ⚠ KAPI · SAYIYLA OLCULUR, dosya adiyla ya da banka tahminiyle DEGIL.
   EBCDIC'te rakamlar 0xF0..0xF9 (ð..ù). Olculdu:
     axess.pdf              -> EBCDIC rakam 366, ASCII rakam 0
     Ziraat/Enpara/Maximum  -> EBCDIC rakam 0,  ASCII rakam yuzlerce
   Esik ikili: en az 20 EBCDIC rakami VE ASCII rakamlarindan en az
   bes kat fazla. Normal bir Turkce PDF'te 'ð' yok denecek kadar az. */
function axEbcdicKapisi(parcalar){
  let eb = 0, ascii = 0;
  for (const it of parcalar)
    for (const ch of it.ham){
      const k = ch.codePointAt(0);
      if (k >= 0xF0 && k <= 0xF9) eb++;
      else if (k >= 0x30 && k <= 0x39) ascii++;
    }
  return eb >= 20 && eb > ascii * 5;
}
