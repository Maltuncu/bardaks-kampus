<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   BORC TAKIP — index.html'den BAGIMSIZ dosya.
   Kullanicinin karari: index.html 415 KB; borc modulu onu buyutmesin ve
   buradaki bir hata gunluk ekranlari vurmasin.

   ⚠ MOBIL (index.html M-1 bulgusu): iOS, 16px ALTINDAKI bir alana
     odaklaninca sayfayi zumler ve GERI CIKMAZ. Bu dosyada
     input/select/textarea font-size'i 16px'in ALTINA ASLA inmez.
   ===================================================================== */
:root{--ana:#2456A0;--ana-koyu:#183F78;--acik:#EBF0FA;--gri:#FAF4E3;--kart:#FFFEF8;
  /* ⚠ FAZ 4b · uc token AA icin koyulastirildi. Ton korundu, yalniz aciklik
     dustu. Kil payi gecen degil PAY BIRAKAN degerler secildi.
     --soluk  #8189A0 -> #5F6880 : kart 3.45->5.50 · gri 3.18->5.06 (273 dugum)
     --uyari  #C77B2B -> #A9631F : metin olarak 3.30->4.63 VE zemin olarak
              (#surumBar'in beyaz yazisi) 3.34->4.68 — tek degisiklik ikisini kapatir
     --ok     #2E7D4F -> #2A7449 : rozet zemini #E7F0E9 uzerinde 4.33->4.88 */
  --metin:#1F3354;--soluk:#5F6880;--hata:#B3402F;--uyari:#A9631F;--ok:#2A7449;--cizgi:#E7DEC8;
  --cizgi-form:#9E8340;   /* YALNIZ girdi cercevesi — gerekcesi input kuralinda */
  /* AC-02 · dip cubuk yuksekligi. Bu deger OLCULMEDEN ONCEKI baslangictir;
     altCubukOlc() sayfa kurulunca gercek olcumle uzerine yazar. Burada
     tanimli olmasi sart: yoksa CSS sessizce yedege duser ve token kapisi
     "tanimsiz" diye isaretler. */
  --alt-cubuk:80px}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--gri);color:var(--metin);font-size:15px;
  /* ⚠ AC-02 · SABIT 80px KALDIRILDI. Olculdu (320px): en yuksek dip
     cubugu #surumBar = 84px, yani sabit 80px ENGELDEN KUCUKTU. Bugun
     tasma olusmuyordu ama pay eksiye dusmustu; safe-area'li gercek
     cihazda (~34px) kesin ortecekti. Deger artik OLCULEREK geliyor:
     --alt-cubuk'u JS her yeniden boyutlandirmada gorunur dip cubuklarin
     EN YUKSEGINDEN yaziyor. Cubuk yuksekligi ileride degisirse bosluk
     kendiliginden uyar; kimsenin sayiyi guncellemesi gerekmez.
     ⚠ env(safe-area-inset-bottom) BURAYA IKINCI KEZ EKLENMIYOR:
     #sekmeBar'in kendi padding-bottom'u onu zaten tasiyor ve olculen
     yukseklige DAHIL. Iki kez eklemek bosluğu cift sayardi. */
  padding-bottom:calc(var(--alt-cubuk, 80px) + 24px)}
.gizli{display:none!important}
/* ⚠ GORSEL olarak gizli ama a11y agacinda DURUR — .gizli'nin display:none'i
   ogeyi agactan da siler, o yuzden burada KULLANILAMAZ. Genel kural: her
   genislikte gecerli, medya sorgusunun ICINE konmaz. */
.gizli-okur{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip-path:inset(50%);white-space:nowrap;border:0}

/* ⚠ --cizgi-form AYRI bir token; --cizgi'ye DOKUNULMADI. 1.4.11 yalniz
   ARAYUZ BILESENI sinirini 3:1 ister — girdi cercevesi bilesendir, ama
   --cizgi'nin diger 24 kullanimi (kart cercevesi, tablo satir cizgisi,
   .bant ayraci, #ustBar/#sekmeBar kenari, .tkv-panel, .dm-kutu, sol ray)
   SUSLEMEDIR ve kapsam disidir; toptan koyulastirmak butun ekrani hardal
   cizgiye boyardi. Kenarlik IKI komsusuna karsi olculur, belirleyici olan
   EN DUSUK olan: girdi ici #fff 3.64 · kart #FFFEF8 3.60 · sayfa zemini
   #FAF4E3 3.31 <- hukum bu. #A58A48 de gecerdi (3.02) ama kil payi. */
input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--cizgi-form);border-radius:9px;
  font-size:17px;background:#fff;color:var(--metin);font-family:inherit;min-height:46px}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:var(--soluk)}
/* ===== D6 · RAKAM HIZASI — TEK YERDE =====
   124.897,80 ile 48.584,30 orantili rakamla alt alta HIZALANMIYORDU.
   Para ekraninda en buyuk okunabilirlik kaybi buydu. Onceden 11 ayri
   bildirim vardi ve yeni eklenen her yer unutuluyordu; artik tek kural.
   Kapsayicilara veriliyor: font-variant-numeric MIRAS ALINIR, yani
   icine sonradan eklenen her rakam da hizali cikar. Tarih ve yuzde dahil. */
.para,.satir .dg,.bant,.serit-lej,.serit-dip,.tkv-bas .ort,.tkv-izgara,
.tkv-panel,.tt-sr,.ay-bas,.tk,td.sag,th.sag,#ustBar .kim{
  font-variant-numeric:tabular-nums}

/* ⚠ font-size VERILMEZSE dugme TARAYICI VARSAYILANINA duser (13.3333px,
   olculdu: 39 dugme). Olcek disi bir deger ve 11px kuralindan bagimsiz.
   Govde boyutuna baglandi; farkli boyut isteyen dugme kendi ezer. */
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;
  font-size:15px;font-weight:600}
.btn{width:100%;padding:14px;background:var(--ana);color:#fff;font-size:17px;min-height:48px;margin-top:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn2{padding:0 15px;min-height:44px;background:var(--acik);color:var(--ana);font-size:15px}
.btn-kirmizi{padding:0 15px;min-height:44px;background:#fdeceb;color:var(--hata);font-size:15px}
.btn-mini{padding:0 12px;min-height:44px;background:var(--acik);color:var(--ana);font-size:15px}

/* ⚠ KABUK KURALLARI · index.html'den BİREBİR KOPYA — başlangıç.
   Amaç: üst ve alt çubuk iki sayfada AYNI görünsün; kullanıcı ayrı bir
   siteye geçtiğini hissetmesin. Kopya olduğu için AYRIŞMA RİSKİ var;
   araclar/kalip-tara.mjs iki dosyayı karşılaştırıp uyarıyor. */
#ustBar{background:var(--kart);color:var(--ana);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;border-bottom:1.5px solid var(--cizgi)}
#ustBar .ad{font-weight:700;font-size:17px;letter-spacing:-0.5px;line-height:1.1}
#ustBar .ad .kmp{font-family:'Caveat',cursive;font-weight:600;font-size:15px;letter-spacing:0;margin-left:4px}
#ustBar .kim{font-size:11px;color:var(--soluk);font-weight:600}
#cikisBtn{background:var(--acik);color:var(--ana);padding:7px 12px;font-size:13px}
main{padding:14px;max-width:640px;margin:0 auto}

#sekmeBar{position:fixed;bottom:0;left:0;right:0;background:var(--kart);
  border-top:1.5px solid var(--cizgi);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0)}
#sekmeBar button{flex:1;min-width:0;padding:7px 2px 6px;background:none;color:var(--soluk);
  font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;
  border-top:2.5px solid transparent;position:relative;min-height:52px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sekmeBar button.aktif{color:var(--ana);border-top-color:var(--ana)}
#sekmeBar button.sk-gizli{display:none}
#sekmeBar .iko{width:21px;height:21px}
#sekmeBar .iko svg{width:100%;height:100%}
#dahaOv{position:fixed;inset:0;z-index:60;background:rgba(28,24,18,.55);display:none;
  align-items:flex-end}
#dahaOv.acik{display:flex}
/* ⚠ C · TANIMSIZ TOKEN. Burada var(--kagit) yaziliydi; --kagit dosyada
   HIC TANIMLI DEGIL (olculdu: 1 kullanim, 0 tanim). Tarayici ozelligi
   sessizce dusuruyordu ve panel SEFFAF kaliyordu — olculdu, hesaplanan
   arka plan rgba(0,0,0,0) idi; koyu ortunun uzerinde okunmuyordu.
   YENI TOKEN TANIMLANMADI, var olan DOGRU token kullanildi: --kart.
   Sebep: bu panel #sekmeBar'in uzerine oturan yukseltilmis bir yuzey ve
   #sekmeBar zaten var(--kart) kullaniyor; ikisi gorsel olarak surekli.
   Tek kullanicisi olan yeni bir token olu agirlik olurdu. */
#dahaKutu{background:var(--kart);width:100%;border-radius:20px 20px 0 0;
  padding:8px 0 calc(18px + env(safe-area-inset-bottom,0));
  box-shadow:0 -8px 28px rgba(28,24,18,.28);border-top:1px solid var(--cizgi)}
#dahaKutu::before{content:'';display:block;width:38px;height:4px;border-radius:3px;
  background:var(--cizgi);margin:2px auto 6px}
#dahaKutu .db-bas{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--soluk);padding:12px 20px 8px}
#dahaKutu button{width:100%;display:flex;align-items:center;gap:14px;padding:0 20px;min-height:54px;
  background:none;color:var(--metin);font-size:15px;font-weight:600;text-align:left;position:relative}
#dahaKutu button .iko{width:22px;height:22px;flex:none;color:var(--ana)}
#dahaKutu button .iko svg{width:100%;height:100%}
#dahaKutu button.aktif{color:var(--ana);background:var(--acik)}
/* ⚠ KOPYA BİTTİ */

/* Borç'un KENDİ bölümleri — üstte yatay şerit. Alt çubuk uygulamanın,
   bu şerit bu ekranın; ikisi karışmasın diye ayrı biçimde. */
#bolumSerit{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:10px 13px;background:var(--kart);border-bottom:1.5px solid var(--cizgi);
  position:sticky;top:52px;z-index:40;scrollbar-width:none}
#bolumSerit::-webkit-scrollbar{display:none}
#bolumSerit button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;
  background:var(--gri);color:var(--soluk);font-size:15px;font-weight:600;
  border:1.5px solid var(--cizgi);white-space:nowrap}
#bolumSerit button.aktif{background:var(--ana);color:#fff;border-color:var(--ana)}

.kart{background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;padding:15px;margin-bottom:13px}
.kbaslik{font-size:17px;font-weight:700;margin:0 0 12px;overflow-wrap:anywhere}
.satir{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--cizgi)}
.satir:last-child{border-bottom:none}
.satir .et{color:var(--soluk);font-size:15px;min-width:0;overflow-wrap:anywhere}
.satir .dg{font-weight:600;white-space:nowrap}

/* ---- UST OZET BANDI ----
   ESKI: 2x2 dort buyuk kutu, 375px'te 288px = ekranin %35'i. Ustelik
   "TOPLAM BORC" tek kutusu anapara + gelecek faiz + rayic maden degerini
   TEK sayida topluyordu.
   YENI: tek kart, sinifina ayrilmis satirlar. Kutu EKLENMEDI — satir
   yuksekligi kucultuldu ki uc-dort rakam gosterirken bant BUYUMESIN. */
.bant{background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;
  padding:9px 13px;margin-bottom:12px}
/* Iki blok: sahis sirketinin borcu ile Ltd'ninki KARISMASIN */
.bant .blok-et{font-size:11px;font-weight:700;color:var(--soluk);letter-spacing:.5px;
  text-transform:uppercase;line-height:1.3}
/* Ltd bloğu tek satır özet — iki blok bandı büyütmesin (brief 2b) */
.bant .sr.ltd{border-top:2px solid var(--cizgi);padding-top:5px;margin-top:5px}
.bant .bas{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bant .bas .et{font-size:11px;font-weight:700;color:var(--soluk);letter-spacing:.4px}
.bant .bas .dg{font-size:22px;font-weight:600;white-space:nowrap}
.bant .bas .dg-buyuk{font-size:27px;font-weight:800;white-space:nowrap}
.bant .tasarruf{color:var(--ok);font-weight:700}
.bant .kirilim{font-size:11px;color:var(--soluk);line-height:1.4;margin-top:1px;overflow-wrap:anywhere}
/* Satirlar AKAN METIN: her rakam icin ayri flex satiri kullanmak bandi
   330px'e (ekranin %41'i) cikarmisti. Iki-uc rakam tek satirda, sayilar
   kalin. Bilgi ayni, yer ucte bir. */
.bant .sr{font-size:11px;line-height:1.4;color:var(--soluk);
  padding-top:4px;margin-top:4px;border-top:1px solid var(--cizgi);overflow-wrap:anywhere}
.bant .sr b{color:var(--metin);font-weight:600;white-space:nowrap}
/* ⚠ D1 · KUR FARKI ARTIK KIRMIZI DEGIL.
   Onceki hali isareti ne olursa olsun var(--hata) ile basiyordu; bugun
   fark POZITIF (+1.09M) ve kirmizi "kayip" diye okunuyordu. Ne pozitif
   ne negatif fark bir kayiptir — rayic degisimidir. Renk hukum vermesin;
   isaret (+/−) zaten anlami tasiyor. Kalin ve okunur kaliyor. */
.bant .sr .fark{color:var(--metin);font-weight:600;white-space:nowrap}
.bant .sr .eksik{color:var(--uyari);font-weight:600}
/* ===== FAZ 2a · UC KARAR KATMANI GORSEL OLARAK AYRISIR =====
   Tez sayfa 6: anapara, bu ayin nakit cikisi ve ileri donem yuku AYRI
   kararlardir; bugun ucu de ayni bantta, ayni tipografide, alt alta
   akiyordu ve hangisinin karar degeri oldugu okunmuyordu.
   ⚠ Tezin ozel uyarisi: "Anapara, nominal gelecek odeme ve rayic deger
     ayni aciklamasiz toplam veya eksende BIRLESTIRILEMEZ." Bu yuzden
     bloklar ayrilir ama TOPLAMLARI ALINMAZ — hicbir yerde uc katmanin
     toplami yazmaz. */
.bant .kat{margin-top:12px;padding-top:10px;border-top:1px solid var(--cizgi)}
.bant .kat:first-of-type{margin-top:0;padding-top:0;border-top:none}
.bant .kat-et{font-size:10px;font-weight:800;letter-spacing:.7px;color:var(--soluk);
  margin-bottom:3px;text-transform:uppercase}
/* Kavram uyarisi: rakamin YANINDA, kucuk puntoda, tek cumle. */
.bant .kat-kapsam{font-weight:600;letter-spacing:.3px;text-transform:none;opacity:.85}
/* ⚠ .bant'a BAGLI DEGIL: ayni uyari maden ekraninda da kullaniliyor.
   Bant icinde kucuk kalir, tek basina biraz daha okunakli. */
.kavram{font-size:10.5px;color:var(--soluk);line-height:1.4;margin-top:2px;font-style:italic}
.kbaslik + .kavram{font-size:12px;margin:-4px 0 10px}
/* FAZ 2c·C · BOS DURUM. Sahte veri, ornek kart, yaniltici "0,00 TL" YOK. */
.bos-durum{border:1.5px dashed var(--cizgi);border-radius:12px;padding:18px 16px;
  text-align:left;line-height:1.6}
.bos-durum .bd-bas{font-size:15px;font-weight:700;color:var(--metin);margin-bottom:4px}
.bos-durum .bd-ac{font-size:13px;color:var(--soluk)}
.bos-durum .bd-ne{font-size:13px;color:var(--metin);font-weight:600;margin-top:8px}
/* Dagilimda PAYDA gorunur — neyin yuzdesi oldugu okunsun. */
.serit-payda{font-size:10.5px;color:var(--soluk);line-height:1.4;margin-top:4px}
.bant .dip{font-size:11px;color:var(--soluk);line-height:1.35;margin-top:5px;
  border-top:1px solid var(--cizgi);padding-top:5px}
.bant .dip b{}

/* ===== BORC DAGILIMI SERIDI (D1) =====
   SVG DEGIL, div/flex. Gerekce:
   · Etiketler >=11px ve 320px'de sigmayabiliyor. DOM'da ellipsis/akis
     bedava; SVG <text> sarmaz, tasar ve SESSIZCE kirpilir.
   · Dokunma hedefi >=44px gerekiyor ama serit 15px. <button>::after ile
     gorunumu buyutmeden 44px vurus alani aciliyor; SVG'de her segment
     icin gorunmez dikdortgen katmani gerekirdi.
   · <button> odak, Enter/Space, aria-pressed'i kendiliginden veriyor.
   · Yeni kutuphane yok — tek dosya mimarisi korunuyor.

   ⚠ RENK TEK BASINA BILGI TASIMIYOR: her sinifin AYRI DOKUSU (cizgi
   yonu/araligi) ve YAZILI ADI var. Renk korlugu ve siyah-beyaz baskida
   dokular birbirinden ayirt edilebiliyor. */
.serit{display:flex;width:100%;height:15px;margin-top:6px;background:var(--acik);
  border-radius:4px}
.serit .sg{position:relative;min-width:0;height:15px;padding:0;border:0;border-radius:0;
  overflow:hidden;cursor:pointer;display:block}
.serit .sg:first-child{border-radius:4px 0 0 4px}
.serit .sg:last-child{border-radius:0 4px 4px 0}
/* Dokunma hedefi 15px degil 44px — gorunum buyumeden. */
.serit .sg::after{content:'';position:absolute;left:0;right:0;top:-15px;bottom:-14px}
.serit .sg .ic{display:block;font-size:11px;font-weight:600;line-height:15px;
  color:#fff;white-space:nowrap;overflow:hidden;text-align:center;
  text-shadow:0 1px 1px rgba(0,0,0,.35)}
.serit .sg[aria-pressed="true"]{outline:2px solid var(--metin);outline-offset:1px;z-index:1}
/* Sinif dokulari — renk + DOKU birlikte */
.sg-kredi{background:var(--ana)}
.sg-sahis{background:repeating-linear-gradient(45deg,var(--ok),var(--ok) 3px,#256A42 3px,#256A42 6px)}
.sg-maden{background:repeating-linear-gradient(-45deg,#C8952B,#C8952B 3px,#A87A1E 3px,#A87A1E 6px)}
.sg-kart {background:repeating-linear-gradient(0deg,#6B4E9E,#6B4E9E 2px,#543D7D 2px,#543D7D 4px)}
/* ⚠ CEK dokusu digerlerinden AYRI: 90deg (dikey cizgi) ve daha genis
   aralik. Gri tonlu baskida kredi(duz)/sahis(45)/maden(-45)/kart(0) ile
   karismaz — renk tek basina bilgi tasimiyor. */
.sg-cek  {background:repeating-linear-gradient(90deg,#0F6E72,#0F6E72 4px,#0A4E51 4px,#0A4E51 8px)}
/* ⚠ YALNIZ altin segmentin etiketi KOYU. Beyaz yazi altin uzerinde 2.70/3.84
   veriyordu; siyah yazi 7.79/5.47 verir ve altin rengi AYNEN kalir — renk
   maden'in kimligi, gradyana dokunulmadi. Diger uc segment BEYAZ kalir:
   olculdu, o zeminlerde koyu yazi 1.76-2.22, felaket olurdu.
   Secici .serit .sg-maden .ic — .serit .sg .ic ile ayni ozgullukte ve
   SONRA geldigi icin kazanir. */
.serit .sg-maden .ic{color:#000}
/* Efsane/secim TEK SATIR — bant butcesi dar. Secilince o sinif buyur. */
.serit-lej{font-size:11px;line-height:1.4;color:var(--soluk);margin-top:3px;
  overflow-wrap:anywhere}
.serit-lej .ov{display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:3px;vertical-align:-1px}
.serit-lej .bs{font-weight:700;letter-spacing:.2px;margin-right:6px}
.serit-lej .pr{white-space:nowrap;margin-right:6px}
.serit-lej .pr.sec{font-size:13px;font-weight:600;color:var(--metin)}
.serit-lej .pr b{color:var(--metin);font-weight:600}
/* 11px — "grafik metni en az 11px" kurali dipnota da uygulaniyor.
   Bandin kendi .dip'i 10.5px; serit blogu ayri kurala tabi. */
.serit-dip{font-size:11px;color:var(--soluk);line-height:1.3;margin-top:2px;
  overflow-wrap:anywhere}

/* ===== TAKVIM AY IZGARASI (D5) =====
   Duz grid — takvim bileseni/kutuphane YOK.
   ⚠ RENK TEK BASINA BILGI TASIMIYOR: gun sayisinin altindaki isaret
   DESENI ile ayrisiyor (duz / noktali / kesikli), gecikmiste ayrica
   sayi kalin + altı cizili. Gri tonlamada desen ve kalinlik kaliyor. */
.tkv-bas{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.tkv-bas button{min-width:44px;min-height:44px;padding:0;background:var(--gri);
  color:var(--metin);font-size:17px;font-weight:600;border-radius:10px}
.tkv-bas button[disabled]{opacity:.35}
.tkv-bas .ort{flex:1;min-width:0;text-align:center}
.tkv-bas .ort .ay{font-size:15px;font-weight:700;line-height:1.2}
.tkv-bas .ort .oz{font-size:11px;color:var(--soluk);font-weight:700}
.tkv-hafta,.tkv-izgara{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.tkv-hafta div{text-align:center;font-size:11px;font-weight:600;color:var(--soluk);padding-bottom:3px}
.tkv-g{min-height:44px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;border:0;padding:0;background:var(--kart);
  border-radius:8px;cursor:pointer}
.tkv-g.bos{visibility:hidden;pointer-events:none}
/* Haftalik toplam seridi · IZGARANIN ICINDE, tam genislikte satir.
   ⚠ grid-column:1/-1 — sutun sayisi 7 KALIR, gun hucresi daralmaz.
   ⚠ Kenarlik YOK: ayrim ust bosluk ve zemin tonuyla (dosya kurali). */
.tkv-hafta-toplam{grid-column:1/-1;display:flex;align-items:baseline;gap:6px;
  padding:3px 6px 5px;margin-top:-1px;background:var(--zemin2,rgba(0,0,0,.03));
  border-radius:0 0 6px 6px;font-size:11px;line-height:1.3}
.tkv-hafta-toplam .hs-et{color:var(--soluk);letter-spacing:.02em}
.tkv-hafta-toplam .hs-dg{font-weight:800;font-variant-numeric:tabular-nums;
  margin-left:auto;color:var(--metin)}
.tkv-hafta-toplam .hs-ad{color:var(--soluk)}
/* ⚠ D6 · Gun sayilari 400. Onceden HEPSI 700'du — her sey kalinsa
   hicbir sey vurgulu degildir; gecikmis gun otekilerden ayrilmiyordu. */
.tkv-g .sy{font-size:13px;font-weight:400;color:var(--metin);line-height:1}
/* ⚠ D6 · ISARETLER DOLU-BOS KARSITLIGIYLA AYRILIYOR.
   Onceki hali nokta/kesik desenine dayaniyordu; gri tonlamada
   "bekliyor" 133, "Ltd" 137 cikti — 4 puan fark AYIRT ETMEZ (olculdu).
   Yeni ayrim YAPISAL: dolu kalin / dolu ince / ici bos cerceve. */
/* ⚠ Burada border-top-color VERILMEZ: `.tkv-g .im` ozgullugu (0,2,0)
   `.im-*` (0,1,0) sinifini EZIYORDU ve dort isaret de ayni renge
   dusuyordu (olculdu). Renk yalnizca .im-* siniflarindan gelir. */
.tkv-g .im{width:58%}
/* ===== FAZ 2b·B · DORT ISARET · AC-04 =====
   ⚠ GRI TONLU CIKTIDA DA AYRISACAK. Onceki hal "bugün" ve "seçili"yi
     AYNI outline ile (2px solid) yalniz RENKLE ayiriyordu; --ana ve
     --metin gri tonda birbirine cok yakin. Her cift artik EN AZ BIR
     RENK DISI ozellikte farkli:
       bugün          outline-style: solid  · width 2px
       seçili         outline-style: double · width 4px + font-weight 800
       ödeme günü     outline YOK; .im border-top-width 2/4/7px
       klavye odağı   outline-style: dashed · width 3px · offset DISA (+2px)
     Boylece renk kaldirilsa bile dorduu ayirt edilebilir. */
.tkv-g.bugun{outline:2px solid var(--ana);outline-offset:-2px}
.tkv-g[aria-selected="true"]{background:var(--acik);
  outline:4px double var(--metin);outline-offset:-4px}
.tkv-g[aria-selected="true"] .sy{font-weight:800}
/* Klavye odagi: TEK renk disi ozelligi dashed + DISA tasan offset. */
.tkv-g:focus-visible{outline:3px dashed var(--ana);outline-offset:2px}

/* ===== FAZ 2b·A · TAKVIM SOLDA, AJANDA SAGDA (>=900px) =====
   <900px: panel ayin ALTINDA, secili gun tek odak (tez sayfa 16). */
/* ===== FAZ 2c·A · MADEN TABLOSU <768px'TE KARTLASIR =====
   Tez A-P1 bulgusu: yatay tablo dar ekranda tasiyordu. Tablo YAPISI
   korunuyor (DOM ayni, degerler ayni); yalniz gorunum degisiyor —
   her satir bir KART, her hucre kendi etiketini data-et'ten aliyor.
   ⚠ Tez sayfa 16: "ek yuk buyuk, kaynak/tarih ikinci satir" — KIME ve
     ALIS GUNU basligin hemen altinda, tek satirda, kucuk puntoda.
   ⚠ Hicbir sey DB'ye yazilmiyor; bu salt gosterim. */
@media(max-width:767px){
  /* ⚠ min-width:0 SART. Olculdu: global tablo kurali min-width:520px
     veriyor; kartlasinca da duruyordu ve satirlar 375px'te 520px
     genisligindeydi. #uygulama'daki overflow-x:clip bunu GIZLIYORDU —
     yani icerik kirpiliyordu, sigmiyordu. Kirpilan icerik, tasan
     icerikten daha tehlikelidir: kimse fark etmez. */
  .tablo-sar:has(.maden-t){overflow-x:visible}
  .maden-t, .maden-t tbody, .maden-t tr, .maden-t td{display:block;width:auto;min-width:0}
  /* ⚠ :first-of-type — :first-child DEGIL. <caption> eklenince tablonun ilk
     cocugu caption oldu ve :first-child hicbir satira UYMADI; olculdu, baslik
     satiri kart gorunumune 56px olarak GERI GELDI. */
  .maden-t tr:first-of-type{display:none}        /* baslik satiri kartta gereksiz */
  .maden-t tr{border:1.5px solid var(--cizgi);border-radius:12px;
    padding:10px 12px;margin:0 0 10px;background:var(--kart);position:relative}
  .maden-t td{border:none;padding:2px 0;text-align:left!important;
    display:flex;justify-content:space-between;gap:10px;align-items:baseline}
  .maden-t td::before{content:attr(data-et);font-size:10px;font-weight:800;
    letter-spacing:.5px;color:var(--soluk);flex:none}
  /* 1. satir: TUR + GRAM birlikte, baslik gibi */
  .maden-t td[data-et="TÜR"]{font-size:17px;font-weight:700;padding-bottom:0}
  .maden-t td[data-et="TÜR"]::before{display:none}
  .maden-t td[data-et="GRAM"]{font-size:13px;color:var(--soluk);font-weight:600;
    margin-top:-2px;padding-bottom:4px}
  .maden-t td[data-et="GRAM"]::before{display:none}
  /* 2. satir: KIME + ALIS GUNU — kaynak/tarih ikinci satirda */
  .maden-t td[data-et="KİME"],.maden-t td[data-et="ALIŞ GÜNÜ"]{
    font-size:11.5px;color:var(--soluk);display:inline-flex;width:auto;margin-right:12px}
  .maden-t td[data-et="ALIŞ GÜNÜ"]{margin-bottom:6px}
  /* menu hucresi sag ust kosede */
  .maden-t td:last-child{position:absolute;top:8px;right:8px;padding:0}
  .maden-t td:last-child::before{display:none}
}

/* ===== BX · EKSTRE ONAY TABLOSU <768px'TE KARTLASIR =====
   Kalip FAZ 2c·A (maden-t) ile AYNI: DOM degismez, her satir bir kart,
   hucre etiketini data-et'ten alir. min-width:0 SART (ayni olcum:
   global tablo kurali min-width veriyor, kirpilan icerik gizli tasar).
   ⚠ OLCULDU: .maden-t CSS'i duruyor ama sinifi tasiyan tablo KALMAMIS —
     maden ekrani AN-B'de kutuya cevrilmis, data-et yazan JS yok. Desen
     KOPYALANDI (ortaklastirilmadi: oksuz CSS'e baglanmak, biri onu
     temizlediginde bu tabloyu da sessizce bozardi).
   Kart sirasi: ALAN basligi ustte · OKUNAN buyuk · KAYNAK ETIKET ve
   NASIL BULUNDU kucuk puntoda. >=768px'te dort sutun AYNEN durur. */
@media(max-width:767px){
  .tablo-sar:has(.ax-t){overflow-x:visible}
  .ax-t, .ax-t tbody, .ax-t tr, .ax-t td{display:block;width:auto;min-width:0}
  .ax-t tr:first-of-type{display:none}           /* baslik satiri kartta gereksiz */
  .ax-t tr{border:1.5px solid var(--cizgi);border-radius:12px;
    padding:10px 12px;margin:0 0 10px;background:var(--kart)}
  .ax-t td{border:none;padding:2px 0;text-align:left!important}
  .ax-t td[data-et="ALAN"]{font-size:11px;font-weight:800;letter-spacing:.5px;
    color:var(--soluk);padding-bottom:0}
  .ax-t td[data-et="OKUNAN"]{font-size:17px;font-weight:600;padding-bottom:4px}
  .ax-t td[data-et="KAYNAK ETİKET"],.ax-t td[data-et="NASIL BULUNDU"]{
    display:flex;justify-content:space-between;gap:10px;align-items:baseline;
    font-size:11.5px;color:var(--soluk)}
  .ax-t td[data-et="KAYNAK ETİKET"]::before,.ax-t td[data-et="NASIL BULUNDU"]::before{
    content:attr(data-et);font-size:10px;font-weight:800;letter-spacing:.5px;
    color:var(--soluk);flex:none}
}

/* ===== FAZ 2b·G4 · MOBILDE IZGARA TAM GENISLIK =====
   ⚠ OLCULDU: 320px'te izgara 260px, gerekli 7x44+6x2 = 320px. Eksik
     60px, main (14+14) + kart (15+15) + kenarlik yatay boslugudur.
     Aritmetik: (320-12)/7 = 44,00 TAM. Yani izgara ekran kenarina
     uzanirsa hedef TAM tutuyor.
   ⚠ GLOBAL BOSLUK DEGISMEDI: main'e, .kart'a, diger ekranlara
     DOKUNULMADI. Yalniz gun izgarasi ve hafta basliklari kendi
     kapsayicisinin boslugunun disina cikiyor.
   ⚠ 100vw + calc(-50vw + 50%) kullanildi, SABIT 30px degil: padding
     ileride degisirse kural kendiliginden uyar.
   ⚠ Ay oklari ve ajanda paneli TAM GENISLIGE CIKMIYOR — onlar kendi
     boslugunda kaliyor. Yalniz izgara ve hafta basliklari. */
/* ⚠ OLCULDU (768px): 100vw KAYDIRMA CUBUGUNU ICERIR — vw 768, clientWidth
   753, izgara 15px TASTI ve yatay kaydirma cikti. Kapsayiciya kirpma
   gerekti. `clip` secildi, `hidden` DEGIL: hidden bir kaydirma baglami
   yaratir ve #ustBar'in position:sticky davranisini bozar (clip yaratmaz).
   Kirpma YALNIZ yatayda; dikey kaydirma etkilenmiyor. */
#uygulama{overflow-x:clip}
@media(max-width:899px){
  .tkv-hafta,.tkv-izgara{width:100vw;margin-left:calc(-50vw + 50%);margin-right:calc(-50vw + 50%)}
}
.tkv-duzen{display:block}
.tkv-duzen>.tkv-sol{min-width:0}
@media(min-width:900px){
  .tkv-duzen{display:flex;align-items:flex-start;gap:18px}
  .tkv-duzen>.tkv-sol{flex:1 1 0;min-width:0}
  .tkv-duzen>.tkv-panel{flex:1 1 0;min-width:0;margin-top:0;border-top:none;
    border-left:2px solid var(--cizgi);padding-top:0;padding-left:16px}
}
.im-odendi  {border-top:4px solid var(--ok)}                       /* dolu KALIN */
.im-bekliyor{border-top:2px solid var(--uyari)}                    /* dolu INCE  */
.im-gecikmis{border-top:4px solid var(--hata)}                     /* dolu kalin + sayi alti cizili */
.im-ltd     {height:7px;border:1.5px solid var(--soluk);border-radius:2px;
             background:none}                                      /* ICI BOS CERCEVE */
/* BT · kart ve cek isaretleri. Mevcut .im-* EZILMEDI, yanina eklendi.
   Sekiller kaynagi soyler: kredi = ust CIZGI (yukaridakiler) ·
   kart = DOLU DAIRE · cek = DIKEY CIZGILI kare. Renkler seritteki
   sg-kart/sg-cek ile ayni aile; gri tonlu ciktida sekil farki yeter.
   ⚠ .tkv-g .im{width:58%} ozgullugu (0,2,0) genislik verir; daire icin
     asagidaki .tkv-g .im-kart ayni ozgullukte ve SONRA gelir — kazanir. */
.im-kart{height:7px;border-radius:50%;background:#6B4E9E}
.im-cek {height:7px;border:1px solid #0F6E72;border-radius:2px;
         background:repeating-linear-gradient(90deg,#0F6E72,#0F6E72 2px,transparent 2px,transparent 4px)}
.tkv-g .im-kart{width:7px}
/* Gecikmis gun sayisi TEK vurgulu gun: 700 + alti cizili. Diger gunler
   400 oldugu icin bu fark gri tonlamada da gorunuyor. */
.tkv-g.gecikmis .sy{font-weight:700;color:var(--hata);text-decoration:underline}
.tkv-panel{margin-top:10px;border-top:2px solid var(--cizgi);padding-top:9px}
.tkv-panel .pb{font-size:15px;font-weight:700}
.tkv-panel .pu{font-size:11px;color:var(--soluk);font-weight:700;margin-bottom:8px}
.tkv-alt{margin-top:8px;font-size:11px;text-align:center}
.tkv-alt button{background:none;color:var(--ana);font-weight:600;font-size:11px;
  text-decoration:underline;min-height:44px;padding:0 8px}
/* "Tum taksitler" — 2 satirlik sade satir, 84 kartlik yigin degil */
.tt-sr{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;
  border-bottom:1px solid var(--cizgi);cursor:pointer;min-height:44px;align-items:center}
.tt-sr .sol{min-width:0}
.tt-sr .s1{font-size:13px;font-weight:600;color:var(--metin)}
.tt-sr .s2{font-size:11px;color:var(--soluk);font-weight:700}
.tt-sr .sag{font-size:13px;font-weight:600;white-space:nowrap}
.serit-dip b{color:var(--metin)}

.rozet{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
  letter-spacing:.3px;vertical-align:middle;white-space:nowrap}
.rz-ticari{background:#E7F0E9;color:var(--ok)}
.rz-sahis{background:var(--acik);color:var(--ana)}
.rz-ltd{background:#F3EEE2;color:#7A6220}
.rz-eksik{background:#FBEAE7;color:var(--hata)}
.rz-yesil{background:#E7F0E9;color:var(--ok)}
.rz-sari{background:#FBF3E4;color:#8A6316}
/* v100 · iptal edilmis odeme: RENK TEK BASINA anlam tasimasin —
   ustu cizili + METIN etiketi birlikte. */
.iptalli td{text-decoration:line-through}
.iptalli td .rozet{text-decoration:none}
.pm-sayac{font-size:12.5px;color:var(--soluk);font-weight:600;margin-top:4px}

.uyari-agir{background:#FBEAE7;border-left:3px solid var(--hata);color:var(--hata);
  padding:11px 13px;border-radius:0 10px 10px 0;margin:0 0 10px;font-weight:600;font-size:15px;line-height:1.5}
.uyari-orta{background:#FBF3E4;border-left:3px solid var(--uyari);color:#8A6316;
  padding:10px 13px;border-radius:0 10px 10px 0;margin:0 0 10px;font-weight:700;font-size:13px;line-height:1.5}
.bilgi{background:var(--acik);border-left:3px solid var(--ana);color:var(--ana-koyu);
  padding:10px 13px;border-radius:0 10px 10px 0;margin:0 0 10px;font-size:13px;line-height:1.55;white-space:pre-line}
/* Ekstre odemesi onizlemesi: etiket solda, rakam sagda. Bosluklarla
   hizalanamiyor (.bilgi white-space:pre-line ardisik boslugu cokurtur). */
.oy-satir{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.oy-et{flex:1 1 auto;min-width:0}
.oy-dg{flex:0 0 auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.bos{text-align:center;color:var(--soluk);padding:26px 12px;font-size:15px;line-height:1.6}
.kucuk{font-size:13px;color:var(--soluk);line-height:1.55;margin-top:7px;overflow-wrap:anywhere}
/* Kullanici "dekont ekle yok burda" dedi. Satir VARDI ama .kucuk ile gri,
   son alanin altina sikismisti — gorulmedi. Normal metin renginde. */
.form-not{font-size:13px;color:var(--metin);font-weight:600;line-height:1.5;margin:12px 0 2px}

/* ===== P0-A1 · YIKICI EYLEM ANA EYLEMDEN AYRILDI =====
   Onceden [Odeme ekle] ile [Borcu sil] YAN YANA ve ESIT agirliktaydi.
   21.08'de ilk gercek odeme girilecek; parmak yanlis dugmeye 8px uzakta.
   Yikici eylem artik "⋯" menusunun icinde, birincil eylemden 12px uzakta. */
.dm{position:relative;display:inline-block;margin-left:12px}
.dm-bt{min-width:44px;min-height:44px;font-size:17px;line-height:1;background:var(--gri);color:var(--metin)}
.dm-mn{display:none;position:absolute;right:0;top:48px;z-index:65;background:var(--kart);
  border:1.5px solid var(--cizgi);border-radius:10px;min-width:196px;overflow:hidden;
  box-shadow:0 6px 20px rgba(28,24,18,.18)}
.dm-mn.acik{display:block}
.dm-o{width:100%;min-height:44px;padding:0 14px;background:none;color:var(--hata);
  font-size:15px;font-weight:600;text-align:left}
/* Guvenli onay penceresi — gercek <dialog>, prompt() yerine.
   Tehlike YALNIZ renkle anlatilmiyor: ikon + baslik + etki metni birlikte. */
.pm{border:none;border-radius:16px;padding:16px;width:calc(100% - 32px);max-width:340px;
  max-height:88vh;overflow:auto;background:var(--kart);color:var(--metin)}
.pm::backdrop{background:rgba(28,24,18,.55)}
.pm-bas{font-size:17px;font-weight:700;line-height:1.3;color:var(--hata)}
.pm-ikon{font-size:17px}
.pm-ad{font-size:15px;font-weight:600;margin-top:6px;overflow-wrap:anywhere}
.pm-kim{font-size:13px;color:var(--soluk);font-weight:600}
.pm-tutar{font-size:17px;font-weight:600;margin-top:2px}
.pm-etki{font-size:13px;color:var(--metin);line-height:1.5;margin-top:10px}
.pm-bas.sakin{color:var(--metin)}
.os-metin{font-size:15px;color:var(--metin);line-height:1.5;margin-top:10px}
.pm-hata{font-size:13px;color:var(--hata);font-weight:600;margin-top:4px}
.pm textarea,.pm input{font-size:17px}
.pm-ey{display:flex;gap:10px;margin-top:14px}
.pm-ey button{flex:1;min-height:44px;margin-top:0}
.pm-ey button[disabled]{opacity:.4}
.pm :focus-visible,.dm-bt:focus-visible,.dm-o:focus-visible{
  outline:3px solid var(--ana);outline-offset:2px}

.msg{padding:11px 13px;border-radius:9px;margin:11px 0;font-weight:700;font-size:15px;
  line-height:1.5;display:none;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.hata{display:block;background:#FBEAE7;color:var(--hata)}
.msg.ok{display:block;background:#E7F0E9;color:var(--ok)}
/* ⚠ "kaydedildi AMA kontrol et" — ne yesil ne kirmizi. Bu kural
   olmadan .msg display:none kalir ve uyari HIC gorunmezdi. */
.msg.uyari{display:block;background:#FBF1E3;color:var(--uyari)}

.tablo-sar{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px -3px}
/* ===== DE · KART GECMISI · AY x KART =====
   ⚠ 375px'te dokuz sutun (ay + yedi kart + toplam) sigmaz; tablo KENDI
     kutusunda yatay kayar (.tablo-sar), sayfa TASMAZ. Ay sutunu yapisik
     kalir, yoksa saga kayinca hangi ayda oldugun kayboluyor. */
.kg-ust{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0 2px}
.kg-sec{display:flex;gap:6px;flex-wrap:wrap}
.kg-sec .btn-mini.secili{background:var(--ana);color:#fff;border-color:var(--ana)}
.kg-t th,.kg-t td{white-space:nowrap}
.kg-t th:first-child,.kg-t td:first-child{position:sticky;left:0;z-index:1;
  background:var(--kart);box-shadow:1px 0 0 var(--cizgi)}
.kg-t tr.kg-alt{font-weight:800;border-top:2px solid var(--cizgi)}
.kg-t tr.kg-alt td:first-child{background:var(--kart)}
.kg-t .kg-top{font-weight:800}
.kg-h{background:none;border:0;padding:2px 0;margin:0;min-height:32px;
  font:inherit;color:var(--ana-koyu);text-decoration:underline;cursor:pointer}
.kg-h:focus-visible{outline:3px dashed var(--ana);outline-offset:2px}
/* Ekstresi yuklenmemis donem: soluk nokta. Rengi TEK basina anlam
   tasimiyor — dipnotta ne oldugu yaziyor. */
.kg-nok{display:inline-block;width:6px;height:6px;border-radius:50%;
  background:var(--soluk);opacity:.55;margin-left:5px;vertical-align:middle}
.kg-tarihsiz{margin-left:4px;color:var(--uyari);font-weight:800}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:15px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--cizgi);white-space:nowrap}
th{font-size:11px;color:var(--soluk);letter-spacing:.4px}
td.sag,th.sag{text-align:right}

/* ---- TAKVIM satiri ---- */
.ay-bas{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  margin:18px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--cizgi)}
.ay-bas .ad{font-size:15px;font-weight:700}
.ay-bas .tp{font-size:13px;font-weight:600;color:var(--soluk)}
.tk{border:1.5px solid var(--cizgi);border-radius:12px;padding:12px;margin-bottom:9px;background:var(--kart)}
/* AY · TEK SATIRLIK OZET SERIDI (tam bant yalniz Takvim'de) */
/* ⚠ flex-wrap · OLCULDU: 375px'te devretti seridi 393px isteyip 345px
   kutuya sigmiyor, overflow-x:auto + scrollbar-width:none yuzunden
   RAKAM SESSIZCE KESILIYORDU (gizli kaydirma, gorunur ipucu yok).
   Sarma yalniz sigmayan seritte devreye girer; sigan serit degismez. */
.serit-ozet{display:flex;flex-wrap:wrap;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--kart);border:1.5px solid var(--cizgi);border-radius:12px;

/* AC-02 · icerik alt cubugun ALTINDA KALMASIN. Sabit sayi YAZILMIYOR:
   gorunur dip cubuklarin (#sekmeBar ve varsa #surumBar) EN YUKSEGI
   olculup --alt-cubuk'a yaziliyor; CSS ustune 24px ekliyor. Cubuk
   yuksekligi degisirse bosluk kendiliginden uyar.
   ⚠ position:fixed ogede offsetParent NULL doner (olculdu, ilk
     olcumumu bozmustu) — gorunurluk YUKSEKLIKLE sinaniyor. */
function altCubukOlc(){
  const yuk = ['sekmeBar','surumBar']
    .map(id => document.getElementById(id)).filter(Boolean)
    .map(e => e.getBoundingClientRect())
    /* ⚠ FAZ 1: 900px ustunde #sekmeBar SOL RAY oluyor — tam yukseklikte
       ve dar. O hali "alt cubuk" sayilirsa --alt-cubuk ~800px olur.
       Dip cubugu, EKRAN GENISLIGINI kaplayan cubuktur; ray degildir. */
    .filter(k => k.height > 0 && k.width > innerWidth * 0.8)
    .map(k => k.height);
  const en = yuk.length ? Math.ceil(Math.max(...yuk)) : 0;
  document.documentElement.style.setProperty('--alt-cubuk', en + 'px');
  return en;
}

     ayraci GORMEMEK. Yeni bir bicimleyici YAZMADIM; bu dosyanin

   ⚠ EKSI: paraCoz '-' isaretini suzgecten atiyor. Eksi kabul eden

     de ayni sekilde paraCoz'DEN ONCE bakiyor (AV notu). */
function paraTemizle(el, eksiVar){
  if (!el) return;

  const eksi = !!eksiVar && /^[-−]/.test(t);

/* ==================================================================
   ⚠ CP · YAZARKEN BINLIK AYIRAC — index.html ile AYNI KOD.
   Onceki tur yalniz blur'da grupluyordu; sahip "sifirlari adam gibi
   saymiyor, icimden sayarak giriyorum" dedi. Kurallar ve gerekceler
   index.html'deki ayni blogun basinda yazili (CP).
   ⚠ GRAM/ORAN/GUN alanlari bu dosyada zaten paraBagla'ya BAGLI DEGIL
     (onceki tur, 26 alanin listesi kodda) — ayri bir kapi gerekmiyor. */
function paraCanli(ham, eksiVar){
  const eksi = !!eksiVar && /^[-−]/.test(String(ham));
  /* ⚠ NOKTA HER ZAMAN GRUPLAMADIR — bizim koydugumuz ayrac. Kullanicinin
     ondalik olarak yazdigi nokta, YAZILDIGI ANDA (paraCanliUygula) virgule
     cevrilir; buraya gelen nokta artik yalniz ayractir.
     ⚠ OLCULDU: burada "virgul yoksa ilk nokta ondaliktir" denenmisti —
     "3.656" yazilinca sonraki tusta kendi ayracimizi ondalik sanip
     "3,6569" uretiyordu. */
  let s = String(ham).replace(/[^\d.,]/g, '').replace(/\./g, '');
  const iv = s.indexOf(',');
  if (iv >= 0) s = s.slice(0, iv + 1) + s.slice(iv + 1).replace(/,/g, '');   // tek virgul
  const v = s.indexOf(',');
  let tam = v < 0 ? s : s.slice(0, v);
  const ond = v < 0 ? '' : s.slice(v);              // ',' DAHIL — hic gruplanmaz
  tam = tam.replace(/^0+(?=\d)/, '');
  return (eksi ? '-' : '') + tam.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ond;
}
function paraCanliUygula(el, e, eksiVar){
  const geri = !!(e && /^delete/i.test(e.inputType || ''));
  let t = el.value;
  let p = el.selectionStart == null ? t.length : el.selectionStart;
  /* ⚠ Kullanici ondalik ayraci olarak NOKTA yazdiysa (masaustu klavyesi)
     o noktayi ANINDA virgule cevir — gruplama noktalariyla karismasin.
     Yalniz BU tusta yazilan noktaya bakilir (e.data), alandaki otekilere degil. */
  if (e && e.data === '.' && p > 0 && t[p-1] === '.') t = t.slice(0, p-1) + ',' + t.slice(p);
  if (geri && p > 0 && paraCanli(t, eksiVar) === (el.__paraEski || '')){
    t = t.slice(0, p - 1) + t.slice(p); p -= 1;      // ayrac silindi -> rakami sil
  }
  const yeni = paraCanli(t, eksiVar);
  const n = t.slice(0, p).replace(/\./g, '').length;
  el.value = yeni; el.__paraEski = yeni;
  let k = 0, i = 0;
  for (; i < yeni.length && k < n; i++) if (yeni[i] !== '.') k++;
  while (i < yeni.length && yeni[i] === '.') i++;
  try { el.setSelectionRange(i, i); } catch(err){}
}
function paraBicimle(el, eksiVar){
  if (!el || !el.value.trim()) return;
  const eksi = !!eksiVar && /^\s*[-−]/.test(el.value);
  const r = paraCoz(el.value);
  if (!r.ok) return;                       // gecersizse DOKUNMA, kullanici duzeltsin
  const m = (eksi && r.kurus !== 0 ? '-' : '') + tk(r.kurus);
  if (el.value !== m){ el.value = m; el.__paraEski = m; }
}
function paraBagla(el, sonra, eksiVar){
  if (!el) return;
  el.__paraEski = el.value;
  el.addEventListener('input', (e) => { paraCanliUygula(el, e, eksiVar); if (sonra) sonra(); });
  el.addEventListener('blur',  () => { paraBicimle(el, eksiVar); if (sonra) sonra(); });
}

function paraCoz(ham){
  const t = String(ham == null ? '' : ham);

  if (!/\d/.test(s)) return t.trim()==='' ? {ok:true,kurus:0} : {ok:false,hata:'Geçersiz tutar.'};
  const son = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
  let tam, ond;
  if (son < 0){ tam = s; ond = ''; }
  else { const kuyruk = s.slice(son+1).replace(/[.,]/g,'');
    if (s[son]==='.' && kuyruk.length>2){ tam = s.replace(/[.,]/g,''); ond=''; }
    else { tam = s.slice(0,son).replace(/[.,]/g,''); ond = kuyruk.slice(0,2); } }
  tam = tam.replace(/^0+(?=\d)/,'') || '0';
  const d = parseFloat(tam + (ond ? '.'+ond : ''));
  if (!isFinite(d)) return {ok:false,hata:'Geçersiz tutar.'};
  return { ok:true, kurus: Math.round(d*100) };
}

  if (/_chk\b/i.test(s))              return 'Girilen değer kuralları sağlamıyor.';   // AQ · '+ s' kisit adini tasiyordu
  if (/duplicate key/i.test(s))       return 'Bu kayıt zaten var.';
  /* v100/v101 · ters kayit RPC'lerinin YEDI kodu. v101 GIDERE_ISLENMIS'i
     ekledi; onceki yorum ALTI diyordu ve artik YANLISTI. Yazilmasaydi
     dusme satiri ham kodu EKRANA basardi — "ZATEN_TERS" diye. */
  if (/ZATEN_TERS/.test(s))           return 'Bu ödeme zaten iptal edilmiş. Listede iptal kaydı görünüyor.';
  if (/TERSIN_TERSI_YOK/.test(s))     return 'İptal kaydı iptal edilemez. Ödemeyi yeniden girmen gerekir.';
  if (/GEREKCE_KISA/.test(s))         return 'Gerekçe en az 10 karakter olmalı.';
  if (/KAYIT_YOK/.test(s))            return 'Ödeme bulunamadı — ekran eskimiş olabilir, yenile.';
  if (/AY_KAPALI/.test(s))            return 'Bu ödemenin ayı kapatılmış. Önce ayı aç, sonra iptal et.';
  if (/GIDERE_ISLENMIS/.test(s))      return 'Bu ödeme gider olarak işlenmiş. Önce gider kaydını geri al, sonra ödemeyi iptal et.';
  if (/YETKI_YOK/.test(s))            return 'Bu işlem için yetkin yok.';
  if (/Failed to fetch|NetworkError/i.test(s)) return 'İnternet bağlantısı kurulamadı. Kayıt YAPILMADI, tekrar dene.';
  /* ⚠ AQ · DUSME SATIRI ARTIK HAM METIN VERMIYOR. Onceki hal `return s`
     idi: ceviremedigi her sey ekrana OLDUGU GIBI cikiyordu — tablo/kisit
     adlari, "permission denied for ...", PostgREST sema metinleri. Yeni
     RPC kodlari da SESSIZCE buraya dusuyordu; GIDERE_ISLENMIS'in bugun
     yapacagi tam olarak buydu. index.html'de kapatilmisti, burada acikti. */
  window.__sonHataHam = s;
  console.warn('ham hata:', s);            // ekranda degil, konsolda
  return HATA_GENEL;
}

/* ============ BELGE — index.html SOZLESMESI (birebir) ============
   Ayni kova 'belgeler', ayni yol: <klasor>/<YYYY-AA-GG>_<uuid>.<uzanti>
   Farkli yol kullanilsaydi dekontlar YEDEGIN DISINDA kalirdi. */
async function fotoKucult(file){
  try{
    const img = await createImageBitmap(file);
    const oran = Math.min(1, 1600/Math.max(img.width, img.height));
    if (oran === 1 && file.size < 700*1024) return { veri:file, tip:null };
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*oran); c.height = Math.round(img.height*oran);
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r,'image/jpeg',0.82));
    return blob ? { veri:blob, tip:'jpg' } : { veri:file, tip:null };
  }catch(e){ return { veri:file, tip:null }; }      // PDF: oldugu gibi
}
async function dosyaYukle(f, klasor){
  if (!f) return null;
  const k = await fotoKucult(f);
  const uzanti = k.tip || (f.name.split('.').pop() || 'jpg').toLowerCase();
  const yol = `${klasor}/${bugun()}_${crypto.randomUUID()}.${uzanti}`;
  const { error } = await sb.storage.from('belgeler').upload(yol, k.veri,
    { upsert:false, contentType: k.tip ? 'image/jpeg' : (f.type || undefined) });
  if (error) throw new Error('Belge yüklenemedi: ' + error.message);
  return yol;
}
/* ⚠ UCUNCU MODAL. pasifeAlAc ve odeme penceresiyle AYNI mekanik ucuncu
   kez yaziliyor. Ortak yardimciya cikarmak daha temiz olurdu AMA iki
   calisan ve canlida sinanmis akisi degistirmek demekti — BIRLESTIRME
   AYRI IS, kaybolmasin.
   ⚠ Bu pencere MUTATION YAPMIYOR: soru sorar, cevabi dondurur. Bu yuzden
   pasifeAlAc'in yedi ozelliginden yalniz DORDU var. Gerekmeyenler ve
   nedenleri: `isleniyor` kilidi (islem suresi yok), iki fazli sonuc
   (tazeleme yok), hata sonrasi form korunumu (form yok). */
let OS_SAYAC = 0;
function onaySor({ baslik, metin, onayMetni, tehlikeli }){
  return new Promise((cevapla) => {
    const acan = document.activeElement;          // (d) odak devri icin
    const no = ++OS_SAYAC;
    const d = document.createElement('dialog'); d.className = 'pm';   // (a) gercek <dialog>
    d.setAttribute('aria-modal','true');
    const bas = el('div','pm-bas' + (tehlikeli ? '' : ' sakin')); bas.id = 'os' + no + 'b';
    if (tehlikeli) bas.appendChild(el('span','pm-ikon','⚠'));   // renk TEK BASINA tehlike degil
    bas.appendChild(document.createTextNode((tehlikeli ? ' ' : '') + baslik));
    const met = el('div','os-metin', metin); met.id = 'os' + no + 'm';
    d.setAttribute('aria-labelledby', bas.id); d.setAttribute('aria-describedby', met.id);
    d.appendChild(bas); d.appendChild(met);
    const ey = el('div','pm-ey');
    const hayir = el('button','btn2','Vazgeç');
    const evet  = el('button', tehlikeli ? 'btn-kirmizi' : 'btn', onayMetni);
    hayir.type = evet.type = 'button';
    ey.appendChild(hayir); ey.appendChild(evet);  // Vazgec SOLDA
    d.appendChild(ey); document.body.appendChild(d); d.showModal();

    let bitti = false;
    const kapat = (sonuc) => {
      if (bitti) return; bitti = true;            // Promise IKI KEZ cozulmez
      d.close(); d.remove();
      if (acan && acan.isConnected && acan.focus) acan.focus();
      else { const h = document.querySelector('#bolumSerit button.aktif')
                    || document.querySelector('#bolumSerit button'); if (h) h.focus(); }
      cevapla(sonuc);
    };
    hayir.onclick = () => kapat(false);           // olay nesnesi GECMEZ
    evet.onclick  = () => kapat(true);
    /* ⚠ (b) ESCAPE ELDE: bu Chromium'da <dialog>'un yerel `cancel` olayi
       Escape'te ATESLENMIYOR (olculdu). Escape = HAYIR. Ikisi de dinleniyor. */
    d.addEventListener('cancel', (e) => { e.preventDefault(); kapat(false); });
    d.addEventListener('keydown', (e) => {
      if (e.key === 'Escape'){ e.preventDefault(); kapat(false); return; }
      if (e.key !== 'Tab') return;                // (c) odak tuzagi
      const od = [...d.querySelectorAll('button')].filter(x => !x.disabled);
      if (!od.length) return;                     // ⚠ bos dizide od[NaN].focus() -> TypeError
      const i = od.indexOf(document.activeElement); e.preventDefault();
      od[(i + (e.shiftKey ? -1 : 1) + od.length) % od.length].focus();
    });
    hayir.focus();                                // varsayilan odak YIKICI OLMAYAN secimde
  });
}

/* ⚠ confirm() kalkinca ASYNC oldu. Uc cagirani da `() => dekontEkle(...)`
   bicimindeydi; donen Promise kullanilmiyor, davranis degismiyor. */
async function dekontEkle(tablo, id, klasor, msgId, mevcutVar, sonra){
  if (mevcutVar && !(await onaySor({
        baslik:'Belge değiştirilecek',
        metin:'Bu kayıtta zaten bir belge var. Yenisini eklersen eski belge kayıtla ilişkisiz kalır.',
        onayMetni:'Yeni belgeyi yükle', tehlikeli:true }))) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,application/pdf,.pdf';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    mesaj(msgId, 'ok', 'Belge yükleniyor...');
    try{
      const yol = await dosyaYukle(f, klasor);
      let ek = {};
      if (mevcutVar){
        const { data: eski } = await sb.from(tablo).select('aciklama,foto_path').eq('id', id).maybeSingle();
        if (eski && eski.foto_path)
          ek.aciklama = ((eski.aciklama||'') + ' [belge degistirildi ' + bugun()
                        + ', eski dosya: ' + eski.foto_path + ']').slice(0,500);
      }
      const { error } = await sb.from(tablo).update({ foto_path: yol, ...ek }).eq('id', id);
      if (error){ hataYaz(msgId, 'Belge kayda bağlanamadı.', error); return; }
      mesaj(msgId, 'ok', 'Belge eklendi.');
      if (sonra) await sonra();
    }catch(e){ hataYaz(msgId, 'Belge yüklenemedi.', e); }
    finally{ inp.remove(); }
  };
  inp.click();
}
async function belgeAc(yol, msgId){
  const { data, error } = await sb.storage.from('belgeler').createSignedUrl(yol, 300);
  if (error || !data){ hataYaz(msgId, 'Belge açılamadı.', error); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}

async function baslat(){
  surumKontrol(); setInterval(surumKontrol, 30*60*1000);
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ document.getElementById('girisEkran').classList.remove('gizli'); return; }
  const { data:p, error } = await sb.from('profil').select('*').eq('id', session.user.id).single();

    document.getElementById('girisEkran').classList.remove('gizli');
    mesaj('girisHata','hata','Profil okunamadı: ' + hataTr(error && error.message)); return;
  }
  /* OWNER KAPISI — IKINCI katman. Asil koruma RLS: bu tablolarin TEK
     politikasi auth_rol()='owner'. Buradaki kontrol ekrani bosuna
     acmamak icin; tek basina guvenlik saymaz. */
  if (!p.aktif || p.rol !== 'owner'){
    PROFIL = p;
    document.getElementById('redEkran').classList.remove('gizli');
    document.getElementById('redMetin').textContent =
      'Bu ekran işletme sahibine özeldir. Senin rolün: ' + (p.rol || 'tanımsız') + '.';
    return;
  }
  PROFIL = p;
  /* Alt çubuk uygulamanın çubuğu: yetkiler index.html ile AYNI kaynaktan
     (rol_yetki) okunur ki sekmeler iki sayfada aynı çıksın. */
  const { data: y } = await sb.from('rol_yetki').select('ekran,gorebilir').eq('rol', p.rol);
  YETKILER = {};
  (y || []).forEach(x => YETKILER[x.ekran] = { gorebilir: x.gorebilir });
  if (p.rol === 'owner') SEKMELER_TUM.forEach(t => YETKILER[t.id] = { gorebilir: true });
  document.getElementById('girisEkran').classList.add('gizli');
  document.getElementById('uygulama').classList.remove('gizli');
  document.getElementById('kimBilgi').textContent = (p.ad || '') + ' · Borç';
  uygulamaCubuguKur();
  /* D3 · Hash ile bölüm açma — index.html'deki kalıbın AYNISI (bkz. baslat()).
     index.html'den gelen "Takvim" bağlantısı borc.html#takvim'e gidiyordu ama
     burada hash HİÇ OKUNMUYORDU; doğru yere gitmesinin tek sebebi Takvim'in
     varsayılan olmasıydı. Varsayılan değişse bağlantı SESSİZCE başka yere
     giderdi. ⚠ Hash KULLANICI GİRDİSİDİR: yalnız bilinen beş bölüm kabul
     edilir, başkası sessizce varsayılana düşer. Bilinen bölümler ELLE
     listelenmiyor, bölüm şeridinin KENDİSİNDEN okunuyor — iki liste tutmak
     iki listenin ayrışması demek. */
  const BOLUMLER = [...document.querySelectorAll('#bolumSerit button[data-b]')].map(b => b.dataset.b);
  /* ⚠ FAZ 2b·E · hash artik "takvim/2026-08-18" olabilir. Bolum cozumu
     ILK PARCAYA bakiyor — eski davranis AYNEN duruyor, ikinci parca
     yoksa hicbir sey degismiyor. Gun de KULLANICI GIRDISIDIR:
     yalniz YYYY-AA-GG bicimi kabul edilir. */
  const parcali = decodeURIComponent((location.hash || '').slice(1)).split('/');
  const istenen = parcali[0];
  if (parcali[1] && /^\d{4}-\d{2}-\d{2}$/.test(parcali[1])) TAKVIM_GUN = parcali[1];
  await ekranAc(BOLUMLER.includes(istenen) ? istenen : EKRAN);
}
async function surumKontrol(){
  try{
    const y = await fetch(location.pathname+'?s='+Date.now(), {cache:'no-store', headers:{'Range':'bytes=0-3000'}});
    if (!y.ok && y.status !== 206) return;
    const m = (await y.text()).match(/name="surum"\s+content="([^"]+)"/);
    if (m && m[1] !== SURUM && !document.getElementById('surumBar')){
      const d = el('div'); d.id = 'surumBar';
      d.appendChild(el('span', null, 'Yeni sürüm var (' + m[1] + '). Eski sürümde yanlış kayıt yapabilirsin.'));
      const b = el('button', null, 'YENİLE');
      b.onclick = () => location.replace(location.pathname + '?v=' + Date.now());
      d.appendChild(b); document.body.appendChild(d);
      altCubukOlc();               // AC-02 · surum cubugu sekmeBar'dan YUKSEK (84px olculdu)
    }
  }catch(e){ /* ag yoksa sessiz */ }
}

function krediOzet(taksitler){
  let kalanKurus=0, kalanAdet=0, sonrakiVade=null, gecmis=0, dekontEksik=0, kismi=0;
  /* ⚠ EKLENENLER · ekranin cevaplamasi gereken soru "sirada ne var, ne
     kadar, ne zaman". Bugun bu bilgi listede kayboluyordu.
       anaparaKurus   : KALAN ANAPARA — nominal DEGIL. Ikisi ayri sey:
                        nominal gelecek faizi de tasir, anapara "bugun
                        kapatsam ne oderim"in cevabidir.
       kirilimsizAdet : anapara/faiz kirilimi GIRILMEMIS taksit sayisi.
                        Bunlar anaparaya KATILMAZ, uydurulmaz — kac tane
                        oldugu ekranda YAZILIR (bantVerisi'nin kalibi).
       sonraki        : en yakin vadeli ODENMEMIS taksitin KENDISI.
                        Gecikmis varsa SIRADAKI ODUR — "gelecekteki ilk
                        taksit" demek, geciken borcu sirada saymamak olurdu.
       odenenAdet     : kapali taksit sayisi (detayda katlanan kisim). */
  let anaparaKurus=0, kirilimsizAdet=0, odenenAdet=0, sonraki=null;
  const b = bugun();
  for (const t of taksitler){
    dekontEksik += Number(t.dekontsuz_odeme) || 0;
    if (t.durum === 'kapali'){ odenenAdet++; continue; }
    kalanKurus += kr(t.kalan); kalanAdet++;
    if (t.anapara_tutar === null || t.anapara_tutar === undefined) kirilimsizAdet++;
    else anaparaKurus += kr(t.anapara_tutar) - kr(t.anapara_odenen || 0);
    if (t.durum === 'kismi') kismi++;
    if (t.vade_tarihi < b) gecmis++;
    if (!sonrakiVade || t.vade_tarihi < sonrakiVade){ sonrakiVade = t.vade_tarihi; sonraki = t; }
  }
  return { kalanKurus, kalanAdet, sonrakiVade, gecmis, dekontEksik, kismi,
           anaparaKurus, kirilimsizAdet, odenenAdet, sonraki,
           toplamAdet: taksitler.length };
}
/* Sıradaki taksitin tek satirlik ozeti — liste ve detay AYNI cumleyi
   kursun diye tek yerde. Gecikmisse gun sayisi GECTI olarak yazilir. */
function sonrakiTaksitMetni(t, b){
  if (!t) return null;
  const gec = t.vade_tarihi < b;
  const gun = gec ? gunFarki(b, t.vade_tarihi) : gunFarki(t.vade_tarihi, b);
  return { tarih: trGun(t.vade_tarihi), tutar: tl(t.kalan), gecikti: gec,
    gun, gunMetni: gec ? gun + ' gün geçti' : gun === 0 ? 'bugün' : gun + ' gün kaldı' };
}
/* Verilen tarihte GECERLI fiyat: o tarihten SONRAKI fiyatlar sayilmaz. */
function fiyatAsOf(fiyatlar, tur, tarih){
  const uygun = fiyatlar.filter(x => x.tur === tur && x.tarih <= tarih);
  if (!uygun.length) return null;
  return uygun.reduce((a,x) => (x.tarih > a.tarih ? x : a), uygun[0]);
}
const sonFiyat = (fiyatlar, tur) => fiyatAsOf(fiyatlar, tur, '9999-12-31');

/* Bir maden satirinin alis / bugun / fark degeri.

   ALIS DEGERI ONCELIK SIRASI:
     1. maden.alis_tutar dolu  -> OLGU. Gercekten odenen toplam budur.
     2. yoksa alis tarihindeki maden_fiyat'tan hesapla -> TAHMIN.
        Kullanicinin odedigi fiyat o gunku piyasa fiyati olmak zorunda
        DEGIL; bu yuzden ekranda "tahmini" diye ISARETLENIR.
     3. ikisi de yoksa -> BILINMIYOR. 0 gosterilmez, uydurulmaz.

   `kaynak` alani ekranin hangi durumu gosterecegini soyler. */
function madenDeger(m, fiyatlar){
  const bugunF = sonFiyat(fiyatlar, m.tur);
  const gram   = Number(m.gram) || 0;

  let alisKurus = null, kaynak = 'yok', alisF = null;
  if (m.alis_tutar !== null && m.alis_tutar !== undefined && Number(m.alis_tutar) > 0){
    alisKurus = kr(m.alis_tutar);
    kaynak = 'olgu';
  } else {
    alisF = fiyatAsOf(fiyatlar, m.tur, m.tarih);
    if (alisF){ alisKurus = Math.round(gram * kr(alisF.gram_fiyat)); kaynak = 'tahmin'; }
  }
  return {
    gram, kaynak, alisKurus, alisF, bugunF,
    bugunKurus: bugunF ? Math.round(gram * kr(bugunF.gram_fiyat)) : null
  };
}

/* ⚠ AL1 · Serit hizalamasi ADLI FONKSIYONA cikarildi. Olculdu: kullanici
   "borcta krediler sekmesi yok" dedi — sekme VARDI, serit yana kaymisti,

   #icerik'i CIZMIYOR, diyalog acikken inert yapiyor — dokunulmadi.
   Bu iki ekrana girince serit onceki kaydirmada kaliyordu.
   ⚠ Pay artik SABIT DEGIL: kabin kendi padding'i okunuyor. Kodda 8
   yazdigi surece dugme, kabin IC kenarindan 5px disarida kaliyor ve
   yuvarlak kosesi kirpik gorunuyordu (serit padding'i 13px). Sayiyi
   koda gomersek CSS degisince sessizce yanlislasir.
   ⚠ KURAL "gorunur alana getir" DEGIL, "EN SOLA CEK". Olculdu ve ilk

   kaydiginda (scrollLeft 86 = azami), sonra Kartlar'a donuyor; Kartlar
