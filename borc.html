        tr.appendChild(td(tl(d.duzeltme),'sag'));
        tr.appendChild(td(tl(d.odenen),'sag'));
        const kh = td(tl(d.kalan),'sag'); kh.style.fontWeight = '900'; tr.appendChild(kh);
        const eh = document.createElement('td');
        if (d.foto_path){
          const a = el('button','btn-mini','Aç');
          a.onclick = () => belgeAc(d.foto_path,'kartMsg');
          eh.appendChild(a);
        } else {
          eh.appendChild(el('span','rozet rz-sari','EKSTRE EKSİK'));
        }
        tr.appendChild(eh);
        const ey = document.createElement('td');
        const be = el('button','btn-mini', d.foto_path ? 'Değiştir' : '+ Ekstre');
        be.onclick = () => dekontEkle('kart_donem', d.donem_id, 'kart_ekstre','kartMsg',
                                      !!d.foto_path, () => kartDetayAc(kartId));
        ey.appendChild(be); tr.appendChild(ey);
        t.appendChild(tr);
      }
      sar.appendChild(t); k.appendChild(sar);
      k.appendChild(el('div','kucuk',
        'KALAN = devir + yeni harcama + düzeltme − ödenen. Ayrı bir sütunda tutulmaz, '
      + 'girdilerden hesaplanır; böylece girdilerle ayrışamaz.'));
      const tut = liste.filter(d => d.devir_tutarsiz);
      if (tut.length)
        k.appendChild(el('div','uyari-agir',
          tut.length + ' dönemde devir, önceki ayın kalanına eşit değil: '
          + tut.map(d => d.donem).join(', ')
          + '. Ya bir ay eksik ya da bir rakam yanlış girilmiş.'));
    }
    c.appendChild(k);
  }catch(e){
    c.textContent = '';
    c.appendChild(el('div','uyari-agir','Kart açılamadı: ' + hataTr(e && e.message)));
  }
}

function donemFormu(kart, liste){
  const k = el('div','kart');
  k.appendChild(el('div','kbaslik','Yeni ay ekle'));

  const alan = (etiket, id, deger, mod) => {
    k.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input');
    i.id = id; i.type = 'text';
    if (deger !== undefined && deger !== null) i.value = deger;
    if (mod) i.setAttribute('inputmode', mod);
    k.appendChild(i); return i;
  };

  k.appendChild(el('label', null, 'Dönem (YYYY-AA)')).setAttribute('for','kdDonem');
  const dn = document.createElement('input');
  dn.id = 'kdDonem'; dn.type = 'month'; dn.value = bugun().slice(0,7);
  k.appendChild(dn);

  const dv = alan('Devir (geçen aydan kalan)', 'kdDevir', '', 'decimal');
  const ipucu = el('div','kucuk'); ipucu.id = 'kdIpucu'; k.appendChild(ipucu);

  /* Donem secilince devir ONCEKI DONEMIN KALANIYLA on doldurulur.
     Kullanici degistirebilir; degistirir ve zincir kirilirsa asagidaki
     uyari cikar — sessizce gecilmez. */
  const onDoldur = () => {
    const d = dn.value;
    const onceki = liste.filter(x => x.donem < d).sort((a,b) => b.donem.localeCompare(a.donem))[0];
    if (onceki){
      dv.value = (kr(onceki.kalan)/100).toFixed(2).replace('.', ',');
      ipucu.textContent = onceki.donem + ' kalanı ' + tl(onceki.kalan) + ' — devir olarak dolduruldu.';
    } else {
      ipucu.textContent = 'Bu dönemden önce kayıt yok; devir bilinen açılış tutarıdır.';
    }
    zinciriDenetle();
  };
  const zinciriDenetle = () => {
    const d = dn.value;
    const onceki = liste.filter(x => x.donem < d).sort((a,b) => b.donem.localeCompare(a.donem))[0];
    const u = document.getElementById('kdZincir');
    if (!u) return;
    if (!onceki){ u.className = 'kucuk'; u.textContent = ''; return; }
    const g = paraCoz(dv.value);
    if (!g.ok){ u.className = 'kucuk'; u.textContent = ''; return; }
    if (g.kurus !== kr(onceki.kalan)){
      u.className = 'uyari-agir';
      u.textContent = 'DEVİR TUTMUYOR: ' + onceki.donem + ' kalanı ' + tl(onceki.kalan)
        + ', sen ' + tlk(g.kurus) + ' yazdın. Kaydedilir ama listede işaretli kalır.';
    } else { u.className = 'kucuk'; u.textContent = ''; }
  };
  dn.onchange = onDoldur;
  dv.oninput = zinciriDenetle;

  alan('Yeni harcama', 'kdYeni', '', 'decimal');
  alan('Düzeltme (iade/indirim eksi yazılır)', 'kdDuzeltme', '', 'decimal');
  alan('Ödenen', 'kdOdenen', '', 'decimal');
  const zn = el('div','kucuk'); zn.id = 'kdZincir'; k.appendChild(zn);

  const on = el('button','btn2','Kalanı hesapla (kaydetme)');
  on.onclick = () => donemOnizle(kart, liste, false);
  const kay = el('button','btn','Ayı kaydet'); kay.id = 'kdKaydet';
  kay.onclick = () => donemOnizle(kart, liste, true);
  k.appendChild(on); k.appendChild(kay);
  const ov = el('div'); ov.id = 'kdOnizleme'; k.appendChild(ov);

  setTimeout(onDoldur, 0);   // ilk acilista da doldur
  return k;
}

function donemSatiriUret(kart){
  const donem = document.getElementById('kdDonem').value;
  if (!/^\d{4}-\d{2}$/.test(donem || '')) return { ok:false, hata:'Dönem YYYY-AA biçiminde olmalı.' };
  const oku = (id, etiket, eksiOlabilir) => {
    const r = paraCoz(document.getElementById(id).value);
    if (!r.ok) return { ok:false, hata: etiket + ': ' + r.hata };
    if (!eksiOlabilir && r.kurus < 0) return { ok:false, hata: etiket + ' eksi olamaz.' };
    return r;
  };
  const dev = oku('kdDevir','Devir', false);       if (!dev.ok) return dev;
  const yen = oku('kdYeni','Yeni harcama', false); if (!yen.ok) return yen;
  const odn = oku('kdOdenen','Ödenen', false);     if (!odn.ok) return odn;
  /* Duzeltme EKSI olabilir — paraCoz eksi isareti okumaz, ayrica bakiyoruz */
  const dzH = document.getElementById('kdDuzeltme').value.trim();
  const eksi = /^\s*-/.test(dzH);
  const dzR = paraCoz(dzH);
  if (!dzR.ok) return { ok:false, hata:'Düzeltme: ' + dzR.hata };
  const dzKurus = eksi ? -dzR.kurus : dzR.kurus;

  const kalan = dev.kurus + yen.kurus + dzKurus - odn.kurus;
  return { ok:true, donem, kalan,
    satir: { kart_id: kart.id, donem,
      devir:(dev.kurus/100).toFixed(2), yeni_harcama:(yen.kurus/100).toFixed(2),
      duzeltme:(dzKurus/100).toFixed(2), odenen:(odn.kurus/100).toFixed(2),
      giren_id: PROFIL ? PROFIL.id : null } };
}

async function donemOnizle(kart, liste, kaydet){
  mesajTemizle('kartMsg');
  const r = donemSatiriUret(kart);
  const ov = document.getElementById('kdOnizleme');
  ov.textContent = '';
  if (!r.ok){ mesaj('kartMsg','hata', r.hata); return; }

  ov.appendChild(el('div','bilgi',
    r.donem + ' · KALAN = devir + yeni + düzeltme − ödenen = ' + tlk(r.kalan)));

  const onceki = liste.filter(x => x.donem < r.donem).sort((a,b) => b.donem.localeCompare(a.donem))[0];
  if (onceki && kr(r.satir.devir) !== kr(onceki.kalan))
    ov.appendChild(el('div','uyari-agir',
      'Devir tutmuyor: ' + onceki.donem + ' kalanı ' + tl(onceki.kalan)
      + ', girilen devir ' + tl(r.satir.devir) + '. Kaydedilir ama listede işaretli kalır.'));

  if (!kaydet) return;

  const btn = document.getElementById('kdKaydet');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kart_donem').insert(r.satir);
  btn.disabled = false; btn.textContent = 'Ayı kaydet';
  if (error){ hataYaz('kartMsg','Ay kaydedilemedi.', error); return; }
  mesaj('kartMsg','ok', r.donem + ' kaydedildi. Ekstreyi eklemeyi unutma.');
  await kartDetayAc(kart.id);
}

async function vMaden(){
  const c = document.getElementById('icerik');

  /* fiyat yasi rozeti */

    const yas = gunFarki(bugun(), f.tarih);
    const ad = yas === 0 ? 'bugün' : yas === 1 ? 'dün' : yas + ' gün önce';
    return el('span', 'rozet ' + (yas <= 1 ? 'rz-yesil' : yas > 7 ? 'rz-sari' : 'rz-yesil'), ad);
  };

  const k = el('div','kart');
  k.appendChild(el('div','kbaslik','Altın / gümüş borçları'));
  if (!kayitlar.length) k.appendChild(el('div','bos','Kayıtlı altın/gümüş yok.'));
  else {
    const sar = el('div','tablo-sar');
    const t = document.createElement('table');
    const hr = document.createElement('tr');
    ['TÜR','GRAM','KİME','ALIŞ GÜNÜ','ALIŞ DEĞERİ','BUGÜNKÜ DEĞER','FARK',''].forEach((h,i) =>
      hr.appendChild(el('th', (i>=4 && i<=6) ? 'sag' : null, h)));
    t.appendChild(hr);
    for (const m of kayitlar){
      const d = madenDeger(m, fiyatlar);
      const tr = document.createElement('tr');
      tr.appendChild(td(m.tur === 'altin' ? 'Altın' : 'Gümüş'));
      tr.appendChild(td(gramYaz(m.gram)));
      tr.appendChild(td(m.kime));                        // textContent
      tr.appendChild(td(trGun(m.tarih)));
      /* alis degeri: OLGU / TAHMIN / BILINMIYOR — hangisi oldugu yaziyor */
      const ah = document.createElement('td'); ah.className = 'sag';
      if (d.alisKurus === null){
        ah.appendChild(el('span','gri','bilinmiyor'));
      } else if (d.kaynak === 'tahmin'){
        ah.appendChild(el('span', null, tlk(d.alisKurus) + ' '));
        ah.appendChild(el('span','rozet rz-sari','tahmini'));
      } else {
        ah.appendChild(el('span', null, tlk(d.alisKurus)));
      }
      tr.appendChild(ah);
      tr.appendChild(td(d.bugunKurus === null ? 'hesaplanamaz' : tlk(d.bugunKurus), 'sag'));
      const fh = document.createElement('td'); fh.className = 'sag';
      if (d.alisKurus === null || d.bugunKurus === null){
        fh.textContent = '—';
      } else {
        const fark = d.bugunKurus - d.alisKurus;
        fh.textContent = (fark >= 0 ? '+' : '−') + tlk(Math.abs(fark));
        fh.style.color = fark > 0 ? 'var(--hata)' : fark < 0 ? 'var(--ok)' : '';
        fh.style.fontWeight = '900';
      }
      tr.appendChild(fh);
      const ey = document.createElement('td');
      ey.appendChild(digerMenu([['Maden borcunu pasife al', (a) => madenSil(m, a, d.bugunKurus === null ? null : tlk(d.bugunKurus))]]));
      tr.appendChild(ey);
      t.appendChild(tr);
    }
    sar.appendChild(t); k.appendChild(sar);
    k.appendChild(el('div','kucuk',
      'Fark KIRMIZI ise borç büyümüş demektir: bugün almak, aldığın güne göre daha pahalı.\n'
    + '"tahmini" rozeti: alış tutarı girilmemiş, o tarihteki gram fiyatından hesaplandı — '
    + 'gerçekte ödediğin tutar farklı olabilir. Kesin rakam için alış tutarını gir.'));
    if (v.alisiYok > 0)
      k.appendChild(el('div','uyari-orta', v.alisiYok
        + ' kayıtta alış değeri bilinmiyor — alış tutarını gir ya da o tarihe ait gram fiyatı ekle.'));
  }
  c.appendChild(k);

  /* guncel fiyat durumu */
  const fk = el('div','kart');
  fk.appendChild(el('div','kbaslik','Güncel gram fiyatı'));
  for (const tur of ['altin','gumus']){
    const ad = tur === 'altin' ? 'Altın' : 'Gümüş';
    const f = sonFiyat(fiyatlar, tur);
    const s = el('div','satir');
    s.appendChild(el('span','et', ad));
    const sag = el('span','dg');
    if (!f){ sag.textContent = 'fiyat girilmedi'; }
    else {
      sag.appendChild(el('span', null, tl(f.gram_fiyat) + '/gr '));
      sag.appendChild(fiyatRozeti(f));
    }
    s.appendChild(sag); fk.appendChild(s);
    if (f && gunFarki(bugun(), f.tarih) > 7)
      fk.appendChild(el('div','uyari-orta', ad + ' fiyatı ' + gunFarki(bugun(), f.tarih) + ' gün önceki — güncelle.'));
  }
  c.appendChild(fk);

  /* formlar */
  const f1 = el('div','kart');
  f1.appendChild(el('div','kbaslik','Altın / gümüş ekle'));
  f1.appendChild(el('label', null, 'Tür')).setAttribute('for','mTur');
  const s1 = document.createElement('select'); s1.id = 'mTur';
  [['altin','Altın'],['gumus','Gümüş']].forEach(([val,t]) => {
    const o = document.createElement('option'); o.value = val; o.textContent = t; s1.appendChild(o); });
  f1.appendChild(s1);
  const ek1 = (etiket,id,tip,mod) => {
    f1.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input'); i.id = id; i.type = tip || 'text';
    if (mod) i.setAttribute('inputmode', mod);
    f1.appendChild(i); return i;

  ek1('Gram','mGram','text','decimal');
  ek1('Kime','mKime','text');
  ek1('Alış tarihi','mTarih','date').value = bugun();
  ek1('Alış tutarı (TL) — zorunlu değil','mAlis','text','decimal');
  f1.appendChild(el('div','kucuk',
    'Alış tutarı = bu borç için GERÇEKTEN ödenen toplam. Karma alımda (kesme + gram + '
  + 'sikke, ayrı birim fiyatlar) ortalama gram fiyatı gerçek ödemeyi tutmaz; ödenen '
  + 'toplamı yaz.\nBoş bırakırsan alış değeri, o tarihteki gram fiyatından TAHMİN '
  + 'edilir ve "tahmini" diye işaretlenir. O tarihe ait fiyat da yoksa "bilinmiyor" yazar.'));
  const b1 = el('button','btn','Kaydet'); b1.id = 'mKaydet'; b1.onclick = madenKaydet;
  f1.appendChild(b1); c.appendChild(f1);

  const f2 = el('div','kart');
  f2.appendChild(el('div','kbaslik','Gram fiyatı gir'));
  f2.appendChild(el('div','kucuk','Fiyat elle girilir ve TARİHLİDİR. Aynı tür için aynı tarihe ikinci fiyat girilemez. Geçmiş tarihli fiyat da girilebilir — alış değerleri böyle hesaplanır.'));
  f2.appendChild(el('label', null, 'Tür')).setAttribute('for','fTur');
  const s2 = document.createElement('select'); s2.id = 'fTur';
  [['altin','Altın'],['gumus','Gümüş']].forEach(([val,t]) => {
    const o = document.createElement('option'); o.value = val; o.textContent = t; s2.appendChild(o); });
  f2.appendChild(s2);
  const ek2 = (etiket,id,tip,mod) => {
    f2.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input'); i.id = id; i.type = tip || 'text';
    if (mod) i.setAttribute('inputmode', mod);
    f2.appendChild(i); return i;
  };
  ek2('Gram fiyatı','fFiyat','text','decimal');
  ek2('Tarih','fTarih','date').value = bugun();
  ek2('Kaynak notu','fKaynak','text');
  const b2 = el('button','btn','Fiyatı kaydet'); b2.id = 'fKaydet'; b2.onclick = fiyatKaydet;
  f2.appendChild(b2); c.appendChild(f2);

  if (fiyatlar.length){
    const fl = el('div','kart');
    fl.appendChild(el('div','kbaslik','Fiyat geçmişi'));
    const sar = el('div','tablo-sar');
    const t = document.createElement('table');
    const hr = document.createElement('tr');
    ['TÜR','GRAM FİYATI','TARİH','KAYNAK'].forEach((h,i) => hr.appendChild(el('th', i===1?'sag':null, h)));
    t.appendChild(hr);
    for (const f of fiyatlar.slice(0,30)){
      const tr = document.createElement('tr');
      tr.appendChild(td(f.tur === 'altin' ? 'Altın' : 'Gümüş'));
      tr.appendChild(td(tl(f.gram_fiyat),'sag'));
      tr.appendChild(td(trGun(f.tarih)));
      tr.appendChild(td(f.kaynak_notu || '—'));          // textContent
      t.appendChild(tr);
    }
    sar.appendChild(t); fl.appendChild(sar); c.appendChild(fl);
  }
}

async function madenKaydet(){
  mesajTemizle('madenMsg');
  const btn = document.getElementById('mKaydet');
  const g = gramCoz(document.getElementById('mGram').value);
  const kime = document.getElementById('mKime').value.trim();
  const tarih = document.getElementById('mTarih').value;
  if (!g.ok)  return mesaj('madenMsg','hata', g.hata);
  if (!kime)  return mesaj('madenMsg','hata','"Kime" zorunlu.');
  if (!tarih) return mesaj('madenMsg','hata','Alış tarihi zorunlu.');

  /* alis_tutar ZORUNLU DEGIL. Yazildiysa 0'dan buyuk olmali —
     maden_alis_tutar_chk'i ekranda da uygula, sunucuya hatali satir gitmesin. */
  const alisH = document.getElementById('mAlis').value.trim();
  let alisTutar = null;
  if (alisH){
    const a = paraCoz(alisH);
    if (!a.ok)         return mesaj('madenMsg','hata','Alış tutarı: ' + a.hata);
    if (a.kurus <= 0)  return mesaj('madenMsg','hata','Alış tutarı sıfırdan büyük olmalı. Bilinmiyorsa BOŞ bırak — 0 yazma.');
    alisTutar = (a.kurus/100).toFixed(2);
  }

  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('maden').insert({
    tur: document.getElementById('mTur').value,
    gram: g.deger.toFixed(3), kime, tarih,
    alis_tutar: alisTutar,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Kaydet';
  if (error){ hataYaz('madenMsg','Kayıt eklenemedi.', error); return; }
  mesaj('madenMsg','ok','Kayıt eklendi.');
  await vMaden();
}

async function fiyatKaydet(){
  mesajTemizle('madenMsg');
  const btn = document.getElementById('fKaydet');
  const p = paraCoz(document.getElementById('fFiyat').value);
  const tarih = document.getElementById('fTarih').value;
  if (!p.ok)        return mesaj('madenMsg','hata','Gram fiyatı: ' + p.hata);
  if (p.kurus <= 0) return mesaj('madenMsg','hata','Gram fiyatı sıfırdan büyük olmalı.');
  if (!tarih)       return mesaj('madenMsg','hata','Fiyat tarihi zorunlu.');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('maden_fiyat').insert({
    tur: document.getElementById('fTur').value,
    gram_fiyat:(p.kurus/100).toFixed(2), tarih,
    kaynak_notu: document.getElementById('fKaynak').value.trim() || null,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Fiyatı kaydet';
  if (error){ hataYaz('madenMsg','Fiyat kaydedilemedi.', error); return; }
  mesaj('madenMsg','ok','Fiyat kaydedildi.');
  await vMaden();
}

async function madenSil(m, acan, deger){
  pasifeAlAc(acan, { tur:'Maden borcu', ad: turAdi(m.tur) + ' · ' + trGun(m.tarih),
    kim: m.saflik ? 'saflık ' + m.saflik : null, tutar: deger || null,
    uygula: async (neden) => {
      const { error } = await sb.from('maden').update({ is_deleted:true, silme_nedeni:neden }).eq('id', m.id);
      if (error) return { ok:false, mesaj: hataTr(error.message) };
      await vMaden();                     // liste SUNUCUDAN yeniden okunuyor
      mesaj('madenMsg','ok','Maden borcu pasife alındı.');
      return { ok:true };
    }});
}

/* ================== 4 · SAHIS ================== */
async function vSahis(){
  const c = document.getElementById('icerik');
  const v = await bantVerisi();
  const { borclar, odemeler } = v.sahis;
  const grup = new Map();
  for (const o of odemeler){
    if (!grup.has(o.borc_id)) grup.set(o.borc_id, []);
    grup.get(o.borc_id).push(o);
  }
  c.textContent = '';
  c.appendChild(bantCiz(v));
  const msg = el('div','msg'); msg.id = 'sahisMsg'; c.appendChild(msg);

  const k = el('div','kart');
  k.appendChild(el('div','kbaslik','Şahıs borçları'));
  if (!borclar.length) k.appendChild(el('div','bos','Kayıtlı şahıs borcu yok.'));

  for (const b of borclar){
    const od = grup.get(b.id) || [];
    const odenen = od.reduce((s,x) => s + kr(x.tutar), 0);
    const kalan = kr(b.tutar) - odenen;

    const kart = el('div','tk');
    const ust = el('div','tk-ust');
    ust.appendChild(el('div','tk-ad', b.isim));            // textContent
    ust.appendChild(el('div','tk-tutar', tlk(Math.max(0, kalan))));
    kart.appendChild(ust);
    kart.appendChild(el('div','tk-orta',
      'borç ' + tl(b.tutar) + ' · ' + trGun(b.tarih) + ' · ödenen ' + tlk(odenen) + ' (' + od.length + ')'));
    if (kalan < 0) kart.appendChild(el('div','uyari-orta','Ödemeler borçtan fazla: ' + tlk(-kalan) + ' fazla ödenmiş.'));
    if (b.aciklama) kart.appendChild(el('div','kucuk', b.aciklama));

    if (od.length){
      const sar = el('div','tablo-sar');
      const t = document.createElement('table');
      const hr = document.createElement('tr');
      ['TARİH','TUTAR','BELGE',''].forEach((h,i) => hr.appendChild(el('th', i===1?'sag':null, h)));
      t.appendChild(hr);
      for (const o of od){
        const tr = document.createElement('tr');
        tr.appendChild(td(trGun(o.tarih)));
        tr.appendChild(td(tl(o.tutar),'sag'));
        const dk = document.createElement('td');
        if (o.foto_path){
          const a = el('button','btn-mini','Aç');
          a.onclick = () => belgeAc(o.foto_path,'sahisMsg');
          dk.appendChild(a);
        } else { dk.appendChild(el('span','gri','belge yok')); }
        tr.appendChild(dk);
        const ey = document.createElement('td');
        const bd = el('button','btn-mini', o.foto_path ? 'Değiştir' : '+ Belge');
        bd.onclick = () => dekontEkle('sahis_odeme', o.id, 'sahis_odeme','sahisMsg', !!o.foto_path, () => vSahis());
        ey.appendChild(bd); tr.appendChild(ey);
        t.appendChild(tr);
      }
      sar.appendChild(t); kart.appendChild(sar);
    }
    const ey = el('div','tk-eylem');
    const bo = el('button','btn2','Ödeme ekle'); bo.onclick = () => sahisOdemeEkle(b);
    ey.appendChild(bo);
    ey.appendChild(digerMenu([['Şahıs borcunu pasife al', (a) => sahisBorcSil(b, a)]]));
    kart.appendChild(ey);
    k.appendChild(kart);
  }
  c.appendChild(k);

  const f = el('div','kart');
  f.appendChild(el('div','kbaslik','Yeni şahıs borcu'));
  const ekle = (etiket,id,tip,mod) => {
    f.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input'); i.id = id; i.type = tip || 'text';
    if (mod) i.setAttribute('inputmode', mod);
    f.appendChild(i); return i;
  };
  ekle('Kime (isim)','sbIsim','text');
  ekle('Tutar','sbTutar','text','decimal');
  ekle('Tarih','sbTarih','date').value = bugun();
  f.appendChild(el('label', null, 'Açıklama')).setAttribute('for','sbAciklama');
  const ta = document.createElement('textarea'); ta.id = 'sbAciklama'; f.appendChild(ta);
  const bk = el('button','btn','Borcu kaydet'); bk.id = 'sbKaydet'; bk.onclick = sahisBorcKaydet;
  f.appendChild(bk); c.appendChild(f);
}

async function sahisBorcKaydet(){
  mesajTemizle('sahisMsg');
  const btn = document.getElementById('sbKaydet');
  const isim = document.getElementById('sbIsim').value.trim();
  const tarih = document.getElementById('sbTarih').value;
  const tut = paraCoz(document.getElementById('sbTutar').value);
  if (!isim)  return mesaj('sahisMsg','hata','İsim zorunlu.');
  if (!tarih) return mesaj('sahisMsg','hata','Tarih zorunlu.');
  if (!tut.ok) return mesaj('sahisMsg','hata','Tutar: ' + tut.hata);
  if (tut.kurus <= 0) return mesaj('sahisMsg','hata','Tutar sıfırdan büyük olmalı.');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('sahis_borc').insert({
    isim, tutar:(tut.kurus/100).toFixed(2), tarih,
    aciklama: document.getElementById('sbAciklama').value.trim() || null,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Borcu kaydet';
  if (error){ hataYaz('sahisMsg','Borç kaydedilemedi.', error); return; }
  mesaj('sahisMsg','ok','Borç kaydedildi.');
  await vSahis();
}

async function sahisOdemeEkle(borc){
  const tutarH = prompt('Ödeme tutarı:');
  if (tutarH === null) return;
  const t = paraCoz(tutarH);
  if (!t.ok || t.kurus <= 0){ mesaj('sahisMsg','hata','Ödeme tutarı geçersiz. Kayıt YAPILMADI.'); return; }
  const tarihH = prompt('Ödeme tarihi (YYYY-AA-GG):', bugun());
  if (tarihH === null) return;
  const tarih = (tarihH || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tarih)){
    mesaj('sahisMsg','hata','Tarih YYYY-AA-GG biçiminde olmalı. Kayıt YAPILMADI.'); return;
  }
  const { error } = await sb.from('sahis_odeme').insert({
    borc_id: borc.id, tutar:(t.kurus/100).toFixed(2), tarih,
    giren_id: PROFIL ? PROFIL.id : null });
  if (error){ hataYaz('sahisMsg','Ödeme kaydedilemedi.', error); return; }
  mesaj('sahisMsg','ok','Ödeme kaydedildi. Belge eklemeyi unutma.');
  await vSahis();
}

async function sahisBorcSil(borc, acan){
  pasifeAlAc(acan, { tur:'Şahıs borcu', ad: borc.isim, kim: trGun(borc.tarih) + ' tarihli',
    tutar: tl(borc.tutar),
    uygula: async (neden) => {
      const { error } = await sb.from('sahis_borc').update({ is_deleted:true, silme_nedeni:neden }).eq('id', borc.id);
      if (error) return { ok:false, mesaj: hataTr(error.message) };
      await vSahis();                     // liste SUNUCUDAN yeniden okunuyor
      mesaj('sahisMsg','ok','Şahıs borcu pasife alındı.');
      return { ok:true };
    }});
}

/* ================== ACILIS ================== */

baslat().catch(e => {
  document.getElementById('girisEkran').classList.remove('gizli');
  mesaj('girisHata','hata','Açılış hatası: ' + hataTr(e && e.message));
});
</script>
