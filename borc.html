<style>
/* =====================================================================
   BORC TAKIP — index.html'den BAGIMSIZ dosya.
   Kullanicinin karari: index.html 415 KB; borc modulu onu buyutmesin ve
   buradaki bir hata gunluk ekranlari vurmasin.

   ⚠ MOBIL (index.html M-1 bulgusu): iOS, 16px ALTINDAKI bir alana
     odaklaninca sayfayi zumler ve GERI CIKMAZ. Bu dosyada
     input/select/textarea font-size'i 16px'in ALTINA ASLA inmez.
   ===================================================================== */
:root{--ana:#2456A0;--ana-koyu:#183F78;--acik:#EBF0FA;--gri:#FAF4E3;--kart:#FFFEF8;
  --metin:#1F3354;--soluk:#8189A0;--hata:#B3402F;--uyari:#C77B2B;--ok:#2E7D4F;--cizgi:#E7DEC8}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--gri);color:var(--metin);font-size:15px;padding-bottom:80px}
.gizli{display:none!important}

input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--cizgi);border-radius:9px;
  font-size:16px;background:#fff;color:var(--metin);font-family:inherit;min-height:46px}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:13px;font-weight:800;margin:12px 0 5px;color:var(--soluk)}

button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;font-weight:800}
.btn{width:100%;padding:14px;background:var(--ana);color:#fff;font-size:16px;min-height:48px;margin-top:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn2{padding:0 15px;min-height:44px;background:var(--acik);color:var(--ana);font-size:14px}
.btn-kirmizi{padding:0 15px;min-height:44px;background:#fdeceb;color:var(--hata);font-size:14px}
.btn-mini{padding:0 12px;min-height:44px;background:var(--acik);color:var(--ana);font-size:14px}

/* ⚠ KABUK KURALLARI · index.html'den BİREBİR KOPYA — başlangıç.
   Amaç: üst ve alt çubuk iki sayfada AYNI görünsün; kullanıcı ayrı bir
   siteye geçtiğini hissetmesin. Kopya olduğu için AYRIŞMA RİSKİ var;
   araclar/kalip-tara.mjs iki dosyayı karşılaştırıp uyarıyor. */
#ustBar{background:var(--kart);color:var(--ana);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;border-bottom:1.5px solid var(--cizgi)}
#ustBar .ad{font-weight:900;font-size:18px;letter-spacing:-0.5px;line-height:1.1}
#ustBar .ad .kmp{font-family:'Caveat',cursive;font-weight:600;font-size:15px;letter-spacing:0;margin-left:4px}
#ustBar .kim{font-size:11.5px;color:var(--soluk);font-weight:600}
#cikisBtn{background:var(--acik);color:var(--ana);padding:7px 12px;font-size:12.5px}
main{padding:14px;max-width:640px;margin:0 auto}

#sekmeBar{position:fixed;bottom:0;left:0;right:0;background:var(--kart);
  border-top:1.5px solid var(--cizgi);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0)}
#sekmeBar button{flex:1;min-width:0;padding:7px 2px 6px;background:none;color:var(--soluk);
  font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;
  border-top:2.5px solid transparent;position:relative;min-height:52px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sekmeBar button.aktif{color:var(--ana);border-top-color:var(--ana)}
#sekmeBar button.sk-gizli{display:none}
#sekmeBar .iko{width:21px;height:21px}
#sekmeBar .iko svg{width:100%;height:100%}
#dahaOv{position:fixed;inset:0;z-index:60;background:rgba(28,24,18,.55);display:none;
  align-items:flex-end}
#dahaOv.acik{display:flex}
#dahaKutu{background:var(--kagit);width:100%;border-radius:20px 20px 0 0;
  padding:8px 0 calc(18px + env(safe-area-inset-bottom,0));
  box-shadow:0 -8px 28px rgba(28,24,18,.28);border-top:1px solid var(--cizgi)}
#dahaKutu::before{content:'';display:block;width:38px;height:4px;border-radius:3px;
  background:var(--cizgi);margin:2px auto 6px}
#dahaKutu .db-bas{font-size:11px;font-weight:900;letter-spacing:.8px;color:var(--soluk);padding:12px 20px 8px}
#dahaKutu button{width:100%;display:flex;align-items:center;gap:14px;padding:0 20px;min-height:54px;
  background:none;color:var(--metin);font-size:15px;font-weight:800;text-align:left;position:relative}
#dahaKutu button .iko{width:22px;height:22px;flex:none;color:var(--ana)}
#dahaKutu button .iko svg{width:100%;height:100%}
#dahaKutu button.aktif{color:var(--ana);background:var(--acik)}

/* Borç'un KENDİ bölümleri — üstte yatay şerit. Alt çubuk uygulamanın,
   bu şerit bu ekranın; ikisi karışmasın diye ayrı biçimde. */
#bolumSerit{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:10px 13px;background:var(--kart);border-bottom:1.5px solid var(--cizgi);
  position:sticky;top:52px;z-index:40;scrollbar-width:none}
#bolumSerit::-webkit-scrollbar{display:none}
#bolumSerit button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;
  background:var(--gri);color:var(--soluk);font-size:14px;font-weight:800;
  border:1.5px solid var(--cizgi);white-space:nowrap}
#bolumSerit button.aktif{background:var(--ana);color:#fff;border-color:var(--ana)}

.kart{background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;padding:15px;margin-bottom:13px}
.kbaslik{font-size:17px;font-weight:900;margin:0 0 12px;overflow-wrap:anywhere}
.satir{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--cizgi)}
.satir:last-child{border-bottom:none}
.satir .et{color:var(--soluk);font-size:14px;min-width:0;overflow-wrap:anywhere}
.satir .dg{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- UST OZET BANDI ----
   ESKI: 2x2 dort buyuk kutu, 375px'te 288px = ekranin %35'i. Ustelik
   "TOPLAM BORC" tek kutusu anapara + gelecek faiz + rayic maden degerini
   TEK sayida topluyordu.
   YENI: tek kart, sinifina ayrilmis satirlar. Kutu EKLENMEDI — satir
   yuksekligi kucultuldu ki uc-dort rakam gosterirken bant BUYUMESIN. */
.bant{background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;
  padding:9px 13px;margin-bottom:12px}

.bant .blok-et{font-size:10.5px;font-weight:900;color:var(--soluk);letter-spacing:.5px;
  text-transform:uppercase;line-height:1.3}
/* Ltd bloğu tek satır özet — iki blok bandı büyütmesin (brief 2b) */
.bant .sr.ltd{border-top:2px solid var(--cizgi);padding-top:5px;margin-top:5px}
.bant .bas{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bant .bas .et{font-size:11px;font-weight:900;color:var(--soluk);letter-spacing:.4px}
.bant .bas .dg{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.bant .kirilim{font-size:11px;color:var(--soluk);line-height:1.4;margin-top:1px;overflow-wrap:anywhere}
/* Satirlar AKAN METIN: her rakam icin ayri flex satiri kullanmak bandi
   330px'e (ekranin %41'i) cikarmisti. Iki-uc rakam tek satirda, sayilar
   kalin. Bilgi ayni, yer ucte bir. */
.bant .sr{font-size:11.5px;line-height:1.4;color:var(--soluk);
  padding-top:4px;margin-top:4px;border-top:1px solid var(--cizgi);overflow-wrap:anywhere}
.bant .sr b{color:var(--metin);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
/* maden kur farki KUCULTULMEZ — kirmizi ve kalin kaliyor, kutu israf etmiyor */
.bant .sr .fark{color:var(--hata);font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.bant .sr .eksik{color:var(--uyari);font-weight:800}
.bant .dip{font-size:10.5px;color:var(--soluk);line-height:1.35;margin-top:5px;
  border-top:1px solid var(--cizgi);padding-top:5px}
.bant .dip b{font-variant-numeric:tabular-nums}

.rozet{display:inline-block;font-size:11px;font-weight:900;padding:3px 8px;border-radius:20px;
  letter-spacing:.3px;vertical-align:middle;white-space:nowrap}

.uyari-agir{background:#FBEAE7;border-left:3px solid var(--hata);color:var(--hata);

.uyari-orta{background:#FBF3E4;border-left:3px solid var(--uyari);color:#8A6316;
  padding:10px 13px;border-radius:0 10px 10px 0;margin:0 0 10px;font-weight:700;font-size:13.5px;line-height:1.5}
.bilgi{background:var(--acik);border-left:3px solid var(--ana);color:var(--ana-koyu);

.bos{text-align:center;color:var(--soluk);padding:26px 12px;font-size:14.5px;line-height:1.6}
.kucuk{font-size:12.5px;color:var(--soluk);line-height:1.55;margin-top:7px;overflow-wrap:anywhere}

.msg{padding:11px 13px;border-radius:9px;margin:11px 0;font-weight:700;font-size:14px;

.msg.hata{display:block;background:#FBEAE7;color:var(--hata)}
.msg.ok{display:block;background:#E7F0E9;color:var(--ok)}

.tablo-sar{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px -3px}
table{border-collapse:collapse;width:100%;min-width:520px;font-size:14px}
th,td{padding:9px 8px;text-align:left;border-bottom:1px solid var(--cizgi);white-space:nowrap}
th{font-size:11.5px;color:var(--soluk);letter-spacing:.4px}
td.sag,th.sag{text-align:right;font-variant-numeric:tabular-nums}

  margin:18px 0 6px;padding-bottom:6px;border-bottom:2px solid var(--cizgi)}

.ay-bas .tp{font-size:13px;font-weight:800;color:var(--soluk);font-variant-numeric:tabular-nums}
.tk{border:1.5px solid var(--cizgi);border-radius:12px;padding:12px;margin-bottom:9px;background:var(--kart)}
.tk.gecikti{border-color:var(--hata);background:#FBEAE7}
.tk.buay{border-color:var(--uyari);background:#FBF3E4}
.tk.odendi{opacity:.68}
.tk-ust{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.tk-ad{font-weight:900;font-size:15px;min-width:0;overflow-wrap:anywhere}
.tk-tutar{font-weight:900;font-size:16px;font-variant-numeric:tabular-nums;white-space:nowrap}

   Ilk yazimda .tk-orta zaten --soluk idi ve "Limited'de faiz gri" istegi
   ekranda hicbir fark uretmiyordu (olculdu: iki renk de rgb(129,137,160)). */
.tk-orta{font-size:12.5px;color:var(--metin);margin-top:5px;line-height:1.5;overflow-wrap:anywhere}
.tk-durum{font-size:13px;font-weight:800;margin-top:5px}
.tk-durum.gecikti{color:var(--hata)}
.tk-durum.buay{color:#8A6316}
.tk-durum.odendi{color:var(--ok)}
.tk-gider{font-size:12.5px;font-weight:800;color:var(--ok);margin-top:4px}
.tk-gider.yok{color:var(--soluk);font-weight:700}
.tk-eylem{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.gri{color:var(--soluk)}

#girisEkran{max-width:380px;margin:52px auto;padding:22px}
#surumBar{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:12px 14px;background:var(--uyari);color:#fff;
  font-size:14px;font-weight:800}
#surumBar button{flex:none;background:#fff;color:var(--uyari);padding:10px 16px;font-size:14px;min-height:44px}
</style>

const tarihStr = d => { const t = new Date(d);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); };
const bugun = () => tarihStr(new Date());
const trGun = s => s ? new Date(s+'T00:00').toLocaleDateString('tr-TR') : '—';
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const ayAdi = ym => { const [y,m] = ym.split('-'); return AYLAR[+m-1] + ' ' + y; };

/* PARA — KURUS TAM SAYI. Float toplama 84 taksitte kurus kaydirir. */
const kr  = v => Math.round((Number(v) || 0) * 100);
const tlk = k => (k/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' TL';
/* Birimsiz — ust bandin sikisik satirlari icin. Hepsi TL; birim baslikta. */
const tk  = k => (k/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const tl  = v => tlk(kr(v));

function paraCoz(ham){
  const t = String(ham == null ? '' : ham);
  const s = t.replace(/[^\d.,]/g,'');
  if (!/\d/.test(s)) return t.trim()==='' ? {ok:true,kurus:0} : {ok:false,hata:'Geçersiz tutar.'};
  const son = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
  let tam, ond;
  if (son < 0){ tam = s; ond = ''; }
  else { const kuyruk = s.slice(son+1).replace(/[.,]/g,'');
    if (s[son]==='.' && kuyruk.length>2){ tam = s.replace(/[.,]/g,''); ond=''; }
    else { tam = s.slice(0,son).replace(/[.,]/g,''); ond = kuyruk.slice(0,2); } }
  tam = tam.replace(/^0+(?=\d)/,'') || '0';
  const d = parseFloat(tam + (ond ? '.'+ond : ''));
  if (!isFinite(d)) return {ok:false,hata:'Geçersiz tutar.'};
  return { ok:true, kurus: Math.round(d*100) };
}
function gramCoz(ham){
  const t = String(ham==null?'':ham).replace(',','.').replace(/[^\d.]/g,'');
  if (!/\d/.test(t)) return {ok:false,hata:'Geçersiz gram.'};
  const d = parseFloat(t);
  if (!isFinite(d) || d <= 0) return {ok:false,hata:'Gram sıfırdan büyük olmalı.'};
  return { ok:true, deger: Math.round(d*1000)/1000 };
}
const gramYaz = g => (Number(g)||0).toLocaleString('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:3})+' gr';
const gunFarki = (a,b) => Math.round((new Date(a+'T00:00') - new Date(b+'T00:00'))/86400000);
function ayEkle(t0, ay){
  const [y,m,g] = t0.split('-').map(Number);
  const t = new Date(y, m-1+ay, 1);
  t.setDate(Math.min(g, new Date(t.getFullYear(), t.getMonth()+1, 0).getDate()));
  return tarihStr(t);
}

/* SESSIZ HATA YASAK (index.html M-4: iki silme akisi hatayi yutuyordu) */
function hataYaz(msgId, onek, error){
  const ham = (error && (error.message || error.hint || error.details)) || 'Bilinmeyen hata';
  mesaj(msgId, 'hata', onek + '\n' + hataTr(ham));
  console.error(onek, error);
}
function hataTr(m){
  const s = String(m || '');
  if (/row-level security|permission denied/i.test(s)) return 'Yetkin yok (bu bölüm yalnız işletme sahibine açık).';
  if (/kt_ayrim_chk/i.test(s))
    return 'Kırılım tutmuyor: anapara + faiz + vergi/masraf, taksit tutarına EŞİT olmalı.\n'
         + 'Kırılımı hiç girmeyeceksen üçünü de boş bırak.';
  if (/kt_vergi_masraf_chk/i.test(s)) return 'Vergi/masraf eksi olamaz.';
  if (/kt_odeme_chk/i.test(s))        return 'Ödendi işaretlemek için ödeme tarihi zorunlu.';
  if (/ux_kredi_taksit\b/i.test(s))   return 'Bu kredide aynı sıra numarası zaten var.';
  if (/ux_maden_fiyat/i.test(s))      return 'Bu tür için bu tarihe zaten fiyat girilmiş.';
  if (/kredi_tur_chk/i.test(s))       return 'Kredi türü ticari, şahıs veya ltd olmalı.';
  if (/maden_tur_chk|mf_tur_chk/i.test(s)) return 'Maden türü altın veya gümüş olmalı.';
  if (/_chk\b/i.test(s))              return 'Girilen değer kuralları sağlamıyor: ' + s;
  if (/duplicate key/i.test(s))       return 'Bu kayıt zaten var.';
  if (/Failed to fetch|NetworkError/i.test(s)) return 'İnternet bağlantısı kurulamadı. Kayıt YAPILMADI, tekrar dene.';
  return s;
}

/* ============ BELGE — index.html SOZLESMESI (birebir) ============
   Ayni kova 'belgeler', ayni yol: <klasor>/<YYYY-AA-GG>_<uuid>.<uzanti>
   Farkli yol kullanilsaydi dekontlar YEDEGIN DISINDA kalirdi. */
async function fotoKucult(file){
  try{
    const img = await createImageBitmap(file);
    const oran = Math.min(1, 1600/Math.max(img.width, img.height));
    if (oran === 1 && file.size < 700*1024) return { veri:file, tip:null };
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*oran); c.height = Math.round(img.height*oran);
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r,'image/jpeg',0.82));
    return blob ? { veri:blob, tip:'jpg' } : { veri:file, tip:null };
  }catch(e){ return { veri:file, tip:null }; }      // PDF: oldugu gibi
}
async function dosyaYukle(f, klasor){
  if (!f) return null;
  const k = await fotoKucult(f);
  const uzanti = k.tip || (f.name.split('.').pop() || 'jpg').toLowerCase();
  const yol = `${klasor}/${bugun()}_${crypto.randomUUID()}.${uzanti}`;
  const { error } = await sb.storage.from('belgeler').upload(yol, k.veri,
    { upsert:false, contentType: k.tip ? 'image/jpeg' : (f.type || undefined) });
  if (error) throw new Error('Belge yüklenemedi: ' + error.message);
  return yol;
}
function dekontEkle(tablo, id, klasor, msgId, mevcutVar, sonra){
  if (mevcutVar && !confirm('Bu kayıtta zaten belge var.\n\nYenisini eklersen eskisi kayıtla ilişkisiz kalır.\n\nDevam edilsin mi?')) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,application/pdf,.pdf';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    mesaj(msgId, 'ok', 'Belge yükleniyor...');
    try{
      const yol = await dosyaYukle(f, klasor);
      let ek = {};
      if (mevcutVar){
        const { data: eski } = await sb.from(tablo).select('aciklama,foto_path').eq('id', id).maybeSingle();
        if (eski && eski.foto_path)
          ek.aciklama = ((eski.aciklama||'') + ' [belge degistirildi ' + bugun()
                        + ', eski dosya: ' + eski.foto_path + ']').slice(0,500);
      }
      const { error } = await sb.from(tablo).update({ foto_path: yol, ...ek }).eq('id', id);
      if (error){ hataYaz(msgId, 'Belge kayda bağlanamadı.', error); return; }
      mesaj(msgId, 'ok', 'Belge eklendi.');
      if (sonra) await sonra();
    }catch(e){ hataYaz(msgId, 'Belge yüklenemedi.', e); }
    finally{ inp.remove(); }
  };
  inp.click();
}
async function belgeAc(yol, msgId){
  const { data, error } = await sb.storage.from('belgeler').createSignedUrl(yol, 300);
  if (error || !data){ hataYaz(msgId, 'Belge açılamadı.', error); return; }
  window.open(data.signedUrl, '_blank', 'noopener');
}

/* Her kartin EN SON donemi — kalan bundan okunur. */
function kartSonDonemler(donemler){

/* ---------- hesaplar (KURUS tam sayi) ---------- */
const turAdi   = t => t==='ticari' ? 'Ticari (şahıs şirketi)' : t==='sahis' ? 'Şahsi (kişisel)' : t==='ltd' ? 'Limited şirket' : t;
const turKisa  = t => t==='ticari' ? 'TİCARİ' : t==='sahis' ? 'ŞAHSİ' : 'LİMİTED';
const turSinif = t => 'rozet ' + (t==='ticari' ? 'rz-ticari' : t==='sahis' ? 'rz-sahis' : 'rz-ltd');

function krediOzet(taksitler){
  let kalanKurus=0, kalanAdet=0, sonrakiVade=null, gecmis=0, dekontEksik=0;
  const b = bugun();
  for (const t of taksitler){
    if (t.odendi){ if (!t.foto_path) dekontEksik++; }
    else {
      kalanKurus += kr(t.toplam_tutar); kalanAdet++;
      if (t.vade_tarihi < b) gecmis++;
      if (!sonrakiVade || t.vade_tarihi < sonrakiVade) sonrakiVade = t.vade_tarihi;
    }
  }
  return { kalanKurus, kalanAdet, sonrakiVade, gecmis, dekontEksik };
}
/* Verilen tarihte GECERLI fiyat: o tarihten SONRAKI fiyatlar sayilmaz. */
function fiyatAsOf(fiyatlar, tur, tarih){
  const uygun = fiyatlar.filter(x => x.tur === tur && x.tarih <= tarih);
  if (!uygun.length) return null;
  return uygun.reduce((a,x) => (x.tarih > a.tarih ? x : a), uygun[0]);
}
const sonFiyat = (fiyatlar, tur) => fiyatAsOf(fiyatlar, tur, '9999-12-31');

/* Bir maden satirinin alis / bugun / fark degeri.

   ALIS DEGERI ONCELIK SIRASI:
     1. maden.alis_tutar dolu  -> OLGU. Gercekten odenen toplam budur.
     2. yoksa alis tarihindeki maden_fiyat'tan hesapla -> TAHMIN.
        Kullanicinin odedigi fiyat o gunku piyasa fiyati olmak zorunda
        DEGIL; bu yuzden ekranda "tahmini" diye ISARETLENIR.
     3. ikisi de yoksa -> BILINMIYOR. 0 gosterilmez, uydurulmaz.

   `kaynak` alani ekranin hangi durumu gosterecegini soyler. */
function madenDeger(m, fiyatlar){
  const bugunF = sonFiyat(fiyatlar, m.tur);
  const gram   = Number(m.gram) || 0;

  let alisKurus = null, kaynak = 'yok', alisF = null;
  if (m.alis_tutar !== null && m.alis_tutar !== undefined && Number(m.alis_tutar) > 0){
    alisKurus = kr(m.alis_tutar);
    kaynak = 'olgu';
  } else {
    alisF = fiyatAsOf(fiyatlar, m.tur, m.tarih);
    if (alisF){ alisKurus = Math.round(gram * kr(alisF.gram_fiyat)); kaynak = 'tahmin'; }
  }
  return {
    gram, kaynak, alisKurus, alisF, bugunF,
    bugunKurus: bugunF ? Math.round(gram * kr(bugunF.gram_fiyat)) : null
  };
}

  let kartKalan = 0, kartDonemsiz = 0, kartDonemleri = new Set(), kartTutarsiz = 0;
  /* Kart da sahibine gore dogru bloga girer — kart.sahip zaten var (v91).
     Bugun 0 kart var; kart eklenince ayrim kendiliginden isler. */
  let kartSahis = 0, kartLtd = 0;
  for (const k of kart.kartlar){
    const d = sonDonem.get(k.id);
    if (!d){ kartDonemsiz++; continue; }
    kartKalan += kr(d.kalan);
    if (k.sahip === 'ltd') kartLtd += kr(d.kalan); else kartSahis += kr(d.kalan);
    kartDonemleri.add(d.donem);
    if (d.devir_tutarsiz) kartTutarsiz++;
  }

  const ko = krediOzet(taksitler);
  const buAy = bugun().slice(0,7);

  /* ===== BORÇ SINIFLARI — tek "toplam borç" YANLIŞTI =====
     Eski bant kredi taksitlerinin NOMİNAL toplamını (anapara + gelecek
     faiz), madenin RAYİÇ değerini, şahıs anaparasını ve kart kalanını
     TEK sayıda topluyordu. Bu sayı hiçbir karara yaramıyor:
       · "bugün kapatsam ne öderim" -> anapara
       · faiz ve masraf ancak ZAMAN GEÇERSE doğar, bugün ödenmez
       · maden sabit borç değil, piyasayla oynayan yükümlülük
     Artık üçü AYRI. Hesap mantığı değişmedi, gruplama değişti. */
  /* ⚠ 2b DÜZELTMESİ — LTD ANAPARASI İKİ KEZ SAYILIYORDU.
     İlk sürüm "ANAPARA" satırında TÜM anaparayı topluyor, altında Ltd'yi
     AYRICA gösteriyordu; Ltd'nin anaparası iki yerde birden görünüyordu —
     düzeltmeye çalıştığımız hata sınıfının ta kendisi.
     Artık İKİ BLOK: şahıs şirketinin borcu ile Ltd'nin borcu KARIŞMAZ.
     Hiçbir Ltd rakamı şahıs bloğunda görünmez, tersi de. */
  const krediTur = new Map(krediler.map(k => [k.id, k.tur]));
  const S = { anapara:0, faizMasraf:0, kirilimsiz:0, kirilimsizAdet:0, nominal:0, buAy:0, buAyOdenen:0 };
  const L = { anapara:0, faizMasraf:0, kirilimsiz:0, kirilimsizAdet:0, nominal:0, buAy:0, buAyOdenen:0 };
  const buAyD = bugun().slice(0,7);
  for (const t of taksitler){
    const g = krediTur.get(t.kredi_id) === 'ltd' ? L : S;
    if (t.vade_tarihi.slice(0,7) === buAyD){
      g.buAy += kr(t.toplam_tutar);
      if (t.odendi) g.buAyOdenen += kr(t.toplam_tutar);
    }
    if (t.odendi) continue;                       // kalan borç: ödenmemişler
    g.nominal += kr(t.toplam_tutar);
    if (t.anapara_tutar === null || t.anapara_tutar === undefined){
      /* KIRILIMI BİLİNMEYEN: anaparaya KATILMAZ, uydurulmaz. Kendi
         bloğunda parantez notu olarak duruyor (bugün tamamı Ltd). */
      g.kirilimsiz += kr(t.toplam_tutar); g.kirilimsizAdet++;
      continue;
    }
    g.anapara    += kr(t.anapara_tutar);
    g.faizMasraf += kr(t.faiz_tutar) + kr(t.vergi_masraf_tutar || 0);
  }
  let buAyKurus = 0, buAyOdenen = 0;
  for (const t of taksitler){
    if (t.vade_tarihi.slice(0,7) !== buAy) continue;
    buAyKurus += kr(t.toplam_tutar);
    if (t.odendi) buAyOdenen += kr(t.toplam_tutar);
  }

  const odemeToplam = new Map();
  for (const o of sahis.odemeler) odemeToplam.set(o.borc_id, (odemeToplam.get(o.borc_id)||0) + kr(o.tutar));
  let sahisKalan = 0;
  for (const b of sahis.borclar) sahisKalan += Math.max(0, kr(b.tutar) - (odemeToplam.get(b.id)||0));

  /* ⚠ KUR FARKI yalniz IKISI DE bilinen kayitlardan hesaplanir.
     Ilk yazimda toplam bugunku degerden toplam alis degeri cikariliyordu;
     alis fiyati bilinmeyen bir kayit farki SISIRIYORDU (bugunku degeri
     sayiliyor, alisi sayilmiyordu). Ust banttaki en onemli rakam bu —
     sisirilmis hali yanlis karar verdirirdi. */
  let madenBugun = 0;                       // TOPLAM BORC icin: fiyati olan her kayit
  let esAlis = 0, esBugun = 0, hesaplanan = 0;   // FARK icin: yalniz eslesenler
  let fiyatiYok = [], alisiYok = 0, tahminSayisi = 0;
  for (const m of maden.kayitlar){
    const d = madenDeger(m, maden.fiyatlar);
    if (d.bugunKurus === null){
      const ad = m.tur === 'altin' ? 'altın' : 'gümüş';
      if (!fiyatiYok.includes(ad)) fiyatiYok.push(ad);
      continue;
    }
    madenBugun += d.bugunKurus;
    if (d.alisKurus === null){ alisiYok++; continue; }
    /* OLGU ve TAHMIN farkin icine birlikte girer (brief: 1. ve 2. gruptan),
       ama kac tanesinin tahmin oldugu YAZILIR — rakam tahmin tasiyorsa
       kullanici bunu bilmeli. */
    if (d.kaynak === 'tahmin') tahminSayisi++;
    esAlis  += d.alisKurus;
    esBugun += d.bugunKurus;
    hesaplanan++;
  }
  const madenAlis  = esAlis;
  const farkKurus  = (hesaplanan > 0) ? (esBugun - esAlis) : null;
  const farkBugun  = esBugun;

  /* ŞAHIS BLOĞU · "bugün kapatsam ne öderim"
     kredi anaparası + kişilere olan şahıs borcu + şahıs kartı.
     Maden ve şahıs borcu SAHİBİN kendi yükümlülüğü — Ltd'nin değil. */
  const sAnapara = S.anapara + sahisKalan + kartSahis;
  /* LTD BLOĞU · ayrı tüzel kişilik. Nominal gösteriliyor çünkü bu
     kredilerin büyük kısmında anapara/faiz kırılımı YOK; anapara diye
     eksik bir rakam yazmak yanıltırdı. */
  const lNominal = L.nominal + kartLtd;

  const krediParcaToplam = S.nominal + L.nominal;
  /* ⚠ İÇ TUTARLILIK — ÖNCEKİ HÂLİ TOTOLOJİKTİ.
     "şahıs nominal + ltd nominal = kredi nominal" diye bakıyordu; üçü de
     AYNI taksit listesinden toplandığı için fark her zaman sıfırdı ve
     negatif kontrolde ATEŞLEMEDİ. Ateşlemeyen nöbetçi, nöbetçi değildir.

     Anlamlı kontrol: her blokta KIRILIM toplamı NOMİNALE eşit mi.
     anapara + faiz/masraf + kırılımsız  =  toplam_tutar toplamı
     Bunlar FARKLI kolonlardan geliyor; biri bozuksa fark açılır. */
  const sapma = (g) => (g.anapara + g.faizMasraf + g.kirilimsiz) - g.nominal;
  const sSapma = sapma(S), lSapma = sapma(L);
  const parcaSapmasi = sSapma !== 0 ? sSapma : lSapma;

  return { krediler, taksitler, ko, buAyKurus, buAyOdenen, sahisKalan,
           madenBugun, madenAlis, farkBugun, farkKurus, fiyatiYok, alisiYok,
           hesaplanan, tahminSayisi, maden, sahis,
           kart, sonDonem, kartKalan, kartSahis, kartLtd, kartDonemsiz, kartTutarsiz,
           kartDonemleri: [...kartDonemleri].sort(),
           S, L, sAnapara, lNominal, krediParcaToplam, parcaSapmasi, sSapma, lSapma };
}

function bantCiz(v){
  const b = el('div','bant');
  /* parcalar: [metin, {v:deger, s:sinif}, metin, ...] — akan satir */
  const satir = (...parcalar) => {
    const s = el('div','sr');
    for (const p of parcalar){
      if (p === null || p === undefined) continue;
      if (typeof p === 'string') s.appendChild(document.createTextNode(p));
      else s.appendChild(el(p.s ? 'span' : 'b', p.s || null, p.v));
    }
    b.appendChild(s);
  };

  /* ===== BLOK 1 · SENİN BORCUN (şahıs şirketi) =====
     Hiçbir Ltd rakamı buraya girmez, tersi de. */
  b.appendChild(el('div','blok-et','ŞAHIS ŞİRKETİ · senin borcun'));
  const bas = el('div','bas');
  bas.appendChild(el('span','et','Anapara bugün'));
  bas.appendChild(el('span','dg', tlk(v.sAnapara)));
  b.appendChild(bas);

  /* Satir ici rakamlarda " TL" eki YOK — bant 375px'te satir kazaniyor.
     Birim baslikta ve dipnotta duruyor, hepsi TL. */
  const parcalar = ['kredi ' + tk(v.S.anapara)];
  if (v.sahisKalan) parcalar.push('şahıs ' + tk(v.sahisKalan));
  if (v.kartSahis)  parcalar.push('kart ' + tk(v.kartSahis));
  b.appendChild(el('div','kirilim', parcalar.join(' · ')));

  /* Faiz bugun odenmez, zaman gecerse dogar. Sahis tarafinda kirilimsiz
     taksit BUGUN YOK; cikarsa sessiz kalmayalim diye kosula bagli. */
  /* Faiz ve "bu ay" TEK SATIRDA — iki blok bandı büyütmesin.
     "Bu ay" etiketi kapsamını söylüyor: KREDİ taksiti. */
  satir('Gelecek faiz+masraf ', { v: tk(v.S.faizMasraf) },
    v.S.kirilimsizAdet ? ' · kırılımsız (' + v.S.kirilimsizAdet + ') ' : null,
    v.S.kirilimsizAdet ? { v: tk(v.S.kirilimsiz) } : null,
    ' · bu ay kredi taksiti ', { v: tk(v.S.buAy - v.S.buAyOdenen) },
    v.S.buAyOdenen ? ' (' + tk(v.S.buAyOdenen) + ' ödendi)' : null,
    v.kartSahis ? ' · kart (ayrı) ' : null,
    v.kartSahis ? { v: tk(v.kartSahis) } : null,
    v.ko.dekontEksik ? ' · dekont eksik ' : null,
    v.ko.dekontEksik ? { v: String(v.ko.dekontEksik), s: 'eksik' } : null);

  /* Maden ve kisilere olan sahis borcu SAHIBIN yukumlulugu — Ltd'nin degil. */
  if (v.maden.kayitlar.length){
    satir('Maden rayiç ',
      { v: v.madenBugun ? tk(v.madenBugun) : 'hesaplanamaz' },
      v.fiyatiYok.length ? ' (' + v.fiyatiYok.join(', ') + ' hariç)' : null,
      ' · kur farkı ',
      { v: v.farkKurus === null ? 'hesaplanamaz'
           : (v.farkKurus >= 0 ? '+' : '−') + tk(Math.abs(v.farkKurus)), s: 'fark' });
  }

  /* ===== BLOK 2 · LİMİTED =====
     Ayri tuzel kisilik: sahibin gider/kar hesabina GIRMEZ. Nominal
     gosteriliyor cunku bu kredilerin buyuk kisminda anapara/faiz kirilimi
     YOK — "anapara" diye eksik bir rakam yazmak yaniltirdi. */
  if (v.L.nominal || v.kartLtd){
    const s = el('div','sr ltd');
    s.appendChild(el('span','rozet rz-ltd','LTD'));
    s.appendChild(document.createTextNode(' '));
    s.appendChild(el('b', null, tk(v.lNominal)));
    s.appendChild(document.createTextNode(' · bu ay '));
    s.appendChild(el('b', null, tk(v.L.buAy - v.L.buAyOdenen)));
    /* "ayri tuzel, gidere girmez" aciklamasi Krediler ekraninda ZATEN var
       ("Limited sirket — bu kredinin hicbir kalemi gidere yazilmaz");
       bantta rozet + ayirici cizgi ayrimi zaten soyluyor. */
    if (v.L.kirilimsizAdet)
      s.appendChild(document.createTextNode(' · kırılımsız ' + tk(v.L.kirilimsiz)));
    b.appendChild(s);
  }

  const dip = el('div','dip');
  dip.appendChild(document.createTextNode('Taksit nominali '));
  dip.appendChild(el('b', null, tlk(v.krediParcaToplam)));
  dip.appendChild(document.createTextNode(' (şahıs+Ltd)'
    + (v.kartDonemsiz ? ' · ' + v.kartDonemsiz + ' kartın dönemi yok' : '')));
  b.appendChild(dip);

  /* Ic tutarlilik: her blokta kirilim toplami nominale ESIT olmali */
  const bozuk = [];
  if (v.sSapma !== 0) bozuk.push('şahıs: kırılım ' + tlk(v.S.anapara + v.S.faizMasraf + v.S.kirilimsiz)
    + ' ≠ nominal ' + tlk(v.S.nominal) + ' (fark ' + tlk(Math.abs(v.sSapma)) + ')');
  if (v.lSapma !== 0) bozuk.push('Ltd: kırılım ' + tlk(v.L.anapara + v.L.faizMasraf + v.L.kirilimsiz)
    + ' ≠ nominal ' + tlk(v.L.nominal) + ' (fark ' + tlk(Math.abs(v.lSapma)) + ')');
  if (bozuk.length)
    b.appendChild(el('div','uyari-agir', 'Kırılım toplamı tutmuyor — ' + bozuk.join(' · ')));
  return b;
}

/* ================== 1 · TAKVIM (varsayilan) ================== */
async function vTakvim(){
  const c = document.getElementById('icerik');
  const v = await bantVerisi();
  const krediMap = new Map(v.krediler.map(k => [k.id, k]));

  c.textContent = '';
  c.appendChild(bantCiz(v));
  const msg = el('div','msg'); msg.id = 'takvimMsg'; c.appendChild(msg);

  if (v.ko.gecmis > 0)
    c.appendChild(el('div','uyari-agir','Vadesi geçmiş ve ödenmemiş ' + v.ko.gecmis + ' taksit var.'));

  if (!v.taksitler.length){
    const k = el('div','kart');
    k.appendChild(el('div','kbaslik','Takvim'));
    k.appendChild(el('div','bos','Henüz taksit yok. Krediler sekmesinden kredi ekleyip taksit üret.'));
    c.appendChild(k); return;
  }

  const b = bugun();
  const buAy = b.slice(0,7);
  const gruplar = new Map();
  for (const t of v.taksitler){
    const ay = t.vade_tarihi.slice(0,7);
    if (!gruplar.has(ay)) gruplar.set(ay, []);
    gruplar.get(ay).push(t);
  }
  const siraliAylar = [...gruplar.keys()].sort();

  for (const ay of siraliAylar){
    const liste = gruplar.get(ay);
    const toplamKurus = liste.reduce((s,t) => s + kr(t.toplam_tutar), 0);

    const bas = el('div','ay-bas');
    bas.appendChild(el('span','ad', ayAdi(ay) + (ay === buAy ? ' · bu ay' : '')));
    bas.appendChild(el('span','tp', liste.length + ' taksit · ' + tlk(toplamKurus)));
    c.appendChild(bas);

    for (const t of liste) c.appendChild(taksitKarti(t, krediMap.get(t.kredi_id), b, buAy));
  }
}

function taksitKarti(t, kredi, b, buAy){
  const gecikti = !t.odendi && t.vade_tarihi < b;
  const buAyMi  = !t.odendi && !gecikti && t.vade_tarihi.slice(0,7) === buAy;

  const k = el('div','tk' + (t.odendi ? ' odendi' : gecikti ? ' gecikti' : buAyMi ? ' buay' : ''));

  const ust = el('div','tk-ust');
  const ad = el('div','tk-ad');
  ad.appendChild(el('span', null, (kredi ? kredi.banka + ' · ' + kredi.ad : 'kredi bulunamadı')
                                  + '  ' + t.sira + '. taksit'));
  if (kredi){
    ad.appendChild(document.createTextNode(' '));
    ad.appendChild(el('span', turSinif(kredi.tur), turKisa(kredi.tur)));
  }
  ust.appendChild(ad);
  ust.appendChild(el('div','tk-tutar', tl(t.toplam_tutar)));
  k.appendChild(ust);

  /* kirilim — anapara / faiz / vergi-masraf */
  const orta = el('div','tk-orta');
  if (t.anapara_tutar === null && t.faiz_tutar === null){
    orta.appendChild(el('span','gri','kırılım girilmemiş (anapara / faiz / vergi-masraf)'));
  } else {
    orta.appendChild(el('span', null, 'anapara ' + tl(t.anapara_tutar)));
    orta.appendChild(document.createTextNode(' · '));
    /* LIMITED: faiz GRI ve "gidere yazilmaz" */
    const faizSpan = el('span', (kredi && kredi.tur === 'ltd') ? 'gri' : null, 'faiz ' + tl(t.faiz_tutar));
    orta.appendChild(faizSpan);
    if (t.vergi_masraf_tutar !== null && t.vergi_masraf_tutar !== undefined){
      orta.appendChild(document.createTextNode(' · '));
      orta.appendChild(el('span', (kredi && kredi.tur === 'ltd') ? 'gri' : null,
        'vergi/masraf ' + tl(t.vergi_masraf_tutar)));
    }
    if (t.vergi_masraf_notu){
      orta.appendChild(document.createElement('br'));
      orta.appendChild(el('span','gri', t.vergi_masraf_notu));   // textContent
    }
  }
  k.appendChild(orta);

  /* gidere yazilacak tutar — TUR'e gore */
  if (kredi){
    if (kredi.tur === 'ticari'){
      if (t.faiz_tutar === null){
        k.appendChild(el('div','tk-gider yok','gidere: kırılım girilmediği için hesaplanamaz'));
      } else {
        const giderKurus = kr(t.faiz_tutar) + kr(t.vergi_masraf_tutar || 0);
        k.appendChild(el('div','tk-gider','gidere: faiz + vergi/masraf = ' + tlk(giderKurus)));
      }
    } else {
      k.appendChild(el('div','tk-gider yok', turAdi(kredi.tur) + ' — gidere yazılmaz'));
    }
  }

  /* durum satiri */
  const d = el('div','tk-durum' + (gecikti ? ' gecikti' : buAyMi ? ' buay' : t.odendi ? ' odendi' : ''));
  if (t.odendi){
    d.textContent = 'ödendi · ' + trGun(t.odeme_tarihi);
  } else if (gecikti){
    d.textContent = 'vade ' + trGun(t.vade_tarihi) + ' · ' + gunFarki(b, t.vade_tarihi) + ' gün geçti';
  } else {
    const kalan = gunFarki(t.vade_tarihi, b);
    d.textContent = 'vade ' + trGun(t.vade_tarihi) + ' · ' + kalan + ' gün kaldı';
  }
  k.appendChild(d);

  /* dekont eksik rozeti — odenmis olsa da TAKILI KALIR */
  if (t.odendi && !t.foto_path){
    const r = el('div'); r.style.marginTop = '6px';
    r.appendChild(el('span','rozet rz-eksik','DEKONT EKSİK'));
    k.appendChild(r);
  }

  const ey = el('div','tk-eylem');
  if (!t.odendi){
    const bt = el('button','btn2','Ödendi');
    bt.onclick = () => taksitOdendi(t);
    ey.appendChild(bt);
  }
  const bb = el('button','btn-mini', t.foto_path ? 'Belgeyi aç' : '+ Belge');
  bb.onclick = t.foto_path
    ? () => belgeAc(t.foto_path, mesajKutusu())
    : () => dekontEkle('kredi_taksit', t.id, 'kredi_taksit', mesajKutusu(), false, () => ekranAc(EKRAN));
  ey.appendChild(bb);
  if (t.foto_path){
    const bd = el('button','btn-mini','Değiştir');
    bd.onclick = () => dekontEkle('kredi_taksit', t.id, 'kredi_taksit', mesajKutusu(), true, () => ekranAc(EKRAN));
    ey.appendChild(bd);
  }
  k.appendChild(ey);
  return k;
}
const mesajKutusu = () => document.getElementById('takvimMsg') ? 'takvimMsg' : 'krediMsg';

async function taksitOdendi(t){
  const kutu = mesajKutusu();
  const cevap = prompt('Ödeme tarihi (YYYY-AA-GG).\n\nÖdendi işaretlemek için tarih ZORUNLUDUR.', bugun());
  if (cevap === null) return;
  const tar = (cevap || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tar) || isNaN(new Date(tar+'T00:00').getTime())){
    mesaj(kutu, 'hata', 'Ödeme tarihi YYYY-AA-GG biçiminde geçerli bir tarih olmalı. İŞARETLENMEDİ.');
    return;
  }
  const { error } = await sb.from('kredi_taksit').update({ odendi:true, odeme_tarihi:tar }).eq('id', t.id);
  if (error){ hataYaz(kutu, 'Taksit ödendi olarak işaretlenemedi.', error); return; }
  mesaj(kutu, 'ok', 'Taksit ödendi olarak işaretlendi. Belgeyi eklemeyi unutma.');
  await ekranAc(EKRAN);
}

/* ================== 2 · KREDILER ================== */
async function vKrediler(){
  const c = document.getElementById('icerik');
  const v = await bantVerisi();
  const grup = new Map();
  for (const t of v.taksitler){
    if (!grup.has(t.kredi_id)) grup.set(t.kredi_id, []);
    grup.get(t.kredi_id).push(t);
  }
  c.textContent = '';
  c.appendChild(bantCiz(v));
  const msg = el('div','msg'); msg.id = 'krediMsg'; c.appendChild(msg);

  const k = el('div','kart');
  k.appendChild(el('div','kbaslik','Krediler (' + v.krediler.length + ')'));
  if (!v.krediler.length) k.appendChild(el('div','bos','Henüz kredi yok. Aşağıdaki formdan ekle.'));

  for (const kredi of v.krediler){
    const o = krediOzet(grup.get(kredi.id) || []);
    const kart = el('div','tk'); kart.style.cursor = 'pointer';
    kart.onclick = () => taksitEkraniAc(kredi.id);

    const ust = el('div','tk-ust');
    const ad = el('div','tk-ad');
    ad.appendChild(el('span', null, kredi.banka + ' · ' + kredi.ad));
    ad.appendChild(document.createTextNode(' '));
    ad.appendChild(el('span', turSinif(kredi.tur), turKisa(kredi.tur)));
    ust.appendChild(ad);
    ust.appendChild(el('div','tk-tutar', tlk(o.kalanKurus)));
    k.appendChild(kart);
    kart.appendChild(ust);

    const alt = el('div','tk-orta');
    alt.textContent = (o.kalanAdet ? o.kalanAdet + ' taksit kaldı' : 'tüm taksitler ödendi')
      + (o.sonrakiVade ? ' · sonraki vade ' + trGun(o.sonrakiVade) : '')

async function krediKaydet(){
  const btn = document.getElementById('kKaydet');
  mesajTemizle('krediMsg');
  const banka = document.getElementById('kBanka').value.trim();
  const ad    = document.getElementById('kAd').value.trim();
  const tur   = document.getElementById('kTur').value;
  const bas   = document.getElementById('kBas').value;
  const anap  = paraCoz(document.getElementById('kAnapara').value);
  const faizH = document.getElementById('kFaiz').value.trim();
  const adet  = parseInt(document.getElementById('kAdet').value.trim(), 10);

  if (!banka) return mesaj('krediMsg','hata','Banka adı zorunlu.');
  if (!ad)    return mesaj('krediMsg','hata','Kredi adı zorunlu.');
  if (!tur)   return mesaj('krediMsg','hata','Tür seçmelisin: ticari, şahsi ya da limited.');
  if (!bas)   return mesaj('krediMsg','hata','Başlangıç tarihi zorunlu.');
  if (!anap.ok) return mesaj('krediMsg','hata','Anapara: ' + anap.hata);
  if (anap.kurus <= 0) return mesaj('krediMsg','hata','Anapara sıfırdan büyük olmalı.');
  if (!Number.isFinite(adet) || adet <= 0) return mesaj('krediMsg','hata','Taksit sayısı sıfırdan büyük bir tam sayı olmalı.');
  let faiz = null;
  if (faizH){
    const f = parseFloat(faizH.replace(',','.'));
    if (!isFinite(f) || f < 0) return mesaj('krediMsg','hata','Faiz oranı geçersiz. Bilinmiyorsa boş bırak.');
    faiz = f;
  }
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kredi').insert({
    banka, ad, tur, anapara:(anap.kurus/100).toFixed(2), faiz_orani:faiz,
    taksit_sayisi:adet, baslangic_tarihi:bas,

    giren_id: PROFIL ? PROFIL.id : null });

  mesaj('krediMsg','ok','Kredi kaydedildi.');

async function taksitEkraniAc(krediId){
  const c = document.getElementById('icerik');
  c.textContent = ''; c.appendChild(el('div','bos','Yükleniyor...'));
  try{
    const kredi = (await krediGetir()).find(x => x.id === krediId);
    if (!kredi){ c.textContent=''; c.appendChild(el('div','uyari-agir','Kredi bulunamadı.')); return; }
    SECILI_KREDI = kredi;
    const taksitler = await taksitGetir(krediId);
    const b = bugun(), buAy = b.slice(0,7);
    const o = krediOzet(taksitler);

    c.textContent = '';
    const geri = el('button','btn2','← Kredilere dön');
    geri.onclick = () => ekranAc('krediler');
    c.appendChild(geri);

    const bas = el('div','kart');
    const bl = el('div','kbaslik');
    bl.appendChild(el('span', null, kredi.banka + ' · ' + kredi.ad));
    bl.appendChild(document.createTextNode(' '));
    bl.appendChild(el('span', turSinif(kredi.tur), turKisa(kredi.tur)));
    bas.appendChild(bl);
    const sat = (e2,d) => { const s = el('div','satir');
      s.appendChild(el('span','et', e2)); s.appendChild(el('span','dg', d)); bas.appendChild(s); };
    sat('Anapara', tl(kredi.anapara));
    sat('Faiz oranı', (kredi.faiz_orani === null || kredi.faiz_orani === undefined)
        ? 'girilmemiş' : String(kredi.faiz_orani).replace('.',',') + ' %');
    sat('Taksit', taksitler.length + ' / ' + kredi.taksit_sayisi + ' girildi');
    sat('Kalan', tlk(o.kalanKurus) + ' (' + o.kalanAdet + ' taksit)');
    if (kredi.tur !== 'ticari')
      bas.appendChild(el('div','bilgi', turAdi(kredi.tur) + ' — bu kredinin hiçbir kalemi gidere yazılmaz.'));
    const sil = el('button','btn-kirmizi','Krediyi sil');
    sil.onclick = () => krediSil(kredi);
    bas.appendChild(sil);
    c.appendChild(bas);

    const msg = el('div','msg'); msg.id = 'taksitMsg'; c.appendChild(msg);
    c.appendChild(topluFormu(kredi, taksitler));

    const k = el('div','kart');
    k.appendChild(el('div','kbaslik','Bu kredinin taksitleri'));
    if (!taksitler.length) k.appendChild(el('div','bos','Bu kredide henüz taksit yok.'));
    else for (const t of taksitler) k.appendChild(taksitKarti(t, kredi, b, buAy));
    c.appendChild(k);
  }catch(e){
    c.textContent = '';
    c.appendChild(el('div','uyari-agir','Taksitler açılamadı: ' + hataTr(e && e.message)));
  }
}

function topluSatirlariUret(kredi, sonSira){
  const bas   = document.getElementById('tBas').value;
  const tut   = paraCoz(document.getElementById('tTutar').value);
  const adet  = parseInt(document.getElementById('tAdet').value.trim(), 10);
  const per   = parseInt(document.getElementById('tPeriyot').value, 10);
  const faizH = document.getElementById('tFaiz').value.trim();
  const vrgH  = document.getElementById('tVergi').value.trim();
  const not   = document.getElementById('tNot').value.trim();

  if (!bas) return { ok:false, hata:'İlk vade tarihi zorunlu.' };
  if (!tut.ok) return { ok:false, hata:'Taksit tutarı: ' + tut.hata };
  if (tut.kurus <= 0) return { ok:false, hata:'Taksit tutarı sıfırdan büyük olmalı.' };
  if (!Number.isFinite(adet) || adet <= 0) return { ok:false, hata:'Adet sıfırdan büyük bir tam sayı olmalı.' };
  if (adet > 600) return { ok:false, hata:'Adet çok büyük (en fazla 600).' };
  if (!Number.isFinite(per) || per <= 0) return { ok:false, hata:'Periyot seçilmedi.' };

  let faizKurus = null, vrgKurus = null;
  if (faizH){
    const f = paraCoz(faizH);
    if (!f.ok) return { ok:false, hata:'Faiz: ' + f.hata };
    faizKurus = f.kurus;
  }
  if (vrgH){
    const g = paraCoz(vrgH);
    if (!g.ok) return { ok:false, hata:'Vergi/masraf: ' + g.hata };
    vrgKurus = g.kurus;
  }
  /* kt_ayrim_chk'i EKRANDA da uygula — sunucuya hatali satir gondermeyelim */
  if (vrgKurus !== null && faizKurus === null)
    return { ok:false, hata:'Vergi/masraf yazdın ama faiz boş. Kırılım girilecekse faiz de zorunlu.' };
  if (faizKurus !== null){
    const toplamPay = faizKurus + (vrgKurus || 0);
    if (toplamPay > tut.kurus)
      return { ok:false, hata:'Faiz + vergi/masraf, taksit tutarından büyük olamaz.' };
  }

  const satirlar = [];
  for (let i = 0; i < adet; i++){
    satirlar.push({
      kredi_id: kredi.id,
      sira: sonSira + i + 1,
      vade_tarihi: ayEkle(bas, i * per),
      toplam_tutar: (tut.kurus/100).toFixed(2),
      anapara_tutar: faizKurus === null ? null : ((tut.kurus - faizKurus - (vrgKurus||0))/100).toFixed(2),
      faiz_tutar:    faizKurus === null ? null : (faizKurus/100).toFixed(2),
      vergi_masraf_tutar: vrgKurus === null ? null : (vrgKurus/100).toFixed(2),
      vergi_masraf_notu:  (vrgKurus !== null && not) ? not : null,
      odendi: false
    });
  }
  return { ok:true, satirlar, toplamKurus: tut.kurus * adet };
}

async function topluOnizle(kredi, sonSira, kaydet){
  mesajTemizle('taksitMsg');
  const r = topluSatirlariUret(kredi, sonSira);
  const ov = document.getElementById('tOnizleme');
  ov.textContent = '';
  if (!r.ok){ mesaj('taksitMsg','hata', r.hata); return; }

  ov.appendChild(el('div','bilgi',
    r.satirlar.length + ' taksit · ilk vade ' + trGun(r.satirlar[0].vade_tarihi)
    + ' · son vade ' + trGun(r.satirlar[r.satirlar.length-1].vade_tarihi)
    + ' · toplam ' + tlk(r.toplamKurus)));

  if (!kaydet){
    const sar = el('div','tablo-sar');
    const t = document.createElement('table');
    const hr = document.createElement('tr');
    ['#','VADE','TUTAR','ANAPARA','FAİZ','VERGİ/MASRAF'].forEach((h,i) =>
      hr.appendChild(el('th', i>=2 ? 'sag' : null, h)));
    t.appendChild(hr);
    r.satirlar.slice(0,12).forEach(s => {
      const tr = document.createElement('tr');
      tr.appendChild(td(s.sira));
      tr.appendChild(td(trGun(s.vade_tarihi)));
      tr.appendChild(td(tl(s.toplam_tutar),'sag'));
      tr.appendChild(td(s.anapara_tutar === null ? '—' : tl(s.anapara_tutar),'sag'));
      tr.appendChild(td(s.faiz_tutar === null ? '—' : tl(s.faiz_tutar),'sag'));
      tr.appendChild(td(s.vergi_masraf_tutar === null ? '—' : tl(s.vergi_masraf_tutar),'sag'));
      t.appendChild(tr);
    });
    sar.appendChild(t); ov.appendChild(sar);
    if (r.satirlar.length > 12)
      ov.appendChild(el('div','kucuk','İlk 12 satır gösteriliyor; kaydedilecek toplam ' + r.satirlar.length + ' satır.'));
    return;
  }

  if (!confirm(r.satirlar.length + ' taksit kaydedilecek.\n\nDevam edilsin mi?')) return;
  const btn = document.getElementById('tKaydet');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kredi_taksit').insert(r.satirlar);
  btn.disabled = false; btn.textContent = 'Taksitleri kaydet';
  if (error){ hataYaz('taksitMsg','Taksitler kaydedilemedi. HİÇBİRİ yazılmadı.', error); return; }
  mesaj('taksitMsg','ok', r.satirlar.length + ' taksit kaydedildi.');
  await taksitEkraniAc(kredi.id);
}

/* ---------- tek kartin ay ay dokumu ---------- */
async function kartDetayAc(kartId){
  const c = document.getElementById('icerik');
  c.textContent = ''; c.appendChild(el('div','bos','Yükleniyor...'));
  try{
    const { kartlar, donemler } = await kartGetir();
    const kart = kartlar.find(x => x.id === kartId);
    if (!kart){ c.textContent=''; c.appendChild(el('div','uyari-agir','Kart bulunamadı.')); return; }
    const liste = donemler.filter(d => d.kart_id === kartId).sort((a,b) => b.donem.localeCompare(a.donem));

    c.textContent = '';
    const geri = el('button','btn2','← Kartlara dön');
    geri.onclick = () => ekranAc('kartlar');
    c.appendChild(geri);

    const bas = el('div','kart');
    const bl = el('div','kbaslik');
    bl.appendChild(el('span', null, kart.ad + (kart.banka ? ' · ' + kart.banka : '')));
    bl.appendChild(document.createTextNode(' '));
    bl.appendChild(el('span', sahipSinif(kart.sahip), sahipKisa(kart.sahip)));
    bas.appendChild(bl);
    const sat = (e2,d) => { const s = el('div','satir');
      s.appendChild(el('span','et', e2)); s.appendChild(el('span','dg', d)); bas.appendChild(s); };
    sat('Son ödeme günü', kart.son_odeme_gunu ? 'ayın ' + kart.son_odeme_gunu + '. günü' : 'girilmemiş');
    sat('Kesim günü', kart.kesim_gunu ? 'ayın ' + kart.kesim_gunu + '. günü' : 'girilmemiş');
    sat('Girilen dönem', liste.length + ' ay');
    if (liste.length) sat('Son kalan', tl(liste[0].kalan) + ' (' + liste[0].donem + ')');
    c.appendChild(bas);

    const msg = el('div','msg'); msg.id = 'kartMsg'; c.appendChild(msg);
    c.appendChild(kartUyarisi());
    c.appendChild(donemFormu(kart, liste));

    const k = el('div','kart');
    k.appendChild(el('div','kbaslik','Ay ay döküm'));
    if (!liste.length){
      k.appendChild(el('div','bos','Bu kartta henüz dönem yok. Yukarıdaki formdan ekle.'));
    } else {
      const sar = el('div','tablo-sar');
      const t = document.createElement('table');
      const hr = document.createElement('tr');
      ['DÖNEM','DEVİR','YENİ','DÜZELTME','ÖDENEN','KALAN','EKSTRE',''].forEach((h,i) =>
        hr.appendChild(el('th', (i>=1 && i<=5) ? 'sag' : null, h)));
      t.appendChild(hr);
      for (const d of liste){
        const tr = document.createElement('tr');
        const dh = document.createElement('td');
        dh.appendChild(el('span', null, d.donem));
        if (d.devir_tutarsiz){
          dh.appendChild(document.createElement('br'));
          dh.appendChild(el('span','rozet rz-eksik','DEVİR TUTMUYOR'));
        }
        tr.appendChild(dh);
        tr.appendChild(td(tl(d.devir),'sag'));
        tr.appendChild(td(tl(d.yeni_harcama),'sag'));
        tr.appendChild(td(tl(d.duzeltme),'sag'));
        tr.appendChild(td(tl(d.odenen),'sag'));
        const kh = td(tl(d.kalan),'sag'); kh.style.fontWeight = '900'; tr.appendChild(kh);
        const eh = document.createElement('td');
        if (d.foto_path){
          const a = el('button','btn-mini','Aç');
          a.onclick = () => belgeAc(d.foto_path,'kartMsg');
          eh.appendChild(a);
        } else {
          eh.appendChild(el('span','rozet rz-sari','EKSTRE EKSİK'));
        }
        tr.appendChild(eh);
        const ey = document.createElement('td');
        const be = el('button','btn-mini', d.foto_path ? 'Değiştir' : '+ Ekstre');
        be.onclick = () => dekontEkle('kart_donem', d.donem_id, 'kart_ekstre','kartMsg',
                                      !!d.foto_path, () => kartDetayAc(kartId));
        ey.appendChild(be); tr.appendChild(ey);
        t.appendChild(tr);
      }
      sar.appendChild(t); k.appendChild(sar);
      k.appendChild(el('div','kucuk',
        'KALAN = devir + yeni harcama + düzeltme − ödenen. Ayrı bir sütunda tutulmaz, '
      + 'girdilerden hesaplanır; böylece girdilerle ayrışamaz.'));
      const tut = liste.filter(d => d.devir_tutarsiz);
      if (tut.length)
        k.appendChild(el('div','uyari-agir',
          tut.length + ' dönemde devir, önceki ayın kalanına eşit değil: '
          + tut.map(d => d.donem).join(', ')
          + '. Ya bir ay eksik ya da bir rakam yanlış girilmiş.'));
    }
    c.appendChild(k);
  }catch(e){
    c.textContent = '';
    c.appendChild(el('div','uyari-agir','Kart açılamadı: ' + hataTr(e && e.message)));
  }
}

function donemFormu(kart, liste){
  const k = el('div','kart');
  k.appendChild(el('div','kbaslik','Yeni ay ekle'));

  const alan = (etiket, id, deger, mod) => {
    k.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input');
    i.id = id; i.type = 'text';
    if (deger !== undefined && deger !== null) i.value = deger;
    if (mod) i.setAttribute('inputmode', mod);
    k.appendChild(i); return i;
  };

  k.appendChild(el('label', null, 'Dönem (YYYY-AA)')).setAttribute('for','kdDonem');
  const dn = document.createElement('input');
  dn.id = 'kdDonem'; dn.type = 'month'; dn.value = bugun().slice(0,7);
  k.appendChild(dn);

  const dv = alan('Devir (geçen aydan kalan)', 'kdDevir', '', 'decimal');
  const ipucu = el('div','kucuk'); ipucu.id = 'kdIpucu'; k.appendChild(ipucu);

  /* Donem secilince devir ONCEKI DONEMIN KALANIYLA on doldurulur.
     Kullanici degistirebilir; degistirir ve zincir kirilirsa asagidaki
     uyari cikar — sessizce gecilmez. */
  const onDoldur = () => {
    const d = dn.value;
    const onceki = liste.filter(x => x.donem < d).sort((a,b) => b.donem.localeCompare(a.donem))[0];
    if (onceki){
      dv.value = (kr(onceki.kalan)/100).toFixed(2).replace('.', ',');
      ipucu.textContent = onceki.donem + ' kalanı ' + tl(onceki.kalan) + ' — devir olarak dolduruldu.';
    } else {
      ipucu.textContent = 'Bu dönemden önce kayıt yok; devir bilinen açılış tutarıdır.';
    }
    zinciriDenetle();
  };
  const zinciriDenetle = () => {
    const d = dn.value;
    const onceki = liste.filter(x => x.donem < d).sort((a,b) => b.donem.localeCompare(a.donem))[0];
    const u = document.getElementById('kdZincir');
    if (!u) return;
    if (!onceki){ u.className = 'kucuk'; u.textContent = ''; return; }
    const g = paraCoz(dv.value);
    if (!g.ok){ u.className = 'kucuk'; u.textContent = ''; return; }
    if (g.kurus !== kr(onceki.kalan)){
      u.className = 'uyari-agir';
      u.textContent = 'DEVİR TUTMUYOR: ' + onceki.donem + ' kalanı ' + tl(onceki.kalan)
        + ', sen ' + tlk(g.kurus) + ' yazdın. Kaydedilir ama listede işaretli kalır.';
    } else { u.className = 'kucuk'; u.textContent = ''; }
  };
  dn.onchange = onDoldur;
  dv.oninput = zinciriDenetle;

  alan('Yeni harcama', 'kdYeni', '', 'decimal');
  alan('Düzeltme (iade/indirim eksi yazılır)', 'kdDuzeltme', '', 'decimal');
  alan('Ödenen', 'kdOdenen', '', 'decimal');
  const zn = el('div','kucuk'); zn.id = 'kdZincir'; k.appendChild(zn);

  const on = el('button','btn2','Kalanı hesapla (kaydetme)');
  on.onclick = () => donemOnizle(kart, liste, false);
  const kay = el('button','btn','Ayı kaydet'); kay.id = 'kdKaydet';
  kay.onclick = () => donemOnizle(kart, liste, true);
  k.appendChild(on); k.appendChild(kay);
  const ov = el('div'); ov.id = 'kdOnizleme'; k.appendChild(ov);

  setTimeout(onDoldur, 0);   // ilk acilista da doldur
  return k;
}

function donemSatiriUret(kart){
  const donem = document.getElementById('kdDonem').value;
  if (!/^\d{4}-\d{2}$/.test(donem || '')) return { ok:false, hata:'Dönem YYYY-AA biçiminde olmalı.' };
  const oku = (id, etiket, eksiOlabilir) => {
    const r = paraCoz(document.getElementById(id).value);
    if (!r.ok) return { ok:false, hata: etiket + ': ' + r.hata };
    if (!eksiOlabilir && r.kurus < 0) return { ok:false, hata: etiket + ' eksi olamaz.' };
    return r;
  };
  const dev = oku('kdDevir','Devir', false);       if (!dev.ok) return dev;
  const yen = oku('kdYeni','Yeni harcama', false); if (!yen.ok) return yen;
  const odn = oku('kdOdenen','Ödenen', false);     if (!odn.ok) return odn;
  /* Duzeltme EKSI olabilir — paraCoz eksi isareti okumaz, ayrica bakiyoruz */
  const dzH = document.getElementById('kdDuzeltme').value.trim();
  const eksi = /^\s*-/.test(dzH);
  const dzR = paraCoz(dzH);
  if (!dzR.ok) return { ok:false, hata:'Düzeltme: ' + dzR.hata };
  const dzKurus = eksi ? -dzR.kurus : dzR.kurus;

  const kalan = dev.kurus + yen.kurus + dzKurus - odn.kurus;
  return { ok:true, donem, kalan,
    satir: { kart_id: kart.id, donem,
      devir:(dev.kurus/100).toFixed(2), yeni_harcama:(yen.kurus/100).toFixed(2),
      duzeltme:(dzKurus/100).toFixed(2), odenen:(odn.kurus/100).toFixed(2),
      giren_id: PROFIL ? PROFIL.id : null } };
}

async function donemOnizle(kart, liste, kaydet){
  mesajTemizle('kartMsg');
  const r = donemSatiriUret(kart);
  const ov = document.getElementById('kdOnizleme');
  ov.textContent = '';
  if (!r.ok){ mesaj('kartMsg','hata', r.hata); return; }

  ov.appendChild(el('div','bilgi',
    r.donem + ' · KALAN = devir + yeni + düzeltme − ödenen = ' + tlk(r.kalan)));

  const onceki = liste.filter(x => x.donem < r.donem).sort((a,b) => b.donem.localeCompare(a.donem))[0];
  if (onceki && kr(r.satir.devir) !== kr(onceki.kalan))
    ov.appendChild(el('div','uyari-agir',
      'Devir tutmuyor: ' + onceki.donem + ' kalanı ' + tl(onceki.kalan)
      + ', girilen devir ' + tl(r.satir.devir) + '. Kaydedilir ama listede işaretli kalır.'));

  if (!kaydet) return;

  const btn = document.getElementById('kdKaydet');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kart_donem').insert(r.satir);
  btn.disabled = false; btn.textContent = 'Ayı kaydet';
  if (error){ hataYaz('kartMsg','Ay kaydedilemedi.', error); return; }
  mesaj('kartMsg','ok', r.donem + ' kaydedildi. Ekstreyi eklemeyi unutma.');
  await kartDetayAc(kart.id);
}

    return el('span', 'rozet ' + (yas <= 1 ? 'rz-yesil' : yas > 7 ? 'rz-sari' : 'rz-yesil'), ad);

  const b1 = el('button','btn','Kaydet'); b1.id = 'mKaydet'; b1.onclick = madenKaydet;
  f1.appendChild(b1); c.appendChild(f1);

  const f2 = el('div','kart');
  f2.appendChild(el('div','kbaslik','Gram fiyatı gir'));
  f2.appendChild(el('div','kucuk','Fiyat elle girilir ve TARİHLİDİR. Aynı tür için aynı tarihe ikinci fiyat girilemez. Geçmiş tarihli fiyat da girilebilir — alış değerleri böyle hesaplanır.'));
  f2.appendChild(el('label', null, 'Tür')).setAttribute('for','fTur');
  const s2 = document.createElement('select'); s2.id = 'fTur';
  [['altin','Altın'],['gumus','Gümüş']].forEach(([val,t]) => {

  ek2('Gram fiyatı','fFiyat','text','decimal');

async function madenKaydet(){
  mesajTemizle('madenMsg');
  const btn = document.getElementById('mKaydet');
  const g = gramCoz(document.getElementById('mGram').value);
  const kime = document.getElementById('mKime').value.trim();
  const tarih = document.getElementById('mTarih').value;
  if (!g.ok)  return mesaj('madenMsg','hata', g.hata);
  if (!kime)  return mesaj('madenMsg','hata','"Kime" zorunlu.');
  if (!tarih) return mesaj('madenMsg','hata','Alış tarihi zorunlu.');

  /* alis_tutar ZORUNLU DEGIL. Yazildiysa 0'dan buyuk olmali —
     maden_alis_tutar_chk'i ekranda da uygula, sunucuya hatali satir gitmesin. */
  const alisH = document.getElementById('mAlis').value.trim();
  let alisTutar = null;
  if (alisH){
    const a = paraCoz(alisH);
    if (!a.ok)         return mesaj('madenMsg','hata','Alış tutarı: ' + a.hata);
    if (a.kurus <= 0)  return mesaj('madenMsg','hata','Alış tutarı sıfırdan büyük olmalı. Bilinmiyorsa BOŞ bırak — 0 yazma.');
    alisTutar = (a.kurus/100).toFixed(2);
  }

  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('maden').insert({
    tur: document.getElementById('mTur').value,
    gram: g.deger.toFixed(3), kime, tarih,
    alis_tutar: alisTutar,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Kaydet';
  if (error){ hataYaz('madenMsg','Kayıt eklenemedi.', error); return; }
  mesaj('madenMsg','ok','Kayıt eklendi.');
  await vMaden();
}

async function fiyatKaydet(){
  mesajTemizle('madenMsg');
  const btn = document.getElementById('fKaydet');
  const p = paraCoz(document.getElementById('fFiyat').value);
  const tarih = document.getElementById('fTarih').value;
  if (!p.ok)        return mesaj('madenMsg','hata','Gram fiyatı: ' + p.hata);
  if (p.kurus <= 0) return mesaj('madenMsg','hata','Gram fiyatı sıfırdan büyük olmalı.');
  if (!tarih)       return mesaj('madenMsg','hata','Fiyat tarihi zorunlu.');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('maden_fiyat').insert({
    tur: document.getElementById('fTur').value,
    gram_fiyat:(p.kurus/100).toFixed(2), tarih,
    kaynak_notu: document.getElementById('fKaynak').value.trim() || null,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Fiyatı kaydet';
  if (error){ hataYaz('madenMsg','Fiyat kaydedilemedi.', error); return; }
  mesaj('madenMsg','ok','Fiyat kaydedildi.');
  await vMaden();
}

async function madenSil(m){
  const neden = prompt('Bu kayıt silinecek.\n\nGerekçe zorunlu ve kayda geçer:');
  if (neden === null) return;
  if (!neden.trim()){ mesaj('madenMsg','hata','Gerekçe zorunlu — silinmedi.'); return; }
  const { error } = await sb.from('maden').update({ is_deleted:true, silme_nedeni:neden.trim() }).eq('id', m.id);
  if (error){ hataYaz('madenMsg','Kayıt silinemedi.', error); return; }
  mesaj('madenMsg','ok','Kayıt silindi.');
  await vMaden();
}

/* ================== 4 · SAHIS ================== */
async function vSahis(){
  const c = document.getElementById('icerik');
  const v = await bantVerisi();
  const { borclar, odemeler } = v.sahis;
  const grup = new Map();
  for (const o of odemeler){
    if (!grup.has(o.borc_id)) grup.set(o.borc_id, []);
    grup.get(o.borc_id).push(o);
  }
  c.textContent = '';
  c.appendChild(bantCiz(v));
  const msg = el('div','msg'); msg.id = 'sahisMsg'; c.appendChild(msg);

  const k = el('div','kart');
  k.appendChild(el('div','kbaslik','Şahıs borçları'));
  if (!borclar.length) k.appendChild(el('div','bos','Kayıtlı şahıs borcu yok.'));

  for (const b of borclar){
    const od = grup.get(b.id) || [];
    const odenen = od.reduce((s,x) => s + kr(x.tutar), 0);
    const kalan = kr(b.tutar) - odenen;

    const kart = el('div','tk');
    const ust = el('div','tk-ust');
    ust.appendChild(el('div','tk-ad', b.isim));            // textContent
    ust.appendChild(el('div','tk-tutar', tlk(Math.max(0, kalan))));
    kart.appendChild(ust);
    kart.appendChild(el('div','tk-orta',
      'borç ' + tl(b.tutar) + ' · ' + trGun(b.tarih) + ' · ödenen ' + tlk(odenen) + ' (' + od.length + ')'));
    if (kalan < 0) kart.appendChild(el('div','uyari-orta','Ödemeler borçtan fazla: ' + tlk(-kalan) + ' fazla ödenmiş.'));
    if (b.aciklama) kart.appendChild(el('div','kucuk', b.aciklama));

    if (od.length){
      const sar = el('div','tablo-sar');
      const t = document.createElement('table');
      const hr = document.createElement('tr');
      ['TARİH','TUTAR','BELGE',''].forEach((h,i) => hr.appendChild(el('th', i===1?'sag':null, h)));
      t.appendChild(hr);
      for (const o of od){
        const tr = document.createElement('tr');
        tr.appendChild(td(trGun(o.tarih)));
        tr.appendChild(td(tl(o.tutar),'sag'));
        const dk = document.createElement('td');
        if (o.foto_path){
          const a = el('button','btn-mini','Aç');
          a.onclick = () => belgeAc(o.foto_path,'sahisMsg');
          dk.appendChild(a);
        } else { dk.appendChild(el('span','gri','belge yok')); }
        tr.appendChild(dk);
        const ey = document.createElement('td');
        const bd = el('button','btn-mini', o.foto_path ? 'Değiştir' : '+ Belge');
        bd.onclick = () => dekontEkle('sahis_odeme', o.id, 'sahis_odeme','sahisMsg', !!o.foto_path, () => vSahis());
        ey.appendChild(bd); tr.appendChild(ey);
        t.appendChild(tr);
      }
      sar.appendChild(t); kart.appendChild(sar);
    }
    const ey = el('div','tk-eylem');
    const bo = el('button','btn2','Ödeme ekle'); bo.onclick = () => sahisOdemeEkle(b);
    const bs = el('button','btn-kirmizi','Borcu sil'); bs.onclick = () => sahisBorcSil(b);
    ey.appendChild(bo); ey.appendChild(bs);
    kart.appendChild(ey);
    k.appendChild(kart);
  }
  c.appendChild(k);

  const f = el('div','kart');
  f.appendChild(el('div','kbaslik','Yeni şahıs borcu'));
  const ekle = (etiket,id,tip,mod) => {
    f.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input'); i.id = id; i.type = tip || 'text';
    if (mod) i.setAttribute('inputmode', mod);
    f.appendChild(i); return i;
  };
  ekle('Kime (isim)','sbIsim','text');
  ekle('Tutar','sbTutar','text','decimal');
  ekle('Tarih','sbTarih','date').value = bugun();
  f.appendChild(el('label', null, 'Açıklama')).setAttribute('for','sbAciklama');
  const ta = document.createElement('textarea'); ta.id = 'sbAciklama'; f.appendChild(ta);
  const bk = el('button','btn','Borcu kaydet'); bk.id = 'sbKaydet'; bk.onclick = sahisBorcKaydet;
  f.appendChild(bk); c.appendChild(f);
}

async function sahisBorcKaydet(){
  mesajTemizle('sahisMsg');
  const btn = document.getElementById('sbKaydet');
  const isim = document.getElementById('sbIsim').value.trim();
  const tarih = document.getElementById('sbTarih').value;
  const tut = paraCoz(document.getElementById('sbTutar').value);
  if (!isim)  return mesaj('sahisMsg','hata','İsim zorunlu.');
  if (!tarih) return mesaj('sahisMsg','hata','Tarih zorunlu.');
  if (!tut.ok) return mesaj('sahisMsg','hata','Tutar: ' + tut.hata);
  if (tut.kurus <= 0) return mesaj('sahisMsg','hata','Tutar sıfırdan büyük olmalı.');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('sahis_borc').insert({
    isim, tutar:(tut.kurus/100).toFixed(2), tarih,
    aciklama: document.getElementById('sbAciklama').value.trim() || null,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Borcu kaydet';
  if (error){ hataYaz('sahisMsg','Borç kaydedilemedi.', error); return; }
  mesaj('sahisMsg','ok','Borç kaydedildi.');
  await vSahis();
}

async function sahisOdemeEkle(borc){
  const tutarH = prompt('Ödeme tutarı:');
  if (tutarH === null) return;
  const t = paraCoz(tutarH);
  if (!t.ok || t.kurus <= 0){ mesaj('sahisMsg','hata','Ödeme tutarı geçersiz. Kayıt YAPILMADI.'); return; }
  const tarihH = prompt('Ödeme tarihi (YYYY-AA-GG):', bugun());
  if (tarihH === null) return;
  const tarih = (tarihH || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tarih)){
    mesaj('sahisMsg','hata','Tarih YYYY-AA-GG biçiminde olmalı. Kayıt YAPILMADI.'); return;
  }
  const { error } = await sb.from('sahis_odeme').insert({
    borc_id: borc.id, tutar:(t.kurus/100).toFixed(2), tarih,
    giren_id: PROFIL ? PROFIL.id : null });
  if (error){ hataYaz('sahisMsg','Ödeme kaydedilemedi.', error); return; }
  mesaj('sahisMsg','ok','Ödeme kaydedildi. Belge eklemeyi unutma.');
  await vSahis();
}

async function sahisBorcSil(borc){
  const neden = prompt('Bu borç kaydı silinecek.\n\nGerekçe zorunlu ve kayda geçer:');
  if (neden === null) return;
  if (!neden.trim()){ mesaj('sahisMsg','hata','Gerekçe zorunlu — silinmedi.'); return; }
  const { error } = await sb.from('sahis_borc').update({ is_deleted:true, silme_nedeni:neden.trim() }).eq('id', borc.id);
  if (error){ hataYaz('sahisMsg','Borç silinemedi.', error); return; }
  mesaj('sahisMsg','ok','Borç silindi.');
  await vSahis();
}
