   seciliyor; boylece ondan ONCEKI sekmeler mumkun oldugunca gorunur.
   Sahis'te sonuc degismiyor (86'da kaliyor), R4 korunuyor. */
/* ⚠ AO · ERISIM KATMANI · dort ekranda TEK yardimci.
   .tk kutulari <div onclick> idi: fareyle acilabiliyor, klavyeyle ve ekran
   okuyucuyla ACILAMIYORDU. Krediler · Kartlar · Maden · Sahis — dordune de
   ayni yardimci baglandi; ikisini yapip ikisini birakmak yeni tutarsizlik
   olurdu.
   ⚠ SADECE ERISIM: cizim, hesap ve akis DEGISMEDI. onclick yerinde duruyor,
     tus yolu onu CAGIRIYOR — iki ayri davranis yok.
   ⚠ Space sayfayi kaydirmasin diye preventDefault; Enter'da da zararsiz. */
function kutuErisim(kutu, etiket){
  kutu.setAttribute('role','button');
  kutu.tabIndex = 0;
  if (etiket) kutu.setAttribute('aria-label', etiket);
  kutu.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter' && e.key !== ' ' && e.key !== 'Spacebar') return;
    e.preventDefault();
    kutu.click();
  });
}

function seritiHizala(){
  const srt = document.getElementById('bolumSerit');
  const akt = srt && srt.querySelector('button.aktif');
  if (!akt) return;
  const st = getComputedStyle(srt);
  const pl = parseFloat(st.paddingLeft) || 0, pr = parseFloat(st.paddingRight) || 0;
  const sr = srt.getBoundingClientRect(), ar = akt.getBoundingClientRect();
  const sol = ar.left  - sr.left + srt.scrollLeft;      // icerik koordinati
  const sag = ar.right - sr.left + srt.scrollLeft;
  const enAz  = sag + pr - srt.clientWidth;             // sagdan sigmasi icin en az bu
  const enCok = sol - pl;                               // soldan sigmasi icin en cok bu
  srt.scrollLeft = Math.max(0, Math.min(enAz, enCok));
}

async function ekranAc(ad){
  EKRAN = ad; SECILI_KREDI = null;
  /* ⚠ AC-05: aktif bolum EKRAN OKUYUCUYA da bildirilir. Olculdu: aktiflik
     yalniz `.aktif` sinifiyla, yani GORSEL olarak tasiniyordu; ekran
     okuyucu hangi bolumde oldugunu HIC ogrenemiyordu. */
  document.querySelectorAll('#bolumSerit button').forEach(b => {
    const secili = b.dataset.b === ad;
    b.classList.toggle('aktif', secili);
    /* ⚠ AO · 'page' DEGIL 'true'. Olculdu: sayfada uc ayri oge
       aria-current=page tasiyordu (bolum seridi + alt cubuk + Daha) ve
       ekran okuyucu ayni sayfayi UC KEZ 'gecerli sayfa' diye duyuruyordu.
       Bolum seridi bir SAYFA degil, ayni sayfanin ekran sekmesi. */
    if (secili) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current');
  });
  /* ⚠ FAZ 4b · R4 · Aktif sekme yatayda gorunur alana getirilir. scrollIntoView
     KULLANILMADI: `block:'nearest'` bile serit dikeyde gorunmuyorsa SAYFAYI
     kaydirir. Yalniz seridin kendi scrollLeft'i oynatiliyor. ekranAc ilk
     yuklemede de cagriliyor (baslat), yani tiklama sarti yok. */
  seritiHizala();
  const c = document.getElementById('icerik');
  c.textContent = ''; c.appendChild(el('div','bos','Yükleniyor...'));
  try{
    if (ad === 'takvim')        await vTakvim();
    else if (ad === 'krediler') await vKrediler();
    else if (ad === 'kartlar')  await vKartlar();
    else if (ad === 'maden')    await vMaden();
    else if (ad === 'sahis')    await vSahis();
    else if (ad === 'cek')      await vCek();
    else if (ad === 'finans')   await vFinans();
  }catch(e){
    c.textContent = '';
    const k = el('div','kart');
    k.appendChild(el('div','uyari-agir','Ekran açılamadı: ' + hataTr(e && e.message)));
    c.appendChild(k); console.error(e);
  }
}

/* ================== UST OZET BANDI (her ekranda) ================== */
async function bantVerisi(){
  const [krediler, taksitler, sahis, maden, kart, cek] = await Promise.all([
    krediGetir(), taksitGetir(null), sahisGetir(), madenGetir(), kartGetir(), cekGetir()]);

  /* ⚠ CEK · NOMINAL. Iskonto/ciro hesabi YOK — cekin uzerindeki tutar ne
     ise borc odur. Acik cekler (durum='bekliyor') toplama girer; odenmis
     ve karsiliksiz cekler GIRMEZ.
     ⚠ sahip sozlugu kart.sahip ile AYNI (sahis|ltd), kredi.tur ile DEGIL. */
  let cekSahis = 0, cekLtd = 0;
  for (const c of cek.acik){
    if (c.sahip === 'ltd') cekLtd += kr(c.tutar); else cekSahis += kr(c.tutar);
  }
  const cekToplam = cekSahis + cekLtd;

  /* KART BORCU — her kartin EN SON donemindeki KAPANMAMIS tutar.
     Donemi hic girilmemis kart 0 SAYILMAZ; kac tane oldugu yazilir.
     ⚠ CJ · `kalan` DEGIL `kapanmamis`. Ikisi AYRI kavram:
         kalan      = devir + yeni + duzeltme − alacak   (EKSTRENIN yazdigi)
         kapanmamis = kalan − donem_odemesi              (GERCEKTE kalan borc)
       Olculdu: toplam kart borcu kalan ile 1.597.564,32 gorunuyordu,
       gercegi 1.101.607,09 — 495.957,23 ODENMIS para hala borc
       sayiliyordu. v107'de kapanmamis = kalan − COALESCE(donem_odemesi,0);
       yani odeme girilmemis donemde kapanmamis ZATEN kalan'a esittir ve
       HIC NULL olmaz — yerine koymak veri kaybettirmez (olculdu). */
  const sonDonem = kartSonDonemler(kart.donemler);
  let kartKalan = 0, kartDonemsiz = 0, kartDonemleri = new Set(), kartTutarsiz = 0;
  /* Kart da sahibine gore dogru bloga girer — kart.sahip zaten var (v91).
     Bugun 0 kart var; kart eklenince ayrim kendiliginden isler. */
  let kartSahis = 0, kartLtd = 0;
  for (const k of kart.kartlar){
    const d = sonDonem.get(k.id);
    if (!d){ kartDonemsiz++; continue; }
    kartKalan += kr(d.kapanmamis);
    if (k.sahip === 'ltd') kartLtd += kr(d.kapanmamis); else kartSahis += kr(d.kapanmamis);
    kartDonemleri.add(d.donem);
    if (d.devir_tutarsiz) kartTutarsiz++;
  }

  /* ⚠ AR · BU AY ODENECEK KART TUTARI — "son donemin kalani" DEGIL.
     Ikisi ayni sey degil: kesim 29 / odeme 3 olan bir kartta 29.07'de
     kesilen donem 03.08'de odenir; son donem 2026-08 olsa bile BU AY
     odenecek olan 2026-07'ninkidir. Bu yuzden hedef donem ARANIYOR.
     KURAL TURETILIYOR, sabit tablo YOK (yeni kart kendiliginden calisir):
       odeme gunu >  kesim gunu -> donem ODEME AYIYLA AYNI  (15 kesim/20 odeme)
       odeme gunu <= kesim gunu -> donem BIR ONCEKI ay      (29 kesim/3 odeme)
     ⚠ ALAN KAYNAGI TEK: sahip · kesim_gunu · son_odeme_gunu · aktif
       hepsi `kart` sorgusundan okunuyor. v_kart_donem de tasiyor ama ayni
       alani IKI kaynaktan cekip ikisi ayrisirsa SESSIZ HATA olur.
     ⚠ SESSIZ SIFIR YASAK. Uc yol da 0 uretebilir ve kullanici ayin nakit
       ihtiyacini EKSIK planlar; ucu de AYRI sayilir ve ekranda yazilir:
       gun bilgisi yok · hedef donem girilmemis · kart pasif.
     ⚠ kalan <= 0 (tam odenmis) katki 0 verir ve bu MESRU — uyari degil. */
  const oncekiAy = (ay) => { const [y,m] = ay.split('-').map(Number);
    const d = new Date(Date.UTC(y, m - 2, 1));      // m-2: bir onceki ayin indeksi
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2,'0'); };
  const donemAnahtar = new Map(kart.donemler.map(d => [d.kart_id + '|' + d.donem, d]));
  const buAyKart = { sahis:0, ltd:0, toplam:0, gunYok:0, donemYok:0, pasif:0, gecikmis:0,
    /* ⚠ gecikmis SAYAC olarak KALDI (mevcut cagiran satir bozulmasin)
       ama artik yalniz GERCEK gecikmeleri sayiyor. Uc liste ayri. */
    gecikenler:[], devredenler:[], asgariYok:[] };
  {
    const M = bugun().slice(0,7), gunBugun = Number(bugun().slice(8,10));
    for (const k of kart.kartlar){
      if (!k.aktif){ buAyKart.pasif++; continue; }
      if (k.kesim_gunu == null || k.son_odeme_gunu == null){ buAyKart.gunYok++; continue; }
      const hedef = k.son_odeme_gunu > k.kesim_gunu ? M : oncekiAy(M);
      const d = donemAnahtar.get(k.id + '|' + hedef);
      if (!d){ buAyKart.donemYok++; continue; }
      /* ⚠ CJ · KAPANMAMIS. "Bu ay cikacak nakit" sorusunun cevabi
         ekstrenin yazdigi tutar degil, HENUZ ODENMEMIS olan; odenmis
         para bir daha cikmaz. Guard da kapanmamis uzerinden: tam
         odenmis donem bu aya HIC girmez (bugunku niyet aynen korunur,
         yalniz dogru kolonla). */
      const kalan = kr(d.kapanmamis);
      if (kalan <= 0) continue;                     // tam odenmis — mesru sifir
      buAyKart.toplam += kalan;
      if (k.sahip === 'ltd') buAyKart.ltd += kalan; else buAyKart.sahis += kalan;
      /* ⚠ UC AYRI DURUM · ESKI HAL 4/4 YANLIS ALARM VERIYORDU.
         Eski kural: "son odeme gunu gectiyse ve kalan varsa GECIKMIS".
         ASGARI TUTARA HIC BAKMIYORDU. Canli olcum (30.08.2026): dort
         kartin dordu de asgariyi ODEMISTI ve uyari yine de basiyordu.
         Sahibi her ay KASTEN devrediyor; boyle bir uyari hicbir sey
         soylemez ve GERCEK gecikme oldugu gun ayni cumleyi basacagi
         icin ayirt EDILEMEZ.
         ⚠ VERI ZATEN VAR: v_kart_donem.asgari_tutar yukarida (kartGetir)
           okunuyor — yeni sorgu YOK.
         ⚠ donem_odemesi = bu ekstreye odenen. kapanmamis = kalan −
           COALESCE(donem_odemesi,0) oldugu icin ikisi ayni sey; burada
           NIYETI soyleyen ad kullaniliyor.
         ⚠ ASGARI NULL ise GECIKMIS SAYILMAZ: bilinmeyen ile gecikmis
           ayni sey degil. Ayri sayilir, ekranda "ayirt edilemiyor" der.
         ⚠ KIL PAYI ICIN AYRI ESIK YOK — sahibin karari. Yalniz uc durum. */
      if (Math.min(k.son_odeme_gunu, ayinSonGunu(M)) < gunBugun){
        const asgari = (d.asgari_tutar === null || d.asgari_tutar === undefined)
                       ? null : kr(d.asgari_tutar);
        const odenen = kr(d.donem_odemesi || 0);
        if (asgari === null){
          buAyKart.asgariYok.push({ ad: k.ad, banka: k.banka, kalan });
        } else if (odenen < asgari){
          buAyKart.gecikmis++;
          buAyKart.gecikenler.push({ ad: k.ad, banka: k.banka, kalan, asgari, odenen });
        } else {
          /* ⚠ FAIZ ORANI YOKSA SIFIR DA TAHMIN DE YAZILMAZ. Faizi
             bilinmeyen kartin maliyetini 0 gostermek, devretmeyi
             bedavaymis gibi okutur — en pahali yanlis. */
          /* ⚠ TAHMIN UST SINIRDIR, DUZELTME KATSAYISI YOK.
             `kalan × aylık oran` faizi BUTUN AYA isletiyor; gercekte faiz
             son odeme gununden ekstre kesimine kadar isliyor. Olculdu
             (28.08, gercek ekstreler): tahmin/gercek orani Enpara 0,59 ·
             KTU 0,83 · Ziraat Ticari 0,87 — TEK BIR SAYI DEGIL. Bir
             ortalama turetip tahmini "duzeltmek" uydurma bir kesinlik
             verirdi; tahmin oldugu gibi kaliyor ve ekranda UST SINIR
             oldugu yaziliyor.
             ⚠ GERCEK RAKAM YANINDA: o kartin SON EKSTRESINDEKI faiz ve
               vergi (kart_donem.faiz_tutari / vergi_masraf_tutari).
               YOKSA null kalir — sifir ya da tahmin YAZILMAZ. */
          buAyKart.devredenler.push({ ad: k.ad, banka: k.banka, kalan,
            faiz: k.faiz_orani == null ? null
                  : Math.round(kalan * Number(k.faiz_orani) / 100),
            gercekFaiz: d.faiz_tutari == null ? null : kr(d.faiz_tutari),
            gercekVergi: d.vergi_masraf_tutari == null ? null : kr(d.vergi_masraf_tutari),
            gercekDonem: d.donem });
        }
      }
    }
  }

  /* ⚠ BT · TAKVIM ICIN KART ODEME GUNLERI. Kural YENIDEN ICAT EDILMEDI —
     buAyKart'in turetmesinin AYNISI, yalniz yon ters: buAyKart "bu ayin
     odemesi hangi donemden" diye ARIYOR; takvim "her donemin odemesi
     hangi gune duser" diye CIKARIYOR. Iki yer ayni kurali okur:
       odeme gunu >  kesim gunu -> odeme DONEMIN AYINDA   (15 kesim/25 odeme)
       odeme gunu <= kesim gunu -> odeme SONRAKI ayda     (29 kesim/3 odeme)
       gun = min(son_odeme_gunu, ayin son gunu)
     Kapsam buAyKart ile AYNI suzgec: aktif kart · gun bilgisi olan ·
     kalan > 0 · odeme_turu 'tam' olmayan donemler.
     ⚠ DD · YALNIZ HER KARTIN SON DONEMI CIZILIR. Once butun donemler
       geziliyordu ve bu YAPISAL OLARAK YANLISTI:
         kalan = devir + yeni_harcama + duzeltme − alacak kayitlari
       `devir` onceki donemin ODENMEMIS kismidir; yani her ekstre bir
       oncekinin kalanini ZATEN ICERIR. Donemleri toplamak ayni borcu
       iki kez sayar:
         Enpara 2026-07 kapanmamis 200.000,00
         Enpara 2026-08 ekstre     467.567,96  <- 200.000 BUNUN ICINDE
       Takvim ikisini de ciziyordu.
       ⚠ NE KAYBOLUYOR: gecmis aylarda eski ekstre satirlari artik
         gorunmuyor. Bu BILINCLI — eski bir ekstrenin odenmemis kismi
         ayri bir borc degil, sonrakinin icinde. Ekranda da soyleniyor
         (takvimde ay dibinde not), kullanici "kayboldu mu" demesin.
       ⚠ Yansitma blogu (asagida) zaten son donemi kullaniyordu; artik
         iki yol AYNI donemi okuyor. */
  const sonrakiAy = (ay) => { const [y,m] = ay.split('-').map(Number);
    const d = new Date(Date.UTC(y, m, 1));
    return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2,'0'); };
  const kartOdemeleri = [];
  for (const k of kart.kartlar){
    if (!k.aktif || k.kesim_gunu == null || k.son_odeme_gunu == null) continue;
    let sonDonem = null;
    for (const x of kart.donemler)
      if (x.kart_id === k.id && (!sonDonem || x.donem > sonDonem.donem)) sonDonem = x;
    for (const d of (sonDonem ? [sonDonem] : [])){
      /* ⚠ CJ · DORDUNCU YER — brifte sayilmamisti, OLCUMLE cikti.
         Takvim 25.08 gununde "5 odeme · 1.563.029,90" diyordu, ayni bes
         kart icin Kartlar ekrani 1.101.607,09; ayni uygulamada IKI
         CELISEN BEYAN. Takvimin sorusu "o gun cebimden ne cikacak" —
         cevap odenmemis kisimdir. bantVerisi icinde ve dosya kapsaminda
         oldugu icin duzeltildi; degistigi RAPORDA yazili. */
      if (kr(d.kapanmamis) <= 0 || d.odeme_turu === 'tam') continue;
      const oAy = k.son_odeme_gunu > k.kesim_gunu ? d.donem : sonrakiAy(d.donem);
      const tarih = oAy + '-' + String(Math.min(k.son_odeme_gunu, ayinSonGunu(oAy))).padStart(2,'0');
      kartOdemeleri.push({ tarih, kart: k, donem: d, kalanKurus: kr(d.kapanmamis) });
    }
  }

  /* ⚠ CV · SONRAKI ODEME GUNU YANSITILIR — TAKVIMDEKI 800 BIN'LIK BOSLUK.
     OLCULDU (03.09.2026, canli): uc kartin son donemi 2026-08 ve odeme
     gunu GECMIS (Ziraat Ticari 25.08 · KTU 20.08 · Black 14.08). Eylul
     donemi henuz YOK (Ziraat kesimi 15.09). Sonuc: 801.607,09 TL
     kapanmamis borc takvimde HICBIR YERDE gorunmuyordu — takvim "eylulde
     is yok" diyordu, oysa uc kartin devir odemesi eylulde cikacak.
     Yansitma bu boslugu kapatir: son donemin kapanmamis'i, BIR SONRAKI
     odeme gununde gosterilir.
     ⚠ TAHMIN OLDUGU GIZLENMIYOR — ALT SINIRDIR: eylul ekstresine yeni
       harcama, faiz ve vergi de binecek. Satirda ve ay toplaminda
       "en az" olarak yazar (devredenler seridindeki "en cok faiz" ust
       sinir kalibinin aynasi).
     ⚠ CIFT SAYMA KAPALI: o kart icin yansitilacak donemin GERCEK satiri
       varsa yansitma uretilmez; donem girilir girilmez tahmin kaybolur,
       yerini gercek rakam alir.
     ⚠ YALNIZ BIR ADIM: aylarca ileri projeksiyon YOK. */
  const bugunISO = bugun();
  for (const k of kart.kartlar){
    if (!k.aktif || k.kesim_gunu == null || k.son_odeme_gunu == null) continue;
    /* Son donem: kapanmamis suzgeci OLMADAN. Suzsek, kapanmamis'i 0 olan
       bir son donem gorulmez ve ondan onceki acik donem "son" sanilip
       kapanmis borc yansitilirdi. */
    let sonD = null;
    for (const d of kart.donemler)
      if (d.kart_id === k.id && (!sonD || d.donem > sonD.donem)) sonD = d;
    if (!sonD) continue;
    if (kr(sonD.kapanmamis) <= 0 || sonD.odeme_turu === 'tam') continue;
    const oAyS = k.son_odeme_gunu > k.kesim_gunu ? sonD.donem : sonrakiAy(sonD.donem);
    const tarihS = oAyS + '-' + String(Math.min(k.son_odeme_gunu, ayinSonGunu(oAyS))).padStart(2,'0');
    if (tarihS >= bugunISO) continue;      // gunu daha gelmedi: zaten takvimde duruyor
    const yDonem = sonrakiAy(sonD.donem);
    if (kart.donemler.some(d => d.kart_id === k.id && d.donem === yDonem)) continue;
    const yAy = k.son_odeme_gunu > k.kesim_gunu ? yDonem : sonrakiAy(yDonem);
    const yTarih = yAy + '-' + String(Math.min(k.son_odeme_gunu, ayinSonGunu(yAy))).padStart(2,'0');
    kartOdemeleri.push({ tarih: yTarih, kart: k, donem: { donem: yDonem },
      kalanKurus: kr(sonD.kapanmamis), yansitma: true, kaynakDonem: sonD.donem });
  }

  const ko = krediOzet(taksitler);
  const buAy = bugun().slice(0,7);

  /* ===== BORÇ SINIFLARI — tek "toplam borç" YANLIŞTI =====
     Eski bant kredi taksitlerinin NOMİNAL toplamını (anapara + gelecek
     faiz), madenin RAYİÇ değerini, şahıs anaparasını ve kart kalanını
     TEK sayıda topluyordu. Bu sayı hiçbir karara yaramıyor:
       · "bugün kapatsam ne öderim" -> anapara
       · faiz ve masraf ancak ZAMAN GEÇERSE doğar, bugün ödenmez
       · maden sabit borç değil, piyasayla oynayan yükümlülük
     Artık üçü AYRI. Hesap mantığı değişmedi, gruplama değişti. */
  /* ⚠ 2b DÜZELTMESİ — LTD ANAPARASI İKİ KEZ SAYILIYORDU.
     İlk sürüm "ANAPARA" satırında TÜM anaparayı topluyor, altında Ltd'yi
     AYRICA gösteriyordu; Ltd'nin anaparası iki yerde birden görünüyordu —
     düzeltmeye çalıştığımız hata sınıfının ta kendisi.
     Artık İKİ BLOK: şahıs şirketinin borcu ile Ltd'nin borcu KARIŞMAZ.
     Hiçbir Ltd rakamı şahıs bloğunda görünmez, tersi de. */
  const krediTur = new Map(krediler.map(k => [k.id, k.tur]));
  const S = { anapara:0, faizMasraf:0, kirilimsiz:0, kirilimsizAdet:0, nominal:0, buAy:0, buAyOdenen:0 };
  const L = { anapara:0, faizMasraf:0, kirilimsiz:0, kirilimsizAdet:0, nominal:0, buAy:0, buAyOdenen:0 };
  const buAyD = bugun().slice(0,7);
  for (const t of taksitler){
    const g = krediTur.get(t.kredi_id) === 'ltd' ? L : S;
    if (t.vade_tarihi.slice(0,7) === buAyD){
      g.buAy += kr(t.toplam_tutar);
      if (t.odendi) g.buAyOdenen += kr(t.toplam_tutar);
    }
    if (t.durum === 'kapali') continue;            // kalan borç: kapanmamislar
    g.nominal += kr(t.kalan);
    if (t.anapara_tutar === null || t.anapara_tutar === undefined){
      /* KIRILIMI BİLİNMEYEN: anaparaya KATILMAZ, uydurulmaz. Kendi
         bloğunda parantez notu olarak duruyor (bugün tamamı Ltd). */
      g.kirilimsiz += kr(t.kalan); g.kirilimsizAdet++;
      continue;
    }
    /* v92 · KISMI ODEME: kalan anapara = anapara − odenmis anapara.
       Odemede ayrim girilmemisse (anapara_odenen 0) parcalar `kalan`i
       asar ve IC TUTARLILIK NOBETCISI bagirir — sessiz kalmaz. */
    g.anapara    += kr(t.anapara_tutar) - kr(t.anapara_odenen || 0);
    g.faizMasraf += kr(t.faiz_tutar) + kr(t.vergi_masraf_tutar || 0) - kr(t.faiz_odenen || 0);
  }
  let buAyKurus = 0, buAyOdenen = 0;
  for (const t of taksitler){
    if (t.vade_tarihi.slice(0,7) !== buAy) continue;
    buAyKurus += kr(t.toplam_tutar);
    if (t.odendi) buAyOdenen += kr(t.toplam_tutar);
  }

  /* Cari bakiye TEK DB gorunumunden gelir. Borc/odeme sorgularini istemcide
     yeniden toplamak ayri REST snapshot'larinda gecici fark uretebilirdi. */
  const sahisKalan = sahis.hesaplar.reduce((s,h) => s + Math.max(0,kr(h.bakiye)),0);

  /* ⚠ KUR FARKI yalniz IKISI DE bilinen kayitlardan hesaplanir.
     Ilk yazimda toplam bugunku degerden toplam alis degeri cikariliyordu;
     alis fiyati bilinmeyen bir kayit farki SISIRIYORDU (bugunku degeri
     sayiliyor, alisi sayilmiyordu). Ust banttaki en onemli rakam bu —
     sisirilmis hali yanlis karar verdirirdi. */
  let madenBugun = 0;                       // TOPLAM BORC icin: fiyati olan her kayit
  let esAlis = 0, esBugun = 0, hesaplanan = 0;   // FARK icin: yalniz eslesenler
  let fiyatiYok = [], alisiYok = 0, tahminSayisi = 0;
  for (const m of maden.kayitlar){
    const d = madenDeger(m, maden.fiyatlar);
    if (d.bugunKurus === null){
      const ad = m.tur === 'altin' ? 'altın' : 'gümüş';
      if (!fiyatiYok.includes(ad)) fiyatiYok.push(ad);
      continue;
    }
    madenBugun += d.bugunKurus;
    if (d.alisKurus === null){ alisiYok++; continue; }
    /* OLGU ve TAHMIN farkin icine birlikte girer (brief: 1. ve 2. gruptan),
       ama kac tanesinin tahmin oldugu YAZILIR — rakam tahmin tasiyorsa
       kullanici bunu bilmeli. */
    if (d.kaynak === 'tahmin') tahminSayisi++;
    esAlis  += d.alisKurus;
    esBugun += d.bugunKurus;
    hesaplanan++;
  }
  const madenAlis  = esAlis;
  const farkKurus  = (hesaplanan > 0) ? (esBugun - esAlis) : null;
  const farkBugun  = esBugun;

  /* ŞAHIS BLOĞU · "bugün kapatsam ne öderim"
     kredi anaparası + kişilere olan şahıs borcu + şahıs kartı.
     Maden ve şahıs borcu SAHİBİN kendi yükümlülüğü — Ltd'nin değil. */
  const sAnapara = S.anapara + sahisKalan + kartSahis;
  /* LTD BLOĞU · ayrı tüzel kişilik. Nominal gösteriliyor çünkü bu
     kredilerin büyük kısmında anapara/faiz kırılımı YOK; anapara diye
     eksik bir rakam yazmak yanıltırdı. */
  const lNominal = L.nominal + kartLtd;

  const krediParcaToplam = S.nominal + L.nominal;
  /* ⚠ İÇ TUTARLILIK — ÖNCEKİ HÂLİ TOTOLOJİKTİ.
     "şahıs nominal + ltd nominal = kredi nominal" diye bakıyordu; üçü de
     AYNI taksit listesinden toplandığı için fark her zaman sıfırdı ve
     negatif kontrolde ATEŞLEMEDİ. Ateşlemeyen nöbetçi, nöbetçi değildir.

     Anlamlı kontrol: her blokta KIRILIM toplamı NOMİNALE eşit mi.
     anapara + faiz/masraf + kırılımsız  =  toplam_tutar toplamı
     Bunlar FARKLI kolonlardan geliyor; biri bozuksa fark açılır. */
  const sapma = (g) => (g.anapara + g.faizMasraf + g.kirilimsiz) - g.nominal;
  const sSapma = sapma(S), lSapma = sapma(L);
  const parcaSapmasi = sSapma !== 0 ? sSapma : lSapma;

  return { krediler, taksitler, ko, buAyKurus, buAyOdenen, sahisKalan,
           madenBugun, madenAlis, farkBugun, farkKurus, fiyatiYok, alisiYok,
           hesaplanan, tahminSayisi, maden, sahis,
           cek, cekToplam, cekSahis, cekLtd, kartOdemeleri,
           kart, sonDonem, kartKalan, kartSahis, kartLtd, kartDonemsiz, kartTutarsiz, buAyKart,
           kartDonemleri: [...kartDonemleri].sort(),
           S, L, sAnapara, lNominal, krediParcaToplam, parcaSapmasi, sSapma, lSapma };
}

/* ===== BORC DAGILIMI SERIDI (D1) =====
   SORU: "bugun kapatsam ne oderim, hangi sinif ne kadar".
   SERITTE OLMAYANLAR ve NEDENI:
     · GELECEK FAIZ — bugun odenmez, zaman gecerse dogar. Bu soruya
       girmez. Baslik bunu soyluyor.
     · LTD — ayri tuzel kisilik, sahis sirketinin borcu degil.
       Seridin ALTINDA ayri satirda duruyor, oranlamaya KATILMIYOR.
   MADEN rayic: piyasa degeri, sabit borc DEGIL — hem segmentin
   uzerinde hem efsanede "rayic" yaziyor. Pozitif fark kirmizi degil. */
function seritCiz(v){
  const kutu = el('div');
  const sinif = [
  /* BJ · Serit artik TOPLAM ODEYECEGIM'in dagilimi (faiz dahil nominal,
     sahis+Ltd) — K0 kirilimiyla AYNI payda. Eski hali anapara dagilimiydi. */
    { k:'kredi', ad:'Kredi',  ton:'sg-kredi', ov:'var(--ana)', tutar: v.krediParcaToplam },
    { k:'sahis', ad:'Şahıs',  ton:'sg-sahis', ov:'var(--ok)',  tutar: v.sahisKalan },
    { k:'maden', ad:'Maden',  ton:'sg-maden', ov:'#C8952B',    tutar: v.madenBugun, rayic:true },
    { k:'kart',  ad:'Kart',   ton:'sg-kart',  ov:'#6B4E9E',    tutar: v.kartSahis + v.kartLtd },
    /* ⚠ CEK · doku mevcut dortten AYRI (dikey degil YATAY cizgi, 3px
       araliksiz) ve gri tonlu ciktida da ayrisir — renk tek basina bilgi
       tasimaz. Nominal: iskonto hesabi yok. */
    { k:'cek',   ad:'Çek',    ton:'sg-cek',   ov:'#0F6E72',    tutar: v.cekToplam }
  ];
  const toplam = sinif.reduce((a,x) => a + x.tutar, 0);
  if (toplam <= 0) return null;
  /* 0 olan sinif CIZILMEZ — sifir genislikte segment tiklanamaz ve
     efsanede "%0" gurultu yapar. Yoklugu asagida NOTLA soyleniyor. */
  const cizilen = sinif.filter(x => x.tutar > 0);
  const yuzde = x => (x.tutar / toplam) * 100;

  /* ⚠ BASLIK AYRI SATIR DEGIL, efsanenin basinda. Ayri satir 14px
     yiyordu ve bant+serit %30 sinirini asiyordu (olculdu: 97px blok).
     Bilgi ayni yerde duruyor, satir sayisi bir eksik. */
  const serit = el('div','serit');
  serit.setAttribute('role','group');
  serit.setAttribute('aria-label','Borç dağılımı');
  const lej = el('div','serit-lej');

  /* Secim KALICI SATIR — tooltip degil. Secilen sinif efsanede buyuyup
     TUTARINI aciyor; secim yokken hepsi ad + yuzde. */
  let secili = null;
  const lejCiz = () => {
    lej.textContent = '';
    /* ⚠ Metinler 375px'te TEK SATIR kalacak sekilde OLCULEREK secildi.
       "bugün kapatsam · faiz hariç" iki satira sariyordu (31px); soru
       burada, kapsam dipte. Ikisi birden 50px yerine 65px ediyordu. */
    lej.appendChild(el('span','bs','vadesinde ödenirse'));
    for (const x of cizilen){
      const p = el('span', 'pr' + (secili === x.k ? ' sec' : ''));
      const ov = el('span','ov'); ov.style.background = x.ov;
      p.appendChild(ov);
      /* "rayic" normalde segmentin UZERINDE yaziyor; efsanede tekrar
         etmek satiri sardiriyordu. AMA segment %15'in altina duserse ic
         etiket cizilmiyor — o zaman "rayic" efsaneye TASINIR, hicbir
         durumda kaybolmaz. */
      p.appendChild(document.createTextNode(
        x.ad + (x.rayic && yuzde(x) < 15 ? ' (rayiç)' : '') + ' '));
      if (secili === x.k){
        p.appendChild(el('b', null, tlk(x.tutar)));
        /* ⚠ AL3 · toFixed NOKTA uretir; Turkce metinde ondalik VIRGULdur.
           Dosyadaki dogru ornekle ayni desen (faiz orani satiri). */
        p.appendChild(document.createTextNode(' · %' + yuzde(x).toFixed(1).replace('.',',')
                       + (x.rayic ? ' · rayiç' : '')));
      } else {
        p.appendChild(document.createTextNode('%' + Math.round(yuzde(x))));
      }
      lej.appendChild(p);
    }
  };

  for (const x of cizilen){
    const sg = el('button', 'sg ' + x.ton);
    sg.type = 'button';
    /* ⚠ Cok kucuk pay (%2 alti) flex ile 1-2 piksele duser: gorunmez ve
       tiklanamaz olur. Taban genislik veriliyor; oran YAZIYLA dogru. */
    sg.style.flex = Math.max(yuzde(x), 2) + ' 1 0';
    sg.setAttribute('aria-pressed','false');
    sg.setAttribute('aria-label', x.ad + (x.rayic ? ' rayiç' : '') + ' ' + tlk(x.tutar)
                    /* AL3 · ekran okuyucuya giden metin de virgullu */
                    + ', yüzde ' + yuzde(x).toFixed(1).replace('.',','));
    /* ⚠ ETIKET SEGMENTIN ICINE ANCAK SIGIYORSA. Esik ORANDAN hesaplaniyor,
       DOM olcumunden DEGIL: olcum requestAnimationFrame gerektiriyor, o da
       sekme gorunur degilse HIC CALISMIYOR (olculdu) — etiket yarim kalirdi.
       320px'te serit ~294px; %15 ~44px, "Şahıs"/"rayiç" 11px'te ~33-35px.
       Sigmayan sinifin adi efsanede ZATEN var; hicbir sinif adsiz kalmiyor. */
    if (yuzde(x) >= 15) sg.appendChild(el('span','ic', x.rayic ? 'rayiç' : x.ad));
    sg.onclick = () => {
      secili = (secili === x.k) ? null : x.k;
      for (const d of serit.children) d.setAttribute('aria-pressed', 'false');
      if (secili) sg.setAttribute('aria-pressed','true');
      lejCiz();
    };
    serit.appendChild(sg);
  }
  kutu.appendChild(serit);
  lejCiz();
  kutu.appendChild(lej);


  /* Ltd oranlamaya girmiyor ama GORUNMEZ de olmuyor; kart 0 ile
     "girilmedi" AYNI GORUNMEMELI — hangisi oldugu yaziliyor. */
  const dip = el('div','serit-dip');
  /* ⚠ D3 · Ltd RAKAMI BURADAN KALDIRILDI — MÜKERRERDİ. Bant zaten bir üst
     satırda "LTD <tutar> · bu ay ..." gösteriyor. Aynı rakamı iki kez yazmak
     yer yiyor; ikisi bir gün ayrışırsa hangisinin doğru olduğu belli olmaz.
     Ltd'nin ŞERİDE GİRMEME kuralı AYNEN duruyor — `sinif` dizisinde Ltd yok,
     oranlamaya katılmıyor; bu satır artık onu SÖYLÜYOR, tekrar etmiyor.
     "gelecek faiz hariç" 11px'te iki satıra sarıyordu; "faiz hariç" yeter. */
  /* ⚠ FAZ 2a·B · PAYDA ACIK YAZILIR. Yuzdeler zaten hesaplaniyordu ama
     NEYIN yuzdesi oldugu ekranda yoktu. Yeni bir toplam UYDURULMUYOR:
     `toplam` bu fonksiyonun yukarisinda zaten cizilen siniflarin
     toplami olarak duruyor ve seridin paydasi odur. */
  dip.appendChild(el('div','serit-payda',
    'Yüzdeler ' + tlk(toplam) + ' üzerinden — vadesinde ödenirse toplam borcun dağılımı (faiz dahil, şahıs+Ltd).'));
  /* ⚠ M3 · "faiz hariç · Ltd hariç" BURADAN CIKARILDI. Bu satir bandin
     TAMAMI icin gecerliymis gibi duruyordu; oysa katman 2 ve katman 4
     Ltd'yi ICERIYOR ve kendi kapsam notlarinda oyle yaziyor. Ayni
     ekranda iki celisen beyan vardi. Ifade katman 1'in KENDI notunda
     zaten duruyor — orasi dogru yer, cunku dagilim seridi de yalniz
     o kapsami cizer. "kart: veri girilmedi" KALDI: dogru ve gerekli. */
  if (!v.kartSahis){
    /* "0" ile "girilmedi" AYNI GORUNMEZ — hangisi oldugu yaziliyor. */
    const kartNot = (v.kart.kartlar.length && v.kartDonemsiz < v.kart.kartlar.length)
      ? 'kart: kalan 0' : 'kart: veri girilmedi';
    dip.appendChild(document.createTextNode(kartNot));
  }
  if (dip.childNodes.length) kutu.appendChild(dip);
  return kutu;
}

function bantCiz(v){
  const b = el('div','bant');
  /* ⚠ FAZ 2a · UC KARAR KATMANI. Hicbir hesap degismedi; ayni dugumler
     ayni degerlerle, yalniz AYRI kapsayicilara giriyor. `hedef` eklendi:
     satir() artik hangi katmana yazacagini biliyor. */
  /* ⚠ KAPSAM NOTU KATMANIN ICINDE. Bant dipnotu "faiz hariç · Ltd hariç"
     diyordu ve BANDIN TAMAMI icin gecerliymis gibi duruyordu. Oysa orta
     katman Ltd'yi ICERIYOR, ust katman DISLIYOR. Ayni bandin bir katmani
     Ltd'yi disliyor digeri iceriyorsa bu ACIKCA yazilmali; yoksa ekran
     yalan soyler. Her katman kendi kapsamini tasiyor. */
  const katman = (etiket, kapsam) => {
    const k = el('div','kat');
    if (etiket){
      const e = el('div','kat-et', etiket);
      if (kapsam) e.appendChild(el('span','kat-kapsam', ' · ' + kapsam));
      k.appendChild(e);
    }
    b.appendChild(k);
    return k;
  };
  /* parcalar: [metin, {v:deger, s:sinif}, metin, ...] — akan satir */
  const satir = (hedef, ...parcalar) => {
    const s = el('div','sr');
    for (const p of parcalar){
      if (p === null || p === undefined) continue;
      if (typeof p === 'string') s.appendChild(document.createTextNode(p));
      else s.appendChild(el(p.s ? 'span' : 'b', p.s || null, p.v));
    }
    (hedef || b).appendChild(s);
  };

  /* ===== BLOK 1 · SENİN BORCUN (şahıs şirketi) =====
     Hiçbir Ltd rakamı buraya girmez, tersi de. */
  /* ==== BJ · KATMAN 0 · TOPLAM ODEYECEGIM — EN USTE, EN BUYUK ====
     Kullanicinin itirazi: "bugun nasil kapatayim; en uste FAIZLERIYLE ne
     ise o olmali." Toplam = kredi NOMINALI (faiz DAHIL, sahis+Ltd) +
     kart + sahis cari + maden rayic. NOMINAL bilerek: taksitler vadesinde
     odenecek, faiz DOGACAK. Hesaplarin hepsi zaten bantVerisi'nde. */
  const kartToplam = v.kartSahis + v.kartLtd;
  const krediNominal = v.krediParcaToplam;              // banttaki "Taksit nominali" ile AYNI
  /* ⚠ CEK NOMINAL girer (v112): cekin uzerindeki tutar ne ise borc odur.
     Iskonto/ciro/kesif hesabi YOK — bu yuzden toplamOde ve kapatsam AYNI
     rakami alir; cekte "dogmamis faiz" diye bir sey yoktur, erken kapatma
     tasarrufu URETMEZ. Tasarruf nobetcisi bu yuzden bozulmaz. */
  const toplamOde = krediNominal + kartToplam + v.sahisKalan + v.madenBugun + v.cekToplam;
  /* Bugun kapatsam: anapara + kirilimsiz (faiz ayrimi bilinmeyen nominali
     ile) + cari + kart + maden. Tasarruf = toplam − kapatsam; tanim geregi
     gelecek faiz+masraf toplamina ESIT olmali — degilse asagida bagirir. */
  const kapatsam = v.sAnapara + v.S.kirilimsiz + v.madenBugun
                 + v.L.anapara + v.L.kirilimsiz + v.kartLtd + v.cekToplam;
  const tasarruf = toplamOde - kapatsam;
  b.appendChild(el('div','blok-et','TOPLAM BORÇ · şahıs + Ltd'));
  const k0 = katman(null, null);
  const bas0 = el('div','bas');
  bas0.appendChild(el('span','et','Toplam ödeyeceğim · faiz dahil'));
  bas0.appendChild(el('span','dg dg-buyuk', tlk(toplamOde)));
  k0.appendChild(bas0);
  k0.appendChild(el('div','kirilim','vadesinde ödenirse — doğacak faiz ve masraf dahil'));
  /* KIRILIM · buyukten kucuge, yuzdesiyle. Payda = toplamOde. */

       MALIYET; kart kart dokum bir dokunus uzakta.
       ⚠ Desen ICAT EDILMEDI: ozetCiz'in serit-ozet kalibi.
       ⚠ FAIZI BILINMEYEN KART TOPLAMA GIRMEZ ve KAC TANE oldugu
         ozette YAZAR — "hesaplanan kismi" oldugu gizlenmiyor. */
    const topKalan = bk.devredenler.reduce((s,x) => s + x.kalan, 0);
    const faizli   = bk.devredenler.filter(x => x.faiz !== null);
    const topFaiz  = faizli.reduce((s,x) => s + x.faiz, 0);
    const faizsizN = bk.devredenler.length - faizli.length;
    const ac = el('button','serit-ozet'); ac.type = 'button';
    ac.setAttribute('aria-expanded','false');
    const p1 = el('span','so-p');
    p1.appendChild(el('span','so-et', bk.devredenler.length + ' kart devretti'));
    p1.appendChild(el('span','so-dg', tk(topKalan)));
    ac.appendChild(p1);
    const p2 = el('span','so-p');
    /* ⚠ "en çok" · TAHMIN UST SINIRDIR. Eski etiket "aylık faizi" idi ve
       hesaplanmis bir gercek gibi okunuyordu; olculdu ki gercek faiz
       tahminin %59-87'si arasinda cikiyor (faiz tum aya degil, son odeme
       gununden kesime kadar isliyor). */
    /* ⚠ "en çok" = ust sinir. "aylık faizi en çok" denenmisti: serit
       432px'e cikip 345px kutuda RAKAMI kesiyordu (olculdu). */
    p2.appendChild(el('span','so-et','en çok faiz'));
    p2.appendChild(el('span','so-dg', faizli.length
      ? tk(topFaiz) + (faizsizN ? ' (+' + faizsizN + ' hesaplanamıyor)' : '')
      : 'hesaplanamıyor'));
    ac.appendChild(p2);
    const okD = el('span','so-ok','▾'); ac.appendChild(okD);
    ac.setAttribute('aria-label', bk.devredenler.length
      + ' kart asgarisi ödenip devretti, toplam ' + tk(topKalan) + '. Dökümü aç.');
    c.appendChild(ac);
    const kutuD = el('div'); kutuD.hidden = true; c.appendChild(kutuD);
    ac.onclick = () => {
      if (kutuD.hidden){
        if (!kutuD.firstChild){
          const d2 = el('div','bilgi');
          d2.appendChild(document.createTextNode(
            'Asgarisi ödendi, kalanı gelecek aya devretti — gecikme değil:\n'));
          for (const x of bk.devredenler){
            d2.appendChild(document.createTextNode('· ' + x.ad + ' ' + tk(x.kalan)
              + (x.faiz === null
                 ? ' — faiz oranı girilmemiş, maliyeti hesaplanamıyor'
                 : ' · faizi en çok ' + tk(x.faiz)) + '\n'));
            /* ⚠ GERCEK RAKAM · YALNIZ VARSA. Uc kartta (Axess, Black,
               Samsun) ekstre faizi girilmemis; onlarda bu satir HIC
               yazilmaz — "0" ya da tahmin yazmak, olmayan bir olcumu
               var gibi gosterirdi. */
            if (x.gercekFaiz !== null)
              /* ⚠ BOSLUKLA GIRINTI CALISMIYOR: kutu white-space:normal,
                 bastaki bosluklar cokuyor ve satir ust satira degil,
                 hicbir seye ait gorunuyordu (ekran goruntusunde olculdu).
                 Ok isareti girintinin yerini tutar. */
              d2.appendChild(document.createTextNode('→ '
                + ayAdi(x.gercekDonem) + ' ekstresinde gerçek: faiz ' + tk(x.gercekFaiz)
                + (x.gercekVergi !== null ? ' + vergi ' + tk(x.gercekVergi) : '')
                + '\n'));
          }
          d2.appendChild(document.createTextNode(
            'Tahmin ÜST SINIRDIR: faiz tüm aya değil, son ödeme gününden '
          + 'ekstre kesimine kadar işler. Gerçek tutar ekstrede yazar ve '
          + 'üstüne vergi biner.'));
          kutuD.appendChild(d2);
        }
        kutuD.hidden = false; okD.textContent = '▴';
        ac.setAttribute('aria-expanded','true');
      } else {
        kutuD.hidden = true; okD.textContent = '▾';
        ac.setAttribute('aria-expanded','false');
      }
    };
  }
  /* 3 · ASGARI GIRILMEMIS — gecikmis SAYILMIYOR, bilinmiyor deniyor */
  if (bk.asgariYok.length)
    c.appendChild(el('div','bilgi', 'Asgari tutarı girilmemiş '
      + bk.asgariYok.length + ' kartta gecikme olup olmadığı ayırt edilemiyor: '
      + bk.asgariYok.map(x => x.ad + ' ' + tk(x.kalan)).join(' · ')
      + '. Ekstredeki asgari tutarı girersen ayrılır.'));

  /* ⚠ BT · takvim artik UC kaynak cizer; "taksit yok" tek basina bos
     ekran sebebi degil. Ucü de bossa bos durum. */
  if (!v.taksitler.length && !v.kartOdemeleri.length && !v.cek.acik.length){
    const k = el('div','kart');
    k.appendChild(el('div','kbaslik','Takvim'));
    k.appendChild(el('div','bos','Henüz ödeme yok. Kredi taksiti, kart ekstresi veya çek girilince burada görünür.'));
    c.appendChild(k); return;
  }

  const b = bugun(), buAy = b.slice(0,7);
  /* Yeni sorgu YOK — bantVerisi'nin zaten cektigi UC kaynak gune gore
     gruplaniyor: kredi taksiti (v.taksitler) · kart odemesi
     (v.kartOdemeleri, buAyKart kuralindan turetilmis gun) · acik cek
     (v.cek.acik). Vade (kira/vergi) BILEREK YOK: o kaynak borc.html'de
     hic cekilmiyor, katmak yeni sorgu demek — ayri is. */
  const gunMap = new Map();
  for (const t of v.taksitler){
    if (!gunMap.has(t.vade_tarihi)) gunMap.set(t.vade_tarihi, []);
    gunMap.get(t.vade_tarihi).push(t);
  }
  /* Kart ve cek AYRI haritada: gunMap'in satirlari taksitKarti'ye gider
     ve o desen (kirilim · Odeme gir · dekont) yalniz taksite dogru.
     Karistirmak kredi satirlarinin halini de degistirirdi. */
  const gunEk = new Map();
  const ekKoy = (tarih, kayit) => {
    if (!gunEk.has(tarih)) gunEk.set(tarih, []);
    gunEk.get(tarih).push(kayit);
  };
  for (const ko of v.kartOdemeleri) ekKoy(ko.tarih, { tur:'kart', ...ko });
  for (const cx of v.cek.acik) ekKoy(cx.vade_tarihi, { tur:'cek', tarih: cx.vade_tarihi,
    kalanKurus: kr(cx.tutar), cek: cx });
  const aylar = [...new Set([
    ...v.taksitler.map(t => t.vade_tarihi.slice(0,7)),
    ...[...gunEk.keys()].map(t => t.slice(0,7))])].sort();
  if (!TAKVIM_AY || !aylar.includes(TAKVIM_AY))
    TAKVIM_AY = aylar.includes(buAy) ? buAy : aylar[0];

  const kap = el('div','kart'); c.appendChild(kap);
  const ctx = { kap, gunMap, gunEk, aylar, krediMap, b, buAy, taksitler: v.taksitler };
  TAKVIM_CTX = ctx;              // FAZ 2b·E · popstate bunu kullanir
  takvimYenile(ctx);
}

/* Ay izgarasi + gun paneli. Ay/gun degisince yalniz bu kap yeniden cizilir. */
function takvimYenile(ctx){
  const { kap, gunMap, gunEk, aylar, krediMap, b, buAy } = ctx;
  kap.textContent = '';
  const ay = TAKVIM_AY, [yil, aySira] = ay.split('-').map(Number);
  const i = aylar.indexOf(ay);

  /* --- baslik: ‹ Ay Yil › + o ayin ozeti --- */
  const bas = el('div','tkv-bas');
  const ok = (yon, etiket, hedef) => {
    const d = el('button', null, etiket);
    d.type = 'button'; d.setAttribute('aria-label', yon);
    if (hedef === undefined) d.disabled = true;
    else d.onclick = () => { TAKVIM_AY = hedef; TAKVIM_GUN = null; takvimYenile(ctx); };
    return d;
  };
  bas.appendChild(ok('Önceki ay','‹', aylar[i-1]));
  const ort = el('div','ort');
  ort.appendChild(el('div','ay', ayAdi(ay) + (ay === buAy ? ' · bu ay' : '')));
  const ayT = [...gunMap.entries()].filter(([g]) => g.slice(0,7) === ay).flatMap(([,l]) => l);
  /* BT · ay ozeti UC kaynagi kapsar: taksit + kart + cek. */
  const ayEk = [...gunEk.entries()].filter(([g]) => g.slice(0,7) === ay).flatMap(([,l]) => l);
  const aySayi = ayT.length + ayEk.length;
  ort.appendChild(el('div','oz', aySayi
    /* ⚠ D6 · NOMINAL degil KALAN. Kismi odenmis taksitte "bu ay ne kadar
       odeyecegim" sorusunun cevabi nominal degil kalandir. Kartta da
       kalan (donem kalani), cekte nominal = kalan (kismi odeme yok). */
    ? aySayi + ' ödeme · ' + tlk(ayT.reduce((s,t) => s + kr(t.kalan), 0)
                                 + ayEk.reduce((s,e) => s + e.kalanKurus, 0)) + ' kalan'
    : 'ödeme yok'));
  bas.appendChild(ort);
  bas.appendChild(ok('Sonraki ay','›', aylar[i+1]));
  /* FAZ 2b·A · takvim SOL sutun, ajanda SAG sutun (>=900px) */
  const duzen = el('div','tkv-duzen');
  const sol = el('div','tkv-sol');
  kap.appendChild(duzen); duzen.appendChild(sol);
  sol.appendChild(bas);

  /* --- hafta basliklari + gun izgarasi --- */
  const hf = el('div','tkv-hafta');
  for (const g of ['Pt','Sa','Ça','Pe','Cu','Ct','Pz']) hf.appendChild(el('div', null, g));
  sol.appendChild(hf);          // hafta basliklari da SOL sutunda

  const izg = el('div','tkv-izgara');
  const ilk = new Date(yil, aySira - 1, 1);
  const bosluk = (ilk.getDay() + 6) % 7;                 // Pazartesi = 0
  const gunSayisi = new Date(yil, aySira, 0).getDate();
  /* ===== HAFTALIK TOPLAM · SEKIZINCI SUTUN ACILMADI =====
     ⚠ 375px'te 7 sutun x ~52px. Sekizinci sutun her hucreyi ~7px
       daraltir ve dokunma hedefi 44px'in ALTINA iner — olculdu, hucre
       bugun 52px. Bunun yerine haftanin ALTINA `grid-column:1/-1` ile
       TAM GENISLIKTE ince bir serit konuyor: izgara yine 7 sutun,
       hucre genisligi HIC degismiyor.
     ⚠ KAYNAK IZGARAYLA AYNI: gunMap (taksit) + gunEk (kart + cek),
       tutar da ayni kolonlardan — taksitte kr(t.kalan), ek kayitta
       e.kalanKurus. Gun hucresinin aria-label'i ve ay basligi da AYNI
       ikisini topluyor; farkli kaynaktan toplasaydik izgarayla
       celisirdi. (Vergi vadeleri bu takvimde YOK — index.html'de.)
     ⚠ ODEMESI OLMAYAN HAFTADA SERIT CIZILMEZ: rozet yalniz is varsa. */
  let haftaKurus = 0, haftaAdet = 0, sutun = bosluk;
  const haftaKapat = () => {
    if (haftaAdet > 0){
      const s = el('div','tkv-hafta-toplam');
      s.appendChild(el('span','hs-et', 'hafta'));
      s.appendChild(el('span','hs-dg', tlk(haftaKurus)));
      s.appendChild(el('span','hs-ad', haftaAdet + ' ödeme'));
      izg.appendChild(s);
    }
    haftaKurus = 0; haftaAdet = 0;
  };
  for (let n = 0; n < bosluk; n++){
    const h = el('div','tkv-g bos'); h.setAttribute('aria-hidden','true'); izg.appendChild(h);
  }
  for (let g = 1; g <= gunSayisi; g++){
    const tar = ay + '-' + String(g).padStart(2,'0');
    const liste = gunMap.get(tar) || [];
    const ek = gunEk.get(tar) || [];
    const h = el('button','tkv-g' + (tar === b ? ' bugun' : '')); h.type = 'button';
    /* ⚠ KREDI ISARETI TEK, panel hepsini listeler. Oncelik: gecikmis >
       Ltd > bekleyen > odendi — en aciliyeti olan gorunur. Bu mantik
       DEGISMEDI; kart ve cek KENDI isaretleriyle YANINA eklenir. */
    const acik = liste.filter(t => t.durum !== 'kapali');
    const im = !liste.length ? null
      : acik.some(t => t.vade_tarihi < b)      ? 'gecikmis'
      : acik.some(t => t.kredi_tur === 'ltd')  ? 'ltd'
      : acik.length                            ? 'bekliyor' : 'odendi';
    /* BT · gecikmis SAYI vurgusu artik uc kaynagi da kapsar: gecmis
       tarihli ek kayit (kart/cek) da gunun sayisini vurgular. Isaret
       sekli kaynagi soyler, altcizgi aciliyeti — renkten bagimsiz. */
    if (im === 'gecikmis' || ek.some(e => e.tarih < b)) h.classList.add('gecikmis');
    h.appendChild(el('span','sy', String(g)));
    if (im) h.appendChild(el('span','im im-' + im));
    /* BT · kaynak basina TEK isaret, sekilleri farkli (kredi cizgi ·
       kart DOLU DAIRE · cek DIKEY CIZGILI kare) — gri tonluda da ayrisir. */
    if (ek.some(e => e.tur === 'kart')) h.appendChild(el('span','im im-kart'));
    if (ek.some(e => e.tur === 'cek'))  h.appendChild(el('span','im im-cek'));
    /* ⚠ FAZ 2b·C · aria-pressed YERINE aria-selected. aria-pressed
       "acik/kapali dugme" der; burada bir GUN SECIMI var. Ayrica bugun
       aria-current="date" ile bildiriliyor — bolum seridindeki
       aria-current="page" ile KARISMAZ, iki ayri deger. */
    if (tar === TAKVIM_GUN) h.setAttribute('aria-selected','true');
    if (tar === b) h.setAttribute('aria-current','date');
    /* Tam tarih: gun + ay + YIL + gun adi. Ekran okuyucu "18" degil
       "18 Ağustos 2026, Salı" okusun. */
    const gd = new Date(tar + 'T00:00');
    /* ⚠ ayAdi(ay) YILI ZATEN ICERIYOR — olculdu: "10 Ağustos 2026 2026"
       cikti. Yil ikinci kez eklenmiyor. */
    h.setAttribute('aria-label',
      g + ' ' + ayAdi(ay) + ', ' + GUN_ADLARI[gd.getDay()]
      + (tar === b ? ' · bugün' : '')
      + ((liste.length + ek.length)
         ? ' · ' + (liste.length + ek.length) + ' ödeme · '
           + tlk(liste.reduce((s,t)=>s+kr(t.kalan),0) + ek.reduce((s,e)=>s+e.kalanKurus,0)) + ' kalan'
         : ' · ödeme yok'));
    h.onclick = () => { takvimGunSec((TAKVIM_GUN === tar) ? null : tar, ctx); };
    izg.appendChild(h);
    /* Haftanin toplami: gun hucresinin KENDI kaynagindan, ayni satirda */
    haftaKurus += liste.reduce((s,t) => s + kr(t.kalan), 0)
                + ek.reduce((s,e) => s + e.kalanKurus, 0);
    haftaAdet  += liste.length + ek.length;
    sutun++;
    if (sutun % 7 === 0) haftaKapat();        // Pazar doldu, serit
  }
  haftaKapat();                                // ayin son (yarim) haftasi
  sol.appendChild(izg);

  /* --- gun paneli: izgaranin ALTINDA, modal DEGIL --- */
  if (TAKVIM_GUN){
    const p = el('div','tkv-panel');
    const d = new Date(TAKVIM_GUN + 'T00:00');
    p.appendChild(el('div','pb', d.getDate() + ' ' + AYLAR[d.getMonth()] + ', ' + GUN_ADLARI[d.getDay()]));
    p.appendChild(el('div','pu', TAKVIM_GUN === b ? 'bugün'
      : TAKVIM_GUN < b ? gunFarki(b, TAKVIM_GUN) + ' gün geçti'
      : gunFarki(TAKVIM_GUN, b) + ' gün sonra'));
    const liste = gunMap.get(TAKVIM_GUN) || [];
    const ekListe = gunEk.get(TAKVIM_GUN) || [];
    if (!liste.length && !ekListe.length) p.appendChild(el('div','bos','Bu gün ödeme yok.'));
    else {
      /* Gun paneli taksitKarti'yi YENIDEN KULLANIYOR: kirilim, "Ltd gidere
         yazilmaz", Odeme gir ve dekont dugmeleri orada ZATEN dogru.
         ⚠ Kredi satirlarina "kredi" etiketi EKLENMEDI: satirin hali
           degismeyecek (kabul kriteri) ve "N. taksit" ibaresi kaynagi
           zaten soyluyor. Kart ve cek satirlari turunu ACIKCA yazar. */
      for (const t of liste)
        p.appendChild(taksitKarti(t, krediMap.get(t.kredi_id), b, buAy));
      for (const e of ekListe)
        p.appendChild(takvimEkKarti(e, b));
    }
    duzen.appendChild(p);
  }

  /* ===== CV · AY TOPLAMI · SAHIS ile LTD KARISMAZ =====
     ⚠ Tek sayida toplamak, bant kodunda (S/L bloklari) bilerek
       duzeltilen hatanin ta kendisi olurdu: Ltd'nin borcu sahsin
       borcuyla ayni cebe yazilamaz.
       Kaynak sutunlari OKUNDU, varsayilmadi: kredi tarafinda
       taksit.kredi_tur, kart tarafinda kart.sahip, cek tarafinda
       cek.sahip — ucu de 'ltd' degeriyle ayrilir.
     ⚠ ODENMIS TAKSIT TOPLAMA GIRMEZ: durum='kapali' olan bir taksit
       "yapilacak odeme" degil, olmus bitmis istir. Ayri kalemde,
       nominaliyle gosterilir.
     ⚠ ICINDE YANSITMA VARSA TOPLAM DA ALT SINIRDIR: "en az" ibaresi
       ve kac kalemin tahmin oldugu yazar. */
  const ayT2 = [...gunMap.entries()].filter(([g]) => g.slice(0,7) === ay).flatMap(([,l]) => l);
  const ayE2 = [...gunEk.entries()].filter(([g]) => g.slice(0,7) === ay).flatMap(([,l]) => l);
  const TP = { sahis:0, ltd:0, sahisAdet:0, ltdAdet:0, sahisTahmin:0, ltdTahmin:0,
               odenmis:0, odenmisAdet:0 };
  for (const t of ayT2){
    if (t.durum === 'kapali'){ TP.odenmis += kr(t.toplam_tutar); TP.odenmisAdet++; continue; }
    if (t.kredi_tur === 'ltd'){ TP.ltd += kr(t.kalan); TP.ltdAdet++; }
    else { TP.sahis += kr(t.kalan); TP.sahisAdet++; }
  }
  for (const e of ayE2){
    const ltdMi = e.tur === 'kart' ? e.kart.sahip === 'ltd' : e.cek.sahip === 'ltd';
    if (ltdMi){ TP.ltd += e.kalanKurus; TP.ltdAdet++; if (e.yansitma) TP.ltdTahmin++; }
    else { TP.sahis += e.kalanKurus; TP.sahisAdet++; if (e.yansitma) TP.sahisTahmin++; }
  }
  if (TP.sahisAdet || TP.ltdAdet || TP.odenmisAdet){
    const ozS = el('div','serit-ozet duz');
    const gr = (et, dg) => { const p = el('span','so-p');
      p.appendChild(el('span','so-et', et)); p.appendChild(el('span','so-dg', dg)); ozS.appendChild(p); };
    if (TP.sahisAdet) gr('şahıs · ' + TP.sahisAdet + ' ödeme',
      (TP.sahisTahmin ? 'en az ' : '') + tlk(TP.sahis));
    if (TP.ltdAdet)   gr('ltd · ' + TP.ltdAdet + ' ödeme',
      (TP.ltdTahmin ? 'en az ' : '') + tlk(TP.ltd));
    if (TP.odenmisAdet) gr('ödenmiş · ' + TP.odenmisAdet, tlk(TP.odenmis));
    ozS.setAttribute('aria-label', ayAdi(ay) + ' toplamı. '
      + (TP.sahisAdet ? 'Şahıs ' + (TP.sahisTahmin ? 'en az ' : '') + tlk(TP.sahis) + '. ' : '')
      + (TP.ltdAdet ? 'Ltd ' + (TP.ltdTahmin ? 'en az ' : '') + tlk(TP.ltd) + '. ' : '')
      + (TP.odenmisAdet ? 'Ödenmiş ' + tlk(TP.odenmis) + '.' : ''));
    kap.appendChild(ozS);
    const tahminN = TP.sahisTahmin + TP.ltdTahmin;
    if (tahminN)
      kap.appendChild(el('div','bilgi', tahminN + ' kalem TAHMİN: o kartların ekstresi '
        + 'henüz kesilmedi, önceki dönemden devreden tutar yazıldı. Gerçek tutar '
        + 'daha yüksek çıkar — yeni harcama, faiz ve vergi de eklenecek. '
        + 'Ay toplamı bu yüzden ALT SINIRDIR.'));
  }

  /* ⚠ DD · KAYBOLAN SATIRIN SEBEBI YAZILI. Kart tarafinda yalniz SON
     donem ciziliyor; gecmis ayda kart satiri gormeyen kullanici
     "kayboldu mu" diye dusunmesin.
     ⚠ SERIDIN ICINDE DEGIL, DISINDA: ay TAMAMEN bossa serit hic
       cizilmiyor ve not da gorunmuyordu — oysa "kayboldu mu" sorusu
       tam da o ayda soruluyor (olculdu: mukerrer veri duzeltilince
       agustos komple bosaldi ve hicbir aciklama yoktu). */
  if (ay < buAy)
    kap.appendChild(el('div','kucuk',
      'Geçmiş aylarda kart ekstresi satırı görünmez: bir ekstrenin ödenmemiş '
    + 'kısmı ayrı bir borç değil, bir sonraki ekstrenin DEVİR satırının '
    + 'içindedir. İki kere göstermek aynı borcu iki kez saymak olurdu. '
    + 'Kartın güncel durumu Kartlar ekranında.'));

  /* --- LISTE KAYBOLMASIN: ay gorunumu "ne kadar borcum kaldi"yi yanitlamaz --- */
  const alt = el('div','tkv-alt');
  const bt = el('button', null, TAKVIM_LISTE ? 'ay görünümüne dön' : 'tüm taksitler');
  bt.type = 'button';
  bt.onclick = () => { TAKVIM_LISTE = !TAKVIM_LISTE; takvimYenile(ctx); };
  alt.appendChild(bt);
  kap.appendChild(alt);
  if (TAKVIM_LISTE) kap.appendChild(tumTaksitlerCiz(ctx));
}

/* BT · Gun panelindeki KART ve CEK satiri. Desen ICAT EDILMEDI:
   vMaden/vCek'in tk kutusu + kutuErisim; tiklaninca kredi taksitinin
   taksitEkraniAc'a gittigi gibi kendi detayina gider (kartDetayAc /
   cekDetayAc). Kaynak turu SATIRDA YAZAR — kullanici neyin ne oldugunu
   isaret renginden degil metinden ayirt eder. */
function takvimEkKarti(e, b){
  const gecikti = e.tarih < b;
  const kutu = el('div','tk' + (gecikti ? ' gecikti' : '')); kutu.style.cursor = 'pointer';
  const ust = el('div','tk-ust');
  if (e.tur === 'kart'){
    kutu.onclick = () => kartDetayAc(e.kart.id);
    kutuErisim(kutu, 'Kart ödemesi, ' + e.kart.ad + (e.kart.banka ? ' ' + e.kart.banka : '')
      + ', ' + (e.yansitma ? 'ekstresi henüz kesilmedi, devreden en az ' : 'kalan ')
      + tlk(e.kalanKurus) + (gecikti ? ', son ödeme günü geçti' : '') + ', detayı aç');
    ust.appendChild(el('div','tk-ad', 'Kart · ' + e.kart.ad + (e.kart.banka ? ' · ' + e.kart.banka : '')));
    ust.appendChild(el('div','tk-tutar', (e.yansitma ? 'en az ' : '') + tlk(e.kalanKurus)));
    kutu.appendChild(ust);
    kutu.appendChild(el('div','tk-orta', 'ekstre ' + e.donem.donem
      + (e.kart.sahip === 'ltd' ? ' · Ltd' : ' · Şahıs')
      + (gecikti ? '' : ' · son ödeme günü')));
    /* ⚠ TAHMIN OLDUGU SATIRDA YAZAR. Rakami kesinmis gibi gostermek,
       eylul ekstresine binecek yeni harcama/faiz/vergiyi gizlerdi. */
    if (e.yansitma)
      kutu.appendChild(el('div','tk-orta', 'ekstre henüz kesilmedi — '
        + ayAdi(e.kaynakDonem) + ' devredeni, en az bu kadar'));
  } else {
    kutu.onclick = () => cekDetayAc(e.cek.id);
    kutuErisim(kutu, 'Çek, ' + e.cek.banka + ', ' + e.cek.kime + ', ' + tlk(e.kalanKurus)
      + (gecikti ? ', vadesi geçti' : '') + ', detayı aç');
    ust.appendChild(el('div','tk-ad', 'Çek · ' + e.cek.banka));
    ust.appendChild(el('div','tk-tutar', tlk(e.kalanKurus)));
    kutu.appendChild(ust);
    kutu.appendChild(el('div','tk-orta', e.cek.kime
      + (e.cek.sahip === 'ltd' ? ' · Ltd' : ' · Şahıs')
      + (e.cek.cek_no ? ' · no ' + e.cek.cek_no : '')));
  }
  /* Rozet yalniz IS VARSA — gecikme is'tir, bekleme degil. */
  if (gecikti){
    const r = el('div'); r.style.marginTop = '6px';
    r.appendChild(el('span','rozet rz-eksik', e.tur === 'kart' ? 'GÜNÜ GEÇTİ' : 'VADESİ GEÇTİ'));
    kutu.appendChild(r);
  }
  return kutu;
}

/* Tum kalan taksitler — 2 satirlik sade satir. Dokununca o gune gider. */
function tumTaksitlerCiz(ctx){
  const { taksitler, krediMap, b } = ctx;
  const kutu = el('div');
  const kalanlar = taksitler.filter(t => t.durum !== 'kapali')
    .sort((x,y) => x.vade_tarihi < y.vade_tarihi ? -1 : 1);
  kutu.appendChild(el('div','pu', kalanlar.length + ' ödenmemiş taksit · '
    + tlk(kalanlar.reduce((s,t) => s + kr(t.kalan), 0)) + ' kalan'));
  for (const t of kalanlar){
    const k = krediMap.get(t.kredi_id);
    const s = el('div','tt-sr');
    const sol = el('div','sol');
    sol.appendChild(el('div','s1', trGun(t.vade_tarihi) + ' · ' + (k ? k.banka : 'kredi yok')));
    sol.appendChild(el('div','s2', t.sira + '. taksit'
      + (k && k.tur === 'ltd' ? ' · Limited (gidere yazılmaz)' : '')
      + (t.vade_tarihi < b ? ' · VADESİ GEÇTİ' : '')));
    s.appendChild(sol);
    s.appendChild(el('div','sag', tl(t.kalan)));
    s.onclick = () => { TAKVIM_AY = t.vade_tarihi.slice(0,7); TAKVIM_GUN = t.vade_tarihi;
                        TAKVIM_LISTE = false; takvimYenile(ctx);
                        ctx.kap.scrollIntoView({behavior:'smooth', block:'start'}); };
    kutu.appendChild(s);
  }
  return kutu;
}

function taksitKarti(t, kredi, b, buAy){
  const gecikti = !t.odendi && t.vade_tarihi < b;
  const buAyMi  = !t.odendi && !gecikti && t.vade_tarihi.slice(0,7) === buAy;

  const k = el('div','tk' + (t.odendi ? ' odendi' : gecikti ? ' gecikti' : buAyMi ? ' buay' : ''));
  k.dataset.taksit = t.id;   // kaydetme sonrasi bu karti bulabilmek icin

  const ust = el('div','tk-ust');
  const ad = el('div','tk-ad');
  ad.appendChild(el('span', null, (kredi ? kredi.banka + ' · ' + kredi.ad : 'kredi bulunamadı')
                                  + '  ' + t.sira + '. taksit'));
  if (kredi){
    ad.appendChild(document.createTextNode(' '));
    ad.appendChild(el('span', turSinif(kredi.tur), turKisa(kredi.tur)));
  }
  ust.appendChild(ad);
  ust.appendChild(el('div','tk-tutar', tl(t.toplam_tutar)));
  k.appendChild(ust);

  /* kirilim — anapara / faiz / vergi-masraf */
  const orta = el('div','tk-orta');
  if (t.anapara_tutar === null && t.faiz_tutar === null){
    orta.appendChild(el('span','gri','kırılım girilmemiş (anapara / faiz / vergi-masraf)'));
  } else {
    orta.appendChild(el('span', null, 'anapara ' + tl(t.anapara_tutar)));
    orta.appendChild(document.createTextNode(' · '));
    /* LIMITED: faiz GRI ve "gidere yazilmaz" */
    const faizSpan = el('span', (kredi && kredi.tur === 'ltd') ? 'gri' : null, 'faiz ' + tl(t.faiz_tutar));
    orta.appendChild(faizSpan);
    if (t.vergi_masraf_tutar !== null && t.vergi_masraf_tutar !== undefined){
      orta.appendChild(document.createTextNode(' · '));
      orta.appendChild(el('span', (kredi && kredi.tur === 'ltd') ? 'gri' : null,
        'vergi/masraf ' + tl(t.vergi_masraf_tutar)));
    }
    if (t.vergi_masraf_notu){
      orta.appendChild(document.createElement('br'));
      orta.appendChild(el('span','gri', t.vergi_masraf_notu));   // textContent
    }
  }
  k.appendChild(orta);

  /* gidere yazilacak tutar — TUR'e gore */
  if (kredi){
    if (kredi.tur === 'ticari'){
      if (t.faiz_tutar === null){
        k.appendChild(el('div','tk-gider yok','gidere: kırılım girilmediği için hesaplanamaz'));
      } else {
        const giderKurus = kr(t.faiz_tutar) + kr(t.vergi_masraf_tutar || 0);
        k.appendChild(el('div','tk-gider','gidere: faiz + vergi/masraf = ' + tlk(giderKurus)));
      }
    } else {
      k.appendChild(el('div','tk-gider yok', turAdi(kredi.tur) + ' — gidere yazılmaz'));
    }
  }

  /* durum satiri */
  /* v92 · UC DURUM: acik · KISMI (odenen/kalan gorunur) · kapali */
  const d = el('div','tk-durum' + (t.durum === 'kapali' ? ' odendi'
              : gecikti ? ' gecikti' : buAyMi ? ' buay' : ''));
  if (t.durum === 'kapali'){
    d.textContent = 'ödendi · ' + trGun(t.son_odeme_tarihi);
  } else if (t.durum === 'kismi'){
    d.textContent = 'KISMİ ÖDENDİ · ödenen ' + tl(t.odenen) + ' · KALAN ' + tl(t.kalan)
      + ' · vade ' + trGun(t.vade_tarihi)
      + (gecikti ? ' (' + gunFarki(b, t.vade_tarihi) + ' gün geçti)' : '');
  } else if (gecikti){
    d.textContent = 'vade ' + trGun(t.vade_tarihi) + ' · ' + gunFarki(b, t.vade_tarihi) + ' gün geçti';
  } else {
    d.textContent = 'vade ' + trGun(t.vade_tarihi) + ' · ' + gunFarki(t.vade_tarihi, b) + ' gün kaldı';
  }
  k.appendChild(d);

  /* Dekont eksigi ODEME BAZINDA — odenmis olsa da TAKILI KALIR */
  if (t.dekontsuz_odeme > 0){
    const r = el('div'); r.style.marginTop = '6px';
    r.appendChild(el('span','rozet rz-eksik',
      t.dekontsuz_odeme === 1 ? 'DEKONT EKSİK' : t.dekontsuz_odeme + ' ÖDEMEDE DEKONT EKSİK'));
    k.appendChild(r);
  }

  const ey = el('div','tk-eylem');
  if (t.durum !== 'kapali'){
    /* "Odendi" ARTIK TEK DOKUNUSLA TAM ODEME YAZMIYOR: form aciliyor.
       prompt() de kullanilmiyor (v88/M mobil bulgusu). */
    const bt = el('button','btn2', t.durum === 'kismi' ? 'Ödeme ekle' : 'Ödeme gir');
    bt.onclick = () => odemeFormuAc(k, t);
    ey.appendChild(bt);
  }
  if (t.odeme_adet > 0){
    const bl = el('button','btn-mini', t.odeme_adet + ' ödeme');
    bl.onclick = () => odemeListesiAc(k, t);
    ey.appendChild(bl);
  }
  k.appendChild(ey);
  return k;
}

/* ---------- ODEME FORMU (prompt YOK) ---------- */
function odemeFormuAc(kart, t){
  if (kart.querySelector('.odeme-form')) return;          // zaten acik
  const f = el('div','odeme-form');
  const kalanKurus = kr(t.kalan);

  const alan = (etiket, id, tip, deger, mod) => {
    f.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input');
    i.id = id; i.type = tip || 'text';
    if (deger !== undefined && deger !== null) i.value = deger;
    if (mod) i.setAttribute('inputmode', mod);
    f.appendChild(i); return i;
  };
  const tar = alan('Ödeme tarihi', 'of_tarih_'+t.id, 'date', bugun());
  const tut = alan('Tutar (varsayılan: kalan)', 'of_tutar_'+t.id, 'text',
                   (kalanKurus/100).toFixed(2).replace('.', ','), 'decimal');
  paraBagla(tut); paraBicimle(tut);      /* CO · on dolu deger de bicimli gelsin */

  /* Kirilim: taksitte ayrim varsa ODENEN ORANINDA on doldurulur.
     Ayrim yoksa alanlar bos kalir ve gider YAZILMAZ — uydurmuyoruz. */
  const ayrimVar = t.anapara_tutar !== null && t.anapara_tutar !== undefined;
  let an, fz, vm;
  if (ayrimVar){
    f.appendChild(el('div','kucuk',
      'Kırılım ödeme tutarına ORANTILI dolduruldu; elle değiştirebilirsin. '
    + 'Üçünün toplamı tutara eşit olmalı.'));
    an = alan('Anapara payı', 'of_ana_'+t.id, 'text', '', 'decimal');
    fz = alan('Faiz payı', 'of_faiz_'+t.id, 'text', '', 'decimal');
    vm = alan('Vergi/masraf payı', 'of_vm_'+t.id, 'text', '', 'decimal');
    const dagit = () => {
      const p = paraCoz(tut.value); if (!p.ok || p.kurus <= 0) return;
      const kalanA = kr(t.anapara_tutar) - kr(t.anapara_odenen || 0);
      const kalanF = kr(t.faiz_tutar) - kr(t.faiz_odenen || 0);
      const kalanV = kr(t.vergi_masraf_tutar || 0);
      const top = kalanA + kalanF + kalanV;
      if (top <= 0) return;
      const a = Math.round(p.kurus * kalanA / top);
      const fzz = Math.round(p.kurus * kalanF / top);
      const v = p.kurus - a - fzz;                    // kurus artigi buraya
      an.value = (a/100).toFixed(2).replace('.', ',');
      fz.value = (fzz/100).toFixed(2).replace('.', ',');
      vm.value = (v/100).toFixed(2).replace('.', ',');
    };
    /* ⚠ CO · tut.oninput = dagit ATAMASI paraBagla'nin dinleyicisini
       EZMEZ (addEventListener ayri kanal), ama dagit() alanlara
       PROGRAMLA yaziyor — 'input' uretmedigi icin bicimlemeyi elle
       cagirmak gerekiyor (gecen turda focus'ta ayni tuzak olculdu). */
    tut.oninput = () => { dagit(); paraBicimle(an); paraBicimle(fz); paraBicimle(vm); };
    dagit(); paraBagla(an); paraBagla(fz); paraBagla(vm);
    paraBicimle(an); paraBicimle(fz); paraBicimle(vm);
  } else {
    f.appendChild(el('div','uyari-orta',
      'Bu taksitin anapara/faiz kırılımı girilmemiş. Ödeme kaydedilir ama '
    + 'faiz GİDERE YAZILAMAZ — hangi kısmın faiz olduğu bilinmiyor.'));
  }

  /* ⚠ CW · LTD KREDISINDE GIDER SECENEGI YOK — SEBEBI YAZILI.
     Kod zaten kesimUyar'da kredi_tur !== 'ticari' diye cikiyor, yani
     p_gider_yaz Ltd'de hicbir zaman true olamiyordu; ama ekranda bunun
     SEBEBI yazmiyordu. Sahibin sozu: "limited adina, buradan sadece
     takip edecegiz, gider gosteremeyiz". Sessiz dogru davranis,
     kullaniciya "acaba unuttum mu" dedirtiyordu. */
  if (t.kredi_tur === 'ltd')
    f.appendChild(el('div','bilgi',
      'Bu kredi LİMİTED adına. Faizi bu ekrandan GİDERE YAZILMAZ — '
    + 'şahıs işletmesinin giderine limitedin faizi girmez. Buradan '
    + 'yalnızca takip edilir. Kullandırım, KGF komisyonu ve sigorta gibi '
    + 'masraflar da gider değildir; kredinin açıklamasına not olarak yazılır.'));

  /* ⚠ MUKERRER KORUMA: 2026-07 faizleri ELLE gider olarak girildi. */
  let israr = null;
  const kesimUyar = () => {
    const eski = f.querySelector('.kesim-uyari');
    if (eski) eski.remove(); israr = null;
    if (!ayrimVar || t.kredi_tur !== 'ticari') return;
    if ((tar.value || '') >= '2026-08-01') return;
    const u = el('div','uyari-agir kesim-uyari');
    u.appendChild(document.createTextNode(
      'Bu tarih 01.08.2026 öncesi. O dönemin faizleri ELLE gidere girilmiş '
    + 'olabilir; otomatik yazılırsa MÜKERRER olur. Varsayılan: gider YAZILMAZ.'));
    const et = document.createElement('label');
    et.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.style.cssText = 'width:auto;min-height:auto;margin:0';
    et.appendChild(cb);
    et.appendChild(document.createTextNode('Yine de faizi gidere yaz (elle girilmediğinden eminim)'));
    u.appendChild(et); f.appendChild(u); israr = cb;
  };
  tar.onchange = kesimUyar; kesimUyar();

  /* Kaydet'in HEMEN USTUNDE — eskiden son alanin altinda griydi. */
  f.appendChild(el('div','form-not','Önce ödemeyi kaydet — dekont düğmesi ondan sonra çıkar.'));

  const ey = el('div','tk-eylem');
  const kay = el('button','btn2','Kaydet');
  kay.onclick = () => odemeKaydet(t, tar, tut, an, fz, vm, israr, kay);
  const vaz = el('button','btn-mini','Vazgeç');
  vaz.onclick = () => f.remove();
  ey.appendChild(kay); ey.appendChild(vaz);
  f.appendChild(ey);
  kart.appendChild(f);
  tut.focus();
}

async function odemeKaydet(t, tar, tut, an, fz, vm, israr, btn){
  const kutu = mesajKutusu();
  mesajTemizle(kutu);
  const tarih = (tar.value || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tarih))
    return mesaj(kutu, 'hata', 'Ödeme tarihi zorunlu.');
  const p = paraCoz(tut.value);
  if (!p.ok)        return mesaj(kutu, 'hata', 'Tutar: ' + p.hata);
  if (p.kurus <= 0) return mesaj(kutu, 'hata', 'Tutar sıfırdan büyük olmalı.');
  if (p.kurus > kr(t.kalan))
    return mesaj(kutu, 'hata', 'Tutar kalandan büyük olamaz. Kalan: ' + tl(t.kalan)
      + '. Fazla ödeme ayrı alacak olarak izlenmeli, buraya yazılmaz.');

  let a = null, f2 = null, v = null;
  if (an){
    const ra = paraCoz(an.value), rf = paraCoz(fz.value), rv = paraCoz(vm.value);
    if (!ra.ok || !rf.ok || !rv.ok) return mesaj(kutu,'hata','Kırılım tutarları geçersiz.');
    if (ra.kurus + rf.kurus + rv.kurus !== p.kurus)
      return mesaj(kutu, 'hata', 'Kırılım toplamı tutara eşit değil: '
        + tlk(ra.kurus + rf.kurus + rv.kurus) + ' ≠ ' + tlk(p.kurus));
    a = (ra.kurus/100).toFixed(2); f2 = (rf.kurus/100).toFixed(2); v = (rv.kurus/100).toFixed(2);
  }

  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { data, error } = await sb.rpc('rpc_taksit_odeme_kaydet', {
    p_taksit: t.id, p_tarih: tarih, p_tutar: (p.kurus/100).toFixed(2),
    p_anapara: a, p_faiz: f2, p_masraf: v,
    p_foto: null, p_aciklama: null,
    p_gider_yaz: (israr && israr.checked) ? true : null });
  btn.disabled = false; btn.textContent = 'Kaydet';
  if (error){ hataYaz(kutu, 'Ödeme kaydedilemedi.', error); return; }
  await ekranAc(EKRAN);
  /* ⚠ MESAJ EKRAN YENILENDIKTEN SONRA. Onceden once yaziliyordu ve
     ekranAc() #icerik'i bastan kurarken takvimMsg ile birlikte mesaji
     SILIYORDU — olculdu: kullanici hicbir onay gormuyordu. */
  mesaj(mesajKutusu(), 'ok', 'Ödeme kaydedildi'
    + (data && data.gider_yazildi ? ' · faiz gidere yazıldı' : ' · gider yazılmadı')
    + '. Dekontu eklemeyi unutma.');
  /* Dekont ancak odeme KAYDEDILDIKTEN sonra cikiyor ve kullanici onu
     bulamiyordu. Artik kaydettikten sonra o taksitin odeme listesi
     KENDILIGINDEN aciliyor ve ekran oraya kayiyor: "DEKONT EKSIK"
     rozeti ile "+ Dekont" dugmesi dogrudan gozun onunde. */
  const kart = document.querySelector('[data-taksit="' + t.id + '"]');
  if (kart){
    await odemeListesiAc(kart, { id: t.id });
    kart.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

/* ---------- ODEME LISTESI (dekont odeme bazinda) ---------- */
async function odemeListesiAc(kart, t){
  if (kart.querySelector('.odeme-liste')) return;
  const kutu = mesajKutusu();
  const liste = await odemeGetir(t.id);
  const d = el('div','odeme-liste');
  const sar = el('div','tablo-sar');
  const tb = document.createElement('table');
  const hr = document.createElement('tr');
  /* ⚠ AQ · HAREKET sutunu EKLENDI — sahis tablosundaki kalibin aynisi.
     Sagdaki uc sayi sutunu bir kaydi. */
  ['TARİH','HAREKET','TUTAR','ANAPARA','FAİZ','GİDER','DEKONT',''].forEach((h,i) =>
    hr.appendChild(el('th', (i>=2 && i<=4) ? 'sag' : null, h)));
  tb.appendChild(hr);
  /* v100/v101 · hangi odemeler iptal EDILMIS — hedef id kumesi. */
  const TERSLENEN = new Set(liste.filter(o => o.tur === 'ters').map(o => o.ters_hedef_id));
  for (const o of liste){
    const tr = document.createElement('tr');
    /* ⚠ AQ · UC HAL — sahis tarafiyla AYNI kural (v100):
       normal odeme · IPTAL EDILMIS odeme · IPTAL KAYDI.
       Iptal edilen odeme LISTEDE KALIR; gizlemek silmekle ayni sonucu
       verirdi. Isaret RENKLE DEGIL: ustu cizili + METIN etiketi.
       ⚠ Ters kaydin kirilimi HEDEFTEN KOPYALANIYOR (bos DB'de olculdu:
         anapara_pay/faiz_pay/vergi_masraf_pay aynen, gider_id ve
         foto_path NULL). Kirilim de '+' ile yaziliyor: ucu de ayni
         yonde hareket ediyor — odeme borcu AZALTIR, iptal ARTIRIR. */
    const iptalKaydi  = o.tur === 'ters';
    const iptalEdildi = o.tur !== 'ters' && TERSLENEN.has(o.id);
    if (iptalEdildi) tr.classList.add('iptalli');
    tr.appendChild(td(trGun(o.tarih)));
    const hc = document.createElement('td');
    hc.appendChild(document.createTextNode(iptalKaydi ? 'İptal' : 'Ödeme'));
    if (iptalEdildi) hc.appendChild(el('span','rozet rz-eksik','İPTAL EDİLDİ'));
    tr.appendChild(hc);
    const im = iptalKaydi ? '+ ' : '';
    tr.appendChild(td(im + tl(o.tutar),'sag'));
    tr.appendChild(td(o.anapara_pay === null ? '—' : im + tl(o.anapara_pay),'sag'));
    tr.appendChild(td(o.faiz_pay === null ? '—'
      : im + tlk(kr(o.faiz_pay) + kr(o.vergi_masraf_pay || 0)),'sag'));
    tr.appendChild(td(o.gider_id ? 'yazıldı' : '—'));
    const dh = document.createElement('td');
    if (o.foto_path){
      const a = el('button','btn-mini','Aç'); a.onclick = () => belgeAc(o.foto_path, kutu);
      dh.appendChild(a);
    } else if (iptalKaydi){
      /* ⚠ Ters kaydin dekontu OLMAZ — "eksik" demek YANLIS ALARM olurdu.
         v_kredi_taksit_durum.dekontsuz_odeme da ters kaydi saymiyor;
         satir ile kart basligi CELISMEMELI. */
      dh.appendChild(el('span','gri','—'));
    } else dh.appendChild(el('span','rozet rz-eksik','DEKONT EKSİK'));
    tr.appendChild(dh);
    const ey = document.createElement('td');
    if (!iptalKaydi){
      const b = el('button','btn-mini', o.foto_path ? 'Değiştir' : '+ Dekont');
      b.onclick = () => dekontEkle('kredi_taksit_odeme', o.id, 'kredi_taksit', kutu,
                                   !!o.foto_path, () => ekranAc(EKRAN));
      ey.appendChild(b);
    }
    /* ⚠ ISTEMCI ONCEDEN ENGELLER. Sunucu zaten reddediyor
       (TERSIN_TERSI_YOK · ZATEN_TERS · GIDERE_ISLENMIS) ama kullaniciya
       tiklattirip hata gostermek kotu. Ilk ikisinde eylem YOK; ucuncusunde
       GORUNUR ama pasif — nedeni yazili, cunku gizlenen eylem aratir. */
    if (!iptalKaydi && !iptalEdildi)
      ey.appendChild(digerMenu([['Ödemeyi iptal et',
        (a) => taksitOdemeIptalAc(o, t, a),
        o.gider_id ? 'Gidere işlenmiş; önce gider kaydını geri al, sonra ödemeyi iptal et.' : null]]));
    tr.appendChild(ey);

  }
  sar.appendChild(tb); d.appendChild(sar);
  const kapat = el('button','btn-mini','Kapat'); kapat.onclick = () => d.remove();
  d.appendChild(kapat);

}
/* ⚠ AQ · taksit ekraninin kutusu 'taksitMsg'; listede YOKTU ve mesaj()
   null bulup alert()'e dusuyordu. Sira: takvim > taksit > krediler. */
/* ===== AQ · TAKSIT ODEMESI IPTALI · TEK PENCERE =====
   ⚠ YENI DESEN YOK: sahisOdemeIptalAc'tan KOPYALANDI, yedi ozelligin
     hepsi burada da var (gerekce kapisi · canli sayac · Vazgec SOLDA ve
     varsayilan odak · form basina TEK idem · cift tiklama TEK istek ·
     hata yolunda form korunur ve idem AYNI kalir · odak tuzagi+Escape).
   ⚠ TEK FARK: basarida taksit ekrani tazelenir — kullanici TAKSITTE
     KALIR, krediler listesine ATILMAZ.
   ⚠ ODAK IKI KEZ TASINIR: kapat() odagi ACAN dugmeye verir, tazeleme o
     dugmeyi DOM'dan koparir ve odak <body>'ye duser (sahis tarafinda
     olculdu). Yenilemeden SONRA yasayan bir ogeye tasiniyor. */
function taksitOdemeIptalAc(odeme, taksit, acan){
  let n = 0; const kimlik = (e) => (e.id = 'ti' + (++n));
  const d = document.createElement('dialog'); d.className = 'pm';
  d.setAttribute('aria-modal','true');
  const bas = el('div','pm-bas','⚠ Taksit ödemesi iptal edilecek'); kimlik(bas);
  d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
  const ad = el('div','pm-ad', trGun(odeme.tarih) + ' tarihli ödeme'); kimlik(ad);
  const tut = el('div','pm-tutar', tlk(kr(odeme.tutar))); kimlik(tut);
  d.appendChild(ad); d.appendChild(tut);
  const etki = el('div','pm-etki',
    'Bu ödeme iptal edilecek. Silinmez — yanına iptal kaydı yazılır, ikisi de listede kalır. '
  + 'Taksitin kalanı ödeme tutarı kadar ARTAR.');
  kimlik(etki); d.setAttribute('aria-describedby', etki.id); d.appendChild(etki);
  const l = el('label', null, 'Gerekçe (en az 10 karakter)');
  const ta = document.createElement('textarea'); kimlik(ta); ta.rows = 3;
  l.setAttribute('for', ta.id);
  const sayac = el('div','pm-sayac'); kimlik(sayac);
  ta.setAttribute('aria-describedby', sayac.id);
  d.appendChild(l); d.appendChild(ta); d.appendChild(sayac);
  const ey = el('div','pm-ey');
  const vaz = el('button','btn2','Vazgeç'), kap = el('button','btn-kirmizi','İptal kaydı at');
  vaz.type = kap.type = 'button'; kap.disabled = true;
  kap.dataset.idem = crypto.randomUUID();          // FORM BASINA BIR KEZ
  ey.appendChild(vaz); ey.appendChild(kap); d.appendChild(ey);   // Vazgec SOLDA
  const hataK = el('div','uyari-agir'); hataK.hidden = true; kimlik(hataK);
  kap.setAttribute('aria-describedby', hataK.id); d.appendChild(hataK);
  document.body.appendChild(d); d.showModal(); vaz.focus();       // varsayilan GUVENLI taraf

  const denetle = () => { const c = ta.value.trim().length;
    sayac.textContent = 'en az 10 karakter · şu an ' + c;
    kap.disabled = c < 10; };
  ta.oninput = denetle; denetle();

  let isleniyor = false;
  const kapat = () => {
    if (isleniyor) return;                        // istek surerken kapanmaz
    d.close(); d.remove();
    if (acan && acan.isConnected && acan.focus) acan.focus();
    else { const h = document.querySelector('#bolumSerit button.aktif'); if (h) h.focus(); }
  };
  vaz.onclick = () => kapat();
  d.addEventListener('cancel', e => { e.preventDefault(); kapat(); });
  d.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ e.preventDefault(); kapat(); return; }
    if (e.key !== 'Tab') return;                  // odak tuzagi
    const od = [...d.querySelectorAll('textarea,button')].filter(x => !x.disabled);
    if (!od.length) return;
    const i = od.indexOf(document.activeElement); e.preventDefault();
    od[(i + (e.shiftKey ? -1 : 1) + od.length) % od.length].focus();
  });
  kap.onclick = async () => {
    if (isleniyor || kap.disabled) return;        // cift tiklama TEK istek
    isleniyor = true; kap.disabled = vaz.disabled = ta.disabled = true;
    d.tabIndex = -1; d.focus(); kap.textContent = 'İşleniyor...'; hataK.hidden = true;
    const { error } = await sb.rpc('rpc_taksit_odeme_ters_kayit',
      { p_idem: kap.dataset.idem, p_odeme: odeme.id, p_neden: ta.value.trim() });
    isleniyor = false;
    if (error){
      /* Hata yolunda form KORUNUR ve anahtar AYNI kalir — tekrar denenebilir. */
      hataK.hidden = false;
      hataK.textContent = hataTr([error.message,error.details,error.hint].filter(Boolean).join('\n'));
      vaz.disabled = ta.disabled = false; kap.textContent = 'İptal kaydı at'; denetle();
      return;
    }
    kapat();
    await taksitEkraniAc(taksit.kredi_id);        // TAKSITTE kalinir
    const h = document.querySelector('#icerik button')
           || document.querySelector('#bolumSerit button.aktif');
    if (h) h.focus();                             // odak <body>'ye DUSMEZ
    mesaj(mesajKutusu(),'ok','Ödeme iptal edildi. Ödeme ve iptal kaydı listede duruyor.');
  };
}

const mesajKutusu = () => document.getElementById('takvimMsg') ? 'takvimMsg'

async function vKrediler(){

  const grup = new Map();
  for (const t of v.taksitler){
    if (!grup.has(t.kredi_id)) grup.set(t.kredi_id, []);
    grup.get(t.kredi_id).push(t);
  }
  c.textContent = '';
  c.appendChild(ozetCiz(v,'krediler'));
  const msg = el('div','msg'); msg.id = 'krediMsg'; c.appendChild(msg);

  const k = el('div','kart');

  if (!v.krediler.length) k.appendChild(el('div','bos','Henüz kredi yok. Aşağıdaki formdan ekle.'));

  for (const kredi of v.krediler){
    const o = krediOzet(grup.get(kredi.id) || []);
    const kart = el('div','tk'); kart.style.cursor = 'pointer';
    kart.onclick = () => taksitEkraniAc(kredi.id);
    kutuErisim(kart, kredi.banka + ' ' + kredi.ad + ', kalan ' + tlk(o.kalanKurus) + ', detayı aç');

    const ust = el('div','tk-ust');
    const ad = el('div','tk-ad');
    ad.appendChild(el('span', null, kredi.banka + ' · ' + kredi.ad));
    ad.appendChild(document.createTextNode(' '));
    ad.appendChild(el('span', turSinif(kredi.tur), turKisa(kredi.tur)));
    ust.appendChild(ad);
    /* ⚠ BUYUK RAKAM ARTIK KALAN ANAPARA — nominal degil. "Bugun kapatsam
       ne oderim"in cevabi anaparadir; nominal gelecek faizi de tasir.
       ⚠ KIRILIM YOKSA ANAPARA YAZILMAZ: uydurmak yerine nominal yazilir
         ve HANGISI oldugu alt satirda ACIKCA soylenir (Ltd kredilerinin
         cogunda kirilim girilmemis — olculdu, bantVerisi ayni sebeple
         Ltd'yi nominal gosteriyor). */
    const anaparaVar = o.kalanAdet > 0 && o.kirilimsizAdet === 0;
    ust.appendChild(el('div','tk-tutar', anaparaVar ? tlk(o.anaparaKurus) : tlk(o.kalanKurus)));
    k.appendChild(kart);
    kart.appendChild(ust);

    kart.appendChild(el('div','tk-orta',
      o.kalanAdet === 0 ? 'tüm taksitler ödendi'
      : anaparaVar ? 'kalan anapara · nominal ' + tlk(o.kalanKurus)
      : 'kalan (kırılım girilmemiş, anapara hesaplanamıyor)'));

    /* ⚠ SIRADAKI TAKSIT · listenin en cok arananinin cevabi. Eskiden
       yalniz "sonraki vade 05.07.2026" yaziyordu; TUTARI ve KAC GUN
       KALDIGI yoktu, yani "ne kadar, ne zaman" sorusu ekranda
       cevapsizdi. */
    const s = sonrakiTaksitMetni(o.sonraki, bugun());
    if (s){
      const sr = el('div','tk-orta');
      sr.appendChild(el('span','et','SIRADAKİ '));
      sr.appendChild(el('span', null, s.tarih + ' · ' + s.tutar + ' · '));
      sr.appendChild(el('span', s.gecikti ? 'rozet rz-eksik' : null, s.gunMetni));
      kart.appendChild(sr);
    }
    kart.appendChild(el('div','tk-orta',
      (o.kalanAdet ? o.kalanAdet + ' taksit kaldı' : 'tüm taksitler ödendi')
      + ' · girilen ' + (grup.get(kredi.id) || []).length + '/' + kredi.taksit_sayisi));

    /* ⚠ ROZET YALNIZ IS VARSA. Gecikme yoksa "0 gecikmis" gibi bir
       satir da CIKMAZ — bos rozet gurultu, is yokken uyari yanlis alarm. */
    if (o.gecmis || o.dekontEksik){
      const r = el('div'); r.style.marginTop = '6px';
      if (o.gecmis) r.appendChild(el('span','rozet rz-eksik', o.gecmis + ' GECİKMİŞ'));
      if (o.dekontEksik){
        r.appendChild(document.createTextNode(' '));
        r.appendChild(el('span','rozet rz-sari', o.dekontEksik + ' dekont eksik'));

  c.appendChild(k);

}
