    if (/^\d{1,3}(?:,\d{3})+\.\d{2}$/.test(s))
      return s.replace(/,/g,'␀').replace('.',',').replace(/␀/g,'.');
    if (/^\d+\.\d{2}$/.test(s))       return s.replace('.', ',');
    if (/^\d{1,3}(?:,\d{3})+$/.test(s)) return s.replace(/,/g,'.');
    return s;
  });
}

/* Cozer + ayni bantta x sirasina gore birlestirir.
   ⚠ Bolme esigi VERIDEN: glifler arasi bosluk dagilimi olculdu
     (tmp/ax-bosluk.mjs, 3801 bosluk) — %98'i <= 7pt, sonraki kume
     12pt'de basliyor. Esik 10pt; okuyucunun CD kuralindaki esikle
     ayni sayi olmasi rastlanti degil, ikisi de ayni dosyalardan
     olculdu. Bosluk kelime icinde 0x40 GLIFI olarak zaten var,
     uydurulmuyor. */
function axEbcdicCoz(parcalar, iskeletle){
  const say = new Map();
  for (const it of parcalar){
    let o = say.get(it.fnt); if (!o){ o = { n:0, disi:0 }; say.set(it.fnt, o); }
    for (const ch of it.ham){ o.n++; if (AX_EB_TABLO[ch.codePointAt(0)] == null) o.disi++; }
  }
  const turkceFont = new Set();
  for (const [f, o] of say) if (o.n >= 8 && o.disi / o.n >= 0.5) turkceFont.add(f);

  const cz = (metin, fnt) => {
    let s = '';
    for (const ch of metin){
      const k = ch.codePointAt(0);
      if (k === 0x20) continue;                       /* eslenmemis, sifir genislik */
      if (turkceFont.has(fnt)){ s += AX_EB_ISARET; continue; }
      const v = AX_EB_TABLO[k];
      s += (v == null ? AX_EB_ISARET : v);
    }
    return s;
  };

  const bantlar = [];
  for (const it of parcalar){
    let b = bantlar.find(x => Math.abs(x.y - it.y) <= 1.5);
    if (!b){ b = { y: it.y, items: [] }; bantlar.push(b); }
    b.items.push(it);
  }
  const cikti = [];
  for (const b of bantlar){
    b.items.sort((a, c) => a.x - c.x);
    let ob = null;
    for (const it of b.items){
      const m = cz(it.ham, it.fnt);
      if (ob && it.x - (ob.x + ob.g) <= 10){
        ob.metin += m; ob.g = (it.x + (it.g || 0)) - ob.x;
      } else { ob = { metin: m, x: it.x, y: b.y, g: it.g || 0 }; cikti.push(ob); }
    }
  }
  return cikti.map(o => {
    const ham = axEbSayi(o.metin).trim();
    return { ham, isk: iskeletle(ham), x: o.x, y: o.y, g: o.g };
  }).filter(o => o.ham !== '');
}

/* pdf.js YALNIZ burada, YALNIZ istendiginde yuklenir — sayfa acilisi
   etkilenmesin diye modul kokte DEGIL. */
let AX_PDFJS = null;
async function axPdfjs(){
  if (AX_PDFJS) return AX_PDFJS;
  const KOK = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/';
  const m = await import(KOK + 'pdf.min.mjs');
  m.GlobalWorkerOptions.workerSrc = KOK + 'pdf.worker.min.mjs';
  AX_PDFJS = m; return m;
}

/* PDF -> VIEWPORT uzayinda konumlu parcalar. Okuma TAMAMEN TARAYICIDA.
   ⚠ AZ: Util.transform ile sayfa donusu normalize edilir; y asagi dogru
     buyur, "altinda" = daha buyuk y. rotate=0 dosyada donusum kimliktir. */
async function axParcalar(dosya){
  const pdfjs = await axPdfjs();
  const belge = await pdfjs.getDocument({ data: await dosya.arrayBuffer() }).promise;
  const hepsi = [];
  for (let i = 1; i <= belge.numPages; i++){
    const sayfa = await belge.getPage(i);
    const vp = sayfa.getViewport({ scale: 1 });
    const ic = await sayfa.getTextContent();
    for (const it of ic.items){
      if (!it.str || !it.str.trim()) continue;
      const t = pdfjs.Util.transform(vp.transform, it.transform);
      hepsi.push({ ham: it.str.trim(), isk: axIskelet(it.str),
        x: t[4], y: t[5] + (i - 1) * 10000, g: it.width || 0, fnt: it.fontName });
    }
  }
  /* ⚠ KAPI KAPALIYSA HICBIR SEY DEGISMEZ — 'fnt' fazladan bir alan,
     axOku onu okumaz. Diger uc bankanin ciktisi bu yuzden aynidir
     (olculdu: once/sonra 16 alanin 16'si birebir). */
  const cikti = axEbcdicKapisi(hepsi) ? axEbcdicCoz(hepsi, axIskelet) : hepsi;
  return axIngKapisi(cikti) ? axIngCoz(cikti) : cikti;
}

/* ==================================================================
   DF · INGILIZ SAYI BICIMI KAPISI
   ==================================================================
   OLCULDU (Is Bankasi Maximiles Black, kesim 04.09): alti alanin
   ALTISI "bulunamadi" cikti. Etiketler BULUNUYORDU ("Hesap Özeti
   Borcu:" gorunuyor), yanindaki RAKAM alinamiyordu:
     Hesap Özeti Borcu: 29,976.97 TL
     Ödenmesi Gereken Asgari Tutar: 11,990.79 TL
     Devir Bakiyesi: -122,748.91
     Dönem Faizi: 955.89        <- binlik ayiraci YOK, o yuzden okundu
   AX_TUTAR TURK bicimli; "29,976.97" desene uymadigi icin aday bile
   toplanmiyordu.
   ⚠ DONUSTURUCU YENIDEN YAZILMADI: axEbSayi tam bu isi yapiyordu ama
     yalniz EBCDIC kapisinin ardinda calisiyordu (Akbank icin
     yazilmisti). Var olan donusturucu daha genis bir kapiya baglandi.
   ⚠ AX_TUTAR'A DOKUNULMADI. Uc bankanin okumasi ona bagli; EBCDIC
     turunde de ayni karar verilmisti ve dogruydu.
   ⚠ BANKA ADINA GORE KARAR VERILMEZ — OLCULDU, AYNI BANKA IKI BICIM
     KULLANIYOR. Bes gercek Is Bankasi ekstresi:
       isbank-black  TR 23 · EN  0 -> TURK
       isbank-b      TR 15 · EN  0 -> TURK
       isbank-c      TR 30 · EN  0 -> TURK  (ayni kartin ONCEKI ekstresi)
       isbank-d      TR  0 · EN 14 -> INGILIZ (yeni ekstre)
     Karar METNIN KENDISINDEN veriliyor.
   ⚠ ORAN SART, "EN varsa cevir" DEGIL: bir belgede 31 TR token
     arasinda 1 EN token var (serbest metinde). "EN varsa cevir"
     deseydik o belge BOZULURDU. */
const AX_TR_SAYI = /\d{1,3}(?:\.\d{3})+,\d{2}/g;
const AX_EN_SAYI = /\d{1,3}(?:,\d{3})+\.\d{2}/g;
function axIngKapisi(parcalar){
  const metin = parcalar.map(p => p.ham).join(' ');
  const tr = (metin.match(AX_TR_SAYI) || []).length;
  const en = (metin.match(AX_EN_SAYI) || []).length;
  return en >= 3 && en > tr * 3;
}
function axIngCoz(parcalar){
  const cikti = parcalar.map(p => {
    const ham = axEbSayi(p.ham);
    return ham === p.ham ? p : Object.assign({}, p, { ham, isk: axIskelet(ham) });
  });
  /* ⚠ ONAY EKRANINDA GORUNSUN: kullanici neye baktigini bilmeli.
     Dizinin uzerinde tasiniyor — axOku'nun donusune aktariliyor. */
  cikti.bicimCevrildi = true;
  return cikti;
}

/* ⚠ DUZELTME 1 · PARCALARI SATIRA CEVIR. Eslesme SATIR uzerinde calisir.
   y toleransi 3 (veriden: satir ici <=1.5, komsu satirlar >=6). */
function axSatirlar(parcalar){
  const bantlar = [];
  for (const par of parcalar){
    let b = bantlar.find(x => Math.abs(x.y - par.y) <= 3);
    if (!b){ b = { y: par.y, items: [] }; bantlar.push(b); }
    b.items.push(par);
  }
  for (const b of bantlar){
    b.items.sort((a, c) => a.x - c.x);
    /* satirin iskeleti + her parcanin iskelet icindeki [bas,son) araligi */
    b.isk = '';
    for (const it of b.items){ it.iBas = b.isk.length; b.isk += it.isk; it.iSon = b.isk.length; }
  }
  bantlar.sort((a, c) => a.y - c.y);
  return bantlar;
}

function axOku(parcalar){
  const satirlar = axSatirlar(parcalar);
  const tumIsk = Object.values(AX_SOZLUK).flatMap(t => t.isk);

  /* ⚠ CD · AYNI SATIRDA X-BITISIK PARCALAR KAYNAKLANIR. Olculdu (gercek
     pdf.js dokumu): Turkce harf dusen her yerde parca bolunuyor —
     "Bir" + " " + "nceki" AYNI bantta UC parca (bosluk parcasi zaten
     atiliyor, aradaki bosluk ~9pt). Ikili etiket birlestirme boyle bir
     basligi HIC kuramaz; etiket gorunumu de yarim kaliyordu ("Son",
     "Minimum"). Kural DAR: ayni bant + x boslugu <= 10pt (olculen kopma
     bosluklari 4.5-8.9pt; en dar SUTUN araligi 15.6pt — deger sutunlari
     kaynaklanamaz) + IKISI DE tam tutar DEGIL (tutarlar asla
     yapistirilmaz). Ham'lar arasina bosluk konur, iskelet bitisik. */
  /* ⚠ CE · TEK KARAKTERLIK OPERATOR PARCASI ETIKET MALZEMESI DEGILDIR.
     Olculdu (gercek PDF, cekirdekten gecirildi): ozet tablosunun
     "-" "+" "=" parcalari kendi y bantlarinda duruyor ve pdf.js'in
     PARCA SIRASINA gore bazen etiket bantlarina karisiyor; kaynaklama
     onlari yutunca etiket ham'i kirleniyor ("Harcamalar ve + yansıyan
     taksitler +"), x-zinciri kayip komsu sutunun yarimi yanlis etikete
     kapiliyor — nakitAvans ve faizKesinti sahipsiz kaliyordu.
     Kural yalniz ETIKET tarafinda (kaynaklama + birlestirme); deger
     aramasina dokunmaz. COK karakterli parcalar ("Nakit avans / Artı")
     ETKILENMEZ — tek karakter icin. */
  const AX_OPERATOR = (t) => { const k = String(t).trim();
    return k.length === 1 && '+-=*x×/:'.indexOf(k) >= 0; };
  for (const s of satirlar){
    for (let i = 0; i < s.items.length - 1; ){
      const a = s.items[i], b = s.items[i + 1];
      /* ⚠ bosluk NEGATIF ise (parcalar ortusuyor) kaynaklanMAZ: gercek
         dokumde tum kopma bosluklari >= 0 (olculdu 0..8.9pt); ortusme
         ancak yanlis genislik bilgisinden dogar ve iki ayri sutunu tek
         etikete yapistirir — olculdu, uc baslik tek parcaya kaynayip
         hepsine ayni degeri veriyordu. -1 yuvarlama payi. */
      const bosluk = b.x - (a.x + (a.g || 0));
      if (!AX_OPERATOR(a.ham) && !AX_OPERATOR(b.ham)
          && !axTutarMi(a.ham) && !axTutarMi(b.ham)
          && bosluk >= -1 && bosluk <= 10){
        a.ham = a.ham + ' ' + b.ham;
        a.isk = a.isk + b.isk;
        a.g = (b.x + (b.g || 0)) - a.x;
        s.items.splice(i + 1, 1);
      } else i++;
    }
    s.isk = '';
    for (const it of s.items){ it.iBas = s.isk.length; s.isk += it.isk; it.iSon = s.isk.length; }
  }

  /* ⚠ BY · SARAN SUTUN BASLIGI BIRLESTIRILIR. Olculdu (gercek Bankkart,
     pdftotext -layout): "Faiz Ücretler ve" baslik satirinda, "Kesintiler"
     BIR ALT satirda sutunun x araliginda girintili — sozlukteki tam
     etiket hicbir satirda olusmuyordu, faizKesinti 'yok' kaliyordu ve
     iki sutunu toplama kurali (BB) hic devreye girmiyordu.
     KURAL DAR, uc kilit birden:
       1) ust parca tek basina HICBIR esanlamliyi icermiyor (calisan
          eslesmeye DOKUNULMAZ — Maximum yolu ayni, olculdu)
       2) ust parca bir esanlamlinin ON EKI (rastgele metin birlesmez)
       3) alt parca EN FAZLA BIR satir altta (2..24), x araligi ORTUSUYOR,
          tutar degil ve birlesim esanlamliya TAM ESIT
     Eslesince ustun iskelet+ham'i birlesik yazilir; ALT PARCA TUKETILIR
     (iskeleti bosaltilir). ⚠ CA olcumu: tuketilmezse alt parca kendi
     basina da bir esanlamliysa ("ekstre borcu" hem devirin kuyrugu hem
     hesapOzeti'nin Enpara esanlamlisi) ayni metin IKINCI kez etiket
     olur ve yanlis degere baglanip alani BELIRSIZ'e dusurur — olculdu.
     Iki satirin da iskeleti yeniden kurulur. Sarma tespiti ham'a
     bakiyor, bosalan iskelet onu etkilemez. */
  for (const s of satirlar){
    for (const p of s.items){
      if (p.isk.length < 3) continue;
      if (tumIsk.some(sn => p.isk.indexOf(sn) >= 0)) continue;          // kilit 1
      if (!tumIsk.some(sn => sn.length > p.isk.length && sn.startsWith(p.isk))) continue; // kilit 2
      /* ⚠ CD · kilit 3a artik PT ILE, bant/dolu-satir sayisi DEGIL.
         Olculdu (gercek pdf.js dokumu): Enpara basligi DORT ayri y
         bandina yayiliyor (220.9/225.2/229.1/232.4 — araya operator
         bantlari giriyor); "bir alt dolu satir" kurali ust yarim
         (220.9) ile alt yarimi (232.4, dy=11.5pt) HIC bulusturamiyordu.
         Alt parca ust parcanin KENDI y'sinden en fazla 15pt asagida ve
         x araligi ortusuyorsa birlesir — aradan kac bant gectigi
         onemsiz. 15pt: olculen baslik-ici mesafe 11.5pt (Enpara) ve
         14.2pt (Ziraat fikstur varsayimi — birebirlik kriteri onu da
         kapsamayi zorunlu kiliyor; gorevdeki 14pt Ziraat'i dusururdu).
         Genisletme yasak: 15 ustu SESSIZ YANLIS uretir. */
      let q = null, qSatir = null;
      for (const s2 of satirlar){
        const dy = s2.y - p.y;
        if (dy <= 2) continue;
        if (dy > 15) break;                                             // kilit 3a
        q = s2.items.find(q2 => !axTutarMi(q2.ham)
          && !AX_OPERATOR(q2.ham)                                       // CE · operator etiket olmaz
          && q2.isk.length > 0
          && q2.x < p.x + (p.g || 0) + 2 && q2.x + (q2.g || 0) > p.x - 2  // kilit 3b
          && tumIsk.some(sn => sn === p.isk + q2.isk));                 // kilit 3c
        if (q){ qSatir = s2; break; }
      }
      if (!q) continue;
      p.isk = p.isk + q.isk;
      p.ham = p.ham + ' ' + q.ham;
      p.altY = q.y;               // CD · deger penceresi buradan olculur
      q.isk = '';                                                       // alt parca tuketildi
      for (const sat of [s, qSatir]){
        sat.isk = '';
        for (const it of sat.items){ it.iBas = sat.isk.length; sat.isk += it.isk; it.iSon = sat.isk.length; }
      }
    }
  }

  /* Herhangi bir alanin esanlamlisini TASIYAN parca "etiket"tir; deger
     taramasi bir etiketin USTUNDEN GECEMEZ. Olculdu: ozet dipnotu
     "Devreden Bakiye Alacak Kayıtları Borç Kayıtları | Hesap Özeti
     Borcu 347.386,08" TEK satir — engel olmasa uc sutunun ucu de
     satirin sagindaki 347.386,08'i alirdi.
     ⚠ BY · bu hesap birlestirmeden SONRA: birlesik baslik da etikettir. */
  for (const s of satirlar)
    for (const it of s.items)
      it.etiketMi = it.isk.length > 2 && tumIsk.some(sn => it.isk.indexOf(sn) >= 0);

  const alanlar = {};
  for (const alan of Object.keys(AX_SOZLUK)){
    const tanim = AX_SOZLUK[alan];
    const uygun = tanim.tip === 'para'  ? (t) => axTutarMi(t)
                : tanim.tip === 'tarih' ? (t) => AX_TARIH.test(t)
                : (t) => t.trim().length > 1 && !axTutarMi(t);
    const adaylar = []; let etiketGoruldu = null;
    for (const s of satirlar){
      let sn = null, idx = -1;
      for (const aday of tanim.isk){ const i2 = s.isk.indexOf(aday);
        if (i2 >= 0){ sn = aday; idx = i2; break; } }   // liste uzundan kisaya sirali
      if (!sn) continue;
      /* DUZELTME 3a+b: onundeki metin bir NITELEYICIYLE bitiyorsa bu
         baska alandir. TAM eslesme (onunde hic sey yok ya da niteleyici
         degil) EK'li eslesmeyi boyle yener. */
      const once = s.isk.slice(0, idx);
      if (AX_NITELEYICI.some(n => once.length >= n.length && once.endsWith(n))) continue;
      /* ⚠ CA · TARIH alanlarinda niteleyici SATIRIN TAMAMINDA aranir
         (etiket araligi haric). OLCULDU (Enpara): "Bir sonraki
         ekstrenizin tarihi 30/08/2026, son ödeme tarihi ise 09/09/2026"
         satirinda etiketin HEMEN ONU '...30082026' — onek denetimi
         gecirdi, alan BELIRSIZ kaldi. Satirin basindaki 'sonraki' butun
         satiri GELECEK doneme baglar; satir elenince tek aday kalir.
         YALNIZ TARIHTE: para satirlarinda niteleyici baska sutunun mesru
         basliginin parcasi olabiliyor ("Nakit avans...", "Bir önceki
         ekstre borcu") — orada satir geneli eleme alanlari oldururdu.
         ⚠ CB · DARALTILDI: satir geneli eleme yalniz ZAMAN KAYDIRAN
           niteleyicilerle (sonraki/önceki). Olculdu (gercek Enpara):
           "Son ödeme tarihi" ile "Kullanılabilir kart limiti" AYNI
           BANTTA — tam liste kullanilinca komsu sutunun 'kullanılabilir'i
           gercek etiketi de eliyordu ve son odeme HIC bulunamiyordu.
           'kullanılabilir/nakit/toplam...' tarih tasiyan bir alani
           baska doneme KAYDIRMAZ; eleme gerekcesi yalniz zamandir. */
      if (tanim.tip === 'tarih'){
        const dis = once + s.isk.slice(idx + sn.length);
        if (AX_NITELEYICI_ZAMAN.some(n => dis.indexOf(n) >= 0)) continue;
      }
      /* BB · doviz varyanti: etiketin hemen ardi USD/EUR ise BASKA alandir */
      const sonra = s.isk.slice(idx + sn.length);
      if (AX_DOVIZ_RED.some(d => sonra.startsWith(d))) continue;
      const etiketIt = s.items.find(it => it.iSon > idx);
      const sonIt    = s.items.find(it => it.iSon >= idx + sn.length);
      etiketGoruldu = etiketGoruldu || (etiketIt ? etiketIt.ham : null);
      let deger = null, kural = null;
      /* 1 · ayni satirda SAGDA — baska bir etikete carpinca durulur */
      for (const it of s.items){
        if (it.x <= sonIt.x) continue;
        if (it.etiketMi) break;
        if (uygun(it.ham)){ deger = it.ham; kural = 'aynı satırda sağında'; break; }
      }
      /* 2 · tarih ETIKETIN KENDI parcasinin icinde olabilir
         (olculdu: "Son Ödeme Tarihi: 20/08/2026" TEK parca) */
      if (!deger && tanim.tip === 'tarih' && AX_TARIH.test(sonIt.ham)){
        /* ham yalniz TARIH — butun parcayi gostermek "Son Ödeme Tarihi:
           20/08/2026"u deger sutununa tasiyordu (olculdu). */
        deger = sonIt.ham.match(AX_TARIH)[0]; kural = 'etiketle aynı parçada';
      }
      /* 3 · HEMEN ALTINDA, ayni sutunda (olculdu: dipnot sutunlari
         x sapmasi 1.4pt, satir arasi 14.2pt -> tolerans 12 / 2..24) */
      if (!deger){
        for (const s2 of satirlar){
          const dy = s2.y - s.y;
          if (dy <= 2 || dy > 24) continue;
          const it2 = s2.items.find(it => Math.abs(it.x - etiketIt.x) <= 12
                                          && !it.etiketMi && uygun(it.ham));
          if (it2){ deger = it2.ham; kural = 'hemen altında'; break; }
        }
      }
      /* 3a2 · CD · SUTUN HIZASINDAN — pt penceresi + x ARALIK ortusmesi.
         Olculdu (gercek pdf.js dokumu): "demeler" etiketi x=123.4'te
         (dusen O harfinin boslugu yuzunden kaymis), degeri 150.000,00
         x=109.7'de — kural 3'un nokta olcutu (|dx|<=12) 13.7pt farki
         KACIRIYOR; oysa parca ARALIKLARI genisce ortusuyor. Pencere:
         etiketin EN ALT y'sinden (birlesik basliklarda alt parcanin
         y'si — p.altY) en fazla 21pt asagi; ayni araliktaki ILK uygun
         deger alinir. 21pt OLCULMUS: baslik->deger 14.6pt, en uzak
         mesru cift "demeler"->deger 20.4pt (gorevdeki 20pt onu kil payi
         dusururdu; 21 ustu SESSIZ YANLIS — genisletme yasak. Ornek:
         ozet tablosu "Ekstre borcu" basligi degerinden 21.8pt uzakta
         ve BILEREK disarida — hesapOzeti ust bloktan tek adayla
         geliyor, ikinci belirsiz aday dogmuyor). */
      if (!deger && tanim.tip !== 'metin'){
        const taban = etiketIt.altY || etiketIt.y;
        const eBas = etiketIt.x - 2, eSon = etiketIt.x + (etiketIt.g || 0) + 2;
        for (const s2 of satirlar){
          for (const it of s2.items){
            const dy = it.y - taban;
            if (dy <= 2 || dy > 21) continue;
            if (it.etiketMi || !uygun(it.ham)) continue;
            if (it.x >= eSon || it.x + (it.g || 0) <= eBas) continue;
            deger = it.ham; kural = 'sütun hizasından'; break;
          }
          if (deger) break;
        }
      }
      /* 3c · CB · TARIH: ALT SATIRDA SAGINDA. Olculdu (gercek Enpara):
         "Son ödeme tarihi" satirinin sag tarafi BASKA ETIKETLE kapali
         ("Kullanılabilir kart limiti" — kural 1 engele carpip duruyor)
         ve degeri 10/08/2026 BIR ALT satirda, deger SUTUNUNDA duruyor —
         etiketin x'iyle hizali DEGIL, o yuzden kural 3 ve sarma
         penceresi de goremiyor. Kilitler DAR:
           · yalniz TARIH alanlari
           · ilk DOLU alt satir (bos satir atlanir), tavan 40pt; karar
             orada — ikinci satira gecilmez
           · o satirda HICBIR ETIKET yok (etiketli satir baskasinin
             bolgesidir) ve satirda TEK tarih var (coksa hangisi
             oldugu bilinemez — tahmin yok)
           · deger etiketin SAGINDA (x buyuk)
         "Bir sonraki ... son ödeme tarihi ise 09/09/2026" satiri buraya
         DUSMEZ: o satir kendi etiketini tasir (etiketli satir kilidi)
         ve o etiket satir-geneli 'sonraki' elemesiyle zaten dusuyor. */
      if (!deger && tanim.tip === 'tarih'){
        for (const s2 of satirlar){
          const dy = s2.y - s.y;
          if (dy <= 2) continue;
          if (dy > 40) break;
          if (s2.items.some(it => it.etiketMi)) break;
          const tarihler = s2.items.filter(it => AX_TARIH.test(it.ham));
          if (tarihler.length === 1 && tarihler[0].x > etiketIt.x && uygun(tarihler[0].ham)){
            deger = tarihler[0].ham.match(AX_TARIH)[0];
            kural = 'alt satırda sağında';
          }
          break;                     // ilk dolu satir: karar burada
        }
      }
      /* 3b · BY/CA · SARMA SATIRLARININ ALTINDA — para ve tarih alanlari.
         Olculdu (gercek Bankkart): baslik sarilinca deger IKI satir
         altta kaliyordu. CA olcumu (gercek Enpara) daha derin: ozet
         tablosunun basligi UC satira yayiliyor ("Bir önceki /
         ekstre borcu" + iki alt baslik satiri), deger satiri basliktan
         DORT satir asagida. BY'nin tek-sarma penceresi yetismedi.
         Kural satir satir ILERLER, korukorune y penceresi ACMAZ:
           · yalniz kural 1-3 BOS kaldiysa calisir (Maximum yolu degismez)
           · sonraki satirlar y sirasiyla gezilir. Icinde TUTAR olan ilk
             satir DEGER SATIRIDIR: x hizamda (|dx| <= 12) uygun deger
             varsa alinir; yoksa DURULUR — daha asagisi baska bolgedir.
           · tutarsiz satir SARMA metnidir; EN FAZLA UC sarma atlanir
             (Enpara: 3). Dorduncude vazgecilir.
           · hic sarma atlamadan 24pt'ten uzaga UZANILMAZ (arasi bos
             uzak tutar: olculmus tuzak, kenar 11) ve 90pt'ten oteye
             hicbir kosulda gecilmez.
         Birden cok FARKLI aday cikarsa asagida 3c zaten BELIRSIZ der. */
      if (!deger && tanim.tip !== 'metin'){
        let sarmaSayisi = 0;
        for (const s2 of satirlar){
          const dy = s2.y - s.y;
          if (dy <= 2) continue;
          if (dy > 90) break;
          if (s2.items.some(it => axTutarMi(it.ham))
              || (tanim.tip === 'tarih' && s2.items.some(it => AX_TARIH.test(it.ham)))){
            /* deger satiri: ya burada ya hicbir yerde */
            if (dy > 24 && sarmaSayisi === 0) break;
            const it2 = s2.items.find(it => Math.abs(it.x - etiketIt.x) <= 12
                                            && !it.etiketMi && uygun(it.ham));
            if (it2){ deger = it2.ham;
                      kural = dy > 24 ? 'sarma satırının altında' : 'hemen altında'; }
            break;
          }
          if (++sarmaSayisi > 3) break;
        }
      }
      if (!deger) continue;   // degersiz eslesme ADAY DEGILDIR (sarkan etiket paracigi)
      const o = { etiket: etiketIt.ham, kural: kural, ham: deger };
      if (tanim.tip === 'para'){
        const r = paraCoz(deger);
        if (!r.ok) continue;
        /* ⚠ DUZELTME 5 · ISARET KURALI. Banka, borc kayitlarini EKSI
           yazar ("-106.802,77 TL"); yeni_harcama POZITIF saklanir
           (kd_yeni_chk >= 0). Mutlak deger SESSIZCE degil, ACIKCA
           alinir ve kullaniciya soylenir. */
        if (/^\s*[-−]/.test(deger)) o.kural += ' · eksi işaret pozitife çevrildi';
        o.kurus = r.kurus; o.kim = String(r.kurus);
      } else if (tanim.tip === 'tarih'){
        const mm = deger.match(AX_TARIH);
        o.gun = +mm[1]; o.ay = mm[3] + '-' + mm[2]; o.kim = o.gun + '|' + o.ay;
      } else o.kim = axIskelet(deger);
      adaylar.push(o);
    }
    /* DUZELTME 3c · birden cok FARKLI deger kalirsa BELIRSIZ — tahmin
       YOK. Ayni degeri soyleyen tekrar (ust blok + dipnot) belirsizlik
       DEGILDIR; olculdu, hesap ozeti iki yerde ayni rakamla geciyor. */
    const farkli = [...new Set(adaylar.map(a => a.kim))];
    if (!adaylar.length) alanlar[alan] = { durum:'yok', etiket: etiketGoruldu || undefined };
    else if (farkli.length > 1)
      alanlar[alan] = { durum:'belirsiz',
        etiket: adaylar.map(a => '"' + a.etiket + '" ' + a.ham).join(' / ') };
    else { const a0 = adaylar[0]; alanlar[alan] = Object.assign({ durum:'ok' }, a0); }
  }

  /* ⚠ BB · OZET TABLOSUNUN IKI SUTUNU TEK TERIME. Is Bankasi Bankkart
     harcamayi ve faiz/ucret/kesintiyi AYRI sutunlarda yaziyor; bizim
     modelimizde faiz ayri bir terim degil, ikisi birlikte yeni_harcama.
     Kabul olcutunden: 417.850,00 + 230.580,25 − 67.878,40 = 580.551,85.
     ⚠ YALNIZ 'yeni' baska turlu okunamadiysa devreye girer. Maximum
       ekstresinde "Dönem İçi Borç Kayıtları" TEK sutun ve dogrudan
       okunuyor — bu yol ona hic dokunmaz.
     ⚠ IKISI DE OKUNMALI. Biri eksikken digerini "yeni harcama" diye
       yazmak, eksik sutunu SESSIZCE sifir saymak olurdu. */
  /* ⚠ CC · Islev olarak: IKI kez cagrilir — burada (etiket yolundan gelen
     sutunlarla, Ziraat) ve asagida SABLON atamasindan sonra (Enpara —
     sablonun doldurdugu harcama/nakitAvans/faizKesinti'den yeni turesin).
     Govde CA'daki halin AYNISI, yalniz sarmalandi. */
  const yeniyiTopla = () => {
    if ((!alanlar.yeni || alanlar.yeni.durum !== 'ok')
        && alanlar.harcama && alanlar.harcama.durum === 'ok'
        && alanlar.faizKesinti && alanlar.faizKesinti.durum === 'ok'){
      /* ⚠ CA · ENPARA UCUNCU SUTUN: "Nakit avans / Artı bakiye transferi"
         de yeni_harcamaya girer (modelde ayri terim yok). UC HAL:
           · nakitAvans OK        -> UC sutun toplanir (Enpara)
           · alan hic gorulmedi   -> IKI sutun toplanir (Ziraat — o dosyada
                                     boyle bir sutun YOK, eski yol AYNEN)
           · sutun VAR ama okunamadi (etiket gorulmus / belirsiz)
                                  -> TOPLAMA YAPILMAZ. Okunamayan sutunu
                                     sifir saymak SESSIZ EKSIK rakam olur;
                                     alan bos kalir, kapi kurulamaz, ekran
                                     zaten "bulunamadi" der. */
      const na = alanlar.nakitAvans;
      const naOkunamadi = na && na.durum !== 'ok' && (na.etiket || na.durum === 'belirsiz');
      if (na && na.durum === 'ok'){
        alanlar.yeni = { durum:'ok',
          kurus: alanlar.harcama.kurus + na.kurus + alanlar.faizKesinti.kurus,
          ham: alanlar.harcama.ham + ' + ' + na.ham + ' + ' + alanlar.faizKesinti.ham,
          etiket: alanlar.harcama.etiket + ' + ' + na.etiket + ' + ' + alanlar.faizKesinti.etiket,
          kural: 'özet tablosunun üç sütunu toplandı' };
      } else if (!naOkunamadi){
        alanlar.yeni = { durum:'ok',
          kurus: alanlar.harcama.kurus + alanlar.faizKesinti.kurus,
          ham: alanlar.harcama.ham + ' + ' + alanlar.faizKesinti.ham,
          /* ⚠ Tirnaksiz: onay ekrani etiketi zaten tirnaga aliyor. */
          etiket: alanlar.harcama.etiket + ' + ' + alanlar.faizKesinti.etiket,
          kural: 'özet tablosunun iki sütunu toplandı' };
      }
    }
  };
  yeniyiTopla();

  /* Faiz/vergi islem satirinin ICINDEN (tek parca geldigi olculdu).
     ⚠ Iki sayi bicimi de kabul: "FZ:11.078,37" (TR) ve "FZ:11,078.37"
       (gercek dosyada boyle) — paraCoz ikisini de dogru cozer. */
  const tumMetin = satirlar.map(s => s.items.map(i => i.ham).join(' ')).join('\n');
  const fz = tumMetin.match(/FZ\s*:?\s*([\d.,]+)/i);
  const vr = tumMetin.match(/VR\s*\/?\s*FN\s*:?\s*([\d.,]+)/i);
  alanlar.faiz  = fz && paraCoz(fz[1]).ok ? { durum:'ok', etiket:'FZ:',
    kural:'işlem satırı içinden', ham: fz[1], kurus: paraCoz(fz[1]).kurus } : { durum:'yok' };
  alanlar.vergi = vr && paraCoz(vr[1]).ok ? { durum:'ok', etiket:'VR/FN:',
    kural:'işlem satırı içinden', ham: vr[1], kurus: paraCoz(vr[1]).kurus } : { durum:'yok' };

  /* ⚠ BB · IS BANKASI'NDA FAIZ TEK PARCA DEGIL, AYRI ISLEM SATIRLARI:
       "Kredi faizi" -> faiz · "BSMV (Faiz)" -> faiz vergisi
     Maximum'un "FZ:/VR/FN:" tek parcasi burada YOK; once o denenir,
     bulunamazsa satir taramasina dusulur.
     ⚠ BUNLAR BAKIYEYI DEGISTIRMEZ — bilgi alani. axKapi denklemine
       girmezler; faiz zaten yeni_harcama icindeki kesinti sutununda.
     ⚠ ORAN SATIRI DISLANIR: "Akdi Kredi Faizi Oranı 4,25" da 'kredifaizi'
       tasiyor ve "4,25" tutar desenine UYUYOR. Orani faiz sanmak yerine
       'oran' gecen satir hic okunmaz.
     ⚠ SATIRDA TEK TUTAR OLMALI. Birden cok sayi varsa hangisinin faiz
       oldugu BILINMEZ — tahmin yerine BELIRSIZ. Ayni tutari tekrarlayan
       satirlar belirsizlik degildir. */
  /* ⚠ CC · TUTAR SATIR HAM'INDAN GLOBAL ARANIR, parca-tam-eslesmeden
     DEGIL. Olculdu (gercek Enpara icerik akisi): islem satiri TEK
     BITISIK parca — "30/07/2026Faizlerin KKDF'si* 1.400,41 TL" — hicbir
     parca tek basina AX_TUTAR'a tam uymuyor ve faiz/vergi BELIRSIZ
     kaliyordu. Satirdaki parcalarin ham'lari ' ' ile birlestirilip
     icinden tutar deseni cekilir. "Tek tutar" kurali AYNEN: satirda
     birden cok FARKLI desen cikarsa null (belirsiz adayi). Tarih
     (30/07/2026) desene uymaz — virgul sart. */
  const AX_TUTAR_G = /[-−]?\d{1,3}(?:\.\d{3})*,\d{2}(?:\s*(?:TL|TRY))?/g;
  const axSatirTutari = (iskAra) => {
    const bulunan = [];
    for (const s of satirlar){
      if (s.isk.indexOf(iskAra) < 0 || s.isk.indexOf('oran') >= 0) continue;
      const tutarlar = s.items.map(i => i.ham).join(' ').match(AX_TUTAR_G) || [];
      if (tutarlar.length !== 1){ bulunan.push(null); continue; }
      const r = paraCoz(tutarlar[0]);
      bulunan.push(r.ok ? { ham: tutarlar[0].trim(), kurus: r.kurus } : null);
    }
    if (!bulunan.length) return null;
    if (bulunan.some(x => !x)) return 'belirsiz';
    return [...new Set(bulunan.map(x => x.kurus))].length > 1 ? 'belirsiz' : bulunan[0];
  };
  const axIslemAlani = (alan, etiket, iskAra) => {
    if (alanlar[alan] && alanlar[alan].durum === 'ok') return;   // FZ:/VR/FN: kazandi
    const r = axSatirTutari(iskAra);
    if (r === 'belirsiz')
      alanlar[alan] = { durum:'belirsiz', etiket: etiket + ' (satırda birden çok tutar)' };
    else if (r)
      alanlar[alan] = { durum:'ok', etiket: etiket, kural:'işlem satırından',
                        ham: r.ham, kurus: r.kurus };
  };
  axIslemAlani('faiz',  'Kredi faizi', axIskelet('kredi faizi'));
  /* CA · Enpara faizi "Alışveriş faizi" satirinda. Sira: FZ: tek parcasi
     (Maximum) -> Kredi faizi (Ziraat) -> Alisveris faizi (Enpara);
     axIslemAlani dolu alana DOKUNMAZ, oncekiler kazanir. */
  axIslemAlani('faiz',  'Alışveriş faizi', axIskelet('alışveriş faizi'));
  axIslemAlani('vergi', 'BSMV (Faiz)', axIskelet('bsmv (faiz)'));

  /* ⚠ CA · ENPARA VERGISI IKI KALEM: "Faizlerin KKDF'si" + "Faiz ve
     ücretlerin BSMV'si" — OLCULDU, ikisi ayni tutarda (1.400,41 + 1.400,41).
     ORAN VARSAYILMAZ (Ziraat'te BSMV faizin %5'iydi; burada degil) —
     okunan toplanir. Ziraat'in "BSMV (Faiz)" tek kalemi yukarida ZATEN
     dolduysa buraya dusulmez. Iki kalemden BIRI 'belirsiz' ise vergi
     BELIRSIZ olur; yalniz biri varsa TEK kalem yazilir (islem kalemi
     sutun degildir: dosyada yoksa gercekten yoktur, sifir sayma degil).
     Kaynak etiketi topladigi kalemleri yazar (kabul 3). */
  if (!alanlar.vergi || alanlar.vergi.durum !== 'ok'){
    const kkdf = axSatirTutari(axIskelet('faizlerin kkdf'));
    const bsmv = axSatirTutari(axIskelet('ücretlerin bsmv'));
    if (kkdf === 'belirsiz' || bsmv === 'belirsiz')
      alanlar.vergi = { durum:'belirsiz', etiket:'KKDF/BSMV (satırda birden çok tutar)' };
    else if (kkdf && bsmv)
      alanlar.vergi = { durum:'ok', kurus: kkdf.kurus + bsmv.kurus,
        ham: kkdf.ham + ' + ' + bsmv.ham,
        etiket: "Faizlerin KKDF'si + Faiz ve ücretlerin BSMV'si",
        kural: 'iki işlem kalemi toplandı' };
    else if (kkdf || bsmv){
      const t = kkdf || bsmv;
      alanlar.vergi = { durum:'ok', kurus: t.kurus, ham: t.ham,
        etiket: kkdf ? "Faizlerin KKDF'si" : "Faiz ve ücretlerin BSMV'si",
        kural: 'işlem satırından' };
    }
  }

  /* DUZELTME 4 · banka alan adindan */
  const kucuk = tumMetin.toLowerCase();
  const bul = new Map();
  for (const m of kucuk.matchAll(/([a-z0-9-]{3,})\.(?:com|net|org)(?:\.tr)?/g))
    for (const [anahtar, ad] of AX_BANKA)
      if (m[1].indexOf(anahtar) >= 0 && !bul.has(ad)) bul.set(ad, { anahtar: anahtar, alanAdi: m[0] });
  if (bul.size === 1){
    const [ad, b] = [...bul.entries()][0];
    alanlar.banka = { durum:'ok', etiket: b.alanAdi, kural:'alan adından',
                      ham: ad, anahtar: b.anahtar };
  } else if (bul.size > 1)
    alanlar.banka = { durum:'belirsiz', etiket: [...bul.keys()].join(' / ') };
  else {
    /* BY · alan adi yoksa MARKA. Iki marka ayni bankaya gidiyor; ileride
       farkli bankalara giden marka eklenirse coklu-eslesme BELIRSIZ der
       (alan adi yolundaki desenle ayni).
       ⚠ axIskelet, axSade DEGIL: axSade cekirdegin DISINDA tanimli ve
         cagirmak cekirdegi kendi kendine yetersiz birakiyordu (olculdu:
         Node dizenegi ReferenceError verdi). Marka kelimeleri ASCII —
         iskelet suzgeci ayni sonucu verir. */
    const sadeMetin = axIskelet(tumMetin);
    const markalar = new Map();
    for (const [kelime, ad, anahtar, gorunen] of AX_MARKA)
      if (sadeMetin.indexOf(kelime) >= 0 && !markalar.has(ad))
        markalar.set(ad, { anahtar, gorunen });
    if (markalar.size === 1){
      const [ad, m] = [...markalar.entries()][0];
      alanlar.banka = { durum:'ok', etiket: 'marka adından (' + m.gorunen + ')',
                        kural: 'marka sözlüğünden', ham: ad, anahtar: m.anahtar };
    } else if (markalar.size > 1)
      alanlar.banka = { durum:'belirsiz', etiket: [...markalar.keys()].join(' / ') };
    else alanlar.banka = { durum:'yok' };
  }

  /* ==================================================================
     ⚠ CG · AYLIK FAIZ ORANI (faizOrani). OLCULDU: uc bankanin ucunde de
     yaziyor, iki desende:
       · Ziraat: TEK UZUN PARCA — "Aylık Faiz Oranları: Alışveriş Faizi
         %4,25; Alışveriş Gecikme Faizi %4,55; ..."
       · Enpara / Is Bankasi: SUTUN TABLOSU — "Aylık" satirinin bandinda
         yuzdeler ayri parcalar; ILK sutun alisveris faizidir.
     Iki yol SIRAYLA: (1) 'alisveris faizi' gecen parcada hemen ardindan
     gelen yuzde; (2) iskeleti tam 'aylk' olan parcanin BANDINDAKI ilk
     yuzde. KILITLER:
       · 'yillik' gecen parca KESINLIKLE ELENIR (yillik oran girilirse
         projeksiyon 12 kat sasar — v113 yorumunda da yazili)
       · 'gecikme' gecen yuzde ALINMAZ
       · birden cok FARKLI aday -> BELIRSIZ, tahmin yok
       · deger yuzde SAYISI olarak saklanir: %4,25 -> 4.25 (v113
         kart.faiz_orani boyle tanimli, AYLIK)
     ⚠ axDuz cekirdegin KENDI normalizasyonu (axSade DISARIDA — cekirdek
       kendi kendine yeterli kalir, olculmus ders). Iskelet burada is
       gormez: '%' ve ',' iskelette siliniyor. */
  const AX_DUZ_H = { 'Ç':'c','Ğ':'g','İ':'i','I':'i','Ö':'o','Ş':'s','Ü':'u',
                     'ç':'c','ğ':'g','ı':'i','ö':'o','ş':'s','ü':'u' };
  const axDuz = (t) => String(t || '').replace(/[ÇĞİIÖŞÜçğıöşü]/g, m => AX_DUZ_H[m]).toLowerCase();
  const AX_YUZDE = /%\s*(\d{1,3},\d{2})/;
  {
    const oranAday = [];
    /* yol 1 · Ziraat cumlesi */
    for (const s of satirlar)
      for (const it of s.items){
        const d = axDuz(it.ham);
        if (d.indexOf('yillik') >= 0) continue;
        const i = d.indexOf('alisveris faizi');
        if (i < 0) continue;
        const kuyruk = d.slice(i);
        const m = AX_YUZDE.exec(kuyruk);
        if (!m) continue;
        const gec = kuyruk.indexOf('gecikme');
        if (gec >= 0 && m.index > gec) continue;        // ilk yuzde gecikmenin ardindaysa alma
        oranAday.push({ deger: m[1], etiket: 'Alışveriş Faizi', kural: 'faiz oranı satırından' });
      }
    /* yol 2 · "Aylık" bandindaki ilk yuzde (Enpara / Is Bankasi tablosu) */
    if (!oranAday.length)
      for (const s of satirlar){
        if (!s.items.some(it => it.isk === 'aylk')) continue;
        for (const it of s.items){
          const d = axDuz(it.ham);
          if (d.indexOf('yillik') >= 0 || d.indexOf('gecikme') >= 0) continue;
          const m = AX_YUZDE.exec(it.ham);
          if (m){ oranAday.push({ deger: m[1], etiket: 'Aylık satırı ilk sütun',
                                  kural: 'faiz tablosundan' }); break; }
        }
      }
    /* yol 3 · AKBANK / AXESS: ekstrede "Alışveriş Faizi" DIYE BIR SATIR
       YOK; karsiligi "Akdi Faiz". Hangisinin alisveris faizi oldugu
       BENZETMEYLE degil, ayni belgedeki tanim cumlesi COZULEREK
       belirlendi (harfler EBCDIC'ten okundu, s. 2):
         "Nakit Çekim veya Kullanım İşlemleri HARİÇ Uygulanacak
          Akdi Faiz Oranı: %4,25"
         "Nakit Çekim veya Kullanım İşlemlerinde Uygulanacak
          Akdi Faiz Oranı: %4,25"
         "... Gecikme Faiz Oranı: %4,55"
       Yani NAKIT CEKIM HARIC olan akdi faiz = alisveris faizi = %4,25.
       Dortlu dipnot da bunu dogruluyor: "Akdi Faiz:%4,25 · Nakit Avans
       Faizi:%4,25 · Gecikme Faizi:%4,55 · Taksitli Avans Faizi:%4,25".
       ⚠ Yol 1 ve 2 BOS DONDUYSE calisir — diger uc bankanin okumasi
         onlardan geliyor ve bu yol onlara hic ulasmiyor (olculdu). */
    if (!oranAday.length)
      for (const s of satirlar){
        const i = s.items.findIndex(it => { const d = axDuz(it.ham);
          return d.indexOf('akdi faiz') >= 0
              && d.indexOf('yillik') < 0 && d.indexOf('gecikme') < 0
              && d.indexOf('nakit') < 0; });
        if (i < 0) continue;
        for (let j = i; j < s.items.length; j++){
          const d = axDuz(s.items[j].ham);
          if (j > i && (d.indexOf('gecikme') >= 0 || d.indexOf('nakit') >= 0
                     || d.indexOf('yillik') >= 0)) break;
          const m = AX_YUZDE.exec(s.items[j].ham);
          if (m){ oranAday.push({ deger: m[1], etiket: 'Akdi Faiz (nakit çekim hariç)',
                                  kural: 'akdi faiz satırından' }); break; }
        }
      }
    const farkliOran = [...new Set(oranAday.map(o => o.deger))];
    if (!oranAday.length) alanlar.faizOrani = { durum:'yok' };
    else if (farkliOran.length > 1)
      alanlar.faizOrani = { durum:'belirsiz', etiket: farkliOran.map(d => '%' + d).join(' / ') };
    else alanlar.faizOrani = { durum:'ok', oran: Number(oranAday[0].deger.replace(',', '.')),
      ham: '%' + oranAday[0].deger, etiket: oranAday[0].etiket, kural: oranAday[0].kural,
      kim: oranAday[0].deger };
  }

  /* ==================================================================
     ⚠ CK · "BIR SONRAKI" KESIM/ODEME GUNU · YALNIZ GUN ONERISI ICIN
     Ekran her ekstrede "kesim/ödeme gününü güncelle" oneriyordu ve
     hafta sonu kaymasini KALICI AYAR saniyordu. Olculdu (Axess, kart
     29/3): 29.08.2026 CUMARTESI, banka kesimi 27'ye cekmis, odemeyi
     1'e almis; ekran "29/3 -> 27/1" oneriyordu ama dongu hala 29/3.
     Enpara'da da 10 -> 9.
     ⚠ HAFTA SONU KURALI TEK BASINA YETMIYOR — OLCULDU:
         Axess son odeme  03/09/2026 PERSEMBE (is gunu) ama 01/09'a
                          cekilmis  -> hafta sonuyla ACIKLANAMIYOR
         Enpara son odeme 10/09/2026 PERSEMBE (is gunu) ama 09/09
         Ziraat kesim     15/08/2026 CUMARTESI ama HIC kaymamis
       Yani "hafta sonuysa kaydir" diye bir kural bu dosyalarda YOK;
       uydurulmus bir esik yanlis oneriyi surdururdu.
     ⚠ BELGENIN KENDI KANITI KULLANILIYOR: on yuzun onunda
       "Bir Sonraki Hesap Kesim Tarihi" ve "Bir Sonraki Son Ödeme
       Tarihi" YAZIYOR (on ekstrenin ONUNDA da var — olculdu).
       Bu ekstrenin gunu ile BIR SONRAKININ gunu AYNIYSA dongu
       sabittir, oneri anlamli. FARKLIYSA gun zaten kayiyor demektir;
       oneri gosterilmez. Satir hic yoksa AYIRT EDILEMEZ -> gene
       gosterilmez (yanlis oneri, oneri olmamasindan kotudur). */
  {
    const gunAl = (iskler) => {
      for (const s of satirlar){
        const i = iskler.map(x => s.isk.indexOf(x)).filter(x => x >= 0);
        if (!i.length) continue;
        const bas = Math.min.apply(null, i);
        const it = s.items.find(q => q.iSon > bas && AX_TARIH.test(q.ham))
                || s.items.find(q => AX_TARIH.test(q.ham));
        if (it) return Number(it.ham.match(AX_TARIH)[1]);
      }
      return null;
    };
    /* Enpara tek cumlede: "Bir sonraki ekstrenizin tarihi 30/08/2026,
       son ödeme tarihi ise 09/09/2026" — iki tarih AYNI parcada olabilir,
       o yuzden kesim/odeme icin ayri ayri sira numarasi alinir. */
    const enpara = satirlar.map(s => s.items.find(q =>
        axIskelet(q.ham).indexOf(axIskelet('bir sonraki ekstrenizin tarihi')) >= 0))
      .find(Boolean);
    const enparaT = enpara ? (enpara.ham.match(/\d{2}[./-]\d{2}[./-]\d{4}/g) || []) : [];
    alanlar.sonrakiKesim = { durum:'yok' }; alanlar.sonrakiOdeme = { durum:'yok' };
    const sk = enparaT.length ? Number(enparaT[0].slice(0,2))
      : gunAl([axIskelet('sonraki hesap kesim tarihi')]);
    const so = enparaT.length > 1 ? Number(enparaT[1].slice(0,2))
      : gunAl([axIskelet('sonraki son ödeme tarihi')]);
    if (sk) alanlar.sonrakiKesim = { durum:'ok', gun: sk, ham: 'ayın ' + sk + '.' };
    if (so) alanlar.sonrakiOdeme = { durum:'ok', gun: so, ham: 'ayın ' + so + '.' };
  }

  /* ==================================================================
     ⚠ CJ · OZET TABLOSU YOKSA YENI/ODENEN ISLEM LISTESINDEN TOPLANIR
     Akbank ve Is Bankasi ekstrelerinde harcama/odeme OZETI YOK; iki
     rakam her seferinde elle giriliyordu. Ikisi de LISTEDE duruyor.

     SUTUN SECIMI TAHMIN DEGIL, SINAMA: tutar parcalari SAG KENARA gore
     kumelenir (sagdan hizali sutunlar), her kume icin toplam alinir ve
     MUTABAKAT KAPISINDAN gecirilir:
         devir + yeni − ödenen == hesap özeti borcu   (kurusuna kadar)
     Gecen kume kullanilir; hicbiri gecmezse HICBIR SEY YAZILMAZ ve
     ekran bugunku gibi kullanicidan ister. Denklemin tek bilinmeyeni
     var, ama toplamlar denklemden DEGIL listeden geliyor — yanlis
     sutun ancak tesadufen tutar.

     ⚠ UC TUZAK, ucu de olculdu ve ucu de bu kuralla dusuyor:
      1) TAKSIT: "DAMAT TWEEN (26.340,00 TL) 6/3.taksit  4.390,00"
         Parantez icindeki 26.340,00 ACIKLAMA parcasinin ICINDE
         (x=104), tutar sutununda degil — kume disinda kalir. Yanindaki
         "4.390,00x3" ise tutar desenine UYMAZ ('x3' eki).
      2) DEVIR SATIRI: "Önceki Dönem Hesap Özeti Bakiyesi 151.370,32"
         ve "*** BİR ÖNCEKİ HESAP ÖZETİ BAKİYENİZ *** 74.933,49"
         satirlarinda TARIH YOK. Islem satiri sayilmaz — devir iki kez
         sayilmaz.
      3) GENEL TOPLAM: "Genel Toplam 173.145,28 · 73.170,00 · 0,00"
         satirinda da TARIH YOK; kaynak olarak HIC kullanilmiyor
         (o 73.170,00 zaten ileriye donuk taksit toplami, gerceginden
         24,72 TL fazla — olculdu).
     ⚠ EKSI: Akbank "(-)" son ekiyle, Is Bankasi bastaki "-" ile
       yaziyor; ikisi de taniniyor (olculdu, baska bicim cikmadi). */
  if (alanlar.devir && alanlar.devir.durum === 'ok'
      && alanlar.hesapOzeti && alanlar.hesapOzeti.durum === 'ok'
      && !(alanlar.yeni && alanlar.yeni.durum === 'ok')
      && !(alanlar.odenen && alanlar.odenen.durum === 'ok')){
    const hedef = alanlar.hesapOzeti.kurus - alanlar.devir.kurus;   // yeni − ödenen
    const ISL = /^([-−]?)(\d{1,3}(?:\.\d{3})*,\d{2})(?:\s*(?:TL|TRY))?\s*(\(-\)|-|−)?$/i;
    const aday = [];
    for (const s of satirlar){
      if (!s.items.some(it => AX_TARIH.test(it.ham))) continue;   // tarihsiz satir islem degil
      for (const it of s.items){
        const m = ISL.exec(String(it.ham).trim());
        if (!m) continue;
        const r = paraCoz(m[2]);
        if (!r.ok || r.kurus === 0) continue;
        aday.push({ sag: it.x + (it.g || 0), kurus: r.kurus,
                    eksi: !!(m[1] || m[3]), ham: String(it.ham).trim() });
      }
    }
    /* ⚠ SUTUN = sag kenarlari SIRALAYIP BUYUK BOSLUKTAN BOL. Sabit
       tolerans OLMAZ: tutarlar sagdan hizali ama "(-)" son eki sag
       kenari disari itiyor — Axess'te artilar 456, eksiler 463pt'de
       bitiyor ve 3pt'lik tolerans ODEMEYI AYRI SUTUN sayiyordu
       (olculdu: kapi hicbir kumede gecmiyordu).
       Esik VERIDEN: sutun ici sicrama 0–7pt, sutunlar arasi en dar
       mesafe 54pt (Axess 463 -> 517) ve 125pt (Is Bankasi 376 -> 501).
       25pt ikisinin ortasinda; 7 ile 54 arasindaki her deger ayni
       sonucu verir. */
    aday.sort((p, q) => p.sag - q.sag);
    const kume = []; let k = null;
    for (const c of aday){
      if (!k || c.sag - k.sag > 25){ k = { sag: c.sag, uye: [] }; kume.push(k); }
      k.sag = c.sag; k.uye.push(c);
    }
    const gecen = [];
    for (const k of kume){
      const y = k.uye.filter(u => !u.eksi).reduce((t, u) => t + u.kurus, 0);
      const o = k.uye.filter(u =>  u.eksi).reduce((t, u) => t + u.kurus, 0);
      if (y - o === hedef) gecen.push({ yeni: y, odenen: o, adet: k.uye.length });
    }
    const tek = gecen.length === 1 ? gecen[0]
      : gecen.length > 1 && gecen.every(g => g.yeni === gecen[0].yeni
                                          && g.odenen === gecen[0].odenen) ? gecen[0] : null;
    if (tek){
      /* ⚠ 'tk' cekirdegin DISINDA — cekirdek kendi kendine yeterli kalir
         (olculmus ders). Bicim tk ile BIREBIR ayni, onay tablosundaki
         'PDF'te: ...' ikinci satiri bu yuzden hic cikmaz. */
      const bicim = (k) => (k/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
      const kaynak = 'işlem listesinden toplandı, mutabakat tuttu';
      alanlar.yeni   = { durum:'ok', kurus: tek.yeni,   ham: bicim(tek.yeni),
        etiket:'işlem listesi (' + tek.adet + ' satır)', kural: kaynak };
      alanlar.odenen = { durum:'ok', kurus: tek.odenen, ham: bicim(tek.odenen),
        etiket:'işlem listesi (' + tek.adet + ' satır)', kural: kaynak };
    }
  }

  /* ==================================================================
     ⚠ CI · KART TURU 0/7 · SON DORT HANEDEN TURETILIYOR
     OLCULDU (yedi gercek dosya): hicbir banka "kart türü / kart adı /
     ürün adı" diye bir etiket BASMIYOR — sozluk yolu yedi dosyada da
     bos donuyor. Ama MASKELI KART NUMARASI hepsinde var:
       Enpara  "5269 11** **** 5532"        -> 5532
       Ziraat  "KART NO : 6502-####-####-1965" -> 1965
       Ziraat  "KART NO : 5472-####-####-4330" -> 4330
       Akbank  "5526 09** **** 7799"        -> 7799
     KARAR: alan KALDIRILMADI, son dort haneden TURETILDI. Kaldirmak
     iki isi birden goturmesi olurdu — onay tablosundaki satir ve
     "Yeni kart" formundaki ad on dolgusu; son dort hane ise ekstrenin
     HANGI KARTA ait oldugunu soyleyen tek guvenilir isaret (sahibin
     alti karti var, adlari ekstrede yazmiyor).
     ⚠ SOZLUGE EKLENMEDI. AX_SOZLUK'teki her etiket ayni zamanda
       tarama ENGELIDIR; oraya bir sey eklemek diger bankalarin
       okumasini kaydirabilir (daha once olculdu). Bu AYRI bir kural
       ve YALNIZ sozluk yolu bos donduyse calisir.
     ⚠ MASKE ZORUNLU. Maskesiz dortlu gruplar bankanin Mersis
       numarasina da uyuyor ("0015 0015 2640 0497" — Akbank dipnotu,
       olculdu: maske sarti olmadan 7799 ile 0497 carpisip alani
       BELIRSIZ yapiyordu). Bankalar kart numarasini her zaman
       maskeler; maskesiz dizi kart numarasi degildir.
     ⚠ BELGE EKSTRE GIBI OKUNMADIYSA YAZILMAZ. Iki dosya (islem
       dekontu, bildirim maili) ekstre degil ve okunmamalari DOGRU;
       bildirim mailinde kart numarasi GECIYOR ve tek basina bu alani
       doldurmasi o dosyayi "okunmus" gosterirdi. Kapi: cekirdek
       alanlardan en az IKISI okunmus olacak. */
  if (!alanlar.kartAdi || alanlar.kartAdi.durum !== 'ok'){
    const cekirdekOk = ['kesim','sonOdeme','limit','devir','hesapOzeti','asgari']
      .filter(k => alanlar[k] && alanlar[k].durum === 'ok').length;
    if (cekirdekOk >= 2){
      /* ⚠ IKI MASKELEME BICIMI VAR, IKISI DE OLCULDU:
           ayirakli   "5269 11** **** 5532" · "6502-####-####-1965"
           ayiraksiz  "4743********2509"    · "6509********6948"
         Ilk desen tek basina Is Bankasi basligini KACIRIYORDU: Black
         Kart ekstresinin ustunde "4743********2509" var (ayiraksiz),
         ikinci sayfada ise "SANAL KART NO: 4743 **** **** 7785" —
         yalniz ayirakli desenle SANAL KART okunuyordu (olculdu). */
      const PAN_G = /[0-9*#xX•·]{4}(?:[ \-–—][0-9*#xX•·]{4}){3}|\d{4}[*#xX•·]{6,12}\d{4}/g;
      const dortlu = new Map();
      for (const s of satirlar)
        for (const it of s.items){
          PAN_G.lastIndex = 0;
          let m;
          while ((m = PAN_G.exec(it.ham))){
            const tam = m[0];
            const onc = it.ham[m.index - 1], srs = it.ham[m.index + tam.length];
            if (onc && /[0-9*#]/.test(onc)) continue;    // daha uzun bir dizinin ortasi
            if (srs && /[0-9*#]/.test(srs)) continue;
            if (!/[*#xX•·]/.test(tam)) continue;         // maskesiz -> kart numarasi degil
            const son = tam.slice(-4);
            if (!/^\d{4}$/.test(son)) continue;
            if (!dortlu.has(son)) dortlu.set(son, tam.trim());
          }
        }
      /* ⚠ EK KART · BIRDEN COK NUMARA CIKABILIR, BELIRSIZ DEGILDIR.
         Olculdu (Ziraat Ticari): ekstrenin BASLIGINDA
         "5472-####-####-4330", islem listesinin ilerisinde ikinci bir
         bolum "KART NO : 6508-####-####-4005" — ikincisi EK KARTTIR,
         ekstre birincisine aittir. Kural konuma dayaniyor: satirlar
         y'ye gore sirali, ilk gecen numara baslikta olandir. Otekiler
         GIZLENMEZ, kural metninde yazilir ki kullanici gorsun. */
      const giris = [...dortlu.entries()];
      if (giris.length){
        const [son, tam] = giris[0];
        alanlar.kartAdi = { durum:'ok', ham: '···' + son, etiket: tam,
          kural: 'kart numarasının son dört hanesinden'
               + (giris.length > 1 ? ' · ekstrede ' + (giris.length - 1)
                   + ' ek kart daha geçiyor (' + giris.slice(1).map(g => '···' + g[0]).join(', ')
                   + '), başlıktaki alındı' : '') };
      }
    }
  }

  /* ⚠ CD · ESKI 'SIRALI SUTUN SABLONU' (AX_SABLON) BURADAN KALDIRILDI.
     Var olmayan bir yapiya yazilmisti: ham icerik-akisi ayristiricisi
     ozet satirini TEK bitisik parca gostermisti; gercek pdf.js ayni TJ
     dizisini kerning noktalarindan bolup ALTI AYRI parca uretiyor
     (olculdu: tmp/enpara-pdfjs.txt). Sablon hicbir gercek dosyada
     tetiklenmiyordu; onunla gelen 'coklu tutar tasiyan parcayi bol'
     kurali da kaldirildi — pdf.js zaten boluyor. Kaldirma sonrasi
     Ziraat/Maximum ciktilarinin degismedigi olculdu. */
  /* ⚠ DF · BICIM CEVRILDIYSE ONAY EKRANINDA YAZSIN. Bayrak parcalar
     dizisinden tasiniyor; alanlarin hicbirine dokunmuyor. */
  if (parcalar && parcalar.bicimCevrildi) alanlar.bicimCevrildi = true;
  return alanlar;
}
/* AZ-CEKIRDEK-SONU */

/* ⚠ ARITMETIK KAPISI. Ekstre kendi kendini denetler:
     devir + yeni + duzeltme − odenen = hesap ozeti borcu
   Parser bir rakami yanlis okursa denklem TUTMAZ. Yanlis okuyup USTELIK
   denklemi de tutturmasi pratikte imkansiz.
   ⚠ RAKAMLARDAN BIRI EKSIKSE DENKLEM KURULMAZ. Bos alani 0 sayip
     tutturmus gibi gostermek kapinin butun degerini yok eder. */
function axKapi(a){
  const eksik = ['devir','yeni','odenen','hesapOzeti']
    .filter(k => !a[k] || a[k].durum !== 'ok');
  if (eksik.length) return { durum:'yapilamadi', eksik: eksik };
  const sol = a.devir.kurus + a.yeni.kurus - a.odenen.kurus;
  const fark = sol - a.hesapOzeti.kurus;
  return { durum: fark === 0 ? 'tutuyor' : 'tutmuyor', sol: sol, fark: fark };
}

async function ekstreOku(){
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/pdf,.pdf';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; inp.remove();
    if (!f) return;
    mesaj('kartMsg','ok','Ekstre okunuyor...');
    let parcalar;
    try { parcalar = await axParcalar(f); }
    catch(e){
      /* ⚠ Ozellik calismazsa GIRIS YOLU KAPANMASIN — mevcut form duruyor. */
      mesaj('kartMsg','hata','Okuyucu yüklenemedi, alanları elle girebilirsin. ('
        + (e && e.message || e) + ')');
      return;
    }
    mesajTemizle('kartMsg');
    /* ⚠ CI · IPUCU axOku'DAN ONCE HESAPLANIR. axOku, CD kuralinda
       parcalarin ham'ini BIRLESTIRIP bazilarini banttan cikariyor —
       ayni diziyi sonradan tekrar taramak birlesmis ve birlesmemis
       hali YAN YANA gosterirdi. Okuyucunun ciktisi DEGISMEDI. */
    const toplamIpucu = axToplamSatirlari(parcalar);
    await ekstreOnayEkrani(axOku(parcalar), f, toplamIpucu);
  };
  inp.click();
}

/* ⚠ CI · EKSTREDE OKUNABILEN TOPLAM SATIRLARI (yalniz IPUCU).
   Ozet tablosu olmayan ekstrede ekran "birini bul ve gir" diyor ama
   NEREYE bakilacagini soylemiyordu; sahibi iki sayfa geziyor.
   Olculdu (Axess): islem listesinin dibinde
     "Genel Toplam · 151.370,32 · 17.560,00 · 79,02(-)"
   ⚠ ETIKET LISTESI DAR ve TAM ESLESME. Ayni belgede "Toplam Nakit
     Avans Limiti" de var; icinde 'toplam' gecen her satiri almak
     ipucunu gurultuye cevirirdi (olculdu). Yalniz iskeleti tam
     asagidakilerden biri olan satir alinir.
   ⚠ HICBIR ALANA YAZMAZ. Hangi sutunun ne oldugunu ekstre soylemiyor;
     yanlis alana dusen bir toplam SESSIZCE yanlis donem borcu uretir.
     Karar kullanicinin. */
const AX_TOPLAM_ISK = ['genel toplam','toplam','ara toplam','dönem toplamı',
                       'dönem toplam'].map(axIskelet);
function axToplamSatirlari(parcalar){
  const bulunan = [];
  for (const s of axSatirlar(parcalar || [])){
    const et = s.items.find(it => AX_TOPLAM_ISK.indexOf(it.isk) >= 0);
    if (!et) continue;
    const tutarlar = s.items.filter(it => it !== et && axTutarMi(it.ham)
                                       || (it !== et && /^\d[\d.,]*\d\s*\(?-?\)?$/.test(it.ham.trim())))
                            .map(it => it.ham.trim());
    if (tutarlar.length) bulunan.push({ etiket: et.ham.trim(), tutarlar: tutarlar });
  }
  return bulunan;
}
