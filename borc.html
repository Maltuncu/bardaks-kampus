<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>bardak's kampüs · Borç</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' blob: https://*.supabase.co https://cdn.jsdelivr.net; worker-src 'self' blob:; base-uri 'self'; form-action 'none'">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   BORC TAKIP — index.html'den BAGIMSIZ dosya.
   Kullanicinin karari: index.html 415 KB; borc modulu onu buyutmesin ve
   buradaki bir hata gunluk ekranlari vurmasin.

   ⚠ MOBIL (index.html M-1 bulgusu): iOS, 16px ALTINDAKI bir alana
     odaklaninca sayfayi zumler ve GERI CIKMAZ. Bu dosyada
     input/select/textarea font-size'i 16px'in ALTINA ASLA inmez.
   ===================================================================== */
:root{--ana:#2456A0;--ana-koyu:#183F78;--acik:#EBF0FA;--gri:#FAF4E3;--kart:#FFFEF8;
  --metin:#1F3354;--soluk:#8189A0;--hata:#B3402F;--uyari:#C77B2B;--ok:#2E7D4F;--cizgi:#E7DEC8}
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--gri);color:var(--metin);font-size:15px;padding-bottom:80px}
.gizli{display:none!important}

input,select,textarea{width:100%;padding:12px;border:1.5px solid var(--cizgi);border-radius:9px;
  font-size:17px;background:#fff;color:var(--metin);font-family:inherit;min-height:46px}
textarea{min-height:76px;resize:vertical}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:var(--soluk)}
/* ===== D6 · RAKAM HIZASI — TEK YERDE =====
   124.897,80 ile 48.584,30 orantili rakamla alt alta HIZALANMIYORDU.
   Para ekraninda en buyuk okunabilirlik kaybi buydu. Onceden 11 ayri
   bildirim vardi ve yeni eklenen her yer unutuluyordu; artik tek kural.
   Kapsayicilara veriliyor: font-variant-numeric MIRAS ALINIR, yani
   icine sonradan eklenen her rakam da hizali cikar. Tarih ve yuzde dahil. */
.para,.satir .dg,.bant,.serit-lej,.serit-dip,.tkv-bas .ort,.tkv-izgara,
.tkv-panel,.tt-sr,.ay-bas,.tk,td.sag,th.sag,#ustBar .kim{
  font-variant-numeric:tabular-nums}

/* ⚠ font-size VERILMEZSE dugme TARAYICI VARSAYILANINA duser (13.3333px,
   olculdu: 39 dugme). Olcek disi bir deger ve 11px kuralindan bagimsiz.
   Govde boyutuna baglandi; farkli boyut isteyen dugme kendi ezer. */
button{font-family:inherit;cursor:pointer;border:none;border-radius:9px;
  font-size:15px;font-weight:600}
.btn{width:100%;padding:14px;background:var(--ana);color:#fff;font-size:17px;min-height:48px;margin-top:14px}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn2{padding:0 15px;min-height:44px;background:var(--acik);color:var(--ana);font-size:15px}
.btn-kirmizi{padding:0 15px;min-height:44px;background:#fdeceb;color:var(--hata);font-size:15px}
.btn-mini{padding:0 12px;min-height:44px;background:var(--acik);color:var(--ana);font-size:15px}

/* ⚠ KABUK KURALLARI · index.html'den BİREBİR KOPYA — başlangıç.
   Amaç: üst ve alt çubuk iki sayfada AYNI görünsün; kullanıcı ayrı bir
   siteye geçtiğini hissetmesin. Kopya olduğu için AYRIŞMA RİSKİ var;
   araclar/kalip-tara.mjs iki dosyayı karşılaştırıp uyarıyor. */
#ustBar{background:var(--kart);color:var(--ana);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;border-bottom:1.5px solid var(--cizgi)}
#ustBar .ad{font-weight:700;font-size:17px;letter-spacing:-0.5px;line-height:1.1}
#ustBar .ad .kmp{font-family:'Caveat',cursive;font-weight:600;font-size:15px;letter-spacing:0;margin-left:4px}
#ustBar .kim{font-size:11px;color:var(--soluk);font-weight:600}
#cikisBtn{background:var(--acik);color:var(--ana);padding:7px 12px;font-size:13px}
main{padding:14px;max-width:640px;margin:0 auto}

#sekmeBar{position:fixed;bottom:0;left:0;right:0;background:var(--kart);
  border-top:1.5px solid var(--cizgi);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0)}
#sekmeBar button{flex:1;min-width:0;padding:7px 2px 6px;background:none;color:var(--soluk);
  font-size:11px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;
  border-top:2.5px solid transparent;position:relative;min-height:52px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#sekmeBar button.aktif{color:var(--ana);border-top-color:var(--ana)}
#sekmeBar button.sk-gizli{display:none}
#sekmeBar .iko{width:21px;height:21px}
#sekmeBar .iko svg{width:100%;height:100%}
#dahaOv{position:fixed;inset:0;z-index:60;background:rgba(28,24,18,.55);display:none;
  align-items:flex-end}
#dahaOv.acik{display:flex}
#dahaKutu{background:var(--kagit);width:100%;border-radius:20px 20px 0 0;
  padding:8px 0 calc(18px + env(safe-area-inset-bottom,0));
  box-shadow:0 -8px 28px rgba(28,24,18,.28);border-top:1px solid var(--cizgi)}
#dahaKutu::before{content:'';display:block;width:38px;height:4px;border-radius:3px;
  background:var(--cizgi);margin:2px auto 6px}
#dahaKutu .db-bas{font-size:11px;font-weight:700;letter-spacing:.8px;color:var(--soluk);padding:12px 20px 8px}
#dahaKutu button{width:100%;display:flex;align-items:center;gap:14px;padding:0 20px;min-height:54px;
  background:none;color:var(--metin);font-size:15px;font-weight:600;text-align:left;position:relative}
#dahaKutu button .iko{width:22px;height:22px;flex:none;color:var(--ana)}
#dahaKutu button .iko svg{width:100%;height:100%}
#dahaKutu button.aktif{color:var(--ana);background:var(--acik)}
/* ⚠ KOPYA BİTTİ */

/* Borç'un KENDİ bölümleri — üstte yatay şerit. Alt çubuk uygulamanın,
   bu şerit bu ekranın; ikisi karışmasın diye ayrı biçimde. */
#bolumSerit{display:flex;gap:8px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:10px 13px;background:var(--kart);border-bottom:1.5px solid var(--cizgi);
  position:sticky;top:52px;z-index:40;scrollbar-width:none}
#bolumSerit::-webkit-scrollbar{display:none}
#bolumSerit button{flex:none;min-height:44px;padding:0 16px;border-radius:22px;
  background:var(--gri);color:var(--soluk);font-size:15px;font-weight:600;
  border:1.5px solid var(--cizgi);white-space:nowrap}
#bolumSerit button.aktif{background:var(--ana);color:#fff;border-color:var(--ana)}

.kart{background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;padding:15px;margin-bottom:13px}
.kbaslik{font-size:17px;font-weight:700;margin:0 0 12px;overflow-wrap:anywhere}
.satir{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--cizgi)}
.satir:last-child{border-bottom:none}
.satir .et{color:var(--soluk);font-size:15px;min-width:0;overflow-wrap:anywhere}
.satir .dg{font-weight:600;white-space:nowrap}

/* ---- UST OZET BANDI ----
   ESKI: 2x2 dort buyuk kutu, 375px'te 288px = ekranin %35'i. Ustelik
   "TOPLAM BORC" tek kutusu anapara + gelecek faiz + rayic maden degerini
   TEK sayida topluyordu.
   YENI: tek kart, sinifina ayrilmis satirlar. Kutu EKLENMEDI — satir
   yuksekligi kucultuldu ki uc-dort rakam gosterirken bant BUYUMESIN. */
.bant{background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;
  padding:9px 13px;margin-bottom:12px}
/* Iki blok: sahis sirketinin borcu ile Ltd'ninki KARISMASIN */
.bant .blok-et{font-size:11px;font-weight:700;color:var(--soluk);letter-spacing:.5px;
  text-transform:uppercase;line-height:1.3}
/* Ltd bloğu tek satır özet — iki blok bandı büyütmesin (brief 2b) */
.bant .sr.ltd{border-top:2px solid var(--cizgi);padding-top:5px;margin-top:5px}
.bant .bas{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.bant .bas .et{font-size:11px;font-weight:700;color:var(--soluk);letter-spacing:.4px}
.bant .bas .dg{font-size:22px;font-weight:600;white-space:nowrap}
.bant .kirilim{font-size:11px;color:var(--soluk);line-height:1.4;margin-top:1px;overflow-wrap:anywhere}
/* Satirlar AKAN METIN: her rakam icin ayri flex satiri kullanmak bandi
   330px'e (ekranin %41'i) cikarmisti. Iki-uc rakam tek satirda, sayilar
   kalin. Bilgi ayni, yer ucte bir. */
.bant .sr{font-size:11px;line-height:1.4;color:var(--soluk);
  padding-top:4px;margin-top:4px;border-top:1px solid var(--cizgi);overflow-wrap:anywhere}
.bant .sr b{color:var(--metin);font-weight:600;white-space:nowrap}
/* ⚠ D1 · KUR FARKI ARTIK KIRMIZI DEGIL.
   Onceki hali isareti ne olursa olsun var(--hata) ile basiyordu; bugun
   fark POZITIF (+1.09M) ve kirmizi "kayip" diye okunuyordu. Ne pozitif
   ne negatif fark bir kayiptir — rayic degisimidir. Renk hukum vermesin;
   isaret (+/−) zaten anlami tasiyor. Kalin ve okunur kaliyor. */
.bant .sr .fark{color:var(--metin);font-weight:600;white-space:nowrap}
.bant .sr .eksik{color:var(--uyari);font-weight:600}
.bant .dip{font-size:11px;color:var(--soluk);line-height:1.35;margin-top:5px;
  border-top:1px solid var(--cizgi);padding-top:5px}
.bant .dip b{}

/* ===== BORC DAGILIMI SERIDI (D1) =====
   SVG DEGIL, div/flex. Gerekce:
   · Etiketler >=11px ve 320px'de sigmayabiliyor. DOM'da ellipsis/akis
     bedava; SVG <text> sarmaz, tasar ve SESSIZCE kirpilir.
   · Dokunma hedefi >=44px gerekiyor ama serit 15px. <button>::after ile
     gorunumu buyutmeden 44px vurus alani aciliyor; SVG'de her segment
     icin gorunmez dikdortgen katmani gerekirdi.
   · <button> odak, Enter/Space, aria-pressed'i kendiliginden veriyor.
   · Yeni kutuphane yok — tek dosya mimarisi korunuyor.

   ⚠ RENK TEK BASINA BILGI TASIMIYOR: her sinifin AYRI DOKUSU (cizgi
   yonu/araligi) ve YAZILI ADI var. Renk korlugu ve siyah-beyaz baskida
   dokular birbirinden ayirt edilebiliyor. */
.serit{display:flex;width:100%;height:15px;margin-top:6px;background:var(--acik);
  border-radius:4px}
.serit .sg{position:relative;min-width:0;height:15px;padding:0;border:0;border-radius:0;
  overflow:hidden;cursor:pointer;display:block}
.serit .sg:first-child{border-radius:4px 0 0 4px}
.serit .sg:last-child{border-radius:0 4px 4px 0}
/* Dokunma hedefi 15px degil 44px — gorunum buyumeden. */
.serit .sg::after{content:'';position:absolute;left:0;right:0;top:-15px;bottom:-14px}
.serit .sg .ic{display:block;font-size:11px;font-weight:600;line-height:15px;
  color:#fff;white-space:nowrap;overflow:hidden;text-align:center;
  text-shadow:0 1px 1px rgba(0,0,0,.35)}
.serit .sg[aria-pressed="true"]{outline:2px solid var(--metin);outline-offset:1px;z-index:1}
/* Sinif dokulari — renk + DOKU birlikte */
.sg-kredi{background:var(--ana)}
.sg-sahis{background:repeating-linear-gradient(45deg,var(--ok),var(--ok) 3px,#256A42 3px,#256A42 6px)}
.sg-maden{background:repeating-linear-gradient(-45deg,#C8952B,#C8952B 3px,#A87A1E 3px,#A87A1E 6px)}
.sg-kart {background:repeating-linear-gradient(0deg,#6B4E9E,#6B4E9E 2px,#543D7D 2px,#543D7D 4px)}
/* Efsane/secim TEK SATIR — bant butcesi dar. Secilince o sinif buyur. */
.serit-lej{font-size:11px;line-height:1.4;color:var(--soluk);margin-top:3px;
  overflow-wrap:anywhere}
.serit-lej .ov{display:inline-block;width:9px;height:9px;border-radius:2px;
  margin-right:3px;vertical-align:-1px}
.serit-lej .bs{font-weight:700;letter-spacing:.2px;margin-right:6px}
.serit-lej .pr{white-space:nowrap;margin-right:6px}
.serit-lej .pr.sec{font-size:13px;font-weight:600;color:var(--metin)}
.serit-lej .pr b{color:var(--metin);font-weight:600}
/* 11px — "grafik metni en az 11px" kurali dipnota da uygulaniyor.
   Bandin kendi .dip'i 10.5px; serit blogu ayri kurala tabi. */
.serit-dip{font-size:11px;color:var(--soluk);line-height:1.3;margin-top:2px;
  overflow-wrap:anywhere}

/* ===== TAKVIM AY IZGARASI (D5) =====
   Duz grid — takvim bileseni/kutuphane YOK.
   ⚠ RENK TEK BASINA BILGI TASIMIYOR: gun sayisinin altindaki isaret
   DESENI ile ayrisiyor (duz / noktali / kesikli), gecikmiste ayrica
   sayi kalin + altı cizili. Gri tonlamada desen ve kalinlik kaliyor. */
.tkv-bas{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.tkv-bas button{min-width:44px;min-height:44px;padding:0;background:var(--gri);
  color:var(--metin);font-size:17px;font-weight:600;border-radius:10px}
.tkv-bas button[disabled]{opacity:.35}
.tkv-bas .ort{flex:1;min-width:0;text-align:center}
.tkv-bas .ort .ay{font-size:15px;font-weight:700;line-height:1.2}
.tkv-bas .ort .oz{font-size:11px;color:var(--soluk);font-weight:700}
.tkv-hafta,.tkv-izgara{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.tkv-hafta div{text-align:center;font-size:11px;font-weight:600;color:var(--soluk);padding-bottom:3px}
.tkv-g{min-height:44px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;border:0;padding:0;background:var(--kart);
  border-radius:8px;cursor:pointer}
.tkv-g.bos{visibility:hidden;pointer-events:none}
/* ⚠ D6 · Gun sayilari 400. Onceden HEPSI 700'du — her sey kalinsa
   hicbir sey vurgulu degildir; gecikmis gun otekilerden ayrilmiyordu. */
.tkv-g .sy{font-size:13px;font-weight:400;color:var(--metin);line-height:1}
/* ⚠ D6 · ISARETLER DOLU-BOS KARSITLIGIYLA AYRILIYOR.
   Onceki hali nokta/kesik desenine dayaniyordu; gri tonlamada
   "bekliyor" 133, "Ltd" 137 cikti — 4 puan fark AYIRT ETMEZ (olculdu).
   Yeni ayrim YAPISAL: dolu kalin / dolu ince / ici bos cerceve. */
/* ⚠ Burada border-top-color VERILMEZ: `.tkv-g .im` ozgullugu (0,2,0)
   `.im-*` (0,1,0) sinifini EZIYORDU ve dort isaret de ayni renge
   dusuyordu (olculdu). Renk yalnizca .im-* siniflarindan gelir. */
.tkv-g .im{width:58%}
.tkv-g.bugun{outline:2px solid var(--ana);outline-offset:-2px}
.tkv-g[aria-pressed="true"]{background:var(--acik);outline:2px solid var(--metin);outline-offset:-2px}
.im-odendi  {border-top:4px solid var(--ok)}                       /* dolu KALIN */
.im-bekliyor{border-top:2px solid var(--uyari)}                    /* dolu INCE  */
.im-gecikmis{border-top:4px solid var(--hata)}                     /* dolu kalin + sayi alti cizili */
.im-ltd     {height:7px;border:1.5px solid var(--soluk);border-radius:2px;
             background:none}                                      /* ICI BOS CERCEVE */
/* Gecikmis gun sayisi TEK vurgulu gun: 700 + alti cizili. Diger gunler
   400 oldugu icin bu fark gri tonlamada da gorunuyor. */
.tkv-g.gecikmis .sy{font-weight:700;color:var(--hata);text-decoration:underline}
.tkv-panel{margin-top:10px;border-top:2px solid var(--cizgi);padding-top:9px}
.tkv-panel .pb{font-size:15px;font-weight:700}
.tkv-panel .pu{font-size:11px;color:var(--soluk);font-weight:700;margin-bottom:8px}
.tkv-alt{margin-top:8px;font-size:11px;text-align:center}
.tkv-alt button{background:none;color:var(--ana);font-weight:600;font-size:11px;
  text-decoration:underline;min-height:44px;padding:0 8px}
/* "Tum taksitler" — 2 satirlik sade satir, 84 kartlik yigin degil */
.tt-sr{display:flex;justify-content:space-between;gap:8px;padding:9px 2px;
  border-bottom:1px solid var(--cizgi);cursor:pointer;min-height:44px;align-items:center}
.tt-sr .sol{min-width:0}
.tt-sr .s1{font-size:13px;font-weight:600;color:var(--metin)}
.tt-sr .s2{font-size:11px;color:var(--soluk);font-weight:700}
.tt-sr .sag{font-size:13px;font-weight:600;white-space:nowrap}
.serit-dip b{color:var(--metin)}

.rozet{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;
  letter-spacing:.3px;vertical-align:middle;white-space:nowrap}
.rz-ticari{background:#E7F0E9;color:var(--ok)}
.rz-sahis{background:var(--acik);color:var(--ana)}
.rz-ltd{background:#F3EEE2;color:#7A6220}
.rz-eksik{background:#FBEAE7;color:var(--hata)}
.rz-yesil{background:#E7F0E9;color:var(--ok)}
.rz-sari{background:#FBF3E4;color:#8A6316}

.uyari-agir{background:#FBEAE7;border-left:3px solid var(--hata);color:var(--hata);
  padding:11px 13px;border-radius:0 10px 10px 0;margin:0 0 10px;font-weight:600;font-size:15px;line-height:1.5}
.uyari-orta{background:#FBF3E4;border-left:3px solid var(--uyari);color:#8A6316;
  padding:10px 13px;border-radius:0 10px 10px 0;margin:0 0 10px;font-weight:700;font-size:13px;line-height:1.5}
.bilgi{background:var(--acik);border-left:3px solid var(--ana);color:var(--ana-koyu);
  padding:10px 13px;border-radius:0 10px 10px 0;margin:0 0 10px;font-size:13px;line-height:1.55;white-space:pre-line}
.bos{text-align:center;color:var(--soluk);padding:26px 12px;font-size:15px;line-height:1.6}
.kucuk{font-size:13px;color:var(--soluk);line-height:1.55;margin-top:7px;overflow-wrap:anywhere}
/* Kullanici "dekont ekle yok burda" dedi. Satir VARDI ama .kucuk ile gri,
   son alanin altina sikismisti — gorulmedi. Normal metin renginde. */
.form-not{font-size:13px;color:var(--metin);font-weight:600;line-height:1.5;margin:12px 0 2px}

/* ===== P0-A1 · YIKICI EYLEM ANA EYLEMDEN AYRILDI =====
   Onceden [Odeme ekle] ile [Borcu sil] YAN YANA ve ESIT agirliktaydi.
   21.08'de ilk gercek odeme girilecek; parmak yanlis dugmeye 8px uzakta.
   Yikici eylem artik "⋯" menusunun icinde, birincil eylemden 12px uzakta. */
.dm{position:relative;display:inline-block;margin-left:12px}
.dm-bt{min-width:44px;min-height:44px;font-size:17px;line-height:1;background:var(--gri);color:var(--metin)}
.dm-mn{display:none;position:absolute;right:0;top:48px;z-index:65;background:var(--kart);
  border:1.5px solid var(--cizgi);border-radius:10px;min-width:196px;overflow:hidden;
  box-shadow:0 6px 20px rgba(28,24,18,.18)}
.dm-mn.acik{display:block}
.dm-o{width:100%;min-height:44px;padding:0 14px;background:none;color:var(--hata);
  font-size:15px;font-weight:600;text-align:left}
/* Guvenli onay penceresi — gercek <dialog>, prompt() yerine.
   Tehlike YALNIZ renkle anlatilmiyor: ikon + baslik + etki metni birlikte. */
.pm{border:none;border-radius:16px;padding:16px;width:calc(100% - 32px);max-width:340px;
  max-height:88vh;overflow:auto;background:var(--kart);color:var(--metin)}
.pm::backdrop{background:rgba(28,24,18,.55)}
.pm-bas{font-size:17px;font-weight:700;line-height:1.3;color:var(--hata)}
.pm-ikon{font-size:17px}
.pm-ad{font-size:15px;font-weight:600;margin-top:6px;overflow-wrap:anywhere}
.pm-kim{font-size:13px;color:var(--soluk);font-weight:600}
.pm-tutar{font-size:17px;font-weight:600;margin-top:2px}
.pm-etki{font-size:13px;color:var(--metin);line-height:1.5;margin-top:10px}
.pm-hata{font-size:13px;color:var(--hata);font-weight:600;margin-top:4px}
.pm textarea,.pm input{font-size:17px}

/* ================== YARDIMCILAR ================== */
const tarihStr = d => { const t = new Date(d);
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); };
const bugun = () => tarihStr(new Date());
const trGun = s => s ? new Date(s+'T00:00').toLocaleDateString('tr-TR') : '—';
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const ayAdi = ym => { const [y,m] = ym.split('-'); return AYLAR[+m-1] + ' ' + y; };

/* PARA — KURUS TAM SAYI. Float toplama 84 taksitte kurus kaydirir. */
const kr  = v => Math.round((Number(v) || 0) * 100);
const tlk = k => (k/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' TL';
/* Birimsiz — ust bandin sikisik satirlari icin. Hepsi TL; birim baslikta. */
const tk  = k => (k/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
const tl  = v => tlk(kr(v));

function paraCoz(ham){
  const t = String(ham == null ? '' : ham);
  const s = t.replace(/[^\d.,]/g,'');
  if (!/\d/.test(s)) return t.trim()==='' ? {ok:true,kurus:0} : {ok:false,hata:'Geçersiz tutar.'};
  const son = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
  let tam, ond;
  if (son < 0){ tam = s; ond = ''; }
  else { const kuyruk = s.slice(son+1).replace(/[.,]/g,'');
    if (s[son]==='.' && kuyruk.length>2){ tam = s.replace(/[.,]/g,''); ond=''; }
    else { tam = s.slice(0,son).replace(/[.,]/g,''); ond = kuyruk.slice(0,2); } }
  tam = tam.replace(/^0+(?=\d)/,'') || '0';
  const d = parseFloat(tam + (ond ? '.'+ond : ''));
  if (!isFinite(d)) return {ok:false,hata:'Geçersiz tutar.'};
  return { ok:true, kurus: Math.round(d*100) };
}
function gramCoz(ham){
  const t = String(ham==null?'':ham).replace(',','.').replace(/[^\d.]/g,'');
  if (!/\d/.test(t)) return {ok:false,hata:'Geçersiz gram.'};
  const d = parseFloat(t);
  if (!isFinite(d) || d <= 0) return {ok:false,hata:'Gram sıfırdan büyük olmalı.'};
  return { ok:true, deger: Math.round(d*1000)/1000 };
}
const gramYaz = g => (Number(g)||0).toLocaleString('tr-TR',{minimumFractionDigits:0,maximumFractionDigits:3})+' gr';
const gunFarki = (a,b) => Math.round((new Date(a+'T00:00') - new Date(b+'T00:00'))/86400000);
function ayEkle(t0, ay){
  const [y,m,g] = t0.split('-').map(Number);
  const t = new Date(y, m-1+ay, 1);
  t.setDate(Math.min(g, new Date(t.getFullYear(), t.getMonth()+1, 0).getDate()));
  return tarihStr(t);
}

/* DOM — kullanici metni ASLA innerHTML ile basilmaz */
function el(tag, sinif, metin){

function mesaj(id, tip, metin){
  const m = document.getElementById(id);

  m.className = 'msg ' + tip; m.textContent = metin;

/* SESSIZ HATA YASAK (index.html M-4: iki silme akisi hatayi yutuyordu) */
function hataYaz(msgId, onek, error){
  const ham = (error && (error.message || error.hint || error.details)) || 'Bilinmeyen hata';
  mesaj(msgId, 'hata', onek + '\n' + hataTr(ham));
  console.error(onek, error);
}
function hataTr(m){
  const s = String(m || '');
  if (/row-level security|permission denied/i.test(s)) return 'Yetkin yok (bu bölüm yalnız işletme sahibine açık).';
  if (/kt_ayrim_chk/i.test(s))
    return 'Kırılım tutmuyor: anapara + faiz + vergi/masraf, taksit tutarına EŞİT olmalı.\n'
         + 'Kırılımı hiç girmeyeceksen üçünü de boş bırak.';
  if (/kt_vergi_masraf_chk/i.test(s)) return 'Vergi/masraf eksi olamaz.';
  if (/kt_odeme_chk/i.test(s))        return 'Ödendi işaretlemek için ödeme tarihi zorunlu.';
  if (/ux_kredi_taksit\b/i.test(s))   return 'Bu kredide aynı sıra numarası zaten var.';
  if (/ux_maden_fiyat/i.test(s))      return 'Bu tür için bu tarihe zaten fiyat girilmiş.';
  if (/kredi_tur_chk/i.test(s))       return 'Kredi türü ticari, şahıs veya ltd olmalı.';
  if (/maden_tur_chk|mf_tur_chk/i.test(s)) return 'Maden türü altın veya gümüş olmalı.';
  if (/_chk\b/i.test(s))              return 'Girilen değer kuralları sağlamıyor: ' + s;
  if (/duplicate key/i.test(s))       return 'Bu kayıt zaten var.';
  if (/Failed to fetch|NetworkError/i.test(s)) return 'İnternet bağlantısı kurulamadı. Kayıt YAPILMADI, tekrar dene.';
  return s;
}

/* ============ BELGE — index.html SOZLESMESI (birebir) ============
   Ayni kova 'belgeler', ayni yol: <klasor>/<YYYY-AA-GG>_<uuid>.<uzanti>
   Farkli yol kullanilsaydi dekontlar YEDEGIN DISINDA kalirdi. */
async function fotoKucult(file){
  try{
    const img = await createImageBitmap(file);
    const oran = Math.min(1, 1600/Math.max(img.width, img.height));
    if (oran === 1 && file.size < 700*1024) return { veri:file, tip:null };
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*oran); c.height = Math.round(img.height*oran);
    const cx = c.getContext('2d'); cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r,'image/jpeg',0.82));
    return blob ? { veri:blob, tip:'jpg' } : { veri:file, tip:null };
  }catch(e){ return { veri:file, tip:null }; }      // PDF: oldugu gibi
}
async function dosyaYukle(f, klasor){
  if (!f) return null;
  const k = await fotoKucult(f);
  const uzanti = k.tip || (f.name.split('.').pop() || 'jpg').toLowerCase();
  const yol = `${klasor}/${bugun()}_${crypto.randomUUID()}.${uzanti}`;
  const { error } = await sb.storage.from('belgeler').upload(yol, k.veri,
    { upsert:false, contentType: k.tip ? 'image/jpeg' : (f.type || undefined) });
  if (error) throw new Error('Belge yüklenemedi: ' + error.message);
  return yol;
}
function dekontEkle(tablo, id, klasor, msgId, mevcutVar, sonra){
  if (mevcutVar && !confirm('Bu kayıtta zaten belge var.\n\nYenisini eklersen eskisi kayıtla ilişkisiz kalır.\n\nDevam edilsin mi?')) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,application/pdf,.pdf';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    mesaj(msgId, 'ok', 'Belge yükleniyor...');
    try{
      const yol = await dosyaYukle(f, klasor);
      let ek = {};
      if (mevcutVar){
        const { data: eski } = await sb.from(tablo).select('aciklama,foto_path').eq('id', id).maybeSingle();
        if (eski && eski.foto_path)
          ek.aciklama = ((eski.aciklama||'') + ' [belge degistirildi ' + bugun()
                        + ', eski dosya: ' + eski.foto_path + ']').slice(0,500);
      }
      const { error } = await sb.from(tablo).update({ foto_path: yol, ...ek }).eq('id', id);
      if (error){ hataYaz(msgId, 'Belge kayda bağlanamadı.', error); return; }

}

async function baslat(){

  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ document.getElementById('girisEkran').classList.remove('gizli'); return; }
  const { data:p, error } = await sb.from('profil').select('*').eq('id', session.user.id).single();
  if (error || !p){
    document.getElementById('girisEkran').classList.remove('gizli');
    mesaj('girisHata','hata','Profil okunamadı: ' + hataTr(error && error.message)); return;
  }
  /* OWNER KAPISI — IKINCI katman. Asil koruma RLS: bu tablolarin TEK
     politikasi auth_rol()='owner'. Buradaki kontrol ekrani bosuna
     acmamak icin; tek basina guvenlik saymaz. */
  if (!p.aktif || p.rol !== 'owner'){
    PROFIL = p;
    document.getElementById('redEkran').classList.remove('gizli');
    document.getElementById('redMetin').textContent =
      'Bu ekran işletme sahibine özeldir. Senin rolün: ' + (p.rol || 'tanımsız') + '.';
    return;
  }
  PROFIL = p;
  /* Alt çubuk uygulamanın çubuğu: yetkiler index.html ile AYNI kaynaktan
     (rol_yetki) okunur ki sekmeler iki sayfada aynı çıksın. */
  const { data: y } = await sb.from('rol_yetki').select('ekran,gorebilir').eq('rol', p.rol);
  YETKILER = {};
  (y || []).forEach(x => YETKILER[x.ekran] = { gorebilir: x.gorebilir });
  if (p.rol === 'owner') SEKMELER_TUM.forEach(t => YETKILER[t.id] = { gorebilir: true });
  document.getElementById('girisEkran').classList.add('gizli');
  document.getElementById('uygulama').classList.remove('gizli');
  document.getElementById('kimBilgi').textContent = (p.ad || '') + ' · Borç';
  uygulamaCubuguKur();
  /* D3 · Hash ile bölüm açma — index.html'deki kalıbın AYNISI (bkz. baslat()).
     index.html'den gelen "Takvim" bağlantısı borc.html#takvim'e gidiyordu ama
     burada hash HİÇ OKUNMUYORDU; doğru yere gitmesinin tek sebebi Takvim'in
     varsayılan olmasıydı. Varsayılan değişse bağlantı SESSİZCE başka yere
     giderdi. ⚠ Hash KULLANICI GİRDİSİDİR: yalnız bilinen beş bölüm kabul
     edilir, başkası sessizce varsayılana düşer. Bilinen bölümler ELLE
     listelenmiyor, bölüm şeridinin KENDİSİNDEN okunuyor — iki liste tutmak
     iki listenin ayrışması demek. */
  const BOLUMLER = [...document.querySelectorAll('#bolumSerit button[data-b]')].map(b => b.dataset.b);
  const istenen = decodeURIComponent((location.hash || '').slice(1));
  await ekranAc(BOLUMLER.includes(istenen) ? istenen : EKRAN);
}
async function surumKontrol(){
  try{
    const y = await fetch(location.pathname+'?s='+Date.now(), {cache:'no-store', headers:{'Range':'bytes=0-3000'}});
    if (!y.ok && y.status !== 206) return;
    const m = (await y.text()).match(/name="surum"\s+content="([^"]+)"/);
    if (m && m[1] !== SURUM && !document.getElementById('surumBar')){
      const d = el('div'); d.id = 'surumBar';
      d.appendChild(el('span', null, 'Yeni sürüm var (' + m[1] + '). Eski sürümde yanlış kayıt yapabilirsin.'));
      const b = el('button', null, 'YENİLE');
      b.onclick = () => location.replace(location.pathname + '?v=' + Date.now());
      d.appendChild(b); document.body.appendChild(d);
    }
  }catch(e){ /* ag yoksa sessiz */ }
}

/* v92 · Taksit durumu artik ODEMELERDEN turetiliyor (v_kredi_taksit_durum).
   `odendi` bool KAYNAK DEGIL — ekran ona BAKMIYOR. Kismi odeme burada

/* KART — kalan ve devir tutarsizligi GORUNUMDEN gelir, burada

async function kartGetir(){

/* Her kartin EN SON donemi — kalan bundan okunur. */
function kartSonDonemler(donemler){
  const m = new Map();
  for (const x of donemler){
    const v = m.get(x.kart_id);
    if (!v || x.donem > v.donem) m.set(x.kart_id, x);
  }
  return m;
}

async function madenGetir(){
  const [m,f] = await Promise.all([
    sb.from('maden').select('id,tur,gram,kime,tarih,alis_tutar,aciklama').eq('is_deleted',false).order('tarih',{ascending:false}),
    sb.from('maden_fiyat').select('id,tur,gram_fiyat,tarih,kaynak_notu').eq('is_deleted',false).order('tarih',{ascending:false})]);
  if (m.error) throw m.error; if (f.error) throw f.error;
  return { kayitlar:m.data||[], fiyatlar:f.data||[] };
}

/* ---------- hesaplar (KURUS tam sayi) ---------- */
const turAdi   = t => t==='ticari' ? 'Ticari (şahıs şirketi)' : t==='sahis' ? 'Şahsi (kişisel)' : t==='ltd' ? 'Limited şirket' : t;
const turKisa  = t => t==='ticari' ? 'TİCARİ' : t==='sahis' ? 'ŞAHSİ' : 'LİMİTED';
const turSinif = t => 'rozet ' + (t==='ticari' ? 'rz-ticari' : t==='sahis' ? 'rz-sahis' : 'rz-ltd');

/* v92 · KALAN artik `kalan` kolonundan; kismi odenmis taksit de sayilir.
   Dekont eksigi ODEME BAZINDA (dekontsuz_odeme), taksit bazinda degil. */
function krediOzet(taksitler){
  let kalanKurus=0, kalanAdet=0, sonrakiVade=null, gecmis=0, dekontEksik=0, kismi=0;
  const b = bugun();
  for (const t of taksitler){
    dekontEksik += Number(t.dekontsuz_odeme) || 0;
    if (t.durum === 'kapali') continue;
    kalanKurus += kr(t.kalan); kalanAdet++;
    if (t.durum === 'kismi') kismi++;
    if (t.vade_tarihi < b) gecmis++;
    if (!sonrakiVade || t.vade_tarihi < sonrakiVade) sonrakiVade = t.vade_tarihi;
  }
  return { kalanKurus, kalanAdet, sonrakiVade, gecmis, dekontEksik, kismi };
}
/* Verilen tarihte GECERLI fiyat: o tarihten SONRAKI fiyatlar sayilmaz. */
function fiyatAsOf(fiyatlar, tur, tarih){
  const uygun = fiyatlar.filter(x => x.tur === tur && x.tarih <= tarih);
  if (!uygun.length) return null;
  return uygun.reduce((a,x) => (x.tarih > a.tarih ? x : a), uygun[0]);
}
const sonFiyat = (fiyatlar, tur) => fiyatAsOf(fiyatlar, tur, '9999-12-31');

/* Bir maden satirinin alis / bugun / fark degeri.

   ALIS DEGERI ONCELIK SIRASI:
     1. maden.alis_tutar dolu  -> OLGU. Gercekten odenen toplam budur.
     2. yoksa alis tarihindeki maden_fiyat'tan hesapla -> TAHMIN.
        Kullanicinin odedigi fiyat o gunku piyasa fiyati olmak zorunda
        DEGIL; bu yuzden ekranda "tahmini" diye ISARETLENIR.
     3. ikisi de yoksa -> BILINMIYOR. 0 gosterilmez, uydurulmaz.

   `kaynak` alani ekranin hangi durumu gosterecegini soyler. */
function madenDeger(m, fiyatlar){
  const bugunF = sonFiyat(fiyatlar, m.tur);
  const gram   = Number(m.gram) || 0;

  let alisKurus = null, kaynak = 'yok', alisF = null;
  if (m.alis_tutar !== null && m.alis_tutar !== undefined && Number(m.alis_tutar) > 0){
    alisKurus = kr(m.alis_tutar);
    kaynak = 'olgu';
  } else {
    alisF = fiyatAsOf(fiyatlar, m.tur, m.tarih);
    if (alisF){ alisKurus = Math.round(gram * kr(alisF.gram_fiyat)); kaynak = 'tahmin'; }
  }
  return {
    gram, kaynak, alisKurus, alisF, bugunF,
    bugunKurus: bugunF ? Math.round(gram * kr(bugunF.gram_fiyat)) : null
  };
}

/* ================== UST OZET BANDI (her ekranda) ================== */
async function bantVerisi(){
  const [krediler, taksitler, sahis, maden, kart] = await Promise.all([
    krediGetir(), taksitGetir(null), sahisGetir(), madenGetir(), kartGetir()]);

  /* KART KALANI — her kartin EN SON donemindeki kalan.
     Donemi hic girilmemis kart 0 SAYILMAZ; kac tane oldugu yazilir. */
  const sonDonem = kartSonDonemler(kart.donemler);
  let kartKalan = 0, kartDonemsiz = 0, kartDonemleri = new Set(), kartTutarsiz = 0;
  /* Kart da sahibine gore dogru bloga girer — kart.sahip zaten var (v91).
     Bugun 0 kart var; kart eklenince ayrim kendiliginden isler. */
  let kartSahis = 0, kartLtd = 0;
  for (const k of kart.kartlar){
    const d = sonDonem.get(k.id);
    if (!d){ kartDonemsiz++; continue; }
    kartKalan += kr(d.kalan);
    if (k.sahip === 'ltd') kartLtd += kr(d.kalan); else kartSahis += kr(d.kalan);
    kartDonemleri.add(d.donem);
    if (d.devir_tutarsiz) kartTutarsiz++;
  }

  const ko = krediOzet(taksitler);
  const buAy = bugun().slice(0,7);

  /* ===== BORÇ SINIFLARI — tek "toplam borç" YANLIŞTI =====
     Eski bant kredi taksitlerinin NOMİNAL toplamını (anapara + gelecek
     faiz), madenin RAYİÇ değerini, şahıs anaparasını ve kart kalanını
     TEK sayıda topluyordu. Bu sayı hiçbir karara yaramıyor:
       · "bugün kapatsam ne öderim" -> anapara
       · faiz ve masraf ancak ZAMAN GEÇERSE doğar, bugün ödenmez
       · maden sabit borç değil, piyasayla oynayan yükümlülük
     Artık üçü AYRI. Hesap mantığı değişmedi, gruplama değişti. */
  /* ⚠ 2b DÜZELTMESİ — LTD ANAPARASI İKİ KEZ SAYILIYORDU.
     İlk sürüm "ANAPARA" satırında TÜM anaparayı topluyor, altında Ltd'yi
     AYRICA gösteriyordu; Ltd'nin anaparası iki yerde birden görünüyordu —
     düzeltmeye çalıştığımız hata sınıfının ta kendisi.
     Artık İKİ BLOK: şahıs şirketinin borcu ile Ltd'nin borcu KARIŞMAZ.
     Hiçbir Ltd rakamı şahıs bloğunda görünmez, tersi de. */
  const krediTur = new Map(krediler.map(k => [k.id, k.tur]));
  const S = { anapara:0, faizMasraf:0, kirilimsiz:0, kirilimsizAdet:0, nominal:0, buAy:0, buAyOdenen:0 };
  const L = { anapara:0, faizMasraf:0, kirilimsiz:0, kirilimsizAdet:0, nominal:0, buAy:0, buAyOdenen:0 };
  const buAyD = bugun().slice(0,7);
  for (const t of taksitler){
    const g = krediTur.get(t.kredi_id) === 'ltd' ? L : S;
    if (t.vade_tarihi.slice(0,7) === buAyD){
      g.buAy += kr(t.toplam_tutar);
      if (t.odendi) g.buAyOdenen += kr(t.toplam_tutar);
    }
    if (t.durum === 'kapali') continue;            // kalan borç: kapanmamislar
    g.nominal += kr(t.kalan);
    if (t.anapara_tutar === null || t.anapara_tutar === undefined){
      /* KIRILIMI BİLİNMEYEN: anaparaya KATILMAZ, uydurulmaz. Kendi
         bloğunda parantez notu olarak duruyor (bugün tamamı Ltd). */
      g.kirilimsiz += kr(t.kalan); g.kirilimsizAdet++;
      continue;
    }
    /* v92 · KISMI ODEME: kalan anapara = anapara − odenmis anapara.
       Odemede ayrim girilmemisse (anapara_odenen 0) parcalar `kalan`i
       asar ve IC TUTARLILIK NOBETCISI bagirir — sessiz kalmaz. */
    g.anapara    += kr(t.anapara_tutar) - kr(t.anapara_odenen || 0);
    g.faizMasraf += kr(t.faiz_tutar) + kr(t.vergi_masraf_tutar || 0) - kr(t.faiz_odenen || 0);
  }
  let buAyKurus = 0, buAyOdenen = 0;
  for (const t of taksitler){
    if (t.vade_tarihi.slice(0,7) !== buAy) continue;
    buAyKurus += kr(t.toplam_tutar);
    if (t.odendi) buAyOdenen += kr(t.toplam_tutar);
  }

  const odemeToplam = new Map();
  for (const o of sahis.odemeler) odemeToplam.set(o.borc_id, (odemeToplam.get(o.borc_id)||0) + kr(o.tutar));
  let sahisKalan = 0;
  for (const b of sahis.borclar) sahisKalan += Math.max(0, kr(b.tutar) - (odemeToplam.get(b.id)||0));

  /* ⚠ KUR FARKI yalniz IKISI DE bilinen kayitlardan hesaplanir.
     Ilk yazimda toplam bugunku degerden toplam alis degeri cikariliyordu;
     alis fiyati bilinmeyen bir kayit farki SISIRIYORDU (bugunku degeri
     sayiliyor, alisi sayilmiyordu). Ust banttaki en onemli rakam bu —
     sisirilmis hali yanlis karar verdirirdi. */
  let madenBugun = 0;                       // TOPLAM BORC icin: fiyati olan her kayit
  let esAlis = 0, esBugun = 0, hesaplanan = 0;   // FARK icin: yalniz eslesenler
  let fiyatiYok = [], alisiYok = 0, tahminSayisi = 0;
  for (const m of maden.kayitlar){
    const d = madenDeger(m, maden.fiyatlar);
    if (d.bugunKurus === null){
      const ad = m.tur === 'altin' ? 'altın' : 'gümüş';
      if (!fiyatiYok.includes(ad)) fiyatiYok.push(ad);
      continue;
    }
    madenBugun += d.bugunKurus;
    if (d.alisKurus === null){ alisiYok++; continue; }
    /* OLGU ve TAHMIN farkin icine birlikte girer (brief: 1. ve 2. gruptan),
       ama kac tanesinin tahmin oldugu YAZILIR — rakam tahmin tasiyorsa
       kullanici bunu bilmeli. */
    if (d.kaynak === 'tahmin') tahminSayisi++;
    esAlis  += d.alisKurus;
    esBugun += d.bugunKurus;
    hesaplanan++;
  }
  const madenAlis  = esAlis;
  const farkKurus  = (hesaplanan > 0) ? (esBugun - esAlis) : null;
  const farkBugun  = esBugun;

  /* ŞAHIS BLOĞU · "bugün kapatsam ne öderim"
     kredi anaparası + kişilere olan şahıs borcu + şahıs kartı.
     Maden ve şahıs borcu SAHİBİN kendi yükümlülüğü — Ltd'nin değil. */
  const sAnapara = S.anapara + sahisKalan + kartSahis;
  /* LTD BLOĞU · ayrı tüzel kişilik. Nominal gösteriliyor çünkü bu
     kredilerin büyük kısmında anapara/faiz kırılımı YOK; anapara diye
     eksik bir rakam yazmak yanıltırdı. */
  const lNominal = L.nominal + kartLtd;

  const krediParcaToplam = S.nominal + L.nominal;
  /* ⚠ İÇ TUTARLILIK — ÖNCEKİ HÂLİ TOTOLOJİKTİ.
     "şahıs nominal + ltd nominal = kredi nominal" diye bakıyordu; üçü de
     AYNI taksit listesinden toplandığı için fark her zaman sıfırdı ve
     negatif kontrolde ATEŞLEMEDİ. Ateşlemeyen nöbetçi, nöbetçi değildir.

     Anlamlı kontrol: her blokta KIRILIM toplamı NOMİNALE eşit mi.
     anapara + faiz/masraf + kırılımsız  =  toplam_tutar toplamı
     Bunlar FARKLI kolonlardan geliyor; biri bozuksa fark açılır. */
  const sapma = (g) => (g.anapara + g.faizMasraf + g.kirilimsiz) - g.nominal;
  const sSapma = sapma(S), lSapma = sapma(L);
  const parcaSapmasi = sSapma !== 0 ? sSapma : lSapma;

  return { krediler, taksitler, ko, buAyKurus, buAyOdenen, sahisKalan,
           madenBugun, madenAlis, farkBugun, farkKurus, fiyatiYok, alisiYok,
           hesaplanan, tahminSayisi, maden, sahis,
           kart, sonDonem, kartKalan, kartSahis, kartLtd, kartDonemsiz, kartTutarsiz,
           kartDonemleri: [...kartDonemleri].sort(),
           S, L, sAnapara, lNominal, krediParcaToplam, parcaSapmasi, sSapma, lSapma };
}

/* ===== BORC DAGILIMI SERIDI (D1) =====
   SORU: "bugun kapatsam ne oderim, hangi sinif ne kadar".
   SERITTE OLMAYANLAR ve NEDENI:
     · GELECEK FAIZ — bugun odenmez, zaman gecerse dogar. Bu soruya
       girmez. Baslik bunu soyluyor.
     · LTD — ayri tuzel kisilik, sahis sirketinin borcu degil.
       Seridin ALTINDA ayri satirda duruyor, oranlamaya KATILMIYOR.
   MADEN rayic: piyasa degeri, sabit borc DEGIL — hem segmentin
   uzerinde hem efsanede "rayic" yaziyor. Pozitif fark kirmizi degil. */
function seritCiz(v){
  const kutu = el('div');
  const sinif = [
    { k:'kredi', ad:'Kredi',  ton:'sg-kredi', ov:'var(--ana)', tutar: v.S.anapara },
    { k:'sahis', ad:'Şahıs',  ton:'sg-sahis', ov:'var(--ok)',  tutar: v.sahisKalan },
    { k:'maden', ad:'Maden',  ton:'sg-maden', ov:'#C8952B',    tutar: v.madenBugun, rayic:true },
    { k:'kart',  ad:'Kart',   ton:'sg-kart',  ov:'#6B4E9E',    tutar: v.kartSahis }
  ];
  const toplam = sinif.reduce((a,x) => a + x.tutar, 0);
  if (toplam <= 0) return null;
  /* 0 olan sinif CIZILMEZ — sifir genislikte segment tiklanamaz ve
     efsanede "%0" gurultu yapar. Yoklugu asagida NOTLA soyleniyor. */
  const cizilen = sinif.filter(x => x.tutar > 0);
  const yuzde = x => (x.tutar / toplam) * 100;

  /* ⚠ BASLIK AYRI SATIR DEGIL, efsanenin basinda. Ayri satir 14px
     yiyordu ve bant+serit %30 sinirini asiyordu (olculdu: 97px blok).
     Bilgi ayni yerde duruyor, satir sayisi bir eksik. */
  const serit = el('div','serit');
  serit.setAttribute('role','group');
  serit.setAttribute('aria-label','Borç dağılımı');
  const lej = el('div','serit-lej');

  /* Secim KALICI SATIR — tooltip degil. Secilen sinif efsanede buyuyup
     TUTARINI aciyor; secim yokken hepsi ad + yuzde. */
  let secili = null;
  const lejCiz = () => {
    lej.textContent = '';
    /* ⚠ Metinler 375px'te TEK SATIR kalacak sekilde OLCULEREK secildi.
       "bugün kapatsam · faiz hariç" iki satira sariyordu (31px); soru
       burada, kapsam dipte. Ikisi birden 50px yerine 65px ediyordu. */
    lej.appendChild(el('span','bs','bugün kapatsam'));
    for (const x of cizilen){
      const p = el('span', 'pr' + (secili === x.k ? ' sec' : ''));
      const ov = el('span','ov'); ov.style.background = x.ov;
      p.appendChild(ov);
      /* "rayic" normalde segmentin UZERINDE yaziyor; efsanede tekrar
         etmek satiri sardiriyordu. AMA segment %15'in altina duserse ic
         etiket cizilmiyor — o zaman "rayic" efsaneye TASINIR, hicbir
         durumda kaybolmaz. */
      p.appendChild(document.createTextNode(
        x.ad + (x.rayic && yuzde(x) < 15 ? ' (rayiç)' : '') + ' '));
      if (secili === x.k){
        p.appendChild(el('b', null, tlk(x.tutar)));
        p.appendChild(document.createTextNode(' · %' + yuzde(x).toFixed(1)
                       + (x.rayic ? ' · rayiç' : '')));
      } else {
        p.appendChild(document.createTextNode('%' + Math.round(yuzde(x))));
      }
      lej.appendChild(p);
    }
  };

  for (const x of cizilen){
    const sg = el('button', 'sg ' + x.ton);
    sg.type = 'button';
    /* ⚠ Cok kucuk pay (%2 alti) flex ile 1-2 piksele duser: gorunmez ve
       tiklanamaz olur. Taban genislik veriliyor; oran YAZIYLA dogru. */
    sg.style.flex = Math.max(yuzde(x), 2) + ' 1 0';
    sg.setAttribute('aria-pressed','false');
    sg.setAttribute('aria-label', x.ad + (x.rayic ? ' rayiç' : '') + ' ' + tlk(x.tutar)
                    + ', yüzde ' + yuzde(x).toFixed(1));
    /* ⚠ ETIKET SEGMENTIN ICINE ANCAK SIGIYORSA. Esik ORANDAN hesaplaniyor,
       DOM olcumunden DEGIL: olcum requestAnimationFrame gerektiriyor, o da
       sekme gorunur degilse HIC CALISMIYOR (olculdu) — etiket yarim kalirdi.
       320px'te serit ~294px; %15 ~44px, "Şahıs"/"rayiç" 11px'te ~33-35px.
       Sigmayan sinifin adi efsanede ZATEN var; hicbir sinif adsiz kalmiyor. */
    if (yuzde(x) >= 15) sg.appendChild(el('span','ic', x.rayic ? 'rayiç' : x.ad));
    sg.onclick = () => {
      secili = (secili === x.k) ? null : x.k;
      for (const d of serit.children) d.setAttribute('aria-pressed', 'false');
      if (secili) sg.setAttribute('aria-pressed','true');
      lejCiz();
    };
    serit.appendChild(sg);
  }
  kutu.appendChild(serit);
  lejCiz();
  kutu.appendChild(lej);


  /* Ltd oranlamaya girmiyor ama GORUNMEZ de olmuyor; kart 0 ile
     "girilmedi" AYNI GORUNMEMELI — hangisi oldugu yaziliyor. */
  const dip = el('div','serit-dip');
  /* ⚠ D3 · Ltd RAKAMI BURADAN KALDIRILDI — MÜKERRERDİ. Bant zaten bir üst
     satırda "LTD <tutar> · bu ay ..." gösteriyor. Aynı rakamı iki kez yazmak
     yer yiyor; ikisi bir gün ayrışırsa hangisinin doğru olduğu belli olmaz.
     Ltd'nin ŞERİDE GİRMEME kuralı AYNEN duruyor — `sinif` dizisinde Ltd yok,
     oranlamaya katılmıyor; bu satır artık onu SÖYLÜYOR, tekrar etmiyor.
     "gelecek faiz hariç" 11px'te iki satıra sarıyordu; "faiz hariç" yeter. */
  dip.appendChild(document.createTextNode('faiz hariç · Ltd hariç'));
  if (!v.kartSahis){
    /* "0" ile "girilmedi" AYNI GORUNMEZ — hangisi oldugu yaziliyor. */
    const kartNot = (v.kart.kartlar.length && v.kartDonemsiz < v.kart.kartlar.length)
      ? 'kart: kalan 0' : 'kart: veri girilmedi';
    dip.appendChild(document.createTextNode(' · ' + kartNot));
  }
  if (dip.childNodes.length) kutu.appendChild(dip);
  return kutu;
}

function bantCiz(v){
  const b = el('div','bant');
  /* parcalar: [metin, {v:deger, s:sinif}, metin, ...] — akan satir */
  const satir = (...parcalar) => {
    const s = el('div','sr');
    for (const p of parcalar){
      if (p === null || p === undefined) continue;
      if (typeof p === 'string') s.appendChild(document.createTextNode(p));
      else s.appendChild(el(p.s ? 'span' : 'b', p.s || null, p.v));
    }
    b.appendChild(s);
  };

  /* ===== BLOK 1 · SENİN BORCUN (şahıs şirketi) =====
     Hiçbir Ltd rakamı buraya girmez, tersi de. */
  b.appendChild(el('div','blok-et','ŞAHIS ŞİRKETİ · senin borcun'));
  const bas = el('div','bas');
  bas.appendChild(el('span','et','Anapara bugün'));
  bas.appendChild(el('span','dg', tlk(v.sAnapara)));
  b.appendChild(bas);

  /* Satir ici rakamlarda " TL" eki YOK — bant 375px'te satir kazaniyor.
     Birim baslikta ve dipnotta duruyor, hepsi TL. */
  const parcalar = ['kredi ' + tk(v.S.anapara)];
  if (v.sahisKalan) parcalar.push('şahıs ' + tk(v.sahisKalan));
  if (v.kartSahis)  parcalar.push('kart ' + tk(v.kartSahis));
  b.appendChild(el('div','kirilim', parcalar.join(' · ')));

  /* Faiz bugun odenmez, zaman gecerse dogar. Sahis tarafinda kirilimsiz
     taksit BUGUN YOK; cikarsa sessiz kalmayalim diye kosula bagli. */
  /* Faiz ve "bu ay" TEK SATIRDA — iki blok bandı büyütmesin.
     "Bu ay" etiketi kapsamını söylüyor: KREDİ taksiti. */
  satir('Gelecek faiz+masraf ', { v: tk(v.S.faizMasraf) },
    v.S.kirilimsizAdet ? ' · kırılımsız (' + v.S.kirilimsizAdet + ') ' : null,
    v.S.kirilimsizAdet ? { v: tk(v.S.kirilimsiz) } : null,
    ' · bu ay kredi taksiti ', { v: tk(v.S.buAy - v.S.buAyOdenen) },
    v.S.buAyOdenen ? ' (' + tk(v.S.buAyOdenen) + ' ödendi)' : null,
    v.kartSahis ? ' · kart (ayrı) ' : null,
    v.kartSahis ? { v: tk(v.kartSahis) } : null,
    v.ko.dekontEksik ? ' · dekont eksik ' : null,
    v.ko.dekontEksik ? { v: String(v.ko.dekontEksik), s: 'eksik' } : null);

  /* Maden ve kisilere olan sahis borcu SAHIBIN yukumlulugu — Ltd'nin degil. */
  if (v.maden.kayitlar.length){
    satir('Maden rayiç ',
      { v: v.madenBugun ? tk(v.madenBugun) : 'hesaplanamaz' },
      v.fiyatiYok.length ? ' (' + v.fiyatiYok.join(', ') + ' hariç)' : null,
      ' · kur farkı ',
      { v: v.farkKurus === null ? 'hesaplanamaz'
           : (v.farkKurus >= 0 ? '+' : '−') + tk(Math.abs(v.farkKurus)), s: 'fark' });
  }

  /* ===== BLOK 2 · LİMİTED =====
     Ayri tuzel kisilik: sahibin gider/kar hesabina GIRMEZ. Nominal
     gosteriliyor cunku bu kredilerin buyuk kisminda anapara/faiz kirilimi
     YOK — "anapara" diye eksik bir rakam yazmak yaniltirdi. */
  if (v.L.nominal || v.kartLtd){
    const s = el('div','sr ltd');
    s.appendChild(el('span','rozet rz-ltd','LTD'));
    s.appendChild(document.createTextNode(' '));
    s.appendChild(el('b', null, tk(v.lNominal)));
    s.appendChild(document.createTextNode(' · bu ay '));
    s.appendChild(el('b', null, tk(v.L.buAy - v.L.buAyOdenen)));
    /* "ayri tuzel, gidere girmez" aciklamasi Krediler ekraninda ZATEN var
       ("Limited sirket — bu kredinin hicbir kalemi gidere yazilmaz");
       bantta rozet + ayirici cizgi ayrimi zaten soyluyor. */
    if (v.L.kirilimsizAdet)
      s.appendChild(document.createTextNode(' · kırılımsız ' + tk(v.L.kirilimsiz)));
    b.appendChild(s);
  }

  const dip = el('div','dip');
  dip.appendChild(document.createTextNode('Taksit nominali '));
  dip.appendChild(el('b', null, tlk(v.krediParcaToplam)));
  dip.appendChild(document.createTextNode(' (şahıs+Ltd)'
    + (v.kartDonemsiz ? ' · ' + v.kartDonemsiz + ' kartın dönemi yok' : '')));
  b.appendChild(dip);

  /* Ic tutarlilik: her blokta kirilim toplami nominale ESIT olmali */
  const bozuk = [];
  if (v.sSapma !== 0) bozuk.push('şahıs: kırılım ' + tlk(v.S.anapara + v.S.faizMasraf + v.S.kirilimsiz)
    + ' ≠ nominal ' + tlk(v.S.nominal) + ' (fark ' + tlk(Math.abs(v.sSapma)) + ')');
  if (v.lSapma !== 0) bozuk.push('Ltd: kırılım ' + tlk(v.L.anapara + v.L.faizMasraf + v.L.kirilimsiz)
    + ' ≠ nominal ' + tlk(v.L.nominal) + ' (fark ' + tlk(Math.abs(v.lSapma)) + ')');
  if (bozuk.length)
    b.appendChild(el('div','uyari-agir', 'Kırılım toplamı tutmuyor — ' + bozuk.join(' · ')));

  /* Serit EN ALTTA: once rakamlar, sonra dagilim. Dagilimi once koymak
     "toplam borc" izlenimi verirdi — 2b turunda kaldirdigimiz sey. */
  const serit = seritCiz(v);
  if (serit) b.appendChild(serit);
  return b;
}

/* ================== 1 · TAKVIM (varsayilan) ================== */
/* D5 · Ay gorunumu. 84 satirlik yigin yerine gunler; detay dokununca acilir. */
let TAKVIM_AY = null, TAKVIM_GUN = null, TAKVIM_LISTE = false;
/* Ay adlari icin MEVCUT `AYLAR` kullaniliyor — ikinci liste tutmak
   iki listenin ayrismasi demek (D3'te ayni karar verildi). */
const GUN_ADLARI = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
async function vTakvim(){
  const c = document.getElementById('icerik');
  const v = await bantVerisi();
  const krediMap = new Map(v.krediler.map(k => [k.id, k]));

  c.textContent = '';
  c.appendChild(bantCiz(v));
  const msg = el('div','msg'); msg.id = 'takvimMsg'; c.appendChild(msg);

  if (v.ko.gecmis > 0)
    c.appendChild(el('div','uyari-agir','Vadesi geçmiş ve ödenmemiş ' + v.ko.gecmis + ' taksit var.'));

  if (!v.taksitler.length){
    const k = el('div','kart');
    k.appendChild(el('div','kbaslik','Takvim'));
    k.appendChild(el('div','bos','Henüz taksit yok. Krediler sekmesinden kredi ekleyip taksit üret.'));
    c.appendChild(k); return;
  }

  const b = bugun(), buAy = b.slice(0,7);
  /* Yeni sorgu YOK — zaten cekilmis taksitler gune gore gruplaniyor. */
  const gunMap = new Map();
  for (const t of v.taksitler){
    if (!gunMap.has(t.vade_tarihi)) gunMap.set(t.vade_tarihi, []);
    gunMap.get(t.vade_tarihi).push(t);
  }
  const aylar = [...new Set(v.taksitler.map(t => t.vade_tarihi.slice(0,7)))].sort();
  if (!TAKVIM_AY || !aylar.includes(TAKVIM_AY))
    TAKVIM_AY = aylar.includes(buAy) ? buAy : aylar[0];

  const kap = el('div','kart'); c.appendChild(kap);
  const ctx = { kap, gunMap, aylar, krediMap, b, buAy, taksitler: v.taksitler };
  takvimYenile(ctx);
}

/* Ay izgarasi + gun paneli. Ay/gun degisince yalniz bu kap yeniden cizilir. */
function takvimYenile(ctx){
  const { kap, gunMap, aylar, krediMap, b, buAy } = ctx;
  kap.textContent = '';
  const ay = TAKVIM_AY, [yil, aySira] = ay.split('-').map(Number);
  const i = aylar.indexOf(ay);

  /* --- baslik: ‹ Ay Yil › + o ayin ozeti --- */
  const bas = el('div','tkv-bas');
  const ok = (yon, etiket, hedef) => {
    const d = el('button', null, etiket);
    d.type = 'button'; d.setAttribute('aria-label', yon);
    if (hedef === undefined) d.disabled = true;
    else d.onclick = () => { TAKVIM_AY = hedef; TAKVIM_GUN = null; takvimYenile(ctx); };
    return d;
  };
  bas.appendChild(ok('Önceki ay','‹', aylar[i-1]));
  const ort = el('div','ort');
  ort.appendChild(el('div','ay', ayAdi(ay) + (ay === buAy ? ' · bu ay' : '')));
  const ayT = [...gunMap.entries()].filter(([g]) => g.slice(0,7) === ay).flatMap(([,l]) => l);
  ort.appendChild(el('div','oz', ayT.length
    /* ⚠ D6 · NOMINAL degil KALAN. Kismi odenmis taksitte "bu ay ne kadar
       odeyecegim" sorusunun cevabi nominal degil kalandir. */
    ? ayT.length + ' ödeme · ' + tlk(ayT.reduce((s,t) => s + kr(t.kalan), 0)) + ' kalan'
    : 'ödeme yok'));
  bas.appendChild(ort);
  bas.appendChild(ok('Sonraki ay','›', aylar[i+1]));
  kap.appendChild(bas);

  /* --- hafta basliklari + gun izgarasi --- */
  const hf = el('div','tkv-hafta');
  for (const g of ['Pt','Sa','Ça','Pe','Cu','Ct','Pz']) hf.appendChild(el('div', null, g));
  kap.appendChild(hf);

  const izg = el('div','tkv-izgara');
  const ilk = new Date(yil, aySira - 1, 1);
  const bosluk = (ilk.getDay() + 6) % 7;                 // Pazartesi = 0
  const gunSayisi = new Date(yil, aySira, 0).getDate();
  for (let n = 0; n < bosluk; n++){
    const h = el('div','tkv-g bos'); h.setAttribute('aria-hidden','true'); izg.appendChild(h);
  }
  for (let g = 1; g <= gunSayisi; g++){
    const tar = ay + '-' + String(g).padStart(2,'0');
    const liste = gunMap.get(tar) || [];
    const h = el('button','tkv-g' + (tar === b ? ' bugun' : '')); h.type = 'button';
    /* ⚠ ISARET TEK, panel hepsini listeler. Oncelik: gecikmis > Ltd >
       bekleyen > odendi — en aciliyeti olan gorunur. */
    const acik = liste.filter(t => t.durum !== 'kapali');
    const im = !liste.length ? null
      : acik.some(t => t.vade_tarihi < b)      ? 'gecikmis'
      : acik.some(t => t.kredi_tur === 'ltd')  ? 'ltd'
      : acik.length                            ? 'bekliyor' : 'odendi';
    if (im === 'gecikmis') h.classList.add('gecikmis');
    h.appendChild(el('span','sy', String(g)));
    if (im) h.appendChild(el('span','im im-' + im));
    h.setAttribute('aria-pressed', String(tar === TAKVIM_GUN));
    h.setAttribute('aria-label', g + ' ' + ayAdi(ay) + (liste.length
      ? ' · ' + liste.length + ' ödeme · ' + tlk(liste.reduce((s,t)=>s+kr(t.kalan),0)) + ' kalan'
      : ' · ödeme yok'));
    h.onclick = () => { TAKVIM_GUN = (TAKVIM_GUN === tar) ? null : tar; takvimYenile(ctx); };
    izg.appendChild(h);
  }
  kap.appendChild(izg);

  /* --- gun paneli: izgaranin ALTINDA, modal DEGIL --- */
  if (TAKVIM_GUN){
    const p = el('div','tkv-panel');
    const d = new Date(TAKVIM_GUN + 'T00:00');
    p.appendChild(el('div','pb', d.getDate() + ' ' + AYLAR[d.getMonth()] + ', ' + GUN_ADLARI[d.getDay()]));
    p.appendChild(el('div','pu', TAKVIM_GUN === b ? 'bugün'
      : TAKVIM_GUN < b ? gunFarki(b, TAKVIM_GUN) + ' gün geçti'
      : gunFarki(TAKVIM_GUN, b) + ' gün sonra'));
    const liste = gunMap.get(TAKVIM_GUN) || [];
    if (!liste.length) p.appendChild(el('div','bos','Bu gün ödeme yok.'));
    /* Gun paneli taksitKarti'yi YENIDEN KULLANIYOR: kirilim, "Ltd gidere
       yazilmaz", Odeme gir ve dekont dugmeleri orada ZATEN dogru. */
    else for (const t of liste)
      p.appendChild(taksitKarti(t, krediMap.get(t.kredi_id), b, buAy));
    kap.appendChild(p);
  }

  /* --- LISTE KAYBOLMASIN: ay gorunumu "ne kadar borcum kaldi"yi yanitlamaz --- */
  const alt = el('div','tkv-alt');
  const bt = el('button', null, TAKVIM_LISTE ? 'ay görünümüne dön' : 'tüm taksitler');
  bt.type = 'button';
  bt.onclick = () => { TAKVIM_LISTE = !TAKVIM_LISTE; takvimYenile(ctx); };
  alt.appendChild(bt);
  kap.appendChild(alt);
  if (TAKVIM_LISTE) kap.appendChild(tumTaksitlerCiz(ctx));
}

/* Tum kalan taksitler — 2 satirlik sade satir. Dokununca o gune gider. */
function tumTaksitlerCiz(ctx){
  const { taksitler, krediMap, b } = ctx;
  const kutu = el('div');
  const kalanlar = taksitler.filter(t => t.durum !== 'kapali')
    .sort((x,y) => x.vade_tarihi < y.vade_tarihi ? -1 : 1);
  kutu.appendChild(el('div','pu', kalanlar.length + ' ödenmemiş taksit · '
    + tlk(kalanlar.reduce((s,t) => s + kr(t.kalan), 0)) + ' kalan'));
  for (const t of kalanlar){
    const k = krediMap.get(t.kredi_id);
    const s = el('div','tt-sr');
    const sol = el('div','sol');
    sol.appendChild(el('div','s1', trGun(t.vade_tarihi) + ' · ' + (k ? k.banka : 'kredi yok')));
    sol.appendChild(el('div','s2', t.sira + '. taksit'
      + (k && k.tur === 'ltd' ? ' · Limited (gidere yazılmaz)' : '')
      + (t.vade_tarihi < b ? ' · VADESİ GEÇTİ' : '')));
    s.appendChild(sol);
    s.appendChild(el('div','sag', tl(t.kalan)));
    s.onclick = () => { TAKVIM_AY = t.vade_tarihi.slice(0,7); TAKVIM_GUN = t.vade_tarihi;
                        TAKVIM_LISTE = false; takvimYenile(ctx);
                        ctx.kap.scrollIntoView({behavior:'smooth', block:'start'}); };
    kutu.appendChild(s);
  }
  return kutu;
}

function taksitKarti(t, kredi, b, buAy){
  const gecikti = !t.odendi && t.vade_tarihi < b;
  const buAyMi  = !t.odendi && !gecikti && t.vade_tarihi.slice(0,7) === buAy;

  const k = el('div','tk' + (t.odendi ? ' odendi' : gecikti ? ' gecikti' : buAyMi ? ' buay' : ''));
  k.dataset.taksit = t.id;   // kaydetme sonrasi bu karti bulabilmek icin

  const ust = el('div','tk-ust');
  const ad = el('div','tk-ad');
  ad.appendChild(el('span', null, (kredi ? kredi.banka + ' · ' + kredi.ad : 'kredi bulunamadı')
                                  + '  ' + t.sira + '. taksit'));
  if (kredi){
    ad.appendChild(document.createTextNode(' '));
    ad.appendChild(el('span', turSinif(kredi.tur), turKisa(kredi.tur)));
  }
  ust.appendChild(ad);
  ust.appendChild(el('div','tk-tutar', tl(t.toplam_tutar)));
  k.appendChild(ust);

  /* kirilim — anapara / faiz / vergi-masraf */
  const orta = el('div','tk-orta');
  if (t.anapara_tutar === null && t.faiz_tutar === null){
    orta.appendChild(el('span','gri','kırılım girilmemiş (anapara / faiz / vergi-masraf)'));
  } else {
    orta.appendChild(el('span', null, 'anapara ' + tl(t.anapara_tutar)));
    orta.appendChild(document.createTextNode(' · '));
    /* LIMITED: faiz GRI ve "gidere yazilmaz" */
    const faizSpan = el('span', (kredi && kredi.tur === 'ltd') ? 'gri' : null, 'faiz ' + tl(t.faiz_tutar));
    orta.appendChild(faizSpan);
    if (t.vergi_masraf_tutar !== null && t.vergi_masraf_tutar !== undefined){
      orta.appendChild(document.createTextNode(' · '));
      orta.appendChild(el('span', (kredi && kredi.tur === 'ltd') ? 'gri' : null,
        'vergi/masraf ' + tl(t.vergi_masraf_tutar)));
    }
    if (t.vergi_masraf_notu){
      orta.appendChild(document.createElement('br'));
      orta.appendChild(el('span','gri', t.vergi_masraf_notu));   // textContent
    }
  }
  k.appendChild(orta);

  /* gidere yazilacak tutar — TUR'e gore */
  if (kredi){
    if (kredi.tur === 'ticari'){
      if (t.faiz_tutar === null){
        k.appendChild(el('div','tk-gider yok','gidere: kırılım girilmediği için hesaplanamaz'));
      } else {
        const giderKurus = kr(t.faiz_tutar) + kr(t.vergi_masraf_tutar || 0);
        k.appendChild(el('div','tk-gider','gidere: faiz + vergi/masraf = ' + tlk(giderKurus)));
      }
    } else {
      k.appendChild(el('div','tk-gider yok', turAdi(kredi.tur) + ' — gidere yazılmaz'));
    }
  }

  /* durum satiri */
  /* v92 · UC DURUM: acik · KISMI (odenen/kalan gorunur) · kapali */
  const d = el('div','tk-durum' + (t.durum === 'kapali' ? ' odendi'
              : gecikti ? ' gecikti' : buAyMi ? ' buay' : ''));
  if (t.durum === 'kapali'){
    d.textContent = 'ödendi · ' + trGun(t.son_odeme_tarihi);
  } else if (t.durum === 'kismi'){
    d.textContent = 'KISMİ ÖDENDİ · ödenen ' + tl(t.odenen) + ' · KALAN ' + tl(t.kalan)
      + ' · vade ' + trGun(t.vade_tarihi)
      + (gecikti ? ' (' + gunFarki(b, t.vade_tarihi) + ' gün geçti)' : '');
  } else if (gecikti){
    d.textContent = 'vade ' + trGun(t.vade_tarihi) + ' · ' + gunFarki(b, t.vade_tarihi) + ' gün geçti';
  } else {
    d.textContent = 'vade ' + trGun(t.vade_tarihi) + ' · ' + gunFarki(t.vade_tarihi, b) + ' gün kaldı';
  }
  k.appendChild(d);

  /* Dekont eksigi ODEME BAZINDA — odenmis olsa da TAKILI KALIR */
  if (t.dekontsuz_odeme > 0){
    const r = el('div'); r.style.marginTop = '6px';
    r.appendChild(el('span','rozet rz-eksik',
      t.dekontsuz_odeme === 1 ? 'DEKONT EKSİK' : t.dekontsuz_odeme + ' ÖDEMEDE DEKONT EKSİK'));
    k.appendChild(r);
  }

  const ey = el('div','tk-eylem');
  if (t.durum !== 'kapali'){
    /* "Odendi" ARTIK TEK DOKUNUSLA TAM ODEME YAZMIYOR: form aciliyor.
       prompt() de kullanilmiyor (v88/M mobil bulgusu). */
    const bt = el('button','btn2', t.durum === 'kismi' ? 'Ödeme ekle' : 'Ödeme gir');
    bt.onclick = () => odemeFormuAc(k, t);
    ey.appendChild(bt);
  }
  if (t.odeme_adet > 0){
    const bl = el('button','btn-mini', t.odeme_adet + ' ödeme');
    bl.onclick = () => odemeListesiAc(k, t);
    ey.appendChild(bl);
  }
  k.appendChild(ey);
  return k;
}

/* ---------- ODEME FORMU (prompt YOK) ---------- */
function odemeFormuAc(kart, t){
  if (kart.querySelector('.odeme-form')) return;          // zaten acik
  const f = el('div','odeme-form');
  const kalanKurus = kr(t.kalan);

  const alan = (etiket, id, tip, deger, mod) => {
    f.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input');
    i.id = id; i.type = tip || 'text';
    if (deger !== undefined && deger !== null) i.value = deger;
    if (mod) i.setAttribute('inputmode', mod);
    f.appendChild(i); return i;
  };
  const tar = alan('Ödeme tarihi', 'of_tarih_'+t.id, 'date', bugun());
  const tut = alan('Tutar (varsayılan: kalan)', 'of_tutar_'+t.id, 'text',
                   (kalanKurus/100).toFixed(2).replace('.', ','), 'decimal');

  /* Kirilim: taksitte ayrim varsa ODENEN ORANINDA on doldurulur.
     Ayrim yoksa alanlar bos kalir ve gider YAZILMAZ — uydurmuyoruz. */
  const ayrimVar = t.anapara_tutar !== null && t.anapara_tutar !== undefined;
  let an, fz, vm;
  if (ayrimVar){
    f.appendChild(el('div','kucuk',
      'Kırılım ödeme tutarına ORANTILI dolduruldu; elle değiştirebilirsin. '
    + 'Üçünün toplamı tutara eşit olmalı.'));
    an = alan('Anapara payı', 'of_ana_'+t.id, 'text', '', 'decimal');
    fz = alan('Faiz payı', 'of_faiz_'+t.id, 'text', '', 'decimal');
    vm = alan('Vergi/masraf payı', 'of_vm_'+t.id, 'text', '', 'decimal');
    const dagit = () => {
      const p = paraCoz(tut.value); if (!p.ok || p.kurus <= 0) return;
      const kalanA = kr(t.anapara_tutar) - kr(t.anapara_odenen || 0);
      const kalanF = kr(t.faiz_tutar) - kr(t.faiz_odenen || 0);
      const kalanV = kr(t.vergi_masraf_tutar || 0);
      const top = kalanA + kalanF + kalanV;
      if (top <= 0) return;
      const a = Math.round(p.kurus * kalanA / top);
      const fzz = Math.round(p.kurus * kalanF / top);
      const v = p.kurus - a - fzz;                    // kurus artigi buraya
      an.value = (a/100).toFixed(2).replace('.', ',');
      fz.value = (fzz/100).toFixed(2).replace('.', ',');
      vm.value = (v/100).toFixed(2).replace('.', ',');
    };
    tut.oninput = dagit; dagit();
  } else {
    f.appendChild(el('div','uyari-orta',
      'Bu taksitin anapara/faiz kırılımı girilmemiş. Ödeme kaydedilir ama '
    + 'faiz GİDERE YAZILAMAZ — hangi kısmın faiz olduğu bilinmiyor.'));
  }

  /* ⚠ MUKERRER KORUMA: 2026-07 faizleri ELLE gider olarak girildi. */
  let israr = null;
  const kesimUyar = () => {
    const eski = f.querySelector('.kesim-uyari');
    if (eski) eski.remove(); israr = null;
    if (!ayrimVar || t.kredi_tur !== 'ticari') return;
    if ((tar.value || '') >= '2026-08-01') return;
    const u = el('div','uyari-agir kesim-uyari');
    u.appendChild(document.createTextNode(
      'Bu tarih 01.08.2026 öncesi. O dönemin faizleri ELLE gidere girilmiş '
    + 'olabilir; otomatik yazılırsa MÜKERRER olur. Varsayılan: gider YAZILMAZ.'));
    const et = document.createElement('label');
    et.style.cssText = 'display:flex;align-items:center;gap:8px;margin-top:8px;font-size:13px';
    const cb = document.createElement('input');
    cb.type = 'checkbox'; cb.style.cssText = 'width:auto;min-height:auto;margin:0';
    et.appendChild(cb);
    et.appendChild(document.createTextNode('Yine de faizi gidere yaz (elle girilmediğinden eminim)'));
    u.appendChild(et); f.appendChild(u); israr = cb;
  };
  tar.onchange = kesimUyar; kesimUyar();

  /* Kaydet'in HEMEN USTUNDE — eskiden son alanin altinda griydi. */
  f.appendChild(el('div','form-not','Önce ödemeyi kaydet — dekont düğmesi ondan sonra çıkar.'));

  const ey = el('div','tk-eylem');
  const kay = el('button','btn2','Kaydet');
  kay.onclick = () => odemeKaydet(t, tar, tut, an, fz, vm, israr, kay);
  const vaz = el('button','btn-mini','Vazgeç');
  vaz.onclick = () => f.remove();
  ey.appendChild(kay); ey.appendChild(vaz);
  f.appendChild(ey);
  kart.appendChild(f);
  tut.focus();
}

async function odemeKaydet(t, tar, tut, an, fz, vm, israr, btn){
  const kutu = mesajKutusu();
  mesajTemizle(kutu);
  const tarih = (tar.value || '').trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tarih))
    return mesaj(kutu, 'hata', 'Ödeme tarihi zorunlu.');
  const p = paraCoz(tut.value);
  if (!p.ok)        return mesaj(kutu, 'hata', 'Tutar: ' + p.hata);
  if (p.kurus <= 0) return mesaj(kutu, 'hata', 'Tutar sıfırdan büyük olmalı.');
  if (p.kurus > kr(t.kalan))
    return mesaj(kutu, 'hata', 'Tutar kalandan büyük olamaz. Kalan: ' + tl(t.kalan)
      + '. Fazla ödeme ayrı alacak olarak izlenmeli, buraya yazılmaz.');

  let a = null, f2 = null, v = null;
  if (an){
    const ra = paraCoz(an.value), rf = paraCoz(fz.value), rv = paraCoz(vm.value);
    if (!ra.ok || !rf.ok || !rv.ok) return mesaj(kutu,'hata','Kırılım tutarları geçersiz.');
    if (ra.kurus + rf.kurus + rv.kurus !== p.kurus)
      return mesaj(kutu, 'hata', 'Kırılım toplamı tutara eşit değil: '
        + tlk(ra.kurus + rf.kurus + rv.kurus) + ' ≠ ' + tlk(p.kurus));
    a = (ra.kurus/100).toFixed(2); f2 = (rf.kurus/100).toFixed(2); v = (rv.kurus/100).toFixed(2);
  }

  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { data, error } = await sb.rpc('rpc_taksit_odeme_kaydet', {
    p_taksit: t.id, p_tarih: tarih, p_tutar: (p.kurus/100).toFixed(2),
    p_anapara: a, p_faiz: f2, p_masraf: v,
    p_foto: null, p_aciklama: null,
    p_gider_yaz: (israr && israr.checked) ? true : null });
  btn.disabled = false; btn.textContent = 'Kaydet';
  if (error){ hataYaz(kutu, 'Ödeme kaydedilemedi.', error); return; }
  await ekranAc(EKRAN);
  /* ⚠ MESAJ EKRAN YENILENDIKTEN SONRA. Onceden once yaziliyordu ve
     ekranAc() #icerik'i bastan kurarken takvimMsg ile birlikte mesaji
     SILIYORDU — olculdu: kullanici hicbir onay gormuyordu. */
  mesaj(mesajKutusu(), 'ok', 'Ödeme kaydedildi'
    + (data && data.gider_yazildi ? ' · faiz gidere yazıldı' : ' · gider yazılmadı')
    + '. Dekontu eklemeyi unutma.');
  /* Dekont ancak odeme KAYDEDILDIKTEN sonra cikiyor ve kullanici onu
     bulamiyordu. Artik kaydettikten sonra o taksitin odeme listesi
     KENDILIGINDEN aciliyor ve ekran oraya kayiyor: "DEKONT EKSIK"
     rozeti ile "+ Dekont" dugmesi dogrudan gozun onunde. */
  const kart = document.querySelector('[data-taksit="' + t.id + '"]');
  if (kart){
    await odemeListesiAc(kart, { id: t.id });
    kart.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

/* ---------- ODEME LISTESI (dekont odeme bazinda) ---------- */
async function odemeListesiAc(kart, t){
  if (kart.querySelector('.odeme-liste')) return;
  const kutu = mesajKutusu();
  const liste = await odemeGetir(t.id);
  const d = el('div','odeme-liste');

  const hr = document.createElement('tr');
  ['TARİH','TUTAR','ANAPARA','FAİZ','GİDER','DEKONT',''].forEach((h,i) =>
    hr.appendChild(el('th', (i>=1 && i<=3) ? 'sag' : null, h)));
  tb.appendChild(hr);
  for (const o of liste){
    const tr = document.createElement('tr');
    tr.appendChild(td(trGun(o.tarih)));
    tr.appendChild(td(tl(o.tutar),'sag'));
    tr.appendChild(td(o.anapara_pay === null ? '—' : tl(o.anapara_pay),'sag'));
    tr.appendChild(td(o.faiz_pay === null ? '—'
      : tlk(kr(o.faiz_pay) + kr(o.vergi_masraf_pay || 0)),'sag'));
    tr.appendChild(td(o.gider_id ? 'yazıldı' : '—'));
    const dh = document.createElement('td');

      const a = el('button','btn-mini','Aç'); a.onclick = () => belgeAc(o.foto_path, kutu);
      dh.appendChild(a);
    } else dh.appendChild(el('span','rozet rz-eksik','DEKONT EKSİK'));
    tr.appendChild(dh);
    const ey = document.createElement('td');
    const b = el('button','btn-mini', o.foto_path ? 'Değiştir' : '+ Dekont');
    b.onclick = () => dekontEkle('kredi_taksit_odeme', o.id, 'kredi_taksit', kutu,
                                 !!o.foto_path, () => ekranAc(EKRAN));
    ey.appendChild(b); tr.appendChild(ey);
    tb.appendChild(tr);
  }
  sar.appendChild(tb); d.appendChild(sar);
  const kapat = el('button','btn-mini','Kapat'); kapat.onclick = () => d.remove();
  d.appendChild(kapat);
  kart.appendChild(d);
}

  for (const t of v.taksitler){
    if (!grup.has(t.kredi_id)) grup.set(t.kredi_id, []);
    grup.get(t.kredi_id).push(t);

  c.appendChild(bantCiz(v));

  for (const kredi of v.krediler){
    const o = krediOzet(grup.get(kredi.id) || []);

    kart.onclick = () => taksitEkraniAc(kredi.id);

    ust.appendChild(ad);

    kart.appendChild(ust);

    const alt = el('div','tk-orta');

      + (o.sonrakiVade ? ' · sonraki vade ' + trGun(o.sonrakiVade) : '')
      + ' · girilen ' + (grup.get(kredi.id) || []).length + '/' + kredi.taksit_sayisi;
    kart.appendChild(alt);
    if (o.gecmis || o.dekontEksik){
      const r = el('div'); r.style.marginTop = '6px';

async function krediKaydet(){
  const btn = document.getElementById('kKaydet');
  mesajTemizle('krediMsg');
  const banka = document.getElementById('kBanka').value.trim();
  const ad    = document.getElementById('kAd').value.trim();
  const tur   = document.getElementById('kTur').value;
  const bas   = document.getElementById('kBas').value;
  const anap  = paraCoz(document.getElementById('kAnapara').value);
  const faizH = document.getElementById('kFaiz').value.trim();
  const adet  = parseInt(document.getElementById('kAdet').value.trim(), 10);

  if (!banka) return mesaj('krediMsg','hata','Banka adı zorunlu.');
  if (!ad)    return mesaj('krediMsg','hata','Kredi adı zorunlu.');
  if (!tur)   return mesaj('krediMsg','hata','Tür seçmelisin: ticari, şahsi ya da limited.');
  if (!bas)   return mesaj('krediMsg','hata','Başlangıç tarihi zorunlu.');
  if (!anap.ok) return mesaj('krediMsg','hata','Anapara: ' + anap.hata);
  if (anap.kurus <= 0) return mesaj('krediMsg','hata','Anapara sıfırdan büyük olmalı.');
  if (!Number.isFinite(adet) || adet <= 0) return mesaj('krediMsg','hata','Taksit sayısı sıfırdan büyük bir tam sayı olmalı.');
  let faiz = null;
  if (faizH){
    const f = parseFloat(faizH.replace(',','.'));
    if (!isFinite(f) || f < 0) return mesaj('krediMsg','hata','Faiz oranı geçersiz. Bilinmiyorsa boş bırak.');
    faiz = f;
  }
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kredi').insert({
    banka, ad, tur, anapara:(anap.kurus/100).toFixed(2), faiz_orani:faiz,
    taksit_sayisi:adet, baslangic_tarihi:bas,
    aciklama: document.getElementById('kAciklama').value.trim() || null,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Krediyi kaydet';
  if (error){ hataYaz('krediMsg','Kredi kaydedilemedi.', error); return; }
  mesaj('krediMsg','ok','Kredi kaydedildi.');
  await vKrediler();
}

const PM_ETKI = 'Bu kayıt aktif listelerden kaldırılacak ve ilgili aktif toplamların '
  + 'dışında tutulacaktır. Kayıt denetim amacıyla sistemde korunacaktır.';

/* Turkce noktali/noktasiz I: kullanici hangisini yazarsa yazsin kabul. */
const pmNorm = s => (s||'').trim().toLocaleUpperCase('tr').replace(/İ/g,'I');

function pasifeAlAc(acan, { tur, ad, kim, tutar, uygula }){
  let n = 0; const kimlik = (e) => (e.id = 'pm' + (++n));
  const d = document.createElement('dialog'); d.className = 'pm';
  d.setAttribute('aria-modal','true');
  const bas = el('div','pm-bas'); kimlik(bas);
  bas.appendChild(el('span','pm-ikon','⚠'));        // renk TEK BASINA tehlike degil
  bas.appendChild(document.createTextNode(' ' + tur + ' pasife alınacak'));
  d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
  d.appendChild(el('div','pm-ad', ad));
  if (kim)   d.appendChild(el('div','pm-kim', kim));
  if (tutar) d.appendChild(el('div','pm-tutar', tutar));
  const etki = el('div','pm-etki', PM_ETKI); kimlik(etki);
  d.setAttribute('aria-describedby', etki.id); d.appendChild(etki);

  const alan = (etiket, tag) => {
    const g = document.createElement(tag); kimlik(g);
    const l = el('label', null, etiket); l.setAttribute('for', g.id);
    const h = el('div','pm-hata'); kimlik(h); h.hidden = true;
    g.setAttribute('aria-describedby', h.id);
    d.appendChild(l); d.appendChild(g); d.appendChild(h);
    return [g, h];
  };
  const [ta, taH] = alan('Gerekçe (zorunlu)', 'textarea'); ta.rows = 2;
  const [dg, dgH] = alan('Onaylamak için "' + PM_TOKEN + '" yazın', 'input');

  const ey = el('div','pm-ey');
  const vaz = el('button','btn2','Vazgeç'), ona = el('button','btn-kirmizi','Kaydı pasife al');
  vaz.type = ona.type = 'button'; ona.disabled = true;
  ey.appendChild(vaz); ey.appendChild(ona);          // Vazgec SOLDA
  const hataK = el('div','uyari-agir'); hataK.hidden = true; kimlik(hataK);
  ona.setAttribute('aria-describedby', hataK.id);
  d.appendChild(ey); d.appendChild(hataK);
  document.body.appendChild(d); d.showModal();       // gercek <dialog>

  const denetle = () => {
    const g = ta.value.trim(), t = pmNorm(dg.value);
    taH.hidden = !(g.length > 0 && g.length < 10);
    taH.textContent = 'Gerekçe çok kısa — ne olduğunu yaz (en az 10 karakter).';
    dgH.hidden = !(t.length > 0 && t !== pmNorm(PM_TOKEN));
    dgH.textContent = 'Doğrulama metni eşleşmiyor.';
    ona.disabled = !(g.length >= 10 && t === pmNorm(PM_TOKEN));
  };
  ta.oninput = dg.oninput = denetle;
  /* Enter TEK BASINA islem yapmaz: dogrulama alaninda Enter yutulur. */
  dg.onkeydown = (e) => { if (e.key === 'Enter') e.preventDefault(); };
  const kapat = () => { d.close(); d.remove();
                        if (acan && acan.isConnected) acan.focus(); };
  vaz.onclick = kapat;
  /* ⚠ ESCAPE ELDE ELE ALINIYOR. Olculdu: bu Chromium'da <dialog>'un
     yerel `cancel` olayi Escape'te ATESLENMEDI (keydown geldi, cancel
     gelmedi) — yerel davranisa guvenmek kapatilamayan modal demekti.
     `cancel` yine de dinleniyor; iki yol da mutation URETMEZ.
     Arka alan tiklamasi <dialog>'da varsayilan olarak islem yapmaz. */
  d.addEventListener('cancel', (e) => { e.preventDefault(); kapat(); });
  d.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ e.preventDefault(); kapat(); return; }
    if (e.key !== 'Tab') return;                     // odak tuzagi
    const od = [...d.querySelectorAll('textarea,input,button')].filter(x => !x.disabled);
    const i = od.indexOf(document.activeElement); e.preventDefault();
    od[(i + (e.shiftKey ? -1 : 1) + od.length) % od.length].focus();
  });

  let gonderildi = false;
  ona.onclick = async () => {
    if (gonderildi || ona.disabled) return;          // cift tiklama TEK mutation
    gonderildi = true;
    ona.disabled = vaz.disabled = ta.disabled = dg.disabled = true;
    ona.textContent = 'İşleniyor...'; hataK.hidden = true;
    /* SUNUCU SONUCU KESINLESMEDEN basari YOK; hatada modal ve
       kullanicinin yazdigi gerekce KORUNUR. */
    const s = await uygula(ta.value.trim());
    if (s && s.ok){ kapat(); return; }
    gonderildi = false;
    ona.disabled = false; vaz.disabled = ta.disabled = dg.disabled = false;
    ona.textContent = 'Kaydı pasife al';
    hataK.hidden = false; hataK.textContent = (s && s.mesaj) || 'İşlem tamamlanamadı.';
    ta.focus();
  };
  vaz.focus();                                       // acilista odak VAZGEC
  return { d, ta, dg, vaz, ona, hataK, taH, dgH };
}

function topluSatirlariUret(kredi, sonSira){
  const bas   = document.getElementById('tBas').value;
  const tut   = paraCoz(document.getElementById('tTutar').value);
  const adet  = parseInt(document.getElementById('tAdet').value.trim(), 10);
  const per   = parseInt(document.getElementById('tPeriyot').value, 10);
  const faizH = document.getElementById('tFaiz').value.trim();
  const vrgH  = document.getElementById('tVergi').value.trim();
  const not   = document.getElementById('tNot').value.trim();

  if (!bas) return { ok:false, hata:'İlk vade tarihi zorunlu.' };
  if (!tut.ok) return { ok:false, hata:'Taksit tutarı: ' + tut.hata };
  if (tut.kurus <= 0) return { ok:false, hata:'Taksit tutarı sıfırdan büyük olmalı.' };
  if (!Number.isFinite(adet) || adet <= 0) return { ok:false, hata:'Adet sıfırdan büyük bir tam sayı olmalı.' };
  if (adet > 600) return { ok:false, hata:'Adet çok büyük (en fazla 600).' };
  if (!Number.isFinite(per) || per <= 0) return { ok:false, hata:'Periyot seçilmedi.' };

  let faizKurus = null, vrgKurus = null;
  if (faizH){
    const f = paraCoz(faizH);
    if (!f.ok) return { ok:false, hata:'Faiz: ' + f.hata };
    faizKurus = f.kurus;
  }
  if (vrgH){
    const g = paraCoz(vrgH);
    if (!g.ok) return { ok:false, hata:'Vergi/masraf: ' + g.hata };
    vrgKurus = g.kurus;
  }
  /* kt_ayrim_chk'i EKRANDA da uygula — sunucuya hatali satir gondermeyelim */
  if (vrgKurus !== null && faizKurus === null)
    return { ok:false, hata:'Vergi/masraf yazdın ama faiz boş. Kırılım girilecekse faiz de zorunlu.' };
  if (faizKurus !== null){
    const toplamPay = faizKurus + (vrgKurus || 0);
    if (toplamPay > tut.kurus)
      return { ok:false, hata:'Faiz + vergi/masraf, taksit tutarından büyük olamaz.' };
  }

  const satirlar = [];
  for (let i = 0; i < adet; i++){
    satirlar.push({
      kredi_id: kredi.id,
      sira: sonSira + i + 1,
      vade_tarihi: ayEkle(bas, i * per),
      toplam_tutar: (tut.kurus/100).toFixed(2),
      anapara_tutar: faizKurus === null ? null : ((tut.kurus - faizKurus - (vrgKurus||0))/100).toFixed(2),
      faiz_tutar:    faizKurus === null ? null : (faizKurus/100).toFixed(2),
      vergi_masraf_tutar: vrgKurus === null ? null : (vrgKurus/100).toFixed(2),
      vergi_masraf_notu:  (vrgKurus !== null && not) ? not : null,
      odendi: false
    });
  }
  return { ok:true, satirlar, toplamKurus: tut.kurus * adet };
}

async function topluOnizle(kredi, sonSira, kaydet){
  mesajTemizle('taksitMsg');
  const r = topluSatirlariUret(kredi, sonSira);
  const ov = document.getElementById('tOnizleme');
  ov.textContent = '';
  if (!r.ok){ mesaj('taksitMsg','hata', r.hata); return; }

  ov.appendChild(el('div','bilgi',
    r.satirlar.length + ' taksit · ilk vade ' + trGun(r.satirlar[0].vade_tarihi)
    + ' · son vade ' + trGun(r.satirlar[r.satirlar.length-1].vade_tarihi)
    + ' · toplam ' + tlk(r.toplamKurus)));

  if (!kaydet){
    const sar = el('div','tablo-sar');
    const t = document.createElement('table');
    const hr = document.createElement('tr');
    ['#','VADE','TUTAR','ANAPARA','FAİZ','VERGİ/MASRAF'].forEach((h,i) =>
      hr.appendChild(el('th', i>=2 ? 'sag' : null, h)));
    t.appendChild(hr);
    r.satirlar.slice(0,12).forEach(s => {
      const tr = document.createElement('tr');
      tr.appendChild(td(s.sira));
      tr.appendChild(td(trGun(s.vade_tarihi)));
      tr.appendChild(td(tl(s.toplam_tutar),'sag'));
      tr.appendChild(td(s.anapara_tutar === null ? '—' : tl(s.anapara_tutar),'sag'));
      tr.appendChild(td(s.faiz_tutar === null ? '—' : tl(s.faiz_tutar),'sag'));
      tr.appendChild(td(s.vergi_masraf_tutar === null ? '—' : tl(s.vergi_masraf_tutar),'sag'));
      t.appendChild(tr);
    });
    sar.appendChild(t); ov.appendChild(sar);
    if (r.satirlar.length > 12)
      ov.appendChild(el('div','kucuk','İlk 12 satır gösteriliyor; kaydedilecek toplam ' + r.satirlar.length + ' satır.'));
    return;
  }

  if (!confirm(r.satirlar.length + ' taksit kaydedilecek.\n\nDevam edilsin mi?')) return;
  const btn = document.getElementById('tKaydet');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kredi_taksit').insert(r.satirlar);
  btn.disabled = false; btn.textContent = 'Taksitleri kaydet';
  if (error){ hataYaz('taksitMsg','Taksitler kaydedilemedi. HİÇBİRİ yazılmadı.', error); return; }
  mesaj('taksitMsg','ok', r.satirlar.length + ' taksit kaydedildi.');
  await taksitEkraniAc(kredi.id);
}

  try{
