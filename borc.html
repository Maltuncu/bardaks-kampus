    ['TÜR','GRAM FİYATI','TARİH','KAYNAK',''].forEach((h,i) => hr.appendChild(el('th', i===1?'sag':null, h)));
    t.appendChild(hr);
    for (const f of fiyatlar.slice(0,30)){
      const tr = document.createElement('tr');
      tr.appendChild(td(f.tur === 'altin' ? 'Altın' : 'Gümüş'));
      tr.appendChild(td(tl(f.gram_fiyat),'sag'));
      tr.appendChild(td(trGun(f.tarih)));
      tr.appendChild(td(f.kaynak_notu || '—'));          // textContent
      /* CK · yanlis tuslanan fiyat ekrandan silinsin — mevcut btn-mini */
      const sh = document.createElement('td');
      const sb2 = el('button','btn-mini','Sil'); sb2.type = 'button';
      sb2.setAttribute('aria-label', (f.tur === 'altin' ? 'Altın' : 'Gümüş') + ' '
        + trGun(f.tarih) + ' fiyatını sil');
      sb2.onclick = () => madenFiyatSil(f, fiyatlar, vMaden);
      sh.appendChild(sb2); tr.appendChild(sh);
      t.appendChild(tr);
    }
    sar.appendChild(t); fl.appendChild(sar); c.appendChild(fl);
  }
}

/* ---------- tek madenin kunyesi ---------- */
async function madenDetayAc(madenId, sessiz){
  seritiHizala();          // AN-C · ekranAc'tan gecmiyor, serit kaymis kalirdi
  const c = document.getElementById('icerik');
  if (!sessiz){ c.textContent = ''; c.appendChild(el('div','bos','Yükleniyor...')); }
  try{
    const v = await bantVerisi();
    const { kayitlar, fiyatlar, kalanlar, odemeler } = v.maden;
    const m = kayitlar.find(x => x.id === madenId);
    if (!m){ c.textContent=''; c.appendChild(el('div','uyari-agir','Maden kaydı bulunamadı.')); return; }
    MADEN_DETAY = madenId;
    const d = madenDeger(m, fiyatlar);
    const adTur = m.tur === 'altin' ? 'Altın' : 'Gümüş';

    c.textContent = '';
    const geri = el('button','btn2','← Madenlere dön');
    geri.onclick = async () => {
      MADEN_DETAY = null;
      await ekranAc('maden');
      const kutu = document.querySelector('#icerik .tk[data-maden="' + madenId + '"]');
      if (kutu) kutu.focus();
    };
    c.appendChild(geri);

    const bas = el('div','kart');
    const bl = el('div','kbaslik', adTur + ' · ' + gramYaz(m.gram));
    bl.tabIndex = -1;
    bas.appendChild(bl);
    /* ⚠ KAVRAM UYARISI DETAYDA DA. Bantta ve liste ekraninda vardi; FARK
       satirini tek basina goren kullanici onu yatirim kazanci sanabilir. */
    bas.appendChild(el('div','kavram',
      'Rayiç farkı yatırım kazancı değildir — borç yükünün bugünkü değerindeki değişimdir.'));
    const sat = (e2,d2) => { const s = el('div','satir');
      s.appendChild(el('span','et', e2)); s.appendChild(el('span','dg', d2)); bas.appendChild(s); return s; };
    sat('Kime', m.kime);
    sat('Alış günü', trGun(m.tarih));
    sat('Gram', gramYaz(m.gram));
    /* alis degeri: OLGU / TAHMIN / BILINMIYOR — hangisi oldugu YAZIYOR */
    const as = sat('Alış değeri', '');
    const asd = as.querySelector('.dg');
    if (d.alisKurus === null) asd.appendChild(el('span','gri','bilinmiyor'));
    else if (d.kaynak === 'tahmin'){
      asd.appendChild(el('span', null, tlk(d.alisKurus) + ' '));
      asd.appendChild(el('span','rozet rz-sari','tahmini'));
    } else asd.appendChild(el('span', null, tlk(d.alisKurus)));
    sat('Bugünkü değer', d.bugunKurus === null ? 'hesaplanamaz' : tlk(d.bugunKurus));
    /* ⚠ v116 · ETIKET "Fark" DEGIL "Rayiç farkı". Ekranda artik IKI ayri
       fark var — bu rayic (bugunku deger − alis), asagidaki ise ODEME
       farki (odenen − o gramin alis maliyeti). Ikisine de "Fark" demek
       en pahali karistirma olurdu. Ustteki kavram uyarisi zaten "Rayiç
       farkı" diyor; etiket ona uyduruldu. */
    const fs = sat('Rayiç farkı', '');
    const fsd = fs.querySelector('.dg');
    if (d.alisKurus === null || d.bugunKurus === null) fsd.textContent = '—';
    else {
      const fark = d.bugunKurus - d.alisKurus;
      fsd.textContent = (fark >= 0 ? '+' : '−') + tlk(Math.abs(fark));
      fsd.style.color = fark > 0 ? 'var(--hata)' : fark < 0 ? 'var(--ok)' : '';
      fsd.style.fontWeight = '900';
    }
    if (m.aciklama) bas.appendChild(el('div','kucuk', m.aciklama));
    const ey = el('div','tk-eylem');
    /* ⚠ FIYAT FORMU KOPYALANMIYOR — liste ekranindaki TEK forma goturuluyor
       (sahisBorcFormunaGit kalibi). Ayni fiyati iki yerden girmek, hangisinin
       dogru oldugunu belirsiz birakirdi. */
    const bf = el('button','btn2','Gram fiyatı gir');
    bf.onclick = async () => { MADEN_DETAY = null; await ekranAc('maden'); madenFiyatFormunaGit(m.tur); };
    ey.appendChild(bf);
    ey.appendChild(digerMenu([['Maden borcunu sil',
      (a) => madenSil(m, a, d.bugunKurus === null ? null : tlk(d.bugunKurus))]]));
    bas.appendChild(ey);
    c.appendChild(bas);

    const msg = el('div','msg'); msg.id = 'madenMsg'; c.appendChild(msg);

    /* =================================================================
       v116 · ODEME BOLUMU
       =================================================================
       Sahibin tarif ettigi akis: "girdim o borcum olan hesaba, ona su
       kadar gr su fiyattan odedim diyorum, sonra kaydedip geri geri
       cikiyorum" · "odersem parca parca odeyecegim" ·
       "arada ne kadar fark odedigimi gorecektim".
       ⚠ KALAN GRAM EN BELIRGIN: odemeyi o belirliyor. Ustteki uc rakamin
         icinde en buyuk yazan o.
       ⚠ Bu bolum v_maden_kalan'a bagli; gorunum okunamadiysa (yetki,
         v116 uygulanmamis) BOLUM HIC CIZILMEZ ve sebebi yazilir —
         yerine 0 gostermek "borc bitti" sanilmasina yol acardi.
       ================================================================= */
    const kl = kalanlar ? kalanlar.get(m.id) : null;
    if (!kl){
      const uy = el('div','kart');
      uy.appendChild(el('div','kbaslik','Ödemeler'));
      uy.appendChild(el('div','uyari-agir',
        'Ödeme bilgisi okunamadı. Bu bölüm v_maden_kalan görünümünden geliyor; '
      + 'görünüm yoksa ya da yetki verilmemişse burası boş kalır. '
      + 'Ekranı yenileyin, sürerse bildirin.'));
      c.appendChild(uy);
    } else {
      const kalanGram  = Number(kl.kalan_gram)  || 0;
      const odenenGram = Number(kl.odenen_gram) || 0;
      const kapandi    = kalanGram <= 0;
      const ok = el('div','kart');
      ok.appendChild(el('div','kbaslik', 'Ödemeler'
        + (kl.odeme_sayisi ? ' (' + kl.odeme_sayisi + ')' : '')));

      /* ---- UC RAKAM · kalan gram EN BELIRGIN ---- */
      const bk = el('div','tk-ust');
      bk.appendChild(el('div','tk-ad','KALAN'));
      const kg = el('div','tk-tutar', kapandi ? 'kapandı' : gramYaz(kalanGram));
      if (kapandi) kg.style.color = 'var(--ok)';
      bk.appendChild(kg);
      ok.appendChild(bk);
      const s2 = (e2,d2) => { const s = el('div','satir');
        s.appendChild(el('span','et', e2)); s.appendChild(el('span','dg', d2));
        ok.appendChild(s); return s; };
      s2('Ödenen', gramYaz(odenenGram)
        + (Number(kl.odenen_tutar) ? ' · ' + tlk(kr(kl.odenen_tutar)) : ''));
      /* ⚠ FARK · NULL ile SIFIR AYNI SEY DEGIL. alis_tutar girilmemisse
         sunucu NULL donduruyor; "0" ya da "kar yok" yazmak, olmayan bir
         kari var sandirirdi. */
      const fo = s2('Alış–ödeme farkı', '');
      const fod = fo.querySelector('.dg');
      if (kl.fark === null || kl.fark === undefined){
        fod.appendChild(el('span','gri','alış tutarı girilmemiş, fark hesaplanamıyor'));
      } else if (odenenGram <= 0){
        fod.appendChild(el('span','gri','henüz ödeme yok'));
      } else {
        const fk2 = kr(kl.fark);
        fod.textContent = (fk2 >= 0 ? '+' : '−') + tlk(Math.abs(fk2))
          + (fk2 >= 0 ? ' (alıştan pahalı kapattın)' : ' (alıştan ucuz kapattın)');
        fod.style.color = fk2 > 0 ? 'var(--hata)' : fk2 < 0 ? 'var(--ok)' : '';
        fod.style.fontWeight = '900';
      }
      if (kl.odenen_alis_maliyeti !== null && kl.odenen_alis_maliyeti !== undefined
          && odenenGram > 0)
        ok.appendChild(el('div','kucuk', 'Ödenen ' + gramYaz(odenenGram)
          + ' bu borcu alırken ' + tlk(kr(kl.odenen_alis_maliyeti)) + ' tutuyordu.'));

      /* ---- ODEME EKLEME ---- */
      if (kapandi){
        ok.appendChild(el('div','bos','Bu borç tamamen ödendi — yeni ödeme eklenemez.'));
      } else {
        const ekle = (etiket, id, tip, mod) => {
          ok.appendChild(el('label', null, etiket)).setAttribute('for', id);
          const i = document.createElement('input'); i.id = id; i.type = tip || 'text';
          if (mod) i.setAttribute('inputmode', mod);
          ok.appendChild(i); return i;
        };
        const ig = ekle('Kaç gram ödedin? (kalan ' + gramYaz(kalanGram) + ')','moGram','text','decimal');
        const ifi = ekle('Gram başı fiyat (TL)','moFiyat','text','decimal');
        paraBagla(ifi);                   /* CO · moGram GRAM — baglanmaz */
        /* ⚠ ONERI, KILIT DEGIL: o turun EN SON girilmis gram fiyati
           doldurulur ama alan serbesttir — sahibi FIILEN odedigi fiyati
           yazacak, piyasa fiyatini degil. */
        const sonF = sonFiyat(fiyatlar, m.tur);
        if (sonF){
          ifi.value = String(sonF.gram_fiyat).replace('.', ',');
          ok.appendChild(el('div','kucuk', adTur + ' için en son girilen fiyat ('
            + trGun(sonF.tarih) + ') önerildi — ödediğin fiyat farklıysa değiştir.'));
        }
        ekle('Ödeme tarihi','moTarih','date').value = bugun();
        ekle('Açıklama (zorunlu değil)','moAciklama','text');
        /* ⚠ TUTAR KAYDETMEDEN ONCE GORUNUR. gram x fiyat kafadan
           carpilmaz; yanlis tuslama ancak rakami gorunce fark edilir. */
        const onIzleme = el('div','kavram','Tutar: —');
        ok.appendChild(onIzleme);
        const hesapla = () => {
          const g2 = gramCoz(ig.value), p2 = paraCoz(ifi.value);
          if (!g2.ok || !p2.ok || g2.deger <= 0 || p2.kurus <= 0){
            onIzleme.textContent = 'Tutar: —'; return; }
          onIzleme.textContent = 'Tutar: ' + gramYaz(g2.deger) + ' × ' + tl(p2.kurus/100)
            + ' = ' + tlk(Math.round(g2.deger * p2.kurus))
            + (g2.deger > kalanGram ? '  ⚠ kalandan fazla' : '');
        };
        ig.addEventListener('input', hesapla); ifi.addEventListener('input', hesapla);
        hesapla();
        const bo = el('button','btn','Ödemeyi kaydet'); bo.id = 'moKaydet';
        bo.onclick = () => madenOdemeKaydet(m);
        ok.appendChild(bo);
      }

      /* ---- ODEME LISTESI ---- */
      const liste = (odemeler||[]).filter(o => o.maden_id === m.id);
      if (liste.length){
        const sar = el('div','tablo-sar');
        const t = document.createElement('table');
        const hr = document.createElement('tr');
        ['TARİH','GRAM','GRAM FİYATI','TUTAR',''].forEach((h,i) =>
          hr.appendChild(el('th', (i===1||i===2||i===3)?'sag':null, h)));
        t.appendChild(hr);
        for (const o of liste){
          const tr = document.createElement('tr');
          tr.appendChild(td(trGun(o.tarih)));
          tr.appendChild(td(gramYaz(o.gram),'sag'));
          tr.appendChild(td(tl(o.gram_fiyat),'sag'));
          tr.appendChild(td(tlk(Math.round(Number(o.gram) * kr(o.gram_fiyat))),'sag'));
          const sh = document.createElement('td');
          const sb2 = el('button','btn-mini','Sil'); sb2.type = 'button';
          sb2.setAttribute('aria-label', trGun(o.tarih) + ' tarihli '
            + gramYaz(o.gram) + ' ödemesini sil');
          sb2.onclick = () => madenOdemeSil(o, m);
          sh.appendChild(sb2); tr.appendChild(sh);
          t.appendChild(tr);
          if (o.aciklama){
            const tr2 = document.createElement('tr');
            const c2 = document.createElement('td'); c2.colSpan = 5;
            c2.className = 'kucuk'; c2.textContent = o.aciklama;
            tr2.appendChild(c2); t.appendChild(tr2);
          }
        }
        sar.appendChild(t); ok.appendChild(sar);
      } else if (!kapandi){
        ok.appendChild(el('div','bos','Bu borca henüz ödeme girilmemiş.'));
      }
      c.appendChild(ok);
    }

    /* ⚠ FIYAT GECMISI TURE AITTIR, KAYDA DEGIL — maden_fiyat'ta olculdu:
       alanlar (tur · gram_fiyat · tarih · kaynak_notu), kayit basina fiyat
       YOK. Bu yuzden bu madenin TURUNUN gecmisi gosteriliyor. Hic kayit
       yoksa uydurulmuyor, "yok" yaziliyor. */
    const gecmis = fiyatlar.filter(f => f.tur === m.tur);
    const fl = el('div','kart');
    fl.appendChild(el('div','kbaslik', adTur + ' fiyat geçmişi (' + gecmis.length + ')'));
    if (!gecmis.length){
      fl.appendChild(el('div','bos','Bu tür için fiyat geçmişi yok — gram fiyatı hiç girilmemiş.'));
    } else {
      const sar = el('div','tablo-sar');
      const t = document.createElement('table');
      const hr = document.createElement('tr');
      ['GRAM FİYATI','TARİH','KAYNAK',''].forEach((h,i) => hr.appendChild(el('th', i===0?'sag':null, h)));
      t.appendChild(hr);
      for (const f of gecmis.slice(0,30)){
        const tr = document.createElement('tr');
        tr.appendChild(td(tl(f.gram_fiyat),'sag'));
        tr.appendChild(td(trGun(f.tarih)));
        tr.appendChild(td(f.kaynak_notu || '—'));        // textContent
        /* CK · tazele = madenTazele -> kullanici DETAYDA kalir */
        const sh = document.createElement('td');
        const sb2 = el('button','btn-mini','Sil'); sb2.type = 'button';
        sb2.setAttribute('aria-label', trGun(f.tarih) + ' fiyatını sil');
        sb2.onclick = () => madenFiyatSil(f, fiyatlar, madenTazele);
        sh.appendChild(sb2); tr.appendChild(sh);
        t.appendChild(tr);
      }
      sar.appendChild(t); fl.appendChild(sar);
      if (gecmis.length > 30)
        fl.appendChild(el('div','kucuk', 'En yeni 30 kayıt gösteriliyor; toplam ' + gecmis.length + '.'));
    }
    c.appendChild(fl);
    bl.focus();                         // AN-C · detay acilinca odak BASLIGA
  }catch(e){
    c.textContent = '';
    c.appendChild(el('div','uyari-agir','Maden açılamadı: ' + hataTr(e && e.message)));
  }
}

/* ⚠ YENI FORM YAZILMIYOR — liste ekranindaki MEVCUT fiyat formuna
   goturuluyor; sahisBorcFormunaGit'in kalibinin aynisi. */
function madenFiyatFormunaGit(tur){
  const s = document.getElementById('fTur'); if (!s) return;
  s.value = tur;
  (s.closest('.kart') || s).scrollIntoView({ behavior:'smooth', block:'center' });
  const f = document.getElementById('fFiyat');
  if (f) f.focus({ preventScroll:true });
}

async function madenKaydet(){
  mesajTemizle('madenMsg');
  const btn = document.getElementById('mKaydet');
  const g = gramCoz(document.getElementById('mGram').value);
  const kime = document.getElementById('mKime').value.trim();
  const tarih = document.getElementById('mTarih').value;
  if (!g.ok)  return mesaj('madenMsg','hata', g.hata);
  if (!kime)  return mesaj('madenMsg','hata','"Kime" zorunlu.');
  if (!tarih) return mesaj('madenMsg','hata','Alış tarihi zorunlu.');

  /* alis_tutar ZORUNLU DEGIL. Yazildiysa 0'dan buyuk olmali —
     maden_alis_tutar_chk'i ekranda da uygula, sunucuya hatali satir gitmesin. */
  const alisH = document.getElementById('mAlis').value.trim();
  let alisTutar = null;
  if (alisH){
    const a = paraCoz(alisH);
    if (!a.ok)         return mesaj('madenMsg','hata','Alış tutarı: ' + a.hata);
    if (a.kurus <= 0)  return mesaj('madenMsg','hata','Alış tutarı sıfırdan büyük olmalı. Bilinmiyorsa BOŞ bırak — 0 yazma.');
    alisTutar = (a.kurus/100).toFixed(2);
  }

  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('maden').insert({
    tur: document.getElementById('mTur').value,
    gram: g.deger.toFixed(3), kime, tarih,
    alis_tutar: alisTutar,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Kaydet';
  if (error){ hataYaz('madenMsg','Kayıt eklenemedi.', error); return; }
  mesaj('madenMsg','ok','Kayıt eklendi.');
  await vMaden();
}

async function fiyatKaydet(){
  mesajTemizle('madenMsg');
  const btn = document.getElementById('fKaydet');
  const p = paraCoz(document.getElementById('fFiyat').value);
  const tarih = document.getElementById('fTarih').value;
  if (!p.ok)        return mesaj('madenMsg','hata','Gram fiyatı: ' + p.hata);
  if (p.kurus <= 0) return mesaj('madenMsg','hata','Gram fiyatı sıfırdan büyük olmalı.');
  if (!tarih)       return mesaj('madenMsg','hata','Fiyat tarihi zorunlu.');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('maden_fiyat').insert({
    tur: document.getElementById('fTur').value,
    gram_fiyat:(p.kurus/100).toFixed(2), tarih,
    kaynak_notu: document.getElementById('fKaynak').value.trim() || null,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Fiyatı kaydet';
  if (error){ hataYaz('madenMsg','Fiyat kaydedilemedi.', error); return; }
  mesaj('madenMsg','ok','Fiyat kaydedildi.');
  await vMaden();
}

/* ================== v116 · MADEN ODEMESI ==================
   ⚠ SUNUCU RPC'SI CAGRILIYOR, dogrudan INSERT DEGIL: asim kontrolu ve
     kilit orada. Tabloya dogrudan yazmak tetigin yakalayacagi bir hatayi
     ekrandan gecirmis gibi gosterirdi.
   ⚠ Kaydettikten sonra DETAYDA kalinir (madenTazele) — sahibin tarifi
     "kaydedip geri geri cikiyorum"; kaydeden kisiyi listeye atmak
     ikinci parcayi girmeyi zorlastirirdi. */
async function madenOdemeKaydet(m){
  mesajTemizle('madenMsg');
  const btn = document.getElementById('moKaydet');
  const g = gramCoz(document.getElementById('moGram').value);
  const p = paraCoz(document.getElementById('moFiyat').value);
  const tarih = document.getElementById('moTarih').value;
  if (!g.ok)         return mesaj('madenMsg','hata','Gram: ' + g.hata);
  if (g.deger <= 0)  return mesaj('madenMsg','hata','Gram sıfırdan büyük olmalı.');
  if (!p.ok)         return mesaj('madenMsg','hata','Gram fiyatı: ' + p.hata);
  if (p.kurus <= 0)  return mesaj('madenMsg','hata','Gram fiyatı sıfırdan büyük olmalı.');
  if (!tarih)        return mesaj('madenMsg','hata','Ödeme tarihi zorunlu.');

  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { data, error } = await sb.rpc('rpc_maden_odeme_kaydet', {
    p_maden_id: m.id,
    p_gram: g.deger.toFixed(3),
    p_gram_fiyat: (p.kurus/100).toFixed(2),
    p_tarih: tarih,
    p_aciklama: document.getElementById('moAciklama').value.trim() || null });
  btn.disabled = false; btn.textContent = 'Ödemeyi kaydet';
  if (error){ hataYaz('madenMsg','Ödeme kaydedilemedi.', error); return; }
  await madenTazele();
  const kalan = data && data.kalan_gram !== undefined ? Number(data.kalan_gram) : null;
  mesaj('madenMsg','ok', 'Ödeme kaydedildi'
    + (data && data.tutar ? ' · ' + tlk(kr(data.tutar)) : '')
    + (kalan === null ? '' : kalan <= 0
        ? ' · borç TAMAMEN kapandı.'
        : ' · kalan ' + gramYaz(kalan) + '.'));
}

/* ⚠ GEREKCE ZORUNLU (sunucu >=10 karakter istiyor) ve SONUCU SOYLENIR:
     silinen odeme kalan grami GERI ACAR. Bunu yazmayan bir onay penceresi,
     kullaniciyi "sadece bir satir siliyorum" sanmaya birakirdi.
   ⚠ Pencere kalibi madenFiyatSil'den kopyalandi; tek eklenen, gerekce
     alani ve sayaci (pasifeAlAc'taki gibi). */
function madenOdemeSil(o, m){
  const d = document.createElement('dialog'); d.className = 'pm';
  d.setAttribute('aria-modal','true');
  const bas = el('div','pm-bas'); bas.id = 'moSilBas';
  bas.appendChild(el('span','pm-ikon','⚠'));
  bas.appendChild(document.createTextNode(' Ödeme silinecek'));
  d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
  d.appendChild(el('div','pm-ad', trGun(o.tarih) + ' · ' + gramYaz(o.gram)));
  d.appendChild(el('div','pm-tutar',
    tl(o.gram_fiyat) + '/gr · ' + tlk(Math.round(Number(o.gram) * kr(o.gram_fiyat)))));
  if (o.aciklama) d.appendChild(el('div','pm-kim', o.aciklama));
  d.appendChild(el('div','pm-etki',
    'Bu ödeme silinince ' + gramYaz(o.gram) + ' borca GERİ EKLENİR; '
  + 'kalan gram o kadar artar. Kayıt silinmiş olarak işaretlenir, veri kaybolmaz.'));
  const et = el('label', null, 'Gerekçe (zorunlu, en az 10 karakter)');
  et.setAttribute('for','moSilNeden'); d.appendChild(et);
  const ta = document.createElement('textarea'); ta.id = 'moSilNeden'; ta.rows = 2;
  d.appendChild(ta);
  const say = el('div','pm-hata'); say.id = 'moSilSayac'; d.appendChild(say);
  ta.setAttribute('aria-describedby', say.id);
  const ey = el('div','pm-ey');
  const vaz = el('button','btn2','Vazgeç'), ona = el('button','btn-kirmizi','Sil');
  vaz.type = ona.type = 'button'; ona.disabled = true;
  ey.appendChild(vaz); ey.appendChild(ona); d.appendChild(ey);
  const hata = el('div','pm-hata'); hata.hidden = true; d.appendChild(hata);
  const denetle = () => { const n = ta.value.trim().length;
    say.textContent = 'en az 10 karakter · şu an ' + n;
    ona.disabled = n < 10; };
  ta.oninput = denetle; denetle();
  document.body.appendChild(d); d.showModal(); ta.focus();
  const kapat = () => { d.close(); d.remove(); };
  vaz.onclick = kapat;
  d.addEventListener('cancel', e => { e.preventDefault(); kapat(); });
  ona.onclick = async () => {
    ona.disabled = true; ona.textContent = 'Siliniyor...';
    const { error } = await sb.rpc('rpc_maden_odeme_sil',
      { p_id: o.id, p_neden: ta.value.trim() });
    if (error){ ona.disabled = false; ona.textContent = 'Sil';
                hata.hidden = false; hata.textContent = hataTr(error.message); return; }
    kapat();
    await madenTazele();
    mesaj('madenMsg','ok', trGun(o.tarih) + ' tarihli ödeme silindi · '
      + gramYaz(o.gram) + ' borca geri eklendi.');
  };
}

async function madenSil(m, acan, deger){
  pasifeAlAc(acan, { tur:'Maden borcu', ad: turAdi(m.tur) + ' · ' + trGun(m.tarih),
    kim: m.saflik ? 'saflık ' + m.saflik : null, tutar: deger || null,
    uygula: (neden) => pasifeAlUygula(
      () => sb.rpc('rpc_maden_pasife_al',{p_maden:m.id,p_neden:neden}),
      async () => { await madenTazele(); mesaj('madenMsg','ok','Maden borcu silindi.'); },
      'maden')});
}

/* ================== 4 · SAHIS ================== */
/* ⚠ AN-A · LISTE -> KUTU -> DETAY. Onceki hal dokuz hesabin hareketlerini
   ALT ALTA aciyordu: tek ekranda dokuz tablo, aradigini bulmak imkansiz.
   Desen ICAT EDILMEDI — Krediler (taksitEkraniAc) ve Kartlar (kartDetayAc)
   bunu zaten yapiyordu; ayni yapi kopyalandi.
   ⚠ SAHIS_DETAY: eylemler basarinca `vSahis()` cagiriyordu; detaydan
   yapilan bir odeme kullaniciyi LISTEYE atardi. Tazeleme tek yerden
   gecirildi ve nerede oldugunu biliyor. */
let SAHIS_DETAY = null;
async function sahisTazele(){ return SAHIS_DETAY ? sahisDetayAc(SAHIS_DETAY, true) : vSahis(); }

async function vSahis(){
  SAHIS_DETAY = null;
  const c = document.getElementById('icerik');
  const v = await bantVerisi();
  const { hesaplar, borclar, odemeler } = v.sahis;
  const borcGrup = new Map(), odemeGrup = new Map();
  for (const b of borclar){
    if (!borcGrup.has(b.hesap_id)) borcGrup.set(b.hesap_id, []);
    borcGrup.get(b.hesap_id).push(b);
  }
  for (const o of odemeler){
    if (!odemeGrup.has(o.hesap_id)) odemeGrup.set(o.hesap_id, []);
    odemeGrup.get(o.hesap_id).push(o);
  }
  /* v100 · hangi odemeler iptal EDILMIS — hedef id kumesi. */
  const TERSLENEN = new Set(odemeler.filter(o => o.tur === 'ters').map(o => o.ters_hedef_id));
  c.textContent = '';
  c.appendChild(ozetCiz(v,'sahis'));
  const msg = el('div','msg'); msg.id = 'sahisMsg'; c.appendChild(msg);

  const k = el('div','kart');
  k.appendChild(el('div','kbaslik','Borç hesapları'));
  if (!hesaplar.length) k.appendChild(el('div','bos','Kayıtlı borç hesabı yok.'));

  for (const h of hesaplar){
    const hb = borcGrup.get(h.hesap_id) || [], ho = odemeGrup.get(h.hesap_id) || [];
    const kalan = kr(h.bakiye);
    const kutu = el('div','tk'); kutu.style.cursor = 'pointer';
    /* tabindex: kutu <div>; geri donunce ODAGI buraya vermek icin gerekli.
       -1 oldugu icin sekme sirasina GIRMEZ, mevcut klavye akisi degismez. */
    kutu.dataset.hesap = h.hesap_id;
    kutu.onclick = () => sahisDetayAc(h.hesap_id);
    kutuErisim(kutu, h.ad + ', kalan ' + tlk(kalan) + ', detayı aç');
    const ust = el('div','tk-ust');
    const ad = el('div','tk-ad',h.ad); ad.appendChild(el('span','rozet '+(h.tur==='diger'?'rz-ltd':'rz-sahis'),h.tur==='diger'?'DİĞER':'KİŞİ'));
    ust.appendChild(ad);
    ust.appendChild(el('div','tk-tutar', tlk(kalan)));
    kutu.appendChild(ust);
    /* ⚠ v100 · SAYIM iptal edilenleri ve iptal KAYITLARINI saymaz.
       Ham satir sayisi "2 ödeme" derken bakiye "0 ödeme" diyordu —
       ayni ekranda iki farkli hakikat. Kural gorunumdekiyle AYNI.
       ⚠ "toplam borç / ödenen" DETAYA tasindi — burada en buyuk rakam
       KALAN BAKIYE olmali, uc rakam yan yana durunca hangisinin onemli
       oldugu kayboluyordu. Deger kaybolmadi, yer degistirdi. */
    const gercekOdeme = ho.filter(o => o.tur !== 'ters' && !TERSLENEN.has(o.id));
    const sonTarih = [...hb, ...ho].map(x => x.tarih).sort().pop();
    kutu.appendChild(el('div','tk-orta',
      hb.length + ' borç · ' + gercekOdeme.length + ' ödeme'
      + (sonTarih ? ' · son hareket ' + trGun(sonTarih) : ' · hareket yok')));
    if (h.aciklama) kutu.appendChild(el('div','kucuk',h.aciklama));
    k.appendChild(kutu);
  }
  c.appendChild(k);

  const f = el('div','kart');
  sahisBorcFormu(f, hesaplar);
  c.appendChild(f);
}

/* ---------- tek hesabin hareket dokumu ---------- */
async function sahisDetayAc(hesapId, sessiz){
  seritiHizala();          // AN-C · ekranAc'tan gecmiyor, serit kaymis kalirdi
  const c = document.getElementById('icerik');
  if (!sessiz){ c.textContent = ''; c.appendChild(el('div','bos','Yükleniyor...')); }
  try{
    const { hesaplar, borclar, odemeler } = await sahisGetir();
    const h = hesaplar.find(x => x.hesap_id === hesapId);
    if (!h){ c.textContent=''; c.appendChild(el('div','uyari-agir','Borç hesabı bulunamadı.')); return; }
    SAHIS_DETAY = hesapId;
    const hb = borclar.filter(b => b.hesap_id === hesapId);
    const ho = odemeler.filter(o => o.hesap_id === hesapId);
    const TERSLENEN = new Set(odemeler.filter(o => o.tur === 'ters').map(o => o.ters_hedef_id));
    const kalan = kr(h.bakiye);

    c.textContent = '';
    const geri = el('button','btn2','← Hesaplara dön');
    geri.onclick = async () => {
      SAHIS_DETAY = null;
      await ekranAc('sahis');
      const kutu = document.querySelector('#icerik .tk[data-hesap="' + hesapId + '"]');
      if (kutu) kutu.focus();          // odak ACAN kutuya doner, <body>'ye dusmez
    };
    c.appendChild(geri);

    const bas = el('div','kart');
    const bl = el('div','kbaslik');
    bl.tabIndex = -1;                  // detay acilinca odak BASLIGA
    bl.appendChild(el('span', null, h.ad));
    bl.appendChild(document.createTextNode(' '));
    bl.appendChild(el('span','rozet '+(h.tur==='diger'?'rz-ltd':'rz-sahis'), h.tur==='diger'?'DİĞER':'KİŞİ'));
    bas.appendChild(bl);
    const sat = (e2,d2) => { const s = el('div','satir');
      s.appendChild(el('span','et', e2)); s.appendChild(el('span','dg', d2)); bas.appendChild(s); };
    const gercekOdeme = ho.filter(o => o.tur !== 'ters' && !TERSLENEN.has(o.id));
    sat('Kalan bakiye', tlk(kalan));
    sat('Toplam borç', tlk(kr(h.borc_toplam)));
    /* BN · "Ödenen" yalin etiketi ekranda tek ada indirildi; sahis borcuna
       yapilan odemeler senin odemelerin — "Ödediğim". Alan adi degismedi. */
    sat('Ödediğim', tlk(kr(h.odeme_toplam)));
    sat('Hareket', hb.length + ' borç / ' + gercekOdeme.length + ' ödeme');
    if (h.aciklama) bas.appendChild(el('div','kucuk', h.aciklama));
    const ey = el('div','tk-eylem');
    const bo = el('button','btn2','Ödeme ekle'); bo.disabled = kalan<=0;
    bo.onclick = () => sahisOdemeAc(h, bo);
    /* ⚠ YENI FORM YAZILMIYOR: borc formu LISTE ekraninin dibinde duruyor
       ve oraya goturuluyor — sahisBorcFormunaGit'in kalibinin aynisi.
       Ikinci bir kopya iki dogrulama ve iki hata yolu demekti. */
    const bb = el('button','btn2','Borç ekle');
    bb.onclick = async () => { SAHIS_DETAY = null; await ekranAc('sahis'); sahisBorcFormunaGit(h.hesap_id); };
    ey.appendChild(bo); ey.appendChild(bb);
    bas.appendChild(ey);
    c.appendChild(bas);

    const msg = el('div','msg'); msg.id = 'sahisMsg'; c.appendChild(msg);

    const k = el('div','kart');
    k.appendChild(el('div','kbaslik','Hareketler'));
    const hareketler = [
      ...hb.map(x => ({...x,_tur:'borc'})),
      ...ho.map(x => ({...x,_tur:'odeme'}))
    ].sort((a,b) => b.tarih.localeCompare(a.tarih));
    if (hareketler.length){
      const sar = el('div','tablo-sar');
      const t = document.createElement('table');
      const hr = document.createElement('tr');
      ['TARİH','HAREKET','TUTAR','AÇIKLAMA','BELGE',''].forEach((x,i) => hr.appendChild(el('th', i===2?'sag':null, x)));
      t.appendChild(hr);
      for (const x of hareketler){
        const tr = document.createElement('tr');
        /* ⚠ v100 · UC HAL: normal odeme · IPTAL EDILMIS odeme · IPTAL KAYDI.
           Iptal edilen odeme LISTEDE KALIR — gizlemek silmekle ayni sonucu
           verirdi. Isaret RENKLE DEGIL: ustu cizili + METIN etiketi. */
        const iptalKaydi  = x._tur==='odeme' && x.tur==='ters';
        const iptalEdildi = x._tur==='odeme' && x.tur!=='ters' && TERSLENEN.has(x.id);
        if (iptalEdildi) tr.classList.add('iptalli');
        tr.appendChild(td(trGun(x.tarih)));
        const hc = document.createElement('td');
        hc.appendChild(document.createTextNode(
          x._tur==='borc' ? 'Borç' : iptalKaydi ? 'İptal' : 'Ödeme'));
        if (iptalEdildi) hc.appendChild(el('span','rozet rz-eksik','İPTAL EDİLDİ'));
        tr.appendChild(hc);
        /* Iptal kaydi bakiyeyi ARTIRIR — isareti borc gibi '+'. */
        tr.appendChild(td(((x._tur==='borc'||iptalKaydi)?'+ ':'− ')+tl(x.tutar),'sag'));
        tr.appendChild(td(x.aciklama||'—'));
        const dk = document.createElement('td');
        if (x._tur==='odeme' && x.foto_path){
          const a = el('button','btn-mini','Aç');
          a.onclick = () => belgeAc(x.foto_path,'sahisMsg');
          dk.appendChild(a);
        } else { dk.appendChild(el('span','gri',x._tur==='odeme'?'belge yok':'—')); }
        tr.appendChild(dk);
        const ey = document.createElement('td');
        if (x._tur==='odeme'){
          const bd = el('button','btn-mini', x.foto_path ? 'Değiştir' : '+ Belge');
          bd.onclick = () => dekontEkle('sahis_odeme', x.id, 'sahis_odeme','sahisMsg', !!x.foto_path, () => sahisTazele());
          ey.appendChild(bd);
          /* ⚠ Eylem YALNIZ normal ve HENUZ iptal edilmemis odemede. Iptal
             kaydinin kendisinde ve iptal edilmis odemede YOK — sunucu da
             TERSIN_TERSI_YOK / ZATEN_TERS ile reddediyor, istemci ONCEDEN
             engelliyor. */
          if (!iptalKaydi && !iptalEdildi)
            ey.appendChild(digerMenu([['Ödemeyi iptal et', (a) => sahisOdemeIptalAc(x, a)]]));
        } else {
          ey.appendChild(digerMenu([['Borç hareketini sil',(a) => sahisBorcSil(x,a)]]));
        }
        tr.appendChild(ey);
        t.appendChild(tr);
      }
      sar.appendChild(t); k.appendChild(sar);
    } else {
      k.appendChild(el('div','bos','Bu hesapta henüz hareket yok.'));
    }
    c.appendChild(k);
    bl.focus();                         // AN-C · detay acilinca odak BASLIGA
  }catch(e){
    c.textContent = '';
    c.appendChild(el('div','uyari-agir','Hesap açılamadı: ' + hataTr(e && e.message)));
  }
}

/* Borc hareketi formu — LISTE ekraninin dibinde, TEK kopya. */
function sahisBorcFormu(f, hesaplar){
  f.appendChild(el('div','kbaslik','Borç hareketi ekle'));
  const ekle = (etiket,id,tip,mod) => {
    f.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input'); i.id = id; i.type = tip || 'text';
    if (mod) i.setAttribute('inputmode', mod);
    f.appendChild(i); return i;
  };
  f.appendChild(el('label',null,'Borç hesabı')).setAttribute('for','sbHesap');
  const hs = document.createElement('select'); hs.id='sbHesap';
  hs.appendChild(new Option('— yeni hesap oluştur —',''));
  for (const h of hesaplar) hs.appendChild(new Option(h.ad,h.hesap_id));
  f.appendChild(hs);
  const yeniAd = ekle('Yeni hesap adı','sbYeniAd','text');
  f.appendChild(el('label',null,'Yeni hesap türü')).setAttribute('for','sbYeniTur');
  const yeniTur = document.createElement('select'); yeniTur.id='sbYeniTur';
  yeniTur.appendChild(new Option('Kişi','kisi')); yeniTur.appendChild(new Option('Diğer yükümlülük','diger')); f.appendChild(yeniTur);
  const yeniDurum = () => { const yeni=!hs.value; yeniAd.disabled=!yeni; yeniTur.disabled=!yeni; };
  hs.onchange=yeniDurum; yeniDurum();
  ekle('Tutar','sbTutar','text','decimal');
  paraBaglaHepsi(f, ['sbTutar']);          /* CO */
  ekle('Tarih','sbTarih','date').value = bugun();
  f.appendChild(el('label', null, 'Açıklama')).setAttribute('for','sbAciklama');
  const ta = document.createElement('textarea'); ta.id = 'sbAciklama'; f.appendChild(ta);
  const bk = el('button','btn','Borcu kaydet'); bk.id = 'sbKaydet'; bk.onclick = sahisBorcKaydet;
  /* ⚠ IDEMPOTENCY ANAHTARI FORM CIZILIRKEN BIR KEZ URETILIYOR — odeme
     formundaki kalibin ayni. Gonderim aninda uretilseydi: kayit gitti,
     ag koptu, kullanici sonucu bilmeden tekrar denedi -> YENI anahtar
     -> IKI BORC KAYDI. Sunucunun mukerrer korumasi ancak AYNI anahtar
     gelirse devreye girer. Anahtar DUGMEYE bagli: hata yolunda form
     yeniden cizilmedigi icin ayni dugme ve AYNI anahtar kalir; basaridan
     sonra vSahis() formu yeniden cizer ve YENI anahtar uretilir. */
  bk.dataset.idem = crypto.randomUUID();
  f.appendChild(bk);
}

/* ⚠ YENI FORM YAZILMIYOR — sayfanin dibindeki MEVCUT forma goturuluyor.
   Ayni formun ikinci bir kopyasi iki dogrulama ve iki hata yolu demekti;
   sikayet formun kendisi degil, BULUNAMAMASIYDI. */
function sahisBorcFormunaGit(hesapId){
  const hs = document.getElementById('sbHesap'); if (!hs) return;
  hs.value = hesapId;
  /* ⚠ Programatik secim `change` uretmez: elle atesle, yoksa yeniDurum()
     kosmaz ve "Yeni hesap adı/türü" alanlari ACIK kalir. */
  hs.dispatchEvent(new Event('change', { bubbles:true }));
  (hs.closest('.kart') || hs).scrollIntoView({ behavior:'smooth', block:'center' });
  const tut = document.getElementById('sbTutar');
  if (tut) tut.focus({ preventScroll:true });   // odak kendi kaydirmasiyla yumusak kaydirmayi bozmasin
}

async function sahisBorcKaydet(){
  mesajTemizle('sahisMsg');
  const btn = document.getElementById('sbKaydet');
  const hesap = document.getElementById('sbHesap').value || null;
  const yeniAd = document.getElementById('sbYeniAd').value.trim() || null;
  const yeniTur = document.getElementById('sbYeniTur').value;
  const tarih = document.getElementById('sbTarih').value;
  const tut = paraCoz(document.getElementById('sbTutar').value);
  if (!hesap && !yeniAd) return mesaj('sahisMsg','hata','Mevcut bir hesap seç veya yeni hesap adı yaz.');
  if (!tarih) return mesaj('sahisMsg','hata','Tarih zorunlu.');
  if (!tut.ok) return mesaj('sahisMsg','hata','Tutar: ' + tut.hata);
  if (tut.kurus <= 0) return mesaj('sahisMsg','hata','Tutar sıfırdan büyük olmalı.');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.rpc('rpc_sahis_borc_kaydet',{
    p_idem:btn.dataset.idem, p_hesap:hesap, p_yeni_ad:yeniAd,
    p_yeni_tur:hesap?null:yeniTur, p_tarih:tarih,
    p_tutar:(tut.kurus/100).toFixed(2),
    p_aciklama:document.getElementById('sbAciklama').value.trim() || null });
  btn.disabled = false; btn.textContent = 'Borcu kaydet';
  if (error){ hataYaz('sahisMsg','Borç kaydedilemedi.', error); return; }
  await sahisTazele();                              // once tazele: #sahisMsg SIFIRDAN yaratilir
  mesaj('sahisMsg','ok','Borç kaydedildi.');        // sonra yaz, yoksa mesaj SILINIRDI
}

/* ⚠ IKI PROMPT KUTUSU KALDIRILDI. Mekanik pasifeAlAc'tan KOPYALANDI —
   ortak yardimci cikarmak pasifeAlAc'in kanitlanmis davranisini riske
   atardi. Yedi guvenlik ozelliginin hepsi burada da var. */
/* ===== v100 · ODEME IPTALI · TEK PENCERE =====
   ⚠ Mekanik pasifeAlAc/sahisOdemeAc'tan KOPYALANDI.
   ⚠ YAZI TIPI KELIME (ARSIV gibi) ISTENMIYOR: o, geri donulemez arsivleme
     icin. Burada veri KAYBOLMUYOR — odeme yerinde kalir, yanina iptal
     kaydi yazilir. Koruma gerekce zorunlulugu + varsayilan Vazgec.
   ⚠ Varsayilan odak VAZGEC'te: bu islem BAKIYEYI degistiriyor.
   ⚠ IDEM ANAHTARI FORM BASINA — cagri basina degil. Bu hatayi projede
     iki kez yaptik: hata sonrasi tekrar denemede anahtar AYNI kalmali,
     yoksa sunucunun mukerrer korumasi devreye GIRMEZ. */
function sahisOdemeIptalAc(odeme, acan){
  let n = 0; const kimlik = (e) => (e.id = 'oi' + (++n));
  const d = document.createElement('dialog'); d.className = 'pm';
  d.setAttribute('aria-modal','true');
  const bas = el('div','pm-bas','⚠ Ödeme iptal edilecek'); kimlik(bas);
  d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
  /* AC-06 · kaydin TARIHI ve TUTARI acikca gorunur. */
  const ad = el('div','pm-ad', trGun(odeme.tarih) + ' tarihli ödeme'); kimlik(ad);
  const tut = el('div','pm-tutar', tlk(kr(odeme.tutar))); kimlik(tut);
  d.appendChild(ad); d.appendChild(tut);
  const etki = el('div','pm-etki',
    'Bu ödeme iptal edilecek. Silinmez — yanına iptal kaydı yazılır, ikisi de listede kalır.');
  kimlik(etki); d.setAttribute('aria-describedby', etki.id); d.appendChild(etki);
  const l = el('label', null, 'Gerekçe (en az 10 karakter)');
  const ta = document.createElement('textarea'); kimlik(ta); ta.rows = 3;
  l.setAttribute('for', ta.id);
  const sayac = el('div','pm-sayac'); kimlik(sayac);
  ta.setAttribute('aria-describedby', sayac.id);
  d.appendChild(l); d.appendChild(ta); d.appendChild(sayac);
  const ey = el('div','pm-ey');
  const vaz = el('button','btn2','Vazgeç'), kap = el('button','btn-kirmizi','İptal kaydı at');
  vaz.type = kap.type = 'button'; kap.disabled = true;
  kap.dataset.idem = crypto.randomUUID();          // FORM BASINA BIR KEZ
  ey.appendChild(vaz); ey.appendChild(kap); d.appendChild(ey);   // Vazgec SOLDA
  const hataK = el('div','uyari-agir'); hataK.hidden = true; kimlik(hataK);
  kap.setAttribute('aria-describedby', hataK.id); d.appendChild(hataK);
  document.body.appendChild(d); d.showModal(); vaz.focus();       // varsayilan GUVENLI taraf

  const denetle = () => { const c = ta.value.trim().length;
    sayac.textContent = 'en az 10 karakter · şu an ' + c;
    kap.disabled = c < 10; };
  ta.oninput = denetle; denetle();

  let isleniyor = false;
  const kapat = () => {
    if (isleniyor) return;                        // istek surerken kapanmaz
    d.close(); d.remove();
    if (acan && acan.isConnected && acan.focus) acan.focus();
    else { const h = document.querySelector('#bolumSerit button.aktif'); if (h) h.focus(); }
  };
  vaz.onclick = () => kapat();
  d.addEventListener('cancel', e => { e.preventDefault(); kapat(); });
  d.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ e.preventDefault(); kapat(); return; }
    if (e.key !== 'Tab') return;                  // odak tuzagi
    const od = [...d.querySelectorAll('textarea,button')].filter(x => !x.disabled);
    if (!od.length) return;
    const i = od.indexOf(document.activeElement); e.preventDefault();
    od[(i + (e.shiftKey ? -1 : 1) + od.length) % od.length].focus();
  });
  kap.onclick = async () => {
    if (isleniyor || kap.disabled) return;        // cift tiklama TEK istek
    isleniyor = true; kap.disabled = vaz.disabled = ta.disabled = true;
    d.tabIndex = -1; d.focus(); kap.textContent = 'İşleniyor...'; hataK.hidden = true;
    const { error } = await sb.rpc('rpc_sahis_odeme_ters_kayit',
      { p_idem: kap.dataset.idem, p_odeme: odeme.id, p_neden: ta.value.trim() });
    isleniyor = false;
    if (error){
      /* Hata yolunda form KORUNUR ve anahtar AYNI kalir — tekrar denenebilir. */
      hataK.hidden = false;
      hataK.textContent = hataTr([error.message,error.details,error.hint].filter(Boolean).join('\n'));
      vaz.disabled = ta.disabled = false; kap.textContent = 'İptal kaydı at'; denetle();
      return;
    }
    kapat();
    await sahisTazele();                          // AN · detaydaysak DETAY tazelenir, liste degil
    /* ⚠ ODAK IKI KEZ TASINIR. kapat() odagi ACAN dugmeye verir, ama vSahis()
       ekrani yeniden cizince o dugme DOM'dan kopar ve odak <body>'ye duser —
       olculdu. Yenilemeden SONRA kalici bir ogeye tasiniyor. */
    const h = document.querySelector('#bolumSerit button.aktif')
           || document.querySelector('#bolumSerit button');
    if (h) h.focus();
    mesaj('sahisMsg','ok','Ödeme iptal edildi. Ödeme ve iptal kaydı listede duruyor.');
  };
}
function sahisOdemeAc(hesap, acan){
  const kalanK = kr(hesap.bakiye);
  /* ⚠ IDEMPOTENCY ANAHTARI FORM BASINA BIR KEZ URETILIYOR.
     Onceki hal anahtari cagrinin ICINDE uretiyordu: odeme gonderildi,
     ag koptu, kullanici sonucu bilmeden tekrar denedi -> YENI anahtar
     -> IKI ODEME KAYDI. Sunucunun mukerrer korumasi ancak AYNI anahtar
     gelirse devreye girer. Hata sonrasi tekrar denemede bu anahtar
     AYNI kalir; yeni anahtar yalnizca form YENIDEN acilinca uretilir. */
  const idem = crypto.randomUUID();

  let n = 0; const kimlik = (e) => (e.id = 'so' + (++n));
  const d = document.createElement('dialog'); d.className = 'pm';   // gercek <dialog>
  d.setAttribute('aria-modal','true');
  const bas = el('div','pm-ad', hesap.ad + ' · ödeme'); kimlik(bas);
  d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
  /* ⚠ BAKIYE ZORUNLU GORUNUR: sunucu fazla odemeyi reddediyor, kullanici
     siniri ONCEDEN gormeli — deneme yanilmaya girmemeli. */
  const bak = el('div','pm-tutar','Kalan bakiye: ' + tlk(kalanK)); kimlik(bak);
  d.setAttribute('aria-describedby', bak.id); d.appendChild(bak);

  const alan = (etiket, tag, tip) => {
    const g = document.createElement(tag); kimlik(g);
    if (tip) g.type = tip;
    const l = el('label', null, etiket); l.setAttribute('for', g.id);
    const h = el('div','pm-hata'); kimlik(h); h.hidden = true;
    g.setAttribute('aria-describedby', h.id);
    d.appendChild(l); d.appendChild(g); d.appendChild(h);
    return [g, h];
  };
  const [tut, tutH] = alan('Tutar (zorunlu)','input'); tut.inputMode = 'decimal';
  paraBagla(tut);                         /* CO */
  const [trh, trhH] = alan('Tarih (zorunlu)','input','date'); trh.value = bugun();
  const [acx]       = alan('Açıklama (isteğe bağlı)','textarea'); acx.rows = 2;

  const ey = el('div','pm-ey');
  const vaz = el('button','btn2','Vazgeç'), kay = el('button','btn','Ödemeyi kaydet');
  vaz.type = kay.type = 'button'; kay.disabled = true;
  ey.appendChild(vaz); ey.appendChild(kay);                 // Vazgec SOLDA
  const hataK = el('div','uyari-agir'); hataK.hidden = true; kimlik(hataK);
  kay.setAttribute('aria-describedby', hataK.id);
  d.appendChild(ey); d.appendChild(hataK);
  document.body.appendChild(d); d.showModal();

  /* Istemci dogrulamasi sunucuyu TEKRARLAMAK icin degil, kullaniciyi
     ERKEN uyarmak icin. Sunucu reddederse hata yine gosterilir. */
  const denetle = () => {
    const p = paraCoz(tut.value), gecerli = p.ok && p.kurus > 0;
    const asiyor = gecerli && p.kurus > kalanK;
    tutH.hidden = !(tut.value.trim() && (!gecerli || asiyor));
    tutH.textContent = asiyor ? 'Bakiyeyi aşıyor — en çok ' + tlk(kalanK) + ' ödenebilir.'
                              : 'Tutar geçersiz.';
    trhH.hidden = !!trh.value; trhH.textContent = 'Tarih zorunlu.';
    kay.disabled = !(gecerli && !asiyor && trh.value);
  };
  tut.oninput = trh.oninput = trh.onchange = denetle;
  tut.onkeydown = (e) => { if (e.key === 'Enter') e.preventDefault(); };

  let isleniyor = false;            // kapat() bunu okur, kapat'tan ONCE tanimli
  const kapat = (uyari) => {
    /* ⚠ ISLEM SURERKEN KAPANMAZ — kapanirsa kullanici iptal ettigini
       sanir ama istek tamamlanir: sessiz finansal degisiklik. */
    if (isleniyor) return;
    d.close(); d.remove();
    if (acan && acan.isConnected) acan.focus();
    else {
      const hedef = document.querySelector('#bolumSerit button.aktif')
                 || document.querySelector('#bolumSerit button');
      if (hedef) hedef.focus();
    }
    const gercekUyari = (typeof uyari === 'string' && uyari.trim()) ? uyari.trim() : null;
    if (gercekUyari){
      const c = document.getElementById('icerik');
      if (c){
        c.querySelectorAll('.so-sonuc').forEach(x => x.remove());
        const b = el('div','uyari-agir so-sonuc'); b.setAttribute('role','alert');
        b.textContent = gercekUyari; c.prepend(b);
      }
    }
  };
  vaz.onclick = () => kapat();                    // olay nesnesi GECMEZ
  /* ⚠ ESCAPE ELDE: bu Chromium'da <dialog>'un yerel `cancel` olayi
     Escape'te ATESLENMIYOR (olculdu). Ikisi de dinleniyor. */
  d.addEventListener('cancel', (e) => { e.preventDefault(); kapat(); });
  d.addEventListener('keydown', (e) => {
    if (e.key === 'Escape'){ e.preventDefault(); kapat(); return; }
    if (e.key !== 'Tab') return;                  // odak tuzagi
    const od = [...d.querySelectorAll('textarea,input,button')].filter(x => !x.disabled);
    if (!od.length) return;                       // ⚠ hepsi disabled iken od[NaN] TypeError
    const i = od.indexOf(document.activeElement); e.preventDefault();
    od[(i + (e.shiftKey ? -1 : 1) + od.length) % od.length].focus();
  });

  kay.onclick = async () => {
    if (isleniyor || kay.disabled) return;        // cift tiklama TEK mutation
    isleniyor = true;
    kay.disabled = vaz.disabled = tut.disabled = trh.disabled = acx.disabled = true;
    d.tabIndex = -1; d.focus();   // ⚠ ayni sebep: kontroller disabled olunca odak <body>'ye dusuyordu
    kay.textContent = 'İşleniyor...'; hataK.hidden = true;
    let s = null;
    try { s = await sahisOdemeUygula(idem, hesap, paraCoz(tut.value).kurus, trh.value, acx.value.trim()); }
    catch(e){ console.error('sahis odeme', e);
              s = { ok:false, mesaj:'Beklenmeyen hata — ayrıntı konsolda.' }; }
    finally {
      /* Hata yolunda form KORUNUR: yazilan tutar/tarih/aciklama silinmez. */
      isleniyor = false;
      vaz.disabled = tut.disabled = trh.disabled = acx.disabled = false;
      kay.textContent = 'Ödemeyi kaydet'; denetle();
    }
    if (s && s.ok){ kapat(s.uyari); return; }
    hataK.hidden = false; hataK.textContent = (s && s.mesaj) || 'İşlem tamamlanamadı.';
    tut.focus();
  };
  tut.focus();
  return { d, tut, trh, acx, vaz, kay, hataK, tutH, trhH, idem };
}

/* ⚠ IKI FAZ AYRI: mutation hatasi ile tazeleme hatasi AYNI SEY DEGIL.
   Tazeleme patlarsa odeme KAYDEDILMISTIR — "kaydedilemedi" DENMEZ. */
async function sahisOdemeUygula(idem, hesap, kurus, tarih, aciklama){
  try {
    const { error } = await sb.rpc('rpc_sahis_odeme_kaydet',{
      p_idem:idem, p_hesap:hesap.hesap_id, p_borc:null,
      p_tutar:(kurus/100).toFixed(2), p_tarih:tarih,
      p_foto:null, p_aciklama:aciklama || null });
    if (error){ console.error('sahis odeme mutation', error);
                return { ok:false, mesaj: hataTr(error.message) }; }
  } catch(e){ console.error('sahis odeme mutation', e);
              return { ok:false, mesaj: hataTr(e.message || String(e)) }; }
  try { await sahisTazele(); }
  catch(e){ console.error('sahis odeme tazeleme', e);
            return { ok:true, uyari:'Ödeme kaydedildi. Liste tazelenemedi — sayfayı yenileyin.' }; }
  mesaj('sahisMsg','ok','Ödeme kaydedildi. Belge eklemeyi unutma.');
  return { ok:true };
}

/* ================== 6 · CEK ================== */
/* ⚠ VERILEN cekler. Musteri ceki (alinan cek) YOK.
   ⚠ CEK_DETAY · maden/sahis ile ayni gerekce: detaydan yapilan islem
     kullaniciyi LISTEYE atmasin. */
let CEK_DETAY = null;
async function cekTazele(){ return CEK_DETAY ? cekDetayAc(CEK_DETAY, true) : vCek(); }

/* Form durumu EKRAN CIZIMLERI ARASINDA yasar: kullanici 20+ cegi arka
   arkaya giriyor ve her kayitta sahip/banka secimini yeniden yapmak
   istemiyor. Kaydetten sonra ekran YENIDEN CIZILMIYOR (mesaj kaybolmasin
   diye) ama arsivleme/odendi yollari ciziyor — o zaman da secim korunur. */
const CEK_FORM = { sahip:'ltd', banka:'' };

/* Son kullanilan bankalar — mevcut ceklerden turetilir, sabit liste YOK. */
function cekSonBankalar(cek){
  const gorulen = [];
  for (const c of [...cek.acik, ...cek.gecmis]){
    const b = String(c.banka || '').trim();
    if (b && !gorulen.some(x => x.toLocaleLowerCase('tr') === b.toLocaleLowerCase('tr')))
      gorulen.push(b);
    if (gorulen.length === 3) break;
  }
  return gorulen;
}

async function vCek(){
  CEK_DETAY = null;
  const c = document.getElementById('icerik');
  const v = await bantVerisi();
  const { acik, gecmis, hata } = v.cek;
  c.textContent = '';
  c.appendChild(ozetCiz(v,'cek'));
  const msg = el('div','msg'); msg.id = 'cekMsg'; c.appendChild(msg);

  /* ⚠ SORGU DUSTUYSE SESSIZ KALMA. Rakamlar 0 gorunur ve bu YANILTIR. */
  if (hata){
    const hk = el('div','kart');
    hk.appendChild(el('div','uyari-agir',
      'Çekler okunamadı: ' + hata + '\nAşağıdaki toplamlar çekleri İÇERMİYOR.'));
    c.appendChild(hk);
  }

  /* ---- a · TOPLAM ---- */
  const t = el('div','kart');
  t.appendChild(el('div','kbaslik','Açık çekler'));
  /* RAKAM ICERI, DURUM DISARI: buyuk rakam kutunun icinde, kirilimi altinda. */
  t.appendChild(el('div','cek-buyuk', tlk(v.cekToplam)));
  t.appendChild(el('div','cek-alt',
    acik.length + ' çek · Ltd ' + tk(v.cekLtd) + ' · şahıs ' + tk(v.cekSahis)));
  c.appendChild(t);

  /* ---- b · EN YAKIN VADE · hic acik cek yoksa CIZILMEZ ---- */
  if (acik.length){
    const gecen = acik.filter(x => x.gecikti);
    const yk = el('div','kart');
    if (gecen.length){
      /* Vadesi gecmis cek: para bugun cikmis olmaliydi. Once o. */
      const enEski = gecen[0];
      const u = el('div','uyari-agir');
      u.appendChild(el('div', null, gecen.length + ' çekin vadesi geçti'));
      u.appendChild(el('div', null, trGun(enEski.vade_tarihi) + ' · ' + enEski.banka
        + ' · ' + Math.abs(Number(enEski.kalan_gun)) + ' gün önce'));
      u.appendChild(el('div', null, tlk(kr(gecen.reduce((a,x) => a + Number(x.tutar), 0)))));
      yk.appendChild(u);
    }
    const yakin = acik.find(x => !x.gecikti);
    if (yakin){
      const u = el('div','uyari-orta');
      u.appendChild(el('div', null, 'En yakın · ' + trGun(yakin.vade_tarihi)));
      u.appendChild(el('div', null, yakin.banka + ' · ' + Number(yakin.kalan_gun) + ' gün'));
      u.appendChild(el('div', null, tlk(kr(yakin.tutar))));
      yk.appendChild(u);
    }
    if (yk.childNodes.length) c.appendChild(yk);
  }

  /* ---- c · LISTE · vade sirasiyla (gorunum zaten sirali) ---- */
  const lk = el('div','kart');
  lk.appendChild(el('div','kbaslik','Çekler (' + acik.length + ')'));
  if (!acik.length){
    lk.appendChild(el('div','bos','Açık çek yok. Aşağıdaki formdan ekle.'));
  } else {
    /* ⚠ DORTTEN FAZLASI KATLI. Brifte "Krediler kalibi" deniyordu ama
       Krediler'de boyle bir kisaltma YOK (arandi, bulunamadi); dosyada
       var olan katlama deseni ozetCiz'inki — hidden + aria-expanded.
       O kopyalandi, yenisi ICAT EDILMEDI. */
    const GORUNEN = 4;
    const ilk = acik.slice(0, GORUNEN), kalan = acik.slice(GORUNEN);
    const kutuCiz = (x, hedef) => {
      const kutu = el('div','tk'); kutu.style.cursor = 'pointer';
      kutu.dataset.cek = x.id;
      kutu.onclick = () => cekDetayAc(x.id);
      kutuErisim(kutu, x.banka + ' çeki, vade ' + trGun(x.vade_tarihi)
        + ', ' + tlk(kr(x.tutar)) + (x.gecikti ? ', vadesi geçti' : '') + ', detayı aç');
      const ust = el('div','tk-ust');
      ust.appendChild(el('div','tk-ad', trGun(x.vade_tarihi) + ' · ' + x.banka));
      ust.appendChild(el('div','tk-tutar', tlk(kr(x.tutar))));
      kutu.appendChild(ust);
      /* ⚠ Ltd/Sahis ROZET DEGIL, duz metin (tasarim kurali 3). */
      const alt = [ (x.sahip === 'ltd' ? 'Ltd' : 'Şahıs'), x.kime ];
      if (!x.gecikti) alt.push(Number(x.kalan_gun) + ' gün');
      kutu.appendChild(el('div','tk-orta', alt.join(' · ')));
      /* ⚠ ROZET YALNIZ IS VARSA: 'vadesi gecti' rozet alir, 'bekliyor' ALMAZ. */
      if (x.gecikti){
        const r = el('div'); r.style.marginTop = '6px';
        r.appendChild(el('span','rozet rz-eksik','VADESİ GEÇTİ'));
        kutu.appendChild(r);
      }
      if (x.cek_no) kutu.appendChild(el('div','kucuk','çek no ' + x.cek_no));
      hedef.appendChild(kutu);
    };
    for (const x of ilk) kutuCiz(x, lk);
    if (kalan.length){
      const gizli = el('div'); gizli.hidden = true;
      const ac = el('button','btn2','+' + kalan.length + ' çek daha');
      ac.type = 'button'; ac.setAttribute('aria-expanded','false');
      ac.onclick = () => {
        if (!gizli.firstChild) for (const x of kalan) kutuCiz(x, gizli);
        gizli.hidden = !gizli.hidden;
        ac.setAttribute('aria-expanded', String(!gizli.hidden));
        ac.textContent = gizli.hidden ? '+' + kalan.length + ' çek daha' : 'kısalt';
      };
      lk.appendChild(ac); lk.appendChild(gizli);
    }
  }
  c.appendChild(lk);

  /* ---- d · ODENMIS/KARSILIKSIZ · katli, hic yoksa da GIZLENMEZ ---- */
  const gk = el('div','kart');
  const gecTop = gecmis.reduce((a,x) => a + kr(x.tutar), 0);
  gk.appendChild(el('div','kbaslik','Kapanmış çekler'));
  if (!gecmis.length){
    gk.appendChild(el('div','bos','Henüz yok.'));
  } else {
    const ozet = el('button','btn2', gecmis.length + ' çek kapandı · toplam ' + tlk(gecTop));
    ozet.type = 'button'; ozet.setAttribute('aria-expanded','false');
    const kutu = el('div'); kutu.hidden = true;
    ozet.onclick = () => {
      if (!kutu.firstChild) for (const x of gecmis){
        const s = el('div','satir');
        s.appendChild(el('span','et', trGun(x.vade_tarihi) + ' · ' + x.banka + ' · ' + x.kime));
        const sag = el('span','dg');
        sag.appendChild(el('span', null, tlk(kr(x.tutar)) + ' '));
        sag.appendChild(el('span','rozet ' + (x.durum === 'odendi' ? 'rz-yesil' : 'rz-eksik'),
          x.durum === 'odendi' ? 'ödendi ' + trGun(x.odendi_tarih) : 'KARŞILIKSIZ'));
        s.appendChild(sag); kutu.appendChild(s);
      }
      kutu.hidden = !kutu.hidden;
      ozet.setAttribute('aria-expanded', String(!kutu.hidden));
    };
    gk.appendChild(ozet); gk.appendChild(kutu);
  }
  c.appendChild(gk);

  /* ---- e · CEK EKLE ---- */
  c.appendChild(cekFormu(v));
}

/* ---------- cek ekle formu ---------- */
function cekFormu(v){
  const f = el('div','kart');
  f.appendChild(el('div','kbaslik','Çek ekle'));
  /* ⚠ BASARI MESAJI FORMUN USTUNDE ve KALIR. Kart tarafinda mesaj()
     sonrasi ekran yeniden ciziliyordu ve 'kaydedildi' HIC gorunmuyordu. */
  const fm = el('div','msg'); fm.id = 'cekFormMsg'; f.appendChild(fm);

  /* Kimin adina · IKI DUGME, select DEGIL: tek dokunus. */
  f.appendChild(el('label', null, 'Kimin adına'));
  const sg = el('div','cek-sec');
  const dugmeler = {};
  for (const [deger, ad] of [['ltd','Bardaks Ltd'], ['sahis','Şahıs']]){
    const b = el('button','cek-sec-b', ad); b.type = 'button';
    b.setAttribute('role','radio');
    b.onclick = () => { CEK_FORM.sahip = deger; guncelle(); };
    dugmeler[deger] = b; sg.appendChild(b);
  }
  sg.setAttribute('role','radiogroup');
  sg.setAttribute('aria-label','Kimin adına');
  const guncelle = () => {
    for (const d of Object.keys(dugmeler)){
      const secili = CEK_FORM.sahip === d;
      dugmeler[d].classList.toggle('secili', secili);
      /* ⚠ Secim RENKLE DEGIL, aria-checked + isaret ile de soyleniyor —
         renk tek basina bilgi tasimaz. */
      dugmeler[d].setAttribute('aria-checked', String(secili));
      dugmeler[d].textContent = (secili ? '✓ ' : '') + (d === 'ltd' ? 'Bardaks Ltd' : 'Şahıs');
    }
  };
  f.appendChild(sg);

  const alan = (etiket, id, tip, mod) => {
    f.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input'); i.id = id; i.type = tip || 'text';
    if (mod) i.setAttribute('inputmode', mod);
    f.appendChild(i); return i;
  };
  alan('Tutar','cTutar','text','decimal');
  paraBaglaHepsi(f, ['cTutar']);           /* CO */
  alan('Vade tarihi','cVade','date');
  const bankaG = alan('Banka','cBanka');
  bankaG.value = CEK_FORM.banka;

  /* son kullanilanlar — tiklaninca alani doldurur */
  const sonlar = cekSonBankalar(v.cek);
  if (sonlar.length){
    const sat = el('div','kucuk');
    sat.appendChild(document.createTextNode('son kullandıkların: '));
    sonlar.forEach((b, i) => {
      if (i) sat.appendChild(document.createTextNode(' · '));
      const d = el('button','baglanti', b); d.type = 'button';
      d.onclick = () => { bankaG.value = b; CEK_FORM.banka = b; bankaG.focus(); };
      sat.appendChild(d);
    });
    f.appendChild(sat);
  }

  alan('Kime verdim','cKime');
  const cn = alan('Çek no','cCekNo');
  cn.setAttribute('autocomplete','off');
  f.appendChild(el('div','kucuk','zorunlu değil'));

  const b = el('button','btn','Kaydet ve yenisini ekle');
  b.id = 'cKaydet'; b.onclick = cekKaydet;
  f.appendChild(b);

  /* ⚠ IKINCI CEK YUZEYI UYARISI. tedarikci_odeme.yontem='cek' bugun BOS
     (olculdu) ama ileride dolarsa ayni cek iki yerde durabilir. */
  f.appendChild(el('div','kucuk',
    'Tedarikçiye ödeme olarak verdiğin çeği Alış ekranından girdiysen buraya '
  + 'tekrar girme — iki yerde durur.'));

  guncelle();
  return f;
}

async function cekKaydet(){
  mesajTemizle('cekFormMsg');
  const btn = document.getElementById('cKaydet');
  const g = id => document.getElementById(id);
  const ham = g('cTutar').value.trim();

  /* ⚠ NEGATIF TUZAGI · paraCoz'un [^\d.,] suzgeci EKSI ISARETINI SILIYOR:
     '-5' sessizce 5,00 olur. Cekte bu, borcu ters yone yazmak demektir.
     HAM METINDE eksi varsa ACIKCA reddedilir — sessizce pozitife
     CEVRILMEZ. (Aynisi maden alis tutarinda da var ama orada 0 kontrolu
     yakaliyordu; burada yakalamiyor.) */
  if (/[-−]/.test(ham))
    return mesaj('cekFormMsg','hata','Çek tutarı eksi olamaz. Eksi işaretini kaldır.');
  const p = paraCoz(ham);
  if (!p.ok)        return mesaj('cekFormMsg','hata','Tutar: ' + p.hata);
  if (p.kurus <= 0) return mesaj('cekFormMsg','hata','Çek tutarı sıfırdan büyük olmalı.');

  const vade  = g('cVade').value;
  const banka = g('cBanka').value.trim();
  const kime  = g('cKime').value.trim();
  const cekNo = g('cCekNo').value.trim();
  if (!vade)  return mesaj('cekFormMsg','hata','Vade tarihi zorunlu.');
  if (!banka) return mesaj('cekFormMsg','hata','Banka boş bırakılamaz.');
  if (!kime)  return mesaj('cekFormMsg','hata','Çeği kime verdiğin boş bırakılamaz.');

  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('cek').insert({
    sahip: CEK_FORM.sahip, banka, cek_no: cekNo || null,
    vade_tarihi: vade, tutar: (p.kurus/100).toFixed(2), kime,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Kaydet ve yenisini ekle';
  if (error){ hataYaz('cekFormMsg','Çek eklenemedi.', error); return; }

  /* ⚠ EKRANI YENIDEN CIZME. Kart tarafinda bu yuzden 'kaydedildi' hic
     gorunmemisti. Form ELDE temizlenir; 'Kimin adina' ve 'Banka' KORUNUR
     — arka arkaya ayni bankanin cekleri giriliyor. */
  CEK_FORM.banka = banka;
  g('cTutar').value = ''; g('cVade').value = ''; g('cKime').value = ''; g('cCekNo').value = '';
  mesaj('cekFormMsg','ok', tlk(p.kurus) + ' çek kaydedildi. Yenisini girebilirsin.');
  g('cTutar').focus();
}

/* ---------- tek cekin kunyesi ---------- */
async function cekDetayAc(cekId, sessiz){
  seritiHizala();          // ekranAc'tan gecmiyor, serit kaymis kalirdi
  const c = document.getElementById('icerik');
  if (!sessiz){ c.textContent = ''; c.appendChild(el('div','bos','Yükleniyor...')); }
  try{
    const v = await bantVerisi();
    const x = [...v.cek.acik, ...v.cek.gecmis].find(y => y.id === cekId);
    if (!x){ c.textContent=''; c.appendChild(el('div','uyari-agir','Çek bulunamadı.')); return; }
    CEK_DETAY = cekId;

    c.textContent = '';
    const geri = el('button','btn2','← Çeklere dön');
    geri.onclick = async () => {
      CEK_DETAY = null;
      await ekranAc('cek');
      const kutu = document.querySelector('#icerik .tk[data-cek="' + cekId + '"]');
      if (kutu) kutu.focus();
    };
    c.appendChild(geri);

    const bas = el('div','kart');
    const bl = el('div','kbaslik', x.banka + ' · ' + tlk(kr(x.tutar)));
    bl.tabIndex = -1; bas.appendChild(bl);
    const sat = (e2, d2) => { const s = el('div','satir');
      s.appendChild(el('span','et', e2)); s.appendChild(el('span','dg', d2)); bas.appendChild(s); return s; };
    sat('Banka', x.banka);
    sat('Çek no', x.cek_no || '—');
    sat('Vade', trGun(x.vade_tarihi));
    sat('Tutar', tlk(kr(x.tutar)));
    sat('Kime', x.kime);
    sat('Kimin adına', x.sahip === 'ltd' ? 'Bardaks Ltd' : 'Şahıs');
    if (x.durum !== 'bekliyor')
      sat('Durum', x.durum === 'odendi' ? 'Ödendi · ' + trGun(x.odendi_tarih) : 'Karşılıksız');
    if (x.aciklama) bas.appendChild(el('div','kucuk', x.aciklama));

    const msg = el('div','msg'); msg.id = 'cekMsg';

    if (x.durum === 'bekliyor'){
      const ey = el('div','tk-eylem');
      const bo = el('button','btn2','Ödendi');
      bo.onclick = () => cekOdendiAc(x);
      ey.appendChild(bo);
      const bk = el('button','btn2','Karşılıksız');
      bk.onclick = () => cekKarsiliksiz(x);
      ey.appendChild(bk);
      ey.appendChild(digerMenu([['Çeği sil', (a) => cekSil(x, a)]]));
      bas.appendChild(ey);
    } else {
      const ey = el('div','tk-eylem');
      ey.appendChild(digerMenu([['Çeği sil', (a) => cekSil(x, a)]]));
      bas.appendChild(ey);
    }
    c.appendChild(bas);
    c.appendChild(msg);
  }catch(e){
    c.textContent = '';
    const k = el('div','kart');
    k.appendChild(el('div','uyari-agir','Çek açılamadı: ' + hataTr(e && e.message)));
    c.appendChild(k); console.error(e);
  }
}

/* ⚠ cek_odendi_chk IKI YONLU: durum='odendi' ise odendi_tarih ZORUNLU.
   Tarihsiz gonderilmez — sunucu zaten reddeder, ekran once sorar. */
function cekOdendiAc(x){
  const d = document.createElement('dialog'); d.className = 'pm';
  d.setAttribute('aria-modal','true');
  const bas = el('div','pm-bas'); bas.id = 'cekOdBas';
  bas.appendChild(document.createTextNode('Çek ödendi'));
  d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
  d.appendChild(el('div','pm-ad', x.banka + ' · ' + trGun(x.vade_tarihi)));
  d.appendChild(el('div','pm-tutar', tlk(kr(x.tutar))));
  const l = el('label', null, 'Ödeme tarihi (zorunlu)'); l.setAttribute('for','cOdTarih');
  const i = document.createElement('input'); i.id = 'cOdTarih'; i.type = 'date'; i.value = bugun();
  d.appendChild(l); d.appendChild(i);
  const h = el('div','pm-hata'); h.hidden = true; d.appendChild(h);
  const ey = el('div','pm-ey');
  const vaz = el('button','btn2','Vazgeç'), ona = el('button','btn','Ödendi olarak işaretle');
  vaz.type = ona.type = 'button';
  ey.appendChild(vaz); ey.appendChild(ona); d.appendChild(ey);
  document.body.appendChild(d); d.showModal();
  const kapat = () => { d.close(); d.remove(); };
  vaz.onclick = kapat;
  ona.onclick = async () => {
    if (!i.value){ h.hidden = false; h.textContent = 'Ödeme tarihi zorunlu.'; return; }
    ona.disabled = true; ona.textContent = 'İşleniyor...';
    const { error } = await sb.from('cek')
      .update({ durum:'odendi', odendi_tarih: i.value }).eq('id', x.id);
    if (error){ ona.disabled = false; ona.textContent = 'Ödendi olarak işaretle';
                h.hidden = false; h.textContent = hataTr(error.message); return; }
    kapat();
    await cekTazele();
    mesaj('cekMsg','ok','Çek ödendi olarak işaretlendi.');
  };
}

/* ⚠ KARSILIKSIZ · odendi_tarih BOS KALIR (cek_odendi_chk gerektiriyor). */
async function cekKarsiliksiz(x){
  if (!confirm('ÇEK KARŞILIKSIZ\n\n' + x.banka + ' · ' + tlk(kr(x.tutar))
    + '\n\nBorç açık kalır, çek listeden düşer.\nOnaylıyor musun?')) return;
  const { error } = await sb.from('cek')
    .update({ durum:'karsiliksiz', odendi_tarih: null }).eq('id', x.id);
  if (error){ hataYaz('cekMsg','Çek güncellenemedi.', error); return; }
  await cekTazele();
  mesaj('cekMsg','ok','Çek karşılıksız olarak işaretlendi.');
}

/* ⚠ DELETE YETKISI YOK — arsivleme is_deleted uzerinden, pasifeAlAc kalibi.
   RPC yazilmadi (kapsam disi): dogrudan UPDATE. Gerekce sunucu tarafinda
   ZORUNLU DEGIL, o yuzden ekran kendi zorunlulugunu pasifeAlAc ile koyuyor
   ve silme_nedeni alanina yaziyor. */
async function cekSil(x, acan){
  pasifeAlAc(acan, { tur:'Çek', ad: x.banka + ' · ' + trGun(x.vade_tarihi),
    kim: x.kime, tutar: tlk(kr(x.tutar)),
    uygula: (neden) => pasifeAlUygula(
      () => sb.from('cek').update({ is_deleted:true, silme_nedeni:neden }).eq('id', x.id),
      async () => { CEK_DETAY = null; await ekranAc('cek'); mesaj('cekMsg','ok','Çek silindi.'); },
      'cek')});
}

/* ================== ACILIS ================== */
sb.auth.onAuthStateChange((olay) => { if (olay === 'SIGNED_OUT') location.reload(); });
baslat().catch(e => {
  document.getElementById('girisEkran').classList.remove('gizli');
  mesaj('girisHata','hata','Açılış hatası: ' + hataTr(e && e.message));
});
