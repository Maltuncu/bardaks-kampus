        if (hamN !== deger){
          const alt = el('div','kucuk', 'PDF’te: ' + o.ham
            + ((o.kural || '').indexOf(EK_EKSI) >= 0 ? ' · eksi kaldırıldı' : ''));
          alt.style.marginTop = '2px';
          dh.appendChild(alt);
        }
      } else dh.textContent = o.ham;     // tarih ve metin alanlari: eskisi gibi
    }
    else if (o.durum === 'belirsiz') dh.appendChild(el('span','rozet rz-eksik','? BELİRSİZ'));
    else dh.appendChild(el('span','gri','—'));
    tr.appendChild(dh);
    const c3 = td(o.etiket ? '"' + o.etiket + '"' : '—');
    c3.dataset.et = 'KAYNAK ETİKET'; tr.appendChild(c3);
    const c4 = td((o.kural || '').replace(EK_EKSI, '')
      || (o.durum === 'belirsiz' ? 'birden çok etiket eşleşti' : 'bulunamadı'));
    /* ⚠ DF · BICIM CEVRILDIYSE HER OKUNAN ALANDA YAZAR. Kullanici
       rakami degil ESLESMEYI dogruluyor; rakamin bir donusumden
       gectigini bilmeli. Yalniz cevrilen belgede cikar. */
    if (a.bicimCevrildi && o.durum === 'ok'){
      const bn = el('div','kucuk','sayı biçimi çevrildi: 1,234.56 → 1.234,56');
      bn.style.marginTop = '2px';
      c4.appendChild(bn);
    }
    c4.dataset.et = 'NASIL BULUNDU'; tr.appendChild(c4);
    t.appendChild(tr);
  }
  sar.appendChild(t); k.appendChild(sar);

  /* D · ARITMETIK KAPISININ SONUCU GORUNUR */
  const kp = axKapi(a);
  if (kp.durum === 'tutuyor')
    k.appendChild(el('div','bilgi','✓ Ekstre kendi içinde tutarlı: '
      + tlk(a.devir.kurus) + ' + ' + tlk(a.yeni.kurus) + ' − ' + tlk(a.odenen.kurus)
      + ' = ' + tlk(a.hesapOzeti.kurus)));
  else if (kp.durum === 'tutmuyor')
    k.appendChild(el('div','uyari-agir','✗ Ekstre kendi içinde TUTMUYOR. '
      + 'devir + yeni − alacak kayıtları = ' + tlk(kp.sol) + ', ama hesap özeti borcu '
      + tlk(a.hesapOzeti.kurus) + '. Fark ' + tlk(Math.abs(kp.fark))
      + '. Dört rakamdan en az biri yanlış okundu — kaydetmeden önce ekstreden bak.'));
  else
    k.appendChild(el('div','uyari-agir','Denetim YAPILAMADI: ' + kp.eksik.join(', ')
      + ' okunamadı. Eksik alan sıfır SAYILMADI; denklem kurulmadı.'));

  /* ⚠ CF · OKUNAMAYAN IKILI ICIN GIRIS. Olculdu (gercek Maximiles):
     bu formatta OZET TABLOSU HIC BASILMIYOR — yeni ve odenen kagitta
     ayri ayri YAZMIYOR, okuyucunun bulamamasi DOGRU davranis. Ama
     devir ve hesap ozeti okunuyor ve denklem tek:
       devir + yeni − odenen = hesap özeti
     BIRI girilirse digeri CIKAR. Blok YALNIZ bu durumda cizilir
     (devir OK · hesapOzeti OK · yeni YOK · odenen YOK) — Ziraat/
     Enpara akisina girmez. Ikisi de bosken a'ya DOKUNULMAZ (bugunku
     kayit yolu aynen). Hesaplanan NEGATIFSE kaydetmek ENGELLENIR. */
  let cfNegatif = false;
  if (a.devir && a.devir.durum === 'ok' && a.hesapOzeti && a.hesapOzeti.durum === 'ok'
      && !(a.yeni && a.yeni.durum === 'ok') && !(a.odenen && a.odenen.durum === 'ok')){
    const eskiYeni = a.yeni, eskiOdenen = a.odenen;
    k.appendChild(el('div','bilgi','Bu ekstrede özet tablosu yok: dönem ödemesi ile yeni '
      + 'harcama ayrı yazmıyor. Birini ekstreden bul ve gir — diğerini denklemden ben çıkarırım. '
      + 'İkisini de boş bırakırsan bu iki alan kaydedilmez.'));
    /* ⚠ NEREYE BAKACAGINI SOYLE — ama ALANA YAZMA.
       ⚠ ZATEN OKUNAN RAKAM ISARETLENIR. Olculdu, iki dosyada da toplam
         satirinin sutunlari ARADIGIMIZ SEY DEGIL:
           Akbank  "Genel Toplam 151.370,32 · 17.560,00 · 79,02(-)"
           Maximum "TOPLAM 122.748,91 · 334,13 · 4,92"   (MaxiPuan/MaxiMil)
         ilk sutun iki dosyada da hesap ozeti borcu — yani zaten okundu.
         Isaretlenmezse kullanici puan sutununu para sanip yazabilir;
         "eslesen alan" etiketi bunu gorunur kiliyor. */
    const toplamlar = toplamIpucu || [];
    if (toplamlar.length){
      const OKUNAN = [['devir','devir'],['hesapOzeti','hesap özeti borcu'],
                      ['asgari','asgari tutar'],['limit','kart limiti']]
        .filter(p => a[p[0]] && a[p[0]].durum === 'ok')
        .map(p => [a[p[0]].kurus, p[1]]);
      const isaretle = (ham) => {
        const r = paraCoz(ham);
        if (!r.ok) return ham;
        const e = OKUNAN.find(o => o[0] === r.kurus);
        return ham + (e ? ' (= ' + e[1] + ', zaten okundu)' : '');
      };
      const ip = el('div','kucuk');
      ip.appendChild(el('div', null, 'Ekstrede okunabilen toplam satırı var:'));
      for (const t of toplamlar)
        ip.appendChild(el('div', null, '· ' + t.etiket + ' — '
          + t.tutarlar.map(isaretle).join(' · ')));
      ip.appendChild(el('div', null, 'Hangi sütunun ne olduğunu ekstre yazmıyor — '
        + 'işaretsiz kalanlar para bile olmayabilir (Maximum ekstresinde o sütunlar '
        + 'MaxiPuan). O yüzden kendiliğinden bir alana yazmıyorum; işine yarıyorsa '
        + 'yukarıdaki kutulara sen gir.'));
      k.appendChild(ip);
    }
    const alanCF = (etiket, id) => {
      k.appendChild(el('label', null, etiket)).setAttribute('for', id);
      const i = document.createElement('input');
      i.id = id; i.type = 'text'; i.setAttribute('inputmode','decimal');
      k.appendChild(i); return i;
    };
    const gOdenen = alanCF('Bu dönem yaptığın ödeme','cfOdenen');
    const gYeni   = alanCF('Yeni harcama','cfYeni');
    paraBaglaHepsi(k, ['cfOdenen','cfYeni']);        /* CO */
    const notCF = el('div','kucuk'); k.appendChild(notCF);
    const guncelle = (esas) => {
      cfNegatif = false;
      const ham = (esas === 'odenen' ? gOdenen : gYeni).value.trim();
      if (!ham){                          // bos: bugunku davranis geri gelir
        a.yeni = eskiYeni; a.odenen = eskiOdenen;
        notCF.textContent = ''; notCF.className = 'kucuk'; return;
      }
      const r = paraCoz(ham);
      if (!r.ok || r.kurus < 0){
        notCF.className = 'uyari-agir'; notCF.textContent = 'Tutar okunamadı: ' + (r.hata || ham);
        cfNegatif = true; a.yeni = eskiYeni; a.odenen = eskiOdenen; return;
      }
      /* devir + yeni − odenen = hesapOzeti */
      const dv = a.devir.kurus, ho = a.hesapOzeti.kurus;
      const girilen = { durum:'ok', kurus: r.kurus, ham: tk(r.kurus),
                        etiket:'elle girildi', kural:'elle girildi' };
      const hesap = esas === 'odenen' ? ho - dv + r.kurus : dv + r.kurus - ho;
      if (hesap < 0){
        cfNegatif = true; a.yeni = eskiYeni; a.odenen = eskiOdenen;
        notCF.className = 'uyari-agir';
        notCF.textContent = (esas === 'odenen' ? 'Yeni harcama' : 'Ödeme') + ' NEGATİF çıkıyor ('
          + tk(hesap) + '). Girdiğin tutar denklemle çelişiyor — böyle kaydedilmez.';
        return;
      }
      const cikan = { durum:'ok', kurus: hesap, ham: tk(hesap),
                      etiket:'denklemden çıkarıldı', kural:'denklemden çıkarıldı' };
      if (esas === 'odenen'){ a.odenen = girilen; a.yeni = cikan;
        gYeni.value = tk(hesap); }
      else { a.yeni = girilen; a.odenen = cikan;
        gOdenen.value = tk(hesap); }
      notCF.className = 'kucuk';
      notCF.textContent = (esas === 'odenen' ? 'Yeni harcama ' : 'Ödeme ') + tk(hesap)
        + ' — denklemden çıkarıldı: devir ' + tk(dv) + ' + yeni − ödeme = borç ' + tk(ho) + '.';
    };
    gOdenen.addEventListener('input', () => guncelle('odenen'));
    gYeni.addEventListener('input', () => guncelle('yeni'));
  }

  /* A · BU EKSTRE HANGI KARTA AIT? ONERILIR, SECILMEZ. */
  k.appendChild(el('label', null, 'Bu ekstre hangi karta ait?')).setAttribute('for','axKart');
  const sec = document.createElement('select'); sec.id = 'axKart';
  const bos = document.createElement('option'); bos.value = ''; bos.textContent = '— seç —';
  sec.appendChild(bos);
  /* ⚠ KENDILIGINDEN ESLESTIRME YOK. Ayni bankadan dort kart var; yanlis
     karta yazilan ekstre en zor fark edilen hatadir. Oneri ETIKETTE kalir. */
  const bankaSade = axSade(a.banka && a.banka.ham || '');
  const onerilen = v.kart.kartlar.filter(x => {
    const b = axSade(x.banka || ''); if (!b) return false;
    /* AZ · banka alan adindan bulunduysa oneri ANAHTARLA eslesir:
       axSade("Is Bankasi")="is bankasi" -> bosluksuz "isbankasi" icinde
       "isbank" ARANIR. Eski kelime eslesmesi alan adi bulunamayan
       dosyalar icin duruyor. */
    const adUyar = a.banka && a.banka.anahtar
      ? b.replace(/\s+/g,'').indexOf(a.banka.anahtar) >= 0
      : b.split(' ').some(w => w.length > 3 && bankaSade.indexOf(w) >= 0);
    const gunUyar = (a.kesim.durum === 'ok' && x.kesim_gunu === a.kesim.gun)
                 || (a.sonOdeme.durum === 'ok' && x.son_odeme_gunu === a.sonOdeme.gun);
    return adUyar && gunUyar;
  }).map(x => x.id);
  for (const x of v.kart.kartlar){
    const o = document.createElement('option'); o.value = x.id;
    o.textContent = x.ad + (x.banka ? ' · ' + x.banka : '')
      + (onerilen.indexOf(x.id) >= 0 ? '   ← önerilen' : '');
    sec.appendChild(o);
  }
  const yn = document.createElement('option'); yn.value = '__yeni';
  yn.textContent = '+ Yeni kart oluştur'; sec.appendChild(yn);
  k.appendChild(sec);
  k.appendChild(el('div','kucuk', onerilen.length
    ? onerilen.length + ' kart bankaya ve güne uyuyor, "← önerilen" diye işaretlendi — ama SEÇİLMEDİ. Seçimi sen yap.'
    : 'Hiçbir mevcut kart bankaya ve güne uymadı.'));

  /* B · YENI KART: okunanlar dolu, SAHIPLIK BOS VE ZORUNLU */
  const yk = el('div'); yk.id = 'axYeniKart'; yk.hidden = true; k.appendChild(yk);
  const alanY = (etiket, id, deger) => {
    yk.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input'); i.id = id; i.type = 'text';
    if (deger != null) i.value = deger;
    yk.appendChild(i); return i;
  };
  yk.appendChild(el('div','kbaslik','Yeni kart'));
  alanY('Kart adı', 'axAd', a.kartAdi.durum === 'ok' ? a.kartAdi.ham : '');
  alanY('Banka', 'axBanka', a.banka.durum === 'ok' ? a.banka.ham : '');
  alanY('Kesim günü', 'axKesim', a.kesim.durum === 'ok' ? a.kesim.gun : '');
  alanY('Son ödeme günü', 'axSonOdeme', a.sonOdeme.durum === 'ok' ? a.sonOdeme.gun : '');
  /* ⚠ CO · OKUYUCUNUN DOLDURDUGU ALAN. Programla yazilan deger 'input'
     uretmez; blur beklenirse kullanici bicimlenmemis rakam gorur.
     Bu yuzden baglandiktan HEMEN SONRA elle bicimleniyor. Okuyucu
     "550.000,00 TL" gibi verebiliyor — paraCoz binlik ayracli metni
     zaten cozuyor (olculdu), TL eki yukarida kirpiliyor. */
  const axLim = alanY('Kart limiti', 'axLimit',
    a.limit.durum === 'ok' ? a.limit.ham.replace(/\s*T[LRY]+$/i,'') : '');
  paraBagla(axLim); paraBicimle(axLim);
  /* ⚠ SAHIP EKSTREDEN GUVENLE OKUNAMAZ. Is Bankasi ekstresinde hem TCKN
     hem "Firma Adı" vardi, ikisi de kullanicinin adiydi — bundan sirket
     turu cikarmak TAHMIN olur. HER ZAMAN SORULUR, VARSAYILAN KOYULMAZ. */
  yk.appendChild(el('label', null, 'Sahiplik (ekstreden okunamaz — sen seç)'))
    .setAttribute('for','axSahip');
  const ss = document.createElement('select'); ss.id = 'axSahip';
  [['','— seç —'],['sahis','Şahıs'],['ltd','Ltd']].forEach(ct => {
    const o = document.createElement('option'); o.value = ct[0]; o.textContent = ct[1];
    ss.appendChild(o); });
  yk.appendChild(ss);
  yk.appendChild(el('div','kucuk','Limit paylaşımı da ekstrede yazmaz; kart '
    + 'oluştuktan sonra kart ekranından işaretleyebilirsin.'));
  /* ⚠ CG · MEVCUT KARTI GUNCELLEME TEKLIFI. Olculdu: ekstreKaydet
     yalnizca yeni kart dalinda kart alani yaziyordu; mevcut kart
     secilince ekstredeki limit/faiz ATILIYORDU (KTU ve Axess'in limiti
     bu yuzden bos). SESSIZ GUNCELLEME YOK: fark varsa tek satirlik
     teklif cizilir, kutular ISARETSIZ gelir; isaretlenmeyen alan HIC
     degismez. Fark yoksa satir hic cizilmez; kart secilmeden blok yok. */
  const teklifKutu = el('div'); teklifKutu.id = 'axTeklif'; k.appendChild(teklifKutu);
  const teklifCiz = () => {
    teklifKutu.textContent = '';
    const kart = v.kart.kartlar.find(x => x.id === sec.value);
    if (!kart) return;                                  // yeni kart ya da secilmedi
    const farklar = [];
    const oku = (o, alanAd) => o && o.durum === 'ok' ? o[alanAd] : null;
    const limitYeni = oku(a.limit, 'kurus');
    if (limitYeni != null && kr(kart.kart_limiti) !== limitYeni && !kart.limit_paylasan_id)
      farklar.push(['axGnLimit', 'Kart limitini güncelle: '
        + (kart.kart_limiti == null ? '(boş)' : tl(kart.kart_limiti)) + ' → ' + tlk(limitYeni),
        { kart_limiti: (limitYeni/100).toFixed(2) }]);
    const oranYeni = oku(a.faizOrani, 'oran');
    if (oranYeni != null && Number(kart.faiz_orani) !== oranYeni)
      farklar.push(['axGnFaiz', 'Faiz oranını güncelle: '
        + (kart.faiz_orani == null ? '(boş)' : '%' + String(kart.faiz_orani).replace('.', ','))
        + ' → %' + String(oranYeni).replace('.', ','),
        { faiz_orani: oranYeni }]);
    /* ⚠ CK · GUN ONERISI ARTIK KOSULLU VE IKIYE AYRI.
       Eski hali her ekstrede "kesim/ödeme gününü güncelle" diyordu ve
       hafta sonu kaymasini kalici ayar saniyordu (Axess "29/3 -> 27/1",
       Enpara "10 -> 9" — ikisi de YANLIS, dongu degismemisti).
       Kanit ekstrenin kendi icinde: "Bir Sonraki Hesap Kesim/Son Ödeme
       Tarihi" satiri. Bu ekstrenin gunu ile bir sonrakinin gunu AYNIYSA
       dongu sabit, oneri anlamli; FARKLIYSA gun zaten kayiyor.
       ON EKSTREDE OLCULDU (bu ekstre gunu -> bir sonraki):
         kesim   Enpara 30->30 · Ziraat 15->15 · IsB 4->4, 15->15
                 Axess 29->27 ve 27->26        (KAYIYOR)
         ödeme   Ziraat 25->25 · IsB 14->14, 20->20
                 Enpara 10->9, 9->12 · IsB 20->21 · Axess 3->1 (KAYIYOR)
       ⚠ ODEME GUNU KESIME BAGLI. Axess 27.08'de odeme 1 ve bir sonraki
         de 1 — tek basina "sabit" gorunuyor, ama kesim 27->26 kaydigi
         icin odeme de kayar (Akbank odemeyi kesim+5 gun yaziyor:
         29/07->03/08, 27/08->01/09). Bu yuzden kesim kararsizsa odeme
         onerisi de gosterilmez.
       ⚠ "Bir sonraki" satiri yoksa AYIRT EDILEMEZ -> gosterilmez.
         Yanlis oneri, oneri olmamasindan kotudur. */
    const kesimYeni = oku(a.kesim, 'gun'), odemeYeni = oku(a.sonOdeme, 'gun');
    const skGun = oku(a.sonrakiKesim, 'gun'), soGun = oku(a.sonrakiOdeme, 'gun');
    const kesimSabit = kesimYeni != null && skGun != null && skGun === kesimYeni;
    const odemeSabit = odemeYeni != null && soGun != null && soGun === odemeYeni && kesimSabit;
    const gunNeden = [];
    if (kesimYeni != null && kart.kesim_gunu !== kesimYeni){
      if (kesimSabit)
        farklar.push(['axGnKesim', 'Kesim gününü güncelle: ' + (kart.kesim_gunu ?? '—')
          + ' → ' + kesimYeni, { kesim_gunu: kesimYeni }]);
      else gunNeden.push('Kesim günü ' + (kart.kesim_gunu ?? '—') + ' yazılı, bu ekstre '
        + kesimYeni + '. gününde kesilmiş' + (skGun != null
          ? ' ama ekstrenin kendisi bir sonraki kesimi ayın ' + skGun
            + '. günü diyor — gün oturmuş değil, döngü değişmiş olabileceğini '
            + 'tek ekstreden anlayamam.'
          : ' ama ekstrede "bir sonraki kesim" satırı yok — kalıcı mı geçici mi ayırt edemem.')
        + ' Kartı değiştirmiyorum; gerçekten değiştiyse kart ekranından sen yaz.');
    }
    if (odemeYeni != null && kart.son_odeme_gunu !== odemeYeni){
      if (odemeSabit)
        farklar.push(['axGnOdeme', 'Son ödeme gününü güncelle: ' + (kart.son_odeme_gunu ?? '—')
          + ' → ' + odemeYeni, { son_odeme_gunu: odemeYeni }]);
      else gunNeden.push('Son ödeme günü ' + (kart.son_odeme_gunu ?? '—') + ' yazılı, bu ekstrede '
        + odemeYeni + '. gün' + (soGun != null && soGun !== odemeYeni
          ? ' ama bir sonraki ödeme ayın ' + soGun + '. günü'
          : (!kesimSabit ? ' ama kesim günü de kaymış (ödeme günü kesime bağlı)' : ''))
        + ' — hafta sonu/tatil kayması olabilir, kartı değiştirmiyorum.');
    }
    /* ⚠ ONERI YOKSA SESSIZ KALMA: gun neden onerilmedigi yazilir.
       Kutunun EN ALTINA dusuyor — onay kutulari once, aciklama sonra. */
    const nedenYaz = () => {
      if (!gunNeden.length) return;
      const gn = el('div','kucuk');
      for (const t of gunNeden) gn.appendChild(el('div', null, '· ' + t));
      teklifKutu.appendChild(gn);
    };
    if (!farklar.length){ nedenYaz(); return; }
    teklifKutu.appendChild(el('div','kucuk','Ekstre, seçili karttan farklı bilgiler taşıyor. '
      + 'İşaretlediklerin kayıtta karta yazılır; işaretlemediğin HİÇ değişmez.'));
    for (const [id, metin, yama] of farklar){
      const sat = el('label'); sat.style.cssText = 'display:flex;gap:8px;align-items:baseline;min-height:44px';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = id;
      cb.dataset.yama = JSON.stringify(yama);          // ekstreKaydet okur
      sat.appendChild(cb); sat.appendChild(el('span', null, metin));
      teklifKutu.appendChild(sat);
    }
    nedenYaz();
  };
  /* ⚠ CH · DONEM ZATEN KAYITLIYSA hataya DUSULMEZ, ONCEDEN gorunur.
     ux_kart_donem (kart_id, donem) tekil — ayni ekstre ikinci kez
     kaydedilemez. Eski hal: kullanici kaydetmeyi deneyip unique
     hatasi yiyordu ve ZATEN GIRILMIS dort ekstrenin faiz/limit
     bilgisi teklif ozelligiyle DOLDURULAMIYORDU. Simdi cakisma
     bantVerisi'ndeki donemlerden (YENI SORGU YOK) aninda gorunur;
     kaydet dugmesi "Kart bilgilerini guncelle"ye doner ve yalniz
     kart satiri UPDATE edilir.
     ⚠ DONEM SATIRINA HIC DOKUNULMAZ: kullanicinin ELLE duzelttigi
       rakamlar (Black'te yeni harcama/alacak elle girildi) ekstreyi
       yeniden okutup uzerine yazmakla SILINIRDI — o secenek YOK. */
  const donemVarMi = () => sec.value && sec.value !== '__yeni' && donem
    && v.kart.donemler.some(d => d.kart_id === sec.value && d.donem === donem);
  const cakismaKutu = el('div'); k.appendChild(cakismaKutu);
  const cakismaCiz = () => {
    cakismaKutu.textContent = '';
    const kb = document.getElementById('axKaydet');
    if (!donemVarMi()){
      if (kb){ kb.style.display = ''; kb.textContent = 'Kartı ve dönemi kaydet'; }
      return;
    }
    cakismaKutu.appendChild(el('div','uyari-orta',
      'Bu dönem zaten kayıtlı (' + donem + '). Ekstrenin rakamları DEĞİŞTİRİLMEYECEK — '
      + 'yalnızca kart bilgileri güncellenebilir.'));
    const farkVar = teklifKutu.querySelectorAll('input[type=checkbox]').length > 0;
    if (kb){
      if (farkVar){ kb.style.display = ''; kb.textContent = 'Kart bilgilerini güncelle'; }
      else {
        kb.style.display = 'none';
        cakismaKutu.appendChild(el('div','kucuk',
          'Bu dönem zaten kayıtlı ve kart bilgileri de aynı — yapılacak bir şey yok.'));
      }
    }
  };
  sec.onchange = () => { yk.hidden = sec.value !== '__yeni'; teklifCiz(); cakismaCiz(); };

  /* ⚠ DONEM = KESIM AYI, son odeme ayindan DEGIL. Axess'te kesim 29.07,
     son odeme 03.08 — ikisi ayri aya duser ve kullanicinin karari kesimdi. */
  const donem = a.kesim.durum === 'ok' ? a.kesim.ay : null;
  k.appendChild(el('div', donem ? 'kucuk' : 'uyari-agir', donem
    ? 'Dönem ' + donem + ' olarak yazılacak — HESAP KESİM ayından türetildi, son ödeme ayından değil.'
    : 'Hesap kesim tarihi okunamadı; dönem belirlenemiyor. Bu ekstre kaydedilemez, elle gir.'));

  const kaydet = el('button','btn','Kartı ve dönemi kaydet'); kaydet.id = 'axKaydet';
  /* CF · denklemden NEGATIF cikan ikiliyle kayit ENGELLENIR. */
  kaydet.onclick = () => {
    if (cfNegatif){ mesaj('kartMsg','hata',
      'Ödeme/yeni harcama girişi denklemle çelişiyor (negatif). Düzelt ya da ikisini de boş bırak.');
      return; }
    /* CH · cakisma karari TIKLAMA ANINDA hesaplanir (secim degismis olabilir) */
    ekstreKaydet(a, dosya, donem, kaydet, donemVarMi());
  };
  k.appendChild(kaydet);
  const vaz = el('button','btn2','Vazgeç');
  vaz.onclick = () => ekranAc('kartlar');
  k.appendChild(vaz);
  c.appendChild(k);
}

async function ekstreKaydet(a, dosya, donem, btn, donemZatenVar){
  mesajTemizle('kartMsg');
  if (!donem){ mesaj('kartMsg','hata','Dönem belirlenemedi.'); return; }
  const sec = document.getElementById('axKart').value;
  if (!sec){ mesaj('kartMsg','hata','Bu ekstrenin hangi karta ait olduğunu seç.'); return; }

  /* isaretli teklif kutularinin toplami — iki dal da kullanir */
  const teklifYamasi = () => {
    const y = {};
    for (const cb of document.querySelectorAll('#axTeklif input[type=checkbox]:checked'))
      Object.assign(y, JSON.parse(cb.dataset.yama));
    return y;
  };

  /* ⚠ CH · DONEM ZATEN KAYITLI: donem satirina HIC dokunulmaz (elle
     duzeltilmis rakamlar korunur), PDF yeniden YUKLENMEZ (belge zaten
     o donemde), yalniz ISARETLI teklifler karta yazilir. Hicbir sey
     isaretli degilse VERITABANINA ISTEK GITMEZ. */
  if (donemZatenVar){
    const yama = teklifYamasi();
    if (!Object.keys(yama).length){
      mesaj('kartMsg','hata','Güncellenecek bir şey seçmedin.'); return;
    }
    btn.disabled = true; btn.textContent = 'Güncelleniyor...';
    const rk = await sb.from('kart').update(yama).eq('id', sec);
    btn.disabled = false; btn.textContent = 'Kart bilgilerini güncelle';
    if (rk.error){ hataYaz('kartMsg','Kart bilgisi güncellenemedi.', rk.error); return; }
    await kartDetayAc(sec);
    mesaj('kartMsg','ok','Kart bilgisi güncellendi (' + Object.keys(yama).length
      + ' alan). ' + donem + ' dönem rakamlarına dokunulmadı.');
    return;
  }
  const sy = (id) => document.getElementById(id).value.trim();
  let kartId = sec, yeniKart = null;
  if (sec === '__yeni'){
    if (!sy('axAd'))    { mesaj('kartMsg','hata','Kart adı gerekli.'); return; }
    if (!sy('axSahip')) { mesaj('kartMsg','hata','Sahiplik zorunlu — ekstreden okunamaz, sen seçmelisin.'); return; }
    const gun = (id) => { const x = parseInt(sy(id),10);
      return Number.isFinite(x) && x >= 1 && x <= 31 ? x : null; };
    const lim = sy('axLimit') ? paraCoz(sy('axLimit')) : null;
    if (lim && !lim.ok){ mesaj('kartMsg','hata','Kart limiti okunamadı: ' + lim.hata); return; }
    yeniKart = { ad: sy('axAd'), banka: sy('axBanka') || null, sahip: sy('axSahip'),
      kesim_gunu: gun('axKesim'), son_odeme_gunu: gun('axSonOdeme'),
      kart_limiti: lim && lim.kurus > 0 ? (lim.kurus/100).toFixed(2) : null,
      /* CG · ekstreden okunan AYLIK oran yeni karta da yazilir —
         "girilen bilgiyi kullan", elle girdirme. Okunamadiysa NULL:
         projeksiyon 'hesaplanamaz' der, sifir saymaz (v113). */
      faiz_orani: a.faizOrani && a.faizOrani.durum === 'ok' ? a.faizOrani.oran : null,
      giren_id: PROFIL ? PROFIL.id : null };
  }
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const bitir = () => { btn.disabled = false; btn.textContent = 'Kartı ve dönemi kaydet'; };

  /* F · PDF O DONEMIN BELGESI. Zaten yuklendi, IKINCI KEZ YUKLETMIYORUZ;
     mevcut dosyaYukle yolu kullaniliyor, yeni yol acilmadi.
     ⚠ Belge yuklenemezse kayit DURMUYOR — rakamlar belgeden daha
       onemli; ama sessiz de gecmiyor, mesajda yaziyor. */
  let yol = null, belgeHatasi = null;
  try { yol = await dosyaYukle(dosya, 'kart_ekstre'); }
  catch(e){ belgeHatasi = e && e.message || String(e); }

  if (yeniKart){
    const r = await sb.from('kart').insert(yeniKart).select('id').single();
    if (r.error){ bitir(); hataYaz('kartMsg','Kart oluşturulamadı — hiçbir şey kaydedilmedi.', r.error); return; }
    kartId = r.data.id;
  }
  const P = (o) => o && o.durum === 'ok' ? (o.kurus/100).toFixed(2) : null;
  const satir = { kart_id: kartId, donem: donem,
    devir: P(a.devir) || '0.00', yeni_harcama: P(a.yeni) || '0.00',
    duzeltme: '0.00', odenen: P(a.odenen) || '0.00',
    asgari_tutar: P(a.asgari), faiz_tutari: P(a.faiz), vergi_masraf_tutari: P(a.vergi),
    /* ⚠ donem_odemesi OKUNMAZ: o, ekstreye KARSILIK yapilan odeme ve
       ekstre basildiginda henuz yapilmamistir (v107'deki ayrim). */
    foto_path: yol, giren_id: PROFIL ? PROFIL.id : null };
  const r2 = await sb.from('kart_donem').insert(satir);
  if (r2.error){
    bitir();
    /* ⚠ YETIM KART SESSIZ KALMAZ. Kart olustu ama donem olusmadiysa
       kullanici ne oldugunu BILMELI — yoksa ikinci denemede ayni karti
       bir kez daha olusturur. */
    hataYaz('kartMsg', yeniKart
      ? 'Kart OLUŞTURULDU ama dönem kaydedilemedi. Kart ekranında duruyor; dönemi elle ekle.'
      : 'Dönem kaydedilemedi. Kart değişmedi.', r2.error);
    return;
  }
  /* ⚠ CG · TEKLIF: yalniz ISARETLI kutularin yamasi karta yazilir.
     Donem kaydi BASARILI olduktan sonra calisir — donem duserse kart da
     degismez. Kart guncellemesi duserse kayit GERI ALINMAZ (donem zaten
     mesru); sessiz de kalinmaz, mesajda soylenir. */
  let teklifNotu = '', teklifHatasi = null;
  if (!yeniKart){
    const yama = teklifYamasi();
    if (Object.keys(yama).length){
      const rk = await sb.from('kart').update(yama).eq('id', kartId);
      if (rk.error) teklifHatasi = rk.error;
      else teklifNotu = ' Kart bilgisi güncellendi (' + Object.keys(yama).length + ' alan).';
    }
  }
  await kartDetayAc(kartId);
  if (teklifHatasi)
    hataYaz('kartMsg', donem + ' ekstresi kaydedildi ama kart bilgisi GÜNCELLENEMEDİ.', teklifHatasi);
  else mesaj('kartMsg','ok', donem + ' ekstresi kaydedildi'
    + (yol ? ' ve PDF döneme eklendi.' : '.') + teklifNotu
    + (belgeHatasi ? ' ⚠ PDF yüklenemedi (' + belgeHatasi + ') — "+ Ekstre" ile ekleyebilirsin.' : ''));
}

/* ==================================================================
   AY · BANT YERINE SERIT + KART KUTULARI
   ==================================================================
   ⚠ HICBIR TUTAR, HICBIR HESAP YOLU DEGISMEDI. Bu blok yalnizca
     YERLESIM ve GORUNUM. Serit, bandin gosterdigi rakamlarin
     AYNISINI gosteriyor; yeni bir toplam URETILMIYOR.
   ⚠ Olculdu: bant bes ekranda BIREBIR ayni metni basiyordu (781
     karakter, uc kumesi tek elemanli). Kartlar ekraninda kart
     kutusu katlanin altinda kaliyordu.
   ================================================================== */

/* ⚠ TEK KAYNAK. Bu iki ifade bantCiz'in ICINDEN tasindi; serit ile
   bant ayni degeri iki ayri yerde HESAPLAMASIN diye. Ifadeler
   degistirilmedi, yeri degisti. */
function bantOzet(v){
  return { sBuAy: v.S.buAy - v.S.buAyOdenen,
           lBuAy: v.L.buAy - v.L.buAyOdenen };
}

/* ⚠ TEK KAYNAK · 2. vKartlar'daki limit dongusu buraya tasindi;
   serit ayni rakami tekrar hesaplamasin. Govde AYNEN kopyalandi.
   ⚠ CK · KULLANILAN = KAPANMAMIS, `kalan` DEGIL. CJ turunda kart borcu
     kapanmamis'a gecmisti ama limit cubugu eski mantikta kalmisti:
     ayni kutuda Black'in borcu 24.668,24 yazarken cubuk "kalan alan
     227.951,09" (= limit − 122.748,91 EKSTRE borcu) diyordu — ayni
     uygulamada IKI FARKLI "kullanilabilir limit" tanimi. Odenen kismi
     banka limitten serbest birakir; ust ozetteki "kullanilabilir" ile
     artik AYNI tanim. Limiti girilmemis kart yine "hesaplanamaz". */
function kartLimitOzeti(v){
  const lt = { limit:0, kullanilan:0, limitsiz:0, donemsiz:0, asan:0, adet:0, paylasan:0 };
  for (const kt of v.kart.kartlar){
    if (kt.limit_paylasan_id){ lt.paylasan++; continue; }
    if (kt.kart_limiti == null){ lt.limitsiz++; continue; }
    let kul = 0, donemVar = false;
    for (const x of v.kart.kartlar){
      if (x.id !== kt.id && x.limit_paylasan_id !== kt.id) continue;
      const g = v.sonDonem.get(x.id);
      if (g){ kul += kr(g.kapanmamis); donemVar = true; }
    }
    if (!donemVar){ lt.donemsiz++; continue; }
    const lim = kr(kt.kart_limiti);
    lt.limit += lim; lt.kullanilan += kul; lt.adet++;
    if (kul > lim) lt.asan++;
  }
  return lt;
}

/* ⚠ TAM BANT YALNIZ TAKVIM'DE. Diger dort ekranda tek satirlik,
   O EKRANA AIT serit; dokununca ayni sayfada tam bant aciliyor.
   ⚠ UYARI SATIRLARI SERIDE GIRMEZ — onlar ekranin ustunde ayri
     kalir. Uyariyi ozetin icine gomup kucultmek onu gizlemektir. */
function ozetCiz(v, ekran, ek){
  if (ekran === 'takvim') return bantCiz(v);
  const o = bantOzet(v);
  const sar = el('div');
  const s = el('button','serit-ozet');
  s.type = 'button';
  s.setAttribute('aria-expanded','false');

  const parca = [];
  if (ekran === 'krediler'){
    parca.push(['Kredi', tk(v.S.anapara)], ['Ltd', tk(v.lNominal)],
               ['bu ay', tk(o.sBuAy + o.lBuAy)]);
  } else if (ekran === 'kartlar'){
    /* ⚠ CI · 'kalan alan' SERITTEN KALDIRILDI: ayni bilgi artik ust
       ozet kartinda ("kullanilabilir") gorunur duruyor — ekran
       birikmesi kurali, ayni rakam iki yerde durmaz. */
    /* ⚠ 'Kart' PARCASI KALDIRILDI · MUKERRERDI: ayni rakam hemen
       ALTTAKI "Kartlar özeti" kartinin BUYUK RAKAMI (cek-buyuk).
       Iki oge yan yana ayni sayiyi yaziyordu. 'bu ay' KALIYOR —
       ozet kartindaki "Bu ay ödediğim" BASKA bir sey (odenen),
       buradaki bu ay ODENECEK olan. */
    parca.push(['bu ay', tk(v.buAyKart.toplam)]);
  } else if (ekran === 'maden'){
    parca.push(['Rayiç', v.madenBugun ? tk(v.madenBugun) : 'hesaplanamaz'],
               ['maliyet', v.madenAlis ? tk(v.madenAlis) : 'hesaplanamaz']);
  } else if (ekran === 'sahis'){
    parca.push(['Şahıs', tk(v.sahisKalan)],
               ['hesap', String(v.sahis.hesaplar.length)]);
  } else if (ekran === 'cek'){
    parca.push(['Çek', tk(v.cekToplam)], ['adet', String(v.cek.acik.length)]);
    /* Gecikmis cek IS demektir — rozet degil ama ozette sayilir. */
    const gec = v.cek.acik.filter(c => c.gecikti).length;
    if (gec) parca.push(['vadesi geçen', String(gec)]);
  }
  for (const [et, dg] of parca){
    const p = el('span','so-p');
    p.appendChild(el('span','so-et', et));
    p.appendChild(el('span','so-dg', dg));
    s.appendChild(p);
  }
  const ok = el('span','so-ok','▾'); s.appendChild(ok);
  s.setAttribute('aria-label', parca.map(p => p[0] + ' ' + p[1]).join(', ')
    + '. Tam özeti aç.');
  sar.appendChild(s);

  const tam = el('div'); tam.hidden = true; sar.appendChild(tam);
  s.onclick = () => {
    if (tam.hidden){
      if (!tam.firstChild){
        if (ek) tam.appendChild(ek);
        tam.appendChild(bantCiz(v));
      }
      tam.hidden = false; ok.textContent = '▴';
      s.setAttribute('aria-expanded','true');
    } else {
      tam.hidden = true; ok.textContent = '▾';
      s.setAttribute('aria-expanded','false');
    }
  };
  return sar;
}

/* ⚠ BANKA RENGI YALNIZ ZEMINDE, hafif tonda; metin AYNI ailenin
   koyu tonu (siyah/gri DEGIL). Kontrast oranlari hesaplandi, en
   dusugu 7.28 — esik 4.5.
   ⚠ RISK RENKLE ANLATILMAZ. Kutu gecikmis olsa da banka renginde
     kalir; risk ROZET ve METIN ile soylenir. Kutuyu kirmiziya
     boyamak banka kimligi ile finansal riski birbirine karistirir. */
const KK_BANKA = [
  [['is bankasi','isbank','turkiye is'], '#E8EFF9', '#0F3A66'],
  [['akbank'],                            '#FBEAEC', '#7E1119'],
  [['garanti'],                           '#E6F3EB', '#14572F'],
  [['yapi kredi','yapikredi'],            '#E9EDF7', '#1F3160'],
  [['ziraat'],                            '#FAEDE8', '#7A3218'],
  [['qnb','finansbank'],                  '#F1EAF7', '#452566'],
  [['halkbank','halk bankasi'],           '#E8F1F8', '#0F4770'],
  [['vakif'],                             '#F4F0DF', '#5C4D10'],
  [['deniz'],                             '#E9F3F7', '#0D4A63'],
  [['teb'],                               '#EAF2EC', '#1C5230']
];
function bankaTonu(ad){
  const s = axSade(ad || '');
  for (const [anahtarlar, bg, fg] of KK_BANKA)
    for (const a of anahtarlar) if (s.indexOf(a) >= 0) return { bg: bg, fg: fg };
  return { bg:'#EBF0FA', fg:'#183F78' };   // varsayilan · kontrast 9.09
}

function kartKutusu(v, kart, buAy, liste){
  const son = v.sonDonem.get(kart.id);
  const buAyKaydi = v.kart.donemler.find(d => d.kart_id === kart.id && d.donem === buAy);
  const gosterilen = buAyKaydi || son;
  const ton = bankaTonu(kart.banka);

  const kutu = el('div','kk');
  kutu.style.background = ton.bg; kutu.style.color = ton.fg;
  kutu.style.borderColor = ton.fg + '33';
  kutu.style.cursor = 'pointer';
  kutu.onclick = () => kartDetayAc(kart.id);

  /* UST · banka koyu, kart adi soluk; sag ust kosede kesim/odeme rozeti */
  const ust = el('div','kk-ust');
  const sol = el('div'); sol.style.minWidth = '0';
  sol.appendChild(el('div','kk-banka', kart.banka || 'banka girilmemiş'));
  const ad2 = el('div','kk-ad');
  ad2.appendChild(document.createTextNode(kart.ad));
  ad2.appendChild(document.createTextNode(' · '));
  ad2.appendChild(el('span', sahipSinif(kart.sahip), sahipKisa(kart.sahip)));
  if (!kart.aktif){ ad2.appendChild(document.createTextNode(' '));
    ad2.appendChild(el('span','rozet rz-sari','pasif')); }
  sol.appendChild(ad2);
  ust.appendChild(sol);
  const sag = el('div'); sag.style.cssText = 'display:flex;gap:6px;align-items:center;flex:none';
  sag.appendChild(el('span','kk-gun',
    (kart.kesim_gunu ? 'kesim ' + kart.kesim_gunu : 'kesim —')
    + ' · ' + (kart.son_odeme_gunu ? 'ödeme ' + kart.son_odeme_gunu : 'ödeme —')));
  /* ⚠ ⋯ menusu kutunun ICINDE ama kutu tiklamasini TETIKLEMEZ. */
  const dm = digerMenu([['Kartı düzenle', () => vKartlar(kart.id)],
                        ['Kartı sil', (a) => kartSil(kart, liste, a)]]);
  dm.addEventListener('click', (e) => e.stopPropagation());
  sag.appendChild(dm);
  ust.appendChild(sag);
  kutu.appendChild(ust);

  /* ORTA · kutunun en buyuk rakami + vade satiri
     ⚠ CJ · BUYUK RAKAM KAPANMAMIS — kullanicinin sorusu buydu:
       "odendikten sonra kalan kisim neden gozukmuyor". Eski hal
       ekstrenin kalanini basiyor, altinda "odendi" diyordu; ayni
       kutuda IKI CELISEN BEYAN vardi (olculdu: Ziraat Sahis 17.278,68
       yazip "odendi" diyordu — artik 0,00 ve rozet tutarli).
     ⚠ RAKAM ICERI, DURUM DISARI: ekstrenin hikayesi rakamin ALTINDA
       tek satirda. Odeme girilmemisse o satir CIZILMEZ — kapanmamis
       zaten kalan'a esittir, tekrar olurdu. */
  kutu.appendChild(el('div','kk-tutar', gosterilen ? tl(gosterilen.kapanmamis) : '—'));
  if (gosterilen && gosterilen.donem_odemesi != null && kr(gosterilen.donem_odemesi) > 0)
    kutu.appendChild(el('div','kk-lim', 'ekstre ' + tl(gosterilen.kalan)
      + ' · ödedim ' + tl(gosterilen.donem_odemesi)));
  const vd = el('div','kk-vade');
  if (!gosterilen) vd.textContent = 'dönem girilmemiş';
  else if (kart.son_odeme_gunu == null) vd.textContent = 'son ödeme günü girilmemiş';
  else {
    /* ⚠ "3 gün kaldı" yazan bir kutu, gun GECMISSE YALAN SOYLER.
       Gun farki bugunun gunuyle karsilastiriliyor; ayin son gununden
       buyuk odeme gunu ayin sonuna kirpiliyor (buAyKart ile ayni kural). */
    const bg2 = bugun(), ayGun = +bg2.slice(8,10);
    const vg = Math.min(kart.son_odeme_gunu, ayinSonGunu(bg2.slice(0,7)));
    const fark = vg - ayGun;
    const tarih = String(vg).padStart(2,'0') + '.' + bg2.slice(5,7);
    vd.textContent = 'son ödeme ' + tarih + ' · '
      + (fark > 0 ? fark + ' gün kaldı' : fark === 0 ? 'bugün son gün' : (-fark) + ' gün geçti');
    /* ⚠ BA · RENK ODEME DURUMUNDAN GELIR, TAKVIMDEN DEGIL. Olculdu: kutu
       yalniz "fark < 0"a bakiyordu ve kalani 0,00 olan karta da, odeme
       bilgisi hic girilmemis karta da kirmizi "SON ÖDEME GEÇTİ" basiyordu.
       Gun sayaci bilgi olarak kaliyor; rozet ve renk odeme_turu'ndan:
         tam       -> "ödendi"                   sakin
         girilmedi -> "ödeme bilgisi girilmemiş" NOTR — bilinmeyen, gecikmis DEGILDIR
         odenmedi  -> vade gectiyse SON ÖDEME GEÇTİ (uyari)
         eksik     -> vade gectiyse SON ÖDEME GEÇTİ (uyari)
         kismi     -> vade gectiyse "kalan devretti" (sakin — gecikme degil)
       Vade gecmemisse HICBIR halde uyari yok.
       ⚠ Kalan 0,00 olan donem gorunumde zaten 'tam' gelir (donem_odemesi >=
         kalan); ayrica kalan <= 0 ise de 'tam' sayiliyor ki odeme bilgisi
         girilmemis sifir bakiyeli kart "girilmemis" diye uyarmasin. */
    /* ⚠ CJ · SIFIR DENETIMI DE KAPANMAMIS UZERINDEN — rozet, kutunun
       BUYUK RAKAMIYLA celismesin. Buyuk rakam 0,00 ise rozet her halde
       "odendi" olur; gorunum zaten donem_odemesi >= kalan halinde 'tam'
       donuyordu, bu satir onu buyuk rakama BAGLIYOR. */
    const ot = kr(gosterilen.kapanmamis) <= 0 ? 'tam' : (gosterilen.odeme_turu || 'girilmedi');
    const ek = (metin, sinif, rozet) => { vd.className = 'kk-vade ' + sinif;
      vd.appendChild(document.createTextNode(' · ' + metin));
      if (rozet){ vd.appendChild(document.createTextNode(' ')); vd.appendChild(el('span','rozet rz-eksik',rozet)); } };
    if (ot === 'tam') ek('ödendi', 'odendi');
    else if (ot === 'girilmedi') ek('ödeme bilgisi girilmemiş', 'notr');
    else if (fark < 0 && (ot === 'odenmedi' || ot === 'eksik')) ek('', 'gecti', 'SON ÖDEME GEÇTİ');
    else if (fark < 0 && ot === 'kismi') ek('kalan devretti', 'odendi');
    else if (fark === 0) vd.className = 'kk-vade bugun';
  }
  kutu.appendChild(vd);

  /* ALT · limit cubugu */
  const dip = el('div','kk-dip');
  const paylasanlar = v.kart.kartlar.filter(x => x.limit_paylasan_id === kart.id);
  if (kart.limit_paylasan_id){
    /* ⚠ CUBUK YOK: bu kartin kendi limiti yok, cubuk "%0 kullanilmis"
       gibi okunurdu. */
    const ana = v.kart.kartlar.find(x => x.id === kart.limit_paylasan_id);
    dip.appendChild(el('div','kk-lim',
      (ana ? ana.ad : 'başka bir kart') + ' kartının limitinden kullanıyor'));
  } else if (kart.kart_limiti == null){
    /* ⚠ BOS CUBUK CIZILMEZ — "limiti yok" ile "limiti bilinmiyor" ayri. */
    dip.appendChild(el('div','kk-lim','limit girilmemiş'));
  } else {
    const lim = kr(kart.kart_limiti);
    let kul = 0, donemVar = false;
    for (const x of v.kart.kartlar){
      if (x.id !== kart.id && x.limit_paylasan_id !== kart.id) continue;
      const g = v.sonDonem.get(x.id);
      /* ⚠ CK · kapanmamis — kutunun BUYUK RAKAMIYLA ayni kolon;
         kartLimitOzeti ile de ayni tanim (gerekce orada). */
      if (g){ kul += kr(g.kapanmamis); donemVar = true; }
    }
    if (!donemVar) dip.appendChild(el('div','kk-lim','limit ' + tk(lim) + ' · kullanım bilinmiyor'));
    else {
      const bos = lim - kul, asti = bos < 0;
      const cb = el('div','kk-cubuk' + (asti ? ' asti' : ''));
      const i = document.createElement('i');
      i.style.width = Math.max(2, Math.min(100, lim ? (kul / lim) * 100 : 0)) + '%';
      cb.appendChild(i); dip.appendChild(cb);
      const ls = el('div','kk-lim');
      ls.appendChild(document.createTextNode('limit ' + tk(lim) + ' · '
        + (asti ? 'limit aşımı ' + tk(-bos) : 'kalan alan ' + tk(bos))
        + (paylasanlar.length ? ' · ' + paylasanlar.length + ' kartla paylaşımlı' : '')));
      dip.appendChild(ls);
      if (asti) dip.appendChild(el('span','rozet rz-eksik','LİMİT AŞILDI'));
    }
  }
  /* ⚠ ROZET YALNIZ IS VARSA: oran eksikligi ancak DEVREDEN BORC varken
     is demektir. Orani olmayan ama borcu kapanmis kartta uyari cikmaz —
     yanlis alarm olurdu (kart uyarisi turunun dersi). */
  if (kart.faiz_orani == null && gosterilen && kr(gosterilen.kapanmamis) > 0)
    dip.appendChild(el('div','kk-lim','faiz oranı girilmemiş — devreden borcun maliyeti hesaplanamıyor'));
  if (gosterilen){
    const r = el('div'); r.style.marginTop = '4px';
    if (gosterilen.devir_tutarsiz) r.appendChild(el('span','rozet rz-eksik','DEVİR TUTMUYOR'));
    if (!gosterilen.foto_path){
      if (gosterilen.devir_tutarsiz) r.appendChild(document.createTextNode(' '));
      r.appendChild(el('span','rozet rz-sari','EKSTRE EKSİK'));
    }
    if (r.children.length) dip.appendChild(r);
  }
  kutu.appendChild(dip);

  /* AO'da kurulan erisim deseni — yeni katman YAZILMADI, mevcut cagriliyor. */
  /* ⚠ CJ · erisilebilir ad da KAPANMAMIS okur — ekran okuyucu kutunun
     buyuk rakamindan BASKA bir sayi duymamali. */
  kutuErisim(kutu, (kart.banka ? kart.banka + ' ' : '') + kart.ad
    + ', borç ' + (gosterilen ? tl(gosterilen.kapanmamis) : 'girilmemiş') + ', detayı aç');
  return kutu;
}

/* BH · duzKartId verilirse alttaki form o kartla DOLU acilir (donemFormu
   kalibi). sekmeAc parametresiz cagirir — normal akis degismez. */
async function vKartlar(duzKartId){
  const c = document.getElementById('icerik');
  const v = await bantVerisi();
  const buAy = bugun().slice(0,7);

  c.textContent = '';
  /* ⚠ AY · OLCULDU: "Toplam limit" kutusu 324px'ti ve ilk kart 1280x800'de
     y=733'e, yani katin dibine dusuyordu — turun sikayeti tam olarak buydu.
     Kutunun UC RAKAMI artik SERITTE de var (kalan alan seride kondu), yani
     ayni ozet iki kez cikiyordu. Rakamlar seridin ACILAN paneline tasindi.
     ⚠ UYARILAR TASINMADI: limiti girilmemis kart, limit asimi ve paylasim
       notu ekranin ustunde AYRI kaliyor. Uyariyi ozetin icine gomup
       kucultmek onu gizlemektir. */
  const lt = kartLimitOzeti(v);
  /* ==================================================================
     ⚠ CI · UST OZET · UC CEVAP TEK KARTTA:
       "toplam limit ne" · "bu ay ne odedim" · "eylule ne devrediyor,
       faiziyle". EKRAN BIRIKMESI KURALI: eski "Toplam limit" kutusu
       (serit panelindeki uc satir) bu kartin KAPSAMINA girdi ve
       KALDIRILDI; ozetCiz seridindeki 'kalan alan' terimi de ayni
       turda kaldirildi — ayni rakam iki yerde durmaz. Kavram uyarisi
       (ekstre donemi / canli hareket ayrimi) rakamlarin YANINA tasindi,
       silinmedi.
     ⚠ NULL SIFIR SAYILMAZ (v113 COMMENT'i): faizi bilinmeyen kartin
       kapanmamis borcunu 0 faizle toplamak dogacak faizi OLDUGUNDAN
       KUCUK gosterir — en tehlikeli hata. O kartlar ayri satirda
       "hesaplanamiyor" olarak SAYILIR ve tutari yazilir.
     ⚠ Faiz orani AYLIK; tek ay icin carpilir, yillastirilmaz.
       Vergi projeksiyona GIRMIYOR ve bu ACIKCA yaziliyor. */
  const ozet = el('div','kart');
  ozet.appendChild(el('div','kbaslik','Kartlar özeti'));
  /* buyuk rakam + alt satir: cek ekranindaki .cek-buyuk/.cek-alt kalibi
     yeniden kullanildi — yeni CSS ICAT EDILMEDI */
  ozet.appendChild(el('div','cek-buyuk', tlk(v.kartKalan)));
  const limitDolu = v.kart.kartlar.filter(x => x.kart_limiti != null);
  const limitYok  = v.kart.kartlar.filter(x => x.kart_limiti == null && !x.limit_paylasan_id);
  const limitTop  = limitDolu.reduce((s,x) => s + kr(x.kart_limiti), 0);
  ozet.appendChild(el('div','cek-alt', v.kart.kartlar.length + ' kart · '
    + (limitYok.length
       ? 'limit hesaplanamaz (' + limitYok.length + ' kartta girilmemiş)'
       /* ⚠ CJ · kullanilabilir = limit − KART BORCU (kapanmamis toplami).
          v.kartKalan artik kapanmamis tasiyor; bankanin gozunde de
          odenmis kisim limitten dusulmustur. */
       : 'limit ' + tk(limitTop) + ' · kullanılabilir ' + tk(limitTop - v.kartKalan))));
  /* ⚠ CJ · EKSTRENIN HIKAYESI ozette de tek satir: buyuk rakam artik
     GERCEK borc, ekstre toplami ile odenen ondan turer. */
  let ekstreTop = 0, odenenTop = 0;
  for (const kt of v.kart.kartlar){
    const d = v.sonDonem.get(kt.id); if (!d) continue;
    ekstreTop += kr(d.kalan);
    odenenTop += kr(d.kalan) - kr(d.kapanmamis);
  }
  if (odenenTop > 0)
    ozet.appendChild(el('div','cek-alt', 'ekstre toplamı ' + tk(ekstreTop)
      + ' · ödediğim ' + tk(odenenTop)));
  /* not, dg'nin YANINDA kucuk span — ayri satir 27px yiyordu (olculdu) */
  const satOz = (e2, d2, not) => { const x = el('div','satir');
    x.appendChild(el('span','et', e2));
    const dg = el('span','dg', d2);
    if (not){ dg.appendChild(document.createTextNode(' '));
              dg.appendChild(el('span','kucuk', not)); }
    x.appendChild(dg);
    ozet.appendChild(x); return x; };
  /* B · eylule devreden + dogacak faiz (yalniz orani DOLU kartlar) */
  let devreden = 0, faizKurus = 0, oransizKap = 0, oransizN = 0;
  for (const kt of v.kart.kartlar){
    const d = v.sonDonem.get(kt.id); if (!d) continue;
    const kap = kr(d.kapanmamis);
    devreden += kap;
    if (kt.faiz_orani != null) faizKurus += Math.round(kap * Number(kt.faiz_orani) / 100);
    else { oransizN++; oransizKap += kap; }
  }
  /* ⚠ CJ · "Gelecek doneme devreden" satiri KALDIRILDI: v.kartKalan
     artik kapanmamis topladigi icin bu rakam BUYUK RAKAMIN AYNISIYDI.
     Ayni sayi iki yerde durmaz — deger kaybolmuyor, ustte duruyor.
     `devreden` degiskeni yalniz ic tutarlilik nobetcisinde kaldi. */
  if (devreden !== v.kartKalan)
    ozet.appendChild(el('div','uyari-agir', 'Kart borcu iki yoldan farklı çıkıyor: '
      + tlk(v.kartKalan) + ' ≠ ' + tlk(devreden) + '. Formül bağları kontrol edilmeli.'));
  satOz('Doğacak faiz (tahmin)', tlk(faizKurus), 'vergi hariç');
  if (oransizN && oransizKap > 0)
    ozet.appendChild(el('div','uyari-orta', oransizN + ' kartın faizi girilmemiş — '
      + tk(oransizKap) + ' için hesaplanamıyor.'));
  /* C · bu ay odedigim — tarih v113'te acildi; v_kart_donem gorunumu
     tasimiyor (bilerek genisletilmedi), tek hafif sorgu tablodan.
     ⚠ "0 odedim" ile "bilmiyorum" AYNI GORUNMEZ: tarihi girilmemis
       odeme varken 0,00 yazilmaz. */
  const buAyOd = satOz('Bu ay ödediğim', '…');
  sb.from('kart_donem').select('donem_odemesi,donem_odemesi_tarih')
    .eq('is_deleted', false).not('donem_odemesi', 'is', null)
    .then(r => {
      const dg2 = buAyOd.querySelector('.dg');
      if (r.error){ dg2.textContent = 'okunamadı'; return; }
      const oy = bugun().slice(0,7);
      const tarihsiz = (r.data||[]).filter(x => x.donem_odemesi_tarih == null).length;
      const buAyT = (r.data||[]).filter(x => x.donem_odemesi_tarih
                       && x.donem_odemesi_tarih.slice(0,7) === oy)
                     .reduce((s,x) => s + kr(x.donem_odemesi), 0);
      /* uzun not dg icinde 137px'e sariyordu (olculdu) — ayri kucuk satir */
      const notKoy = (metin) => buAyOd.appendChild(el('div','kucuk', metin));
      if (buAyT > 0){
        dg2.textContent = tlk(buAyT);
        if (tarihsiz) notKoy('+' + tarihsiz + ' tarihi girilmemiş — eksik olabilir');
      } else if (tarihsiz){
        dg2.textContent = 'hesaplanamıyor';
        notKoy(tarihsiz + ' ödemenin tarihi girilmemiş');
      } else dg2.textContent = 'bu ay kayıtlı ödeme yok';
    });
  /* kavram uyarisi eski kutudan TASINDI — rakamlarin yaninda kalir */
  ozet.appendChild(el('div','kavram',
    'Ekstrelere göre — son kesimden bu yana yapılan harcamalar dahil değil. '
  + 'Bankadaki kullanılabilir limit daha az olabilir.'));
  c.appendChild(ozetCiz(v,'kartlar', null));
  c.appendChild(ozet);
  const msg = el('div','msg'); msg.id = 'kartMsg'; c.appendChild(msg);
  c.appendChild(kartUyarisi());

  if (v.kartTutarsiz > 0)
    c.appendChild(el('div','uyari-agir', v.kartTutarsiz
      + ' kartta devir zinciri kırık: bu ayın devri, geçen ayın kalanına eşit değil.'));

  /* ⚠ AS · TOPLAM LIMIT / KULLANILAN / KALAN ALAN.
     ⚠ TOPLU, sahis/Ltd AYRI DEGIL. Gerekce: kullanicinin istegi "genele
       vurmak"; ayrica tuzel kisilik ayrimini BANT tasiyor (kartSahis /
       kartLtd katman 1'de duruyor) — kart ekraninin ikinci kez tasimasi
       ayni bilgiyi iki yerde tutmak olurdu ve ikisi ayrisabilirdi.
     ⚠ LIMITI GIRILMEMIS kart varsa toplam EKSIKTIR ve bunu SOYLER.
       Eksik veriyle hesaplanmis toplami tam gibi gostermek "ne kadar
       alanim var" sorusuna YANLIS cevap verir (AR'deki kuralin aynisi). */
  /* ⚠ AY · DONGU kartLimitOzeti'ne TASINDI — serit ayni rakami ikinci
     kez hesaplamasin. Govde degismedi, yeri degisti.
     ⚠ AV · PAYLASAN KART TOPLAMA GIRMEZ; kullanimi ana kartin
       havuzunda hesaba giriyor. Gerekce fonksiyonun icinde yaziyor. */
  /* ⚠ AY · SAYILAR SERIDIN ACILAN PANELINE TASINDI (yukarida kuruluyor).
     Burada YALNIZ UYARILAR kaldi ve ekranin USTUNDE AYRI duruyor. */
  if (lt.adet || lt.limitsiz || lt.donemsiz){
    const tl2 = el('div');
    const eks = [];
    if (lt.limitsiz) eks.push(lt.limitsiz + ' kartın limiti girilmemiş');
    if (lt.donemsiz) eks.push(lt.donemsiz + ' kartın dönemi girilmemiş');
    if (lt.paylasan) tl2.appendChild(el('div','kucuk',
      lt.paylasan + ' kart başka kartın limitinden kullanıyor — limitleri ayrıca '
    + 'SAYILMADI, kullanımları ana kartın havuzunda.'));
    if (eks.length)
      tl2.appendChild(el('div','uyari-orta', eks.join(' · ') + ' — toplam EKSİK, bu kartlar hesaba girmedi.'));
    if (lt.asan)
      tl2.appendChild(el('div','uyari-agir', lt.asan + ' kartta kullanılan tutar limiti AŞIYOR.'));
    if (tl2.children.length) c.appendChild(tl2);
  }

  const k = el('div','kart');
  k.appendChild(el('div','kbaslik','Kartlar (' + v.kart.kartlar.length + ')'));
  /* AX · okuyucunun girisi. Ekstre bir KARTA degil bir DONEME ait ve
     kart henuz olmayabilir; bu yuzden kart kutusunun icinde degil,
     liste basinda duruyor. */
  const oku = el('button','btn2','Ekstre yükle ve oku (PDF)');
  oku.onclick = () => ekstreOku();
  k.appendChild(oku);
  k.appendChild(el('div','kucuk','PDF tarayıcıda okunur, hiçbir yere '
    + 'gönderilmez. Okunan alanlar sana gösterilir; kaydetmeden önce onaylarsın.'));
  /* ⚠ FAZ 2c·C · BOS DURUM TASARLANDI. Olculdu: bu ekranin kendine ait
     DEGERI SIFIR — gorunen tum tutarlar ust banttan geliyor. Ekran
     GERCEKTEN bos. Uc soruya cevap veriyor: ne oldugu, neden bos,
     ne yapilmasi gerektigi.
     ⚠ SAHTE VERI YOK: ornek kart, "0,00 TL" gibi yaniltici bir rakam
       KONMADI. Bos, bos gorunuyor — cunku "0" ile "girilmedi" ayni
       sey degil ve bant dipnotu da "kart: veri girilmedi" diyor. */
  if (!v.kart.kartlar.length){
    const bd = el('div','bos-durum');
    bd.appendChild(el('div','bd-bas','Kayıtlı kredi kartı yok'));
    bd.appendChild(el('div','bd-ac',
      'Kart borcu bu ekrandan takip edilir: her kartın dönem dönem kalanı, '
      + 'son ödeme günü ve ekstre belgesi. Henüz hiçbir kart girilmediği için '
      + 'kart borcu toplamlara ve dağılıma DAHİL DEĞİL.'));
    bd.appendChild(el('div','bd-ne','Yapılacak: aşağıdaki formdan kartı ekle, sonra dönem kalanını gir.'));
    k.appendChild(bd);
  }

  /* AY · METIN SATIRI -> KUTU IZGARASI. >=768px iki sutun, altinda tek.
     Eski metin-satiri dongusu KALDIRILDI; tasidigi her alan kutuda. */
  const izgara = el('div','kk-izgara');
  for (const kart of v.kart.kartlar){
    const donemleri = v.kart.donemler.filter(d => d.kart_id === kart.id)
                        .sort((a,b) => b.donem.localeCompare(a.donem));
    izgara.appendChild(kartKutusu(v, kart, buAy, donemleri));
  }
  k.appendChild(izgara);
  c.appendChild(k);
  /* DE · gecmis gorunumu — kart kutularinin ALTINDA, katlanir */
  c.appendChild(kartGecmisiSeridi(v));
  const duzKart = duzKartId ? v.kart.kartlar.find(x => x.id === duzKartId) : null;
  const kf = kartFormu(duzKart, v.kart.kartlar);
  /* ⚠ FORM KATLANIR · OLCULDU: "Yeni kart" formu 626px, ekranin 2023
     pikselinin neredeyse ucte biri, ve HER acilista aciktı. Kart YILDA
     bir eklenir, kart borcu HER GUN okunur; sik yapilan isin onunde
     duran bir form, ekranin en pahali susu.
     ⚠ DESEN ICAT EDILMEDI: ozetCiz'in serit-ozet kalibi (buton + hidden
       div + aria-expanded + ▾/▴, icerik ilk acilista baglanir).
     ⚠ DUZELTME AKISI BOZULMAZ: duzKartId ile gelindiyse form ACIK
       baslar ve scrollIntoView eskisi gibi calisir — kullanici
       "Düzenle"ye basip kapali bir form bulmaz. */
  if (duzKart){
    c.appendChild(kf);
    kf.scrollIntoView({ block: 'start' });
  } else {
    const ac = el('button','serit-ozet'); ac.type = 'button';
    ac.setAttribute('aria-expanded','false');
    const p = el('span','so-p');
    p.appendChild(el('span','so-et','yeni kart'));
    p.appendChild(el('span','so-dg','ekle'));
    ac.appendChild(p);
    const okI = el('span','so-ok','▾'); ac.appendChild(okI);
    ac.setAttribute('aria-label','Yeni kart ekleme formunu aç');
    c.appendChild(ac);
    const kutu = el('div'); kutu.hidden = true; c.appendChild(kutu);
    ac.onclick = () => {
      if (kutu.hidden){
        if (!kutu.firstChild) kutu.appendChild(kf);
        kutu.hidden = false; okI.textContent = '▴';
        ac.setAttribute('aria-expanded','true');
      } else {
        kutu.hidden = true; okI.textContent = '▾';
        ac.setAttribute('aria-expanded','false');
      }
    };
  }
}

function kartFormu(duz, kartlar){
  const k = el('div','kart');
  k.appendChild(el('div','kbaslik', duz ? duz.ad + ' düzeltiliyor' : 'Yeni kart'));
  if (duz) k.appendChild(el('div','bilgi',
    'Var olan kart yeniden yazılıyor — dolu gelen alanlarda yalnız yanlış olanı değiştir. '
  + 'Kaydetmeden önce ne değiştiği gösterilecek.'));
  const alan = (etiket, id, tip, mod, ipucu, deger) => {
    k.appendChild(el('label', null, etiket)).setAttribute('for', id);
    const i = document.createElement('input');
    i.id = id; i.type = tip || 'text';
    if (mod) i.setAttribute('inputmode', mod);
    if (ipucu) i.placeholder = ipucu;
    if (deger != null) i.value = deger;
    k.appendChild(i); return i;
  };
  alan('Kart adı','ktAd','text',null,null, duz ? duz.ad : null);
  alan('Banka','ktBanka','text',null,null, duz ? duz.banka : null);
  k.appendChild(el('label', null, 'Sahip (zorunlu)')).setAttribute('for','ktSahip');
  const s = document.createElement('select'); s.id = 'ktSahip';
  [['','— seç —'],['sahis','Şahıs şirketinin kartı'],['ltd','Bardaks Ltd kartı']]
    .forEach(([val,t]) => { const o = document.createElement('option'); o.value = val; o.textContent = t; s.appendChild(o); });
  k.appendChild(s);
  alan('Son ödeme günü (ayın kaçı)','ktSonOdeme','text','numeric','1-31', duz ? duz.son_odeme_gunu : null);
  alan('Kesim günü (bilinmiyorsa boş)','ktKesim','text','numeric','1-31', duz ? duz.kesim_gunu : null);
  /* ⚠ AS · Limit ZORUNLU DEGIL. Bilinmiyorsa BOS birakilir ve NULL yazilir;
     0 yazmak "limit dolu" gibi okunur, sunucu da (kart_limit_chk) reddeder. */
  alan('Kart limiti (bilinmiyorsa boş)','ktLimit','text','decimal','örn. 150.000,00',
    duz && duz.kart_limiti != null ? (kr(duz.kart_limiti)/100).toFixed(2).replace('.', ',') : null);
  /* ⚠ AYLIK · YILLIK DEGIL. Desen kredi formundan (kFaiz) kopyalandi:
     text + inputmode=decimal, virgullu giris, bos birakilabilir.
     ⚠ ETIKET VE IPUCU "AYLIK" DIYOR CUNKU: ekstre hem aylik hem yillik
       basiyor; yillik girilirse butun faiz projeksiyonu 12 KAT sasar.
       v113'un COMMENT'i de bunu yaziyor ("yillik girilirse projeksiyon
       12 kat sasar").
     ⚠ DUZENLEMEDE DOLU GELIR: duz.faiz_orani okunuyor. Bos gelseydi
       kullanici hicbir sey degistirmeden kaydettiginde oran SILINIRDI —
       bes kartin oraninin betikle yazildigi bir sistemde en pahali kusur. */
  alan('Aylık faiz oranı (%) — bilinmiyorsa boş bırak','ktFaiz','text','decimal','örn: 4,25',
    duz && duz.faiz_orani != null ? String(duz.faiz_orani).replace('.', ',') : null);
  paraBaglaHepsi(k, ['ktLimit']);       /* CO · ktFaiz ORAN, ktKesim/ktSonOdeme GUN */
  paraBicimle(paraAl(k, 'ktLimit'));
  k.appendChild(el('div','kucuk',
    'Ekstrede hem aylık hem yıllık yazar. AYLIK olanı gir — örn. %4,25 '
  + '(yıllık %51,00 DEĞİL). Yıllık girilirse devreden borcun maliyeti 12 kat şişer.'));
  if (duz){
    /* Duzenlemede iki alan daha: limit paylasimi ve aciklama. Yeni-kart
       formuna EKLENMEDI — akis degismesin; paylasimin dogal ani duzenleme. */
    k.appendChild(el('label', null, 'Limitinden kullandığı kart (yoksa boş)')).setAttribute('for','ktPaylasan');
    const ps = document.createElement('select'); ps.id = 'ktPaylasan';
    const b0 = document.createElement('option'); b0.value = ''; b0.textContent = '— kendi limiti —'; ps.appendChild(b0);
    for (const x of (kartlar||[]).filter(x => x.id !== duz.id)){
      const o = document.createElement('option'); o.value = x.id;
      o.textContent = x.ad + (x.banka ? ' · ' + x.banka : ''); ps.appendChild(o);
    }
    ps.value = duz.limit_paylasan_id || '';
    k.appendChild(ps);
    alan('Açıklama','ktAciklama','text',null,null, duz.aciklama);
  }
  const b = el('button','btn', duz ? 'Değişikliği göster' : 'Kartı kaydet');
  b.id = 'ktKaydet'; b.onclick = () => kartKaydet(duz, kartlar);
  k.appendChild(b);
  if (duz){
    const vz = el('button','btn2','Vazgeç'); vz.onclick = () => vKartlar(); k.appendChild(vz);
  }
  const ov = el('div'); ov.id = 'ktOnizleme'; k.appendChild(ov);
  /* sahip secimini doldur (select yukarida kuruldu) */
  if (duz) setTimeout(() => { const sq = document.getElementById('ktSahip'); if (sq) sq.value = duz.sahip || ''; }, 0);
  return k;
}

async function kartKaydet(duz, kartlar){
  mesajTemizle('kartMsg');
  const btn = document.getElementById('ktKaydet');
  const ad = document.getElementById('ktAd').value.trim();
  const sahip = document.getElementById('ktSahip').value;
  if (!ad)    return mesaj('kartMsg','hata','Kart adı zorunlu.');
  if (!sahip) return mesaj('kartMsg','hata','Sahip seçmelisin: şahıs şirketi mi, Ltd mi?');
  const gun = (id, etiket) => {
    const h = document.getElementById(id).value.trim();
    if (!h) return { ok:true, deger:null };
    const n = parseInt(h, 10);
    if (!Number.isFinite(n) || n < 1 || n > 31) return { ok:false, hata: etiket + ' 1 ile 31 arasında olmalı.' };
    return { ok:true, deger:n };
  };
  const so = gun('ktSonOdeme','Son ödeme günü'), ke = gun('ktKesim','Kesim günü');
  if (!so.ok) return mesaj('kartMsg','hata', so.hata);
  if (!ke.ok) return mesaj('kartMsg','hata', ke.hata);
  /* ⚠ AS · BOS ile 0 AYRI. paraCoz bos girdiye {ok:true,kurus:0} veriyor;
     korlemesine kullanilsaydi limitsiz kart 0 LIMITLI kaydedilirdi. */
  const limH = document.getElementById('ktLimit').value.trim();
  let limit = null;
  if (limH){
    /* ⚠ EKSI ISARETI paraCoz'DEN GECMEZ: `[^\d.,]` suzgeci '-' karakterini
       ATIYOR, "-5" SESSIZCE 5,00 oluyordu (olculdu). Sunucu kisiti da
       yakalayamaz — 5 > 0. Isaret ONCE burada bakiliyor; ayni kalibin
       donemSatiriUret'te de kullanildigi yer var. */
    if (/^\s*[-−]/.test(limH)) return mesaj('kartMsg','hata',
      'Kart limiti eksi olamaz. Bilinmiyorsa BOŞ bırak.');
    const pl = paraCoz(limH);
    if (!pl.ok) return mesaj('kartMsg','hata','Kart limiti: ' + pl.hata);
    if (pl.kurus <= 0) return mesaj('kartMsg','hata',
      'Kart limiti sıfırdan büyük olmalı. Bilinmiyorsa BOŞ bırak.');
    limit = (pl.kurus / 100).toFixed(2);
  }
  /* ⚠ FAIZ · kredi formundaki kalibin AYNISI (kFaiz), iki eklemeyle:
       ust sinir 100 — v113'un kart_faiz_ust_chk kisiti bunu zaten
         reddediyor ama ham SQL hatasi gostermek yerine ekranda
         OKUNABILIR cumle cikiyor; sunucu kisiti YERINDE KALIYOR,
         ekran onun onune bir kapi daha koyuyor.
       aylik uyarisi — 100 ustu deger neredeyse her zaman YILLIK
         orandir; mesaj bunu soyluyor, kuru bir "gecersiz" demiyor. */
  const faizH = document.getElementById('ktFaiz').value.trim();
  let faiz = null;
  if (faizH){
    if (/^\s*[-−]/.test(faizH)) return mesaj('kartMsg','hata',
      'Faiz oranı eksi olamaz. Bilinmiyorsa BOŞ bırak.');
    const f = parseFloat(faizH.replace(',','.'));
    if (!isFinite(f) || f < 0) return mesaj('kartMsg','hata',
      'Faiz oranı geçersiz. Bilinmiyorsa boş bırak.');
    if (f > 100) return mesaj('kartMsg','hata',
      'Aylık faiz oranı %100\'den büyük olamaz. Yıllık oranı girmiş olabilirsin — '
    + 'ekstredeki AYLIK oranı yaz (örn. %4,25).');
    faiz = f;
  }

  if (duz){
    /* ⚠ SESSIZ UPDATE YOK — donemOnizle kalibi: hangi alan neydi, ne
       oluyor, once gorunur, sonra onaylanir. trg_audit_kart zaten
       kim/ne zaman/eski-yeni kaydediyor; gerekce istenmiyor. */
    const yeni = { ad, banka: document.getElementById('ktBanka').value.trim() || null,
      sahip, son_odeme_gunu: so.deger, kesim_gunu: ke.deger, kart_limiti: limit,
      limit_paylasan_id: document.getElementById('ktPaylasan').value || null,
      faiz_orani: faiz,
      aciklama: document.getElementById('ktAciklama').value.trim() || null };
    /* tip 3 = yuzde. Onizleme tablosu faizi de gostersin — sessiz
       degisiklik olmasin (donemOnizle kalibinin sarti). */
    const ALAN = [['ad','Kart adı',0],['banka','Banka',0],['sahip','Sahip',0],
      ['kesim_gunu','Kesim günü',0],['son_odeme_gunu','Son ödeme günü',0],
      ['kart_limiti','Kart limiti',1],['faiz_orani','Aylık faiz oranı',3],
      ['limit_paylasan_id','Limit paylaşımı',2],['aciklama','Açıklama',0]];
    const kartAdi = (id) => { const x = (kartlar||[]).find(q => q.id === id); return x ? x.ad : '—'; };
    const gos = (v2, tip) => v2 == null || v2 === '' ? '—' : tip === 1 ? tl(v2)
      : tip === 2 ? kartAdi(v2) : tip === 3 ? '%' + String(v2).replace('.', ',') : String(v2);
    /* ⚠ Faizde SAYI karsilastirmasi: 4.25 ile "4.2500" ayni deger ama
       farkli dizge; duz karsilastirma "degisti" derdi. */
    const esit = (a2, b2, tip) => (a2 ?? null) === (b2 ?? null)
      || (tip === 1 && a2 != null && b2 != null && kr(a2) === kr(b2))
      || (tip === 3 && a2 != null && b2 != null && Number(a2) === Number(b2));
    const dgs = ALAN.filter(([f,,tip]) => !esit(duz[f], yeni[f], tip));
    const ov = document.getElementById('ktOnizleme'); ov.textContent = '';
    const dk = el('div','kart');
    dk.appendChild(el('div','kbaslik', dgs.length ? dgs.length + ' alan değişiyor' : 'Hiçbir alan değişmiyor'));
    if (!dgs.length){ dk.appendChild(el('div','kucuk','Girilenler kayıtlıyla birebir aynı.')); ov.appendChild(dk); return; }
    const t = document.createElement('table');
    const hr = document.createElement('tr');
    ['ALAN','ÖNCE','SONRA'].forEach((h,i) => hr.appendChild(el('th', i ? 'sag' : null, h)));
    t.appendChild(hr);
    for (const [f, adx, tip] of dgs){
      const tr = document.createElement('tr');
      tr.appendChild(td(adx)); tr.appendChild(td(gos(duz[f],tip),'sag')); tr.appendChild(td(gos(yeni[f],tip),'sag'));
      t.appendChild(tr);
    }
    const sar = el('div','tablo-sar'); sar.appendChild(t); dk.appendChild(sar);
    /* M2 · sinif degisimi SESSIZ OLMAZ */
    if (duz.sahip !== yeni.sahip)
      dk.appendChild(el('div','uyari-agir','Bu kart artık ' + (yeni.sahip === 'ltd' ? 'BARDAKS LTD' : 'ŞAHIS')
        + ' sınıfına geçecek — bant ve Özet\'teki borç sınıfı toplamları değişir.'));
    /* M4 · limit degisimi paylasanlarin kalan alanini degistirir */
    const paylasanlar = (kartlar||[]).filter(x => x.limit_paylasan_id === duz.id);
    if (paylasanlar.length && !esit(duz.kart_limiti, yeni.kart_limiti, 1))
      dk.appendChild(el('div','uyari-orta', paylasanlar.length
        + ' kart bu kartın limitinden kullanıyor — kalan alan hesapları değişecek.'));
    if ((duz.kesim_gunu ?? null) !== (yeni.kesim_gunu ?? null) || (duz.son_odeme_gunu ?? null) !== (yeni.son_odeme_gunu ?? null))
      dk.appendChild(el('div','kucuk','Geçmiş dönem kayıtları DEĞİŞMEZ (etiket ve tutarlar saklı); '
        + 'yalnız bundan sonraki vade türetimleri yeni günlere göre hesaplanır.'));
    const ok = el('button','btn','Onayla ve güncelle');
    ok.onclick = async () => {
      ok.disabled = true; ok.textContent = 'Güncelleniyor...';
      const { error } = await sb.from('kart').update(yeni).eq('id', duz.id);
      if (error){ ok.disabled = false; ok.textContent = 'Onayla ve güncelle';
        hataYaz('kartMsg','Kart güncellenemedi.', error); return; }
      await vKartlar();
      mesaj('kartMsg','ok', yeni.ad + ' güncellendi.');
    };
    dk.appendChild(ok);
    ov.appendChild(dk);
    return;
  }
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = await sb.from('kart').insert({
    ad, banka: document.getElementById('ktBanka').value.trim() || null,
    sahip, son_odeme_gunu: so.deger, kesim_gunu: ke.deger, kart_limiti: limit,
    faiz_orani: faiz,
    giren_id: PROFIL ? PROFIL.id : null });
  btn.disabled = false; btn.textContent = 'Kartı kaydet';
  if (error){ hataYaz('kartMsg','Kart kaydedilemedi.', error); return; }
  /* ⚠ SIRA · ONCE CIZIM, SONRA MESAJ. Olculdu: mesaj() once yaziliyordu
     ve vKartlar() #icerik'i bastan kurarken kartMsg kutusunu YENIDEN
     yaratiyordu — "Kart kaydedildi." ekrana HIC gelmiyordu. Ayni kusurun
     ayni bicimi v117'de index.html'de de cikmisti. */
  await vKartlar();
  mesaj('kartMsg','ok','Kart kaydedildi.');
}

/* AV · kart arsivleme — kredi/maden arsivlemesiyle AYNI mekanik. */

      () => sb.rpc('rpc_kart_pasife_al',{p_kart:kart.id,p_neden:neden}),
