/* FİRMA MERKEZİ — bakiye, açık faturalar, ödemeler ve o firmadan aldığın ürünler tek yerde.
   Eskiden bunlar dört ayrı kartta, firmadan bağımsız listeler hâlinde duruyordu; "bu firmaya
   ne kadar borçluyum ve neyi kaça alıyorum" sorusu tek ekranda cevaplanmıyordu. */
async function firmaDetay(id){
  const t = KATALOG.tedarikciler.find(x=>x.id===id);
  const ov = udKutu(), ic = document.getElementById('udIcerik');
  ic.innerHTML = `<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Yükleniyor...</div></div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  ov.classList.add('acik');
  const owner = PROFIL.rol === 'owner';

  const [bk, af, od, kl] = await Promise.all([
    owner ? sb.from('v_tedarikci_bakiye').select('*').eq('tedarikci_id',id).eq('sube_id', AKTIF_SUBE).maybeSingle()
          : Promise.resolve({data:null}),
    // Mutabakat icin TUM faturalar — firma butun hesabi soyluyor, sadece acik olanlari degil
    sb.from('alis').select('id,tarih,belge_no,toplam,vade_tarihi,odendi')
      .eq('tedarikci_id',id).eq('is_deleted',false).order('tarih',{ascending:false}),
    sb.from('tedarikci_odeme').select('tarih,tutar,yontem,cek_no,cek_vade,aciklama')
      .eq('tedarikci_id',id).eq('is_deleted',false).order('tarih',{ascending:false}),
    sb.from('alis_kalem')
      .select('miktar,birim_carpani,satir_tutar,urun_id,urun(ad,birim),alis!inner(tarih,tedarikci_id,is_deleted)')
      .eq('is_deleted',false).eq('alis.is_deleted',false).eq('alis.tedarikci_id',id)
  ]);

  const b = bk.data ? +bk.data.bakiye : null;
  const faturalar = af.data || [], odemeler = od.data || [];
  const acik = faturalar.filter(f=>!f.odendi);
  const bugunS = bugun();

  // Ürün bazında: kaç kez alındı, son birim fiyat ne, ilk fiyata göre ne oldu
  const urunler = {};
  (kl.data||[]).forEach(k=>{
    if(!k.urun_id || !k.urun) return;
    const adet = (+k.miktar||0) * (+k.birim_carpani||1);
    if(adet <= 0) return;
    const birim = (+k.satir_tutar||0) / adet;
    (urunler[k.urun_id] = urunler[k.urun_id] || { ad:k.urun.ad, birim:k.urun.birim, nk:[] })
      .nk.push({ ts:new Date(k.alis.tarih+'T00:00').getTime(), fiyat:birim });
  });
  const urunListe = Object.entries(urunler).map(([uid,u])=>{
    u.nk.sort((a,b)=>a.ts-b.ts);
    const ilk=u.nk[0].fiyat, son=u.nk[u.nk.length-1].fiyat;
    return { uid, ad:u.ad, birim:u.birim, kez:u.nk.length, son,
             degisim: ilk>0 ? ((son-ilk)/ilk)*100 : 0 };
  }).sort((a,b)=>b.degisim-a.degisim);

  const YONTEM = {kart:'Kart', nakit:'Nakit', havale:'Havale', cek:'Çek'};
  ic.innerHTML = `
    <div class="ud-ust">
      <div style="flex:1;min-width:0">
        <div class="ud-kod">FİRMA</div>
        <div class="ud-ad">${esc(t?t.ad:'—')}</div>
        ${t&&t.unvan?`<div class="ud-alt">${esc(t.unvan)}</div>`:''}
      </div>
      <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button>
    </div>
    <div class="ud-govde">
      ${b!==null ? `<div class="ud-kunye" style="grid-template-columns:1fr 1fr">
        <div><div class="ud-et">${b>0?'BORCUN':b<0?'İÇERİDE MALIN':'BAKİYE'}</div>
          <div class="ud-dg" style="color:${b>0?'var(--hata)':b<0?'var(--ok)':'var(--soluk)'}">${b===0?'Kapalı':tl(Math.abs(b))}</div></div>
        <div><div class="ud-et">AÇIK FATURA</div><div class="ud-dg">${acik.length}</div></div>
      </div>
      <!-- Firma "şu kadar borcunuz var" dediğinde karşılaştıracağın döküm -->
      <div class="ud-bas"><span class="ud-blk">MUTABAKAT</span></div>
      ${ozSatir('Kesilen fatura', tl(bk.data.toplam_alis))}
      ${ozSatir('Ödenen', '−'+tl(bk.data.toplam_odeme))}
      ${ozSatir('KALAN BORÇ', tl(b), true)}
      <div class="ipucu" style="margin-top:8px">Firma farklı bir rakam söylüyorsa aşağıdaki fatura ve
        ödeme listesini onunkiyle karşılaştır — eksik girilen belge çıkar.</div>` : ''}

      ${t && (t.telefon || t.yetkili_ad) ? `<div class="ud-bas"><span class="ud-blk">İLETİŞİM</span></div>
        <div class="ud-bos" style="padding-bottom:12px">
          ${t.yetkili_ad?esc(t.yetkili_ad)+'<br>':''}
          ${t.telefon?`<a href="tel:${esc(t.telefon)}" style="color:var(--ana);font-weight:800;text-decoration:none">${esc(t.telefon)} · ARA</a>`:''}
          ${t.telefon2?' · '+esc(t.telefon2):''}
        </div>` : ''}

      <div class="ud-bas"><span class="ud-blk">FATURALAR</span><span class="ud-trend">${faturalar.length} adet · ${tl(faturalar.reduce((a,x)=>a+ +x.toplam,0))}</span></div>
      ${faturalar.length===0 ? '<div class="ud-bos">Bu firmadan fatura girilmemiş.</div>' : faturalar.map(f=>{
        const gecikti = !f.odendi && f.vade_tarihi && f.vade_tarihi < bugunS;
        return `<div class="ud-satir">
          <div class="ud-trh">${new Date(f.tarih+'T00:00').toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}</div>
          <div><div style="font-weight:800;font-size:13px">${esc(f.belge_no||'Belge no yok')}
            ${f.odendi?'<span class="rozet rz-ok" style="margin-left:4px">ödendi</span>'
                      :gecikti?'<span class="rozet rz-hata" style="margin-left:4px">GECİKTİ</span>':''}</div>
            <div class="ud-alt">${f.vade_tarihi?'Vade '+new Date(f.vade_tarihi+'T00:00').toLocaleDateString('tr-TR'):'Vade yok'}</div></div>
          <div class="ud-tut">${tl(f.toplam)}</div>
        </div>`; }).join('')}

      <div class="ud-bas" style="margin-top:16px"><span class="ud-blk">ÖDEMELER</span><span class="ud-trend">${odemeler.length} adet</span></div>
      ${odemeler.length===0 ? '<div class="ud-bos">Bu firmaya ödeme kaydı yok.</div>' : odemeler.map(o=>`
        <div class="ud-satir">
          <div class="ud-trh">${new Date(o.tarih+'T00:00').toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}</div>
          <div><div style="font-weight:800;font-size:13px">${YONTEM[o.yontem]||esc(o.yontem||'—')}</div>
            <div class="ud-alt">${o.cek_no?'Çek '+esc(o.cek_no)+(o.cek_vade?' · vade '+new Date(o.cek_vade+'T00:00').toLocaleDateString('tr-TR'):''):esc(o.aciklama||'')}</div></div>
          <div class="ud-tut">${tl(o.tutar)}</div>
        </div>`).join('')}

      <div class="ud-bas" style="margin-top:16px"><span class="ud-blk">BU FİRMADAN ALDIKLARIN</span><span class="ud-trend">${urunListe.length} ürün</span></div>
      ${urunListe.length===0 ? '<div class="ud-bos">Kalemli fatura girilmemiş.</div>' : urunListe.map(u=>`
        <div class="ud-satir tikla" style="grid-template-columns:1fr auto" onclick="urunDetay('${u.uid}')">
          <div><div style="font-weight:800;font-size:13px">${esc(u.ad)}</div>
            <div class="ud-alt">${u.kez} alım · son ${tl(u.son)}/${esc(u.birim)}</div></div>
          <div class="ud-tut ${u.degisim>0.5?'ud-zam':u.degisim<-0.5?'ud-indi':''}">${u.kez<2?'—':(u.degisim>0?'+':'')+u.degisim.toFixed(0)+'%'}</div>
        </div>`).join('')}

      <button class="btn" style="margin-top:18px" onclick="tedarikciDuzenle('${id}')">Firma Bilgilerini Düzenle</button>
    </div>`;
}
/* Form artık hep açık durmuyor — ekran firma listesiyle başlıyor, form istenince geliyor */
function firmaFormAc(){
  TD_DUZENLENEN = null;
  const k = document.getElementById('firmaFormKart'); if(!k) return;
  k.style.display = 'block';
  document.getElementById('tdFormBaslik').textContent = 'Yeni Firma Ekle';
  ['tdYeniAd','tdYeniUnvan','tdYeniVergiNo','tdYeniVergiDairesi','tdYeniYetkili',
   'tdYeniTel','tdYeniTel2','tdYeniEmail','tdYeniAdres'].forEach(i=>{
    const e = document.getElementById(i); if(e) e.value='';
  });
  k.scrollIntoView({behavior:'smooth', block:'start'});
  setTimeout(()=>document.getElementById('tdYeniAd')?.focus(), 250);
}
function tedarikciDuzenle(id){
  const t = KATALOG.tedarikciler.find(x=>x.id===id); if (!t) return;
  TD_DUZENLENEN = id;
  udKapat();
  const k = document.getElementById('firmaFormKart'); if (k) k.style.display = 'block';
  document.getElementById('tdFormBaslik').textContent = 'Firmayı Düzenle: ' + t.ad;
  document.getElementById('tdYeniAd').value = t.ad||'';
  document.getElementById('tdYeniUnvan').value = t.unvan||'';
  document.getElementById('tdYeniVergiNo').value = t.vergi_no||'';
  document.getElementById('tdYeniVergiDairesi').value = t.vergi_dairesi||'';
  document.getElementById('tdYeniYetkili').value = t.yetkili_ad||'';
  document.getElementById('tdYeniTel').value = t.telefon||'';
  document.getElementById('tdYeniTel2').value = t.telefon2||'';
  document.getElementById('tdYeniEmail').value = t.email||'';
  document.getElementById('tdYeniAdres').value = t.adres||'';
  document.getElementById('tdYeniAd').scrollIntoView({behavior:'smooth'});
}
async function tedarikciEkleHizli(){
  const ad = document.getElementById('tdYeniAd').value.trim();
  if (!ad){ mesaj('tdYeniMsg','hata','Firma adı boş.'); return; }
  const kayit = {
    ad,
    unvan: document.getElementById('tdYeniUnvan').value.trim()||null,
    vergi_no: document.getElementById('tdYeniVergiNo').value.trim()||null,
    vergi_dairesi: document.getElementById('tdYeniVergiDairesi').value.trim()||null,
    yetkili_ad: document.getElementById('tdYeniYetkili').value.trim()||null,
    telefon: document.getElementById('tdYeniTel').value.trim()||null,
    telefon2: document.getElementById('tdYeniTel2').value.trim()||null,
    email: document.getElementById('tdYeniEmail').value.trim()||null,
    adres: document.getElementById('tdYeniAdres').value.trim()||null
  };
  const { data, error } = await sb.rpc('rpc_tedarikci_kaydet', {
    p_id: TD_DUZENLENEN, p_ad: kayit.ad, p_unvan: kayit.unvan, p_vergi_no: kayit.vergi_no,
    p_vergi_dairesi: kayit.vergi_dairesi, p_yetkili: kayit.yetkili_ad, p_tel: kayit.telefon,
    p_tel2: kayit.telefon2, p_email: kayit.email, p_adres: kayit.adres
  });
  if (error){ mesaj('tdYeniMsg','hata',hataTr(error.message)); return; }
  TD_DUZENLENEN = null;
  await katalogYukle(); vTedarikci();
}
async function odemeKaydet(){
  const tutar = paraDeger('toTutar');
  if (tutar===0){ mesaj('toMsg','hata','Tutar boş olamaz.'); return; }
  const toCek = document.getElementById('toYontem').value==='cek';
  const data = await rpcCagir('rpc_tedarikci_odeme_kaydet',{
    p_idem: idem(), p_sube: AKTIF_SUBE,
    p_tedarikci: document.getElementById('toTedarikci').value,
    p_tarih: document.getElementById('toTarih').value,
    p_tutar: tutar,
    p_aciklama: document.getElementById('toAciklama').value.trim()||null,
    p_yontem: document.getElementById('toYontem').value,
    p_cek_no: toCek ? (document.getElementById('toCekNo').value.trim()||null) : null,
    p_cek_vade: toCek ? (document.getElementById('toCekVade').value||null) : null
  },'toKaydet','toMsg','Ödeme kaydedildi ✓');
  if (data && data.ok) vTedarikci();
}
async function dokumGoster(){
  const tid = document.getElementById('dkTedarikci').value;
  const { data } = await sb.from('alis').select('*').eq('tedarikci_id',tid).eq('is_deleted',false).order('tarih');
  document.getElementById('dokumAlan').innerHTML = `
    ${(data||[]).length===0?'<div class="bilgi-not">Kayıt yok.</div>':(data||[]).map(a=>`
      <div class="liste-satir">
        <div class="l-sol"><div class="b">${new Date(a.tarih+'T00:00').toLocaleDateString('tr-TR')} · ${esc(a.tur)}</div>
          <div class="k">Belge:${esc(a.belge_no||'—')} · Fiş:${esc(a.fis_no||'—')}</div></div>
        <div class="l-sag">${tl(a.toplam)}</div>
      </div>`).join('')}`;
}

/* ================== PERSONEL (SADECE OWNER) ================== */
let PG_DONEM = null;
/* SGK TAHMİNİ — YASAL HESAP DEĞİL.
   Formül: brüt = net/0,85 (asgari ücret GV+damga istisnası) → yük = brüt × %37,5
   (işçi payı %15 + işveren primi %22,5).
   Bu oran SABİT KODLANMIŞTIR ve MUHASEBECİ TEYİDİ ALMAMIŞTIR. Gerçek bordroda
   şunlar değiştirir: 5 puanlık işveren indirimi, teşvikler, prime esas kazanç
   tavanı, asgari ücret üstü maaşlar, eksik gün, kıdem/ihbar.
   Anayasa md.4: mevzuata bağlı kurallar teyitsiz sabitlenemez, varsayım olarak
   işaretlenir. O yüzden ekranda "yasal" değil TAHMİN yazıyor. */
function sgkHesapla(net){ return net>0 ? +((net/0.85)*0.375).toFixed(2) : 0; }
async function vPersonel(){
  const el = document.getElementById('icerik');
  if (PROFIL.rol !== 'owner'){ el.innerHTML = '<div class="bilgi-not">Bu ekran yöneticiye özeldir.</div>'; return; }
  const donem = PG_DONEM || bugun().slice(0,7);
  PG_DONEM = donem;
  const { data } = await sb.from('personel_gider').select('*').eq('donem', donem)
    .eq('is_deleted', false).order('personel_adi');
  const kayitlar = data||[];
  const T = {maas:0,sgk:0,prim:0,yemek:0,maliyet:0};
  kayitlar.forEach(p=>{ const mal=(+p.maas)+(+p.sgk)+(+p.prim)+(+p.yemek);
    T.maas+=+p.maas; T.sgk+=+p.sgk; T.prim+=+p.prim; T.yemek+=+p.yemek; T.maliyet+=mal; });
  const satir = (ad, maas, sgk, prim, yemek, maliyet, silId, kalin) =>
    `<tr style="${kalin?'font-weight:800;background:var(--acik)':''}">
      <td style="padding:8px 6px;text-align:left">${ad}</td>
      <td style="padding:8px 6px;text-align:right">${tl(maas)}</td>
      <td style="padding:8px 6px;text-align:right;color:var(--soluk)">${tl(sgk)}</td>
      <td style="padding:8px 6px;text-align:right">${tl(prim)}</td>
      <td style="padding:8px 6px;text-align:right">${tl(yemek)}</td>
      <td style="padding:8px 6px;text-align:right;color:var(--ana);font-weight:800">${tl(maliyet)}</td>
      <td style="padding:8px 2px;text-align:center">${silId?`<button class="btn-kirmizi" style="padding:4px 8px" onclick="pgSil('${silId}','${ad}')">✕</button>`:''}</td>
    </tr>`;
  el.innerHTML = `
    <h2 class="bolum">Personel Giderleri</h2>
    ${kayitlar.length ? `<div class="ozet-grid">
      <div class="ozet-kut"><div class="e">AY MALİYETİ</div><div class="d">${tl(T.maliyet)}</div>
        <div class="aciklama">${kayitlar.length} kişi</div></div>
      <div class="ozet-kut"><div class="e">KİŞİ BAŞI</div><div class="d">${tl(T.maliyet/kayitlar.length)}</div>
        <div class="aciklama">SGK ${tl(T.sgk)} dahil</div></div>
    </div>` : ''}
    <div class="kart">
      ${kbaslik('', ayAdi(donem), '')}
      <label>Dönem</label>
      <input type="month" id="pgDonem" value="${donem}" onchange="PG_DONEM=this.value; vPersonel()">
      ${kayitlar.length===0 ? `${bosDurum('liste','Bu ay kayıt yok','Geçen ayın satırlarını kopyalayıp tutarları güncelleyebilirsin.')}
        <button class="btn2" style="display:block;margin:0 auto" onclick="pgOncekiAydanKopyala()">Önceki aydan kopyala</button>` : `
      <div style="overflow-x:auto;margin-top:10px">
        <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:520px">
          <thead><tr style="border-bottom:2px solid var(--cizgi);font-size:11px;color:var(--soluk)">
            <th style="padding:6px;text-align:left">PERSONEL</th>
            <th style="padding:6px;text-align:right">MAAŞ (yatan)</th>
            <th style="padding:6px;text-align:right">SGK</th>
            <th style="padding:6px;text-align:right">PRİM</th>
            <th style="padding:6px;text-align:right">YEMEK</th>
            <th style="padding:6px;text-align:right">MALİYET</th>
            <th></th>
          </tr></thead>
          <tbody>
            ${kayitlar.map(p=>satir(esc(p.personel_adi), p.maas, p.sgk, p.prim, p.yemek,
              (+p.maas)+(+p.sgk)+(+p.prim)+(+p.yemek), p.id)).join('')}
            ${satir('AY TOPLAMI', T.maas, T.sgk, T.prim, T.yemek, T.maliyet, null, true)}
          </tbody>
        </table>
      </div>`}
    </div>
    <div class="kart">
      <div class="kbaslik">Personel Satırı Ekle (${donem})</div>
      <label>Ad Soyad</label><input type="text" id="pgAd">
      <div class="satir">
        <div><label>Maaş (hesaba yatan / net)</label><input type="text" inputmode="decimal" id="pgMaas" placeholder="0,00"></div>
        <div><label>SGK (tahmin — bordrodan doğrula)</label><input type="text" inputmode="decimal" id="pgSgk" placeholder="tahmin"></div>
      </div>
      <div class="uyari-orta" style="margin:4px 0 0"><b>Bu rakam tahmindir, yasal hesap değildir.</b>
        Net maaştan kaba bir SGK yükü çıkarır (asgari ücret varsayımı, %37,5 sabit oran).
        <b>Gerçek tutarı bordrodan yaz.</b> Teşvik, 5 puanlık indirim, tavan aşımı, eksik gün
        ve asgari ücret üstü maaşlarda bu rakam tutmaz — muhasebeci teyidi alınmamıştır.</div>
      <div class="satir">
        <div><label>Prim</label><input type="text" inputmode="decimal" id="pgPrim" placeholder="0,00"></div>
        <div><label>Yemek</label><input type="text" inputmode="decimal" id="pgYemek" placeholder="0,00"></div>
      </div>
      <button class="btn" id="pgKaydet" onclick="pgEkle()">Satırı Ekle</button>
      <div class="hata-msg" id="pgMsg"></div>
    </div>`;
  paraBaglaHepsi(['pgMaas','pgSgk','pgPrim','pgYemek']);
  document.getElementById('pgMaas').addEventListener('input', e=>{
    document.getElementById('pgSgk').value = sgkHesapla(paraDeger('pgMaas')) || '';
  });
}
async function pgEkle(){
  const ad = document.getElementById('pgAd').value.trim();
  const maas = paraDeger('pgMaas');
  if (!ad){ mesaj('pgMsg','hata','Ad boş olamaz.'); return; }
  if (maas===0 && !confirm('Maaş 0 girildi — emin misiniz?')) return;
  const { error } = await sb.from('personel_gider').insert({
    sube_id: AKTIF_SUBE, donem: PG_DONEM, personel_adi: ad,
    maas, sgk: paraDeger('pgSgk'),
    prim: paraDeger('pgPrim'),
    yemek: paraDeger('pgYemek'),
    avans: 0
  });
  if (error){ mesaj('pgMsg','hata',error.message); return; }
  vPersonel();
}
async function pgSil(id, ad){
  if (!confirm(ad + ' bu aydan çıkarılsın mı? (kayıt silinmez, arşivde kalır)')) return;
  const { error } = await sb.from('personel_gider').update({ is_deleted:true }).eq('id', id);
  if (error){ alert('Çıkarılamadı: '+error.message); return; }
  vPersonel();
}
async function pgOncekiAydanKopyala(){
  const [y, a] = PG_DONEM.split('-').map(Number);
  const onceki = a===1 ? (y-1)+'-12' : y+'-'+String(a-1).padStart(2,'0');
  const { data } = await sb.from('personel_gider').select('*').eq('donem', onceki).eq('is_deleted', false);
  if (!data || data.length===0){ alert('Önceki ayda ('+onceki+') kayıt yok.'); return; }
  for (const p of data){
    await sb.from('personel_gider').insert({
      sube_id: p.sube_id, donem: PG_DONEM, personel_adi: p.personel_adi,
      maas: p.maas, sgk: p.sgk, prim: p.prim, yemek: p.yemek, avans: 0
    });
  }
  vPersonel();
}

/* ================== YAPILACAKLAR / ALINACAKLAR ================== */
async function vTalep(){
  const el = document.getElementById('icerik');
  el.innerHTML = `
    <h2 class="bolum">Yapılacaklar / Alınacaklar</h2>
    <div class="kart">
      ${kbaslik('', 'Yeni Madde', '')}
      <textarea id="tlMesaj" rows="2" placeholder="örn: 50 kg şeker, peçete, bardak alınacak / arıtma bakımı yapılacak"></textarea>
      <div class="ipucu" style="margin-top:6px">Yaz — herkes görür, yapan işaretler.</div>
      <button class="btn" id="tlKaydet" onclick="talepKaydet()">Listeye Ekle</button>
      <div class="hata-msg" id="tlMsg"></div>
    </div>
    <div id="tlListe"></div>`;
  talepListe();
}
async function talepKaydet(){
  const m = document.getElementById('tlMesaj').value.trim();
  if (!m){ mesaj('tlMsg','hata','Boş madde eklenemez.'); return; }
  const data = await rpcCagir('rpc_duzeltme_talebi_ac',{
    p_idem: idem(), p_sube: AKTIF_SUBE, p_hedef_tablo:null, p_hedef_id:null, p_mesaj:m
  },'tlKaydet','tlMsg','Listeye eklendi ✓');
  if (data && data.ok){ document.getElementById('tlMesaj').value=''; talepListe(); talepRozet(); }
}
async function talepListe(){
  const { data } = await sb.from('duzeltme_talebi')
    .select('*, olusturan:olusturan_id(ad), cozen:cozen_id(ad)')
    .eq('is_deleted',false).order('durum').order('created_at',{ascending:false}).limit(50);
  const el = document.getElementById('tlListe'); if(!el) return;
  const acik = (data||[]).filter(t=>t.durum==='acik');
  const bitti = (data||[]).filter(t=>t.durum!=='acik');
  // Kaç gündür beklediği görünsün — 7 günü geçen madde unutulmuş demektir
  const gun = (t) => Math.floor((Date.now() - new Date(t.created_at).getTime()) / 86400000);
  const kart = (t) => {
    const g = gun(t), eski = t.durum==='acik' && g >= 7;
    return `<div class="sr">
      <div>
        <div class="sr-ad" style="${t.durum!=='acik'?'text-decoration:line-through;color:var(--soluk);font-weight:700':''}">${esc(t.mesaj)}</div>
        <div class="sr-alt">${esc(t.olusturan?.ad||'—')} · ${g===0?'bugün':g+' gündür'}
          ${eski?'<span class="rozet rz-hata" style="margin-left:4px">UNUTULDU</span>':''}
          ${t.durum!=='acik'?`<br><span style="color:var(--ok);font-weight:800">✓ ${esc(t.cozen?.ad||'')} yaptı${t.cozum_tarihi?' · '+new Date(t.cozum_tarihi).toLocaleDateString('tr-TR'):''}</span>`:''}</div>
      </div>
      <div style="text-align:right;white-space:nowrap">
        ${t.durum==='acik'
          ? `<button class="btn2" onclick="yapildiIsaretle('${t.id}',false)">✓ Yaptım</button>`
          : `<button class="btn2" style="background:var(--gri);color:var(--soluk)" onclick="yapildiIsaretle('${t.id}',true)">Geri Al</button>`}
        <button class="bo-btn" style="color:var(--hata);display:block;margin:4px 0 0 auto" onclick="maddeSil('${t.id}')">Sil</button>
      </div>
    </div>`;
  };
  const unutulan = acik.filter(t=>gun(t)>=7).length;
  el.innerHTML = `
    <div class="kart">
      ${kbaslik(unutulan?unutulan+' MADDE UNUTULDU':'', 'Bekleyenler', `<div class="kb-sag">${acik.length}</div>`)}
      ${acik.length===0
        ? bosDurum('liste','Bekleyen madde yok','Alınacak veya yapılacak bir şey çıktığında yukarıdan ekle.')
        : acik.map(kart).join('')}
    </div>
    ${bitti.length>0?`<div class="kart">
      ${kbaslik('', 'Tamamlananlar', `<div class="kb-sag">${bitti.length}</div>`)}
      ${bitti.map(kart).join('')}</div>`:''}`;
}
async function yapildiIsaretle(id, geri){
  const { error } = await sb.rpc('rpc_yapildi_isaretle', { p_id:id, p_geri:geri });
  if (error){ alert('Güncellenemedi: '+hataTr(error.message)); return; }
  talepListe(); talepRozet();
}
async function maddeSil(id){
  if (!confirm('Bu madde silinsin mi?')) return;
  const { error } = await sb.rpc('rpc_madde_sil', { p_id:id });
  if (error){ alert('Silinemedi: '+hataTr(error.message)); return; }
  talepListe(); talepRozet();
}

/* ================== ARAÇ (OWNER) ==================
   Aracın kimliği burada, masrafları GİDER tablosunda (arac_id ile bağlı).
   Böylece yakıt/bakım/MTV hem bu ekranda toplanır hem kâra doğru düşer — çift sayım yok.
   Gelir vergisi buraya GİRMEZ: o kâr üzerinden alınır, aracın masrafı değildir.       */
let AR_YIL = null;
async function vArac(){
  const el = document.getElementById('icerik');
  if (PROFIL.rol !== 'owner'){ el.innerHTML = '<div class="ipucu">Bu ekran yöneticiye özeldir.</div>'; return; }
  el.innerHTML = '<h2 class="bolum">Araç</h2><div class="kart">Yükleniyor...</div>';
  const yil = AR_YIL || bugun().slice(0,4);
  AR_YIL = yil;
  const [ar, mal] = await Promise.all([
    sb.from('arac').select('*').eq('is_deleted',false).order('plaka'),
    sb.from('v_arac_maliyet').select('*').eq('yil',yil)
  ]);
  if (ar.error){ el.innerHTML = `<div class="kart"><div class="uyari-agir">Araçlar yüklenemedi: ${esc(hataTr(ar.error.message))}</div></div>`; return; }
  const araclar = ar.data||[], masraf = mal.data||[];

  // Tarih uyarısı: muayene/sigorta/kasko yaklaşıyor mu
  const gunFark = (t)=> t ? Math.round((new Date(t+'T00:00') - new Date(bugun()+'T00:00'))/86400000) : null;
  const tarihDurum = (t, ad)=>{
    const g = gunFark(t);
    if (g === null) return { sinif:'', metin: ad+' girilmemiş', gun:null };
    if (g < 0)  return { sinif:'uyari-agir',  metin:`${ad} ${Math.abs(g)} gün önce GEÇTİ`, gun:g };
    if (g <= 30) return { sinif:'uyari-orta', metin:`${ad} ${g} gün sonra`, gun:g };
    return { sinif:'', metin:`${ad}: ${new Date(t+'T00:00').toLocaleDateString('tr-TR')}`, gun:g };
  };

  el.innerHTML = `
    <h2 class="bolum">Araç</h2>
    ${araclar.length===0
      ? `<div class="kart">${bosDurum('kutu','Kayıtlı araç yok','Aşağıdan plakayı ekle; yakıt, bakım, sigorta ve MTV masrafları o araca bağlanır.')}</div>`
      : araclar.map(a=>{
          const m = masraf.filter(x=>x.arac_id===a.id);
          const toplam = m.reduce((s,x)=>s+ +x.tutar,0);
          const kat = {};
          m.forEach(x=>{ kat[x.kategori||'Diğer'] = (kat[x.kategori||'Diğer']||0) + +x.tutar; });
          const sirali = Object.entries(kat).sort((a,b)=>b[1]-a[1]);
          const uyarilar = [tarihDurum(a.muayene_tarihi,'Muayene'),
                            tarihDurum(a.sigorta_bitis,'Sigorta'),
                            tarihDurum(a.kasko_bitis,'Kasko')];
          const acil = uyarilar.filter(u=>u.sinif);
          return `<div class="kart">
            ${kbaslik(esc(a.marka_model||'ARAÇ'), esc(a.plaka),
               `<button class="btn2" onclick="aracDuzenle('${a.id}')">Düzenle</button>`)}
            ${acil.map(u=>`<div class="${u.sinif}">${esc(u.metin)}</div>`).join('')}
            <div class="ozet-grid">
              <div class="ozet-kut"><div class="e">${yil} MALİYETİ</div>
                <div class="d">${tl(toplam)}</div>
                <div class="aciklama">${m.reduce((s,x)=>s+ +x.kayit,0)} kayıt${toplam>0?'<br>ayda ~'+tl(toplam/12):''}</div></div>
              <div class="ozet-kut"><div class="e">KAYITLI</div>
                <div class="d" style="font-size:16px">${a.kayitli_kime==='sirket'?'Şirket':'Şahıs'}</div>
                <div class="aciklama">${uyarilar.filter(u=>!u.sinif && u.gun!==null).length} tarih takipte</div></div>
            </div>
            ${sirali.length ? sirali.map(([k,v])=>ozSatir(esc(k), tl(v))).join('')
                              + ozSatir(yil+' TOPLAM', tl(toplam), true)
                            : '<div class="ipucu">Bu yıl bu araca masraf girilmemiş.</div>'}
            <div class="bilgi-not" style="margin-top:10px">
              ${uyarilar.filter(u=>u.gun!==null && !u.sinif).map(u=>esc(u.metin)).join(' · ') || 'Muayene/sigorta/kasko tarihi girilmemiş — Düzenle\'den ekle, yaklaşınca uyarır.'}
            </div>
          </div>`;
        }).join('')}

    <div class="kart">
      ${kbaslik('', 'Araç Masrafı Ekle', '')}
      <label>Araç</label>
      <select id="agArac">${araclar.map(a=>`<option value="${a.id}">${esc(a.plaka)}</option>`).join('')}</select>
      <label>Ne için?</label>
      <select id="agKategori">${KATALOG.kategoriler
        .filter(k=>/Yakıt|Araç|Taşıt|Otopark/.test(k.ad))
        // Yakıt en sık girilen kalem — listede ilk sırada olsun. Alfabetik sırada
        // "Araç Bakım" öne geçiyordu ve yakıt yanlış kategoriye kaydediliyordu.
        .sort((a,b)=>(a.ad==='Yakıt'?-1:b.ad==='Yakıt'?1:a.ad.localeCompare(b.ad,'tr')))
        .map(k=>`<option value="${k.id}">${esc(k.ad)}</option>`).join('')}</select>
      ${tarihSecici('agTarih')}
      <label>Tutar</label><input type="text" inputmode="decimal" id="agTutar" placeholder="0,00">
      <label>KDV Tutarı (belgede yazanı yaz; MTV'de yoktur, boş bırak)</label>
      <input type="text" inputmode="decimal" id="agKdv" placeholder="0,00">
      <label>Açıklama</label><input type="text" id="agAciklama" placeholder="örn: 40 lt motorin, 152.000 km">
      <label>Belge (fiş fotoğrafı veya PDF)</label>
      <input type="file" id="agFoto" accept="image/*,application/pdf,.pdf">
      <button type="button" class="btn2" id="agOku" onclick="aracBelgeOku()" style="width:100%;margin-top:6px">
        📄 Belgeyi oku — tutarı doldur</button>
      <div class="oku-durum" id="agOkuDurum"></div>
      <button class="btn" id="agKaydet" onclick="aracMasrafKaydet()">Masrafı Kaydet</button>
      <div class="hata-msg" id="agMsg"></div>
      <div class="ipucu">Bu masraf normal giderlere de yazılır — ay kârından düşer.</div>
    </div>

    <div class="kart">
      ${kbaslik('', 'Yeni Araç', `<button class="btn2" onclick="katlaAc('aracFormKutu',this)">Aç</button>`)}
      <div id="aracFormKutu" style="display:none">
        <input type="hidden" id="arId">
        <label>Plaka *</label><input type="text" id="arPlaka" placeholder="61 ABC 123">
        <label>Marka / Model</label><input type="text" id="arMarka" placeholder="örn: Fiat Doblo 1.6">
        <div class="satir">
          <div><label>Model Yılı</label><input type="text" inputmode="numeric" id="arYil"></div>
          <div><label>Kayıtlı</label>
            <select id="arKayitli"><option value="sahis">Şahıs</option><option value="sirket">Şirket</option></select></div>
        </div>
        <label>Muayene Tarihi (bir sonraki)</label><input type="date" id="arMuayene">
        <div class="satir">
          <div><label>Sigorta Bitiş</label><input type="date" id="arSigorta"></div>
          <div><label>Kasko Bitiş</label><input type="date" id="arKasko"></div>
        </div>
        <label>Not</label><input type="text" id="arNot">
        <button class="btn" id="arKaydet" onclick="aracKaydet()">Aracı Kaydet</button>
        <div class="hata-msg" id="arMsg"></div>
      </div>
    </div>

    <div class="kart">
      ${kbaslik('YIL', 'Masraf Dökümü', '')}
      <label>Yıl</label>
      <input type="number" id="arYilSec" value="${yil}" min="2020" max="2099"
             onchange="AR_YIL=this.value; vArac()">
      <div class="ipucu">Yakıt, bakım, sigorta, MTV — hepsi yukarıdaki araç kartında toplanıyor.</div>
    </div>`;
  paraBaglaHepsi(['agTutar','agKdv']);
}

/* ARAÇ BELGESİ OKUMA
   Fatura ekranında "Belgeyi oku" vardı, araç masrafında YOKTU — kullanıcı fişin
   fotoğrafını yüklüyor, tutar boş kalıyordu. Aynı Edge Function (fatura-oku)
   akaryakıt fişini de okuyor; termal fiş kuralları zaten içinde tanımlı.
   Okunan değer ÖNERİDİR: alanlar dolar, kaydetmeden önce kullanıcı görür. */
async function aracBelgeOku(){
  const inp = document.getElementById('agFoto');
  const drm = document.getElementById('agOkuDurum');
  const btn = document.getElementById('agOku');
  const yaz = (t, s) => { if (drm){ drm.className = 'oku-durum ' + (s||''); drm.textContent = t; } };
  if (!(inp && inp.files && inp.files[0])){ yaz('Önce belgenin fotoğrafını veya PDF\'ini seç.','uyari'); return; }

  btn.disabled = true; const eski = btn.textContent; btn.textContent = 'Okunuyor...';
  yaz('Belge okunuyor, 10-20 saniye sürebilir...','');
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('Oturum bulunamadı, tekrar giriş yapın.');
    const f = inp.files[0];
    let govde;
    if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf'){
      const c = await pdfMetinCikar(f);
      if (!c.yeterli) throw new Error('Bu PDF taranmış görünüyor (metin çıkmadı). Fotoğrafını çekip dene.');
      govde = { metin: c.metin };
    } else {
      const k = await fotoKucult(f, 2000, 0.92);
      govde = { gorsel: await new Promise((coz,red)=>{ const fr=new FileReader();
        fr.onload=()=>coz(fr.result); fr.onerror=()=>red(new Error('Fotoğraf okunamadı')); fr.readAsDataURL(k.veri); }) };
    }
    const y = await fetch(SB_URL + '/functions/v1/fatura-oku', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+session.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify(govde)
    });
    const s = await y.json();
    if (!y.ok || !s.ok) throw new Error(s?.hata || ('Okuma başarısız ('+y.status+')'));

    const v = s.veri || {}, doldu = [];
    const koy = (id, deger, etiket) => {
      if (deger === null || deger === undefined || deger === '') return;
      const e = document.getElementById(id); if (!e) return;
      e.value = String(deger).replace('.', ',');
      e.dispatchEvent(new Event('input',{bubbles:true}));
      e.classList.add('oku-dolu'); doldu.push(etiket);
    };
    if (v.tarih && /^\d{4}-\d{2}-\d{2}$/.test(v.tarih)){
      const t = document.getElementById('agTarih');
      if (t){ t.value = v.tarih; t.classList.add('oku-dolu'); doldu.push('Tarih'); }
    }
    koy('agTutar', v.odenecek ?? v.genel_toplam, 'Tutar');
    const kdv = v.kdv_toplam ?? (Array.isArray(v.kdv_kirilim)
      ? v.kdv_kirilim.reduce((a,k)=>a + (+k.kdv_tutar||0), 0) || null : null);
    koy('agKdv', kdv, 'KDV');

    // Açıklama: yakıt fişinde satır "MOTORİN 40,5 LT" gibi gelir — miktarı koru
    const s1 = Array.isArray(v.satirlar) && v.satirlar.length ? v.satirlar[0] : null;
    const ack = document.getElementById('agAciklama');
    if (ack && !ack.value.trim()){
      const parca = [];
      if (s1?.ad) parca.push(s1.ad);
      if (s1?.miktar) parca.push(s1.miktar + (s1.birim ? ' '+s1.birim : ''));
      if (v.tedarikci?.ad) parca.push(v.tedarikci.ad);
      if (parca.length){ ack.value = parca.join(' · '); ack.classList.add('oku-dolu'); doldu.push('Açıklama'); }
    }

    if (doldu.length === 0){
      yaz('Belge okundu ama tutar bulunamadı — elle yaz.','uyari');
    } else {
      yaz('Dolduruldu: ' + doldu.join(', ') + ' · rakamları belgeyle karşılaştır, sonra kaydet.','ok');
    }
  }catch(e){
    yaz(hataTr(e.message || String(e)), 'uyari');
  }finally{
    btn.disabled = false; btn.textContent = eski;
  }
}
async function aracMasrafKaydet(){
  const tutar = paraDeger('agTutar');
  if (tutar === 0){ mesaj('agMsg','hata','Tutar boş olamaz.'); return; }
  const arac = document.getElementById('agArac').value;
  if (!arac){ mesaj('agMsg','hata','Önce araç ekle.'); return; }
  const btn = document.getElementById('agKaydet');
  btn.disabled = true; btn.textContent = 'Fotoğraf yükleniyor...';
  let foto = null;
  try { foto = await fotoYukle('agFoto','fatura'); }
  catch(e){ mesaj('agMsg','hata',e.message); btn.disabled=false; btn.textContent='Masrafı Kaydet'; return; }
  const data = await rpcCagir('rpc_gider_kaydet',{
    p_idem: idem(), p_sube: AKTIF_SUBE,
    p_tarih: document.getElementById('agTarih').value,
    p_kategori: document.getElementById('agKategori').value,
    p_aciklama: document.getElementById('agAciklama').value.trim()||null,
    p_tutar: tutar, p_kdv_orani: null, p_kdv_tutar: paraDeger('agKdv'),
    p_foto: foto, p_kasadan: false, p_tedarikci: null, p_arac: arac
  },'agKaydet','agMsg','Masraf kaydedildi ✓');
  if (data && data.ok){
    ['agTutar','agKdv','agAciklama'].forEach(i=>{ const e=document.getElementById(i); e.value=''; e.classList.remove('oku-dolu'); });
    const od=document.getElementById('agOkuDurum'); if(od){ od.textContent=''; od.className='oku-durum'; }
    document.getElementById('agFoto').value='';
    setTimeout(vArac, 700);
  }
}

/* ================== BELGELER ==================
   Belgeler yükleniyordu ama hiçbir yerde toplu görünmüyordu: bir dekontu bulmak
   için hangi kayda eklendiğini hatırlamak gerekiyordu. Daha kötüsü, BELGESİ
   OLMAYAN kayıtlar hiç görünmüyordu — kanıt eksiği sessiz kalıyordu.
   Bu ekran ikisini birden gösterir; eksikler üstte, çünkü iş onlarda. */
let BG_AY = null, BG_TUR = 'hepsi', BG_LISTE = [];
const BG_TUR_AD = { z_raporu:'Z Raporu', pos_slip:'POS Slip', fatura:'Fatura',
                    gider:'Gider', vergi:'Vergi/SGK' };
async function vBelge(){
  const el = document.getElementById('icerik');
  const ay = BG_AY || bugun().slice(0,7);
  el.innerHTML = '<h2 class="bolum">Belgeler</h2><div class="kart">Yükleniyor...</div>';

  const { data, error } = await sb.from('v_belgeler').select('*')
    .gte('tarih', ay + '-01').lte('tarih', aySon(ay)).order('tarih', { ascending:false });
  if (error){
    el.innerHTML = `<h2 class="bolum">Belgeler</h2>
      <div class="uyari-agir">Belgeler yüklenemedi: ${esc(hataTr(error.message))}</div>`;
    return;
  }
  BG_LISTE = data || [];
  const eksik = BG_LISTE.filter(x => !x.yol);
  const eksikTutar = eksik.reduce((a,x) => a + (+x.tutar||0), 0);
  const gorunen = BG_TUR === 'hepsi' ? BG_LISTE : BG_LISTE.filter(x => x.tur === BG_TUR);
  // Eksikler üstte: yapılacak iş onlar
  const sirali = [...gorunen].sort((a,b) => (a.yol?1:0) - (b.yol?1:0) || (a.tarih < b.tarih ? 1 : -1));

  const turSay = {};
  BG_LISTE.forEach(x => {
    turSay[x.tur] = turSay[x.tur] || { hepsi:0, eksik:0 };
    turSay[x.tur].hepsi++; if (!x.yol) turSay[x.tur].eksik++;
  });

  el.innerHTML = `
    <h2 class="bolum">Belgeler</h2>
    <div class="ay-gez">
      <button onclick="bgAyDegistir(-1)" aria-label="Önceki ay">‹</button>
      <div><div class="ay-ad">${ayAdi(ay)}</div>
        <div class="ay-alt">${BG_LISTE.length} belge taşıyan kayıt</div></div>
      <button onclick="bgAyDegistir(1)" ${ay >= bugun().slice(0,7) ? 'disabled' : ''} aria-label="Sonraki ay">›</button>
    </div>

/* KAPALI GÜN — kampüs kapalıysa o gün "eksik" sayılmasın.
   Yanlış alarm, uyarıların tamamını değersizleştirir. */
async function kapaliGunIsaretle(tarih){
  const t = new Date(tarih+'T00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
  const neden = prompt(`${t}\n\nBu gün işletme kapalı mıydı? Nedenini yaz:\n`
    + `(örn: resmi tatil, kampüs kapalı, yıllık izin)`);
  if (!neden || !neden.trim()) return;
  const { data, error } = await sb.rpc('rpc_kapali_gun',
    { p_sube: AKTIF_SUBE, p_tarih: tarih, p_neden: neden.trim(), p_geri: false });
  if (error){ alert('İşaretlenemedi: ' + hataTr(error.message)); return; }
  if (data && data.ok) vOzet();
}

      .gte('tarih', ay+'-01').lte('tarih', aySon(ay)).order('tarih', { ascending:false })

async function ownerHareketKaydet(){
  const g = id => document.getElementById(id);
  const tutar = paraDeger('ohTutar');
  if (tutar <= 0){ mesaj('ohMsg','hata','Tutar girilmedi.'); return; }
  const yon = g('ohYon').value, yontem = g('ohYontem').value;
  const ad = yon === 'koyus' ? 'İŞLETMEYE PARA KOYDUN' : 'İŞLETMEDEN PARA ÇEKTİN';
  if (!confirm(`${ad}\n\n${tl(tutar)} · ${yontem === 'banka' ? 'banka' : 'kasa'}\n`
    + `${new Date(g('ohTarih').value+'T00:00').toLocaleDateString('tr-TR')}\n\n`
    + `Bu kâra girmez, sadece kasa/banka bakiyesini açıklar.\nOnaylıyor musun?`)) return;
  const data = await rpcCagir('rpc_owner_hareket_kaydet', {
    p_idem: idem(), p_sube: AKTIF_SUBE, p_tarih: g('ohTarih').value,
    p_yon: yon, p_tutar: tutar, p_yontem: yontem, p_not: g('ohNot').value.trim() || null
  }, 'ohKaydet','ohMsg','Kaydedildi ✓');
  if (data && data.ok){
    ['ohTutar','ohNot'].forEach(i => g(i).value = '');
    ownerHareketYukle(OZ_AY || bugun().slice(0,7));
  }
}
async function ownerHareketSil(id){

  if (!neden || !neden.trim()) return;
  const { error } = await sb.rpc('rpc_owner_hareket_sil', { p_id:id, p_neden:neden.trim() });
  if (error){ mesaj('ohMsg','hata', hataTr(error.message)); return; }
  ownerHareketYukle(OZ_AY || bugun().slice(0,7));
}
function bgAyDegistir(fark){
  const t = new Date((BG_AY || bugun().slice(0,7)) + '-01T00:00');
  t.setMonth(t.getMonth() + fark);
  const yeni = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0');
  if (yeni > bugun().slice(0,7)) return;
  BG_AY = yeni; vBelge();
}
/* Satırdaki "Belge Yükle" — dosya seçtirir, yükler, kayda bağlar */
function belgeYukleAc(tur, kayitId, baslik){
  const inp = document.getElementById('bgDosya'); if (!inp) return;
  inp.value = '';
  inp.onchange = async () => {
    if (!inp.files || !inp.files[0]) return;
    mesaj('bgMsg','ok','Belge yükleniyor...');
    try{
      const yol = await fotoYukle('bgDosya', tur === 'vergi' ? 'vergi' : 'fatura');
      if (!yol) throw new Error('Dosya seçilmedi.');
      const { error } = await sb.rpc('rpc_belge_ekle',
        { p_tur: tur, p_kayit_id: kayitId, p_yol: yol });
      if (error) throw new Error(hataTr(error.message));
      mesaj('bgMsg','ok', baslik + ' — belge eklendi ✓');
      setTimeout(vBelge, 900);
    }catch(e){ mesaj('bgMsg','hata', e.message); }
  };
  inp.click();
}

/* ================== YÖNETİM (OWNER) ================== */
/* ================== YETKİ YÖNETİMİ ==================
   Yetki ROL bazlıdır (karar K15). Kişiler role atanır, ekran izni role verilir.
   Aynı rol_yetki tablosunu RLS'teki yetki_var() da okur; ekran ile veri
   birbirinden ayrılamaz. Yönetici rolü korumalı: kendini kilitlemek mümkün değil. */
let YY_ROLLER = [], YY_KISILER = [], YY_MATRIS = {}, YY_SECILI = null;
async function yetkiYukle(){
  const el = document.getElementById('yetkiIcerik'); if (!el) return;
  const [{ data: roller, error: e1 }, { data: kisiler, error: e2 }, { data: matris, error: e3 }] =
    await Promise.all([
      sb.from('rol').select('*').order('sira'),
      sb.from('v_kisi_yetki').select('*').order('ad'),
      sb.from('rol_yetki').select('*')
    ]);
  if (e1 || e2 || e3){
    el.innerHTML = `<div class="uyari-agir">Yetkiler yüklenemedi: ${esc(hataTr((e1||e2||e3).message))}</div>`;
    return;
  }
  YY_ROLLER = roller||[]; YY_KISILER = kisiler||[];
  YY_MATRIS = {};
  (matris||[]).forEach(x => { (YY_MATRIS[x.rol] = YY_MATRIS[x.rol] || {})[x.ekran] = x; });
  if (!YY_SECILI || !YY_ROLLER.some(r => r.kod === YY_SECILI))
    YY_SECILI = (YY_ROLLER.find(r => !r.korumali) || YY_ROLLER[0])?.kod || null;
  yetkiCiz();
}
function yetkiCiz(){
  const el = document.getElementById('yetkiIcerik'); if (!el) return;
  const rolSayi = {};
  YY_KISILER.forEach(k => rolSayi[k.rol] = (rolSayi[k.rol]||0) + 1);
  const sec = YY_ROLLER.find(r => r.kod === YY_SECILI);

  el.innerHTML =
    `<div class="yy-bas">KİŞİLER</div>`
    + YY_KISILER.map(k => {
        const acik = (k.ekranlar||'').split(',').filter(Boolean);
        return `<div class="sr">
          <div>
            <div class="sr-ad">${esc(k.ad||'—')}${k.aktif?'':' <span class="rozet rz-gri">pasif</span>'}</div>
            <div class="sr-alt">${esc(k.rol_ad||k.rol)} · ${acik.length} ekran${
              acik.length ? ' · ' + acik.map(x => esc(EKRAN_AD[x]||x)).join(', ') : ''}</div>
          </div>
          <div style="min-width:120px;text-align:right">
            ${k.korumali
              ? '<span class="rozet rz-ok">korumalı</span>'
              : `<select onchange="kisiRolDegistir('${k.id}', this.value, '${esc(k.ad||'')}')">
                   ${YY_ROLLER.map(r => `<option value="${r.kod}"${r.kod===k.rol?' selected':''}>${esc(r.ad)}</option>`).join('')}
                 </select>
                 <button class="btn2" style="margin-top:4px" onclick="kisiAktifDegistir('${k.id}', ${!k.aktif}, '${esc(k.ad||'')}')">${k.aktif?'Kapat':'Aç'}</button>`}
          </div>
        </div>`;
      }).join('')
    + `<div class="yy-bas" style="margin-top:14px">ROLLER</div>
       <div class="yy-rol">${YY_ROLLER.map(r => `
         <button class="btn2${r.kod===YY_SECILI?' yy-aktif':''}" onclick="YY_SECILI='${r.kod}';yetkiCiz()">
           ${esc(r.ad)}${rolSayi[r.kod]?' ('+rolSayi[r.kod]+')':''}
         </button>`).join('')}
       </div>
       <div class="satir" style="margin-top:8px">
         <div><input type="text" id="yyYeniAd" placeholder="yeni rol adı · örn: Mutfak"></div>
         <div><button class="btn2" onclick="rolEkle()">Rol Ekle</button></div>
       </div>`
    + (!sec ? '' : `
       <div class="yy-bas" style="margin-top:14px">${esc(sec.ad).toUpperCase()} NELERİ GÖRSÜN?</div>
       ${sec.korumali
         ? '<div class="bilgi-not">Yönetici rolü korumalıdır — tüm ekranlar her zaman açıktır ve kapatılamaz.</div>'
         : SEKMELER_TUM.map(t => {
             const y = YY_MATRIS[sec.kod]?.[t.id] || {gorebilir:false, yazabilir:false};
             return `<div class="sr">
               <div><div class="sr-ad">${esc(t.ad)}</div>
                 <div class="sr-alt">${y.gorebilir ? (y.yazabilir?'görebilir · kayıt girebilir':'sadece görebilir') : 'kapalı'}</div></div>
               <div style="min-width:150px;text-align:right">
                 <button class="btn2${y.gorebilir?' yy-acik':''}" onclick="yetkiDegistir('${sec.kod}','${t.id}',${!y.gorebilir},${y.yazabilir})">${y.gorebilir?'Açık':'Kapalı'}</button>
                 ${y.gorebilir ? `<button class="btn2${y.yazabilir?' yy-acik':''}" style="margin-left:4px" onclick="yetkiDegistir('${sec.kod}','${t.id}',true,${!y.yazabilir})">${y.yazabilir?'Yazar':'Okur'}</button>` : ''}
               </div>
             </div>`;
           }).join('')
       }
       ${sec.korumali || rolSayi[sec.kod] ? '' :
         `<button class="btn2" style="margin-top:10px;color:var(--hata)" onclick="rolSil('${sec.kod}','${esc(sec.ad)}')">Bu rolü sil</button>`}
       <div class="hata-msg" id="yyMsg"></div>`);
}
const EKRAN_AD = Object.fromEntries(SEKMELER_TUM.map(t => [t.id, t.ad]));
async function yetkiDegistir(rol, ekran, gor, yaz){
  const ad = EKRAN_AD[ekran] || ekran;
  const rolAd = YY_ROLLER.find(r=>r.kod===rol)?.ad || rol;
  if (!gor && !confirm(`${rolAd} rolü "${ad}" ekranını ARTIK GÖREMEYECEK.\n\n`
      + `Sekme kaybolur ve o ekranın verisi API'den de gelmez.\nOnaylıyor musun?`)) return;
  const data = await rpcCagir('rpc_yetki_ayarla',
    { p_rol:rol, p_ekran:ekran, p_gorebilir:gor, p_yazabilir:yaz }, null, 'yyMsg', null);
  if (data && data.ok) yetkiYukle();
}
async function rolEkle(){
  const ad = (document.getElementById('yyYeniAd')?.value || '').trim();
  if (!ad){ mesaj('yyMsg','hata','Rol adı gir.'); return; }
  const kod = ad.toLocaleLowerCase('tr')
    .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
    .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/[^a-z]/g,'_').replace(/^_+|_+$/g,'').slice(0,20);
  if (kod.length < 3){ mesaj('yyMsg','hata','Rol adı en az 3 harf olmalı.'); return; }
  if (!confirm(`"${ad}" rolü eklenecek.\n\nYeni rol HİÇBİR EKRANI göremez olarak başlar;\nneyi görebileceğini sen açarsın.\n\nOnaylıyor musun?`)) return;
  const data = await rpcCagir('rpc_rol_ekle', { p_kod:kod, p_ad:ad }, null, 'yyMsg', 'Rol eklendi ✓');
  if (data && data.ok){ YY_SECILI = kod; yetkiYukle(); }
}
async function rolSil(kod, ad){
  if (!confirm(`"${ad}" rolü silinecek.\n\nBu rolde kimse yoksa silinir.\nOnaylıyor musun?`)) return;
  const data = await rpcCagir('rpc_rol_sil', { p_kod:kod }, null, 'yyMsg', 'Rol silindi ✓');
  if (data && data.ok){ YY_SECILI = null; yetkiYukle(); }

async function kisiRolDegistir(profil, rol, ad){

/* SİSTEM KONTROLÜ — fn_sistem_kontrol() sunucuda 13 tutarlılığı denetler.
   Buradan çağrılmasının sebebi: fonksiyon Supabase SQL Editor'dan
   çalıştırılınca yönetici oturumu olmadığı için iki kontrolü sessizce
   atlıyor. Uygulamadan çağırınca tam çalışır — ilk satır bunu söyler. */
async function sistemKontrolCalistir(btn){
  const kutu = document.getElementById('sistemKontrolSonuc');
  if (!kutu) return;
  const eski = btn ? btn.textContent : '';
  if (btn){ btn.disabled = true; btn.textContent = 'Bakılıyor...'; }
  kutu.innerHTML = '<div class="bilgi-not" style="margin-top:10px">Kontrol ediliyor...</div>';
  try{
    const { data, error } = await sb.rpc('fn_sistem_kontrol');
    if (error) throw new Error(hataTr(error.message));
    const satir = data || [];
    const hata  = satir.filter(x => x.seviye === 'HATA');
    const uyari = satir.filter(x => x.seviye === 'UYARI');
    const bilgi = satir.filter(x => x.seviye === 'BİLGİ' || x.seviye === 'EKSİK');

    kutu.innerHTML = `<div style="margin-top:10px">
      ${bilgi.map(b => `<div class="${b.seviye==='EKSİK'?'uyari-orta':'bilgi-not'}">${esc(b.konu)}</div>`).join('')}
      ${!hata.length && !uyari.length
        ? '<div class="rozet rz-ok" style="margin-top:8px">Her şey tutuyor — hata da uyarı da yok ✓</div>'
        : ''}
      ${hata.length ? `<div class="uyari-agir" style="margin-top:8px">
          <b>${hata.length} HATA — bakılması gerekiyor</b><br>
          ${hata.map(h => `• ${esc(h.konu)}${h.adet>0?' ('+h.adet+')':''}${
              h.ayrinti?'<br><span class="k" style="margin-left:12px">'+esc(h.ayrinti)+'</span>':''}`).join('<br>')}
        </div>` : ''}
      ${uyari.length ? `<div class="uyari-orta" style="margin-top:8px">
          <b>${uyari.length} uyarı — acil değil</b><br>
          ${uyari.map(u => `• ${esc(u.konu)}${u.adet>0?' ('+u.adet+')':''}${
              u.ayrinti?'<br><span class="k" style="margin-left:12px">'+esc(u.ayrinti)+'</span>':''}`).join('<br>')}
        </div>` : ''}
      <div class="ipucu">Son kontrol: ${new Date().toLocaleString('tr-TR')}</div>
    </div>`;
  }catch(e){
    kutu.innerHTML = `<div class="uyari-agir" style="margin-top:10px">
      Kontrol çalıştırılamadı: ${esc(e.message || String(e))}</div>`;
  }finally{
    if (btn){ btn.disabled = false; btn.textContent = eski; }
  }
}

/* VADE LİSTESİ
   Vadeler artık vergi takviminden otomatik üretiliyor (rpc_vade_uret), bu yüzden
   sistemde yıllarca ileriye kayıt var. Hepsini listelemek anlamsız — varsayılan

   "Ödendi" düğmesi KALDIRILDI: bir vade ancak gerçek bir ödeme kaydına bağlanınca

   (03.08.2026'da geçici vergi ve kirada tam olarak bu oldu). */
let VADE_HEPSI = false;
const VADE_DURUM = {
  odendi:    ['rz-ok',   'Ödendi'],
  tutar_yok: ['rz-gri',  'Tutar çıkmadı'],
  iptal:     ['rz-gri',  'İptal']
};
async function vergiVadeYukle(){
  const el = document.getElementById('vergiVadeler'); if(!el) return;
  /* Vadenin kendi tutari 89 kayittan 1'inde dolu — takvim vadeyi onceden
     uretiyor, tutar odeme aninda belli oluyor. ODENMIS vadede tutar bagli
     odemede duruyor; oradan okunur. Ikinci sorgu bunun icin. */
  const [{ data, error }, bagli] = await Promise.all([
    sb.from('v_vade_liste').select('*').order('vade_tarihi'),
    sb.from('vade').select('id, vergi_odeme:odendi_vergi_id(tutar), gider:odendi_gider_id(tutar)')
      .eq('is_deleted', false).eq('durum', 'odendi')
  ]);
  if (error){ el.innerHTML = `<div class="uyari-agir">Vadeler yüklenemedi: ${esc(hataTr(error.message))}</div>`; return; }
  const odenenTutar = {};
  (bagli.data || []).forEach(x => {
    const t = x.vergi_odeme?.tutar ?? x.gider?.tutar;
    if (t != null) odenenTutar[x.id] = +t;
  });
  const hepsi = data||[];
  const sinir = tarihStr(new Date(Date.now()+60*864e5));
  const liste = VADE_HEPSI ? hepsi
    : hepsi.filter(v => v.durum === 'acik' ? v.vade_tarihi <= sinir
                                           : v.vade_tarihi >= tarihStr(new Date(Date.now()-45*864e5)));
  const gizli = hepsi.length - liste.length;

  el.innerHTML = (liste.length === 0
      ? '<div class="bilgi-not">Bu aralıkta vade yok.</div>'
      : liste.map(v => {
          const d = VADE_DURUM[v.durum];
          return `<div class="liste-satir">
            <div class="l-sol"><div class="b">${esc(v.aciklama)} ${
              v.gecti ? '<span class="rozet rz-hata">GEÇTİ</span>'
              : v.yakin ? '<span class="rozet rz-uyari">'+(v.kalan_gun===0?'BUGÜN':v.kalan_gun+' GÜN')+'</span>' : ''}</div>
              <div class="k">${new Date(v.vade_tarihi+'T00:00').toLocaleDateString('tr-TR')}${
                /* Once vadenin kendi tutari, yoksa odemeden gelen; hicbiri yoksa
                   HIC YAZMA. Gelecek vadede tutarin belli olmamasi normaldir,
                   her satira "tutar belli degil" yazmak gurultu. */
                v.tutar ? ' · '+tl(v.tutar)
                : odenenTutar[v.id] != null ? ' · '+tl(odenenTutar[v.id])
                : ''}${
                v.durum_notu ? '<br>'+notKisalt(v.durum_notu, 90) : ''}</div></div>
            <div class="l-sag">${d
              ? `<span class="rozet ${d[0]}">${d[1]}</span>`
              : `<button class="btn2" onclick="vadeKapat('${v.id}','${esc(v.aciklama)}')">Kapat</button>`}</div>
          </div>`;
        }).join(''))
    + (gizli > 0 || VADE_HEPSI
        ? `<button class="btn2" style="margin-top:8px" onclick="VADE_HEPSI=${!VADE_HEPSI};vergiVadeYukle()">${
            VADE_HEPSI ? 'Sadece yakın vadeleri göster' : gizli+' vade daha var — hepsini göster'}</button>`
        : '');
}
/* Bir vadeyi ödeme kaydı olmadan kapatmak: yalnız "tutar çıkmadı" veya "iptal".
   Ödeme yapıldıysa ödeme kaydı girilir, vade kendiliğinden kapanır. */
async function vadeKapat(id, ad){
  const secim = prompt(`"${ad}" kapatılacak.\n\n`
    + `1 = Beyan verildi, ödenecek tutar çıkmadı\n`
    + `2 = İptal (bu yükümlülük geçerli değil)\n\n`
    + `Ödeme YAPILDIYSA burayı kullanma — ödemeyi kaydet, vade kendiliğinden kapanır.\n\n`
    + `1 veya 2 yaz:`);
  if (!secim) return;
  const durum = secim.trim() === '1' ? 'tutar_yok' : secim.trim() === '2' ? 'iptal' : null;
  if (!durum){ alert('1 veya 2 yazmalısın.'); return; }
  const neden = prompt('Nedenini yaz (kayda geçecek):');
  if (!neden || !neden.trim()){ alert('Neden zorunlu.'); return; }
  const { error } = await sb.rpc('rpc_vade_durum', { p_id:id, p_durum:durum, p_not:neden.trim() });
  if (error){ alert('Kapatılamadı: '+hataTr(error.message)); return; }
  vergiVadeYukle();
}

async function giderBelgeOku(){
  const inp = document.getElementById('gdFoto');
  const drm = document.getElementById('gdOkuDurum');
  const btn = document.getElementById('gdOku');
  const yaz = (t,s)=>{ if(drm){ drm.className='oku-durum '+(s||''); drm.textContent=t; } };
  if (!(inp && inp.files && inp.files[0])){ yaz('Önce belgeyi seç.','uyari'); return; }
  btn.disabled = true; const eski = btn.textContent; btn.textContent = 'Okunuyor...';
  yaz('Belge okunuyor, 10-20 saniye sürebilir...','');
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('Oturum bulunamadı, tekrar giriş yapın.');
    const f = inp.files[0];
    let govde;
    if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf'){
      const c = await pdfMetinCikar(f);
      if (!c.yeterli) throw new Error('Bu PDF taranmış görünüyor. Fotoğrafını çekip dene.');
      govde = { metin: c.metin };
    } else {
      const k = await fotoKucult(f, 2000, 0.92);
      govde = { gorsel: await new Promise((coz,red)=>{ const fr=new FileReader();
        fr.onload=()=>coz(fr.result); fr.onerror=()=>red(new Error('Fotoğraf okunamadı')); fr.readAsDataURL(k.veri); }) };
    }
    const y = await fetch(SB_URL + '/functions/v1/fatura-oku', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+session.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify(govde)
    });
    const r = await y.json();
    if (!y.ok || !r.ok) throw new Error(r?.hata || ('Okuma başarısız ('+y.status+')'));
    const v = r.veri || {}, doldu = [];
    const dld = (id, deger) => {
      const e = document.getElementById(id);
      if (!e || deger == null || deger === '') return false;
      e.value = String(deger).replace('.', ',');
      e.dispatchEvent(new Event('input',{bubbles:true}));
      e.classList.add('oku-dolu');
      return true;
    };
    if (dld('gdTutar', v.odenecek ?? v.genel_toplam)) doldu.push('Tutar');
    /* KDV: cok oranli faturada (elektrik gibi) kirilimlarin TOPLAMI alinir —
       tek satiri almak eksik KDV indirimi demektir. */
    let kdv = v.kdv_tutar;
    if (Array.isArray(v.kdv_kirilim) && v.kdv_kirilim.length)
      kdv = v.kdv_kirilim.reduce((a,x)=>a + (+x.kdv_tutar || 0), 0);
    if (dld('gdKdvTutar', kdv != null ? (+kdv).toFixed(2) : null)) doldu.push('KDV');
    if (v.tarih && /^\d{4}-\d{2}-\d{2}$/.test(v.tarih)){
      const t = document.getElementById('gdTarih');
      if (t){ t.value = v.tarih; t.classList.add('oku-dolu'); doldu.push('Tarih'); }
    }
    const ac = document.getElementById('gdAciklama');
    if (ac && !ac.value.trim() && (v.belge_no || v.tedarikci?.ad)){
      ac.value = [v.belge_no, v.tedarikci?.ad].filter(Boolean).join(' · ');
      ac.classList.add('oku-dolu'); doldu.push('Açıklama');
    }
    yaz(doldu.length
      ? 'Dolduruldu: ' + doldu.join(', ') + ' · KATEGORİYİ sen seç, sonra kaydet.'
      : 'Belge okundu ama tutar bulunamadı — elle yaz.', doldu.length ? 'ok' : 'uyari');
  }catch(e){
    yaz(hataTr(e.message || String(e)), 'uyari');
  }finally{
    btn.disabled = false; btn.textContent = eski;
  }
}

/* Banka/POS ekstresindeki sayı. Eskiden TÜM noktaları siliyordu:
   "1250.50" → 125050 (100 KAT hata). Ekstrede tek bir İngilizce biçimli sayı
   olsa para 100 katına çıkıyordu. Artık paraCoz ile aynı kural: SON ayraç ondalıktır. */
function trSayi(s){ // "1.234.567,89" → 1234567.89 ; "-1.234,56" → -1234.56 ; "1250.50" → 1250.50
  if (s==null) return null;
  const t = String(s);
  const eksi = /-/.test(t.replace(/[^\d.,-]/g,'').slice(0,2));   // baştaki eksi
  const r = paraCoz(t, 2);
  if (!r.ok) return null;
  return eksi ? -r.deger : r.deger;
}
/* POS EKSTRESİ OKUMA
   Eski sürüm sayfadaki bütün metni tek satıra ezip yalnız AYLIK toplamları
   arıyordu. O yüzden yalnız "aylık fark şu kadar" diyebilirdi ama HANGİ GÜN olduğunu asla
   söyleyemezdi. 03.08.2026'da farkı bulan şey gün gün karşılaştırmaydı;
   üstelik asıl ipucu tutar değil İŞLEM ADEDİ oldu.
   Artık satır satır okunuyor ve gün gün karşılaştırılıyor. */

// PDF'te Türkçe harfler bazen ISO-8859-9 karşılığıyla geliyor (Ý=İ, Þ=Ş...)
const POS_TR = { 'Ý':'İ','Þ':'Ş','ý':'ı','þ':'ş','Ð':'Ğ','ð':'ğ' };
const posTrDuzelt = t => String(t).replace(/[ÝÞýþÐð]/g, c => POS_TR[c]);

function posEkstreCoz(metin){
  const satir = posTrDuzelt(metin).split('\n');
  const gunler = {};
  // "GÜN BÖLÜM ADET TÜR TUTAR ..." — tür kodu harflerle başlar (PŞNYİKK, TKSTMAX...)
  const satirRe = /^(\d{1,2})\s+(\d+)\s+(\d+)\s+([A-ZÇĞİÖŞÜ]{3,12}\S*)\s+(-?[\d.]+,\d{2})\b/;
  for (const l of satir){
    const m = satirRe.exec(l.trim());
    if (!m) continue;
    const g = +m[1];
    if (g < 1 || g > 31) continue;
    const t = trSayi(m[5]); if (t === null) continue;
    gunler[g] = gunler[g] || { gun:g, adet:0, tutar:0 };
    gunler[g].adet  += +m[3];
    gunler[g].tutar  = +(gunler[g].tutar + t).toFixed(2);
  }
  // Özet: etiket ile rakam aynı satırda olmayabilir, 2 satır ileriye bak
  const bul = (...etiketler) => {
    for (const et of etiketler){
      const re = new RegExp(et.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
      for (let i = 0; i < satir.length; i++){
        if (!re.test(satir[i])) continue;
        for (let j = i; j < Math.min(i+3, satir.length); j++){
          const s = /(-?[\d.]+,\d{2})/.exec(satir[j]);
          if (s) return trSayi(s[1]);
        }
      }
    }
    return null;
  };
  return {
    gunluk: Object.values(gunler).sort((a,b)=>a.gun-b.gun),
    isyeri: (posTrDuzelt(metin).match(/İşyeri No:\s*(\d+)/)||[])[1] || null,
    ozet: {
      toplam_satis:     bul('Toplam Satış'),
      komisyon:         bul('İşyeri Ücreti Pşn\\(Tutar\\)','İşyeri Ücreti Pşn'),
      maxipuan:         bul('Maxipuan Katkı Payı'),
      okc_ucret:        bul('Ücreti\\(ÖKC\\)','POS Yzlm/Dnnm/Bakım'),
      kesinti_toplam:   bul('Kesintiler Toplamı'),
      net_hesaba_gecis: bul('Dönem İçi Toplam Hesaba','Dönem İçi Peşin Hesaba'),
      bekleyen_alacak:  bul('Toplam Alacak Tutarı')
    }
  };
}

let MT_SON = null;
async function bankaPdfAnaliz(){
  const inp = document.getElementById('bmPdf');
  if (!inp.files || !inp.files[0]){ mesaj('bmMsg','hata','PDF seçilmedi.'); return; }
  const donem = document.getElementById('bmDonem').value;
  if (!donem){ mesaj('bmMsg','hata','Dönem seçilmedi.'); return; }
  const btn = document.getElementById('bmAnaliz'); btn.disabled = true; btn.textContent = 'Okunuyor...';
  try{
    const c = await pdfMetinCikar(inp.files[0]);
    if (!c.yeterli) throw new Error('PDF taranmış görünüyor — metin çıkmadı.');
    const p = posEkstreCoz(c.metin);
    if (!p.gunluk.length) throw new Error('Günlük işlem satırları okunamadı. Bu İş Bankası üye işyeri hesap özeti mi?');

    // Ayrıştırma doğru mu: günlerin toplamı ekstrenin kendi "Toplam Satış"ıyla tutmalı
    const gunToplam = +p.gunluk.reduce((a,x)=>a+x.tutar,0).toFixed(2);
    const tutar_kontrol = p.ozet.toplam_satis !== null
      && Math.abs(gunToplam - p.ozet.toplam_satis) < 0.05;

    const { data: gs } = await sb.from('gun_sonu')
      .select('tarih,kart_toplam,gun_sonu_kasa(kart_adet,is_deleted)')
      .gte('tarih', donem+'-01').lte('tarih', aySon(donem)).eq('is_deleted', false);
    const sis = {};
    (gs||[]).forEach(g => {
      const gun = +String(g.tarih).slice(8,10);
      const kasalar = (g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted);
      const adet = kasalar.some(k=>k.kart_adet!=null)
        ? kasalar.reduce((a,k)=>a+(+k.kart_adet||0),0) : null;
      sis[gun] = { tutar:+g.kart_toplam, adet };
    });

    const bankaMap = {}; p.gunluk.forEach(x => bankaMap[x.gun] = x);
    const tumGun = [...new Set([...Object.keys(sis), ...Object.keys(bankaMap)].map(Number))].sort((a,b)=>a-b);
    const satirlar = tumGun.map(g => {
      const S = sis[g], B = bankaMap[g];
      return { gun:g,
        sistem: S ? S.tutar : null, banka: B ? B.tutar : null,
        fark: (S?S.tutar:0) - (B?B.tutar:0),
        sAdet: S ? S.adet : null, bAdet: B ? B.adet : null,
        adetFark: (S && S.adet != null && B) ? S.adet - B.adet : null };
    });
    const farkli = satirlar.filter(x => Math.abs(x.fark) >= 0.005 || x.sistem === null || x.banka === null);
    const sisTop = +Object.values(sis).reduce((a,x)=>a+x.tutar,0).toFixed(2);
    MT_SON = { donem, gunluk:p.gunluk, ozet:p.ozet, isyeri:p.isyeri };

    const st = (v, renk) => `<span style="color:var(--${renk})">${v}</span>`;
    document.getElementById('bmSonuc').innerHTML = `
      ${tutar_kontrol ? '' : `<div class="uyari-agir" style="margin-top:10px">
        Ayrıştırma şüpheli: okunan günlerin toplamı (${tl(gunToplam)}) ekstrenin
        "Toplam Satış" rakamıyla (${tl(p.ozet.toplam_satis)}) tutmuyor.
        Kaydetme, bana bildir.</div>`}
      <div style="margin-top:12px">
        ${ozSatir('Bankanın toplam satışı', tl(p.ozet.toplam_satis))}
        ${ozSatir('Bizim kart cirosu ('+Object.keys(sis).length+' gün)', tl(sisTop))}
        ${ozSatir('FARK', Math.abs(sisTop-(p.ozet.toplam_satis||0))<0.005
            ? '✓ Tutuyor' : tl(sisTop-(p.ozet.toplam_satis||0)), true)}
      </div>
      <div class="yy-bas" style="margin-top:14px">KESİNTİLER</div>
      ${ozSatir('Komisyon', tl(p.ozet.komisyon||0))}
      ${ozSatir('Maxipuan katkı payı', tl(p.ozet.maxipuan||0))}
      ${ozSatir('POS/ÖKC cihaz ücreti', tl(p.ozet.okc_ucret||0))}
      ${ozSatir('Kesinti toplamı', tl(p.ozet.kesinti_toplam||0), true)}
      ${ozSatir('Net hesaba geçen', tl(p.ozet.net_hesaba_gecis||0))}
      ${ozSatir('Gelecek aya sarkan alacak', tl(p.ozet.bekleyen_alacak||0))}
      <div class="yy-bas" style="margin-top:14px">GÜN GÜN</div>
      ${farkli.length === 0
        ? '<div class="bilgi-not">31 günün hepsi tutuyor.</div>'
        : `<div class="uyari-agir">${farkli.length} günde fark var</div>
           <div class="ipucu">Bir güne dokun — o günün gün sonu kaydı, kasa kırılımı ve
             <b>Z raporu fotoğrafı</b> açılır. Farkın nereden geldiği orada görünür.</div>`
          + farkli.map(x => {
              const trh = donem + '-' + String(x.gun).padStart(2,'0');
              return `<div class="liste-satir" style="cursor:pointer"
                  onclick="gunDetay('${trh}')" title="O günün gün sonu kaydını ve Z raporunu aç">
              <div class="l-sol"><div class="b">${String(x.gun).padStart(2,'0')}.${donem.slice(5)} ${
                x.adetFark ? '<span class="rozet rz-hata">'+Math.abs(x.adetFark)+' İŞLEM</span>' : ''}</div>
                <div class="k">sistem ${x.sistem==null?'—':tl(x.sistem)} · banka ${x.banka==null?'—':tl(x.banka)}${
                  x.sAdet!=null ? ' · adet '+x.sAdet+'/'+x.bAdet : ' · adet girilmemiş'} ›</div></div>
              <div class="l-sag" style="color:var(--hata);font-weight:800">${tl(x.fark)}</div>
            </div>`;}).join('')}
      ${farkli.some(x=>x.sAdet==null) ? `<div class="ipucu">Bazı günlerde Z'deki kart
        <b>işlem adedi</b> girilmemiş. Adet girilirse fark "kaç işlem" olduğunu da söyler —
        03.08.2026'daki farkı bulan şey buydu.</div>` : ''}
      <div id="bmSonuc"></div>
      <button class="btn" style="margin-top:12px" id="bmKaydet" onclick="bankaMutabakatKaydet()">Mutabakatı Kaydet</button>`;
    mesaj('bmMsg','ok', `${p.gunluk.length} gün okundu · ${farkli.length} günde fark. Kontrol edip kaydet.`);
  }catch(e){
    mesaj('bmMsg','hata','PDF okunamadı: ' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = "PDF'i Analiz Et";
  }
}

async function bankaMutabakatKaydet(){
  if (!MT_SON){ mesaj('bmMsg','hata','Önce PDF analiz edilmeli.'); return; }
  const o = MT_SON.ozet;
  const kesintiToplam = Math.abs((o.komisyon||0) + (o.maxipuan||0) + (o.okc_ucret||0));
  /* Bu donemin mutabakati daha once kaydedilmis mi — "uzerine yazilir" diye
     genel uyari vermek yerine, gercekten varsa soyle. */
  const { data: onceki } = await sb.from('banka_mutabakat')
    .select('created_at').eq('sube_id', AKTIF_SUBE).eq('donem', MT_SON.donem)
    .eq('is_deleted', false).maybeSingle();

  if (!confirm(`${ayAdi(MT_SON.donem)} POS mutabakatı kaydedilecek.\n\n`
    + `Banka toplam satış  ${tl(o.toplam_satis)}\n`
    + `Kesintiler          ${tl(o.kesinti_toplam)}\n`
    + `Gün sayısı          ${MT_SON.gunluk.length}\n\n`
    + (onceki
        ? `Bu dönem ${new Date(onceki.created_at).toLocaleDateString('tr-TR')} tarihinde `
          + `bir kez kaydedilmişti; yenisi onun yerine geçecek.\n\n`
        : '')
    + `Devam edilsin mi?`)) return;

  const data = await rpcCagir('rpc_mutabakat_kaydet', {
    p_idem: idem(), p_sube: AKTIF_SUBE, p_donem: MT_SON.donem,
    p_gunluk: MT_SON.gunluk, p_ozet: o, p_pdf: null, p_isyeri: MT_SON.isyeri
  }, 'bmKaydet', 'bmMsg', null);
  if (!data || !data.ok) return;

  /* Kaydedildi bilgisi kucuk bir satirda kaliyordu ve hemen ardindan gelen
     ikinci soru kutusunun altinda gozden kaciyordu. Artik sonucu ekranin
     ustune yaz ve oraya kaydir — "ne oldu bilmiyorum" durumu kalmasin. */
  const sonucKutu = document.getElementById('bmSonuc');
  if (sonucKutu){
    sonucKutu.innerHTML = `<div class="${data.durum === 'uyumlu' ? 'bilgi-not' : 'uyari-orta'}"
        style="margin:10px 0">
      <b>${ayAdi(MT_SON.donem)} mutabakatı kaydedildi ✓</b><br>
      ${data.durum === 'uyumlu'
        ? 'Bütün günler tutuyor — banka ile sistem arasında fark yok.'
        : data.tutmayan_gun + ' günde fark var. Aşağıdaki listeden güne dokunup Z raporuna bakabilirsin.'}
      <span class="k" style="display:block;margin-top:4px">${new Date().toLocaleString('tr-TR')}</span>
    </div>`;
    sonucKutu.scrollIntoView({ block:'center', behavior:'smooth' });
  }
  mesaj('bmMsg','ok', `Mutabakat kaydedildi · ${data.durum === 'uyumlu'
    ? 'bütün günler tutuyor ✓' : data.tutmayan_gun + ' günde fark var'}`);

  /* Mukerrer uyarisini kullaniciya "sen kontrol et" diye birakmak yanlisti —
     sistem zaten bakabilir. O ayda POS komisyonu/OKC gideri var mi, say. */
  const ayBas = MT_SON.donem + '-01', aySonu = aySon(MT_SON.donem);
  const { data: mevcutGider } = await sb.from('gider')
    .select('tutar, aciklama, gider_kategori(ad)')
    .eq('sube_id', AKTIF_SUBE).eq('is_deleted', false)
    .gte('tarih', ayBas).lte('tarih', aySonu);
  const benzer = (mevcutGider||[]).filter(g =>
    ['POS Komisyon','ÖKC/POS Ücreti'].includes(g.gider_kategori?.ad)
    || /komisyon|ökc|okc/i.test(g.aciklama||''));
  const benzerToplam = benzer.reduce((a,g)=>a + +g.tutar, 0);

  if (kesintiToplam > 0 && confirm(
      `Bankanın kestiği ${tl(kesintiToplam)} gider olarak kaydedilsin mi?\n\n`
    + `Komisyon          ${tl(Math.abs(o.komisyon||0))}\n`
    + `Maxipuan          ${tl(Math.abs(o.maxipuan||0))}\n`
    + `ÖKC cihaz ücreti  ${tl(Math.abs(o.okc_ucret||0))}\n\n`
    + (benzer.length
        ? `DİKKAT — bu ay zaten ${benzer.length} benzer gider kayıtlı `
          + `(toplam ${tl(benzerToplam)}):\n`
          + benzer.slice(0,4).map(g => '  · ' + tl(g.tutar) + ' — '
              + String(g.aciklama||'').slice(0,45)).join('\n')
          + `\n\nEklersen MÜKERRER olur. Emin değilsen İPTAL et.\n\n`
        : `Bu ay için henüz komisyon gideri kaydı yok — ekleme güvenli.\n\n`)
    + `Kaydedilsin mi?`)){
    const kat = KATALOG.kategoriler.find(k=>k.ad==='POS Komisyon')
             || KATALOG.kategoriler.find(k=>k.ad==='Diğer');
    if (kat){
      await sb.rpc('rpc_gider_kaydet', { p_idem: idem(), p_sube: AKTIF_SUBE,
        p_tarih: aySon(MT_SON.donem), p_kategori: kat.id,
        p_aciklama: 'Banka kesintisi (' + MT_SON.donem + ') · komisyon + maxipuan + ÖKC · işyeri ' + (MT_SON.isyeri||''),
        p_tutar: kesintiToplam, p_kdv_orani: null, p_kdv_tutar: 0,
        p_foto: null, p_kasadan: false, p_tedarikci: null, p_arac: null });
    }
  }
}

/* AY KAPATMA
   Eskiden kapanış hiçbir şey denetlemiyordu: eksik gün, sayılmamış kasa,
   yapılmamış mutabakat — hiçbiri engel değildi, kilit simgesi boş bir güvence
   veriyordu. Üstelik KDV rakamı BURADAN, tarayıcıdan gidiyordu.
   Artık kontrol de KDV de sunucuda. Ekran yalnız sonucu gösterir. */
async function ayKapat(zorlaNeden){
  const donem = document.getElementById('akDonem').value;
  if (!donem){ mesaj('akMsg','hata','Dönem seçilmedi.'); return; }
  const { data, error } = await sb.rpc('rpc_ay_kapat_v2',
    { p_sube: AKTIF_SUBE, p_donem: donem, p_zorla_neden: zorlaNeden || null });
  if (error){ mesaj('akMsg','hata', hataTr(error.message)); return; }

  if (data && data.ok === false){
    const engel = (data.kontrol?.engel) || [];
    mesaj('akMsg','hata', data.mesaj || 'Ay kapatılamadı.');
    const el = document.getElementById('akDurum');
    if (el) el.innerHTML = akKontrolCiz(data.kontrol, donem);
    // Zorlama yalnız gerekçeyle
    if (confirm(`${donem} KAPATILAMADI\n\n`
      + engel.map(x => '• ' + x).join('\n')
      + `\n\nBunları düzeltmeden kapatmak istiyorsan gerekçe yazman gerekiyor.\n`
      + `Gerekçe kayda geçer ve silinemez.\n\nZorlamak istiyor musun?`)){
      const neden = prompt('Neden bu kontroller tamamlanmadan kapatıyorsun?');
      if (neden && neden.trim().length >= 10) return ayKapat(neden.trim());
      alert('Gerekçe en az 10 karakter olmalı — kapatma yapılmadı.');
    }
    return;
  }
  mesaj('akMsg','ok', `${donem} kapatıldı ✓${data.zorlandi ? ' (ZORLANDI — gerekçe kayıtlı)' : ''}`
    + ` · KDV ${tl(data.kdv_tahmini)}`);
  vYonetim();
}

function akKontrolCiz(k, donem){
  if (!k) return '';
  const engel = k.engel || [], uyari = k.uyari || [];
  return `<div style="margin-top:10px">
    ${engel.length
      ? `<div class="uyari-agir"><b>Kapanışı engelleyen ${engel.length} şey:</b><br>`
        + engel.map(x=>'• '+esc(x)).join('<br>') + '</div>'
      : '<div class="bilgi-not">Zorunlu kontrollerin hepsi tamam.</div>'}
    ${uyari.length
      ? `<div class="uyari-orta"><b>Kapatır ama eksik kalır:</b><br>`
        + uyari.map(x=>'• '+esc(x)).join('<br>') + '</div>' : ''}
    <div class="ipucu">Bu ayın KDV'si (sunucu hesabı): <b>${tl(k.kdv_tahmini||0)}</b></div>
  </div>`;
}
async function akDurumGoster(){
  const el = document.getElementById('akDurum'); if(!el) return;
  const donem = document.getElementById('akDonem').value;
  el.innerHTML = '<div class="bilgi-not" style="margin-top:8px">Kontrol ediliyor...</div>';
  const [{ data }, { data: k }] = await Promise.all([
    sb.from('ay_kapanis').select('kapali,eksik_gun_sayisi,zorlandi,zorlama_neden')
      .eq('sube_id', AKTIF_SUBE).eq('donem', donem).eq('is_deleted',false).maybeSingle(),
    sb.rpc('fn_ay_kapanis_kontrol', { p_sube: AKTIF_SUBE, p_donem: donem })
  ]);
  el.innerHTML = (data && data.kapali
    ? `<div class="rozet rz-hata" style="margin-top:8px">🔒 ${donem} KAPALI${
        data.eksik_gun_sayisi>0?' · '+data.eksik_gun_sayisi+' eksik gün':''}</div>`
      + (data.zorlandi ? `<div class="uyari-orta" style="margin-top:6px">
          <b>Zorlanarak kapatıldı.</b> Gerekçe: ${esc(data.zorlama_neden||'—')}</div>` : '')
    : `<div class="rozet rz-ok" style="margin-top:8px">🔓 ${donem} açık</div>`)
    + akKontrolCiz(k, donem);
}
function trDuz(s){ // jsPDF standart fontu Türkçe karakter basamıyor — güvenli çevrim
  return String(s||'').replace(/ğ/g,'g').replace(/Ğ/g,'G').replace(/ü/g,'u').replace(/Ü/g,'U')
    .replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ı/g,'i').replace(/İ/g,'I')
    .replace(/ö/g,'o').replace(/Ö/g,'O').replace(/ç/g,'c').replace(/Ç/g,'C');
}
async function arsivPdf(){
  const ayS = document.getElementById('arsivAy').value;
  if (!ayS){ mesaj('arsivMsg','hata','Ay seçilmedi.'); return; }
  const btn = document.getElementById('arsivBtn');
  btn.disabled = true; btn.textContent = 'Belgeler toplanıyor...';
  try{
    const bas = ayS + '-01', son = ayS + '-31';
    const [gs, al, gd] = await Promise.all([
      sb.from('gun_sonu').select('tarih,z_no,z_foto_path,pos_slip_foto_path,gun_sonu_kasa(kasa_no,sira,z_no,z_foto_path,pos_slip_foto_path,is_deleted)').gte('tarih',bas).lte('tarih',son).eq('is_deleted',false).order('tarih'),
      sb.from('alis').select('tarih,toplam,foto_path,tedarikci(ad)').gte('tarih',bas).lte('tarih',son).eq('is_deleted',false).order('tarih'),
      sb.from('gider').select('tarih,tutar,foto_path,gider_kategori(ad)').gte('tarih',bas).lte('tarih',son).eq('is_deleted',false).order('tarih')
    ]);
    const ogeler = [];
    for (const g of (gs.data||[])){
      const ks = (g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted)
        .sort((a,b)=>a.kasa_no-b.kasa_no || (a.sira||1)-(b.sira||1));
      if (ks.length){
        for (const k of ks){
          // Aynı kasadan o gün birden fazla Z varsa sırayı da yaz (muhasebe hangisi olduğunu görsün)
          const sr = zCok(ks,k.kasa_no) ? ` — ${k.sira||1}. Z` : '';
          if (k.z_foto_path) ogeler.push({ b:`Z RAPORU — ${g.tarih} — KASA ${k.kasa_no}${sr}${k.z_no?' — Z No: '+k.z_no:''}`, p:k.z_foto_path });
          if (k.pos_slip_foto_path) ogeler.push({ b:`POS SLIP — ${g.tarih} — KASA ${k.kasa_no}${sr}`, p:k.pos_slip_foto_path });
        }
      } else { // eski tek kasalı kayıtlar
        if (g.z_foto_path) ogeler.push({ b:`Z RAPORU — ${g.tarih}${g.z_no?' — Z No: '+g.z_no:''}`, p:g.z_foto_path });
        if (g.pos_slip_foto_path) ogeler.push({ b:`POS SLIP — ${g.tarih}`, p:g.pos_slip_foto_path });
      }
    }
    for (const a of (al.data||[])) if (a.foto_path)
      ogeler.push({ b:`ALIS — ${a.tarih} — ${a.tedarikci?.ad||''} — ${tl(a.toplam)}`, p:a.foto_path });
    for (const x of (gd.data||[])) if (x.foto_path)
      ogeler.push({ b:`GIDER — ${x.tarih} — ${x.gider_kategori?.ad||''} — ${tl(x.tutar)}`, p:x.foto_path });
    // PDF belgeler bu birleştirmeye giremez (jsPDF yalnız görsel ekler) — ayrı say ve söyle
    const pdfBelgeler = ogeler.filter(o => /\.pdf$/i.test(o.p));
    const gorseller   = ogeler.filter(o => !/\.pdf$/i.test(o.p));
    ogeler.length = 0; ogeler.push(...gorseller);
    if (ogeler.length === 0){
      mesaj('arsivMsg','hata', pdfBelgeler.length
        ? `Bu ayda ${pdfBelgeler.length} belge var ama hepsi PDF — PDF'ler zaten tek tek dosya, birleştirmeye gerek yok. Listeden "Belge" ile açabilirsin.`
        : 'Bu ayda fotoğraflı belge yok.');
      return;
    }

    const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
    let ilk = true, eklenen = 0;
    for (let i = 0; i < ogeler.length; i++){
      btn.textContent = `Hazırlanıyor ${i+1}/${ogeler.length}...`;
      const { data: dosya, error } = await sb.storage.from('belgeler').download(ogeler[i].p);
      if (error || !dosya) continue;
      const url = URL.createObjectURL(dosya);
      const img = await new Promise(r=>{ const im=new Image(); im.onload=()=>r(im); im.onerror=()=>r(null); im.src=url; });
      if (img){
        if (!ilk) pdf.addPage();
        ilk = false; eklenen++;
        pdf.setFontSize(11); pdf.text(trDuz(ogeler[i].b), 10, 12);
        const enOran = Math.min(190/img.width, 265/img.height);
        pdf.addImage(img, ogeler[i].p.endsWith('.png')?'PNG':'JPEG', 10, 18,
          Math.round(img.width*enOran), Math.round(img.height*enOran));
      }
      URL.revokeObjectURL(url);
    }
    if (eklenen === 0){ mesaj('arsivMsg','hata','Belgeler indirilemedi.'); return; }
    pdf.save(`bardaks-arsiv-${ayS}.pdf`);
    mesaj('arsivMsg','ok', eklenen + ' belge tek PDF olarak indirildi ✓'
      + (pdfBelgeler.length ? ` · ${pdfBelgeler.length} e-Fatura PDF'i ayrı duruyor (listeden "Belge" ile açılır)` : ''));
  }catch(e){
    mesaj('arsivMsg','hata','PDF oluşturulamadı: ' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = 'PDF Oluştur ve İndir';
  }
}
async function urunEkle(){
  const g = id => document.getElementById(id);
  const ad = g('ynUrunAd').value.trim();
  if (!ad){ mesaj('ynUrunMsg','hata','Ürün adı boş.'); return; }
  const pp = paraOku(g('ynUrunPaket')), pk = paraOku(g('ynUrunKritik'));
  if (!pp.ok || !pk.ok){ mesaj('ynUrunMsg','hata','Geçersiz sayı — örnek: 80 veya 2,5'); return; }
  // Aynı isimde ürün varsa uyar (katalog çöplüğe dönmesin — sunucu tarafı da ayrıca engelliyor)
  const varOlan = (KATALOG.urunler||[]).find(u => (u.ad||'').toLowerCase().trim() === ad.toLowerCase());
  if (varOlan){ mesaj('ynUrunMsg','hata',`"${varOlan.ad}" zaten var (kod ${varOlan.kod||'—'}). Aynı ürünü ikinci kez açma.`); return; }
  const btn = g('ynUrunBtn'); btn.disabled = true;
  const { data, error } = await sb.rpc('rpc_urun_tanimla', {
    p_ad: ad, p_birim: g('ynUrunBirim').value,
    p_paket_ici: pp.deger > 0 ? pp.deger : null,
    p_kategori: g('ynUrunKategori').value.trim() || null,
    p_tedarikci: null, p_ham_kod: null, p_ham_ad: null,
    p_carpan: pp.deger > 0 ? pp.deger : 1, p_birim_ad: null, p_urun_id: null
  });
  // Kritik seviye ayrı: fonksiyon 0 ile açar, owner burada belirliyor
  if (!error && data?.urun_id && pk.deger > 0)
    await sb.from('urun').update({ kritik_seviye: pk.deger }).eq('id', data.urun_id);
  btn.disabled = false;
  if (error){ mesaj('ynUrunMsg','hata', hataTr(error.message)); return; }
  mesaj('ynUrunMsg','ok', data?.yeni ? `Ürün eklendi ✓  stok kodu: ${data.kod}`
                                     : `Bu ürün zaten kayıtlı (kod ${data?.kod || '—'}).`);
  ['ynUrunAd','ynUrunKategori','ynUrunPaket','ynUrunKritik'].forEach(i=>{ const e=g(i); if(e) e.value=''; });
  await katalogYukle();
}
async function tedarikciEkle(){
  const ad = document.getElementById('ynTedAd').value.trim();
  if (!ad){ mesaj('ynTedMsg','hata','Firma adı boş.'); return; }
  const { error } = await sb.from('tedarikci').insert({ ad, telefon: document.getElementById('ynTedTel').value.trim()||null });
  if (error){ mesaj('ynTedMsg','hata',error.message); return; }
  mesaj('ynTedMsg','ok','Tedarikçi eklendi ✓'); document.getElementById('ynTedAd').value='';
  await katalogYukle();
}
async function kategoriEkle(){
  const ad = document.getElementById('ynKatAd').value.trim();
  if (!ad){ mesaj('ynKatMsg','hata','Kategori adı boş.'); return; }
  const { error } = await sb.from('gider_kategori').insert({ ad });
  if (error){ mesaj('ynKatMsg','hata',error.message); return; }
  mesaj('ynKatMsg','ok','Kategori eklendi ✓'); document.getElementById('ynKatAd').value='';
  await katalogYukle();
}
