}
function zDurum(n, s){
  const k = n+'_'+s;
  const zno=(document.getElementById('gsZNo_'+k)?.value||'').trim();
  const pk=paraOku(document.getElementById('gsKart_'+k));
  const pn=paraOku(document.getElementById('gsNakit_'+k));
  const kart=pk.deger, nakit=pn.deger;
  // Kart işlem adedi ve fiş iptali — hepsi isteğe bağlı, boşsa null gider.
  // Adet alanları tam sayı: "105 adet" gibi yazılsa bile rakamları alıyoruz.
  const tamSayi = id => {
    const t = (document.getElementById(id)?.value || '').replace(/\D/g,'');
    return t === '' ? null : parseInt(t, 10);
  };
  const kadet = tamSayi('gsKAdet_'+k);
  const iadet = tamSayi('gsIAdet_'+k);
  const itEl  = document.getElementById('gsITutar_'+k);
  const pit   = itEl ? paraOku(itEl) : { ok:true, deger:0 };
  const itutar = (pit.ok && pit.deger > 0) ? pit.deger : null;
  const zf=document.getElementById('gsZFoto_'+k);
  // Düzenleme modunda mevcut fotoğraf zorunluluğu karşılar (yenisi seçilmezse korunur)
  const mev = (DUZENLE && DUZENLE.foto && DUZENLE.foto[k]) || {};
  const zfVar=!!(zf&&zf.files&&zf.files[0]) || !!mev.z;
  const on = ZLISTE[n].length>1 ? s+'. Z — ' : '';
  /* ==================================================================
     ⚠ ADIM 14 · BOS ALAN 0 SAYILMAZ — OLCUT DEGER DEGIL ALANIN KENDISI
     ==================================================================
     OLCULDU: Z raporunun nakit satiri okunamayinca alan BOS kaliyor,
     ama paraOku bos alani da 0 donduruyordu; blok "nakit: 0" olarak
     hesaplaniyor, ara toplam 4.500,00 yerine 3.000,00 cikiyor ve kutu
     "✓ Tamamlandi" diyordu. eksik[] BOSTU. Yani gunun cirosu 1.500,00
     eksik kaydediliyor ve ekran her sey yolunda diyordu.
     ⚠ ADIM 07'de kasa_nakit icin kurulan ayrimin AYNISI: alanin HAM
       metnine bakilir. Bos -> girilmedi. "0" yazildiysa -> GERCEK
       SIFIR, eksik degil, kullanicinin beyani. */
  const kartHam  = (document.getElementById('gsKart_'+k)?.value || '').trim();
  const nakitHam = (document.getElementById('gsNakit_'+k)?.value || '').trim();
  /* ⚠ SATIR SAYMAK YANLIS OLCUT: form BIR BOS KDV satiriyla aciliyor
     (oran %10, tutarlar bos) — sayi her zaman >= 1 (olculdu). Dolu
     satir olcutu gunSonuKaydet'in kendi tanimiyla AYNI olmali, yoksa
     ekran "KDV var" derken kayit yolu "KDV yok" diye onay sorar.
     kdvOku'nun kurali: satis ya da tutar alanlarindan biri DOLU. */
  const kdvDoluAdet = [...document.querySelectorAll('#kdvSatirlari_'+k+' .kdv-satir')]
    .filter(d => { const i = d.id.split('_')[1];
      return (document.getElementById('kdvT_'+i)?.value || '').trim() !== ''
          || (document.getElementById('kdvV_'+i)?.value || '').trim() !== ''; }).length;
  /* ⚠ 'bos' ARTIK HAM METNE BAKAR: eskiden sayiya bakiyordu ve
     kullanici "0" yazdiginda blok "○ Baslanmadi" goruniyordu. */
  const bos=!zno && !kartHam && !nakitHam && !zfVar && pk.ok && pn.ok;
  /* ⚠ ADIM 14 B · LISTELER ARTIK CIPLAK ALAN ADI TASIR. Eskiden
     "Kart tutarı geçersiz" / "Nakit tutarı girilmedi" gibi HUKMU de
     iceren cumlelerdi; hukum artik sozlukten geliyor (dilEksik /
     dilGecersiz), yoksa ayni sey iki yerde yazilmis olurdu.
     ⚠ IKI LISTE, CUNKU IKI AYRI HAL: 'eksik' alan BOS demek,
       'gecersiz' kullanici bir sey YAZMIS ama sayi degil demek.
       Ikisine ayni cumleyi kurmak yanlis yonlendirir. */
  const eksik=[], gecersiz=[];
  if(!zno) eksik.push(on+'Z No');
  if(!pk.ok) gecersiz.push(on+'Kart tutarı');
  if(!pn.ok) gecersiz.push(on+'Nakit tutarı');
  if(!pit.ok) gecersiz.push(on+'Fiş iptal tutarı');
  if(!zfVar) eksik.push(on+'Z fotoğrafı');
  /* Blok baslamissa tutarlar ZORUNLU. Bilinmiyorsa 0 yazilmaz —
     okunamadigi soylenir ve elle yazilir. */
  if(!bos && pk.ok && !kartHam)  eksik.push(on+'Kart tutarı');
  if(!bos && pn.ok && !nakitHam) eksik.push(on+'Nakit tutarı');
  /* ⚠ KDV 'bekleyen', 'eksik' DEGIL: gunSonuKaydet KDV bos ekrani icin
     ZATEN onay soruyor ("beyana giden KDV eksik kalir ... yine de
     kaydedilsin mi") ve o karar SOYLE-DURDURMA kaliginin parcasi.
     Buraya eksik olarak konursa o onay olu koda doner ve kayit
     tamamen engellenir. Ekranda gorunur, yesili keser, DURDURMAZ. */
  const bekleyen=[];
  if(!bos && kdvDoluAdet === 0) bekleyen.push(on+'KDV dökümü');
  return { k, n, s, zno, kart, nakit, kadet, iadet, itutar,
           ara:+(kart+nakit).toFixed(2), kdv:kdvToplam(k),
           /* ara, eksik tutar varken TOPLAM DEGIL — ekran '—' basar */
           araGecerli: bos || (!!kartHam && !!nakitHam),
           eksik, gecersiz, bekleyen, bos, gecerli: pk.ok && pn.ok && pit.ok };
}
function kasaDurum(n){
  const bloklar = ZLISTE[n].map(s=>zDurum(n,s));
  return {
    bloklar,
    kart : +bloklar.reduce((a,b)=>a+b.kart ,0).toFixed(2),
    nakit: +bloklar.reduce((a,b)=>a+b.nakit,0).toFixed(2),
    ara  : +bloklar.reduce((a,b)=>a+b.ara  ,0).toFixed(2),
    kdv  : +bloklar.reduce((a,b)=>a+b.kdv  ,0).toFixed(2),
    eksik: bloklar.flatMap(b=>b.eksik),
    gecersiz: bloklar.flatMap(b=>b.gecersiz),      // ADIM 14 B · dorduncu hal, ayri cumle
    bekleyen: bloklar.flatMap(b=>b.bekleyen),      // ADIM 14 · yesili keser, durdurmaz
    bos  : bloklar.every(b=>b.bos)
  };
}
function kdvToplam(k){
  let t=0;
  document.querySelectorAll('#kdvSatirlari_'+k+' .kdv-satir').forEach(d=>{
    const n=d.id.split('_')[1];
    t += paraOku(document.getElementById('kdvV_'+n)).deger;
  });
  return +t.toFixed(2);
}
function kasaHesapla(){
  let tk=0, tn=0, tkdv=0;
  /* ADIM 14 B · dort ayri hal, dort ayri liste — hepsi kaydi engeller
     (bekleyen HARIC), ama ekranda AYRI cumleyle anlatilir. */
  const eksikler=[], gecersizler=[], mukerrer=[], bekleyenler=[];
  [1,2].forEach(n=>{
    const d=kasaDurum(n); tk+=d.kart; tn+=d.nakit; tkdv+=d.kdv;
    d.bloklar.forEach(b=>{
      /* ⚠ ADIM 14 · EKSIK ALAN TOPLAMA GIRMEZ. Eskiden bos nakit 0
         sayilip ara toplam TAM gibi yaziliyordu; rakam dogru gorunup
         yanlis oluyordu. Alan eksikse toplam BASILMAZ. */
      const za=document.getElementById('gsZAra_'+b.k);
      if(za) za.textContent = b.araGecerli ? tl(b.ara) : '— (tutar eksik)';
    });
    const kdvEl=document.getElementById('gsKdv'+n); if(kdvEl) kdvEl.textContent=tl(d.kdv);
    const ara=document.getElementById('gsAra'+n); if(ara) ara.textContent=tl(d.ara);
    const kt=document.getElementById('ksTut'+n); if(kt) kt.textContent=tl(d.ara);
    const drm=document.getElementById('kpDrm'+n), ks=document.getElementById('ksDrm'+n);
    const zEk = ZLISTE[n].length>1 ? ` · ${ZLISTE[n].length} Z` : '';
    let sinif, metin, sembol;
    if(d.bos){ sinif='bos'; metin='○ Başlanmadı'; sembol='○'; }
    /* ⚠ ADIM 14 · YESIL EKSIKTEN HABERSIZ OLMAZ. "✓ Tamamlandı" yalniz
       HEM sert eksik HEM bekleyen bosken verilir. Eskiden yalniz
       eksik[]'e bakiyordu ve KDV dokumu okunamamis bir Z "Tamamlandı"
       goruniyordu (olculdu). */
    else if(d.eksik.length===0 && d.gecersiz.length===0 && d.bekleyen.length===0){
      sinif='tam'; metin='✓ Tamamlandı'+zEk; sembol='✓'; }
    /* ⚠ ADIM 14 B · METIN SOZLUKTEN. Eskiden "● N eksik: a, b" elle
       yaziliyordu; sayi yerine artik ne yapilacagi yaziyor. */
    else { sinif='eksik'; sembol='●';
      metin = '● ' + [dilEksik(d.eksik), dilGecersiz(d.gecersiz),
                      dilEksik(d.bekleyen)].filter(Boolean).join(' · '); }
    if(drm){ drm.className='kp-drm '+sinif; drm.textContent=metin; }
    if(ks) ks.textContent=sembol;
    d.eksik.forEach(e=>eksikler.push('KASA '+n+' — '+e));
    d.gecersiz.forEach(e=>gecersizler.push('KASA '+n+' — '+e));
    /* bekleyen KAYDI ENGELLEMEZ; alt bantta ayri satirda yazar */
    d.bekleyen.forEach(e=>bekleyenler.push('KASA '+n+' — '+e));
  });
  // Aynı kasada aynı Z No iki kez girilmiş mi (arıza gününde kopyala-yapıştır hatası)
  [1,2].forEach(n=>{
    const nolar = ZLISTE[n].map(s=>(document.getElementById('gsZNo_'+n+'_'+s)?.value||'').trim()).filter(Boolean);
    if (new Set(nolar).size !== nolar.length) mukerrer.push('KASA '+n+' — aynı Z No iki kez girilmiş');
  });
  const pz=paraOku(document.getElementById('gsKasa'));
  const zDisi=pz.deger;
  if(!pz.ok) gecersizler.push('KASADA SAYILAN tutarı');
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('gsTKart', tl(tk)); set('gsTNakit', tl(tn)); set('gsTGenel', tl(+(tk+tn).toFixed(2)));
  set('gsZDisi', tl(zDisi)); set('gsTKdv', tl(tkdv));
  const btn=document.getElementById('gsKaydet'), ek=document.getElementById('gsEksik');
  const engel = eksikler.length + gecersizler.length + mukerrer.length;
  const hazir = engel===0 && (tk+tn)>0;
  if(btn){ btn.disabled=!hazir; btn.style.opacity=hazir?'1':'.5'; }
  if(ek){
    /* ⚠ ADIM 14 · KAYDEDILEBILIR ≠ EKSIKSIZ. Sert eksik yoksa kayit
       acilir (bugunku davranis), ama okunamamis alan varsa yesil
       "kaydedilebilir" YAZILMAZ — kullanici once ona baksin. */
    const temiz = hazir && !bekleyenler.length;
    ek.style.color = temiz ? 'var(--ok)' : 'var(--uyari)';
    /* ⚠ ADIM 14 B · METIN SOZLUKTEN. Eskiden "Bekleyen: ..." ve
       "... okunamadı" elle yaziliyordu, iki ayri kalip. */
    /* ⚠ esc BIR KEZ, en sonda: parcalari once esc'leyip sonra tumunu
       tekrar esc'lemek metni "&amp;" gibi gosterirdi. */
    const bant = [dilEksik(eksikler), dilGecersiz(gecersizler),
                  mukerrer.join(' · ')].filter(Boolean).join(' · ');
    ek.innerHTML = bant ? esc(bant)
      : (!hazir ? esc(dilEksik(['Tutar']))
        : (bekleyenler.length
          ? 'Kaydedilebilir — ama önce: ' + esc(dilEksik(bekleyenler))
          : '✓ Gün sonu kaydedilebilir'));
  }
}
/* ===== T · GUN SONU TASLAK KORUMA =====
   Olculdu (FAZ 4a): ekran 4.532px, ayni anda 24 alan, Kaydet 1.702px
   asagida. Mevcut koruma yalniz UYARIYORDU (formKirliMi + beforeunload);
   sekme kapanirsa 24 alan gidiyordu. Bu katman SAKLIYOR — uyarinin YERINE
   degil YANINA geliyor, ikisi de duruyor.
   ⚠ Taslak KULLANICININ TARAYICISINDA kalir, sunucuya gitmez. Bu yuzden
     basarili kayitta MUTLAKA silinir: ekranda olmayan finansal veri
     tarayicida birikmemeli.
   ⚠ SESSIZ DOLDURMA YOK. Kullanici "Geri yukle" demeden hicbir alan
     dolmaz. Sessiz doldurma en tehlikelisidir: insan kendi girdigini
     sanip uc gun onceki rakami kaydeder.
   ⚠ FOTOGRAF YAZILMAZ — dosya girdisi saklanamaz; yalniz KAC TANE
     secilmis oldugu not dusulur. */
const TASLAK_ONEK = 'gunSonuTaslak:', TASLAK_OMUR = 7*24*60*60*1000;
let TASLAK_SAYAC = null;
const taslakAnahtar = () =>
  TASLAK_ONEK + AKTIF_SUBE + ':' + (document.getElementById('gsTarih')?.value || '');
const taslakOku = () => { try{ return JSON.parse(localStorage.getItem(taslakAnahtar()) || 'null'); }
                          catch(e){ return null; } };
function taslakSil(){ try{ localStorage.removeItem(taslakAnahtar()); }catch(e){} }
function taslakYaz(){
  /* DUZENLE modunda yazilmaz: orada zaten KAYITLI bir gun aciktir,
     taslak onun uzerine binerdi. */
  if (DUZENLE || !AKTIF_SUBE || !document.getElementById('gsKaydet')) return;
  const b = {}; let foto = 0;
  [1,2].forEach(n => ZLISTE[n].forEach(s => {
    b[n+'_'+s] = zBlokTopla(n, s);                     // mevcut yardimci, aynen
    const f = document.getElementById('gsZFoto_'+n+'_'+s);
    if (f && f.files && f.files[0]) foto++;            // ⚠ DOSYA DEGIL, yalniz SAYI
  }));

  try{ Object.keys(localStorage)

    }); }catch(e){}
}

/* ==================================================================
   ADIM 17 (B) · TASLAK, IKINCI EKRANA GENISLETILDI
   ==================================================================
   ⚠ MEVCUT MEKANIZMA YENIDEN YAZILMADI. Gun sonunun kendi taslagi
     (taslakYaz/Oku/Sil/Seridi) AYNEN duruyor; asagidaki katman onun
     YANINA geliyor ve AYNI kurallari paylasiyor: localStorage, sube
     bazli anahtar, 7 gun omur (taslakEskileriAt ikisini de supuruyor),
     SESSIZ DOLDURMA YOK — kullanici "Geri yükle" demeden alan dolmaz.
   ⚠ NEDEN GUN SONU AYRI KALDI: orada alanlar DINAMIK — ZLISTE ile Z
     bloklari, kdvSatirEkle ile KDV satirlari calisma aninda ekleniyor.
     Duz bir "id -> deger" anlik goruntusu o yapiyi GERI KURAMAZ;
     taslakGeriYukle bloklari yeniden yaratiyor. Tek mekanizmaya
     zorlamak, calisan ve daha zengin olani bozardi.

     personel) daha seyrek ve daha kisa; hepsine birden yaymak bu
     turun isi degil. */
const EKRAN_TASLAK_ONEK = 'ekranTaslak:';
/* Bu ekranda taslak tutuluyor mu — tutuluyorsa anahtari. */
function ekranTaslakAnahtari(){
  if (!AKTIF_SUBE) return null;
  if (AKTIF_SEKME === 'gider' && (GIDER_BOLUM === 'temel' || GIDER_BOLUM === 'fatura'))
    return EKRAN_TASLAK_ONEK + AKTIF_SUBE + ':gider:' + GIDER_BOLUM;
  return null;
}
const ekranTaslakTutuluyorMu = () =>
  AKTIF_SEKME === 'gunsonu' ? !!document.getElementById('gsKaydet')
                            : !!ekranTaslakAnahtari();
function ekranTaslakYaz(){
  if (AKTIF_SEKME === 'gunsonu'){ taslakYaz(); return true; }
  const a = ekranTaslakAnahtari(); if (!a) return false;
  const d = {};
  /* ⚠ YALNIZ DOLU ALANLAR: varsayilanlari da saklamak, geri yuklemede
     kullanicinin o an gordugu varsayilani ESKISIYLE ezerdi. */
  doluAlanlar().forEach(e => { if (e.id && e.type !== 'file') d[e.id] = e.value; });
  if (!Object.keys(d).length) return false;
  try{ localStorage.setItem(a, JSON.stringify({ zaman: Date.now(), d })); }
  catch(e){ return false; }
  return true;
}
const ekranTaslakOku = () => { const a = ekranTaslakAnahtari(); if (!a) return null;
  try{ return JSON.parse(localStorage.getItem(a) || 'null'); }catch(e){ return null; } };
function ekranTaslakSil(){ const a = ekranTaslakAnahtari(); if (!a) return;
  try{ localStorage.removeItem(a); }catch(e){} ekranTaslakSeridi(); }
function ekranTaslakGeriYukle(){
  const t = ekranTaslakOku(); if (!t || !t.d) return;
  Object.keys(t.d).forEach(id => { const e = document.getElementById(id);
    if (!e) return; e.value = t.d[id];
    e.dispatchEvent(new Event('input', { bubbles:true }));
    e.dispatchEvent(new Event('change', { bubbles:true })); });
  ekranTaslakSil();
}

async function fotoTemizle(yollar){

async function gunSonuKaydet(){
  const kasalar = [];
  for (const n of [1,2]){
    const d = kasaDurum(n);
    /* ⚠ ADIM 14 B · GECERSIZ DE ENGEL, metin sozlukten. Kapinin
       KENDISI degismedi: eskiden 'gecersiz' girdileri de d.eksik
       icindeydi, ayrildilar — engel ayni engel. */
    if (d.eksik.length || d.gecersiz.length){
      kasaSec(n);
      mesaj('gsMsg','hata', `KASA ${n} — ` + [dilEksik(d.eksik),
        dilGecersiz(d.gecersiz)].filter(Boolean).join(' · '));
      return; }
    for (const b of d.bloklar){
      let kdvSatir;
      try { kdvSatir = kdvOku(b.k); }
      catch(e){ kasaSec(n); mesaj('gsMsg','hata',`KASA ${n} / ${b.s}. Z: `+hataTr(e.message)); return; }
      kasalar.push({ n, s:b.s, k:b.k, zno:b.zno, kart:b.kart, nakit:b.nakit, kdv:kdvSatir,
        kadet:b.kadet, iadet:b.iadet, itutar:b.itutar,
        knot:(document.getElementById('gsKNot_'+b.k)?.value||'').trim()||null });
    }
  }
  const kart = +(kasalar.reduce((a,k)=>a+k.kart,0)).toFixed(2);
  const nakit = +(kasalar.reduce((a,k)=>a+k.nakit,0)).toFixed(2);
  const toplam = +(kart + nakit).toFixed(2);
  // KDV artık KASA BAZLI: her kasanın kendi Z vergi dökümü
  const kdv = kasalar.flatMap(k=>k.kdv);
  const kdvToplamTutar = +(kdv.reduce((a,x)=>a+x.kdv_tutar,0)).toFixed(2);
  if (toplam === 0){ mesaj('gsMsg','hata','İki kasanın toplamı 0 — kayıt yapılamaz.'); return; }
  for (const k of kasalar){
    const et = `KASA ${k.n}${ZLISTE[k.n].length>1?' / '+k.s+'. Z':''}`;
    if (k.kdv.length === 0 && (k.kart + k.nakit) > 0 &&
        !confirm(`${et} için KDV dökümü BOŞ. O Z raporundaki VERGİ DÖKÜMÜ girilmedi — beyana giden KDV eksik kalır. Yine de kaydedilsin mi?`)) return;
  }
  // AKIL KONTROLLERİ (KÜM. TOPLAM tuzağı + KDV tutarlılığı)
  const kdvSatisToplami = kdv.reduce((a,x)=>a+x.satis_toplam,0);
  if (kdvSatisToplami > toplam*1.5 + 100){
    bildir(`HATALI GİRİŞ OLABİLİR: KDV dökümündeki satış toplamı (${tl(kdvSatisToplami)}) günün cirosundan (${tl(toplam)}) çok büyük.\n\nZ kağıdındaki "KÜM. TOPLAM" satırını yazmış olabilirsiniz — o satır kasanın TÜM GEÇMİŞ toplamıdır, kullanılmaz.\n\n"%10 TOPLAM" gibi GÜNLÜK satırı girin.`, 'hata');
    return;
  }
  for (const x of kdv){
    const beklenen = x.satis_toplam - x.satis_toplam/(1 + x.oran/100);
    if (x.satis_toplam > 0 && Math.abs(x.kdv_tutar - beklenen) > Math.max(5, beklenen*0.15) &&
        !confirm(`KDV kontrolü: %${x.oran} için ${tl(x.satis_toplam)} satışın KDV'si yaklaşık ${tl(beklenen)} olmalı, siz ${tl(x.kdv_tutar)} girdiniz.\nZ kağıdındaki TOPKDV satırıyla karşılaştırın. Yine de kaydedilsin mi?`)) return;
  }
  const pKasa = paraOku(document.getElementById('gsKasa'));

     Iki kayit yolunda da `p_kasa: kasa > 0 ? kasa : null` yaziyordu.
     Kasa sayilip icinden GERCEKTEN sifir para ciktiginda sisteme null
     gidiyordu. Veritabani null'i "sayilmadi" okuyor (taban: sayilan_gun
     ... WHERE kasa_nakit IS NOT NULL) ve zincir isliyor: o gun

     duser ve GERCEK CIRODAN CIKAR. Yani kasasi bos cikan bir gun, o

     Veritabani DOGRU: kasa_nakit nullable, null = sayilmadi, 0 =
     sayildi ve bostu. Ayrim zaten vardi; ekran kullanmiyordu.
     ⚠ DEGERE BAKMAK YETMEZ: paraOku bos alani da 0 dondurur. Olcut
       alanin KENDISI — bos mu, yoksa kullanici 0 mi yazdi. */
  const kasaBos = !document.getElementById('gsKasa').value.trim();

      k.zf = zSecili ? await fotoYukle('gsZFoto_'+k.k, 'z') : mev.z;
      if (zSecili) yuklenen.push(k.zf);
      k.sf = mev.s || null;             // POS slip artık toplanmıyor; eski kayıtta varsa korunur
    }
  }catch(e){
    const kalan = await fotoTemizle(yuklenen);
    if (kalan.length) console.warn('YETİM DOSYA (temizlenemedi):', kalan);
    mesaj('gsMsg','hata', hataTr(e.message) + (kalan.length ? ` — ${kalan.length} dosya temizlenemedi (yönetici bilgilendirilmeli)` : ' — yüklenenler temizlendi'));
    btn.disabled=false; btn.textContent='Gün Sonunu Kaydet'; return;
  }
  btn.textContent = eskiBtnMetin;
  window.__sonRpcHataHam = '';
  // DÜZENLEME: kaydı silmeden güncelle
  if (DUZENLE){
    const gData = await rpcCagir('rpc_gun_sonu_guncelle', {
      /* ⚠ GUNCELLEME kaydin KIMLIGINE baglanir, ICERIGINE degil. Icerik
         anahtara girseydi kullanici rakami duzeltip tekrar gonderdiginde
         anahtar degisir ve koruma bosa cikardi. */
      p_idem: await idemKararli('gun_sonu_guncelle',[DUZENLE.id]), p_id: DUZENLE.id,
      p_not: document.getElementById('gsNot').value.trim()||null,
      p_kasa: kasaGonder,
      p_kasalar: kasalar.map(k=>({ kasa_no:k.n, sira:k.s, z_no:k.zno, kart_toplam:k.kart, nakit_toplam:k.nakit,
        kart_adet:k.kadet, fis_iptal_adet:k.iadet, fis_iptal_tutar:k.itutar,
        z_foto_path:k.zf, pos_slip_foto_path:k.sf, notlar:k.knot, kdv:k.kdv }))
    }, 'gsKaydet','gsMsg','Değişiklikler kaydedildi ✓');
    if (gData && gData.ok){ taslakSil(); DUZENLE = null; vGunSonu(); mesaj('gsMsg','ok','Değişiklikler kaydedildi ✓'); }
    else {
      btn.textContent = eskiBtnMetin;
      const bel = /Failed to fetch|NetworkError|timeout|bağlantı/i.test(window.__sonRpcHataHam||'');
      if (bel) mesaj('gsMsg','hata','Bağlantı belirsiz — değişiklik gitmiş olabilir. Listeyi kontrol edin.');
      else if (yuklenen.length) await fotoTemizle(yuklenen);
    }
    return;
  }
  const data = await rpcCagir('rpc_gun_sonu_kaydet', {
    /* ⚠ TUTAR ANAHTARA GIRMEZ. Gun sonu zaten sube+tarih icin tekil
       (sunucu GUN_ZATEN_GIRILMIS firlatiyor). Tutari anahtara katarsak,
       kullanici rakami duzeltip tekrar gonderdiginde anahtar degisir ve
       koruma bosa cikar — tam da onlemek istedigimiz sey. */
    p_idem: await idemKararli('gun_sonu',[AKTIF_SUBE, document.getElementById('gsTarih').value]),
    p_sube: AKTIF_SUBE, p_tarih: document.getElementById('gsTarih').value,
    p_kart: kart, p_nakit: nakit, p_toplam: toplam,
    p_iptal_adet: 0, p_iptal_tutar: 0,
    p_z_no: null, p_kdv: null, p_z_foto: null, p_slip_foto: null,
    p_not: document.getElementById('gsNot').value.trim()||null,
    p_kasa: kasaGonder,          /* ⚠ IKINCI KAYIT YOLU — biri unutulmasin */
    p_kasalar: kasalar.map(k=>({ kasa_no:k.n, sira:k.s, z_no:k.zno, kart_toplam:k.kart, nakit_toplam:k.nakit,
      kart_adet:k.kadet, fis_iptal_adet:k.iadet, fis_iptal_tutar:k.itutar,
      z_foto_path:k.zf, pos_slip_foto_path:k.sf, notlar:k.knot, kdv:k.kdv }))
  }, 'gsKaydet','gsMsg','Gün sonu kaydedildi ✓');
  if (data && data.ok){
    taslakSil();                    // ⚠ YALNIZ basarida. Basarisizlikta taslak DURUR.
    const duzenlemeydi = !!DUZENLE;
    DUZENLE = null;
    vGunSonu();
    mesaj('gsMsg','ok', duzenlemeydi ? 'Değişiklikler kaydedildi ✓' : 'Gün sonu kaydedildi ✓ (2 kasa)');
  } else {
    btn.textContent = eskiBtnMetin;
    // Ağ belirsizse kayıt gitmiş OLABİLİR -> fotoğrafları SİLME. Kesin hatada temizle.
    const belirsiz = /Failed to fetch|NetworkError|timeout|bağlantı/i.test(window.__sonRpcHataHam||'');
    if (belirsiz){
      console.warn('BELİRSİZ SONUÇ — fotoğraflar korundu:', yuklenen);
      mesaj('gsMsg','hata','Bağlantı belirsiz — kayıt gitmiş olabilir. Fotoğraflar silinmedi. Tekrar denemeden önce listeyi kontrol edin.');
    } else {
      const kalan = await fotoTemizle(yuklenen);
      if (kalan.length) console.warn('YETİM DOSYA (temizlenemedi):', kalan);
      /* ⚠ CM · CAKISMADA O GUNDE NE KAYITLI OLDUGUNU GOSTER.
         Eski mesaj yalniz "zaten girilmiş" diyordu; personel kendi
         hatasi mi (yanlis gune yazmis) yoksa gercekten girilmis mi
         AYIRT EDEMIYORDU. Tutar + Z no gorunce "bu dunun rakami,
         yanlis gune yazilmis" diyebiliyor.
         ⚠ YETKI GENISLEMEDI: burada YALNIZ OKUMA var, uzerine yazma
           yolu acilmadi. Okunan satir zaten personelin gordugu bir
           satir — gun sonu listesi ayni tabloyu ayni sutunlarla
           listeliyor — ve sb.from suzgeci sorguyu AKTIF_SUBE'ye
           kilitliyor, baska subenin kaydi gelmez.
         ⚠ Okuma basarisiz olursa MEVCUT MESAJ DURUR; uydurma yok. */
      if (/GUN_ZATEN_GIRILMIS/.test(window.__sonRpcHataHam || ''))
        await gsCakismaAnlat(document.getElementById('gsTarih').value);
    }
  }
}
async function gsCakismaAnlat(tarih){
  try{
    const { data } = await sb.from('gun_sonu')
      .select('tarih,toplam,gun_sonu_kasa(kasa_no,sira,z_no,is_deleted)')
      .eq('tarih', tarih).eq('is_deleted', false).maybeSingle();
    if (!data) return;
    const zler = (data.gun_sonu_kasa || []).filter(k => !k.is_deleted)
      .sort((a,b) => (a.kasa_no-b.kasa_no) || ((a.sira||1)-(b.sira||1)))
      .map(k => k.z_no).filter(Boolean);
    /* ⚠ "SEN DEGISTIREMEZSIN" DEMIYORUZ — OLCULDU, YANLIS OLURDU:
       personelin KENDI girdigi son 3 gun asagidaki "Son Girdiğin
       Günler" kartinda Düzelt/Sil dugmeleriyle duruyor (RLS o
       pencereyi aciyor). Mesaj neyin YAPILABILIR oldugunu soyluyor,
       yetkiyi kendisi tarif etmeye kalkmiyor. */
    mesaj('gsMsg', 'hata',
      tarih.slice(8,10) + '.' + tarih.slice(5,7) + '.' + tarih.slice(0,4)
      + ' zaten girilmiş: ' + tl(data.toplam)
      + (zler.length ? ' · Z ' + zler.join(', ') : ' · Z no girilmemiş')
      + '.\nYanlış günü seçtiysen tarihi düzelt — formdaki rakamlar duruyor.'
      + '\nKayıtlı rakam yanlışsa: aşağıdaki gün listesinden düzeltebiliyorsan düzelt, '
      + 'düzeltemiyorsan yöneticiye bildir.');
  }catch(e){ /* okunamadi -> rpcCagir'in yazdigi mesaj kalir */ }
}
let GS_AY = null;                                    // hangi ay listeleniyor
function gsAyDegisti(){ GS_AY = document.getElementById('gsListeAy').value; gunSonuListe(); }
async function gunSonuListe(){
  const el = document.getElementById('gsListe'); if(!el) return;
  const ay  = GS_AY || bugun().slice(0,7);
  const bas = ay + '-01';
  const sonGun = new Date(+ay.slice(0,4), +ay.slice(5,7), 0).getDate();
  const son = ay + '-' + String(sonGun).padStart(2,'0');
  // AY BAZLI: limit yok, o ayın tamamı gelir (eskiden son 14 kayıt geliyordu, ayın başı düşüyordu)
  const { data, error } = await sb.from('gun_sonu')
    .select('*, gun_sonu_kasa(kasa_no,sira,z_no,kart_toplam,nakit_toplam,toplam,z_foto_path,pos_slip_foto_path,is_deleted), gun_sonu_kdv(kasa_no,sira,oran,satis_toplam,kdv_tutar,is_deleted)')
    .eq('is_deleted',false).gte('tarih',bas).lte('tarih',son).order('tarih',{ascending:false});
  const gunler = data||[];
  // Kasadan ödenen giderler: sayım o kadar eksik çıkar, gerçek ciroya geri eklenir
  const kasadanMap = {};
  const [kg, no, kapali, ilkGunSonu] = await Promise.all([
    sb.from('gider').select('tarih,tutar').eq('kasadan',true).eq('is_deleted',false).gte('tarih',bas).lte('tarih',son),
    sb.from('tedarikci_odeme').select('tarih,tutar').eq('yontem','nakit').eq('is_deleted',false).gte('tarih',bas).lte('tarih',son),
    /* ⚠ ADIM 15 · kapali_gun index'te ILK KEZ OKUNUYOR. Bugune kadar
       yalniz rpc_kapali_gun ile YAZILIYORDU; okuma yolu yoktu ve
       kasten kapatilan gun bu listede "girilmemis" goruniyordu. */
    sb.from('kapali_gun').select('tarih,neden').eq('is_deleted',false)
      .gte('tarih',bas).lte('tarih',son),
    /* ⚠ Y19 · Ozet ile AYNI capa sorgusu — iki ekran ayrisirsa biri
       "eksik" derken oteki demezdi. */
    ilkGunSonuSorgusu()
  ]);
  [...(kg.data||[]), ...(no.data||[])].forEach(x=>{ kasadanMap[x.tarih] = (kasadanMap[x.tarih]||0) + (+x.tutar); });
  const kapaliGunler = kapali.data || [];

  // Ay toplamı + girilmeyen günler (bugünden sonrası beklenmez)
  const tKart  = gunler.reduce((a,g)=>a+ +g.kart_toplam,0);
  const tNakit = gunler.reduce((a,g)=>a+ +g.nakit_toplam,0);
  const tKdv   = gunler.reduce((a,g)=>a+(g.gun_sonu_kdv||[]).filter(x=>!x.is_deleted).reduce((b,x)=>b+ +x.kdv_tutar,0),0);
  const tZDisi = gunler.reduce((a,g)=>a+(g.kasa_nakit===null?0:+g.kasa_nakit),0);
  /* ⚠ ADIM 15 · IKINCI HESAP KALDIRILDI. Buradaki dongu butun aya
     bakiyor, BUGUNU DE sayiyor ve kapali_gun'u HIC sormuyordu; artik
     Ozet ile AYNI fonksiyon. DAVRANIS DEGISIYOR ve ekranda gorunur:
     kapatilan gun ARTIK "girilmemis" sayilmiyor, bugun de sayilmiyor. */
  const eksikGunler = ayinEksikGunleri(ay, tarihKumesi(gunler), tarihKumesi(kapaliGunler),
    ilkGunSonuTarihi(ilkGunSonu));
  const ayBasligi = ayAdi(ay);   // global ayAdi() fonksiyonuyla ayni ismi kullanma: golgeliyordu

  el.innerHTML = `<div class="kart">
    ${kbaslik('', 'Gün Sonları', '')}
    <label>Ay</label>
    <input type="month" id="gsListeAy" value="${ay}" onchange="gsAyDegisti()">
    ${error?`<div class="bilgi-not" style="color:var(--hata)">Liste yüklenemedi: ${esc(hataTr(error.message))}</div>`:''}
    <div class="gs-bant" style="margin:12px 0">
      <div class="kalem"><div class="gs-et">Kart</div><div class="dg">${tl(tKart)}</div></div>
      <div class="kalem"><div class="gs-et">Z nakit</div><div class="dg">${tl(tNakit)}</div></div>
      <div class="kalem buyuk"><div class="gs-et">${esc(ayBasligi)} toplamı</div><div class="dg">${tl(tKart+tNakit)}</div></div>
      <div class="kalem"><div class="gs-et">KDV (beyana giden)</div><div class="dg">${tl(tKdv)}</div></div>
    </div>
    ${eksikGunler.length
      ? `<div class="uyari-orta">${eksikGunler.length} gün girilmemiş: ${eksikGunler.join(', ')}</div>`
      : ''}
    <div class="bilgi-not" style="margin:0 0 10px">
      <b>${gunler.length}</b> gün girildi · Kasada sayılan toplamı <b>${tl(tZDisi)}</b>${eksikGunler.length?'':' · düne kadar eksik gün yok'}${
      /* ⚠ ADIM 15 · KAPATILAN GUN SESSIZ DUSMEZ. Artik "eksik"
         sayilmiyor; sayilmadigi da YAZIYOR, yoksa kullanici listede
         gormeyip "kayboldu" sanar. */
      kapaliGunler.length
        ? ` · ${kapaliGunler.length} gün kapalı işaretli (${kapaliGunler
            .map(x=>+x.tarih.slice(8,10)).sort((a,b)=>a-b).join(', ')}) — eksik sayılmadı`
        : ''}
    </div>
    ${gunler.length===0?bosDurum('belge','Bu ayda gün sonu kaydı yok','Yukarıdan başka ay seçebilir veya bugünün Z raporlarını girebilirsin.'):gunler.map(g=>{
      const kasa = g.kasa_nakit===null ? null : +g.kasa_nakit;
      const kasadan = kasadanMap[g.tarih]||0;
      const gercek = kasa===null ? null : +g.kart_toplam + kasa + kasadan;
      const fark = kasa===null ? null : kasa + kasadan - g.nakit_toplam;
      return `
      <div class="liste-satir">
        <div class="l-sol"><div class="b">${new Date(g.tarih+'T00:00').toLocaleDateString('tr-TR')} ${g.kilitli?'🔒':'🔓'}</div>
          <div class="k">Kart ${tl(g.kart_toplam)} · Z nakit ${tl(g.nakit_toplam)}${(()=>{
            const ks=(g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted)
              .sort((a,b)=>a.kasa_no-b.kasa_no || (a.sira||1)-(b.sira||1));
            return ks.length ? '<br>'+ks.map(k=>`<b>K${k.kasa_no}${zCok(ks,k.kasa_no)?'/'+(k.sira||1):''}</b> Z:${esc(k.z_no||'—')} · ${tl(k.toplam)}`).join(' &nbsp;|&nbsp; ')
                             : ' · Z:'+esc(g.z_no||'—');
          })()}
          ${gercek!==null?`<br>Gerçek: <b>${tl(gercek)}</b> · Z dışı nakit: <b>${fark>=0?'+':''}${tl(fark)}</b>${kasadan>0?' · kasadan ödenen: '+tl(kasadan):''}`:''}
          ${(()=>{const kd=(g.gun_sonu_kdv||[]).filter(x=>!x.is_deleted);
            const ks=(g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted);
            if(!kd.length) return '<br><span style="color:var(--uyari)">⚠ KDV girilmemiş</span>';
            const t=kd.reduce((a,x)=>a+ +x.kdv_tutar,0);
            const par=[1,2].map(no=>{const s=kd.filter(x=>x.kasa_no===no).reduce((a,x)=>a+ +x.kdv_tutar,0);
              return s>0?`K${no} ${tl(s)}`:null;}).filter(Boolean).join(' + ');
            // Satışı olup KDV'si girilmemiş kasa: beyan eksik kalır, ayrıca uyar
            const acik=[1,2].filter(no=>{
              const sat=ks.filter(k=>k.kasa_no===no).reduce((a,k)=>a+ +k.toplam,0);
              const kdv=kd.filter(x=>x.kasa_no===no).reduce((a,x)=>a+ +x.kdv_tutar,0);
              return sat>0 && kdv===0; });
            return `<br>KDV: <b>${tl(t)}</b>${par?' ('+par+')':''}`
              + (acik.length?`<br><span style="color:var(--uyari)">⚠ Kasa ${acik.join(' ve ')} satış yapmış ama KDV'si girilmemiş</span>`:'');})()}
          ${g.notlar?'<br>'+esc(g.notlar):''}
          ${(()=>{const ks=(g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted)
              .sort((a,b)=>a.kasa_no-b.kasa_no || (a.sira||1)-(b.sira||1));
            const t=new Date(g.tarih+'T00:00').toLocaleDateString('tr-TR');
            if(ks.length) return '<div style="margin-top:6px">'+ks.map(k=>{
              const e=`K${k.kasa_no}${zCok(ks,k.kasa_no)?'/'+(k.sira||1):''}`;
              return belgeBtn(k.z_foto_path,`${e} Z`,`${t} — Kasa ${k.kasa_no} ${zCok(ks,k.kasa_no)?(k.sira||1)+'. Z':'Z'} Raporu`)+
                     slipBtn(k.pos_slip_foto_path,`${e} Slip`,`${t} — Kasa ${k.kasa_no} POS Slip`);}).join('')+'</div>';
            return '<div style="margin-top:6px">'+belgeBtn(g.z_foto_path,'Z Raporu',`${t} — Z Raporu`)+
                   slipBtn(g.pos_slip_foto_path,'POS Slip',`${t} — POS Slip`)+'</div>';
          })()}</div></div>
        <div class="l-sag">${tl(g.toplam)}<br>
          <button class="btn2" style="margin-top:4px" onclick="gunSonuDuzenle('${g.id}')">Düzenle</button>
          <button class="btn-kirmizi" style="margin-top:4px" onclick="gunSil('${g.id}','${g.tarih}')">Sil</button></div>
      </div>`;}).join('')}</div>`;
}
async function gunSil(id, tarih){
  const neden = await nedenSor(`${tarih} günü SİLİNECEK (kayıt audit'te kalır) ve yeniden girilebilir olacak. Neden?`, null, 1);
  if (neden===null) return;
  if (!neden.trim()){ bildir('Neden yazmak zorunlu.', 'hata'); return; }
  const { error } = await sb.rpc('rpc_gun_sonu_sil', { p_id:id, p_neden:neden.trim() });
  if (error){ bildir('Silinemedi: '+hataTr(error.message), 'hata'); return; }
  try{ localStorage.removeItem('sonGunSonu'); }catch(e){}
  vGunSonu();
}

async function kasadanDetay(ay){
  const ov=udKutu(), ic=document.getElementById('udIcerik');
  ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Yükleniyor...</div></div>

  ov.classList.add('acik');
  const sonGun=new Date(+ay.slice(0,4), +ay.slice(5,7), 0).getDate();
  const bas=ay+'-01', son=ay+'-'+String(sonGun).padStart(2,'0');
  const [gd, td] = await Promise.all([
    sb.from('gider').select('tarih,tutar,aciklama,gider_kategori(ad)')
      .eq('is_deleted',false).eq('kasadan',true).gte('tarih',bas).lte('tarih',son),
    sb.from('tedarikci_odeme').select('tarih,tutar,aciklama,tedarikci(ad)')
      .eq('is_deleted',false).eq('yontem','nakit').gte('tarih',bas).lte('tarih',son)
  ]);
  const bas_=(sag)=>`<div class="ud-ust"><div style="flex:1;min-width:0">
      <div class="ud-kod">KASADAN NAKİT</div><div class="ud-ad">${esc(ayAdi(ay))}</div>${sag||''}</div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  if(gd.error||td.error){
    ic.innerHTML=bas_()+`<div class="ud-govde"><div class="uyari-agir">Yüklenemedi:
      ${esc(hataTr((gd.error||td.error).message))}</div></div>`; return;
  }
  const kayitlar=[
    ...(gd.data||[]).map(x=>({ tarih:x.tarih, tutar:+x.tutar,
      ne: esc(x.aciklama || x.gider_kategori?.ad || 'Gider'),
      tur: esc(x.gider_kategori?.ad || 'Gider') })),
    ...(td.data||[]).map(x=>({ tarih:x.tarih, tutar:+x.tutar,
      ne: esc(x.tedarikci?.ad || 'Tedarikçi') + (x.aciklama?' — '+esc(x.aciklama):''),
      tur: 'Tedarikçi ödemesi' }))
  ].sort((a,b)=> a.tarih<b.tarih?1:a.tarih>b.tarih?-1:0);
  const toplam=kayitlar.reduce((a,x)=>a+x.tutar,0);
  const GUNAD=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

  ic.innerHTML=bas_()+`<div class="ud-govde">
    <div class="ud-kunye" style="grid-template-columns:1fr 1fr">
      <div><div class="ud-et">TOPLAM</div><div class="ud-dg" style="color:var(--uyari)">${tl(toplam)}</div></div>
      <div><div class="ud-et">KAYIT</div><div class="ud-dg">${kayitlar.length}</div></div>
    </div>
    ${kayitlar.length===0
      ? '<div class="ud-bos">Bu ay kasadan nakit ödeme yapılmamış.</div>'
      : kayitlar.map(x=>{
          const d=new Date(x.tarih+'T00:00');
          return `<div class="ud-satir tikla" style="grid-template-columns:44px 1fr auto"
              onclick="gunDetay('${x.tarih}')">
            <div class="ud-trh">${d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}
              <span style="display:block;font-size:10px;font-weight:700">${GUNAD[d.getDay()].slice(0,3)}</span></div>
            <div><div style="font-weight:800;font-size:13px">${x.ne}</div>
              <div class="ud-alt">${x.tur}</div></div>
            <div class="ud-tut">${tl(x.tutar)}</div>
          </div>`;
        }).join('')}
    <div class="bilgi-not" style="margin-top:12px">
      Bu ödemeler <b>elindeki nakitten</b> yapıldı. O günün kasa sayımı bu kadar düşük çıkar —
      satırın üstüne dokunursan o günün gün sonu kaydı açılır.
    </div>
  </div>`;
}
/* ==================================================================
   ADIM 12 · TEDARIKCI ODEMESI · TEK FORM, IKI GIRIS NOKTASI
   ==================================================================
   OLCULEN HATA: ayni RPC iki ekrandan IKI FARKLI SOZLESMEYLE
   cagriliyordu. Giderler > Odemeler yolu p_taksit · p_taksit_ilk ·
   p_banka gonderiyor ve p_idem'i idemKararli ile uretiyordu;
   Tedarikci ekraninin cagrisinda BU UC PARAMETRE HIC YOKTU ve
   p_idem rastgeleydi. Alti taksitli bir kart odemesi oradan
   girilince sunucu varsayilan 1'e dusuyor, banka kayboluyor, nakit
   takvimi altinci ayi hic gormuyordu — ve kullaniciya hicbir sey
   soylenmiyordu.
   ⚠ YENI TASARIM ICAT EDILMEDI: Giderler'deki form zaten dogru ve
     tamdi; asagidaki kurucu ONUN alanlarini, dogrulamalarini ve
     mesajlarini tasiyor, Tedarikci ekrani ona esitlendi.
   ⚠ ALAN ID'LERI ONEKTEN uretiliyor: Giderler 'od', Tedarikci 'to'.
     Boylece iki form ayni sayfada bulunsa bile id cakismaz ve HER
     IKI EKRANIN eski id'leri (odTutar/odMsg/odKaydet · toTutar/
     toMsg/toKaydet) AYNEN korunur — disaridaki cagri yerleri
     bozulmaz. Tek istisna: tedarikci ekraninin 'toTedarikci' ve
     'toCekSatir' id'leri artik 'toKime' ve 'toCekAlan'; ikisini de
     yalnizca bu dosyadaki iki satir okuyordu, ikisi de guncellendi. */
const OD_YONTEM = [['kart','Kart'], ['nakit','Nakit — kasadan'],
                   ['havale','Havale/EFT'], ['cek','Çek']];
const OD_TAKSIT = [1,2,3,4,5,6,9,12];

function tedarikciOdemeFormu(onek, sec){
  sec = sec || {};
  const k = (ad) => onek + ad;
  const teds = KATALOG.tedarikciler.map(t=>`<option value="${t.id}">${esc(t.ad)}</option>`).join('');
  return `
      <label>${sec.kimeEtiketi || 'Firma'}</label>
      <select id="${k('Kime')}" onchange="odFormKimeDegisti('${onek}')">
        ${teds}${sec.digerVar ? `
        <option value="__diger">— Diğer (firma dışı) —</option>` : ''}
      </select>${sec.digerVar ? `
      <div id="${k('DigerAlan')}" style="display:none">
        <label>Ne için ödendi? *</label>
        <input type="text" id="${k('AciklamaDiger')}" placeholder="örn: ilaçlama, tamirci, temizlik">
        <label>Kategori</label>
        <select id="${k('Kategori')}">${KATALOG.kategoriler.map(c=>`<option value="${c.id}">${esc(c.ad)}</option>`).join('')}</select>
      </div>` : ''}
      ${tarihSecici(k('Tarih'))}
      <label>Tutar</label><input type="text" inputmode="decimal" id="${k('Tutar')}" placeholder="0,00">
      <label>Neyle ödendi?</label>
      <select id="${k('Yontem')}" onchange="odFormYontemDegisti('${onek}')">
        ${OD_YONTEM.map(([v,a])=>`<option value="${v}">${a}</option>`).join('')}
      </select>
      <div id="${k('CekAlan')}" style="display:none">
        <div class="satir">
          <div><label>Çek No</label><input type="text" id="${k('CekNo')}"></div>
          <div><label>Çek Vadesi</label><input type="date" id="${k('CekVade')}"></div>
        </div>
      </div>
      <div id="${k('KartAlan')}" style="display:none">
        <div class="satir">
          <div><label>Taksit</label>
            <select id="${k('Taksit')}" onchange="odFormTaksitDegisti('${onek}')">
              ${OD_TAKSIT.map(n=>`<option value="${n}">${n===1?'Tek çekim':n+' taksit'}</option>`).join('')}
            </select></div>
          <div><label>Hangi kart</label><input type="text" id="${k('Banka')}" placeholder="örn: Akbank ticari"></div>
        </div>
        <div id="${k('TaksitTarihAlan')}" style="display:none">
          <label>İlk taksit hangi gün hesaptan çıkacak?</label>
          <input type="date" id="${k('TaksitIlk')}">
          <div class="ipucu" id="${k('TaksitOzet')}"></div>
        </div>
      </div>
      <div id="${k('AciklamaAlan')}"><label>Açıklama</label><input type="text" id="${k('Aciklama')}"></div>
      <div class="ipucu" style="margin-top:8px">Nakit seçersen kasadan ödenmiş sayılır —
        o gün kasada sayılan para o kadar eksik çıkar, sistem bunu bilir.</div>
      <button class="btn" id="${k('Kaydet')}" onclick="${sec.kaydet}">Ödemeyi Kaydet</button>
      <div class="hata-msg" id="${k('Msg')}"></div>`;
}
/* Formu kurduktan SONRA cagrilir. ⚠ Giderler ekraninin uc satirinin
   AYNISI (paraBaglaHepsi + paraBagla + ilk gorunum); iki ekranin
   baglanma sirasi da esitlensin diye tek yere alindi. */
function tedarikciOdemeFormuBagla(onek){
  paraBaglaHepsi([onek+'Tutar']);
  paraBagla(document.getElementById(onek+'Tutar'), () => odFormTaksitDegisti(onek));
  odFormYontemDegisti(onek);
}

function odFormKimeDegisti(onek){
  const s = document.getElementById(onek+'Kime');
  const diger = !!s && s.value === '__diger';
  const da = document.getElementById(onek+'DigerAlan');
  if (da) da.style.display = diger ? 'block' : 'none';
  document.getElementById(onek+'AciklamaAlan').style.display = diger ? 'none' : 'block';
}
function odFormYontemDegisti(onek){
  const y = document.getElementById(onek+'Yontem').value;
  document.getElementById(onek+'CekAlan').style.display  = y==='cek'  ? 'block' : 'none';
  // Taksit yalnız kartta olur; başka yöntemde alan gizlenir ve 1'e döner
  document.getElementById(onek+'KartAlan').style.display = y==='kart' ? 'block' : 'none';
  if (y !== 'kart'){ document.getElementById(onek+'Taksit').value = '1'; }
  odFormTaksitDegisti(onek);
}
function odFormTaksitDegisti(onek){
  const n = +document.getElementById(onek+'Taksit').value || 1;
  const alan = document.getElementById(onek+'TaksitTarihAlan');
  alan.style.display = n > 1 ? 'block' : 'none';
  const ozet = document.getElementById(onek+'TaksitOzet');
  if (n < 2){ ozet.textContent = ''; return; }
  const t = paraDeger(onek+'Tutar');
  if (!t){ ozet.textContent = 'Tutarı yazınca taksit dökümü burada çıkar.'; return; }
  // Kuruş kaybı olmasın: son taksit farkı alır (görünümdeki hesabın aynısı)
  const bir = Math.round((t/n)*100)/100, son = Math.round((t - bir*(n-1))*100)/100;
  ozet.innerHTML = `Ayda <b>${tl(bir)}</b>${son!==bir?` (son taksit ${tl(son)})`:''} · toplam <b>${tl(t)}</b>.
    Tedarikçinin borcu bugün kapanır; para hesabından ${n} ayda çıkar.`;
}
/* Giderler ekraninin ESKI ADLARI — disaridaki cagrilar bozulmasin. */
function odKimeDegisti(){ odFormKimeDegisti('od'); }
function odYontemDegisti(){ odFormYontemDegisti('od'); }
function odTaksitDegisti(){ odFormTaksitDegisti('od'); }

/* ⚠ TEK SOZLESME. RPC'ye giden parametre listesi ARTIK TEK YERDE
   yaziyor; iki ekran da yukunu buradan aliyor. Ikinci bir liste
   tutmak, bu turda kapattigimiz hatanin ta kendisiydi. */
async function tedarikciOdemeYuku(onek){
  const g = (ad) => document.getElementById(onek + ad);
  const kime   = g('Kime').value;
  const tutar  = paraDeger(onek + 'Tutar');
  const yontem = g('Yontem').value;
  const tarih  = g('Tarih').value;
  if (tutar === 0) return { ok:false, hata:'Tutar boş olamaz.' };
  const cek  = yontem === 'cek';
  const kart = yontem === 'kart';
  const taksit = kart ? (+g('Taksit').value || 1) : 1;
  const taksitIlk = g('TaksitIlk').value || null;
  /* ⚠ MESAJ VE GEREKCE AYNEN Giderler yolundan: ilk taksit tarihi
     yoksa nakit takvimi yanlis olur. Tedarikci ekrani bunu HIC
     sormuyordu ve sessizce tek cekim kaydediyordu. */
  if (taksit > 1 && !taksitIlk)
    return { ok:false, hata:'Taksitli ödemede ilk taksitin çıkacağı tarihi seç — yoksa nakit takvimi yanlış olur.' };
  return { ok:true, yuk: {
    /* ⚠ ANAHTAR BILESENLERI GENISLETILMEDI: [sube, tarih, kime,
       tutar, yontem]. Taksit/banka eklemek, ayni odemenin parametresi
       duzeltilip yeniden gonderilmesini YENI bir istek yapar ve
       mukerrer korumasini deler. */
    p_idem: await idemKararli('odeme',[AKTIF_SUBE, tarih, kime, tutar, yontem]),
    p_sube: AKTIF_SUBE, p_tedarikci: kime, p_tarih: tarih, p_tutar: tutar,
    p_aciklama: g('Aciklama').value.trim()||null,
    p_yontem: yontem,
    p_cek_no: cek ? (g('CekNo').value.trim()||null) : null,
    p_cek_vade: cek ? (g('CekVade').value||null) : null,
    p_taksit: taksit,
    p_taksit_ilk: taksit > 1 ? taksitIlk : null,
    p_banka: kart ? (g('Banka').value.trim()||null) : null
  }};
}
/* Tek form, iki kayıt yolu:
     firma seçilirse  -> tedarikci_odeme  (bakiyesi düşer)
     "Diğer" seçilirse-> gider            (firma bakiyesi yok, açıklama zorunlu)
   Nakit seçilirse her iki yolda da "kasadan ödendi" işaretlenir — o gün sayılan
   kasa o kadar eksik çıkar ve sistem bunu toplam nakde geri ekler. */
async function odemeGirisiKaydet(){
  const kime = document.getElementById('odKime').value;
  const tutar = paraDeger('odTutar');
  const yontem = document.getElementById('odYontem').value;
  const tarih = document.getElementById('odTarih').value;
  if (tutar === 0){ mesaj('odMsg','hata','Tutar boş olamaz.'); return; }

  if (kime === '__diger'){
    const ne = document.getElementById('odAciklamaDiger').value.trim();
    if (!ne){ mesaj('odMsg','hata','"Diğer" seçtiğinde ne için ödendiğini yazman gerekiyor.'); return; }
    const data = await rpcCagir('rpc_gider_kaydet',{
      p_idem: await idemKararli('gider',[AKTIF_SUBE, tarih, document.getElementById('odKategori').value, tutar, yontem]),
      p_sube: AKTIF_SUBE, p_tarih: tarih,
      p_kategori: document.getElementById('odKategori').value,
      p_aciklama: ne, p_tutar: tutar,
      p_kdv_orani: null, p_kdv_tutar: 0, p_foto: null,
      p_kasadan: yontem === 'nakit', p_tedarikci: null
    },'odKaydet','odMsg','Ödeme kaydedildi ✓');
    if (data && data.ok){
      document.getElementById('odTutar').value=''; document.getElementById('odAciklamaDiger').value='';
      gdOdeme();
    }
    return;
  }
  /* ⚠ ADIM 12 · yuk ARTIK ORTAK: tedarikciOdemeYuku. Bu yolun gonderdigi
     parametreler DEGISMEDI (olculdu, dizi karsilastirmasi) — degisen sey,
     ayni listenin ikinci bir kopyasinin artik OLMAMASI. */
  const r = await tedarikciOdemeYuku('od');
  if (!r.ok){ mesaj('odMsg','hata', r.hata); return; }
  const data = await rpcCagir('rpc_tedarikci_odeme_kaydet', r.yuk,
    'odKaydet','odMsg','Ödeme kaydedildi ✓');
  if (data && data.ok){
    document.getElementById('odTutar').value=''; document.getElementById('odAciklama').value='';
    document.getElementById('odTaksit').value='1'; odTaksitDegisti();
    gdOdeme();
  }
}
/* KART TAKSİT TAKVİMİ — hangi ay ne kadar kart borcu çıkacak.
   Tedarikçi bakiyesiyle ilgisi yok: firma parasını aldı. Bu senin hesabından
   çıkacak paranın takvimi. Geçmiş aylar da görünür ki ekstreyle karşılaştırasın. */
async function taksitTakvimi(){
  const el = document.getElementById('taksitAlan'); if(!el) return;
  const { data, error } = await sb.from('v_kart_taksit')
    .select('firma,banka,odeme_tarihi,toplam_tutar,taksit_sayisi,taksit_no,vade,donem,taksit_tutari')
    .gt('taksit_sayisi', 1).order('vade');
  if (error){ el.innerHTML = `<div class="uyari-agir">Taksitler yüklenemedi: ${esc(hataTr(error.message))}</div>`; return; }
  const list = data||[];
  if (!list.length){
    el.innerHTML = bosDurum('belge','Taksitli ödeme yok',
      'Kartla taksitli ödeme girdiğinde hangi ay ne kadar çıkacağı burada listelenir.');
    return;
  }
  const buAy = bugun().slice(0,7);
  const aylar = {};
  list.forEach(x=>{ (aylar[x.donem] = aylar[x.donem] || []).push(x); });
  const gelecek = list.filter(x=>x.donem >= buAy).reduce((a,x)=>a+ +x.taksit_tutari, 0);
  el.innerHTML = `
    <div class="ozet-kut" style="margin-bottom:12px">
      <div class="e">BUNDAN SONRA ÇIKACAK</div>
      <div class="d" style="color:var(--uyari)">${tl(gelecek)}</div>
      <div class="aciklama">${list.filter(x=>x.donem>=buAy).length} taksit · bu ay ve sonrası</div>
    </div>
    ${Object.keys(aylar).sort().map(d=>{
      const t = aylar[d].reduce((a,x)=>a+ +x.taksit_tutari,0);
      const gecmis = d < buAy;
      return `<div class="ud-bas" style="margin-top:14px">
          <span class="ud-blk">${esc(ayAdi(d))}${gecmis?' · çıktı':''}</span>
          <span class="ud-trend"${gecmis?' style="opacity:.55"':''}>${tl(t)}</span></div>`
        + aylar[d].map(x=>srSatir({
            ad: esc(x.firma) + (gecmis?'':' <span class="rozet rz-uyari">bekliyor</span>'),
            alt: x.taksit_no+'/'+x.taksit_sayisi+' taksit'
                 + (x.banka?' · '+esc(x.banka):'')
                 + ' · toplam '+tl(x.toplam_tutar),
            tutar: tl(x.taksit_tutari)
          })).join('');
    }).join('')}
    <div class="bilgi-not" style="margin-top:10px">
      Bu tutarlar tedarikçi borcuna <b>dahil değil</b> — firma parasını ödeme günü aldı.
      Burada yalnız <b>senin hesabından</b> hangi ay ne kadar çıkacağı var.
    </div>`;
}
async function gdOdeme(){
  const ay = GD_ODEME_AY || bugun().slice(0,7);
  GD_ODEME_AY = ay;
  const sonGun = new Date(+ay.slice(0,4), +ay.slice(5,7), 0).getDate();
  const bas = ay+'-01', son = ay+'-'+String(sonGun).padStart(2,'0');
  document.getElementById('gdIcerik').innerHTML = `
    <div class="kart">
      ${kbaslik('', 'Ödeme Kaydet', '')}
      ${tedarikciOdemeFormu('od', { kimeEtiketi:'Kime ödendi?', digerVar:true,
                                    kaydet:'odemeGirisiKaydet()' })}
    </div>
    <div class="kart">
      ${kbaslik('AY İÇİNDE', 'Yapılan Ödemeler', '')}
      <label>Ay</label>
      <input type="month" id="gdOdemeAy" value="${ay}" onchange="GD_ODEME_AY=this.value; gdOdeme()">
      <div id="gdOdemeListe">Yükleniyor...</div>
    </div>
    <div class="kart">
      ${kbaslik('KART BORCU', 'Taksit Takvimi', '')}
      <div id="taksitAlan">Yükleniyor...</div>
    </div>`;
  document.getElementById('gdListe').innerHTML = '';
  tedarikciOdemeFormuBagla('od');
  taksitTakvimi();
  const [gd, td] = await Promise.all([
    sb.from('gider').select('tarih,tutar,aciklama,kasadan,gider_kategori(ad)')
      .eq('is_deleted',false).gte('tarih',bas).lte('tarih',son),
    sb.from('tedarikci_odeme').select('tarih,tutar,yontem,cek_no,cek_vade,aciklama,tedarikci(ad)')
      .eq('is_deleted',false).gte('tarih',bas).lte('tarih',son)
  ]);
  const el = document.getElementById('gdOdemeListe'); if(!el) return;
  if (gd.error || td.error){
    el.innerHTML = `<div class="uyari-agir">Liste yüklenemedi: ${esc(hataTr((gd.error||td.error).message))}</div>`;
    return;
  }
  const YONTEM = {kart:'Kart', nakit:'Nakit', havale:'Havale/EFT', cek:'Çek'};
  const kayitlar = [
    ...(gd.data||[]).map(x=>({ tarih:x.tarih, tutar:+x.tutar,
      kime: esc(x.gider_kategori?.ad || 'Gider'),
      nasil: x.kasadan ? 'Kasadan nakit' : 'Gider',
      not: esc(x.aciklama||''), kasadan: !!x.kasadan, tur:'gider' })),
    ...(td.data||[]).map(x=>({ tarih:x.tarih, tutar:+x.tutar,
      kime: esc(x.tedarikci?.ad || 'Tedarikçi'),
      nasil: YONTEM[x.yontem] || esc(x.yontem||'—'),
      not: x.cek_no ? 'Çek '+esc(x.cek_no)+(x.cek_vade?' · vade '+new Date(x.cek_vade+'T00:00').toLocaleDateString('tr-TR'):'')
                    : esc(x.aciklama||''),
      kasadan: x.yontem==='nakit', tur:'tedarikci' }))
  ].sort((a,b)=> a.tarih < b.tarih ? 1 : a.tarih > b.tarih ? -1 : 0);

  const toplam = kayitlar.reduce((a,x)=>a+x.tutar,0);
  const kasadanT = kayitlar.filter(x=>x.kasadan).reduce((a,x)=>a+x.tutar,0);
  const tedT = kayitlar.filter(x=>x.tur==='tedarikci').reduce((a,x)=>a+x.tutar,0);
  const gidT = toplam - tedT;

  el.innerHTML = kayitlar.length===0
    ? bosDurum('belge','Bu ay ödeme kaydı yok',
        'Firmaya yapılan ödemeler Tedarikçi ekranından, elektrik/fiş gibi giderler Temel ve Fiş bölümünden girilir; hepsi burada toplanır.')
    : `<div class="ozet-grid" style="margin-top:12px">
        <div class="ozet-kut"><div class="e">TOPLAM ÖDEME</div><div class="d">${tl(toplam)}</div>
          <div class="aciklama">${kayitlar.length} kayıt</div></div>
        <div class="ozet-kut${kasadanT>0?' ac':''}"${kasadanT>0?` onclick="kasadanDetay('${ay}')"`:''}>
          <div class="e">KASADAN NAKİT</div>
          <div class="d" style="color:${kasadanT>0?'var(--uyari)':'var(--ana)'}">${tl(kasadanT)}</div>
          <div class="aciklama">${kasadanT>0?'elden çıkan · dökümü gör':'elden çıkan yok'}</div></div>
      </div>
      ${ozSatir('Tedarikçi ödemeleri', tl(tedT))}
      ${ozSatir('Giderler', tl(gidT))}
      ${ozSatir('TOPLAM', tl(toplam), true)}
      <div class="ud-bas" style="margin-top:16px"><span class="ud-blk">DÖKÜM</span>
        <span class="ud-trend">${ayAdi(ay)}</span></div>
      ${kayitlar.map(x=>srSatir({
          ad: x.kime + (x.kasadan?' <span class="rozet rz-uyari">kasadan</span>':''),
          alt: new Date(x.tarih+'T00:00').toLocaleDateString('tr-TR') + ' · ' + x.nasil
               + (x.not ? ' · ' + x.not : ''),
          tutar: tl(x.tutar)
        })).join('')}
      <div class="bilgi-not" style="margin-top:10px">

/* ===== AY SONU MUTABAKATI =====
   Personel ay boyunca faturaları tek tek girer. Ay sonunda portaldan inen zip buraya
   bırakılır: sistem her PDF'i okuyup belge numarasından eşleştirir.
     · Girilmiş + belgesiz  -> PDF'i kaydına ekler (arşiv tamamlanır)
     · Girilmemiş           -> listeler, tek tuşla forma taşır
     · Alıcısı biz değiliz  -> ayırır (LTD/şahsi karışmasın)
   Böylece gözden kaçan fatura kalmaz. */
let MUTABAKAT = [];
function gdMutabakat(){
  document.getElementById('gdIcerik').innerHTML = `
    <div class="kart">
      <div class="kbaslik">Ay Sonu Mutabakatı — gözden kaçan fatura kalmasın</div>
      <div class="bilgi-not" style="margin:0 0 8px">Luca portalından indirdiğin <b>zip'i olduğu gibi</b> bırak
        (ya da PDF'leri topluca seç). Sistem her belgeyi okur, numarasından eşleştirir:
        girilmemiş olanları listeler, girilmiş ama belgesi olmayanlara PDF'i ekler.</div>
      <label>Zip veya PDF'ler</label>
      <input type="file" id="mtDosya" accept=".zip,application/zip,application/pdf,.pdf" multiple>
      <button class="btn" id="mtBtn" onclick="mutabakatCalistir()">Belgeleri Oku ve Karşılaştır</button>
      <div class="oku-durum" id="mtDurum"></div>
      <div class="hata-msg" id="mtMsg"></div>
    </div>
    <div id="mtSonuc"></div>
    <div id="mtToplu"></div>`;
}
async function mutabakatDosyalari(){
  const inp = document.getElementById('mtDosya');
  const secilen = [...(inp?.files || [])];
  if (!secilen.length) throw new Error('Önce zip veya PDF seç.');
  const pdfler = [];
  for (const f of secilen){
    if (/\.zip$/i.test(f.name) || f.type === 'application/zip'){
      if (!window.JSZip) throw new Error('Zip okuyucu yüklenemedi — internet bağlantısını kontrol et.');
      const z = await window.JSZip.loadAsync(f);
      const adlar = Object.keys(z.files).filter(n => /\.pdf$/i.test(n) && !z.files[n].dir);
      for (const n of adlar){
        const blob = await z.files[n].async('blob');
        pdfler.push(new File([blob], n.split('/').pop(), { type:'application/pdf' }));
      }
    } else if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf'){
      pdfler.push(f);
    }
  }
  if (!pdfler.length) throw new Error('Seçilenlerin içinde PDF bulunamadı.');
  return pdfler;
}
/* ==================================================================
   ⚠ CS · E-FATURA ALAN OKUYUCU (yerel, sunucu çağrısı YOK)
   ÖLÇÜLDÜ — 25 gerçek e-fatura, dört ayrı ihraççı:
     belge no 25/25 · firma 25/25 · VKN 25/25 · tutar 25/25
     tarih 24/25 · KDV 21/25 · matrah 24/25
     TAM okunan (no+tarih+tutar): 24/25 · eksik 1 (Turkcell, tarih yok)
   Toplam/KDV etiketi ihraççıdan ihraççıya değişiyor:
     BİM      "Fatura Tutarı: 1.407,00 TL" · "Hesaplanan KDV (1393.07) %1: 13,93 TL"
     Şenpiliç "Yekün: 1.322,50" · "K.D.V.(%1): 13,09" · "Ara Toplam: 1.309,41"
     AKSA     "Ödenecek Tutar" · "Vergiler Dahil Toplam Tutar" · "Mal Hizmet Toplam Tutarı"
   ⚠ PARANTEZ TUZAĞI: "Hesaplanan KDV (1393.07) %1: 13,93" — parantez
     içindeki sayı KDV DEĞİL, matrahtır. Desen tutarı İKİ NOKTADAN
     SONRA arar. (İlk denemede 3.07 okunuyordu — sessizce yanlış rakam.)
   ⚠ FİRMA ve VKN DOSYA ADINDAN: portal "BELGENO_VKN_FİRMA.pdf" veriyor,
     25/25 doğru. Metnin ilk satırı başlık çöpü.
   ⚠ Bu fonksiyon gdFatura yolundaki sunucu okuyucusunu (Edge Function)
     ÇAĞIRMAZ: 25 fatura = 25 sunucu çağrısı olurdu. Yerelde okunamayan
     satır zaten kaydedilmiyor, kullanıcı onu tek tek forma alıyor —
     orada sunucu okuyucusu devrede. */
const FA_P = '([0-9][0-9.]*,[0-9]{2}|[0-9]+\\.[0-9]{2}|[0-9][0-9.,]*)';
const faIlk = (t, kaliplar) => {
  for (const k of kaliplar){ const m = t.match(new RegExp(k, 'i')); if (m && m[1]) return m[1]; }
  return null;
};
/* Fatura metnindeki sayı KURUŞA. İki biçim de geliyor: "1.234,56" (TR)
   ve "1234.56" (EN). Virgül varsa TR (noktalar ayıraç), yoksa iki
   haneli nokta ondalıktır. Okunamazsa null. */
function faKurus(s){
  const x = String(s || '').trim();
  if (!x) return null;
  const n = x.includes(',') ? Number(x.replace(/\./g,'').replace(',','.'))
          : /^\d+\.\d{2}$/.test(x) ? Number(x)
          : Number(x.replace(/\./g,''));
  return Number.isFinite(n) ? Math.round(n * 100) : null;
}
/* ⚠ AYIRAÇLI YAZ: sade "3250,00" da paraCoz'dan geçiyor ama alan

   değer değişmediği hâlde "değişti" diyordu (ölçüldü: DELTA
   "3.250,00" -> "3250,00"). Biçim korunur. */
const faYaz = (k) => (k/100).toLocaleString('tr-TR',
  { minimumFractionDigits:2, maximumFractionDigits:2 });
/* ⚠ DA · ÇOK ORANLI FATURADA KDV TOPLANIR.
   ÖLÇÜLDÜ — bazı faturalarda "Toplam KDV Tutarı" etiketi YOK, yalnız
   oran oran satırlar var ve okuyucu İLKİNİ alıp duruyordu:
     Kardeşler  KDV(%20.00) 860,83 + KDV(%10.00)  29,55 = 890,38
                (4.599,62 + 890,38 = 5.490,00 ✓) — alınan 860,83
     TM İçecek  KDV(%1)      37,03 + KDV(%10)    231,82 = 268,85
                (6.021,16 + 268,85 = 6.290,01 ✓) — alınan  37,03
   TM'de tek faturada 231,82 TL KDV indirimi EKSİK giriyordu.
   ⚠ AYIRICI ":" OLMAYABİLİR — bu ikisinde yok.
   ⚠ "Hesaplanan KDV Matrahı(%x)" TOPLAMA GİRMEZ: desen "KDV" ile "("
     arasına söz koydurtmuyor, Matrah satırı bu yüzden eşleşmiyor. */
const FA_KDV_SATIR = new RegExp(
  'Hesaplanan\\s*KDV\\s*\\(\\s*%?\\s*[0-9.,]+\\s*\\)\\s*:?\\s*' + FA_P, 'gi');
function faKdvTopla(t){
  FA_KDV_SATIR.lastIndex = 0;
  let m, top = 0, adet = 0;
  while ((m = FA_KDV_SATIR.exec(t))){
    const k = faKurus(m[1]);
    if (k == null) return null;               // biri okunamadıysa toplam da güvenilmez
    top += k; adet++;
  }
  return adet ? faYaz(top) : null;
}
function faturaAlanlari(ad, metin){
  const t = String(metin || '').replace(/\s+/g, ' ');
  const p = String(ad || '').replace(/\.pdf$/i, '').split('_');

                       'Tarihi?\\s*:?\\s*(\\d{2}\\s?[-./]\\s?\\d{2}\\s?[-./]\\s?\\d{4})']);
  return {
    belge_no: /^[A-Z0-9]{10,20}$/i.test(p[0] || '') ? p[0].toUpperCase() : null,
    vkn:      /^\d{10,11}$/.test(p[1] || '') ? p[1] : null,
    firma:    p.length >= 3 ? p.slice(2).join('_').trim() : null,
    tarih:    th ? th.replace(/\s/g, '') : null,
    tutar:    faIlk(t, ['Ödenecek\\s*Tutar\\s*:?\\s*' + FA_P,
                        'Vergiler\\s*Dahil\\s*Toplam\\s*Tutar\\s*:?\\s*' + FA_P,
                        'Fatura\\s*Tutar[ıi]\\s*:?\\s*' + FA_P,
                        'Yek[üu]n\\s*:?\\s*' + FA_P,
                        'GENEL\\s*TOPLAM\\s*:?\\s*' + FA_P]),
    /* ⚠ CZ · IKI HATA BIRDEN DUZELDI (olculdu, Bizim Toptan metni):
         Mal Hizmet Toplam Tutarı       : 2.092,48
         Hesaplanan KDV Matrahı(%10,00) :   714,16
         Hesaplanan KDV(%10,00)         :    71,42
         Hesaplanan KDV Matrahı(%1,00)  : 1.170,10
         Hesaplanan KDV(%1,00)          :    11,70
         Hesaplanan KDV Matrahı(%20,00) :   208,22
         Hesaplanan KDV(%20,00)         :    41,64
         Toplam KDV Tutarı              :   124,76
       1) Eski desen 'Hesaplanan\s*KDV[^:]{0,30}:' MATRAH satirina da
          uyuyor ve 714,16'yi KDV saniyordu.
       2) Cok oranli faturada tek oranin kdv'sini almak da yanlis
          olurdu (11,70 gibi) — dogrusu TOPLAM: 71,42+11,70+41,64.
       Bu yuzden "Toplam KDV Tutarı" ONCE aranir, "Hesaplanan KDV"

    /* SIRA: (a) tek doğru toplam varsa o · (b) yoksa oran oran TOPLA

    kdv:      faIlk(t, ['Toplam\\s*KDV\\s*Tutar[ıi]\\s*:?\\s*' + FA_P])
              || faKdvTopla(t)
              || faIlk(t, ['Hesaplanan\\s*KDV(?![^:]{0,30}Matrah)[^:]{0,30}:\\s*' + FA_P,
                           'K\\.?\\s?D\\.?\\s?V\\.?\\s*\\(\\s*%[0-9.,]+\\s*\\)\\s*:?\\s*' + FA_P,
                           'Toplam\\s*KDV\\s*:?\\s*' + FA_P,
                           'KDV\\s*Tutar[ıi]\\s*:?\\s*' + FA_P]),
    matrah:   faIlk(t, ['Mal\\s*Hizmet\\s*Toplam\\s*Tutar[ıi]\\s*:?\\s*' + FA_P,
                        'Ara\\s*Toplam\\s*:?\\s*' + FA_P,
                        'Toplam\\s*Tutar\\s*:?\\s*' + FA_P]),
    /* ⚠ ARİTMETİK KONTROL İÇİN AYRI, YEDEKSİZ İKİ ALAN. Yukarıdaki
       `matrah` ve `tutar` yedekli okunuyor ve o yedekler kontrolü
       bozar: BİM'de "Toplam Tutar" KDV DAHİL toplamı veriyor
       (1.407,00), matrah sanılırsa denklem hep sapardı. AKSA'da da
       "Ödenecek Tutar" ile "Vergiler Dahil Toplam Tutar" arasında
       0,04 "Yuvarlama Tutarı" var. Kontrol YALNIZ bu iki net
       etiketten okunur; biri yoksa kontrol YAPILMAZ. */
    matrahNet: faIlk(t, ['Mal\\s*Hizmet\\s*Toplam\\s*Tutar[ıi]\\s*:?\\s*' + FA_P]),

/* ==================================================================
   ⚠ CT · FATURA METNİNDEN TAM UNVAN
   ÖLÇÜLDÜ (25 gerçek fatura · 11 ayrı firma): dosya adındaki firma
   KIRPIK ve bozuk ("BİM BİRLEŞİK MA", "ŞERİF BAŞARAN K") — tedarikçi
   adı olarak kullanılamaz. Tam unvan metinden okunuyor.
   ⚠ BU YORUM BİR KEZ YANLIŞ BİLGİ TAŞIDI, DÜZELTİLDİ: eskiden
     "Turkcell, DELTA ve Sütaş'ın satıcı adı sayfa metninde HİÇ yok"
     yazıyordu. DELTA için bu DOĞRU DEĞİL — ham metinde duruyor:
     "Son Ödeme Tarihi 14-08-2026 DELTA DAY.TÜK.MALL.TİC.LTD.ŞTİ. GÜL…"
     Göremeyen desendi: eki aramadan önce BOŞLUK şart koşuyordu
     (\s+), DELTA'da ise ek noktayla yapışık ("...MALL.TİC.LTD.ŞTİ.").
     FU_KELIME nokta içerdiği için tüm dizgiyi yutuyor, geri izlese de
     ayırıcı olarak \s bulamıyordu. Ayırıcı [\s.]+ oldu.
     Turkcell için doğru: 113 metin parçasında unvan yok, logoda.
     Sütaş için de doğru ama sorun değil — zaten kayıtlı, yalnız VKN'si
     boş ve "VKN'yi yaz" düğmesi onu çözüyor.
   ⚠ DOSYA ADI ÇIPA, AD DEĞİL: metindeki hangi adayın satıcı olduğunu
     söyleyen en güvenilir işaret o. Çıpasız denendi ve Sütaş
     faturasında ödeme bloğundaki "YAPI VE KREDİ BANKASI A.Ş."
     satıcı diye seçiliyordu — sessizce YANLIŞ firma.
   ⚠ Aday penceresi 10 kelime: 6 kelimeyle uzun ticari unvanlar
     baştan kırpılıyordu ("...SANAYİ GIDA VE TEMİZLİK ... ŞİRKETİ"). */
const FU_EK = '(?:A\\.?\\s?Ş\\.?|LTD\\.?\\s?ŞTİ\\.?|LİMİTED\\s+ŞİRKETİ|ANONİM\\s+ŞİRKETİ)';
const FU_KELIME = '[A-ZÇĞİÖŞÜa-zçğıöşü0-9][A-ZÇĞİÖŞÜa-zçğıöşü0-9.&/-]*';
/* ⚠ AYIRICI [\s.]+ — sadece \s DEĞİL: unvan eki noktayla yapışık
   gelebiliyor ("...MALL.TİC.LTD.ŞTİ."), o zaman desen eki hiç görmüyordu. */
const FU_DESEN = new RegExp('((?:' + FU_KELIME + '[\\s.]+){1,10}' + FU_EK + ')', 'g');
const FU_ELE = /BANKA|IBAN|ŞUBES[İI]\b/i;
const FU_SADE = { 'Ç':'C','Ğ':'G','İ':'I','I':'I','Ö':'O','Ş':'S','Ü':'U',
                  'ç':'C','ğ':'G','ı':'I','i':'I','ö':'O','ş':'S','ü':'U' };
/* ⚠ toLocaleUpperCase TEK BAŞINA YETMEZ: "İ" ile "I" ayrı kalır ve
   "İLKADIM" ile "ILKADIM" eşleşmez. Karşılaştırma hep bu anahtarla. */
function fuAnahtar(s){
  return String(s || '').replace(/[ÇĞİIÖŞÜçğıiöşü]/g, c => FU_SADE[c])
    .toUpperCase().replace(/[^A-Z0-9]/g, '');
}
function faturaUnvan(metin, kirpik){
  const t = String(metin || '').replace(/\s+/g, ' ');
  const cipa = fuAnahtar(kirpik).slice(0, 8);
  if (cipa.length < 5) return null;
  const adaylar = []; let m; FU_DESEN.lastIndex = 0;
  while ((m = FU_DESEN.exec(t))){
    const ad = m[1].trim();
    if (FU_ELE.test(ad) || ad.length < 8) continue;
    const i = fuAnahtar(ad).indexOf(cipa);
    if (i < 0) continue;
    let sayac = 0, bas = 0;
    for (let j = 0; j < ad.length; j++){
      if (sayac === i){ bas = j; break; }
      if (fuAnahtar(ad[j]).length) sayac++;
    }
    const kes = ad.slice(bas).replace(/^[^A-ZÇĞİÖŞÜa-zçğıöşü0-9]+/, '').trim();
    if (kes.length >= 8) adaylar.push(kes);
  }
  if (!adaylar.length) return null;
  /* Birden çok aday varsa EN UZUN: kırpılmamış tam unvan odur. */
  return adaylar.sort((a, b) => b.length - a.length)[0].replace(/\s{2,}/g, ' ');
}
/* ⚠ CT · TEDARİKÇİ EŞLEŞTİRME · ÖNCE VKN
   Dönen durum, ekranın ne yapacağını belirler:
     'vkn'      VKN tutuyor       -> mevcuda bağlan, YENİ AÇMA
     'vknsiz'   ad tutuyor, kayıtlı tedarikçinin VKN'si BOŞ
                -> kopya açma, mevcuda VKN yazmayı öner
     'catisma'  ad tutuyor ama VKN FARKLI -> OLUŞTURMA, kullanıcıya sor
                (iki ayrı firma olabilir)
     'yok'      hiçbiri -> oluşturulabilir */
function tedEslestir(vkn, ad){
  const v = String(vkn || '').trim();
  const a = fuAnahtar(ad);
  if (v){
    const t = KATALOG.tedarikciler.find(x => String(x.vergi_no || '').trim() === v);
    if (t) return { ted: t, durum: 'vkn' };
  }
  if (a.length >= 6){
    const adli = KATALOG.tedarikciler.find(x => {
      const k = fuAnahtar(x.ad);
      return k && (k.startsWith(a.slice(0, 8)) || a.startsWith(k.slice(0, 8)));
    });
    if (adli){
      const tv = String(adli.vergi_no || '').trim();
      if (!tv)          return { ted: adli, durum: 'vknsiz' };
      if (v && tv !== v) return { ted: adli, durum: 'catisma' };
      return { ted: adli, durum: 'vkn' };
    }
  }
  return { ted: null, durum: 'yok' };
}

/* "07-08-2026" / "11.08.2026" -> "2026-08-11"; okunamazsa null */
function faTarihISO(s){
  const m = String(s || '').match(/^(\d{2})[-./](\d{2})[-./](\d{4})$/);
  return m ? m[3] + '-' + m[2] + '-' + m[1] : null;
}

/* ==================================================================

let TOPLU = [];
const tpBul = (i) => TOPLU[i];
/* ==================================================================
   CY · KDV ARITMETIK KAPISI — GUVENMEDIGIN RAKAMI VERME
   ==================================================================
   OLCULDU (gercek zip, kullanicinin ekrani):
     Bizim Toptan OAF2026486011131 · 2.980,00 · "KDV" 2.950,50 -> %99
     Bizim Toptan OAF2026486011122 · 2.217,24 · "KDV"   714,16 -> %32
   Ayni zipteki otekiler dogru (Senpilic/Serif Basaran/Sutas %1). Yani

   nerede yanildigi DEGIL — o ayri is. Sorun yanlis rakamin SESSIZCE

   KDV indirimi -> BEYAN'a gidiyor. 2.980 liralik faturada 2.950 TL
   KDV indirimi gercek bir vergi riskidir.
   ⚠ TEK KURAL: IMKANSIZ OLANI DUSUR. "Oran yasal oranlardan birine
     yakin degilse supheli say" diye ikinci bir kural denendi ve
     KALDIRILDI — dogru veriye ates ediyordu:
       Bizim Toptan OAF...122 · 2.217,24 · KDV 124,76 (%5,6)
       %10 matrah 714,16 -> 71,42 · %1 matrah 1.170,10 -> 11,70
       %20 matrah 208,22 -> 41,64 · toplam 124,76 ✓
     Karisik oranli faturada ortalama oran %0 ile %16,67 ARASINDA
     HERHANGI BIR DEGER olabilir (muaf kalem varsa %0,99'un da
     altina iner). Yani o araliktaki hicbir deger supheli degil —
     kural dogruyu yanlistan AYIRAMIYORDU. Yakalamasi beklenen
     hatayi da yakalamiyordu: tek oranin kdv'si (11,70) alinsaydi
     oran %0,53 cikardi, yine aralikta, yine uyari yok.
     Bir kural neyi ayirdigini soyleyemiyorsa gurultudur. */
function kdvDenetle(tutar, kdv){
  if (kdv == null || tutar == null || !(tutar > 0)) return { durum:'yok' };
  const p = kdv / tutar;
  /* KDV DAHIL tutarda hicbir oran 1/6'yi (%20) gecemez. */
  if (kdv < 0 || kdv >= tutar || p > 0.20)
    return { durum:'imkansiz', yuzde: p * 100 };
  return { durum:'temiz', yuzde: p * 100 };
}
const yuzdeYaz = (y) => (Math.round(y * 10) / 10).toString().replace('.', ',');
/* Satirin kdv/kdvDurum/kdvNot alanlarini bastan kurar. Hem tpKur hem
   de kullanicinin elle yazdigi deger buradan gecer — tek yol. */
function kdvUygula(r, kdvDeger){
  const d = kdvDenetle(r.tutar, kdvDeger);
  if (d.durum === 'imkansiz'){
    /* ⚠ SESSIZCE DUSURULMEZ: ne dusuruldugu ve NEDEN satirda yazar. */
    r.kdv = null; r.kdvDurum = 'dusuruldu';
    r.kdvNot = 'KDV okunamadı (faturada %' + yuzdeYaz(d.yuzde)
      + ' gibi göründü, imkânsız) — kaydedilirse KDV BOŞ gider, sonra düzeltirsin';
    r.kdvHam = kdvDeger;
  } else {
    r.kdv = kdvDeger == null ? null : kdvDeger;
    r.kdvDurum = d.durum === 'temiz' ? 'temiz' : 'yok';
    r.kdvNot = null;
  }
  kdvAritmetik(r);
}
/* ⚠ DA · ARİTMETİK KONTROL — DAR AMA GERÇEK.
   matrah + KDV = fatura toplamı. ÜÇÜ DE net etiketten okunabiliyorsa
   yapılır; biri okunamıyorsa HİÇ UYARILMAZ. Ölçülemeyen şeyi ölçüyormuş
   gibi yapmak, kaldırdığımız sarı "şüpheli" uyarısının sebebiydi.
   ⚠ KDV SİLİNMEZ, yalnız söylenir: kullanıcı tabloda düzeltebilir ve
     tutmayan satır YİNE DE kaydedilebilir — engel değil, uyarı. */
function kdvAritmetik(r){
  if (r.kdvDurum === 'dusuruldu' || r.kdvDurum === 'gecersiz') return;
  const m = faKurus(r.kaynak && r.kaynak.matrahNet);
  const g = faKurus(r.kaynak && r.kaynak.tutarNet);
  if (m == null || g == null || r.kdv == null){ r.kdvKontrol = 'yapilamadi'; return; }
  const k = Math.round(r.kdv * 100);
  const fark = Math.abs(m + k - g);
  if (fark <= 1){ r.kdvKontrol = 'tam'; return; }   // 1 kuruş pay
  r.kdvKontrol = 'sapti';
  r.kdvNot = 'KDV faturayla tutmuyor (matrah + KDV = ' + tl((m + k)/100)
    + ', faturada ' + tl(g/100) + ') — kontrol et';
}
/* Tabloda elle yazilan KDV. ⚠ FORMA GITMEDEN duzeltilsin: 25 satirlik
   tabloda tek satir icin forma gidip donmek kullaniciyi cileden
   cikariyordu (kullanicinin kendi sozu). */
function tpKdvYaz(i, ham){
  const r = tpBul(i); if (!r) return;
  if (r.sonuc && !tpKilitli(r)) r.sonuc = null;
  const t = String(ham || '').trim();
  if (!t){ r.kdv = null; r.kdvDurum = 'yok'; r.kdvNot = null; r.kdvHam = null; }
  else {
    const p = paraCoz(t);
    if (!p.ok){ r.kdvDurum = 'gecersiz'; r.kdvNot = 'KDV: ' + p.hata; }
    else kdvUygula(r, p.deger);
  }
  tpCiz();
}
function tpKur(eksikler){
  TOPLU = eksikler.map((x, i) => {
    /* ⚠ CT · Unvan METİNDEN, çıpası dosya adı. Eşleştirme ÖNCE VKN. */
    const unvan = faturaUnvan(x.metin, x.firma);
    const e = tedEslestir(x.vkn, unvan || x.firma);
    const ted = e.durum === 'catisma' ? null : e.ted;
    const isoT = faTarihISO(x.tarih);
    const p = x.tutar ? paraCoz(x.tutar) : { ok:false };
    const eksik = [];
    /* ⚠ ADIM 14 B · CIPLAK ALAN ADI: hukum sozlukten geliyor. */
    if (!isoT) eksik.push('Tarih');
    if (!p.ok || !p.deger) eksik.push('Tutar');
    if (!x.belge_no) eksik.push('Belge no');
    const satir = { i, kaynak:x, belge_no:x.belge_no, firma:x.firma || x.ad,
      unvan, esles:e.durum, tarih:isoT || '', tutar:p.ok ? p.deger : null,
      kdv:null, kdvDurum:'yok', kdvNot:null, kdvHam:null, kdvKontrol:'yapilamadi',
      ted, tur:'', kategori:'', haric:false, sec:false, eksik,
      oneri: TP_GECMIS[(x.vkn || '') + '|' + (x.firma || '')] || null, sonuc:null };
    /* ⚠ CY · OKUNAN KDV DOGRUDAN YAZILMAZ, KAPIDAN GECER. */
    kdvUygula(satir, x.kdv ? (paraCoz(x.kdv).deger || null) : null);
    /* ⚠ ADIM 14 · KDV OKUNAMADI ISARETI. OLCULDU: KDV eksik satir
       hicbir sey demeden kaydedilebiliyordu; tarih/tutar/belge no
       eksikse satir kilitleniyor ama KDV bos gecip gidiyordu.
       ⚠ eksik[]'e KONMAZ — ADIM 06'nin karari: SOYLER, DURDURMAZ.
         Bir faturada gercekten KDV olmayabilir (istisna, tevkifat). */
    satir.kdvOkunamadi = !x.kdv && satir.kdv == null;
    return satir;
  });
}
let TP_GECMIS = {};
async function tpGecmisYukle(){
  /* Aynı firmadan daha önce ne girilmiş — ÖNERİ için, işaret için değil. */
  TP_GECMIS = {};
  const vknler = [...new Set(TOPLU.map(r => r.kaynak.vkn).filter(Boolean))];
  const tedIds = [...new Set(TOPLU.map(r => r.ted && r.ted.id).filter(Boolean))];
  if (tedIds.length){
    const { data } = await sb.from('alis').select('tedarikci_id').eq('is_deleted', false)
      .in('tedarikci_id', tedIds).limit(200);
    (data || []).forEach(a => {
      TOPLU.filter(r => r.ted && r.ted.id === a.tedarikci_id).forEach(r => {
        TP_GECMIS[(r.kaynak.vkn||'') + '|' + (r.kaynak.firma||'')] = 'alis'; });
    });
  }
  TOPLU.forEach(r => { r.oneri = TP_GECMIS[(r.kaynak.vkn||'') + '|' + (r.kaynak.firma||'')] || r.oneri; });
  void vknler;
}
function tpDegis(i, alan, deger){
  const r = tpBul(i); if (!r) return;
  /* ⚠ CU · HATA MESAJI SATIRI KİLİTLEMESİN. tpKaydedilebilir "!r.sonuc"
     istiyor; hata metni satırda kalınca kullanıcı düzeltse bile satırı
     bir daha SEÇEMİYORDU (ölçüldü: 21 satırdan 20'si kaydedildi, hata
     alan biri hep dışarıda kaldı). Satıra dokunmak "düzelttim" demektir:
     hata metni o an düşer, satır yeniden seçilebilir olur. */
  if (r.sonuc && !tpKilitli(r)) r.sonuc = null;
  if (alan === 'sec') r.sec = !!deger;
  else if (alan === 'haric'){ r.haric = !!deger; if (r.haric) r.sec = false; }
  else if (alan === 'tur'){ r.tur = deger; if (deger !== 'gider') r.kategori = ''; if (!deger) r.sec = false; }
  else r[alan] = deger;
  tpCiz();
}
function tpHepsi(alan, deger){
  TOPLU.forEach(r => { if (r.haric || r.eksik.length) return;
    if (alan === 'tur' && deger === 'alis' && !r.ted) return;     // tedarikçisiz alış olmaz
    /* ⚠ CU · toplu dokunuş da hata kilidini açar (tpDegis ile aynı gerekçe) */
    if (r.sonuc && !tpKilitli(r)) r.sonuc = null;
    if (alan === 'sec') r.sec = deger && !!r.tur;
    else { r[alan] = deger; if (alan === 'tur' && deger !== 'gider') r.kategori = ''; }
  });
  tpCiz();
}
/* ⚠ CT · EKSİK TEDARİKÇİYİ FATURADAN OLUŞTUR
   Sahip 25 faturanın 17'sinde "önce tedarikçi ekle" duvarına çarpıyordu;
   oysa fatura hem unvanı hem VKN'yi taşıyor.
   ⚠ ÖNCE GÖSTER, SONRA OLUŞTUR: ne açılacağı tek tek listelenir ve onay
     alınır. Sessizce yedi kayıt açmak, sonradan temizlenmesi gereken
     bir defter bırakır.
   ⚠ UNVANI OKUNAMAYAN SATIRDA OLUŞTURULMAZ: yarım bir unvanla açılan
     tedarikçi, düzeltilmesi gereken bir kayıttır.
   ⚠ BAŞARISIZ OLURSA SATIR AÇILMAZ: yarısı açılmış bir tablo, hiç
     açılmamıştan kötü. ted YALNIZ sunucu onay verirse bağlanır. */
/* Kaydedilmiş / işletme dışı satır kilitlidir; hata alan satır DEĞİL —
   kullanıcı onu düzeltip tekrar deneyecek. */
function tpKilitli(r){ return r.sonuc === 'ok' || r.sonuc === 'işletme dışı'; }
function tpAcilacaklar(){
  const gorulen = new Set();
  return TOPLU.filter(r => {
    if (r.ted || tpKilitli(r) || r.haric) return false;
    if (r.esles === 'catisma') return false;          // karar kullanıcının
    if (!r.unvan) return false;                       // unvan okunamadı
    const k = r.kaynak.vkn || fuAnahtar(r.unvan);
    if (gorulen.has(k)) return false;                 // aynı firma bir kez
    gorulen.add(k); return true;
  });
}
async function tpTedarikciAc(hangi){
  const liste = hangi === 'hepsi' ? tpAcilacaklar()
              : tpAcilacaklar().filter(r => r.i === hangi);
  if (!liste.length) return;
  const metin = liste.map(r => '· ' + r.unvan
    + (r.kaynak.vkn ? ' (VKN ' + r.kaynak.vkn + ')' : ' (VKN okunamadı)')).join('\n');
  if (!confirm('Şu tedarikçiler oluşturulacak:\n\n' + metin
      + '\n\nUnvan faturanın METNİNDEN okundu. Devam edilsin mi?')) return;
  const btn = document.getElementById('tpTedBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'Oluşturuluyor...'; }
  let ok = 0; const hatalar = [];
  for (const r of liste){
    try{
      const { error } = await sb.rpc('rpc_tedarikci_kaydet', {
        p_id: null, p_ad: r.unvan, p_unvan: r.unvan,
        p_vergi_no: r.kaynak.vkn || null, p_vergi_dairesi: null,
        p_yetkili: null, p_tel: null, p_tel2: null, p_email: null, p_adres: null });
      if (error) throw new Error(error.message);
      ok++;
    }catch(e){ hatalar.push(r.unvan + ': ' + hataTr(e.message)); }
  }
  await katalogYukle();
  /* ⚠ BAĞLAMA KATALOGDAN YENİDEN YAPILIR: sunucu neyi kabul ettiyse o
     bağlanır. Hata alan firma listede kalır, satırı Alış'a AÇILMAZ. */
  TOPLU.forEach(r => {
    if (r.ted || tpKilitli(r)) return;
    const e = tedEslestir(r.kaynak.vkn, r.unvan || r.firma);
    if (e.durum === 'vkn') r.ted = e.ted;
    r.esles = e.durum;
  });
  tpCiz();
  mesaj('tpMsg', hatalar.length ? 'hata' : 'ok',
    ok + ' tedarikçi oluşturuldu'
    + (hatalar.length ? ' · ' + hatalar.length + ' hata: ' + hatalar.slice(0,2).join(' | ')
       + ' — bu satırlar Alış için açılmadı' : ''));
}
async function tpVknYaz(i){
  const r = tpBul(i); if (!r || !r.ted || !r.kaynak.vkn) return;
  if (!confirm('"' + r.ted.ad + '" kayıtlı ama VKN\'si boş.\n\nFaturadaki VKN '
      + r.kaynak.vkn + ' bu kayda yazılsın mı?\n\n(Yeni tedarikçi AÇILMAZ — kopya olmaz.)')) return;
  const { error } = await sb.rpc('rpc_tedarikci_kaydet', {
    p_id: r.ted.id, p_ad: r.ted.ad, p_unvan: r.ted.unvan || null,
    p_vergi_no: r.kaynak.vkn, p_vergi_dairesi: r.ted.vergi_dairesi || null,
    p_yetkili: r.ted.yetkili_ad || null, p_tel: r.ted.telefon || null,
    p_tel2: r.ted.telefon2 || null, p_email: r.ted.email || null, p_adres: r.ted.adres || null });
  if (error){ mesaj('tpMsg','hata', hataTr(error.message)); return; }
  await katalogYukle();
  TOPLU.forEach(x => { if (x.sonuc) return;
    const e = tedEslestir(x.kaynak.vkn, x.unvan || x.firma);
    if (e.durum === 'vkn') x.ted = e.ted; x.esles = e.durum; });
  tpCiz();
  mesaj('tpMsg','ok', r.ted.ad + ' kaydına VKN yazıldı — yeni tedarikçi açılmadı.');
}
function tpKaydedilebilir(r){
  return !r.haric && !r.eksik.length && !!r.tur && !r.sonuc
      && (r.tur !== 'gider' || !!r.kategori) && (r.tur !== 'alis' || !!r.ted);
}

    </div>

    <label>Seçili giderlere kategori ver</label>
    <select onchange="tpHepsi('kategori',this.value);this.value=''">

    ${TOPLU.map(r => {
      const kapali = r.haric || r.eksik.length || !r.tur
                  || (r.tur === 'gider' && !r.kategori) || (r.tur === 'alis' && !r.ted);
      /* ⚠ SATIRI YALNIZ BAŞARI KİLİTLER. Önce "r.sonuc varsa disabled"
         deniyordu; hata metni de bir sonuç olduğu için HATA ALAN SATIR
         da kilitleniyordu — kullanıcı düzeltip tekrar deneyemiyordu
         (ölçüldü: kilitli satır 21 satırlık turda dışarıda kaldı).

      const kilit = tpKilitli(r);
      const sonucRz = r.sonuc === 'ok' ? '<span class="rozet rz-ok">kaydedildi</span>'

      return `<div class="liste-satir" style="flex-direction:column;align-items:stretch;gap:6px">

            ${r.sec ? 'checked' : ''} ${kapali || kilit ? 'disabled' : ''}

            ${r.kdvOkunamadi && !r.eksik.length

            ${r.oneri && !r.tur

            ${!r.ted && r.esles === 'catisma'

            ${!r.ted && r.esles !== 'catisma'

                 ? `<div class="k" style="color:var(--soluk)">tedarikçi listesinde yok —

            ${r.ted && r.esles === 'vknsiz' && r.kaynak.vkn

        <div style="display:flex;flex-wrap:wrap;gap:6px;align-items:center">

    <div class="bilgi-not" style="margin-top:10px">Kaydetme <b>tek tek</b> yapılır: bir satır hata
