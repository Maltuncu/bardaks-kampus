<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<!-- SÜRÜM: her yüklemede DEĞİŞTİR. Uygulama bunu sunucudakiyle karşılaştırıp
     eski sürümde kalan telefonu uyarır. İlk 3000 bayt içinde kalmalı. -->

<style>
:root{--ana:#2456A0;--ana-koyu:#183F78;--acik:#EBF0FA;--gri:#FAF4E3;--kart:#FFFEF8;--metin:#1F3354;--soluk:#8189A0;--hata:#B3402F;--uyari:#C77B2B;--ok:#2E7D4F;--cizgi:#E7DEC8}
/* ===== Gün Sonu — iki kasa (Mission Control) ===== */
.kasa-grid{display:grid;grid-template-columns:1fr 1px 1fr;margin:12px 0}
.kasa-panel{min-width:0}
.kasa-panel.sol{padding-right:18px}
.kasa-panel.sag{padding-left:18px}
.kasa-ayirici{background:var(--cizgi);width:1px}
.kp-bas{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ana);padding-bottom:6px;margin-bottom:10px}
.kp-ad{font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--ana)}
.kp-drm{font-size:11px;font-weight:700;text-align:right}
.kp-drm.bos{color:var(--soluk)}.kp-drm.eksik{color:var(--uyari)}.kp-drm.tam{color:var(--ok)}
.kp-ara{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi);padding:8px 0;margin:12px 0}
.kp-ara span{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--soluk)}
.kp-ara b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kasa-sekme{display:none;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.ks-btn{border:1px solid var(--cizgi);background:var(--kart);padding:9px 6px;font-family:inherit;color:var(--metin);cursor:pointer;text-align:center}
.ks-btn.aktif{border-bottom:3px solid var(--ana);background:var(--acik)}
.ks-btn .ks-ad{font-size:12px;font-weight:800;letter-spacing:.5px}
.ks-btn .ks-tut{font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}
.gs-bant{border-top:2px solid var(--ana);margin-top:14px;padding-top:10px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.gs-bant .kalem{flex:1;min-width:105px}
.gs-et{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--soluk);text-transform:uppercase}
.gs-bant .dg{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.gs-bant .buyuk .dg{font-size:26px;font-weight:800;color:var(--ana)}
.gs-zdisi{border-top:1px solid var(--cizgi);margin-top:10px;padding-top:8px}
.gs-eksik{font-size:12px;margin-top:10px;line-height:1.7;color:var(--uyari)}
@media(max-width:760px){
  .kasa-grid{grid-template-columns:1fr}
  .kasa-ayirici{display:none}
  .kasa-panel{display:none;padding:0}
  .kasa-panel.aktif{display:block}
  .kasa-sekme{display:grid}
}
/* ===== Z raporu okuma durumu ===== */
.oku-durum{font-size:11.5px;line-height:1.55;margin:6px 0 2px;color:var(--soluk)}
.oku-durum.ok{color:var(--ok)}
.oku-durum.uyari{color:var(--uyari)}
.oku-dolu{background:#F2F8F4!important;border-color:var(--ok)!important}
/* ===== Fatura ürün satırları ===== */
.fs-satir{border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.fs-bas{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.fs-ad{font-size:13.5px;font-weight:800;line-height:1.35}
.fs-rozet{flex:none;font-size:10px;font-weight:900;letter-spacing:.4px;padding:3px 7px;border-radius:6px}
.fs-rozet.tam{background:#E8F5EC;color:var(--ok)}
.fs-rozet.yeni{background:#FFF4E0;color:var(--uyari)}
.fs-rozet.atla{background:#EFEFEF;color:var(--soluk)}
.fs-detay{font-size:11.5px;color:var(--soluk);line-height:1.5;margin:0 0 8px}
.fs-yeni{margin-top:8px;padding-top:8px;border-top:1px dashed var(--cizgi)}
/* ===== Sürüm uyarı çubuğu ===== */
#surumBar{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:12px 14px;background:var(--uyari);color:#fff;
  font-size:13px;font-weight:700;line-height:1.4;box-shadow:0 -3px 14px rgba(0,0,0,.18)}
#surumBar button{flex:none;background:#fff;color:var(--uyari);border:none;border-radius:8px;
  padding:9px 16px;font-size:13px;font-weight:900;cursor:pointer}
/* ===== Çoklu Z raporu (cihaz arızasında aynı kasa 2+ Z basar) ===== */
.z-blok + .z-blok{margin-top:16px;padding-top:16px;border-top:2px dashed var(--cizgi)}
.zb-bas{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 8px}
.zb-ad{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--ana)}
.zb-sil{background:none;border:none;padding:0;font-size:11px;font-weight:700;color:var(--hata);cursor:pointer}
.z-ekle{width:100%;margin-top:12px}
/* ===== Belge görüntüleyici ===== */
.bo-btn{display:inline-block;border:1px solid var(--cizgi);background:var(--kart);color:var(--ana);
  font:inherit;font-size:11px;font-weight:700;padding:5px 9px;margin:3px 4px 0 0;cursor:pointer;white-space:nowrap}
.bo-btn:active{background:var(--acik)}
.bo-btn.yok{color:var(--soluk);border-style:dashed;cursor:default}
#belgeOverlay{position:fixed;inset:0;background:rgba(20,25,40,.92);z-index:9999;display:none;
  flex-direction:column;align-items:center;justify-content:flex-start}
#belgeOverlay .bo-ust{width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;color:#fff;font-weight:700;font-size:13px;flex:none}
#belgeOverlay .bo-kapat{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;
  font:inherit;font-size:18px;line-height:1;padding:6px 12px;cursor:pointer}
#belgeOverlay .bo-govde{flex:1;width:100%;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:0 8px 16px}
#belgeOverlay img{max-width:100%;height:auto;background:#fff}
#belgeOverlay .bo-yukleniyor{color:#fff;padding:30px;font-size:13px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gri);color:var(--metin);font-size:15px;padding-bottom:70px}
.gizli{display:none!important}
/* GİRİŞ */
#girisEkran{max-width:380px;margin:7vh auto;padding:24px}
.logoDaire{width:180px;height:180px;border:2.5px solid var(--ana);border-radius:50%;margin:0 auto 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent}
.logoYazi{font-weight:900;font-size:34px;color:var(--ana);letter-spacing:-1px;line-height:1}
.logoAltCizgi{width:110px;height:2.5px;background:var(--ana);margin:7px 0 6px}
.logoScript{font-family:'Caveat',cursive;color:var(--ana);font-size:17px;font-weight:600}
#girisEkran .alt{text-align:center;color:var(--ana);opacity:.75;margin:10px 0 24px;font-size:12px;font-weight:800;letter-spacing:3px}
.susSvg{display:block;margin:18px auto 0;opacity:.85}
/* GENEL */
.kart{background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;padding:16px;margin-bottom:12px}
.kbaslik{font-weight:700;margin-bottom:10px;font-size:15px}
label{display:block;font-size:12.5px;color:var(--soluk);font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--cizgi);border-radius:9px;font-size:15px;background:#fff;color:var(--metin);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ana);border-color:var(--ana)}
button{cursor:pointer;font-size:15px;border:none;border-radius:9px;font-weight:800;font-family:inherit}
.btn{width:100%;padding:13px;background:var(--ana);color:#fff;margin-top:14px}
.btn:disabled{background:#9AAECE;cursor:wait}
.btn2{padding:8px 14px;background:var(--acik);color:var(--ana);font-size:13px}
.btn-kirmizi{padding:8px 14px;background:#fdeceb;color:var(--hata);font-size:13px}
.hata-msg{background:#fdeceb;color:var(--hata);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13.5px;display:none}
.ok-msg{background:#eafaf1;color:var(--ok);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13.5px;display:none}
.satir{display:flex;gap:8px}.satir>*{flex:1}
.rozet{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700}
.rz-uyari{background:#F8EEDD;color:var(--uyari)}.rz-ok{background:#E5F2E9;color:var(--ok)}.rz-hata{background:#F9E7E3;color:var(--hata)}.rz-gri{background:var(--acik);color:var(--ana)}
/* ÜST BAR */
#ustBar{background:var(--kart);color:var(--ana);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;border-bottom:1.5px solid var(--cizgi)}
#ustBar .ad{font-weight:900;font-size:18px;letter-spacing:-0.5px;line-height:1.1}
#ustBar .ad .kmp{font-family:'Caveat',cursive;font-weight:600;font-size:15px;letter-spacing:0;margin-left:4px}
#ustBar .kim{font-size:11.5px;color:var(--soluk);font-weight:600}
#cikisBtn{background:var(--acik);color:var(--ana);padding:7px 12px;font-size:12.5px}
/* SEKMELER */
#sekmeBar{position:fixed;bottom:0;left:0;right:0;background:var(--kart);border-top:1.5px solid var(--cizgi);display:flex;z-index:50;overflow-x:auto}
#sekmeBar button{flex:1;min-width:62px;padding:8px 2px 7px;background:none;color:var(--soluk);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;border-top:2.5px solid transparent;position:relative}
.tbadge{position:absolute;top:3px;right:8px;background:var(--hata);color:#fff;border-radius:10px;font-size:9.5px;padding:1px 5px;font-weight:800;line-height:1.4}
#sekmeBar button.aktif{color:var(--ana);border-top-color:var(--ana)}
#sekmeBar .iko{width:21px;height:21px}
#sekmeBar .iko svg{width:100%;height:100%}
main{padding:14px;max-width:640px;margin:0 auto}
/* LİSTE */
.liste-satir{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #F2ECD9;font-size:14px;gap:8px}
.liste-satir:last-child{border-bottom:none}
.l-sol .b{font-weight:700}.l-sol .k{font-size:12px;color:var(--soluk)}
.l-sag{text-align:right;font-weight:800;white-space:nowrap}
.ozet-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.ozet-kut{background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;padding:14px}
.ozet-kut .e{font-size:11px;color:var(--soluk);font-weight:800;letter-spacing:.5px}
.ozet-kut .d{font-size:19px;font-weight:900;margin-top:3px;color:var(--ana)}
.kdv-satir{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.kdv-satir select{width:82px;flex:none}
.kdv-satir .sil{background:#fdeceb;color:var(--hata);padding:9px 11px;flex:none}
.kalem-satir{display:flex;gap:6px;margin-bottom:6px;align-items:center}
.kalem-satir .sil{background:#fdeceb;color:var(--hata);padding:9px 11px;flex:none}
.bilgi-not{font-size:12.5px;color:var(--soluk);background:var(--acik);padding:8px 10px;border-radius:8px;margin-top:8px}
h2.bolum{font-size:17px;font-weight:900;margin:4px 0 12px;color:var(--ana-koyu)}
.foto-onizle{max-width:80px;max-height:80px;border-radius:8px;border:1px solid var(--cizgi);margin-top:6px}
</style>
</head>
<body>

<!-- ================= GİRİŞ ================= -->
<div id="girisEkran">
  <div class="logoDaire">
    <div class="logoYazi">bardak's</div>
    <div class="logoAltCizgi"></div>
    <div class="logoScript">"iz bırakan tatlar"</div>
  </div>
  <div class="alt">KAMPÜS PANELİ</div>
  <div class="kart">
    <label>E-posta</label>
    <input type="email" id="girisEmail" autocomplete="username" inputmode="email">
    <label>Şifre</label>
    <input type="password" id="girisSifre" autocomplete="current-password">
    <button class="btn" id="girisBtn" onclick="girisYap()">Giriş Yap</button>
    <div class="hata-msg" id="girisHata"></div>
    <div style="text-align:center;margin-top:14px">
      <a href="#" onclick="sifremiUnuttum();return false" style="color:var(--ana);font-size:13px;font-weight:700">Şifremi unuttum</a>
    </div>
    <div class="bilgi-not" style="text-align:center">Bir kez giriş yapınca cihaz sizi hatırlar — her seferinde şifre gerekmez.</div>
  </div>
  <svg class="susSvg" width="72" height="82" viewBox="0 0 72 82" fill="none" stroke="#2456A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 22l3-9c.2-.7 1-1.3 1.8-1.3l34.4-1.5c.9 0 1.7.6 1.9 1.4L58 22"/>
    <path d="M11 22h50v5H11z"/>
    <path d="M13 27l4.5 50c.1.9.9 1.7 1.8 1.7h33.4c.9 0 1.7-.8 1.8-1.7L59 27"/>
    <path d="M15 38h42M17.5 62h37"/>
    <g transform="rotate(-22 30 50)"><ellipse cx="30" cy="50" rx="3.6" ry="5.2"/><path d="M30 45.5c-1.2 1.5-1.2 7.5 0 9"/></g>
    <g transform="rotate(18 42 51)"><ellipse cx="42" cy="51" rx="3.6" ry="5.2"/><path d="M42 46.5c1.2 1.5 1.2 7.5 0 9"/></g>
  </svg>
</div>

<!-- ================= UYGULAMA ================= -->
<div id="uygulama" class="gizli">
  <div id="ustBar">
    <div><div class="ad">bardak's<span class="kmp">kampüs</span></div><div class="kim" id="kimBilgi"></div></div>
    <div style="display:flex;gap:6px">
      <button id="sifreBtn" onclick="sifreDegistir()" style="background:var(--acik);color:var(--ana);padding:7px 12px;font-size:12.5px">Şifre</button>
      <button id="cikisBtn" onclick="cikisYap()">Çıkış</button>
    </div>
  </div>
  <main id="icerik"></main>
  <nav id="sekmeBar"></nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>
/* ================== AYAR ================== */
const SB_URL = 'https://gbheqnxmwvabwuimzskv.supabase.co';
const SB_KEY = 'sb_publishable_qtiCjExLIte6WJcbdB5jNg_fUJDYnxF';
const sb = supabase.createClient(SB_URL, SB_KEY);

let PROFIL = null;   // {id, ad, rol, sube_id}
let KATALOG = { kategoriler: [], tedarikciler: [], urunler: [] };
let AKTIF_SEKME = null;

const bugun = () => new Date().toISOString().slice(0,10);
const tl = n => (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' TL';
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const idem = () => crypto.randomUUID();

/* ================== GİRİŞ / OTURUM ================== */
async function girisYap(){
  const btn = document.getElementById('girisBtn'), h = document.getElementById('girisHata');
  h.style.display='none'; btn.disabled=true; btn.textContent='Giriş yapılıyor...';
  const { error } = await sb.auth.signInWithPassword({
    email: document.getElementById('girisEmail').value.trim(),
    password: document.getElementById('girisSifre').value
  });
  btn.disabled=false; btn.textContent='Giriş Yap';
  if (error){ h.textContent = 'Giriş başarısız: e-posta veya şifre hatalı.'; h.style.display='block'; return; }
  await baslat();
}
async function cikisYap(){ await sb.auth.signOut(); location.reload(); }

async function sifreDegistir(){
  const y1 = prompt('Yeni şifre (en az 8 karakter):');
  if (y1 === null) return;
  if (y1.length < 8){ alert('Şifre en az 8 karakter olmalı.'); return; }
  const y2 = prompt('Yeni şifreyi TEKRAR yazın:');
  if (y2 === null) return;
  if (y1 !== y2){ alert('İki şifre aynı değil, değişiklik yapılmadı.'); return; }
  const { error } = await sb.auth.updateUser({ password: y1 });
  alert(error ? ('Şifre değiştirilemedi: ' + error.message) : 'Şifreniz değiştirildi ✓ Yeni girişlerde yeni şifreyi kullanın.');
}

async function sifremiUnuttum(){
  const email = document.getElementById('girisEmail').value.trim() || prompt('E-posta adresiniz:');
  if (!email) return;
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  alert(error ? ('Gönderilemedi: ' + error.message)
    : 'Şifre sıfırlama bağlantısı e-postanıza gönderildi. Maildeki linke tıklayın — uygulamaya dönünce yeni şifrenizi belirleyeceksiniz.');
}
// Sıfırlama mailindeki linkle dönüldüğünde yeni şifre iste
sb.auth.onAuthStateChange((event)=>{ if (event === 'PASSWORD_RECOVERY') setTimeout(sifreDegistir, 400); });

async function baslat(){
  surumKontrol();                                    // arka planda, açılışı bekletmez
  setInterval(surumKontrol, 30*60*1000);             // uzun açık kalan telefon için 30 dk'da bir
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ document.getElementById('girisEkran').classList.remove('gizli'); return; }
  const { data: p, error } = await sb.from('profil').select('*').eq('id', session.user.id).single();
  if (error || !p || !p.aktif){
    alert('Hesabınız sisteme tanımlı değil. Yöneticiyle görüşün.');
    await sb.auth.signOut(); location.reload(); return;
  }
  PROFIL = p;
  document.getElementById('girisEkran').classList.add('gizli');
  document.getElementById('uygulama').classList.remove('gizli');
  document.getElementById('kimBilgi').textContent = p.ad + ' · ' + (p.rol==='owner'?'Yönetici':'Personel');
  await katalogYukle();
  sekmeleriKur();
  sekmeAc(PROFIL.rol==='owner' ? 'ozet' : 'gunsonu');
}

async function katalogYukle(){
  const [k, t, u] = await Promise.all([
    sb.from('gider_kategori').select('id,ad').eq('aktif',true).eq('is_deleted',false).order('ad'),
    sb.from('tedarikci').select('id,ad,unvan,vergi_no,vergi_dairesi,yetkili_ad,telefon,telefon2,email,adres').eq('aktif',true).eq('is_deleted',false).order('ad'),
    sb.from('urun').select('id,ad,birim').eq('aktif',true).eq('is_deleted',false).order('ad')
  ]);
  KATALOG.kategoriler = k.data||[]; KATALOG.tedarikciler = t.data||[]; KATALOG.urunler = u.data||[];
}

/* ================== SEKMELER ================== */
const _svg = ic => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ic}</svg>`;
const IKON = {
  ozet:    _svg('<path d="M4 20V11M10 20V4M16 20v-6M21 20H3"/>'),

function mesaj(elId, tip, txt){
  const el = document.getElementById(elId); if(!el) return;
  el.className = tip==='ok' ? 'ok-msg' : 'hata-msg';
  el.textContent = txt; el.style.display='block';
  if (tip==='ok') setTimeout(()=>{ el.style.display='none'; }, 5000);
}
async function fotoKucult(file, max, kalite){
  // Telefon fotoğrafları 5-10MB olabiliyor: yüklemeden önce küçült.
  // Varsayılan (arşiv/yükleme): 1600px @ 0.82 — yer kazandırır.
  // Okuma için (fatura/Z): 2000px @ 0.92 — A4 faturada ince yazı ve
  // "paket içi 50 adet" gibi küçük açıklamalar okunabilir kalsın.
  max = max || 1600; kalite = kalite || 0.82;
  try{
    const img = await createImageBitmap(file);
    const oran = Math.min(1, max / Math.max(img.width, img.height));
    if (oran === 1 && file.size < 700*1024) return { veri:file, tip:null };
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*oran); c.height = Math.round(img.height*oran);
    const cx = c.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',kalite));
    return blob ? { veri:blob, tip:'jpg' } : { veri:file, tip:null };
  }catch(e){ return { veri:file, tip:null }; } // küçültülemezse orijinali yükle
}
async function fotoYukle(inputId, klasor){
  const inp = document.getElementById(inputId);
  if (!inp || !inp.files || !inp.files[0]) return null;
  const f = inp.files[0];
  const k = await fotoKucult(f);
  const uzanti = k.tip || (f.name.split('.').pop()||'jpg').toLowerCase();
  const yol = `${klasor}/${bugun()}_${crypto.randomUUID()}.${uzanti}`;
  const { error } = await sb.storage.from('belgeler').upload(yol, k.veri, { upsert:false, contentType: k.tip ? 'image/jpeg' : (f.type||undefined) });
  if (error) throw new Error('Fotoğraf yüklenemedi: ' + error.message);
  return yol;
}
async function rpcCagir(fn, params, btnId, msgId, basariTxt){
  const btn = document.getElementById(btnId);
  btn.disabled = true; const eski = btn.textContent; btn.textContent = 'Kaydediliyor...';
  try{
    // Aynı idem anahtarıyla otomatik 2 deneme: bağlantı koparsa (commit olmuş olabilir)
    // aynı anahtar _idem_kontrol'e takılır, mükerrer kayıt OLMAZ.
    let son;
    for (let deneme = 0; deneme < 2; deneme++){
      son = await sb.rpc(fn, params);
      if (!son.error) break;
      if (!/Failed to fetch|NetworkError|timeout/i.test(son.error.message)) break; // sadece ağ hatasında retry
      btn.textContent = 'Bağlantı koptu, tekrar deneniyor...';
      await new Promise(r=>setTimeout(r, 1200));
    }
    if (son.error){ window.__sonRpcHataHam = son.error.message; throw new Error(hataTr(son.error.message)); }
    mesaj(msgId, 'ok', basariTxt);
    return son.data;
  }catch(e){
    mesaj(msgId, 'hata', e.message + ' — Verileriniz formda duruyor, tekrar deneyin.');
    return null;
  }finally{
    btn.disabled = false; btn.textContent = eski;
  }
}
function hataTr(m){
  if (m.includes('GUN_ZATEN_GIRILMIS')) return 'Bu günün kaydı zaten girilmiş. Düzeltme gerekiyorsa talep açın.';
  if (m.includes('AY_KAPALI')) return 'Bu ay kapatılmış — geçmişe kayıt için yöneticiye başvurun.';
  if (m.includes('YETKI_YOK')) return 'Bu işlem için yetkiniz yok.';
  if (m.includes('SUBE_UYUSMUYOR')) return 'Şube uyuşmazlığı.';
  if (m.includes('NEDEN_ZORUNLU')) return 'Neden yazmak zorunlu.';
  if (m.includes('ux_alis_belge') || m.includes('duplicate key')) return 'Bu belge numarası bu firma için zaten girilmiş — mükerrer fatura engellendi.';
  if (m.includes('SADECE_KENDI')) return 'Sadece kendi girdiğiniz kaydı düzeltebilirsiniz.';
  if (m.includes('SURE_GECTI')) return 'Düzeltme süresi (12 saat) geçmiş — yöneticiye başvurun.';
  if (m.includes('KASA_ADET_HATASI')) return 'İki kasa da girilmelidir (tam olarak 2 kasa).';
  if (m.includes('KASA_NO_HATASI')) return 'Kasa numaraları 1 ve 2 olmalı ve tekrar etmemeli.';
  if (m.includes('KASA_TIP_HATASI')) return 'Kasa verisi biçimi hatalı — sayfayı yenileyip tekrar deneyin.';
  if (m.includes('KASA_Z_NO_ZORUNLU')) return 'Her kasa için Z No zorunludur.';
  if (m.includes('KASA_Z_FOTO_ZORUNLU')) return 'Her kasa için Z raporu fotoğrafı zorunludur.';
  if (m.includes('KASA_SLIP_FOTO_ZORUNLU')) return 'POS slip fotoğrafı zorunlu değil — sayfayı yenileyin.';
  if (m.includes('KASA_SIRA_TEKRAR'))       return 'Aynı kasada aynı Z sırası iki kez gönderildi.';
  if (m.includes('KASA_SIRA_HATASI'))       return 'Geçersiz Z sırası (1-9 arası olmalı).';
  if (m.includes('KASA_EKSIK'))             return 'Her iki kasadan da en az bir Z raporu girilmelidir.';
  if (m.includes('KASA_NEGATIF_TUTAR')) return 'Kasa tutarları negatif olamaz.';
  if (m.includes('TOPLAM_SIFIR')) return 'Toplam 0 olamaz — kart/nakit girin.';
  if (m.includes('KDV_TUTARSIZ')) return 'KDV dökümü günün cirosuyla tutarsız — "KÜM. TOPLAM" satırını girmiş olabilirsiniz.';
  if (m.includes('Failed to fetch')) return 'İnternet bağlantısı sorunu.';
  return m;
}

/* ===== SÜRÜM KONTROLÜ — telefon eski sürümde kalmasın =====
   GitHub Pages 10 dk önbellek veriyor; ana ekrana eklenmiş uygulamada
   çok daha uzun kalabiliyor. Personel eski kurallarla çalışmasın diye
   uygulama sunucudaki sürümü sorup fark varsa uyarır. */
const SURUM = (document.querySelector('meta[name="surum"]')?.content || '?');
async function surumKontrol(){
  try{
    // Yalnız dosyanın başını çek (sürüm etiketi ilk 3000 baytta)
    const y = await fetch(location.pathname + '?s=' + Date.now(), {
      cache: 'no-store', headers: { 'Range': 'bytes=0-3000' }
    });
    if (!y.ok && y.status !== 206) return;
    const t = await y.text();
    const m = t.match(/name="surum"\s+content="([^"]+)"/);
    if (m && m[1] !== SURUM) surumUyari(m[1]);
  }catch(e){ /* ağ yoksa sessiz kal — çalışmayı engelleme */ }
}
function surumUyari(yeni){
  if (document.getElementById('surumBar')) return;
  const d = document.createElement('div');
  d.id = 'surumBar';
  d.innerHTML = `<span>Yeni sürüm var (${esc(yeni)}). Eski sürümde yanlış kayıt yapabilirsin.</span>
    <button onclick="surumYenile()">YENİLE</button>`;
  document.body.appendChild(d);
}
function surumYenile(){
  // Sorgu ekleyerek önbelleği atla — ana ekrana eklenmiş uygulamada da çalışır
  location.replace(location.pathname + '?v=' + Date.now());
}

/* ================== GÜN SONU ==================
   Bir kasa aynı gün BİRDEN FAZLA Z basabilir (cihaz arızası).
   Her Z = kendi bloğu: kendi Z No'su, tutarı, KDV'si, fotoğrafı.
   Blok anahtarı: "kasa_sıra" → 1_1, 1_2, 2_1 ...                          */
let ZLISTE = { 1:[1], 2:[1] };                     // her kasada hangi Z sıraları açık
function zAnahtarlar(){ return [1,2].flatMap(n => ZLISTE[n].map(s => ({ n, s, k:n+'_'+s }))); }

let KDV_SAYAC = 0;
function kdvSatirEkle(k, oran, satis, kdv, sabit){
  KDV_SAYAC++;
  const n = KDV_SAYAC;
  const kap = document.getElementById('kdvSatirlari_'+k);
  if(!kap) return;
  const div = document.createElement('div');
  div.className='kdv-satir'; div.id='kdvS_'+n;
  const oranKutu = sabit
    ? `<span style="width:82px;flex:none;text-align:center;font-weight:800;color:var(--ana);padding:11px 0">%${oran||10}</span><input type="hidden" id="kdvO_${n}" value="${oran||10}">`
    : `<select id="kdvO_${n}"><option value="1"${oran==1?' selected':''}>%1</option><option value="10"${(oran==10||!oran)?' selected':''}>%10</option><option value="20"${oran==20?' selected':''}>%20</option></select>`;
  div.innerHTML = `
    ${oranKutu}
    <input type="text" inputmode="decimal" autocomplete="off" id="kdvT_${n}" placeholder="Z'deki %${oran||10} TOPLAM" value="${satis||''}">
    <input type="text" inputmode="decimal" autocomplete="off" id="kdvV_${n}" placeholder="KDV (sistem hesaplar)" value="${kdv||''}">
    ${sabit?'':`<button class="sil" onclick="document.getElementById('kdvS_${n}').remove(); kasaHesapla();">✕</button>`}`;
  kap.appendChild(div);
  // Oran toplam satış yazılınca KDV'yi sistem hesaplar (Z'deki TOPKDV farklıysa üzerine yazılabilir)
  // KDV kutusu bir kez ELLE düzeltildiyse sistem bir daha üzerine YAZMAZ.
  // (Z'deki TOPKDV birkaç kuruş farklı olabilir — beyana giden Z'dekidir.)
  const hesapla = () => {
    const vEl = document.getElementById('kdvV_'+n);
    if (vEl.dataset.elle === '1') return;              // kullanıcı yazdıysa dokunma
    const t = paraOku(document.getElementById('kdvT_'+n)).deger;
    const o = +document.getElementById('kdvO_'+n).value || 0;
    vEl.value = t > 0 ? (t - t/(1+o/100)).toFixed(2) : '';
  };
  const vEl0 = document.getElementById('kdvV_'+n);
  vEl0.addEventListener('input', ()=>{ vEl0.dataset.elle = vEl0.value.trim()==='' ? '' : '1'; });
  if (kdv) vEl0.dataset.elle = '1';                    // hazır değerle geldiyse elle sayılır
  paraBagla(document.getElementById('kdvT_'+n), ()=>{ hesapla(); kasaHesapla(); });
  paraBagla(vEl0, kasaHesapla);
  const oranEl = document.getElementById('kdvO_'+n);
  if (oranEl.tagName === 'SELECT') oranEl.addEventListener('change', hesapla);
}
function kdvOku(k){
  const sonuc = [];
  document.querySelectorAll('#kdvSatirlari_'+k+' .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const o = document.getElementById('kdvO_'+n).value;
    const tEl = document.getElementById('kdvT_'+n), vEl = document.getElementById('kdvV_'+n);
    const pt = paraOku(tEl), pv = paraOku(vEl);
    if (!pt.ok || !pv.ok) throw new Error('KDV satırında geçersiz tutar var — örnek: 15710 veya 15710,50');
    if (tEl.value.trim()!=='' || vEl.value.trim()!=='')
      sonuc.push({ oran:+o, satis_toplam:pt.deger, kdv_tutar:pv.deger });
  });
  return sonuc;
}

function belgeKapat(){

function belgeKutusu(){

    ov=document.createElement('div'); ov.id='belgeOverlay';
    ov.innerHTML=`<div class="bo-ust"><span id="boBaslik"></span><button class="bo-kapat" onclick="belgeKapat()">✕</button></div>

    ov.addEventListener('click', e=>{ if(e.target===ov || e.target.classList.contains('bo-govde')) belgeKapat(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') belgeKapat(); });
  }

async function belgeAc(yol, baslik){

  const ov=belgeKutusu();

/* ===== PARA GİRİŞ KATMANI — virgül/nokta güvenli, sessiz sıfır YOK ===== */
function paraTemizle(el){
  if(!el) return;
  const t = el.value;
  let s = t.replace(/[^\d.,]/g,'');              // eksi dahil geçersiz karakterleri at
  const i = s.search(/[.,]/);
  if (i > -1){                                    // tek ayraç + en fazla 2 ondalık
    const ayrac = s[i];
    const tam = s.slice(0, i);
    const ond = s.slice(i+1).replace(/[.,]/g,'').slice(0,2);
    s = tam + ayrac + ond;
  }
  if (s !== t) el.value = s;
}
function paraOku(el){
  if(!el) return { ok:true, deger:0 };
  const ham = (el.value||'').trim();
  if (ham === '') return { ok:true, deger:0 };    // boş = 0
  const s = ham.replace(',', '.');
  if (!/^\d+(\.\d{1,2})?$/.test(s)) return { ok:false, deger:0, hata:'geçersiz tutar' };
  const d = parseFloat(s);
  if (!isFinite(d) || d < 0) return { ok:false, deger:0, hata:'geçersiz tutar' };
  return { ok:true, deger:+d.toFixed(2) };
}
function paraBagla(el, sonra){
  if(!el) return;
  const f = () => { paraTemizle(el); if(sonra) sonra(); };
  el.addEventListener('input', f);
  el.addEventListener('blur', f);
}
/* ===== Z RAPORU OKUMA — sistem doldurur, PERSONEL DOĞRULAR ===== */
async function zRaporuOku(k){
  const inp = document.getElementById('gsZFoto_'+k);
  const drm = document.getElementById('gsOkuDurum_'+k);
  const btn = document.getElementById('gsOku_'+k);
  const yaz = (t, sinif) => { if(drm){ drm.className = 'oku-durum '+(sinif||''); drm.textContent = t; } };

  const dosyaVar = !!(inp && inp.files && inp.files[0]);
  const mevcutYol = (DUZENLE && DUZENLE.foto[k] && DUZENLE.foto[k].z) || null;
  if (!dosyaVar && !mevcutYol){ yaz('Önce Z raporu fotoğrafını seç.', 'uyari'); return; }

  btn.disabled = true; const eski = btn.textContent; btn.textContent = 'Okunuyor...';
  yaz('Fotoğraf okunuyor, birkaç saniye sürebilir...', '');
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('Oturum bulunamadı, tekrar giriş yapın.');

    let govde;
    if (dosyaVar){
      const k = await fotoKucult(inp.files[0], 2000, 0.92);   // okuma için net kopya
      const b64 = await new Promise((coz, red)=>{
        const fr = new FileReader();
        fr.onload = ()=>coz(fr.result); fr.onerror = ()=>red(new Error('Fotoğraf okunamadı'));
        fr.readAsDataURL(k.veri);
      });
      govde = { gorsel: b64 };
    } else {
      govde = { yol: mevcutYol };
    }

    const y = await fetch(SB_URL + '/functions/v1/z-raporu-oku', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+session.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify(govde)
    });
    const s = await y.json();
    if (!y.ok || !s.ok) throw new Error(s?.hata || ('Okuma başarısız ('+y.status+')'));

    const v = s.veri || {};
    const dolduruldu = [];
    const koy = (id, deger, etiket) => {
      if (deger === null || deger === undefined || deger === '') return;
      const e = document.getElementById(id); if(!e) return;
      e.value = String(deger).replace('.', ',');
      e.dispatchEvent(new Event('input', { bubbles:true }));
      e.classList.add('oku-dolu'); dolduruldu.push(etiket);
    };
    koy('gsZNo_'+k,   v.z_no,          'Z No');
    koy('gsKart_'+k,  v.kart_toplam,   'Kart');
    koy('gsNakit_'+k, v.nakit_toplam,  'Nakit');

    // KDV satırları: fişteki TOPKDV esas (sistem hesabı ezilmez)
    const kap = document.getElementById('kdvSatirlari_'+k);
    if (kap && Array.isArray(v.kdv) && v.kdv.length){
      kap.innerHTML = '';
      v.kdv.forEach(x => kdvSatirEkle(k, x.oran, x.satis_toplam, x.kdv_tutar, false));
      dolduruldu.push('KDV');
    }
    kasaHesapla();

    const eksik = Array.isArray(v.okunamayan) ? v.okunamayan.filter(Boolean) : [];
    let msj = 'Okundu → ' + (dolduruldu.join(' · ') || 'alan doldurulamadı') + '. ⚠️ Rakamları fişle KARŞILAŞTIR.';
    if (eksik.length) msj += ' Okunamayan: ' + eksik.join(', ');
    if (v.uyari) msj += ' (' + v.uyari + ')';
    yaz(msj, dolduruldu.length ? 'ok' : 'uyari');
  }catch(e){
    yaz('Okunamadı: ' + e.message + ' — alanları elle yaz.', 'uyari');
  }finally{
    btn.disabled = false; btn.textContent = eski;
  }
}

    <div class="bilgi-not" style="margin:0 0 8px">Kayıt <b>silinmiyor</b>, üzerine yazılıyor. Fotoğrafları değiştirmek istemiyorsan
      dokunma — mevcutlar korunur. Tarih değiştirilemez.</div>
    <button class="btn2" style="width:100%" onclick="duzenlemeIptal()">Vazgeç</button></div>`;
  const btn = document.getElementById('gsKaydet');

/* Aynı kasaya ikinci/üçüncü Z — cihaz arızasında gün kaydedilebilsin diye */
function zBlokEkle(n){
  if (ZLISTE[n].length >= 9){ alert('Bir kasaya en fazla 9 Z raporu girilebilir.'); return; }
  const s = Math.max(...ZLISTE[n]) + 1;
  const eski = {};
  ZLISTE[n].forEach(x=>{ eski[x] = zBlokTopla(n, x); });   // yeniden çizmeden ÖNCE yedekle
  const secilenFoto = {};
  ZLISTE[n].forEach(x=>{ const f=document.getElementById('gsZFoto_'+n+'_'+x); secilenFoto[x] = !!(f&&f.files&&f.files[0]); });
  ZLISTE[n].push(s);
  const kap = document.getElementById('gsZBloklar'+n);
  // ilk blok tek başınayken başlıksız duruyordu; artık çoklu → başlıklarla yeniden kur
  kap.innerHTML = ZLISTE[n].map(x=>zBlokHtml(n,x)).join('');
  ZLISTE[n].forEach(x=>{ zBlokKur(n, x); if (x !== s) zBlokDoldur(n, x, eski[x]); });
  // Dosya seçimi HTML yeniden çizilince kaybolur — kullanıcıya açıkça söyle
  const kaybolan = ZLISTE[n].filter(x=>x!==s && secilenFoto[x]);
  if (kaybolan.length) alert(`Kasa ${n}: Z fotoğrafı seçimi sıfırlandı (${kaybolan.map(x=>x+'. Z').join(', ')}).\nTutarlar korundu; fotoğrafı yeniden seç.`);
  kasaHesapla();
  document.getElementById('zBlok_'+n+'_'+s).scrollIntoView({behavior:'smooth', block:'center'});
}
function zBlokSil(n, s){
  if (s === 1) return;
  if (!confirm(`Kasa ${n} — ${s}. Z raporu kaldırılacak. Girdiğin bilgiler silinir. Devam?`)) return;
  const kalan = {};
  ZLISTE[n].filter(x=>x!==s).forEach(x=>{ kalan[x] = zBlokTopla(n, x); });  // silmeden ÖNCE yedekle
  ZLISTE[n] = ZLISTE[n].filter(x=>x!==s);
  const kap = document.getElementById('gsZBloklar'+n);
  kap.innerHTML = ZLISTE[n].map(x=>zBlokHtml(n,x)).join('');
  ZLISTE[n].forEach(x=>{ zBlokKur(n, x); zBlokDoldur(n, x, kalan[x]); });
  kasaHesapla();
}

  const zfVar=!!(zf&&zf.files&&zf.files[0]) || !!mev.z;

  return { k, n, s, zno, kart, nakit, ara:+(kart+nakit).toFixed(2), kdv:kdvToplam(k),
           eksik, bos, gecerli: pk.ok && pn.ok };

function kasaHesapla(){

    const drm=document.getElementById('kpDrm'+n), ks=document.getElementById('ksDrm'+n);

    if(d.bos){ sinif='bos'; metin='○ Başlanmadı'; sembol='○'; }
    else if(d.eksik.length===0){ sinif='tam'; metin='✓ Tamamlandı'+zEk; sembol='✓'; }
    else { sinif='eksik'; metin='● '+d.eksik.length+' eksik: '+d.eksik.join(', '); sembol='●'; }
    if(drm){ drm.className='kp-drm '+sinif; drm.textContent=metin; }
    if(ks) ks.textContent=sembol;
    d.eksik.forEach(e=>eksikler.push('KASA '+n+' — '+e));
  });
  // Aynı kasada aynı Z No iki kez girilmiş mi (arıza gününde kopyala-yapıştır hatası)
  [1,2].forEach(n=>{
    const nolar = ZLISTE[n].map(s=>(document.getElementById('gsZNo_'+n+'_'+s)?.value||'').trim()).filter(Boolean);
    if (new Set(nolar).size !== nolar.length) eksikler.push('KASA '+n+' — aynı Z No iki kez girilmiş');
  });
  const pz=paraOku(document.getElementById('gsKasa'));
  const zDisi=pz.deger;
  if(!pz.ok) eksikler.push('Z DIŞI KASA — tutar geçersiz');
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('gsTKart', tl(tk)); set('gsTNakit', tl(tn)); set('gsTGenel', tl(+(tk+tn).toFixed(2)));
  set('gsZDisi', tl(zDisi)); set('gsTKdv', tl(tkdv));
  const btn=document.getElementById('gsKaydet'), ek=document.getElementById('gsEksik');
  const hazir = eksikler.length===0 && (tk+tn)>0;
  if(btn){ btn.disabled=!hazir; btn.style.opacity=hazir?'1':'.5'; }
  if(ek){
    ek.style.color = hazir ? 'var(--ok)' : 'var(--uyari)';
    ek.innerHTML = hazir ? '✓ Gün sonu kaydedilebilir'
      : (eksikler.length ? 'Bekleyen: '+eksikler.map(esc).join(' · ') : 'Bekleyen: tutar girilmedi');
  }
}

async function fotoTemizle(yollar){
  const kalan = [];
  for (const y of yollar){
    if (!y) continue;
    try{ const { error } = await sb.storage.from('belgeler').remove([y]); if (error) kalan.push(y); }
    catch(e){ kalan.push(y); }
  }
  return kalan;
}
async function gunSonuKaydet(){
  const kasalar = [];
  for (const n of [1,2]){
    const d = kasaDurum(n);
    if (d.eksik.length){ kasaSec(n); mesaj('gsMsg','hata',`KASA ${n} eksik: ${d.eksik.join(', ')}`); return; }
    for (const b of d.bloklar){
      let kdvSatir;
      try { kdvSatir = kdvOku(b.k); }
      catch(e){ kasaSec(n); mesaj('gsMsg','hata',`KASA ${n} / ${b.s}. Z: `+e.message); return; }
      kasalar.push({ n, s:b.s, k:b.k, zno:b.zno, kart:b.kart, nakit:b.nakit, kdv:kdvSatir,
        knot:(document.getElementById('gsKNot_'+b.k)?.value||'').trim()||null });
    }
  }
  const kart = +(kasalar.reduce((a,k)=>a+k.kart,0)).toFixed(2);
  const nakit = +(kasalar.reduce((a,k)=>a+k.nakit,0)).toFixed(2);
  const toplam = +(kart + nakit).toFixed(2);
  // KDV artık KASA BAZLI: her kasanın kendi Z vergi dökümü
  const kdv = kasalar.flatMap(k=>k.kdv);
  const kdvToplamTutar = +(kdv.reduce((a,x)=>a+x.kdv_tutar,0)).toFixed(2);
  if (toplam === 0){ mesaj('gsMsg','hata','İki kasanın toplamı 0 — kayıt yapılamaz.'); return; }
  for (const k of kasalar){
    const et = `KASA ${k.n}${ZLISTE[k.n].length>1?' / '+k.s+'. Z':''}`;
    if (k.kdv.length === 0 && (k.kart + k.nakit) > 0 &&
        !confirm(`${et} için KDV dökümü BOŞ. O Z raporundaki VERGİ DÖKÜMÜ girilmedi — beyana giden KDV eksik kalır. Yine de kaydedilsin mi?`)) return;
  }
  // AKIL KONTROLLERİ (KÜM. TOPLAM tuzağı + KDV tutarlılığı)
  const kdvSatisToplami = kdv.reduce((a,x)=>a+x.satis_toplam,0);
  if (kdvSatisToplami > toplam*1.5 + 100){
    alert(`HATALI GİRİŞ OLABİLİR: KDV dökümündeki satış toplamı (${tl(kdvSatisToplami)}) günün cirosundan (${tl(toplam)}) çok büyük.\n\nZ kağıdındaki "KÜM. TOPLAM" satırını yazmış olabilirsiniz — o satır kasanın TÜM GEÇMİŞ toplamıdır, kullanılmaz.\n\n"%10 TOPLAM" gibi GÜNLÜK satırı girin.`);
    return;
  }
  for (const x of kdv){
    const beklenen = x.satis_toplam - x.satis_toplam/(1 + x.oran/100);
    if (x.satis_toplam > 0 && Math.abs(x.kdv_tutar - beklenen) > Math.max(5, beklenen*0.15) &&
        !confirm(`KDV kontrolü: %${x.oran} için ${tl(x.satis_toplam)} satışın KDV'si yaklaşık ${tl(beklenen)} olmalı, siz ${tl(x.kdv_tutar)} girdiniz.\nZ kağıdındaki TOPKDV satırıyla karşılaştırın. Yine de kaydedilsin mi?`)) return;
  }
  const pKasa = paraOku(document.getElementById('gsKasa'));
  if (!pKasa.ok){ mesaj('gsMsg','hata','Kasadaki Para alanı geçersiz — örnek: 4400 veya 4400,50'); return; }
  const kasa = pKasa.deger;
  if (kasa === 0 &&
      !confirm('Kasadaki Para girilmedi (kasa sayımı yapılmadı mı?). Boş kaydedilirse o günün gerçek nakit takibi eksik kalır. Yine de kaydedilsin mi?')) return;
  const ozet = kasalar.map(k=>{
    const kv = k.kdv.reduce((a,x)=>a+x.kdv_tutar,0);
    const et = `Kasa ${k.n}${ZLISTE[k.n].length>1?' ('+k.s+'. Z)':''}`;
    return `${et} — Z ${k.zno}: ${tl(k.kart+k.nakit)}   KDV ${tl(kv)}`;
  }).join('\n');
  if (!confirm(`GÜN SONU KAYDEDİLECEK\n\n${ozet}\n──────────────\nGenel Toplam: ${tl(toplam)}\nTOPLAM KDV (beyana giden): ${tl(kdvToplamTutar)}\n\nZ dışı kasa nakdi: ${tl(kasa)}\n(vergiye DAHİL DEĞİL — gerçek nakit takibi için)\n\nKayıttan sonra gün kilitlenir. Onaylıyor musun?`)) return;

  const btn = document.getElementById('gsKaydet');
  const eskiBtnMetin = DUZENLE ? 'Değişiklikleri Kaydet' : 'Gün Sonunu Kaydet';
  btn.disabled = true;
  const yuklenen = [];
  try{
    for (const k of kasalar){
      const mev = (DUZENLE && DUZENLE.foto[k.k]) || {};
      const yeniZ = document.getElementById('gsZFoto_'+k.k);
      const zSecili = !!(yeniZ && yeniZ.files && yeniZ.files[0]);
      if (zSecili) btn.textContent = `Kasa ${k.n} Z fotoğrafı yükleniyor...`;
      // Yeni seçildiyse yükle, seçilmediyse MEVCUDU koru
      k.zf = zSecili ? await fotoYukle('gsZFoto_'+k.k, 'z') : mev.z;
      if (zSecili) yuklenen.push(k.zf);
      k.sf = mev.s || null;             // POS slip artık toplanmıyor; eski kayıtta varsa korunur
    }
  }catch(e){
    const kalan = await fotoTemizle(yuklenen);
    if (kalan.length) console.warn('YETİM DOSYA (temizlenemedi):', kalan);
    mesaj('gsMsg','hata', e.message + (kalan.length ? ` — ${kalan.length} dosya temizlenemedi (yönetici bilgilendirilmeli)` : ' — yüklenenler temizlendi'));
    btn.disabled=false; btn.textContent='Gün Sonunu Kaydet'; return;
  }
  btn.textContent = eskiBtnMetin;
  window.__sonRpcHataHam = '';
  // DÜZENLEME: kaydı silmeden güncelle
  if (DUZENLE){
    const gData = await rpcCagir('rpc_gun_sonu_guncelle', {
      p_idem: idem(), p_id: DUZENLE.id,
      p_not: document.getElementById('gsNot').value.trim()||null,
      p_kasa: kasa > 0 ? kasa : null,
      p_kasalar: kasalar.map(k=>({ kasa_no:k.n, sira:k.s, z_no:k.zno, kart_toplam:k.kart, nakit_toplam:k.nakit,
        z_foto_path:k.zf, pos_slip_foto_path:k.sf, notlar:k.knot, kdv:k.kdv }))
    }, 'gsKaydet','gsMsg','Değişiklikler kaydedildi ✓');
    if (gData && gData.ok){ DUZENLE = null; vGunSonu(); mesaj('gsMsg','ok','Değişiklikler kaydedildi ✓'); }
    else {
      btn.textContent = eskiBtnMetin;
      const bel = /Failed to fetch|NetworkError|timeout|bağlantı/i.test(window.__sonRpcHataHam||'');
      if (bel) mesaj('gsMsg','hata','Bağlantı belirsiz — değişiklik gitmiş olabilir. Listeyi kontrol edin.');
      else if (yuklenen.length) await fotoTemizle(yuklenen);
    }
    return;
  }
  const data = await rpcCagir('rpc_gun_sonu_kaydet', {
    p_idem: idem(), p_sube: PROFIL.sube_id, p_tarih: document.getElementById('gsTarih').value,
    p_kart: kart, p_nakit: nakit, p_toplam: toplam,
    p_iptal_adet: 0, p_iptal_tutar: 0,
    p_z_no: null, p_kdv: null, p_z_foto: null, p_slip_foto: null,
    p_not: document.getElementById('gsNot').value.trim()||null,
    p_kasa: kasa > 0 ? kasa : null,
    p_kasalar: kasalar.map(k=>({ kasa_no:k.n, sira:k.s, z_no:k.zno, kart_toplam:k.kart, nakit_toplam:k.nakit,
      z_foto_path:k.zf, pos_slip_foto_path:k.sf, notlar:k.knot, kdv:k.kdv }))
  }, 'gsKaydet','gsMsg','Gün sonu kaydedildi ✓');
  if (data && data.ok){
    const duzenlemeydi = !!DUZENLE;
    DUZENLE = null;
    vGunSonu();
    mesaj('gsMsg','ok', duzenlemeydi ? 'Değişiklikler kaydedildi ✓' : 'Gün sonu kaydedildi ✓ (2 kasa)');
  } else {
    btn.textContent = eskiBtnMetin;
    // Ağ belirsizse kayıt gitmiş OLABİLİR -> fotoğrafları SİLME. Kesin hatada temizle.
    const belirsiz = /Failed to fetch|NetworkError|timeout|bağlantı/i.test(window.__sonRpcHataHam||'');
    if (belirsiz){
      console.warn('BELİRSİZ SONUÇ — fotoğraflar korundu:', yuklenen);
      mesaj('gsMsg','hata','Bağlantı belirsiz — kayıt gitmiş olabilir. Fotoğraflar silinmedi. Tekrar denemeden önce listeyi kontrol edin.');
    } else {
      const kalan = await fotoTemizle(yuklenen);
      if (kalan.length) console.warn('YETİM DOSYA (temizlenemedi):', kalan);
    }
  }
}

    <div class="gs-bant" style="margin:12px 0">
      <div class="kalem"><div class="gs-et">Kart</div><div class="dg">${tl(tKart)}</div></div>
      <div class="kalem"><div class="gs-et">Z nakit</div><div class="dg">${tl(tNakit)}</div></div>

            // Satışı olup KDV'si girilmemiş kasa: beyan eksik kalır, ayrıca uyar
            const acik=[1,2].filter(no=>{
              const sat=ks.filter(k=>k.kasa_no===no).reduce((a,k)=>a+ +k.toplam,0);
              const kdv=kd.filter(x=>x.kasa_no===no).reduce((a,x)=>a+ +x.kdv_tutar,0);
              return sat>0 && kdv===0; });
            return `<br>KDV: <b>${tl(t)}</b>${par?' ('+par+')':''}`
              + (acik.length?`<br><span style="color:var(--uyari)">⚠ Kasa ${acik.join(' ve ')} satış yapmış ama KDV'si girilmemiş</span>`:'');})()}
          ${g.notlar?'<br>'+esc(g.notlar):''}
          ${(()=>{const ks=(g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted)
              .sort((a,b)=>a.kasa_no-b.kasa_no || (a.sira||1)-(b.sira||1));
            const t=new Date(g.tarih+'T00:00').toLocaleDateString('tr-TR');
            if(ks.length) return '<div style="margin-top:6px">'+ks.map(k=>{
              const e=`K${k.kasa_no}${zCok(ks,k.kasa_no)?'/'+(k.sira||1):''}`;
              return belgeBtn(k.z_foto_path,`${e} Z`,`${t} — Kasa ${k.kasa_no} ${zCok(ks,k.kasa_no)?(k.sira||1)+'. Z':'Z'} Raporu`)+
                     slipBtn(k.pos_slip_foto_path,`${e} Slip`,`${t} — Kasa ${k.kasa_no} POS Slip`);}).join('')+'</div>';
            return '<div style="margin-top:6px">'+belgeBtn(g.z_foto_path,'Z Raporu',`${t} — Z Raporu`)+
                   slipBtn(g.pos_slip_foto_path,'POS Slip',`${t} — POS Slip`)+'</div>';
          })()}</div></div>
        <div class="l-sag">${tl(g.toplam)}<br>
          <button class="btn2" style="margin-top:4px" onclick="gunSonuDuzenle('${g.id}')">Düzenle</button>
          <button class="btn-kirmizi" style="margin-top:4px" onclick="gunSil('${g.id}','${g.tarih}')">Sil</button></div>
      </div>`;}).join('')}</div>`;
}
async function gunSil(id, tarih){
  const neden = prompt(`${tarih} günü SİLİNECEK (kayıt audit'te kalır) ve yeniden girilebilir olacak. Neden?`);
  if (neden===null) return;
  if (!neden.trim()){ alert('Neden yazmak zorunlu.'); return; }
  const { error } = await sb.rpc('rpc_gun_sonu_sil', { p_id:id, p_neden:neden.trim() });
  if (error){ alert('Silinemedi: '+hataTr(error.message)); return; }
  try{ localStorage.removeItem('sonGunSonu'); }catch(e){}
  vGunSonu();
}

async function giderKaydet(mod){

  if (mod === 'fis'){

  } else {
    kategori = document.getElementById('gdKategori').value;
  }
  if (tutar===0){ mesaj('gdMsg','hata','Tutar boş olamaz.'); return; }
  if (kdvT===0 && !confirm('KDV tutarı BOŞ — bu gider indirilecek KDV hesabına girmeyecek. Faturasız/KDV\'siz gider mi? Yine de kaydedilsin mi?')) return;

  let foto=null;

  catch(e){ mesaj('gdMsg','hata',e.message); btn.disabled=false; btn.textContent='Gideri Kaydet'; return; }

    p_idem: idem(), p_sube: PROFIL.sube_id,

    p_kasadan: document.getElementById('gdKasadan').checked,

  },'gdKaydet','gdMsg','Kaydedildi ✓');
  if (data && data.ok){ ['gdTutar','gdKdvTutar','gdAciklama'].forEach(i=>document.getElementById(i).value=''); document.getElementById('gdFoto').value=''; document.getElementById('gdKasadan').checked=false; giderListe(); }

/* ===== FATURA KDV DÖKÜMÜ — bir belgede birden çok oran olabilir ===== */
let AL_KDV_SAYAC = 0;
function alKdvSatirEkle(oran, matrah, kdv){
  AL_KDV_SAYAC++;
  const n = AL_KDV_SAYAC;
  const kap = document.getElementById('alKdvSatirlari'); if(!kap) return;
  const d = document.createElement('div');
  d.className = 'kdv-satir'; d.id = 'alKdvS_'+n;
  d.innerHTML = `
    <select id="alKdvO_${n}">
      <option value="1"${oran==1?' selected':''}>%1</option>
      <option value="8"${oran==8?' selected':''}>%8</option>
      <option value="10"${(oran==10||!oran)?' selected':''}>%10</option>
      <option value="20"${oran==20?' selected':''}>%20</option>
      <option value="0"${oran===0?' selected':''}>%0</option>
    </select>
    <input type="text" inputmode="decimal" autocomplete="off" id="alKdvM_${n}" placeholder="matrah (KDV hariç)" value="${matrah??''}">
    <input type="text" inputmode="decimal" autocomplete="off" id="alKdvT_${n}" placeholder="KDV tutarı" value="${kdv??''}">
    <button class="sil" onclick="document.getElementById('alKdvS_${n}').remove(); alHesapla();">✕</button>`;
  kap.appendChild(d);
  const tEl = document.getElementById('alKdvT_'+n);
  // Matrah yazılınca KDV hesaplanır; kullanıcı/OCR elle yazdıysa BİR DAHA ÜZERİNE YAZILMAZ
  tEl.addEventListener('input', ()=>{ tEl.dataset.elle = tEl.value.trim()===''?'':'1'; });
  if (kdv !== undefined && kdv !== null && kdv !== '') tEl.dataset.elle = '1';
  const hesapla = ()=>{
    if (tEl.dataset.elle === '1') return;
    const m = paraOku(document.getElementById('alKdvM_'+n)).deger;
    const o = +document.getElementById('alKdvO_'+n).value || 0;
    tEl.value = m > 0 ? (m * o/100).toFixed(2) : '';
  };
  paraBagla(document.getElementById('alKdvM_'+n), ()=>{ hesapla(); alHesapla(); });
  paraBagla(tEl, alHesapla);
  document.getElementById('alKdvO_'+n).addEventListener('change', ()=>{ hesapla(); alHesapla(); });
  alHesapla();
}
function alKdvOku(){
  const sonuc = [];
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const pm = paraOku(document.getElementById('alKdvM_'+n));
    const pt = paraOku(document.getElementById('alKdvT_'+n));
    if (!pm.ok || !pt.ok) throw new Error('KDV satırında geçersiz tutar var — örnek: 2239,60');
    if (pm.deger > 0 || pt.deger > 0)
      sonuc.push({ oran:+document.getElementById('alKdvO_'+n).value, matrah:pm.deger, kdv_tutar:pt.deger });
  });
  return sonuc;
}
function alHesapla(){
  let kdv = 0, matrah = 0, gecerli = true;
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const pm = paraOku(document.getElementById('alKdvM_'+n));
    const pt = paraOku(document.getElementById('alKdvT_'+n));
    if (!pm.ok || !pt.ok) gecerli = false;
    matrah += pm.deger; kdv += pt.deger;
  });
  kdv = +kdv.toFixed(2); matrah = +matrah.toFixed(2);
  const el = document.getElementById('alKdvToplam'); if(el) el.textContent = tl(kdv);
  const pT = paraOku(document.getElementById('alToplam'));
  const toplam = pT.deger;
  const tut = document.getElementById('alTutarlilik'); if(!tut) return;
  if (!gecerli || !pT.ok){
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--hata)">Geçersiz tutar var — örnek: 3750,00</div>`; return;
  }
  if (toplam === 0 || kdv === 0){ tut.innerHTML = ''; return; }
  // Matrah + KDV = ödenecek tutar mı? (belgenin kendi aritmetiği)
  const fark = +(matrah + kdv - toplam).toFixed(2);
  if (Math.abs(fark) <= 0.05){
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--ok)">✓ Matrah ${tl(matrah)} + KDV ${tl(kdv)} = ${tl(toplam)} — belge tutuyor</div>`;
  } else {
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--uyari)">⚠ Matrah ${tl(matrah)} + KDV ${tl(kdv)} = ${tl(matrah+kdv)},
      ödenecek tutar ${tl(toplam)} — <b>${fark>0?'+':''}${tl(fark)}</b> fark var. Belgeyle karşılaştır.</div>`;
  }
}

const KTU_VKN = '20345231280';      // şahıs şirketi. LTD faturası buraya girmemeli.
function alFotoSecildi(){
  const d = document.getElementById('alOkuDurum');
  if (d){ d.className = 'oku-durum'; d.textContent = 'Fotoğraf seçildi — "Faturayı oku"ya basabilirsin.'; }

function alTedarikciEslestir(ocrAd, ocrVkn){
  const norm = s => (s||'').toString().toUpperCase()
    .replace(/[İI]/g,'I').replace(/[ŞS]/g,'S').replace(/[ĞG]/g,'G')
    .replace(/[ÜU]/g,'U').replace(/[ÖO]/g,'O').replace(/[ÇC]/g,'C')
    .replace(/[^A-Z0-9]/g,'');
  const liste = KATALOG.tedarikciler || [];
  const vkn = (ocrVkn||'').replace(/\D/g,'');
  if (vkn){
    const v = liste.find(t => (t.vergi_no||'').replace(/\D/g,'') === vkn);
    if (v) return { t:v, nasil:'VKN' };
  }
  const a = norm(ocrAd);
  if (a.length >= 4){
    const t = liste.find(x => { const y = norm(x.unvan||x.ad);
      return y.length>=4 && (y.startsWith(a.slice(0,8)) || a.startsWith(y.slice(0,8))); });
    if (t) return { t, nasil:'isim' };
  }
  return { t:null, nasil:null };
}

/* ===== FATURA SATIRLARI — tanı, eşleştir, bir daha sorma =====
   Tedarikçinin yazımı → bizim ürün eşleşmesi bir kez kurulur (urun_alias),
   sonraki faturalarda otomatik bağlanır. Eşleşme önce KOD'dan, kod yoksa isimden.
   Satır toplamı belgeyle tutmuyorsa ürün kaydı YAPILMAZ. */
let AL_SATIRLAR = [];
const birimNorm = s => (s||'').toString().toUpperCase().replace(/\s+/g,' ').trim();

async function alSatirlariKur(satirlar, tedarikciId){
  AL_SATIRLAR = [];
  const kap = document.getElementById('alSatirlar'); if(!kap) return;
  if (!Array.isArray(satirlar) || !satirlar.length){ kap.innerHTML=''; return; }
  let alias = [];
  if (tedarikciId){
    const { data } = await sb.from('urun_alias')
      .select('tedarikci_kodu,ham_ad,urun_id,birim_carpani')
      .eq('tedarikci_id', tedarikciId).eq('is_deleted', false);
    alias = data || [];
  }
  satirlar.forEach((s,i)=>{
    const kod = (s.kod||'').toString().trim();
    let es = null, nasil = null;
    if (kod){
      es = alias.find(a => (a.tedarikci_kodu||'').trim().toUpperCase() === kod.toUpperCase());
      if (es) nasil = 'kod';
    }
    if (!es){
      es = alias.find(a => birimNorm(a.ham_ad) === birimNorm(s.ad));
      if (es) nasil = 'isim';
    }
    AL_SATIRLAR.push({
      i, ham_ad:(s.ad||'').toString().trim(), ham_kod:kod||null,
      miktar:+s.miktar||0, birim:(s.birim||'').toString().trim()||null,
      birim_fiyat:+s.birim_fiyat||0, satir_tutar:+s.satir_tutar||0,
      iskonto_orani: s.iskonto_orani ?? null, iskonto_tutar: s.iskonto_tutar ?? null,
      kdv_orani:s.kdv_orani ?? null,
      carpan: es ? +es.birim_carpani : (+s.paket_ici_adet || 1),
      urun_id: es ? es.urun_id : null, eslesme: nasil,
      karar: es ? 'mevcut' : 'yeni'
    });
  });
  alSatirCiz();
}

function alSatirKarar(i){
  const s = AL_SATIRLAR.find(x=>x.i===i); if(!s) return;
  const v = document.getElementById('fsU_'+i).value;
  if (v === '__yeni'){ s.karar='yeni'; s.urun_id=null; s.eslesme=null; }
  else if (v === '__atla'){ s.karar='atla'; s.urun_id=null; s.eslesme=null; }
  else { s.karar='mevcut'; s.urun_id=v; s.eslesme='elle'; }
  alSatirCiz();

function alSatirDenetim(){

  // Faturanın matrahı: KDV dökümündeki matrahların toplamı
  let matrah = 0;

    matrah += paraOku(document.getElementById('alKdvM_'+d.id.split('_')[1])).deger;
  });

  const toplam = paraOku(document.getElementById('alToplam')).deger;
  if (!kalan.length){ el.innerHTML = ''; AL_SATIR_TUTUYOR = true; return; }

  const fark = +(satirT - hedef).toFixed(2);

/* Yeni ürünleri oluştur, eşleşmeyi hafızaya yaz, kalem listesini döndür */
async function alSatirKaydet(tedarikciId){

      if (ae) console.warn('Eşleşme kaydedilemedi (kayıt yine de sürüyor):', ae.message);
    }
    kalemler.push({ urun_id:urunId, miktar:s.miktar, birim_fiyat:s.birim_fiyat,
      ham_ad:s.ham_ad, ham_kod:s.ham_kod, birim_ad:s.birim, birim_carpani:carpan,

  return kalemler;

  if (!document.getElementById('alTedarikci').value){ mesaj('alMsg','hata','Tedarikçi seçilmedi.'); return; }
  if (toplam===0){ mesaj('alMsg','hata','Toplam tutar boş olamaz.'); return; }
  if (kdvT > toplam){ mesaj('alMsg','hata',`KDV (${tl(kdvT)}) toplam tutardan (${tl(toplam)}) büyük olamaz.`); return; }
  // Belgenin kendi aritmetiği: matrah + KDV = ödenecek
  if (matrah > 0 && Math.abs(matrah + kdvT - toplam) > 0.05 &&
      !confirm(`Matrah ${tl(matrah)} + KDV ${tl(kdvT)} = ${tl(matrah+kdvT)}, ödenecek tutar ${tl(toplam)}.\n${tl(Math.abs(matrah+kdvT-toplam))} fark var.\n\nBelgeyle karşılaştırdın mı? Yine de kaydedilsin mi?`)) return;
  // Mükerrer fatura ön kontrolü (belge no doluysa) — düzenlerken kendini saymaz
  const belgeNo = document.getElementById('alBelgeNo').value.trim();
  if (belgeNo){
    let q = sb.from('alis').select('id').eq('is_deleted',false)
      .eq('tedarikci_id', document.getElementById('alTedarikci').value).eq('belge_no', belgeNo);
    if (AL_DUZENLE) q = q.neq('id', AL_DUZENLE.id);
    const { data: mv } = await q.limit(1);
    if (mv && mv.length){ mesaj('alMsg','hata','Bu belge no bu firma için zaten girilmiş — mükerrer fatura. Kontrol edin.'); return; }
  }
  const alTurDeger = document.getElementById('alTur').value;
  if (alTurDeger==='fatura' && kdvT===0 && !confirm('KDV dökümü BOŞ — bu fatura indirilecek KDV hesabına girmeyecek. Yine de kaydedilsin mi?')) return;
  const fotoVar = !!(document.getElementById('alFoto')?.files?.[0]) || !!(AL_DUZENLE && AL_DUZENLE.foto);
  if (!fotoVar && !confirm('Belge fotoğrafı yok. Ay sonunda muhasebeye giden arşivde bu belge eksik kalır.\n\nYine de kaydedilsin mi?')) return;
  // Ürün satırları: tutmuyorsa fatura yine kaydedilir, ÜRÜNLER kaydedilmez
  const satirVar = AL_SATIRLAR.filter(s=>s.karar!=='atla').length > 0;
  if (satirVar && !AL_SATIR_TUTUYOR &&
      !confirm('Ürün satırlarının toplamı faturayla TUTMUYOR.\n\nFatura tutarı ve KDV\'si kaydedilecek, ama ÜRÜN SATIRLARI kaydedilmeyecek — yanlış maliyet oluşmasın diye.\n\nDevam edilsin mi?')) return;

  const btn = document.getElementById('alKaydet');
  btn.disabled=true; btn.textContent='Fotoğraf yükleniyor...';
  let foto=null;
  try{ foto = await fotoYukle('alFoto','fatura'); }
  catch(e){ mesaj('alMsg','hata',e.message); btn.disabled=false; btn.textContent='Faturayı Kaydet'; return; }

  // Yeni ürünleri oluştur + eşleşmeleri hafızaya yaz
  let kalemler = [];
  try{
    btn.textContent = 'Ürünler hazırlanıyor...';
    kalemler = await alSatirKaydet(document.getElementById('alTedarikci').value);
  }catch(e){
    mesaj('alMsg','hata', e.message); btn.disabled=false; btn.textContent='Faturayı Kaydet'; return;
  }
  if (!kalemler.length) kalemler = kalemOku();       // elle girilenler
  btn.textContent = AL_DUZENLE ? 'Değişiklikleri Kaydet' : 'Faturayı Kaydet';

  // DÜZENLEME: kaydı silmeden güncelle
  if (AL_DUZENLE){
    const gData = await rpcCagir('rpc_alis_guncelle', {
      p_idem: idem(), p_id: AL_DUZENLE.id,
      p_tedarikci: document.getElementById('alTedarikci').value,
      p_tarih: document.getElementById('alTarih').value,
      p_tur: document.getElementById('alTur').value,
      p_belge_no: belgeNo||null,
      p_fis_no: document.getElementById('alFisNo').value.trim()||null,
      p_toplam: toplam, p_kdv_kirilim: kdvKirilim,
      p_foto: foto,                                   // null ise mevcut korunur
      p_not: document.getElementById('alNot').value.trim()||null,
      p_kalemler: kalemler,
      p_odendi: document.getElementById('alOdendi').value === '1',
      p_odeme_yontem: document.getElementById('alOdendi').value === '1' ? document.getElementById('alYontem').value : null,
      p_vade: document.getElementById('alOdendi').value === '0' ? (document.getElementById('alVade').value||null) : null,
      p_cek_no: (document.getElementById('alOdendi').value==='1' && document.getElementById('alYontem').value==='cek') ? (document.getElementById('alCekNo').value.trim()||null) : null,
      p_cek_vade: (document.getElementById('alOdendi').value==='1' && document.getElementById('alYontem').value==='cek') ? (document.getElementById('alCekVade').value||null) : null
    }, 'alKaydet','alMsg','Değişiklikler kaydedildi ✓');
    if (gData && gData.ok){ AL_DUZENLE = null; AL_SATIRLAR = []; vGider(); mesaj('alMsg','ok','Değişiklikler kaydedildi ✓'); }
    else btn.textContent = 'Değişiklikleri Kaydet';
    return;
  }
  const data = await rpcCagir('rpc_alis_kaydet',{
    p_idem: idem(), p_sube: PROFIL.sube_id,
    p_tedarikci: document.getElementById('alTedarikci').value,
    p_tarih: document.getElementById('alTarih').value,
    p_tur: document.getElementById('alTur').value,
    p_belge_no: document.getElementById('alBelgeNo').value.trim()||null,
    p_fis_no: document.getElementById('alFisNo').value.trim()||null,
    p_toplam: toplam,
    p_kdv_orani: kdvKirilim.length === 1 ? kdvKirilim[0].oran : null,   // tek oransa eski alan da dolsun
    p_kdv_tutar: kdvT,
    p_kdv_kirilim: kdvKirilim,
    p_kdv_dahil: true,                       // "Ödenecek Tutar" alanı KDV dahil toplamdır
    p_ocr_ham: OCR_SON ? OCR_SON.veri : null,
    p_ocr_model: OCR_SON ? OCR_SON.model : null,
    p_foto: foto,
    p_not: document.getElementById('alNot').value.trim()||null,
    p_kalemler: kalemler,
    p_odendi: document.getElementById('alOdendi').value === '1',
    p_odeme_yontem: document.getElementById('alOdendi').value === '1' ? document.getElementById('alYontem').value : null,
    p_vade: document.getElementById('alOdendi').value === '0' ? (document.getElementById('alVade').value||null) : null,
    p_cek_no: (document.getElementById('alOdendi').value==='1' && document.getElementById('alYontem').value==='cek') ? (document.getElementById('alCekNo').value.trim()||null) : null,
    p_cek_vade: (document.getElementById('alOdendi').value==='1' && document.getElementById('alYontem').value==='cek') ? (document.getElementById('alCekVade').value||null) : null
  },'alKaydet','alMsg','Fatura kaydedildi ✓');
  if (data && data.ok) vGider();
}

async function alisListe(){
  const el = document.getElementById('gdListe'); if(!el) return;
  const ay  = AL_AY || bugun().slice(0,7);
  const bas = ay + '-01';
  const sonGun = new Date(+ay.slice(0,4), +ay.slice(5,7), 0).getDate();
  const son = ay + '-' + String(sonGun).padStart(2,'0');
  // AY BAZLI: limit yok — ayın tamamı gelir
  const { data, error } = await sb.from('alis')
    .select('*, tedarikci(ad), alis_kdv(oran,matrah,kdv_tutar,is_deleted)')
    .eq('is_deleted',false).gte('tarih',bas).lte('tarih',son)
    .order('tarih',{ascending:false});
  const fat = data||[];
  const kdvOf = a => (a.alis_kdv||[]).filter(x=>!x.is_deleted).reduce((s,x)=>s+ +x.kdv_tutar,0) || +a.kdv_tutar || 0;

  // bilgi_fisi = bedelsiz mal gelisi: borc/gider yaratmaz, toplamlara katilmaz
  const mali  = fat.filter(a=>a.tur !== 'bilgi_fisi');
  const tTop  = mali.reduce((s,a)=>s+ +a.toplam,0);
  const tKdv  = mali.reduce((s,a)=>s+ kdvOf(a),0);
  const acik  = mali.filter(a=>!a.odendi);
  const tAcik = acik.reduce((s,a)=>s+ +a.toplam,0);
  const bugunS = bugun();
  const gecmis = acik.filter(a=>a.vade_tarihi && a.vade_tarihi < bugunS);

  el.innerHTML = `<div class="kart">
    <div class="kbaslik">Faturalar${PROFIL.rol==='personel'?' (son 7 gün)':''}</div>
    ${PROFIL.rol==='owner' ? `<label>Ay</label>
      <input type="month" id="alListeAy" value="${ay}" onchange="alAyDegisti()">` : ''}
    ${error?`<div class="bilgi-not" style="color:var(--hata)">Liste yüklenemedi: ${esc(hataTr(error.message))}</div>`:''}
    <div class="gs-bant" style="margin:12px 0">
      <div class="kalem buyuk"><div class="gs-et">${esc(ayAdi)} alış toplamı</div><div class="dg">${tl(tTop)}</div></div>
      <div class="kalem"><div class="gs-et">İndirilecek KDV</div><div class="dg">${tl(tKdv)}</div></div>
      <div class="kalem"><div class="gs-et">Ödenmemiş</div><div class="dg">${tl(tAcik)}</div></div>
    </div>
    <div class="bilgi-not" style="margin:0 0 10px">
      <b>${mali.length}</b> fatura${fat.length>mali.length?` · ${fat.length-mali.length} bedelsiz mal gelişi (tutara katılmaz)`:''}
      ${acik.length?` · ${acik.length} tanesi ödenmedi`:''}
      ${gecmis.length?`<br><span style="color:var(--hata)">⚠ Vadesi geçmiş ${gecmis.length} fatura: ${tl(gecmis.reduce((s,a)=>s+ +a.toplam,0))}</span>`:''}
      ${kdvsiz.length?`<br><span style="color:var(--uyari)">⚠ ${kdvsiz.length} faturada KDV dökümü yok — indirilecek KDV eksik kalır</span>`:''}
      ${belgesiz.length?`<br><span style="color:var(--uyari)">⚠ ${belgesiz.length} belgenin fotoğrafı yok — ay sonu arşivinde eksik olur</span>`:''}
    </div>
    ${fat.length===0?'<div class="bilgi-not">Bu ayda fatura yok.</div>':fat.map(a=>{
      const t = new Date(a.tarih+'T00:00').toLocaleDateString('tr-TR');
      const k = kdvOf(a);
      const kir = (a.alis_kdv||[]).filter(x=>!x.is_deleted).sort((x,y)=>x.oran-y.oran);
      const vadeGecti = !a.odendi && a.vade_tarihi && a.vade_tarihi < bugunS;
      return `<div class="liste-satir">

            ${a.tur!=='fatura'?esc(a.tur==='bilgi_fisi'?'bedelsiz mal gelişi':a.tur)+' · ':''}Belge: ${esc(a.belge_no||'—')}
            ${k>0?`<br>KDV: <b>${tl(k)}</b>${kir.length>1?' ('+kir.map(x=>'%'+x.oran+' '+tl(x.kdv_tutar)).join(' + ')+')':''}`
                 :(a.tur==='fatura'?'<br><span style="color:var(--uyari)">⚠ KDV dökümü yok</span>':'')}
            <br>${a.odendi?'<span style="color:var(--ok)">✓ Ödendi</span>'

            <div style="margin-top:6px">${belgeBtn(a.foto_path,'Belge',`${t} — ${a.tedarikci?.ad||''} ${a.belge_no||''}`)}</div>
          </div></div>
        <div class="l-sag">${tl(a.toplam)}
          ${PROFIL.rol==='owner'?`<br><button class="btn2" style="margin-top:4px" onclick="alisDuzenle('${a.id}')">Düzenle</button>`:''}

}

async function alacakKaydet(){
  const g = id => document.getElementById(id);
  const firma = g('akFirma')?.value, urun = g('akUrun')?.value;
  if (!firma){ mesaj('akMsg','hata','Firma seçilmedi.'); return; }
  if (!urun){ mesaj('akMsg','hata','Ürün seçilmedi — önce bir fatura girip ürünleri tanımla.'); return; }
  const pm = paraOku(g('akMiktar')), pc = paraOku(g('akCarpan'));
  const pt = paraOku(g('akTutar')),  pk = paraOku(g('akKritik'));
  if (!pm.ok || !pc.ok || !pt.ok || !pk.ok){ mesaj('akMsg','hata','Geçersiz sayı var — örnek: 5 veya 5,5'); return; }
  if (pm.deger <= 0){ mesaj('akMsg','hata','Miktar girilmedi.'); return; }
  const carpan = pc.deger > 0 ? pc.deger : 1;
  const adet = +(pm.deger * carpan).toFixed(3);
  const birim = g('akBirim').value;
  if (birim !== 'adet' && carpan === 1 &&
      !confirm(`Birim "${birim}" seçtin ama içindeki adet girilmedi.\n${pm.deger} ${birim} = ${pm.deger} adet sayılacak.\n\nDevam edilsin mi?`)) return;
  const ozet = `${pm.deger} ${birim}${carpan>1?` × ${carpan} = ${adet} adet`:''}`;
  if (!confirm(`ÜRÜN ALACAĞI KAYDEDİLECEK\n\n${ozet}\n\nTeslimatlar bilgi fişi girildikçe buradan düşecek.\nOnaylıyor musun?`)) return;
  const btn = g('akKaydet'); btn.disabled = true;
  const { error } = await sb.from('urun_alacak').insert({
    sube_id: PROFIL.sube_id, tedarikci_id: firma, urun_id: urun,
    miktar_adet: adet, birim_ad: birim, birim_carpani: carpan,

async function sayimKaydet(urunler){
  const degisenler = [];
  for (const u of urunler){
    const inp = document.getElementById('sy_'+u.id);
    if (!inp || inp.value === '') continue;
    const fark = (+inp.value) - u.mevcut;
    if (Math.abs(fark) > 0.0001) degisenler.push({ urun:u.id, fark });
  }
  if (degisenler.length === 0){ mesaj('syMsg','hata','Hiç sayım girilmedi (veya hepsi sistemle aynı).'); return; }
  const data = await rpcCagir('rpc_sayim_toplu', {
    p_idem: idem(), p_sube: PROFIL.sube_id, p_tarih: bugun(),
    p_kalemler: degisenler.map(d=>({ urun:d.urun, fark:d.fark }))
  }, 'syKaydet','syMsg', `Sayım tamam: ${degisenler.length} ürün güncellendi ✓`);
  if (data && data.ok) setTimeout(vStok, 1200);
}
async function stokHareketKaydet(){
  let miktar = +document.getElementById('shMiktar').value||0;

  if (miktar===0){ mesaj('shMsg','hata','Miktar boş olamaz.'); return; }
  if (tur==='tuketim' && miktar>0) miktar = -miktar;
  const data = await rpcCagir('rpc_stok_hareket_kaydet',{
    p_idem: idem(), p_sube: PROFIL.sube_id,
    p_urun: document.getElementById('shUrun').value,
    p_tarih: document.getElementById('shTarih').value,
    p_tur: tur, p_miktar: miktar,
    p_not: document.getElementById('shNot').value.trim()||null
  },'shKaydet','shMsg','Hareket kaydedildi ✓');
  if (data && data.ok) vStok();
}

// → işveren SGK yükü = brüt × 0,375 (işçi payı %15 + işveren primi %22,5). Teşvikliyse elle düşürülür.
function sgkHesapla(net){ return net>0 ? +((net/0.85)*0.375).toFixed(2) : 0; }

      <label>Dönem</label>
      <input type="month" id="pgDonem" value="${donem}" onchange="PG_DONEM=this.value; vPersonel()">

        <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:520px">
          <thead><tr style="border-bottom:2px solid var(--cizgi);font-size:11px;color:var(--soluk)">

            <th style="padding:6px;text-align:right">SGK</th>
            <th style="padding:6px;text-align:right">PRİM</th>
            <th style="padding:6px;text-align:right">YEMEK</th>
            <th style="padding:6px;text-align:right">MALİYET</th>
            <th></th>
          </tr></thead>

            ${kayitlar.map(p=>satir(esc(p.personel_adi), p.maas, p.sgk, p.prim, p.yemek,

            ${satir('AY TOPLAMI', T.maas, T.sgk, T.prim, T.yemek, T.maliyet, null, true)}
          </tbody>
        </table>

    <div class="kart">

function bankaMutabakatKart(){
  const el = document.getElementById('bankaMutabakatKart'); if(!el) return;
  el.innerHTML = `
    <div class="kart">
      <div class="kbaslik">Banka POS Mutabakatı</div>

      <label>Dönem</label><input type="month" id="bmDonem" value="${bugun().slice(0,7)}">
      <label>Banka PDF'i</label><input type="file" id="bmPdf" accept="application/pdf">
      <button class="btn" id="bmAnaliz" onclick="bankaPdfAnaliz()">PDF'i Analiz Et</button>
      <div class="hata-msg" id="bmMsg"></div>
      <div id="bmSonuc"></div>
    </div>`;
}
function trSayi(s){ // "1.658.776,00" → 1658776.00 ; "-24.688,65" → -24688.65
  if (s==null) return null;
  const m = String(s).replace(/[^\d.,-]/g,'').replace(/\./g,'').replace(',','.');
  const n = parseFloat(m); return isNaN(n) ? null : n;
}
async function bankaPdfAnaliz(){
  const inp = document.getElementById('bmPdf');
  if (!inp.files || !inp.files[0]){ mesaj('bmMsg','hata','PDF seçilmedi.'); return; }
  const btn = document.getElementById('bmAnaliz'); btn.disabled=true; btn.textContent='Okunuyor...';
  try{
    const buf = await inp.files[0].arrayBuffer();
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
    const pdf = await pdfjsLib.getDocument({data:buf}).promise;
    let metin = '';
    for (let i=1; i<=pdf.numPages; i++){
      const pg = await pdf.getPage(i);
      const tc = await pg.getTextContent();
      metin += tc.items.map(x=>x.str).join(' ') + '\n';
    }
    const bul = (etiket) => {
      const re = new RegExp(etiket.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '[^\\d-]*(-?[\\d.]+,\\d{2})');
      const m = metin.match(re); return m ? trSayi(m[1]) : null;
    };
    const veri = {
      toplam_satis: bul('Toplam Satış'),
      komisyon: bul('İşyeri Ücreti Pşn\\(Tutar\\)'),
      maxipuan: bul('Maxipuan Katkı Payı'),
      okc_ucret: bul('ÖKC\\)') || bul('Bakım Ücreti'),
      kesinti_toplam: bul('Kesintiler Toplamı'),
      net_hesaba_gecis: bul('Dönem İçi Toplam Hesaba') || bul('Dönem İçi Peşin Hesaba'),
      bekleyen_alacak: bul('Toplam Alacak Tutarı')
    };
    if (veri.toplam_satis === null){ mesaj('bmMsg','hata','PDF tanınamadı — bu İş Bankası üye işyeri özeti mi? Alanlar okunamadı.'); btn.disabled=false; btn.textContent="PDF'i Analiz Et"; return; }
    // O ayın kart cirosu ile karşılaştır
    const donem = document.getElementById('bmDonem').value;
    const { data: gs } = await sb.from('gun_sonu').select('kart_toplam').gte('tarih',donem+'-01').lte('tarih',donem+'-31').eq('is_deleted',false);
    const bizimKart = (gs||[]).reduce((a,x)=>a+ +x.kart_toplam,0);
    const fark = veri.toplam_satis - bizimKart;
    const uyumlu = Math.abs(fark) < 1;
    document.getElementById('bmSonuc').innerHTML = `
      <div style="margin-top:12px">
        <div class="liste-satir"><div>Banka toplam satış</div><div class="l-sag">${tl(veri.toplam_satis)}</div></div>
        <div class="liste-satir"><div>Bizim kart cirosu (${(gs||[]).length} gün)</div><div class="l-sag">${tl(bizimKart)}</div></div>
        <div class="liste-satir"><div style="font-weight:800">FARK</div><div class="l-sag" style="color:${uyumlu?'var(--ok)':'var(--hata)'}">${uyumlu?'✓ Tutuyor':tl(fark)}</div></div>
        <div class="liste-satir"><div>Komisyon</div><div class="l-sag">${tl(veri.komisyon||0)}</div></div>
        <div class="liste-satir"><div>ÖKC/bakım ücreti</div><div class="l-sag">${tl(veri.okc_ucret||0)}</div></div>
        <div class="liste-satir"><div>Kesinti toplamı</div><div class="l-sag">${tl(veri.kesinti_toplam||0)}</div></div>
        <div class="liste-satir"><div>Net hesaba geçiş</div><div class="l-sag">${tl(veri.net_hesaba_gecis||0)}</div></div>
        <div class="liste-satir"><div>Bekleyen alacak</div><div class="l-sag">${tl(veri.bekleyen_alacak||0)}</div></div>
      </div>
      <button class="btn" onclick='bankaMutabakatKaydet(${JSON.stringify(veri).replace(/'/g,"&#39;")}, "${donem}", ${uyumlu})'>Mutabakatı Kaydet</button>`;
    mesaj('bmMsg','ok','PDF okundu — kontrol edip kaydedin.');
  }catch(e){
    mesaj('bmMsg','hata','PDF okunamadı: '+e.message);
  }finally{
    btn.disabled=false; btn.textContent="PDF'i Analiz Et";
  }
}

  if (!donem){ mesaj('akMsg','hata','Dönem seçilmedi.'); return; }
  const neden = prompt(`${donem} ayı yeniden AÇILACAK (personel tekrar giriş yapabilir). Neden?`);
  if (neden===null) return;
  if (!neden.trim()){ mesaj('akMsg','hata','Neden zorunlu.'); return; }
  const { error } = await sb.rpc('rpc_ay_ac', { p_sube: PROFIL.sube_id, p_donem: donem, p_neden: neden.trim() });
  if (error){ mesaj('akMsg','hata', hataTr(error.message)); return; }
  mesaj('akMsg','ok', `${donem} açıldı ✓`);
  vYonetim();
}
async function akDurumGoster(){
  const el = document.getElementById('akDurum'); if(!el) return;
  const donem = document.getElementById('akDonem').value;
  const { data } = await sb.from('ay_kapanis').select('kapali,eksik_gun_sayisi').eq('sube_id', PROFIL.sube_id).eq('donem', donem).eq('is_deleted',false).maybeSingle();
  el.innerHTML = data && data.kapali
    ? `<div class="rozet rz-hata" style="margin-top:8px">🔒 ${donem} KAPALI${data.eksik_gun_sayisi>0?' · '+data.eksik_gun_sayisi+' eksik gün':''}</div>`
    : `<div class="rozet rz-ok" style="margin-top:8px">🔓 ${donem} açık</div>`;
}
function trDuz(s){ // jsPDF standart fontu Türkçe karakter basamıyor — güvenli çevrim
  return String(s||'').replace(/ğ/g,'g').replace(/Ğ/g,'G').replace(/ü/g,'u').replace(/Ü/g,'U')
    .replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ı/g,'i').replace(/İ/g,'I')
    .replace(/ö/g,'o').replace(/Ö/g,'O').replace(/ç/g,'c').replace(/Ç/g,'C');
}
async function arsivPdf(){
  const ayS = document.getElementById('arsivAy').value;
  if (!ayS){ mesaj('arsivMsg','hata','Ay seçilmedi.'); return; }
  const btn = document.getElementById('arsivBtn');
  btn.disabled = true; btn.textContent = 'Belgeler toplanıyor...';
  try{
    const bas = ayS + '-01', son = ayS + '-31';
    const [gs, al, gd] = await Promise.all([
      sb.from('gun_sonu').select('tarih,z_no,z_foto_path,pos_slip_foto_path,gun_sonu_kasa(kasa_no,sira,z_no,z_foto_path,pos_slip_foto_path,is_deleted)').gte('tarih',bas).lte('tarih',son).eq('is_deleted',false).order('tarih'),
      sb.from('alis').select('tarih,toplam,foto_path,tedarikci(ad)').gte('tarih',bas).lte('tarih',son).eq('is_deleted',false).order('tarih'),
      sb.from('gider').select('tarih,tutar,foto_path,gider_kategori(ad)').gte('tarih',bas).lte('tarih',son).eq('is_deleted',false).order('tarih')
    ]);
    const ogeler = [];
    for (const g of (gs.data||[])){
      const ks = (g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted)
        .sort((a,b)=>a.kasa_no-b.kasa_no || (a.sira||1)-(b.sira||1));
      if (ks.length){
        for (const k of ks){
          // Aynı kasadan o gün birden fazla Z varsa sırayı da yaz (muhasebe hangisi olduğunu görsün)
          const sr = zCok(ks,k.kasa_no) ? ` — ${k.sira||1}. Z` : '';
          if (k.z_foto_path) ogeler.push({ b:`Z RAPORU — ${g.tarih} — KASA ${k.kasa_no}${sr}${k.z_no?' — Z No: '+k.z_no:''}`, p:k.z_foto_path });
          if (k.pos_slip_foto_path) ogeler.push({ b:`POS SLIP — ${g.tarih} — KASA ${k.kasa_no}${sr}`, p:k.pos_slip_foto_path });
        }
      } else { // eski tek kasalı kayıtlar
        if (g.z_foto_path) ogeler.push({ b:`Z RAPORU — ${g.tarih}${g.z_no?' — Z No: '+g.z_no:''}`, p:g.z_foto_path });
        if (g.pos_slip_foto_path) ogeler.push({ b:`POS SLIP — ${g.tarih}`, p:g.pos_slip_foto_path });
      }
    }
    for (const a of (al.data||[])) if (a.foto_path)
      ogeler.push({ b:`ALIS — ${a.tarih} — ${a.tedarikci?.ad||''} — ${tl(a.toplam)}`, p:a.foto_path });
    for (const x of (gd.data||[])) if (x.foto_path)
      ogeler.push({ b:`GIDER — ${x.tarih} — ${x.gider_kategori?.ad||''} — ${tl(x.tutar)}`, p:x.foto_path });
    if (ogeler.length === 0){ mesaj('arsivMsg','hata','Bu ayda fotoğraflı belge yok.'); return; }

    const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
    let ilk = true, eklenen = 0;
    for (let i = 0; i < ogeler.length; i++){
      btn.textContent = `Hazırlanıyor ${i+1}/${ogeler.length}...`;
      const { data: dosya, error } = await sb.storage.from('belgeler').download(ogeler[i].p);
      if (error || !dosya) continue;
      const url = URL.createObjectURL(dosya);
      const img = await new Promise(r=>{ const im=new Image(); im.onload=()=>r(im); im.onerror=()=>r(null); im.src=url; });
      if (img){
        if (!ilk) pdf.addPage();
        ilk = false; eklenen++;
        pdf.setFontSize(11); pdf.text(trDuz(ogeler[i].b), 10, 12);
        const enOran = Math.min(190/img.width, 265/img.height);
        pdf.addImage(img, ogeler[i].p.endsWith('.png')?'PNG':'JPEG', 10, 18,
          Math.round(img.width*enOran), Math.round(img.height*enOran));
      }
      URL.revokeObjectURL(url);
    }
    if (eklenen === 0){ mesaj('arsivMsg','hata','Belgeler indirilemedi.'); return; }
    pdf.save(`bardaks-arsiv-${ayS}.pdf`);
    mesaj('arsivMsg','ok', eklenen + ' belge tek PDF olarak indirildi ✓');
  }catch(e){
    mesaj('arsivMsg','hata','PDF oluşturulamadı: ' + e.message);
  }finally{
    btn.disabled = false; btn.textContent = 'PDF Oluştur ve İndir';
  }
}
