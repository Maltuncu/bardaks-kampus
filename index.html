async function mutabakatDosyalari(){
  const inp = document.getElementById('mtDosya');
  const secilen = [...(inp?.files || [])];
  if (!secilen.length) throw new Error('Önce zip veya PDF seç.');
  const pdfler = [];
  for (const f of secilen){
    if (/\.zip$/i.test(f.name) || f.type === 'application/zip'){
      if (!window.JSZip) throw new Error('Zip okuyucu yüklenemedi — internet bağlantısını kontrol et.');
      const z = await window.JSZip.loadAsync(f);
      const adlar = Object.keys(z.files).filter(n => /\.pdf$/i.test(n) && !z.files[n].dir);
      for (const n of adlar){
        const blob = await z.files[n].async('blob');
        pdfler.push(new File([blob], n.split('/').pop(), { type:'application/pdf' }));
      }
    } else if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf'){
      pdfler.push(f);
    }
  }
  if (!pdfler.length) throw new Error('Seçilenlerin içinde PDF bulunamadı.');
  return pdfler;
}
/* ==================================================================
   ⚠ CS · E-FATURA ALAN OKUYUCU (yerel, sunucu çağrısı YOK)
   ÖLÇÜLDÜ — 25 gerçek e-fatura, dört ayrı ihraççı:
     belge no 25/25 · firma 25/25 · VKN 25/25 · tutar 25/25
     tarih 24/25 · KDV 21/25 · matrah 24/25
     TAM okunan (no+tarih+tutar): 24/25 · eksik 1 (Turkcell, tarih yok)
   Toplam/KDV etiketi ihraççıdan ihraççıya değişiyor:
     BİM      "Fatura Tutarı: 1.407,00 TL" · "Hesaplanan KDV (1393.07) %1: 13,93 TL"
     Şenpiliç "Yekün: 1.322,50" · "K.D.V.(%1): 13,09" · "Ara Toplam: 1.309,41"
     AKSA     "Ödenecek Tutar" · "Vergiler Dahil Toplam Tutar" · "Mal Hizmet Toplam Tutarı"
   ⚠ PARANTEZ TUZAĞI: "Hesaplanan KDV (1393.07) %1: 13,93" — parantez
     içindeki sayı KDV DEĞİL, matrahtır. Desen tutarı İKİ NOKTADAN
     SONRA arar. (İlk denemede 3.07 okunuyordu — sessizce yanlış rakam.)
   ⚠ FİRMA ve VKN DOSYA ADINDAN: portal "BELGENO_VKN_FİRMA.pdf" veriyor,
     25/25 doğru. Metnin ilk satırı başlık çöpü.
   ⚠ Bu fonksiyon gdFatura yolundaki sunucu okuyucusunu (Edge Function)
     ÇAĞIRMAZ: 25 fatura = 25 sunucu çağrısı olurdu. Yerelde okunamayan
     satır zaten kaydedilmiyor, kullanıcı onu tek tek forma alıyor —
     orada sunucu okuyucusu devrede. */
const FA_P = '([0-9][0-9.]*,[0-9]{2}|[0-9]+\\.[0-9]{2}|[0-9][0-9.,]*)';
const faIlk = (t, kaliplar) => {
  for (const k of kaliplar){ const m = t.match(new RegExp(k, 'i')); if (m && m[1]) return m[1]; }
  return null;
};
/* Fatura metnindeki sayı KURUŞA. İki biçim de geliyor: "1.234,56" (TR)
   ve "1234.56" (EN). Virgül varsa TR (noktalar ayıraç), yoksa iki
   haneli nokta ondalıktır. Okunamazsa null. */
function faKurus(s){
  const x = String(s || '').trim();
  if (!x) return null;
  const n = x.includes(',') ? Number(x.replace(/\./g,'').replace(',','.'))
          : /^\d+\.\d{2}$/.test(x) ? Number(x)
          : Number(x.replace(/\./g,''));
  return Number.isFinite(n) ? Math.round(n * 100) : null;
}
/* ⚠ AYIRAÇLI YAZ: sade "3250,00" da paraCoz'dan geçiyor ama alan
   metinleri faturadaki biçimden sapıyordu ve eski/yeni karşılaştırması
   değer değişmediği hâlde "değişti" diyordu (ölçüldü: DELTA
   "3.250,00" -> "3250,00"). Biçim korunur. */
const faYaz = (k) => (k/100).toLocaleString('tr-TR',
  { minimumFractionDigits:2, maximumFractionDigits:2 });
/* ⚠ DA · ÇOK ORANLI FATURADA KDV TOPLANIR.
   ÖLÇÜLDÜ — bazı faturalarda "Toplam KDV Tutarı" etiketi YOK, yalnız
   oran oran satırlar var ve okuyucu İLKİNİ alıp duruyordu:
     Kardeşler  KDV(%20.00) 860,83 + KDV(%10.00)  29,55 = 890,38
                (4.599,62 + 890,38 = 5.490,00 ✓) — alınan 860,83
     TM İçecek  KDV(%1)      37,03 + KDV(%10)    231,82 = 268,85
                (6.021,16 + 268,85 = 6.290,01 ✓) — alınan  37,03
   TM'de tek faturada 231,82 TL KDV indirimi EKSİK giriyordu.
   ⚠ AYIRICI ":" OLMAYABİLİR — bu ikisinde yok.
   ⚠ "Hesaplanan KDV Matrahı(%x)" TOPLAMA GİRMEZ: desen "KDV" ile "("
     arasına söz koydurtmuyor, Matrah satırı bu yüzden eşleşmiyor. */
const FA_KDV_SATIR = new RegExp(
  'Hesaplanan\\s*KDV\\s*\\(\\s*%?\\s*[0-9.,]+\\s*\\)\\s*:?\\s*' + FA_P, 'gi');
function faKdvTopla(t){
  FA_KDV_SATIR.lastIndex = 0;
  let m, top = 0, adet = 0;
  while ((m = FA_KDV_SATIR.exec(t))){
    const k = faKurus(m[1]);
    if (k == null) return null;               // biri okunamadıysa toplam da güvenilmez
    top += k; adet++;
  }
  return adet ? faYaz(top) : null;
}
function faturaAlanlari(ad, metin){
  const t = String(metin || '').replace(/\s+/g, ' ');
  const p = String(ad || '').replace(/\.pdf$/i, '').split('_');
  const th = faIlk(t, ['Fatura\\s*Tarihi\\s*:?\\s*(\\d{2}\\s?[-./]\\s?\\d{2}\\s?[-./]\\s?\\d{4})',
                       'Tarihi?\\s*:?\\s*(\\d{2}\\s?[-./]\\s?\\d{2}\\s?[-./]\\s?\\d{4})']);
  return {
    belge_no: /^[A-Z0-9]{10,20}$/i.test(p[0] || '') ? p[0].toUpperCase() : null,
    vkn:      /^\d{10,11}$/.test(p[1] || '') ? p[1] : null,
    firma:    p.length >= 3 ? p.slice(2).join('_').trim() : null,
    tarih:    th ? th.replace(/\s/g, '') : null,
    tutar:    faIlk(t, ['Ödenecek\\s*Tutar\\s*:?\\s*' + FA_P,
                        'Vergiler\\s*Dahil\\s*Toplam\\s*Tutar\\s*:?\\s*' + FA_P,
                        'Fatura\\s*Tutar[ıi]\\s*:?\\s*' + FA_P,
                        'Yek[üu]n\\s*:?\\s*' + FA_P,
                        'GENEL\\s*TOPLAM\\s*:?\\s*' + FA_P]),
    /* ⚠ CZ · IKI HATA BIRDEN DUZELDI (olculdu, Bizim Toptan metni):
         Mal Hizmet Toplam Tutarı       : 2.092,48
         Hesaplanan KDV Matrahı(%10,00) :   714,16
         Hesaplanan KDV(%10,00)         :    71,42
         Hesaplanan KDV Matrahı(%1,00)  : 1.170,10
         Hesaplanan KDV(%1,00)          :    11,70
         Hesaplanan KDV Matrahı(%20,00) :   208,22
         Hesaplanan KDV(%20,00)         :    41,64
         Toplam KDV Tutarı              :   124,76
       1) Eski desen 'Hesaplanan\s*KDV[^:]{0,30}:' MATRAH satirina da
          uyuyor ve 714,16'yi KDV saniyordu.
       2) Cok oranli faturada tek oranin kdv'sini almak da yanlis
          olurdu (11,70 gibi) — dogrusu TOPLAM: 71,42+11,70+41,64.
       Bu yuzden "Toplam KDV Tutarı" ONCE aranir, "Hesaplanan KDV"
       desenine de Matrah'i disarida birakan bakis eklendi. */
    /* SIRA: (a) tek doğru toplam varsa o · (b) yoksa oran oran TOPLA
       · (c) yoksa eski desen listesi (değiştirilmedi). */
    kdv:      faIlk(t, ['Toplam\\s*KDV\\s*Tutar[ıi]\\s*:?\\s*' + FA_P])
              || faKdvTopla(t)
              || faIlk(t, ['Hesaplanan\\s*KDV(?![^:]{0,30}Matrah)[^:]{0,30}:\\s*' + FA_P,
                           'K\\.?\\s?D\\.?\\s?V\\.?\\s*\\(\\s*%[0-9.,]+\\s*\\)\\s*:?\\s*' + FA_P,
                           'Toplam\\s*KDV\\s*:?\\s*' + FA_P,
                           'KDV\\s*Tutar[ıi]\\s*:?\\s*' + FA_P]),
    matrah:   faIlk(t, ['Mal\\s*Hizmet\\s*Toplam\\s*Tutar[ıi]\\s*:?\\s*' + FA_P,
                        'Ara\\s*Toplam\\s*:?\\s*' + FA_P,
                        'Toplam\\s*Tutar\\s*:?\\s*' + FA_P]),
    /* ⚠ ARİTMETİK KONTROL İÇİN AYRI, YEDEKSİZ İKİ ALAN. Yukarıdaki
       `matrah` ve `tutar` yedekli okunuyor ve o yedekler kontrolü
       bozar: BİM'de "Toplam Tutar" KDV DAHİL toplamı veriyor
       (1.407,00), matrah sanılırsa denklem hep sapardı. AKSA'da da
       "Ödenecek Tutar" ile "Vergiler Dahil Toplam Tutar" arasında
       0,04 "Yuvarlama Tutarı" var. Kontrol YALNIZ bu iki net
       etiketten okunur; biri yoksa kontrol YAPILMAZ. */
    matrahNet: faIlk(t, ['Mal\\s*Hizmet\\s*Toplam\\s*Tutar[ıi]\\s*:?\\s*' + FA_P]),
    tutarNet:  faIlk(t, ['Vergiler\\s*Dahil\\s*Toplam\\s*Tutar\\s*:?\\s*' + FA_P])
  };
}
/* ==================================================================
   ⚠ CT · FATURA METNİNDEN TAM UNVAN
   ÖLÇÜLDÜ (25 gerçek fatura · 11 ayrı firma): dosya adındaki firma
   KIRPIK ve bozuk ("BİM BİRLEŞİK MA", "ŞERİF BAŞARAN K") — tedarikçi
   adı olarak kullanılamaz. Tam unvan metinden okunuyor.
   ⚠ BU YORUM BİR KEZ YANLIŞ BİLGİ TAŞIDI, DÜZELTİLDİ: eskiden
     "Turkcell, DELTA ve Sütaş'ın satıcı adı sayfa metninde HİÇ yok"
     yazıyordu. DELTA için bu DOĞRU DEĞİL — ham metinde duruyor:
     "Son Ödeme Tarihi 14-08-2026 DELTA DAY.TÜK.MALL.TİC.LTD.ŞTİ. GÜL…"
     Göremeyen desendi: eki aramadan önce BOŞLUK şart koşuyordu
     (\s+), DELTA'da ise ek noktayla yapışık ("...MALL.TİC.LTD.ŞTİ.").
     FU_KELIME nokta içerdiği için tüm dizgiyi yutuyor, geri izlese de
     ayırıcı olarak \s bulamıyordu. Ayırıcı [\s.]+ oldu.
     Turkcell için doğru: 113 metin parçasında unvan yok, logoda.
     Sütaş için de doğru ama sorun değil — zaten kayıtlı, yalnız VKN'si
     boş ve "VKN'yi yaz" düğmesi onu çözüyor.
   ⚠ DOSYA ADI ÇIPA, AD DEĞİL: metindeki hangi adayın satıcı olduğunu
     söyleyen en güvenilir işaret o. Çıpasız denendi ve Sütaş
     faturasında ödeme bloğundaki "YAPI VE KREDİ BANKASI A.Ş."
     satıcı diye seçiliyordu — sessizce YANLIŞ firma.
   ⚠ Aday penceresi 10 kelime: 6 kelimeyle uzun ticari unvanlar
     baştan kırpılıyordu ("...SANAYİ GIDA VE TEMİZLİK ... ŞİRKETİ"). */
const FU_EK = '(?:A\\.?\\s?Ş\\.?|LTD\\.?\\s?ŞTİ\\.?|LİMİTED\\s+ŞİRKETİ|ANONİM\\s+ŞİRKETİ)';
const FU_KELIME = '[A-ZÇĞİÖŞÜa-zçğıöşü0-9][A-ZÇĞİÖŞÜa-zçğıöşü0-9.&/-]*';
/* ⚠ AYIRICI [\s.]+ — sadece \s DEĞİL: unvan eki noktayla yapışık
   gelebiliyor ("...MALL.TİC.LTD.ŞTİ."), o zaman desen eki hiç görmüyordu. */
const FU_DESEN = new RegExp('((?:' + FU_KELIME + '[\\s.]+){1,10}' + FU_EK + ')', 'g');
const FU_ELE = /BANKA|IBAN|ŞUBES[İI]\b/i;
const FU_SADE = { 'Ç':'C','Ğ':'G','İ':'I','I':'I','Ö':'O','Ş':'S','Ü':'U',
                  'ç':'C','ğ':'G','ı':'I','i':'I','ö':'O','ş':'S','ü':'U' };
/* ⚠ toLocaleUpperCase TEK BAŞINA YETMEZ: "İ" ile "I" ayrı kalır ve
   "İLKADIM" ile "ILKADIM" eşleşmez. Karşılaştırma hep bu anahtarla. */
function fuAnahtar(s){
  return String(s || '').replace(/[ÇĞİIÖŞÜçğıiöşü]/g, c => FU_SADE[c])
    .toUpperCase().replace(/[^A-Z0-9]/g, '');
}
function faturaUnvan(metin, kirpik){
  const t = String(metin || '').replace(/\s+/g, ' ');
  const cipa = fuAnahtar(kirpik).slice(0, 8);
  if (cipa.length < 5) return null;
  const adaylar = []; let m; FU_DESEN.lastIndex = 0;
  while ((m = FU_DESEN.exec(t))){
    const ad = m[1].trim();
    if (FU_ELE.test(ad) || ad.length < 8) continue;
    const i = fuAnahtar(ad).indexOf(cipa);
    if (i < 0) continue;
    let sayac = 0, bas = 0;
    for (let j = 0; j < ad.length; j++){
      if (sayac === i){ bas = j; break; }
      if (fuAnahtar(ad[j]).length) sayac++;
    }
    const kes = ad.slice(bas).replace(/^[^A-ZÇĞİÖŞÜa-zçğıöşü0-9]+/, '').trim();
    if (kes.length >= 8) adaylar.push(kes);
  }
  if (!adaylar.length) return null;
  /* Birden çok aday varsa EN UZUN: kırpılmamış tam unvan odur. */
  return adaylar.sort((a, b) => b.length - a.length)[0].replace(/\s{2,}/g, ' ');
}
/* ⚠ CT · TEDARİKÇİ EŞLEŞTİRME · ÖNCE VKN
   Dönen durum, ekranın ne yapacağını belirler:
     'vkn'      VKN tutuyor       -> mevcuda bağlan, YENİ AÇMA
     'vknsiz'   ad tutuyor, kayıtlı tedarikçinin VKN'si BOŞ
                -> kopya açma, mevcuda VKN yazmayı öner
     'catisma'  ad tutuyor ama VKN FARKLI -> OLUŞTURMA, kullanıcıya sor
                (iki ayrı firma olabilir)
     'yok'      hiçbiri -> oluşturulabilir */
function tedEslestir(vkn, ad){
  const v = String(vkn || '').trim();
  const a = fuAnahtar(ad);
  if (v){
    const t = KATALOG.tedarikciler.find(x => String(x.vergi_no || '').trim() === v);
    if (t) return { ted: t, durum: 'vkn' };
  }
  if (a.length >= 6){
    const adli = KATALOG.tedarikciler.find(x => {
      const k = fuAnahtar(x.ad);
      return k && (k.startsWith(a.slice(0, 8)) || a.startsWith(k.slice(0, 8)));
    });
    if (adli){
      const tv = String(adli.vergi_no || '').trim();
      if (!tv)          return { ted: adli, durum: 'vknsiz' };
      if (v && tv !== v) return { ted: adli, durum: 'catisma' };
      return { ted: adli, durum: 'vkn' };
    }
  }
  return { ted: null, durum: 'yok' };
}

/* "07-08-2026" / "11.08.2026" -> "2026-08-11"; okunamazsa null */
function faTarihISO(s){
  const m = String(s || '').match(/^(\d{2})[-./](\d{2})[-./](\d{4})$/);
  return m ? m[3] + '-' + m[2] + '-' + m[1] : null;
}

/* ==================================================================
   ⚠ CS · TOPLU FATURA GİRİŞİ
   Sahip elinde 93 e-fatura ile tek tek forma taşıyordu. Tablo,
   okunan faturaları satır satır gösterir; kullanıcı türü ve
   kategoriyi seçer, tek düğmeyle sıra sıra kaydedilir.

   ⚠ ALIŞ/GİDER AYRIMINI SİSTEM SEÇMEZ. Alış SMM'ye (mal maliyeti),
     gider işletme masrafına gider; kâra farklı yerden vururlar.
     Tür seçilmemiş satır İŞARETLENEMEZ. Aynı firmadan daha önce
     girilmiş kayıt varsa yalnız ÖNERİ yazılır, işaret KONMAZ.
   ⚠ EKSİK OKUNAN SATIR KAYDEDİLMEZ: tarihi ya da tutarı okunamayan
     satırın kutusu kapalı, sebebi yazılı; kullanıcı "Tek tek gir"
     ile forma alır (orada sunucu okuyucusu var).
   ⚠ KAYDETME TEK TEK: bir satır patlarsa öteki satırlar devam eder.
     Sonda özet yazılır — yarısı girmiş bir zip, hiç girmemişten
     kötüdür; kullanıcı neyin girdiğini bilmeli.
   ⚠ MÜKERRER: zaten sistemde olan belgeler bu tabloya HİÇ girmez
     (mutabakat onları "TAM"/"BELGESİ EKSİK" kutularına ayırıyor).
     Aynı zip ikinci kez yüklenirse tablo boş gelir — üstteki satır
     bunu söyler.
   ⚠ ALIŞ İÇİN TEDARİKÇİ ŞART (rpc_alis_kaydet p_tedarikci). VKN ile
     eşleşen tedarikçi yoksa o satırda Alış seçeneği KAPALI; sebebi
     yazılı. Gider yolu açık kalır. */
let TOPLU = [];
const tpBul = (i) => TOPLU[i];
/* ==================================================================
   CY · KDV ARITMETIK KAPISI — GUVENMEDIGIN RAKAMI VERME
   ==================================================================
   OLCULDU (gercek zip, kullanicinin ekrani):
     Bizim Toptan OAF2026486011131 · 2.980,00 · "KDV" 2.950,50 -> %99
     Bizim Toptan OAF2026486011122 · 2.217,24 · "KDV"   714,16 -> %32
   Ayni zipteki otekiler dogru (Senpilic/Serif Basaran/Sutas %1). Yani
   okuyucu bazi faturalarda MATRAHI KDV saniyor. Sorun okuyucunun
   nerede yanildigi DEGIL — o ayri is. Sorun yanlis rakamin SESSIZCE
   tabloya yazilip dogru gorunmesi ve kaydedilmesi: oradan alis_kdv ->
   KDV indirimi -> BEYAN'a gidiyor. 2.980 liralik faturada 2.950 TL
   KDV indirimi gercek bir vergi riskidir.
   ⚠ TEK KURAL: IMKANSIZ OLANI DUSUR. "Oran yasal oranlardan birine
     yakin degilse supheli say" diye ikinci bir kural denendi ve
     KALDIRILDI — dogru veriye ates ediyordu:
       Bizim Toptan OAF...122 · 2.217,24 · KDV 124,76 (%5,6)
       %10 matrah 714,16 -> 71,42 · %1 matrah 1.170,10 -> 11,70
       %20 matrah 208,22 -> 41,64 · toplam 124,76 ✓
     Karisik oranli faturada ortalama oran %0 ile %16,67 ARASINDA
     HERHANGI BIR DEGER olabilir (muaf kalem varsa %0,99'un da
     altina iner). Yani o araliktaki hicbir deger supheli degil —
     kural dogruyu yanlistan AYIRAMIYORDU. Yakalamasi beklenen
     hatayi da yakalamiyordu: tek oranin kdv'si (11,70) alinsaydi
     oran %0,53 cikardi, yine aralikta, yine uyari yok.
     Bir kural neyi ayirdigini soyleyemiyorsa gurultudur. */
function kdvDenetle(tutar, kdv){
  if (kdv == null || tutar == null || !(tutar > 0)) return { durum:'yok' };
  const p = kdv / tutar;
  /* KDV DAHIL tutarda hicbir oran 1/6'yi (%20) gecemez. */
  if (kdv < 0 || kdv >= tutar || p > 0.20)
    return { durum:'imkansiz', yuzde: p * 100 };
  return { durum:'temiz', yuzde: p * 100 };
}
const yuzdeYaz = (y) => (Math.round(y * 10) / 10).toString().replace('.', ',');
/* Satirin kdv/kdvDurum/kdvNot alanlarini bastan kurar. Hem tpKur hem
   de kullanicinin elle yazdigi deger buradan gecer — tek yol. */
function kdvUygula(r, kdvDeger){
  const d = kdvDenetle(r.tutar, kdvDeger);
  if (d.durum === 'imkansiz'){
    /* ⚠ SESSIZCE DUSURULMEZ: ne dusuruldugu ve NEDEN satirda yazar. */
    r.kdv = null; r.kdvDurum = 'dusuruldu';
    r.kdvNot = 'KDV okunamadı (faturada %' + yuzdeYaz(d.yuzde)
      + ' gibi göründü, imkânsız) — kaydedilirse KDV BOŞ gider, sonra düzeltirsin';
    r.kdvHam = kdvDeger;
  } else {
    r.kdv = kdvDeger == null ? null : kdvDeger;
    r.kdvDurum = d.durum === 'temiz' ? 'temiz' : 'yok';
    r.kdvNot = null;
  }
  kdvAritmetik(r);
}
/* ⚠ DA · ARİTMETİK KONTROL — DAR AMA GERÇEK.
   matrah + KDV = fatura toplamı. ÜÇÜ DE net etiketten okunabiliyorsa
   yapılır; biri okunamıyorsa HİÇ UYARILMAZ. Ölçülemeyen şeyi ölçüyormuş
   gibi yapmak, kaldırdığımız sarı "şüpheli" uyarısının sebebiydi.
   ⚠ KDV SİLİNMEZ, yalnız söylenir: kullanıcı tabloda düzeltebilir ve
     tutmayan satır YİNE DE kaydedilebilir — engel değil, uyarı. */
function kdvAritmetik(r){
  if (r.kdvDurum === 'dusuruldu' || r.kdvDurum === 'gecersiz') return;
  const m = faKurus(r.kaynak && r.kaynak.matrahNet);
  const g = faKurus(r.kaynak && r.kaynak.tutarNet);
  if (m == null || g == null || r.kdv == null){ r.kdvKontrol = 'yapilamadi'; return; }
  const k = Math.round(r.kdv * 100);
  const fark = Math.abs(m + k - g);
  if (fark <= 1){ r.kdvKontrol = 'tam'; return; }   // 1 kuruş pay
  r.kdvKontrol = 'sapti';
  r.kdvNot = 'KDV faturayla tutmuyor (matrah + KDV = ' + tl((m + k)/100)
    + ', faturada ' + tl(g/100) + ') — kontrol et';
}
/* Tabloda elle yazilan KDV. ⚠ FORMA GITMEDEN duzeltilsin: 25 satirlik
   tabloda tek satir icin forma gidip donmek kullaniciyi cileden
   cikariyordu (kullanicinin kendi sozu). */
function tpKdvYaz(i, ham){
  const r = tpBul(i); if (!r) return;
  if (r.sonuc && !tpKilitli(r)) r.sonuc = null;
  const t = String(ham || '').trim();
  if (!t){ r.kdv = null; r.kdvDurum = 'yok'; r.kdvNot = null; r.kdvHam = null; }
  else {
    const p = paraCoz(t);
    if (!p.ok){ r.kdvDurum = 'gecersiz'; r.kdvNot = 'KDV: ' + p.hata; }
    else kdvUygula(r, p.deger);
  }
  tpCiz();
}
function tpKur(eksikler){
  TOPLU = eksikler.map((x, i) => {
    /* ⚠ CT · Unvan METİNDEN, çıpası dosya adı. Eşleştirme ÖNCE VKN. */
    const unvan = faturaUnvan(x.metin, x.firma);
    const e = tedEslestir(x.vkn, unvan || x.firma);
    const ted = e.durum === 'catisma' ? null : e.ted;
    const isoT = faTarihISO(x.tarih);
    const p = x.tutar ? paraCoz(x.tutar) : { ok:false };
    const eksik = [];
    if (!isoT) eksik.push('tarih okunamadı');
    if (!p.ok || !p.deger) eksik.push('tutar okunamadı');
    if (!x.belge_no) eksik.push('belge no okunamadı');
    const satir = { i, kaynak:x, belge_no:x.belge_no, firma:x.firma || x.ad,
      unvan, esles:e.durum, tarih:isoT || '', tutar:p.ok ? p.deger : null,
      kdv:null, kdvDurum:'yok', kdvNot:null, kdvHam:null, kdvKontrol:'yapilamadi',
      ted, tur:'', kategori:'', haric:false, sec:false, eksik,
      oneri: TP_GECMIS[(x.vkn || '') + '|' + (x.firma || '')] || null, sonuc:null };
    /* ⚠ CY · OKUNAN KDV DOGRUDAN YAZILMAZ, KAPIDAN GECER. */
    kdvUygula(satir, x.kdv ? (paraCoz(x.kdv).deger || null) : null);
    return satir;
  });
}
let TP_GECMIS = {};
async function tpGecmisYukle(){
  /* Aynı firmadan daha önce ne girilmiş — ÖNERİ için, işaret için değil. */
  TP_GECMIS = {};
  const vknler = [...new Set(TOPLU.map(r => r.kaynak.vkn).filter(Boolean))];
  const tedIds = [...new Set(TOPLU.map(r => r.ted && r.ted.id).filter(Boolean))];
  if (tedIds.length){
    const { data } = await sb.from('alis').select('tedarikci_id').eq('is_deleted', false)
      .in('tedarikci_id', tedIds).limit(200);
    (data || []).forEach(a => {
      TOPLU.filter(r => r.ted && r.ted.id === a.tedarikci_id).forEach(r => {
        TP_GECMIS[(r.kaynak.vkn||'') + '|' + (r.kaynak.firma||'')] = 'alis'; });
    });
  }
  TOPLU.forEach(r => { r.oneri = TP_GECMIS[(r.kaynak.vkn||'') + '|' + (r.kaynak.firma||'')] || r.oneri; });
  void vknler;
}
function tpDegis(i, alan, deger){
  const r = tpBul(i); if (!r) return;
  /* ⚠ CU · HATA MESAJI SATIRI KİLİTLEMESİN. tpKaydedilebilir "!r.sonuc"
     istiyor; hata metni satırda kalınca kullanıcı düzeltse bile satırı
     bir daha SEÇEMİYORDU (ölçüldü: 21 satırdan 20'si kaydedildi, hata
     alan biri hep dışarıda kaldı). Satıra dokunmak "düzelttim" demektir:
     hata metni o an düşer, satır yeniden seçilebilir olur. */
  if (r.sonuc && !tpKilitli(r)) r.sonuc = null;
  if (alan === 'sec') r.sec = !!deger;
  else if (alan === 'haric'){ r.haric = !!deger; if (r.haric) r.sec = false; }
  else if (alan === 'tur'){ r.tur = deger; if (deger !== 'gider') r.kategori = ''; if (!deger) r.sec = false; }
  else r[alan] = deger;
  tpCiz();
}
function tpHepsi(alan, deger){
  TOPLU.forEach(r => { if (r.haric || r.eksik.length) return;
    if (alan === 'tur' && deger === 'alis' && !r.ted) return;     // tedarikçisiz alış olmaz
    /* ⚠ CU · toplu dokunuş da hata kilidini açar (tpDegis ile aynı gerekçe) */
    if (r.sonuc && !tpKilitli(r)) r.sonuc = null;
    if (alan === 'sec') r.sec = deger && !!r.tur;
    else { r[alan] = deger; if (alan === 'tur' && deger !== 'gider') r.kategori = ''; }
  });
  tpCiz();
}
/* ⚠ CT · EKSİK TEDARİKÇİYİ FATURADAN OLUŞTUR
   Sahip 25 faturanın 17'sinde "önce tedarikçi ekle" duvarına çarpıyordu;
   oysa fatura hem unvanı hem VKN'yi taşıyor.
   ⚠ ÖNCE GÖSTER, SONRA OLUŞTUR: ne açılacağı tek tek listelenir ve onay
     alınır. Sessizce yedi kayıt açmak, sonradan temizlenmesi gereken
     bir defter bırakır.
   ⚠ UNVANI OKUNAMAYAN SATIRDA OLUŞTURULMAZ: yarım bir unvanla açılan
     tedarikçi, düzeltilmesi gereken bir kayıttır.
   ⚠ BAŞARISIZ OLURSA SATIR AÇILMAZ: yarısı açılmış bir tablo, hiç
     açılmamıştan kötü. ted YALNIZ sunucu onay verirse bağlanır. */
/* Kaydedilmiş / işletme dışı satır kilitlidir; hata alan satır DEĞİL —
   kullanıcı onu düzeltip tekrar deneyecek. */
function tpKilitli(r){ return r.sonuc === 'ok' || r.sonuc === 'işletme dışı'; }
function tpAcilacaklar(){
  const gorulen = new Set();
  return TOPLU.filter(r => {
    if (r.ted || tpKilitli(r) || r.haric) return false;
    if (r.esles === 'catisma') return false;          // karar kullanıcının
    if (!r.unvan) return false;                       // unvan okunamadı
    const k = r.kaynak.vkn || fuAnahtar(r.unvan);
    if (gorulen.has(k)) return false;                 // aynı firma bir kez
    gorulen.add(k); return true;
  });
}
async function tpTedarikciAc(hangi){

  if (!confirm('Şu tedarikçiler oluşturulacak:\n\n' + metin

  const btn = document.getElementById('tpTedBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'Oluşturuluyor...'; }
  let ok = 0; const hatalar = [];

    try{
      const { error } = await sb.rpc('rpc_tedarikci_kaydet', {

      if (error) throw new Error(error.message);
      ok++;
    }catch(e){ hatalar.push(r.unvan + ': ' + hataTr(e.message)); }
  }
  await katalogYukle();
  /* ⚠ BAĞLAMA KATALOGDAN YENİDEN YAPILIR: sunucu neyi kabul ettiyse o
     bağlanır. Hata alan firma listede kalır, satırı Alış'a AÇILMAZ. */
  TOPLU.forEach(r => {
    if (r.ted || tpKilitli(r)) return;
    const e = tedEslestir(r.kaynak.vkn, r.unvan || r.firma);
    if (e.durum === 'vkn') r.ted = e.ted;
    r.esles = e.durum;
  });
  tpCiz();
  mesaj('tpMsg', hatalar.length ? 'hata' : 'ok',
    ok + ' tedarikçi oluşturuldu'
    + (hatalar.length ? ' · ' + hatalar.length + ' hata: ' + hatalar.slice(0,2).join(' | ')
       + ' — bu satırlar Alış için açılmadı' : ''));
}
async function tpVknYaz(i){
  const r = tpBul(i); if (!r || !r.ted || !r.kaynak.vkn) return;
  if (!confirm('"' + r.ted.ad + '" kayıtlı ama VKN\'si boş.\n\nFaturadaki VKN '
      + r.kaynak.vkn + ' bu kayda yazılsın mı?\n\n(Yeni tedarikçi AÇILMAZ — kopya olmaz.)')) return;
  const { error } = await sb.rpc('rpc_tedarikci_kaydet', {
    p_id: r.ted.id, p_ad: r.ted.ad, p_unvan: r.ted.unvan || null,
    p_vergi_no: r.kaynak.vkn, p_vergi_dairesi: r.ted.vergi_dairesi || null,
    p_yetkili: r.ted.yetkili_ad || null, p_tel: r.ted.telefon || null,
    p_tel2: r.ted.telefon2 || null, p_email: r.ted.email || null, p_adres: r.ted.adres || null });
  if (error){ mesaj('tpMsg','hata', hataTr(error.message)); return; }
  await katalogYukle();
  TOPLU.forEach(x => { if (x.sonuc) return;
    const e = tedEslestir(x.kaynak.vkn, x.unvan || x.firma);
    if (e.durum === 'vkn') x.ted = e.ted; x.esles = e.durum; });
  tpCiz();
  mesaj('tpMsg','ok', r.ted.ad + ' kaydına VKN yazıldı — yeni tedarikçi açılmadı.');
}

/* ⚠ CU · KAYITTAN SONRA YENİDEN SINIFLANDIRMA.
   mutabakatCalistir'ın DB sorgusunun ve sınıflandırmasının AYNISI,
   yalnız verilen belge no'lar için. Amaç: "kaydettim" demek değil,
   "DB'de var mı, foto_path dolu mu" diye SORMAK. PDF metni yeniden
   okunmaz — MUTABAKAT nesneleri zaten elimizde, değişen tek şey
   durum/tur/kayit alanları. */
async function tpSiniflandir(nolar){
  const kume = [...new Set((nolar || []).filter(Boolean))];
  if (!kume.length) return;
  const hedef = MUTABAKAT.filter(x => x.belge_no && kume.includes(x.belge_no));
  if (!hedef.length) return;
  const [av, gv, hv] = await Promise.all([
    sb.from('alis').select('id,belge_no,tarih,toplam,foto_path,tedarikci(ad)')
      .eq('is_deleted', false).in('belge_no', kume),
    sb.from('gider').select('id,aciklama,tarih,tutar,foto_path').eq('is_deleted', false),
    sb.from('belge_haric').select('belge_no,neden').eq('is_deleted', false)
  ]);
  /* ⚠ YARIM SINIFLANDIRMA YAPILMAZ. Supabase hata dönerse data null
     gelir; sessizce devam edilse alisMap boş kalır ve HER satır
     "eksik" sınıflanırdı — yani bu turda düzelttiğimiz "Girilmemiş 25"
     ekranının birebir aynısı, üstelik sebebi görünmeden. Bir sorgu bile
     hatalıysa HİÇBİR durum değiştirilmeden atılır; çağıran yakalar. */
  const kotu = [av, gv, hv].find(r => r && r.error);
  if (kotu) throw new Error(kotu.error.message || 'sınıflandırma sorgusu başarısız');
  const haricMap = {}; ((hv && hv.data) || []).forEach(h =>
    { haricMap[(h.belge_no || '').toUpperCase()] = h.neden; });
  const alisMap = {}; ((av && av.data) || []).forEach(a =>
    { alisMap[(a.belge_no || '').toUpperCase()] = a; });
  const giderler = (gv && gv.data) || [];
  hedef.forEach(x => {
    if (haricMap[x.belge_no]){ x.durum = 'haric'; x.neden = haricMap[x.belge_no];
      x.kayit = null; x.tur = ''; return; }
    const a = alisMap[x.belge_no];
    const g = giderler.find(z => (z.aciklama || '').toUpperCase().includes(x.belge_no));
    const k = a || g;
    /* ⚠ Kayıt YOKSA 'eksik'e DOKUNULMAZ: sunucu hata verdiyse belge
       hâlâ girilmemiştir, panelde de öyle görünmeli. */
    if (!k){ x.durum = 'eksik'; x.kayit = null; x.tur = ''; return; }
    x.kayit = k; x.tur = a ? 'alis' : 'gider';
    /* Toplu giriş p_foto:null ile kaydediyor -> beklenen normal sonuç
       'belge_eklenecek'; belgeler "BELGESİ EKSİK" kutusuna düşer ve
       "n Belgeyi Kayıtlara Ekle" düğmesi çıkar. */
    x.durum = k.foto_path ? 'belgeli' : 'belge_eklenecek';
  });
}
async function tpKaydet(){
  const btn = document.getElementById('tpKaydet');
  const secilenler = TOPLU.filter(r => r.sec && tpKaydedilebilir(r));
  if (!secilenler.length) return;
  /* ⚠ İŞLETME DIŞI KALICI OLMALI: yalnız ekranda işaretlemek yetmez,
     bir sonraki mutabakatta yine "gözden kaçmış" diye çıkardı.
     belge_haric'e yazılır — tek tek akıştaki mekanizmanın aynısı
     (rpc_belge_haric_ekle), tek fark gerekçe BİR KEZ soruluyor. */
  const haricler = TOPLU.filter(r => r.haric && !r.sonuc && r.belge_no);
  let haricNeden = null;
  if (haricler.length){
    haricNeden = await nedenSor(haricler.length + ' belge işletme dışı işaretlendi',
      'Neden sisteme girilmiyor? (örn: şahsi harcama, ev interneti) — hepsi için tek gerekçe', 1);
    if (haricNeden === null) return;                       // vazgeçildi: hiçbir şey yapılmaz
    if (!haricNeden.trim()){ bildir('Gerekçe zorunlu.', 'hata'); return; }
  }
  btn.disabled = true;
  let ok = 0, haricOk = 0; const hatalar = [];
  for (const r of haricler){
    try{
      const { error } = await sb.rpc('rpc_belge_haric_ekle',
        { p_belge_no: r.belge_no, p_neden: haricNeden.trim() });
      if (error) throw new Error(error.message);
      r.sonuc = 'işletme dışı'; haricOk++;
    }catch(e){ hatalar.push((r.belge_no||'') + ' (işletme dışı): ' + hataTr(e.message)); }
  }
  for (let n = 0; n < secilenler.length; n++){
    const r = secilenler[n];
    btn.textContent = `Kaydediliyor ${n+1}/${secilenler.length}...`;
    try{
      /* ⚠ TEK TEK ve DOĞRUDAN sb.rpc: rpcCagir tek düğme/tek mesaj
         varsayıyor, döngüde her satırda düğmeyi geri boyardı. Hata
         yutulmuyor — satıra yazılıyor ve döngü devam ediyor. */
      const p = r.tur === 'alis'
        ? ['rpc_alis_kaydet', {
            p_idem: await idemKararli('alis', [AKTIF_SUBE, r.belge_no || '', r.tutar]),
            p_sube: AKTIF_SUBE, p_tedarikci: r.ted.id, p_tarih: r.tarih, p_tur: 'fatura',
            p_belge_no: r.belge_no, p_fis_no: null, p_toplam: r.tutar,
            p_kdv_orani: null, p_kdv_tutar: r.kdv, p_kdv_kirilim: [], p_kdv_dahil: true,
            p_ocr_ham: null, p_ocr_model: null, p_foto: null,
            p_not: 'toplu giriş', p_kalemler: [],
            p_odendi: false, p_odeme_yontem: null, p_vade: null,
            p_cek_no: null, p_cek_vade: null }]
        : ['rpc_gider_kaydet', {
            p_idem: await idemKararli('gider', [AKTIF_SUBE, r.tarih, r.kategori, r.tutar, false]),
            p_sube: AKTIF_SUBE, p_tarih: r.tarih, p_kategori: r.kategori,
            p_aciklama: (r.firma || '') + ' · ' + (r.belge_no || ''),
            p_tutar: r.tutar, p_kdv_orani: null, p_kdv_tutar: r.kdv, p_foto: null,
            p_kasadan: false, p_tedarikci: r.ted ? r.ted.id : null, p_vade: null }];
      const { data, error } = await sb.rpc(p[0], p[1]);
      if (error) throw new Error(error.message);
      if (!data || !data.ok) throw new Error('sunucu onay vermedi');
      r.sonuc = 'ok'; r.sec = false; ok++;
    }catch(e){
      const m = hataTr(e.message);
      r.sonuc = m; hatalar.push((r.belge_no || r.firma) + ': ' + m);
    }
  }
  const atlanan = haricOk;
  const eksikli = TOPLU.filter(x => x.eksik.length).length;
  /* ⚠ CU · ÜST PANEL DE TAZELENİR.
     Ölçüldü: dört fatura kaydedildi, satırlarda yeşil "kaydedildi"
     rozeti çıktı ama üstteki "Karşılaştırma Sonucu" hâlâ
     "Portaldan gelen 4 · Sistemde var 0 · Girilmemiş 4" ve kırmızı
     "SİSTEME GİRİLMEMİŞ (4)" diyordu — kullanıcı kaydın girmediğini
     sandı. Sebep: mutabakatCiz() MUTABAKAT dizisinden okuyor, o dizi
     kaydetmeden sonra hiç güncellenmiyordu.
     ⚠ YEREL İYİMSER YAMA YOK: "kaydettim, demek ki var" denmiyor.
       Kayıt gerçekten var mı, foto_path dolu mu — DB söylüyor.
       PDF'ler TEKRAR OKUNMUYOR (yavaş, üstelik dosya girdisi ekranda
       durmayabilir); yalnız sınıflandırma sorgusu, YALNIZ bu turda
       dokunulan belge no'lar için tekrarlanıyor. */
  /* ⚠ TAZELEME ÇÖKERSE KAYIT YİNE DURUYOR. Bu blok korumasızken bir ağ
     hatası fonksiyonu burada öldürüyordu: tpCiz() çalışmaz, düğme
     "Kaydediliyor 25/25..." yazısıyla disabled kalır, mesaj hiç
     yazılmazdı — kayıtlar DB'ye GİRMİŞ olduğu hâlde kullanıcı
     girmediğini sanardı. Artık ekran her hâlükârda geri geliyor. */
  let tazeHata = null, belgeOk = 0; const belgeHata = [];
  try{
    const dokunulan = [...secilenler, ...haricler].map(r => r.belge_no).filter(Boolean);
    await tpSiniflandir(dokunulan);
    /* ⚠ CX · PDF DE BURADA BAGLANIR. Kullanicinin sikayeti buydu:
       "faturaları yüklüyorum PDF'leri kaydetmiyor". Kayit aciliyordu,
       belge ayri bir dugmede kaliyordu; kullanici o adimi bilmiyor ya
       da unutuyordu, sayfayi yenileyince PDF'ler bellekten gidiyor ve
       zip'i bastan yuklemek gerekiyordu. 25 faturalik bir turda bu 25
       belgesiz kayit demekti.
       ⚠ SIRA KORUNUYOR: kayit ONCE acildi (yukaridaki dongu), belge
         SONRA baglaniyor. Tersi olsaydi rpc patladiginda depoda
         sahipsiz dosya kalirdi.
       ⚠ KAYIT ID'SI DB'DEN: tpSiniflandir kaydi sunucudan okuyup
         x.kayit'a yazdi. rpc'nin donus govdesinde id VARSAYMIYORUZ —
         "kaydettim, demek ki su id" demek yerine DB soyluyor.
       ⚠ Yalniz bu turda dokunulan ve dosyasi HALA ELDE olan satirlar.
         Sayfa yenilendiyse x.dosya yok; o satir "belgesi eksik"
         kutusunda kalir ve dugmeyle baglanir. */
    /* ⚠ SAYIM ONCE: dugme "7/25" diyebilmek icin toplami bilmeli, ve o
       toplam SECILEN satir sayisi degil GERCEKTEN YUKLENECEK satir
       sayisidir (zaten belgeli olan ya da dosyasi elde olmayan sayilmaz). */
    const baglanacak = MUTABAKAT.filter(x => x.durum === 'belge_eklenecek'
      && x.belge_no && dokunulan.includes(x.belge_no) && x.dosya && x.kayit);
    /* ⚠ 25 fatura ~5 MB; telefonda bu 30 saniyeyi gecebiliyor. Ilerleme
       yazilmazsa dugme "Kaydediliyor 25/25..." de donmus gorunur,
       kullanici asili kaldi sanip sayfayi kapatir ve belgeler
       BAGLANMADAN gider — duzeltmeye calistigimiz sikayetin ta kendisi.
       Desen kayit dongusunun AYNISI. */
    for (let n = 0; n < baglanacak.length; n++){
      const x = baglanacak[n];
      btn.textContent = `Belgeler bağlanıyor ${n+1}/${baglanacak.length}...`;
      try{ await belgeBagla(x); belgeOk++; }
      catch(e){ belgeHata.push(x.belge_no + ': ' + hataTr(e.message)); }
    }
    mutabakatCiz();
    /* ⚠ HATA ALAN SATIRIN SEÇİMLERİ KAYBOLMAZ: tpKur tabloyu sıfırdan
       kuruyor; kullanıcının girdiği tür/kategori ve hata metni belge
       no üzerinden geri yazılır — yoksa düzeltip tekrar denemek için
       her şeyi baştan seçmesi gerekirdi. */
    const onceki = {};
    TOPLU.forEach(r => { if (r.belge_no) onceki[r.belge_no] =
      { tur:r.tur, kategori:r.kategori, sonuc:r.sonuc, haric:r.haric, sec:r.sec,
        /* ⚠ CY · ELLE YAZILAN KDV DE KORUNUR: tpKur satiri sifirdan
           kuruyor ve okunan (yanlis) rakama geri donerdi. */
        kdv:r.kdv, kdvDurum:r.kdvDurum, kdvNot:r.kdvNot, kdvKontrol:r.kdvKontrol }; });
    tpKur(MUTABAKAT.filter(x => x.durum === 'eksik'));
    TOPLU.forEach(r => { const o = r.belge_no && onceki[r.belge_no]; if (!o) return;
      r.tur = o.tur; r.kategori = o.kategori; r.haric = o.haric;
      r.kdv = o.kdv; r.kdvDurum = o.kdvDurum; r.kdvNot = o.kdvNot; r.kdvKontrol = o.kdvKontrol;
      /* 'ok' geri yazılmaz: o satır zaten tablodan düştü. Kalan satırda
         duran şey HATA metnidir, kullanıcı onu görmeli. */
      if (o.sonuc && o.sonuc !== 'ok' && o.sonuc !== 'işletme dışı') r.sonuc = o.sonuc;
      r.sec = o.sec && tpKaydedilebilir(r);
    });
  }catch(e){ tazeHata = hataTr(e.message); }
  tpCiz();
  mesaj('tpMsg', hatalar.length ? 'hata' : ((tazeHata || belgeHata.length) ? 'uyari' : 'ok'),
    ok + ' kaydedildi'
    /* ⚠ IKI SAYI AYRI: kayit girdi ama belge girmediyse kullanici BUNU
       BILMELI. Tek sayida birlestirmek "hepsi tamam" izlenimi verirdi. */
    + (belgeOk ? ' · ' + belgeOk + ' belge bağlandı' : '')
    + (belgeHata.length ? ' · ' + belgeHata.length + ' belge bağlanamadı (kayıtlar duruyor, '
        + '"Belgeyi Kayıtlara Ekle" ile tekrar dene): ' + belgeHata[0] : '')
    + (hatalar.length ? ' · ' + hatalar.length + ' hata: ' + hatalar.slice(0,3).join(' | ') : '')
    + (atlanan ? ' · ' + atlanan + ' işletme dışı işaretlendi (bir daha sorulmaz)' : '')
    + (eksikli ? ' · ' + eksikli + ' eksik okundu (tek tek gir)' : '')
    /* ⚠ "kaydedilemedi" DENMEZ — kayıt olmuştur. Yalan uyarı kullanıcıyı
       ikinci kez girmeye zorlar; söylenen tek şey panelin bayat olduğu. */
    + (tazeHata ? ' · üst panel tazelenemedi (bağlantı) — "Belgeleri Oku ve Karşılaştır"'
                + ' düğmesine tekrar basınca doğrusunu görürsün' : ''));
}

async function mutabakatCalistir(){
  const btn = document.getElementById('mtBtn');
  const drm = document.getElementById('mtDurum');
  const yaz = (t,s)=>{ drm.className='oku-durum '+(s||''); drm.textContent=t; };
  /* Hangi işletmenin portalından indirildiği ARTIK SORULUYOR.
     Eskiden faturanın metninde TCKN aranarak tahmin ediliyordu; o sabit
     güvenlik gereği kaldırıldı. Yanlış ZIP yüklenirse LTD faturaları
     şahıs defterine karışır — bu yüzden tahmin değil soru.
     Bedel: ZIP başına BİR onay. Ekran zaten owner'a özel. */
  if (!confirm('Bu ZIP hangi portaldan indirildi?\n\n'
      + 'TAMAM  → KTÜ şahıs şirketinin portalı (devam et)\n'
      + 'İPTAL  → başka bir işletmenin portalı / emin değilim (durdur)\n\n'
      + 'Yanlış portalın zipi yüklenirse başka işletmenin faturaları '
      + 'bu deftere karışır.')){
    document.getElementById('mtDurum').className = 'oku-durum uyari';
    document.getElementById('mtDurum').textContent =
      'Durduruldu — doğru portalın zip dosyasıyla tekrar dene.';
    return;
  }
  btn.disabled = true; MUTABAKAT = [];
  document.getElementById('mtSonuc').innerHTML = '';
  try{
    const pdfler = await mutabakatDosyalari();
    yaz(`${pdfler.length} belge bulundu, okunuyor...`, '');
    for (let i=0; i<pdfler.length; i++){
      const f = pdfler[i];
      yaz(`Okunuyor ${i+1}/${pdfler.length} — ${f.name.slice(0,40)}`, '');
      const kayit = { dosya:f, ad:f.name };
      try{
        const c = await pdfMetinCikar(f);
        kayit.metin = c.metin;
        const t = c.metin;
        // Belge no: önce dosya adından (portal "FATURANO_VKN_FIRMA.pdf" verir), yoksa metinden
        const adNo = (f.name.match(/^([A-Z0-9]{10,20})_/i)||[])[1];
        const metinNo = (t.match(/Fatura\s*No\s*:?\s*([A-Z0-9]{10,20})/i)||[])[1]
                     || (t.match(/FATURA\s*ID\s*:?\s*([A-Z0-9]{10,20})/i)||[])[1];
        kayit.belge_no = (adNo || metinNo || '').toUpperCase() || null;
        /* ⚠ CS · TUTAR/KDV/FIRMA/VKN DE OKUNUYOR (toplu giriş için).
           Ölçüldü, 25 gerçek e-fatura: belge no 25/25 · firma 25/25 ·
           VKN 25/25 · tutar 25/25 · tarih 24/25 · KDV 21/25.
           Aşağıdaki iki satır bu okumanın ÜSTÜNE yazar; eski
           firma/tarih çıkarımı yedek olarak altta duruyor. */
        Object.assign(kayit, faturaAlanlari(f.name, t));
        /* Alıcı kontrolü ARTIK OTOMATİK DEĞİL. Eskiden belgenin metninde
           işletme sahibinin TCKN'si aranıyordu; o sabit kaldırıldı.
           Eşleşmeyen fatura sessizce "başka alıcı" kutusuna düşüyordu ve
           kimse bakmıyordu — şimdi normal sınıflandırmaya giriyor, yani
           "SİSTEME GİRİLMEMİŞ" listesinde görünüp karar bekliyor.
           Bize ait olmayan bir belge çıkarsa "İşletme dışı" ile dışlanır. */
        /* ⚠ ESKI FIRMA CIKARIMI YEDEĞE DÜŞTÜ: metnin ilk satırı çoğu
           faturada başlık çöpü ("FATURA ID Fatura Tarihi ...") — ölçüldü.
           Dosya adından gelen firma 25/25 doğru; o yoksa buraya düşülür. */
        if (!kayit.firma) kayit.firma = t.split('\n')[0].slice(0,40);
        if (!kayit.tarih) kayit.tarih = (t.match(/(?:Fatura\s*)?Tarihi?\s*:?\s*(\d{2}\s?[-.\/]\s?\d{2}\s?[-.\/]\s?\d{4})/i)||[])[1] || null;
      }catch(e){ kayit.hata = e.message; }
      MUTABAKAT.push(kayit);
    }
    // Sistemde ne var: alış belge_no + gider açıklamasındaki belge no
    const nolar = MUTABAKAT.map(x=>x.belge_no).filter(Boolean);
    const [av, gv] = await Promise.all([
      sb.from('alis').select('id,belge_no,tarih,toplam,foto_path,tedarikci(ad)')
        .eq('is_deleted',false).in('belge_no', nolar.length?nolar:['-']),
      sb.from('gider').select('id,aciklama,tarih,tutar,foto_path').eq('is_deleted',false)
    ]);
    // Bilerek girilmeyenler (şahsi harcama vb) "eksik" sayılmasın
    const { data: hd } = await sb.from('belge_haric').select('belge_no,neden').eq('is_deleted',false);
    const haricMap = {}; (hd||[]).forEach(h=>{ haricMap[(h.belge_no||'').toUpperCase()] = h.neden; });
    const alisMap = {}; (av.data||[]).forEach(a=>{ alisMap[(a.belge_no||'').toUpperCase()] = a; });
    const giderler = gv.data || [];
    MUTABAKAT.forEach(x=>{
      if (x.hata){ x.durum='hata'; return; }
      /* Otomatik "baska_alici" ayıklaması kaldırıldı (TCKN sabiti gitti).
         Artık her belge normal sınıflandırmadan geçiyor; bize ait olmayan
         bir belge "girilmemiş" olarak görünür ve operatör "İşletme dışı"
         diyerek gerekçesiyle dışlar. Sessiz eleme yerine görünür karar. */
      if (x.belge_no && haricMap[x.belge_no]){ x.durum='haric'; x.neden=haricMap[x.belge_no]; return; }
      const a = x.belge_no ? alisMap[x.belge_no] : null;
      const g = x.belge_no ? giderler.find(z => (z.aciklama||'').toUpperCase().includes(x.belge_no)) : null;
      const k = a || g;
      if (!k){ x.durum='eksik'; return; }
      x.kayit = k; x.tur = a ? 'alis' : 'gider';
      x.durum = k.foto_path ? 'belgeli' : 'belge_eklenecek';
    });
    yaz(`${MUTABAKAT.length} belge okundu.`, 'ok');
    mutabakatCiz();
    /* CS · Toplu tablo YALNIZ sisteme girilmemiş belgelerle kurulur;
       zaten kayıtlı olanlar yukarıdaki kutularda duruyor — aynı zip
       ikinci kez yüklenirse bu tablo boş gelir. */
    tpKur(MUTABAKAT.filter(x => x.durum === 'eksik'));
    await tpGecmisYukle();
    tpCiz();
  }catch(e){
    yaz('Hata: ' + hataTr(e.message), 'uyari');
  }finally{ btn.disabled = false; }
}

/* ⚠ CX · TEK YUKLEME YOLU. Bu is iki yerden yapiliyor: toplu girisin
   kendi icinden (kayit acilir acilmaz) ve "n Belgeyi Kayitlara Ekle"
   dugmesinden. Ayni isi ikinci kez baska turlu yazmak, iki yolun
   zamanla ayrismasi demekti — desen buraya cikarildi, iki yer de
   burayi cagiriyor.
   ⚠ SIRA: kayit ONCE acilmis olmali. Once yukleyip sonra kayit
     acsaydik, kayit patladiginda depoda SAHIPSIZ dosya kalirdi.
     Bu sirada yukleme patlarsa satir "belgesi eksik" kalir —
     kurtarilabilir hal budur, dugme yerinde duruyor.
   Basarisizlikta ATAR; cagiran yakalar ve sayar. */
async function belgeBagla(x){
  const yol = `fatura/${bugun()}_${crypto.randomUUID()}.pdf`;
  const { error: ue } = await sb.storage.from('belgeler')
    .upload(yol, x.dosya, { upsert:false, contentType:'application/pdf' });
  if (ue) throw new Error(ue.message);
  const tablo = x.tur === 'alis' ? 'alis' : 'gider';
  const { error: ge } = await sb.from(tablo).update({ foto_path: yol }).eq('id', x.kayit.id);
  if (ge) throw new Error(ge.message);
  x.durum = 'belgeli'; x.kayit.foto_path = yol;
  return yol;
}
async function mutabakatBelgeEkle(){
  const liste = MUTABAKAT.filter(x=>x.durum==='belge_eklenecek');
  if (!liste.length) return;
  if (!confirm(`${liste.length} belge kayıtlarına eklenecek.\n\nDevam edilsin mi?`)) return;
  const btn = document.getElementById('mtEkleBtn'); if(btn) btn.disabled = true;
  let ok = 0; const hatalar = [];
  for (const x of liste){
    try{ await belgeBagla(x); ok++; }
    catch(e){ hatalar.push(`${x.belge_no}: ${hataTr(e.message)}`); }
  }
  if(btn) btn.disabled = false;
  mutabakatCiz();
  mesaj('mtMsg', hatalar.length ? 'hata' : 'ok',
    `${ok} belge eklendi ✓` + (hatalar.length ? ` · ${hatalar.length} hata: ${hatalar[0]}` : ''));
}
/* Bilerek girilmeyecek belgeyi işaretle — bir daha "eksik" diye uyarmasın */
async function mutabakatHaric(no){
  const x = MUTABAKAT.find(z=>z.belge_no===no); if(!x) return;
  const neden = await nedenSor(`${no} — ${x.firma||''}`, 'Neden sisteme girilmiyor? (örn: ev interneti, şahsi harcama)', 1);
  if (neden === null) return;
  if (!neden.trim()){ bildir('Neden yazmak zorunlu — sonradan niye atlandığını bilmen gerekir.', 'hata'); return; }
  /* v84 · H-51 · RPC'ye taşındı.
     Kaydın ÇERÇEVESİ ölçüldü ve H-51'in ilk hâli iki noktada fazla
     genişti: `trg_audit_belge_haric` ZATEN vardı (denetim izi düşüyordu)
     ve politikalar personele yalnız SELECT veriyordu (RLS kapıyı tutuyordu).
     Kalan gerçek kazanç DAR ama gerçek: `giren_id` istemciden geliyordu
     (`PROFIL.id`). Denetim izinin "kim" alanı, istemcinin söylediği şey
     olamaz — artık sunucuda `auth.uid()`.
     `ux_belge_haric` mükerrer koruması DEĞİŞMEDİ; ihlal aynı kısıt adıyla
     yukarı çıkıyor ve `hataTr` onu çeviriyor. */
  const { error } = await sb.rpc('rpc_belge_haric_ekle', {
    p_sube: AKTIF_SUBE, p_belge_no: no,
    p_firma: (x.firma||'').slice(0,80), p_neden: neden.trim() });
  if (error){ bildir('Kaydedilemedi: ' + hataTr(error.message), 'hata'); return; }
  x.durum = 'haric'; x.neden = neden.trim();
  mutabakatCiz();
  mesaj('mtMsg','ok', `${no} işletme dışı olarak işaretlendi — bir daha uyarmayacak.`);
}

/* BL · Acik vadeler gider formuna. Olculdu: rpc_gider_kaydet'te p_vade yoktu,
   vadeyi otomatik kapatan tetik yok — kira odenince vade "gecti" kalmaya devam

let GD_VADELER = [];
async function gdVadeDoldur(){
  const s = document.getElementById('gdVade'); if (!s) return;

    .select('id,aciklama,vade_tarihi,tutar').eq('durum','acik')

  s.onchange = () => {
    const v = GD_VADELER.find(x => x.id === s.value);
    const t = document.getElementById('gdTutar');
    if (v && v.tutar != null && t && paraDeger('gdTutar') === 0)
      t.value = (+v.tutar).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
    gdVadeFark();

       islemdir; disarida birakmak ikinci mesru kaydi engellerdi.

/* v65 · H-18 · GİDER SİLME
   Ham `.update({is_deleted:true})` YOK — iz bırakmayan finansal
   değişiklik bu turlarda kapatmaya çalıştığımız şeyin ta kendisi.
   Kanal: rpc_gider_sil (owner-only, gerekçe zorunlu, soft delete,
   audit_log'a otomatik iz, v61 dönem kilidi).

   ÇİFT TIKLAMA KİLİDİ: düğme anında pasifleşir. RPC ikinci çağrıyı
   zaten KAYIT_YOK ile reddediyor (arka duvar), ama operatör "olmadı"
   sanıp tekrar basmasın diye ön tarafta da kilit var. */
async function giderSil(id, tutarMetni){
  const btn = document.getElementById('gsil_' + id);
  if (btn && btn.disabled) return;

  const neden = await nedenSor('Bu gider kaydı neden siliniyor?',
    'Gerekçe zorunlu ve kayda geçer (denetim izine yazılır).\n' +
    'Örnek: "aynı tutar parça parça ayrıca girilmiş, bu toplu kayıt fazla"', 1);
  if (!neden || !neden.trim()){
    if (neden !== null) bildir('Gerekçe boş olamaz — silinmedi.', 'hata');
    return;
  }
  /* v70 · H-29 · Eski metin "bu kadar DEĞİŞİR" diyordu ama hiçbir rakama
     işaret etmiyordu — cümle eksik kalmıştı. Silinecek tutar artık metinde. */
  if (!await onaySor('Kayıt silinecek (geri alınabilir işaretleme, veri kaybolmaz).',
             'Tutar: ' + (tutarMetni || '(bilinmiyor)') + '\n'
             + 'Aylık kâr ve beyana giden rakam BU KADAR ARTAR.\n\nDevam?', 'Sil')) return;

  if (btn){ btn.disabled = true; btn.textContent = '…'; }
  const { error } = await sb.rpc('rpc_gider_sil', { p_id:id, p_neden:neden.trim() });
  if (error){
    if (btn){ btn.disabled = false; btn.textContent = 'Sil'; }
    bildir('Silinemedi: ' + hataTr(error.message), 'hata');
    return;
  }
  vGider();
}

  if (kdv !== undefined && kdv !== null && kdv !== '') tEl.dataset.elle = '1';
  const hesapla = ()=>{
    if (tEl.dataset.elle === '1') return;
    const m = paraOku(document.getElementById('alKdvM_'+n)).deger;
    const o = +document.getElementById('alKdvO_'+n).value || 0;
    tEl.value = m > 0 ? (m * o/100).toFixed(2) : '';
  };
  paraBagla(document.getElementById('alKdvM_'+n), ()=>{ hesapla(); alHesapla(); });
  paraBagla(tEl, alHesapla);

function alKdvOku(){

    if (!pm.ok || !pt.ok) throw new Error('KDV satırında geçersiz tutar var — örnek: 2239,60');
    if (pm.deger > 0 || pt.deger > 0)
      sonuc.push({ oran:+document.getElementById('alKdvO_'+n).value, matrah:pm.deger, kdv_tutar:pt.deger });
  });

/* KDV dökümünde matrah boş kalmışsa KDV'den geri hesapla.
   Fatura çoğu zaman KDV tutarını yazar, matrahı ayrı sütunda vermez.
   Matrah boş kalınca satır karşılaştırması "0'a eşit değil" deyip ürünleri engelliyordu.
   Kesin dayanak: toplam − KDV toplamı = toplam matrah. Oran bazlı dağıtım kdv/oran ile,
   yuvarlama farkı en büyük satıra yazılır. */
function alMatrahTamamla(){
  const sat = [];
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    sat.push({ n, oran:+document.getElementById('alKdvO_'+n).value || 0,
               mEl:document.getElementById('alKdvM_'+n), tEl:document.getElementById('alKdvT_'+n) });
  });
  if (!sat.length) return 0;
  const kdvOf = s => paraOku(s.tEl).deger;
  const bos = sat.filter(s => paraOku(s.mEl).deger === 0 && kdvOf(s) > 0 && s.oran > 0);
  if (!bos.length) return 0;
  bos.forEach(s => { s.tahmin = +(kdvOf(s) / (s.oran/100)).toFixed(2); });
  const pT = paraOku(document.getElementById('alToplam'));
  if (pT.ok && pT.deger > 0){
    const kdvT = sat.reduce((a,s)=>a+kdvOf(s),0);
    const dolu = sat.filter(s=>!bos.includes(s)).reduce((a,s)=>a+paraOku(s.mEl).deger,0);
    const hedef = +(pT.deger - kdvT - dolu).toFixed(2);
    const tahminT = bos.reduce((a,s)=>a+s.tahmin,0);
    const fark = +(hedef - tahminT).toFixed(2);
    // Sadece yuvarlama düzeyindeki farkı kapat; büyük sapmada dokunma (veri yanlıştır)
    if (hedef > 0 && Math.abs(fark) <= Math.max(1, hedef*0.02)){
      const enBuyuk = bos.reduce((a,b)=> a.tahmin >= b.tahmin ? a : b);
      enBuyuk.tahmin = +(enBuyuk.tahmin + fark).toFixed(2);
    }
  }
  bos.forEach(s => { s.mEl.value = String(s.tahmin).replace('.', ','); s.mEl.classList.add('oku-dolu'); });
  alHesapla();
  return bos.length;
}
function alHesapla(){
  let kdv = 0, matrah = 0, gecerli = true;
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const pm = paraOku(document.getElementById('alKdvM_'+n));
    const pt = paraOku(document.getElementById('alKdvT_'+n));
    if (!pm.ok || !pt.ok) gecerli = false;
    matrah += pm.deger; kdv += pt.deger;
  });
  kdv = +kdv.toFixed(2); matrah = +matrah.toFixed(2);
  const el = document.getElementById('alKdvToplam'); if(el) el.textContent = tl(kdv);
  const pT = paraOku(document.getElementById('alToplam'));
  const toplam = pT.deger;
  const tut = document.getElementById('alTutarlilik'); if(!tut) return;
  if (!gecerli || !pT.ok){
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--hata)">Geçersiz tutar var — örnek: 3750,00</div>`; return;
  }
  if (toplam === 0 || kdv === 0){ tut.innerHTML = ''; return; }
  // Matrah + KDV = ödenecek tutar mı? (belgenin kendi aritmetiği)
  const fark = +(matrah + kdv - toplam).toFixed(2);
  if (Math.abs(fark) <= 0.05){
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--ok)">✓ Matrah ${tl(matrah)} + KDV ${tl(kdv)} = ${tl(toplam)} — belge tutuyor</div>`;
  } else {
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--uyari)">⚠ Matrah ${tl(matrah)} + KDV ${tl(kdv)} = ${tl(matrah+kdv)},
      ödenecek tutar ${tl(toplam)} — <b>${fark>0?'+':''}${tl(fark)}</b> fark var. Belgeyle karşılaştır.</div>`;
  }
}
/* ===== e-FATURA PDF'İNDEN METİN ÇIKARMA =====
   Luca portalından inen e-fatura PDF'leri METİN tabanlı. Fotoğraf çekip okutmak yerine
   metni doğrudan çıkarırız: rakamlar birebir doğru, Türkçe karakter bozulmaz, maliyet düşük.
   Metin çıkmazsa (taranmış PDF) fotoğraf yoluna düşeriz. */
function pdfHazir(){
  const L = window.pdfjsLib;
  if (!L) return null;
  if (!L.GlobalWorkerOptions.workerSrc)
    L.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  return L;
}
async function pdfMetinCikar(file){
  const L = pdfHazir();
  if (!L) throw new Error('PDF okuyucu yüklenemedi — internet bağlantısını kontrol et.');
  const buf = await file.arrayBuffer();
  const pdf = await L.getDocument({ data: buf }).promise;
  const sayfalar = [];
  const enFazla = Math.min(pdf.numPages, 10);            // fatura 1-2 sayfa; kaçak dosyaya karşı sınır
  for (let i = 1; i <= enFazla; i++){
    const sy = await pdf.getPage(i);
    const ic = await sy.getTextContent();
    // Satır satır topla: aynı y'deki parçalar tek satır olsun (sütun hizası korunsun)
    const satirlar = new Map();
    ic.items.forEach(it => {
      if (!it.str) return;
      const y = Math.round(it.transform[5]);
      if (!satirlar.has(y)) satirlar.set(y, []);
      satirlar.get(y).push({ x: it.transform[4], s: it.str });
    });
    const metin = [...satirlar.entries()]
      .sort((a,b) => b[0] - a[0])                        // yukarıdan aşağı
      .map(([,p]) => p.sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim())
      .filter(Boolean).join('\n');
    sayfalar.push(metin);
  }
  const tam = sayfalar.join('\n\n--- SAYFA ---\n\n').trim();
  return { metin: tam, sayfa: pdf.numPages, yeterli: tam.length >= 200 };
}

function alTedarikciEslestir(ocrAd, ocrVkn){
  const norm = s => (s||'').toString().toUpperCase()
    .replace(/[İI]/g,'I').replace(/[ŞS]/g,'S').replace(/[ĞG]/g,'G')
    .replace(/[ÜU]/g,'U').replace(/[ÖO]/g,'O').replace(/[ÇC]/g,'C')
    .replace(/[^A-Z0-9]/g,'');
  const liste = KATALOG.tedarikciler || [];
  const vkn = (ocrVkn||'').replace(/\D/g,'');
  if (vkn){
    const v = liste.find(t => (t.vergi_no||'').replace(/\D/g,'') === vkn);
    if (v) return { t:v, nasil:'VKN' };
  }
  const a = norm(ocrAd);
  if (a.length >= 4){
    const t = liste.find(x => { const y = norm(x.unvan||x.ad);
      return y.length>=4 && (y.startsWith(a.slice(0,8)) || a.startsWith(y.slice(0,8))); });
    if (t) return { t, nasil:'isim' };
  }
  return { t:null, nasil:null };

let AL_SATIRLAR = [];
const birimNorm = s => (s||'').toString().toUpperCase().replace(/\s+/g,' ').trim();

async function alSatirlariKur(satirlar, tedarikciId){
  AL_SATIRLAR = [];
  const kap = document.getElementById('alSatirlar'); if(!kap) return;
  if (!Array.isArray(satirlar) || !satirlar.length){ kap.innerHTML=''; return; }
  let alias = [];
  if (tedarikciId){
    const { data } = await sb.from('urun_alias')
      .select('tedarikci_kodu,ham_ad,urun_id,birim_carpani')
      .eq('tedarikci_id', tedarikciId).eq('is_deleted', false);
    alias = data || [];
  }
  satirlar.forEach((s,i)=>{
    const kod = (s.kod||'').toString().trim();
    let es = null, nasil = null;
    if (kod){
      es = alias.find(a => (a.tedarikci_kodu||'').trim().toUpperCase() === kod.toUpperCase());
      if (es) nasil = 'kod';
    }
    if (!es){
      es = alias.find(a => birimNorm(a.ham_ad) === birimNorm(s.ad));
      if (es) nasil = 'isim';
    }
    // İSKONTO DÜZELTMESİ — modelin aritmetiğine güvenme.
    // Fatura iskonto ORANINI yazıyor; satır tutarına brüt yazılmışsa net'i BİZ hesaplarız.
    // Uydurma değil: belgede yazan oranı belgede yazan brüte uygularız, sonra matrahla doğrularız.
    const miktar = +s.miktar||0, liste = +s.birim_fiyat||0;
    const brut   = +(miktar * liste).toFixed(2);
    const iskO   = +s.iskonto_orani || 0;
    let   net    = +s.satir_tutar || 0;
    let   iskT   = s.iskonto_tutar != null ? +s.iskonto_tutar : null;
    let   duzeltme = null;
    if (brut > 0 && Math.abs(net - brut) <= 0.05){          // satır tutarı = brüt (iskonto uygulanmamış)
      if (iskO > 0){
        net  = +(brut * (1 - iskO/100)).toFixed(2);
        iskT = +(brut - net).toFixed(2);
        duzeltme = `%${iskO} iskonto uygulandı`;
      } else if (iskT > 0){
        net  = +(brut - iskT).toFixed(2);
        duzeltme = `${tl(iskT)} iskonto düşüldü`;
      }
    }
    if (iskT == null && iskO > 0 && brut > net) iskT = +(brut - net).toFixed(2);
    // Paketleme çakışması: hafızadaki çarpan ile faturadan okunan farklıysa hafıza esas, ama HABER VER
    const ocrPaket = +s.paket_ici_adet || 0;
    const carpan   = es ? +es.birim_carpani : (ocrPaket || 1);
    const paketCakisma = (es && ocrPaket > 0 && Math.abs(ocrPaket - carpan) > 0.001) ? ocrPaket : null;

    AL_SATIRLAR.push({
      i, ham_ad:(s.ad||'').toString().trim(), ham_kod:kod||null,
      miktar, birim:(s.birim||'').toString().trim()||null,
      birim_fiyat:liste, satir_tutar:net, brut,
      iskonto_orani: iskO || null, iskonto_tutar: iskT,
      kdv_orani:s.kdv_orani ?? null,
      carpan, paketCakisma, duzeltme,
      urun_id: es ? es.urun_id : null, eslesme: nasil,
      karar: es ? 'mevcut' : 'yeni'
    });
  });
  // Kodsuz tedarikçide (BİM gibi termal fiş) aynı ürün her fişte başka okunuyor.
  // İlk kez görünen satırlar için benzer ürünleri getir — sistem karar VERMEZ, önerir.
  const yeniler = AL_SATIRLAR.filter(s => s.karar === 'yeni' && s.ham_ad.length >= 4);
  if (yeniler.length){
    await Promise.all(yeniler.map(async s => {
      try{
        const { data } = await sb.rpc('rpc_urun_benzer',
          { p_ham_ad: s.ham_ad, p_tedarikci: tedarikciId || null, p_limit: 4 });
        s.benzer = Array.isArray(data) ? data : [];
      }catch(e){ s.benzer = []; }
    }));
  }
  alSatirCiz();
}

        × ${tl(s.birim_fiyat)}${iskNot} = <b>${tl(s.satir_tutar)}</b>${s.kdv_orani!=null?' · %'+s.kdv_orani:''}${carpanNot}${duzNot}${gizliIsk}${paketNot}</div>
      ${(s.benzer&&s.benzer.length&&s.karar==='yeni') ? `<div class="bilgi-not" style="color:var(--uyari);margin:0 0 6px">
        ⚠ Bu ürün zaten kayıtlı olabilir — <b>aynıysa aşağıdan seç</b>, yeni açma:
        ${s.benzer.map(b=>`<br>• <b>${esc(b.kod||'')} ${esc(b.ad)}</b> (%${Math.round(b.skor*100)} benzer)`).join('')}</div>` : ''}
      <select id="fsU_${s.i}" onchange="alSatirKarar(${s.i})">

          ${s.benzer.map(b=>`<option value="${b.urun_id}"${s.urun_id===b.urun_id?' selected':''}>${esc(b.kod||'')} — ${esc(b.ad)} · %${Math.round(b.skor*100)}</option>`).join('')}

        <optgroup label="Tüm ürünler">

function alSatirKarar(i){
  const s = AL_SATIRLAR.find(x=>x.i===i); if(!s) return;
  const v = document.getElementById('fsU_'+i).value;
  if (v === '__yeni'){ s.karar='yeni'; s.urun_id=null; s.eslesme=null; }
  else if (v === '__atla'){ s.karar='atla'; s.urun_id=null; s.eslesme=null; }
  else { s.karar='mevcut'; s.urun_id=v; s.eslesme='elle'; }
  alSatirCiz();
}
function alSatirDenetim(){
  const el = document.getElementById('fsDenetim'); if(!el) return;
  const kalan = AL_SATIRLAR.filter(s=>s.karar!=='atla');
  const satirT = +kalan.reduce((a,s)=>a+s.satir_tutar,0).toFixed(2);
  // Faturanın matrahı: KDV dökümündeki matrahların toplamı
  let matrah = 0;
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    matrah += paraOku(document.getElementById('alKdvM_'+d.id.split('_')[1])).deger;
  });
  matrah = +matrah.toFixed(2);
  const toplam = paraOku(document.getElementById('alToplam')).deger;
  if (!kalan.length){ el.innerHTML = ''; AL_SATIR_TUTUYOR = true; return; }
  const hedef = matrah > 0 ? matrah : toplam;
  const etiket = matrah > 0 ? 'fatura matrahı' : 'ödenecek tutar';
  const fark = +(satirT - hedef).toFixed(2);
  AL_SATIR_TUTUYOR = Math.abs(fark) <= 0.05;
  el.innerHTML = AL_SATIR_TUTUYOR
    ? `<div class="bilgi-not" style="color:var(--ok)">✓ Satır toplamı ${tl(satirT)} = ${etiket} ${tl(hedef)} — ürünler kaydedilebilir</div>`
    : `<div class="bilgi-not" style="color:var(--uyari)">⚠ Satır toplamı <b>${tl(satirT)}</b>,
        ${etiket} <b>${tl(hedef)}</b> — <b>${fark>0?'+':''}${tl(fark)}</b> fark var.<br>
        Eksik satır olabilir, bir rakam yanlış okunmuş olabilir ya da faturada iskonto vardır.
        <b>Düzeltmeden ürün kaydı yapılmaz</b> — fatura, tutarı ve KDV'siyle yine kaydedilir.</div>`;

let AL_SATIR_TUTUYOR = true;
/* Yeni ürünleri oluştur, eşleşmeyi hafızaya yaz, kalem listesini döndür */
let YENI_URUN_UYARI = [];   // personelin açtığı, yöneticinin gözden geçireceği ürünler
async function alSatirKaydet(tedarikciId){
  YENI_URUN_UYARI = [];
  const kalan = AL_SATIRLAR.filter(s=>s.karar!=='atla');
  if (!kalan.length || !AL_SATIR_TUTUYOR) return [];
  const kalemler = [];
  for (const s of kalan){
    let urunId = s.urun_id;
    let carpan = s.carpan;
    let ad = null, birim = 'adet';
    if (s.karar === 'yeni'){
      ad = (document.getElementById('fsAd_'+s.i)?.value||s.ham_ad).trim();
      birim = document.getElementById('fsBirim_'+s.i)?.value || 'adet';
      const pk = paraOku(document.getElementById('fsPaket_'+s.i));
      carpan = pk.deger > 0 ? pk.deger : 1;
      if (!ad) throw new Error('Yeni ürünün adı boş olamaz.');
    }
    // Ürün + eşleşme TEK fonksiyonda. Personel tabloya doğrudan yazamaz (RLS),
    // bu fonksiyon üzerinden tanımlayabilir; açtığı ürün yöneticinin onayına düşer.
    const { data:r, error:re } = await sb.rpc('rpc_urun_tanimla', {
      p_ad: ad, p_birim: birim,
      p_paket_ici: carpan > 1 ? carpan : null,
      p_kategori: null,
      p_tedarikci: tedarikciId || null,
      p_ham_kod: s.ham_kod, p_ham_ad: s.ham_ad,
      p_carpan: carpan, p_birim_ad: s.birim,
      p_urun_id: s.karar === 'yeni' ? null : urunId
    });
    if (re) throw new Error('Ürün tanımlanamadı: ' + hataTr(re.message));
    urunId = r.urun_id;
    if (s.karar === 'yeni' && r.yeni){
      KATALOG.urunler.push({ id:r.urun_id, ad, birim, kod:r.kod, paket_ici_adet: carpan>1?carpan:null });
      YENI_URUN_UYARI.push(`${r.kod} ${ad}`);
    }
    kalemler.push({ urun_id:urunId, miktar:s.miktar, birim_fiyat:s.birim_fiyat,
      ham_ad:s.ham_ad, ham_kod:s.ham_kod, birim_ad:s.birim, birim_carpani:carpan,
      satir_tutar:s.satir_tutar, kdv_orani:s.kdv_orani,
      iskonto_orani:s.iskonto_orani, iskonto_tutar:s.iskonto_tutar });
  }
  return kalemler;
}

async function alisKaydet(){

  const toplam = pT.deger;

  try { kdvKirilim = alKdvOku(); }
  catch(e){ mesaj('alMsg','hata', hataTr(e.message)); return; }
  const kdvT = +kdvKirilim.reduce((a,x)=>a+x.kdv_tutar,0).toFixed(2);
  const matrah = +kdvKirilim.reduce((a,x)=>a+x.matrah,0).toFixed(2);
  if (!document.getElementById('alTedarikci').value){ mesaj('alMsg','hata','Tedarikçi seçilmedi.'); return; }
  if (toplam===0){ mesaj('alMsg','hata','Toplam tutar boş olamaz.'); return; }
  if (kdvT > toplam){ mesaj('alMsg','hata',`KDV (${tl(kdvT)}) toplam tutardan (${tl(toplam)}) büyük olamaz.`); return; }
  // Belgenin kendi aritmetiği: matrah + KDV = ödenecek
  if (matrah > 0 && Math.abs(matrah + kdvT - toplam) > 0.05 &&
      !confirm(`Matrah ${tl(matrah)} + KDV ${tl(kdvT)} = ${tl(matrah+kdvT)}, ödenecek tutar ${tl(toplam)}.\n${tl(Math.abs(matrah+kdvT-toplam))} fark var.\n\nBelgeyle karşılaştırdın mı? Yine de kaydedilsin mi?`)) return;

  // Yeni ürünleri oluştur + eşleşmeleri hafızaya yaz

  }catch(e){
    mesaj('alMsg','hata', hataTr(e.message)); btn.disabled=false; btn.textContent='Faturayı Kaydet'; return;
  }
  if (!kalemler.length) kalemler = kalemOku();       // elle girilenler

    p_kdv_orani: kdvKirilim.length === 1 ? kdvKirilim[0].oran : null,   // tek oransa eski alan da dolsun
    p_kdv_tutar: kdvT,
    p_kdv_kirilim: kdvKirilim,

    p_ocr_ham: OCR_SON ? OCR_SON.veri : null,

    p_foto: foto,
    p_not: document.getElementById('alNot').value.trim()||null,

    p_vade: document.getElementById('alOdendi').value === '0' ? (document.getElementById('alVade').value||null) : null,
    p_cek_no: (document.getElementById('alOdendi').value==='1' && document.getElementById('alYontem').value==='cek') ? (document.getElementById('alCekNo').value.trim()||null) : null,
    p_cek_vade: (document.getElementById('alOdendi').value==='1' && document.getElementById('alYontem').value==='cek') ? (document.getElementById('alCekVade').value||null) : null

async function ayRaporuAc(donem){

  w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8">'
    + '<title>Bardaks KTÜ — Ay Raporu</title>'
