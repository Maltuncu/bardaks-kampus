}
/* ⚠ CU · KAYITTAN SONRA YENİDEN SINIFLANDIRMA.
   mutabakatCalistir'ın DB sorgusunun ve sınıflandırmasının AYNISI,
   yalnız verilen belge no'lar için. Amaç: "kaydettim" demek değil,
   "DB'de var mı, foto_path dolu mu" diye SORMAK. PDF metni yeniden
   okunmaz — MUTABAKAT nesneleri zaten elimizde, değişen tek şey
   durum/tur/kayit alanları. */
async function tpSiniflandir(nolar){
  const kume = [...new Set((nolar || []).filter(Boolean))];
  if (!kume.length) return;
  const hedef = MUTABAKAT.filter(x => x.belge_no && kume.includes(x.belge_no));
  if (!hedef.length) return;
  const [av, gv, hv] = await Promise.all([
    sb.from('alis').select('id,belge_no,tarih,toplam,foto_path,tedarikci(ad)')
      .eq('is_deleted', false).in('belge_no', kume),
    sb.from('gider').select('id,aciklama,tarih,tutar,foto_path').eq('is_deleted', false),
    sb.from('belge_haric').select('belge_no,neden').eq('is_deleted', false)
  ]);
  /* ⚠ YARIM SINIFLANDIRMA YAPILMAZ. Supabase hata dönerse data null
     gelir; sessizce devam edilse alisMap boş kalır ve HER satır
     "eksik" sınıflanırdı — yani bu turda düzelttiğimiz "Girilmemiş 25"
     ekranının birebir aynısı, üstelik sebebi görünmeden. Bir sorgu bile
     hatalıysa HİÇBİR durum değiştirilmeden atılır; çağıran yakalar. */
  const kotu = [av, gv, hv].find(r => r && r.error);
  if (kotu) throw new Error(kotu.error.message || 'sınıflandırma sorgusu başarısız');
  const haricMap = {}; ((hv && hv.data) || []).forEach(h =>
    { haricMap[(h.belge_no || '').toUpperCase()] = h.neden; });
  const alisMap = {}; ((av && av.data) || []).forEach(a =>
    { alisMap[(a.belge_no || '').toUpperCase()] = a; });
  const giderler = (gv && gv.data) || [];
  hedef.forEach(x => {
    if (haricMap[x.belge_no]){ x.durum = 'haric'; x.neden = haricMap[x.belge_no];
      x.kayit = null; x.tur = ''; return; }
    const a = alisMap[x.belge_no];
    const g = giderler.find(z => (z.aciklama || '').toUpperCase().includes(x.belge_no));
    const k = a || g;
    /* ⚠ Kayıt YOKSA 'eksik'e DOKUNULMAZ: sunucu hata verdiyse belge
       hâlâ girilmemiştir, panelde de öyle görünmeli. */
    if (!k){ x.durum = 'eksik'; x.kayit = null; x.tur = ''; return; }
    x.kayit = k; x.tur = a ? 'alis' : 'gider';
    /* Toplu giriş p_foto:null ile kaydediyor -> beklenen normal sonuç
       'belge_eklenecek'; belgeler "BELGESİ EKSİK" kutusuna düşer ve
       "n Belgeyi Kayıtlara Ekle" düğmesi çıkar. */
    x.durum = k.foto_path ? 'belgeli' : 'belge_eklenecek';
  });
}
async function tpKaydet(){
  const btn = document.getElementById('tpKaydet');
  const secilenler = TOPLU.filter(r => r.sec && tpKaydedilebilir(r));
  if (!secilenler.length) return;
  /* ⚠ İŞLETME DIŞI KALICI OLMALI: yalnız ekranda işaretlemek yetmez,
     bir sonraki mutabakatta yine "gözden kaçmış" diye çıkardı.
     belge_haric'e yazılır — tek tek akışla AYNI fonksiyon üzerinden
     (belgeHaricEkle), tek fark gerekçe BİR KEZ soruluyor.
     ⚠ Burada eskiden AYRI bir çağrı vardı ve p_sube/p_firma'yı
       göndermiyordu; yorumda "aynısı" yazdığı hâlde değildi. İki kopya
       zamanla ayrıştı, kullanıcı ekranda "İşlem tamamlanamadı" gördü. */
  const haricler = TOPLU.filter(r => r.haric && !r.sonuc && r.belge_no);
  let haricNeden = null;
  if (haricler.length){
    haricNeden = await nedenSor(haricler.length + ' belge işletme dışı işaretlendi',
      'Neden sisteme girilmiyor? (örn: şahsi harcama, ev interneti) — hepsi için tek gerekçe', 1);
    if (haricNeden === null) return;                       // vazgeçildi: hiçbir şey yapılmaz
    if (!haricNeden.trim()){ bildir('Gerekçe zorunlu.', 'hata'); return; }
  }
  btn.disabled = true;
  let ok = 0, haricOk = 0; const hatalar = [];
  for (const r of haricler){
    try{
      await belgeHaricEkle(r.belge_no, r.firma, haricNeden.trim());
      r.sonuc = 'işletme dışı'; haricOk++;
    }catch(e){ hatalar.push((r.belge_no||'') + ' (işletme dışı): ' + hataTr(e.message)); }
  }
  for (let n = 0; n < secilenler.length; n++){
    const r = secilenler[n];
    btn.textContent = `Kaydediliyor ${n+1}/${secilenler.length}...`;
    try{
      /* ⚠ TEK TEK ve DOĞRUDAN sb.rpc: rpcCagir tek düğme/tek mesaj
         varsayıyor, döngüde her satırda düğmeyi geri boyardı. Hata
         yutulmuyor — satıra yazılıyor ve döngü devam ediyor. */
      const p = r.tur === 'alis'
        ? ['rpc_alis_kaydet', {
            p_idem: await idemKararli('alis', [AKTIF_SUBE, r.belge_no || '', r.tutar]),
            p_sube: AKTIF_SUBE, p_tedarikci: r.ted.id, p_tarih: r.tarih, p_tur: 'fatura',
            p_belge_no: r.belge_no, p_fis_no: null, p_toplam: r.tutar,
            p_kdv_orani: null, p_kdv_tutar: r.kdv, p_kdv_kirilim: [], p_kdv_dahil: true,
            p_ocr_ham: null, p_ocr_model: null, p_foto: null,
            p_not: 'toplu giriş', p_kalemler: [],
            p_odendi: false, p_odeme_yontem: null, p_vade: null,
            p_cek_no: null, p_cek_vade: null }]
        : ['rpc_gider_kaydet', {
            p_idem: await idemKararli('gider', [AKTIF_SUBE, r.tarih, r.kategori, r.tutar, false]),
            p_sube: AKTIF_SUBE, p_tarih: r.tarih, p_kategori: r.kategori,
            p_aciklama: (r.firma || '') + ' · ' + (r.belge_no || ''),
            p_tutar: r.tutar, p_kdv_orani: null, p_kdv_tutar: r.kdv, p_foto: null,
            p_kasadan: false, p_tedarikci: r.ted ? r.ted.id : null, p_vade: null }];
      const { data, error } = await sb.rpc(p[0], p[1]);
      if (error) throw new Error(error.message);
      if (!data || !data.ok) throw new Error('sunucu onay vermedi');
      r.sonuc = 'ok'; r.sec = false; ok++;
    }catch(e){
      const m = hataTr(e.message);
      r.sonuc = m; hatalar.push((r.belge_no || r.firma) + ': ' + m);
    }
  }
  const atlanan = haricOk;
  const eksikli = TOPLU.filter(x => x.eksik.length).length;
  /* ⚠ CU · ÜST PANEL DE TAZELENİR.
     Ölçüldü: dört fatura kaydedildi, satırlarda yeşil "kaydedildi"
     rozeti çıktı ama üstteki "Karşılaştırma Sonucu" hâlâ
     "Portaldan gelen 4 · Sistemde var 0 · Girilmemiş 4" ve kırmızı
     "SİSTEME GİRİLMEMİŞ (4)" diyordu — kullanıcı kaydın girmediğini
     sandı. Sebep: mutabakatCiz() MUTABAKAT dizisinden okuyor, o dizi
     kaydetmeden sonra hiç güncellenmiyordu.
     ⚠ YEREL İYİMSER YAMA YOK: "kaydettim, demek ki var" denmiyor.
       Kayıt gerçekten var mı, foto_path dolu mu — DB söylüyor.
       PDF'ler TEKRAR OKUNMUYOR (yavaş, üstelik dosya girdisi ekranda
       durmayabilir); yalnız sınıflandırma sorgusu, YALNIZ bu turda
       dokunulan belge no'lar için tekrarlanıyor. */
  /* ⚠ TAZELEME ÇÖKERSE KAYIT YİNE DURUYOR. Bu blok korumasızken bir ağ
     hatası fonksiyonu burada öldürüyordu: tpCiz() çalışmaz, düğme
     "Kaydediliyor 25/25..." yazısıyla disabled kalır, mesaj hiç
     yazılmazdı — kayıtlar DB'ye GİRMİŞ olduğu hâlde kullanıcı
     girmediğini sanardı. Artık ekran her hâlükârda geri geliyor. */
  let tazeHata = null, belgeOk = 0; const belgeHata = [];
  try{
    const dokunulan = [...secilenler, ...haricler].map(r => r.belge_no).filter(Boolean);
    await tpSiniflandir(dokunulan);
    /* ⚠ CX · PDF DE BURADA BAGLANIR. Kullanicinin sikayeti buydu:
       "faturaları yüklüyorum PDF'leri kaydetmiyor". Kayit aciliyordu,
       belge ayri bir dugmede kaliyordu; kullanici o adimi bilmiyor ya
       da unutuyordu, sayfayi yenileyince PDF'ler bellekten gidiyor ve
       zip'i bastan yuklemek gerekiyordu. 25 faturalik bir turda bu 25
       belgesiz kayit demekti.
       ⚠ SIRA KORUNUYOR: kayit ONCE acildi (yukaridaki dongu), belge
         SONRA baglaniyor. Tersi olsaydi rpc patladiginda depoda
         sahipsiz dosya kalirdi.
       ⚠ KAYIT ID'SI DB'DEN: tpSiniflandir kaydi sunucudan okuyup
         x.kayit'a yazdi. rpc'nin donus govdesinde id VARSAYMIYORUZ —
         "kaydettim, demek ki su id" demek yerine DB soyluyor.
       ⚠ Yalniz bu turda dokunulan ve dosyasi HALA ELDE olan satirlar.
         Sayfa yenilendiyse x.dosya yok; o satir "belgesi eksik"
         kutusunda kalir ve dugmeyle baglanir. */
    /* ⚠ SAYIM ONCE: dugme "7/25" diyebilmek icin toplami bilmeli, ve o
       toplam SECILEN satir sayisi degil GERCEKTEN YUKLENECEK satir
       sayisidir (zaten belgeli olan ya da dosyasi elde olmayan sayilmaz). */
    const baglanacak = MUTABAKAT.filter(x => x.durum === 'belge_eklenecek'
      && x.belge_no && dokunulan.includes(x.belge_no) && x.dosya && x.kayit);
    /* ⚠ 25 fatura ~5 MB; telefonda bu 30 saniyeyi gecebiliyor. Ilerleme
       yazilmazsa dugme "Kaydediliyor 25/25..." de donmus gorunur,
       kullanici asili kaldi sanip sayfayi kapatir ve belgeler
       BAGLANMADAN gider — duzeltmeye calistigimiz sikayetin ta kendisi.
       Desen kayit dongusunun AYNISI. */
    for (let n = 0; n < baglanacak.length; n++){
      const x = baglanacak[n];
      btn.textContent = `Belgeler bağlanıyor ${n+1}/${baglanacak.length}...`;
      try{ await belgeBagla(x); belgeOk++; }
      catch(e){ belgeHata.push(x.belge_no + ': ' + hataTr(e.message)); }
    }
    mutabakatCiz();
    /* ⚠ HATA ALAN SATIRIN SEÇİMLERİ KAYBOLMAZ: tpKur tabloyu sıfırdan
       kuruyor; kullanıcının girdiği tür/kategori ve hata metni belge
       no üzerinden geri yazılır — yoksa düzeltip tekrar denemek için
       her şeyi baştan seçmesi gerekirdi. */
    const onceki = {};
    TOPLU.forEach(r => { if (r.belge_no) onceki[r.belge_no] =
      { tur:r.tur, kategori:r.kategori, sonuc:r.sonuc, haric:r.haric, sec:r.sec,
        /* ⚠ CY · ELLE YAZILAN KDV DE KORUNUR: tpKur satiri sifirdan
           kuruyor ve okunan (yanlis) rakama geri donerdi. */
        kdv:r.kdv, kdvDurum:r.kdvDurum, kdvNot:r.kdvNot, kdvKontrol:r.kdvKontrol }; });
    tpKur(MUTABAKAT.filter(x => x.durum === 'eksik'));
    TOPLU.forEach(r => { const o = r.belge_no && onceki[r.belge_no]; if (!o) return;
      r.tur = o.tur; r.kategori = o.kategori; r.haric = o.haric;
      r.kdv = o.kdv; r.kdvDurum = o.kdvDurum; r.kdvNot = o.kdvNot; r.kdvKontrol = o.kdvKontrol;
      /* 'ok' geri yazılmaz: o satır zaten tablodan düştü. Kalan satırda
         duran şey HATA metnidir, kullanıcı onu görmeli. */
      if (o.sonuc && o.sonuc !== 'ok' && o.sonuc !== 'işletme dışı') r.sonuc = o.sonuc;
      r.sec = o.sec && tpKaydedilebilir(r);
    });
  }catch(e){ tazeHata = hataTr(e.message); }
  tpCiz();
  mesaj('tpMsg', hatalar.length ? 'hata' : ((tazeHata || belgeHata.length) ? 'uyari' : 'ok'),
    ok + ' kaydedildi'
    /* ⚠ IKI SAYI AYRI: kayit girdi ama belge girmediyse kullanici BUNU
       BILMELI. Tek sayida birlestirmek "hepsi tamam" izlenimi verirdi. */
    + (belgeOk ? ' · ' + belgeOk + ' belge bağlandı' : '')
    + (belgeHata.length ? ' · ' + belgeHata.length + ' belge bağlanamadı (kayıtlar duruyor, '
        + '"Belgeyi Kayıtlara Ekle" ile tekrar dene): ' + belgeHata[0] : '')
    + (hatalar.length ? ' · ' + hatalar.length + ' hata: ' + hatalar.slice(0,3).join(' | ') : '')
    + (atlanan ? ' · ' + atlanan + ' işletme dışı işaretlendi (bir daha sorulmaz)' : '')
    + (eksikli ? ' · ' + eksikli + ' eksik okundu (tek tek gir)' : '')
    /* ⚠ "kaydedilemedi" DENMEZ — kayıt olmuştur. Yalan uyarı kullanıcıyı
       ikinci kez girmeye zorlar; söylenen tek şey panelin bayat olduğu. */
    + (tazeHata ? ' · üst panel tazelenemedi (bağlantı) — "Belgeleri Oku ve Karşılaştır"'
                + ' düğmesine tekrar basınca doğrusunu görürsün' : ''));
}

async function mutabakatCalistir(){
  const btn = document.getElementById('mtBtn');
  const drm = document.getElementById('mtDurum');
  const yaz = (t,s)=>{ drm.className='oku-durum '+(s||''); drm.textContent=t; };
  /* Hangi işletmenin portalından indirildiği ARTIK SORULUYOR.
     Eskiden faturanın metninde TCKN aranarak tahmin ediliyordu; o sabit
     güvenlik gereği kaldırıldı. Yanlış ZIP yüklenirse LTD faturaları
     şahıs defterine karışır — bu yüzden tahmin değil soru.
     Bedel: ZIP başına BİR onay. Ekran zaten owner'a özel. */
  if (!confirm('Bu ZIP hangi portaldan indirildi?\n\n'
      + 'TAMAM  → KTÜ şahıs şirketinin portalı (devam et)\n'
      + 'İPTAL  → başka bir işletmenin portalı / emin değilim (durdur)\n\n'
      + 'Yanlış portalın zipi yüklenirse başka işletmenin faturaları '
      + 'bu deftere karışır.')){
    document.getElementById('mtDurum').className = 'oku-durum uyari';
    document.getElementById('mtDurum').textContent =
      'Durduruldu — doğru portalın zip dosyasıyla tekrar dene.';
    return;
  }
  btn.disabled = true; MUTABAKAT = [];
  document.getElementById('mtSonuc').innerHTML = '';
  try{
    const pdfler = await mutabakatDosyalari();
    yaz(`${pdfler.length} belge bulundu, okunuyor...`, '');
    for (let i=0; i<pdfler.length; i++){
      const f = pdfler[i];
      yaz(`Okunuyor ${i+1}/${pdfler.length} — ${f.name.slice(0,40)}`, '');
      const kayit = { dosya:f, ad:f.name };
      try{
        const c = await pdfMetinCikar(f);
        kayit.metin = c.metin;
        const t = c.metin;
        // Belge no: önce dosya adından (portal "FATURANO_VKN_FIRMA.pdf" verir), yoksa metinden
        const adNo = (f.name.match(/^([A-Z0-9]{10,20})_/i)||[])[1];
        const metinNo = (t.match(/Fatura\s*No\s*:?\s*([A-Z0-9]{10,20})/i)||[])[1]
                     || (t.match(/FATURA\s*ID\s*:?\s*([A-Z0-9]{10,20})/i)||[])[1];
        kayit.belge_no = (adNo || metinNo || '').toUpperCase() || null;
        /* ⚠ CS · TUTAR/KDV/FIRMA/VKN DE OKUNUYOR (toplu giriş için).
           Ölçüldü, 25 gerçek e-fatura: belge no 25/25 · firma 25/25 ·
           VKN 25/25 · tutar 25/25 · tarih 24/25 · KDV 21/25.
           Aşağıdaki iki satır bu okumanın ÜSTÜNE yazar; eski
           firma/tarih çıkarımı yedek olarak altta duruyor. */
        Object.assign(kayit, faturaAlanlari(f.name, t));
        /* Alıcı kontrolü ARTIK OTOMATİK DEĞİL. Eskiden belgenin metninde
           işletme sahibinin TCKN'si aranıyordu; o sabit kaldırıldı.
           Eşleşmeyen fatura sessizce "başka alıcı" kutusuna düşüyordu ve
           kimse bakmıyordu — şimdi normal sınıflandırmaya giriyor, yani
           "SİSTEME GİRİLMEMİŞ" listesinde görünüp karar bekliyor.
           Bize ait olmayan bir belge çıkarsa "İşletme dışı" ile dışlanır. */
        /* ⚠ ESKI FIRMA CIKARIMI YEDEĞE DÜŞTÜ: metnin ilk satırı çoğu
           faturada başlık çöpü ("FATURA ID Fatura Tarihi ...") — ölçüldü.
           Dosya adından gelen firma 25/25 doğru; o yoksa buraya düşülür. */
        if (!kayit.firma) kayit.firma = t.split('\n')[0].slice(0,40);
        if (!kayit.tarih) kayit.tarih = (t.match(/(?:Fatura\s*)?Tarihi?\s*:?\s*(\d{2}\s?[-.\/]\s?\d{2}\s?[-.\/]\s?\d{4})/i)||[])[1] || null;
      }catch(e){ kayit.hata = e.message; }
      MUTABAKAT.push(kayit);
    }
    // Sistemde ne var: alış belge_no + gider açıklamasındaki belge no
    const nolar = MUTABAKAT.map(x=>x.belge_no).filter(Boolean);
    const [av, gv] = await Promise.all([
      sb.from('alis').select('id,belge_no,tarih,toplam,foto_path,tedarikci(ad)')
        .eq('is_deleted',false).in('belge_no', nolar.length?nolar:['-']),
      sb.from('gider').select('id,aciklama,tarih,tutar,foto_path').eq('is_deleted',false)
    ]);
    // Bilerek girilmeyenler (şahsi harcama vb) "eksik" sayılmasın
    const { data: hd } = await sb.from('belge_haric').select('belge_no,neden').eq('is_deleted',false);
    const haricMap = {}; (hd||[]).forEach(h=>{ haricMap[(h.belge_no||'').toUpperCase()] = h.neden; });
    const alisMap = {}; (av.data||[]).forEach(a=>{ alisMap[(a.belge_no||'').toUpperCase()] = a; });
    const giderler = gv.data || [];
    MUTABAKAT.forEach(x=>{
      if (x.hata){ x.durum='hata'; return; }
      /* Otomatik "baska_alici" ayıklaması kaldırıldı (TCKN sabiti gitti).
         Artık her belge normal sınıflandırmadan geçiyor; bize ait olmayan
         bir belge "girilmemiş" olarak görünür ve operatör "İşletme dışı"
         diyerek gerekçesiyle dışlar. Sessiz eleme yerine görünür karar. */
      if (x.belge_no && haricMap[x.belge_no]){ x.durum='haric'; x.neden=haricMap[x.belge_no]; return; }
      const a = x.belge_no ? alisMap[x.belge_no] : null;
      const g = x.belge_no ? giderler.find(z => (z.aciklama||'').toUpperCase().includes(x.belge_no)) : null;
      const k = a || g;
      if (!k){ x.durum='eksik'; return; }
      x.kayit = k; x.tur = a ? 'alis' : 'gider';
      x.durum = k.foto_path ? 'belgeli' : 'belge_eklenecek';
    });
    yaz(`${MUTABAKAT.length} belge okundu.`, 'ok');
    mutabakatCiz();
    /* CS · Toplu tablo YALNIZ sisteme girilmemiş belgelerle kurulur;
       zaten kayıtlı olanlar yukarıdaki kutularda duruyor — aynı zip
       ikinci kez yüklenirse bu tablo boş gelir. */
    tpKur(MUTABAKAT.filter(x => x.durum === 'eksik'));
    await tpGecmisYukle();
    tpCiz();
  }catch(e){
    yaz('Hata: ' + hataTr(e.message), 'uyari');
  }finally{ btn.disabled = false; }
}
function mutabakatCiz(){
  const el = document.getElementById('mtSonuc'); if(!el) return;
  const say = d => MUTABAKAT.filter(x=>x.durum===d).length;
  const grup = (d) => MUTABAKAT.filter(x=>x.durum===d);
  const satir = (x, sag) => `<div class="liste-satir">
      <div class="l-sol"><div class="b">${esc(x.belge_no||x.ad.slice(0,24))}</div>
        <div class="k">${esc(x.firma||'—')}${x.tarih?' · '+esc(x.tarih):''}
          ${x.kayit?' · '+tl(x.kayit.toplam ?? x.kayit.tutar):''}</div></div>
      <div class="l-sag">${sag}</div></div>`;
  const eksik = grup('eksik'), ekle = grup('belge_eklenecek'),
        tamam = grup('belgeli'), baska = grup('baska_alici'), hata = grup('hata');
  el.innerHTML = `<div class="kart">
    <div class="kbaslik">Karşılaştırma Sonucu</div>
    <div class="gs-bant" style="margin:0 0 12px">

/* ⚠ CX · TEK YUKLEME YOLU. Bu is iki yerden yapiliyor: toplu girisin
   kendi icinden (kayit acilir acilmaz) ve "n Belgeyi Kayitlara Ekle"
   dugmesinden. Ayni isi ikinci kez baska turlu yazmak, iki yolun
   zamanla ayrismasi demekti — desen buraya cikarildi, iki yer de
   burayi cagiriyor.
   ⚠ SIRA: kayit ONCE acilmis olmali. Once yukleyip sonra kayit
     acsaydik, kayit patladiginda depoda SAHIPSIZ dosya kalirdi.
     Bu sirada yukleme patlarsa satir "belgesi eksik" kalir —
     kurtarilabilir hal budur, dugme yerinde duruyor.
   Basarisizlikta ATAR; cagiran yakalar ve sayar. */
async function belgeBagla(x){
  const yol = `fatura/${bugun()}_${crypto.randomUUID()}.pdf`;
  const { error: ue } = await sb.storage.from('belgeler')
    .upload(yol, x.dosya, { upsert:false, contentType:'application/pdf' });
  if (ue) throw new Error(ue.message);
  const tablo = x.tur === 'alis' ? 'alis' : 'gider';
  const { error: ge } = await sb.from(tablo).update({ foto_path: yol }).eq('id', x.kayit.id);
  if (ge) throw new Error(ge.message);
  x.durum = 'belgeli'; x.kayit.foto_path = yol;
  return yol;
}
async function mutabakatBelgeEkle(){
  const liste = MUTABAKAT.filter(x=>x.durum==='belge_eklenecek');
  if (!liste.length) return;
  if (!confirm(`${liste.length} belge kayıtlarına eklenecek.\n\nDevam edilsin mi?`)) return;
  const btn = document.getElementById('mtEkleBtn'); if(btn) btn.disabled = true;
  let ok = 0; const hatalar = [];
  for (const x of liste){
    try{ await belgeBagla(x); ok++; }
    catch(e){ hatalar.push(`${x.belge_no}: ${hataTr(e.message)}`); }
  }
  if(btn) btn.disabled = false;
  mutabakatCiz();
  mesaj('mtMsg', hatalar.length ? 'hata' : 'ok',
    `${ok} belge eklendi ✓` + (hatalar.length ? ` · ${hatalar.length} hata: ${hatalar[0]}` : ''));
}
/* ⚠ DB · TEK ÇAĞRI YOLU — BU HATA TAM DA İKİ KOPYADAN DOĞDU.
   Toplu giriş `rpc_belge_haric_ekle`'yi İKİ parametreyle çağırıyordu
   (p_belge_no, p_neden); sunucu fonksiyonu DÖRT alıyor
   (p_sube, p_belge_no, p_firma, p_neden · belge_haric.sube_id NOT NULL).
   PostgREST eşleşen fonksiyonu bulamayınca kullanıcı 25 faturalık turda
   "1 hata: … İşlem tamamlanamadı" görüyordu. Üstündeki yorum "tek tek
   akıştaki mekanizmanın AYNISI" diyordu — DEĞİLDİ; kopyalandığı sanılan
   ama kopyalanmamış bir çağrıydı. Artık gerçekten aynı: tek fonksiyon,
   iki çağıran (belgeBagla'da aynı karar verilmişti ve tuttu).
   ⚠ HAM HATA KONSOLA DA YAZILIR: hataTr ekranda genel metne çeviriyor
     ("İşlem tamamlanamadı") ve kullanıcı ne olduğunu anlayamadı.
     hataTr'ye dokunmuyoruz (geniş etki), ama sonraki teşhis kaynak
     okumakla değil ekrandan yapılabilsin.
   Sunucu tarafı notu (v84 · H-51): giren_id artık auth.uid(); denetim
   izinin "kim" alanı istemcinin söylediği şey olamaz.
   ux_belge_haric mükerrer koruması değişmedi; ihlal aynı kısıt adıyla
   yukarı çıkıyor ve hataTr onu çeviriyor. */
async function belgeHaricEkle(belgeNo, firma, neden){
  const { error } = await sb.rpc('rpc_belge_haric_ekle', {
    p_sube: AKTIF_SUBE, p_belge_no: belgeNo,
    p_firma: (firma || '').slice(0, 80), p_neden: neden });
  if (error){
    console.error('rpc_belge_haric_ekle · ' + belgeNo + ' · ham hata:', error);
    throw new Error(error.message);
  }
}
/* Bilerek girilmeyecek belgeyi işaretle — bir daha "eksik" diye uyarmasın */
async function mutabakatHaric(no){
  const x = MUTABAKAT.find(z=>z.belge_no===no); if(!x) return;
  const neden = await nedenSor(`${no} — ${x.firma||''}`, 'Neden sisteme girilmiyor? (örn: ev interneti, şahsi harcama)', 1);
  if (neden === null) return;
  if (!neden.trim()){ bildir('Neden yazmak zorunlu — sonradan niye atlandığını bilmen gerekir.', 'hata'); return; }
  try{ await belgeHaricEkle(no, x.firma, neden.trim()); }
  catch(e){ bildir('Kaydedilemedi: ' + hataTr(e.message), 'hata'); return; }
  x.durum = 'haric'; x.neden = neden.trim();
  mutabakatCiz();
  mesaj('mtMsg','ok', `${no} işletme dışı olarak işaretlendi — bir daha uyarmayacak.`);
}

   personele bos liste "vade yok" diye yalan soylerdi. */
let GD_VADELER = [];
async function gdVadeDoldur(){
  const s = document.getElementById('gdVade'); if (!s) return;
  const { data } = await sb.from('v_vade_liste')
    .select('id,aciklama,vade_tarihi,tutar').eq('durum','acik')
    .eq('sube_id', AKTIF_SUBE).order('vade_tarihi');
  GD_VADELER = data || [];

  s.onchange = () => {
    const v = GD_VADELER.find(x => x.id === s.value);
    const t = document.getElementById('gdTutar');
    if (v && v.tutar != null && t && paraDeger('gdTutar') === 0)
      t.value = (+v.tutar).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
    gdVadeFark();
  };

function gdVadeFark(){
  const s = document.getElementById('gdVade'), n = document.getElementById('gdVadeNot');
  if (!s || !n) return;
  const v = GD_VADELER.find(x => x.id === s.value);
  if (!v){ n.hidden = true; return; }

  if (v.tutar == null){
    n.hidden = false; n.textContent = 'Bu vadenin tutarı sistemde yok — girdiğin tutar geçerli olur.';

      + ' — farklı tutar kaydedilebilir (kısmi ödeme / gecikme zammı).';
  } else n.hidden = true;
}

/* v65 · H-18 · GİDER SİLME
   Ham `.update({is_deleted:true})` YOK — iz bırakmayan finansal
   değişiklik bu turlarda kapatmaya çalıştığımız şeyin ta kendisi.
   Kanal: rpc_gider_sil (owner-only, gerekçe zorunlu, soft delete,
   audit_log'a otomatik iz, v61 dönem kilidi).

   ÇİFT TIKLAMA KİLİDİ: düğme anında pasifleşir. RPC ikinci çağrıyı
   zaten KAYIT_YOK ile reddediyor (arka duvar), ama operatör "olmadı"
   sanıp tekrar basmasın diye ön tarafta da kilit var. */
async function giderSil(id, tutarMetni){
  const btn = document.getElementById('gsil_' + id);
  if (btn && btn.disabled) return;

  const neden = await nedenSor('Bu gider kaydı neden siliniyor?',
    'Gerekçe zorunlu ve kayda geçer (denetim izine yazılır).\n' +
    'Örnek: "aynı tutar parça parça ayrıca girilmiş, bu toplu kayıt fazla"', 1);
  if (!neden || !neden.trim()){
    if (neden !== null) bildir('Gerekçe boş olamaz — silinmedi.', 'hata');
    return;
  }
  /* v70 · H-29 · Eski metin "bu kadar DEĞİŞİR" diyordu ama hiçbir rakama
     işaret etmiyordu — cümle eksik kalmıştı. Silinecek tutar artık metinde. */
  if (!await onaySor('Kayıt silinecek (geri alınabilir işaretleme, veri kaybolmaz).',
             'Tutar: ' + (tutarMetni || '(bilinmiyor)') + '\n'
             + 'Aylık kâr ve beyana giden rakam BU KADAR ARTAR.\n\nDevam?', 'Sil')) return;

  if (btn){ btn.disabled = true; btn.textContent = '…'; }
  const { error } = await sb.rpc('rpc_gider_sil', { p_id:id, p_neden:neden.trim() });
  if (error){
    if (btn){ btn.disabled = false; btn.textContent = 'Sil'; }
    bildir('Silinemedi: ' + hataTr(error.message), 'hata');
    return;
  }
  vGider();
}

/* ===== FATURA KDV DÖKÜMÜ — bir belgede birden çok oran olabilir ===== */
let AL_KDV_SAYAC = 0;
function alKdvSatirEkle(oran, matrah, kdv){
  AL_KDV_SAYAC++;
  const n = AL_KDV_SAYAC;
  const kap = document.getElementById('alKdvSatirlari'); if(!kap) return;
  const d = document.createElement('div');
  d.className = 'kdv-satir'; d.id = 'alKdvS_'+n;
  d.innerHTML = `
    <select id="alKdvO_${n}">
      <option value="1"${oran==1?' selected':''}>%1</option>
      <option value="8"${oran==8?' selected':''}>%8</option>
      <option value="10"${(oran==10||!oran)?' selected':''}>%10</option>
      <option value="20"${oran==20?' selected':''}>%20</option>
      <option value="0"${oran===0?' selected':''}>%0</option>
    </select>
    <input type="text" inputmode="decimal" autocomplete="off" id="alKdvM_${n}" placeholder="matrah (KDV hariç)" value="${matrah??''}">
    <input type="text" inputmode="decimal" autocomplete="off" id="alKdvT_${n}" placeholder="KDV tutarı" value="${kdv??''}">
    <button class="sil" onclick="document.getElementById('alKdvS_${n}').remove(); alHesapla();">✕</button>`;
  kap.appendChild(d);
  const tEl = document.getElementById('alKdvT_'+n);
  // Matrah yazılınca KDV hesaplanır; kullanıcı/OCR elle yazdıysa BİR DAHA ÜZERİNE YAZILMAZ
  tEl.addEventListener('input', ()=>{ tEl.dataset.elle = tEl.value.trim()===''?'':'1'; });
  if (kdv !== undefined && kdv !== null && kdv !== '') tEl.dataset.elle = '1';
  const hesapla = ()=>{
    if (tEl.dataset.elle === '1') return;
    const m = paraOku(document.getElementById('alKdvM_'+n)).deger;
    const o = +document.getElementById('alKdvO_'+n).value || 0;
    tEl.value = m > 0 ? (m * o/100).toFixed(2) : '';
  };
  paraBagla(document.getElementById('alKdvM_'+n), ()=>{ hesapla(); alHesapla(); });
  paraBagla(tEl, alHesapla);
  document.getElementById('alKdvO_'+n).addEventListener('change', ()=>{ hesapla(); alHesapla(); });
  alHesapla();
}
function alKdvOku(){
  const sonuc = [];
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const pm = paraOku(document.getElementById('alKdvM_'+n));
    const pt = paraOku(document.getElementById('alKdvT_'+n));
    if (!pm.ok || !pt.ok) throw new Error('KDV satırında geçersiz tutar var — örnek: 2239,60');
    if (pm.deger > 0 || pt.deger > 0)
      sonuc.push({ oran:+document.getElementById('alKdvO_'+n).value, matrah:pm.deger, kdv_tutar:pt.deger });
  });
  return sonuc;
}
/* KDV dökümünde matrah boş kalmışsa KDV'den geri hesapla.
   Fatura çoğu zaman KDV tutarını yazar, matrahı ayrı sütunda vermez.
   Matrah boş kalınca satır karşılaştırması "0'a eşit değil" deyip ürünleri engelliyordu.
   Kesin dayanak: toplam − KDV toplamı = toplam matrah. Oran bazlı dağıtım kdv/oran ile,
   yuvarlama farkı en büyük satıra yazılır. */
function alMatrahTamamla(){
  const sat = [];
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    sat.push({ n, oran:+document.getElementById('alKdvO_'+n).value || 0,
               mEl:document.getElementById('alKdvM_'+n), tEl:document.getElementById('alKdvT_'+n) });
  });
  if (!sat.length) return 0;
  const kdvOf = s => paraOku(s.tEl).deger;
  const bos = sat.filter(s => paraOku(s.mEl).deger === 0 && kdvOf(s) > 0 && s.oran > 0);
  if (!bos.length) return 0;
  bos.forEach(s => { s.tahmin = +(kdvOf(s) / (s.oran/100)).toFixed(2); });
  /* ⚠ FARK DAĞITIMI KALDIRILDI (B05).
     Eskiden belge toplamıyla tahmin arasındaki fark, hedefin %2'sine kadar
     EN BÜYÜK satırın matrahına yazılıyordu. Bu, satırın kendi denklemini
     (matrah × oran = KDV) bozarak belge denklemini tutturuyordu; ekran da
     yeşil "belge tutuyor" diyordu. Yeniden üretildi:
       toplam 1.120 · KDV 100 · oran %10 -> matrah 1.020 yazılıyordu,
       oysa 1.020'nin %10'u 102, yazan KDV 100. Aritmetik eşitlik veri
       doğruluğunu KANITLAMAZ.
     Artık matrah yalnız kendi satırından türetilir: kdv / oran.
     Fark varsa kapatılmaz — alHesapla iki denklemi AYRI AYRI gösterir. */
  bos.forEach(s => {
    s.mEl.value = String(s.tahmin).replace('.', ',');
    /* ⚠ ADIM 14 B · YESIL DEGIL: bu deger belgeden OKUNMADI, hesaplandi.
       Eskiden `oku-dolu` (yesil zemin) alıyordu ve ekranda okunan
       alanlardan AYIRT EDILEMIYORDU. */
    s.mEl.classList.remove('oku-dolu');
    s.mEl.classList.add('oku-turetildi');
    /* belgeden okunmadı, hesaplandı: alHesapla bunu ayrı anlatır */
    s.mEl.dataset.hesaplandi = '1';
    /* ⚠ KULLANICI DUZELTIRSE ISARET DUSER. Olmazsa bayrak asili kalir,
       alHesapla yesili SONSUZA KADAR vermez ve kullanici belgeden
       yazdigi dogru matrahla bile "okunmadi" uyarisi gorurdu. Isaret bir
       KAYNAK beyani; kaynak degisince beyan da degisir. */
    if (s.mEl.dataset.turetildiBagli !== '1'){
      s.mEl.dataset.turetildiBagli = '1';
      s.mEl.addEventListener('input', () => {
        if (s.mEl.dataset.hesaplandi !== '1') return;
        delete s.mEl.dataset.hesaplandi;
        s.mEl.classList.remove('oku-turetildi');
        alHesapla();
      });
    }
  });
  alHesapla();
  return bos.length;
}
/* ⚠ İKİ DENKLEM, BAĞIMSIZ KONTROL (B05):
     SATIR denklemi : matrah × oran% = o satırın KDV'si
     BELGE denklemi : Σmatrah + Σkdv = ödenecek tutar
   Belge denklemini tutturmak için satır denklemini bozan bir rakam yazılırsa
   toplam "tutuyor" görünür ama veri yanlıştır. Yeşil onay artık İKİSİ BİRDEN
   tutmadan verilmez. Satır denklemi tutmuyorsa bu belgenin hatalı olduğu
   anlamına GELMEZ — iskonto/istisna/tevkifat da bozar; o yüzden söylenir,
   engellenmez. */
/* ==================================================================
   ADIM 14 B · OKUMA ONAY TABLOSU — borc.html:6208-6300'un AYNISI
   ==================================================================
   Kullanici RAKAMI degil ESLESMEYI dogrular: her satirin yaninda

   bulundugu yazar. Bugun index'te bu bilgi ya HIC yoktu ya da uc ayri
   kutuya dagilmisti.
   ⚠ SATIR SOZLESMESI: { alan, deger, ham, etiket, nasil }
     deger : KAYDEDILECEK deger (bicimlenmis)
     ham   : belgede yazan — deger'den FARKLIYSA ikinci satirda cikar,
             AYNIYSA HIC cikmaz. borc'un kurali; ayni rakami iki kez
             yazmak gurultudur.
   ⚠ ONEK "Belgede:" — borc'ta "PDF'te:" yazar cunku o okuyucu YALNIZ

const AX_BASLIK = ['ALAN','OKUNAN','KAYNAK ETİKET','NASIL BULUNDU'];
const AX_HAM_ONEK = 'Belgede: ';
function axTabloCiz(kap, satirlar){
  if (!kap) return;
  kap.textContent = '';
  if (!satirlar || !satirlar.length) return;
  const sar = document.createElement('div'); sar.className = 'tablo-sar';
  const t = document.createElement('table'); t.className = 'ax-t';
  const hr = document.createElement('tr');
  AX_BASLIK.forEach((h, i) => {
    const th = document.createElement('th');
    if (i === 1) th.className = 'sag';
    th.textContent = h; hr.appendChild(th);
  });
  t.appendChild(hr);
  const hucre = (et, metin, sinif) => {
    const td = document.createElement('td');
    td.dataset.et = et; if (sinif) td.className = sinif;
    if (metin != null) td.textContent = metin;
    return td;
  };
  for (const s of satirlar){
    const tr = document.createElement('tr');
    tr.appendChild(hucre('ALAN', s.alan));
    const c2 = hucre('OKUNAN', null, 'sag');
    if (s.deger == null || s.deger === ''){
      const g = document.createElement('span'); g.className = 'gri';
      g.textContent = '—'; c2.appendChild(g);
    } else {
      const d = document.createElement('div'); d.textContent = s.deger;
      c2.appendChild(d);
      const ham = String(s.ham == null ? '' : s.ham).trim();
      if (ham && ham !== s.deger){
        const alt = document.createElement('div');
        alt.className = 'kucuk'; alt.style.marginTop = '2px';
        alt.textContent = AX_HAM_ONEK + ham;
        c2.appendChild(alt);
      }
    }
    tr.appendChild(c2);
    tr.appendChild(hucre('KAYNAK ETİKET', s.etiket ? '"' + s.etiket + '"' : '—'));
    tr.appendChild(hucre('NASIL BULUNDU', s.nasil || DIL.EKSIK));
    t.appendChild(tr);
  }
  sar.appendChild(t); kap.appendChild(sar);
}
/* Fatura okumasinin ciktisini satir sozlesmesine cevirir.
   ⚠ KAYNAK ETIKET UYDURULMUYOR: okuyucu bir PDF etiketi dondurmuyor,
     ama HANGI ALANINDAN okundugunu biliyoruz (odenecek mi genel_toplam
     mi, kdv_kirilim mi kdv_toplam mi). Kullanicinin dogruladigi sey
     tam olarak budur: rakam nereden geldi. */
function alOkumaSatirlari(v){
  const s = [];
  const trh = (x) => { try { return new Date(x+'T00:00').toLocaleDateString('tr-TR'); }
                       catch(e){ return x; } };
  s.push({ alan:'Tarih', deger: v.tarih ? trh(v.tarih) : null, ham: v.tarih,
    etiket: v.tarih ? 'tarih' : null,
    nasil: v.tarih ? DIL.OKUNDU : DIL.EKSIK });
  s.push({ alan:'Belge no', deger: v.belge_no || null, ham: v.belge_no,
    etiket: v.belge_no ? 'belge_no' : null,
    nasil: v.belge_no ? DIL.OKUNDU : DIL.EKSIK });
  const topHam = v.odenecek ?? v.genel_toplam;
  s.push({ alan:'Ödenecek tutar',
    deger: topHam == null ? null : tl(+topHam), ham: topHam == null ? null : String(topHam),
    etiket: v.odenecek != null ? 'odenecek' : (v.genel_toplam != null ? 'genel_toplam' : null),
    nasil: topHam == null ? DIL.EKSIK : DIL.OKUNDU });
  /* KDV satirlari — ekrandaki kutulardan okunur, cunku matrah orada
     HESAPLANMIS olabilir (alMatrahTamamla). Tablo, kaydedilecek olani
     gosterir; nereden geldigini de o alanin kendi bayragi soyler. */
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d => {
    const n = d.id.split('_')[1];
    const mEl = document.getElementById('alKdvM_'+n);
    const tEl = document.getElementById('alKdvT_'+n);
    const oran = document.getElementById('alKdvO_'+n).value;
    const kirilimVar = Array.isArray(v.kdv_kirilim) && v.kdv_kirilim.length;
    const kaynak = kirilimVar ? 'kdv_kirilim' : 'kdv_toplam';
    const hesaplandi = mEl.dataset.hesaplandi === '1';
    const kirilim = kirilimVar
      ? v.kdv_kirilim.find(x => String(x.oran) === String(oran)) : null;
    s.push({ alan:'%'+oran+' matrah', deger: mEl.value || null,
      ham: hesaplandi ? null : (kirilim && kirilim.matrah != null ? String(kirilim.matrah)
                                : (v.mal_hizmet_toplam != null ? String(v.mal_hizmet_toplam) : null)),
      etiket: hesaplandi ? null : kaynak,
      nasil: !mEl.value ? DIL.EKSIK
           : (hesaplandi ? dilHesaplandi('KDV ÷ %'+oran) : DIL.OKUNDU) });
    s.push({ alan:'%'+oran+' KDV', deger: tEl.value || null,
      ham: kirilim && kirilim.kdv_tutar != null ? String(kirilim.kdv_tutar)
           : (v.kdv_toplam != null ? String(v.kdv_toplam) : null),
      etiket: tEl.value ? kaynak : null,
      nasil: tEl.value ? DIL.OKUNDU : DIL.EKSIK });
  });
  s.push({ alan:'Tedarikçi', deger: (v.tedarikci && v.tedarikci.ad) || null,
    ham: (v.tedarikci && v.tedarikci.ad) || null,
    etiket: (v.tedarikci && v.tedarikci.ad) ? 'tedarikci.ad' : null,
    nasil: (v.tedarikci && v.tedarikci.ad) ? DIL.OKUNDU : DIL.EKSIK });
  return s;
}
function alHesapla(){
  let kdv = 0, matrah = 0, gecerli = true;
  const bozukSatir = [];
  /* ==================================================================
     ⚠ ADIM 14 · YESIL ONAY, BELGEDEN OKUNMAMIS ALAN VARKEN VERILMEZ
     ==================================================================
     OLCULDU: matrah sutunu okunamayinca alMatrahTamamla onu satirin
     KENDI KDV'si ve oranindan hesapliyor (ADIM 06'nin dogru karari),
     sonra buradaki denklem kendiliginden tutuyor ve ekran
     "✓ belge tutuyor" diyordu. Matrahi OKUNMUS ve HESAPLANMIS iki
     turda cumle BIREBIR AYNIYDI — yani yesil, eksigi PERDELIYORDU.
     Uyari vardi ama BASKA kutuda (alOkuOzet); bu kutu ondan habersizdi.
     ⚠ dataset.hesaplandi ADIM 06'da yaziliyor ama HIC OKUNMUYORDU;
       okuyan yer burasi.
     ⚠ ADIM 06'nin iki-denklem kontrolu ve metinleri DEGISMEDI; bu
       UCUNCU bir kosul. */
  const hesaplananlar = [];
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const pm = paraOku(document.getElementById('alKdvM_'+n));
    const pt = paraOku(document.getElementById('alKdvT_'+n));
    const oran = +document.getElementById('alKdvO_'+n).value || 0;
    if (document.getElementById('alKdvM_'+n).dataset.hesaplandi === '1')
      hesaplananlar.push('%' + oran);
    if (!pm.ok || !pt.ok) gecerli = false;
    matrah += pm.deger; kdv += pt.deger;
    if (pm.ok && pt.ok && pm.deger > 0 && pt.deger > 0 && oran > 0){
      const bek = +(pm.deger * oran / 100).toFixed(2);
      if (Math.abs(bek - pt.deger) > 0.05)
        bozukSatir.push({ oran, matrah:pm.deger, kdv:pt.deger, bek });
    }
  });
  kdv = +kdv.toFixed(2); matrah = +matrah.toFixed(2);
  const el = document.getElementById('alKdvToplam'); if(el) el.textContent = tl(kdv);
  const pT = paraOku(document.getElementById('alToplam'));
  const toplam = pT.deger;
  const tut = document.getElementById('alTutarlilik'); if(!tut) return;
  if (!gecerli || !pT.ok){
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--hata)">Geçersiz tutar var — örnek: 3750,00</div>`; return;
  }
  if (toplam === 0 || kdv === 0){ tut.innerHTML = ''; return; }
  // Matrah + KDV = ödenecek tutar mı? (belgenin kendi aritmetiği)
  const fark = +(matrah + kdv - toplam).toFixed(2);
  const belgeTutuyor = Math.abs(fark) <= 0.05;
  const satirNot = bozukSatir.map(b =>
    `%${b.oran} satırı: ${tl(b.matrah)} × %${b.oran} = <b>${tl(b.bek)}</b>, yazan KDV <b>${tl(b.kdv)}</b>`
  ).join('<br>');
  if (belgeTutuyor && !bozukSatir.length && hesaplananlar.length){
    /* ⚠ ARITMETIK TUTUYOR AMA RAKAM BELGEDEN GELMIYOR — yesil YOK.
       Hesaplanan matrah, kendi KDV'sinden turedigi icin satir oranini
       HER ZAMAN tutturur; o esitlik bir sey KANITLAMAZ. */
    /* ⚠ ADIM 14 B · hukum sozlukten; cumlenin gerisi bu ekrana ozgu. */
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--uyari)">⚠ Toplam eşitliği tutuyor
      (${tl(matrah)} + ${tl(kdv)} = ${tl(toplam)}) ama ${hesaplananlar.length} satırın matrahı:
      <b>${esc(dilHesaplandi('satırın kendi KDV\'si ÷ oranı'))}</b>
      (${esc(hesaplananlar.join(', '))}). Hesaplanan matrah kendi oranını her zaman tutturur,
      bu eşitlik doğruluğu KANITLAMAZ. Matrahı belgeden karşılaştır; tutmuyorsa elle düzelt.</div>`;
  } else if (belgeTutuyor && !bozukSatir.length){
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--ok)">✓ Matrah ${tl(matrah)} + KDV ${tl(kdv)} = ${tl(toplam)} — belge tutuyor</div>`;
  } else if (belgeTutuyor){
    /* ⚠ TOPLAM TUTUYOR AMA SATIR TUTMUYOR — yeşil onay VERİLMEZ. */
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--uyari)">⚠ Toplam eşitliği tutuyor
      (${tl(matrah)} + ${tl(kdv)} = ${tl(toplam)}) <b>ama satır oranı tutmuyor</b>:<br>${satirNot}<br>
      Bu, belgenin hatalı olduğu anlamına gelmez — iskonto, istisna ya da tevkifat da böyle görünür.
      Belgeyle karşılaştır; tutturmak için rakam değiştirme.</div>`;
  } else {
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--uyari)">⚠ Matrah ${tl(matrah)} + KDV ${tl(kdv)} = ${tl(matrah+kdv)},
      ödenecek tutar ${tl(toplam)} — <b>${fark>0?'+':''}${tl(fark)}</b> fark var. Belgeyle karşılaştır.
      ${satirNot ? '<br>Ayrıca satır oranı da tutmuyor:<br>'+satirNot : ''}</div>`;
  }
}
/* ===== e-FATURA PDF'İNDEN METİN ÇIKARMA =====
   Luca portalından inen e-fatura PDF'leri METİN tabanlı. Fotoğraf çekip okutmak yerine
   metni doğrudan çıkarırız: rakamlar birebir doğru, Türkçe karakter bozulmaz, maliyet düşük.
   Metin çıkmazsa (taranmış PDF) fotoğraf yoluna düşeriz. */
function pdfHazir(){
  const L = window.pdfjsLib;
  if (!L) return null;
  if (!L.GlobalWorkerOptions.workerSrc)
    L.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  return L;
}
async function pdfMetinCikar(file){
  const L = pdfHazir();
  if (!L) throw new Error('PDF okuyucu yüklenemedi — internet bağlantısını kontrol et.');
  const buf = await file.arrayBuffer();
  const pdf = await L.getDocument({ data: buf }).promise;
  const sayfalar = [];
  const enFazla = Math.min(pdf.numPages, 10);            // fatura 1-2 sayfa; kaçak dosyaya karşı sınır
  for (let i = 1; i <= enFazla; i++){
    const sy = await pdf.getPage(i);
    const ic = await sy.getTextContent();
    // Satır satır topla: aynı y'deki parçalar tek satır olsun (sütun hizası korunsun)
    const satirlar = new Map();
    ic.items.forEach(it => {
      if (!it.str) return;
      const y = Math.round(it.transform[5]);
      if (!satirlar.has(y)) satirlar.set(y, []);
      satirlar.get(y).push({ x: it.transform[4], s: it.str });
    });
    const metin = [...satirlar.entries()]
      .sort((a,b) => b[0] - a[0])                        // yukarıdan aşağı
      .map(([,p]) => p.sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim())
      .filter(Boolean).join('\n');
    sayfalar.push(metin);
  }
  const tam = sayfalar.join('\n\n--- SAYFA ---\n\n').trim();
  return { metin: tam, sayfa: pdf.numPages, yeterli: tam.length >= 200 };
}

function alTedarikciEslestir(ocrAd, ocrVkn){
  const norm = s => (s||'').toString().toUpperCase()
    .replace(/[İI]/g,'I').replace(/[ŞS]/g,'S').replace(/[ĞG]/g,'G')
    .replace(/[ÜU]/g,'U').replace(/[ÖO]/g,'O').replace(/[ÇC]/g,'C')
    .replace(/[^A-Z0-9]/g,'');
  const liste = KATALOG.tedarikciler || [];
  const vkn = (ocrVkn||'').replace(/\D/g,'');
  if (vkn){
    const v = liste.find(t => (t.vergi_no||'').replace(/\D/g,'') === vkn);
    if (v) return { t:v, nasil:'VKN' };
  }
  const a = norm(ocrAd);
  if (a.length >= 4){
    const t = liste.find(x => { const y = norm(x.unvan||x.ad);
      return y.length>=4 && (y.startsWith(a.slice(0,8)) || a.startsWith(y.slice(0,8))); });
    if (t) return { t, nasil:'isim' };
  }
  return { t:null, nasil:null };
}

/* ===== FATURA SATIRLARI — tanı, eşleştir, bir daha sorma =====
   Tedarikçinin yazımı → bizim ürün eşleşmesi bir kez kurulur (urun_alias),
   sonraki faturalarda otomatik bağlanır. Eşleşme önce KOD'dan, kod yoksa isimden.
   Satır toplamı belgeyle tutmuyorsa ürün kaydı YAPILMAZ. */
let AL_SATIRLAR = [];
const birimNorm = s => (s||'').toString().toUpperCase().replace(/\s+/g,' ').trim();

async function alSatirlariKur(satirlar, tedarikciId){
  AL_SATIRLAR = [];
  const kap = document.getElementById('alSatirlar'); if(!kap) return;
  if (!Array.isArray(satirlar) || !satirlar.length){ kap.innerHTML=''; return; }
  let alias = [];
  if (tedarikciId){
    const { data } = await sb.from('urun_alias')
      .select('tedarikci_kodu,ham_ad,urun_id,birim_carpani')
      .eq('tedarikci_id', tedarikciId).eq('is_deleted', false);
    alias = data || [];
  }
  satirlar.forEach((s,i)=>{
    const kod = (s.kod||'').toString().trim();
    let es = null, nasil = null;
    if (kod){
      es = alias.find(a => (a.tedarikci_kodu||'').trim().toUpperCase() === kod.toUpperCase());
      if (es) nasil = 'kod';
    }
    if (!es){
      es = alias.find(a => birimNorm(a.ham_ad) === birimNorm(s.ad));
      if (es) nasil = 'isim';
    }
    // İSKONTO DÜZELTMESİ — modelin aritmetiğine güvenme.
    // Fatura iskonto ORANINI yazıyor; satır tutarına brüt yazılmışsa net'i BİZ hesaplarız.
    // Uydurma değil: belgede yazan oranı belgede yazan brüte uygularız, sonra matrahla doğrularız.
    const miktar = +s.miktar||0, liste = +s.birim_fiyat||0;
    const brut   = +(miktar * liste).toFixed(2);
    const iskO   = +s.iskonto_orani || 0;
    let   net    = +s.satir_tutar || 0;
    let   iskT   = s.iskonto_tutar != null ? +s.iskonto_tutar : null;
    let   duzeltme = null;
    if (brut > 0 && Math.abs(net - brut) <= 0.05){          // satır tutarı = brüt (iskonto uygulanmamış)
      if (iskO > 0){
        net  = +(brut * (1 - iskO/100)).toFixed(2);
        iskT = +(brut - net).toFixed(2);
        duzeltme = `%${iskO} iskonto uygulandı`;
      } else if (iskT > 0){
        net  = +(brut - iskT).toFixed(2);
        duzeltme = `${tl(iskT)} iskonto düşüldü`;
      }
    }
    if (iskT == null && iskO > 0 && brut > net) iskT = +(brut - net).toFixed(2);
    // Paketleme çakışması: hafızadaki çarpan ile faturadan okunan farklıysa hafıza esas, ama HABER VER
    const ocrPaket = +s.paket_ici_adet || 0;
    const carpan   = es ? +es.birim_carpani : (ocrPaket || 1);
    const paketCakisma = (es && ocrPaket > 0 && Math.abs(ocrPaket - carpan) > 0.001) ? ocrPaket : null;

    AL_SATIRLAR.push({
      i, ham_ad:(s.ad||'').toString().trim(), ham_kod:kod||null,
      miktar, birim:(s.birim||'').toString().trim()||null,
      birim_fiyat:liste, satir_tutar:net, brut,

          { p_ham_ad: s.ham_ad, p_tedarikci: tedarikciId || null, p_limit: 4 });
        s.benzer = Array.isArray(data) ? data : [];

    }));

  alSatirCiz();
}

function alSatirKarar(i){
  const s = AL_SATIRLAR.find(x=>x.i===i); if(!s) return;
  const v = document.getElementById('fsU_'+i).value;
  if (v === '__yeni'){ s.karar='yeni'; s.urun_id=null; s.eslesme=null; }
  else if (v === '__atla'){ s.karar='atla'; s.urun_id=null; s.eslesme=null; }
  else { s.karar='mevcut'; s.urun_id=v; s.eslesme='elle'; }
  alSatirCiz();
}
function alSatirDenetim(){
  const el = document.getElementById('fsDenetim'); if(!el) return;
  const kalan = AL_SATIRLAR.filter(s=>s.karar!=='atla');
  const satirT = +kalan.reduce((a,s)=>a+s.satir_tutar,0).toFixed(2);
  // Faturanın matrahı: KDV dökümündeki matrahların toplamı
  let matrah = 0;
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    matrah += paraOku(document.getElementById('alKdvM_'+d.id.split('_')[1])).deger;
  });

  const toplam = paraOku(document.getElementById('alToplam')).deger;
  if (!kalan.length){ el.innerHTML = ''; AL_SATIR_TUTUYOR = true; return; }
  const hedef = matrah > 0 ? matrah : toplam;
  const etiket = matrah > 0 ? 'fatura matrahı' : 'ödenecek tutar';
  const fark = +(satirT - hedef).toFixed(2);

        ${etiket} <b>${tl(hedef)}</b> — <b>${fark>0?'+':''}${tl(fark)}</b> fark var.<br>

        <b>Düzeltmeden ürün kaydı yapılmaz</b> — fatura, tutarı ve KDV'siyle yine kaydedilir.</div>`;

let AL_SATIR_TUTUYOR = true;
/* Yeni ürünleri oluştur, eşleşmeyi hafızaya yaz, kalem listesini döndür */
let YENI_URUN_UYARI = [];   // personelin açtığı, yöneticinin gözden geçireceği ürünler
async function alSatirKaydet(tedarikciId){
  YENI_URUN_UYARI = [];
  const kalan = AL_SATIRLAR.filter(s=>s.karar!=='atla');
  if (!kalan.length || !AL_SATIR_TUTUYOR) return [];
  const kalemler = [];
  for (const s of kalan){
    let urunId = s.urun_id;
    let carpan = s.carpan;
    let ad = null, birim = 'adet';
    if (s.karar === 'yeni'){
      ad = (document.getElementById('fsAd_'+s.i)?.value||s.ham_ad).trim();
      birim = document.getElementById('fsBirim_'+s.i)?.value || 'adet';
      const pk = paraOku(document.getElementById('fsPaket_'+s.i));
      carpan = pk.deger > 0 ? pk.deger : 1;
      if (!ad) throw new Error('Yeni ürünün adı boş olamaz.');
    }
    // Ürün + eşleşme TEK fonksiyonda. Personel tabloya doğrudan yazamaz (RLS),
    // bu fonksiyon üzerinden tanımlayabilir; açtığı ürün yöneticinin onayına düşer.
    const { data:r, error:re } = await sb.rpc('rpc_urun_tanimla', {
      p_ad: ad, p_birim: birim,
      p_paket_ici: carpan > 1 ? carpan : null,
      p_kategori: null,
      p_tedarikci: tedarikciId || null,
      p_ham_kod: s.ham_kod, p_ham_ad: s.ham_ad,
      p_carpan: carpan, p_birim_ad: s.birim,
      p_urun_id: s.karar === 'yeni' ? null : urunId
    });
    if (re) throw new Error('Ürün tanımlanamadı: ' + hataTr(re.message));
    urunId = r.urun_id;
    if (s.karar === 'yeni' && r.yeni){
      KATALOG.urunler.push({ id:r.urun_id, ad, birim, kod:r.kod, paket_ici_adet: carpan>1?carpan:null });
      YENI_URUN_UYARI.push(`${r.kod} ${ad}`);
    }
    kalemler.push({ urun_id:urunId, miktar:s.miktar, birim_fiyat:s.birim_fiyat,
      ham_ad:s.ham_ad, ham_kod:s.ham_kod, birim_ad:s.birim, birim_carpani:carpan,
      satir_tutar:s.satir_tutar, kdv_orani:s.kdv_orani,
      iskonto_orani:s.iskonto_orani, iskonto_tutar:s.iskonto_tutar });
  }
  return kalemler;
}

  // Belgenin kendi aritmetiği: matrah + KDV = ödenecek

/* AY RAPORU
   HTML'i sunucu üretiyor (fn_ay_raporu_html). Ay sonu e-postası da AYNI
   fonksiyonu kullanacak — ekranda gördüğün ile mailde gelen birebir aynı olsun,
   iki ayrı şablon iki ayrı rakam riski doğurmasın. */
async function ayRaporuAc(donem){
  const ov = udKutu(), ic = document.getElementById('udIcerik');
  ic.innerHTML = `<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Rapor hazırlanıyor...</div></div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  ov.classList.add('acik');
  const { data, error } = await sb.rpc('fn_ay_raporu_html',
    { p_donem: donem, p_sube: AKTIF_SUBE });
  if (error || !data){
    ic.innerHTML = `<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Rapor açılamadı</div></div>
      <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>
      <div class="uyari-agir" style="margin:12px">${esc(hataTr(error?.message||'boş yanıt'))}</div>`;
    return;
  }
  ic.innerHTML = `<div class="ud-ust"><div style="flex:1"><div class="ud-ad">${esc(ayAdi(donem))} Raporu</div></div>
      <button class="btn2" onclick="ayRaporuYazdir()">Yazdır / PDF</button>
      <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>
    <div id="ayRaporIcerik" style="padding:14px 12px;overflow-x:auto">${data}</div>`;

function ayRaporuYazdir(){
  const ic = document.getElementById('ayRaporIcerik');
  if (!ic) return;
  const w = window.open('', '_blank');
  if (!w){ bildir('Tarayıcı yeni sekmeyi engelledi — açılır pencere iznini ver.', 'hata'); return; }
  w.document.write('<!doctype html><html lang="tr"><head><meta charset="utf-8">'
    + '<title>Bardaks KTÜ — Ay Raporu</title>'
    + '<style>body{margin:24px;background:#fff}@media print{body{margin:0}}</style>'
    + '</head><body>' + ic.innerHTML + '</body></html>');
  w.document.close();
  setTimeout(()=>w.print(), 400);
}
function udKapat(){
  const o=document.getElementById('udOverlay');
  if(o){ o.classList.remove('acik'); document.getElementById('udIcerik').innerHTML=''; }
}
function udKutu(){
  let o=document.getElementById('udOverlay');
  if(!o){
    o=document.createElement('div'); o.id='udOverlay'; o.className='ud-ov';
    o.innerHTML='<div class="ud-kutu" id="udIcerik"></div>';
    document.body.appendChild(o);
    o.addEventListener('click', e=>{ if(e.target===o) udKapat(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') udKapat(); });
  }
  return o;
}
/* Zaman-fiyat çizgisi. Tek nokta varsa çizgi yok, sadece işaret. */
/* ⚠ Y13 · `olcusuz`: zemini belirlenemeyen alimlar. Y EKSENINE
     KONMAZLAR — koysaydik "bu nokta su fiyatta" demis olurduk, oysa
     hangi zeminde oldugunu bilmiyoruz. Alt cizgide gri isaret olarak
     dururlar: alim VAR, ama bu olcege oturmuyor. Dosyanin kurali:
     bilinmiyor, bir HALDIR — sessizce yanlis cizmektense isaretle. */
function fiyatGrafigi(nk, olcusuz){
  if(!nk.length) return '';
  olcusuz = olcusuz || [];
  const G=320, Y=112, sol=46, sag=10, ust=12, alt=22;
  const iw=G-sol-sag, ih=Y-ust-alt;
  const fy=nk.map(p=>p.fiyat);
  let enAz=Math.min(...fy), enCok=Math.max(...fy);
  if(enCok-enAz < 0.005){ const p=Math.max(enCok*0.06, 1); enAz-=p; enCok+=p; }
  /* Zaman ekseni olcusuz noktalari da kapsar — yoksa gri isaret
     grafigin disina duserdi. */
  const tumTs=[...nk.map(p=>p.ts), ...olcusuz.map(p=>p.ts)];
  const t0=Math.min(...tumTs), t1=Math.max(...tumTs), dt=(t1-t0)||1;
  const X=p=>sol+(tumTs.length===1?iw/2:((p.ts-t0)/dt)*iw);
  const Yp=p=>ust+ih-((p.fiyat-enAz)/(enCok-enAz))*ih;
  const kisa=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.',',')+'b':n.toFixed(n<10?2:0).replace('.',',');
  const cizgi=nk.map((p,i)=>(i?'L':'M')+X(p).toFixed(1)+' '+Yp(p).toFixed(1)).join(' ');
  const dolgu=nk.length>1
    ? `<path d="${cizgi} L ${X(nk[nk.length-1]).toFixed(1)} ${ust+ih} L ${X(nk[0]).toFixed(1)} ${ust+ih} Z"
        fill="var(--ana)" opacity=".07"/>` : '';
  const tarihEt=p=>new Date(p.ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'});
  return `<svg viewBox="0 0 ${G} ${Y}" role="img" aria-label="Birim fiyat geçmişi">
    ${[0,0.5,1].map(f=>{const y=ust+ih*f;return`<line x1="${sol}" y1="${y}" x2="${G-sag}" y2="${y}"
       stroke="var(--cizgi)" stroke-width="1"/>`}).join('')}
    <text x="4" y="${ust+4}" font-size="9" font-weight="700" fill="var(--soluk)">${kisa(enCok)}</text>
    <text x="4" y="${ust+ih+3}" font-size="9" font-weight="700" fill="var(--soluk)">${kisa(enAz)}</text>
    ${dolgu}
    ${nk.length>1?`<path d="${cizgi}" fill="none" stroke="var(--ana)" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${nk.map((p,i)=>{
      const son=i===nk.length-1, art=i>0 && p.fiyat>nk[i-1].fiyat+0.005;
      const onceki=i>0?nk[i-1]:null;
      const fark=onceki&&onceki.fiyat>0?((p.fiyat-onceki.fiyat)/onceki.fiyat*100):0;
      /* Ipucu metni: dokunmadan once parmagini bekletince de gorunsun */
      const ipucu=new Date(p.ts).toLocaleDateString('tr-TR')+' · '+tl(p.fiyat)+'/'+(p.birim||'')
        + (onceki&&Math.abs(fark)>0.05
            ? ' · onceki '+tl(onceki.fiyat)+' ('+(fark>0?'+':'')+fark.toFixed(1).replace('.',',')+'%)' : '')
        + (p.belge?' · '+p.belge:'') + ' — dokun, faturasi acilsin';
      const cx=X(p).toFixed(1), cy=Yp(p).toFixed(1);
      /* Gorunen nokta kucuk ama DOKUNMA HEDEFI genis: telefonda 3px'lik
         daireye parmakla isabet ettirilemez. Seffaf buyuk daire o isi gorur. */
      return `<circle cx="${cx}" cy="${cy}" r="${son?4.5:3.2}"
          fill="${art?'var(--hata)':'var(--ana)'}" stroke="var(--kagit)" stroke-width="1.6"
          style="pointer-events:none"/>
        ${p.alisId?`<circle cx="${cx}" cy="${cy}" r="13" fill="transparent" style="cursor:pointer"
          onclick="faturaDetay('${p.alisId}')"><title>${esc(ipucu)}</title></circle>`:''}`;
    }).join('')}
    ${/* ⚠ OLCUSUZ ALIMLAR: Y degeri YOK, alt cizgide gri kucuk kare.
          Yukseklige katilmazlar (enAz/enCok onlardan hesaplanmadi) ve
          cizgiye baglanmazlar. Gorunurler cunku o tarihte bir alim
          GERCEKTEN var; yalnizca bu olcege oturmuyor. */''}
    ${olcusuz.map(p=>{
      const cx=X(p).toFixed(1), cy=ust+ih;
      const neden = p.oran==null
        ? 'KDV oranı bilinmiyor'
        : 'fatura kendi içinde tutmuyor';
      const ipucu=new Date(p.ts).toLocaleDateString('tr-TR')
        + ' · bu alım bu ölçeğe indirilemedi (' + neden + ')'
        + (p.belge?' · '+p.belge:'') + (p.alisId?' — dokun, faturasi acilsin':'');
      return `<rect x="${(+cx-3).toFixed(1)}" y="${cy-3}" width="6" height="6"
          fill="none" stroke="var(--soluk)" stroke-width="1.4" style="pointer-events:none"/>
        ${p.alisId?`<circle cx="${cx}" cy="${cy}" r="13" fill="transparent" style="cursor:pointer"
          onclick="faturaDetay('${p.alisId}')"><title>${esc(ipucu)}</title></circle>`:''}`;
    }).join('')}
    ${/* ⚠ Etiket KOSULU eskisiyle AYNI birakildi (`nk.length>1`), yalniz
          olcusuz nokta varsa da yazilir. Degerler t0/t1'den geliyor:
          olcusuz yokken t0=nk[0].ts ve t1=nk[son].ts, yani cikti birebir
          eski. */''}
    <text x="${sol}" y="${Y-6}" font-size="9" font-weight="700" fill="var(--soluk)">${tarihEt({ts:t0})}</text>
    ${(nk.length>1||olcusuz.length)?`<text x="${G-sag}" y="${Y-6}" font-size="9" font-weight="700" fill="var(--soluk)"
       text-anchor="end">${tarihEt({ts:t1})}</text>`:''}
  </svg>`;
}
/* Fatura detayı — satır artık çıkmaz sokak değil: belge, KDV dökümü, ürünler, düzenleme tek yerde */
async function faturaDetay(id){
  const ov=udKutu(), ic=document.getElementById('udIcerik');
  ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Yükleniyor...</div></div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  ov.classList.add('acik');
  const { data:a } = await sb.from('alis')
    .select('*, tedarikci(ad,vergi_no), alis_kdv(oran,matrah,kdv_tutar,is_deleted), alis_kalem(miktar,birim_fiyat,birim_ad,birim_carpani,satir_tutar,iskonto_orani,ham_ad,urun_id,is_deleted,urun(kod,ad,birim))')
    .eq('id',id).maybeSingle();
  if(!a){ ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Fatura bulunamadı</div></div>
    <button class="ud-kapat" onclick="udKapat()">✕</button></div>`; return; }

  const kdv=(a.alis_kdv||[]).filter(x=>!x.is_deleted).sort((x,y)=>x.oran-y.oran);
  const kal=(a.alis_kalem||[]).filter(x=>!x.is_deleted);
  const matrah=kdv.reduce((s,x)=>s+ +x.matrah,0);
  /* v87 · H-66 · Beyan (v_kdv_ay) fatura KDV'sini BAŞLIK alanından okur;
     bu ekran DÖKÜMDEN topluyordu. Başlık doluyken döküm boşsa ekran
     "indirilecek KDV'ye girmiyor" yazıyordu — oysa GİRİYORDU. Karar artık
     başlığa bağlı (beyanla aynı kaynak), dökümle farkı ayrıca gösteriliyor.
     Fatura listesi (faturaListe) zaten başlığa düşüyordu; iki ekran ayrışıktı. */
  const kdvDokum=kdv.reduce((s,x)=>s+ +x.kdv_tutar,0);
  const kdvBaslik=+a.kdv_tutar||0;
  const kdvAyristi=Math.abs(kdvBaslik-kdvDokum)>=0.01;
  const satirT=kal.reduce((s,x)=>s+ +x.satir_tutar,0);
  const t=new Date(a.tarih+'T00:00').toLocaleDateString('tr-TR');
  const bugunS=bugun();
  const vadeGecti=!a.odendi && a.vade_tarihi && a.vade_tarihi<bugunS;

  ic.innerHTML=`
    <div class="ud-ust">
      <div style="flex:1">
        <div class="ud-kod">${esc(a.belge_no||'BELGE NO YOK')} · ${t}</div>
        <div class="ud-ad">${esc(a.tedarikci?.ad||'—')}</div>
      </div>
      <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button>
    </div>
    <div class="ud-govde">
      ${vadeGecti?`<div class="uyari-agir">Vadesi ${new Date(a.vade_tarihi+'T00:00').toLocaleDateString('tr-TR')} — geçti, gecikme zammı işler</div>`:''}
      ${a.tur!=='fatura'?''
        : kdvBaslik===0
          ? `<div class="uyari-orta">Belgede KDV yok — bu fatura indirilecek KDV'ye girmiyor${kdvDokum>0?` (dökümde ${tl(kdvDokum)} var ama belgenin KDV alanı boş)`:''}</div>`
        : kdvAyristi
          ? `<div class="uyari-orta">Belgedeki KDV ${tl(kdvBaslik)}, dökümde ${tl(kdvDokum)} — indirilecek KDV'ye <b>${tl(kdvBaslik)}</b> giriyor</div>`
        : ''}

      <div class="ud-bas"><span class="ud-blk">TUTAR</span></div>
      ${matrah>0?ozSatir('Matrah', tl(matrah)):''}
      ${kdv.map(x=>ozSatir(`KDV %${x.oran}`, tl(x.kdv_tutar))).join('')}
      ${ozSatir('Ödenecek', tl(a.toplam), true)}
      <div class="ipucu" style="margin-top:8px">
        ${a.odendi?'<b style="color:var(--ok)">Ödendi</b>':'<b style="color:var(--uyari)">Ödenmedi</b>'}
        ${a.vade_tarihi?' · vade '+new Date(a.vade_tarihi+'T00:00').toLocaleDateString('tr-TR'):''}
        ${a.tur!=='fatura'?' · '+esc(a.tur==='bilgi_fisi'?'bedelsiz mal gelişi':a.tur):''}
        ${a.tedarikci?.vergi_no?'<br>VKN '+esc(a.tedarikci.vergi_no):''}
      </div>

      <div class="ud-bas" style="margin-top:18px"><span class="ud-blk">ÜRÜNLER · ${kal.length}</span>
        ${kal.length?`<span class="ud-trend">${tl(satirT)}</span>`:''}</div>
      ${kal.length===0
        ? `<div class="ud-bos">Ürün satırı girilmemiş. Düzenle → <b>Belgeyi oku</b> dersen satırlar çıkar,
             stok ve maliyet bu faturadan da beslenir.</div>`
        : kal.map(k=>`<div class="ud-satir">
            <div class="ud-trh">${k.urun?.kod?esc(k.urun.kod):'—'}</div>
            <div><div style="font-size:13px;font-weight:800">${esc(k.urun?.ad||k.ham_ad||'—')}</div>
              <div class="ud-alt">${(+k.miktar).toLocaleString('tr-TR')} ${esc(k.birim_ad||k.urun?.birim||'')}
                × ${tl(k.birim_fiyat)}${k.iskonto_orani?` · %${k.iskonto_orani} iskonto`:''}
                ${+k.birim_carpani>1?` · ${((+k.miktar)*(+k.birim_carpani)).toLocaleString('tr-TR')} ${esc(k.urun?.birim||'adet')}`:''}</div></div>
            <div class="ud-tut">${tl(k.satir_tutar)}</div></div>`).join('')}
      ${kal.length && Math.abs(satirT-matrah)>0.05
        ? `<div class="uyari-orta" style="margin-top:10px">Satır toplamı ${tl(satirT)}, matrah ${tl(matrah)} — fark var</div>`:''}

      <div class="ud-bas" style="margin-top:18px"><span class="ud-blk">BELGE</span></div>
      ${a.foto_path
        ? `<div>${belgeBtn(a.foto_path,'Belgeyi aç',`${t} — ${a.tedarikci?.ad||''} ${a.belge_no||''}`)}</div>`
        : `<div class="ud-bos">Belge yüklenmemiş — ay sonu arşivinde eksik kalır.</div>`}

      <button class="btn" onclick="udKapat();alisDuzenle('${a.id}')">Faturayı Düzenle</button>
    </div>`;
}
async function urunDetay(urunId){
  /* Ipucu ogrenildi: bir daha gosterme (SADELESTIRME). */
  yerelYaz(STOK_IPUCU_ANAHTAR, '1');
  const ip = document.getElementById('stokIpucu'); if (ip) ip.remove();
  const ov=udKutu(), ic=document.getElementById('udIcerik');
  ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Yükleniyor...</div></div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  ov.classList.add('acik');
  const [ur, kl, st] = await Promise.all([
    sb.from('urun').select('kod,ad,birim,paket_ici_adet,kategori,kritik_seviye').eq('id',urunId).maybeSingle(),
    /* ⚠ Y13 · EKLENEN ALANLAR HEPSI SKALER: kalemde `kdv_orani`,
         faturada `toplam` · `kdv_tutar` · `kdv_orani`. Gomme derinligi
         DEGISMEDI (zaten `alis!inner(...tedarikci(ad))` iki kademeydi). */
    sb.from('alis_kalem')
      .select('miktar,birim_fiyat,birim_ad,birim_carpani,satir_tutar,iskonto_orani,kdv_orani,alis!inner(id,tarih,belge_no,is_deleted,toplam,kdv_tutar,kdv_orani,tedarikci(ad))')
      .eq('urun_id',urunId).eq('is_deleted',false).eq('alis.is_deleted',false),
    sb.from('v_stok_durum').select('mevcut,ort_maliyet,stok_degeri,kritik').eq('urun_id',urunId).eq('sube_id', AKTIF_SUBE).maybeSingle()
  ]);
  const u=ur.data, s=st.data;
  if(!u){ ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Ürün bulunamadı</div></div>
    <button class="ud-kapat" onclick="udKapat()">✕</button></div>`; return; }

  /* ===== Y13 · GRAFIGIN ZEMINI =====
     KULLANICI SORUSU: "%20'lik sicrama zam mi, giris bicimi mi?"
     OLCULDU (7 Eylul yedegi, 51 canli kalem):
       · `satir_tutar` ISKONTODAN SONRAKI tutar — iskontolu 6 satirin
         6'si da iskonto dusulmus degere birebir uyuyor, hicbiri brute
         uymuyor. `birim_fiyat` ise LISTE fiyati, iskontodan ONCE.
         Yani grafik bugune kadar ODENEN degil ISTENEN fiyati ciziyordu.
       · `alis.kdv_dahil` bayragi ZEMINI SOYLEMIYOR: 51 kalemin 51'inde
         `true`. Uc yazici da sabit `true` gonderiyor ve bayrak `toplam`
         alanini tarif ediyor, `birim_fiyat`i DEGIL. Bayraga bakan bir
         duzeltme 51 noktanin 51'ini yanlis cevirirdi.
       · `alis_kdv` matrahinin VARLIGI da ayirac DEGIL: matrahsiz tek
         fatura olculdugunde kalemleri yine KDV HARIC cikti (ayni urunun
         ayni fiyati). O proxy ile dogru bir nokta BOZULACAKTI.
     ZEMIN: MALIYETE GIREN BIRIM TUTAR =
       `satir_tutar / (miktar × birim_carpani)`.
       (a) iskonto DUSULMUS, (b) INDIRILECEK KDV cikarilmis,
       (c) STOK BIRIMI basina (adet), ALIM birimi (koli) basina DEGIL.
     ⚠ Y39 · (c) BIR TUR SONRA EKLENDI, CANLI EKRANDAN YAKALANDI:
       kutu "BIRIM MALIYET 8,54" derken grafigin y ekseni 642-724
       araligindaydi — 682,80, yani KOLI basina. Ayni TABAN, farkli
       BIRIM: 8,54 × 80 = 683,2. `miktar` ALIM birimini sayiyor;
       `birim_carpani` bolmeye hic girmiyordu.
       `v_stok_durum.ort_maliyet` = net_tutar / Σ(miktar × carpan),
       yani STOK birimi basina. Grafik onunla ayni zemine ancak
       carpan da bolunerek oturuyor.
     ⚠ KOZMETIK DEGIL: tedarikci ayni fiyata 80 yerine 100 adet
       koydugunda koli fiyati DUZ kalir, adet maliyeti %20 duser.
       Grafigin yakalamasi gereken sey tam olarak budur.
     ⚠ CARPAN 0 ya da YOKSA 1 SAYILIR — ve o nokta "zemini
       bilinmiyor" isaretine DUSURULMEZ. Gerekce: `birim_carpani`
       semada `numeric(12,3) NOT NULL DEFAULT 1` ve
       `CHECK (birim_carpani > 0)`; yedekte NULL ya da <=0 olan
       kalem SIFIR (olculdu). Yani 1'e dusmek bir TAHMIN degil,
       semanin kendi varsayilanini okumak: "paket yok, 1 alim
       birimi = 1 stok birimi". KDV ORANI BUNUN TERSI: o kolon
       hem kalemde hem faturada NULL olabiliyor ve bilinmemesi
       noktayi BASKA BIR OLCEGE dusuruyor (%20 sapma). Biri
       bilinmeyen bir HAL, oteki bilinen bir VARSAYILAN. */
     ⚠ NEDEN "odenen" DEGIL: fatura alimlarinda KDV indiriliyor, yani
       maliyet degil; fis alimlarinda indirilmiyor, yani maliyet — ve
       `satir_tutar` ikisinde de tam olarak "maliyete giren" tutari
       tasiyor. Ustelik `v_stok_durum.ort_maliyet` de
       Σsatir_tutar / Σadet. Yani grafik, HEMEN USTUNDEKI
       "BIRIM MALIYET" ve "STOK DEGERI" ile AYNI zemine oturuyor.
       "Odenen" zemini secseydik grafik, uzerindeki iki rakamla
       celisirdi. Liste fiyati kayip DEGIL: alim dokumunde duruyor. */
  const alisIdler = [...new Set((kl.data||[]).map(k=>k.alis.id))];
  /* Faturanin zemini ARITMETIKLE bulunur, bayrakla degil: o faturanin
     BUTUN kalemlerinin toplami `toplam - kdv_tutar`a mi yoksa `toplam`a
     mi esit. Bu yuzden kardes kalemler ayrica cekilir. */
  let kardesTop = null;
  if (alisIdler.length){
    const { data:kd, error:ke } = await sb.from('alis_kalem')
      .select('alis_id,satir_tutar').in('alis_id', alisIdler).eq('is_deleted', false);
    if (!ke){
      kardesTop = new Map();
      (kd||[]).forEach(x => kardesTop.set(x.alis_id,
        +((kardesTop.get(x.alis_id)||0) + (+x.satir_tutar||0)).toFixed(2)));
    }
    /* ke varsa kardesTop null kalir: zemin denetimi ATLANIR, noktalar
       bugunku gibi cizilir. Sorgu dustu diye grafigi bosaltmak, calisan
       bir ekrani yok etmek olurdu. */
  }
  /* Bir faturanin kalemleri hangi zeminde?
       'maliyet'   -> indirilecek KDV zaten disarida, dogrudan kullanilir
       'brut'      -> icinde indirilecek KDV VAR, orani biliniyorsa inecek
       'tutmuyor'  -> fatura kendi icinde tutmuyor, TAHMIN YOK */
  const zeminBul = (a) => {
    const top = +a.toplam || 0, kdvT = +a.kdv_tutar || 0;
    if (kardesTop == null) return 'maliyet';        // denetim yapilamadi
    const st = kardesTop.get(a.id);
    if (st == null || top <= 0) return 'tutmuyor';
    if (kdvT <= 0) return 'maliyet';                // dusulecek KDV YOK
    if (Math.abs(st - (top - kdvT)) <= 0.05) return 'maliyet';
    if (Math.abs(st - top) <= 0.05) return 'brut';
    return 'tutmuyor';
  };

  const alim=(kl.data||[]).map(k=>{
      const miktar = +k.miktar||0, tutar = +k.satir_tutar||0;
      const liste = +k.birim_fiyat||0;
      const carpan = +k.birim_carpani > 0 ? +k.birim_carpani : 1;
      const stokAdedi = miktar * carpan;          // Y39 · STOK birimi
      /* ⚠ Geri cekilme de STOK birimine cevrilir: `birim_fiyat` ALIM
         birimi basina (koli basina) bir rakam, carpana bolunmezse
         oteki noktalarla ayni olcekte olmaz. */
      let taban = (stokAdedi > 0 && k.satir_tutar != null)
        ? +(tutar / stokAdedi).toFixed(4)
        : +(liste / carpan).toFixed(4);
      const zemin = zeminBul(k.alis);
      /* ⚠ ORAN UYDURULMAZ: once kalemin orani, sonra faturanin orani.
         Ikisi de yoksa nokta CEVRILMEZ, ISARETLENIR. */
      const oran = k.kdv_orani != null ? +k.kdv_orani
                 : (k.alis.kdv_orani != null ? +k.alis.kdv_orani : null);
      let kiyas = null;                      // null ise karsilastirilamaz
      if (zemin === 'maliyet') kiyas = taban;
      else if (zemin === 'brut' && oran != null && oran >= 0)
        kiyas = +(taban / (1 + oran/100)).toFixed(4);
      return {
        ts:new Date(k.alis.tarih+'T00:00').getTime(), tarih:k.alis.tarih,
        fiyat:liste, miktar, carpan,
        birim:k.birim_ad||u.birim, tutar, isk:+k.iskonto_orani||0,
        firma:k.alis.tedarikci?.ad||'—', belge:k.alis.belge_no,
        alisId:k.alis.id,                      // grafik ve satir buradan faturayi acar
        kiyas, zemin, oran
      };
    }).sort((a,b)=>a.ts-b.ts);

  /* Grafik KIYAS degerini cizer; `fiyat` (liste) alim dokumunde kalir.
     ⚠ Y39 · BIRIM DE DEGISIR: `alim[].birim` ALIM birimi (koli) ve
       alim dokumunde OYLE KALMALI — "2 koli × 1.138,00" dogru cumle.
       Ama grafik artik STOK birimi basina ciziyor; ipucu ve alt
       cumle "koli basina" deseydi ekran yalan soylerdi. Yalniz
       grafigin kopyasinda urunun kendi birimi yazilir. */
  const nk = alim.filter(a=>a.kiyas>0)
                 .map(a=>({ ...a, fiyat:a.kiyas, birim:u.birim }));
  const olcusuz = alim.filter(a=>!(a.kiyas>0) && (a.tutar>0 || a.fiyat>0));
  const ilk=nk.length?nk[0].fiyat:0, son=nk.length?nk[nk.length-1].fiyat:0;
  const fark=ilk>0?((son-ilk)/ilk*100):0;
  const toplamTutar=alim.reduce((a,x)=>a+x.tutar,0);
  const toplamAdet=alim.reduce((a,x)=>a+x.miktar*x.carpan,0);

  ic.innerHTML=`
    <div class="ud-ust">
      <div style="flex:1">
        ${u.kod?`<div class="ud-kod">${esc(u.kod)}${u.kategori?' · '+esc(u.kategori):''}</div>`:''}
        <div class="ud-ad">${esc(u.ad)}</div>
      </div>

               alim.some(a=>a.carpan>1) ? 'koli/paket fiyatı' : 'birim fiyatı'} alım dökümünde.${
             olcusuz.length?`<br><span style="color:var(--uyari)">⚠ ${olcusuz.length} alım bu zemine
               indirilemedi — alt çizgide gri kare, çizgiye ve yüzdeye katılmadı (sebebi için dokun).</span>`:''}${
             nk.some(p=>p.alisId)?'<br>Bir noktaya dokun — o alımın faturası ve önceki fiyatla farkı açılır.':''}</div>`
        : `<div class="ud-bos">Bu ürünün ${olcusuz.length?'karşılaştırılabilir ':''}maliyet geçmişi yok —

      <div class="ud-bas"><span class="ud-blk">ALIM GEÇMİŞİ · ${alim.length} kayıt</span>

        : alim.slice().reverse().map((a,i,dizi)=>{
            const onceki=dizi[i+1];
            const zam=onceki&&a.fiyat>onceki.fiyat+0.005, ind=onceki&&a.fiyat<onceki.fiyat-0.005;
            /* "Bu artis ne kardesim" sorusunun cevabi: onceki fiyat ve fark

                  (${(a.fiyat-onceki.fiyat>0?'+':'')+tl(a.fiyat-onceki.fiyat)})</div>` : '';
            const tik=a.alisId?` onclick="faturaDetay('${a.alisId}')" style="cursor:pointer"`:'';
            return `<div class="ud-satir"${tik}>
              <div class="ud-trh">${new Date(a.ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}</div>
              <div><div style="font-size:13px;font-weight:800">${a.miktar.toLocaleString('tr-TR')} ${esc(a.birim)}

                <div class="ud-alt">${esc(a.firma)}${a.isk?' · %'+a.isk+' iskonto':''}

              yazmiyor. Burasi bir <dialog> ici ve ekran okuyucunun
              acik/kapali durumu bilmesi gerekiyor. Ikisi de
              DEGISTIRILMEDI.
            ⚠ Veri: eldeki `alim` dizisi. Sorgu eklenmedi. */''}
      ${alim.length ? `<div class="ud-bas" style="margin-top:16px">

/* ==================================================================
   URUN DETAYI · DONEM KIRILIMI
   ==================================================================
   ⚠ BIRIM TUZAGI — BU BLOGUN ASIL RISKI. Ayni urun farkli birimlerle
     alinabiliyor (birim_ad: koli / adet) ve `birim_carpani` onlari
     urunun TEMEL birimine ceviriyor. Ham `miktar` toplanirsa
     "2 koli + 3 adet = 5" gibi anlamsiz bir rakam cikar.
     ⚠ OLCULDU: bugunku "Toplam alınan" bu kurali ZATEN kullaniyor
       (`alim.reduce((a,x)=>a+x.miktar*x.carpan,0)`). Yani tuzak orada
       kapali; kirilim AYNI kurali kullanmak zorunda, yoksa iki rakam
       ayrisir ve alt toplam ust toplami tutmaz.
   ⚠ ORTALAMA: once TOPLA, sonra BOL. Satir bazinda yuvarlanmis
     ortalamalarin ortalamasi FARKLI bir sayi verir (syTutar'in dersi).
   ⚠ BOS DONEM URETILMEZ: yalnizca gercek alimlar gruplaniyor.
     "0 alindi" ile "hic alinmadi" ayni sey degil (ADIM 07 kurali). */
let UD_ALIM = [], UD_BIRIM = '', UD_KIRILIM_MOD = 'yil';
function udKirilimVerisi(alim, mod){
  const m = new Map();
  for (const a of alim){
    if (!a.tarih) continue;
    const k = mod === 'yil' ? a.tarih.slice(0,4) : a.tarih.slice(0,7);
    const v = m.get(k) || { miktar:0, tutar:0, adet:0 };
    v.miktar += a.miktar * a.carpan;      // ⚠ CARPAN SART
    v.tutar  += a.tutar;
    v.adet++;
    m.set(k, v);
  }
  return [...m.entries()].sort((x,y) => y[0].localeCompare(x[0]));   // yeniden eskiye
}
function udKirilimMod(mod){
  UD_KIRILIM_MOD = mod;
  const y = document.getElementById('udKirYil'), a = document.getElementById('udKirAy');
  if (y) y.classList.toggle('aktif', mod === 'yil');
  if (a) a.classList.toggle('aktif', mod === 'ay');
  udKirilimCiz();
}
function udKirilimCiz(){
  const el = document.getElementById('udKirIcerik'); if (!el) return;
  const satirlar = udKirilimVerisi(UD_ALIM, UD_KIRILIM_MOD);
  if (!satirlar.length){ el.innerHTML = '<div class="ud-bos">Alım kaydı yok.</div>'; return; }
  el.innerHTML = satirlar.map(([donem, v]) => {
    /* Ortalama = TOPLAM tutar / TOPLAM miktar. Miktar 0 ise bolme yok. */
    const ort = v.miktar > 0 ? v.tutar / v.miktar : null;
    const ad = UD_KIRILIM_MOD === 'yil' ? donem : ayAdi(donem);
    return `<div class="ud-satir">
      <div class="ud-trh">${esc(ad)}</div>
      <div><div style="font-size:13px;font-weight:800">${
        v.miktar.toLocaleString('tr-TR')} ${esc(UD_BIRIM)}</div>
        <div class="ud-alt">${v.adet} alım${
          ort != null ? ' · ortalama ' + tl(ort) + '/' + esc(UD_BIRIM) : ''}</div></div>
      <div class="ud-tut">${tl(v.tutar)}</div></div>`;
  }).join('');
}

/* ===== ÜRÜN ALIMLARI — ne aldık, ne kadar, kaça =====
   Faturalardan türetilir. Ay veya yıl bazlı; fiyat değiştiyse uyarır. */
let ALIM_DONEM = null;      // 'YYYY-MM' | 'YYYY'
function alimDonemDegisti(){
  const s = document.getElementById('arDonem');
  ALIM_DONEM = document.getElementById('arYil')?.checked ? s.value.slice(0,4) : s.value;
  alimRaporu();
}
async function alimRaporu(){
  const el = document.getElementById('alimBolum'); if(!el) return;
  const yilMi = (ALIM_DONEM||'').length === 4;
  const ay  = yilMi ? null : (ALIM_DONEM || bugun().slice(0,7));
  const yil = yilMi ? ALIM_DONEM : (ALIM_DONEM || bugun().slice(0,7)).slice(0,4);
  const bas = yilMi ? yil+'-01-01' : ay+'-01';
  const son = yilMi ? yil+'-12-31'
                    : ay + '-' + String(new Date(+ay.slice(0,4), +ay.slice(5,7), 0).getDate()).padStart(2,'0');

  const { data, error } = await sb.from('alis_kalem')
    .select('miktar,birim_fiyat,birim_ad,birim_carpani,satir_tutar,urun(id,kod,ad,birim),alis!inner(tarih,belge_no,is_deleted,tedarikci(ad))')
    .eq('is_deleted', false).eq('alis.is_deleted', false)
    .gte('alis.tarih', bas).lte('alis.tarih', son);

  const satirlar = data || [];
  const g = {};
  satirlar.forEach(s=>{
    const u = s.urun; if(!u) return;
    const k = u.kod || u.ad;
    if(!g[k]) g[k] = { id:u.id, kod:u.kod, ad:u.ad, birim:u.birim, alim:0, miktar:0, adet:0,
                       tutar:0, fiyatlar:[], birimAd:null, firmalar:new Set(), belgeler:new Set() };
    const x = g[k];
    x.alim++; x.miktar += +s.miktar||0;
    x.adet += (+s.miktar||0) * (+s.birim_carpani||1);
    x.tutar += +s.satir_tutar||0;
    if (+s.birim_fiyat) x.fiyatlar.push(+s.birim_fiyat);
    x.birimAd = x.birimAd || s.birim_ad;
    if (s.alis?.tedarikci?.ad) x.firmalar.add(s.alis.tedarikci.ad);
    if (s.alis?.belge_no) x.belgeler.add(s.alis.belge_no);
  });
  const liste = Object.values(g).sort((a,b)=>b.tutar-a.tutar);
  const toplam = liste.reduce((a,x)=>a+x.tutar,0);
  const faturaSayisi = new Set(satirlar.map(s=>s.alis?.belge_no).filter(Boolean)).size;
  const donemAdi = yilMi ? yil+' yılı'
    : new Date(bas+'T00:00').toLocaleDateString('tr-TR',{month:'long',year:'numeric'});

  el.innerHTML = `<div class="kart">
    <div class="kbaslik">Ürün Alımları — ne aldık, ne kadar, kaça</div>
    <div class="satir" style="align-items:end">
      <div><label>Dönem</label><input type="month" id="arDonem" value="${yilMi? yil+'-01' : ay}" onchange="alimDonemDegisti()"></div>
      <div><label style="display:flex;align-items:center;gap:10px;min-height:44px;font-size:13px;font-weight:700;color:var(--metin);cursor:pointer">
        <input type="checkbox" id="arYil" ${yilMi?'checked':''} onchange="alimDonemDegisti()"
               style="width:22px;height:22px;flex:none;margin:0;accent-color:var(--ana)">
        Yıl toplamı</label></div>
    </div>
    ${error?`<div class="bilgi-not" style="color:var(--hata)">Yüklenemedi: ${esc(hataTr(error.message))}</div>`:''}
    <div class="gs-bant" style="margin:12px 0">
      <div class="kalem buyuk"><div class="gs-et">${esc(donemAdi)} alımı</div><div class="dg">${tl(toplam)}</div></div>
      <div class="kalem"><div class="gs-et">Ürün çeşidi</div><div class="dg">${liste.length}</div></div>
      <div class="kalem"><div class="gs-et">Fatura</div><div class="dg">${faturaSayisi}</div></div>
    </div>
    ${liste.length===0?'<div class="bilgi-not">Bu dönemde ürün satırı olan fatura yok.</div>'
      : liste.map(x=>{
        const enAz = Math.min(...x.fiyatlar), enCok = Math.max(...x.fiyatlar);
        const degisti = x.fiyatlar.length>1 && (enCok-enAz) > 0.005;
        const yuzde = degisti && enAz>0 ? Math.round((enCok-enAz)/enAz*100) : 0;
        const carpanli = x.adet !== x.miktar;
        return `<div class="liste-satir${x.id?' tikla':''}"${x.id?` onclick="urunDetay('${x.id}')"`:''}>
          <div class="l-sol"><div class="b">${x.kod?esc(x.kod)+' · ':''}${esc(x.ad)}</div>
            <div class="k">${x.alim} alım · ${(+x.miktar.toFixed(3))} ${esc(x.birimAd||x.birim)}
              ${carpanli?` → <b>${(+x.adet.toFixed(0))} ${esc(x.birim)}</b>`:''}
              · ${[...x.firmalar].join(', ')}
              ${x.fiyatlar.length?`<br>birim fiyat ${tl(enAz)}${degisti?` → ${tl(enCok)}`:''}`:''}
              ${degisti?`<br><span style="color:var(--uyari)">⚠ fiyat %${yuzde} değişti</span>`:''}</div></div>
          <div class="l-sag">${tl(x.tutar)}</div></div>`;
      }).join('')}
  </div>`;
}

        ${acik.filter(a=>a.tedarikci_ad===f).map(a=>{
          const brm = esc(a.urun_birim||'adet');

              <div class="k">%${a.kalan_yuzde} kaldı</div>
              ${a.kritik?'<span class="rozet rz-hata">AZALDI</span>':''}
              ${owner?`<br><button class="btn2" style="margin-top:4px" onclick="alacakKapat('${a.id}')">Kapat</button>`:''}
            </div></div>`;}).join('')}`).join('')}
    ${liste.some(a=>a.bitti)?`<div class="bilgi-not" style="margin-top:10px">
