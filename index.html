    <label>Firma</label>
    <select id="akFirma">${(KATALOG.tedarikciler||[]).map(t=>`<option value="${t.id}">${esc(t.ad)}</option>`).join('')}</select>
    <label>Ürün</label>
    <select id="akUrun" onchange="akUrunSecildi()">${(KATALOG.urunler||[]).map(u=>`<option value="${u.id}">${esc(u.kod?u.kod+' — ':'')}${esc(u.ad)}</option>`).join('')}</select>
    ${(KATALOG.urunler||[]).length===0?'<div class="bilgi-not" style="color:var(--uyari)">Henüz ürün yok — <b>Yönetim → Yeni Ürün</b>\'den ekleyebilir ya da bir fatura girip tanımlayabilirsin.</div>':''}
    <div class="satir">
      <div><label>Miktar</label><input type="text" inputmode="decimal" autocomplete="off" id="akMiktar" placeholder="örn 5"></div>
      <div><label>Birim</label>
        <select id="akBirim"><option value="adet">adet</option><option value="koli">koli</option><option value="paket">paket</option></select></div>
    </div>
    <label>Birim içi adet (koli/paket ise — 1 koli kaç adet?)</label>
    <input type="text" inputmode="decimal" autocomplete="off" id="akCarpan" placeholder="örn 80 · adet ise boş bırak">

async function alacakKaydet(){

  const ozet = `${pm.deger} ${birim}${carpan>1?` × ${carpan} = ${adet} adet`:''}`;

}

/* SAYIM
   Eskiden sayım yalnız stok miktarını düzeltiyordu; ayın kârına hiç dokunmuyordu.
   Artık dönemin DEPO DEĞERİ de kaydediliyor — kâr formülü şuna dönüyor:
     satılan malın maliyeti = açılış deposu + ay içi alış − kapanış deposu
   Saymadığın ürün sistemdeki miktarıyla değerlenir; yoksa kapanış stoğu eksik
   çıkar ve kâr olduğundan yüksek görünür. */
let SY_LISTE = [];
function syVarsayilanDonem(){
  // Ayın ilk 10 günündeysek büyük ihtimalle önceki ay kapatılıyor
  const d = new Date(bugun()+'T00:00');
  if (d.getDate() <= 10) d.setMonth(d.getMonth()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
/* ⚠ ADIM 13 FAZ 2 · VARSAYILAN IKILI TUTARLI OLMALI.
   OLCULDU (yamasiz -41, bugun 6 Eylul): donem "2026-08" onerilirken tarih
   "2026-09-06" kaliyordu — sistem kullaniciyi kendi uyaracagi tutarsizliga
   ITIYORDU. "Ilk 10 gun" kurali KALDIRILMADI; gercek bir ihtiyaci
   karsiliyor (ay basinda onceki ay kapatilir). Duzelen sey TARIH.
   Kural: donem BUGUNU iceriyorsa bugun, icermiyorsa o donemin SON GUNU.
   ⚠ TEK TANIM: hem ilk cizimde hem donem degisiminde bu okunur. */
const syTarihOner = donem => {
  const b = bugun();
  return (b >= donem+'-01' && b <= aySon(donem)) ? b : aySon(donem);
};
/* ⚠ TEK METIN: ekrandaki not ile onay penceresi AYNI cumleyi yazar.
     Iki yerde ayri yazilsaydi biri degisince otekisi eskirdi.
   ⚠ DUZ METIN (etiket yok): confirm() HTML islemez.
   ⚠ TURKCE EK: kullanicinin verdigi cumle "Ağustos'a bağlıyorsun" /
     "6 Eylül'de" idi. Bu ekler AYA GORE DEGISIYOR (Ağustos'a ama Eylül'e;
     6 Eylül'de ama 6 Kasım'da, 6 Aralık'ta). On iki ay icin ek tablosu
     yazmak yerine eki DEGISMEYEN kelimeye tasidim: "... ayına" ve
     "... günü". Anlam birebir ayni, cumle her ayda dogru kuruluyor. */
const syDonemMetni = (donem, tarih) =>
  gunAyAdi(tarih) + ' günü saydığın rafları ' + ayKisa(donem)
  + ' ayına bağlıyorsun. Aradaki alış ve tüketim hareketleri sayımı bozar — '
  + ayKisa(donem) + ' sonundaki depo bu değildi.';
/* ⚠ SOYLER, DURDURMAZ (ADIM 06 kurali): kayit ENGELLENMEZ.
   ⚠ TARIH DONEM ICINDEYSE HICBIR SEY CIKMAZ (ADIM 15 dersi: isaret
     yalniz gercek bir eksiklikte). */
function syDonemFark(){
  const d = document.getElementById('syDonem'), t = document.getElementById('syTarih'),
        n = document.getElementById('syDonemNot');
  if (!d || !t || !n) return;
  const donem = d.value, tarih = t.value;
  if (!donem || !tarih || (tarih >= donem+'-01' && tarih <= aySon(donem))){
    n.hidden = true; n.textContent = ''; return;
  }
  n.hidden = false; n.textContent = syDonemMetni(donem, tarih);
}
/* Donem degisince tarih de o doneme gecer — AMA kullanici tarihi elle
   yazdiysa DOKUNULMAZ (ADIM 09'daki kdSonOdeme dersi; ev bayragi
   dataset.elle). Bayrak yalniz GERCEK kullanici olayinda konur
   (e.isTrusted), yoksa asagidaki programatik atama kendi bayragini
   koyar ve bir daha hicbir varsayilan isleyemezdi. */
function syDonemDegisti(){
  const d = document.getElementById('syDonem'), t = document.getElementById('syTarih');
  if (d && t && t.dataset.elle !== '1') t.value = syTarihOner(d.value);
  syDonemFark();
}
/* Satır satır yuvarla, sonra topla — RPC de öyle yapıyor.
   Toplayıp sonra yuvarlarsak ekrandaki rakam kaydedilenden 1-2 kuruş sapıyor. */
const syTutar = (miktar, birim) => Math.round(miktar * birim * 100) / 100;
function syTopla(){
  const el = document.getElementById('syToplam'); if (!el) return;
  let toplam = 0, sayilan = 0, hatali = 0;
  for (const u of SY_LISTE){
    const inp = document.getElementById('sy_'+u.id);
    const yazili = inp && inp.value.trim() !== '';
    if (!yazili){ toplam += syTutar(u.mevcut, u.mal); continue; }
    const p = paraCoz(inp.value, 3);
    if (!p.ok || p.deger < 0){ hatali++; toplam += syTutar(u.mevcut, u.mal); continue; }
    sayilan++; toplam += syTutar(p.deger, u.mal);
  }
  el.innerHTML = `Sayılan depo değeri <b>${tl(toplam)}</b>`
    + `<span style="color:var(--soluk)"> · ${sayilan}/${SY_LISTE.length} ürün elle sayıldı`
    + (sayilan < SY_LISTE.length ? ', kalanı sistemdeki miktarla değerlendi' : '')
    + '</span>'
    + (hatali ? `<div style="color:var(--hata);margin-top:4px">${hatali} üründe geçersiz sayı var</div>` : '');
}
async function sayimKaydet(){
  const g = id => document.getElementById(id);
  const donem = g('syDonem')?.value, tarih = g('syTarih')?.value;
  if (!donem){ mesaj('syMsg','hata','Hangi ayı kapattığını seç.'); return; }
  if (!tarih){ mesaj('syMsg','hata','Sayım tarihi girilmedi.'); return; }
  const kalemler = []; let hatali = 0, toplam = 0;
  for (const u of SY_LISTE){
    const inp = g('sy_'+u.id);
    const yazili = inp && inp.value.trim() !== '';
    if (!yazili){ toplam += syTutar(u.mevcut, u.mal); continue; }
    const p = paraCoz(inp.value, 3);
    if (!p.ok || p.deger < 0){ hatali++; continue; }
    kalemler.push({ urun:u.id, sayilan:p.deger });
    toplam += syTutar(p.deger, u.mal);
  }
  if (hatali){ mesaj('syMsg','hata', hatali+' üründe geçersiz sayı var — örnek: 12 veya 12,5'); return; }
  const saymadigin = SY_LISTE.length - kalemler.length;
  // Depo DEĞERİ maliyet verisidir — personele miktar onayı gösterilir, TL gösterilmez
  const owner = PROFIL.rol === 'owner';
  /* ⚠ ADIM 13 FAZ 2 · TEK SATIR, EKRANDAKI NOTLA AYNI METIN. Onay
     penceresi zaten sayilari yaziyor; tutarsizlik da bir sayidir. */
  const donemNotu = (tarih >= donem+'-01' && tarih <= aySon(donem))
    ? '' : syDonemMetni(donem, tarih) + '\n';
  if (!confirm(`${ayAdi(donem)} SAYIMI KAYDEDİLECEK\n\n`
    + donemNotu
    + `Elle sayılan: ${kalemler.length} ürün\n`
    + (saymadigin ? `Saymadığın ${saymadigin} ürün sistemdeki miktarla değerlenecek\n` : '')
    + (owner ? `Depo değeri: ${tl(toplam)}\n` : '')
    + `\n${ayAdi(donem)} kârı bundan sonra bu sayımla hesaplanır.\n`
    + `O ay için daha önce sayım varsa üzerine yazılır.\n\nOnaylıyor musun?`)) return;
  const data = await rpcCagir('rpc_sayim_kaydet', {
    p_idem: idem(), p_sube: AKTIF_SUBE, p_donem: donem, p_tarih: tarih,
    p_kalemler: kalemler, p_not: g('syNot')?.value.trim() || null
  }, 'syKaydet','syMsg','Sayım kaydedildi ✓');
  if (data && data.ok){
    mesaj('syMsg','ok', 'Sayım kaydedildi'
      + (owner ? ` · ${ayAdi(donem)} deposu ${tl(data.toplam)}` : '')
      + ` · ${data.duzeltme} üründe stok düzeltildi ✓`);
    setTimeout(vStok, 1600);
  }
}

/* FİRMA MERKEZİ — bakiye, açık faturalar, ödemeler ve o firmadan aldığın ürünler tek yerde.

   ne kadar borçluyum ve neyi kaça alıyorum" sorusu tek ekranda cevaplanmıyordu. */
async function firmaDetay(id){
  const t = KATALOG.tedarikciler.find(x=>x.id===id);

  ic.innerHTML = `<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Yükleniyor...</div></div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  ov.classList.add('acik');
  const owner = PROFIL.rol === 'owner';

  const [bk, af, od, kl] = await Promise.all([
    owner ? sb.from('v_tedarikci_bakiye').select('*').eq('tedarikci_id',id).eq('sube_id', AKTIF_SUBE).maybeSingle()
          : Promise.resolve({data:null}),
    // Mutabakat icin TUM faturalar — firma butun hesabi soyluyor, sadece acik olanlari degil
    sb.from('alis').select('id,tarih,belge_no,toplam,vade_tarihi,odendi')
      .eq('tedarikci_id',id).eq('is_deleted',false).order('tarih',{ascending:false}),
    sb.from('tedarikci_odeme').select('tarih,tutar,yontem,cek_no,cek_vade,aciklama')
      .eq('tedarikci_id',id).eq('is_deleted',false).order('tarih',{ascending:false}),
    sb.from('alis_kalem')
      .select('miktar,birim_carpani,satir_tutar,urun_id,urun(ad,birim),alis!inner(tarih,tedarikci_id,is_deleted)')
      .eq('is_deleted',false).eq('alis.is_deleted',false).eq('alis.tedarikci_id',id)
  ]);

  const b = bk.data ? +bk.data.bakiye : null;
  const faturalar = af.data || [], odemeler = od.data || [];
  const acik = faturalar.filter(f=>!f.odendi);
  const bugunS = bugun();

  // Ürün bazında: kaç kez alındı, son birim fiyat ne, ilk fiyata göre ne oldu
  const urunler = {};
  (kl.data||[]).forEach(k=>{
    if(!k.urun_id || !k.urun) return;
    const adet = (+k.miktar||0) * (+k.birim_carpani||1);
    if(adet <= 0) return;
    const birim = (+k.satir_tutar||0) / adet;
    (urunler[k.urun_id] = urunler[k.urun_id] || { ad:k.urun.ad, birim:k.urun.birim, nk:[] })
      .nk.push({ ts:new Date(k.alis.tarih+'T00:00').getTime(), fiyat:birim });
  });
  const urunListe = Object.entries(urunler).map(([uid,u])=>{
    u.nk.sort((a,b)=>a.ts-b.ts);
    const ilk=u.nk[0].fiyat, son=u.nk[u.nk.length-1].fiyat;
    return { uid, ad:u.ad, birim:u.birim, kez:u.nk.length, son,
             degisim: ilk>0 ? ((son-ilk)/ilk)*100 : 0 };
  }).sort((a,b)=>b.degisim-a.degisim);

  const YONTEM = {kart:'Kart', nakit:'Nakit', havale:'Havale', cek:'Çek'};
  ic.innerHTML = `
    <div class="ud-ust">
      <div style="flex:1;min-width:0">
        <div class="ud-kod">FİRMA</div>
        <div class="ud-ad">${esc(t?t.ad:'—')}</div>
        ${t&&t.unvan?`<div class="ud-alt">${esc(t.unvan)}</div>`:''}
      </div>
      <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button>
    </div>
    <div class="ud-govde">
      ${b!==null ? `<div class="ud-kunye" style="grid-template-columns:1fr 1fr">
        <div><div class="ud-et">${b>0?'BORCUN':b<0?'İÇERİDE MALIN':'BAKİYE'}</div>
          <div class="ud-dg" style="color:${b>0?'var(--hata)':b<0?'var(--ok)':'var(--soluk)'}">${b===0?'Kapalı':tl(Math.abs(b))}</div></div>
        <div><div class="ud-et">AÇIK FATURA</div><div class="ud-dg">${acik.length}</div></div>
      </div>
      <!-- Firma "şu kadar borcunuz var" dediğinde karşılaştıracağın döküm -->
      <div class="ud-bas"><span class="ud-blk">MUTABAKAT</span></div>
      ${ozSatir('Kesilen fatura', tl(bk.data.toplam_alis))}
      ${ozSatir('Ödenen', '−'+tl(bk.data.toplam_odeme))}
      ${ozSatir('KALAN BORÇ', tl(b), true)}
      <div class="ipucu" style="margin-top:8px">Firma farklı bir rakam söylüyorsa aşağıdaki fatura ve
        ödeme listesini onunkiyle karşılaştır — eksik girilen belge çıkar.</div>` : ''}

      ${t && (t.telefon || t.yetkili_ad) ? `<div class="ud-bas"><span class="ud-blk">İLETİŞİM</span></div>
        <div class="ud-bos" style="padding-bottom:12px">
          ${t.yetkili_ad?esc(t.yetkili_ad)+'<br>':''}
          ${t.telefon?`<a href="tel:${esc(t.telefon)}" style="color:var(--ana);font-weight:800;text-decoration:none">${esc(t.telefon)} · ARA</a>`:''}
          ${t.telefon2?' · '+esc(t.telefon2):''}
        </div>` : ''}

      <div class="ud-bas"><span class="ud-blk">FATURALAR</span><span class="ud-trend">${faturalar.length} adet · ${tl(faturalar.reduce((a,x)=>a+ +x.toplam,0))}</span></div>
      ${faturalar.length===0 ? '<div class="ud-bos">Bu firmadan fatura girilmemiş.</div>' : faturalar.map(f=>{
        const gecikti = !f.odendi && f.vade_tarihi && f.vade_tarihi < bugunS;
        return `<div class="ud-satir">
          <div class="ud-trh">${new Date(f.tarih+'T00:00').toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}</div>
          <div><div style="font-weight:800;font-size:13px">${esc(f.belge_no||'Belge no yok')}
            ${f.odendi?'<span class="rozet rz-ok" style="margin-left:4px">ödendi</span>'
                      :gecikti?'<span class="rozet rz-hata" style="margin-left:4px">GECİKTİ</span>':''}</div>
            <div class="ud-alt">${f.vade_tarihi?'Vade '+new Date(f.vade_tarihi+'T00:00').toLocaleDateString('tr-TR'):'Vade yok'}</div></div>
          <div class="ud-tut">${tl(f.toplam)}</div>
        </div>`; }).join('')}

      <div class="ud-bas" style="margin-top:16px"><span class="ud-blk">ÖDEMELER</span><span class="ud-trend">${odemeler.length} adet</span></div>
      ${odemeler.length===0 ? '<div class="ud-bos">Bu firmaya ödeme kaydı yok.</div>' : odemeler.map(o=>`
        <div class="ud-satir">
          <div class="ud-trh">${new Date(o.tarih+'T00:00').toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}</div>
          <div><div style="font-weight:800;font-size:13px">${YONTEM[o.yontem]||esc(o.yontem||'—')}</div>
            <div class="ud-alt">${o.cek_no?'Çek '+esc(o.cek_no)+(o.cek_vade?' · vade '+new Date(o.cek_vade+'T00:00').toLocaleDateString('tr-TR'):''):esc(o.aciklama||'')}</div></div>
          <div class="ud-tut">${tl(o.tutar)}</div>
        </div>`).join('')}

      <div class="ud-bas" style="margin-top:16px"><span class="ud-blk">BU FİRMADAN ALDIKLARIN</span><span class="ud-trend">${urunListe.length} ürün</span></div>
      ${urunListe.length===0 ? '<div class="ud-bos">Kalemli fatura girilmemiş.</div>' : urunListe.map(u=>`
        <div class="ud-satir tikla" style="grid-template-columns:1fr auto" onclick="urunDetay('${u.uid}')">
          <div><div style="font-weight:800;font-size:13px">${esc(u.ad)}</div>
            <div class="ud-alt">${u.kez} alım · son ${tl(u.son)}/${esc(u.birim)}</div></div>
          <div class="ud-tut ${u.degisim>0.5?'ud-zam':u.degisim<-0.5?'ud-indi':''}">${u.kez<2?'—':(u.degisim>0?'+':'')+u.degisim.toFixed(0)+'%'}</div>
        </div>`).join('')}

      <button class="btn" style="margin-top:18px" onclick="tedarikciDuzenle('${id}')">Firma Bilgilerini Düzenle</button>
      <button class="btn-kirmizi" id="tdSil_${id}" style="margin-top:8px"
        onclick="tedarikciSil('${id}','${esc(t?.ad||'')}')">Firmayı Sil</button>
    </div>`;
}
/* v80 · H-54 · TEDARİKÇİ SİLME KANALI
   Silinebilenler ölçülmüştü: gun_sonu · gider · personel_gider ·
   owner_hareket · madde · rol. Tedarikçi YOKTU — H-18/H-19'un aynı
   sınıfı, üçüncü tablo. v79'un tekillik kısıtı sıkıştırdı: deneme amaçlı
   açılan bir firmanın adı işgal edilmiş kalıyordu.

   Bağlı mali kaydı olan firma SİLİNMEZ ve bu ölçümle karar verildi:
   `v_tedarikci_bakiye` tanımı `WHERE NOT t.is_deleted AND t.aktif` diyor,
   yani bakiyesi olan firmayı düşürmek borcu EKRANDAN yok ederdi. */
async function tedarikciSil(id, ad){
  const btn = document.getElementById('tdSil_' + id);
  if (btn && btn.disabled) return;          // çift tıklama kilidi

  const neden = await nedenSor((ad ? ad + ' — ' : '') + 'firma neden siliniyor?',
    'Gerekçe zorunlu ve kayda geçer (denetim izine yazılır).\n' +
    'Örnek: "deneme amaçlı açıldı, gerçek firma değil"', 1);
  if (!neden || !neden.trim()){
    if (neden !== null) bildir('Gerekçe boş olamaz — silinmedi.', 'hata');
    return;
  }
  if (!confirm((ad||'Firma') + ' listeden düşecek (geri alınabilir işaretleme, veri kaybolmaz).\n\n'
             + 'Faturası, gideri, ödemesi veya alacağı varsa SİLİNMEZ —\n'
             + 'o durumda kaç kaydı olduğu söylenecek.\n\nDevam?')) return;

  if (btn){ btn.disabled = true; btn.textContent = '…'; }
  const { error } = await sb.rpc('rpc_tedarikci_sil', { p_id:id, p_neden:neden.trim() });
  if (error){
    if (btn){ btn.disabled = false; btn.textContent = 'Firmayı Sil'; }
    bildir('Silinemedi: ' + hataTr(error.message), 'hata');
    return;
  }
  await katalogYukle();
  vTedarikci();
}

async function tedarikciEkleHizli(){
  const ad = document.getElementById('tdYeniAd').value.trim();
  if (!ad){ mesaj('tdYeniMsg','hata','Firma adı boş.'); return; }
  const kayit = {
    ad,
    unvan: document.getElementById('tdYeniUnvan').value.trim()||null,
    vergi_no: document.getElementById('tdYeniVergiNo').value.trim()||null,
    vergi_dairesi: document.getElementById('tdYeniVergiDairesi').value.trim()||null,
    yetkili_ad: document.getElementById('tdYeniYetkili').value.trim()||null,
    telefon: document.getElementById('tdYeniTel').value.trim()||null,
    telefon2: document.getElementById('tdYeniTel2').value.trim()||null,
    email: document.getElementById('tdYeniEmail').value.trim()||null,
    adres: document.getElementById('tdYeniAdres').value.trim()||null
  };
  /* v79 · DÜĞME KİLİDİ — ölçüldü: `p_id` NULL iken bu çağrı INSERT yapıyor,
     `rpc_tedarikci_kaydet`'te `p_idem` YOK ve sunucuda mükerrer koruması
     YOKTU. Çift tıklama aynı isimde iki firma üretiyordu.
     Kilit `rpcCagir`'ın kalıbı; `rpcCagir`'a TAŞINMADI çünkü o fonksiyon
     ağ hatasında aynı çağrıyı TEKRARLIYOR ve bu güvenliğini `p_idem`den
     alıyor — idem'siz bir RPC'yi oraya koymak yeni bir mükerrer yolu
     açardı. Asıl koruma v79'un `ux_tedarikci_ad` kısıtı; bu kilit kazayı
     erken durduruyor. */
  const tdBtn = document.getElementById('tdYeniBtn');
  if (tdBtn && tdBtn.disabled) return;
  const tdEski = tdBtn ? tdBtn.textContent : null;
  if (tdBtn){ tdBtn.disabled = true; tdBtn.textContent = 'Kaydediliyor...'; }
  try{
    const { error } = await sb.rpc('rpc_tedarikci_kaydet', {
      p_id: TD_DUZENLENEN, p_ad: kayit.ad, p_unvan: kayit.unvan, p_vergi_no: kayit.vergi_no,
      p_vergi_dairesi: kayit.vergi_dairesi, p_yetkili: kayit.yetkili_ad, p_tel: kayit.telefon,
      p_tel2: kayit.telefon2, p_email: kayit.email, p_adres: kayit.adres
    });
    if (error){ mesaj('tdYeniMsg','hata',hataTr(error.message)); return; }
    TD_DUZENLENEN = null;
    await katalogYukle(); vTedarikci();
  } finally {
    if (tdBtn){ tdBtn.disabled = false; tdBtn.textContent = tdEski; }
  }
}
/* ⚠ ADIM 12 · GIDERLER YOLUNA ESITLENDI. Onceki hal ayni RPC'yi EKSIK

let PG_DONEM = null;
/* SGK TAHMİNİ — YASAL HESAP DEĞİL.
   Formül: brüt = net/0,85 (asgari ücret GV+damga istisnası) → yük = brüt × %37,5
   (işçi payı %15 + işveren primi %22,5).
   Bu oran SABİT KODLANMIŞTIR ve MUHASEBECİ TEYİDİ ALMAMIŞTIR. Gerçek bordroda
   şunlar değiştirir: 5 puanlık işveren indirimi, teşvikler, prime esas kazanç
   tavanı, asgari ücret üstü maaşlar, eksik gün, kıdem/ihbar.
   Anayasa md.4: mevzuata bağlı kurallar teyitsiz sabitlenemez, varsayım olarak
   işaretlenir. O yüzden ekranda "yasal" değil TAHMİN yazıyor. */
function sgkHesapla(net){ return net>0 ? +((net/0.85)*0.375).toFixed(2) : 0; }
/* ⚠ SGK SÜTUNU VERİ DEĞİL, MAAŞIN KOPYASI — ÖLÇÜLDÜ 2026-09-06
   personel_gider'de yalnız 2026-07 ve 2026-08 var; altı satırın ALTISI da
   sgkHesapla()'nın ürettiği rakam. Ölçüt: |sgk − sgkHesapla(maas)| ≤ 0,01.
   Yani bordrodan tek bir gerçek rakam girilmemiş; sütun maaşın 0,4412
   katsayılı kopyası ve bu rakam personel_toplam üzerinden aylık kâra
   giriyor. Gerçek rakam vergi_odeme'de duruyor (tur='sgk'); oradaki donem
   TAHAKKUK dönemidir, ödeme bir sonraki ay yapılır.
   ⚠ BU FONKSİYON YALNIZ GÖSTERİR. personel_gider'e hiçbir yazma yok;
     kapalı dönemi düzeltmek ayrı bir karar. */
/* ⚠ sgk > 0 KOŞULU ŞART: sgkHesapla(0)=0 olduğu için maaşı 0 ve SGK'sı 0
   olan satır ölçüte "uyuyor" ve rozet alıyordu — orada doğrulanacak bir
   şey yok, sayıyı da şişiriyordu. Maaş > 0 iken SGK 0 girilmiş satır
   zaten rozet ALMIYOR (formül 0'dan başka bir şey üretir); o korunuyor. */
function pgSgkTahminMi(p){
  const s = +p.sgk || 0;
  return s > 0 && Math.abs(s - sgkHesapla(+p.maas || 0)) <= 0.01;
}
async function vPersonel(){
  const el = document.getElementById('icerik');
  if (PROFIL.rol !== 'owner'){ el.innerHTML = '<div class="bilgi-not">Bu ekran yöneticiye özeldir.</div>'; return; }
  const donem = PG_DONEM || bugun().slice(0,7);
  PG_DONEM = donem;
  /* ⚠ ŞUBE SÜZGECİ UYDURULMADI: personel_gider okumasında şube süzgeci
     YOK, vergi_odeme okuması da AYNI kalıyor. İkisi farklı süzgeçle
     okunursa karşılaştırma sessizce yanlış olur. */
  const [pgSonuc, voSonuc, pgIlk] = await Promise.all([
    sb.from('personel_gider').select('*').eq('donem', donem)
      .eq('is_deleted', false).order('personel_adi'),
    sb.from('vergi_odeme').select('tutar,odeme_tarihi,donem').eq('tur', 'sgk')
      .eq('donem', donem).eq('is_deleted', false),
    /* ⚠ Y10 · SISTEMIN ILK PERSONEL DONEMI. pgDonem serbest bir
       <input type="month"> ve ALT SINIRI YOK; sistemden onceki bir
       donem secilip o donemin SGK odemesi varsa kirmizi kutu caliyordu
       — girilecek personel kaydi yokken. Ayri tur atilmadi, mevcut
       toplu cagriya EKLENDI. */
    sb.from('personel_gider').select('donem').eq('is_deleted', false)
      .order('donem').limit(1)
  ]);
  const { data } = pgSonuc;
  /* ⚠ RLS'e takılırsa kutu SESSİZCE gizlenir, hata basılmaz:
     null = "bilmiyoruz" · [] = "okundu, ödeme kaydı yok". Aynı şey değil. */
  const odemeler = voSonuc.error ? null : (voSonuc.data || []);
  const kayitlar = data||[];
  const T = {maas:0,sgk:0,prim:0,yemek:0,maliyet:0};
  kayitlar.forEach(p=>{ const mal=(+p.maas)+(+p.sgk)+(+p.prim)+(+p.yemek);
    T.maas+=+p.maas; T.sgk+=+p.sgk; T.prim+=+p.prim; T.yemek+=+p.yemek; T.maliyet+=mal; });
  const tahminAdet = kayitlar.filter(pgSgkTahminMi).length;
  const odenen = odemeler ? odemeler.reduce((t,v)=>t+(+v.tutar||0), 0) : 0;
  const odemeVar = !!(odemeler && odemeler.length);
  const fark = +(T.sgk - odenen).toFixed(2);
  /* (C) TAHMİN vs GERÇEK — yalnız gösterir, düzeltme düğmesi YOK. */
  const sgkKutu = (!odemeler || kayitlar.length === 0) ? '' : (odemeVar
    ? `<div class="uyari-orta" style="margin:0 0 10px">
        <b>Ödenen SGK ${tl(odenen)}</b> · sistemdeki SGK toplamı ${tl(T.sgk)}${
          tahminAdet ? ` (${tahminAdet} satırı tahmin)` : ''}${
          odemeler.length > 1 ? ` · ${odemeler.length} ödeme kaydı toplandı` : ''}
        <div style="margin-top:5px">${
          Math.abs(fark) < 0.01 ? 'Fark yok — sistemdeki rakam ödenenle aynı.'
          : fark > 0 ? `Tahmin <b>${tl(fark)}</b> FAZLA — bu ayın kârı <b>${tl(fark)}</b> kadar DÜŞÜK görünüyor.`
                     : `Tahmin <b>${tl(-fark)}</b> EKSİK — bu ayın kârı <b>${tl(-fark)}</b> kadar YÜKSEK görünüyor.`}</div>
        <div style="margin-top:5px">Ödenen tutardır; gecikme zammı ya da idari para cezası içeriyor olabilir. Tahakkuk fişiyle karşılaştır.</div>
      </div>`
    : `<div class="bilgi-not" style="margin:0 0 10px">Bu ayın SGK'si henüz ödenmedi — ekrandaki rakam tahmin. Ödeme dekontunu girince gerçeği burada göreceksin.</div>`);
  /* (D) SGK ödenmiş ama o ayın personel gideri hiç girilmemiş.
     ⚠ Y10 · KAPANAMAYAN ALARM AYRILDI. Iki hal ayni degil:
       · Donem sistemin ICINDE ve personel satiri yok -> GERCEK eksik,
         kapanabilir: satiri gir, kutu soner. KIRMIZI KALIR.
       · Donem sistemin ILK personel doneminden ONCE -> girilecek bir
         sey YOK; kutu hicbir zaman sonemez. Ayni gercek ALARM degil
         ACIKLAMA olarak, bir kez, rakamin yaninda durur.
     ⚠ RAKAM GIZLENMIYOR: odenen tutar iki halde de yaziliyor.
     ⚠ personel_gider TAMAMEN BOSSA ilkPgDonem null olur, sistemdenOnce
       false kalir ve BUGUNKU DAVRANIS AYNEN surer. */
  const ilkPgDonem = (!pgIlk.error && (pgIlk.data || [])[0])
    ? pgIlk.data[0].donem : null;
  const sistemdenOnce = !!ilkPgDonem && donem < ilkPgDonem;
  const eksikAy = !(kayitlar.length === 0 && odemeVar) ? ''
    : sistemdenOnce
    ? `<div class="bilgi-not" style="margin:0 0 10px">Bu döneme <b>${tl(odenen)}</b> SGK
        ödenmiş ama personel gideri yok — <b>${ayAdi(ilkPgDonem)}</b> sistemdeki ilk
        personel dönemi, ondan öncesi hiç girilmedi. Girilecek bir şey yok.</div>`
    : `<div class="uyari-agir" style="margin:0 0 10px">Bu ay SGK ödenmiş (<b>${tl(odenen)}</b>) ama personel gideri girilmemiş — bu ayın kârı olduğundan yüksek görünüyor.</div>`;
  const satir = (ad, maas, sgk, prim, yemek, maliyet, silId, kalin, tahmin) =>
    `<tr style="${kalin?'font-weight:800;background:var(--acik)':''}">
      <td style="padding:8px 6px;text-align:left">${ad}</td>
      <td style="padding:8px 6px;text-align:right">${tl(maas)}</td>
      <td style="padding:8px 6px;text-align:right">${tl(sgk)}${tahmin?' <span class="rozet rz-uyari">tahmin</span>':''}</td>
      <td style="padding:8px 6px;text-align:right">${tl(prim)}</td>
      <td style="padding:8px 6px;text-align:right">${tl(yemek)}</td>
      <td style="padding:8px 6px;text-align:right;color:var(--ana);font-weight:800">${tl(maliyet)}</td>
      <td style="padding:8px 2px;text-align:center">${silId?`<button id="pgsil_${silId}" class="btn-kirmizi" style="padding:4px 8px" onclick="pgSil('${silId}','${ad}','${tl(maliyet)}')">✕</button>`:''}</td>
    </tr>`;
  el.innerHTML = `
    <h2 class="bolum">Personel Giderleri</h2>
    ${kayitlar.length ? `<div class="ozet-grid">
      <div class="ozet-kut"><div class="e">AY MALİYETİ</div><div class="d">${tl(T.maliyet)}</div>
        <div class="aciklama">${kayitlar.length} kişi</div></div>
      <div class="ozet-kut"><div class="e">KİŞİ BAŞI</div><div class="d">${tl(T.maliyet/kayitlar.length)}</div>
        <div class="aciklama">SGK ${tl(T.sgk)} dahil</div></div>
    </div>` : ''}
    ${eksikAy}${sgkKutu}
    <div class="kart">
      ${kbaslik('', ayAdi(donem), '')}
      <label>Dönem</label>
      <input type="month" id="pgDonem" value="${donem}" onchange="PG_DONEM=this.value; vPersonel()">
      ${kayitlar.length===0 ? `${bosDurum('liste','Bu ay kayıt yok','Geçen ayın satırlarını kopyalayıp tutarları güncelleyebilirsin.')}
        <button class="btn2" style="display:block;margin:0 auto" onclick="pgOncekiAydanKopyala()">Önceki aydan kopyala</button>` : `
      <div style="overflow-x:auto;margin-top:10px">
        <table style="width:100%;border-collapse:collapse;font-size:13px;min-width:520px">
          <thead><tr style="border-bottom:2px solid var(--cizgi);font-size:11px;color:var(--soluk)">
            <th style="padding:6px;text-align:left">PERSONEL</th>
            <th style="padding:6px;text-align:right">MAAŞ (yatan)</th>
            <th style="padding:6px;text-align:right">SGK</th>
            <th style="padding:6px;text-align:right">PRİM</th>
            <th style="padding:6px;text-align:right">YEMEK</th>
            <th style="padding:6px;text-align:right">MALİYET</th>
            <th></th>
          </tr></thead>
          <tbody>
            ${kayitlar.map(p=>satir(esc(p.personel_adi), p.maas, p.sgk, p.prim, p.yemek,
              (+p.maas)+(+p.sgk)+(+p.prim)+(+p.yemek), p.id, false, pgSgkTahminMi(p))).join('')}
            ${satir('AY TOPLAMI', T.maas, T.sgk, T.prim, T.yemek, T.maliyet, null, true)}
          </tbody>
        </table>
      </div>
      ${tahminAdet ? `<div class="uyari-orta" style="margin:8px 0 0">SGK: ${kayitlar.length} satırdan ${tahminAdet} tanesi tahmin — bordrodan doğrulanmadı.</div>` : ''}`}
    </div>
    <div class="kart">
      <div class="kbaslik">Personel Satırı Ekle (${donem})</div>
      <label>Ad Soyad</label><input type="text" id="pgAd">
      <div class="satir">
        <div><label>Maaş (hesaba yatan / net)</label><input type="text" inputmode="decimal" id="pgMaas" placeholder="0,00"></div>
        <div><label>SGK (tahmin — bordrodan doğrula)</label><input type="text" inputmode="decimal" id="pgSgk" placeholder="tahmin"></div>
      </div>
      <div class="uyari-orta" style="margin:4px 0 0"><b>Bu rakam tahmindir, yasal hesap değildir.</b>
        Net maaştan kaba bir SGK yükü çıkarır (asgari ücret varsayımı, %37,5 sabit oran).
        <b>Gerçek tutarı bordrodan yaz.</b> Teşvik, 5 puanlık indirim, tavan aşımı, eksik gün
        ve asgari ücret üstü maaşlarda bu rakam tutmaz — muhasebeci teyidi alınmamıştır.</div>
      <div class="satir">
        <div><label>Prim</label><input type="text" inputmode="decimal" id="pgPrim" placeholder="0,00"></div>
        <div><label>Yemek</label><input type="text" inputmode="decimal" id="pgYemek" placeholder="0,00"></div>
      </div>
      <button class="btn" id="pgKaydet" onclick="pgEkle()">Satırı Ekle</button>
      <div class="hata-msg" id="pgMsg"></div>
    </div>`;
  paraBaglaHepsi(['pgMaas','pgSgk','pgPrim','pgYemek']);
  /* (A) ⚠ ÜZERİNE YAZMA DURDU.
     Eskiden pgMaas'a HER TUŞ VURUŞUNDA pgSgk koşulsuz eziliyordu: bordrodan
     gerçek rakamı yazıp sonra maaşta bir rakamı düzeltirsen gerçek değer
     sessizce gidiyordu.
     ⚠ ÖLÇÜT DEĞER DEĞİL NİYET: kullanıcının KENDİ olayı (e.isTrusted) alana
       dokunduysa bayrak kalkar. Programatik doldurma — doğrudan .value
       ataması ya da dispatchEvent ile tetiklenen input — ELLE SAYILMAZ.
     Alan boşaltılırsa bayrak DÜŞER, otomatik doldurma geri gelir. */
  const sgkAlan = document.getElementById('pgSgk');
  sgkAlan.addEventListener('input', e=>{
    if (!e.isTrusted) return;
    if (sgkAlan.value.trim() === '') delete sgkAlan.dataset.elle;
    else sgkAlan.dataset.elle = '1';
  });
  /* ⚠ EVİN KENDİ DESENİ (sgkDekontDoldur/yazAlan): değeri TÜRKÇE biçimde
     yaz, sonra input olayını tetikle — gruplamayı ve __paraEski'yi
     paraCanliUygula'nın kendisi yapsın. İki farklı zemin bırakılmaz.
     ⚠ NEDEN: sgkHesapla bir SAYI döndürür; doğrudan yazılınca alanda
       "13235.29" duruyordu. Kullanıcı o alana TEK TUŞ dokunduğunda
       paraCanli bütün noktaları gruplama sanıp siliyor ve değer 100
       katına çıkıyordu (Backspace -> 132.352).
     ⚠ Tetiklenen olay isTrusted=false; yukarıdaki 'elle' bayrağı
       KALKMAZ — programatik doldurma elle sayılmaz. */
  const kurusTr = (n) => n.toFixed(2).replace('.', ',');
  document.getElementById('pgMaas').addEventListener('input', e=>{
    if (sgkAlan.dataset.elle === '1') return;
    const t = sgkHesapla(paraDeger('pgMaas'));
    sgkAlan.value = t > 0 ? kurusTr(t) : '';
    sgkAlan.dispatchEvent(new Event('input', { bubbles:true }));
  });
}
async function pgEkle(){
  const ad = document.getElementById('pgAd').value.trim();
  const maas = paraDeger('pgMaas');
  if (!ad){ mesaj('pgMsg','hata','Ad boş olamaz.'); return; }
  if (maas===0 && !confirm('Maaş 0 girildi — emin misiniz?')) return;
  const { error } = await sb.from('personel_gider').insert({
    sube_id: AKTIF_SUBE, donem: PG_DONEM, personel_adi: ad,
    maas, sgk: paraDeger('pgSgk'),
    prim: paraDeger('pgPrim'),
    yemek: paraDeger('pgYemek'),
    avans: 0
  });
  if (error){ mesaj('pgMsg','hata',hataTr(error.message)); return; }
  vPersonel();
}
/* v73 · H-19 · İZSİZ SİLME KAPANDI
   Eski hâli ham `.update({is_deleted:true})` idi: gerekçe yok, RPC yok,
   dönem kilidi UX katmanı yok. audit_log'a satır düşüyordu ama NEDEN
   düşmüyordu — H-18'in aynısı, farklı tabloda.
   Artık rpc_personel_gider_sil: owner kapısı, gerekçe zorunlu, gerekçe
   AYRI SÜTUNA (H-22) — personel adı ve notlar girildiği hâlinde kalıyor. */
async function pgSil(id, ad, maliyetMetni){
  const btn = document.getElementById('pgsil_' + id);
  if (btn && btn.disabled) return;          // çift tıklama kilidi

  const neden = await nedenSor(ad + ' bu aydan neden çıkarılıyor?',
    'Gerekçe zorunlu ve kayda geçer (denetim izine yazılır).\n' +
    'Örnek: "işten ayrıldı, bu ayın maaşı ödenmedi"', 1);
  if (!neden || !neden.trim()){
    if (neden !== null) bildir('Gerekçe boş olamaz — çıkarılmadı.', 'hata');
    return;
  }
  /* Rakam metinde: H-29'un dersi — "bu kadar değişir" deyip hiçbir
     rakama işaret etmeyen cümle eksiktir. */
  if (!confirm(ad + ' çıkarılacak (geri alınabilir işaretleme, veri kaybolmaz).\n\n'
             + 'Aylık maliyeti: ' + (maliyetMetni || '(bilinmiyor)') + '\n'
             + 'Bu ayın personel maliyeti BU KADAR AZALIR.\n\nDevam?')) return;

  if (btn){ btn.disabled = true; btn.textContent = '…'; }
  const { error } = await sb.rpc('rpc_personel_gider_sil', { p_id:id, p_neden:neden.trim() });
  if (error){
    if (btn){ btn.disabled = false; btn.textContent = '✕'; }
    bildir('Çıkarılamadı: ' + hataTr(error.message), 'hata');
    return;
  }
  vPersonel();
}
async function pgOncekiAydanKopyala(){
  const [y, a] = PG_DONEM.split('-').map(Number);
  const onceki = a===1 ? (y-1)+'-12' : y+'-'+String(a-1).padStart(2,'0');
  const { data } = await sb.from('personel_gider').select('*').eq('donem', onceki).eq('is_deleted', false);
  if (!data || data.length===0){ bildir('Önceki ayda ('+onceki+') kayıt yok.', 'hata'); return; }
  for (const p of data){
    await sb.from('personel_gider').insert({
      sube_id: p.sube_id, donem: PG_DONEM, personel_adi: p.personel_adi,
      maas: p.maas, sgk: p.sgk, prim: p.prim, yemek: p.yemek, avans: 0
    });
  }
  vPersonel();
}

async function vTalep(){
  const el = document.getElementById('icerik');
  el.innerHTML = `
    <h2 class="bolum">Yapılacaklar / Alınacaklar</h2>
    <div class="kart">
      ${kbaslik('', 'Yeni Madde', '')}
      <textarea id="tlMesaj" rows="2" placeholder="örn: 50 kg şeker, peçete, bardak alınacak / arıtma bakımı yapılacak"></textarea>
      <div class="ipucu" style="margin-top:6px">Yaz — herkes görür, yapan işaretler.</div>
      <button class="btn" id="tlKaydet" onclick="talepKaydet()">Listeye Ekle</button>
      <div class="hata-msg" id="tlMsg"></div>
    </div>
    <div id="tlListe"></div>`;
  talepListe();
}
async function talepKaydet(){
  const m = document.getElementById('tlMesaj').value.trim();
  if (!m){ mesaj('tlMsg','hata','Boş madde eklenemez.'); return; }
  const data = await rpcCagir('rpc_duzeltme_talebi_ac',{
    p_idem: idem(), p_sube: AKTIF_SUBE, p_hedef_tablo:null, p_hedef_id:null, p_mesaj:m
  },'tlKaydet','tlMsg','Listeye eklendi ✓');
  if (data && data.ok){ document.getElementById('tlMesaj').value=''; talepListe(); talepRozet(); }
}
async function talepListe(){
  const { data } = await sb.from('duzeltme_talebi')
    .select('*, olusturan:olusturan_id(ad), cozen:cozen_id(ad)')
    .eq('is_deleted',false).order('durum').order('created_at',{ascending:false}).limit(50);
  const el = document.getElementById('tlListe'); if(!el) return;
  const acik = (data||[]).filter(t=>t.durum==='acik');
  const bitti = (data||[]).filter(t=>t.durum!=='acik');
  // Kaç gündür beklediği görünsün — 7 günü geçen madde unutulmuş demektir
  const gun = (t) => Math.floor((Date.now() - new Date(t.created_at).getTime()) / 86400000);
  const kart = (t) => {
    const g = gun(t), eski = t.durum==='acik' && g >= 7;
    return `<div class="sr">
      <div>
        <div class="sr-ad" style="${t.durum!=='acik'?'text-decoration:line-through;color:var(--soluk);font-weight:700':''}">${esc(t.mesaj)}</div>
        <div class="sr-alt">${esc(t.olusturan?.ad||'—')} · ${g===0?'bugün':g+' gündür'}
          ${eski?'<span class="rozet rz-hata" style="margin-left:4px">UNUTULDU</span>':''}
          ${t.durum!=='acik'?`<br><span style="color:var(--ok);font-weight:800">✓ ${esc(t.cozen?.ad||'')} yaptı${t.cozum_tarihi?' · '+new Date(t.cozum_tarihi).toLocaleDateString('tr-TR'):''}</span>`:''}</div>
      </div>
      <div style="text-align:right;white-space:nowrap">
        ${t.durum==='acik'
          ? `<button class="btn2" onclick="yapildiIsaretle('${t.id}',false)">✓ Yaptım</button>`
          : `<button class="btn2" style="background:var(--gri);color:var(--soluk)" onclick="yapildiIsaretle('${t.id}',true)">Geri Al</button>`}
        <button class="bo-btn" style="color:var(--hata);display:block;margin:4px 0 0 auto" onclick="maddeSil('${t.id}')">Sil</button>
      </div>
    </div>`;
  };
  const unutulan = acik.filter(t=>gun(t)>=7).length;
  el.innerHTML = `
    <div class="kart">
      ${kbaslik(unutulan?unutulan+' MADDE UNUTULDU':'', 'Bekleyenler', `<div class="kb-sag">${acik.length}</div>`)}
      ${acik.length===0
        ? bosDurum('liste','Bekleyen madde yok','Alınacak veya yapılacak bir şey çıktığında yukarıdan ekle.')
        : acik.map(kart).join('')}
    </div>
    ${bitti.length>0?`<div class="kart">
      ${kbaslik('', 'Tamamlananlar', `<div class="kb-sag">${bitti.length}</div>`)}
      ${bitti.map(kart).join('')}</div>`:''}`;
}
async function yapildiIsaretle(id, geri){
  const { error } = await sb.rpc('rpc_yapildi_isaretle', { p_id:id, p_geri:geri });
  if (error){ bildir('Güncellenemedi: '+hataTr(error.message), 'hata'); return; }
  talepListe(); talepRozet();
}
async function maddeSil(id){
  if (!await onaySor('Bu madde silinsin mi?', null, 'Sil')) return;
  const { error } = await sb.rpc('rpc_madde_sil', { p_id:id });
  if (error){ bildir('Silinemedi: '+hataTr(error.message), 'hata'); return; }
  talepListe(); talepRozet();
}

/* ================== ARAÇ (OWNER) ==================
   Aracın kimliği burada, masrafları GİDER tablosunda (arac_id ile bağlı).
   Böylece yakıt/bakım/MTV hem bu ekranda toplanır hem kâra doğru düşer — çift sayım yok.
   Gelir vergisi buraya GİRMEZ: o kâr üzerinden alınır, aracın masrafı değildir.       */
let AR_YIL = null;
async function vArac(){
  const el = document.getElementById('icerik');
  if (PROFIL.rol !== 'owner'){ el.innerHTML = '<div class="ipucu">Bu ekran yöneticiye özeldir.</div>'; return; }
  el.innerHTML = '<h2 class="bolum">Araç</h2><div class="kart">Yükleniyor...</div>';
  const yil = AR_YIL || bugun().slice(0,4);
  AR_YIL = yil;
  const [ar, mal] = await Promise.all([
    sb.from('arac').select('*').eq('is_deleted',false).order('plaka'),
    sb.from('v_arac_maliyet').select('*').eq('yil',yil)
  ]);
  if (ar.error){ el.innerHTML = `<div class="kart"><div class="uyari-agir">Araçlar yüklenemedi: ${esc(hataTr(ar.error.message))}</div></div>`; return; }
  const araclar = ar.data||[], masraf = mal.data||[];

  // Tarih uyarısı: muayene/sigorta/kasko yaklaşıyor mu
  const gunFark = (t)=> t ? Math.round((new Date(t+'T00:00') - new Date(bugun()+'T00:00'))/86400000) : null;
  const tarihDurum = (t, ad)=>{
    const g = gunFark(t);
    if (g === null) return { sinif:'', metin: ad+' girilmemiş', gun:null };
    if (g < 0)  return { sinif:'uyari-agir',  metin:`${ad} ${Math.abs(g)} gün önce GEÇTİ`, gun:g };
    if (g <= 30) return { sinif:'uyari-orta', metin:`${ad} ${g} gün sonra`, gun:g };
    return { sinif:'', metin:`${ad}: ${new Date(t+'T00:00').toLocaleDateString('tr-TR')}`, gun:g };
  };

  el.innerHTML = `
    <h2 class="bolum">Araç</h2>
    ${araclar.length===0
      ? `<div class="kart">${bosDurum('kutu','Kayıtlı araç yok','Aşağıdan plakayı ekle; yakıt, bakım, sigorta ve MTV masrafları o araca bağlanır.')}</div>`
      : araclar.map(a=>{
          const m = masraf.filter(x=>x.arac_id===a.id);
          const toplam = m.reduce((s,x)=>s+ +x.tutar,0);
          const kat = {};
          m.forEach(x=>{ kat[x.kategori||'Diğer'] = (kat[x.kategori||'Diğer']||0) + +x.tutar; });
          const sirali = Object.entries(kat).sort((a,b)=>b[1]-a[1]);
          const uyarilar = [tarihDurum(a.muayene_tarihi,'Muayene'),
                            tarihDurum(a.sigorta_bitis,'Sigorta'),
                            tarihDurum(a.kasko_bitis,'Kasko')];
          const acil = uyarilar.filter(u=>u.sinif);
          return `<div class="kart">
            ${kbaslik(esc(a.marka_model||'ARAÇ'), esc(a.plaka),
               `<button class="btn2" onclick="aracDuzenle('${a.id}')">Düzenle</button>`)}
            ${acil.map(u=>`<div class="${u.sinif}">${esc(u.metin)}</div>`).join('')}
            <div class="ozet-grid">
              <div class="ozet-kut"><div class="e">${yil} MALİYETİ</div>
                <div class="d">${tl(toplam)}</div>
                <div class="aciklama">${m.reduce((s,x)=>s+ +x.kayit,0)} kayıt${toplam>0?'<br>ayda ~'+tl(toplam/12):''}</div></div>
              <div class="ozet-kut"><div class="e">KAYITLI</div>
                <div class="d" style="font-size:16px">${a.kayitli_kime==='sirket'?'Şirket':'Şahıs'}</div>
                <div class="aciklama">${uyarilar.filter(u=>!u.sinif && u.gun!==null).length} tarih takipte</div></div>
            </div>
            ${sirali.length ? sirali.map(([k,v])=>ozSatir(esc(k), tl(v))).join('')
                              + ozSatir(yil+' TOPLAM', tl(toplam), true)
                            : '<div class="ipucu">Bu yıl bu araca masraf girilmemiş.</div>'}
            <div class="bilgi-not" style="margin-top:10px">
              ${uyarilar.filter(u=>u.gun!==null && !u.sinif).map(u=>esc(u.metin)).join(' · ') || 'Muayene/sigorta/kasko tarihi girilmemiş — Düzenle\'den ekle, yaklaşınca uyarır.'}
            </div>
          </div>`;
        }).join('')}

    <div class="kart">
      ${kbaslik('', 'Araç Masrafı Ekle', '')}
      <label>Araç</label>
      <select id="agArac">${araclar.map(a=>`<option value="${a.id}">${esc(a.plaka)}</option>`).join('')}</select>
      <label>Ne için?</label>
      <select id="agKategori">${KATALOG.kategoriler
        .filter(k=>/Yakıt|Araç|Taşıt|Otopark/.test(k.ad))
        // Yakıt en sık girilen kalem — listede ilk sırada olsun. Alfabetik sırada
        // "Araç Bakım" öne geçiyordu ve yakıt yanlış kategoriye kaydediliyordu.
        .sort((a,b)=>(a.ad==='Yakıt'?-1:b.ad==='Yakıt'?1:a.ad.localeCompare(b.ad,'tr')))
        .map(k=>`<option value="${k.id}">${esc(k.ad)}</option>`).join('')}</select>
      ${tarihSecici('agTarih')}
      <label>Tutar</label><input type="text" inputmode="decimal" id="agTutar" placeholder="0,00">
      <label>KDV Tutarı (belgede yazanı yaz; MTV'de yoktur, boş bırak)</label>
      <input type="text" inputmode="decimal" id="agKdv" placeholder="0,00">
      <label>Açıklama</label><input type="text" id="agAciklama" placeholder="örn: 40 lt motorin, 152.000 km">
      <label>Belge (fiş fotoğrafı veya PDF)</label>
      <input type="file" id="agFoto" accept="image/*,application/pdf,.pdf">
      <button type="button" class="btn2" id="agOku" onclick="aracBelgeOku()" style="width:100%;margin-top:6px">
        📄 Belgeyi oku — tutarı doldur</button>
      <div class="oku-durum" id="agOkuDurum"></div>
      <button class="btn" id="agKaydet" onclick="aracMasrafKaydet()">Masrafı Kaydet</button>
      <div class="hata-msg" id="agMsg"></div>
      <div class="ipucu">Bu masraf normal giderlere de yazılır — ay kârından düşer.</div>
    </div>

    <div class="kart">
      ${kbaslik('', 'Yeni Araç', `<button class="btn2" onclick="katlaAc('aracFormKutu',this)">Aç</button>`)}
      <div id="aracFormKutu" style="display:none">
        <input type="hidden" id="arId">
        <label>Plaka *</label><input type="text" id="arPlaka" placeholder="61 ABC 123">
        <label>Marka / Model</label><input type="text" id="arMarka" placeholder="örn: Fiat Doblo 1.6">
        <div class="satir">
          <div><label>Model Yılı</label><input type="text" inputmode="numeric" id="arYil"></div>
          <div><label>Kayıtlı</label>
            <select id="arKayitli"><option value="sahis">Şahıs</option><option value="sirket">Şirket</option></select></div>
        </div>
        <label>Muayene Tarihi (bir sonraki)</label><input type="date" id="arMuayene">
        <div class="satir">
          <div><label>Sigorta Bitiş</label><input type="date" id="arSigorta"></div>
          <div><label>Kasko Bitiş</label><input type="date" id="arKasko"></div>
        </div>
        <label>Not</label><input type="text" id="arNot">
        <button class="btn" id="arKaydet" onclick="aracKaydet()">Aracı Kaydet</button>
        <div class="hata-msg" id="arMsg"></div>
      </div>
    </div>

    <div class="kart">
      ${kbaslik('YIL', 'Masraf Dökümü', '')}
      <label>Yıl</label>
      <input type="number" id="arYilSec" value="${yil}" min="2020" max="2099"
             onchange="AR_YIL=this.value; vArac()">
      <div class="ipucu">Yakıt, bakım, sigorta, MTV — hepsi yukarıdaki araç kartında toplanıyor.</div>
    </div>`;
  paraBaglaHepsi(['agTutar','agKdv']);
}
function aracDuzenle(id){
  const k = document.getElementById('aracFormKutu');
  k.style.display = 'block';
  sb.from('arac').select('*').eq('id',id).maybeSingle().then(({data:a})=>{
    if(!a) return;
    document.getElementById('arId').value = a.id;
    document.getElementById('arPlaka').value = a.plaka||'';
    document.getElementById('arMarka').value = a.marka_model||'';
    document.getElementById('arYil').value = a.yil||'';
    document.getElementById('arKayitli').value = a.kayitli_kime||'sahis';
    document.getElementById('arMuayene').value = a.muayene_tarihi||'';
    document.getElementById('arSigorta').value = a.sigorta_bitis||'';
    document.getElementById('arKasko').value = a.kasko_bitis||'';
    document.getElementById('arNot').value = a.notlar||'';
    k.scrollIntoView({behavior:'smooth', block:'start'});
  });
}
async function aracKaydet(){
  const plaka = document.getElementById('arPlaka').value.trim();
  if (!plaka){ mesaj('arMsg','hata','Plaka boş olamaz.'); return; }
  const id = document.getElementById('arId').value || null;
  const kayit = {
    sube_id: AKTIF_SUBE,
    plaka,
    marka_model: document.getElementById('arMarka').value.trim()||null,
    yil: parseInt(document.getElementById('arYil').value,10) || null,
    kayitli_kime: document.getElementById('arKayitli').value,
    muayene_tarihi: document.getElementById('arMuayene').value||null,
    sigorta_bitis: document.getElementById('arSigorta').value||null,
    kasko_bitis: document.getElementById('arKasko').value||null,
    notlar: document.getElementById('arNot').value.trim()||null
  };
  const btn = document.getElementById('arKaydet');
  btn.disabled = true; btn.textContent = 'Kaydediliyor...';
  const { error } = id
    ? await sb.from('arac').update(kayit).eq('id',id)
    : await sb.from('arac').insert(kayit);
  btn.disabled = false; btn.textContent = 'Aracı Kaydet';
  if (error){ mesaj('arMsg','hata', hataTr(error.message)); return; }
  mesaj('arMsg','ok','Kaydedildi ✓');
  document.getElementById('arId').value = '';
  setTimeout(vArac, 700);
}
/* ARAÇ BELGESİ OKUMA
   Fatura ekranında "Belgeyi oku" vardı, araç masrafında YOKTU — kullanıcı fişin
   fotoğrafını yüklüyor, tutar boş kalıyordu. Aynı Edge Function (fatura-oku)
   akaryakıt fişini de okuyor; termal fiş kuralları zaten içinde tanımlı.
   Okunan değer ÖNERİDİR: alanlar dolar, kaydetmeden önce kullanıcı görür. */
async function aracBelgeOku(){
  const inp = document.getElementById('agFoto');
  const drm = document.getElementById('agOkuDurum');
  const btn = document.getElementById('agOku');
  const yaz = (t, s) => { if (drm){ drm.className = 'oku-durum ' + (s||''); drm.textContent = t; } };
  if (!(inp && inp.files && inp.files[0])){ yaz('Önce belgenin fotoğrafını veya PDF\'ini seç.','uyari'); return; }

  btn.disabled = true; const eski = btn.textContent; btn.textContent = 'Okunuyor...';
  yaz('Belge okunuyor, 10-20 saniye sürebilir...','');
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('Oturum bulunamadı, tekrar giriş yapın.');
    const f = inp.files[0];
    let govde;
    if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf'){
      const c = await pdfMetinCikar(f);
      if (!c.yeterli) throw new Error('Bu PDF taranmış görünüyor (metin çıkmadı). Fotoğrafını çekip dene.');
      govde = { metin: c.metin };
    } else {
      const k = await fotoKucult(f, 2000, 0.92);
      govde = { gorsel: await new Promise((coz,red)=>{ const fr=new FileReader();
        fr.onload=()=>coz(fr.result); fr.onerror=()=>red(new Error('Fotoğraf okunamadı')); fr.readAsDataURL(k.veri); }) };
    }
    const y = await fetch(SB_URL + '/functions/v1/fatura-oku', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+session.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify(govde)
    });
    const s = await y.json();
    if (!y.ok || !s.ok) throw new Error(s?.hata || ('Okuma başarısız ('+y.status+')'));

    const v = s.veri || {}, doldu = [];
    const koy = (id, deger, etiket) => {
      if (deger === null || deger === undefined || deger === '') return;
      const e = document.getElementById(id); if (!e) return;
      e.value = String(deger).replace('.', ',');
      e.dispatchEvent(new Event('input',{bubbles:true}));
      e.classList.add('oku-dolu'); doldu.push(etiket);
    };
    if (v.tarih && /^\d{4}-\d{2}-\d{2}$/.test(v.tarih)){
      const t = document.getElementById('agTarih');
      if (t){ t.value = v.tarih; t.classList.add('oku-dolu'); doldu.push('Tarih'); }
    }
    koy('agTutar', v.odenecek ?? v.genel_toplam, 'Tutar');
    const kdv = v.kdv_toplam ?? (Array.isArray(v.kdv_kirilim)
      ? v.kdv_kirilim.reduce((a,k)=>a + (+k.kdv_tutar||0), 0) || null : null);
    koy('agKdv', kdv, 'KDV');

    // Açıklama: yakıt fişinde satır "MOTORİN 40,5 LT" gibi gelir — miktarı koru
    const s1 = Array.isArray(v.satirlar) && v.satirlar.length ? v.satirlar[0] : null;
    const ack = document.getElementById('agAciklama');
    if (ack && !ack.value.trim()){
      const parca = [];
      if (s1?.ad) parca.push(s1.ad);
      if (s1?.miktar) parca.push(s1.miktar + (s1.birim ? ' '+s1.birim : ''));
      if (v.tedarikci?.ad) parca.push(v.tedarikci.ad);
      if (parca.length){ ack.value = parca.join(' · '); ack.classList.add('oku-dolu'); doldu.push('Açıklama'); }
    }

    /* ⚠ ADIM 14 · OKUNAMAYAN ALAN ADIYLA YAZILIR, DURUM YESIL DEGIL.
       OLCULDU: KDV okunamayinca alan bos kaliyor, durum satiri
       "Dolduruldu: Tarih, Tutar, Açıklama" diye YESIL cikiyor ve
       kayda paraDeger uzerinden 0,00 gidiyordu — indirilecek KDV
       sessizce dusuyordu. ADIM 06'da ayni sinif hatayi kapatmistik.
       Isaret alanda kalir; kullanici yazinca duser (okunamadiIsaretle). */
    [['agTutar','Tutar'], ['agKdv','KDV']].forEach(([id]) =>
      okunamadiIsaretle(id, !!(document.getElementById(id)||{}).value));
    const bosKalan = [['agTutar','Tutar'], ['agKdv','KDV']]
      .filter(([id]) => okunamadiMi(id)).map(x => x[1]);
    if (doldu.length === 0){
      yaz('Belge okundu ama tutar bulunamadı — elle yaz.','uyari');
    } else if (bosKalan.length){
      yaz('Dolduruldu: ' + doldu.join(', ') + ' · ' + dilEksik(bosKalan)
        + ' — yoksa o alan kayda GİRMEZ.','uyari');
    } else {
      yaz('Dolduruldu: ' + doldu.join(', ') + ' · rakamları belgeyle karşılaştır, sonra kaydet.','ok');
    }
  }catch(e){
    yaz(hataTr(e.message || String(e)), 'uyari');
  }finally{
    btn.disabled = false; btn.textContent = eski;
  }
}
async function aracMasrafKaydet(){
  const tutar = paraDeger('agTutar');
  if (tutar === 0){ mesaj('agMsg','hata','Tutar boş olamaz.'); return; }
  const arac = document.getElementById('agArac').value;
  if (!arac){ mesaj('agMsg','hata','Önce araç ekle.'); return; }
  /* ⚠ ADIM 14 · OKUNAMAYAN KDV SESSIZ 0 OLMAZ.
     OLCULDU: bu yolda hicbir soru YOKTU — agKdv bos kalinca
     paraDeger 0 donduruyor ve kayda 0,00 giriyordu. Gider yolunda
     zaten bir onay vardi (giderKaydet); ayni karar buraya da geliyor.
     ⚠ Yeni bir kapi degil, ev kalibi: soyler, durdurmaz. */
  if (paraDeger('agKdv') === 0){
    const okunamadi = okunamadiMi('agKdv');
    if (!confirm(okunamadi
      ? 'KDV belgeden OKUNAMADI ve alan boş.\n\n'
        + 'Böyle kaydedilirse KDV 0,00 yazılır ve bu masraf indirilecek '
        + 'KDV hesabına GİRMEZ.\n\nİptal → forma dön, belgedeki KDV\'yi yaz\n'
        + 'Tamam → belgede KDV yok, 0,00 olarak kaydet'
      : 'KDV tutarı BOŞ — bu masraf indirilecek KDV hesabına girmeyecek. '
        + 'Faturasız/KDV\'siz masraf mı? Yine de kaydedilsin mi?')) return;
  }
  const btn = document.getElementById('agKaydet');
  btn.disabled = true; btn.textContent = 'Fotoğraf yükleniyor...';
  let foto = null;
  try { foto = await fotoYukle('agFoto','fatura'); }
  catch(e){ mesaj('agMsg','hata',hataTr(e.message)); btn.disabled=false; btn.textContent='Masrafı Kaydet'; return; }
  const data = await rpcCagir('rpc_gider_kaydet',{
    /* ⚠ arac ANAHTARDA: ayni gun ayni tutarda iki FARKLI araca masraf
       girilebilir; disarida birakmak ikincisini engellerdi.
       ⚠ agAciklama GIRMEZ — serbest metin. Etiket 'gider': bes gider
       cagrisinin hepsinde AYNI, sunucu _idem_kontrol'u bununla arar. */
    p_idem: await idemKararli('gider',[AKTIF_SUBE, document.getElementById('agTarih').value,
            document.getElementById('agKategori').value, tutar, arac]),
    p_sube: AKTIF_SUBE,
    p_tarih: document.getElementById('agTarih').value,
    p_kategori: document.getElementById('agKategori').value,
    p_aciklama: document.getElementById('agAciklama').value.trim()||null,
    p_tutar: tutar, p_kdv_orani: null, p_kdv_tutar: paraDeger('agKdv'),
    p_foto: foto, p_kasadan: false, p_tedarikci: null, p_arac: arac
  },'agKaydet','agMsg','Masraf kaydedildi ✓');
  if (data && data.ok){
    ['agTutar','agKdv','agAciklama'].forEach(i=>{ const e=document.getElementById(i); e.value=''; e.classList.remove('oku-dolu'); });
    const od=document.getElementById('agOkuDurum'); if(od){ od.textContent=''; od.className='oku-durum'; }
    document.getElementById('agFoto').value='';
    setTimeout(vArac, 700);
  }
}

/* ================== BELGELER ==================
   Belgeler yükleniyordu ama hiçbir yerde toplu görünmüyordu: bir dekontu bulmak
   için hangi kayda eklendiğini hatırlamak gerekiyordu. Daha kötüsü, BELGESİ
   OLMAYAN kayıtlar hiç görünmüyordu — kanıt eksiği sessiz kalıyordu.
   Bu ekran ikisini birden gösterir; eksikler üstte, çünkü iş onlarda. */
let BG_AY = null, BG_TUR = 'hepsi', BG_LISTE = [];
/* ⚠ Y36 · OLCULDU: `v_belgeler` gorunumunun BES dali var — z_raporu ·
     pos_slip · fatura · gider · **vergi**. Yani vergi dekontu Belgeler
     listesinde ZATEN vardi; eksik olan tek kaynak `banka_mutabakat`.
     (Uc tablo okuyan yer Belgeler ekrani degil, ARSIV PDF ureticisi.)
   ⚠ `banka_mutabakat` gorunume EKLENMEDI — o bir DB nesnesi ve bu tur
     migration YOK. Istemci ayri bir sorguyla okuyup listeye katiyor. */
const BG_TUR_AD = { z_raporu:'Z Raporu', pos_slip:'POS Slip', fatura:'Fatura',
                    gider:'Gider', vergi:'Vergi/SGK', mutabakat:'POS Mutabakatı' };
let BG_ARA = '';
let BG_YUKLU_AY = null;   // arama tazelemesinde sorgu atmamak icin
/* ⚠ Y36 · `onbellek` YALNIZ ARAMA icin: her tus vurusunda yeni sorgu
     atmak yanlis olurdu — arama YUKLENMIS liste uzerinde calisir.
     Ay degisiminde, belge yuklemesinden sonra ve ilk acilista
     cagrilar parametresiz gelir, yani liste TAZELENIR. */
async function vBelge(onbellek){
  const el = document.getElementById('icerik');
  const ay = BG_AY || bugun().slice(0,7);
  if (onbellek && BG_YUKLU_AY === ay && BG_LISTE && BG_LISTE.length){
    bgCiz(el, ay); return;                    // sorgu YOK
  }
  el.innerHTML = '<h2 class="bolum">Belgeler</h2><div class="kart">Yükleniyor...</div>';

  /* ⚠ Y36 · IKINCI KAYNAK: `banka_mutabakat`. Gorunume eklenemez
       (migration yok), o yuzden ayri sorguyla okunup listeye katiliyor.
     ⚠ `pdf_path` NULL olan ESKI kayitlar ALINMIYOR: tiklaninca hicbir
       sey acmayan satir, yalan soyleyen dugmedir (dosyanin M3 kurali).
       Suzgec hem sunucuda hem istemcide — sunucu suzgeci dusse bile
       NULL satir listeye girmesin. */
  const [{ data, error }, mut] = await Promise.all([
    sb.from('v_belgeler').select('*')
      .gte('tarih', ay + '-01').lte('tarih', aySon(ay)).order('tarih', { ascending:false }),
    sb.from('banka_mutabakat').select('id,donem,durum,pdf_path')
      .eq('donem', ay).eq('is_deleted', false).not('pdf_path', 'is', null)
  ]);
  if (error){
    el.innerHTML = `<h2 class="bolum">Belgeler</h2>
      <div class="uyari-agir">Belgeler yüklenemedi: ${esc(hataTr(error.message))}</div>`;
    return;
  }
  BG_LISTE = data || [];
  /* ⚠ Mutabakat sorgusu DUSERSE liste yine cizilir, yalniz o satir
     eksik kalir — Belgeler ekraninin tamami kaybolmaz. */
  (mut && !mut.error ? (mut.data || []) : []).forEach(m => {
    if (!m.pdf_path) return;
    BG_LISTE.push({ kayit_id:m.id, tur:'mutabakat', tur_ad:'POS Mutabakatı',
      sube_id:AKTIF_SUBE, tarih:aySon(m.donem), tutar:0,
      baslik:'POS ekstresi · ' + ayAdi(m.donem)
             + (m.durum ? ' · ' + (m.durum === 'uyumlu' ? 'uyumlu' : 'fark var') : ''),
      yol:m.pdf_path });
  });
  BG_YUKLU_AY = ay;
  bgCiz(el, ay);
}
/* Cizim · sorgu YAPMAZ, BG_LISTE'yi kullanir. vBelge hem ilk yuklemede
   hem arama tazelemesinde BURAYI cagirir — iki ayri cizim kodu olmasin. */
function bgCiz(el, ay){
  const eksik = BG_LISTE.filter(x => !x.yol);
  const eksikTutar = eksik.reduce((a,x) => a + (+x.tutar||0), 0);
  const turSuzulmus = BG_TUR === 'hepsi' ? BG_LISTE : BG_LISTE.filter(x => x.tur === BG_TUR);
  /* ⚠ Y36 · METIN ARAMASI · YUKLENMIS LISTE UZERINDE, yeni sorgu YOK.
     ⚠ TURKCE HARF · IKI MEVCUT YARDIMCI BIRLESTIRILDI, YENISI YAZILMADI:
       `desenAd` (ı/İ → i, sonra lower) TEK BASINA ı/İ eksenini cozuyor
       ama ş/ğ/ü/ö/ç'ye dokunmuyor. Olculdu: "İŞYERİ" basligi "İŞYERİ" ·
       "işyeri" · "ışyerı" ile BULUNUYORDU, ASCII "isyeri" ile BULUNMUYOR;
       ayni sekilde "agustos" yazan "ağustos"u bulamiyordu (0 sonuc).
       `trDuz` (jsPDF icin yazilmis tam ASCII cevrimi) ile birlestirilince
       her iki eksen de duzeliyor ve ONCEDEN CALISAN hicbir sorgu
       bozulmuyor — olculdu: 1→1, 3→3, 0→1 ve 0→3.
     ⚠ `desenAd`in KENDISINE DOKUNULMADI: `vOzet`in urun adi eslesmesi
       ayni tanimi okuyor, orada davranis birebir ayni kaldi. Genisletme
       yalniz BU cagri yerinde, iki mevcut fonksiyonun bilesimi olarak.
     ⚠ Baslik VE tur adi birlikte aranir: kullanici "mutabakat" ya da
       "vergi" diye tur adiyla da arayabilir. */
  const bgDesen = (s) => desenAd(trDuz(s));
  const aranan = bgDesen(BG_ARA.trim());
  const gorunen = !aranan ? turSuzulmus : turSuzulmus.filter(x =>
    bgDesen((x.baslik || '') + ' ' + (BG_TUR_AD[x.tur] || x.tur || '')).includes(aranan));
  // Eksikler üstte: yapılacak iş onlar
  const sirali = [...gorunen].sort((a,b) => (a.yol?1:0) - (b.yol?1:0) || (a.tarih < b.tarih ? 1 : -1));

  const turSay = {};
  BG_LISTE.forEach(x => {
    turSay[x.tur] = turSay[x.tur] || { hepsi:0, eksik:0 };
    turSay[x.tur].hepsi++; if (!x.yol) turSay[x.tur].eksik++;
  });

  el.innerHTML = `
    <h2 class="bolum">Belgeler</h2>
    <div class="ay-gez">
      <button onclick="bgAyDegistir(-1)" aria-label="Önceki ay">‹</button>
      <div><div class="ay-ad">${ayAdi(ay)}</div>
        <div class="ay-alt">${BG_LISTE.length} belge taşıyan kayıt</div></div>
      <button onclick="bgAyDegistir(1)" ${ay >= bugun().slice(0,7) ? 'disabled' : ''} aria-label="Sonraki ay">›</button>
    </div>
    <div class="ozet-grid">
      <div class="ozet-kut"><div class="e">BELGELİ</div>
        <div class="d" style="color:var(--ok)">${BG_LISTE.length - eksik.length}</div>
        <div class="aciklama">${BG_LISTE.length} kayıttan</div></div>
      <div class="ozet-kut"><div class="e">BELGE EKSİK</div>
        <div class="d" style="color:${eksik.length?'var(--hata)':'var(--ok)'}">${eksik.length}</div>
        <div class="aciklama">${eksik.length ? tl(eksikTutar) + ' tutarında' : 'hepsi tamam'}</div></div>
    </div>
    ${eksik.length ? `<div class="uyari-orta">Belgesi olmayan kayıtlar listenin başında.
      Vergi dairesi veya muhasebeci sorduğunda kanıtın olmaz — dekontu bulup yükle.</div>` : ''}
    <div class="kart">
      <div class="yy-rol">
        <button class="btn2${BG_TUR==='hepsi'?' yy-aktif':''}" onclick="BG_TUR='hepsi';vBelge()">Hepsi (${BG_LISTE.length})</button>
        ${Object.keys(BG_TUR_AD).filter(t=>turSay[t]).map(t=>`
          <button class="btn2${BG_TUR===t?' yy-aktif':''}" onclick="BG_TUR='${t}';vBelge()">
            ${esc(BG_TUR_AD[t])}${turSay[t].eksik?' · '+turSay[t].eksik+' eksik':''}
          </button>`).join('')}
      </div>
    </div>
    ${/* ⚠ Arama kutusu stok ekranindaki kalibin AYNISI (type=search +
          oninput + bos sonuc notu). Yeni desen icat edilmedi. */''}
    <div class="kart">
      <input type="search" id="bgAra" placeholder="Belge ara — örn: ekstre, elektrik, dekont"
        value="${esc(BG_ARA)}" oninput="bgAraDegisti(this.value)" autocomplete="off"
        style="margin:0">
      ${aranan ? `<div class="bilgi-not" style="margin:8px 0 0">${gorunen.length} sonuç
        · <span class="tikla" style="text-decoration:underline"
          onclick="bgAraDegisti('')">aramayı temizle</span></div>` : ''}
    </div>
    <div class="kart">
      ${sirali.length === 0
        ? (aranan
            ? bosDurum('belge','Aramaya uyan belge yok','Başka bir kelime dene ya da aramayı temizle.')
            : bosDurum('belge','Bu ayda kayıt yok','Başka bir ay seç.'))
        : sirali.map(x => `<div class="liste-satir">
            <div class="l-sol">
              <div class="b">${esc(x.baslik || BG_TUR_AD[x.tur] || '—')}
                ${x.yol ? '' : '<span class="rozet rz-hata">BELGE YOK</span>'}</div>
              <div class="k">${esc(BG_TUR_AD[x.tur]||x.tur)} · ${new Date(x.tarih+'T00:00').toLocaleDateString('tr-TR')}${
                +x.tutar ? ' · ' + tl(x.tutar) : ''}</div>
            </div>
            <div class="l-sag">${x.yol
              ? belgeBtn(x.yol, 'Aç', esc(x.baslik||''))
              : `<button class="btn2" onclick="belgeYukleAc('${x.tur}','${x.kayit_id}','${esc((x.baslik||'').replace(/'/g,''))}')">Belge Yükle</button>`}
            </div>
          </div>`).join('')}
    </div>
    <input type="file" id="bgDosya" accept="image/*,application/pdf,.pdf" style="display:none">
    <div class="hata-msg" id="bgMsg"></div>`;
  /* ⚠ Yeniden cizim imleci kutunun basina atmasin: odagi ve imlec
     yerini geri koy. Aksi halde ikinci harfte imlec basa firliyor. */
  const araEl = document.getElementById('bgAra');
  if (araEl && BG_ARA){ araEl.focus();
    araEl.setSelectionRange(BG_ARA.length, BG_ARA.length); }
}

/* SAHİP PARA HAREKETİ — "kâr var ama para nerede?" sorusunun yarısı burada.
   Sahibin koyduğu/çektiği para kâr değildir ama kasayı ve bankayı değiştirir. */
/* KAPALI GÜN — kampüs kapalıysa o gün "eksik" sayılmasın.
   Yanlış alarm, uyarıların tamamını değersizleştirir. */
async function kapaliGunIsaretle(tarih){
  const t = new Date(tarih+'T00:00').toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'});
  const neden = await nedenSor(`${t}`, 'Bu gün işletme kapalı mıydı? Nedenini yaz:\n'
    + '(örn: resmi tatil, kampüs kapalı, yıllık izin)', 1);
  if (!neden || !neden.trim()) return;
  const { data, error } = await sb.rpc('rpc_kapali_gun',
    { p_sube: AKTIF_SUBE, p_tarih: tarih, p_neden: neden.trim(), p_geri: false });
  if (error){ bildir('İşaretlenemedi: ' + hataTr(error.message), 'hata'); return; }
  if (data && data.ok) vOzet();
}

    + ozSatir('Çektiğin', '−'+tl(t.cekilen))

async function ownerHareketKaydet(){
  const g = id => document.getElementById(id);
  const tutar = paraDeger('ohTutar');
  if (tutar <= 0){ mesaj('ohMsg','hata','Tutar girilmedi.'); return; }
  const yon = g('ohYon').value, yontem = g('ohYontem').value;
  const ad = yon === 'koyus' ? 'İŞLETMEYE PARA KOYDUN' : 'İŞLETMEDEN PARA ÇEKTİN';
  if (!confirm(`${ad}\n\n${tl(tutar)} · ${yontem === 'banka' ? 'banka' : 'kasa'}\n`
    + `${new Date(g('ohTarih').value+'T00:00').toLocaleDateString('tr-TR')}\n\n`
    + `Bu kâra girmez, sadece kasa/banka bakiyesini açıklar.\nOnaylıyor musun?`)) return;
  const data = await rpcCagir('rpc_owner_hareket_kaydet', {
    p_idem: idem(), p_sube: AKTIF_SUBE, p_tarih: g('ohTarih').value,
    p_yon: yon, p_tutar: tutar, p_yontem: yontem, p_not: g('ohNot').value.trim() || null
  }, 'ohKaydet','ohMsg','Kaydedildi ✓');
  if (data && data.ok){
    ['ohTutar','ohNot'].forEach(i => g(i).value = '');
    ownerHareketYukle(OZ_AY || bugun().slice(0,7));
  }
}
async function ownerHareketSil(id){
  const neden = await nedenSor('Bu kaydı neden siliyorsun? (kayda geçer)', null, 1);
  if (!neden || !neden.trim()) return;
  const { error } = await sb.rpc('rpc_owner_hareket_sil', { p_id:id, p_neden:neden.trim() });
  if (error){ mesaj('ohMsg','hata', hataTr(error.message)); return; }
  ownerHareketYukle(OZ_AY || bugun().slice(0,7));
}
function bgAyDegistir(fark){
  const t = new Date((BG_AY || bugun().slice(0,7)) + '-01T00:00');
  t.setMonth(t.getMonth() + fark);
  const yeni = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0');
  if (yeni > bugun().slice(0,7)) return;
  BG_AY = yeni; vBelge();
}
/* Satırdaki "Belge Yükle" — dosya seçtirir, yükler, kayda bağlar */
function belgeYukleAc(tur, kayitId, baslik){
  const inp = document.getElementById('bgDosya'); if (!inp) return;
  inp.value = '';
  inp.onchange = async () => {
    if (!inp.files || !inp.files[0]) return;
    mesaj('bgMsg','ok','Belge yükleniyor...');
    try{
      const yol = await fotoYukle('bgDosya', tur === 'vergi' ? 'vergi' : 'fatura');
      if (!yol) throw new Error('Dosya seçilmedi.');
      const { error } = await sb.rpc('rpc_belge_ekle',
        { p_tur: tur, p_kayit_id: kayitId, p_yol: yol });
      if (error) throw new Error(error.message);   // ⚠ Y2 · HAM firlatilir; ceviri GOSTERIM aninda
      mesaj('bgMsg','ok', baslik + ' — belge eklendi ✓');
      setTimeout(vBelge, 900);
    }catch(e){ mesaj('bgMsg','hata', hataTr(e.message)); }
  };
  inp.click();
}

/* ================== YETKİ YÖNETİMİ ==================
   Yetki ROL bazlıdır (karar K15). Kişiler role atanır, ekran izni role verilir.
   Aynı rol_yetki tablosunu RLS'teki yetki_var() da okur; ekran ile veri
   birbirinden ayrılamaz. Yönetici rolü korumalı: kendini kilitlemek mümkün değil. */
let YY_ROLLER = [], YY_KISILER = [], YY_MATRIS = {}, YY_SECILI = null;
async function yetkiYukle(){
  const el = document.getElementById('yetkiIcerik'); if (!el) return;
  const [{ data: roller, error: e1 }, { data: kisiler, error: e2 }, { data: matris, error: e3 }] =
    await Promise.all([
      sb.from('rol').select('*').order('sira'),
      sb.from('v_kisi_yetki').select('*').order('ad'),
      sb.from('rol_yetki').select('*')
    ]);
  if (e1 || e2 || e3){
    el.innerHTML = `<div class="uyari-agir">Yetkiler yüklenemedi: ${esc(hataTr((e1||e2||e3).message))}</div>`;
    return;
  }
  YY_ROLLER = roller||[]; YY_KISILER = kisiler||[];
  YY_MATRIS = {};
  (matris||[]).forEach(x => { (YY_MATRIS[x.rol] = YY_MATRIS[x.rol] || {})[x.ekran] = x; });
  if (!YY_SECILI || !YY_ROLLER.some(r => r.kod === YY_SECILI))
    YY_SECILI = (YY_ROLLER.find(r => !r.korumali) || YY_ROLLER[0])?.kod || null;
  yetkiCiz();
}

const EKRAN_AD = Object.fromEntries(SEKMELER_TUM.map(t => [t.id, t.ad]));
async function yetkiDegistir(rol, ekran, gor, yaz){
  const ad = EKRAN_AD[ekran] || ekran;
  const rolAd = YY_ROLLER.find(r=>r.kod===rol)?.ad || rol;
  if (!gor && !confirm(`${rolAd} rolü "${ad}" ekranını ARTIK GÖREMEYECEK.\n\n`
      + `Sekme kaybolur ve o ekranın verisi API'den de gelmez.\nOnaylıyor musun?`)) return;
  const data = await rpcCagir('rpc_yetki_ayarla',
    { p_rol:rol, p_ekran:ekran, p_gorebilir:gor, p_yazabilir:yaz }, null, 'yyMsg', null);
  if (data && data.ok) yetkiYukle();
}
async function rolEkle(){
  const ad = (document.getElementById('yyYeniAd')?.value || '').trim();
  if (!ad){ mesaj('yyMsg','hata','Rol adı gir.'); return; }
  const kod = ad.toLocaleLowerCase('tr')
    .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
    .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c')
    .replace(/[^a-z]/g,'_').replace(/^_+|_+$/g,'').slice(0,20);
  if (kod.length < 3){ mesaj('yyMsg','hata','Rol adı en az 3 harf olmalı.'); return; }
  if (!confirm(`"${ad}" rolü eklenecek.\n\nYeni rol HİÇBİR EKRANI göremez olarak başlar;\nneyi görebileceğini sen açarsın.\n\nOnaylıyor musun?`)) return;
  const data = await rpcCagir('rpc_rol_ekle', { p_kod:kod, p_ad:ad }, null, 'yyMsg', 'Rol eklendi ✓');
  if (data && data.ok){ YY_SECILI = kod; yetkiYukle(); }
}
async function rolSil(kod, ad){
  if (!await onaySor(`"${ad}" rolü silinecek.`, 'Bu rolde kimse yoksa silinir.\nOnaylıyor musun?', 'Sil')) return;
  const data = await rpcCagir('rpc_rol_sil', { p_kod:kod }, null, 'yyMsg', 'Rol silindi ✓');
  if (data && data.ok){ YY_SECILI = null; yetkiYukle(); }
}
async function kisiRolDegistir(profil, rol, ad){
  const rolAd = YY_ROLLER.find(r=>r.kod===rol)?.ad || rol;
  if (!confirm(`${ad} → ${rolAd}\n\nBu kişinin görebilecekleri değişecek.\nOnaylıyor musun?`)){ yetkiCiz(); return; }
  const data = await rpcCagir('rpc_profil_rol_ata', { p_profil:profil, p_rol:rol }, null, 'yyMsg', 'Rol atandı ✓');
  if (data && data.ok) yetkiYukle(); else yetkiCiz();
}
async function kisiAktifDegistir(profil, aktif, ad){
  if (!await onaySor(`${ad} ${aktif?'AÇILACAK':'KAPATILACAK'}.`,
    `${aktif?'Tekrar giriş yapabilir.':'Artık sisteme giremez. Kayıtları silinmez.'}\n\nOnaylıyor musun?`,
    aktif ? 'Aç' : 'Kapat')) return;
  const data = await rpcCagir('rpc_profil_aktif', { p_profil:profil, p_aktif:aktif }, null, 'yyMsg', 'Kaydedildi ✓');
  if (data && data.ok) yetkiYukle();
}

          ${uyari.map(u => `• ${esc(u.konu)}${u.adet>0?' ('+u.adet+')':''}${
