<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<!-- Zoom engeli kaldırıldı: finans tablolarında küçük rakamı büyütememek yanlış
     okumaya yol açıyor. Dokunma hedefleri zaten ≥44px, engele gerek yok. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- SÜRÜM: her yüklemede DEĞİŞTİR. Uygulama bunu sunucudakiyle karşılaştırıp
     eski sürümde kalan telefonu uyarır. İlk 3000 bayt içinde kalmalı. -->
<meta name="surum" content="2026-08-10-5">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>bardak's kampüs</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#FAF4E3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="bardak's">
<!-- İÇERİK GÜVENLİK POLİTİKASI
     Dışarıdan kod yüklenmesini engeller: yalnız jsdelivr'daki SABİTLENMİŞ ve
     SRI ile doğrulanan dosyalar çalışabilir. Bir tedarik zinciri olayında
     (kütüphane ele geçirilse bile) tarayıcı hash tutmayınca dosyayı reddeder.
     script-src'ta unsafe-inline var çünkü uygulama tek dosya ve onclick
     kullanıyor; yine de HARİCİ kaynak enjeksiyonunu kapatıyor.

     connect-src'ta blob: ZORUNLU — SİLME.
     pdf.js belgeyi okurken indirilen dosyayı blob: adresine koyup oradan
     fetch ediyor (fileloading.js). blob: yoksa tarayıcı bağlantıyı keser ve
     "Belgeyi oku" özelliği çalışmaz. İlk yazdığımda unutmuştum, canlıda
     PDF okuma kırıldı.

     frame-ancestors BİLEREK YOK: meta etiketiyle verildiğinde tarayıcı onu
     yok sayıyor ve her açılışta konsola uyarı basıyordu. Gerçek koruma HTTP
     başlığı gerektirir, GitHub Pages'te başlık ayarlanamıyor. Yani buradaki
     satır hiçbir zaman korumuyordu — sadece gürültü yapıyordu. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' blob: https://*.supabase.co https://cdn.jsdelivr.net; worker-src 'self' blob:; base-uri 'self'; form-action 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
/* --kagit: alttan/sağdan açılan panel ve tabaka zemini. TANIMSIZDI — "Daha" menüsü ve
   bütün detay panelleri şeffaf çıkıyordu, arkadaki içerik okunuyordu. */
.yy-bas{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--soluk);margin:10px 0 4px}
.yy-rol{display:flex;flex-wrap:wrap;gap:6px}
.yy-rol .yy-aktif{background:var(--ana);color:#fff;border-color:var(--ana)}
.yy-acik{background:var(--ok);color:#fff;border-color:var(--ok)}
:root{--ana:#2456A0;--ana-koyu:#183F78;--acik:#EBF0FA;--gri:#FAF4E3;--kart:#FFFEF8;--kagit:#FFFEF8;--metin:#1F3354;--soluk:#8189A0;--hata:#B3402F;--uyari:#C77B2B;--ok:#2E7D4F;--cizgi:#E7DEC8}
/* ===== Gün Sonu — iki kasa (Mission Control) ===== */
.kasa-grid{display:grid;grid-template-columns:1fr 1px 1fr;margin:12px 0}
.kasa-panel{min-width:0}
.kasa-panel.sol{padding-right:18px}
.kasa-panel.sag{padding-left:18px}
.kasa-ayirici{background:var(--cizgi);width:1px}
.kp-bas{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ana);padding-bottom:6px;margin-bottom:10px}
.kp-ad{font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--ana)}
.kp-drm{font-size:11px;font-weight:700;text-align:right}
.kp-drm.bos{color:var(--soluk)}.kp-drm.eksik{color:var(--uyari)}.kp-drm.tam{color:var(--ok)}
.kp-ara{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi);padding:8px 0;margin:12px 0}
.kp-ara span{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--soluk)}
.kp-ara b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kasa-sekme{display:none;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.ks-btn{border:1px solid var(--cizgi);background:var(--kart);padding:9px 6px;font-family:inherit;color:var(--metin);cursor:pointer;text-align:center}
.ks-btn.aktif{border-bottom:3px solid var(--ana);background:var(--acik)}
.ks-btn .ks-ad{font-size:12px;font-weight:800;letter-spacing:.5px}
.ks-btn .ks-tut{font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}
.gs-bant{border-top:2px solid var(--ana);margin-top:14px;padding-top:10px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.gs-bant .kalem{flex:1;min-width:105px}
.gs-et{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--soluk);text-transform:uppercase}
.gs-bant .dg{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.gs-bant .buyuk .dg{font-size:26px;font-weight:800;color:var(--ana)}
.gs-zdisi{border-top:1px solid var(--cizgi);margin-top:10px;padding-top:8px}
.gs-eksik{font-size:12px;margin-top:10px;line-height:1.7;color:var(--uyari)}
@media(max-width:760px){
  .kasa-grid{grid-template-columns:1fr}
  .kasa-ayirici{display:none}
  .kasa-panel{display:none;padding:0}
  .kasa-panel.aktif{display:block}
  .kasa-sekme{display:grid}
}
/* ===== Z raporu okuma durumu ===== */
.oku-durum{font-size:11.5px;line-height:1.55;margin:6px 0 2px;color:var(--soluk)}
.oku-durum.ok{color:var(--ok)}
.oku-durum.uyari{color:var(--uyari)}
.oku-dolu{background:#F2F8F4!important;border-color:var(--ok)!important}
/* ===== Uyarı hiyerarşisi =====
   Para kaybettiren şey ile arşiv eksiği aynı ağırlıkta durmamalı.
   AĞIR: para riski · ORTA: beyan/kayıt eksiği · geri kalanı düz metin satırı. */
.uyari-agir{background:#FBEAE7;border-left:3px solid var(--hata);color:var(--hata);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:0 0 8px;font-size:13px;font-weight:800;line-height:1.5}
.uyari-orta{background:#FBF3E4;border-left:3px solid var(--uyari);color:#8A6316;
  padding:9px 12px;border-radius:0 10px 10px 0;margin:0 0 8px;font-size:12.5px;font-weight:700;line-height:1.5}
/* Uyarı satırı: etiket + metin, dokununca ilgili bölüme gider */
.uy-sr{display:flex;align-items:baseline;gap:9px;cursor:pointer;min-height:44px;
  -webkit-tap-highlight-color:transparent}
.uy-sr:active{filter:brightness(.96)}
.uy-sr:last-child{margin-bottom:0}
.uy-et{font-size:9.5px;font-weight:900;letter-spacing:.7px;flex:none;opacity:.72;padding-top:1px}
.uy-mt{min-width:0;overflow-wrap:anywhere}
/* ===== Ürün detayı — tıklanabilir stok satırı + fiyat geçmişi ===== */
.tikla{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tikla:active{background:#F7F3E8}
.ud-ov{position:fixed;inset:0;z-index:70;background:rgba(28,24,18,.55);display:none;
  align-items:flex-end;justify-content:center}
.ud-ov.acik{display:flex}
.ud-kutu{background:var(--kagit);box-shadow:0 -8px 28px rgba(28,24,18,.28);
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:0 0 24px}
@media(min-width:560px){ .ud-ov{align-items:center} .ud-kutu{border-radius:20px} }
.ud-ust{position:sticky;top:0;background:var(--kagit);padding:18px 18px 12px;
  border-bottom:1px solid var(--cizgi);display:flex;align-items:flex-start;gap:12px}
.ud-kod{font-size:11px;font-weight:900;letter-spacing:.8px;color:var(--ana);margin:0 0 2px}
.ud-ad{font-size:17px;font-weight:900;line-height:1.25}
.ud-kapat{flex:none;width:44px;height:44px;border:none;background:#EFE9DC;border-radius:12px;
  font-size:17px;font-weight:900;color:var(--soluk);cursor:pointer}
.ud-govde{padding:16px 18px 0}
.ud-kunye{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--cizgi);
  border:1px solid var(--cizgi);border-radius:12px;overflow:hidden;margin:0 0 18px}
.ud-kunye>div{background:var(--kagit);padding:11px 10px}
.ud-et{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--soluk);margin:0 0 3px}
.ud-dg{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.ud-bas{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.ud-blk{font-size:11px;font-weight:900;letter-spacing:.7px;color:var(--soluk)}
.ud-trend{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
.ud-graf{border:1px solid var(--cizgi);border-radius:12px;padding:14px 10px 8px;margin:0 0 18px}
.ud-graf svg{display:block;width:100%;height:auto}
.ud-bos{font-size:12.5px;color:var(--soluk);line-height:1.6;padding:6px 2px}
.ud-satir{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:baseline;
  padding:11px 2px;border-bottom:1px solid var(--cizgi)}
.ud-satir:last-child{border-bottom:none}
.ud-trh{font-size:11.5px;font-weight:800;color:var(--soluk);font-variant-numeric:tabular-nums}
.ud-alt{font-size:11.5px;color:var(--soluk);line-height:1.45;margin-top:2px}
.ud-tut{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.ud-zam{color:var(--hata);font-weight:900}
.ud-indi{color:var(--ok);font-weight:900}
@media(prefers-reduced-motion:no-preference){
  .ud-kutu{animation:udGir .16s ease-out}
  @keyframes udGir{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
}
/* ===== Fatura ürün satırları ===== */
.fs-satir{border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.fs-bas{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.fs-ad{font-size:13.5px;font-weight:800;line-height:1.35}
.fs-rozet{flex:none;font-size:10px;font-weight:900;letter-spacing:.4px;padding:3px 7px;border-radius:6px}
.fs-rozet.tam{background:#E8F5EC;color:var(--ok)}
.fs-rozet.yeni{background:#FFF4E0;color:var(--uyari)}
.fs-rozet.atla{background:#EFEFEF;color:var(--soluk)}
.fs-detay{font-size:11.5px;color:var(--soluk);line-height:1.5;margin:0 0 8px}
.fs-yeni{margin-top:8px;padding-top:8px;border-top:1px dashed var(--cizgi)}
/* ===== Sürüm uyarı çubuğu ===== */
#surumBar{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:12px 14px;background:var(--uyari);color:#fff;
  font-size:13px;font-weight:700;line-height:1.4;box-shadow:0 -3px 14px rgba(0,0,0,.18)}
#surumBar button{flex:none;background:#fff;color:var(--uyari);border:none;border-radius:8px;
  padding:9px 16px;font-size:13px;font-weight:900;cursor:pointer}
/* ===== Çoklu Z raporu (cihaz arızasında aynı kasa 2+ Z basar) ===== */
.z-blok + .z-blok{margin-top:16px;padding-top:16px;border-top:2px dashed var(--cizgi)}
.zb-bas{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 8px}
.zb-ad{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--ana)}
.zb-sil{background:none;border:none;padding:0;font-size:11px;font-weight:700;color:var(--hata);cursor:pointer}
.z-ekle{width:100%;margin-top:12px}
/* ===== Belge görüntüleyici ===== */
.bo-btn{display:inline-block;border:1px solid var(--cizgi);background:var(--kart);color:var(--ana);
  font:inherit;font-size:11px;font-weight:700;padding:5px 9px;margin:3px 4px 0 0;cursor:pointer;white-space:nowrap}
.bo-btn:active{background:var(--acik)}
.bo-btn.yok{color:var(--soluk);border-style:dashed;cursor:default}
#belgeOverlay{position:fixed;inset:0;background:rgba(20,25,40,.92);z-index:9999;display:none;
  flex-direction:column;align-items:center;justify-content:flex-start}
#belgeOverlay .bo-ust{width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;color:#fff;font-weight:700;font-size:13px;flex:none}
#belgeOverlay .bo-kapat{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;
  font:inherit;font-size:18px;line-height:1;padding:6px 12px;cursor:pointer}
#belgeOverlay .bo-govde{flex:1;width:100%;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:0 8px 16px}
#belgeOverlay img{max-width:100%;height:auto;background:#fff}
#belgeOverlay .bo-yukleniyor{color:#fff;padding:30px;font-size:13px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gri);color:var(--metin);font-size:15px;padding-bottom:70px}
.gizli{display:none!important}
/* GİRİŞ */
#girisEkran{max-width:380px;margin:7vh auto;padding:24px}
.logoDaire{width:180px;height:180px;border:2.5px solid var(--ana);border-radius:50%;margin:0 auto 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent}
.logoYazi{font-weight:900;font-size:34px;color:var(--ana);letter-spacing:-1px;line-height:1}
.logoAltCizgi{width:110px;height:2.5px;background:var(--ana);margin:7px 0 6px}
.logoScript{font-family:'Caveat',cursive;color:var(--ana);font-size:17px;font-weight:600}
#girisEkran .alt{text-align:center;color:var(--ana);opacity:.75;margin:10px 0 24px;font-size:12px;font-weight:800;letter-spacing:3px}
.susSvg{display:block;margin:18px auto 0;opacity:.85}
/* GENEL */
.kart{background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;padding:16px;margin-bottom:12px}
/* Eski kart başlığı — yeni .kb-ad ile aynı ağırlıkta olsun ki ekranlar arası
   başlık boyu değişmesin (30'dan fazla yerde kullanılıyor, tek tek dokunmuyorum) */
.kbaslik{font-size:16px;font-weight:900;line-height:1.25;letter-spacing:-.2px;margin-bottom:12px}
label{display:block;font-size:12.5px;color:var(--soluk);font-weight:700;margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--cizgi);border-radius:9px;font-size:15px;background:#fff;color:var(--metin);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ana);border-color:var(--ana)}
button{cursor:pointer;font-size:15px;border:none;border-radius:9px;font-weight:800;font-family:inherit}
.btn{width:100%;padding:13px;background:var(--ana);color:#fff;margin-top:14px}
.btn:disabled{background:#9AAECE;cursor:wait}
/* Dokunma hedefi en az 44px — telefonda tek elle, zaman baskısı altında basılıyor */
.btn2{padding:0 16px;min-height:44px;background:var(--acik);color:var(--ana);font-size:13px}
.btn-kirmizi{padding:0 16px;min-height:44px;background:#fdeceb;color:var(--hata);font-size:13px}
.hata-msg{background:#fdeceb;color:var(--hata);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13.5px;display:none}
.ok-msg{background:#eafaf1;color:var(--ok);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13.5px;display:none}
.satir{display:flex;gap:8px}.satir>*{flex:1}
/* Segment kontrolü — dört ayrı buton yerine tek şerit; hangisinde olduğun belli */
.segment{display:flex;background:var(--kart);border:1.5px solid var(--cizgi);border-radius:11px;
  padding:3px;gap:3px;margin-bottom:12px;overflow:hidden}
.sg-btn{flex:1;min-width:0;min-height:40px;padding:0 6px;background:none;color:var(--soluk);
  font-size:13px;font-weight:800;border-radius:8px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;transition:background .12s,color .12s}
.sg-btn.aktif{background:var(--ana);color:#fff}
.sg-btn:not(.aktif):active{background:var(--acik)}
.rozet{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11.5px;font-weight:700}
.rz-uyari{background:#F8EEDD;color:var(--uyari)}.rz-ok{background:#E5F2E9;color:var(--ok)}.rz-hata{background:#F9E7E3;color:var(--hata)}.rz-gri{background:var(--acik);color:var(--ana)}
/* ÜST BAR */
#ustBar{background:var(--kart);color:var(--ana);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50;border-bottom:1.5px solid var(--cizgi)}
#ustBar .ad{font-weight:900;font-size:18px;letter-spacing:-0.5px;line-height:1.1}
#ustBar .ad .kmp{font-family:'Caveat',cursive;font-weight:600;font-size:15px;letter-spacing:0;margin-left:4px}
#ustBar .kim{font-size:11.5px;color:var(--soluk);font-weight:600}
#cikisBtn{background:var(--acik);color:var(--ana);padding:7px 12px;font-size:12.5px}
/* ============ UYGULAMA KABUĞU ============
   Telefonda 8 sekme 496px yer kaplıyordu; 375px ekranda son ikisi (Yapılacaklar, Yönetim)
   ekran dışında kalıyordu. Artık: mobilde 4 sekme + Daha, masaüstünde sol menü. */
#sekmeBar{position:fixed;bottom:0;left:0;right:0;background:var(--kart);
  border-top:1.5px solid var(--cizgi);display:flex;z-index:50;
  padding-bottom:env(safe-area-inset-bottom,0)}
#sekmeBar button{flex:1;min-width:0;padding:7px 2px 6px;background:none;color:var(--soluk);
  font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;
  border-top:2.5px solid transparent;position:relative;min-height:52px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbadge{position:absolute;top:3px;right:8px;background:var(--hata);color:#fff;border-radius:10px;
  font-size:9.5px;padding:1px 5px;font-weight:800;line-height:1.4}
#sekmeBar button.aktif{color:var(--ana);border-top-color:var(--ana)}
/* "#sekmeBar button" bir id taşıdığı için düz .sk-gizli sınıfını ezer; seçici eş güçte olmalı */
#sekmeBar button.sk-gizli{display:none}   /* telefonda sığmayan bölümler — "Daha"dan açılır */
#sekmeBar .iko{width:21px;height:21px}
#sekmeBar .iko svg{width:100%;height:100%}
main{padding:14px;max-width:640px;margin:0 auto}

/* "Daha" tabakası — mobilde sığmayan bölümler burada, gizli değil */
#dahaOv{position:fixed;inset:0;z-index:60;background:rgba(28,24,18,.55);display:none;
  align-items:flex-end}
#dahaOv.acik{display:flex}
#dahaKutu{background:var(--kagit);width:100%;border-radius:20px 20px 0 0;
  padding:8px 0 calc(18px + env(safe-area-inset-bottom,0));
  box-shadow:0 -8px 28px rgba(28,24,18,.28);border-top:1px solid var(--cizgi)}
/* Üstte tutamak — parmakla kapatılabileceği belli olsun */
#dahaKutu::before{content:'';display:block;width:38px;height:4px;border-radius:3px;
  background:var(--cizgi);margin:2px auto 6px}
@media(prefers-reduced-motion:no-preference){
  #dahaOv.acik #dahaKutu{animation:dahaGir .16s ease-out}
  @keyframes dahaGir{from{transform:translateY(18px)}to{transform:none}}
}
#dahaKutu .db-bas{font-size:11px;font-weight:900;letter-spacing:.8px;color:var(--soluk);padding:12px 20px 8px}
#dahaKutu button{width:100%;display:flex;align-items:center;gap:14px;padding:0 20px;min-height:54px;
  background:none;color:var(--metin);font-size:15px;font-weight:800;text-align:left;position:relative}

<script>
/* ================== AYAR ================== */
const SB_URL = 'https://gbheqnxmwvabwuimzskv.supabase.co';
const SB_KEY = 'sb_publishable_qtiCjExLIte6WJcbdB5jNg_fUJDYnxF';
const sb = supabase.createClient(SB_URL, SB_KEY);

/* ================== ŞUBE SÜZGECİ — TEK ÇIKIŞ NOKTASI ==================

   ⚠ BU BİR GÜVENLİK DENETİMİ DEĞİLDİR.
   İstemci tarafı süzgeç yalnız UYGULAMANIN KENDİ çağrılarını etkiler.
   Owner'ın oturumunu taşıyan biri ham fetch ile şubeler arası okumaya
   devam eder. Güvenlik sınırı RLS'tir, burası değil.

   ⚠ RLS KUSURLU DEĞİL — POLİTİKASI BU.
   Owner'ın tüm şubeleri görmesi v59'da BİLEREK verildi (rapor_kapisi
   owner için şube eşitliğini atlar). "Bizi tek şube kurtarıyor" demek,
   olmayan bir açığı rapor etmek olurdu.

   O HÂLDE BU NE İÇİN: GÖRÜNTÜ DOĞRULUĞU.
   Pano şube seçmeden sessizce topluyordu. İkinci şube açıldığı gün
   Özet, grafik ve raporlar iki şubeyi tek rakam gibi gösterirdi — kimse
   bunu istemedi, kimse fark etmezdi. Süzgeç "hangi şubeye bakıyorum"
   sorusunu ekranda tek ve açık tutar.

   ŞUBE İZOLASYONUNUN GÜVENLİK ÖZELLİĞİ OLMASI İSTENİYORSA yeri RLS'tir
   ve ayrı bir karardır — FAZ2_BULGULARI.md · AÇIK SORU-1'de kayıtlı.
   Sessizce istemciye çözdürülmedi.

   NEDEN BURADA, HER SORGUDA DEĞİL
   Tarama (2026-08-09): şube taşıyan tablolara 74 okuma sorgusu, 60'ında
   süzgeç yoktu. Elle 60 yama demek, 61.'sini yazacak kişinin unutması
   demektir. Bu listenin şemayla uyumunu araclar/kalip-tara.mjs denetler
   (araclar/fikstur/sube-tablolari.txt'e karşı) — düzyazı uyarı değil, kapı.

   HARİTA, LİSTE DEĞİL — DEĞER: "bu ilişki ŞUBESİZ GENEL SATIR üretir mi"
     true  -> or=(sube_id.eq.X, sube_id.is.null)   genel satır korunur
     false -> sube_id=eq.X                          düz eşitlik
   İlk yazımda hepsine is.null verilmişti; bu, "NULL şube_id taşıyan her
   satır her şubeye görünür" demekti — tek bir görünüm yüzünden 33'üne
   birden verilen bir battaniye. Ölçüldü ve daraltıldı.
*/
const SUBE_SUZGEC = new Map([
  /* GENEL SATIR ÜRETİR — ölçümle: tanımında `NULL::uuid AS sube_id` var,
     yani şubesiz "genel uyarı" satırı TASARIM. Düz eşitlik onları düşürürdü. */
  ['v_uyarilar',          true],

  /* Aşağıdakilerin hiçbiri genel satır üretmiyor. Ölçüm: şemadaki 34
     ilişkinin tabloları için sube_id NOT NULL (üç istisna aşağıda),
     görünümlerde sube_id taban sütunundan geliyor. */
  ['alis',                false], ['arac',               false],
  ['ay_kapanis',          false], ['banka_mutabakat',    false],
  ['belge_haric',         false], ['demirbas',           false],
  ['duzeltme_talebi',     false], ['gider',              false],
  ['gun_sonu',            false], ['kapali_gun',         false],
  ['personel_gider',      false], ['sayim',              false],
  ['stok_hareket',        false], ['tedarikci_odeme',    false],
  ['urun_alacak',         false], ['vergi_odeme',        false],
  ['v_acik_fatura',       false], ['v_arac_maliyet',     false],
  ['v_aylik_ozet',        false], ['v_belgeler',         false],
  ['v_kart_taksit',       false], ['v_kdv_ay',           false],
  ['v_kisi_yetki',        false], ['v_mutabakat_gun',    false],
  ['v_owner_hareket_ay',  false], ['v_stok_durum',       false],
  ['v_tedarikci_bakiye',  false], ['v_urun_alacak',      false],
  ['v_urun_son_fiyat',    false], ['v_vade_liste',       false],

  /* ⚠ ŞEMA AÇIĞI — sube_id NOT NULL DEĞİL, ama genel satır da DEĞİL.
     Ölçüldü: bugün ikisinde de şubesiz satır YOK (0 satır). Yine de
     kısıt olmadığı için biri oluşabilir ve düz eşitlikle HİÇBİR ekranda
     görünmez — sessiz kayıp. Doğru çözüm NOT NULL kısıtı; şema değişikliği
     olduğu için bu tura alınmadı, FAZ2_BULGULARI.md · AÇIK SORU-2.
     is.null vermek açığı maskelerdi, o yüzden verilmedi. Nöbetçi bu iki
     satırı "bilinen açık" olarak tanır; ÜÇÜNCÜSÜ çıkarsa hata verir. */
  ['owner_hareket',       false],
  ['vade',                false],
]);
/* 'profil' bilerek HARİTADA DEĞİL: açılışta AKTIF_SUBE yokken kendisi
   sorgulanıyor (id ile, RLS koruyor). Süzgeç oraya konsaydı giriş kırılırdı.
   Onun da sube_id'si NOT NULL değil — aynı şema açığı, aynı açık soru. */
(function subeSuzgeciKur(){
  const _from = sb.from.bind(sb);
  sb.from = function(tablo){
    const qb = _from(tablo);
    if (!SUBE_SUZGEC.has(tablo)) return qb;
    const genel = SUBE_SUZGEC.get(tablo);
    const _select = qb.select.bind(qb);
    qb.select = function(...a){
      if (!AKTIF_SUBE)
        throw new Error('Şube bilinmeden "'+tablo+'" okunamaz. (Açılış sırası bozuk.)');
      const q = _select(...a);
      return genel ? q.or('sube_id.eq.'+AKTIF_SUBE+',sube_id.is.null')
                   : q.eq('sube_id', AKTIF_SUBE);
    };
    return qb;   // insert/update/delete zinciri DOKUNULMADAN geçer
  };
})();
let PROFIL = null;   // {id, ad, rol, sube_id}

/* AKTIF_SUBE — "şu an hangi şubeye bakıyorum".
   Neden PROFIL.sube_id değil: v59 owner'ın herhangi bir şubeyi
   sorgulamasına BİLEREK izin veriyor (rapor_kapisi owner için şube
   eşitliğini atlar). Okumaları AKTIF_SUBE'ye çivilemek o yeteneği
   istemci tarafında öldürürdü. Çivi yerine değişken.

   Bugün tek şube var; değer PROFIL.sube_id'den geliyor ve DEĞİŞMİYOR.
   Yani davranış birebir aynı. Şube seçici düğmesi bilerek YOK — tek
   şubeyken gösterilecek bir seçim yok. */
let AKTIF_SUBE = null;

/* Şube değiştirme. Owner dışındaki roller için YASAK ve sessiz değil:
   deneme gürültülü düşer. Veri yarı eski yarı yeni kalmasın diye aktif
   ekran baştan çizilir. */
function subeDegistir(id){
  if (!PROFIL) throw new Error('Şube değiştirilemez: oturum yüklenmedi.');
  if (PROFIL.rol !== 'owner')
    throw new Error('Şube değiştirmek yalnız owner yetkisidir (rol: '+PROFIL.rol+').');
  if (!id) throw new Error('Şube değiştirilemez: şube kimliği boş.');
  if (id === AKTIF_SUBE) return;
  AKTIF_SUBE = id;

function stokFiltre(q){

const AY_ADI = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
function aySon(donem){           // "2026-07" → "2026-07-31"
  const y=+String(donem).slice(0,4), a=+String(donem).slice(5,7);

}

const idem = () => crypto.randomUUID();

/* v60 · KARARLI IDEM ANAHTARI — F4-2'nin kök nedeni
   Yukarıdaki idem() her çağrıda YENİ anahtar üretiyor. _idem_kontrol
   anahtarı islem_log'da arar; anahtar hep yeni olduğu için HİÇBİR ZAMAN
   bulamaz. Mükerrer koruması kod olarak vardı, davranış olarak yoktu.

   Bu üretecin anahtarı işlemin KİMLİĞİNDEN türer: aynı formu iki kez
   göndermek AYNI anahtarı üretir ve ikincisi sunucuda takılır.

   ⚠ SERBEST METİN GİRMEZ. Açıklama alanındaki tek harf değişse anahtar
     değişir ve koruma boşa çıkardı. Yalnız kimliği belirleyen alanlar:
     tarih, tutar, kategori/tedarikçi/ürün.
   ⚠ Kullanıcı da anahtara girer: iki farklı personelin aynı kaydı
     girmesi ayrı işlemdir, sunucu kontrolü onu yakalar. */
async function idemKararli(rpc, alanlar){
  const ham = [rpc, PROFIL?.id ?? '', ...alanlar.map(a => a ?? '')].join('|');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ham));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

async function yetkileriYukle(){
  YETKILER = {};

    sb.from('rol_yetki').select('ekran,gorebilir,yazabilir').eq('rol', PROFIL.rol),

  surumKontrol();                                    // arka planda, açılışı bekletmez
  setInterval(surumKontrol, 30*60*1000);             // uzun açık kalan telefon için 30 dk'da bir
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ document.getElementById('girisEkran').classList.remove('gizli'); return; }
  const { data: p, error } = await sb.from('profil').select('*').eq('id', session.user.id).single();
  if (error || !p || !p.aktif){
    alert('Hesabınız sisteme tanımlı değil. Yöneticiyle görüşün.');
    await sb.auth.signOut(); location.reload(); return;
  }

     profil sessizce BOŞ ekran gösterir (kullanıcı "veri kayboldu" sanır) ve
     uyarı sorgusunu komple hataya düşürür. Sessiz yanlış yerine gürültülü
     dur: yukarıdaki "aktif değil" kontrolüyle aynı kapı. */
  if (!p.sube_id){
    alert('Kullanıcınıza şube tanımlanmamış.\n\n'
      + 'Bu hâlde ekranlar boş görünür. Yöneticiyle görüşün.');

  }
  PROFIL = p;
  AKTIF_SUBE = p.sube_id;   // tek kaynak; bundan sonra PROFIL.sube_id doğrudan okunmaz

  document.getElementById('kimBilgi').textContent = p.ad + ' · ' + (ROL_AD[p.rol] || p.rol);

/* ===== SÜRÜKLE–BIRAK =====
   Dokuz ayrı dosya alanı var, hiçbiri sürükle-bırak kabul etmiyordu.
   Üstelik sayfaya bırakılan PDF'i tarayıcı yeni sekmede AÇIYOR — insan

   Hedef bulma sırası: (1) bırakılan yer dosya alanının kendisi mi,

   alanı varsa o. Üçü de tutmazsa hiçbir şey yapma — yanlış alana dosya
   koymak, hiç koymamaktan kötüdür. */
(function(){
  const gorunur = el => el && el.offsetParent !== null;
  function hedefBul(t){
    if (!t || !t.closest) return null;
    if (t.matches && t.matches('input[type=file]')) return t;
    const kart = t.closest('.kart, .ud-govde, form, #icerik');
    if (kart){
      const icinde = [...kart.querySelectorAll('input[type=file]')].filter(gorunur);
      if (icinde.length === 1) return icinde[0];
    }
    const hepsi = [...document.querySelectorAll('input[type=file]')].filter(gorunur);
    return hepsi.length === 1 ? hepsi[0] : null;
  }
  let vurgulu = null;
  const vurgula = el => {
    if (vurgulu === el) return;
    if (vurgulu) vurgulu.style.outline = '';
    vurgulu = el;
    if (el){ el.style.outline = '2px dashed var(--ana)'; el.style.outlineOffset = '3px'; }
  };
  ['dragenter','dragover'].forEach(o => document.addEventListener(o, e => {
    if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();                       // tarayici dosyayi ACMASIN
    e.dataTransfer.dropEffect = 'copy';
    vurgula(hedefBul(e.target));
  }));
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) vurgula(null); });
  document.addEventListener('drop', e => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();                       // her halukarda yeni sekmede acilmasin
    const hedef = hedefBul(e.target);
    vurgula(null);
    if (!hedef){
      alert('Dosyayı hangi alana koyacağımı anlayamadım.\n\n'
        + 'Doğrudan dosya seçme kutusunun üstüne bırak.');
      return;
    }
    const kabul = (hedef.accept || '').trim();
    const dosya = e.dataTransfer.files[0];
    if (kabul){
      const ad = dosya.name.toLowerCase(), tur = dosya.type || '';
      const uyar = kabul.split(',').map(x=>x.trim().toLowerCase()).some(k =>
        k.startsWith('.') ? ad.endsWith(k)
        : k.endsWith('/*') ? tur.startsWith(k.slice(0,-1))
        : tur === k);
      if (!uyar){ alert('Bu alan bu dosya türünü kabul etmiyor.\n\nKabul edilen: ' + kabul); return; }
    }
    const dt = new DataTransfer();
    dt.items.add(dosya);
    hedef.files = dt.files;
    // Mevcut kod change/input dinliyor — elle tetikle ki fark etsin
    hedef.dispatchEvent(new Event('change', { bubbles:true }));
    hedef.dispatchEvent(new Event('input',  { bubbles:true }));
    hedef.scrollIntoView({ block:'center', behavior:'smooth' });
  });
})();

async function fotoKucult(file, max, kalite){
  // Telefon fotoğrafları 5-10MB olabiliyor: yüklemeden önce küçült.
  // Varsayılan (arşiv/yükleme): 1600px @ 0.82 — yer kazandırır.
  // Okuma için (fatura/Z): 2000px @ 0.92 — A4 faturada ince yazı ve
  // "paket içi 50 adet" gibi küçük açıklamalar okunabilir kalsın.
  max = max || 1600; kalite = kalite || 0.82;
  try{
    const img = await createImageBitmap(file);
    const oran = Math.min(1, max / Math.max(img.width, img.height));
    if (oran === 1 && file.size < 700*1024) return { veri:file, tip:null };
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*oran); c.height = Math.round(img.height*oran);
    const cx = c.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',kalite));
    return blob ? { veri:blob, tip:'jpg' } : { veri:file, tip:null };
  }catch(e){ return { veri:file, tip:null }; } // küçültülemezse orijinali yükle
}
/* Cekirdek: elimizdeki DOSYAYI yukler. fotoYukle bunu input uzerinden cagirir,
   belgeEkle ise dogrudan — ikisi ayni yolu kullansin, iki ayri yukleme
   davranisi olmasin. */
async function dosyaYukle(f, klasor){
  if (!f) return null;
  const k = await fotoKucult(f);
  const uzanti = k.tip || (f.name.split('.').pop()||'jpg').toLowerCase();
  const yol = `${klasor}/${bugun()}_${crypto.randomUUID()}.${uzanti}`;
  const { error } = await sb.storage.from('belgeler').upload(yol, k.veri,
    { upsert:false, contentType: k.tip ? 'image/jpeg' : (f.type||undefined) });
  if (error) throw new Error('Belge yüklenemedi: ' + error.message);
  return yol;
}
async function fotoYukle(inputId, klasor){
  const inp = document.getElementById(inputId);
  if (!inp || !inp.files || !inp.files[0]) return null;
  return dosyaYukle(inp.files[0], klasor);
}

/* ===== SONRADAN BELGE EKLEME =====
   Gider ve vergi kayitlarinin duzenleme ekrani YOK. Bir kez girildi mi
   belgesini iliştirmenin hicbir yolu yoktu; 10 kayit (vergi dekontlari
   dahil) bu yuzden belgesiz kalmisti.
   Bu fonksiyon SADECE belge ekler: tutara, tarihe, KDV'ye DOKUNMAZ.
   Tam duzenleme bilerek yapilmadi — tutar degistirmek KDV'yi, kari ve
   cari bakiyeyi etkiler, ayri bir is. Belge eklemek tek yonlu ve zararsiz.
   Uzerine yazmaz: belgesi olan kayda tekrar eklemek istersen once sorar. */
async function belgeEkle(tablo, id, klasor, mevcutVar){
  if (mevcutVar && !confirm('Bu kayıtta zaten belge var.\n\n'
      + 'Yenisini eklersen eskisi kayıtla ilişkisiz kalır.\n\nDevam edilsin mi?')) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,application/pdf,.pdf';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    const eskiImlec = document.body.style.cursor;
    document.body.style.cursor = 'progress';
    try{
      const yol = await dosyaYukle(f, klasor);
      /* Degistirme ise eski yolu NOT alanina yaz: yeni dosya kayda baglanirken
         eskisi storage'da yetim kaliyor. Iz olmazsa hangisi oldugu bulunamaz. */
      let ek = {};
      if (mevcutVar){
        const alan = tablo === 'vergi_odeme' ? 'notlar' : 'aciklama';
        const { data: eski } = await sb.from(tablo).select(alan+',foto_path').eq('id', id).maybeSingle();
        if (eski && eski.foto_path)
          ek[alan] = ((eski[alan]||'') + ' [belge degistirildi ' + bugun()
                      + ', eski dosya: ' + eski.foto_path + ']').slice(0, 500);
      }
      const { error } = await sb.from(tablo).update({ foto_path: yol, ...ek }).eq('id', id);
      if (error) throw new Error(hataTr(error.message));
      if (tablo === 'gider')       await giderListe();
      else if (tablo === 'vergi_odeme') await vergiOdenenYukle();
      alert('Belge eklendi ✓');
    }catch(e){
      alert('Belge eklenemedi: ' + (e.message || String(e)));
    }finally{
      document.body.style.cursor = eskiImlec;
      inp.remove();
    }
  };
  inp.click();
}
async function rpcCagir(fn, params, btnId, msgId, basariTxt){
  // btnId olmayabilir (satır içi aç/kapa butonlarının sabit id'si yok) — null güvenli
  const btn = btnId ? document.getElementById(btnId) : null;
  const eski = btn ? btn.textContent : null;
  if (btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  try{
    // Aynı idem anahtarıyla otomatik 2 deneme: bağlantı koparsa (commit olmuş olabilir)
    // aynı anahtar _idem_kontrol'e takılır, mükerrer kayıt OLMAZ.
    let son;
    for (let deneme = 0; deneme < 2; deneme++){
      son = await sb.rpc(fn, params);
      if (!son.error) break;
      if (!/Failed to fetch|NetworkError|timeout/i.test(son.error.message)) break; // sadece ağ hatasında retry
      btn.textContent = 'Bağlantı koptu, tekrar deneniyor...';
      await new Promise(r=>setTimeout(r, 1200));
    }
    /* v60 · MUKERRER_SUPHESI — sunucu yakin zamanda ayni kaydi gordu.
       Engellemiyoruz, SORUYORUZ. Kaza (cift tiklama) burada durur: kimse
       "evet farkli" demez. Mesru ikinci kayit ise aninda gecer.
       Onay p_mukerrer_onay ile sunucuya gider ve audit'e iz birakir —
       tarayicida yutulan bir confirm() degil. */
    if (son.error && /MUKERRER_SUPHESI/.test(son.error.message)){
      const devam = confirm(
        'Az önce aynı tutarda ve aynı güne ait bir kayıt girilmiş görünüyor.\n\n' +
        'Bu GERÇEKTEN ayrı bir kayıt mı?\n\n' +
        'İptal → kaydetme (yanlışlıkla iki kez göndermiş olabilirsin)\n' +
        'Tamam → ayrı bir kayıt, yine de kaydet');
      if (!devam){
        mesaj(msgId, 'hata', 'Kaydedilmedi — listeyi kontrol et, kayıt zaten girilmiş olabilir.');
        return null;
      }
      son = await sb.rpc(fn, { ...params, p_mukerrer_onay: true });
    }
    if (son.error){ window.__sonRpcHataHam = son.error.message; throw new Error(hataTr(son.error.message)); }
    if (basariTxt) mesaj(msgId, 'ok', basariTxt);
    formTemiz();                       // kayıt gitti, form artık kirli değil
    return son.data;
  }catch(e){
    mesaj(msgId, 'hata', e.message + ' — Verileriniz formda duruyor, tekrar deneyin.');
    return null;
  }finally{
    if (btn){ btn.disabled = false; btn.textContent = eski; }
  }
}
function hataTr(m){
  /* Finans raporu yetki kapısı — rapora ÖZEL kodlar.
     Genel YETKI_YOK'u burada yakalamak yasak: 36 RPC aynı kodu fırlatıyor
     ve hepsi "Bu rapor için..." demeye başlıyordu. Genel karşılığı aşağıda,
     kendi yerinde duruyor. Bu üçü yalnız rapor akışına ait. */
  if (m.includes('RAPOR_YETKI_YOK')) return 'Bu rapor için yetkiniz yok.';
  if (m.includes('RAPOR_SUBE_YETKISIZ')) return 'Bu şubenin raporunu görüntüleyemezsiniz.';
  if (m.includes('RAPOR_DONEM_GECERSIZ')) return 'Dönem geçersiz — yıl ve ay seçimini kontrol et.';
  /* v59 · RAPOR_SUBE_YOK — şube belirlenemedi.
     İki ayrı sebebi var ve ikisi de kullanıcının kendi düzeltebileceği
     şey değil: (a) ekran şube seçmeden çağırdı, (b) profilde şube tanımlı
     değil. Bu yüzden mesaj "yetkiniz yok" demiyor — yanlış yönlendirir;
     kullanıcı yetkisini değil, kaydını düzelttirmeli. */
  /* v60 · MUKERRER_SUPHESI normalde rpcCagir'da yakalanip kullaniciya
     SORULUYOR. Buraya dusmesi, onay akisinin atlandigi bir cagri yolu
     oldugu anlamina gelir — sessiz kalmasin. */
  if (m.includes('MUKERRER_SUPHESI')) return 'Aynı kayıt az önce girilmiş görünüyor. Listeyi kontrol et.';
  if (m.includes('RAPOR_SUBE_YOK')) return 'Şube belirlenemedi. Profilinizde şube tanımlı olmayabilir — yöneticinize bildirin.';
  /* v59 · BELGE_SUBE_YETKISIZ — belge yükleme, başka şubenin kaydına.
     KAYIT_YOK'tan AYRI tutuluyor: birincisi normal (kayıt silinmiş
     olabilir), bu ise başka şubenin kaydına yazma denemesidir. */
  if (m.includes('BELGE_SUBE_YETKISIZ')) return 'Bu belge başka bir şubenin kaydına ait — yükleme yapılamaz.';
  // v33–v36 ile eklenen sunucu tarafı kurallar
  if (m.includes('O_GUN_KAYIT_VAR')) return 'O güne ait gün sonu kaydı var — kapalı gün işaretlenemez.';
  if (m.includes('AY_BITMEDI')) return 'Bu ay daha bitmedi — ancak biten ay kapatılabilir.';
  if (m.includes('ODEME_KAYDI_YOK')) return 'Bu vade elle "ödendi" yapılamaz — önce ödemeyi kaydet, vade kendiliğinden kapanır. Ödenecek tutar çıkmadıysa "Kapat" düğmesini kullan.';
  if (m.includes('TUTAR_POZITIF_OLMALI')) return 'Tutar sıfırdan büyük olmalı.';
  if (m.includes('MIKTAR_SIFIR_OLAMAZ')) return 'Miktar sıfır olamaz.';
  if (m.includes('OWNER_ROLU_KORUMALI')) return 'Yönetici rolü korumalıdır — yetkileri kapatılamaz.';
  if (m.includes('KORUMALI_ROL_SILINEMEZ')) return 'Bu rol korumalıdır, silinemez.';
  if (m.includes('KENDI_ROLUNU_DEGISTIREMEZSIN')) return 'Kendi rolünü değiştiremezsin.';
  if (m.includes('KENDINI_KAPATAMAZSIN')) return 'Kendi hesabını kapatamazsın.';
  if (m.includes('ROLDE_') && m.includes('_KISI_VAR')) return 'Bu rolde kayıtlı kişi var — önce onları başka role al.';
  if (m.includes('ROL_KODU_GECERSIZ')) return 'Rol adı en az 3 harf olmalı, sadece harf içermeli.';
  if (m.includes('ROL_ADI_ZORUNLU')) return 'Rol adı boş olamaz.';
  if (m.includes('ROL_YOK')) return 'Böyle bir rol yok.';
  if (m.includes('PROFIL_YOK')) return 'Kişi bulunamadı.';
  if (m.includes('DONEM_BICIMI')) return 'Dönem biçimi hatalı (YYYY-AA olmalı).';
  if (m.includes('SUBE_ZORUNLU')) return 'Şube seçilmemiş.';
  if (m.includes('DOSYA_YOLU_ZORUNLU')) return 'Dosya yolu boş olamaz.';
  if (m.includes('IDEM_KEY_BASKA_ISLEMDE')) return 'Bu işlem anahtarı başka bir işlemde kullanılmış — sayfayı yenileyip tekrar dene.';
  if (m.includes('VADE_YOK') || m.includes('VADE_BULUNAMADI')) return 'Vade kaydı bulunamadı.';
  if (m.includes('GECERSIZ_DURUM')) return 'Geçersiz durum.';
  if (m.includes('YIL_GECERSIZ')) return 'Yıl geçersiz.';
  if (m.includes('TARIH_ZORUNLU')) return 'Tarih zorunlu.';
  if (m.includes('ck_odeme_tutar_pozitif') || m.includes('ck_gider_tutar_pozitif')
   || m.includes('ck_alis_toplam_pozitif') || m.includes('ck_vergi_tutar_pozitif'))

  if (m.includes('ck_stok_isaret')) return 'Stok hareketi geçersiz: tüketim stoktan düşer, sıfır miktar kaydedilemez.';
  if (m.includes('GUN_ZATEN_GIRILMIS')) return 'Bu günün kaydı zaten girilmiş. Düzeltme gerekiyorsa talep açın.';
  /* v61 · Dönem kilidi artık GERÇEKTEN tutuyor: RPC'lerde ve tablo
     trigger'larında. Eski mesaj 'yöneticiye başvurun' diyordu ama
     yöneticinin kendisi de kilitli ve ne yapacağı yazmıyordu.
     Artık yol var: Ay Sonu ekranından ayı aç, gir, tekrar kapat. */
  if (m.includes('AY_KAPALI')) return 'Bu ay kapatılmış. Kayıt girmek için Ay Sonu ekranından ayı açman gerekiyor.';
  if (m.includes('AY_COK_ESKI')) return 'Bu ay çok eski — yalnız içinde bulunulan ay ve geriye iki ay açılabilir. Daha eskisi için düzeltme kaydı gerekir.';
  if (m.includes('AY_GELECEK')) return 'Gelecek bir ay açılamaz.';
  /* v65 · Eskiden burada "Ayı neden açtığını..." yazıyordu ve AŞAĞIDAKİ
     genel karşılığı GÖLGELİYORDU. rpc_gider_sil de aynı kodu fırlatıyor;
     gider silerken "ayı neden açtın" demek operatörü yanlış yere bakmaya
     gönderirdi. Tek ve bağlamdan bağımsız metin. */
  if (m.includes('NEDEN_ZORUNLU')) return 'Neden yazman gerekiyor — kayda geçecek.';
  if (m.includes('YETKI_YOK')) return 'Bu işlem için yetkiniz yok.';
  if (m.includes('SUBE_UYUSMUYOR')) return 'Şube uyuşmazlığı.';
  /* v65 · KAYIT_YOK'un karşılığı YOKTU — tarayıcıda ölçüldü, ham kod
     çıkıyordu. Çift tıklamada ikinci çağrı tam olarak bunu döndürür. */
  if (m.includes('KAYIT_YOK')) return 'Kayıt bulunamadı — silinmiş ya da başkası tarafından değiştirilmiş olabilir. Listeyi yenile.';
  if (m.includes('ux_alis_belge') || m.includes('duplicate key')) return 'Bu belge numarası bu firma için zaten girilmiş — mükerrer fatura engellendi.';
  if (m.includes('SADECE_KENDI')) return 'Sadece kendi girdiğiniz kaydı düzeltebilirsiniz.';

  if (m.includes('KASA_TIP_HATASI')) return 'Kasa verisi biçimi hatalı — sayfayı yenileyip tekrar deneyin.';
  if (m.includes('KASA_Z_NO_ZORUNLU')) return 'Her kasa için Z No zorunludur.';
  if (m.includes('KASA_Z_FOTO_ZORUNLU')) return 'Her kasa için Z raporu fotoğrafı zorunludur.';
  if (m.includes('KASA_SLIP_FOTO_ZORUNLU')) return 'POS slip fotoğrafı zorunlu değil — sayfayı yenileyin.';

  if (m.includes('KASA_EKSIK'))             return 'Her iki kasadan da en az bir Z raporu girilmelidir.';

/* ================== ÖZET (OWNER) ================== */
/* Günlük ciro grafiği — kütüphanesiz SVG.
   Önceki hâli adım sayara benziyordu: her sütunun arkasında bej "hedef şeridi",
   yuvarlak uçlar, tek renk, iki eksen etiketi. Finans grafiği değil aktivite çubuğuydu.
   Şimdi:
     · zemin şeridi YOK, düz uçlu sütun
     · hafta sonu ayrı ton — kampüste hafta sonu düşüğü BAŞARISIZLIK DEĞİL, takvim
     · üç yatay kılavuz + gerçek rakam
     · haftalık tarih etiketi (1, 8, 15, 22, 29)
     · kayıt girilmemiş gün: ince kesik taban çizgisi — "satış yok" ile karışmasın */
/* gunlukCiro(gunler, ayStr, kasaCikis)
   Grafiğin çizdiği sütunlar, başlıktaki toplam ve ortalama çizgisi TEK kaynaktan
   (bu fonksiyonun döndürdüğü seri) hesaplanır — üçü ayrı yerden gelirse tutmaz.
     kart         = gun_sonu.kart_toplam
     TOPLAM NAKİT = gun_sonu.kasa_nakit + o gün kasadan ödenen
                    ⚠ v62: "kasadan ödenen EKLENMEZ (zaten gider)" YANLIŞTI.
                    Gider tarafı o parayı zaten düşüyor; ciroya koymayınca
                    kâr o kadar EKSİK çıkıyordu. Kasaya giren nakit =
                    sayılan + ödenen. Aynı dosyanın :2464'teki yorumu bunu
                    baştan beri doğru tarif ediyordu, kod uygulamıyordu.
     SAHİP HAREKETİ  kasaya koyduğu/çektiği para SATIŞ DEĞİL — düşülür.
     gerçek ciro  = kart + toplam nakit
     Z'deki nakit (gun_sonu.nakit_toplam) toplam nakdi DEĞİŞTİRMEZ; tek işi
     ay sonu KDV beyanını beslemek (Temmuz'un Z nakdi → 28 Ağustos'ta ödenecek KDV).
   Kasa sayılmamışsa nakit BİLİNMEZ (uydurulmaz). Sayılan Z'dekinden azsa bu
   KASA AÇIĞIDIR — ayrı işaretlenir, sıfıra kırpılıp gizlenmez. */
function gunlukCiro(gunler, ayStr, kasaCikis, sahipNakit){
  const yil=+ayStr.slice(0,4), ayNo=+ayStr.slice(5,7);
  const gunSayisi=new Date(yil, ayNo, 0).getDate();
  const seri=[];
  let tResmi=0, tKart=0, tNakit=0, tKdvNakit=0, tZDisi=0, tGercek=0, kayitli=0, acikGun=0, bilinmeyen=0;
  const bugunS=bugun();
  for(let d=1; d<=gunSayisi; d++){
    const ts=ayStr+'-'+String(d).padStart(2,'0');
    const k=gunler.find(x=>x && x.tarih===ts);
    const g={ gun:d, tarih:ts, hafta:new Date(yil,ayNo-1,d).getDay(),
              gelecek: ts>bugunS, bugun: ts===bugunS };
    if(!k){ g.durum = g.gelecek ? 'gelecek' : 'eksik'; seri.push(g); continue; }
    kayitli++;
    g.resmi=+k.toplam||0;
    g.kart=+k.kart_toplam||0;
    g.nakit=+k.nakit_toplam||0;
    if(k.kasa_nakit===null || k.kasa_nakit===undefined){
      g.durum='kasa_sayilmadi'; g.nakitToplam=null; g.zDisi=null; g.gercek=g.resmi; bilinmeyen++;
    }else{
      // v62 · Kasaya GİREN nakit = sayılan + o gün kasadan ödenen.
      // Sahibin koyduğu/çektiği para satış değil, düşülür (SQL zaten öyle
      // yapıyordu; JS yapmıyordu — iki taraf tek tanıma bağlandı).
      const cikan  = (kasaCikis && kasaCikis[ts]) || 0;
      const sahip  = (sahipNakit && sahipNakit[ts]) || 0;
      g.nakitToplam = +k.kasa_nakit + cikan;
      g.zDisi = g.nakitToplam - g.nakit - sahip;
      g.gercek = g.kart + g.nakitToplam - sahip;
      // KASA AÇIĞI eşiği: artık kasadan ödenen düşülmüş DEĞİL, dahil.
      // Eski hâlde meşru bir ödeme günü yapay olarak "açık" işaretleniyordu.
      g.durum = g.zDisi<0 ? 'kasa_acigi' : 'tam';
      if(g.zDisi<0) acikGun++;
    }
    tResmi+=g.resmi; tKart+=g.kart; tKdvNakit+=g.nakit;
    tNakit+=(g.nakitToplam||0); tZDisi+=(g.zDisi||0); tGercek+=g.gercek;
    seri.push(g);
  }
  return { seri, gunSayisi,
           toplamKart:tKart,          // karttan gelen
           toplamNakit:tNakit,        // elle girilen nakit — BİZİM nakdimiz
           toplamKdvNakit:tKdvNakit,  // bunun KDV'ye dahil olan kısmı (Z raporundan)
           toplamZDisi:tZDisi,        // KDV'ye girmeyen kısım = toplamNakit − toplamKdvNakit
           toplamResmi:tResmi,        // Z toplamı (kart + KDV'ye dahil nakit)
           toplamGercek:tGercek,      // kart + elle girilen nakit
           kayitliGun:kayitli, ortalama: kayitli? tGercek/kayitli : 0,
           kasaAcigiGun:acikGun, kasaSayilmayanGun:bilinmeyen };
}
function ciroGrafigi(v){
  if(!v || !v.kayitliGun) return '';
  const { seri, gunSayisi, ortalama } = v;
  const G=340, Y=152, sol=40, sag=6, ust=14, alt=30;
  const iw=G-sol-sag, ih=Y-ust-alt;
  const ham=Math.max(...seri.map(g=>g.gercek||0), 1);
  const bas=Math.pow(10, Math.floor(Math.log10(ham)));
  const tavan=Math.ceil(ham/(bas/2))*(bas/2);
  const gen=iw/gunSayisi, kal=Math.max(gen-2.2, 1.6);
  const kisa=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.',',')+'b':String(Math.round(n));
  const yOf=val=>ust+ih-(val/tavan)*ih;
  const GUNAD=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  // Paranın NEREDE olduğuna göre ayrılır: kart bankada, nakit elde, Z dışı elde ama beyansız
  const KART='#4F86D6', NAKIT='#2F8F6B', ZDISI='#E08A3C', ACIK='#B3402F';

  let kilavuz='';
  [0,0.5,1].forEach(o=>{
    const val=tavan*o, y=yOf(val);
    kilavuz+=`<line x1="${sol}" y1="${y.toFixed(1)}" x2="${sol+iw}" y2="${y.toFixed(1)}"
      stroke="var(--cizgi)" stroke-width="1"${o?' stroke-dasharray="2 4"':''}/>`
      +`<text x="${sol-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5"
        font-weight="700" fill="#8189A0">${kisa(val)}</text>`;
  });

  // Sütunlar SADECE görsel. Telefonda sütun ~7px, kısa günlerde birkaç piksel;
  // parmakla basılmaz. Tıklama ve ipucu, sütunun ÜSTÜNDEKİ tam boy görünmez alanda.
  let sut='';
  seri.forEach(g=>{
    const x=sol+(g.gun-0.5)*gen-kal/2, tb=ust+ih;
    if(g.durum==='gelecek'){
      sut+=`<rect x="${x.toFixed(1)}" y="${(tb-6).toFixed(1)}" width="${kal.toFixed(1)}" height="6"
        fill="none" stroke="#C9BFA6" stroke-width="1" stroke-dasharray="2 2" opacity=".8"/>`; return;
    }
    if(g.durum==='eksik'){
      sut+=`<rect x="${x.toFixed(1)}" y="${(tb-9).toFixed(1)}" width="${kal.toFixed(1)}"
        height="9" fill="${ACIK}" opacity=".16"/>`; return;
    }
    if(g.durum==='kasa_acigi'){
      // Gerçek giren para resmîden AZ: sütun gerçeği gösterir, gün ayrı renkle işaretlenir
      const h=Math.max((g.gercek/tavan)*ih, 1.2);
      sut+=`<rect x="${x.toFixed(1)}" y="${(tb-h).toFixed(1)}" width="${kal.toFixed(1)}"
        height="${h.toFixed(1)}" fill="${ACIK}"/>`; return;
    }
    // Alttan üste: kart (bankada) → nakit (elde, beyanlı) → Z dışı (elde, beyansız)
    let y=tb;
    [[g.kart,KART],[g.nakit,NAKIT],[g.zDisi>0?g.zDisi:0,ZDISI]].forEach(([v,c])=>{
      if(!(v>0)) return;
      const h=Math.max((v/tavan)*ih, 0.8);
      y-=h;
      sut+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${kal.toFixed(1)}"
        height="${h.toFixed(1)}" fill="${c}"/>`;
    });
    if(g.bugun) sut+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${kal.toFixed(1)}"
      height="${(tb-y).toFixed(1)}" fill="none" stroke="var(--ana-koyu)" stroke-width="1"/>`;
  });

  const METIN={
    gelecek:  ()=>'gelecek gün',
    eksik:    ()=>'gün sonu GİRİLMEMİŞ — dokun ve gir',
    kasa_acigi:g=>'KASA AÇIĞI '+tl(g.zDisi)+' · Z '+tl(g.resmi)+' · gerçek '+tl(g.gercek),
    kasa_sayilmadi:g=>'Kart '+tl(g.kart)+' · kasa sayılmadı, nakit bilinmiyor',
    tam:      g=>'Kart '+tl(g.kart)+' · Nakit '+tl(g.nakitToplam)
                 +' (KDV\'ye dahil '+tl(g.nakit)+') · toplam '+tl(g.gercek)
  };
  let hedef='';
  seri.forEach(g=>{
    const hx=sol+(g.gun-1)*gen;
    const tik = g.durum!=='gelecek' ? ` class="gc-tik" data-t="${g.tarih}"` : '';
    hedef+=`<rect${tik} x="${hx.toFixed(1)}" y="${ust}" width="${gen.toFixed(1)}" height="${ih}"
      fill="transparent"><title>${g.gun} ${GUNAD[g.hafta]} — ${(METIN[g.durum]||METIN.tam)(g)}</title></rect>`;
  });

  let etiket='';
  for(let d=1; d<=gunSayisi; d+=7)
    etiket+=`<text x="${(sol+(d-0.5)*gen).toFixed(1)}" y="${Y-16}" text-anchor="middle"
      font-size="9.5" font-weight="700" fill="#8189A0">${d}</text>`;

  const oy=yOf(ortalama);
  const lej=[[KART,'Kart'],[NAKIT,"KDV'ye dahil nakit"],[ZDISI,'Nakit'],[ACIK,'açık / eksik']];
  let lejant='', lx=0;
  lej.forEach(([c,ad])=>{
    lejant+=`<rect x="${lx}" y="-7" width="7" height="7" fill="${c}"/>
      <text x="${lx+10}" y="-1" font-size="8.5" font-weight="700" fill="#8189A0">${ad}</text>`;
    lx += 15 + ad.length*4.3;
  });
  return `<div class="grafik-sar"><svg viewBox="0 0 ${G} ${Y}" role="img"
      aria-label="Günlük gerçek ciro: resmî ve Z dışı yığılmış">
    ${kilavuz}${sut}${hedef}
    <line x1="${sol}" y1="${oy.toFixed(1)}" x2="${sol+iw}" y2="${oy.toFixed(1)}"
      stroke="var(--metin)" stroke-width="1.1" stroke-dasharray="5 3" opacity=".6"/>
    <text x="${sol+iw}" y="${(oy-4).toFixed(1)}" text-anchor="end" font-size="9.5"
      font-weight="800" fill="var(--metin)" opacity=".75">kayıtlı gün ort. ${kisa(ortalama)}</text>
    ${etiket}
    <g transform="translate(${sol},${Y-1})">${lejant}</g>
  </svg></div>`;
}

    sb.from('tedarikci_odeme').select('tutar,tedarikci(ad)').eq('tarih',tarih).eq('yontem','nakit').eq('is_deleted',false)
  ]);
  const g=gs.data;
  const bas=(sag)=>`<div class="ud-ust"><div style="flex:1;min-width:0">
      <div class="ud-kod">GÜN SONU</div><div class="ud-ad">${esc(trh)}</div>${sag||''}</div>

  }
  const cikisT=(kg.data||[]).reduce((a,x)=>a+ +x.tutar,0)+(no.data||[]).reduce((a,x)=>a+ +x.tutar,0);
  const kasa=g.kasa_nakit===null?null:+g.kasa_nakit;
  const zDisi=kasa===null?null:(kasa-(+g.nakit_toplam||0)+cikisT);
  const gercek=(+g.toplam)+(zDisi||0);
  const ks=(g.gun_sonu_kasa||[]).filter(x=>!x.is_deleted).sort((a,b)=>a.kasa_no-b.kasa_no||(a.sira||1)-(b.sira||1));
  const kd=(g.gun_sonu_kdv||[]).filter(x=>!x.is_deleted);
  ic.innerHTML=bas()+`<div class="ud-govde">
    <div class="ud-kunye" style="grid-template-columns:1fr 1fr">
      <div><div class="ud-et">GERÇEK</div><div class="ud-dg">${tl(gercek)}</div></div>
      <div><div class="ud-et">RESMÎ / Z</div><div class="ud-dg">${tl(g.toplam)}</div></div>
    </div>
    ${zDisi===null
      ? '<div class="uyari-orta">Kasa sayılmamış — bu günün Z dışı nakdi bilinmiyor.</div>'
      : zDisi<0
        ? `<div class="uyari-agir">KASA AÇIĞI ${tl(zDisi)} — kasada Z raporunun dediğinden az para sayılmış.</div>`
        : ''}
    <div class="ud-bas"><span class="ud-blk">DÖKÜM</span></div>
    ${ozSatir('Kart', tl(g.kart_toplam))}
    ${ozSatir('Z nakit', tl(g.nakit_toplam))}
    ${kasa!==null?ozSatir('Kasada sayılan', tl(kasa)):''}
    ${cikisT>0?ozSatir('Kasadan ödenen', tl(cikisT)):''}
    ${zDisi!==null?ozSatir(zDisi<0?'Kasa açığı':"Bunun KDV'ye girmeyen kısmı", tl(zDisi)):''}
    ${ozSatir('GERÇEK TOPLAM', tl(gercek), true)}
    ${ks.length?`<div class="ud-bas" style="margin-top:16px"><span class="ud-blk">YAZARKASALAR</span></div>`
      +ks.map(k=>{
        const e=`K${k.kasa_no}${zCok(ks,k.kasa_no)?'/'+(k.sira||1):''}`;
        return `<div class="ud-satir"><div class="ud-trh">${e}</div>
        <div><div style="font-weight:800;font-size:13px">Z: ${esc(k.z_no||'—')}</div>
          <div class="ud-alt">Kart ${tl(k.kart_toplam)} · Nakit ${tl(k.nakit_toplam)}</div>

        <div class="ud-tut">${tl(k.toplam)}</div></div>`;}).join('')
      : `<div style="margin-top:14px">${belgeBtn(g.z_foto_path,'Z Raporu',`${trh} — Z Raporu`)}${slipBtn(g.pos_slip_foto_path,'POS Slip',`${trh} — POS Slip`)}</div>`}
    ${kd.length?`<div class="ud-bas" style="margin-top:16px"><span class="ud-blk">KDV</span>
        <span class="ud-trend">${tl(kd.reduce((a,x)=>a+ +x.kdv_tutar,0))}</span></div>`
      +kd.map(x=>ozSatir('%'+x.oran+' (K'+x.kasa_no+')', tl(x.kdv_tutar))).join('')

  </div>`;
}
/* Özet ay ay gezilebilir. Eskiden bugünün ayına SABİTTİ: ayın 1'inde açtığında

  const t = new Date((OZ_AY||bugun().slice(0,7))+'-01T00:00');

  OZ_AY = yeni; vOzet();
}

/* ===== SÜRÜM KONTROLÜ — telefon eski sürümde kalmasın =====
   GitHub Pages 10 dk önbellek veriyor; ana ekrana eklenmiş uygulamada
   çok daha uzun kalabiliyor. Personel eski kurallarla çalışmasın diye
   uygulama sunucudaki sürümü sorup fark varsa uyarır. */
const SURUM = (document.querySelector('meta[name="surum"]')?.content || '?');
async function surumKontrol(){
  try{
    // Yalnız dosyanın başını çek (sürüm etiketi ilk 3000 baytta)
    const y = await fetch(location.pathname + '?s=' + Date.now(), {
      cache: 'no-store', headers: { 'Range': 'bytes=0-3000' }
    });
    if (!y.ok && y.status !== 206) return;
    const t = await y.text();
    const m = t.match(/name="surum"\s+content="([^"]+)"/);
    if (m && m[1] !== SURUM) surumUyari(m[1]);
  }catch(e){ /* ağ yoksa sessiz kal — çalışmayı engelleme */ }
}
function surumUyari(yeni){
  if (document.getElementById('surumBar')) return;
  const d = document.createElement('div');
  d.id = 'surumBar';
  d.innerHTML = `<span>Yeni sürüm var (${esc(yeni)}). Eski sürümde yanlış kayıt yapabilirsin.</span>
    <button onclick="surumYenile()">YENİLE</button>`;
  document.body.appendChild(d);
}
function surumYenile(){
  // Sorgu ekleyerek önbelleği atla — ana ekrana eklenmiş uygulamada da çalışır
  location.replace(location.pathname + '?v=' + Date.now());
}

/* ================== GÜN SONU ==================
   Bir kasa aynı gün BİRDEN FAZLA Z basabilir (cihaz arızası).
   Her Z = kendi bloğu: kendi Z No'su, tutarı, KDV'si, fotoğrafı.
   Blok anahtarı: "kasa_sıra" → 1_1, 1_2, 2_1 ...                          */
let ZLISTE = { 1:[1], 2:[1] };                     // her kasada hangi Z sıraları açık
function zAnahtarlar(){ return [1,2].flatMap(n => ZLISTE[n].map(s => ({ n, s, k:n+'_'+s }))); }

let KDV_SAYAC = 0;
function kdvSatirEkle(k, oran, satis, kdv, sabit){
  KDV_SAYAC++;
  const n = KDV_SAYAC;
  const kap = document.getElementById('kdvSatirlari_'+k);
  if(!kap) return;
  const div = document.createElement('div');
  div.className='kdv-satir'; div.id='kdvS_'+n;
  const oranKutu = sabit
    ? `<span style="width:82px;flex:none;text-align:center;font-weight:800;color:var(--ana);padding:11px 0">%${oran||10}</span><input type="hidden" id="kdvO_${n}" value="${oran||10}">`
    : `<select id="kdvO_${n}"><option value="1"${oran==1?' selected':''}>%1</option><option value="10"${(oran==10||!oran)?' selected':''}>%10</option><option value="20"${oran==20?' selected':''}>%20</option></select>`;
  div.innerHTML = `
    ${oranKutu}
    <input type="text" inputmode="decimal" autocomplete="off" id="kdvT_${n}" placeholder="Z'deki %${oran||10} TOPLAM" value="${satis||''}">
    <input type="text" inputmode="decimal" autocomplete="off" id="kdvV_${n}" placeholder="KDV (sistem hesaplar)" value="${kdv||''}">
    ${sabit?'':`<button class="sil" onclick="document.getElementById('kdvS_${n}').remove(); kasaHesapla();">✕</button>`}`;
  kap.appendChild(div);
  // Oran toplam satış yazılınca KDV'yi sistem hesaplar (Z'deki TOPKDV farklıysa üzerine yazılabilir)
  // KDV kutusu bir kez ELLE düzeltildiyse sistem bir daha üzerine YAZMAZ.
  // (Z'deki TOPKDV birkaç kuruş farklı olabilir — beyana giden Z'dekidir.)
  const hesapla = () => {
    const vEl = document.getElementById('kdvV_'+n);
    if (vEl.dataset.elle === '1') return;              // kullanıcı yazdıysa dokunma
    const t = paraOku(document.getElementById('kdvT_'+n)).deger;
    const o = +document.getElementById('kdvO_'+n).value || 0;
    vEl.value = t > 0 ? (t - t/(1+o/100)).toFixed(2) : '';
  };
  const vEl0 = document.getElementById('kdvV_'+n);
  vEl0.addEventListener('input', ()=>{ vEl0.dataset.elle = vEl0.value.trim()==='' ? '' : '1'; });
  if (kdv) vEl0.dataset.elle = '1';                    // hazır değerle geldiyse elle sayılır
  paraBagla(document.getElementById('kdvT_'+n), ()=>{ hesapla(); kasaHesapla(); });
  paraBagla(vEl0, kasaHesapla);
  const oranEl = document.getElementById('kdvO_'+n);
  if (oranEl.tagName === 'SELECT') oranEl.addEventListener('change', hesapla);
}
function kdvOku(k){
  const sonuc = [];
  document.querySelectorAll('#kdvSatirlari_'+k+' .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const o = document.getElementById('kdvO_'+n).value;
    const tEl = document.getElementById('kdvT_'+n), vEl = document.getElementById('kdvV_'+n);
    const pt = paraOku(tEl), pv = paraOku(vEl);
    if (!pt.ok || !pv.ok) throw new Error('KDV satırında geçersiz tutar var — örnek: 15710 veya 15710,50');
    if (tEl.value.trim()!=='' || vEl.value.trim()!=='')
      sonuc.push({ oran:+o, satis_toplam:pt.deger, kdv_tutar:pv.deger });
  });
  return sonuc;
}
/* ===== BELGE GÖRÜNTÜLEYİCİ — yüklenen fotoğrafı tek tıkla aç ===== */
function belgeKapat(){
  const ov=document.getElementById('belgeOverlay');
  if(ov){ ov.style.display='none'; const r=document.getElementById('boResim'); if(r) r.src=''; }
}
function belgeKutusu(){
  let ov=document.getElementById('belgeOverlay');
  if(!ov){
    ov=document.createElement('div'); ov.id='belgeOverlay';
    ov.innerHTML=`<div class="bo-ust"><span id="boBaslik"></span><button class="bo-kapat" onclick="belgeKapat()">✕</button></div>
                  <div class="bo-govde"><div class="bo-yukleniyor" id="boDurum">Belge açılıyor...</div><img id="boResim" alt="" style="display:none"></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', e=>{ if(e.target===ov || e.target.classList.contains('bo-govde')) belgeKapat(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') belgeKapat(); });
  }
  return ov;
}
async function belgeAc(yol, baslik){
  if(!yol){ alert('Bu belge yüklenmemiş.'); return; }
  // PDF resim olarak açılmaz — imzalı bağlantıyı yeni sekmede aç
  if (/\.pdf$/i.test(yol)){
    try{
      const { data, error } = await sb.storage.from('belgeler').createSignedUrl(yol, 300);
      if (error || !data?.signedUrl) throw new Error(error?.message || 'bağlantı alınamadı');
      window.open(data.signedUrl, '_blank', 'noopener');
    }catch(e){ alert('Belge açılamadı: ' + e.message); }
    return;
  }
  const ov=belgeKutusu();
  document.getElementById('boBaslik').textContent = baslik||'Belge';
  const img=document.getElementById('boResim'), durum=document.getElementById('boDurum');
  img.style.display='none'; img.src=''; durum.style.display='block'; durum.textContent='Belge açılıyor...';
  ov.style.display='flex';
  try{
    const { data, error } = await sb.storage.from('belgeler').createSignedUrl(yol, 300);
    if (error || !data || !data.signedUrl) throw new Error(error?.message || 'imzalı bağlantı alınamadı');
    img.onload = ()=>{ durum.style.display='none'; img.style.display='block'; };
    img.onerror = ()=>{ durum.textContent='Görsel açılamadı.'; };
    img.src = data.signedUrl;
  }catch(e){
    durum.textContent = 'Belge açılamadı: ' + e.message;
  }
}
/* Listelerde uzun notu kırp. Köşeli parantezli teknik izler ([belge
   degistirildi ...], [SILINDI ...]) kayıtta kalsın ama ekranda görünmesin —
   kullanıcıya bakan satır 250 karakterlik dosya yolu taşımamalı. */
function notKisalt(t, sinir){
  if (!t) return '';
  const temiz = String(t).replace(/\s*\[[^\]]*\]/g, '').replace(/\s+/g,' ').trim();
  const en = sinir || 80;
  return temiz.length <= en
    ? esc(temiz)
    : `<span title="${esc(temiz)}">${esc(temiz.slice(0, en))}…</span>`;
}
function belgeBtn(yol, etiket, baslik){
  if(!yol) return `<span class="bo-btn yok">${etiket} yok</span>`;
  return `<button type="button" class="bo-btn" onclick="belgeAc('${yol}','${(baslik||'').replace(/'/g,'')}')">${etiket}</button>`;
}
// POS slip artık toplanmıyor: yoksa hiç gösterme (eski kayıtlarda varsa açılabilir kalsın)
function slipBtn(yol, etiket, baslik){ return yol ? belgeBtn(yol, etiket, baslik) : ''; }
// Bir kasadan o gün birden fazla Z var mı (etikette sıra gösterilsin mi)
function zCok(satirlar, kasaNo){ return satirlar.filter(x=>x.kasa_no===kasaNo).length > 1; }
/* ===== PARA GİRİŞ KATMANI — virgül/nokta güvenli, sessiz sıfır YOK ===== */
/* SON AYRAÇ ONDALIK AYRACIDIR — faturayı okurken uyguladığımız kuralın aynısı;
   iki yerde farklı davranırsa mutabakat tutmaz.
     "1.250,50" → 1250.50   (nokta binlik)      "1250,50" → 1250.50
     "1250.50"  → 1250.50   (İngilizce yazım)   "1.250"   → 1250   (nokta + 3 hane = binlik)
     "3,456"    → 3.45      (virgül hep ondalık; fazla hane kırpılır)
   Eskiden bu alanlar type="number" idi: virgül yazılınca tarayıcı value'yu BOŞ
   döndürüyor, "+value||0" sessizce 0 yazıyordu. Fatura kaleminde miktar 0 olunca
   satır büsbütün düşüyordu — kimse fark etmiyordu.
   Tutar alanlarında eksi yoktur; sayım düzeltmesi gibi işaretli alanlar eksiVar=true geçer. */
function paraCoz(ham, bas, eksiVar){
  const n = bas || 2;
  const t = String(ham == null ? '' : ham);
  const eksi = !!eksiVar && /^\s*-/.test(t);
  const s = t.replace(/[^\d.,]/g,'');
  // Boş = 0 (kural bu). Ama içi dolu olup tek rakam yoksa bu hatadır, sessizce 0 olmamalı.
  if (!/\d/.test(s)) return t.trim() === ''
    ? { ok:true, deger:0, metin:'' }
    : { ok:false, deger:0, metin:'', hata:'geçersiz tutar' };
  const son = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
  let tam, ond;
  if (son < 0){ tam = s; ond = ''; }
  else {
    const kuyruk = s.slice(son+1).replace(/[.,]/g,'');
    if (s[son] === '.' && kuyruk.length > n){ tam = s.replace(/[.,]/g,''); ond = ''; }  // nokta = binlik
    else { tam = s.slice(0, son).replace(/[.,]/g,''); ond = kuyruk.slice(0, n); }
  }
  tam = tam.replace(/^0+(?=\d)/,'') || '0';
  const d = parseFloat(tam + (ond ? '.' + ond : ''));
  if (!isFinite(d)) return { ok:false, deger:0, metin:'', hata:'geçersiz tutar' };
  return { ok:true, deger:+((eksi ? -d : d).toFixed(n)),
           metin: (eksi ? '-' : '') + tam + (ond ? ',' + ond : '') };
}
function paraTemizle(el, eksiVar){
  // Yazarken sadece geçersiz karakteri at — ayraçlara dokunma, yoksa alan zıplar
  if(!el) return;
  const t = el.value;
  const eksi = !!eksiVar && /^-/.test(t);
  const s = (eksi ? '-' : '') + t.replace(/[^\d.,]/g,'');
  if (s !== t) el.value = s;
}
function paraBicimle(el, bas, eksiVar){
  // Alandan çıkınca tek biçime getir: kullanıcı ne kaydettiğini görsün
  if(!el || !el.value.trim()) return;
  const r = paraCoz(el.value, bas, eksiVar);
  if (r.ok && el.value !== r.metin) el.value = r.metin;
}
function paraOku(el, bas, eksiVar){
  if(!el) return { ok:true, deger:0 };
  return paraCoz(el.value, bas, eksiVar);
}
function paraBagla(el, sonra, bas, eksiVar){
  if(!el) return;
  el.addEventListener('input', () => { paraTemizle(el, eksiVar); if(sonra) sonra(); });
  el.addEventListener('blur',  () => { paraBicimle(el, bas, eksiVar); if(sonra) sonra(); });
}
/* type="number" alanına "1,5" yazılınca tarayıcı value'yu BOŞ döndürüyor; "+value||0"
   sessizce 0 yazıyordu — tutar sıfırlanıyor, kimse fark etmiyordu. Bu alanlar artık
   type="text" + paraBagla (yazarken temizler) + paraDeger (okurken virgülü çevirir). */
function paraDeger(id, bas, eksiVar){ return paraOku(document.getElementById(id), bas, eksiVar).deger; }
function paraBaglaHepsi(idler, bas, eksiVar){ idler.forEach(i => paraBagla(document.getElementById(i), null, bas, eksiVar)); }
/* ===== Z RAPORU OKUMA — sistem doldurur, PERSONEL DOĞRULAR ===== */
async function zRaporuOku(k){
  const inp = document.getElementById('gsZFoto_'+k);
  const drm = document.getElementById('gsOkuDurum_'+k);
  const btn = document.getElementById('gsOku_'+k);
  const yaz = (t, sinif) => { if(drm){ drm.className = 'oku-durum '+(sinif||''); drm.textContent = t; } };

  const dosyaVar = !!(inp && inp.files && inp.files[0]);
  const mevcutYol = (DUZENLE && DUZENLE.foto[k] && DUZENLE.foto[k].z) || null;
  if (!dosyaVar && !mevcutYol){ yaz('Önce Z raporu fotoğrafını seç.', 'uyari'); return; }

  btn.disabled = true; const eski = btn.textContent; btn.textContent = 'Okunuyor...';
  yaz('Fotoğraf okunuyor, birkaç saniye sürebilir...', '');
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('Oturum bulunamadı, tekrar giriş yapın.');

    let govde;
    if (dosyaVar){
      const k = await fotoKucult(inp.files[0], 2000, 0.92);   // okuma için net kopya
      const b64 = await new Promise((coz, red)=>{
        const fr = new FileReader();
        fr.onload = ()=>coz(fr.result); fr.onerror = ()=>red(new Error('Fotoğraf okunamadı'));
        fr.readAsDataURL(k.veri);
      });
      govde = { gorsel: b64 };
    } else {
      govde = { yol: mevcutYol };
    }

    const y = await fetch(SB_URL + '/functions/v1/z-raporu-oku', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+session.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify(govde)
    });
    const s = await y.json();
    if (!y.ok || !s.ok) throw new Error(s?.hata || ('Okuma başarısız ('+y.status+')'));

    const v = s.veri || {};
    const dolduruldu = [];
    const koy = (id, deger, etiket) => {
      if (deger === null || deger === undefined || deger === '') return;
      const e = document.getElementById(id); if(!e) return;
      e.value = String(deger).replace('.', ',');
      e.dispatchEvent(new Event('input', { bubbles:true }));
      e.classList.add('oku-dolu'); dolduruldu.push(etiket);
    };
    koy('gsZNo_'+k,   v.z_no,          'Z No');
    koy('gsKart_'+k,  v.kart_toplam,   'Kart');
    koy('gsNakit_'+k, v.nakit_toplam,  'Nakit');

    // KDV satırları: fişteki TOPKDV esas (sistem hesabı ezilmez)
    const kap = document.getElementById('kdvSatirlari_'+k);
    if (kap && Array.isArray(v.kdv) && v.kdv.length){
      kap.innerHTML = '';
      v.kdv.forEach(x => kdvSatirEkle(k, x.oran, x.satis_toplam, x.kdv_tutar, false));
      dolduruldu.push('KDV');
    }
    kasaHesapla();

    const eksik = Array.isArray(v.okunamayan) ? v.okunamayan.filter(Boolean) : [];
    let msj = 'Okundu → ' + (dolduruldu.join(' · ') || 'alan doldurulamadı') + '. ⚠️ Rakamları fişle KARŞILAŞTIR.';
    if (eksik.length) msj += ' Okunamayan: ' + eksik.join(', ');
    if (v.uyari) msj += ' (' + v.uyari + ')';
    yaz(msj, dolduruldu.length ? 'ok' : 'uyari');
  }catch(e){
    yaz('Okunamadı: ' + e.message + ' — alanları elle yaz.', 'uyari');
  }finally{
    btn.disabled = false; btn.textContent = eski;
  }
}

      const ia = document.getElementById('gsIAdet_'+key);  if(ia) ia.value = k.fis_iptal_adet ?? '';

      const kn = document.getElementById('gsKNot_'+key); if(kn) kn.value = k.notlar || '';

    if (kap){
      kap.innerHTML = '';
      const sat = kd.filter(x=>x.kasa_no===n && (x.sira||1)===s);
      if (sat.length) sat.forEach(x=>kdvSatirEkle(key, x.oran, x.satis_toplam, x.kdv_tutar, false));
      else kdvSatirEkle(key, 10, null, null, true);

  }));
  const bar = document.getElementById('gsDuzenleBar');
  if (bar) bar.innerHTML = `<div class="kart" style="border-color:var(--uyari);background:#FFF8EC">
    <div class="kbaslik" style="color:var(--uyari)">DÜZENLEME MODU — ${new Date(data.tarih+'T00:00').toLocaleDateString('tr-TR')}</div>
    <div class="bilgi-not" style="margin:0 0 8px">Kayıt <b>silinmiyor</b>, üzerine yazılıyor. Fotoğrafları değiştirmek istemiyorsan
      dokunma — mevcutlar korunur. Tarih değiştirilemez.</div>
    <button class="btn2" style="width:100%" onclick="duzenlemeIptal()">Vazgeç</button></div>`;
  const btn = document.getElementById('gsKaydet');
  if (btn) btn.textContent = 'Değişiklikleri Kaydet';
  kasaHesapla();
  window.scrollTo(0,0);
}

/* Aynı kasaya ikinci/üçüncü Z — cihaz arızasında gün kaydedilebilsin diye */
function zBlokEkle(n){
  if (ZLISTE[n].length >= 9){ alert('Bir kasaya en fazla 9 Z raporu girilebilir.'); return; }
  const s = Math.max(...ZLISTE[n]) + 1;
  const eski = {};
  ZLISTE[n].forEach(x=>{ eski[x] = zBlokTopla(n, x); });   // yeniden çizmeden ÖNCE yedekle
  const secilenFoto = {};
  ZLISTE[n].forEach(x=>{ const f=document.getElementById('gsZFoto_'+n+'_'+x); secilenFoto[x] = !!(f&&f.files&&f.files[0]); });
  ZLISTE[n].push(s);
  const kap = document.getElementById('gsZBloklar'+n);
  // ilk blok tek başınayken başlıksız duruyordu; artık çoklu → başlıklarla yeniden kur
  kap.innerHTML = ZLISTE[n].map(x=>zBlokHtml(n,x)).join('');
  ZLISTE[n].forEach(x=>{ zBlokKur(n, x); if (x !== s) zBlokDoldur(n, x, eski[x]); });
  // Dosya seçimi HTML yeniden çizilince kaybolur — kullanıcıya açıkça söyle
  const kaybolan = ZLISTE[n].filter(x=>x!==s && secilenFoto[x]);
  if (kaybolan.length) alert(`Kasa ${n}: Z fotoğrafı seçimi sıfırlandı (${kaybolan.map(x=>x+'. Z').join(', ')}).\nTutarlar korundu; fotoğrafı yeniden seç.`);
  kasaHesapla();
  document.getElementById('zBlok_'+n+'_'+s).scrollIntoView({behavior:'smooth', block:'center'});
}
function zBlokSil(n, s){
  if (s === 1) return;
  if (!confirm(`Kasa ${n} — ${s}. Z raporu kaldırılacak. Girdiğin bilgiler silinir. Devam?`)) return;
  const kalan = {};
  ZLISTE[n].filter(x=>x!==s).forEach(x=>{ kalan[x] = zBlokTopla(n, x); });  // silmeden ÖNCE yedekle
  ZLISTE[n] = ZLISTE[n].filter(x=>x!==s);
  const kap = document.getElementById('gsZBloklar'+n);
  kap.innerHTML = ZLISTE[n].map(x=>zBlokHtml(n,x)).join('');
  ZLISTE[n].forEach(x=>{ zBlokKur(n, x); zBlokDoldur(n, x, kalan[x]); });
  kasaHesapla();
}
/* Blok yeniden çizildiğinde girilen değerleri koru */
function zBlokTopla(n, s){

           kadet:al('gsKAdet_'+k), iadet:al('gsIAdet_'+k), itutar:al('gsITutar_'+k),

function zDurum(n, s){
  const k = n+'_'+s;
  const zno=(document.getElementById('gsZNo_'+k)?.value||'').trim();
  const pk=paraOku(document.getElementById('gsKart_'+k));
  const pn=paraOku(document.getElementById('gsNakit_'+k));
  const kart=pk.deger, nakit=pn.deger;
  // Kart işlem adedi ve fiş iptali — hepsi isteğe bağlı, boşsa null gider.
  // Adet alanları tam sayı: "105 adet" gibi yazılsa bile rakamları alıyoruz.
  const tamSayi = id => {
    const t = (document.getElementById(id)?.value || '').replace(/\D/g,'');
    return t === '' ? null : parseInt(t, 10);
  };
  const kadet = tamSayi('gsKAdet_'+k);
  const iadet = tamSayi('gsIAdet_'+k);
  const itEl  = document.getElementById('gsITutar_'+k);
  const pit   = itEl ? paraOku(itEl) : { ok:true, deger:0 };
  const itutar = (pit.ok && pit.deger > 0) ? pit.deger : null;
  const zf=document.getElementById('gsZFoto_'+k);
  // Düzenleme modunda mevcut fotoğraf zorunluluğu karşılar (yenisi seçilmezse korunur)
  const mev = (DUZENLE && DUZENLE.foto && DUZENLE.foto[k]) || {};
  const zfVar=!!(zf&&zf.files&&zf.files[0]) || !!mev.z;
  const on = ZLISTE[n].length>1 ? s+'. Z — ' : '';
  const eksik=[];
  if(!zno) eksik.push(on+'Z No');
  if(!pk.ok) eksik.push(on+'Kart tutarı geçersiz');
  if(!pn.ok) eksik.push(on+'Nakit tutarı geçersiz');
  if(!pit.ok) eksik.push(on+'Fiş iptal tutarı geçersiz');
  if(!zfVar) eksik.push(on+'Z fotoğrafı');
  const bos=!zno && !kart && !nakit && !zfVar && pk.ok && pn.ok;
  return { k, n, s, zno, kart, nakit, kadet, iadet, itutar,
           ara:+(kart+nakit).toFixed(2), kdv:kdvToplam(k),
           eksik, bos, gecerli: pk.ok && pn.ok && pit.ok };
}
function kasaDurum(n){
  const bloklar = ZLISTE[n].map(s=>zDurum(n,s));
  return {
    bloklar,
    kart : +bloklar.reduce((a,b)=>a+b.kart ,0).toFixed(2),
    nakit: +bloklar.reduce((a,b)=>a+b.nakit,0).toFixed(2),
    ara  : +bloklar.reduce((a,b)=>a+b.ara  ,0).toFixed(2),

function kdvToplam(k){

    const n=d.id.split('_')[1];
    t += paraOku(document.getElementById('kdvV_'+n)).deger;

}
function kasaHesapla(){
  let tk=0, tn=0, tkdv=0; const eksikler=[];
  [1,2].forEach(n=>{
    const d=kasaDurum(n); tk+=d.kart; tn+=d.nakit; tkdv+=d.kdv;
    d.bloklar.forEach(b=>{
      const za=document.getElementById('gsZAra_'+b.k); if(za) za.textContent=tl(b.ara);
    });
    const kdvEl=document.getElementById('gsKdv'+n); if(kdvEl) kdvEl.textContent=tl(d.kdv);
    const ara=document.getElementById('gsAra'+n); if(ara) ara.textContent=tl(d.ara);
    const kt=document.getElementById('ksTut'+n); if(kt) kt.textContent=tl(d.ara);
    const drm=document.getElementById('kpDrm'+n), ks=document.getElementById('ksDrm'+n);
    const zEk = ZLISTE[n].length>1 ? ` · ${ZLISTE[n].length} Z` : '';
    let sinif, metin, sembol;
    if(d.bos){ sinif='bos'; metin='○ Başlanmadı'; sembol='○'; }
    else if(d.eksik.length===0){ sinif='tam'; metin='✓ Tamamlandı'+zEk; sembol='✓'; }
    else { sinif='eksik'; metin='● '+d.eksik.length+' eksik: '+d.eksik.join(', '); sembol='●'; }
    if(drm){ drm.className='kp-drm '+sinif; drm.textContent=metin; }
    if(ks) ks.textContent=sembol;
    d.eksik.forEach(e=>eksikler.push('KASA '+n+' — '+e));
  });
  // Aynı kasada aynı Z No iki kez girilmiş mi (arıza gününde kopyala-yapıştır hatası)
  [1,2].forEach(n=>{
    const nolar = ZLISTE[n].map(s=>(document.getElementById('gsZNo_'+n+'_'+s)?.value||'').trim()).filter(Boolean);
    if (new Set(nolar).size !== nolar.length) eksikler.push('KASA '+n+' — aynı Z No iki kez girilmiş');
  });
  const pz=paraOku(document.getElementById('gsKasa'));
  const zDisi=pz.deger;
  if(!pz.ok) eksikler.push('Z DIŞI KASA — tutar geçersiz');
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('gsTKart', tl(tk)); set('gsTNakit', tl(tn)); set('gsTGenel', tl(+(tk+tn).toFixed(2)));
  set('gsZDisi', tl(zDisi)); set('gsTKdv', tl(tkdv));
  const btn=document.getElementById('gsKaydet'), ek=document.getElementById('gsEksik');
  const hazir = eksikler.length===0 && (tk+tn)>0;
  if(btn){ btn.disabled=!hazir; btn.style.opacity=hazir?'1':'.5'; }
  if(ek){
    ek.style.color = hazir ? 'var(--ok)' : 'var(--uyari)';
    ek.innerHTML = hazir ? '✓ Gün sonu kaydedilebilir'
      : (eksikler.length ? 'Bekleyen: '+eksikler.map(esc).join(' · ') : 'Bekleyen: tutar girilmedi');
  }
}

async function fotoTemizle(yollar){
  const kalan = [];
  for (const y of yollar){
    if (!y) continue;
    try{ const { error } = await sb.storage.from('belgeler').remove([y]); if (error) kalan.push(y); }
    catch(e){ kalan.push(y); }
  }
  return kalan;
}
async function gunSonuKaydet(){

      let kdvSatir;
      try { kdvSatir = kdvOku(b.k); }
      catch(e){ kasaSec(n); mesaj('gsMsg','hata',`KASA ${n} / ${b.s}. Z: `+e.message); return; }
      kasalar.push({ n, s:b.s, k:b.k, zno:b.zno, kart:b.kart, nakit:b.nakit, kdv:kdvSatir,
        kadet:b.kadet, iadet:b.iadet, itutar:b.itutar,
        knot:(document.getElementById('gsKNot_'+b.k)?.value||'').trim()||null });
    }
  }
  const kart = +(kasalar.reduce((a,k)=>a+k.kart,0)).toFixed(2);
  const nakit = +(kasalar.reduce((a,k)=>a+k.nakit,0)).toFixed(2);
  const toplam = +(kart + nakit).toFixed(2);
  // KDV artık KASA BAZLI: her kasanın kendi Z vergi dökümü
  const kdv = kasalar.flatMap(k=>k.kdv);
  const kdvToplamTutar = +(kdv.reduce((a,x)=>a+x.kdv_tutar,0)).toFixed(2);
  if (toplam === 0){ mesaj('gsMsg','hata','İki kasanın toplamı 0 — kayıt yapılamaz.'); return; }
  for (const k of kasalar){
    const et = `KASA ${k.n}${ZLISTE[k.n].length>1?' / '+k.s+'. Z':''}`;
    if (k.kdv.length === 0 && (k.kart + k.nakit) > 0 &&
        !confirm(`${et} için KDV dökümü BOŞ. O Z raporundaki VERGİ DÖKÜMÜ girilmedi — beyana giden KDV eksik kalır. Yine de kaydedilsin mi?`)) return;
  }
  // AKIL KONTROLLERİ (KÜM. TOPLAM tuzağı + KDV tutarlılığı)
  const kdvSatisToplami = kdv.reduce((a,x)=>a+x.satis_toplam,0);
  if (kdvSatisToplami > toplam*1.5 + 100){
    alert(`HATALI GİRİŞ OLABİLİR: KDV dökümündeki satış toplamı (${tl(kdvSatisToplami)}) günün cirosundan (${tl(toplam)}) çok büyük.\n\nZ kağıdındaki "KÜM. TOPLAM" satırını yazmış olabilirsiniz — o satır kasanın TÜM GEÇMİŞ toplamıdır, kullanılmaz.\n\n"%10 TOPLAM" gibi GÜNLÜK satırı girin.`);
    return;
  }
  for (const x of kdv){
    const beklenen = x.satis_toplam - x.satis_toplam/(1 + x.oran/100);
    if (x.satis_toplam > 0 && Math.abs(x.kdv_tutar - beklenen) > Math.max(5, beklenen*0.15) &&
        !confirm(`KDV kontrolü: %${x.oran} için ${tl(x.satis_toplam)} satışın KDV'si yaklaşık ${tl(beklenen)} olmalı, siz ${tl(x.kdv_tutar)} girdiniz.\nZ kağıdındaki TOPKDV satırıyla karşılaştırın. Yine de kaydedilsin mi?`)) return;
  }

  const kasa = pKasa.deger;
  if (kasa === 0 &&
      !confirm('Kasadaki Para girilmedi (kasa sayımı yapılmadı mı?). Boş kaydedilirse o günün gerçek nakit takibi eksik kalır. Yine de kaydedilsin mi?')) return;
  const ozet = kasalar.map(k=>{
    const kv = k.kdv.reduce((a,x)=>a+x.kdv_tutar,0);
    const et = `Kasa ${k.n}${ZLISTE[k.n].length>1?' ('+k.s+'. Z)':''}`;
