/* SECILEBILIR vergi turleri. Bu sozluk "yeni kayit hangi turden acilabilir"
   sorusunun cevabidir; GECMISI OKUMAK icin degil (onun icin asagidaki
   vergiAd() var). Yeni tur eklerken voTur listesine de eklenmeli — liste
   bu sozlukten BESLENMIYOR, elle yazili (olculdu). */
const VERGI_AD = {kdv:'KDV',bagkur:'Bağkur',sgk:'SGK Primi',muhsgk:'MUHSGK',gecici_vergi:'Geçici Vergi',gelir_vergisi:'Gelir Vergisi',stopaj:'Stopaj',muhasebeci:'Muhasebeci',kira:'Kira',sozlesme_yenileme:'Sözleşme Yenileme',diger:'Diğer'};
/* ⚠ KAPATILMIS TURLER · YALNIZ GORUNTU.
   Buradaki kodlarla YENI KAYIT ACILAMAZ (VERGI_AD'da yoklar, voTur
   listesinde secenekleri yok) ama GECMISTE acilmis kayitlar okunabilir
   kalir. Sozlukten cikarip burayi koymamak, eski satirlarin etiketini
   ham koda ("mtv") dusururdu.
   mtv · 27.08.2026 · Karar: aracin BUTUN giderleri Arac ekranindan
     girilir. Iki yol farkli sonuc veriyordu — Arac'tan girilen ay
     karindan DUSUYOR, Vergiler'den girilen DUSMUYOR; ayni odeme iki kez
     sayilabiliyordu. Vergiler tarafi kapatildi.
   ⚠ Bu satir SILINMEZ. Silinirse tur='mtv' olan eski vergi_odeme
     satirlari listede "mtv" diye gorunur. */
const VERGI_AD_KAPALI = { mtv:'MTV (araçtan)' };
/* Goruntu adi: once secilebilir turler, sonra kapatilmis turler, en son
   ham kod. Etiket ARAYAN her yer bunu cagirir; VERGI_AD'a dogrudan
   bakan bir gosterim satiri KALMADI. */
const vergiAd = (t) => VERGI_AD[t] || VERGI_AD_KAPALI[t] || String(t == null ? '' : t);

/* =====================================================================
   VADE TURU -> KOK TUR (v115'in istemci kopyasi)
   =====================================================================
   ⚠ NEDEN KOPYA: sunucudaki public._vade_tur_kok BILEREK personele ve
     authenticated'a KAPALI (v111 kalibi). Onu acmak ya da yalniz bunun
     icin yeni bir RPC yaratmak, kapatilmis bir kapiyi geri acmak olur.
     Ayni SABIT LISTE burada tekrarlanir; ikisi elle birlikte guncellenir.
   ⚠ SABIT LISTE, DESEN DEGIL. "_" gorunce kesmek sozlesme_yenileme ve
     gecici_vergi gibi mesru turleri BOZAR. Bilinmeyen tur AYNEN doner.
   ⚠ Liste degisirse migrations/.../v115 dosyasindaki CASE de degismeli.
   ===================================================================== */
const VADE_KOK = { sgk_4a:'sgk', gelir_vergisi_1:'gelir_vergisi',
  gelir_vergisi_2:'gelir_vergisi', mtv_1:'mtv', mtv_2:'mtv' };
const vadeTurKok = (t) => VADE_KOK[t] || t;

/* =====================================================================
   VADE ONGORUSU · TURETILIR, SAKLANMAZ
   =====================================================================
   ⚠ NEDEN SAKLANMIYOR: 83 acik vadenin hicbirinde tutar yok — takvim
     vadeyi onceden uretiyor, tutar odeme aninda belli oluyor. Ongoruyu
     vade.tutar'a yazmak, yazildigi gunun rakamini donduruyor ve
     BAYATLIYOR. Turetilen ongoru her acilista o anki son odemeden
     hesaplanir; bayatlamaz. Bu yuzden migration YOK.
   ⚠ ONGORU KESIN RAKAM DEGIL: ekranda "ongoru" kelimesi HER ZAMAN
     gorunur, tutarin yanina cikplak yazilmaz.
   ⚠ GECMIS ODEME YOKSA ONGORU DE YOK. Sifir YAZILMAZ — "bilmiyorum"
     ile "sifir" ayni sey degil ve sifir yazmak butceyi yaniltir.
   Doner: { ongoru, kaynak } ya da null. */
function vadeOngoru(tur, odemeler, oncesi){
  const kok = vadeTurKok(tur);
  const aday = odemeler.filter(o => vadeTurKok(o.tur) === kok
    && (!oncesi || (o.odeme_tarihi || '') < oncesi));
  if (!aday.length) return null;
  const s = aday[0];                       // odemeler odeme_tarihi DESC sirali
  return { ongoru: +s.tutar, kaynak: s };
}
/* Sapma yuzdesi. ⚠ RENK TEK BASINA BILGI TASIMAZ: isaret (+/-) ve
   kelime ("fazla"/"az") her zaman yazilir; renk yalnizca pekistirir. */
function vadeSapma(ongoru, gercek){
  if (!(ongoru > 0) || gercek == null) return null;
  const y = (gercek - ongoru) / ongoru * 100;
  return { yuzde: y, isaret: y >= 0 ? '+' : '−',
    kelime: y >= 0 ? 'fazla' : 'az',
    metin: (y >= 0 ? '+' : '−') + '%' + Math.abs(y).toFixed(1).replace('.', ',')
           + ' ' + (y >= 0 ? 'fazla' : 'az'),
    /* Fazla cikan uyari tonunda: butceyi asan taraf odur. Az cikan notr. */
    sinif: y >= 0 ? 'var(--uyari)' : 'var(--soluk)' };
}

/* =====================================================================
   VD · VERGI TAHSIL ALINDISI OKUYUCUSU (banka dekontu)
   =====================================================================
   ⚠ NEDEN AYRI: "Belgeyi oku" dugmesi FATURA okuyucusunu (fatura-oku)
     cagiriyor; onun donduklerine bakildi — tutar, tarih, tedarikci adi,
     belge no. VERGI TURU diye bir alani YOK, oyle bir sey sorulmuyor.
     Bu yuzden Tur ve Donem elle secilmek zorundaydi (ekrandaki
     "TURU ve DONEMI sen sec" yazisi bunu itiraf ediyordu).
   ⚠ YAPAY ZEKAYA GEREK YOK: vergi kodu, nevi adi ve vergilendirme
     donemi dekontta DUZ METIN olarak yaziyor. Okuma tamamen istemcide,
     yeni sunucu cagrisi YOK.
   ⚠ FIKSTUR/SOZLUK GERCEK CIKTIDAN kuruldu: uygulamanin KENDI
     pdfMetinCikar'i Node'da birebir calistirilip iki gercek dekontun
     urettigi metin olculdu (tmp/vergi-metin.mjs). Olculen satirlar:
       "VERG İ TAHS İ L ALI N DISI"                    <- baslik, harfler ayrik
       "02 26.08.2026 03 07/2026 - 07/2026 04 ..."      <- odeme tarihi + donem
       "05 1048 5035SKDAMGAV 791,00"                    <- kalem
       "06 0015 KDV GERÇEK 2026 1 28.208,66"            <- kalem
       "TOPLAM 2 28.999,66"
     ⚠ Turkce harfler AYRI PARCA geliyor ("VERG" + "İ" + " TAHS"),
       cunku pdfMetinCikar ayni y'deki parcalari BOSLUKLA birlestiriyor.
       Duz arama TUTMAZ; iskelet (ASCII disi + bosluk silinmis) kullanilir.
   ===================================================================== */
const VD_ISKELET = (t) => String(t || '').replace(/[^\x20-\x7E]/g, '')
  .toUpperCase().replace(/[^A-Z0-9]/g, '');
/* Vergi kodu -> sistemdeki tur. KAYNAK: dekontun kendi "Vergi T.K." kolonu.
   ⚠ 0003 (Gelir Stopaj) 'stopaj' DEGIL 'muhsgk': olculdu, odeme takviminde
     "MUHSGK beyan (Temmuz donemi)" vadesi var, "Stopaj" diye vade YOK ve
     rpc_vergi_odeme_kaydet vadeyi `vade.tur = p_tur` ile ariyor — 'stopaj'
     secilirse odeme kaydedilir ama vade ACIK KALIR.
   ⚠ Damga kalemleri 'diger': sistemde damga turu yok, uydurulmuyor.
   ⚠ Bu sozluge TAHMINLE satir eklenmez; yeni kod ancak gercek dekontla
     teyit edilip KAYNAGI buraya yazilarak girer (Bankkart dersi). */
const VD_KOD = {
  '0015': 'kdv',            // KDV GERCEK
  '0003': 'muhsgk',         // G.STOPAJ — muhtasar/MUHSGK beyaniyla odenir
  '0001': 'gelir_vergisi',  // yillik gelir vergisi
  '0032': 'gecici_vergi',   // gecici vergi
  '1046': 'diger',          // TEVK DAMGA V
  '1048': 'diger'           // 5035 SK DAMGA V
};
/* ⚠ VD · FORMA YAZAN TARAF. Kullanicinin karari: doldur ama KAYDETME —
   ekstre okuyucusuyla ayni desen (oku ve onaylat). Cok kalemli dekontta
   ANA kalem forma girer, digerleri altta "bunu doldur" dugmesiyle
   listelenir; her biri AYRI kayit olur, boylece "Ne Kadar Nereye"
   dagilimi damgayi KDV sanmaz.
   ⚠ Turu BILINMEYEN kod forma yazilmaz (tur bos kalir, kullanici secer) —
     uydurma yok. */
/* =====================================================================
   AYNI DEKONT · IKINCI KALEMIN BELGESI
   =====================================================================
   ⚠ OLCULEN KUSUR: bir dekontta iki kalem varsa (ornek: KDV 28.208,66 +
     damga 791,00) ikisi AYRI kayit oluyor — dogru olan bu. Ama ilk
     kaydetmeden sonra vergiOdemeKaydet dosya alanini temizliyor
     (voFoto.value=''), dolayisiyla "Bunu doldur" ile girilen IKINCI
     kalem p_foto=null ile gidiyordu: BELGESIZ kayit. Elle tekrar
     secilirse de dosyaYukle ayni PDF'i storage'a IKINCI KEZ yukluyor —
     tek belge, iki kopya, iki ayri yol.
   ⚠ COZUM: ilk kaydetmede donen storage YOLU akilda tutulur, ayni
     dekonttan doldurulan sonraki kalemler AYNI yolu kullanir. Tek
     dosya, iki kayit ayni belgeyi gosterir.
   ⚠ YANLIS BELGE YAPISTIRMA RISKI: yol tek basina yetmez. Kullanici
     dekont okuduktan sonra elle alakasiz bir odeme girerse ona da bu
     belge yapisirdi — yanlis belge, belgesiz kayittan KOTUDUR. Bu
     yuzden iki kosul birlikte aranir:
       VO_DEKONT_YOL  : ilk kaydin yuklendigi yol (dekont basina sifirlanir)
       VO_AYNI_DEKONT : YALNIZ "Bunu doldur" basildiginda true olur,
                        her kaydetmeden sonra tekrar false'a doner.
     Yani belge ancak AYNI dekontun bir sonraki kalemine tasinir.
   ⚠ Elle secilen dosya HER ZAMAN kazanir: voFoto doluysa o yuklenir,
     hatirlanan yol kullanilmaz.
   ⚠ Sonradan bir kayittaki belge degistirilirse digeri ESKI yolu
     gostermeye devam eder. Bu desen sistemde zaten var — belgeEkle
     degistirme akisi yetim kalan dosya icin nota iz birakiyor.
   ===================================================================== */
let VO_DEKONT_YOL = null, VO_AYNI_DEKONT = false;

function vergiDekontDoldur(dk, yaz){
  /* Yeni dekont okundu — onceki dekontun belgesi buraya TASINMAZ. */
  VO_DEKONT_YOL = null; VO_AYNI_DEKONT = false;
  const g = (id) => document.getElementById(id);
  const kutu = g('voOkuDurum');
  const yazAlan = (id, deger) => { const e = g(id); if (!e || deger == null) return false;
    e.value = deger; e.dispatchEvent(new Event('input',{bubbles:true}));
    e.classList.add('oku-dolu'); return true; };
  /* ANA kalem: turu bilinen ve damga/diger OLMAYAN en buyuk tutar;
     yoksa en buyuk kalem. */
  const asil = [...dk.kalemler].sort((a,b) => b.tutar - a.tutar);
  const ana = asil.find(k => k.tur && k.tur !== 'diger') || asil[0];
  const doldur = (k) => {
    const d = [];
    /* ⚠ iki ondalik SART: String(791) "791" verir, para alanina kurussuz
       rakam yazmak olculdu ve cirkin/yanlis okunmaya acik. */
    if (yazAlan('voTutar', k.tutar.toFixed(2).replace('.', ','))) d.push('Tutar');
    if (dk.donem && yazAlan('voDonem', dk.donem)) d.push('Dönem');
    if (dk.tarih && yazAlan('voTarih', dk.tarih)) d.push('Ödeme tarihi');
    /* ⚠ KAPATILMIS TURU FORMA YAZMA. Bugun VD_KOD'da mtv YOK (olculdu:
       0015 kdv · 0003 muhsgk · 0001 gelir_vergisi · 0032 gecici_vergi ·
       1046/1048 diger) — yani okuyucu MTV onermiyor. Ama sozluge
       ileride mtv gibi KAPATILMIS bir kod girerse, olmayan secenegi
       atamak select'i SESSIZCE BOSALTIRDI ve kayit tursuz giderdi
       (SGK okuyucusunda olculmus tuzagin aynisi). Once varlik sinanir. */
    if (k.tur){ const s = g('voTur');
      if (s && [...s.options].some(o => o.value === k.tur)){
        s.value = k.tur; s.classList.add('oku-dolu'); d.push('Tür'); } }
    const nt = g('voNot');
    if (nt){ nt.value = k.kod + ' ' + k.ad; nt.classList.add('oku-dolu'); d.push('Not'); }
    /* ⚠ Mesaj k.tur'e DEGIL, turun forma GERCEKTEN yazilip yazilmadigina
       bakar. Eskiden k.tur doluysa "kontrol et, Kaydet" diyordu; yukaridaki
       varlik sinamasi eklenince bu ikisi ayrisabilir hale geldi ve mesaj
       bos bir Tur alani icin "hazir" diyebilirdi. */
    const turYazildi = d.indexOf('Tür') >= 0;
    /* ⚠ Belgenin tasinacagi SOYLENIR. Sessiz davranis, dosya alani bos
       gorundugu icin "belgesiz kaydediyorum" sanilmasina yol acardi. */
    VO_AYNI_DEKONT = true;
    const belgeNotu = VO_DEKONT_YOL ? ' · belge ilk kayıttan taşınacak' : '';
    yaz('Dolduruldu: ' + d.join(', ')
      + (turYazildi ? ' · kontrol et, Kaydet.' : ' · TÜRÜ sen seç, sonra kaydet.')
      + belgeNotu,
      turYazildi ? 'ok' : 'uyari');
    digerleriCiz(k);
  };
  /* kalan kalemler: her biri ayri kayit — tek tek doldurulur */
  const digerleriCiz = (secili) => {
    let alt = document.getElementById('voKalemler');
    if (!alt){ alt = document.createElement('div'); alt.id = 'voKalemler';
      kutu.parentNode.insertBefore(alt, kutu.nextSibling); }
    alt.textContent = '';
    const kalan = dk.kalemler.filter(k => k !== secili);
    if (!kalan.length) return;
    const bas = document.createElement('div');
    bas.className = 'kucuk';
    bas.textContent = 'Bu dekontta ' + dk.kalemler.length + ' kalem var (toplam '
      + tl(dk.toplam) + '). Kaydettikten sonra kalanları da tek tek gir:';
    alt.appendChild(bas);
    for (const k of kalan){
      const s = document.createElement('div');
      s.style.cssText = 'display:flex;gap:8px;align-items:center;justify-content:space-between;min-height:44px';
      const et = document.createElement('span');
      et.textContent = k.kod + ' ' + k.ad + ' · ' + tl(k.tutar)
        + (k.tur ? ' → ' + vergiAd(k.tur) : ' → tür belirsiz');
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn2'; b.textContent = 'Bunu doldur';
      b.onclick = () => doldur(k);
      s.appendChild(et); s.appendChild(b); alt.appendChild(s);
    }
  };
  doldur(ana);
}

/* Doner: null (vergi dekonti degil) ya da
   { tarih, donem, kalemler:[{kod, ad, tur, tutar}], toplam } */
function vergiDekontCoz(metin){
  const satirlar = String(metin || '').split('\n');
  /* baslik: "VERG İ TAHS İ L ALI N DISI" -> iskelette "ALINDISI" gecer */
  if (!satirlar.some(s => VD_ISKELET(s).indexOf('ALINDISI') >= 0)) return null;

  const say = (t) => { const r = paraCoz(t); return r.ok ? r.deger : null; };
  let tarih = null, donem = null;
  for (const s of satirlar){
    /* "02 26.08.2026 03 07/2026 - 07/2026 04 ..." — odeme tarihi ILK,
       donem ay/yil ciftinin BASI (ikisi de ayni satirda, olculdu). */
    const d = s.match(/(\d{2})\/(\d{4})\s*-\s*\d{2}\/\d{4}/);
    if (d && !donem){
      donem = d[2] + '-' + d[1];
      const t = s.match(/(\d{2})\.(\d{2})\.(\d{4})/);
      if (t) tarih = t[3] + '-' + t[2] + '-' + t[1];
    }
  }
  /* Kalem satiri: "NN KOD AD ... TUTAR" — NN sira, KOD dort hane.
     Tutar satirin SONUNDAKI para deseni; aradaki "2026 1" (yil/taksit)
     tutar DESENINE UYMAZ (virgul sart), karismaz. */
  const kalemler = [];
  for (const s of satirlar){
    const m = s.match(/^\s*\d{2}\s+(\d{4})\s+(.+?)\s+(\d{1,3}(?:\.\d{3})*,\d{2})\s*$/);
    if (!m) continue;
    const tutar = say(m[3]);
    if (tutar == null || tutar <= 0) continue;
    kalemler.push({ kod: m[1], ad: m[2].replace(/\s+\d{4}\s+\d+\s*$/, '').trim(),
                    tur: VD_KOD[m[1]] || null, tutar });
  }
  if (!kalemler.length) return null;
  let toplam = null;
  for (const s of satirlar){
    const m = s.match(/^\s*TOPLAM\s+\d+\s+(\d{1,3}(?:\.\d{3})*,\d{2})\s*$/i);
    if (m) toplam = say(m[1]);
  }
  return { tarih, donem, kalemler, toplam };
}

/* =====================================================================
   SGK · TAHSILAT DEKONTU OKUYUCUSU
   =====================================================================
   ⚠ NEDEN AYRI OKUYUCU: GIB alindisi ile SGK dekontunun kalibi hic
     ortusmuyor. GIB'de "NN KOD AD TUTAR" seklinde kalem TABLOSU var;
     SGK dekontunda tablo YOK, bilgiler "Etiket : Deger" satirlarinda.
     vergiDekontCoz bu belgede null doner (basligi "ALINDISI" degil).
   ⚠ IKI KALEM, IKI FARKLI SEY — isin ozu bu:
       Ana Para  -> SGK primi        -> vergi_odeme
       Komisyon  -> bankanin ucreti  -> GIDER
     Toplami vergiye yazmak vergiyi sisirir; yalniz ana parayi yazmak
     her ay tekrarlayan gercek bir masrafi kaybeder. Bu yuzden komisyon
     AYRI kalem olarak sunulur ve gider formuna gonderilir.
   ⚠ TUTAR BICIMI INGILIZCE: "50,831.69" ve "1575.78". paraCoz son
     ayiraci ondalik sayar, ikisini de dogru okur (olculdu).
   ⚠ TURKCE HARFLER DUSUYOR: VD_ISKELET ASCII disini SILER (cevirmez),
     "Güvenlik" -> "GVENLIK". Bu yuzden aranacak metin de RUNTIME'DA
     iskeletten uretilir (SGK_BASLIK) — elle "GUVENLIK" yazmak TUTMAZ.
   ⚠ SATIR BULMA ISKELETLE, DEGER OKUMA HAM SATIRDAN: etiketler
     ("Tahsilat Tarihi", "Ana Para", "Banka") saf ASCII, degerleri
     duz desenle guvenle cikiyor; satiri bulmak icin iskelet sart.
   ⚠ DONEM DEKONTTA YOK. Uydurulmaz — alan BOSALTILIR, oneri ayri
     dugmede durur ve NEDEN o ay onerildigi yazilir.
   ⚠ Sozluge tahminle satir eklenmez (Bankkart dersi). 4A/4B ayrimi
     dekontun kendi "Açıklama" satirindan okunur.
   ⚠ Ornek satirlar asagida TEMSILIDIR; gercek tutar/sicil/isim
     dosyaya yazilmaz. Olcum duzenegi: tmp/vergi-olcum.mjs --sgk
     (uygulamanin KENDI pdfMetinCikar'iyla, gercek dekontlarla).
       "Tahsilat Id : 1234567890 Tahsilat Tarihi : 31/07/2025"
       "Sicil No : 1234567890123456789 Banka : QNB A.S."
       "Açklama : 4A Prim Borcu"          <- kaynakta 'ı' zaten eksik
       "Ana Para : 12,345.67"
       "Komisyon Bilgisi : ... tarafından 89.01"
       "TL Komisyon alınmıştır."          <- ⚠ TUTAR BIR ONCEKI SATIRDA
   ===================================================================== */
const SGK_BASLIK = VD_ISKELET('Sosyal Güvenlik Kurumu');
/* SGK dekontundaki tur -> sistemdeki tur. KAYNAK: dekontun kendi
   "Açıklama" satiri ("4A Prim Borcu").
   ⚠ Sistemde 'sgk_4a' diye bir tur YOK — voTur listesinde 'sgk' ve
     'bagkur' var (olculdu). Olmayan degeri select'e yazmak alani
     BOSALTIR ve p_tur bos gider; o yuzden var olan kodlar kullanilir. */
const SGK_TUR = { '4A': 'sgk', '4B': 'bagkur' };

/* Doner: null (SGK dekonti degil) ya da
   { tur, tutar, tarih, donemOner, komisyon, banka, tahsilatId, sicil,
     yazdirma } — okunamayan alan null KALIR, doldurulmaz. */
function sgkDekontCoz(metin){
  const satirlar = String(metin || '').split('\n');
  const isk = satirlar.map(s => VD_ISKELET(s));
  if (isk.join('').indexOf(SGK_BASLIK) < 0) return null;

  const satirBul = (ipucu) => {
    const n = VD_ISKELET(ipucu);
    const i = isk.findIndex(s => s.indexOf(n) >= 0);
    return i < 0 ? null : { i, ham: satirlar[i] };
  };
  /* Satirdaki SON gecerli para. paraCoz "50,831.69" ve "1575.78"in
     ikisini de dogru cozer; tarih parcalari ("31","07","2026") ayri
     jeton oldugu icin buraya sokulmaz — cagiran taraf tarih satirini
     zaten disarida birakir. */
  const paraBul = (h) => {
    const hepsi = String(h == null ? '' : h).match(/\d[\d.,]*/g);
    if (!hepsi) return null;
    for (let i = hepsi.length - 1; i >= 0; i--){
      const r = paraCoz(hepsi[i]);
      if (r.ok && r.deger > 0) return r.deger;
    }
    return null;
  };
  const tarihCoz = (m) => m ? m[3] + '-' + m[2] + '-' + m[1] : null;

  /* --- odeme tarihi --- */
  let tarih = null;
  const st = satirBul('Tahsilat Tarihi');
  if (st) tarih = tarihCoz((st.ham + ' ' + (satirlar[st.i + 1] || ''))
    .match(/Tahsilat\s*Tarihi\s*:?\s*(\d{2})[./](\d{2})[./](\d{4})/i));

  /* --- ANA PARA. "Tahsilat Tutari" DEGIL: bu belgede ikisi ayni ama
     Ana Para daha dar tanim; komisyonu toplama katan bir belgede
     ikisi ayrisir ve dogru olan Ana Para'dir. --- */
  const sp = satirBul('Ana Para');
  const tutar = sp ? paraBul(sp.ham) : null;

  /* --- komisyon: tutar ile "TL Komisyon" AYRI SATIRLARDA (olculdu),
     blok birlestirilip aranir. Salt tarih olan satir (sayfa altindaki
     yazdirma tarihi) bloktan CIKARILIR, yoksa yil tutar sanilir. --- */
  let komisyon = null;
  const sk = satirBul('Komisyon Bilgisi');
  if (sk){
    const blok = satirlar.slice(sk.i, sk.i + 4)
      .filter(s => !/^\s*\d{2}[./]\d{2}[./]\d{4}\s*$/.test(s)).join(' ');
    const m = blok.match(/(\d[\d.,]*)\s*TL\s*Komisyon/i)
           || blok.match(/Komisyon\s*(?:Tutar[^:]*)?:\s*(\d[\d.,]*)/i);
    if (m) komisyon = paraBul(m[1]);
  }

  /* --- banka: komisyonun kime odendigini gider aciklamasina yazacagiz --- */
  let banka = null;
  const sb2 = satirBul('Banka :');
  if (sb2){ const m = sb2.ham.match(/Banka\s*:\s*(.+?)\s*$/i);
    if (m) banka = m[1].trim().slice(0, 40) || null; }

  /* --- 4A / 4B. Yalniz Açıklama ve Tahsilat Türü satirlarinda aranir:
     butun belgede aramak, sicil/tahsilat numarasindaki bir "4A"yi tur
     sanmaya acik olurdu. Ikisi de yoksa BOS kalir, kullanici secer. --- */
  const sa = satirBul('Açıklama'), stu = satirBul('Tahsilat Türü');
  const turMetin = [sa && sa.ham, stu && stu.ham].filter(Boolean).join(' ');
  const tm = turMetin.match(/\b4\s?([AB])\b/i);
  const tur = tm ? (SGK_TUR['4' + tm[1].toUpperCase()] || null) : null;

  /* --- not alanina yazilacak kimlikler --- */
  const alan = (ipucu, desen) => { const s = satirBul(ipucu); if (!s) return null;
    const m = s.ham.match(desen); return m ? m[1] : null; };
  const tahsilatId = alan('Tahsilat Id', /Tahsilat\s*Id\s*:?\s*(\d+)/i);
  const sicil      = alan('Sicil No',    /Sicil\s*No\s*:?\s*(\d+)/i);

  /* --- sayfa altindaki yazdirma tarihi: tek basina duran gg/aa/yyyy.
     Odeme tarihiyle celisebiliyor; kullaniciya SOYLENIR. --- */
  let yazdirma = null;
  for (const s of satirlar){
    const m = s.match(/^\s*(\d{2})[./](\d{2})[./](\d{4})\s*$/);
    if (m) yazdirma = tarihCoz(m);
  }

  /* --- donem onerisi: SGK primi bir SONRAKI ay odenir, dolayisiyla
     odeme tarihinin bir ONCEKI ayi. Oneri; alana yazilmaz. --- */
  let donemOner = null;
  if (tarih){
    const y = +tarih.slice(0, 4), a = +tarih.slice(5, 7);
    const d = new Date(Date.UTC(y, a - 2, 1));
    donemOner = d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
  }
  return { tur, tutar, tarih, donemOner, komisyon, banka, tahsilatId, sicil, yazdirma };
}

/* SGK dekontunu forma yazar. Ekstre okuyucusuyla ayni desen: DOLDUR,
   KAYDETME. Komisyon vergi formuna YAZILMAZ; altta ayri kalem olur. */
function sgkDekontDoldur(dk, yaz){
  const g = (id) => document.getElementById(id);
  const yazAlan = (id, deger) => { const e = g(id); if (!e || deger == null) return false;
    e.value = deger; e.dispatchEvent(new Event('input',{bubbles:true}));
    e.classList.add('oku-dolu'); return true; };
  const kurus = (n) => n.toFixed(2).replace('.', ',');
  const gunTr = (t) => new Date(t + 'T00:00').toLocaleDateString('tr-TR');
  const doldu = [], eksik = [];

  if (dk.tutar != null){ if (yazAlan('voTutar', kurus(dk.tutar))) doldu.push('Tutar'); }
  /* ⚠ ADIM 14 B · CIPLAK ALAN ADI + NEDEN. Hukum ("okunamadi — elle
     yaz") sozlukten geliyor; parantez icindeki sebep KALIYOR, cunku
     kullaniciya belgede NEDEN olmadigini o soyluyor. */
  else eksik.push('Tutar (Ana Para satırı)');
  if (dk.tarih && yazAlan('voTarih', dk.tarih)) doldu.push('Ödeme tarihi');

  /* Tur: OLMAYAN secenek atanirsa select bosalir — once varligi sinanir. */
  const stu = g('voTur');
  if (dk.tur && stu && [...stu.options].some(o => o.value === dk.tur)){
    stu.value = dk.tur; stu.classList.add('oku-dolu'); doldu.push('Tür');
  } else eksik.push('Tür (dekontta 4A/4B yazmıyor)');

  /* DONEM: belgede YOK. Varsayilan olarak duran bu ayi BIRAKMAK, yanlis
     donemi sessizce kaydetmek olurdu — alan bosaltilir. */
  const sd = g('voDonem');
  if (sd){ sd.value = ''; sd.classList.remove('oku-dolu'); }
  eksik.push('Dönem');

  const nt = g('voNot');
  if (nt){
    nt.value = ['SGK', dk.banka, dk.tahsilatId && ('Tahsilat No ' + dk.tahsilatId),
      dk.sicil && ('Sicil ' + dk.sicil)].filter(Boolean).join(' · ');
    nt.dispatchEvent(new Event('input',{bubbles:true}));
    nt.classList.add('oku-dolu'); doldu.push('Not');
  }

  /* --- alt kutu: donem onerisi + tarih uyarisi + komisyon kalemi.
     GIB okuyucusuyla AYNI kutu (voKalemler) kullanilir; boylece art
     arda iki dekont okununca eskisi ekranda kalmaz. --- */
  let alt = g('voKalemler');
  if (!alt){ alt = document.createElement('div'); alt.id = 'voKalemler';
    const kutu = g('voOkuDurum'); kutu.parentNode.insertBefore(alt, kutu.nextSibling); }
  alt.textContent = '';
  const satirKur = (metin, dugmeAd, isle, sinif) => {
    const s = document.createElement('div');
    s.style.cssText = 'display:flex;gap:8px;align-items:center;'
      + 'justify-content:space-between;min-height:44px';
    const et = document.createElement('span');
    et.className = sinif || 'bilgi-not'; et.textContent = metin;
    s.appendChild(et);
    if (dugmeAd){
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn2'; b.textContent = dugmeAd;
      b.onclick = isle; s.appendChild(b);
    }
    alt.appendChild(s); return s;
  };

  satirKur(dk.donemOner
    ? 'Dönem dekontta yazmıyor. SGK primi bir sonraki ay ödenir; ödeme '
      + 'tarihine göre ' + ayAdi(dk.donemOner) + ' olmalı — değiştirebilirsin.'
    : 'Dönem dekontta yazmıyor — elle seç.',
    dk.donemOner ? 'Dönemi yaz' : null,
    () => { if (yazAlan('voDonem', dk.donemOner))
      yaz('Dönem ' + ayAdi(dk.donemOner) + ' yazıldı — doğru değilse değiştir.', 'ok'); });

  /* Tarih tutarsizligi: ENGELLEME, SOYLE. Eski belgeyi bilerek giriyor
     olabilir. Esik bir yil: yazdirma tarihiyle odeme tarihi arasindaki
     bir yillik fark bu belgede olculdu. */
  if (dk.tarih){
    const gunFark = (new Date(bugun() + 'T00:00') - new Date(dk.tarih + 'T00:00')) / 86400000;
    if (gunFark >= 365){
      const u = document.createElement('div');
      u.className = 'uyari-agir'; u.style.margin = '8px 0';
      u.textContent = 'Belgedeki tarih ' + gunTr(dk.tarih) + ' — doğru mu? '
        + (dk.yazdirma && dk.yazdirma !== dk.tarih
          ? 'Belgenin altındaki yazdırma tarihi ' + gunTr(dk.yazdirma) + ', ikisi tutmuyor. '
          : '')
        + 'Kayıt, Ödeme Tarihi alanında ne yazıyorsa ona göre yapılır.';
      alt.appendChild(u);
    }
  }

  /* KOMISYON: vergi degil, banka masrafi. Vergi formuna YAZILMAZ. */
  if (dk.komisyon != null){
    satirKur((dk.banka ? dk.banka + ' komisyonu' : 'Banka komisyonu')
      + ' · ' + tl(dk.komisyon) + ' → Gider',
      'Gidere yaz', () => sgkKomisyonGider(dk));
    satirKur('Bu tutar vergi değil, bankanın tahsilat ücreti — vergi tutarına '
      + 'eklenmedi. Önce vergiyi kaydet, sonra bu düğmeye bas.', null, null);
  }

  /* ⚠ ADIM 14 B · metin sozlukten; eskiden "· ELLE: ..." elle yaziliydi. */
  yaz('Dolduruldu: ' + (doldu.join(', ') || 'hiçbir alan')
    + (eksik.length ? ' · ' + dilEksik(eksik) : '') + '.',
    eksik.length ? 'uyari' : 'ok');
}

/* Komisyonu GIDER formuna tasir. Gider tarafinda HICBIR SEY degismedi:
   mutabakatGir'in kullandigi desen (bolumu sec, ekrani ac, alanlari
   disaridan doldur) aynen tekrarlandi.
   ⚠ sekmeAc, formda kaydedilmemis bilgi varsa ONAY sorar ve kullanici
     vazgecerse ekran DEGISMEZ. O durumda doldurmaya kalkmak, vergi
     ekranindayken gider alanlarini aramak olurdu — AKTIF_SEKME sinanir.
   ⚠ Kaydetmez. Kategori bilerek BOS birakilir: hangi kategoriye
     yazilacagi isletmenin karari, uydurulmaz. */
function sgkKomisyonGider(dk){
  const inp = document.getElementById('voFoto');
  const dosya = inp && inp.files && inp.files[0] ? inp.files[0] : null;
  const eskiBolum = GIDER_BOLUM;
  GIDER_BOLUM = 'temel';
  sekmeAc('gider');
  if (AKTIF_SEKME !== 'gider'){ GIDER_BOLUM = eskiBolum; return; }
  /* vGider async; alanlar birkac karede geliyor. Sabit gecikme yerine
     alan gorunene kadar bakilir — yavas cihazda bos forma yazmasin. */
  let kalan = 25;
  const koy = () => {
    const t = document.getElementById('gdTutar');
    if (!t){ if (--kalan > 0) setTimeout(koy, 60); return; }
    t.value = dk.komisyon.toFixed(2).replace('.', ',');
    t.dispatchEvent(new Event('input',{bubbles:true}));
    t.classList.add('oku-dolu');
    const a = document.getElementById('gdAciklama');
    if (a){ a.value = 'SGK tahsilat komisyonu' + (dk.banka ? ' · ' + dk.banka : '');
      a.dispatchEvent(new Event('input',{bubbles:true})); a.classList.add('oku-dolu'); }
    const td = document.getElementById('gdTarih');
    if (td && dk.tarih && dk.tarih <= bugun()) td.value = dk.tarih;
    if (dosya){ const f = document.getElementById('gdFoto');
      if (f){ const dt = new DataTransfer(); dt.items.add(dosya); f.files = dt.files; } }
    const drm = document.getElementById('gdOkuDurum');
    if (drm){ drm.className = 'oku-durum uyari';
      drm.textContent = 'SGK tahsilat komisyonu taşındı — KATEGORİ seç, kontrol et, '
        + 'sonra Kaydet. Bu tutar vergi değil, bankanın ücreti.'; }
    window.scrollTo(0,0);
  };
  setTimeout(koy, 60);
}
/* VADE LİSTESİ
   Vadeler artık vergi takviminden otomatik üretiliyor (rpc_vade_uret), bu yüzden
   sistemde yıllarca ileriye kayıt var. Hepsini listelemek anlamsız — varsayılan
   olarak geçmişte kalanlar + önümüzdeki 60 gün gösteriliyor.

   "Ödendi" düğmesi KALDIRILDI: bir vade ancak gerçek bir ödeme kaydına bağlanınca
   kapanır. Elle işaretleme, olmayan bir ödemeyi var göstermeye yol açıyordu
   (03.08.2026'da geçici vergi ve kirada tam olarak bu oldu). */
/* ⚠ CR · VADE_HEPSI KALDIRILDI: liste ay ay gruplandı, 'hepsini göster'
   düğmesine gerek kalmadı — bütün vadeler kendi ayının altında duruyor
   ve gecikmişi olan ay açık başlıyor. */
const VADE_DURUM = {
  odendi:    ['rz-ok',   'Ödendi'],
  tutar_yok: ['rz-gri',  'Tutar çıkmadı'],
  iptal:     ['rz-gri',  'İptal']
};
async function vergiVadeYukle(){
  const el = document.getElementById('vergiVadeler'); if(!el) return;
  /* Vadenin kendi tutari 89 kayittan 1'inde dolu — takvim vadeyi onceden
     uretiyor, tutar odeme aninda belli oluyor. ODENMIS vadede tutar bagli
     odemede duruyor; oradan okunur. Ikinci sorgu bunun icin. */
  /* ⚠ UCUNCU SORGU · ONGORU ICIN. Yil filtresi YOK bilerek: bir turun son
     odemesi gecen yildan kalmis olabilir (gelir vergisi taksitleri gibi)
     ve yil basinda filtreli sorgu "gecmis odeme yok" derdi. Ekran her
     acilista taze okur — ongoru saklanmadigi icin bayatlamaz. */
  const [{ data, error }, bagli, odm] = await Promise.all([
    sb.from('v_vade_liste').select('*').order('vade_tarihi'),
    sb.from('vade').select('id, vergi_odeme:odendi_vergi_id(id,tutar,tur,odeme_tarihi,donem), gider:odendi_gider_id(tutar)')
      .eq('is_deleted', false).eq('durum', 'odendi'),
    sb.from('vergi_odeme').select('id,tur,tutar,odeme_tarihi,donem').eq('is_deleted', false)
      .order('odeme_tarihi', { ascending:false }).limit(200)
  ]);
  if (error){ el.innerHTML = `<div class="uyari-agir">Vadeler yüklenemedi: ${esc(hataTr(error.message))}</div>`; return; }
  const odenenTutar = {}, bagliOdeme = {};
  (bagli.data || []).forEach(x => {
    const t = x.vergi_odeme?.tutar ?? x.gider?.tutar;
    if (t != null) odenenTutar[x.id] = +t;
    if (x.vergi_odeme) bagliOdeme[x.id] = x.vergi_odeme;
  });
  /* ⚠ odm.error SESSIZ GECILMEZ ama ekrani DA DUSURMEZ: vadeler
     gorunmeye devam etsin, yalnizca ongoru satirlari cikmasin. */
  const odemeler = odm.error ? [] : (odm.data || []);
  const hepsi = data||[];
  /* ==================================================================
     ⚠ CR · VADELER AY AY (görsel desen Vergiler ekranından, aynısı)
     Liste düz ve uzundu, altında "72 vade daha var — hepsini göster"
     vardı; "önümüzdeki ay ne ödeyeceğim" görünmüyordu.

     ⚠ GRUPLAMA ÖLÇÜTÜ VADE TARİHİ — Vergiler ekranından BİLEREK FARKLI.
       Orada soru "hangi ayın vergisi" (dönem), burada "hangi ay
       ödeyeceğim" (vade tarihi). "KDV (2026-08) · vade 28.09" burada
       EYLÜL'ün altındadır; dönem satırın içinde yazmaya devam eder.
       Hangi ölçüt olduğu listenin başında yazılı — iki ekran yan yana
       okunduğunda karışmasın.

     ⚠ GECİKMİŞ VADE: ayrı bir "geçmiş" grubu YAPILMADI, gecikmişi olan
       AY AÇIK BAŞLIYOR ve başlıkta GECİKMİŞ rozeti duruyor. Gerekçe:
       ayrı grup, tek sıralama eksenini (vade tarihi) bozar; aynı vade
       ya iki yerde görünür ya ayından çıkar, "hangi ay ne ödeyeceğim"
       okunaksızlaşır. Açık başlatmak görünürlüğü aynı şekilde garanti
       eder, ekseni bozmaz.

     ⚠ TOPLAM YALNIZ KESİN TUTARLARDAN. Tutarı bilinmeyen vade toplama
       GİRMEZ, başlıkta ayrıca sayılır; öngörüsü varsa "öngörü +X" diye
       AYRI yazılır. Öngörüyü kesin tutarla toplamak, tahmini bütçe gibi
       gösterirdi.
     ⚠ ÖDENMİŞ VADE ayında kalır ama KALAN TOPLAMA GİRMEZ — o toplam
       "bu ay daha ne çıkacak" demektir.
     ⚠ ROZET YALNIZ İŞ BİTİNCE: ayın tamamı kapandıysa ÖDENDİ. Gecikmişi
       varsa ÖDENDİ çıkmaz. "0 gecikmiş" gibi boş rozet yazılmaz. */
  const kesinTutar = (v) => v.tutar != null ? +v.tutar
                     : (odenenTutar[v.id] != null ? odenenTutar[v.id] : null);
  const satirHtml = (v) => {
    const d = VADE_DURUM[v.durum];
    const bo = bagliOdeme[v.id];
    const gercek = kesinTutar(v);
    const on = bo ? vadeOngoru(v.tur, odemeler, bo.odeme_tarihi)
             : gercek == null ? vadeOngoru(v.tur, odemeler, null) : null;
    const sp = bo && on ? vadeSapma(on.ongoru, gercek) : null;
    const kaynakAy = on && on.kaynak.donem ? ayAdi(on.kaynak.donem)
                   : on && on.kaynak.odeme_tarihi
                     ? new Date(on.kaynak.odeme_tarihi+'T00:00').toLocaleDateString('tr-TR') : '';
    return `<div class="liste-satir" data-vid="${v.id}">
      <div class="l-sol"><div class="b">${esc(v.aciklama)} ${
        v.gecti ? '<span class="rozet rz-hata">GEÇTİ</span>'
        : v.yakin ? '<span class="rozet rz-uyari">'+(v.kalan_gun===0?'BUGÜN':v.kalan_gun+' GÜN')+'</span>' : ''}</div>
        <div class="k">${new Date(v.vade_tarihi+'T00:00').toLocaleDateString('tr-TR')}${
          gercek != null
            ? (sp ? ' · öngörü '+tl(on.ongoru)+' · gerçek '+tl(gercek)
                    + ' · <b style="color:'+sp.sinif+'">'+sp.metin+'</b>'
                  : ' · '+tl(gercek))
          : on ? ' · öngörü <b>'+tl(on.ongoru)+'</b>'
          : v.durum === 'acik' ? ' · <b style="color:var(--uyari)">tutar bekleniyor</b>'
          : ''}${
          v.durum_notu ? '<br>'+notKisalt(v.durum_notu, 90) : ''}</div>${
          on && gercek == null
            ? `<div class="k" style="color:var(--soluk)">geçen sefer bu kadar ödedin${
                kaynakAy ? ' ('+esc(kaynakAy)+')' : ''} — kesin tutar değil</div>` : ''}</div>
      <div class="l-sag">${d
        ? `<span class="rozet ${d[0]}">${d[1]}</span>`
        : `<button class="btn2" onclick="vadeKapat('${v.id}','${esc(v.aciklama)}')">Kapat</button>`}</div>
    </div>`;
  };

  const AYG = new Map();
  for (const v of hepsi){
    const k = String(v.vade_tarihi).slice(0,7);
    let g = AYG.get(k); if (!g){ g = { k, v:[] }; AYG.set(k, g); }
    g.v.push(v);
  }
  const buAy = bugun().slice(0,7);
  const aylar = [...AYG.keys()].sort();          // en yakın/eski önce
  el.innerHTML = (aylar.length === 0
    ? '<div class="bilgi-not">Kayıtlı vade yok.</div>'
    : `<div class="bilgi-not" style="margin:0 0 8px">Aylar <b>vade tarihine</b> göre —
         "ne zaman ödeyeceğim". (Vergiler listesi <b>döneme</b> göre gruplu — "hangi ayın
         vergisi".) Hangi döneme ait olduğu satırın içinde yazıyor.</div>`
      + aylar.map((k, i) => {
      const g = AYG.get(k);
      let odendi = 0, kapali = 0, gecikmis = 0, kalanTop = 0, tutarYok = 0, ongoruTop = 0;
      for (const v of g.v){
        if (v.durum === 'odendi'){ odendi++; continue; }
        if (v.durum === 'iptal' || v.durum === 'tutar_yok'){ kapali++; continue; }
        if (v.gecti) gecikmis++;
        const t = kesinTutar(v);
        if (t != null) kalanTop += t;
        else { tutarYok++; const o = vadeOngoru(v.tur, odemeler, null); if (o) ongoruTop += o.ongoru; }
      }
      const acikAdet = g.v.length - odendi - kapali;
      const bitti = acikAdet === 0 && gecikmis === 0 && odendi > 0;
      const id = 'vdGrup' + i;
      const acik = k === buAy || gecikmis > 0;
      /* Rozet YALNIZ iş bitince ya da gecikme varken. Boş rozet yok. */
      const rozet = gecikmis > 0
          ? `<span class="rozet rz-hata" style="margin-left:6px">${gecikmis} GECİKMİŞ</span>`
        : bitti ? '<span class="rozet rz-ok" style="margin-left:6px">ÖDENDİ</span>' : '';
      const sag = bitti
        ? `${g.v.length} vade`
        : `${g.v.length} vade${odendi ? ' · '+odendi+' ödendi' : ''}<br>`
          /* ⚠ SIFIR YAZILMAZ: hiçbir vadenin tutarı bilinmiyorsa toplam
             "0,00" değil, HİÇ yazılmaz — bilinmeyeni sıfır gibi göstermek
             bütçeyi yanıltır (ölçüldü: Aralık ayı "1 vade · 0,00 TL" diyordu). */
          + (acikAdet === 0 ? '<span class="gri">kalan yok</span>'
             : kalanTop === 0 && tutarYok ? '<span class="gri">tutar bilinmiyor</span>'
             : (odendi ? 'kalan ' : '') + tl(kalanTop))
          + (tutarYok ? `<br><span style="color:var(--uyari)">${tutarYok} vadenin tutarı yok${
               ongoruTop ? ' · öngörü +'+tl(ongoruTop) : ''}</span>` : '');
      return `<button type="button" class="serit-ozet-vg" aria-expanded="${acik}" aria-controls="${id}"
          onclick="vgGrupAc(this,'${id}')"
          style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;
                 background:var(--kart);border:1.5px solid var(--cizgi);border-radius:12px;
                 padding:9px 12px;margin:8px 0 0;min-height:44px;cursor:pointer">
          <span class="vg-ok" style="color:var(--soluk)">${acik ? '▾' : '▸'}</span>
          <!-- ⚠ AY ADI KIRILMAZ: overflow-wrap:anywhere + min-width:0 birlikte,
               sagdaki uzun ozet yuzunden "Eylül 2026"yi HARF HARF alt alta
               diziyordu (olculdu, ekran goruntusunde gorundu). Ay adi tek
               satirda kalir, sarma hakki SAG sutuna verilir. -->
          <span style="flex:0 0 auto;font-weight:800;white-space:nowrap">${esc(ayAdi(k))}</span>${rozet}
          <span style="flex:1;min-width:0"></span>
          <!-- ⚠ nowrap YOK: özet metni uzun ("4 vade · 88.928,15 TL ·
               1 vadenin tutarı yok · öngörü +13.953,16 TL") ve nowrap ile
               375px'te sayfayı 425px yana taşırıyordu (ölçüldü). -->
          <span class="k" style="text-align:right;flex:0 1 auto;min-width:0">${sag}</span>
        </button>
        <div id="${id}" ${acik ? '' : 'hidden'} style="padding:2px 0 6px">${
          g.v.map(satirHtml).join('')}</div>`;
    }).join(''));
  /* ---- C · YIL SONU ISABET -------------------------------------------
     ⚠ HEPSI uzerinden hesaplanir, ekrandaki daraltilmis liste uzerinden
       DEGIL: "hepsini goster"e basinca isabet yuzdesinin degismesi,
       rakami olcum degil GORUNUM'e bagli kilardi.
     ⚠ Yalniz ONGORU + GERCEK CIFTI olan kayitlar sayilir. Ilk kez odenen
       bir turde ongoru YOKTUR; onu ciftmis gibi saymak yuzdeyi sisirir.
     ⚠ ORTALAMA MUTLAK sapma: +%10 ile -%10 birbirini goturup "sapma yok"
       demesin. Isabet olculuyor, denge degil.
     ⚠ UC NOKTADAN AZ ORTALAMA YANILTIR — yuzde YAZILMAZ, sayi yazilir. */
  const yilS = bugun().slice(0,4);
  let olculen = 0; const sapmalar = [];
  for (const v of hepsi){
    const bo = bagliOdeme[v.id];
    if (!bo || String(bo.odeme_tarihi).slice(0,4) !== yilS) continue;
    olculen++;
    const g = v.tutar ? +v.tutar : odenenTutar[v.id];
    const o = vadeOngoru(v.tur, odemeler, bo.odeme_tarihi);
    const s = o ? vadeSapma(o.ongoru, g) : null;
    if (s) sapmalar.push(Math.abs(s.yuzde));
  }
  const iel = document.getElementById('vergiIsabet');
  if (iel){
    iel.textContent = olculen === 0
      ? yilS + ' yılında vadeye bağlanmış ödeme yok — öngörü isabeti henüz ölçülemiyor.'
      : sapmalar.length < 3
        ? 'Bu yıl ' + olculen + ' ödeme vadeye bağlandı, ' + sapmalar.length
          + "'inde öngörü karşılaştırması yapılabildi — henüz yeterli ölçüm yok ("
          + sapmalar.length + ' kayıt). Üç noktadan az ortalama yanıltır.'
        : 'Bu yıl ' + olculen + ' ödeme vadeye bağlandı, ' + sapmalar.length
          + "'inde öngörü ölçüldü · ortalama sapma %"
          + (sapmalar.reduce((a,b)=>a+b,0) / sapmalar.length).toFixed(1).replace('.', ',')
          + ' (yönden bağımsız).';
  }

  /* BL · Ozet'ten gelindiyse hedef vadeyi gorunur kil. Hedef daraltilmis
     listede yoksa ama var olan bir kayitsa "hepsini goster"e gecilir. */
  /* ⚠ CR · Özet'ten gelinen vade artık KATLI BİR AYIN İÇİNDE olabilir.
     Eskiden liste düzdü ve "hepsini göster"e geçmek yetiyordu; artık
     hedefin ayı AÇILIR, sonra satır işaretlenir. Vade listede yoksa
     (silinmiş) sessizce geçilir — eski davranış. */
  if (VADE_HEDEF){
    const hedef = el.querySelector('[data-vid="' + VADE_HEDEF + '"]');
    VADE_HEDEF = null;
    if (hedef){
      const panel = hedef.closest('[id^="vdGrup"]');
      if (panel && panel.hidden){
        const btn = el.querySelector('[aria-controls="' + panel.id + '"]');
        if (btn) vgGrupAc(btn, panel.id);
      }
      hedef.classList.add('vade-hedef');
      hedef.scrollIntoView({ block:'center' });
    }
  }
}
/* Bir vadeyi ödeme kaydı olmadan kapatmak: yalnız "tutar çıkmadı" veya "iptal".
   Ödeme yapıldıysa ödeme kaydı girilir, vade kendiliğinden kapanır. */
/* ===== AC · VADE KAPATMA · TEK PENCERE =====
   Onceki akis IKI pencere ve IKI ayri hata yoluydu: once prompt ile
   "1 veya 2 yaz" — yani SECIMI RAKAM YAZARAK — yanlis yazarsan bastan;
   sonra ayri bir gerekce penceresi, bos birakirsan yine bastan.
   ⚠ Secim RADIO ile, iki "secilebilir dugme" ile DEGIL: radio'da ok
     tuslariyla gezinme, grubun TEK Tab duragi olmasi ve radiogroup rolu
     YERLESIK gelir; dugmelerde aria-pressed ve ok tusu isini elle yazmak
     gerekirdi — kendi elimle daha az erisilebilir bir sey yapardim.
   ⚠ HICBIRI ONCEDEN SECILI DEGIL. Varsayilan secim, dusunmeden
     kapatmaya davettir.
   ⚠ Varsayilan odak ILK SECENEKTE — onaySor'dan bilerek FARKLI (orada
     Vazgec'te). Gerekce: bu islem YIKICI DEGIL; vadeyi "odenmedi" diye
     kapatiyor, veri silmiyor, geri alinabilir. Ustelik gerekce zorunlu
     oldugu icin tek tikla olmuyor. Insan once secim yapacak, odak oraya
     konuyor. Odaklanmak SECMEZ: radio ancak ok tusu, bosluk ya da tik
     ile secilir — olculdu.
   ⚠ Iki hata yolu artik URETILEMEZ: "1 veya 2 yazmalisin" ve "Neden
     zorunlu" — dugme, secim VE gerekce birlikte saglanmadan aktif olmaz. */
function vadeKapat(id, ad){
  const acan = document.activeElement;
  const yap = (t,s,m)=>{ const e=document.createElement(t); if(s) e.className=s; if(m!=null) e.textContent=m; return e; };
  const d = document.createElement('dialog'); d.className = 'pm';
  d.setAttribute('aria-modal','true');

/* Banka/POS ekstresindeki sayı. Eskiden TÜM noktaları siliyordu:
   "1250.50" → 125050 (100 KAT hata). Ekstrede tek bir İngilizce biçimli sayı
   olsa para 100 katına çıkıyordu. Artık paraCoz ile aynı kural: SON ayraç ondalıktır. */
function trSayi(s){ // "1.234.567,89" → 1234567.89 ; "-1.234,56" → -1234.56 ; "1250.50" → 1250.50
  if (s==null) return null;
  const t = String(s);
  const eksi = /-/.test(t.replace(/[^\d.,-]/g,'').slice(0,2));   // baştaki eksi
  const r = paraCoz(t, 2);
  if (!r.ok) return null;
  return eksi ? -r.deger : r.deger;
}
/* POS EKSTRESİ OKUMA
   Eski sürüm sayfadaki bütün metni tek satıra ezip yalnız AYLIK toplamları
   arıyordu. O yüzden yalnız "aylık fark şu kadar" diyebilirdi ama HANGİ GÜN olduğunu asla
   söyleyemezdi. 03.08.2026'da farkı bulan şey gün gün karşılaştırmaydı;
   üstelik asıl ipucu tutar değil İŞLEM ADEDİ oldu.
   Artık satır satır okunuyor ve gün gün karşılaştırılıyor. */

// PDF'te Türkçe harfler bazen ISO-8859-9 karşılığıyla geliyor (Ý=İ, Þ=Ş...)
const POS_TR = { 'Ý':'İ','Þ':'Ş','ý':'ı','þ':'ş','Ð':'Ğ','ð':'ğ' };
const posTrDuzelt = t => String(t).replace(/[ÝÞýþÐð]/g, c => POS_TR[c]);

function posEkstreCoz(metin){
  const satir = posTrDuzelt(metin).split('\n');
  const gunler = {};
  // "GÜN BÖLÜM ADET TÜR TUTAR ..." — tür kodu harflerle başlar (PŞNYİKK, TKSTMAX...)
  const satirRe = /^(\d{1,2})\s+(\d+)\s+(\d+)\s+([A-ZÇĞİÖŞÜ]{3,12}\S*)\s+(-?[\d.]+,\d{2})\b/;
  for (const l of satir){
    const m = satirRe.exec(l.trim());
    if (!m) continue;
    const g = +m[1];
    if (g < 1 || g > 31) continue;
    const t = trSayi(m[5]); if (t === null) continue;
    gunler[g] = gunler[g] || { gun:g, adet:0, tutar:0 };
    gunler[g].adet  += +m[3];
    gunler[g].tutar  = +(gunler[g].tutar + t).toFixed(2);
  }
  // Özet: etiket ile rakam aynı satırda olmayabilir, 2 satır ileriye bak
  const bul = (...etiketler) => {
    for (const et of etiketler){
      const re = new RegExp(et.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'i');
      for (let i = 0; i < satir.length; i++){
        if (!re.test(satir[i])) continue;
        for (let j = i; j < Math.min(i+3, satir.length); j++){
          const s = /(-?[\d.]+,\d{2})/.exec(satir[j]);
          if (s) return trSayi(s[1]);
        }
      }
    }
    return null;
  };
  return {
    gunluk: Object.values(gunler).sort((a,b)=>a.gun-b.gun),
    isyeri: (posTrDuzelt(metin).match(/İşyeri No:\s*(\d+)/)||[])[1] || null,
    ozet: {
      toplam_satis:     bul('Toplam Satış'),
      komisyon:         bul('İşyeri Ücreti Pşn\\(Tutar\\)','İşyeri Ücreti Pşn'),
      maxipuan:         bul('Maxipuan Katkı Payı'),
      okc_ucret:        bul('Ücreti\\(ÖKC\\)','POS Yzlm/Dnnm/Bakım'),
      kesinti_toplam:   bul('Kesintiler Toplamı'),
      net_hesaba_gecis: bul('Dönem İçi Toplam Hesaba','Dönem İçi Peşin Hesaba'),
      bekleyen_alacak:  bul('Toplam Alacak Tutarı')
    }
  };
}

async function bankaPdfAnaliz(){
  const inp = document.getElementById('bmPdf');
  if (!inp.files || !inp.files[0]){ mesaj('bmMsg','hata','PDF seçilmedi.'); return; }
  const donem = document.getElementById('bmDonem').value;
  if (!donem){ mesaj('bmMsg','hata','Dönem seçilmedi.'); return; }
  const btn = document.getElementById('bmAnaliz'); btn.disabled = true; btn.textContent = 'Okunuyor...';
  try{
    const c = await pdfMetinCikar(inp.files[0]);
    if (!c.yeterli) throw new Error('PDF taranmış görünüyor — metin çıkmadı.');
    const p = posEkstreCoz(c.metin);
    if (!p.gunluk.length) throw new Error('Günlük işlem satırları okunamadı. Bu İş Bankası üye işyeri hesap özeti mi?');

    // Ayrıştırma doğru mu: günlerin toplamı ekstrenin kendi "Toplam Satış"ıyla tutmalı
    const gunToplam = +p.gunluk.reduce((a,x)=>a+x.tutar,0).toFixed(2);
    const tutar_kontrol = p.ozet.toplam_satis !== null
      && Math.abs(gunToplam - p.ozet.toplam_satis) < 0.05;

    const { data: gs } = await sb.from('gun_sonu')
      .select('tarih,kart_toplam,gun_sonu_kasa(kart_adet,is_deleted)')
      .gte('tarih', donem+'-01').lte('tarih', aySon(donem)).eq('is_deleted', false);
    const sis = {};
    (gs||[]).forEach(g => {
      const gun = +String(g.tarih).slice(8,10);
      const kasalar = (g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted);
      const adet = kasalar.some(k=>k.kart_adet!=null)
        ? kasalar.reduce((a,k)=>a+(+k.kart_adet||0),0) : null;
      sis[gun] = { tutar:+g.kart_toplam, adet };
    });

    const bankaMap = {}; p.gunluk.forEach(x => bankaMap[x.gun] = x);
    const tumGun = [...new Set([...Object.keys(sis), ...Object.keys(bankaMap)].map(Number))].sort((a,b)=>a-b);
    const satirlar = tumGun.map(g => {
      const S = sis[g], B = bankaMap[g];
      return { gun:g,
        sistem: S ? S.tutar : null, banka: B ? B.tutar : null,
        fark: (S?S.tutar:0) - (B?B.tutar:0),
        sAdet: S ? S.adet : null, bAdet: B ? B.adet : null,
        adetFark: (S && S.adet != null && B) ? S.adet - B.adet : null };
    });
    const farkli = satirlar.filter(x => Math.abs(x.fark) >= 0.005 || x.sistem === null || x.banka === null);
    const sisTop = +Object.values(sis).reduce((a,x)=>a+x.tutar,0).toFixed(2);
    MT_SON = { donem, gunluk:p.gunluk, ozet:p.ozet, isyeri:p.isyeri };

    const st = (v, renk) => `<span style="color:var(--${renk})">${v}</span>`;
    document.getElementById('bmSonuc').innerHTML = `
      ${tutar_kontrol ? '' : `<div class="uyari-agir" style="margin-top:10px">
        Ayrıştırma şüpheli: okunan günlerin toplamı (${tl(gunToplam)}) ekstrenin
        "Toplam Satış" rakamıyla (${tl(p.ozet.toplam_satis)}) tutmuyor.
        Kaydetme, bana bildir.</div>`}
      <div style="margin-top:12px">
        ${ozSatir('Bankanın toplam satışı', tl(p.ozet.toplam_satis))}
        ${ozSatir('Bizim kart cirosu ('+Object.keys(sis).length+' gün)', tl(sisTop))}
        ${ozSatir('FARK', Math.abs(sisTop-(p.ozet.toplam_satis||0))<0.005
            ? '✓ Tutuyor' : tl(sisTop-(p.ozet.toplam_satis||0)), true)}
      </div>
      <div class="yy-bas" style="margin-top:14px">KESİNTİLER</div>
      ${ozSatir('Komisyon', tl(p.ozet.komisyon||0))}
      ${ozSatir('Maxipuan katkı payı', tl(p.ozet.maxipuan||0))}
      ${ozSatir('POS/ÖKC cihaz ücreti', tl(p.ozet.okc_ucret||0))}
      ${ozSatir('Kesinti toplamı', tl(p.ozet.kesinti_toplam||0), true)}
      ${ozSatir('Net hesaba geçen', tl(p.ozet.net_hesaba_gecis||0))}
      ${ozSatir('Gelecek aya sarkan alacak', tl(p.ozet.bekleyen_alacak||0))}
      <div class="yy-bas" style="margin-top:14px">GÜN GÜN</div>
      ${farkli.length === 0
        ? '<div class="bilgi-not">31 günün hepsi tutuyor.</div>'
        : `<div class="uyari-agir">${farkli.length} günde fark var</div>
           <div class="ipucu">Bir güne dokun — o günün gün sonu kaydı, kasa kırılımı ve
             <b>Z raporu fotoğrafı</b> açılır. Farkın nereden geldiği orada görünür.</div>`
          + farkli.map(x => {
              const trh = donem + '-' + String(x.gun).padStart(2,'0');
              return `<div class="liste-satir" style="cursor:pointer"
                  onclick="gunDetay('${trh}')" title="O günün gün sonu kaydını ve Z raporunu aç">
              <div class="l-sol"><div class="b">${String(x.gun).padStart(2,'0')}.${donem.slice(5)} ${
                x.adetFark ? '<span class="rozet rz-hata">'+Math.abs(x.adetFark)+' İŞLEM</span>' : ''}</div>
                <div class="k">sistem ${x.sistem==null?'—':tl(x.sistem)} · banka ${x.banka==null?'—':tl(x.banka)}${
                  x.sAdet!=null ? ' · adet '+x.sAdet+'/'+x.bAdet : ' · adet girilmemiş'} ›</div></div>
              <div class="l-sag" style="color:var(--hata);font-weight:800">${tl(x.fark)}</div>
            </div>`;}).join('')}
      ${farkli.some(x=>x.sAdet==null) ? `<div class="ipucu">Bazı günlerde Z'deki kart
        <b>işlem adedi</b> girilmemiş. Adet girilirse fark "kaç işlem" olduğunu da söyler —
        03.08.2026'daki farkı bulan şey buydu.</div>` : ''}
      <div id="bmSonuc"></div>
      <button class="btn" style="margin-top:12px" id="bmKaydet" onclick="bankaMutabakatKaydet()">Mutabakatı Kaydet</button>`;
    mesaj('bmMsg','ok', `${p.gunluk.length} gün okundu · ${farkli.length} günde fark. Kontrol edip kaydet.`);
  }catch(e){
    mesaj('bmMsg','hata','PDF okunamadı: ' + hataTr(e.message));
  }finally{
    btn.disabled = false; btn.textContent = "PDF'i Analiz Et";
  }
}

async function bankaMutabakatKaydet(){
  if (!MT_SON){ mesaj('bmMsg','hata','Önce PDF analiz edilmeli.'); return; }
  const o = MT_SON.ozet;
  const kesintiToplam = Math.abs((o.komisyon||0) + (o.maxipuan||0) + (o.okc_ucret||0));
  /* Bu donemin mutabakati daha once kaydedilmis mi — "uzerine yazilir" diye
     genel uyari vermek yerine, gercekten varsa soyle. */
  const { data: onceki } = await sb.from('banka_mutabakat')
    .select('created_at').eq('sube_id', AKTIF_SUBE).eq('donem', MT_SON.donem)
    .eq('is_deleted', false).maybeSingle();

  if (!confirm(`${ayAdi(MT_SON.donem)} POS mutabakatı kaydedilecek.\n\n`
    + `Banka toplam satış  ${tl(o.toplam_satis)}\n`
    + `Kesintiler          ${tl(o.kesinti_toplam)}\n`
    + `Gün sayısı          ${MT_SON.gunluk.length}\n\n`
    + (onceki
        ? `Bu dönem ${new Date(onceki.created_at).toLocaleDateString('tr-TR')} tarihinde `
          + `bir kez kaydedilmişti; yenisi onun yerine geçecek.\n\n`
        : '')
    + `Devam edilsin mi?`)) return;

  /* ===== Y35 · POS EKSTRESI ARTIK SAKLANIYOR =====
     KULLANICI (13 Eylul): "sisteme yüklediğim POS ekstresi nerde,
     indirip bakmak istiyorum".
     OLCULDU: PDF `pdfMetinCikar` ile YERELDE okunuyor, rakamlar
     cikariliyor ve BELGE ATILIYORDU — `p_pdf: null` SABIT yaziliydi.
     Oysa `rpc_mutabakat_kaydet` p_pdf'i `pdf_path`e YAZIYOR; sunucu
     tarafi eksiksizdi, kullanilmiyordu. Sistemde belgesi saklanmayan
     TEK kayit buydu — ustelik mali mutabakatin DAYANAGI olan belge.
   ⚠ YUKLEME KAYDET ANINDA, ANALIZ ANINDA DEGIL. Olculdu: analiz yalniz
     `#bmSonuc`u yeniden yaziyor, `#bmPdf` girdisi AYAKTA kaliyor ve
     dosyayi hala tutuyor. Boylece analiz edilip KAYDEDILMEYEN dosya
     depoya cop birakmiyor; onay kutusundan SONRA yuklendigi icin
     vazgecilen kayit da iz birakmiyor.
   ⚠ HATA YOLU EVIN KALIBI: dort yukleme yeri de (mfFoto, gdFoto,
     alFoto, voFoto) ayni sekilde davraniyor — hata yaz, dugmeyi geri
     ver, KAYDETME. Belgesiz kaydedilen bir mutabakat, duzeltmeye
     calistigimiz denetlenemezligin ta kendisi olurdu.
   ⚠ KLASOR ADI: mevcut adlar olculdu — `z` · `fatura` · `vergi`.
     POS ekstresi bunlarin hicbiri degil; `mutabakat` eklendi. */
  const bmBtn = document.getElementById('bmKaydet');
  const bmAsil = bmBtn ? bmBtn.textContent : 'Mutabakatı Kaydet';
  if (bmBtn){ bmBtn.disabled = true; bmBtn.textContent = 'Ekstre yükleniyor...'; }
  let pdfYol = null;
  try { pdfYol = await fotoYukle('bmPdf', 'mutabakat'); }
  catch(e){ mesaj('bmMsg','hata', hataTr(e.message));
            if (bmBtn){ bmBtn.disabled = false; bmBtn.textContent = bmAsil; } return; }
  if (bmBtn) bmBtn.textContent = bmAsil;   /* rpcCagir gercek etiketi gorsun */

  const data = await rpcCagir('rpc_mutabakat_kaydet', {
    p_idem: idem(), p_sube: AKTIF_SUBE, p_donem: MT_SON.donem,
    p_gunluk: MT_SON.gunluk, p_ozet: o, p_pdf: pdfYol, p_isyeri: MT_SON.isyeri
  }, 'bmKaydet', 'bmMsg', null);
  if (!data || !data.ok) return;

  /* Kaydedildi bilgisi kucuk bir satirda kaliyordu ve hemen ardindan gelen
     ikinci soru kutusunun altinda gozden kaciyordu. Artik sonucu ekranin
     ustune yaz ve oraya kaydir — "ne oldu bilmiyorum" durumu kalmasin. */
  const sonucKutu = document.getElementById('bmSonuc');
  if (sonucKutu){
    sonucKutu.innerHTML = `<div class="${data.durum === 'uyumlu' ? 'bilgi-not' : 'uyari-orta'}"
        style="margin:10px 0">
      <b>${ayAdi(MT_SON.donem)} mutabakatı kaydedildi ✓</b><br>
      ${data.durum === 'uyumlu'
        ? 'Bütün günler tutuyor — banka ile sistem arasında fark yok.'
        : data.tutmayan_gun + ' günde fark var. Aşağıdaki listeden güne dokunup Z raporuna bakabilirsin.'}
      <span class="k" style="display:block;margin-top:4px">${new Date().toLocaleString('tr-TR')}</span>
    </div>`;
    sonucKutu.scrollIntoView({ block:'center', behavior:'smooth' });
  }
  mesaj('bmMsg','ok', `Mutabakat kaydedildi · ${data.durum === 'uyumlu'
    ? 'bütün günler tutuyor ✓' : data.tutmayan_gun + ' günde fark var'}`);

  /* Mukerrer uyarisini kullaniciya "sen kontrol et" diye birakmak yanlisti —
     sistem zaten bakabilir. O ayda POS komisyonu/OKC gideri var mi, say. */
  const ayBas = MT_SON.donem + '-01', aySonu = aySon(MT_SON.donem);
  const { data: mevcutGider } = await sb.from('gider')
    .select('tutar, aciklama, gider_kategori(ad)')
    .eq('sube_id', AKTIF_SUBE).eq('is_deleted', false)
    .gte('tarih', ayBas).lte('tarih', aySonu);
  const benzer = (mevcutGider||[]).filter(g =>
    ['POS Komisyon','ÖKC/POS Ücreti'].includes(g.gider_kategori?.ad)
    || /komisyon|ökc|okc/i.test(g.aciklama||''));
  const benzerToplam = benzer.reduce((a,g)=>a + +g.tutar, 0);

  if (kesintiToplam > 0 && confirm(
      `Bankanın kestiği ${tl(kesintiToplam)} gider olarak kaydedilsin mi?\n\n`
    + `Komisyon          ${tl(Math.abs(o.komisyon||0))}\n`
    + `Maxipuan          ${tl(Math.abs(o.maxipuan||0))}\n`
    + `ÖKC cihaz ücreti  ${tl(Math.abs(o.okc_ucret||0))}\n\n`
    + (benzer.length
        ? `DİKKAT — bu ay zaten ${benzer.length} benzer gider kayıtlı `
          + `(toplam ${tl(benzerToplam)}):\n`
          + benzer.slice(0,4).map(g => '  · ' + tl(g.tutar) + ' — '
              + String(g.aciklama||'').slice(0,45)).join('\n')
          + `\n\nEklersen MÜKERRER olur. Emin değilsen İPTAL et.\n\n`
        : `Bu ay için henüz komisyon gideri kaydı yok — ekleme güvenli.\n\n`)
    + `Kaydedilsin mi?`)){
    const kat = KATALOG.kategoriler.find(k=>k.ad==='POS Komisyon')
             || KATALOG.kategoriler.find(k=>k.ad==='Diğer');
    /* RPC sonucu eskiden TAMAMEN atılıyordu: gider yazılmasa da mutabakat
       "tamam" sanılıyordu. Kategori bulunamazsa da sessizce hiçbir şey
       olmuyordu. İkisi de artık kullanıcıya söyleniyor. */
    if (!kat){
      bildir('Gider kaydedilemedi: "POS Komisyon" ya da "Diğer" kategorisi bulunamadı.\n\n'
        + 'Kesinti GİDERE YAZILMADI. Yönetim ekranından kategoriyi ekleyip tekrar dene.', 'hata');
      return;
    }
    /* ⚠ KARARLI ANAHTAR. idem() her cagrida YENI anahtar uretiyordu; sunucu
       anahtari islem_log'da arar ve hep yeni oldugu icin ASLA bulamazdi —
       koruma kod olarak vardi, davranis olarak yoktu. Alanlar 2775'teki
       dogru ornekle ayni desen: sube + tarih + kategori + tutar.
       ⚠ p_aciklama ANAHTARA GIRMEZ: serbest metin, icinde donem ve isyeri
         var; tek harf degisse anahtar degisir ve koruma bosa cikardi. */
    const { error: komErr } = await sb.rpc('rpc_gider_kaydet', {
      p_idem: await idemKararli('gider',[AKTIF_SUBE, aySon(MT_SON.donem), kat.id, kesintiToplam, 'banka']),
      p_sube: AKTIF_SUBE,
      p_tarih: aySon(MT_SON.donem), p_kategori: kat.id,
      p_aciklama: 'Banka kesintisi (' + MT_SON.donem + ') · komisyon + maxipuan + ÖKC · işyeri ' + (MT_SON.isyeri||''),
      p_tutar: kesintiToplam, p_kdv_orani: null, p_kdv_tutar: 0,
      p_foto: null, p_kasadan: false, p_tedarikci: null, p_arac: null });
    if (komErr){
      bildir('Gider KAYDEDİLEMEDİ: ' + hataTr(komErr.message) + '\n\n'
        + 'Banka kesintisi giderlere YAZILMADI — mutabakat eksik. Tekrar dene.', 'hata');
      return;
    }
    alert('Banka kesintisi gidere kaydedildi ✓');
  }
}
/* ==================================================================
   ⚠ CQ · ÖDENEN VERGİLER ARTIK DÖNEME GÖRE GRUPLU (DESEN ŞABLONU)
   Bu yapı sonra giderlere ve tedarikçi ödemelerine taşınacak.

   ⚠ GRUPLAMA ÖLÇÜTÜ ÖDEME TARİHİ DEĞİL, DÖNEM. Temmuzun KDV'si
     26.08'de ödenmiş olsa da "Temmuz 2026" altında durur; ödeme
     tarihi satırın içinde yazar. Ölçülen kusur buydu: haziran
     dönemi primi temmuza yazılmış ve düz listede fark edilmemişti.

   ⚠ VADENİN DÖNEMİ ÖLÇÜLDÜ, VARSAYILMADI: vade tablosunda
     "donem text" sütunu VAR (taban şeması) ve v_vade_liste onu
     dışarı veriyor. NULL olabilir — o vadeler bir aya SIKIŞTIRILMAZ,
     "Dönemi belirsiz" başlığı altında ayrı durur.

   ⚠ DÖNEMİ AY OLMAYAN KAYIT: gelir vergisinin dönemi "2025"
     (yıllık). Bir aya sıkıştırılmaz, "2025 · yıllık" başlığıyla
     kendi grubunda durur.

   ⚠ YIL SÜZGECİ: ödemeler ÖDEME TARİHİNE göre süzülür (süzgecin
     anlamı "bu yıl ödediklerin"), sonra DÖNEME göre gruplanır.
     Böylece 2026'da ödenen 2025 gelir vergisi ekranda kalır.
     ⚠ ESKİ KUSUR: bu fonksiyon yılı bugun()'dan alıyordu, VG_YIL'i
       hiç okumuyordu — süzgeç değiştirilince liste değişmiyordu. */
function vgGrupAc(btn, id){
  const k = document.getElementById(id); if (!k) return;
  const acildi = k.hidden; k.hidden = !acildi;
  btn.setAttribute('aria-expanded', String(acildi));
  const ok = btn.querySelector('.vg-ok'); if (ok) ok.textContent = acildi ? '▾' : '▸';
}

               Yanında "Sil" dururken insan kaydı düzenleyeceğini sanıyordu —
               sahip de ben de yanıldık. Ad artık ne yaptığını söylüyor. */

function vgVadeSatiri(v){

async function vergiOdenenYukle(){
  const el = document.getElementById('voListe'); if(!el) return;
  const yil = VG_YIL || bugun().slice(0,4);
  const [od, vd] = await Promise.all([
    sb.from('vergi_odeme').select('*').eq('is_deleted',false)
      .gte('odeme_tarihi', yil+'-01-01').lte('odeme_tarihi', yil+'-12-31')
      .order('odeme_tarihi',{ascending:false}).limit(300),
    sb.from('v_vade_liste')
      .select('id,tur,donem,aciklama,vade_tarihi,tutar,durum,gecti,yakin,kalan_gun')
      .neq('durum','odendi').neq('durum','iptal').order('vade_tarihi').limit(300)
  ]);
  if (od.error){ el.innerHTML = `<div class="uyari-agir">Liste yüklenemedi: ${esc(hataTr(od.error.message))}</div>`; return; }
  const odemeler = od.data || [];
  /* ⚠ vd.error EKRANI DÜŞÜRMEZ: ödemeler görünmeye devam etsin,
     yalnız açık vade satırları çıkmasın — ve bu SÖYLENSİN. */
  const vadeler = vd.error ? [] : (vd.data || []);

  const AY = /^\d{4}-\d{2}$/, YILD = /^\d{4}$/;
  const anahtar = (d) => { const s = String(d == null ? '' : d).trim();
    return AY.test(s) || YILD.test(s) ? s : '__yok'; };
  const G = new Map();
  const grup = (k) => { let g = G.get(k);
    if (!g){ g = { k, odeme:[], vade:[] }; G.set(k, g); } return g; };
  odemeler.forEach(v => grup(anahtar(v.donem)).odeme.push(v));
  vadeler.forEach(v => {
    const k = anahtar(v.donem);
    /* Dönemi olan vade YIL SÜZGECİNE dönemiyle girer; dönemi olmayan
       vade kaybolmasın diye vade tarihinin yılına bakılır ve
       "Dönemi belirsiz" grubuna düşer. */
    if (k === '__yok'){ if (String(v.vade_tarihi).slice(0,4) === yil) grup('__yok').vade.push(v); }
    else if (k.slice(0,4) === yil) grup(k).vade.push(v);
  });

  const buDonem = bugun().slice(0,7);
  const siraliK = [...G.keys()].sort((a,b) =>
    a === '__yok' ? 1 : b === '__yok' ? -1 : (a < b ? 1 : a > b ? -1 : 0));
  const baslik = (k) => k === '__yok' ? 'Dönemi belirsiz'
                : YILD.test(k) ? k + ' · yıllık' : ayAdi(k);
  const yilToplam = odemeler.reduce((a,x) => a + +x.tutar, 0);

  el.innerHTML = (siraliK.length === 0
    ? '<div class="bilgi-not">' + esc(yil) + ' yılında vergi ödemesi kaydı ve açık vade yok.</div>'
    : siraliK.map((k, i) => {
        const g = G.get(k);
        const top = g.odeme.reduce((a,x) => a + +x.tutar, 0);
        const id = 'vgGrup' + i;
        const acik = k === buDonem;
        return `<button type="button" class="serit-ozet-vg" aria-expanded="${acik}" aria-controls="${id}"
            onclick="vgGrupAc(this,'${id}')"
            style="display:flex;align-items:center;gap:10px;width:100%;text-align:left;
                   background:var(--kart);border:1.5px solid var(--cizgi);border-radius:12px;
                   padding:9px 12px;margin:8px 0 0;min-height:44px;cursor:pointer">
            <span class="vg-ok" style="color:var(--soluk)">${acik ? '▾' : '▸'}</span>
            <span style="flex:0 1 auto;min-width:0;font-weight:800">${esc(baslik(k))}</span>
          <span style="flex:1;min-width:0"></span>
            <span class="k" style="text-align:right;min-width:0">ödenen ${tl(top)}<br>açık ${g.vade.length}</span>
          </button>
          <div id="${id}" ${acik ? '' : 'hidden'} style="padding:2px 0 6px">
            ${g.odeme.length ? g.odeme.map(vgOdemeSatiri).join('')
              : '<div class="bilgi-not">Bu dönem için ödeme kaydı yok.</div>'}
            ${g.vade.length ? '<div class="bilgi-not" style="margin:8px 0 2px"><b>Ödenmemiş vadeler</b></div>'
              + g.vade.map(vgVadeSatiri).join('') : ''}
          </div>`;
      }).join(''))
    + `<div class="liste-satir" style="margin-top:8px"><div style="font-weight:800">${esc(yil)} YILI TOPLAM</div>

/* v117 · VERGI ODEMESI SILME
   ⚠ NEDEN VAR: sistemdeki TEK modul buydu — kredi/kart/maden/cek/
     gider/sahis hepsinde gerekceli soft delete var, vergi_odeme'de
     yoktu. Yanlis tutarla ya da yanlis turle girilen bir odeme
     KALICIYDI.
   ⚠ ONAY EKRANI NE SILINDIGINI YAZAR: tur, donem, tutar, tarih.
     "Bu kaydı sil?" diye soran bir pencere, listede yanlis satira
     basildigini FARK ETTIRMEZ.
   ⚠ VADE GERI ACILIRSA SOYLENIR: sunucu acilan vadeleri geri
     donduruyor; kullanici "sildim, peki vade ne oldu" diye merak
     etmesin. Sessiz yan etki, yan etkinin en kotusudur.
   ⚠ AY KILIDI: donemi kapali bir odeme silinemez (trg_donem_kilidi
     UPDATE'te de calisiyor, AY_KAPALI firlatir). hataTr bunu zaten
     ceviriyor — ayrica ele alinmadi, dogru mesaj kendiliginden cikar. */
async function vergiOdemeSil(id, turAd, donem, tutarMetni, tarih){
  const btn = document.getElementById('vosil_' + id);
  if (btn && btn.disabled) return;

  const neden = await nedenSor('Bu vergi ödemesi neden siliniyor?',
    'Gerekçe zorunlu, en az 10 karakter ve kayda geçer (denetim izine yazılır).\n'
    + 'Örnek: "dekont toplamı girilmiş, içindeki damga vergisi ayrı kayıt olmalıydı"', 10);
  if (!neden || neden.trim().length < 10){
    if (neden !== null) bildir('Gerekçe en az 10 karakter olmalı — silinmedi.', 'hata');
    return;
  }
  if (!await onaySor('Vergi ödemesi silinecek (geri alınabilir işaretleme, veri kaybolmaz).',
        turAd + ' · ' + donem + ' dönemi\n'
        + 'Tutar: ' + tutarMetni
        + (tarih ? '\nÖdeme tarihi: ' + new Date(tarih+'T00:00').toLocaleDateString('tr-TR') : '')
        + '\n\nBu ödemenin kapattığı bir vade varsa YENİDEN AÇILIR.\n\nDevam?', 'Sil')) return;

  if (btn){ btn.disabled = true; btn.textContent = '…'; }
  const { data, error } = await sb.rpc('rpc_vergi_odeme_sil', { p_id:id, p_neden:neden.trim() });
  if (error){
    if (btn){ btn.disabled = false; btn.textContent = 'Sil'; }
    bildir('Silinemedi: ' + hataTr(error.message), 'hata');
    return;
  }
  /* Acilan vadeler ADIYLA soylenir — "bir vade acildi" demek yetmez,
     hangisi oldugunu bilmeden kullanici onu arayamaz. */
  const acikOlanlar = ((data && data.acilan_vadeler) || []).filter(v => v.durum === 'acik');
  /* ⚠ TAM YENIDEN CIZIM (giderSil -> vGider kalibi). Yalniz listeyi
     tazelemek YETMEZ: "Ne Kadar Nereye" dagilimi, yil toplami ve ust
     ozet kartlari vVergi icinde hesaplaniyor; onlar tazelenmezse
     silinen tutar toplamlarda DURMAYA DEVAM EDER ve ekran kendi
     icinde celisir. Mesaj da bu yuzden mesaj() degil bildir() —
     yeniden cizim mesaj() kutusunu silerdi. */
  /* ⚠ SIRA: ONCE cizim, SONRA bildirim. Tersi olculdu ve mesaj EKRANA
     HIC GELMEDI: bildir() kutuyu #icerik icine koyuyor, vVergi() ise
     ilk isi olarak #icerik'i "Yükleniyor..." ile eziyor. Vadenin geri
     acildigini soyleyen tek cumle boylece kayboluyordu. */
  await vVergi();
  bildir('Vergi ödemesi silindi ✓'
    + (acikOlanlar.length
        ? ' · ' + acikOlanlar.map(v =>
            new Date(v.vade_tarihi+'T00:00').toLocaleDateString('tr-TR') + ' '
            + (v.aciklama || vergiAd(v.tur))).join(', ') + ' vadesi yeniden açıldı'
        : ''), 'ok');
}
/* AY KAPATMA
   Eskiden kapanış hiçbir şey denetlemiyordu: eksik gün, sayılmamış kasa,
   yapılmamış mutabakat — hiçbiri engel değildi, kilit simgesi boş bir güvence
   veriyordu. Üstelik KDV rakamı BURADAN, tarayıcıdan gidiyordu.
   Artık kontrol de KDV de sunucuda. Ekran yalnız sonucu gösterir. */
async function ayKapat(zorlaNeden){
  const donem = document.getElementById('akDonem').value;
  if (!donem){ mesaj('akMsg','hata','Dönem seçilmedi.'); return; }
  const { data, error } = await sb.rpc('rpc_ay_kapat_v2',
    { p_sube: AKTIF_SUBE, p_donem: donem, p_zorla_neden: zorlaNeden || null });
  if (error){ mesaj('akMsg','hata', hataTr(error.message)); return; }

  if (data && data.ok === false){
    const engel = (data.kontrol?.engel) || [];
    mesaj('akMsg','hata', data.mesaj || 'Ay kapatılamadı.');
    const el = document.getElementById('akDurum');
    if (el) el.innerHTML = akKontrolCiz(data.kontrol, donem);
    // Zorlama yalnız gerekçeyle
    /* ⚠ Y20 · ONAY KUTUSU DUZ METIN: oraya HTML ya da nesne BASILAMAZ.
         akMesaj olmadan nesne gonderirsek "[object Object]" cikar. */
    if (await onaySor(`${donem} KAPATILAMADI`,
      engel.map(x => '• ' + akMesaj(x)).join('\n')
      + `\n\nBunları düzeltmeden kapatmak istiyorsan gerekçe yazman gerekiyor.\n`
      + `Gerekçe kayda geçer ve silinemez.\n\nZorlamak istiyor musun?`, 'Zorla kapat')){
      const neden = await nedenSor('Neden bu kontroller tamamlanmadan kapatıyorsun?', null, 10);
      if (neden && neden.trim().length >= 10) return ayKapat(neden.trim());
      bildir('Gerekçe en az 10 karakter olmalı — kapatma yapılmadı.', 'hata');
    }
    return;
  }
  mesaj('akMsg','ok', `${donem} kapatıldı ✓${data.zorlandi ? ' (ZORLANDI — gerekçe kayıtlı)' : ''}`
    + ` · KDV ${tl(data.kdv_tahmini)}`);
  vYonetim();
}
async function ayAc(){
  const donem = document.getElementById('akDonem').value;

  vYonetim();
}
/* ===== Y20 · AY KAPANIS SATIRLARI TIKLANABILIR =====
   KULLANICININ SORUSU (10 Eylul): "bu uyarilari tikladigimda neden
   sorunlarin oldugu yerler acilmiyor, uyarinin anlami ne o zaman"
   SEBEP OLCULDU: sunucu bu satirlari DUZ CUMLE gonderiyordu; satirin
   TURU ekrana hic ulasmiyordu, o yuzden nereye goturecegi BILINEMIYORDU.
   Unutulmus bir onclick DEGILDI.
   ⚠ COZUM v126'nin AYNISI: sunucu yapi gonderir, ekran metin ayiklamaz.
     Ayni iki-faz sirasi — ONCE bu dosya yayinlanir, SONRA migration.
   ⚠ BU SURUM IKISINI DE ANLAR: satir duz metinse bugunku gibi yazilir,
     nesneyse mesaji yazilir ve kodu varsa hedefe baglanir. Gecis
     penceresinde eski sunucu duz cumle gonderiyor olacak. */
const akMesaj = x => (x && typeof x === 'object') ? String(x.mesaj ?? '') : String(x ?? '');
const akKod   = x => (x && typeof x === 'object') ? (x.kod || null) : null;
/* ⚠ HEDEFLER OLCULDU, UYDURULMADI. Gecerli sekme adlari SEKMELER_TUM'den:
     ozet · gunsonu · gider · borc · tedarikci · personel · talep · arac ·
     vergi · belge · yonetim · stok
   ⚠ UC SATIR AYNI EKRANDA: ay kapanis karti da banka mutabakat karti da
     YONETIM ekraninda (vYonetim ikisini de ciziyor). Oraya "sekme ac"
     demek hicbir sey yapmaz — o satirlar ilgili KARTA kaydirilir.
   ⚠ sayim_yok'un HEDEFI YOK ve bu BILEREK: kullanici karari geregi
     aylik sayim YAPILMAYACAK, yani gidip yapilacak bir is yok.
     Gidecegi olmayan dugme YALAN SOYLER (dosyanin M3 kurali) — orada
     dugme degil "—" cikar. */
const AK_HEDEF = {
  eksik_gun:        { git:"sekmeAc('gunsonu')",            etiket:'Gir' },
  kasa_sayilmadi:   { git:"sekmeAc('gunsonu')",            etiket:'Gir' },
  mutabakat_yok:    { git:"akKarta('bankaMutabakatKart')", etiket:'Aç' },
  mutabakat_farkli: { git:"akKarta('bankaMutabakatKart')", etiket:'Aç' },
  belge_eksik:      { git:"sekmeAc('belge')",              etiket:'Gör' },
  acik_talep:       { git:"sekmeAc('talep')",              etiket:'Gör' }
};
/* Ayni ekrandaki karta kaydirir — dosyanin mevcut kalibi
   (scrollIntoView block:'center', bkz. klavye ve dosya birakma).
   ⚠ behavior:'smooth' DEGIL 'auto' — OLCUM ZORLADI. Olculdu: ayni oge
     uzerinde smooth ile scrollY 0'da KALIYOR (2.5 sn beklendi), auto
     ile 0 -> 2147 gidiyor. Sebep ortam (yumusak kaydirma animasyon
     karesine bagli) ama sonuc su: SMOOTH'U DOGRULAYAMIYORUM. Dogrulanamaz
     bir kaydirma, hicbir sey yapmayan bir satir riski demek — dosyanin
     kendi kurali: gidecegi olmayan dugme YALAN SOYLER.
   ⚠ Ayrica TUTARLI: oteki bes satir sekme degistiriyor, o da anlik. */
function akKarta(id){
  const e = document.getElementById(id);
  if (e) e.scrollIntoView({ block:'center', behavior:'auto' });
}
const akSatir = (x) => {
  const h = AK_HEDEF[akKod(x)];
  return `<div class="uy-sr"${h ? ` onclick="${h.git}"` : ' style="cursor:default"'}>
    <span class="uy-mt" style="flex:1">• ${esc(akMesaj(x))}</span>
    <span class="k" style="flex:none">${h ? esc(h.etiket) + ' ›' : '—'}</span>
  </div>`;
};
/* ⚠ GECIS PENCERESINDE CIKTI BIREBIR AYNI KALIR. Sunucu henuz kod
     gondermiyorsa hicbir satirin hedefi olamaz; o zaman satir DUZENI
     de degismez — bugunku madde listesi aynen cizilir.
   OLCULDU: once her satira "—" koyup 44px'lik satira cevirmistim;
     gecis penceresinde ciktı BIREBIR AYNI degildi (her satirin sonuna
     "—" ekleniyordu). Kod gelmeden duzen de degismemeli.
   ⚠ Kod GELDIGINDE hedefi olmayan satir (sayim_yok) "—" gosterir —
     orada bu DOGRU: gidilecek yer gercekten yok. */
const akListe = (arr) => arr.some(akKod)
  ? arr.map(akSatir).join('')
  : '<br>' + arr.map(x => '• ' + esc(akMesaj(x))).join('<br>');
function akKontrolCiz(k, donem){
  if (!k) return '';
  const engel = k.engel || [], uyari = k.uyari || [];
  return `<div style="margin-top:10px">
    ${engel.length
      ? `<div class="uyari-agir"><b>Kapanışı engelleyen ${engel.length} şey:</b>`
        + akListe(engel) + '</div>'
      : '<div class="bilgi-not">Zorunlu kontrollerin hepsi tamam.</div>'}
    ${uyari.length
      ? `<div class="uyari-orta"><b>Kapatır ama eksik kalır:</b>`
        + akListe(uyari) + '</div>' : ''}
    <div class="ipucu">Bu ayın KDV'si (sunucu hesabı): <b>${tl(k.kdv_tahmini||0)}</b></div>
  </div>`;
}
async function akDurumGoster(){

/* ⚠ IKI TUKETICI VAR: (1) arsiv PDF basligi — jsPDF standart fontu
     Turkce harf basamiyor; (2) Belgeler aramasi (`bgCiz` icindeki
     `bgDesen`) — ASCII yazip Turkce harfli basligi bulmak buna bagli.
     Harf eslemesi degistirilirse ARAMA da degisir. */
function trDuz(s){ // jsPDF standart fontu Türkçe karakter basamıyor — güvenli çevrim
  return String(s||'').replace(/ğ/g,'g').replace(/Ğ/g,'G').replace(/ü/g,'u').replace(/Ü/g,'U')
    .replace(/ş/g,'s').replace(/Ş/g,'S').replace(/ı/g,'i').replace(/İ/g,'I')
    .replace(/ö/g,'o').replace(/Ö/g,'O').replace(/ç/g,'c').replace(/Ç/g,'C');
}
async function arsivPdf(){
  const ayS = document.getElementById('arsivAy').value;
  if (!ayS){ mesaj('arsivMsg','hata','Ay seçilmedi.'); return; }
  const btn = document.getElementById('arsivBtn');
  btn.disabled = true; btn.textContent = 'Belgeler toplanıyor...';
  try{
    const bas = ayS + '-01', son = ayS + '-31';
    const [gs, al, gd] = await Promise.all([
      sb.from('gun_sonu').select('tarih,z_no,z_foto_path,pos_slip_foto_path,gun_sonu_kasa(kasa_no,sira,z_no,z_foto_path,pos_slip_foto_path,is_deleted)').gte('tarih',bas).lte('tarih',son).eq('is_deleted',false).order('tarih'),
      sb.from('alis').select('tarih,toplam,foto_path,tedarikci(ad)').gte('tarih',bas).lte('tarih',son).eq('is_deleted',false).order('tarih'),
      sb.from('gider').select('tarih,tutar,foto_path,gider_kategori(ad)').gte('tarih',bas).lte('tarih',son).eq('is_deleted',false).order('tarih')
    ]);
    const ogeler = [];
    for (const g of (gs.data||[])){
      const ks = (g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted)
        .sort((a,b)=>a.kasa_no-b.kasa_no || (a.sira||1)-(b.sira||1));
      if (ks.length){
        for (const k of ks){
          // Aynı kasadan o gün birden fazla Z varsa sırayı da yaz (muhasebe hangisi olduğunu görsün)
          const sr = zCok(ks,k.kasa_no) ? ` — ${k.sira||1}. Z` : '';
          if (k.z_foto_path) ogeler.push({ b:`Z RAPORU — ${g.tarih} — KASA ${k.kasa_no}${sr}${k.z_no?' — Z No: '+k.z_no:''}`, p:k.z_foto_path });
          if (k.pos_slip_foto_path) ogeler.push({ b:`POS SLIP — ${g.tarih} — KASA ${k.kasa_no}${sr}`, p:k.pos_slip_foto_path });
        }
      } else { // eski tek kasalı kayıtlar
        if (g.z_foto_path) ogeler.push({ b:`Z RAPORU — ${g.tarih}${g.z_no?' — Z No: '+g.z_no:''}`, p:g.z_foto_path });
        if (g.pos_slip_foto_path) ogeler.push({ b:`POS SLIP — ${g.tarih}`, p:g.pos_slip_foto_path });
      }
    }
    for (const a of (al.data||[])) if (a.foto_path)
      ogeler.push({ b:`ALIS — ${a.tarih} — ${a.tedarikci?.ad||''} — ${tl(a.toplam)}`, p:a.foto_path });
    for (const x of (gd.data||[])) if (x.foto_path)
      ogeler.push({ b:`GIDER — ${x.tarih} — ${x.gider_kategori?.ad||''} — ${tl(x.tutar)}`, p:x.foto_path });
    // PDF belgeler bu birleştirmeye giremez (jsPDF yalnız görsel ekler) — ayrı say ve söyle
    const pdfBelgeler = ogeler.filter(o => /\.pdf$/i.test(o.p));
    const gorseller   = ogeler.filter(o => !/\.pdf$/i.test(o.p));
    ogeler.length = 0; ogeler.push(...gorseller);
    if (ogeler.length === 0){
      mesaj('arsivMsg','hata', pdfBelgeler.length
        ? `Bu ayda ${pdfBelgeler.length} belge var ama hepsi PDF — PDF'ler zaten tek tek dosya, birleştirmeye gerek yok. Listeden "Belge" ile açabilirsin.`
        : 'Bu ayda fotoğraflı belge yok.');
      return;
    }

    const pdf = new window.jspdf.jsPDF({ unit:'mm', format:'a4' });
    let ilk = true, eklenen = 0;
    for (let i = 0; i < ogeler.length; i++){
      btn.textContent = `Hazırlanıyor ${i+1}/${ogeler.length}...`;
      const { data: dosya, error } = await sb.storage.from('belgeler').download(ogeler[i].p);
      if (error || !dosya) continue;
      const url = URL.createObjectURL(dosya);
      const img = await new Promise(r=>{ const im=new Image(); im.onload=()=>r(im); im.onerror=()=>r(null); im.src=url; });
      if (img){
        if (!ilk) pdf.addPage();
        ilk = false; eklenen++;
        pdf.setFontSize(11); pdf.text(trDuz(ogeler[i].b), 10, 12);
        const enOran = Math.min(190/img.width, 265/img.height);
        pdf.addImage(img, ogeler[i].p.endsWith('.png')?'PNG':'JPEG', 10, 18,
          Math.round(img.width*enOran), Math.round(img.height*enOran));
      }
      URL.revokeObjectURL(url);
    }
    if (eklenen === 0){ mesaj('arsivMsg','hata','Belgeler indirilemedi.'); return; }
    pdf.save(`bardaks-arsiv-${ayS}.pdf`);
    mesaj('arsivMsg','ok', eklenen + ' belge tek PDF olarak indirildi ✓'
      + (pdfBelgeler.length ? ` · ${pdfBelgeler.length} e-Fatura PDF'i ayrı duruyor (listeden "Belge" ile açılır)` : ''));
  }catch(e){
    mesaj('arsivMsg','hata','PDF oluşturulamadı: ' + hataTr(e.message));
  }finally{
    btn.disabled = false; btn.textContent = 'PDF Oluştur ve İndir';
  }
}
async function urunEkle(){

  await katalogYukle();
