   İki kaynaktan gelir ve KARIŞTIRILMAZ:
     · gider           — elektrik, fiş, tüp... (kasadan ödendiyse ayrıca işaretli)
     · tedarikci_odeme — firmaya yapılan ödeme (kart/nakit/havale/çek)
   Eskiden tedarikçi ödemesi yalnız Tedarikçi ekranında, gider yalnız burada duruyordu;
   "bu ay kime ne ödedim" sorusunun tek cevabı yoktu. */
/* KASADAN NAKİT kutusuna dokununca: o ay kasadan çıkan her ödeme — hangi gün, ne için.
   Bu para elindeki nakitten çıktığı için o günün kasa sayımı o kadar düşük olur;
   "kasa neden eksik" sorusunun cevabı burada. */
async function kasadanDetay(ay){
  const ov=udKutu(), ic=document.getElementById('udIcerik');
  ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Yükleniyor...</div></div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  ov.classList.add('acik');
  const sonGun=new Date(+ay.slice(0,4), +ay.slice(5,7), 0).getDate();
  const bas=ay+'-01', son=ay+'-'+String(sonGun).padStart(2,'0');
  const [gd, td] = await Promise.all([
    sb.from('gider').select('tarih,tutar,aciklama,gider_kategori(ad)')
      .eq('is_deleted',false).eq('kasadan',true).gte('tarih',bas).lte('tarih',son),
    sb.from('tedarikci_odeme').select('tarih,tutar,aciklama,tedarikci(ad)')
      .eq('is_deleted',false).eq('yontem','nakit').gte('tarih',bas).lte('tarih',son)
  ]);
  const bas_=(sag)=>`<div class="ud-ust"><div style="flex:1;min-width:0">
      <div class="ud-kod">KASADAN NAKİT</div><div class="ud-ad">${esc(ayAdi(ay))}</div>${sag||''}</div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  if(gd.error||td.error){
    ic.innerHTML=bas_()+`<div class="ud-govde"><div class="uyari-agir">Yüklenemedi:
      ${esc(hataTr((gd.error||td.error).message))}</div></div>`; return;
  }
  const kayitlar=[
    ...(gd.data||[]).map(x=>({ tarih:x.tarih, tutar:+x.tutar,
      ne: esc(x.aciklama || x.gider_kategori?.ad || 'Gider'),
      tur: esc(x.gider_kategori?.ad || 'Gider') })),
    ...(td.data||[]).map(x=>({ tarih:x.tarih, tutar:+x.tutar,
      ne: esc(x.tedarikci?.ad || 'Tedarikçi') + (x.aciklama?' — '+esc(x.aciklama):''),
      tur: 'Tedarikçi ödemesi' }))
  ].sort((a,b)=> a.tarih<b.tarih?1:a.tarih>b.tarih?-1:0);
  const toplam=kayitlar.reduce((a,x)=>a+x.tutar,0);
  const GUNAD=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

  ic.innerHTML=bas_()+`<div class="ud-govde">
    <div class="ud-kunye" style="grid-template-columns:1fr 1fr">
      <div><div class="ud-et">TOPLAM</div><div class="ud-dg" style="color:var(--uyari)">${tl(toplam)}</div></div>
      <div><div class="ud-et">KAYIT</div><div class="ud-dg">${kayitlar.length}</div></div>
    </div>
    ${kayitlar.length===0
      ? '<div class="ud-bos">Bu ay kasadan nakit ödeme yapılmamış.</div>'
      : kayitlar.map(x=>{
          const d=new Date(x.tarih+'T00:00');
          return `<div class="ud-satir tikla" style="grid-template-columns:44px 1fr auto"
              onclick="gunDetay('${x.tarih}')">
            <div class="ud-trh">${d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}
              <span style="display:block;font-size:10px;font-weight:700">${GUNAD[d.getDay()].slice(0,3)}</span></div>
            <div><div style="font-weight:800;font-size:13px">${x.ne}</div>
              <div class="ud-alt">${x.tur}</div></div>
            <div class="ud-tut">${tl(x.tutar)}</div>
          </div>`;
        }).join('')}
    <div class="bilgi-not" style="margin-top:12px">
      Bu ödemeler <b>elindeki nakitten</b> yapıldı. O günün kasa sayımı bu kadar düşük çıkar —
      satırın üstüne dokunursan o günün gün sonu kaydı açılır.
    </div>
  </div>`;
}
function odKimeDegisti(){
  const diger = document.getElementById('odKime').value === '__diger';
  document.getElementById('odDigerAlan').style.display = diger ? 'block' : 'none';
  document.getElementById('odAciklamaAlan').style.display = diger ? 'none' : 'block';
}
function odYontemDegisti(){
  const y = document.getElementById('odYontem').value;
  document.getElementById('odCekAlan').style.display  = y==='cek'  ? 'block' : 'none';
  // Taksit yalnız kartta olur; başka yöntemde alan gizlenir ve 1'e döner
  document.getElementById('odKartAlan').style.display = y==='kart' ? 'block' : 'none';
  if (y !== 'kart'){ document.getElementById('odTaksit').value = '1'; }
  odTaksitDegisti();
}
function odTaksitDegisti(){
  const n = +document.getElementById('odTaksit').value || 1;
  const alan = document.getElementById('odTaksitTarihAlan');
  alan.style.display = n > 1 ? 'block' : 'none';
  const ozet = document.getElementById('odTaksitOzet');
  if (n < 2){ ozet.textContent = ''; return; }
  const t = paraDeger('odTutar');
  if (!t){ ozet.textContent = 'Tutarı yazınca taksit dökümü burada çıkar.'; return; }
  // Kuruş kaybı olmasın: son taksit farkı alır (görünümdeki hesabın aynısı)
  const bir = Math.round((t/n)*100)/100, son = Math.round((t - bir*(n-1))*100)/100;
  ozet.innerHTML = `Ayda <b>${tl(bir)}</b>${son!==bir?` (son taksit ${tl(son)})`:''} · toplam <b>${tl(t)}</b>.
    Tedarikçinin borcu bugün kapanır; para hesabından ${n} ayda çıkar.`;
}
/* Tek form, iki kayıt yolu:
     firma seçilirse  -> tedarikci_odeme  (bakiyesi düşer)
     "Diğer" seçilirse-> gider            (firma bakiyesi yok, açıklama zorunlu)
   Nakit seçilirse her iki yolda da "kasadan ödendi" işaretlenir — o gün sayılan
   kasa o kadar eksik çıkar ve sistem bunu toplam nakde geri ekler. */
async function odemeGirisiKaydet(){
  const kime = document.getElementById('odKime').value;
  const tutar = paraDeger('odTutar');
  const yontem = document.getElementById('odYontem').value;
  const tarih = document.getElementById('odTarih').value;
  if (tutar === 0){ mesaj('odMsg','hata','Tutar boş olamaz.'); return; }

  if (kime === '__diger'){
    const ne = document.getElementById('odAciklamaDiger').value.trim();
    if (!ne){ mesaj('odMsg','hata','"Diğer" seçtiğinde ne için ödendiğini yazman gerekiyor.'); return; }
    const data = await rpcCagir('rpc_gider_kaydet',{
      p_idem: idem(), p_sube: PROFIL.sube_id, p_tarih: tarih,
      p_kategori: document.getElementById('odKategori').value,
      p_aciklama: ne, p_tutar: tutar,
      p_kdv_orani: null, p_kdv_tutar: 0, p_foto: null,
      p_kasadan: yontem === 'nakit', p_tedarikci: null
    },'odKaydet','odMsg','Ödeme kaydedildi ✓');
    if (data && data.ok){
      document.getElementById('odTutar').value=''; document.getElementById('odAciklamaDiger').value='';
      gdOdeme();
    }
    return;
  }
  const cek = yontem === 'cek';
  const kart = yontem === 'kart';
  const taksit = kart ? (+document.getElementById('odTaksit').value || 1) : 1;
  const taksitIlk = document.getElementById('odTaksitIlk').value || null;
  if (taksit > 1 && !taksitIlk){
    mesaj('odMsg','hata','Taksitli ödemede ilk taksitin çıkacağı tarihi seç — yoksa nakit takvimi yanlış olur.');
    return;
  }
  const data = await rpcCagir('rpc_tedarikci_odeme_kaydet',{
    p_idem: idem(), p_sube: PROFIL.sube_id, p_tedarikci: kime, p_tarih: tarih, p_tutar: tutar,
    p_aciklama: document.getElementById('odAciklama').value.trim()||null,
    p_yontem: yontem,
    p_cek_no: cek ? (document.getElementById('odCekNo').value.trim()||null) : null,
    p_cek_vade: cek ? (document.getElementById('odCekVade').value||null) : null,
    p_taksit: taksit,
    p_taksit_ilk: taksit > 1 ? taksitIlk : null,
    p_banka: kart ? (document.getElementById('odBanka').value.trim()||null) : null
  },'odKaydet','odMsg','Ödeme kaydedildi ✓');
  if (data && data.ok){
    document.getElementById('odTutar').value=''; document.getElementById('odAciklama').value='';
    document.getElementById('odTaksit').value='1'; odTaksitDegisti();
    gdOdeme();
  }
}
/* KART TAKSİT TAKVİMİ — hangi ay ne kadar kart borcu çıkacak.
   Tedarikçi bakiyesiyle ilgisi yok: firma parasını aldı. Bu senin hesabından
   çıkacak paranın takvimi. Geçmiş aylar da görünür ki ekstreyle karşılaştırasın. */
async function taksitTakvimi(){
  const el = document.getElementById('taksitAlan'); if(!el) return;
  const { data, error } = await sb.from('v_kart_taksit')
    .select('firma,banka,odeme_tarihi,toplam_tutar,taksit_sayisi,taksit_no,vade,donem,taksit_tutari')
    .gt('taksit_sayisi', 1).order('vade');
  if (error){ el.innerHTML = `<div class="uyari-agir">Taksitler yüklenemedi: ${esc(hataTr(error.message))}</div>`; return; }
  const list = data||[];
  if (!list.length){
    el.innerHTML = bosDurum('belge','Taksitli ödeme yok',
      'Kartla taksitli ödeme girdiğinde hangi ay ne kadar çıkacağı burada listelenir.');
    return;
  }
  const buAy = bugun().slice(0,7);
  const aylar = {};
  list.forEach(x=>{ (aylar[x.donem] = aylar[x.donem] || []).push(x); });
  const gelecek = list.filter(x=>x.donem >= buAy).reduce((a,x)=>a+ +x.taksit_tutari, 0);
  el.innerHTML = `
    <div class="ozet-kut" style="margin-bottom:12px">

/* ===== AY SONU MUTABAKATI =====
   Personel ay boyunca faturaları tek tek girer. Ay sonunda portaldan inen zip buraya
   bırakılır: sistem her PDF'i okuyup belge numarasından eşleştirir.
     · Girilmiş + belgesiz  -> PDF'i kaydına ekler (arşiv tamamlanır)
     · Girilmemiş           -> listeler, tek tuşla forma taşır
     · Alıcısı biz değiliz  -> ayırır (LTD/şahsi karışmasın)
   Böylece gözden kaçan fatura kalmaz. */
let MUTABAKAT = [];
function gdMutabakat(){
  document.getElementById('gdIcerik').innerHTML = `
    <div class="kart">
      <div class="kbaslik">Ay Sonu Mutabakatı — gözden kaçan fatura kalmasın</div>
      <div class="bilgi-not" style="margin:0 0 8px">Luca portalından indirdiğin <b>zip'i olduğu gibi</b> bırak
        (ya da PDF'leri topluca seç). Sistem her belgeyi okur, numarasından eşleştirir:
        girilmemiş olanları listeler, girilmiş ama belgesi olmayanlara PDF'i ekler.</div>
      <label>Zip veya PDF'ler</label>
      <input type="file" id="mtDosya" accept=".zip,application/zip,application/pdf,.pdf" multiple>
      <button class="btn" id="mtBtn" onclick="mutabakatCalistir()">Belgeleri Oku ve Karşılaştır</button>
      <div class="oku-durum" id="mtDurum"></div>
      <div class="hata-msg" id="mtMsg"></div>
    </div>
    <div id="mtSonuc"></div>`;

async function mutabakatDosyalari(){
  const inp = document.getElementById('mtDosya');
  const secilen = [...(inp?.files || [])];
  if (!secilen.length) throw new Error('Önce zip veya PDF seç.');
  const pdfler = [];
  for (const f of secilen){
    if (/\.zip$/i.test(f.name) || f.type === 'application/zip'){
      if (!window.JSZip) throw new Error('Zip okuyucu yüklenemedi — internet bağlantısını kontrol et.');
      const z = await window.JSZip.loadAsync(f);
      const adlar = Object.keys(z.files).filter(n => /\.pdf$/i.test(n) && !z.files[n].dir);
      for (const n of adlar){
        const blob = await z.files[n].async('blob');
        pdfler.push(new File([blob], n.split('/').pop(), { type:'application/pdf' }));
      }
    } else if (/\.pdf$/i.test(f.name) || f.type === 'application/pdf'){
      pdfler.push(f);
    }
  }
  if (!pdfler.length) throw new Error('Seçilenlerin içinde PDF bulunamadı.');
  return pdfler;
}
async function mutabakatCalistir(){
  const btn = document.getElementById('mtBtn');
  const drm = document.getElementById('mtDurum');
  const yaz = (t,s)=>{ drm.className='oku-durum '+(s||''); drm.textContent=t; };
  btn.disabled = true; MUTABAKAT = [];
  document.getElementById('mtSonuc').innerHTML = '';
  try{
    const pdfler = await mutabakatDosyalari();
    yaz(`${pdfler.length} belge bulundu, okunuyor...`, '');
    for (let i=0; i<pdfler.length; i++){
      const f = pdfler[i];
      yaz(`Okunuyor ${i+1}/${pdfler.length} — ${f.name.slice(0,40)}`, '');
      const kayit = { dosya:f, ad:f.name };
      try{
        const c = await pdfMetinCikar(f);
        kayit.metin = c.metin;
        const t = c.metin;
        // Belge no: önce dosya adından (portal "FATURANO_VKN_FIRMA.pdf" verir), yoksa metinden
        const adNo = (f.name.match(/^([A-Z0-9]{10,20})_/i)||[])[1];
        const metinNo = (t.match(/Fatura\s*No\s*:?\s*([A-Z0-9]{10,20})/i)||[])[1]
                     || (t.match(/FATURA\s*ID\s*:?\s*([A-Z0-9]{10,20})/i)||[])[1];
        kayit.belge_no = (adNo || metinNo || '').toUpperCase() || null;
        // Alıcı kontrolü: şahsın TCKN'si belgede geçiyor mu
        kayit.bizeMi = t.replace(/\D/g,'').includes(KTU_VKN);
        kayit.firma = t.split('\n')[0].slice(0,40);
        kayit.tarih = (t.match(/(?:Fatura\s*)?Tarihi?\s*:?\s*(\d{2}\s?[-.\/]\s?\d{2}\s?[-.\/]\s?\d{4})/i)||[])[1] || null;
      }catch(e){ kayit.hata = e.message; }
      MUTABAKAT.push(kayit);
    }
    // Sistemde ne var: alış belge_no + gider açıklamasındaki belge no
    const nolar = MUTABAKAT.map(x=>x.belge_no).filter(Boolean);
    const [av, gv] = await Promise.all([
      sb.from('alis').select('id,belge_no,tarih,toplam,foto_path,tedarikci(ad)')
        .eq('is_deleted',false).in('belge_no', nolar.length?nolar:['-']),
      sb.from('gider').select('id,aciklama,tarih,tutar,foto_path').eq('is_deleted',false)
    ]);
    // Bilerek girilmeyenler (şahsi harcama vb) "eksik" sayılmasın
    const { data: hd } = await sb.from('belge_haric').select('belge_no,neden').eq('is_deleted',false);
    const haricMap = {}; (hd||[]).forEach(h=>{ haricMap[(h.belge_no||'').toUpperCase()] = h.neden; });
    const alisMap = {}; (av.data||[]).forEach(a=>{ alisMap[(a.belge_no||'').toUpperCase()] = a; });
    const giderler = gv.data || [];
    MUTABAKAT.forEach(x=>{
      if (x.hata){ x.durum='hata'; return; }
      if (!x.bizeMi){ x.durum='baska_alici'; return; }
      if (x.belge_no && haricMap[x.belge_no]){ x.durum='haric'; x.neden=haricMap[x.belge_no]; return; }
      const a = x.belge_no ? alisMap[x.belge_no] : null;
      const g = x.belge_no ? giderler.find(z => (z.aciklama||'').toUpperCase().includes(x.belge_no)) : null;
      const k = a || g;
      if (!k){ x.durum='eksik'; return; }
      x.kayit = k; x.tur = a ? 'alis' : 'gider';
      x.durum = k.foto_path ? 'belgeli' : 'belge_eklenecek';
    });
    yaz(`${MUTABAKAT.length} belge okundu.`, 'ok');
    mutabakatCiz();
  }catch(e){
    yaz('Hata: ' + e.message, 'uyari');
  }finally{ btn.disabled = false; }
}

async function mutabakatBelgeEkle(){
  const liste = MUTABAKAT.filter(x=>x.durum==='belge_eklenecek');

  if (!confirm(`${liste.length} belge kayıtlarına eklenecek.\n\nDevam edilsin mi?`)) return;
  const btn = document.getElementById('mtEkleBtn'); if(btn) btn.disabled = true;
  let ok = 0; const hatalar = [];
  for (const x of liste){
    try{
      const yol = `fatura/${bugun()}_${crypto.randomUUID()}.pdf`;
      const { error: ue } = await sb.storage.from('belgeler')
        .upload(yol, x.dosya, { upsert:false, contentType:'application/pdf' });
      if (ue) throw new Error(ue.message);
      const tablo = x.tur === 'alis' ? 'alis' : 'gider';
      const { error: ge } = await sb.from(tablo).update({ foto_path: yol }).eq('id', x.kayit.id);
      if (ge) throw new Error(ge.message);

    }catch(e){ hatalar.push(`${x.belge_no}: ${hataTr(e.message)}`); }

/* ===== FATURA KDV DÖKÜMÜ — bir belgede birden çok oran olabilir ===== */
let AL_KDV_SAYAC = 0;
function alKdvSatirEkle(oran, matrah, kdv){
  AL_KDV_SAYAC++;
  const n = AL_KDV_SAYAC;
  const kap = document.getElementById('alKdvSatirlari'); if(!kap) return;
  const d = document.createElement('div');
  d.className = 'kdv-satir'; d.id = 'alKdvS_'+n;
  d.innerHTML = `
    <select id="alKdvO_${n}">
      <option value="1"${oran==1?' selected':''}>%1</option>
      <option value="8"${oran==8?' selected':''}>%8</option>
      <option value="10"${(oran==10||!oran)?' selected':''}>%10</option>
      <option value="20"${oran==20?' selected':''}>%20</option>
      <option value="0"${oran===0?' selected':''}>%0</option>
    </select>
    <input type="text" inputmode="decimal" autocomplete="off" id="alKdvM_${n}" placeholder="matrah (KDV hariç)" value="${matrah??''}">
    <input type="text" inputmode="decimal" autocomplete="off" id="alKdvT_${n}" placeholder="KDV tutarı" value="${kdv??''}">
    <button class="sil" onclick="document.getElementById('alKdvS_${n}').remove(); alHesapla();">✕</button>`;
  kap.appendChild(d);
  const tEl = document.getElementById('alKdvT_'+n);
  // Matrah yazılınca KDV hesaplanır; kullanıcı/OCR elle yazdıysa BİR DAHA ÜZERİNE YAZILMAZ
  tEl.addEventListener('input', ()=>{ tEl.dataset.elle = tEl.value.trim()===''?'':'1'; });
  if (kdv !== undefined && kdv !== null && kdv !== '') tEl.dataset.elle = '1';
  const hesapla = ()=>{
    if (tEl.dataset.elle === '1') return;
    const m = paraOku(document.getElementById('alKdvM_'+n)).deger;
    const o = +document.getElementById('alKdvO_'+n).value || 0;
    tEl.value = m > 0 ? (m * o/100).toFixed(2) : '';
  };
  paraBagla(document.getElementById('alKdvM_'+n), ()=>{ hesapla(); alHesapla(); });
  paraBagla(tEl, alHesapla);
  document.getElementById('alKdvO_'+n).addEventListener('change', ()=>{ hesapla(); alHesapla(); });
  alHesapla();
}
function alKdvOku(){
  const sonuc = [];
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const pm = paraOku(document.getElementById('alKdvM_'+n));
    const pt = paraOku(document.getElementById('alKdvT_'+n));
    if (!pm.ok || !pt.ok) throw new Error('KDV satırında geçersiz tutar var — örnek: 2239,60');
    if (pm.deger > 0 || pt.deger > 0)
      sonuc.push({ oran:+document.getElementById('alKdvO_'+n).value, matrah:pm.deger, kdv_tutar:pt.deger });
  });
  return sonuc;
}
/* KDV dökümünde matrah boş kalmışsa KDV'den geri hesapla.
   Fatura çoğu zaman KDV tutarını yazar, matrahı ayrı sütunda vermez.
   Matrah boş kalınca satır karşılaştırması "0'a eşit değil" deyip ürünleri engelliyordu.
   Kesin dayanak: toplam − KDV toplamı = toplam matrah. Oran bazlı dağıtım kdv/oran ile,
   yuvarlama farkı en büyük satıra yazılır. */
function alMatrahTamamla(){
  const sat = [];
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    sat.push({ n, oran:+document.getElementById('alKdvO_'+n).value || 0,
               mEl:document.getElementById('alKdvM_'+n), tEl:document.getElementById('alKdvT_'+n) });
  });
  if (!sat.length) return 0;
  const kdvOf = s => paraOku(s.tEl).deger;
  const bos = sat.filter(s => paraOku(s.mEl).deger === 0 && kdvOf(s) > 0 && s.oran > 0);
  if (!bos.length) return 0;
  bos.forEach(s => { s.tahmin = +(kdvOf(s) / (s.oran/100)).toFixed(2); });
  const pT = paraOku(document.getElementById('alToplam'));
  if (pT.ok && pT.deger > 0){
    const kdvT = sat.reduce((a,s)=>a+kdvOf(s),0);
    const dolu = sat.filter(s=>!bos.includes(s)).reduce((a,s)=>a+paraOku(s.mEl).deger,0);
    const hedef = +(pT.deger - kdvT - dolu).toFixed(2);
    const tahminT = bos.reduce((a,s)=>a+s.tahmin,0);
    const fark = +(hedef - tahminT).toFixed(2);
    // Sadece yuvarlama düzeyindeki farkı kapat; büyük sapmada dokunma (veri yanlıştır)
    if (hedef > 0 && Math.abs(fark) <= Math.max(1, hedef*0.02)){
      const enBuyuk = bos.reduce((a,b)=> a.tahmin >= b.tahmin ? a : b);
      enBuyuk.tahmin = +(enBuyuk.tahmin + fark).toFixed(2);
    }
  }
  bos.forEach(s => { s.mEl.value = String(s.tahmin).replace('.', ','); s.mEl.classList.add('oku-dolu'); });
  alHesapla();
  return bos.length;
}
function alHesapla(){
  let kdv = 0, matrah = 0, gecerli = true;
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const pm = paraOku(document.getElementById('alKdvM_'+n));
    const pt = paraOku(document.getElementById('alKdvT_'+n));
    if (!pm.ok || !pt.ok) gecerli = false;
    matrah += pm.deger; kdv += pt.deger;
  });
  kdv = +kdv.toFixed(2); matrah = +matrah.toFixed(2);
  const el = document.getElementById('alKdvToplam'); if(el) el.textContent = tl(kdv);
  const pT = paraOku(document.getElementById('alToplam'));
  const toplam = pT.deger;
  const tut = document.getElementById('alTutarlilik'); if(!tut) return;
  if (!gecerli || !pT.ok){
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--hata)">Geçersiz tutar var — örnek: 3750,00</div>`; return;
  }
  if (toplam === 0 || kdv === 0){ tut.innerHTML = ''; return; }
  // Matrah + KDV = ödenecek tutar mı? (belgenin kendi aritmetiği)
  const fark = +(matrah + kdv - toplam).toFixed(2);
  if (Math.abs(fark) <= 0.05){
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--ok)">✓ Matrah ${tl(matrah)} + KDV ${tl(kdv)} = ${tl(toplam)} — belge tutuyor</div>`;
  } else {
    tut.innerHTML = `<div class="bilgi-not" style="color:var(--uyari)">⚠ Matrah ${tl(matrah)} + KDV ${tl(kdv)} = ${tl(matrah+kdv)},
      ödenecek tutar ${tl(toplam)} — <b>${fark>0?'+':''}${tl(fark)}</b> fark var. Belgeyle karşılaştır.</div>`;
  }
}
/* ===== e-FATURA PDF'İNDEN METİN ÇIKARMA =====
   Luca portalından inen e-fatura PDF'leri METİN tabanlı. Fotoğraf çekip okutmak yerine
   metni doğrudan çıkarırız: rakamlar birebir doğru, Türkçe karakter bozulmaz, maliyet düşük.
   Metin çıkmazsa (taranmış PDF) fotoğraf yoluna düşeriz. */
function pdfHazir(){
  const L = window.pdfjsLib;
  if (!L) return null;
  if (!L.GlobalWorkerOptions.workerSrc)
    L.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  return L;
}
async function pdfMetinCikar(file){
  const L = pdfHazir();
  if (!L) throw new Error('PDF okuyucu yüklenemedi — internet bağlantısını kontrol et.');
  const buf = await file.arrayBuffer();
  const pdf = await L.getDocument({ data: buf }).promise;
  const sayfalar = [];
  const enFazla = Math.min(pdf.numPages, 10);            // fatura 1-2 sayfa; kaçak dosyaya karşı sınır
  for (let i = 1; i <= enFazla; i++){
    const sy = await pdf.getPage(i);
    const ic = await sy.getTextContent();
    // Satır satır topla: aynı y'deki parçalar tek satır olsun (sütun hizası korunsun)
    const satirlar = new Map();
    ic.items.forEach(it => {
      if (!it.str) return;
      const y = Math.round(it.transform[5]);
      if (!satirlar.has(y)) satirlar.set(y, []);
      satirlar.get(y).push({ x: it.transform[4], s: it.str });
    });
    const metin = [...satirlar.entries()]
      .sort((a,b) => b[0] - a[0])                        // yukarıdan aşağı
      .map(([,p]) => p.sort((a,b)=>a.x-b.x).map(o=>o.s).join(' ').replace(/\s+/g,' ').trim())
      .filter(Boolean).join('\n');
    sayfalar.push(metin);
  }
  const tam = sayfalar.join('\n\n--- SAYFA ---\n\n').trim();
  return { metin: tam, sayfa: pdf.numPages, yeterli: tam.length >= 200 };
}

  d.className = 'oku-durum';

  d.textContent = pdfMi
    ? 'e-Fatura PDF\'i seçildi — "Belgeyi oku"ya bas, rakamlar birebir okunacak.'
    : 'Fotoğraf seçildi — "Belgeyi oku"ya basabilirsin.';

function alTedarikciEslestir(ocrAd, ocrVkn){
  const norm = s => (s||'').toString().toUpperCase()
    .replace(/[İI]/g,'I').replace(/[ŞS]/g,'S').replace(/[ĞG]/g,'G')
    .replace(/[ÜU]/g,'U').replace(/[ÖO]/g,'O').replace(/[ÇC]/g,'C')
    .replace(/[^A-Z0-9]/g,'');
  const liste = KATALOG.tedarikciler || [];
  const vkn = (ocrVkn||'').replace(/\D/g,'');
  if (vkn){
    const v = liste.find(t => (t.vergi_no||'').replace(/\D/g,'') === vkn);
    if (v) return { t:v, nasil:'VKN' };
  }
  const a = norm(ocrAd);
  if (a.length >= 4){
    const t = liste.find(x => { const y = norm(x.unvan||x.ad);
      return y.length>=4 && (y.startsWith(a.slice(0,8)) || a.startsWith(y.slice(0,8))); });
    if (t) return { t, nasil:'isim' };
  }
  return { t:null, nasil:null };
}

let OCR_SON = null;         // son okuma — kayda denetim izi olarak gider
let OKUMA_YONTEMI = null;   // 'PDF metni' | 'fotoğraf' — kullanıcıya hangi yolla okunduğunu söyler

/* ===== FATURA SATIRLARI — tanı, eşleştir, bir daha sorma =====
   Tedarikçinin yazımı → bizim ürün eşleşmesi bir kez kurulur (urun_alias),
   sonraki faturalarda otomatik bağlanır. Eşleşme önce KOD'dan, kod yoksa isimden.
   Satır toplamı belgeyle tutmuyorsa ürün kaydı YAPILMAZ. */
let AL_SATIRLAR = [];
const birimNorm = s => (s||'').toString().toUpperCase().replace(/\s+/g,' ').trim();

async function alSatirlariKur(satirlar, tedarikciId){
  AL_SATIRLAR = [];
  const kap = document.getElementById('alSatirlar'); if(!kap) return;
  if (!Array.isArray(satirlar) || !satirlar.length){ kap.innerHTML=''; return; }
  let alias = [];
  if (tedarikciId){
    const { data } = await sb.from('urun_alias')
      .select('tedarikci_kodu,ham_ad,urun_id,birim_carpani')
      .eq('tedarikci_id', tedarikciId).eq('is_deleted', false);
    alias = data || [];
  }
  satirlar.forEach((s,i)=>{
    const kod = (s.kod||'').toString().trim();
    let es = null, nasil = null;
    if (kod){
      es = alias.find(a => (a.tedarikci_kodu||'').trim().toUpperCase() === kod.toUpperCase());
      if (es) nasil = 'kod';
    }
    if (!es){
      es = alias.find(a => birimNorm(a.ham_ad) === birimNorm(s.ad));
      if (es) nasil = 'isim';
    }
    // İSKONTO DÜZELTMESİ — modelin aritmetiğine güvenme.
    // Fatura iskonto ORANINI yazıyor; satır tutarına brüt yazılmışsa net'i BİZ hesaplarız.
    // Uydurma değil: belgede yazan oranı belgede yazan brüte uygularız, sonra matrahla doğrularız.
    const miktar = +s.miktar||0, liste = +s.birim_fiyat||0;
    const brut   = +(miktar * liste).toFixed(2);
    const iskO   = +s.iskonto_orani || 0;
    let   net    = +s.satir_tutar || 0;
    let   iskT   = s.iskonto_tutar != null ? +s.iskonto_tutar : null;
    let   duzeltme = null;
    if (brut > 0 && Math.abs(net - brut) <= 0.05){          // satır tutarı = brüt (iskonto uygulanmamış)
      if (iskO > 0){
        net  = +(brut * (1 - iskO/100)).toFixed(2);
        iskT = +(brut - net).toFixed(2);
        duzeltme = `%${iskO} iskonto uygulandı`;
      } else if (iskT > 0){
        net  = +(brut - iskT).toFixed(2);
        duzeltme = `${tl(iskT)} iskonto düşüldü`;
      }
    }
    if (iskT == null && iskO > 0 && brut > net) iskT = +(brut - net).toFixed(2);
    // Paketleme çakışması: hafızadaki çarpan ile faturadan okunan farklıysa hafıza esas, ama HABER VER
    const ocrPaket = +s.paket_ici_adet || 0;
    const carpan   = es ? +es.birim_carpani : (ocrPaket || 1);
    const paketCakisma = (es && ocrPaket > 0 && Math.abs(ocrPaket - carpan) > 0.001) ? ocrPaket : null;

    AL_SATIRLAR.push({
      i, ham_ad:(s.ad||'').toString().trim(), ham_kod:kod||null,
      miktar, birim:(s.birim||'').toString().trim()||null,
      birim_fiyat:liste, satir_tutar:net, brut,
      iskonto_orani: iskO || null, iskonto_tutar: iskT,
      kdv_orani:s.kdv_orani ?? null,
      carpan, paketCakisma, duzeltme,
      urun_id: es ? es.urun_id : null, eslesme: nasil,
      karar: es ? 'mevcut' : 'yeni'
    });
  });
  // Kodsuz tedarikçide (BİM gibi termal fiş) aynı ürün her fişte başka okunuyor.
  // İlk kez görünen satırlar için benzer ürünleri getir — sistem karar VERMEZ, önerir.
  const yeniler = AL_SATIRLAR.filter(s => s.karar === 'yeni' && s.ham_ad.length >= 4);
  if (yeniler.length){
    await Promise.all(yeniler.map(async s => {
      try{
        const { data } = await sb.rpc('rpc_urun_benzer',
          { p_ham_ad: s.ham_ad, p_tedarikci: tedarikciId || null, p_limit: 4 });
        s.benzer = Array.isArray(data) ? data : [];
      }catch(e){ s.benzer = []; }
    }));
  }
  alSatirCiz();
}
function alSatirCiz(){
  const kap = document.getElementById('alSatirlar'); if(!kap) return;
  const urunler = (KATALOG.urunler||[]);
  kap.innerHTML = AL_SATIRLAR.map(s=>{
    const eslesti = s.karar==='mevcut' && s.urun_id;
    const rozet = eslesti

    const carpanNot = s.carpan > 1 ? ` · <b>${s.miktar} × ${s.carpan} = ${(s.miktar*s.carpan)}</b> adet` : '';
    // İskonto varsa liste fiyatı ile net tutarı AYRI göster — maliyet net tutardır
    const brut = s.brut != null ? s.brut : +(s.miktar * s.birim_fiyat).toFixed(2);
    const iskVar = s.iskonto_orani > 0 || s.iskonto_tutar > 0;

      : '';
    // Sistem iskontoyu kendisi uyguladıysa açıkça söyle (sessiz düzeltme olmasın)
    const duzNot = s.duzeltme
      ? `<br><span style="color:var(--ok)">✎ Faturadaki ${esc(s.duzeltme)} — satır tutarı ${tl(brut)} yerine <b>${tl(s.satir_tutar)}</b> alındı</span>` : '';
    // İskonto bildirilmemiş ama çarpım net tutardan büyükse: sütun atlanmış olabilir
    const gizliIsk = !iskVar && brut > s.satir_tutar + 0.05
      ? `<br><span style="color:var(--uyari)">⚠ ${s.miktar} × ${tl(s.birim_fiyat)} = ${tl(brut)} ama satır ${tl(s.satir_tutar)} —
         faturada iskonto olabilir, kontrol et</span>` : '';
    // Faturadan okunan paketleme, ürün kartındakinden farklıysa haber ver (kart esas alınır)
    const paketNot = s.paketCakisma
      ? `<br><span style="color:var(--uyari)">⚠ Faturada koli içi ${s.paketCakisma} okundu, ürün kartında ${s.carpan} yazıyor —
         <b>kart esas alındı</b>. Paketleme gerçekten değiştiyse ürün kartını güncelle.</span>` : '';
    return `<div class="fs-satir" id="fsS_${s.i}">
      <div class="fs-bas">${rozet}<span class="fs-ad">${esc(s.ham_ad||'(adsız)')}</span></div>
      <div class="fs-detay">${s.ham_kod?'kod '+esc(s.ham_kod)+' · ':''}${s.miktar} ${esc(s.birim||'adet')}
        × ${tl(s.birim_fiyat)}${iskNot} = <b>${tl(s.satir_tutar)}</b>${s.kdv_orani!=null?' · %'+s.kdv_orani:''}${carpanNot}${duzNot}${gizliIsk}${paketNot}</div>
      ${(s.benzer&&s.benzer.length&&s.karar==='yeni') ? `<div class="bilgi-not" style="color:var(--uyari);margin:0 0 6px">
        ⚠ Bu ürün zaten kayıtlı olabilir — <b>aynıysa aşağıdan seç</b>, yeni açma:
        ${s.benzer.map(b=>`<br>• <b>${esc(b.kod||'')} ${esc(b.ad)}</b> (%${Math.round(b.skor*100)} benzer)`).join('')}</div>` : ''}
      <select id="fsU_${s.i}" onchange="alSatirKarar(${s.i})">
        <option value="__yeni"${s.karar==='yeni'?' selected':''}>+ Yeni ürün olarak tanımla</option>
        ${(s.benzer&&s.benzer.length) ? `<optgroup label="Benzer ürünler">
          ${s.benzer.map(b=>`<option value="${b.urun_id}"${s.urun_id===b.urun_id?' selected':''}>${esc(b.kod||'')} — ${esc(b.ad)} · %${Math.round(b.skor*100)}</option>`).join('')}
        </optgroup>` : ''}
        <optgroup label="Tüm ürünler">
          ${urunler.map(u=>`<option value="${u.id}"${s.urun_id===u.id?' selected':''}>${esc(u.kod?u.kod+' — ':'')}${esc(u.ad)}</option>`).join('')}
        </optgroup>
        <option value="__atla"${s.karar==='atla'?' selected':''}>Bu satırı kaydetme</option>
      </select>
      ${s.karar==='yeni'?`
        <div class="fs-yeni">
          <input type="text" id="fsAd_${s.i}" value="${esc(s.ham_ad)}" placeholder="ürün adı (kısaltabilirsin)">
          <div class="satir">
            <div><label>Stok birimi</label>
              <select id="fsBirim_${s.i}">
                ${['adet','kg','lt'].map(b=>`<option value="${b}"${birimNorm(s.birim)===b.toUpperCase()?' selected':''}>${b}</option>`).join('')}
              </select></div>
            <div><label>Paket/koli içi adet</label>
              <input type="text" inputmode="decimal" autocomplete="off" id="fsPaket_${s.i}" value="${s.carpan>1?s.carpan:''}" placeholder="örn 80"></div>
          </div>
        </div>`:''}
    </div>`;
  }).join('') + `<div id="fsDenetim"></div>`;
  alSatirDenetim();
}
function alSatirKarar(i){
  const s = AL_SATIRLAR.find(x=>x.i===i); if(!s) return;
  const v = document.getElementById('fsU_'+i).value;
  if (v === '__yeni'){ s.karar='yeni'; s.urun_id=null; s.eslesme=null; }
  else if (v === '__atla'){ s.karar='atla'; s.urun_id=null; s.eslesme=null; }
  else { s.karar='mevcut'; s.urun_id=v; s.eslesme='elle'; }
  alSatirCiz();
}
function alSatirDenetim(){
  const el = document.getElementById('fsDenetim'); if(!el) return;
  const kalan = AL_SATIRLAR.filter(s=>s.karar!=='atla');
  const satirT = +kalan.reduce((a,s)=>a+s.satir_tutar,0).toFixed(2);
  // Faturanın matrahı: KDV dökümündeki matrahların toplamı
  let matrah = 0;
  document.querySelectorAll('#alKdvSatirlari .kdv-satir').forEach(d=>{
    matrah += paraOku(document.getElementById('alKdvM_'+d.id.split('_')[1])).deger;
  });
  matrah = +matrah.toFixed(2);
  const toplam = paraOku(document.getElementById('alToplam')).deger;
  if (!kalan.length){ el.innerHTML = ''; AL_SATIR_TUTUYOR = true; return; }
  const hedef = matrah > 0 ? matrah : toplam;
  const etiket = matrah > 0 ? 'fatura matrahı' : 'ödenecek tutar';
  const fark = +(satirT - hedef).toFixed(2);
  AL_SATIR_TUTUYOR = Math.abs(fark) <= 0.05;
  el.innerHTML = AL_SATIR_TUTUYOR
    ? `<div class="bilgi-not" style="color:var(--ok)">✓ Satır toplamı ${tl(satirT)} = ${etiket} ${tl(hedef)} — ürünler kaydedilebilir</div>`
    : `<div class="bilgi-not" style="color:var(--uyari)">⚠ Satır toplamı <b>${tl(satirT)}</b>,
        ${etiket} <b>${tl(hedef)}</b> — <b>${fark>0?'+':''}${tl(fark)}</b> fark var.<br>
        Eksik satır olabilir, bir rakam yanlış okunmuş olabilir ya da faturada iskonto vardır.
        <b>Düzeltmeden ürün kaydı yapılmaz</b> — fatura, tutarı ve KDV'siyle yine kaydedilir.</div>`;
}
let AL_SATIR_TUTUYOR = true;
/* Yeni ürünleri oluştur, eşleşmeyi hafızaya yaz, kalem listesini döndür */
let YENI_URUN_UYARI = [];   // personelin açtığı, yöneticinin gözden geçireceği ürünler
async function alSatirKaydet(tedarikciId){
  YENI_URUN_UYARI = [];
  const kalan = AL_SATIRLAR.filter(s=>s.karar!=='atla');
  if (!kalan.length || !AL_SATIR_TUTUYOR) return [];
  const kalemler = [];
  for (const s of kalan){
    let urunId = s.urun_id;
    let carpan = s.carpan;
    let ad = null, birim = 'adet';
    if (s.karar === 'yeni'){
      ad = (document.getElementById('fsAd_'+s.i)?.value||s.ham_ad).trim();
      birim = document.getElementById('fsBirim_'+s.i)?.value || 'adet';
      const pk = paraOku(document.getElementById('fsPaket_'+s.i));
      carpan = pk.deger > 0 ? pk.deger : 1;
      if (!ad) throw new Error('Yeni ürünün adı boş olamaz.');
    }
    // Ürün + eşleşme TEK fonksiyonda. Personel tabloya doğrudan yazamaz (RLS),
    // bu fonksiyon üzerinden tanımlayabilir; açtığı ürün yöneticinin onayına düşer.
    const { data:r, error:re } = await sb.rpc('rpc_urun_tanimla', {
      p_ad: ad, p_birim: birim,
      p_paket_ici: carpan > 1 ? carpan : null,
      p_kategori: null,
      p_tedarikci: tedarikciId || null,
      p_ham_kod: s.ham_kod, p_ham_ad: s.ham_ad,
      p_carpan: carpan, p_birim_ad: s.birim,
      p_urun_id: s.karar === 'yeni' ? null : urunId
    });
    if (re) throw new Error('Ürün tanımlanamadı: ' + hataTr(re.message));
    urunId = r.urun_id;
    if (s.karar === 'yeni' && r.yeni){
      KATALOG.urunler.push({ id:r.urun_id, ad, birim, kod:r.kod, paket_ici_adet: carpan>1?carpan:null });
      YENI_URUN_UYARI.push(`${r.kod} ${ad}`);
    }
    kalemler.push({ urun_id:urunId, miktar:s.miktar, birim_fiyat:s.birim_fiyat,
      ham_ad:s.ham_ad, ham_kod:s.ham_kod, birim_ad:s.birim, birim_carpani:carpan,
      satir_tutar:s.satir_tutar, kdv_orani:s.kdv_orani,
      iskonto_orani:s.iskonto_orani, iskonto_tutar:s.iskonto_tutar });
  }
  return kalemler;
}

async function alisKaydet(){
  const pT = paraOku(document.getElementById('alToplam'));
  if (!pT.ok){ mesaj('alMsg','hata','Ödenecek tutar geçersiz — örnek: 3750 veya 3750,00'); return; }
  const toplam = pT.deger;
  let kdvKirilim;
  try { kdvKirilim = alKdvOku(); }
  catch(e){ mesaj('alMsg','hata', e.message); return; }
  const kdvT = +kdvKirilim.reduce((a,x)=>a+x.kdv_tutar,0).toFixed(2);
  const matrah = +kdvKirilim.reduce((a,x)=>a+x.matrah,0).toFixed(2);
  if (!document.getElementById('alTedarikci').value){ mesaj('alMsg','hata','Tedarikçi seçilmedi.'); return; }
  if (toplam===0){ mesaj('alMsg','hata','Toplam tutar boş olamaz.'); return; }
  if (kdvT > toplam){ mesaj('alMsg','hata',`KDV (${tl(kdvT)}) toplam tutardan (${tl(toplam)}) büyük olamaz.`); return; }
  // Belgenin kendi aritmetiği: matrah + KDV = ödenecek
  if (matrah > 0 && Math.abs(matrah + kdvT - toplam) > 0.05 &&
      !confirm(`Matrah ${tl(matrah)} + KDV ${tl(kdvT)} = ${tl(matrah+kdvT)}, ödenecek tutar ${tl(toplam)}.\n${tl(Math.abs(matrah+kdvT-toplam))} fark var.\n\nBelgeyle karşılaştırdın mı? Yine de kaydedilsin mi?`)) return;
  // Mükerrer fatura ön kontrolü (belge no doluysa) — düzenlerken kendini saymaz
  const belgeNo = document.getElementById('alBelgeNo').value.trim();
  if (belgeNo){
    let q = sb.from('alis').select('id').eq('is_deleted',false)
      .eq('tedarikci_id', document.getElementById('alTedarikci').value).eq('belge_no', belgeNo);
    if (AL_DUZENLE) q = q.neq('id', AL_DUZENLE.id);
    const { data: mv } = await q.limit(1);
    if (mv && mv.length){ mesaj('alMsg','hata','Bu belge no bu firma için zaten girilmiş — mükerrer fatura. Kontrol edin.'); return; }
  }
  const alTurDeger = document.getElementById('alTur').value;
  if (alTurDeger==='fatura' && kdvT===0 && !confirm('KDV dökümü BOŞ — bu fatura indirilecek KDV hesabına girmeyecek. Yine de kaydedilsin mi?')) return;
  const fotoVar = !!(document.getElementById('alFoto')?.files?.[0]) || !!(AL_DUZENLE && AL_DUZENLE.foto);
  if (!fotoVar && !confirm('Belge fotoğrafı yok. Ay sonunda muhasebeye giden arşivde bu belge eksik kalır.\n\nYine de kaydedilsin mi?')) return;
  // Ürün satırları: tutmuyorsa fatura yine kaydedilir, ÜRÜNLER kaydedilmez
  const satirVar = AL_SATIRLAR.filter(s=>s.karar!=='atla').length > 0;
  if (satirVar && !AL_SATIR_TUTUYOR &&
      !confirm('Ürün satırlarının toplamı faturayla TUTMUYOR.\n\nFatura tutarı ve KDV\'si kaydedilecek, ama ÜRÜN SATIRLARI kaydedilmeyecek — yanlış maliyet oluşmasın diye.\n\nDevam edilsin mi?')) return;

  const btn = document.getElementById('alKaydet');
  btn.disabled=true; btn.textContent='Fotoğraf yükleniyor...';
  let foto=null;
  try{ foto = await fotoYukle('alFoto','fatura'); }
  catch(e){ mesaj('alMsg','hata',e.message); btn.disabled=false; btn.textContent='Faturayı Kaydet'; return; }

  // Yeni ürünleri oluştur + eşleşmeleri hafızaya yaz
  let kalemler = [];
  try{
    btn.textContent = 'Ürünler hazırlanıyor...';
    kalemler = await alSatirKaydet(document.getElementById('alTedarikci').value);
  }catch(e){
    mesaj('alMsg','hata', e.message); btn.disabled=false; btn.textContent='Faturayı Kaydet'; return;
  }
  if (!kalemler.length) kalemler = kalemOku();       // elle girilenler
  btn.textContent = AL_DUZENLE ? 'Değişiklikleri Kaydet' : 'Faturayı Kaydet';

  // DÜZENLEME: kaydı silmeden güncelle
  if (AL_DUZENLE){
    const gData = await rpcCagir('rpc_alis_guncelle', {
      p_idem: idem(), p_id: AL_DUZENLE.id,
      p_tedarikci: document.getElementById('alTedarikci').value,
      p_tarih: document.getElementById('alTarih').value,
      p_tur: document.getElementById('alTur').value,
      p_belge_no: belgeNo||null,
      p_fis_no: document.getElementById('alFisNo').value.trim()||null,
      p_toplam: toplam, p_kdv_kirilim: kdvKirilim,
      p_foto: foto,                                   // null ise mevcut korunur
      p_not: document.getElementById('alNot').value.trim()||null,
      p_kalemler: kalemler,
      p_odendi: document.getElementById('alOdendi').value === '1',
      p_odeme_yontem: document.getElementById('alOdendi').value === '1' ? document.getElementById('alYontem').value : null,
      p_vade: document.getElementById('alOdendi').value === '0' ? (document.getElementById('alVade').value||null) : null,
      p_cek_no: (document.getElementById('alOdendi').value==='1' && document.getElementById('alYontem').value==='cek') ? (document.getElementById('alCekNo').value.trim()||null) : null,
      p_cek_vade: (document.getElementById('alOdendi').value==='1' && document.getElementById('alYontem').value==='cek') ? (document.getElementById('alCekVade').value||null) : null
    }, 'alKaydet','alMsg','Değişiklikler kaydedildi ✓');
    if (gData && gData.ok){ AL_DUZENLE = null; AL_SATIRLAR = []; vGider(); mesaj('alMsg','ok','Değişiklikler kaydedildi ✓'); }
    else btn.textContent = 'Değişiklikleri Kaydet';
    return;
  }
  const data = await rpcCagir('rpc_alis_kaydet',{
    p_idem: idem(), p_sube: PROFIL.sube_id,
    p_tedarikci: document.getElementById('alTedarikci').value,
    p_tarih: document.getElementById('alTarih').value,
    p_tur: document.getElementById('alTur').value,
    p_belge_no: document.getElementById('alBelgeNo').value.trim()||null,
    p_fis_no: document.getElementById('alFisNo').value.trim()||null,
    p_toplam: toplam,
    p_kdv_orani: kdvKirilim.length === 1 ? kdvKirilim[0].oran : null,   // tek oransa eski alan da dolsun
    p_kdv_tutar: kdvT,
    p_kdv_kirilim: kdvKirilim,
    p_kdv_dahil: true,                       // "Ödenecek Tutar" alanı KDV dahil toplamdır
    p_ocr_ham: OCR_SON ? OCR_SON.veri : null,
    p_ocr_model: OCR_SON ? OCR_SON.model : null,
    p_foto: foto,
    p_not: document.getElementById('alNot').value.trim()||null,
    p_kalemler: kalemler,
    p_odendi: document.getElementById('alOdendi').value === '1',
    p_odeme_yontem: document.getElementById('alOdendi').value === '1' ? document.getElementById('alYontem').value : null,
    p_vade: document.getElementById('alOdendi').value === '0' ? (document.getElementById('alVade').value||null) : null,
    p_cek_no: (document.getElementById('alOdendi').value==='1' && document.getElementById('alYontem').value==='cek') ? (document.getElementById('alCekNo').value.trim()||null) : null,
    p_cek_vade: (document.getElementById('alOdendi').value==='1' && document.getElementById('alYontem').value==='cek') ? (document.getElementById('alCekVade').value||null) : null
  },'alKaydet','alMsg','Fatura kaydedildi ✓');
  if (data && data.ok){
    const yeni = YENI_URUN_UYARI.slice();
    vGider();
    if (yeni.length) mesaj('alMsg','ok',
      `Fatura kaydedildi ✓ · ${yeni.length} yeni ürün stok kartı açıldı: ${yeni.join(', ')}`);
  }
}

  const [{ data: stok }, cikis] = await Promise.all([
    sb.from('v_stok_durum').select('*').order('ad'),
    // Son sayım/tüketim ne zaman? Hiç yoksa "mevcut" stok değil, toplam alımdır.

    sb.from('stok_hareket').select('tarih')
      .eq('is_deleted',false).in('tur',['tuketim','sayim_duzeltme'])
      .order('tarih',{ascending:false}).limit(1)

    ? Math.floor((new Date(bugun()+'T00:00') - new Date(sonSayim+'T00:00')) / 86400000)
    : null;

  const sayimEskidi = cikisVar && sayimGunu > 14;   // iki haftadan eski sayım güvenilmez
  const toplamDeger = (stok||[]).reduce((a,s)=>a + (+s.stok_degeri||0), 0);
  const liste = stok||[];
  // Sayım kutusu canlı toplam hesaplayacak; listeyi (maliyetiyle) dışarı taşı
  // mal = yuvarlanmamis birim maliyet (maliyet_tam). ort_maliyet 4 haneye yuvarli

                               mevcut:+x.mevcut||0,

/* ===== ÜRÜN DETAYI — fiyat geçmişi grafiği + alım dökümü =====
   Stok veya alım listesinde bir ürüne dokununca açılır.
   Grafik kütüphanesiz SVG: hafif, offline çalışır, telefonda hızlı. */
function udKapat(){
  const o=document.getElementById('udOverlay');
  if(o){ o.classList.remove('acik'); document.getElementById('udIcerik').innerHTML=''; }
}
function udKutu(){
  let o=document.getElementById('udOverlay');
  if(!o){
    o=document.createElement('div'); o.id='udOverlay'; o.className='ud-ov';
    o.innerHTML='<div class="ud-kutu" id="udIcerik"></div>';
    document.body.appendChild(o);
    o.addEventListener('click', e=>{ if(e.target===o) udKapat(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') udKapat(); });
  }
  return o;
}
/* Zaman-fiyat çizgisi. Tek nokta varsa çizgi yok, sadece işaret. */
function fiyatGrafigi(nk){
  if(!nk.length) return '';
  const G=320, Y=112, sol=46, sag=10, ust=12, alt=22;
  const iw=G-sol-sag, ih=Y-ust-alt;
  const fy=nk.map(p=>p.fiyat);
  let enAz=Math.min(...fy), enCok=Math.max(...fy);
  if(enCok-enAz < 0.005){ const p=Math.max(enCok*0.06, 1); enAz-=p; enCok+=p; }
  const t0=nk[0].ts, t1=nk[nk.length-1].ts, dt=(t1-t0)||1;
  const X=p=>sol+(nk.length===1?iw/2:((p.ts-t0)/dt)*iw);
  const Yp=p=>ust+ih-((p.fiyat-enAz)/(enCok-enAz))*ih;
  const kisa=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.',',')+'b':n.toFixed(n<10?2:0).replace('.',',');
  const cizgi=nk.map((p,i)=>(i?'L':'M')+X(p).toFixed(1)+' '+Yp(p).toFixed(1)).join(' ');
  const dolgu=nk.length>1
    ? `<path d="${cizgi} L ${X(nk[nk.length-1]).toFixed(1)} ${ust+ih} L ${X(nk[0]).toFixed(1)} ${ust+ih} Z"
        fill="var(--ana)" opacity=".07"/>` : '';
  const tarihEt=p=>new Date(p.ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'});
  return `<svg viewBox="0 0 ${G} ${Y}" role="img" aria-label="Birim fiyat geçmişi">
    ${[0,0.5,1].map(f=>{const y=ust+ih*f;return`<line x1="${sol}" y1="${y}" x2="${G-sag}" y2="${y}"
       stroke="var(--cizgi)" stroke-width="1"/>`}).join('')}
    <text x="4" y="${ust+4}" font-size="9" font-weight="700" fill="var(--soluk)">${kisa(enCok)}</text>
    <text x="4" y="${ust+ih+3}" font-size="9" font-weight="700" fill="var(--soluk)">${kisa(enAz)}</text>
    ${dolgu}
    ${nk.length>1?`<path d="${cizgi}" fill="none" stroke="var(--ana)" stroke-width="2.2"
        stroke-linejoin="round" stroke-linecap="round"/>`:''}
    ${nk.map((p,i)=>{
      const son=i===nk.length-1, art=i>0 && p.fiyat>nk[i-1].fiyat+0.005;
      return `<circle cx="${X(p).toFixed(1)}" cy="${Yp(p).toFixed(1)}" r="${son?4.5:3.2}"
        fill="${art?'var(--hata)':'var(--ana)'}" stroke="var(--kagit)" stroke-width="1.6"/>`;
    }).join('')}
    <text x="${sol}" y="${Y-6}" font-size="9" font-weight="700" fill="var(--soluk)">${tarihEt(nk[0])}</text>
    ${nk.length>1?`<text x="${G-sag}" y="${Y-6}" font-size="9" font-weight="700" fill="var(--soluk)"
       text-anchor="end">${tarihEt(nk[nk.length-1])}</text>`:''}
  </svg>`;
}
/* Fatura detayı — satır artık çıkmaz sokak değil: belge, KDV dökümü, ürünler, düzenleme tek yerde */
async function faturaDetay(id){
  const ov=udKutu(), ic=document.getElementById('udIcerik');
  ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Yükleniyor...</div></div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  ov.classList.add('acik');
  const { data:a } = await sb.from('alis')
    .select('*, tedarikci(ad,vergi_no), alis_kdv(oran,matrah,kdv_tutar,is_deleted), alis_kalem(miktar,birim_fiyat,birim_ad,birim_carpani,satir_tutar,iskonto_orani,ham_ad,urun_id,is_deleted,urun(kod,ad,birim))')
    .eq('id',id).maybeSingle();
  if(!a){ ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Fatura bulunamadı</div></div>
    <button class="ud-kapat" onclick="udKapat()">✕</button></div>`; return; }

  const kdv=(a.alis_kdv||[]).filter(x=>!x.is_deleted).sort((x,y)=>x.oran-y.oran);
  const kal=(a.alis_kalem||[]).filter(x=>!x.is_deleted);
  const matrah=kdv.reduce((s,x)=>s+ +x.matrah,0);
  const kdvT=kdv.reduce((s,x)=>s+ +x.kdv_tutar,0);
  const satirT=kal.reduce((s,x)=>s+ +x.satir_tutar,0);
  const t=new Date(a.tarih+'T00:00').toLocaleDateString('tr-TR');
  const bugunS=bugun();
  const vadeGecti=!a.odendi && a.vade_tarihi && a.vade_tarihi<bugunS;

  ic.innerHTML=`
    <div class="ud-ust">
      <div style="flex:1">
        <div class="ud-kod">${esc(a.belge_no||'BELGE NO YOK')} · ${t}</div>
        <div class="ud-ad">${esc(a.tedarikci?.ad||'—')}</div>
      </div>
      <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button>
    </div>
    <div class="ud-govde">
      ${vadeGecti?`<div class="uyari-agir">Vadesi ${new Date(a.vade_tarihi+'T00:00').toLocaleDateString('tr-TR')} — geçti, gecikme zammı işler</div>`:''}
      ${a.tur==='fatura' && kdvT===0?`<div class="uyari-orta">KDV dökümü yok — bu fatura indirilecek KDV'ye girmiyor</div>`:''}

      <div class="ud-bas"><span class="ud-blk">TUTAR</span></div>
      ${matrah>0?ozSatir('Matrah', tl(matrah)):''}
      ${kdv.map(x=>ozSatir(`KDV %${x.oran}`, tl(x.kdv_tutar))).join('')}
      ${ozSatir('Ödenecek', tl(a.toplam), true)}
      <div class="ipucu" style="margin-top:8px">
        ${a.odendi?'<b style="color:var(--ok)">Ödendi</b>':'<b style="color:var(--uyari)">Ödenmedi</b>'}
        ${a.vade_tarihi?' · vade '+new Date(a.vade_tarihi+'T00:00').toLocaleDateString('tr-TR'):''}
        ${a.tur!=='fatura'?' · '+esc(a.tur==='bilgi_fisi'?'bedelsiz mal gelişi':a.tur):''}
        ${a.tedarikci?.vergi_no?'<br>VKN '+esc(a.tedarikci.vergi_no):''}
      </div>

      <div class="ud-bas" style="margin-top:18px"><span class="ud-blk">ÜRÜNLER · ${kal.length}</span>
        ${kal.length?`<span class="ud-trend">${tl(satirT)}</span>`:''}</div>
      ${kal.length===0
        ? `<div class="ud-bos">Ürün satırı girilmemiş. Düzenle → <b>Belgeyi oku</b> dersen satırlar çıkar,
             stok ve maliyet bu faturadan da beslenir.</div>`
        : kal.map(k=>`<div class="ud-satir">
            <div class="ud-trh">${k.urun?.kod?esc(k.urun.kod):'—'}</div>
            <div><div style="font-size:13px;font-weight:800">${esc(k.urun?.ad||k.ham_ad||'—')}</div>
              <div class="ud-alt">${(+k.miktar).toLocaleString('tr-TR')} ${esc(k.birim_ad||k.urun?.birim||'')}
                × ${tl(k.birim_fiyat)}${k.iskonto_orani?` · %${k.iskonto_orani} iskonto`:''}
                ${+k.birim_carpani>1?` · ${((+k.miktar)*(+k.birim_carpani)).toLocaleString('tr-TR')} ${esc(k.urun?.birim||'adet')}`:''}</div></div>
            <div class="ud-tut">${tl(k.satir_tutar)}</div></div>`).join('')}
      ${kal.length && Math.abs(satirT-matrah)>0.05
        ? `<div class="uyari-orta" style="margin-top:10px">Satır toplamı ${tl(satirT)}, matrah ${tl(matrah)} — fark var</div>`:''}

      <div class="ud-bas" style="margin-top:18px"><span class="ud-blk">BELGE</span></div>
      ${a.foto_path
        ? `<div>${belgeBtn(a.foto_path,'Belgeyi aç',`${t} — ${a.tedarikci?.ad||''} ${a.belge_no||''}`)}</div>`
        : `<div class="ud-bos">Belge yüklenmemiş — ay sonu arşivinde eksik kalır.</div>`}

      <button class="btn" onclick="udKapat();alisDuzenle('${a.id}')">Faturayı Düzenle</button>
    </div>`;
}
async function urunDetay(urunId){
  const ov=udKutu(), ic=document.getElementById('udIcerik');
  ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Yükleniyor...</div></div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  ov.classList.add('acik');
  const [ur, kl, st] = await Promise.all([
    sb.from('urun').select('kod,ad,birim,paket_ici_adet,kategori,kritik_seviye').eq('id',urunId).maybeSingle(),
    sb.from('alis_kalem')
      .select('miktar,birim_fiyat,birim_ad,birim_carpani,satir_tutar,iskonto_orani,alis!inner(tarih,belge_no,is_deleted,tedarikci(ad))')
      .eq('urun_id',urunId).eq('is_deleted',false).eq('alis.is_deleted',false),
    sb.from('v_stok_durum').select('mevcut,ort_maliyet,stok_degeri,kritik').eq('urun_id',urunId).maybeSingle()
  ]);
  const u=ur.data, s=st.data;
  if(!u){ ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Ürün bulunamadı</div></div>
    <button class="ud-kapat" onclick="udKapat()">✕</button></div>`; return; }

  const alim=(kl.data||[]).map(k=>({
      ts:new Date(k.alis.tarih+'T00:00').getTime(), tarih:k.alis.tarih,
      fiyat:+k.birim_fiyat||0, miktar:+k.miktar||0, carpan:+k.birim_carpani||1,
      birim:k.birim_ad||u.birim, tutar:+k.satir_tutar||0, isk:+k.iskonto_orani||0,
      firma:k.alis.tedarikci?.ad||'—', belge:k.alis.belge_no
    })).sort((a,b)=>a.ts-b.ts);

  const nk=alim.filter(a=>a.fiyat>0);
  const ilk=nk.length?nk[0].fiyat:0, son=nk.length?nk[nk.length-1].fiyat:0;
  const fark=ilk>0?((son-ilk)/ilk*100):0;
  const toplamTutar=alim.reduce((a,x)=>a+x.tutar,0);
  const toplamAdet=alim.reduce((a,x)=>a+x.miktar*x.carpan,0);

  ic.innerHTML=`
    <div class="ud-ust">
      <div style="flex:1">
        ${u.kod?`<div class="ud-kod">${esc(u.kod)}${u.kategori?' · '+esc(u.kategori):''}</div>`:''}
        <div class="ud-ad">${esc(u.ad)}</div>
      </div>
      <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button>
    </div>
    <div class="ud-govde">
      <div class="ud-kunye">
        <div><div class="ud-et">ELDEKİ</div><div class="ud-dg">${s?(+s.mevcut).toLocaleString('tr-TR'):'—'}
          <span style="font-size:11px;font-weight:700;color:var(--soluk)">${esc(u.birim)}</span></div></div>
        <div><div class="ud-et">BİRİM MALİYET</div><div class="ud-dg">${s&&+s.ort_maliyet?tl(s.ort_maliyet):'—'}</div></div>
        <div><div class="ud-et">STOK DEĞERİ</div><div class="ud-dg">${s?tl(s.stok_degeri):'—'}</div></div>
      </div>

      <div class="ud-bas">
        <span class="ud-blk">BİRİM FİYAT GEÇMİŞİ</span>
        ${nk.length>1?`<span class="ud-trend ${fark>0.5?'ud-zam':(fark<-0.5?'ud-indi':'')}">
          ${fark>0.5?'▲':(fark<-0.5?'▼':'●')} ${fark>0?'+':''}${fark.toFixed(1).replace('.',',')}%</span>`:''}
      </div>
      ${nk.length
        ? `<div class="ud-graf">${fiyatGrafigi(nk)}</div>`
        : `<div class="ud-bos">Bu ürünün fiyat geçmişi yok — henüz fatura satırı girilmemiş.</div>`}
      ${nk.length>1 && Math.abs(fark)>0.5
        ? `<div class="ud-bos" style="margin:-10px 0 16px">${esc(u.ad)} ${tl(ilk)} → ${tl(son)}
            (${nk[0].birim} başına). ${fark>0?'Zam':'İndirim'} ${Math.abs(fark).toFixed(1).replace('.',',')}%.</div>` : ''}

      <div class="ud-bas"><span class="ud-blk">ALIM GEÇMİŞİ · ${alim.length} kayıt</span>
        <span class="ud-trend">${tl(toplamTutar)}</span></div>
      ${alim.length===0?`<div class="ud-bos">Alım kaydı yok.</div>`
        : alim.slice().reverse().map((a,i,dizi)=>{
            const onceki=dizi[i+1];
            const zam=onceki&&a.fiyat>onceki.fiyat+0.005, ind=onceki&&a.fiyat<onceki.fiyat-0.005;
            return `<div class="ud-satir">
              <div class="ud-trh">${new Date(a.ts).toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}</div>
              <div><div style="font-size:13px;font-weight:800">${a.miktar.toLocaleString('tr-TR')} ${esc(a.birim)}
                  × ${tl(a.fiyat)}${zam?' <span class="ud-zam">▲</span>':(ind?' <span class="ud-indi">▼</span>':'')}</div>
                <div class="ud-alt">${esc(a.firma)}${a.isk?' · %'+a.isk+' iskonto':''}
                  ${a.carpan>1?' · '+(a.miktar*a.carpan).toLocaleString('tr-TR')+' '+esc(u.birim):''}</div></div>
              <div class="ud-tut">${tl(a.tutar)}</div></div>`;
          }).join('')}
      ${toplamAdet>0?`<div class="ud-satir" style="border-top:2px solid var(--cizgi);border-bottom:none">
        <div class="ud-trh"></div>
        <div style="font-size:13px;font-weight:900">Toplam alınan</div>
        <div class="ud-tut">${toplamAdet.toLocaleString('tr-TR')} ${esc(u.birim)}</div></div>`:''}
    </div>`;
}

/* ===== ÜRÜN ALIMLARI — ne aldık, ne kadar, kaça =====
   Faturalardan türetilir. Ay veya yıl bazlı; fiyat değiştiyse uyarır. */
let ALIM_DONEM = null;      // 'YYYY-MM' | 'YYYY'
function alimDonemDegisti(){
  const s = document.getElementById('arDonem');
  ALIM_DONEM = document.getElementById('arYil')?.checked ? s.value.slice(0,4) : s.value;
  alimRaporu();
}
async function alimRaporu(){
  const el = document.getElementById('alimBolum'); if(!el) return;
  const yilMi = (ALIM_DONEM||'').length === 4;
  const ay  = yilMi ? null : (ALIM_DONEM || bugun().slice(0,7));
  const yil = yilMi ? ALIM_DONEM : (ALIM_DONEM || bugun().slice(0,7)).slice(0,4);
  const bas = yilMi ? yil+'-01-01' : ay+'-01';
  const son = yilMi ? yil+'-12-31'
                    : ay + '-' + String(new Date(+ay.slice(0,4), +ay.slice(5,7), 0).getDate()).padStart(2,'0');

  const { data, error } = await sb.from('alis_kalem')
    .select('miktar,birim_fiyat,birim_ad,birim_carpani,satir_tutar,urun(id,kod,ad,birim),alis!inner(tarih,belge_no,is_deleted,tedarikci(ad))')
    .eq('is_deleted', false).eq('alis.is_deleted', false)
    .gte('alis.tarih', bas).lte('alis.tarih', son);

  const satirlar = data || [];
  const g = {};
  satirlar.forEach(s=>{
    const u = s.urun; if(!u) return;
    const k = u.kod || u.ad;
    if(!g[k]) g[k] = { id:u.id, kod:u.kod, ad:u.ad, birim:u.birim, alim:0, miktar:0, adet:0,
                       tutar:0, fiyatlar:[], birimAd:null, firmalar:new Set(), belgeler:new Set() };
    const x = g[k];
    x.alim++; x.miktar += +s.miktar||0;
    x.adet += (+s.miktar||0) * (+s.birim_carpani||1);
    x.tutar += +s.satir_tutar||0;
    if (+s.birim_fiyat) x.fiyatlar.push(+s.birim_fiyat);
    x.birimAd = x.birimAd || s.birim_ad;
    if (s.alis?.tedarikci?.ad) x.firmalar.add(s.alis.tedarikci.ad);
    if (s.alis?.belge_no) x.belgeler.add(s.alis.belge_no);
  });
  const liste = Object.values(g).sort((a,b)=>b.tutar-a.tutar);
  const toplam = liste.reduce((a,x)=>a+x.tutar,0);
  const faturaSayisi = new Set(satirlar.map(s=>s.alis?.belge_no).filter(Boolean)).size;
  const donemAdi = yilMi ? yil+' yılı'
    : new Date(bas+'T00:00').toLocaleDateString('tr-TR',{month:'long',year:'numeric'});

  el.innerHTML = `<div class="kart">
    <div class="kbaslik">Ürün Alımları — ne aldık, ne kadar, kaça</div>
    <div class="satir" style="align-items:end">
      <div><label>Dönem</label><input type="month" id="arDonem" value="${yilMi? yil+'-01' : ay}" onchange="alimDonemDegisti()"></div>
      <div><label style="display:flex;align-items:center;gap:10px;min-height:44px;font-size:13px;font-weight:700;color:var(--metin);cursor:pointer">
        <input type="checkbox" id="arYil" ${yilMi?'checked':''} onchange="alimDonemDegisti()"
               style="width:22px;height:22px;flex:none;margin:0;accent-color:var(--ana)">
        Yıl toplamı</label></div>
    </div>
    ${error?`<div class="bilgi-not" style="color:var(--hata)">Yüklenemedi: ${esc(hataTr(error.message))}</div>`:''}
    <div class="gs-bant" style="margin:12px 0">
      <div class="kalem buyuk"><div class="gs-et">${esc(donemAdi)} alımı</div><div class="dg">${tl(toplam)}</div></div>
      <div class="kalem"><div class="gs-et">Ürün çeşidi</div><div class="dg">${liste.length}</div></div>
      <div class="kalem"><div class="gs-et">Fatura</div><div class="dg">${faturaSayisi}</div></div>
    </div>
    ${liste.length===0?'<div class="bilgi-not">Bu dönemde ürün satırı olan fatura yok.</div>'
      : liste.map(x=>{
        const enAz = Math.min(...x.fiyatlar), enCok = Math.max(...x.fiyatlar);
        const degisti = x.fiyatlar.length>1 && (enCok-enAz) > 0.005;
        const yuzde = degisti && enAz>0 ? Math.round((enCok-enAz)/enAz*100) : 0;
        const carpanli = x.adet !== x.miktar;
        return `<div class="liste-satir${x.id?' tikla':''}"${x.id?` onclick="urunDetay('${x.id}')"`:''}>
          <div class="l-sol"><div class="b">${x.kod?esc(x.kod)+' · ':''}${esc(x.ad)}</div>
            <div class="k">${x.alim} alım · ${(+x.miktar.toFixed(3))} ${esc(x.birimAd||x.birim)}
              ${carpanli?` → <b>${(+x.adet.toFixed(0))} ${esc(x.birim)}</b>`:''}
              · ${[...x.firmalar].join(', ')}
              ${x.fiyatlar.length?`<br>birim fiyat ${tl(enAz)}${degisti?` → ${tl(enCok)}`:''}`:''}
              ${degisti?`<br><span style="color:var(--uyari)">⚠ fiyat %${yuzde} değişti</span>`:''}</div></div>
          <div class="l-sag">${tl(x.tutar)}</div></div>`;
      }).join('')}
  </div>`;
}
/* ===== ÜRÜN ALACAĞI — parası ödenmiş, tedarikçide bekleyen mal =====
   Teslimatlar bedelsiz belgelerden (bilgi fişi / irsaliye) TÜRETİLİR.
   Fatura ekranına girdiğin belge burada da sayılır — ikinci kez yazmazsın. */

    .eq('aktif', true).order('tedarikci_ad').order('urun_ad');

  el.innerHTML = `<div class="kart">
    <div class="kbaslik">Tedarikçideki Malımız (ürün alacağı)</div>
    <div class="bilgi-not" style="margin:0 0 8px">Parası ödenmiş ama henüz gelmemiş mal.
      Teslimat geldiğinde <b>Fatura ekranından "Bilgi Fişi"</b> olarak girersin — buradan kendiliğinden düşer,
      ikinci kez yazmana gerek yok.</div>
    ${error?`<div class="bilgi-not" style="color:var(--hata)">Yüklenemedi: ${esc(hataTr(error.message))}</div>`:''}
    ${uyaran.length?`<div class="bilgi-not" style="color:var(--uyari)">⚠ ${uyaran.length} üründe alacak azaldı — yeni sipariş zamanı olabilir</div>`:''}
    ${acik.length===0?'<div class="bilgi-not">Açık ürün alacağı yok.</div>'
      : firmalar.map(f=>`
        <div style="margin:12px 0 4px;font-size:11px;font-weight:900;letter-spacing:.5px;color:var(--ana)">${esc(f)}</div>
        ${acik.filter(a=>a.tedarikci_ad===f).map(a=>{
          const brm = esc(a.urun_birim||'adet');
          const kb = a.kalan_birim!==null ? ` (${a.kalan_birim} ${esc(a.birim_ad||'koli')})` : '';
          return `<div class="liste-satir">
            <div class="l-sol"><div class="b">${a.urun_kod?esc(a.urun_kod)+' · ':''}${esc(a.urun_ad)}</div>
              <div class="k">hakkın ${a.hak_adet} ${brm} · gelen ${a.teslim_adet} ${brm}

              <div class="k">%${a.kalan_yuzde} kaldı</div>

      ${liste.filter(a=>a.bitti).length} alacak tamamen teslim alındı.</div>`:''}
  </div>
  ${owner?`<div class="kart">
    <div class="kbaslik">Yeni Ürün Alacağı Tanımla</div>

      Parayı ayrıca <b>Tedarikçi → Ödeme Kaydet</b>'ten girersen bakiye de doğru olur.</div>
    <label>Firma</label>
    <select id="akFirma">${(KATALOG.tedarikciler||[]).map(t=>`<option value="${t.id}">${esc(t.ad)}</option>`).join('')}</select>
    <label>Ürün</label>
    <select id="akUrun" onchange="akUrunSecildi()">${(KATALOG.urunler||[]).map(u=>`<option value="${u.id}">${esc(u.kod?u.kod+' — ':'')}${esc(u.ad)}</option>`).join('')}</select>
    ${(KATALOG.urunler||[]).length===0?'<div class="bilgi-not" style="color:var(--uyari)">Henüz ürün yok — <b>Yönetim → Yeni Ürün</b>\'den ekleyebilir ya da bir fatura girip tanımlayabilirsin.</div>':''}
    <div class="satir">
      <div><label>Miktar</label><input type="text" inputmode="decimal" autocomplete="off" id="akMiktar" placeholder="örn 5"></div>
      <div><label>Birim</label>

    </div>
    <label>Birim içi adet (koli/paket ise — 1 koli kaç adet?)</label>

// Ürün seçilince kartındaki koli içi adet hazır gelsin (elle yazma hatası olmasın)
function akUrunSecildi(){
  const g = id => document.getElementById(id);
  const u = (KATALOG.urunler||[]).find(x => x.id === g('akUrun')?.value);
  const c = g('akCarpan'), b = g('akBirim');
  if (!u || !c) return;
  if (u.paket_ici_adet > 0){
    if (!c.value) c.value = u.paket_ici_adet;
    if (b && b.value === 'adet') b.value = 'koli';
  }
}
async function alacakKaydet(){
  const g = id => document.getElementById(id);
  const firma = g('akFirma')?.value, urun = g('akUrun')?.value;
  if (!firma){ mesaj('akMsg','hata','Firma seçilmedi.'); return; }
  if (!urun){ mesaj('akMsg','hata','Ürün seçilmedi — önce bir fatura girip ürünleri tanımla.'); return; }
  const pm = paraOku(g('akMiktar')), pc = paraOku(g('akCarpan'));
  const pt = paraOku(g('akTutar')),  pk = paraOku(g('akKritik'));
  if (!pm.ok || !pc.ok || !pt.ok || !pk.ok){ mesaj('akMsg','hata','Geçersiz sayı var — örnek: 5 veya 5,5'); return; }
  if (pm.deger <= 0){ mesaj('akMsg','hata','Miktar girilmedi.'); return; }
  const carpan = pc.deger > 0 ? pc.deger : 1;
  const adet = +(pm.deger * carpan).toFixed(3);
  const birim = g('akBirim').value;
  if (birim !== 'adet' && carpan === 1 &&
      !confirm(`Birim "${birim}" seçtin ama içindeki adet girilmedi.\n${pm.deger} ${birim} = ${pm.deger} adet sayılacak.\n\nDevam edilsin mi?`)) return;
  const ozet = `${pm.deger} ${birim}${carpan>1?` × ${carpan} = ${adet} adet`:''}`;
  if (!confirm(`ÜRÜN ALACAĞI KAYDEDİLECEK\n\n${ozet}\n\nTeslimatlar bilgi fişi girildikçe buradan düşecek.\nOnaylıyor musun?`)) return;
  const btn = g('akKaydet'); btn.disabled = true;
  const { error } = await sb.from('urun_alacak').insert({
    sube_id: PROFIL.sube_id, tedarikci_id: firma, urun_id: urun,
    miktar_adet: adet, birim_ad: birim, birim_carpani: carpan,
    tarih: g('akTarih').value, tutar: pt.deger > 0 ? pt.deger : null,
    kritik_adet: pk.deger > 0 ? pk.deger : null,
    notlar: g('akNot').value.trim() || null, giren_id: PROFIL.id || null
  });
  btn.disabled = false;
  if (error){ mesaj('akMsg','hata', hataTr(error.message)); return; }
  mesaj('akMsg','ok','Ürün alacağı kaydedildi ✓');
  vStok();
}
async function alacakKapat(id){
  if (!confirm('Bu alacak KAPATILACAK (listeden çıkar, kayıt silinmez).\n\nMal tamamen geldiyse veya anlaşma bittiyse kapat.')) return;
  const { error } = await sb.from('urun_alacak').update({ aktif:false }).eq('id', id);
  if (error){ alert('Kapatılamadı: ' + hataTr(error.message)); return; }
  vStok();
}
/* SAYIM
   Eskiden sayım yalnız stok miktarını düzeltiyordu; ayın kârına hiç dokunmuyordu.
   Artık dönemin DEPO DEĞERİ de kaydediliyor — kâr formülü şuna dönüyor:
     satılan malın maliyeti = açılış deposu + ay içi alış − kapanış deposu
   Saymadığın ürün sistemdeki miktarıyla değerlenir; yoksa kapanış stoğu eksik
   çıkar ve kâr olduğundan yüksek görünür. */
let SY_LISTE = [];
function syVarsayilanDonem(){
  // Ayın ilk 10 günündeysek büyük ihtimalle önceki ay kapatılıyor
  const d = new Date(bugun()+'T00:00');
  if (d.getDate() <= 10) d.setMonth(d.getMonth()-1);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
/* Satır satır yuvarla, sonra topla — RPC de öyle yapıyor.
   Toplayıp sonra yuvarlarsak ekrandaki rakam kaydedilenden 1-2 kuruş sapıyor. */
const syTutar = (miktar, birim) => Math.round(miktar * birim * 100) / 100;
function syTopla(){
  const el = document.getElementById('syToplam'); if (!el) return;
  let toplam = 0, sayilan = 0, hatali = 0;
  for (const u of SY_LISTE){
    const inp = document.getElementById('sy_'+u.id);
    const yazili = inp && inp.value.trim() !== '';
    if (!yazili){ toplam += syTutar(u.mevcut, u.mal); continue; }
    const p = paraCoz(inp.value, 3);
    if (!p.ok || p.deger < 0){ hatali++; toplam += syTutar(u.mevcut, u.mal); continue; }
    sayilan++; toplam += syTutar(p.deger, u.mal);
  }
  el.innerHTML = `Sayılan depo değeri <b>${tl(toplam)}</b>`
    + `<span style="color:var(--soluk)"> · ${sayilan}/${SY_LISTE.length} ürün elle sayıldı`
    + (sayilan < SY_LISTE.length ? ', kalanı sistemdeki miktarla değerlendi' : '')
    + '</span>'
    + (hatali ? `<div style="color:var(--hata);margin-top:4px">${hatali} üründe geçersiz sayı var</div>` : '');
}
async function sayimKaydet(){
  const g = id => document.getElementById(id);
  const donem = g('syDonem')?.value, tarih = g('syTarih')?.value;
  if (!donem){ mesaj('syMsg','hata','Hangi ayı kapattığını seç.'); return; }
  if (!tarih){ mesaj('syMsg','hata','Sayım tarihi girilmedi.'); return; }
  const kalemler = []; let hatali = 0, toplam = 0;
  for (const u of SY_LISTE){
    const inp = g('sy_'+u.id);
    const yazili = inp && inp.value.trim() !== '';
    if (!yazili){ toplam += syTutar(u.mevcut, u.mal); continue; }
    const p = paraCoz(inp.value, 3);
    if (!p.ok || p.deger < 0){ hatali++; continue; }
    kalemler.push({ urun:u.id, sayilan:p.deger });
    toplam += syTutar(p.deger, u.mal);
  }
  if (hatali){ mesaj('syMsg','hata', hatali+' üründe geçersiz sayı var — örnek: 12 veya 12,5'); return; }
  const saymadigin = SY_LISTE.length - kalemler.length;
  // Depo DEĞERİ maliyet verisidir — personele miktar onayı gösterilir, TL gösterilmez
  const owner = PROFIL.rol === 'owner';
  if (!confirm(`${ayAdi(donem)} SAYIMI KAYDEDİLECEK\n\n`
    + `Elle sayılan: ${kalemler.length} ürün\n`
    + (saymadigin ? `Saymadığın ${saymadigin} ürün sistemdeki miktarla değerlenecek\n` : '')
    + (owner ? `Depo değeri: ${tl(toplam)}\n` : '')
    + `\n${ayAdi(donem)} kârı bundan sonra bu sayımla hesaplanır.\n`
    + `O ay için daha önce sayım varsa üzerine yazılır.\n\nOnaylıyor musun?`)) return;
  const data = await rpcCagir('rpc_sayim_kaydet', {
    p_idem: idem(), p_sube: PROFIL.sube_id, p_donem: donem, p_tarih: tarih,
    p_kalemler: kalemler, p_not: g('syNot')?.value.trim() || null
  }, 'syKaydet','syMsg','Sayım kaydedildi ✓');
  if (data && data.ok){
    mesaj('syMsg','ok', 'Sayım kaydedildi'
      + (owner ? ` · ${ayAdi(donem)} deposu ${tl(data.toplam)}` : '')
      + ` · ${data.duzeltme} üründe stok düzeltildi ✓`);
    setTimeout(vStok, 1600);
  }
}
async function stokHareketKaydet(){
  let miktar = paraDeger('shMiktar', 3, true);
  const tur = document.getElementById('shTur').value;
  if (miktar===0){ mesaj('shMsg','hata','Miktar boş olamaz.'); return; }
  if (tur==='tuketim' && miktar>0) miktar = -miktar;
  const data = await rpcCagir('rpc_stok_hareket_kaydet',{
    p_idem: idem(), p_sube: PROFIL.sube_id,
    p_urun: document.getElementById('shUrun').value,
    p_tarih: document.getElementById('shTarih').value,
    p_tur: tur, p_miktar: miktar,
    p_not: document.getElementById('shNot').value.trim()||null
  },'shKaydet','shMsg','Hareket kaydedildi ✓');
  if (data && data.ok) vStok();
}

/* ================== TEDARİKÇİ ================== */
let TD_DUZENLENEN = null;
async function vTedarikci(){
  const el = document.getElementById('icerik');

        <div class="aciklama">${(bakiye||[]).filter(b=>+b.bakiye>0).length} firmaya</div></div>

    <div class="kart">
      ${kbaslik('', 'Firmalar', `<button class="btn2" onclick="firmaFormAc()">+ Yeni</button>`)}
      ${KATALOG.tedarikciler.length===0
        ? bosDurum('kutu','Kayıtlı firma yok','Mal aldığın firmayı ekle; faturaları ve bakiyesi buradan takip edilir.')
        : KATALOG.tedarikciler.map(t=>{

            const tutar = b===null ? '' : b===0 ? '—' : tl(Math.abs(b));

            });
          }).join('')}

/* YAPILAN ÖDEMELER — hangi gün, hangi firmaya, neyle, ne kadar.
   Eskiden ödeme kaydı sadece bakiyeyi düşürüyordu; "bu ay ne ödedim" sorusunun
   cevabı hiçbir ekranda yoktu. Özet'teki NAKİT ÇIKIŞI rakamı da buradan besleniyor. */
async function odemeListe(){
  const el = document.getElementById('odemeListe'); if(!el) return;
  const ay = bugun().slice(0,7);
  const { data, error } = await sb.from('tedarikci_odeme')
    .select('tarih,tutar,yontem,cek_no,cek_vade,aciklama,tedarikci(ad)')
    .eq('is_deleted',false).order('tarih',{ascending:false}).limit(60);
  if (error){ el.innerHTML = `<div class="uyari-agir">Ödemeler yüklenemedi: ${esc(hataTr(error.message))}</div>`; return; }
  const list = data||[];
  const buAy = list.filter(o=>String(o.tarih).slice(0,7)===ay);
  const ayToplam = buAy.reduce((a,o)=>a+ +o.tutar,0);
  const YONTEM = {kart:'Kart', nakit:'Nakit', havale:'Havale/EFT', cek:'Çek'};
  el.innerHTML = list.length===0
    ? bosDurum('belge','Ödeme kaydı yok','Bir firmaya ödeme yaptığında yukarıdaki "Ödeme Kaydet" formundan gir — bakiyesi düşer ve Özet\'teki nakit çıkışına yansır.')
    : `<div class="ipucu"><b>${ayAdi(ay)}</b> içinde ${buAy.length} ödeme · toplam <b>${tl(ayToplam)}</b></div>`
      + list.map(o=>srSatir({
          ad: esc(o.tedarikci?.ad || '—'),
          alt: new Date(o.tarih+'T00:00').toLocaleDateString('tr-TR')
               + ' · ' + (YONTEM[o.yontem]||esc(o.yontem||'—'))
               + (o.cek_no?' '+esc(o.cek_no)+(o.cek_vade?' (vade '+new Date(o.cek_vade+'T00:00').toLocaleDateString('tr-TR')+')':''):'')
               + (o.aciklama?' · '+esc(o.aciklama):''),
          tutar: tl(o.tutar)
        })).join('');
}
function abVarsayilanTarih(){
  const d = new Date(bugun()+'T00:00'); d.setDate(0);   // önceki ayın son günü
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')
       + '-'+String(d.getDate()).padStart(2,'0');
}
async function acilisBakiyeKaydet(){
  const g = id => document.getElementById(id);
  const tutar = paraDeger('abTutar');
  if (tutar<=0){ mesaj('abMsg','hata','Tutar boş olamaz.'); return; }
  const firmaAd = g('abTedarikci').selectedOptions[0]?.text || 'firma';
  if (!confirm(`AÇILIŞ BORCU KAYDEDİLECEK\n\n${firmaAd}\n${tl(tutar)}\n`
    + `Tarih: ${new Date(g('abTarih').value+'T00:00').toLocaleDateString('tr-TR')}\n\n`
    + `Bu firmanın daha önce açılışı varsa üzerine yazılır.\nOnaylıyor musun?`)) return;
  const data = await rpcCagir('rpc_acilis_bakiye',{
    p_sube: PROFIL.sube_id, p_tedarikci: g('abTedarikci').value,
    p_tutar: tutar, p_not: g('abNot').value.trim()||null,
    p_tarih: g('abTarih').value || null
  },'abKaydet','abMsg','Açılış bakiyesi kaydedildi ✓');
  if (data && data.ok) vTedarikci();
}
async function acikFaturaYukle(){
  const { data } = await sb.from('v_acik_fatura').select('*').order('vade_tarihi',{nullsFirst:false});
  const el = document.getElementById('acikFaturaListe'); if(!el) return;
  const list = data||[];
  const gecikmis = list.filter(f=>f.gecikti);
  el.innerHTML = list.length===0
    ? bosDurum('belge','Ödenmemiş fatura yok','Vadesi gelen fatura olduğunda burada ve Özet ekranında uyarı çıkar.')
    : (gecikmis.length ? `<div class="uyari-agir">${gecikmis.length} faturanın vadesi geçti · ${tl(gecikmis.reduce((a,x)=>a+ +x.toplam,0))}</div>` : '')
      + list.map(f=>srSatir({
          ad: esc(f.tedarikci_ad) + (f.gecikti?' <span class="rozet rz-hata">GECİKTİ</span>':''),
          alt: new Date(f.tarih+'T00:00').toLocaleDateString('tr-TR')
               + ' · ' + esc(f.belge_no||'belge no yok')
               + (f.vade_tarihi?' · vade '+new Date(f.vade_tarihi+'T00:00').toLocaleDateString('tr-TR'):''),
          tutar: tl(f.toplam),
          tutarAlt: `<button class="bo-btn" style="margin-top:4px" onclick="event.stopPropagation();faturaOdendi('${f.id}')">Ödendi ✓</button>`,
          tikla: `firmaDetay('${f.tedarikci_id}')`
        })).join('');
}
async function faturaOdendi(id){
  if (!confirm('Fatura ödendi olarak işaretlensin mi? (Takip listesinden çıkar. Ödemeyi ayrıca "Ödeme Kaydet"ten girin ki bakiye düşsün.)')) return;
  const { error } = await sb.from('alis').update({ odendi:true }).eq('id', id);
  if (error){ alert('Güncellenemedi: '+error.message); return; }
  acikFaturaYukle();
}
async function acikCekYukle(){
  const { data } = await sb.from('v_acik_cek').select('*').order('cek_vade',{nullsFirst:false});
  const el = document.getElementById('acikCekListe'); if(!el) return;
  el.innerHTML = (data||[]).length===0 ? '<div class="bilgi-not">Portföyde çek yok.</div>' : (data||[]).map(c=>`
    <div class="liste-satir">
      <div class="l-sol"><div class="b">${esc(c.tedarikci_ad)} ${c.gecikti?'<span class="rozet rz-hata">VADESİ GEÇTİ</span>':''}</div>
        <div class="k">Çek No:${esc(c.cek_no||'—')}${c.cek_vade?' · Vade: '+new Date(c.cek_vade+'T00:00').toLocaleDateString('tr-TR'):''} · ${tl(c.tutar)}</div></div>
      <div class="l-sag" style="white-space:normal">
        <button class="btn2" onclick="cekDurum('${c.id}','tahsil')">Tahsil</button>
        <button class="btn-kirmizi" style="margin-top:4px" onclick="cekDurum('${c.id}','karsiliksiz')">Karşılıksız</button>
      </div>
