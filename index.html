     Geçmiş vadeler hiçbir pencereye GİRMEZ, ayrı sayılır. */
  const { bas: hBas, son: hSon } = BB_HAFTA(b);
  const buAy = b.slice(0,7), gecenAy = BB_AYEKLE(buAy,-1);
  const [kredi, kart, donem, vade, taksit, banka, kasa, dunGs, kapanis, tumTaksit, cariH, madenK, fiyatK] = await Promise.all([
    sb.from('v_kredi_taksit_durum').select('vade_tarihi,kalan,kredi_ad,banka,kredi_tur')
      .gt('kalan',0).neq('durum','kapali').lte('vade_tarihi', s30).order('vade_tarihi'),
    sb.from('kart').select('id,ad,banka,sahip,kesim_gunu,son_odeme_gunu,kart_limiti,limit_paylasan_id')
      .eq('aktif',true).eq('is_deleted',false),
    sb.from('v_kart_donem').select('kart_id,donem,kalan,kapanmamis,donem_odemesi,odeme_turu')
      .order('donem',{ascending:false}),
    sb.from('v_vade_liste').select('id,tur,aciklama,vade_tarihi,tutar,durum')
      .in('durum',['acik','tutar_yok']).lte('vade_tarihi', s30).order('vade_tarihi'),
    sb.from('v_kart_taksit').select('firma,banka,vade,donem,taksit_tutari,taksit_no,taksit_sayisi')
      .gt('taksit_sayisi',1).gte('vade', b).lte('vade', s30).order('vade'),
    /* v122 · sahip SONA eklendi: kimlik artik (banka, sahip). Ikinci
       siralama (sahis once, ltd sonra) istemcide — PostgREST tek order
       aliyor ve ekranda hep ayni sira gorunsun. */
    sb.from('v_banka_son').select('banka,bakiye,kayit_zamani,saat_once,sahip').order('banka'),
    sb.from('gun_sonu').select('tarih,kasa_nakit').eq('is_deleted',false).order('tarih',{ascending:false}).limit(1),
    sb.from('gun_sonu').select('tarih,toplam,kasa_nakit').eq('tarih', dun).eq('is_deleted',false).maybeSingle(),
    sb.from('ay_kapanis').select('kapali').eq('donem', gecenAy).eq('is_deleted',false).maybeSingle(),
    /* BF · borc siniflari — borc.html bantVerisi ile AYNI kaynaklar */
    sb.from('v_kredi_taksit_durum').select('kredi_tur,anapara_tutar,faiz_tutar,vergi_masraf_tutar,kalan,durum,anapara_odenen,faiz_odenen'),
    sb.from('v_sahis_hesap_bakiye').select('bakiye'),
    sb.from('maden').select('tur,gram,tarih,alis_tutar').eq('is_deleted',false),
    sb.from('maden_fiyat').select('tur,gram_fiyat,tarih').eq('is_deleted',false).order('tarih',{ascending:false})
  ]);
  const hata = ilkHata(kredi, kart, donem, vade, taksit, banka, kasa, dunGs, kapanis, tumTaksit, cariH, madenK, fiyatK);
  if (hata){ el.innerHTML = hataKutusu(hata, 'vOzet()'); return; }

  /* ---- DÖRT KAYNAK TEK LİSTE: {t:tarih, ad, alt, tutar|null, kaynak} ---- */
  const L = [];
  for (const x of kredi.data||[])
    L.push({ t:x.vade_tarihi, ad:esc(x.kredi_ad)+(x.kredi_tur==='ltd'?' <span class="rozet rz-gri">LTD</span>':''),
             alt:'kredi taksiti'+(x.banka?' · '+esc(x.banka):''), tutar:+x.kalan, k:'kredi' });
  const sonDonem = new Map();            // kart_id -> en yeni dönem (desc sıralı geldi)
  for (const d of donem.data||[]) if (!sonDonem.has(d.kart_id)) sonDonem.set(d.kart_id, d);
  const ekstreliAylar = new Set((donem.data||[]).map(d => d.donem));
  const dik = { girilmedi:0, limitsiz:0 };
  for (const k of kart.data||[]){
    if (k.kart_limiti == null && !k.limit_paylasan_id) dik.limitsiz++;
    const d = sonDonem.get(k.id); if (!d || +d.kalan <= 0 || d.odeme_turu === 'tam') continue;
    if (k.son_odeme_gunu == null || k.kesim_gunu == null) continue;
    /* AR kuralı: ödeme günü kesimden büyükse ekstre ayı, değilse sonraki ay */
    const ay = k.son_odeme_gunu > k.kesim_gunu ? d.donem : BB_AYEKLE(d.donem, 1);
    const t = ay + '-' + String(Math.min(k.son_odeme_gunu, +aySon(ay).slice(8,10))).padStart(2,'0');
    const girilmedi = d.donem_odemesi == null;
    if (girilmedi) dik.girilmedi++;
    /* ⚠ BA kurali Ozet'te de: BILINMEYEN, GECIKMIS DEGILDIR. girilmedi
       NOTR renkte, "vadesi gecen" ALARMINA GIRMEZ; satir listede kalir. */
    /* ⚠ kismi = odeme YAPILMIS, kalan faiziyle DEVREDER — "odenmemis" degildir,
       alarma girmez (kullanicinin itirazi: "o karti odedik"). Satir listede
       "kalan devretti" notuyla kalir. */
    const devretti = d.odeme_turu === 'kismi';
    L.push({ t, ad:esc(k.ad)+(k.banka?' · '+esc(k.banka):''), alt:'kart ekstresi '+d.donem
               +(girilmedi?' · <b class="k">ödeme bilgisi girilmemiş</b>':'')
               +(devretti?' · kalan devretti':''),
             tutar: girilmedi ? +d.kalan : +d.kapanmamis, k:'kart', gi: girilmedi, dv: devretti });
  }
  let tutarsiz = 0;
  for (const v of vade.data||[]){
    const yok = v.durum === 'tutar_yok' || v.tutar == null;
    if (yok) tutarsiz++;
    L.push({ t:v.vade_tarihi, ad:esc(v.aciklama||v.tur), alt:'vergi/vade'+(yok?' · <b style="color:var(--uyari)">tutar bekleniyor</b>':''),
             tutar: yok ? null : +v.tutar, k:'vergi', id: v.id });
  }
  let ekstrede = 0;
  for (const x of taksit.data||[]){
    if (ekstreliAylar.has(x.donem)){ ekstrede++; continue; }   // çift sayım kuralı, yukarıda
    L.push({ t:x.vade, ad:esc(x.firma), alt:'kart taksiti '+x.taksit_no+'/'+x.taksit_sayisi+(x.banka?' · '+esc(x.banka):'')+' · sonraki ekstrede',
             tutar:+x.taksit_tutari, k:'tedarik' });
  }
  L.sort((a,c) => a.t.localeCompare(c.t));

  /* ---- PENCERELER · tutarı olmayan TOPLAMA GİRMEZ, sayılır ----
     ⚠ BO · n ESKIDEN tum kalemleri sayiyordu, ts ayni kalemi BIR DAHA —
     canli sonuc "1 ödeme · 0,00 TL + 1 tutarsız" (tek kalem, tutari yok)
     ve "0,00 geçti" alarmi bosuna telaslandirdi. n artik tutari OLAN kalem. */
  const pen = (f) => { const s = L.filter(f); const ts = s.filter(x => x.tutar == null).length;
    return { n:s.length - ts, t:s.reduce((a,x)=>a+(x.tutar||0),0), ts }; };
  /* ⚠ Alarm ve "dogrulanmis" toplam gi (odeme bilgisi girilmemis) dislar. */
  const gec = pen(x => x.t < b && !x.gi && !x.dv),
        gecGi = L.filter(x => x.t < b && x.gi).length,
        gecDv = L.filter(x => x.t < b && x.dv).length,
        haf = pen(x => x.t >= b && x.t <= hSon),
        g7 = pen(x => x.t >= b && x.t <= s7), g30 = pen(x => x.t >= b && x.t <= s30),
        g7d = pen(x => x.t >= b && x.t <= s7 && !x.gi);
  /* BO · "0 ödeme · 0,00 TL" HICBIR dalda yazilmaz; yalniz tutarsiz varsa
     "M kalemin tutarı girilmemiş" — o eksik VERIDIR, odeme degil. */
  const pz = (p) => p.n
    ? p.n + ' ödeme · ' + tl(p.t) + (p.ts ? ' + <b style="color:var(--uyari)">' + p.ts + ' tutarsız</b>' : '')
    : p.ts + ' kalemin tutarı girilmemiş';
  el.dataset.g7 = JSON.stringify(g7);   // BC3 ölçümü için; ekranda gösterilmez

  /* ---- ELDE · kasa + banka · fark hesaplanmaz ---- */
  const ks = (kasa.data||[])[0];
  const kasaM = ks && ks.kasa_nakit != null
    ? tl(ks.kasa_nakit) + kasaSifirNot(ks.kasa_nakit)
      + ' <span class="k">(' + (ks.tarih === dun ? 'dün akşam' : ks.tarih === b ? 'bugün' : BB_GG(ks.tarih)) + ')</span>'
    : '<span style="color:var(--uyari)">sayılmamış</span>';
  /* v122 · HESAP BASINA. Ayni bankanin sahis ve Ltd hesabi IKI AYRI
     parca; sira banka adi, sonra sahis -> ltd. TOPLAM YOK — v109 karari
     aynen ("toplanmaz, en yenisi gecerli"), yalniz artik her HESAP icin. */
  const bankalar = (banka.data||[]).slice()
    .sort((a,c) => (a.banka||'').localeCompare(c.banka||'','tr')
                || (a.sahip === c.sahip ? 0 : a.sahip === 'ltd' ? 1 : -1));
  const bbSahipAd = s => s === 'ltd' ? 'Ltd' : 'Şahıs';
  const bankaM = bankalar.length
    ? bankalar.map(x => { const eski = +x.saat_once >= 24;
        const ne = +x.saat_once < 1 ? 'az önce' : +x.saat_once < 48 ? Math.round(+x.saat_once) + ' saat önce' : Math.round(+x.saat_once/24) + ' gün önce';
        return esc(x.banka) + ' · ' + bbSahipAd(x.sahip) + ' ' + tl(x.bakiye) + ' <span class="k"' + (eski ? ' style="color:var(--uyari);font-weight:800"' : '') + '>(' + ne + ')</span>'; }).join(' · ')
    : '<span style="color:var(--uyari)">girilmemiş</span>';

  /* ---- BORC SINIFLARI · borc.html bantVerisi formullerinin BIREBIR portu.
     UC SINIF TOPLANMAZ: sahis "bugun kapatsam", Ltd AYRI TUZEL KISILIK,
     maden PIYASAYLA DEGISEN yukumluluk — ayni cinsten degiller.
     Gelecek faiz anaparaya EKLENMEZ; zaman gecerse dogar, ayri satir. */
  const kr2 = (x) => Math.round((Number(x)||0) * 100);
  const SB = { anapara:0, faizMasraf:0, kirilimsiz:0, kirilimsizAdet:0 };
  const LB = { anapara:0, faizMasraf:0, kirilimsiz:0, kirilimsizAdet:0 };
  for (const t of tumTaksit.data||[]){
    if (t.durum === 'kapali') continue;
    const g = t.kredi_tur === 'ltd' ? LB : SB;
    if (t.anapara_tutar === null || t.anapara_tutar === undefined){
      g.kirilimsiz += kr2(t.kalan); g.kirilimsizAdet++; continue; }
    g.anapara    += kr2(t.anapara_tutar) - kr2(t.anapara_odenen || 0);
    g.faizMasraf += kr2(t.faiz_tutar) + kr2(t.vergi_masraf_tutar || 0) - kr2(t.faiz_odenen || 0);
  }
  /* ⚠ KART = HER KARTIN SON DONEMININ KALANI. Donemler TOPLANMAZ — devir
     bir oncekinin kalanini zaten icerir, toplamak CIFT SAYMAK olur
     (olculdu: son donemler 498.756,40 dogru; tum donemler 516.012,14,
     aradaki 17.255,74 mukerrer). */
  let kartS = 0, kartL = 0;
  for (const k of kart.data||[]){ const d = sonDonem.get(k.id); if (!d) continue;
    if (k.sahip === 'ltd') kartL += kr2(d.kalan); else kartS += kr2(d.kalan); }
  const cariT = (cariH.data||[]).reduce((a,h) => a + Math.max(0, kr2(h.bakiye)), 0);
  /* Maden: rayic = gram x SON fiyat. Kur farki yalniz IKISI DE bilinen
     kayitlardan; alis bilinmiyorsa kayit tarihindeki fiyattan TAHMIN
     (borc.html madenDeger kurali — fark tahminle sisirilmez, esler). */
  const fA = (tur, tarih) => { const u = (fiyatK.data||[]).filter(x => x.tur === tur && x.tarih <= tarih);
    return u.length ? u.reduce((a,x) => x.tarih > a.tarih ? x : a, u[0]) : null; };
  let madenBugun = 0, esA = 0, esB = 0, esN = 0, fiyatiYok = false;
  for (const m of madenK.data||[]){
    const sf = fA(m.tur, '9999-12-31');
    if (!sf){ fiyatiYok = true; continue; }
    /* borc.html madenDeger: gram x fiyat_KURUS — bolme YOK. Ilk yazimda
       /100 vardi ve rayic 100 kat kucuk cikti (olculdu: 690,00 vs 69.000). */
    const bugunK = Math.round((Number(m.gram)||0) * kr2(sf.gram_fiyat));
    madenBugun += bugunK;
    let alisK = null;
    if (m.alis_tutar != null && Number(m.alis_tutar) > 0) alisK = kr2(m.alis_tutar);
    else { const af = fA(m.tur, m.tarih);
      if (af) alisK = Math.round((Number(m.gram)||0) * kr2(af.gram_fiyat)); }
    if (alisK !== null){ esA += alisK; esB += bugunK; esN++; }
  }
  const kurFarki = esN ? (esB - esA) : null;
  const sKapat = SB.anapara + kartS, lKapat = LB.anapara + LB.kirilimsiz + kartL;
  const sahipOzel = cariT + madenBugun;
  const tk2 = (k) => (k/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});

  /* ---- DUZELT (kart-5) · sistemin BILMEDIKLERI, tahmin degil ---- */
  const D = [];
  if (!ctx.gunSonuVar) D.push(['gunsonu', 'Bugünün gün sonu girilmedi', "sekmeAc('gunsonu')", 'Gir']);
  if (!dunGs.data) D.push(['gunsonu', 'Dün (' + BB_GG(dun) + ') gün sonu girilmemiş', "sekmeAc('gunsonu')", 'Gir']);
  if (dik.girilmedi) D.push(['kart', dik.girilmedi + ' kartın ödeme bilgisi girilmemiş — tutar olarak ekstre kalanı sayıldı', "bfGit('borc.html#kartlar')", 'Gir']);
  /* ⚠ M3 OLCUMU: mevcut kartin limitini duzenleyen EKRAN YOK (borc.html
     kart formu yalniz YENI kart insert ediyor). Gidecegi olmayan dugme
     YALAN SOYLER — dugme yerine "—". Ekran acilirsa tek satirlik is. */
  if (dik.limitsiz) D.push(['kart', dik.limitsiz + ' kartın limiti girilmemiş', null, null]);
  if (tutarsiz) D.push(['vade', tutarsiz + ' vadenin tutarı girilmemiş — toplama girmedi', "sekmeAc('vergi')", 'Gir']);
  if (!(kapanis.data && kapanis.data.kapali)) D.push(['kapanis', ayAdi(gecenAy) + ' kapatılmamış', "sekmeAc('yonetim')", 'Aç']);
  /* ⚠ SADELESTIRME · "Ay sonu sayımı yok" SATIRI BURADAN KALKTI.
     Ayni ekranda, AY KARI karti ayni seyi daha aciklayici soyluyordu;
     buradaki satir yalniz ucuncu kez tekrarliyordu.
     ⚠ Y11 GUNCELLEMESI — YUKARIDAKI GEREKCE ARTIK ESKI: o gun isaret
       edilen sey "kirmizi kutu + Stok sekmesindeki Sayım kartı" idi.
       O kutu Y11'de KALKTI; aylik sayim YAPILMAYACAK (kullanici karari),
       yani gidilecek bir is yok ve "Bugun Duzelt" listesi zaten
       YAPILABILIR isler listesi.
     ⚠ BILGI HALA KAYBOLMUYOR: Ay Kari blogundaki tek cumle mekanizmayi
       ve YONU ("kâr olduğundan YÜKSEK") soyluyor + kapsam seridi ve
       rakam yanindaki rozet duruyor. */
  if (ekstrede) D.push(['kart', ekstrede + ' kart taksiti zaten girilmiş ekstrenin içinde — ayrıca sayılmadı', "sekmeAc('tedarikci')", 'Gör']);

  /* Kapali kartta GORUNENLER: is SAYISI + gun sonu satirlari (bugun/dun).
     Geri kalani "tumunu gor" arkasinda — kart-5 sabah 6 satirla acilmasin. */
  const DAcik = D.filter(x => x[0] === 'gunsonu'), DGizli = D.filter(x => x[0] !== 'gunsonu');
  /* BL · Satir TIKLANIR, kaynagina goturur. Olculdu: onceden hicbir odeme
     satirinda onclick yoktu; kullanici hakli olarak "o ekranin icine girmem
     gerekmiyor mu" diye sordu. kutuErisim kalibi: role=button + tabindex +
     Enter/Space. aria-label BILEREK YOK: verilseydi satirin kendi icerigini
     (tarih · ad · tutar) ekran okuyucudan GIZLERDI; role=button'da erisilebilir
     ad zaten icerikten gelir. */
  const gitYolu = (x) => x.k === 'kredi' ? "bfGit('borc.html#krediler')"
    : x.k === 'kart' ? "bfGit('borc.html#kartlar')"
    : x.k === 'vergi' ? `ozVadeGit('${x.id || ''}')`
    : "sekmeAc('tedarikci')";
  const satir = (x) => `<div class="sr" role="button" tabindex="0" data-git="${x.k}" style="cursor:pointer"
      onclick="${gitYolu(x)}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}"><div><div class="sr-ad"><span class="rozet rz-gri" style="margin-right:6px">${BB_GG(x.t)}</span>${x.ad}</div>
      <div class="sr-alt">${x.alt}</div></div><div class="sr-tut">${x.tutar == null ? '<span style="color:var(--uyari)">—</span>' : tl(x.tutar)}</div></div>`;
  /* BD kalibi: kapanan LISTE, rakam degil; bugun/yarin satiri gizlenmez. */
  const yarin = BB_GUN(b, 1);
  let bdN = 0;
  const grup = (ozetHtml, sinif, rows, acikMax) => {
    const ac = sinif ? `<div class="${sinif} kb-sr">` : '<div class="kb-sr" style="background:var(--acik)">';
    let h = ac + ozetHtml;
    if (!rows.length) return h + '</div>';
    const acik = rows.filter((x, i) => i < acikMax || x.t === b || x.t === yarin);
    const gizli = rows.length - acik.length;
    if (!gizli) return h + '</div>' + acik.map(satir).join('');
    const id = 'bdG' + (++bdN);
    h += ` <button class="btn2 kb-bt" id="${id}b" aria-expanded="false" aria-controls="${id}k"
      data-t="tümünü gör (${rows.length})" onclick="bdAc(this,'${id}')">tümünü gör (${rows.length})</button></div>`;
    h += acik.map(satir).join('');
    h += `<div id="${id}k" hidden>` + rows.slice(acik.length).map(satir).join('') + '</div>';
    if (gizli) h += `<div id="${id}d" class="sr-alt" style="cursor:pointer;min-height:28px;padding:5px 2px"
      onclick="bdAc(document.getElementById('${id}b'),'${id}')">+${gizli} daha</div>`;
    return h;
  };
  const grupGec = L.filter(x => x.t < b), grupHaf = L.filter(x => x.t >= b && x.t <= hSon),
        grupSonra = L.filter(x => x.t > hSon && x.t <= s30);
  const dg = ctx.donem ? ayAdi(ctx.donem) : '';
  const gs = dunGs.data;

  /* ---- BQ · TASINAN ALTI BLOK (vOzet -> OZ_EK) ----
     BU AY kartina giren dort blok + kasa koprusu HAZIR HTML olarak gelir.
     Uyarilar HAM gelir; mukerrer satir BURADA suzulur, cunku hangi satirin
     bes kartta zaten oldugunu yalniz bu fonksiyon bilir:
       · 'vade' uyarisi — kart-2 listesi 30 gune kadar TUM acik/tutar_yok
         vadeyi satir satir gosteriyor; uyari kumesi (durum='acik') onun
         ALT KUMESI. Pencere disinda kalan (uyari_gun > 30) vade DUSMEZ.
       · 'eksik_gun' uyarisi — DUNUN satiri kart-5'te zaten var (D listesi).
         Daha eski eksik gunler dusmez, "Kapalıydı/Gir" dugmeleriyle kalir.
     ⚠ ACIL sayaci suzgecten SONRAKI listeden hesaplanir; rozet ile altindaki
       satirlar ayni sayiyi soylesin. */
  const ek = OZ_EK || {};
  const uyL = (ek.uyarilar || []).filter(x =>
    !(x.tip === 'vade' && x.tarih <= s30) && !(x.tip === 'eksik_gun' && x.tarih === dun));
  /* BR · Tur basina TEK ozet satiri; ayrinti "tumunu gor"un arkasinda.
     ⚠ ACIL sayaci artik GRUP sayar: on bir vadesiz fatura tek is, tek alarm.
       Onceden satir sayiyordu ve "ACİL 16" gercekte 4 isi anlatiyordu. */
  const uyG = uyariGrupla(uyL);
  const d5Gizli = DGizli.length + uyG.ayrintiAdet;
  const d5Tum = D.length + uyL.length;

  /* ---- BES KART · onaylanan telefon gorseli ---- */
  el.innerHTML = `
    ${!bankalar.length ? `<div class="uyari-orta kb-sr">Ödeme gücü hesaplanamıyor · banka bakiyesi eksik
       <button class="btn2 kb-bt" onclick="katlaAc('bbKutu',this)">Banka gir</button></div>` : ''}
    <div class="kart" id="bfDun" style="cursor:pointer" onclick="sekmeAc('gunsonu')">
      ${kbaslik('DÜN', BB_GG(dun) + (gs ? ' · gün sonu ✓' : ''), gs ? '' : '<span class="rozet rz-uyari">gün sonu girilmemiş</span>')}
      ${gs ? `<div class="bilgi-not" style="margin-top:0">ciro <b>${tl(gs.toplam)}</b> · Kasada sayılan <b>${gs.kasa_nakit != null ? tl(gs.kasa_nakit) : 'sayılmamış'}</b>${gs.kasa_nakit != null ? kasaSifirNot(gs.kasa_nakit) : ''}</div>`
           : `<div class="bilgi-not" style="margin-top:0">Dünün gün sonu girilmemiş — dokun, gir.</div>`}
    </div>
    <div class="kart" id="odemelerKart">
      ${kbaslik('ÖNÜMÜZDEKİ 7 GÜN', tl(g7d.t) + ' doğrulanmış', gec.n ? `<span class="rozet rz-hata">geçti ${tl(gec.t)}</span>` : '')}
      ${gecGi ? `<div class="sr-alt">${gecGi} kartın ödeme bilgisi girilmemiş — alarma sayılmadı, "Bugün düzelt"te</div>` : ''}

/* Günlük ciro grafiği — kütüphanesiz SVG.
   Önceki hâli adım sayara benziyordu: her sütunun arkasında bej "hedef şeridi",
   yuvarlak uçlar, tek renk, iki eksen etiketi. Finans grafiği değil aktivite çubuğuydu.
   Şimdi:
     · zemin şeridi YOK, düz uçlu sütun
     · hafta sonu ayrı ton — kampüste hafta sonu düşüğü BAŞARISIZLIK DEĞİL, takvim
     · üç yatay kılavuz + gerçek rakam
     · haftalık tarih etiketi (1, 8, 15, 22, 29)
     · kayıt girilmemiş gün: ince kesik taban çizgisi — "satış yok" ile karışmasın */
/* gunlukCiro(gunler, ayStr, kasaCikis)
   Grafiğin çizdiği sütunlar, başlıktaki toplam ve ortalama çizgisi TEK kaynaktan
   (bu fonksiyonun döndürdüğü seri) hesaplanır — üçü ayrı yerden gelirse tutmaz.
     kart         = gun_sonu.kart_toplam
     TOPLAM NAKİT = gun_sonu.kasa_nakit + o gün kasadan ödenen
                    ⚠ v62: "kasadan ödenen EKLENMEZ (zaten gider)" YANLIŞTI.
                    Gider tarafı o parayı zaten düşüyor; ciroya koymayınca
                    kâr o kadar EKSİK çıkıyordu. Kasaya giren nakit =
                    sayılan + ödenen. Aynı dosyanın :2464'teki yorumu bunu
                    baştan beri doğru tarif ediyordu, kod uygulamıyordu.
     SAHİP HAREKETİ  kasaya koyduğu/çektiği para SATIŞ DEĞİL — düşülür.
     gerçek ciro  = kart + toplam nakit
     Z'deki nakit (gun_sonu.nakit_toplam) toplam nakdi DEĞİŞTİRMEZ; tek işi
     ay sonu KDV beyanını beslemek (Temmuz'un Z nakdi → 28 Ağustos'ta ödenecek KDV).
   Kasa sayılmamışsa nakit BİLİNMEZ (uydurulmaz). Sayılan Z'dekinden azsa bu
   KASA AÇIĞIDIR — ayrı işaretlenir, sıfıra kırpılıp gizlenmez. */
function gunlukCiro(gunler, ayStr, kasaCikis, sahipNakit){
  const yil=+ayStr.slice(0,4), ayNo=+ayStr.slice(5,7);
  const gunSayisi=new Date(yil, ayNo, 0).getDate();
  const seri=[];
  let tResmi=0, tKart=0, tNakit=0, tKdvNakit=0, tZDisi=0, tGercek=0, kayitli=0, acikGun=0, bilinmeyen=0;
  const bugunS=bugun();
  for(let d=1; d<=gunSayisi; d++){
    const ts=ayStr+'-'+String(d).padStart(2,'0');
    const k=gunler.find(x=>x && x.tarih===ts);
    const g={ gun:d, tarih:ts, hafta:new Date(yil,ayNo-1,d).getDay(),
              gelecek: ts>bugunS, bugun: ts===bugunS };
    if(!k){ g.durum = g.gelecek ? 'gelecek' : 'eksik'; seri.push(g); continue; }
    kayitli++;
    g.resmi=+k.toplam||0;
    g.kart=+k.kart_toplam||0;
    g.nakit=+k.nakit_toplam||0;
    if(k.kasa_nakit===null || k.kasa_nakit===undefined){
      g.durum='kasa_sayilmadi'; g.nakitToplam=null; g.zDisi=null; g.gercek=g.resmi; bilinmeyen++;
    }else{
      // v62 · Kasaya GİREN nakit = sayılan + o gün kasadan ödenen.
      // Sahibin koyduğu/çektiği para satış değil, düşülür (SQL zaten öyle
      // yapıyordu; JS yapmıyordu — iki taraf tek tanıma bağlandı).
      const cikan  = (kasaCikis && kasaCikis[ts]) || 0;
      const sahip  = (sahipNakit && sahipNakit[ts]) || 0;
      g.nakitToplam = +k.kasa_nakit + cikan;
      g.zDisi = g.nakitToplam - g.nakit - sahip;
      g.gercek = g.kart + g.nakitToplam - sahip;
      // KASA AÇIĞI eşiği: artık kasadan ödenen düşülmüş DEĞİL, dahil.
      // Eski hâlde meşru bir ödeme günü yapay olarak "açık" işaretleniyordu.
      g.durum = g.zDisi<0 ? 'kasa_acigi' : 'tam';
      if(g.zDisi<0) acikGun++;
    }
    tResmi+=g.resmi; tKart+=g.kart; tKdvNakit+=g.nakit;
    tNakit+=(g.nakitToplam||0); tZDisi+=(g.zDisi||0); tGercek+=g.gercek;
    seri.push(g);
  }
  return { seri, gunSayisi,
           toplamKart:tKart,          // karttan gelen
           toplamNakit:tNakit,        // elle girilen nakit — BİZİM nakdimiz
           toplamKdvNakit:tKdvNakit,  // bunun KDV'ye dahil olan kısmı (Z raporundan)
           toplamZDisi:tZDisi,        // KDV'ye girmeyen kısım = toplamNakit − toplamKdvNakit
           toplamResmi:tResmi,        // Z toplamı (kart + KDV'ye dahil nakit)
           toplamGercek:tGercek,      // kart + elle girilen nakit
           kayitliGun:kayitli, ortalama: kayitli? tGercek/kayitli : 0,
           kasaAcigiGun:acikGun, kasaSayilmayanGun:bilinmeyen };
}
function ciroGrafigi(v){
  if(!v || !v.kayitliGun) return '';
  const { seri, gunSayisi, ortalama } = v;
  const G=340, Y=152, sol=40, sag=6, ust=14, alt=30;
  const iw=G-sol-sag, ih=Y-ust-alt;
  const ham=Math.max(...seri.map(g=>g.gercek||0), 1);
  const bas=Math.pow(10, Math.floor(Math.log10(ham)));
  const tavan=Math.ceil(ham/(bas/2))*(bas/2);
  const gen=iw/gunSayisi, kal=Math.max(gen-2.2, 1.6);
  const kisa=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.',',')+'b':String(Math.round(n));
  const yOf=val=>ust+ih-(val/tavan)*ih;
  const GUNAD=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  // Paranın NEREDE olduğuna göre ayrılır: kart bankada, nakit elde, Z dışı elde ama beyansız
  const KART='#4F86D6', NAKIT='#2F8F6B', ZDISI='#E08A3C', ACIK='#B3402F';

  let kilavuz='';
  [0,0.5,1].forEach(o=>{
    const val=tavan*o, y=yOf(val);
    kilavuz+=`<line x1="${sol}" y1="${y.toFixed(1)}" x2="${sol+iw}" y2="${y.toFixed(1)}"
      stroke="var(--cizgi)" stroke-width="1"${o?' stroke-dasharray="2 4"':''}/>`
      +`<text x="${sol-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5"
        font-weight="700" fill="#8189A0">${kisa(val)}</text>`;
  });

  // Sütunlar SADECE görsel. Telefonda sütun ~7px, kısa günlerde birkaç piksel;
  // parmakla basılmaz. Tıklama ve ipucu, sütunun ÜSTÜNDEKİ tam boy görünmez alanda.
  let sut='';
  seri.forEach(g=>{
    const x=sol+(g.gun-0.5)*gen-kal/2, tb=ust+ih;
    if(g.durum==='gelecek'){
      sut+=`<rect x="${x.toFixed(1)}" y="${(tb-6).toFixed(1)}" width="${kal.toFixed(1)}" height="6"
        fill="none" stroke="#C9BFA6" stroke-width="1" stroke-dasharray="2 2" opacity=".8"/>`; return;
    }
    if(g.durum==='eksik'){
      sut+=`<rect x="${x.toFixed(1)}" y="${(tb-9).toFixed(1)}" width="${kal.toFixed(1)}"
        height="9" fill="${ACIK}" opacity=".16"/>`; return;
    }
    if(g.durum==='kasa_acigi'){
      // Gerçek giren para resmîden AZ: sütun gerçeği gösterir, gün ayrı renkle işaretlenir
      const h=Math.max((g.gercek/tavan)*ih, 1.2);
      sut+=`<rect x="${x.toFixed(1)}" y="${(tb-h).toFixed(1)}" width="${kal.toFixed(1)}"
        height="${h.toFixed(1)}" fill="${ACIK}"/>`; return;
    }
    // Alttan üste: kart (bankada) → nakit (elde, beyanlı) → Z dışı (elde, beyansız)
    let y=tb;
    [[g.kart,KART],[g.nakit,NAKIT],[g.zDisi>0?g.zDisi:0,ZDISI]].forEach(([v,c])=>{
      if(!(v>0)) return;
      const h=Math.max((v/tavan)*ih, 0.8);
      y-=h;
      sut+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${kal.toFixed(1)}"
        height="${h.toFixed(1)}" fill="${c}"/>`;
    });
    if(g.bugun) sut+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${kal.toFixed(1)}"
      height="${(tb-y).toFixed(1)}" fill="none" stroke="var(--ana-koyu)" stroke-width="1"/>`;
  });

  const METIN={
    gelecek:  ()=>'gelecek gün',
    eksik:    ()=>'gün sonu GİRİLMEMİŞ — dokun ve gir',
    kasa_acigi:g=>'KASA AÇIĞI '+tl(g.zDisi)+' · Z '+tl(g.resmi)+' · gerçek '+tl(g.gercek),
    kasa_sayilmadi:g=>'Kart '+tl(g.kart)+' · kasa sayılmadı, nakit bilinmiyor',
    tam:      g=>'Kart '+tl(g.kart)+' · Nakit '+tl(g.nakitToplam)
                 +' (KDV\'ye dahil '+tl(g.nakit)+') · toplam '+tl(g.gercek)
  };
  let hedef='';
  seri.forEach(g=>{
    const hx=sol+(g.gun-1)*gen;
    const tik = g.durum!=='gelecek' ? ` class="gc-tik" data-t="${g.tarih}"` : '';
    hedef+=`<rect${tik} x="${hx.toFixed(1)}" y="${ust}" width="${gen.toFixed(1)}" height="${ih}"
      fill="transparent"><title>${g.gun} ${GUNAD[g.hafta]} — ${(METIN[g.durum]||METIN.tam)(g)}</title></rect>`;
  });

  let etiket='';
  for(let d=1; d<=gunSayisi; d+=7)
    etiket+=`<text x="${(sol+(d-0.5)*gen).toFixed(1)}" y="${Y-16}" text-anchor="middle"
      font-size="9.5" font-weight="700" fill="#8189A0">${d}</text>`;

  const oy=yOf(ortalama);
  const lej=[[KART,'Kart'],[NAKIT,"KDV'ye dahil nakit"],[ZDISI,'Nakit'],[ACIK,'açık / eksik']];
  let lejant='', lx=0;
  lej.forEach(([c,ad])=>{
    lejant+=`<rect x="${lx}" y="-7" width="7" height="7" fill="${c}"/>
      <text x="${lx+10}" y="-1" font-size="8.5" font-weight="700" fill="#8189A0">${ad}</text>`;
    lx += 15 + ad.length*4.3;
  });
  return `<div class="grafik-sar"><svg viewBox="0 0 ${G} ${Y}" role="img"
      aria-label="Günlük gerçek ciro: resmî ve Z dışı yığılmış">
    ${kilavuz}${sut}${hedef}
    <line x1="${sol}" y1="${oy.toFixed(1)}" x2="${sol+iw}" y2="${oy.toFixed(1)}"
      stroke="var(--metin)" stroke-width="1.1" stroke-dasharray="5 3" opacity=".6"/>
    <text x="${sol+iw}" y="${(oy-4).toFixed(1)}" text-anchor="end" font-size="9.5"
      font-weight="800" fill="var(--metin)" opacity=".75">kayıtlı gün ort. ${kisa(ortalama)}</text>
    ${etiket}
    <g transform="translate(${sol},${Y-1})">${lejant}</g>
  </svg></div>`;
}

/* Grafikte bir güne dokununca o günün gün sonu kaydı açılır (drill-down). */
async function gunDetay(tarih){
  const ov=udKutu(), ic=document.getElementById('udIcerik');

  ov.classList.add('acik');
  const [gs, kg, no] = await Promise.all([
    sb.from('gun_sonu')
      // z_foto_path/pos_slip_foto_path eksikti: bu panelden Z raporu açılamıyordu
      .select('*, gun_sonu_kasa(kasa_no,sira,z_no,kart_toplam,nakit_toplam,toplam,z_foto_path,pos_slip_foto_path,is_deleted), gun_sonu_kdv(kasa_no,oran,kdv_tutar,is_deleted)')
      .eq('tarih',tarih).eq('sube_id', AKTIF_SUBE).eq('is_deleted',false).maybeSingle(),
    sb.from('gider').select('tutar,aciklama').eq('tarih',tarih).eq('kasadan',true).eq('is_deleted',false),
    sb.from('tedarikci_odeme').select('tutar,tedarikci(ad)').eq('tarih',tarih).eq('yontem','nakit').eq('is_deleted',false)
  ]);
  const g=gs.data;
  const bas=(sag)=>`<div class="ud-ust"><div style="flex:1;min-width:0">
      <div class="ud-kod">GÜN SONU</div><div class="ud-ad">${esc(trh)}</div>${sag||''}</div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  if(!g){
    ic.innerHTML=bas()+`<div class="ud-govde">
      <div class="uyari-agir">Bu güne ait gün sonu kaydı yok.</div>
      <div class="ipucu">Gün Sonu sekmesinden bu tarihi seçip Z raporlarını girebilirsin.</div>
      <button class="btn" onclick="udKapat();sekmeAc('gunsonu')">Gün Sonu'na Git</button></div>`;
    return;
  }
  const cikisT=(kg.data||[]).reduce((a,x)=>a+ +x.tutar,0)+(no.data||[]).reduce((a,x)=>a+ +x.tutar,0);
  const kasa=g.kasa_nakit===null?null:+g.kasa_nakit;
  const zDisi=kasa===null?null:(kasa-(+g.nakit_toplam||0)+cikisT);
  const gercek=(+g.toplam)+(zDisi||0);
  const ks=(g.gun_sonu_kasa||[]).filter(x=>!x.is_deleted).sort((a,b)=>a.kasa_no-b.kasa_no||(a.sira||1)-(b.sira||1));
  const kd=(g.gun_sonu_kdv||[]).filter(x=>!x.is_deleted);
  ic.innerHTML=bas()+`<div class="ud-govde">
    <div class="ud-kunye" style="grid-template-columns:1fr 1fr">
      <div><div class="ud-et">GERÇEK</div><div class="ud-dg">${tl(gercek)}</div></div>
      <div><div class="ud-et">RESMÎ / Z</div><div class="ud-dg">${tl(g.toplam)}</div></div>
    </div>
    ${zDisi===null
      ? '<div class="uyari-orta">Kasa sayılmamış — bu günün Z dışı nakdi bilinmiyor.</div>'
      : zDisi<0
        ? `<div class="uyari-agir">KASA AÇIĞI ${tl(zDisi)} — kasada Z raporunun dediğinden az para sayılmış.</div>`
        : ''}
    <div class="ud-bas"><span class="ud-blk">DÖKÜM</span></div>
    ${ozSatir('Kart', tl(g.kart_toplam))}
    ${ozSatir('Z nakit', tl(g.nakit_toplam))}
    ${kasa!==null?ozSatir('Kasada sayılan', tl(kasa)):''}
    ${cikisT>0?ozSatir('Kasadan ödenen', tl(cikisT)):''}
    ${zDisi!==null?ozSatir(zDisi<0?'Kasa açığı':'Z dışı nakit', tl(zDisi)):''}
    ${ozSatir('GERÇEK TOPLAM', tl(gercek), true)}
    ${ks.length?`<div class="ud-bas" style="margin-top:16px"><span class="ud-blk">YAZARKASALAR</span></div>`
      +ks.map(k=>{
        const e=`K${k.kasa_no}${zCok(ks,k.kasa_no)?'/'+(k.sira||1):''}`;
        return `<div class="ud-satir"><div class="ud-trh">${e}</div>
        <div><div style="font-weight:800;font-size:13px">Z: ${esc(k.z_no||'—')}</div>
          <div class="ud-alt">Kart ${tl(k.kart_toplam)} · Nakit ${tl(k.nakit_toplam)}</div>
          <div style="margin-top:6px">${belgeBtn(k.z_foto_path,'Z Raporu',`${trh} — Kasa ${k.kasa_no} Z Raporu`)}${slipBtn(k.pos_slip_foto_path,'Slip',`${trh} — Kasa ${k.kasa_no} POS Slip`)}</div></div>
        <div class="ud-tut">${tl(k.toplam)}</div></div>`;}).join('')
      : `<div style="margin-top:14px">${belgeBtn(g.z_foto_path,'Z Raporu',`${trh} — Z Raporu`)}${slipBtn(g.pos_slip_foto_path,'POS Slip',`${trh} — POS Slip`)}</div>`}
    ${kd.length?`<div class="ud-bas" style="margin-top:16px"><span class="ud-blk">KDV</span>
        <span class="ud-trend">${tl(kd.reduce((a,x)=>a+ +x.kdv_tutar,0))}</span></div>`
      +kd.map(x=>ozSatir('%'+x.oran+' (K'+x.kasa_no+')', tl(x.kdv_tutar))).join('')
      :'<div class="uyari-orta" style="margin-top:12px">Bu güne KDV dökümü girilmemiş — beyan eksik kalır.</div>'}
    ${g.notlar?`<div class="bilgi-not" style="margin-top:12px">${esc(g.notlar)}</div>`:''}
    <button class="btn" onclick="udKapat();sekmeAc('gunsonu')">Gün Sonu Ekranına Git</button>
  </div>`;
}
/* Özet ay ay gezilebilir. Eskiden bugünün ayına SABİTTİ: ayın 1'inde açtığında
   önceki ayı göremiyordun, geçen ayın kârı/cirosu kayboluyordu. */
let OZ_AY = null;
function ozAyDegistir(fark){
  const t = new Date((OZ_AY||bugun().slice(0,7))+'-01T00:00');
  t.setMonth(t.getMonth()+fark);
  const yeni = t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0');
  if (yeni > bugun().slice(0,7)) return;          // geleceğe gitme
  OZ_AY = yeni; vOzet();
}
async function vOzet(){

    sb.from('gun_sonu').select('*').eq('tarih', bugun()).eq('is_deleted', false).maybeSingle(),
    sb.from('v_kdv_ay').select('*').eq('donem', ay),
    sb.from('v_aylik_ozet').select('*').eq('donem', ay),
    // v63 · şube süzgeci artık tek çıkış noktasında (bkz. SUBE_TABLOLARI);

    sb.from('v_uyarilar').select('*').order('tarih'),

    // Geçmiş aya bakılırken sınır bugün DEĞİL, o ayın son günü olmalı
    sb.from('gun_sonu').select('tarih,toplam,kart_toplam,nakit_toplam,kasa_nakit').gte('tarih', ay+'-01').lte('tarih', aySon(ay)).eq('is_deleted', false),
    sb.from('gider').select('tarih,tutar').eq('kasadan',true).eq('is_deleted',false).gte('tarih', ay+'-01').lte('tarih', aySon(ay)),
    sb.from('tedarikci_odeme').select('tarih,tutar').eq('yontem','nakit').eq('is_deleted',false).gte('tarih', ay+'-01').lte('tarih', aySon(ay)),
    // v62 · Sahibin kasaya koyduğu/çektiği nakit SATIŞ DEĞİL. SQL bunu
    // z_disi_nakit'ten düşüyordu, grafik düşmüyordu — tanım ayrışıyordu.
    sb.from('owner_hareket').select('tarih,yon,tutar').eq('yontem','nakit').eq('is_deleted',false).gte('tarih', ay+'-01').lte('tarih', aySon(ay)),
    /* ⚠ DL · FINANSMAN MALIYETI AYRI OKUNUR. Kullanicinin sozu:
       "krediler borclar benim tercihim sonucta; o ay odedigin personel,
       sgk, yemek, alinan malzemenin faturasi o ayin gideridir".
       OLCULDU: temmuz giderinin %83'u, agustos giderinin %69'u KREDI
       FAIZI. Ekranda "ay kari" diye gorunen rakam isletmenin
       kazancini degil, kazanctan FINANSMAN MALIYETI dusulmus halini
       gosteriyordu; sahibi kafenin para kazanip kazanmadigina bakarken
       bu rakama bakip yanlis karar verebilirdi.
       ⚠ VERI ZATEN AYRI: "Kredi Faizi" kendi gider_kategori satiri.
         Yeni alan/tablo/migration YOK — yalniz ayirma.
       ⚠ FORMUL DEGISMIYOR: v_aylik_ozet'e dokunulmuyor, ay_kari ayni
         kaliyor. Ustune iki satir ekleniyor. */
    sb.from('gider').select('tutar,kdv_tutar,kdv_indirilebilir_kayit,kategori_id,gider_kategori(ad)')
      .eq('is_deleted',false).gte('tarih', ay+'-01').lte('tarih', aySon(ay)),
    /* ⚠ ADIM 15 · AYRI TUR ATILMADI, mevcut toplu cagriya EKLENDI.
       Ozet'in "eksik gun" hesabi gun sonu listesiyle AYNI fonksiyonu
       kullaniyor; o fonksiyon kapali gunleri de istiyor. */
    sb.from('kapali_gun').select('tarih').eq('is_deleted',false)
      .gte('tarih', ay+'-01').lte('tarih', aySon(ay)),
    /* ⚠ ADIM 13 FAZ 2 · AYRI TUR ATILMADI, mevcut toplu cagriya EKLENDI
         (ADIM 15 kalibi).
       ⚠ IKI DONEM birden isteniyor: kar iki sayima birden dayaniyor —
         kapanis BU ayin, acilis BIR ONCEKI ayin sayimi. Yalniz bu ayi
         sorsaydim, acilisi kismi olan bir ay "tam olculdu" gorunurdu. */
    sb.from('sayim').select('donem,sayilan_urun,toplam_urun')
      .in('donem', [ayOnceki(ay), ay]).eq('is_deleted', false),
    /* ⚠ Y19 · SISTEMIN ILK GUNU. Ayri tur atilmadi, mevcut toplu
       cagriya EKLENDI (ADIM 15 kalibi). Gun sonu listesi de AYNI
       sorguyu kullaniyor — iki ekran ayni capayi okur. */
    ilkGunSonuSorgusu()
  ]);
  /* KRİTİK DİLİMLER — biri düşerse Özet HİÇ çizilmez.
     gs/ayGunler = gün sonu · ozet = v_aylik_ozet · kdv = v_kdv_ay ·
     uyari = v_uyarilar · ayKasadan/ayNakitOdeme/ayOwner = kasa çıkışları.
     Son üçü de kritik: sessizce boş dönerlerse kasadaki para OLDUĞUNDAN
     ÇOK görünür. `talep` bölgesel — yalnız bir sayaç besliyor. */
  const kritikHata = ilkHata(gs, kdv, ozet, uyari, ayGunler, ayKasadan, ayNakitOdeme, ayOwner);
  if (kritikHata){ el.innerHTML = '<h2 class="bolum">Özet</h2>' + hataKutusu(kritikHata, 'vOzet()'); return; }
  /* v63 · Bu iki görünüm dönem+şube başına TEK satır döndürür. [0] almak
     ikinci şube açıldığında "hangisi gelirse o" demekti — sıralama garantisi
     yok. Süzgeç artık tek çıkış noktasında; burada satır sayısı da denetleniyor. */
  if ((ozet.data||[]).length > 1 || (kdv.data||[]).length > 1)
    console.warn('Özet/KDV birden fazla satır döndürdü — şube süzgeci beklendiği gibi çalışmıyor.');
  const g = gs.data, k = (kdv.data||[])[0], o = (ozet.data||[])[0], u = uyari.data||[];
  // Ayın gerçek cirosu/Z dışı nakdi artık v_aylik_ozet'te hesaplanıyor (gercek_ciro,
  // z_disi_nakit). Burada yalnız BUGÜNÜN kasa çıkışı gerekiyor — günlük kutu için.
  const kasaCikislari = [...(ayKasadan.data||[]), ...(ayNakitOdeme.data||[])];
  const kasadanBugun = kasaCikislari.filter(x=>x.tarih===bugun()).reduce((a,x)=>a+ +x.tutar,0);
  // Grafik, başlıktaki toplam ve ortalama çizgisi hep bu tek seriden okunur
  // v62 · Grafik artık özet ile AYNI tanımı kullanıyor. Haritalar gün

  const kasaCikisMap = {};
  kasaCikislari.forEach(x=>{ kasaCikisMap[x.tarih] = (kasaCikisMap[x.tarih]||0) + (+x.tutar); });
  const sahipNakitMap = {};
  (ayOwner.data||[]).forEach(x=>{
    const isaret = x.yon === 'koyus' ? 1 : -1;
    sahipNakitMap[x.tarih] = (sahipNakitMap[x.tarih]||0) + isaret * (+x.tutar);
  });
  const GC = gunlukCiro(ayGunler.data||[], ay, kasaCikisMap, sahipNakitMap);
  /* ⚠ ADIM 15 · TEK TANIM: gun sonu listesiyle AYNI fonksiyon.
     ⚠ kapali_gun SORGUSU DUSERSE TAM SAYILMAZ. Bos dizi vermek
       "kapali gun yok" demektir ve kapatilan gunu eksik gosterirdi —
       yani sessiz yanlis. Hata varsa tamlik BILINMIYOR isaretlenir. */
  const kapaliHata = !!ayKapali.error;
  const OZ_ILK_GUN = ilkGunSonuTarihi(ilkGunSonu);
  const OZ_EKSIK = kapaliHata ? [] : ayinEksikGunleri(
    ay, tarihKumesi(ayGunler.data), tarihKumesi(ayKapali.data), OZ_ILK_GUN);
  /* ===== ADIM 13 FAZ 2 (C) · SAYIM KAPSAMI · TEK KAYNAK =====
     Serit, rozet, "en az" oneki ve Ay Kari blogu AYNI iki degeri okur;
     ayri ayri hesaplasalardi ekranin bir yani "sayim var" derken
     otekisi "tam olcum degil" derdi.
     ⚠ SORGU DUSERSE SESSIZ KALINMAZ: bos dizi "sayim tam" demektir ve
       ekran olmayan bir kesinligi iddia ederdi (ADIM 15'teki kapaliHata
       dersi). Hata varsa KAPSAM BILINMIYOR. */
  const sayimHata = !!aySayim?.error;
  const sayimlar = {};
  (aySayim?.data || []).forEach(s => { sayimlar[s.donem] = s; });
  const kismiMi = s => !!s && +s.toplam_urun > 0 && +s.sayilan_urun < +s.toplam_urun;
  /* Kar IKI sayima birden dayaniyor: kapanis BU ayin, acilis BIR ONCEKI
     ayin sayimi (olculdu, v_aylik_ozet). Biri kismiyse olcum tam degil. */
  const sayimKismi = !!(o && o.stok_bazli) && !sayimHata
    && (kismiMi(sayimlar[ay]) || kismiMi(sayimlar[ayOnceki(ay)]));
  /* kart-3 (odemelerBlogu) ve kart-5 ayni tamlik bilgisini okur —
     ikisi ayri hesaplarsa ayrisir. Serit de buradan besleniyor. */
  OZ_TAMLIK = { ay, eksikGunler: OZ_EKSIK, bilinmiyor: kapaliHata,
                /* Y23 · serit "tam" diyebilmek icin en az bir gun
                   beklenmis olmali. kayitVar ile AYNI SEY DEGIL —
                   gerekce kapsamSeridiCiz'de, olcumuyle. */
                gunBekleniyor: ayinGunBekleniyorMu(ay, OZ_ILK_GUN),
                sayimYok: !!(o && !o.stok_bazli), sayimKismi, kayitVar: !!o };
  kapsamSeridiCiz();
  const acikTalep = talep.data||[];
  if (acikTalep.length > 0){
    const gunFarki = Math.floor((Date.now() - new Date(acikTalep[0].created_at).getTime()) / 86400000);
    u.unshift({ tip:'talep', mesaj: acikTalep.length + ' bekleyen yapılacak/alınacak' + (gunFarki >= 1 ? ` (en eskisi ${gunFarki} gündür)` : ''), tarih: acikTalep[0].created_at });
  }

     1.000,00'dir. Kredi faizinde KDV olmadigi icin bu satir orada
     hicbir seyi degistirmez — sifir cikarir. */
  const giderNet = (x) => (Number(x.tutar) || 0)

     regex'in /i bayragi bunlari eslestirmez — olculdu:

       /faiz/i.test('FAİZ')        -> false

     buyuk harfle "FAİZ" acilirsa o kalem ayrimin DISINDA kalir; ekranda

     ONCE ad normallestirilir.
     ⚠ Once [ıİ] -> i, SONRA toLowerCase: 'İ'.toLowerCase() birlesik
       nokta birakir ('i' + U+0307) ve desen yine tutmaz.
     ⚠ TEK YER: iki desen de bu yoldan gecer, ikinci bir tanim yok.

     ⚠ `desenAd` ARTIK MODUL KAPSAMINDA (esc'in yanında): Belgeler
       aramasi da ayni normallestirmeye ihtiyac duyunca buradaki yerel
       tanim KALDIRILDI, kopyalanmadi. Davranis birebir ayni. */
  const kategoriTopla = (sec) => {

    const m = new Map();
    for (const x of d){
      const ad = x.gider_kategori && x.gider_kategori.ad;
      if (!ad || !sec(desenAd(ad))) continue;
      m.set(ad, (m.get(ad) || 0) + giderNet(x));
    }
    const kalemler = [...m.entries()].map(([ad, tutar]) => ({ ad, tutar }))
      .sort((a,b) => b.tutar - a.tutar);
    return { tutar: kalemler.reduce((a,k) => a + k.tutar, 0), kalemler };
  };

      ${/* ⚠ Y11 · HER AY CALAN KIRMIZI KUTU KALKTI, ICINDEKI KAPANABILIR

      ${!o.stok_bazli && o.kapanis_stok != null && o.acilis_stok == null

      ${/* ⚠ ADIM 13 FAZ 2 · KISMI SAYIM. stok_bazli TRUE ama sayim eksik

      ${/* ⚠ "kalanı sistemdeki miktarla değerlendi" EVIN KENDI CUMLESI —

/* ===== SÜRÜM KONTROLÜ — telefon eski sürümde kalmasın =====
   GitHub Pages 10 dk önbellek veriyor; ana ekrana eklenmiş uygulamada
   çok daha uzun kalabiliyor. Personel eski kurallarla çalışmasın diye
   uygulama sunucudaki sürümü sorup fark varsa uyarır. */
const SURUM = (document.querySelector('meta[name="surum"]')?.content || '?');
async function surumKontrol(){
  try{
    // Yalnız dosyanın başını çek (sürüm etiketi ilk 3000 baytta)
    const y = await fetch(location.pathname + '?s=' + Date.now(), {
      cache: 'no-store', headers: { 'Range': 'bytes=0-3000' }
    });
    if (!y.ok && y.status !== 206) return;
    const t = await y.text();
    const m = t.match(/name="surum"\s+content="([^"]+)"/);
    if (m && m[1] !== SURUM) surumUyari(m[1]);
  }catch(e){ /* ağ yoksa sessiz kal — çalışmayı engelleme */ }
}
function surumUyari(yeni){
  if (document.getElementById('surumBar')) return;
  const d = document.createElement('div');
  d.id = 'surumBar';
  d.innerHTML = `<span>Yeni sürüm var (${esc(yeni)}). Eski sürümde yanlış kayıt yapabilirsin.</span>
    <button onclick="surumYenile()">YENİLE</button>`;
  document.body.appendChild(d);
}
function surumYenile(){
  // Sorgu ekleyerek önbelleği atla — ana ekrana eklenmiş uygulamada da çalışır
  location.replace(location.pathname + '?v=' + Date.now());
}

/* ================== GÜN SONU ==================
   Bir kasa aynı gün BİRDEN FAZLA Z basabilir (cihaz arızası).
   Her Z = kendi bloğu: kendi Z No'su, tutarı, KDV'si, fotoğrafı.
   Blok anahtarı: "kasa_sıra" → 1_1, 1_2, 2_1 ...                          */
let ZLISTE = { 1:[1], 2:[1] };                     // her kasada hangi Z sıraları açık
function zAnahtarlar(){ return [1,2].flatMap(n => ZLISTE[n].map(s => ({ n, s, k:n+'_'+s }))); }

let KDV_SAYAC = 0;
function kdvSatirEkle(k, oran, satis, kdv, sabit){
  KDV_SAYAC++;
  const n = KDV_SAYAC;
  const kap = document.getElementById('kdvSatirlari_'+k);
  if(!kap) return;
  const div = document.createElement('div');
  div.className='kdv-satir'; div.id='kdvS_'+n;
  const oranKutu = sabit
    ? `<span style="width:82px;flex:none;text-align:center;font-weight:800;color:var(--ana);padding:11px 0">%${oran||10}</span><input type="hidden" id="kdvO_${n}" value="${oran||10}">`
    : `<select id="kdvO_${n}"><option value="1"${oran==1?' selected':''}>%1</option><option value="10"${(oran==10||!oran)?' selected':''}>%10</option><option value="20"${oran==20?' selected':''}>%20</option></select>`;
  div.innerHTML = `
    ${oranKutu}
    <input type="text" inputmode="decimal" autocomplete="off" id="kdvT_${n}" placeholder="Z'deki %${oran||10} TOPLAM" value="${satis||''}">
    <input type="text" inputmode="decimal" autocomplete="off" id="kdvV_${n}" placeholder="KDV (sistem hesaplar)" value="${kdv||''}">
    ${sabit?'':`<button class="sil" onclick="document.getElementById('kdvS_${n}').remove(); kasaHesapla();">✕</button>`}`;
  kap.appendChild(div);
  // Oran toplam satış yazılınca KDV'yi sistem hesaplar (Z'deki TOPKDV farklıysa üzerine yazılabilir)
  // KDV kutusu bir kez ELLE düzeltildiyse sistem bir daha üzerine YAZMAZ.
  // (Z'deki TOPKDV birkaç kuruş farklı olabilir — beyana giden Z'dekidir.)
  const hesapla = () => {
    const vEl = document.getElementById('kdvV_'+n);
    if (vEl.dataset.elle === '1') return;              // kullanıcı yazdıysa dokunma
    const t = paraOku(document.getElementById('kdvT_'+n)).deger;
    const o = +document.getElementById('kdvO_'+n).value || 0;
    vEl.value = t > 0 ? (t - t/(1+o/100)).toFixed(2) : '';
  };
  const vEl0 = document.getElementById('kdvV_'+n);
  vEl0.addEventListener('input', ()=>{ vEl0.dataset.elle = vEl0.value.trim()==='' ? '' : '1'; });
  if (kdv) vEl0.dataset.elle = '1';                    // hazır değerle geldiyse elle sayılır
  paraBagla(document.getElementById('kdvT_'+n), ()=>{ hesapla(); kasaHesapla(); });
  paraBagla(vEl0, kasaHesapla);
  const oranEl = document.getElementById('kdvO_'+n);
  if (oranEl.tagName === 'SELECT') oranEl.addEventListener('change', hesapla);
}
function kdvOku(k){
  const sonuc = [];
  document.querySelectorAll('#kdvSatirlari_'+k+' .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const o = document.getElementById('kdvO_'+n).value;
    const tEl = document.getElementById('kdvT_'+n), vEl = document.getElementById('kdvV_'+n);
    const pt = paraOku(tEl), pv = paraOku(vEl);
    if (!pt.ok || !pv.ok) throw new Error('KDV satırında geçersiz tutar var — örnek: 15710 veya 15710,50');
    if (tEl.value.trim()!=='' || vEl.value.trim()!=='')
      sonuc.push({ oran:+o, satis_toplam:pt.deger, kdv_tutar:pv.deger });
  });
  return sonuc;
}
/* ===== BELGE GÖRÜNTÜLEYİCİ — yüklenen fotoğrafı tek tıkla aç ===== */
function belgeKapat(){
  const ov=document.getElementById('belgeOverlay');
  if(ov){ ov.style.display='none'; const r=document.getElementById('boResim'); if(r) r.src=''; }
}
function belgeKutusu(){
  let ov=document.getElementById('belgeOverlay');
  if(!ov){
    ov=document.createElement('div'); ov.id='belgeOverlay';
    ov.innerHTML=`<div class="bo-ust"><span id="boBaslik"></span><button class="bo-kapat" onclick="belgeKapat()">✕</button></div>
                  <div class="bo-govde"><div class="bo-yukleniyor" id="boDurum">Belge açılıyor...</div><img id="boResim" alt="" style="display:none"></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', e=>{ if(e.target===ov || e.target.classList.contains('bo-govde')) belgeKapat(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') belgeKapat(); });
  }
  return ov;

async function belgeAc(yol, baslik){
  if(!yol){ bildir('Bu belge yüklenmemiş.', 'hata'); return; }
  // PDF resim olarak açılmaz — imzalı bağlantıyı yeni sekmede aç
  if (/\.pdf$/i.test(yol)){
    try{
      const { data, error } = await sb.storage.from('belgeler').createSignedUrl(yol, 300);
      if (error || !data?.signedUrl) throw new Error(error?.message || 'bağlantı alınamadı');
      window.open(data.signedUrl, '_blank', 'noopener');
    }catch(e){ bildir('Belge açılamadı: ' + hataTr(e.message), 'hata'); }
    return;
  }
  const ov=belgeKutusu();
  document.getElementById('boBaslik').textContent = baslik||'Belge';
  const img=document.getElementById('boResim'), durum=document.getElementById('boDurum');
  img.style.display='none'; img.src=''; durum.style.display='block'; durum.textContent='Belge açılıyor...';
  ov.style.display='flex';
  try{
    const { data, error } = await sb.storage.from('belgeler').createSignedUrl(yol, 300);
    if (error || !data || !data.signedUrl) throw new Error(error?.message || 'imzalı bağlantı alınamadı');
    img.onload = ()=>{ durum.style.display='none'; img.style.display='block'; };
    img.onerror = ()=>{ durum.textContent='Görsel açılamadı.'; };
    img.src = data.signedUrl;
  }catch(e){
    durum.textContent = 'Belge açılamadı: ' + hataTr(e.message);
  }
}
/* Listelerde uzun notu kırp. Köşeli parantezli teknik izler ([belge
   degistirildi ...], [SILINDI ...]) kayıtta kalsın ama ekranda görünmesin —
   kullanıcıya bakan satır 250 karakterlik dosya yolu taşımamalı. */
function notKisalt(t, sinir){

  const en = sinir || 80;
  return temiz.length <= en
    ? esc(temiz)
    : `<span title="${esc(temiz)}">${esc(temiz.slice(0, en))}…</span>`;
}
function belgeBtn(yol, etiket, baslik){

}
// POS slip artık toplanmıyor: yoksa hiç gösterme (eski kayıtlarda varsa açılabilir kalsın)
function slipBtn(yol, etiket, baslik){ return yol ? belgeBtn(yol, etiket, baslik) : ''; }
// Bir kasadan o gün birden fazla Z var mı (etikette sıra gösterilsin mi)
function zCok(satirlar, kasaNo){ return satirlar.filter(x=>x.kasa_no===kasaNo).length > 1; }
/* ===== PARA GİRİŞ KATMANI — virgül/nokta güvenli, sessiz sıfır YOK ===== */
/* SON AYRAÇ ONDALIK AYRACIDIR — faturayı okurken uyguladığımız kuralın aynısı;
   iki yerde farklı davranırsa mutabakat tutmaz.
     "1.250,50" → 1250.50   (nokta binlik)      "1250,50" → 1250.50
     "1250.50"  → 1250.50   (İngilizce yazım)   "1.250"   → 1250   (nokta + 3 hane = binlik)
     "3,456"    → 3.45      (virgül hep ondalık; fazla hane kırpılır)
   Eskiden bu alanlar type="number" idi: virgül yazılınca tarayıcı value'yu BOŞ
   döndürüyor, "+value||0" sessizce 0 yazıyordu. Fatura kaleminde miktar 0 olunca
   satır büsbütün düşüyordu — kimse fark etmiyordu.
   Tutar alanlarında eksi yoktur; sayım düzeltmesi gibi işaretli alanlar eksiVar=true geçer. */
function paraCoz(ham, bas, eksiVar){
  const n = bas || 2;
  const t = String(ham == null ? '' : ham);
  const eksi = !!eksiVar && /^\s*-/.test(t);
  const s = t.replace(/[^\d.,]/g,'');
  // Boş = 0 (kural bu). Ama içi dolu olup tek rakam yoksa bu hatadır, sessizce 0 olmamalı.
  if (!/\d/.test(s)) return t.trim() === ''
    ? { ok:true, deger:0, metin:'' }
    : { ok:false, deger:0, metin:'', hata:'geçersiz tutar' };
  const son = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
  let tam, ond;
  if (son < 0){ tam = s; ond = ''; }
  else {
    const kuyruk = s.slice(son+1).replace(/[.,]/g,'');
    if (s[son] === '.' && kuyruk.length > n){ tam = s.replace(/[.,]/g,''); ond = ''; }  // nokta = binlik
    else { tam = s.slice(0, son).replace(/[.,]/g,''); ond = kuyruk.slice(0, n); }
  }
  tam = tam.replace(/^0+(?=\d)/,'') || '0';
  const d = parseFloat(tam + (ond ? '.' + ond : ''));
  if (!isFinite(d)) return { ok:false, deger:0, metin:'', hata:'geçersiz tutar' };
  return { ok:true, deger:+((eksi ? -d : d).toFixed(n)),
           metin: (eksi ? '-' : '') + tam + (ond ? ',' + ond : '') };
}
function paraTemizle(el, eksiVar){
  // Yazarken sadece geçersiz karakteri at — ayraçlara dokunma, yoksa alan zıplar
  if(!el) return;
  const t = el.value;
  const eksi = !!eksiVar && /^-/.test(t);
  const s = (eksi ? '-' : '') + t.replace(/[^\d.,]/g,'');
  if (s !== t) el.value = s;
}
/* ==================================================================
   ⚠ CP · YAZARKEN BİNLİK AYIRAÇ (iki dosyada AYNI kod: borc.html'de de var)
   Sahip "sıfırları adam gibi saymıyor, içimden sayarak giriyorum" dedi.
   Ölçüldü: paraBicimle ayıraç KOYMUYORDU (paraCoz'un ürettiği 'metin'
   gruplamasız) — yani hiçbir alanda ne yazarken ne çıkarken gruplama vardı.

   KURALLAR (hepsi ölçüldü):
   · ONDALIK KISIM GRUPLANMAZ — 1234,5678 -> 1.234,5678
   · YARIM GİRİŞ BOZULMAZ — "36569," virgülü kalır, "0," sıfırı kalır,
     eksi alanlarda tek başına "-" yazılabilir
   · NOKTA = ONDALIK. Gruplama ayıracını uygulama koyar, kullanıcı yazmaz;
     bu yüzden kullanıcının yazdığı '.' ondalık ayracı sayılır ve ','a
     çevrilir ("36569.93" -> "36.569,93"). Virgül varsa noktalar bizim
     ayracımızdır, atılır.
   · MİKTAR/GRAM (bas === 3) GRUPLANMAZ — 412,950 üç ondalıkla kalır.
   ⚠ İMLEÇ: değeri her tuşta yeniden yazmak imleci sona atar ve ortadan
     düzeltmeyi imkânsız kılar — bu, gruplamamaktan kötüdür. İmleç,
     ÖNÜNDEKİ ayıraç-dışı karakter sayısı korunarak yeniden konur. */
function paraCanli(ham, eksiVar){
  const eksi = !!eksiVar && /^[-−]/.test(String(ham));
  /* ⚠ NOKTA HER ZAMAN GRUPLAMADIR — bizim koyduğumuz ayıraç. Kullanıcının
     ondalık olarak yazdığı nokta, YAZILDIĞI ANDA (paraCanliUygula) virgüle
     çevrilir; buraya gelen nokta artık yalnız ayıraçtır.
     ⚠ ÖLÇÜLDÜ: burada "virgül yoksa ilk nokta ondalıktır" denenmişti —
     "3.656" yazılınca sonraki tuşta kendi ayıracımızı ondalık sanıp
     "3,6569" üretiyordu. */
  let s = String(ham).replace(/[^\d.,]/g, '').replace(/\./g, '');
  const iv = s.indexOf(',');
  if (iv >= 0) s = s.slice(0, iv + 1) + s.slice(iv + 1).replace(/,/g, '');   // tek virgül
  const v = s.indexOf(',');
  let tam = v < 0 ? s : s.slice(0, v);
  const ond = v < 0 ? '' : s.slice(v);              // ',' DAHİL — hiç gruplanmaz
  tam = tam.replace(/^0+(?=\d)/, '');
  return (eksi ? '-' : '') + tam.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ond;
}
/* ==================================================================
   ⚠ DM · YAPISTIRMA YOLU YAZMA YOLUNDAN AYRI
   ==================================================================
   OLCULDU (06.09, gercek tarayici yapistirmasi):
     yapistirilan   ekranda cikan
     1234.56    ->  123.456,00      100 KAT
     580551.85  ->  58.055.185,00   100 KAT
     29,976.97  ->  29,97           binde bir
   SEBEP: paraCanli ilk satirda butun noktalari kosulsuz siliyor ve
   bu YAZMA icin DOGRU — kullanicinin ondalik olarak yazdigi nokta
   paraCanliUygula'da o anda virgule cevriliyor (e.data === '.'),
   yani paraCanli'ya gelen nokta artik yalniz gruplama ayracidir.
   ⚠ AMA e.data TEK TUSTUR. Yapistirmada inputType 'insertFromPaste'
     olur ve e.data BOSTUR — cevirim hic calismaz, sonra nokta
     gruplama sanilip silinir. Yazma yolunun dogru varsayimi,
     yapistirmada yanlis.
   ⚠ paraCoz'a DOKUNULMADI: o iki bicimi de dogru cozuyor. Sorun,
     degerin paraCoz'a ULASMADAN paraCanli tarafindan bozulmasiydi.
   COZUM: yapistirmada alanin TAMAMI paraCoz'dan gecirilir, cikan
   degerden TR bicimiyle yeniden yazilir. Yazma yolu AYNEN durur. */
function paraYapistirmaMi(el, e){
  if (!e) return false;
  const it = e.inputType || '';
  if (it === 'insertFromPaste' || it === 'insertFromDrop') return true;
  /* inputType vermeyen tarayici icin OLCUT: bu olayda e.data YOK ve
     alan bir karakterden FAZLA buyudu — tek tusla olmaz. */
  return !e.data && (el.value.length - String(el.__paraEski || '').length) > 1;
}
/* ⚠ BELIRSIZ GIRDI SESSIZCE SECILMEZ. "1,234" hem 1,23 hem 1.234
   olabilir (tek ayirac, arkasinda TAM 3 hane). Secilen yorum alanin
   ALTINDA yazilir; kullanici yanlissa duzeltir. Sessiz secim, bu
   turda duzelttigimiz hatanin ta kendisi. */
const PARA_BELIRSIZ = /^\s*[-−]?\s*\d{1,3}[.,]\d{3}\s*$/;
function paraNotYaz(el, metin){
  let n = el.nextElementSibling;
  if (!n || !n.classList || !n.classList.contains('para-not')){
    if (!metin) return;
    n = document.createElement('div'); n.className = 'para-not';
    el.insertAdjacentElement('afterend', n);
  }
  n.textContent = metin || '';
  n.style.display = metin ? '' : 'none';
}
function paraYapistir(el, eksiVar){
  const ham = el.value;
  const eksi = !!eksiVar && /^\s*[-−]/.test(ham);
  const r = paraCoz(ham, 2, eksiVar);
  const metin = r.ok ? String(r.metin || '0').replace(/^-/, '') : null;
  if (metin == null) return false;               // cozulemedi: yazma yoluna dus
  const yeni = paraCanli((eksi ? '-' : '') + metin, eksiVar);
  el.value = yeni; el.__paraEski = yeni;
  try { el.setSelectionRange(yeni.length, yeni.length); } catch(err){}
  paraNotYaz(el, PARA_BELIRSIZ.test(ham)
    ? '"' + ham.trim() + '" -> ' + yeni + ' olarak okundu. Yanlışsa düzelt.'
    : '');
  return true;
}
function paraCanliUygula(el, e, eksiVar){
  /* ⚠ DM · YAPISTIRMA ONCE: yazma yolunun nokta varsayimi burada
     gecerli degil (yukarida). Cozulemezse yazma yoluna DUSER. */
  if (paraYapistirmaMi(el, e) && paraYapistir(el, eksiVar)) return;
  const geri = !!(e && /^delete/i.test(e.inputType || ''));
  let t = el.value;
  let p = el.selectionStart == null ? t.length : el.selectionStart;
  /* ⚠ Kullanıcı ondalık ayracı olarak NOKTA yazdıysa (masaüstü klavyesi)
     o noktayı ANINDA virgüle çevir — gruplama noktalarıyla karışmasın.
     Yalnız BU tuşta yazılan noktaya bakılır (e.data), alandaki ötekilere değil. */
  if (e && e.data === '.' && p > 0 && t[p-1] === '.') t = t.slice(0, p-1) + ',' + t.slice(p);
  /* ⚠ Backspace AYIRACIN üstündeyse: ayıraç geri gelir ve hiçbir şey
     silinmiş olmaz — kullanıcı tuşa basar, ekran değişmez. O durumda
     ayıracın önündeki RAKAM silinir; silme tuşu iş görür. */
  if (geri && p > 0 && paraCanli(t, eksiVar) === (el.__paraEski || '')){
    t = t.slice(0, p - 1) + t.slice(p); p -= 1;
  }
  const yeni = paraCanli(t, eksiVar);
  const n = t.slice(0, p).replace(/\./g, '').length;   // imleç önündeki gerçek karakter
  el.value = yeni; el.__paraEski = yeni;
  let k = 0, i = 0;
  for (; i < yeni.length && k < n; i++) if (yeni[i] !== '.') k++;
  while (i < yeni.length && yeni[i] === '.') i++;      // ayıracın sağına geç
  try { el.setSelectionRange(i, i); } catch(err){}
}
function paraBicimle(el, bas, eksiVar){
  // Alandan çıkınca tek biçime getir: kullanıcı ne kaydettiğini görsün
  if(!el || !el.value.trim()) return;
  const r = paraCoz(el.value, bas, eksiVar);
  if (!r.ok) return;
  /* ⚠ CP · bas===3 (gram/miktar) GRUPLANMAZ; para alanı yazarkenki
     biçimin AYNISINA oturur, blur gruplamayı geri almaz. */
  const m = bas === 3 ? r.metin : paraCanli(r.metin, eksiVar);
  if (el.value !== m){ el.value = m; el.__paraEski = m; }
}
function paraOku(el, bas, eksiVar){
  if(!el) return { ok:true, deger:0 };
  return paraCoz(el.value, bas, eksiVar);
}
function paraBagla(el, sonra, bas, eksiVar){
  if(!el) return;
  el.__paraEski = el.value;
  /* ⚠ CP · bas===3 MİKTAR/GRAM: eski davranış (yalnız temizle, gruplama yok).
     Para alanında paraCanliUygula paraTemizle'nin işini de yapıyor
     (geçersiz karakteri o da atıyor), üstüne imleci koruyor. */
  el.addEventListener('input', (e) => {
    if (bas === 3) paraTemizle(el, eksiVar); else paraCanliUygula(el, e, eksiVar);
    if(sonra) sonra();
  });
  el.addEventListener('blur',  () => { paraBicimle(el, bas, eksiVar); if(sonra) sonra(); });
}
/* type="number" alanına "1,5" yazılınca tarayıcı value'yu BOŞ döndürüyor; "+value||0"
   sessizce 0 yazıyordu — tutar sıfırlanıyor, kimse fark etmiyordu. Bu alanlar artık
   type="text" + paraBagla (yazarken temizler) + paraDeger (okurken virgülü çevirir). */
function paraDeger(id, bas, eksiVar){ return paraOku(document.getElementById(id), bas, eksiVar).deger; }
function paraBaglaHepsi(idler, bas, eksiVar){ idler.forEach(i => paraBagla(document.getElementById(i), null, bas, eksiVar)); }

/* ==================================================================
   ADIM 14 B · OKUMA DILI — TEK KAYNAK
   ==================================================================
   OLCULDU: ayni is icin SEKIZ ayri elle yazilmis cumle vardi
   ("Okunamayan:" · "● N eksik:" · "Bekleyen:" · "<alan> okunamadı" ·
   "· ELLE:" · "✎ N KDV satırında matrah boştu..." · borc'ta
   "bulunamadı" ve "elle girildi"). Ayni durum ekranin her yerinde
   BASKA turlu soyleniyordu.
   ⚠ SAHIP SECTI (B seti): metin hem DURUMU hem SONRAKI ADIMI soyler.
     A seti ("bulunamadı") ne yapilacagini soylemiyordu; C setindeki
     tek harflik fark ("okunamadı"/"okunmadı") kacirilabilirdi.
   ⚠ METIN BURADAN BASKA HICBIR YERDE YAZILMAZ. Ikinci kez yazilan
     cumle ucuncu lehceyi dogurur — bugunku sorunun kendisi buydu.
   ⚠ KISALTILMADI: secilen metin BUDUR. Sigmama sorunu SARMALAYARAK
     cozuldu (CSS), metin kirparak degil — kirpilan yari, metnin
     secilme sebebi olan "ne yapacagim" yarisidir. */
const DIL = {
  EKSIK:      'OKUNAMADI — elle yaz',
  HESAPLANDI: 'HESAPLANDI — belgeden okunmadı',
  /* ⚠ TANIMLI AMA index'te HENUZ CIZILMIYOR — GOZDEN KACMA DEGIL.
     "Elle girildi" isaretini bugun yalniz borc.html'in onay tablosu
     ciziyor; index'in fatura tablosu okuma ANINDA bir kez ciziliyor,
     kullanici sonradan alani duzeltince yeniden cizilmiyor. Tabloyu
     her tusa basista yeniden cizmek DAVRANIS degisikligi olurdu ve
     bu tur GORUNUM turu. Terim burada duruyor ki borc.html sozluge
     baglanirken ucuncu bir lehce dogmasin. */
  ELLE:       'ELLE YAZILDI',
  /* Secilen uclunun disinda ama tabloda gereken notr hal. */
  OKUNDU:     'belgeden okundu'
};
/* "<alan1>, <alan2>: OKUNAMADI — elle yaz" */
function dilEksik(alanlar){
  const a = (alanlar || []).filter(Boolean);
  return a.length ? a.join(', ') + ': ' + DIL.EKSIK : '';
}
/* "HESAPLANDI — belgeden okunmadı (KDV ÷ %10)" */
function dilHesaplandi(nasil){
  return DIL.HESAPLANDI + (nasil ? ' (' + nasil + ')' : '');
}
/* ⚠ DORDUNCU HAL — SECILEN UCLUNUN DISINDA, BUGUNKU KELIME KORUNDU.
   "Gecersiz" ile "okunamadi" AYNI SEY DEGIL: birinde alan BOS,
   otekinde kullanici bir sey YAZMIS ama sayi degil. Ikincisine
   "elle yaz" demek yanlis yonlendirir — zaten elle yazmis.
   Sozluge dorduncu kalip eklemek AYRI BIR KARAR; uydurulmadi. */
function dilGecersiz(alanlar){
  const a = (alanlar || []).filter(Boolean);
  return a.length ? a.join(', ') + ' geçersiz' : '';
}

/* ==================================================================
   ADIM 14 · "OKUYUCU BULAMADI" ILE "KULLANICI BILEREK BOS BIRAKTI"
   ==================================================================
   Ikisi de BOS bir alandir ama ayni sey DEGILDIR: ilki bir EKSIK,
   ikincisi bir KARAR. Ekran ikisini ayirt edemeyince okunamayan KDV
   sessizce 0,00 olarak kayda giriyordu (olculdu: arac ve gider
   akislarinda kayda giden kdv 0, durum satiri YESIL).
   Fark alanin KENDISINDE tasinir; kullanici alana dokunur dokunmaz
   isaret DUSER — o andan sonra bosluk artik onun karari.
   ⚠ Yeni bir gorunum deseni DEGIL: yalniz bir bayrak. Renk/metin
     birlestirmesi B TURU'nun isi. */
function okunamadiIsaretle(id, dolduMu){
  const e = document.getElementById(id); if (!e) return;
  if (dolduMu){ delete e.dataset.okunamadi; return; }
  e.dataset.okunamadi = '1';
  if (e.dataset.okunamadiBagli !== '1'){
    e.dataset.okunamadiBagli = '1';
    e.addEventListener('input', () => { delete e.dataset.okunamadi; });
  }
}
/* Alan HALA bos VE okuyucu onu bulamamis mi? Kullanici bir sey yazdiysa
   (0 dahil) bayrak dusmustur ve burasi false doner. */
function okunamadiMi(id){
  const e = document.getElementById(id);
  return !!e && e.dataset.okunamadi === '1' && !String(e.value || '').trim();
}
/* ===== Z RAPORU OKUMA — sistem doldurur, PERSONEL DOĞRULAR ===== */
async function zRaporuOku(k){
  const inp = document.getElementById('gsZFoto_'+k);
  const drm = document.getElementById('gsOkuDurum_'+k);
  const btn = document.getElementById('gsOku_'+k);
  const yaz = (t, sinif) => { if(drm){ drm.className = 'oku-durum '+(sinif||''); drm.textContent = t; } };

  const dosyaVar = !!(inp && inp.files && inp.files[0]);
  const mevcutYol = (DUZENLE && DUZENLE.foto[k] && DUZENLE.foto[k].z) || null;
  if (!dosyaVar && !mevcutYol){ yaz('Önce Z raporu fotoğrafını seç.', 'uyari'); return; }

  btn.disabled = true; const eski = btn.textContent; btn.textContent = 'Okunuyor...';
  yaz('Fotoğraf okunuyor, birkaç saniye sürebilir...', '');
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('Oturum bulunamadı, tekrar giriş yapın.');

    let govde;
    if (dosyaVar){
      const k = await fotoKucult(inp.files[0], 2000, 0.92);   // okuma için net kopya
      const b64 = await new Promise((coz, red)=>{
        const fr = new FileReader();
        fr.onload = ()=>coz(fr.result); fr.onerror = ()=>red(new Error('Fotoğraf okunamadı'));
        fr.readAsDataURL(k.veri);
      });
      govde = { gorsel: b64 };
    } else {
      govde = { yol: mevcutYol };
    }

    const y = await fetch(SB_URL + '/functions/v1/z-raporu-oku', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+session.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify(govde)
    });
    const s = await y.json();
    if (!y.ok || !s.ok) throw new Error(s?.hata || ('Okuma başarısız ('+y.status+')'));

    const v = s.veri || {};
    const dolduruldu = [];
    const koy = (id, deger, etiket) => {
      if (deger === null || deger === undefined || deger === '') return;
      const e = document.getElementById(id); if(!e) return;
      e.value = String(deger).replace('.', ',');
      e.dispatchEvent(new Event('input', { bubbles:true }));
      e.classList.add('oku-dolu'); dolduruldu.push(etiket);
    };
    koy('gsZNo_'+k,   v.z_no,          'Z No');
    koy('gsKart_'+k,  v.kart_toplam,   'Kart');
    koy('gsNakit_'+k, v.nakit_toplam,  'Nakit');

    // KDV satırları: fişteki TOPKDV esas (sistem hesabı ezilmez)
    const kap = document.getElementById('kdvSatirlari_'+k);
    if (kap && Array.isArray(v.kdv) && v.kdv.length){
      kap.innerHTML = '';
      v.kdv.forEach(x => kdvSatirEkle(k, x.oran, x.satis_toplam, x.kdv_tutar, false));
      dolduruldu.push('KDV');
    }
    kasaHesapla();

    const eksik = Array.isArray(v.okunamayan) ? v.okunamayan.filter(Boolean) : [];
    /* ⚠ ADIM 14 · OKUYUCUNUN DOLDURAMADIGI ALAN ADIYLA YAZILIR ve
       durum YESIL VERILMEZ. Eskiden yalniz `dolduruldu.length`e
       bakiliyordu: nakit okunamamis bir Z'de satir yine yesil
       "Okundu → Z No · Kart" diyordu, eksigin adi hic gecmiyordu. */
    const ZOR = [['gsZNo_'+k,'Z No'], ['gsKart_'+k,'Kart tutarı'],
                 ['gsNakit_'+k,'Nakit tutarı']];
    ZOR.forEach(([id]) => okunamadiIsaretle(id,
      !!(document.getElementById(id)||{}).value));
    const bosKalan = ZOR.filter(([id]) => okunamadiMi(id)).map(x => x[1]);
    /* ⚠ Form bir BOS KDV satiriyla aciliyor — satir saymak yetmez,
       DOLU satir aranir (zDurum ile ayni olcut). */
    if (![...document.querySelectorAll('#kdvSatirlari_'+k+' .kdv-satir')]
        .some(d => { const i = d.id.split('_')[1];
          return (document.getElementById('kdvT_'+i)?.value || '').trim() !== ''
              || (document.getElementById('kdvV_'+i)?.value || '').trim() !== ''; }))
      bosKalan.push('KDV dökümü');
    let msj = 'Okundu → ' + (dolduruldu.join(' · ') || 'alan doldurulamadı') + '. ⚠️ Rakamları fişle KARŞILAŞTIR.';
    /* ⚠ ADIM 14 B · TEK CUMLE, SOZLUKTEN. Eskiden IKI ayri cumle vardi
       ("Okunamayan: ..." ve "BOŞ KALDI: ... — elle yaz.") ve ikisi ayni
       seyi soyluyordu: okuyucunun bildirdigi eksik ile ekranda BOS
       kalan alan. Tekillestirildi; kesisenler bir kez yazilir. */
    const eksikHepsi = [...new Set([...eksik, ...bosKalan])];
    if (eksikHepsi.length) msj += ' ' + dilEksik(eksikHepsi);
    if (v.uyari) msj += ' (' + v.uyari + ')';
    yaz(msj, (dolduruldu.length && !eksikHepsi.length) ? 'ok' : 'uyari');
  }catch(e){
    yaz('Okunamadı: ' + hataTr(e.message) + ' — alanları elle yaz.', 'uyari');
  }finally{
    btn.disabled = false; btn.textContent = eski;
  }
}

  const ks = (data.gun_sonu_kasa||[]).filter(k=>!k.is_deleted);

      if (sat.length) sat.forEach(x=>kdvSatirEkle(key, x.oran, x.satis_toplam, x.kdv_tutar, false));

    <div class="bilgi-not" style="margin:0 0 8px">Kayıt <b>silinmiyor</b>, üzerine yazılıyor. Fotoğrafları değiştirmek istemiyorsan

    <button class="btn2" style="width:100%" onclick="duzenlemeIptal()">Vazgeç</button></div>`;
  const btn = document.getElementById('gsKaydet');
  if (btn) btn.textContent = 'Değişiklikleri Kaydet';

/* Aynı kasaya ikinci/üçüncü Z — cihaz arızasında gün kaydedilebilsin diye */
function zBlokEkle(n){
  if (ZLISTE[n].length >= 9){ bildir('Bir kasaya en fazla 9 Z raporu girilebilir.', 'hata'); return; }
  const s = Math.max(...ZLISTE[n]) + 1;
  const eski = {};
  ZLISTE[n].forEach(x=>{ eski[x] = zBlokTopla(n, x); });   // yeniden çizmeden ÖNCE yedekle
  const secilenFoto = {};
  ZLISTE[n].forEach(x=>{ const f=document.getElementById('gsZFoto_'+n+'_'+x); secilenFoto[x] = !!(f&&f.files&&f.files[0]); });
  ZLISTE[n].push(s);
  const kap = document.getElementById('gsZBloklar'+n);
  // ilk blok tek başınayken başlıksız duruyordu; artık çoklu → başlıklarla yeniden kur
  kap.innerHTML = ZLISTE[n].map(x=>zBlokHtml(n,x)).join('');
  ZLISTE[n].forEach(x=>{ zBlokKur(n, x); if (x !== s) zBlokDoldur(n, x, eski[x]); });
  // Dosya seçimi HTML yeniden çizilince kaybolur — kullanıcıya açıkça söyle
  const kaybolan = ZLISTE[n].filter(x=>x!==s && secilenFoto[x]);
  if (kaybolan.length) alert(`Kasa ${n}: Z fotoğrafı seçimi sıfırlandı (${kaybolan.map(x=>x+'. Z').join(', ')}).\nTutarlar korundu; fotoğrafı yeniden seç.`);
  kasaHesapla();
  document.getElementById('zBlok_'+n+'_'+s).scrollIntoView({behavior:'smooth', block:'center'});
}
async function zBlokSil(n, s){
  if (s === 1) return;
  if (!await onaySor(`Kasa ${n} — ${s}. Z raporu kaldırılacak.`, 'Girdiğin bilgiler silinir. Devam?', 'Kaldır')) return;
  const kalan = {};
  ZLISTE[n].filter(x=>x!==s).forEach(x=>{ kalan[x] = zBlokTopla(n, x); });  // silmeden ÖNCE yedekle
  ZLISTE[n] = ZLISTE[n].filter(x=>x!==s);
  const kap = document.getElementById('gsZBloklar'+n);
  kap.innerHTML = ZLISTE[n].map(x=>zBlokHtml(n,x)).join('');
  ZLISTE[n].forEach(x=>{ zBlokKur(n, x); zBlokDoldur(n, x, kalan[x]); });
  kasaHesapla();
}
/* Blok yeniden çizildiğinde girilen değerleri koru */
function zBlokTopla(n, s){
  const k = n+'_'+s, al = id => (document.getElementById(id)?.value ?? '');
  return { zno:al('gsZNo_'+k), kart:al('gsKart_'+k), nakit:al('gsNakit_'+k),
           kadet:al('gsKAdet_'+k), iadet:al('gsIAdet_'+k), itutar:al('gsITutar_'+k),
           not:al('gsKNot_'+k), kdv:kdvHam(k), durum:document.getElementById('gsOkuDurum_'+k)?.textContent||'' };
}
function kdvHam(k){
  const c=[];
  document.querySelectorAll('#kdvSatirlari_'+k+' .kdv-satir').forEach(d=>{
    const i=d.id.split('_')[1];
    c.push({ oran:+document.getElementById('kdvO_'+i).value,
             t:document.getElementById('kdvT_'+i).value, v:document.getElementById('kdvV_'+i).value });
  });
  return c;
}
function zBlokDoldur(n, s, v){
  if(!v) return;
  const k = n+'_'+s, yaz=(id,d)=>{ const e=document.getElementById(id); if(e) e.value=d; };
  yaz('gsZNo_'+k, v.zno); yaz('gsKart_'+k, v.kart); yaz('gsNakit_'+k, v.nakit); yaz('gsKNot_'+k, v.not);
  const kap=document.getElementById('kdvSatirlari_'+k);
  if (kap && v.kdv && v.kdv.length){ kap.innerHTML=''; v.kdv.forEach(x=>kdvSatirEkle(k, x.oran, x.t, x.v, false)); }
  const d=document.getElementById('gsOkuDurum_'+k); if(d && v.durum) d.textContent=v.durum;
}
/* Blok DOM'a girdikten sonra olay bağları + varsayılan KDV satırı */
function zBlokKur(n, s){
  const k = n+'_'+s;
  const kap = document.getElementById('kdvSatirlari_'+k);
  if (kap && !kap.children.length) kdvSatirEkle(k, 10, null, null, true);
  ['gsZNo_','gsZFoto_'].forEach(p=>{
    const e=document.getElementById(p+k);
    if(e){ e.addEventListener('input', kasaHesapla); e.addEventListener('change', kasaHesapla); }
  });
  paraBagla(document.getElementById('gsKart_'+k),  kasaHesapla);
  paraBagla(document.getElementById('gsNakit_'+k), kasaHesapla);
}
function kasaSec(n){
