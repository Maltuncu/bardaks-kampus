<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<!-- Zoom engeli kaldırıldı: finans tablolarında küçük rakamı büyütememek yanlış
     okumaya yol açıyor. Dokunma hedefleri zaten ≥44px, engele gerek yok. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- SÜRÜM: her yüklemede DEĞİŞTİR. Uygulama bunu sunucudakiyle karşılaştırıp
     eski sürümde kalan telefonu uyarır. İlk 3000 bayt içinde kalmalı. -->
<meta name="surum" content="2026-08-27-18">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>bardak's kampüs</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="theme-color" content="#FAF4E3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="bardak's">
<!-- İÇERİK GÜVENLİK POLİTİKASI
     Dışarıdan kod yüklenmesini engeller: yalnız jsdelivr'daki SABİTLENMİŞ ve
     SRI ile doğrulanan dosyalar çalışabilir. Bir tedarik zinciri olayında
     (kütüphane ele geçirilse bile) tarayıcı hash tutmayınca dosyayı reddeder.
     script-src'ta unsafe-inline var çünkü uygulama tek dosya ve onclick
     kullanıyor; yine de HARİCİ kaynak enjeksiyonunu kapatıyor.

     connect-src'ta blob: ZORUNLU — SİLME.
     pdf.js belgeyi okurken indirilen dosyayı blob: adresine koyup oradan
     fetch ediyor (fileloading.js). blob: yoksa tarayıcı bağlantıyı keser ve
     "Belgeyi oku" özelliği çalışmaz. İlk yazdığımda unutmuştum, canlıda
     PDF okuma kırıldı.

     frame-ancestors BİLEREK YOK: meta etiketiyle verildiğinde tarayıcı onu
     yok sayıyor ve her açılışta konsola uyarı basıyordu. Gerçek koruma HTTP
     başlığı gerektirir, GitHub Pages'te başlık ayarlanamıyor. Yani buradaki
     satır hiçbir zaman korumuyordu — sadece gürültü yapıyordu. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' blob: https://*.supabase.co https://cdn.jsdelivr.net; worker-src 'self' blob:; base-uri 'self'; form-action 'none'">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
/* --kagit: alttan/sağdan açılan panel ve tabaka zemini. TANIMSIZDI — "Daha" menüsü ve
   bütün detay panelleri şeffaf çıkıyordu, arkadaki içerik okunuyordu. */
.yy-bas{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--soluk);margin:10px 0 4px}
.yy-rol{display:flex;flex-wrap:wrap;gap:6px}
.yy-rol .yy-aktif{background:var(--ana);color:#fff;border-color:var(--ana)}
.yy-acik{background:var(--ok);color:#fff;border-color:var(--ok)}
:root{--ana:#2456A0;--ana-koyu:#183F78;--acik:#EBF0FA;--gri:#FAF4E3;--kart:#FFFEF8;--kagit:#FFFEF8;--metin:#1F3354;--soluk:#8189A0;--hata:#B3402F;--uyari:#C77B2B;--ok:#2E7D4F;--cizgi:#E7DEC8}
/* ===== Gün Sonu — iki kasa (Mission Control) ===== */
.kasa-grid{display:grid;grid-template-columns:1fr 1px 1fr;margin:12px 0}
.kasa-panel{min-width:0}
.kasa-panel.sol{padding-right:18px}
.kasa-panel.sag{padding-left:18px}
.kasa-ayirici{background:var(--cizgi);width:1px}
.kp-bas{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-bottom:2px solid var(--ana);padding-bottom:6px;margin-bottom:10px}
.kp-ad{font-weight:800;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--ana)}
.kp-drm{font-size:11px;font-weight:700;text-align:right}
.kp-drm.bos{color:var(--soluk)}.kp-drm.eksik{color:var(--uyari)}.kp-drm.tam{color:var(--ok)}
.kp-ara{display:flex;justify-content:space-between;align-items:center;gap:10px;border-top:1px solid var(--cizgi);border-bottom:1px solid var(--cizgi);padding:8px 0;margin:12px 0}
.kp-ara span{font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--soluk)}
.kp-ara b{font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap}
.kasa-sekme{display:none;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.ks-btn{border:1px solid var(--cizgi);background:var(--kart);padding:9px 6px;font-family:inherit;color:var(--metin);cursor:pointer;text-align:center}
.ks-btn.aktif{border-bottom:3px solid var(--ana);background:var(--acik)}
.ks-btn .ks-ad{font-size:12px;font-weight:800;letter-spacing:.5px}
.ks-btn .ks-tut{font-size:13px;font-variant-numeric:tabular-nums;margin-top:2px}
.gs-bant{border-top:2px solid var(--ana);margin-top:14px;padding-top:10px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.gs-bant .kalem{flex:1;min-width:105px}
.gs-et{font-size:10px;font-weight:700;letter-spacing:.6px;color:var(--soluk);text-transform:uppercase}
.gs-bant .dg{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.gs-bant .buyuk .dg{font-size:26px;font-weight:800;color:var(--ana)}
.gs-zdisi{border-top:1px solid var(--cizgi);margin-top:10px;padding-top:8px}
.gs-eksik{font-size:12px;margin-top:10px;line-height:1.7;color:var(--uyari)}
@media(max-width:760px){
  .kasa-grid{grid-template-columns:1fr}
  .kasa-ayirici{display:none}
  .kasa-panel{display:none;padding:0}
  .kasa-panel.aktif{display:block}
  .kasa-sekme{display:grid}
}
/* ===== Z raporu okuma durumu ===== */
.oku-durum{font-size:11.5px;line-height:1.55;margin:6px 0 2px;color:var(--soluk)}
.oku-durum.ok{color:var(--ok)}
.oku-durum.uyari{color:var(--uyari)}
.oku-dolu{background:#F2F8F4!important;border-color:var(--ok)!important}
/* ===== Uyarı hiyerarşisi =====
   Para kaybettiren şey ile arşiv eksiği aynı ağırlıkta durmamalı.
   AĞIR: para riski · ORTA: beyan/kayıt eksiği · geri kalanı düz metin satırı. */
.uyari-agir{background:#FBEAE7;border-left:3px solid var(--hata);color:var(--hata);
  padding:10px 12px;border-radius:0 10px 10px 0;margin:0 0 8px;font-size:13px;font-weight:800;line-height:1.5}
.uyari-orta{background:#FBF3E4;border-left:3px solid var(--uyari);color:#8A6316;
  padding:9px 12px;border-radius:0 10px 10px 0;margin:0 0 8px;font-size:12.5px;font-weight:700;line-height:1.5}
/* D2 · karar bloğu: kart kabuğu YOK (32px padding + 12px kenar boşluğu
   yiyordu), satırlar sıkı, düğme satır İÇİNDE — ayrı düğme satırı 52px
   ediyordu. Ölçüldü: 295px -> aşağıdaki rapordaki değer. */
#kararBlok .kb-sr{padding:7px 10px;margin:0 0 6px;font-size:12.5px;line-height:1.4}
/* Düğme GÖRÜNÜR 28px ama VURUŞ ALANI 44px — satır başına 16px kazanç.
   Görünür 44px satırları %20 sınırının üstüne çıkarıyordu. */
#kararBlok .kb-bt{margin-left:10px;vertical-align:middle;min-height:28px;position:relative}
#kararBlok .kb-bt::after{content:'';position:absolute;left:0;right:0;top:-8px;bottom:-8px}
/* Uyarı satırı: etiket + metin, dokununca ilgili bölüme gider */
.uy-sr{display:flex;align-items:baseline;gap:9px;cursor:pointer;min-height:44px;
  -webkit-tap-highlight-color:transparent}
.uy-sr:active{filter:brightness(.96)}
.uy-sr:last-child{margin-bottom:0}
.uy-et{font-size:9.5px;font-weight:900;letter-spacing:.7px;flex:none;opacity:.72;padding-top:1px}
.uy-mt{min-width:0;overflow-wrap:anywhere}
/* ===== Ürün detayı — tıklanabilir stok satırı + fiyat geçmişi ===== */
.tikla{cursor:pointer;-webkit-tap-highlight-color:transparent}
.tikla:active{background:#F7F3E8}
.ud-ov{position:fixed;inset:0;z-index:70;background:rgba(28,24,18,.55);display:none;
  align-items:flex-end;justify-content:center}
.ud-ov.acik{display:flex}
.ud-kutu{background:var(--kagit);box-shadow:0 -8px 28px rgba(28,24,18,.28);
  width:100%;max-width:520px;max-height:92vh;overflow-y:auto;
  border-radius:20px 20px 0 0;padding:0 0 24px}
@media(min-width:560px){ .ud-ov{align-items:center} .ud-kutu{border-radius:20px} }
.ud-ust{position:sticky;top:0;background:var(--kagit);padding:18px 18px 12px;
  border-bottom:1px solid var(--cizgi);display:flex;align-items:flex-start;gap:12px}
.ud-kod{font-size:11px;font-weight:900;letter-spacing:.8px;color:var(--ana);margin:0 0 2px}
.ud-ad{font-size:17px;font-weight:900;line-height:1.25}
.ud-kapat{flex:none;width:44px;height:44px;border:none;background:#EFE9DC;border-radius:12px;
  font-size:17px;font-weight:900;color:var(--soluk);cursor:pointer}
.ud-govde{padding:16px 18px 0}
.ud-kunye{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--cizgi);
  border:1px solid var(--cizgi);border-radius:12px;overflow:hidden;margin:0 0 18px}
.ud-kunye>div{background:var(--kagit);padding:11px 10px}
.ud-et{font-size:10px;font-weight:800;letter-spacing:.5px;color:var(--soluk);margin:0 0 3px}
.ud-dg{font-size:16px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.ud-bas{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:0 0 10px}
.ud-blk{font-size:11px;font-weight:900;letter-spacing:.7px;color:var(--soluk)}
.ud-trend{font-size:13px;font-weight:900;font-variant-numeric:tabular-nums}
.ud-graf{border:1px solid var(--cizgi);border-radius:12px;padding:14px 10px 8px;margin:0 0 18px}
.ud-graf svg{display:block;width:100%;height:auto}
.ud-bos{font-size:12.5px;color:var(--soluk);line-height:1.6;padding:6px 2px}
.ud-satir{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:baseline;
  padding:11px 2px;border-bottom:1px solid var(--cizgi)}
.ud-satir:last-child{border-bottom:none}
.ud-trh{font-size:11.5px;font-weight:800;color:var(--soluk);font-variant-numeric:tabular-nums}
.ud-alt{font-size:11.5px;color:var(--soluk);line-height:1.45;margin-top:2px}
.ud-tut{font-size:14px;font-weight:900;font-variant-numeric:tabular-nums;white-space:nowrap}
.ud-zam{color:var(--hata);font-weight:900}
.ud-indi{color:var(--ok);font-weight:900}
@media(prefers-reduced-motion:no-preference){
  .ud-kutu{animation:udGir .16s ease-out}
  @keyframes udGir{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
}
/* ===== Fatura ürün satırları ===== */
.fs-satir{border:1px solid var(--cizgi);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.fs-bas{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 4px}
.fs-ad{font-size:13.5px;font-weight:800;line-height:1.35}
.fs-rozet{flex:none;font-size:10px;font-weight:900;letter-spacing:.4px;padding:3px 7px;border-radius:6px}
.fs-rozet.tam{background:#E8F5EC;color:var(--ok)}
.fs-rozet.yeni{background:#FFF4E0;color:var(--uyari)}
.fs-rozet.atla{background:#EFEFEF;color:var(--soluk)}
.fs-detay{font-size:11.5px;color:var(--soluk);line-height:1.5;margin:0 0 8px}
.fs-yeni{margin-top:8px;padding-top:8px;border-top:1px dashed var(--cizgi)}
/* ===== Sürüm uyarı çubuğu ===== */
#surumBar{position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;align-items:center;
  justify-content:space-between;gap:12px;padding:12px 14px;background:var(--uyari);color:#fff;
  font-size:13px;font-weight:700;line-height:1.4;box-shadow:0 -3px 14px rgba(0,0,0,.18)}
#surumBar button{flex:none;background:#fff;color:var(--uyari);border:none;border-radius:8px;
  padding:9px 16px;font-size:13px;font-weight:900;cursor:pointer}
/* ===== Çoklu Z raporu (cihaz arızasında aynı kasa 2+ Z basar) ===== */
.z-blok + .z-blok{margin-top:16px;padding-top:16px;border-top:2px dashed var(--cizgi)}
.zb-bas{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 8px}
.zb-ad{font-size:11px;font-weight:800;letter-spacing:.6px;color:var(--ana)}
.zb-sil{background:none;border:none;padding:0;font-size:11px;font-weight:700;color:var(--hata);cursor:pointer}
.z-ekle{width:100%;margin-top:12px}
/* ===== Belge görüntüleyici ===== */
.bo-btn{display:inline-block;border:1px solid var(--cizgi);background:var(--kart);color:var(--ana);
  font:inherit;font-size:11px;font-weight:700;padding:5px 9px;margin:3px 4px 0 0;cursor:pointer;white-space:nowrap}
.bo-btn:active{background:var(--acik)}
.bo-btn.yok{color:var(--soluk);border-style:dashed;cursor:default}
#belgeOverlay{position:fixed;inset:0;background:rgba(20,25,40,.92);z-index:9999;display:none;
  flex-direction:column;align-items:center;justify-content:flex-start}
#belgeOverlay .bo-ust{width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:12px 14px;color:#fff;font-weight:700;font-size:13px;flex:none}
#belgeOverlay .bo-kapat{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;
  font:inherit;font-size:18px;line-height:1;padding:6px 12px;cursor:pointer}
#belgeOverlay .bo-govde{flex:1;width:100%;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:0 8px 16px}
#belgeOverlay img{max-width:100%;height:auto;background:#fff}
#belgeOverlay .bo-yukleniyor{color:#fff;padding:30px;font-size:13px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gri);color:var(--metin);font-size:15px;padding-bottom:70px}
.gizli{display:none!important}
/* GİRİŞ */
#girisEkran{max-width:380px;margin:7vh auto;padding:24px}
.logoDaire{width:180px;height:180px;border:2.5px solid var(--ana);border-radius:50%;margin:0 auto 8px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:transparent}
.logoYazi{font-weight:900;font-size:34px;color:var(--ana);letter-spacing:-1px;line-height:1}
.logoAltCizgi{width:110px;height:2.5px;background:var(--ana);margin:7px 0 6px}
.logoScript{font-family:'Caveat',cursive;color:var(--ana);font-size:17px;font-weight:600}
#girisEkran .alt{text-align:center;color:var(--ana);opacity:.75;margin:10px 0 24px;font-size:12px;font-weight:800;letter-spacing:3px}
.susSvg{display:block;margin:18px auto 0;opacity:.85}
/* GENEL */
.kart{background:var(--kart);border:1.5px solid var(--cizgi);border-radius:14px;padding:16px;margin-bottom:12px}
/* Eski kart başlığı — yeni .kb-ad ile aynı ağırlıkta olsun ki ekranlar arası
   başlık boyu değişmesin (30'dan fazla yerde kullanılıyor, tek tek dokunmuyorum) */
.kbaslik{font-size:16px;font-weight:900;line-height:1.25;letter-spacing:-.2px;margin-bottom:12px}
label{display:block;font-size:12.5px;color:var(--soluk);font-weight:700;margin:10px 0 4px}
/* ⚠ M-1 · 16px ALTINA INMEYIN. iOS, font-size 16px'in altindaki bir alana
   dokunuldugunda sayfayi ZUMLUYOR ve geri cikmiyor — personel her alanda
   ekranin ziplamasini yasiyordu. borc.html'de duzeltilmisti, ASIL KULLANILAN
   dosyada acik kalmisti (D6'da kapatildi). */
input,select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--cizgi);border-radius:9px;font-size:16px;background:#fff;color:var(--metin);font-family:inherit}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ana);border-color:var(--ana)}
button{cursor:pointer;font-size:15px;border:none;border-radius:9px;font-weight:800;font-family:inherit}
.btn{width:100%;padding:13px;background:var(--ana);color:#fff;margin-top:14px}
.btn:disabled{background:#9AAECE;cursor:wait}
/* Dokunma hedefi en az 44px — telefonda tek elle, zaman baskısı altında basılıyor */
.btn2{padding:0 16px;min-height:44px;background:var(--acik);color:var(--ana);font-size:13px}
.btn-kirmizi{padding:0 16px;min-height:44px;background:#fdeceb;color:var(--hata);font-size:13px}
/* ⚠ CM · pre-wrap: cakisma mesaji artik uc satir (ne kayitli · ne
   yapamazsin · ne yapabilirsin). textContent ile yaziliyor, satir
   sonlari pre-wrap olmadan tek satira eziliyordu. */
.hata-msg{background:#fdeceb;color:var(--hata);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13.5px;display:none;white-space:pre-wrap;line-height:1.5}
.ok-msg{background:#eafaf1;color:var(--ok);padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13.5px;display:none;white-space:pre-wrap;line-height:1.5}
/* İş oldu ama bir yan adım tutmadı: kırmızı "başarısız" demek yanlış,
   yeşil "her şey yolunda" demek de yanlış — sarı ara ton. Kendiliğinden
   kaybolmaz (ok-msg 5sn'de kayboluyor); kullanıcı okumalı. */
.uyari-msg{background:#FBF3E4;color:#8A6316;padding:10px 12px;border-radius:8px;margin-top:10px;font-size:13.5px;display:none;white-space:pre-wrap;line-height:1.5}
/* V · sifre penceresi — borc.html'deki .pm deseninin ayni sadelestirilmis hali */
.pm{border:none;border-radius:16px;padding:16px;width:calc(100% - 32px);max-width:340px;
  max-height:88vh;overflow:auto;background:var(--kart);color:var(--metin)}
.pm::backdrop{background:rgba(28,24,18,.55)}
.pm-bas{font-size:17px;font-weight:700;line-height:1.3}
.pm-hata{font-size:13px;color:var(--hata);font-weight:600;margin-top:4px}
.pm-aciklama{font-size:13.5px;color:var(--metin);line-height:1.5;margin:8px 0 10px;white-space:pre-line}
.pm-sayac{font-size:12.5px;color:var(--soluk);font-weight:600;margin-top:4px}
/* AB · bloklamayan bildirim seridi — icerigin EN USTUNDE */
.bildirim{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:10px;
  margin:0 0 12px;font-size:14px;line-height:1.45;white-space:pre-line}
.bildirim-hata{background:#fdeceb;color:var(--hata);border-left:3px solid var(--hata)}
.bildirim-ok{background:#eafaf1;color:var(--ok);border-left:3px solid var(--ok)}
.bildirim-metin{flex:1;min-width:0;overflow-wrap:anywhere}
.bildirim-kapat{flex:none;background:transparent;color:inherit;font-size:16px;
  min-width:44px;min-height:44px;margin:-11px -8px -11px 0;padding:0}
.pm-secim{display:flex;flex-direction:column;gap:2px;margin:6px 0 10px}
.pm-sec{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14.5px;cursor:pointer}
.pm-sec input{width:20px;height:20px;flex:none;margin:0}
.pm input{font-size:17px}
.pm-ey{display:flex;gap:10px;margin-top:14px}
.pm-ey button{flex:1;min-height:44px;margin-top:0}
.pm-ey button[disabled]{opacity:.4}
.pm :focus-visible{outline:3px solid var(--ana);outline-offset:2px}
.satir{display:flex;gap:8px}.satir>*{flex:1}
/* Segment kontrolü — dört ayrı buton yerine tek şerit; hangisinde olduğun belli */
.segment{display:flex;background:var(--kart);border:1.5px solid var(--cizgi);border-radius:11px;
  padding:3px;gap:3px;margin-bottom:12px;overflow:hidden}
.sg-btn{flex:1;min-width:0;min-height:40px;padding:0 6px;background:none;color:var(--soluk);
  font-size:13px;font-weight:800;border-radius:8px;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;transition:background .12s,color .12s}
.sg-btn.aktif{background:var(--ana);color:#fff}

/* 'profil' bilerek HARİTADA DEĞİL: açılışta AKTIF_SUBE yokken kendisi
   sorgulanıyor (id ile, RLS koruyor). Süzgeç oraya konsaydı giriş kırılırdı.
   Onun da sube_id'si NOT NULL değil — aynı şema açığı, aynı açık soru. */
(function subeSuzgeciKur(){
  const _from = sb.from.bind(sb);
  sb.from = function(tablo){
    const qb = _from(tablo);
    if (!SUBE_SUZGEC.has(tablo)) return qb;
    const genel = SUBE_SUZGEC.get(tablo);
    const _select = qb.select.bind(qb);
    qb.select = function(...a){
      if (!AKTIF_SUBE)
        throw new Error('Şube bilinmeden "'+tablo+'" okunamaz. (Açılış sırası bozuk.)');
      const q = _select(...a);
      return genel ? q.or('sube_id.eq.'+AKTIF_SUBE+',sube_id.is.null')
                   : q.eq('sube_id', AKTIF_SUBE);
    };
    return qb;   // insert/update/delete zinciri DOKUNULMADAN geçer
  };
})();

function subeDegistir(id){

   tedarikçi karşındayken çalışmaz. srSatir'ın data-ara alanında süzer. */
function stokFiltre(q){
  const t = (q||'').toLocaleLowerCase('tr').trim();
  let gorunen = 0, toplam = 0;
  document.querySelectorAll('#icerik .sr[data-ara]').forEach(el => {
    toplam++;
    const uy = !t || el.dataset.ara.includes(t);
    el.style.display = uy ? '' : 'none';
    if (uy) gorunen++;
  });
  const b = document.getElementById('stokAraBos');
  if (b){
    b.style.display = (t && gorunen === 0) ? '' : 'none';
    b.textContent = t && gorunen === 0 ? `"${q}" için ürün bulunamadı.` : '';
  }
}

/* ⚠ ARTIK YALNIZ IDEMPOTENT ISLEMLER ICIN. Her cagrida YENI anahtar
   uretir; sunucunun mukerrer kontrolu onu ASLA bulamaz. Bu, ikinci kez
   calistirmasi ZARARSIZ olan islerde (silme, durum guncellemesi, salt
   okuma raporu) sorun degildir. Yeni bir YAZMA cagrisinda kullanma —
   idemKararli() kullan. */
const idem = () => crypto.randomUUID();

/* v60 · KARARLI IDEM ANAHTARI — F4-2'nin kök nedeni
   Yukarıdaki idem() her çağrıda YENİ anahtar üretiyor. _idem_kontrol
   anahtarı islem_log'da arar; anahtar hep yeni olduğu için HİÇBİR ZAMAN
   bulamaz. Mükerrer koruması kod olarak vardı, davranış olarak yoktu.

   Bu üretecin anahtarı işlemin KİMLİĞİNDEN türer: aynı formu iki kez
   göndermek AYNI anahtarı üretir ve ikincisi sunucuda takılır.

   ⚠ SERBEST METİN GİRMEZ. Açıklama alanındaki tek harf değişse anahtar
     değişir ve koruma boşa çıkardı. Yalnız kimliği belirleyen alanlar:
     tarih, tutar, kategori/tedarikçi/ürün.
   ⚠ Kullanıcı da anahtara girer: iki farklı personelin aynı kaydı
     girmesi ayrı işlemdir, sunucu kontrolü onu yakalar. */
async function idemKararli(rpc, alanlar){
  const ham = [rpc, PROFIL?.id ?? '', ...alanlar.map(a => a ?? '')].join('|');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ham));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('');
}

/* ===== V · SIFRE DEGISTIRME · GERCEK <dialog> =====
   Onceki hal IKI prompt kutusuydu. prompt YILDIZLAMAZ: yeni sifre ekranda
   duz yazi duruyordu — omuz ustunden, ekran paylasiminda, ekran goruntusunde
   okunur. Sifre yoneticisi de katilamiyordu (guclu sifre onerilemez,
   kaydedilemez). Ustelik ham error.message ekrana basiliyordu.
   Mekanik borc.html'deki uc pencereden KOPYALANDI — orada sinandi:
   gercek <dialog> + showModal + Escape=iptal + odak tuzagi + kapaninca
   acan ogeye donus + gecersizken dugme pasif.
   ⚠ IKI GIRIS YOLU da buraya gelir: menudeki "Şifre" dugmesi ve e-postadan
     donusteki PASSWORD_RECOVERY olayi. Sifresini UNUTAN insan da artik
     maskeli alan goruyor. */
let SIFRE_KURTARMA = false;                 // pencere PASSWORD_RECOVERY yolundan mi acildi
function sifreDegistir(acan){
  const geri = (acan && acan.focus) ? acan : document.activeElement;
  const yap = (tag, sinif, metin) => { const e = document.createElement(tag);
    if (sinif) e.className = sinif; if (metin != null) e.textContent = metin; return e; };
  const d = document.createElement('dialog'); d.className = 'pm';
  d.setAttribute('aria-modal','true');
  const bas = yap('div','pm-bas', SIFRE_KURTARMA ? 'Yeni şifreni belirle' : 'Şifre değiştir');
  bas.id = 'sdBas'; d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
  const alan = (etiket, id) => {
    const g = document.createElement('input');
    /* ⚠ type="password" — "text + sonradan maskeleme" DEGIL. Boylece
       tarayicinin kendi korumasi (kopyalama/otomatik doldurma davranisi)
       ve sifre yoneticisi de devrede olur. */
    g.type = 'password'; g.autocomplete = 'new-password'; g.id = id; g.minLength = 8;
    const l = yap('label', null, etiket); l.setAttribute('for', id);
    d.appendChild(l); d.appendChild(g); return g;
  };
  const y1 = alan('Yeni şifre (en az 8 karakter)','sdY1');
  const y2 = alan('Yeni şifreyi tekrar yaz','sdY2');
  const uyari = yap('div','pm-hata'); uyari.id = 'sdUyari'; uyari.hidden = true;
  y2.setAttribute('aria-describedby', uyari.id); d.appendChild(uyari);
  const ey = yap('div','pm-ey');
  const vaz = yap('button','btn2','Vazgeç'), kay = yap('button','btn','Değiştir');
  vaz.type = kay.type = 'button'; kay.disabled = true;
  ey.appendChild(vaz); ey.appendChild(kay); d.appendChild(ey);      // Vazgec SOLDA
  const hata = yap('div','uyari-agir'); hata.id = 'sdHata'; hata.hidden = true;
  kay.setAttribute('aria-describedby', hata.id); d.appendChild(hata);
  document.body.appendChild(d); d.showModal(); y1.focus();

  /* Uyusmazlik ALANIN ALTINDA yazar — uyari kutusuyla DEGIL. */
  const denetle = () => {
    const a = y1.value, b = y2.value, kisa = a.length > 0 && a.length < 8, ayri = b.length > 0 && a !== b;
    uyari.hidden = !(kisa || ayri);
    uyari.textContent = kisa ? 'Şifre en az 8 karakter olmalı.' : 'İki şifre aynı değil.';
    kay.disabled = !(a.length >= 8 && a === b);
  };
  y1.oninput = y2.oninput = denetle;

  let isleniyor = false;
  const kapat = () => {
    if (isleniyor) return;                  // istek surerken kapanmaz
    y1.value = y2.value = '';               // ⚠ DOM'da sifre BIRAKMA
    d.close(); d.remove();
    if (geri && geri.isConnected) geri.focus();
    else { const b = document.getElementById('sifreBtn'); if (b) b.focus(); }
    if (SIFRE_KURTARMA) kurtarmaSeridi();   // sifresiz kalmasin: donus yolu ekranda kalir
  };
  vaz.onclick = () => kapat();
  /* ⚠ Bu Chromium'da <dialog>'un yerel `cancel` olayi Escape'te ATESLENMIYOR
     (borc.html'de olculdu). Ikisi de dinleniyor. */
  d.addEventListener('cancel', e => { e.preventDefault(); kapat(); });
  d.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ e.preventDefault(); kapat(); return; }
    if (e.key !== 'Tab') return;            // odak tuzagi
    const od = [...d.querySelectorAll('input,button')].filter(x => !x.disabled);
    if (!od.length) return;
    const i = od.indexOf(document.activeElement); e.preventDefault();
    od[(i + (e.shiftKey ? -1 : 1) + od.length) % od.length].focus();
  });
  kay.onclick = async () => {
    if (isleniyor || kay.disabled) return;  // cift tiklama TEK istek
    isleniyor = true; kay.disabled = vaz.disabled = y1.disabled = y2.disabled = true;
    d.tabIndex = -1; d.focus();             // kontroller disabled olunca odak <body>'ye dusmesin
    kay.textContent = 'Değiştiriliyor...'; hata.hidden = true;
    const { error } = await sb.auth.updateUser({ password: y1.value });
    isleniyor = false;
    if (error){
      /* ⚠ HAM HATA EKRANA BASILMAZ. hataTr() ceviri bulamazsa girdiyi AYNEN
         geri veriyor (satir 1237: `return m`), o yuzden korlemesine
         kullanilamaz: yalnizca GERCEKTEN cevirdiyse gosteriliyor. */
      window.__sonHataHam = error.message;  // tani icin degiskende kalir
      /* ⚠ Y1 sonrasi kiyas HATA_GENEL ile yapilir: hataTr artik ham metni
         geri vermiyor, ceviremediginde GENEL cumleyi veriyor. Eski kiyas
         (tr !== error.message) hep dogru cikar ve bu pencerenin KENDI
         cumlesi hic gorunmezdi. */
      const tr = hataTr(error.message || '');
      hata.textContent = (tr && tr !== HATA_GENEL) ? tr
        : 'Şifre değiştirilemedi. Tekrar deneyin; sürerse yöneticiye bildirin.';
      hata.hidden = false;
      vaz.disabled = y1.disabled = y2.disabled = false;
      kay.textContent = 'Değiştir'; denetle(); return;
    }
    SIFRE_KURTARMA = false;
    document.querySelectorAll('.sd-serit').forEach(x => x.remove());
    kapat();
    alert('Şifreniz değiştirildi ✓ Yeni girişlerde yeni şifreyi kullanın.');
  };
}

/* ===== AB · BLOKLAMAYAN BILDIRIM · bildir() =====

   ⚠ HATA KENDILIGINDEN KAYBOLMAZ. Otomatik kaybolan hata mesaji,

   ⚠ 'ok' 5 saniyede kalkar — basari bilgisi ekranda birikmemeli.

     KIMILDAMAZ; ancak gorunur alanin disindaysa oraya kayar.
   ⚠ bildir() BEKLEMEZ. alert'in aksine akisi durdurmaz — bu yuzden
     yalniz sonrasinda `return` gelen (akisin zaten durdugu) yerlerde
     kullanildi; kod DEVAM eden alert'lere dokunulmadi. */
let BILDIR_ZAMAN = null;
function bildir(metin, tur){
  const c = document.getElementById('icerik'); if (!c) return null;
  c.querySelectorAll('.bildirim').forEach(x => x.remove());   // ust uste BIRIKMEZ
  clearTimeout(BILDIR_ZAMAN);
  const d = document.createElement('div');
  d.className = 'bildirim ' + (tur === 'ok' ? 'bildirim-ok' : 'bildirim-hata');
  d.setAttribute('role','alert');                             // ekran okuyucu duyursun
  const m = document.createElement('div'); m.className = 'bildirim-metin';
  m.textContent = metin; d.appendChild(m);
  if (tur === 'ok'){ BILDIR_ZAMAN = setTimeout(() => d.remove(), 5000); }
  else {
    const k = document.createElement('button'); k.type = 'button'; k.className = 'bildirim-kapat';
    k.setAttribute('aria-label','Bildirimi kapat'); k.textContent = '✕';
    k.onclick = () => d.remove(); d.appendChild(k);
  }
  c.prepend(d);
  d.scrollIntoView({ block:'nearest' });
  return d;
}

/* ===== AA · YIKICI ISLEM ONAYI · onaySor() =====
   Sekiz confirm kutusu bunu cagiriyordu. Tez AC-06: "Tek dokunus silmez; kayit
   adi/tutar dogrulanir; varsayilan eylem Vazgec." confirm bu ucunu de
   saglamiyor: bazi ortamlarda Enter OK'a gider (arka arkaya iki Enter
   silme onaylayabilir), varsayilan eylem Vazgec DEGIL, odak yonetimi ve
   ekran okuyucu baglantisi yok.
   Mekanik borc.html'in onaySor'undan KOPYALANDI.
   ⚠ VARSAYILAN ODAK VAZGEC'TE — nedenSor'dan bilerek FARKLI. Orada insan
     yazmaya gelmisti, odak metin kutusundaydi; burada islem YIKICI,
     varsayilan guvenli tarafta durur.
   ⚠ Pencerede <form> YOK ve iki dugme de type="button": Enter'in kazayla
     onaylayabilecegi hicbir yol birakilmadi.
   ⚠ Onay dugmesinin YAZISI islemi soyler ("Sil"/"Kapat"/"Kaldir"),
     "Tamam" demez — insan ne yaptigini dugmede gorur. */
function onaySor(baslik, aciklama, onayMetni){
  return new Promise((cevapla) => {
    const acan = document.activeElement;
    const yap = (t,s,m)=>{ const e=document.createElement(t); if(s) e.className=s; if(m!=null) e.textContent=m; return e; };
    const d = document.createElement('dialog'); d.className = 'pm';
    d.setAttribute('aria-modal','true');
    const bas = yap('div','pm-bas', baslik); bas.id = 'osBas';
    d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
    if (aciklama){ const a = yap('div','pm-aciklama', aciklama); a.id = 'osAcik';
      d.setAttribute('aria-describedby', a.id); d.appendChild(a); }
    const ey = yap('div','pm-ey');
    const vaz = yap('button','btn2','Vazgeç'), evt = yap('button','btn-kirmizi', onayMetni || 'Devam');
    vaz.type = evt.type = 'button';
    ey.appendChild(vaz); ey.appendChild(evt); d.appendChild(ey);   // Vazgec SOLDA
    document.body.appendChild(d); d.showModal(); vaz.focus();      // ⚠ varsayilan GUVENLI taraf
    let bitti = false;
    const kapat = (sonuc) => {
      if (bitti) return; bitti = true;                 // Promise IKI KEZ cozulmez
      d.close(); d.remove();
      if (acan && acan.isConnected && acan.focus) acan.focus();
      cevapla(sonuc);
    };
    vaz.onclick = () => kapat(false);
    evt.onclick = () => kapat(true);
    /* ⚠ Bu Chromium'da <dialog>'un yerel `cancel` olayi Escape'te
       ATESLENMIYOR (borc.html'de olculdu). Ikisi de dinleniyor. */
    d.addEventListener('cancel', e => { e.preventDefault(); kapat(false); });
    d.addEventListener('keydown', e => {
      if (e.key === 'Escape'){ e.preventDefault(); kapat(false); return; }   // Escape = HAYIR
      if (e.key !== 'Tab') return;                     // odak tuzagi
      const od = [...d.querySelectorAll('button')].filter(x => !x.disabled);
      if (!od.length) return;
      const i = od.indexOf(document.activeElement); e.preventDefault();
      od[(i + (e.shiftKey ? -1 : 1) + od.length) % od.length].focus();
    });
  });
}

/* ===== Z · GEREKCE PENCERESI · nedenSor() =====
   On bir prompt() kutusu gerekce topluyordu. prompt(): cok satirli metin
   kabul etmiyor (gerekce bazen uzun), bicimlenemiyor, ekran okuyucuya
   baglanmiyor, Escape/iptal ayrimi belirsiz — ve en onemlisi asgari
   uzunlugu BILMIYOR: kisa yazan kullanici sunucuya gidip geri donuyor,
   kutu yazdigini UNUTMUS oluyordu.
   Mekanik borc.html'deki uc pencereden KOPYALANDI.
   ⚠ VARSAYILAN ODAK TEXTAREA'DA — borc.html'in SILME penceresinden bilerek
     AYRI. Orada varsayilan Vazgec cunku islem YIKICI; burasi veri girisi,
     insan zaten yazmaya gelmis.
   ⚠ enAz VARSAYILANI 1 = "bos olmasin". OLCULDU: bu 11 yolun RPC'lerinin
     onu yalnizca NEDEN_ZORUNLU istiyor; GEREKCE_KISA (>=10) taban
     dosyasinda UC yerde var ve ucu de borc.html'e ait (kredi/maden/sahis
     pasife alma). Korlemesine 10 dayatmak kullaniciyi bosuna zorlardi.
   ⚠ Donen deger HAM: satir sonlari korunur, cagri yerleri kendi trim'ini
     zaten yapiyor. Iptalde null. */
function nedenSor(baslik, aciklama, enAz = 1){
  return new Promise((cevapla) => {
    const acan = document.activeElement;
    const yap = (t,s,m)=>{ const e=document.createElement(t); if(s) e.className=s; if(m!=null) e.textContent=m; return e; };
    const d = document.createElement('dialog'); d.className = 'pm';
    d.setAttribute('aria-modal','true');
    const bas = yap('div','pm-bas', baslik); bas.id = 'nsBas';
    d.setAttribute('aria-labelledby', bas.id); d.appendChild(bas);
    if (aciklama){ const a = yap('div','pm-aciklama', aciklama); a.id = 'nsAcik';
      d.setAttribute('aria-describedby', a.id); d.appendChild(a); }
    const ta = document.createElement('textarea'); ta.id = 'nsMetin'; ta.rows = 3;
    const sayac = yap('div','pm-sayac'); sayac.id = 'nsSayac';
    ta.setAttribute('aria-describedby', sayac.id);
    d.appendChild(ta); d.appendChild(sayac);
    const ey = yap('div','pm-ey');
    const vaz = yap('button','btn2','Vazgeç'), tmm = yap('button','btn','Tamam');
    vaz.type = tmm.type = 'button'; tmm.disabled = true;
    ey.appendChild(vaz); ey.appendChild(tmm); d.appendChild(ey);   // Vazgec SOLDA
    document.body.appendChild(d); d.showModal(); ta.focus();
    /* CANLI SAYAC: sart yazdikca gorunur, sunucuya gidip donmeye gerek yok. */
    const denetle = () => { const n = ta.value.trim().length;
      sayac.textContent = 'en az ' + enAz + ' karakter · şu an ' + n;
      tmm.disabled = n < enAz; };
    ta.oninput = denetle; denetle();
    let bitti = false;
    const kapat = (sonuc) => {
      if (bitti) return; bitti = true;                 // Promise IKI KEZ cozulmez
      d.close(); d.remove();
      if (acan && acan.isConnected && acan.focus) acan.focus();
      cevapla(sonuc);
    };
    vaz.onclick = () => kapat(null);
    tmm.onclick = () => { if (!tmm.disabled) kapat(ta.value); };
    /* ⚠ Bu Chromium'da <dialog>'un yerel `cancel` olayi Escape'te
       ATESLENMIYOR (borc.html'de olculdu). Ikisi de dinleniyor. */
    d.addEventListener('cancel', e => { e.preventDefault(); kapat(null); });
    d.addEventListener('keydown', e => {
      if (e.key === 'Escape'){ e.preventDefault(); kapat(null); return; }
      if (e.key !== 'Tab') return;                     // odak tuzagi
      const od = [...d.querySelectorAll('textarea,button')].filter(x => !x.disabled);
      if (!od.length) return;
      const i = od.indexOf(document.activeElement); e.preventDefault();
      od[(i + (e.shiftKey ? -1 : 1) + od.length) % od.length].focus();
    });
  });
}

let ROL_AD = { owner:'Yönetici', personel:'Personel' };
async function yetkileriYukle(){
  YETKILER = {};
  const [{ data: y }, { data: r }] = await Promise.all([
    sb.from('rol_yetki').select('ekran,gorebilir,yazabilir').eq('rol', PROFIL.rol),
    sb.from('rol').select('kod,ad')
  ]);
  (y||[]).forEach(x => YETKILER[x.ekran] = { gorebilir:x.gorebilir, yazabilir:x.yazabilir });
  (r||[]).forEach(x => ROL_AD[x.kod] = x.ad);
  // Yetki satırı hiç yoksa (eski profil) owner tam, diğerleri kapalı kalır
  if (PROFIL.rol === 'owner')
    SEKMELER_TUM.forEach(t => YETKILER[t.id] = { gorebilir:true, yazabilir:true });

async function baslat(){
  surumKontrol();                                    // arka planda, açılışı bekletmez
  setInterval(surumKontrol, 30*60*1000);             // uzun açık kalan telefon için 30 dk'da bir
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){ document.getElementById('girisEkran').classList.remove('gizli'); return; }
  const { data: p, error } = await sb.from('profil').select('*').eq('id', session.user.id).single();
  if (error || !p || !p.aktif){
    alert('Hesabınız sisteme tanımlı değil. Yöneticiyle görüşün.');
    await sb.auth.signOut(); location.reload(); return;
  }
  /* ŞUBE ZORUNLU — ekranların çoğu artık şubeye göre süzülüyor. Şubesiz bir
     profil sessizce BOŞ ekran gösterir (kullanıcı "veri kayboldu" sanır) ve
     uyarı sorgusunu komple hataya düşürür. Sessiz yanlış yerine gürültülü
     dur: yukarıdaki "aktif değil" kontrolüyle aynı kapı. */
  if (!p.sube_id){
    alert('Kullanıcınıza şube tanımlanmamış.\n\n'
      + 'Bu hâlde ekranlar boş görünür. Yöneticiyle görüşün.');
    await sb.auth.signOut(); location.reload(); return;
  }
  PROFIL = p;
  AKTIF_SUBE = p.sube_id;   // tek kaynak; bundan sonra PROFIL.sube_id doğrudan okunmaz
  await yetkileriYukle();
  document.getElementById('girisEkran').classList.add('gizli');
  document.getElementById('uygulama').classList.remove('gizli');
  document.getElementById('kimBilgi').textContent = p.ad + ' · ' + (ROL_AD[p.rol] || p.rol);
  await katalogYukle();
  sekmeleriKur();
  /* Adresteki #<id> bir sekmeye işaret ediyorsa ONU aç — borc.html buraya
     böyle geri gönderiyor, kullanıcı ana sayfaya düşmüş hissetmesin.
     Hash KULLANICI GİRDİSİDİR: yalnız sekmeListesi()'nde GÖRÜNEN id kabul
     edilir; yetkisiz ya da olmayan id sessizce ilk sekmeye düşer. */
  const liste = sekmeListesi();
  if (!liste.length){ document.getElementById('icerik').innerHTML =
    '<div class="uyari-agir">Hiçbir ekran yetkiniz yok. Yöneticiyle görüşün.</div>'; return; }
  const istenen = decodeURIComponent((location.hash || '').slice(1));
  sekmeAc(liste.some(t => t.id === istenen) ? istenen : liste[0].id);
}

const MOBIL_GORUNUR = 4;
function sekmeListesi(){ return SEKMELER_TUM.filter(t => gorebilir(t.id) && (t.id !== 'borc' || PROFIL?.rol === 'owner')); }

async function talepRozet(){
  // Bekleyen madde sayısı Yapılacaklar sekmesinde rozet (herkese)
  try{
    const { count } = await sb.from('duzeltme_talebi')
      .select('id', { count:'exact', head:true }).eq('durum','acik').eq('is_deleted',false);
    ['sk_talep','db_talep','sk_daha'].forEach(x=>{
      const el = document.getElementById(x); if(!el) return;
      const eski = el.querySelector('.tbadge'); if (eski) eski.remove();

    if (!(count > 0)) return;
    const rozet = `<span class="tbadge">${count}</span>`;
    ['sk_talep','db_talep'].forEach(x=>{
      const el = document.getElementById(x); if (el) el.insertAdjacentHTML('beforeend', rozet);
    });
    // Telefonda "Yapılacaklar" gizliyse rozet "Daha"da görünmeli; yoksa bekleyen iş kaybolur
    if (sekmeGizliMi('talep')){
      const d = document.getElementById('sk_daha'); if (d) d.insertAdjacentHTML('beforeend', rozet);
    }
  }catch(e){}
}

/* ===== SÜRÜKLE–BIRAK =====
   Dokuz ayrı dosya alanı var, hiçbiri sürükle-bırak kabul etmiyordu.
   Üstelik sayfaya bırakılan PDF'i tarayıcı yeni sekmede AÇIYOR — insan
   fatura yüklüyorum sanırken uygulamadan çıkıyordu.
   Tek yerden çözülüyor: her alanı ayrı ayrı sarmak yerine olay yakalama.
   Hedef bulma sırası: (1) bırakılan yer dosya alanının kendisi mi,
   (2) aynı kart içinde dosya alanı var mı, (3) ekranda görünen TEK dosya
   alanı varsa o. Üçü de tutmazsa hiçbir şey yapma — yanlış alana dosya
   koymak, hiç koymamaktan kötüdür. */
(function(){
  const gorunur = el => el && el.offsetParent !== null;
  function hedefBul(t){
    if (!t || !t.closest) return null;
    if (t.matches && t.matches('input[type=file]')) return t;
    const kart = t.closest('.kart, .ud-govde, form, #icerik');
    if (kart){
      const icinde = [...kart.querySelectorAll('input[type=file]')].filter(gorunur);
      if (icinde.length === 1) return icinde[0];
    }
    const hepsi = [...document.querySelectorAll('input[type=file]')].filter(gorunur);
    return hepsi.length === 1 ? hepsi[0] : null;
  }
  let vurgulu = null;
  const vurgula = el => {
    if (vurgulu === el) return;
    if (vurgulu) vurgulu.style.outline = '';
    vurgulu = el;
    if (el){ el.style.outline = '2px dashed var(--ana)'; el.style.outlineOffset = '3px'; }
  };
  ['dragenter','dragover'].forEach(o => document.addEventListener(o, e => {
    if (!e.dataTransfer || ![...e.dataTransfer.types].includes('Files')) return;
    e.preventDefault();                       // tarayici dosyayi ACMASIN
    e.dataTransfer.dropEffect = 'copy';
    vurgula(hedefBul(e.target));
  }));
  document.addEventListener('dragleave', e => { if (!e.relatedTarget) vurgula(null); });
  document.addEventListener('drop', e => {
    if (!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
    e.preventDefault();                       // her halukarda yeni sekmede acilmasin
    const hedef = hedefBul(e.target);
    vurgula(null);
    if (!hedef){
      bildir('Dosyayı hangi alana koyacağımı anlayamadım.\n\n'
        + 'Doğrudan dosya seçme kutusunun üstüne bırak.', 'hata');
      return;
    }
    const kabul = (hedef.accept || '').trim();
    const dosya = e.dataTransfer.files[0];
    if (kabul){
      const ad = dosya.name.toLowerCase(), tur = dosya.type || '';
      const uyar = kabul.split(',').map(x=>x.trim().toLowerCase()).some(k =>
        k.startsWith('.') ? ad.endsWith(k)
        : k.endsWith('/*') ? tur.startsWith(k.slice(0,-1))
        : tur === k);
      if (!uyar){ bildir('Bu alan bu dosya türünü kabul etmiyor.\n\nKabul edilen: ' + kabul, 'hata'); return; }
    }
    const dt = new DataTransfer();
    dt.items.add(dosya);
    hedef.files = dt.files;
    // Mevcut kod change/input dinliyor — elle tetikle ki fark etsin
    hedef.dispatchEvent(new Event('change', { bubbles:true }));
    hedef.dispatchEvent(new Event('input',  { bubbles:true }));
    hedef.scrollIntoView({ block:'center', behavior:'smooth' });
  });
})();

function sekmeAc(id){
  if (id !== AKTIF_SEKME && formKirliMi()) return;

  if (id === 'borc'){ location.href = 'borc.html'; return; }   /* modül ayrı dosyada */
  formTemiz();

  document.querySelectorAll('#sekmeBar button, #dahaKutu button').forEach(b=>b.classList.remove('aktif'));
  const sk = document.getElementById('sk_'+id); if (sk) sk.classList.add('aktif');
  const db = document.getElementById('db_'+id); if (db) db.classList.add('aktif');
  // Telefonda gizli bir bölümdeysek "Daha" yuvası aktif görünsün — nerede olduğunu kaybetme
  const d = document.getElementById('sk_daha');
  if (d) d.classList.toggle('aktif', sekmeGizliMi(id));
  window.scrollTo(0,0);
  const f = ({ozet:vOzet, gunsonu:vGunSonu, gider:vGider, stok:vStok, tedarikci:vTedarikci,
              personel:vPersonel, talep:vTalep, arac:vArac, vergi:vVergi, belge:vBelge, yonetim:vYonetim})[id];

  // sebebini göremiyordu. Artık hata görünür ve tekrar denenebilir.
  try { Promise.resolve(f()).catch(e => ekranHatasi(id, e)); }
  catch(e){ ekranHatasi(id, e); }

function ekranHatasi(id, e){
  console.error('Ekran çizilemedi:', id, e);

  el.innerHTML = `<div class="kart">
    <div class="uyari-agir" style="margin:0 0 12px">Bu bölüm açılamadı.</div>
    <div class="ipucu">Teknik sebep: <b>${esc(String(e && e.message || e))}</b><br>
      İnternetin gittiyse bağlanınca tekrar dene. Sorun sürerse bu satırı bana ilet.</div>
    <button class="btn" onclick="sekmeAc('${id}')">Tekrar Dene</button>
  </div>`;
}

/* ================== YARDIMCILAR ================== */
function mesaj(elId, tip, txt){
  const el = document.getElementById(elId); if(!el) return;
  el.className = tip==='ok' ? 'ok-msg' : tip==='uyari' ? 'uyari-msg' : 'hata-msg';
  el.textContent = txt; el.style.display='block';
  if (tip==='ok') setTimeout(()=>{ el.style.display='none'; }, 5000);
}
async function fotoKucult(file, max, kalite){
  // Telefon fotoğrafları 5-10MB olabiliyor: yüklemeden önce küçült.
  // Varsayılan (arşiv/yükleme): 1600px @ 0.82 — yer kazandırır.
  // Okuma için (fatura/Z): 2000px @ 0.92 — A4 faturada ince yazı ve
  // "paket içi 50 adet" gibi küçük açıklamalar okunabilir kalsın.
  max = max || 1600; kalite = kalite || 0.82;
  try{
    const img = await createImageBitmap(file);
    const oran = Math.min(1, max / Math.max(img.width, img.height));
    if (oran === 1 && file.size < 700*1024) return { veri:file, tip:null };
    const c = document.createElement('canvas');
    c.width = Math.round(img.width*oran); c.height = Math.round(img.height*oran);
    const cx = c.getContext('2d');
    cx.imageSmoothingQuality = 'high';
    cx.drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(r=>c.toBlob(r,'image/jpeg',kalite));
    return blob ? { veri:blob, tip:'jpg' } : { veri:file, tip:null };
  }catch(e){ return { veri:file, tip:null }; } // küçültülemezse orijinali yükle
}
/* Cekirdek: elimizdeki DOSYAYI yukler. fotoYukle bunu input uzerinden cagirir,
   belgeEkle ise dogrudan — ikisi ayni yolu kullansin, iki ayri yukleme
   davranisi olmasin. */
async function dosyaYukle(f, klasor){
  if (!f) return null;
  const k = await fotoKucult(f);
  const uzanti = k.tip || (f.name.split('.').pop()||'jpg').toLowerCase();
  const yol = `${klasor}/${bugun()}_${crypto.randomUUID()}.${uzanti}`;
  const { error } = await sb.storage.from('belgeler').upload(yol, k.veri,
    { upsert:false, contentType: k.tip ? 'image/jpeg' : (f.type||undefined) });
  if (error) throw new Error('Belge yüklenemedi: ' + error.message);
  return yol;
}
async function fotoYukle(inputId, klasor){
  const inp = document.getElementById(inputId);
  if (!inp || !inp.files || !inp.files[0]) return null;
  return dosyaYukle(inp.files[0], klasor);
}

/* ===== SONRADAN BELGE EKLEME =====
   Gider ve vergi kayitlarinin duzenleme ekrani YOK. Bir kez girildi mi
   belgesini iliştirmenin hicbir yolu yoktu; 10 kayit (vergi dekontlari
   dahil) bu yuzden belgesiz kalmisti.
   Bu fonksiyon SADECE belge ekler: tutara, tarihe, KDV'ye DOKUNMAZ.
   Tam duzenleme bilerek yapilmadi — tutar degistirmek KDV'yi, kari ve
   cari bakiyeyi etkiler, ayri bir is. Belge eklemek tek yonlu ve zararsiz.
   Uzerine yazmaz: belgesi olan kayda tekrar eklemek istersen once sorar. */
async function belgeEkle(tablo, id, klasor, mevcutVar){
  if (mevcutVar && !confirm('Bu kayıtta zaten belge var.\n\n'
      + 'Yenisini eklersen eskisi kayıtla ilişkisiz kalır.\n\nDevam edilsin mi?')) return;
  const inp = document.createElement('input');
  inp.type = 'file';
  inp.accept = 'image/*,application/pdf,.pdf';
  inp.style.cssText = 'position:fixed;left:-9999px;top:0';
  document.body.appendChild(inp);
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    if (!f){ inp.remove(); return; }
    const eskiImlec = document.body.style.cursor;
    document.body.style.cursor = 'progress';
    try{
      const yol = await dosyaYukle(f, klasor);
      /* Degistirme ise eski yolu NOT alanina yaz: yeni dosya kayda baglanirken
         eskisi storage'da yetim kaliyor. Iz olmazsa hangisi oldugu bulunamaz. */
      let ek = {};
      if (mevcutVar){
        const alan = tablo === 'vergi_odeme' ? 'notlar' : 'aciklama';
        const { data: eski } = await sb.from(tablo).select(alan+',foto_path').eq('id', id).maybeSingle();
        if (eski && eski.foto_path)
          ek[alan] = ((eski[alan]||'') + ' [belge degistirildi ' + bugun()
                      + ', eski dosya: ' + eski.foto_path + ']').slice(0, 500);
      }
      const { error } = await sb.from(tablo).update({ foto_path: yol, ...ek }).eq('id', id);
      if (error) throw new Error(error.message);   // ⚠ Y2 · HAM firlatilir; ceviri GOSTERIM aninda
      if (tablo === 'gider')       await giderListe();
      else if (tablo === 'vergi_odeme') await vergiOdenenYukle();
      alert('Belge eklendi ✓');
    }catch(e){
      alert('Belge eklenemedi: ' + hataTr(e.message || String(e)));
    }finally{
      document.body.style.cursor = eskiImlec;
      inp.remove();
    }
  };
  inp.click();
}
/* ⚠ CQ · DÜĞMENİN GERÇEK ETİKETİ, KENDİ HANDLER'I ÇALIŞMADAN ÖNCE
   YAKALANIR. Bazı çağıranlar (vergiOdemeKaydet gibi) rpcCagir'a girmeden
   metni 'Yükleniyor...' yapıyor; o an rpcCagir gerçek etiketi göremez.
   Yakalama phase'inde dinlemek, düğmeye basıldığı ANDAKİ — yani hâlâ
   doğru olan — etiketi saklar. Hiçbir davranışı değiştirmez, yalnız not alır. */
/* ⚠ BAŞA BAĞLI DEĞİL — ÖLÇÜLDÜ: gider kaydında etiket
   "Fotoğraf yükleniyor..." oluyor; başa bağlı desen bunu meşgul
   saymıyordu ve rpcCagir onu "asıl etiket" diye saklayıp düğmeyi
   ona döndürüyordu. Aynı kalıp üç yerde daha var (gider, alış,
   araç gideri) — desen genişleyince üçü birden düzeldi. */
const RPC_MESGUL = /(yükleniyor|kaydediliyor|güncelleniyor|siliniyor|bağlantı kopt|tekrar deneniyor)/i;
document.addEventListener('pointerdown', (e) => {
  const b = e.target && e.target.closest && e.target.closest('button');
  if (b && !RPC_MESGUL.test((b.textContent || '').trim())) b.dataset.asilMetin = b.textContent;
}, true);
async function rpcCagir(fn, params, btnId, msgId, basariTxt){
  // btnId olmayabilir (satır içi aç/kapa butonlarının sabit id'si yok) — null güvenli
  const btn = btnId ? document.getElementById(btnId) : null;
  /* ⚠ CQ · "Yükleniyor..." SONSUZA KADAR YAZILI KALIYORDU. Ölçüldü:
     vergiOdemeKaydet düğme metnini kendisi 'Yükleniyor...' yapıyor,
     sonra buraya geliyordu; burası O ANKİ metni "asıl metin" sanıp
     iş bitince ona döndürüyordu. Kayıt BAŞARILI oluyor ama düğme
     "Yükleniyor..." kalıyor, sahip olmadı sanıp tekrar deniyordu.
     ÇÖZÜM: meşgul metni asıl metin sayılmaz; son GERÇEK etiket
     düğmenin üstünde saklanır. Diğer 20+ çağrı ETKİLENMEZ — onlar
     buraya gerçek etiketle geliyor, o etiket hem saklanır hem
     'eski' olur, davranış birebir aynı kalır. */
  if (btn && !RPC_MESGUL.test((btn.textContent || '').trim()))
    btn.dataset.asilMetin = btn.textContent;
  const eski = btn ? (btn.dataset.asilMetin != null ? btn.dataset.asilMetin : btn.textContent) : null;
  if (btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  try{
    // Aynı idem anahtarıyla otomatik 2 deneme: bağlantı koparsa (commit olmuş olabilir)
    // aynı anahtar _idem_kontrol'e takılır, mükerrer kayıt OLMAZ.
    let son;
    for (let deneme = 0; deneme < 2; deneme++){
      son = await sb.rpc(fn, params);
      if (!son.error) break;
      if (!/Failed to fetch|NetworkError|timeout/i.test(son.error.message)) break; // sadece ağ hatasında retry
      btn.textContent = 'Bağlantı koptu, tekrar deneniyor...';
      await new Promise(r=>setTimeout(r, 1200));
    }
    /* v60 · MUKERRER_SUPHESI — sunucu yakin zamanda ayni kaydi gordu.
       Engellemiyoruz, SORUYORUZ. Kaza (cift tiklama) burada durur: kimse
       "evet farkli" demez. Mesru ikinci kayit ise aninda gecer.
       Onay p_mukerrer_onay ile sunucuya gider ve audit'e iz birakir —
       tarayicida yutulan bir confirm() degil. */
    if (son.error && /MUKERRER_SUPHESI/.test(son.error.message)){
      const devam = confirm(
        'Az önce aynı tutarda ve aynı güne ait bir kayıt girilmiş görünüyor.\n\n' +
        'Bu GERÇEKTEN ayrı bir kayıt mı?\n\n' +
        'İptal → kaydetme (yanlışlıkla iki kez göndermiş olabilirsin)\n' +
        'Tamam → ayrı bir kayıt, yine de kaydet');
      if (!devam){
        mesaj(msgId, 'hata', 'Kaydedilmedi — listeyi kontrol et, kayıt zaten girilmiş olabilir.');
        return null;
      }
      son = await sb.rpc(fn, { ...params, p_mukerrer_onay: true });
    }
    if (son.error){ window.__sonRpcHataHam = son.error.message; throw new Error(son.error.message); }
    if (basariTxt) mesaj(msgId, 'ok', basariTxt);
    formTemiz();                       // kayıt gitti, form artık kirli değil
    return son.data;
  }catch(e){
    mesaj(msgId, 'hata', hataTr(e.message) + ' — Verileriniz formda duruyor, tekrar deneyin.');
    return null;
  }finally{
    if (btn){ btn.disabled = false; btn.textContent = eski; }
  }
}
/* ⚠ Y2 · CIFT CEVIRI KAPISI. Dort kod yolundaki ic ceviri kaldirildi, ama
   koruma AUDIT'e degil YAPIYA baglanmali: bir metin bir kez cevrildiyse
   ikinci cagri onu OLDUGU GIBI geri verir. Yoksa ileride biri yeniden
   hataTr(hataTr(x)) yazdiginda "Bu ay kapatilmis." sessizce genel cumleye
   donusur — iyi mesaj kaybolur ve kimse fark etmez.
   KURAL: HATA METNI TAM BIR KEZ CEVRILIR: GOSTERIM ANINDA.
          Ara katmanlar HAM metni tasir, ceviri YAPMAZ. */
const HATA_GENEL = 'İşlem tamamlanamadı. Tekrar deneyin; sürerse bu ekranı yöneticiye bildirin.';
const HATA_CEVRILMIS = new Set([HATA_GENEL]);
function hataTr(m){
  /* ⚠ 22 gosterim noktasi buraya bagli; biri undefined gecerse m.includes
     patlar ve hata mesaji YERINE cokme olurdu. */
  m = String(m == null ? '' : m);
  if (HATA_CEVRILMIS.has(m)) return m;         // zaten cevrilmis — DOKUNMA
  const c = hataTrIc(m);
  if (c !== m) HATA_CEVRILMIS.add(c);
  return c;
}
function hataTrIc(m){
  /* Finans raporu yetki kapısı — rapora ÖZEL kodlar.
     Genel YETKI_YOK'u burada yakalamak yasak: 36 RPC aynı kodu fırlatıyor
     ve hepsi "Bu rapor için..." demeye başlıyordu. Genel karşılığı aşağıda,
     kendi yerinde duruyor. Bu üçü yalnız rapor akışına ait. */
  if (m.includes('RAPOR_YETKI_YOK')) return 'Bu rapor için yetkiniz yok.';
  if (m.includes('RAPOR_SUBE_YETKISIZ')) return 'Bu şubenin raporunu görüntüleyemezsiniz.';
  if (m.includes('RAPOR_DONEM_GECERSIZ')) return 'Dönem geçersiz — yıl ve ay seçimini kontrol et.';
  /* v59 · RAPOR_SUBE_YOK — şube belirlenemedi.
     İki ayrı sebebi var ve ikisi de kullanıcının kendi düzeltebileceği
     şey değil: (a) ekran şube seçmeden çağırdı, (b) profilde şube tanımlı
     değil. Bu yüzden mesaj "yetkiniz yok" demiyor — yanlış yönlendirir;
     kullanıcı yetkisini değil, kaydını düzelttirmeli. */
  /* v60 · MUKERRER_SUPHESI normalde rpcCagir'da yakalanip kullaniciya
     SORULUYOR. Buraya dusmesi, onay akisinin atlandigi bir cagri yolu
     oldugu anlamina gelir — sessiz kalmasin. */
  if (m.includes('MUKERRER_SUPHESI')) return 'Aynı kayıt az önce girilmiş görünüyor. Listeyi kontrol et.';
  if (m.includes('RAPOR_SUBE_YOK')) return 'Şube belirlenemedi. Profilinizde şube tanımlı olmayabilir — yöneticinize bildirin.';
  /* v59 · BELGE_SUBE_YETKISIZ — belge yükleme, başka şubenin kaydına.
     KAYIT_YOK'tan AYRI tutuluyor: birincisi normal (kayıt silinmiş
     olabilir), bu ise başka şubenin kaydına yazma denemesidir. */
  if (m.includes('BELGE_SUBE_YETKISIZ')) return 'Bu belge başka bir şubenin kaydına ait — yükleme yapılamaz.';
  // v33–v36 ile eklenen sunucu tarafı kurallar
  if (m.includes('O_GUN_KAYIT_VAR')) return 'O güne ait gün sonu kaydı var — kapalı gün işaretlenemez.';
  if (m.includes('AY_BITMEDI')) return 'Bu ay daha bitmedi — ancak biten ay kapatılabilir.';
  if (m.includes('ODEME_KAYDI_YOK')) return 'Bu vade elle "ödendi" yapılamaz — önce ödemeyi kaydet, vade kendiliğinden kapanır. Ödenecek tutar çıkmadıysa "Kapat" düğmesini kullan.';
  if (m.includes('TUTAR_POZITIF_OLMALI')) return 'Tutar sıfırdan büyük olmalı.';
  if (m.includes('MIKTAR_SIFIR_OLAMAZ')) return 'Miktar sıfır olamaz.';
  if (m.includes('OWNER_ROLU_KORUMALI')) return 'Yönetici rolü korumalıdır — yetkileri kapatılamaz.';
  if (m.includes('KORUMALI_ROL_SILINEMEZ')) return 'Bu rol korumalıdır, silinemez.';
  if (m.includes('KENDI_ROLUNU_DEGISTIREMEZSIN')) return 'Kendi rolünü değiştiremezsin.';
  if (m.includes('KENDINI_KAPATAMAZSIN')) return 'Kendi hesabını kapatamazsın.';
  if (m.includes('ROLDE_') && m.includes('_KISI_VAR')) return 'Bu rolde kayıtlı kişi var — önce onları başka role al.';
  if (m.includes('ROL_KODU_GECERSIZ')) return 'Rol adı en az 3 harf olmalı, sadece harf içermeli.';
  if (m.includes('ROL_ADI_ZORUNLU')) return 'Rol adı boş olamaz.';
  if (m.includes('ROL_YOK')) return 'Böyle bir rol yok.';
  if (m.includes('PROFIL_YOK')) return 'Kişi bulunamadı.';
  if (m.includes('DONEM_BICIMI')) return 'Dönem biçimi hatalı (YYYY-AA olmalı).';
  if (m.includes('SUBE_ZORUNLU')) return 'Şube seçilmemiş.';
  if (m.includes('DOSYA_YOLU_ZORUNLU')) return 'Dosya yolu boş olamaz.';
  if (m.includes('IDEM_KEY_BASKA_ISLEMDE')) return 'Bu işlem anahtarı başka bir işlemde kullanılmış — sayfayı yenileyip tekrar dene.';
  if (m.includes('VADE_YOK') || m.includes('VADE_BULUNAMADI')) return 'Vade kaydı bulunamadı.';
  if (m.includes('GECERSIZ_DURUM')) return 'Geçersiz durum.';
  if (m.includes('YIL_GECERSIZ')) return 'Yıl geçersiz.';
  if (m.includes('TARIH_ZORUNLU')) return 'Tarih zorunlu.';
  if (m.includes('ck_odeme_tutar_pozitif') || m.includes('ck_gider_tutar_pozitif')
   || m.includes('ck_alis_toplam_pozitif') || m.includes('ck_vergi_tutar_pozitif'))
    return 'Tutar sıfırdan büyük olmalı — eksi veya sıfır kaydedilemez.';
  if (m.includes('ck_stok_isaret')) return 'Stok hareketi geçersiz: tüketim stoktan düşer, sıfır miktar kaydedilemez.';
  if (m.includes('GUN_ZATEN_GIRILMIS')) return 'Bu günün kaydı zaten girilmiş. Düzeltme gerekiyorsa talep açın.';
  /* v61 · Dönem kilidi artık GERÇEKTEN tutuyor: RPC'lerde ve tablo
     trigger'larında. Eski mesaj 'yöneticiye başvurun' diyordu ama
     yöneticinin kendisi de kilitli ve ne yapacağı yazmıyordu.
     Artık yol var: Ay Sonu ekranından ayı aç, gir, tekrar kapat. */
  if (m.includes('AY_KAPALI')) return 'Bu ay kapatılmış. Kayıt girmek için Ay Sonu ekranından ayı açman gerekiyor.';
  if (m.includes('AY_COK_ESKI')) return 'Bu ay çok eski — yalnız içinde bulunulan ay ve geriye iki ay açılabilir. Daha eskisi için düzeltme kaydı gerekir.';
  if (m.includes('AY_GELECEK')) return 'Gelecek bir ay açılamaz.';
  /* v65 · Eskiden burada "Ayı neden açtığını..." yazıyordu ve AŞAĞIDAKİ

  window.__sonHataHam = m;

/* ===== BR · TEKRAR EDEN UYARI TEK SATIRA (2026-08-24-3) =====

     da degismeli (kaynak: v_uyarilar, taban migration'i). */
const UY_GRUP = [
  { k:'fatura_vadesiz', tip:'fatura', on:'Ödenmemiş fatura (vade girilmemiş',
    ad:n => n + ' faturanın vadesi girilmemiş', eylem:'Gir' },

  { k:'cek',       tip:'cek',       ad:n => n + ' çekin vadesi yaklaştı/geçti', eylem:'Gör' },
  { k:'vade',      tip:'vade',      ad:n => n + ' vadenin ödeme günü yaklaştı', eylem:'Gör' },
  { k:'stok',      tip:'stok',      ad:n => n + ' ürün kritik seviyede',        eylem:'Gör' },

/* Tutar mesajin SONUNDA, to_char(...,'FM999G999G990D00') || ' TL' bicimiyle.
   ⚠ KURUSA cevrilip TAM SAYI toplanir — float toplami kurus kaydirir. */
const UY_TUTAR_KALIP = /(\d{1,3}(?:\.\d{3})*|\d+),(\d{2})\s*TL\s*$/;
function uyariKurus(mesaj){
  const m = UY_TUTAR_KALIP.exec(String(mesaj || ''));
  return m ? Number(m[1].replace(/\./g, '')) * 100 + Number(m[2]) : null;
}
const uyariKurusTl = k => Math.floor(k / 100).toLocaleString('tr-TR')
  + ',' + String(k % 100).padStart(2, '0') + ' TL';
/* Doner: { ozet, ayrinti, acil, ayrintiAdet }
     ozet    — kapali kartta gorunen satirlar (grup ozeti VEYA tek satir)
     ayrinti — YALNIZ gruplanan turlerin tek tek satirlari ("tumunu gor")
     acil    — para riskli GRUP sayisi (satir sayisi DEGIL) */
function uyariGrupla(liste){
  const bulunan = new Map();
  let tekNo = 0;
  for (const x of liste || []){
    const g = UY_GRUP.find(y => y.tip === x.tip && (!y.on || String(x.mesaj || '').startsWith(y.on)));
    const anahtar = g ? g.k : 'tek' + (++tekNo);      // kalip tutmadi — kendi basina
    if (!bulunan.has(anahtar)) bulunan.set(anahtar, { g, uye: [] });
    bulunan.get(anahtar).uye.push(x);
  }
  let ozet = '', ayrinti = '', acil = 0, ayrintiAdet = 0;
  for (const { g, uye } of bulunan.values()){
    const ilk = uye[0];
    if (uye[0] && UY_AGIR[ilk.tip]) acil++;
    if (!g || uye.length === 1){ ozet += uyariSatir(ilk); continue; }   // tek örnek: değişmez
    /* Toplam yalniz TUM uyelerin tutari okunabildiyse yazilir — eksik
       toplami "toplam" diye gostermek yanlis rakam olurdu. */
    const krs = uye.map(x => uyariKurus(x.mesaj));
    const toplam = krs.every(v => v != null) ? krs.reduce((a, v) => a + v, 0) : null;
    /* ⚠ uy-et ROZETI YOK: grup cumlesi turu zaten soyluyor ("11 FATURAnın
       vadesi girilmemiş"). Rozet burada tekrar olurdu ve 375px'te satiri
       IKI SATIRA kiriyordu (olculdu: rozetli 59px, rozetsiz 44px).
       Tek tek satirlar ayrintida rozetini KORUYOR. */
    ozet += `<div class="${UY_AGIR[ilk.tip] ? 'uyari-agir' : 'uyari-orta'} uy-sr"
        onclick="sekmeAc('${UY_HEDEF[ilk.tip] || 'ozet'}')">
      <span class="uy-mt" style="flex:1">${esc(g.ad(uye.length))}${toplam != null ? ' · ' + uyariKurusTl(toplam) : ''}</span>
      <span class="k">${g.eylem} ›</span>
    </div>`;
    ayrinti += uye.map(uyariSatir).join('');
    ayrintiAdet += uye.length;
  }
  return { ozet, ayrinti, acil, ayrintiAdet };
}

  const b = bugun(), s7 = BB_GUN(b,7), s30 = BB_GUN(b,30), dun = BB_GUN(b,-1);
  /* ⚠ TAKVİM HAFTASI (BB_HAFTA), kayan 7 gün DEĞİL: 31.08 "bu hafta" değil.
     Geçmiş vadeler hiçbir pencereye GİRMEZ, ayrı sayılır. */
  const { bas: hBas, son: hSon } = BB_HAFTA(b);
  const buAy = b.slice(0,7), gecenAy = BB_AYEKLE(buAy,-1);
  const [kredi, kart, donem, vade, taksit, banka, kasa, dunGs, kapanis, tumTaksit, cariH, madenK, fiyatK] = await Promise.all([
    sb.from('v_kredi_taksit_durum').select('vade_tarihi,kalan,kredi_ad,banka,kredi_tur')
      .gt('kalan',0).neq('durum','kapali').lte('vade_tarihi', s30).order('vade_tarihi'),
    sb.from('kart').select('id,ad,banka,sahip,kesim_gunu,son_odeme_gunu,kart_limiti,limit_paylasan_id')
      .eq('aktif',true).eq('is_deleted',false),
    sb.from('v_kart_donem').select('kart_id,donem,kalan,kapanmamis,donem_odemesi,odeme_turu')
      .order('donem',{ascending:false}),
    sb.from('v_vade_liste').select('id,tur,aciklama,vade_tarihi,tutar,durum')
      .in('durum',['acik','tutar_yok']).lte('vade_tarihi', s30).order('vade_tarihi'),
    sb.from('v_kart_taksit').select('firma,banka,vade,donem,taksit_tutari,taksit_no,taksit_sayisi')
      .gt('taksit_sayisi',1).gte('vade', b).lte('vade', s30).order('vade'),
    sb.from('v_banka_son').select('banka,bakiye,kayit_zamani,saat_once').order('banka'),
    sb.from('gun_sonu').select('tarih,kasa_nakit').eq('is_deleted',false).order('tarih',{ascending:false}).limit(1),
    sb.from('gun_sonu').select('tarih,toplam,kasa_nakit').eq('tarih', dun).eq('is_deleted',false).maybeSingle(),
    sb.from('ay_kapanis').select('kapali').eq('donem', gecenAy).eq('is_deleted',false).maybeSingle(),
    /* BF · borc siniflari — borc.html bantVerisi ile AYNI kaynaklar */
    sb.from('v_kredi_taksit_durum').select('kredi_tur,anapara_tutar,faiz_tutar,vergi_masraf_tutar,kalan,durum,anapara_odenen,faiz_odenen'),
    sb.from('v_sahis_hesap_bakiye').select('bakiye'),
    sb.from('maden').select('tur,gram,tarih,alis_tutar').eq('is_deleted',false),
    sb.from('maden_fiyat').select('tur,gram_fiyat,tarih').eq('is_deleted',false).order('tarih',{ascending:false})
  ]);
  const hata = ilkHata(kredi, kart, donem, vade, taksit, banka, kasa, dunGs, kapanis, tumTaksit, cariH, madenK, fiyatK);
  if (hata){ el.innerHTML = hataKutusu(hata, 'vOzet()'); return; }

  /* ---- DÖRT KAYNAK TEK LİSTE: {t:tarih, ad, alt, tutar|null, kaynak} ---- */
  const L = [];
  for (const x of kredi.data||[])
    L.push({ t:x.vade_tarihi, ad:esc(x.kredi_ad)+(x.kredi_tur==='ltd'?' <span class="rozet rz-gri">LTD</span>':''),
             alt:'kredi taksiti'+(x.banka?' · '+esc(x.banka):''), tutar:+x.kalan, k:'kredi' });
  const sonDonem = new Map();            // kart_id -> en yeni dönem (desc sıralı geldi)
  for (const d of donem.data||[]) if (!sonDonem.has(d.kart_id)) sonDonem.set(d.kart_id, d);
  const ekstreliAylar = new Set((donem.data||[]).map(d => d.donem));
  const dik = { girilmedi:0, limitsiz:0 };
  for (const k of kart.data||[]){
    if (k.kart_limiti == null && !k.limit_paylasan_id) dik.limitsiz++;
    const d = sonDonem.get(k.id); if (!d || +d.kalan <= 0 || d.odeme_turu === 'tam') continue;
    if (k.son_odeme_gunu == null || k.kesim_gunu == null) continue;
    /* AR kuralı: ödeme günü kesimden büyükse ekstre ayı, değilse sonraki ay */
    const ay = k.son_odeme_gunu > k.kesim_gunu ? d.donem : BB_AYEKLE(d.donem, 1);
    const t = ay + '-' + String(Math.min(k.son_odeme_gunu, +aySon(ay).slice(8,10))).padStart(2,'0');
    const girilmedi = d.donem_odemesi == null;
    if (girilmedi) dik.girilmedi++;
    /* ⚠ BA kurali Ozet'te de: BILINMEYEN, GECIKMIS DEGILDIR. girilmedi
       NOTR renkte, "vadesi gecen" ALARMINA GIRMEZ; satir listede kalir. */
    /* ⚠ kismi = odeme YAPILMIS, kalan faiziyle DEVREDER — "odenmemis" degildir,
       alarma girmez (kullanicinin itirazi: "o karti odedik"). Satir listede
       "kalan devretti" notuyla kalir. */
    const devretti = d.odeme_turu === 'kismi';
    L.push({ t, ad:esc(k.ad)+(k.banka?' · '+esc(k.banka):''), alt:'kart ekstresi '+d.donem
               +(girilmedi?' · <b class="k">ödeme bilgisi girilmemiş</b>':'')
               +(devretti?' · kalan devretti':''),
             tutar: girilmedi ? +d.kalan : +d.kapanmamis, k:'kart', gi: girilmedi, dv: devretti });
  }
  let tutarsiz = 0;
  for (const v of vade.data||[]){
    const yok = v.durum === 'tutar_yok' || v.tutar == null;
    if (yok) tutarsiz++;
    L.push({ t:v.vade_tarihi, ad:esc(v.aciklama||v.tur), alt:'vergi/vade'+(yok?' · <b style="color:var(--uyari)">tutar bekleniyor</b>':''),
             tutar: yok ? null : +v.tutar, k:'vergi', id: v.id });
  }
  let ekstrede = 0;
  for (const x of taksit.data||[]){
    if (ekstreliAylar.has(x.donem)){ ekstrede++; continue; }   // çift sayım kuralı, yukarıda
    L.push({ t:x.vade, ad:esc(x.firma), alt:'kart taksiti '+x.taksit_no+'/'+x.taksit_sayisi+(x.banka?' · '+esc(x.banka):'')+' · sonraki ekstrede',
             tutar:+x.taksit_tutari, k:'tedarik' });
  }
  L.sort((a,c) => a.t.localeCompare(c.t));

  /* ---- PENCERELER · tutarı olmayan TOPLAMA GİRMEZ, sayılır ----
     ⚠ BO · n ESKIDEN tum kalemleri sayiyordu, ts ayni kalemi BIR DAHA —
     canli sonuc "1 ödeme · 0,00 TL + 1 tutarsız" (tek kalem, tutari yok)
     ve "0,00 geçti" alarmi bosuna telaslandirdi. n artik tutari OLAN kalem. */
  const pen = (f) => { const s = L.filter(f); const ts = s.filter(x => x.tutar == null).length;
    return { n:s.length - ts, t:s.reduce((a,x)=>a+(x.tutar||0),0), ts }; };
  /* ⚠ Alarm ve "dogrulanmis" toplam gi (odeme bilgisi girilmemis) dislar. */
  const gec = pen(x => x.t < b && !x.gi && !x.dv),
        gecGi = L.filter(x => x.t < b && x.gi).length,
        gecDv = L.filter(x => x.t < b && x.dv).length,
        haf = pen(x => x.t >= b && x.t <= hSon),
        g7 = pen(x => x.t >= b && x.t <= s7), g30 = pen(x => x.t >= b && x.t <= s30),
        g7d = pen(x => x.t >= b && x.t <= s7 && !x.gi);
  /* BO · "0 ödeme · 0,00 TL" HICBIR dalda yazilmaz; yalniz tutarsiz varsa
     "M kalemin tutarı girilmemiş" — o eksik VERIDIR, odeme degil. */
  const pz = (p) => p.n
    ? p.n + ' ödeme · ' + tl(p.t) + (p.ts ? ' + <b style="color:var(--uyari)">' + p.ts + ' tutarsız</b>' : '')
    : p.ts + ' kalemin tutarı girilmemiş';
  el.dataset.g7 = JSON.stringify(g7);   // BC3 ölçümü için; ekranda gösterilmez

  /* ---- ELDE · kasa + banka · fark hesaplanmaz ---- */
  const ks = (kasa.data||[])[0];
  const kasaM = ks && ks.kasa_nakit != null
    ? tl(ks.kasa_nakit) + ' <span class="k">(' + (ks.tarih === dun ? 'dün akşam' : ks.tarih === b ? 'bugün' : BB_GG(ks.tarih)) + ')</span>'
    : '<span style="color:var(--uyari)">sayılmamış</span>';
  const bankalar = banka.data||[];
  const bankaM = bankalar.length
    ? bankalar.map(x => { const eski = +x.saat_once >= 24;
        const ne = +x.saat_once < 1 ? 'az önce' : +x.saat_once < 48 ? Math.round(+x.saat_once) + ' saat önce' : Math.round(+x.saat_once/24) + ' gün önce';
        return esc(x.banka) + ' ' + tl(x.bakiye) + ' <span class="k"' + (eski ? ' style="color:var(--uyari);font-weight:800"' : '') + '>(' + ne + ')</span>'; }).join(' · ')
    : '<span style="color:var(--uyari)">girilmemiş</span>';

  /* ---- BORC SINIFLARI · borc.html bantVerisi formullerinin BIREBIR portu.
     UC SINIF TOPLANMAZ: sahis "bugun kapatsam", Ltd AYRI TUZEL KISILIK,
     maden PIYASAYLA DEGISEN yukumluluk — ayni cinsten degiller.
     Gelecek faiz anaparaya EKLENMEZ; zaman gecerse dogar, ayri satir. */
  const kr2 = (x) => Math.round((Number(x)||0) * 100);
  const SB = { anapara:0, faizMasraf:0, kirilimsiz:0, kirilimsizAdet:0 };
  const LB = { anapara:0, faizMasraf:0, kirilimsiz:0, kirilimsizAdet:0 };
  for (const t of tumTaksit.data||[]){
    if (t.durum === 'kapali') continue;
    const g = t.kredi_tur === 'ltd' ? LB : SB;
    if (t.anapara_tutar === null || t.anapara_tutar === undefined){
      g.kirilimsiz += kr2(t.kalan); g.kirilimsizAdet++; continue; }
    g.anapara    += kr2(t.anapara_tutar) - kr2(t.anapara_odenen || 0);
    g.faizMasraf += kr2(t.faiz_tutar) + kr2(t.vergi_masraf_tutar || 0) - kr2(t.faiz_odenen || 0);
  }
  /* ⚠ KART = HER KARTIN SON DONEMININ KALANI. Donemler TOPLANMAZ — devir
     bir oncekinin kalanini zaten icerir, toplamak CIFT SAYMAK olur
     (olculdu: son donemler 498.756,40 dogru; tum donemler 516.012,14,
     aradaki 17.255,74 mukerrer). */
  let kartS = 0, kartL = 0;
  for (const k of kart.data||[]){ const d = sonDonem.get(k.id); if (!d) continue;
    if (k.sahip === 'ltd') kartL += kr2(d.kalan); else kartS += kr2(d.kalan); }
  const cariT = (cariH.data||[]).reduce((a,h) => a + Math.max(0, kr2(h.bakiye)), 0);
  /* Maden: rayic = gram x SON fiyat. Kur farki yalniz IKISI DE bilinen
     kayitlardan; alis bilinmiyorsa kayit tarihindeki fiyattan TAHMIN
     (borc.html madenDeger kurali — fark tahminle sisirilmez, esler). */
  const fA = (tur, tarih) => { const u = (fiyatK.data||[]).filter(x => x.tur === tur && x.tarih <= tarih);
    return u.length ? u.reduce((a,x) => x.tarih > a.tarih ? x : a, u[0]) : null; };
  let madenBugun = 0, esA = 0, esB = 0, esN = 0, fiyatiYok = false;
  for (const m of madenK.data||[]){
    const sf = fA(m.tur, '9999-12-31');
    if (!sf){ fiyatiYok = true; continue; }
    /* borc.html madenDeger: gram x fiyat_KURUS — bolme YOK. Ilk yazimda
       /100 vardi ve rayic 100 kat kucuk cikti (olculdu: 690,00 vs 69.000). */
    const bugunK = Math.round((Number(m.gram)||0) * kr2(sf.gram_fiyat));
    madenBugun += bugunK;
    let alisK = null;
    if (m.alis_tutar != null && Number(m.alis_tutar) > 0) alisK = kr2(m.alis_tutar);
    else { const af = fA(m.tur, m.tarih);
      if (af) alisK = Math.round((Number(m.gram)||0) * kr2(af.gram_fiyat)); }
    if (alisK !== null){ esA += alisK; esB += bugunK; esN++; }
  }
  const kurFarki = esN ? (esB - esA) : null;
  const sKapat = SB.anapara + kartS, lKapat = LB.anapara + LB.kirilimsiz + kartL;
  const sahipOzel = cariT + madenBugun;
  const tk2 = (k) => (k/100).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});

  /* ---- DUZELT (kart-5) · sistemin BILMEDIKLERI, tahmin degil ---- */
  const D = [];
  if (!ctx.gunSonuVar) D.push(['gunsonu', 'Bugünün gün sonu girilmedi', "sekmeAc('gunsonu')", 'Gir']);
  if (!dunGs.data) D.push(['gunsonu', 'Dün (' + BB_GG(dun) + ') gün sonu girilmemiş', "sekmeAc('gunsonu')", 'Gir']);
  if (dik.girilmedi) D.push(['kart', dik.girilmedi + ' kartın ödeme bilgisi girilmemiş — tutar olarak ekstre kalanı sayıldı', "bfGit('borc.html#kartlar')", 'Gir']);
  /* ⚠ M3 OLCUMU: mevcut kartin limitini duzenleyen EKRAN YOK (borc.html
     kart formu yalniz YENI kart insert ediyor). Gidecegi olmayan dugme
     YALAN SOYLER — dugme yerine "—". Ekran acilirsa tek satirlik is. */
  if (dik.limitsiz) D.push(['kart', dik.limitsiz + ' kartın limiti girilmemiş', null, null]);
  if (tutarsiz) D.push(['vade', tutarsiz + ' vadenin tutarı girilmemiş — toplama girmedi', "sekmeAc('vergi')", 'Gir']);
  if (!(kapanis.data && kapanis.data.kapali)) D.push(['kapanis', ayAdi(gecenAy) + ' kapatılmamış', "sekmeAc('yonetim')", 'Aç']);
  if (OZ_O && !OZ_O.stok_bazli) D.push(['sayim', 'Ay sonu sayımı yok — kâr TAHMİN', "sekmeAc('stok')", 'Sayım']);
  if (ekstrede) D.push(['kart', ekstrede + ' kart taksiti zaten girilmiş ekstrenin içinde — ayrıca sayılmadı', "sekmeAc('tedarikci')", 'Gör']);

  /* Kapali kartta GORUNENLER: is SAYISI + gun sonu satirlari (bugun/dun).
     Geri kalani "tumunu gor" arkasinda — kart-5 sabah 6 satirla acilmasin. */
  const DAcik = D.filter(x => x[0] === 'gunsonu'), DGizli = D.filter(x => x[0] !== 'gunsonu');
  /* BL · Satir TIKLANIR, kaynagina goturur. Olculdu: onceden hicbir odeme
     satirinda onclick yoktu; kullanici hakli olarak "o ekranin icine girmem
     gerekmiyor mu" diye sordu. kutuErisim kalibi: role=button + tabindex +
     Enter/Space. aria-label BILEREK YOK: verilseydi satirin kendi icerigini
     (tarih · ad · tutar) ekran okuyucudan GIZLERDI; role=button'da erisilebilir
     ad zaten icerikten gelir. */
  const gitYolu = (x) => x.k === 'kredi' ? "bfGit('borc.html#krediler')"
    : x.k === 'kart' ? "bfGit('borc.html#kartlar')"
    : x.k === 'vergi' ? `ozVadeGit('${x.id || ''}')`
    : "sekmeAc('tedarikci')";
  const satir = (x) => `<div class="sr" role="button" tabindex="0" data-git="${x.k}" style="cursor:pointer"
      onclick="${gitYolu(x)}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click()}"><div><div class="sr-ad"><span class="rozet rz-gri" style="margin-right:6px">${BB_GG(x.t)}</span>${x.ad}</div>
      <div class="sr-alt">${x.alt}</div></div><div class="sr-tut">${x.tutar == null ? '<span style="color:var(--uyari)">—</span>' : tl(x.tutar)}</div></div>`;
  /* BD kalibi: kapanan LISTE, rakam degil; bugun/yarin satiri gizlenmez. */
  const yarin = BB_GUN(b, 1);
  let bdN = 0;
  const grup = (ozetHtml, sinif, rows, acikMax) => {
    const ac = sinif ? `<div class="${sinif} kb-sr">` : '<div class="kb-sr" style="background:var(--acik)">';
    let h = ac + ozetHtml;
    if (!rows.length) return h + '</div>';
    const acik = rows.filter((x, i) => i < acikMax || x.t === b || x.t === yarin);
    const gizli = rows.length - acik.length;
    if (!gizli) return h + '</div>' + acik.map(satir).join('');
    const id = 'bdG' + (++bdN);
    h += ` <button class="btn2 kb-bt" id="${id}b" aria-expanded="false" aria-controls="${id}k"
      data-t="tümünü gör (${rows.length})" onclick="bdAc(this,'${id}')">tümünü gör (${rows.length})</button></div>`;
    h += acik.map(satir).join('');
    h += `<div id="${id}k" hidden>` + rows.slice(acik.length).map(satir).join('') + '</div>';
    if (gizli) h += `<div id="${id}d" class="sr-alt" style="cursor:pointer;min-height:28px;padding:5px 2px"
      onclick="bdAc(document.getElementById('${id}b'),'${id}')">+${gizli} daha</div>`;
    return h;
  };
  const grupGec = L.filter(x => x.t < b), grupHaf = L.filter(x => x.t >= b && x.t <= hSon),
        grupSonra = L.filter(x => x.t > hSon && x.t <= s30);
  const dg = ctx.donem ? ayAdi(ctx.donem) : '';
  const gs = dunGs.data;

  /* ---- BQ · TASINAN ALTI BLOK (vOzet -> OZ_EK) ----
     BU AY kartina giren dort blok + kasa koprusu HAZIR HTML olarak gelir.
     Uyarilar HAM gelir; mukerrer satir BURADA suzulur, cunku hangi satirin
     bes kartta zaten oldugunu yalniz bu fonksiyon bilir:
       · 'vade' uyarisi — kart-2 listesi 30 gune kadar TUM acik/tutar_yok
         vadeyi satir satir gosteriyor; uyari kumesi (durum='acik') onun
         ALT KUMESI. Pencere disinda kalan (uyari_gun > 30) vade DUSMEZ.
       · 'eksik_gun' uyarisi — DUNUN satiri kart-5'te zaten var (D listesi).
         Daha eski eksik gunler dusmez, "Kapalıydı/Gir" dugmeleriyle kalir.
     ⚠ ACIL sayaci suzgecten SONRAKI listeden hesaplanir; rozet ile altindaki
       satirlar ayni sayiyi soylesin. */
  const ek = OZ_EK || {};
  const uyL = (ek.uyarilar || []).filter(x =>
    !(x.tip === 'vade' && x.tarih <= s30) && !(x.tip === 'eksik_gun' && x.tarih === dun));
  /* BR · Tur basina TEK ozet satiri; ayrinti "tumunu gor"un arkasinda.
     ⚠ ACIL sayaci artik GRUP sayar: on bir vadesiz fatura tek is, tek alarm.
       Onceden satir sayiyordu ve "ACİL 16" gercekte 4 isi anlatiyordu. */
  const uyG = uyariGrupla(uyL);
  const d5Gizli = DGizli.length + uyG.ayrintiAdet;
  const d5Tum = D.length + uyL.length;

  /* ---- BES KART · onaylanan telefon gorseli ---- */
  el.innerHTML = `
    ${!bankalar.length ? `<div class="uyari-orta kb-sr">Ödeme gücü hesaplanamıyor · banka bakiyesi eksik
       <button class="btn2 kb-bt" onclick="katlaAc('bbKutu',this)">Banka gir</button></div>` : ''}
    <div class="kart" id="bfDun" style="cursor:pointer" onclick="sekmeAc('gunsonu')">
      ${kbaslik('DÜN', BB_GG(dun) + (gs ? ' · gün sonu ✓' : ''), gs ? '' : '<span class="rozet rz-uyari">gün sonu girilmemiş</span>')}
      ${gs ? `<div class="bilgi-not" style="margin-top:0">ciro <b>${tl(gs.toplam)}</b> · kasa nakit <b>${gs.kasa_nakit != null ? tl(gs.kasa_nakit) : 'sayılmamış'}</b></div>`
           : `<div class="bilgi-not" style="margin-top:0">Dünün gün sonu girilmemiş — dokun, gir.</div>`}
    </div>
    <div class="kart" id="odemelerKart">
      ${kbaslik('ÖNÜMÜZDEKİ 7 GÜN', tl(g7d.t) + ' doğrulanmış', gec.n ? `<span class="rozet rz-hata">geçti ${tl(gec.t)}</span>` : '')}
      ${gecGi ? `<div class="sr-alt">${gecGi} kartın ödeme bilgisi girilmemiş — alarma sayılmadı, "Bugün düzelt"te</div>` : ''}
      ${gecDv ? `<div class="sr-alt">${gecDv} kartın kalanı devretti — ödeme yapılmış, alarm değil</div>` : ''}
      ${gec.n ? grup('Vadesi geçti: ' + pz(gec), 'uyari-agir', grupGec, 0)
        /* BO · tutari bilinmeyen vadenin tarihi gecti = EKSIK VERI, gecikmis
           odeme degil: alarm cubugu yok, satir listede kaliyor. */
        : gec.ts ? grup(pz(gec), '', grupGec, 0) : ''}
      ${(haf.n || haf.ts) ? grup('Bu hafta (' + BB_GG(hBas) + '–' + BB_GG(hSon) + '): ' + pz(haf), 'uyari-orta', grupHaf, 3) : ''}
      ${(g30.n || g30.ts) ? grup('30 gün (→ ' + BB_GG(s30) + '): ' + pz(g30), '', grupSonra, 0) : ''}
      ${L.length ? '' : bosDurum('liste','30 gün içinde ödeme yok','Kredi, kart ekstresi, vergi vadesi ve kart taksiti burada birleşir.')}
    </div>
    <div class="kart" id="bfAy" style="cursor:pointer" onclick="ayRaporuAc('${ctx.donem}')">
      ${kbaslik('BU AY', dg + ' · KTÜ', `<div class="kb-sag" style="text-align:right"><span class="k">rapor ›</span>${
        ek.buAy ? `<button class="btn2 kb-bt" id="bfEkb" aria-expanded="false" aria-controls="bfEkk"
          style="display:block;margin:6px 0 0 auto" data-t="ayın dökümü"
          onclick="event.stopPropagation();bdAc(this,'bfEk')">ayın dökümü</button>` : ''}</div>`)}
