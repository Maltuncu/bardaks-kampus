/* Günlük ciro grafiği — kütüphanesiz SVG.
   Önceki hâli adım sayara benziyordu: her sütunun arkasında bej "hedef şeridi",
   yuvarlak uçlar, tek renk, iki eksen etiketi. Finans grafiği değil aktivite çubuğuydu.
   Şimdi:
     · zemin şeridi YOK, düz uçlu sütun
     · hafta sonu ayrı ton — kampüste hafta sonu düşüğü BAŞARISIZLIK DEĞİL, takvim
     · üç yatay kılavuz + gerçek rakam
     · haftalık tarih etiketi (1, 8, 15, 22, 29)
     · kayıt girilmemiş gün: ince kesik taban çizgisi — "satış yok" ile karışmasın */
/* gunlukCiro(gunler, ayStr, kasaCikis)
   Grafiğin çizdiği sütunlar, başlıktaki toplam ve ortalama çizgisi TEK kaynaktan
   (bu fonksiyonun döndürdüğü seri) hesaplanır — üçü ayrı yerden gelirse tutmaz.
     kart         = gun_sonu.kart_toplam
     TOPLAM NAKİT = gun_sonu.kasa_nakit + o gün kasadan ödenen
                    ⚠ v62: "kasadan ödenen EKLENMEZ (zaten gider)" YANLIŞTI.
                    Gider tarafı o parayı zaten düşüyor; ciroya koymayınca
                    kâr o kadar EKSİK çıkıyordu. Kasaya giren nakit =
                    sayılan + ödenen. Aynı dosyanın :2464'teki yorumu bunu
                    baştan beri doğru tarif ediyordu, kod uygulamıyordu.
     SAHİP HAREKETİ  kasaya koyduğu/çektiği para SATIŞ DEĞİL — düşülür.
     gerçek ciro  = kart + toplam nakit
     Z'deki nakit (gun_sonu.nakit_toplam) toplam nakdi DEĞİŞTİRMEZ; tek işi
     ay sonu KDV beyanını beslemek (Temmuz'un Z nakdi → 28 Ağustos'ta ödenecek KDV).
   Kasa sayılmamışsa nakit BİLİNMEZ (uydurulmaz). Sayılan Z'dekinden azsa bu
   KASA AÇIĞIDIR — ayrı işaretlenir, sıfıra kırpılıp gizlenmez. */
function gunlukCiro(gunler, ayStr, kasaCikis, sahipNakit){
  const yil=+ayStr.slice(0,4), ayNo=+ayStr.slice(5,7);
  const gunSayisi=new Date(yil, ayNo, 0).getDate();
  const seri=[];
  let tResmi=0, tKart=0, tNakit=0, tKdvNakit=0, tZDisi=0, tGercek=0, kayitli=0, acikGun=0, bilinmeyen=0;
  const bugunS=bugun();
  for(let d=1; d<=gunSayisi; d++){
    const ts=ayStr+'-'+String(d).padStart(2,'0');
    const k=gunler.find(x=>x && x.tarih===ts);
    const g={ gun:d, tarih:ts, hafta:new Date(yil,ayNo-1,d).getDay(),
              gelecek: ts>bugunS, bugun: ts===bugunS };
    if(!k){ g.durum = g.gelecek ? 'gelecek' : 'eksik'; seri.push(g); continue; }
    kayitli++;
    g.resmi=+k.toplam||0;
    g.kart=+k.kart_toplam||0;
    g.nakit=+k.nakit_toplam||0;
    if(k.kasa_nakit===null || k.kasa_nakit===undefined){
      g.durum='kasa_sayilmadi'; g.nakitToplam=null; g.zDisi=null; g.gercek=g.resmi; bilinmeyen++;
    }else{
      // v62 · Kasaya GİREN nakit = sayılan + o gün kasadan ödenen.
      // Sahibin koyduğu/çektiği para satış değil, düşülür (SQL zaten öyle
      // yapıyordu; JS yapmıyordu — iki taraf tek tanıma bağlandı).
      const cikan  = (kasaCikis && kasaCikis[ts]) || 0;
      const sahip  = (sahipNakit && sahipNakit[ts]) || 0;
      g.nakitToplam = +k.kasa_nakit + cikan;
      g.zDisi = g.nakitToplam - g.nakit - sahip;
      g.gercek = g.kart + g.nakitToplam - sahip;
      // KASA AÇIĞI eşiği: artık kasadan ödenen düşülmüş DEĞİL, dahil.
      // Eski hâlde meşru bir ödeme günü yapay olarak "açık" işaretleniyordu.
      g.durum = g.zDisi<0 ? 'kasa_acigi' : 'tam';
      if(g.zDisi<0) acikGun++;
    }
    tResmi+=g.resmi; tKart+=g.kart; tKdvNakit+=g.nakit;
    tNakit+=(g.nakitToplam||0); tZDisi+=(g.zDisi||0); tGercek+=g.gercek;
    seri.push(g);
  }
  return { seri, gunSayisi,
           toplamKart:tKart,          // karttan gelen
           toplamNakit:tNakit,        // elle girilen nakit — BİZİM nakdimiz
           toplamKdvNakit:tKdvNakit,  // bunun KDV'ye dahil olan kısmı (Z raporundan)
           toplamZDisi:tZDisi,        // KDV'ye girmeyen kısım = toplamNakit − toplamKdvNakit
           toplamResmi:tResmi,        // Z toplamı (kart + KDV'ye dahil nakit)
           toplamGercek:tGercek,      // kart + elle girilen nakit
           kayitliGun:kayitli, ortalama: kayitli? tGercek/kayitli : 0,
           kasaAcigiGun:acikGun, kasaSayilmayanGun:bilinmeyen };
}
function ciroGrafigi(v){
  if(!v || !v.kayitliGun) return '';
  const { seri, gunSayisi, ortalama } = v;
  const G=340, Y=152, sol=40, sag=6, ust=14, alt=30;
  const iw=G-sol-sag, ih=Y-ust-alt;
  const ham=Math.max(...seri.map(g=>g.gercek||0), 1);
  const bas=Math.pow(10, Math.floor(Math.log10(ham)));
  const tavan=Math.ceil(ham/(bas/2))*(bas/2);
  const gen=iw/gunSayisi, kal=Math.max(gen-2.2, 1.6);
  const kisa=n=>n>=1000?(n/1000).toFixed(n>=10000?0:1).replace('.',',')+'b':String(Math.round(n));
  const yOf=val=>ust+ih-(val/tavan)*ih;
  const GUNAD=['Paz','Pzt','Sal','Çar','Per','Cum','Cmt'];
  // Paranın NEREDE olduğuna göre ayrılır: kart bankada, nakit elde, Z dışı elde ama beyansız
  const KART='#4F86D6', NAKIT='#2F8F6B', ZDISI='#E08A3C', ACIK='#B3402F';

  let kilavuz='';
  [0,0.5,1].forEach(o=>{
    const val=tavan*o, y=yOf(val);
    kilavuz+=`<line x1="${sol}" y1="${y.toFixed(1)}" x2="${sol+iw}" y2="${y.toFixed(1)}"
      stroke="var(--cizgi)" stroke-width="1"${o?' stroke-dasharray="2 4"':''}/>`
      +`<text x="${sol-6}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9.5"
        font-weight="700" fill="#8189A0">${kisa(val)}</text>`;
  });

  // Sütunlar SADECE görsel. Telefonda sütun ~7px, kısa günlerde birkaç piksel;
  // parmakla basılmaz. Tıklama ve ipucu, sütunun ÜSTÜNDEKİ tam boy görünmez alanda.
  let sut='';
  seri.forEach(g=>{
    const x=sol+(g.gun-0.5)*gen-kal/2, tb=ust+ih;
    if(g.durum==='gelecek'){
      sut+=`<rect x="${x.toFixed(1)}" y="${(tb-6).toFixed(1)}" width="${kal.toFixed(1)}" height="6"
        fill="none" stroke="#C9BFA6" stroke-width="1" stroke-dasharray="2 2" opacity=".8"/>`; return;
    }
    if(g.durum==='eksik'){
      sut+=`<rect x="${x.toFixed(1)}" y="${(tb-9).toFixed(1)}" width="${kal.toFixed(1)}"
        height="9" fill="${ACIK}" opacity=".16"/>`; return;
    }
    if(g.durum==='kasa_acigi'){
      // Gerçek giren para resmîden AZ: sütun gerçeği gösterir, gün ayrı renkle işaretlenir
      const h=Math.max((g.gercek/tavan)*ih, 1.2);
      sut+=`<rect x="${x.toFixed(1)}" y="${(tb-h).toFixed(1)}" width="${kal.toFixed(1)}"
        height="${h.toFixed(1)}" fill="${ACIK}"/>`; return;
    }
    // Alttan üste: kart (bankada) → nakit (elde, beyanlı) → Z dışı (elde, beyansız)
    let y=tb;
    [[g.kart,KART],[g.nakit,NAKIT],[g.zDisi>0?g.zDisi:0,ZDISI]].forEach(([v,c])=>{
      if(!(v>0)) return;
      const h=Math.max((v/tavan)*ih, 0.8);
      y-=h;
      sut+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${kal.toFixed(1)}"
        height="${h.toFixed(1)}" fill="${c}"/>`;
    });
    if(g.bugun) sut+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${kal.toFixed(1)}"
      height="${(tb-y).toFixed(1)}" fill="none" stroke="var(--ana-koyu)" stroke-width="1"/>`;
  });

  const METIN={
    gelecek:  ()=>'gelecek gün',
    eksik:    ()=>'gün sonu GİRİLMEMİŞ — dokun ve gir',
    kasa_acigi:g=>'KASA AÇIĞI '+tl(g.zDisi)+' · Z '+tl(g.resmi)+' · gerçek '+tl(g.gercek),
    kasa_sayilmadi:g=>'Kart '+tl(g.kart)+' · kasa sayılmadı, nakit bilinmiyor',
    tam:      g=>'Kart '+tl(g.kart)+' · Nakit '+tl(g.nakitToplam)
                 +' (KDV\'ye dahil '+tl(g.nakit)+') · toplam '+tl(g.gercek)
  };
  let hedef='';
  seri.forEach(g=>{
    const hx=sol+(g.gun-1)*gen;
    const tik = g.durum!=='gelecek' ? ` class="gc-tik" data-t="${g.tarih}"` : '';
    hedef+=`<rect${tik} x="${hx.toFixed(1)}" y="${ust}" width="${gen.toFixed(1)}" height="${ih}"
      fill="transparent"><title>${g.gun} ${GUNAD[g.hafta]} — ${(METIN[g.durum]||METIN.tam)(g)}</title></rect>`;
  });

  let etiket='';
  for(let d=1; d<=gunSayisi; d+=7)
    etiket+=`<text x="${(sol+(d-0.5)*gen).toFixed(1)}" y="${Y-16}" text-anchor="middle"
      font-size="9.5" font-weight="700" fill="#8189A0">${d}</text>`;

  const oy=yOf(ortalama);
  const lej=[[KART,'Kart'],[NAKIT,"KDV'ye dahil nakit"],[ZDISI,'Nakit'],[ACIK,'açık / eksik']];
  let lejant='', lx=0;
  lej.forEach(([c,ad])=>{
    lejant+=`<rect x="${lx}" y="-7" width="7" height="7" fill="${c}"/>
      <text x="${lx+10}" y="-1" font-size="8.5" font-weight="700" fill="#8189A0">${ad}</text>`;
    lx += 15 + ad.length*4.3;
  });
  return `<div class="grafik-sar"><svg viewBox="0 0 ${G} ${Y}" role="img"
      aria-label="Günlük gerçek ciro: resmî ve Z dışı yığılmış">
    ${kilavuz}${sut}${hedef}
    <line x1="${sol}" y1="${oy.toFixed(1)}" x2="${sol+iw}" y2="${oy.toFixed(1)}"
      stroke="var(--metin)" stroke-width="1.1" stroke-dasharray="5 3" opacity=".6"/>
    <text x="${sol+iw}" y="${(oy-4).toFixed(1)}" text-anchor="end" font-size="9.5"
      font-weight="800" fill="var(--metin)" opacity=".75">kayıtlı gün ort. ${kisa(ortalama)}</text>
    ${etiket}
    <g transform="translate(${sol},${Y-1})">${lejant}</g>
  </svg></div>`;
}

  if (yeni > bugun().slice(0,7)) return;          // geleceğe gitme
  OZ_AY = yeni; vOzet();
}

/* ===== SÜRÜM KONTROLÜ — telefon eski sürümde kalmasın =====
   GitHub Pages 10 dk önbellek veriyor; ana ekrana eklenmiş uygulamada
   çok daha uzun kalabiliyor. Personel eski kurallarla çalışmasın diye
   uygulama sunucudaki sürümü sorup fark varsa uyarır. */
const SURUM = (document.querySelector('meta[name="surum"]')?.content || '?');
async function surumKontrol(){
  try{
    // Yalnız dosyanın başını çek (sürüm etiketi ilk 3000 baytta)
    const y = await fetch(location.pathname + '?s=' + Date.now(), {
      cache: 'no-store', headers: { 'Range': 'bytes=0-3000' }
    });
    if (!y.ok && y.status !== 206) return;
    const t = await y.text();
    const m = t.match(/name="surum"\s+content="([^"]+)"/);
    if (m && m[1] !== SURUM) surumUyari(m[1]);
  }catch(e){ /* ağ yoksa sessiz kal — çalışmayı engelleme */ }
}
function surumUyari(yeni){
  if (document.getElementById('surumBar')) return;
  const d = document.createElement('div');
  d.id = 'surumBar';
  d.innerHTML = `<span>Yeni sürüm var (${esc(yeni)}). Eski sürümde yanlış kayıt yapabilirsin.</span>
    <button onclick="surumYenile()">YENİLE</button>`;
  document.body.appendChild(d);
}
function surumYenile(){
  // Sorgu ekleyerek önbelleği atla — ana ekrana eklenmiş uygulamada da çalışır
  location.replace(location.pathname + '?v=' + Date.now());
}

/* ================== GÜN SONU ==================
   Bir kasa aynı gün BİRDEN FAZLA Z basabilir (cihaz arızası).
   Her Z = kendi bloğu: kendi Z No'su, tutarı, KDV'si, fotoğrafı.
   Blok anahtarı: "kasa_sıra" → 1_1, 1_2, 2_1 ...                          */
let ZLISTE = { 1:[1], 2:[1] };                     // her kasada hangi Z sıraları açık
function zAnahtarlar(){ return [1,2].flatMap(n => ZLISTE[n].map(s => ({ n, s, k:n+'_'+s }))); }

let KDV_SAYAC = 0;
function kdvSatirEkle(k, oran, satis, kdv, sabit){
  KDV_SAYAC++;
  const n = KDV_SAYAC;
  const kap = document.getElementById('kdvSatirlari_'+k);
  if(!kap) return;
  const div = document.createElement('div');
  div.className='kdv-satir'; div.id='kdvS_'+n;
  const oranKutu = sabit
    ? `<span style="width:82px;flex:none;text-align:center;font-weight:800;color:var(--ana);padding:11px 0">%${oran||10}</span><input type="hidden" id="kdvO_${n}" value="${oran||10}">`
    : `<select id="kdvO_${n}"><option value="1"${oran==1?' selected':''}>%1</option><option value="10"${(oran==10||!oran)?' selected':''}>%10</option><option value="20"${oran==20?' selected':''}>%20</option></select>`;
  div.innerHTML = `
    ${oranKutu}
    <input type="text" inputmode="decimal" autocomplete="off" id="kdvT_${n}" placeholder="Z'deki %${oran||10} TOPLAM" value="${satis||''}">
    <input type="text" inputmode="decimal" autocomplete="off" id="kdvV_${n}" placeholder="KDV (sistem hesaplar)" value="${kdv||''}">
    ${sabit?'':`<button class="sil" onclick="document.getElementById('kdvS_${n}').remove(); kasaHesapla();">✕</button>`}`;
  kap.appendChild(div);
  // Oran toplam satış yazılınca KDV'yi sistem hesaplar (Z'deki TOPKDV farklıysa üzerine yazılabilir)
  // KDV kutusu bir kez ELLE düzeltildiyse sistem bir daha üzerine YAZMAZ.
  // (Z'deki TOPKDV birkaç kuruş farklı olabilir — beyana giden Z'dekidir.)
  const hesapla = () => {
    const vEl = document.getElementById('kdvV_'+n);
    if (vEl.dataset.elle === '1') return;              // kullanıcı yazdıysa dokunma
    const t = paraOku(document.getElementById('kdvT_'+n)).deger;
    const o = +document.getElementById('kdvO_'+n).value || 0;
    vEl.value = t > 0 ? (t - t/(1+o/100)).toFixed(2) : '';
  };
  const vEl0 = document.getElementById('kdvV_'+n);
  vEl0.addEventListener('input', ()=>{ vEl0.dataset.elle = vEl0.value.trim()==='' ? '' : '1'; });
  if (kdv) vEl0.dataset.elle = '1';                    // hazır değerle geldiyse elle sayılır
  paraBagla(document.getElementById('kdvT_'+n), ()=>{ hesapla(); kasaHesapla(); });
  paraBagla(vEl0, kasaHesapla);
  const oranEl = document.getElementById('kdvO_'+n);
  if (oranEl.tagName === 'SELECT') oranEl.addEventListener('change', hesapla);
}
function kdvOku(k){
  const sonuc = [];
  document.querySelectorAll('#kdvSatirlari_'+k+' .kdv-satir').forEach(d=>{
    const n = d.id.split('_')[1];
    const o = document.getElementById('kdvO_'+n).value;
    const tEl = document.getElementById('kdvT_'+n), vEl = document.getElementById('kdvV_'+n);
    const pt = paraOku(tEl), pv = paraOku(vEl);
    if (!pt.ok || !pv.ok) throw new Error('KDV satırında geçersiz tutar var — örnek: 15710 veya 15710,50');
    if (tEl.value.trim()!=='' || vEl.value.trim()!=='')
      sonuc.push({ oran:+o, satis_toplam:pt.deger, kdv_tutar:pv.deger });
  });
  return sonuc;
}
/* ===== BELGE GÖRÜNTÜLEYİCİ — yüklenen fotoğrafı tek tıkla aç ===== */
function belgeKapat(){
  const ov=document.getElementById('belgeOverlay');
  if(ov){ ov.style.display='none'; const r=document.getElementById('boResim'); if(r) r.src=''; }
}
function belgeKutusu(){
  let ov=document.getElementById('belgeOverlay');
  if(!ov){
    ov=document.createElement('div'); ov.id='belgeOverlay';
    ov.innerHTML=`<div class="bo-ust"><span id="boBaslik"></span><button class="bo-kapat" onclick="belgeKapat()">✕</button></div>
                  <div class="bo-govde"><div class="bo-yukleniyor" id="boDurum">Belge açılıyor...</div><img id="boResim" alt="" style="display:none"></div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click', e=>{ if(e.target===ov || e.target.classList.contains('bo-govde')) belgeKapat(); });
    document.addEventListener('keydown', e=>{ if(e.key==='Escape') belgeKapat(); });
  }
  return ov;

async function belgeAc(yol, baslik){
  if(!yol){ bildir('Bu belge yüklenmemiş.', 'hata'); return; }
  // PDF resim olarak açılmaz — imzalı bağlantıyı yeni sekmede aç
  if (/\.pdf$/i.test(yol)){
    try{
      const { data, error } = await sb.storage.from('belgeler').createSignedUrl(yol, 300);
      if (error || !data?.signedUrl) throw new Error(error?.message || 'bağlantı alınamadı');
      window.open(data.signedUrl, '_blank', 'noopener');
    }catch(e){ bildir('Belge açılamadı: ' + hataTr(e.message), 'hata'); }
    return;
  }
  const ov=belgeKutusu();
  document.getElementById('boBaslik').textContent = baslik||'Belge';
  const img=document.getElementById('boResim'), durum=document.getElementById('boDurum');
  img.style.display='none'; img.src=''; durum.style.display='block'; durum.textContent='Belge açılıyor...';
  ov.style.display='flex';
  try{
    const { data, error } = await sb.storage.from('belgeler').createSignedUrl(yol, 300);
    if (error || !data || !data.signedUrl) throw new Error(error?.message || 'imzalı bağlantı alınamadı');
    img.onload = ()=>{ durum.style.display='none'; img.style.display='block'; };
    img.onerror = ()=>{ durum.textContent='Görsel açılamadı.'; };
    img.src = data.signedUrl;
  }catch(e){
    durum.textContent = 'Belge açılamadı: ' + hataTr(e.message);
  }
}

function slipBtn(yol, etiket, baslik){ return yol ? belgeBtn(yol, etiket, baslik) : ''; }
// Bir kasadan o gün birden fazla Z var mı (etikette sıra gösterilsin mi)
function zCok(satirlar, kasaNo){ return satirlar.filter(x=>x.kasa_no===kasaNo).length > 1; }
/* ===== PARA GİRİŞ KATMANI — virgül/nokta güvenli, sessiz sıfır YOK ===== */
/* SON AYRAÇ ONDALIK AYRACIDIR — faturayı okurken uyguladığımız kuralın aynısı;
   iki yerde farklı davranırsa mutabakat tutmaz.
     "1.250,50" → 1250.50   (nokta binlik)      "1250,50" → 1250.50
     "1250.50"  → 1250.50   (İngilizce yazım)   "1.250"   → 1250   (nokta + 3 hane = binlik)
     "3,456"    → 3.45      (virgül hep ondalık; fazla hane kırpılır)
   Eskiden bu alanlar type="number" idi: virgül yazılınca tarayıcı value'yu BOŞ
   döndürüyor, "+value||0" sessizce 0 yazıyordu. Fatura kaleminde miktar 0 olunca
   satır büsbütün düşüyordu — kimse fark etmiyordu.
   Tutar alanlarında eksi yoktur; sayım düzeltmesi gibi işaretli alanlar eksiVar=true geçer. */
function paraCoz(ham, bas, eksiVar){
  const n = bas || 2;
  const t = String(ham == null ? '' : ham);
  const eksi = !!eksiVar && /^\s*-/.test(t);
  const s = t.replace(/[^\d.,]/g,'');
  // Boş = 0 (kural bu). Ama içi dolu olup tek rakam yoksa bu hatadır, sessizce 0 olmamalı.
  if (!/\d/.test(s)) return t.trim() === ''
    ? { ok:true, deger:0, metin:'' }
    : { ok:false, deger:0, metin:'', hata:'geçersiz tutar' };
  const son = Math.max(s.lastIndexOf(','), s.lastIndexOf('.'));
  let tam, ond;
  if (son < 0){ tam = s; ond = ''; }
  else {
    const kuyruk = s.slice(son+1).replace(/[.,]/g,'');
    if (s[son] === '.' && kuyruk.length > n){ tam = s.replace(/[.,]/g,''); ond = ''; }  // nokta = binlik
    else { tam = s.slice(0, son).replace(/[.,]/g,''); ond = kuyruk.slice(0, n); }
  }
  tam = tam.replace(/^0+(?=\d)/,'') || '0';
  const d = parseFloat(tam + (ond ? '.' + ond : ''));
  if (!isFinite(d)) return { ok:false, deger:0, metin:'', hata:'geçersiz tutar' };
  return { ok:true, deger:+((eksi ? -d : d).toFixed(n)),
           metin: (eksi ? '-' : '') + tam + (ond ? ',' + ond : '') };
}
function paraTemizle(el, eksiVar){
  // Yazarken sadece geçersiz karakteri at — ayraçlara dokunma, yoksa alan zıplar
  if(!el) return;
  const t = el.value;
  const eksi = !!eksiVar && /^-/.test(t);
  const s = (eksi ? '-' : '') + t.replace(/[^\d.,]/g,'');
  if (s !== t) el.value = s;
}
/* ==================================================================
   ⚠ CP · YAZARKEN BİNLİK AYIRAÇ (iki dosyada AYNI kod: borc.html'de de var)
   Sahip "sıfırları adam gibi saymıyor, içimden sayarak giriyorum" dedi.
   Ölçüldü: paraBicimle ayıraç KOYMUYORDU (paraCoz'un ürettiği 'metin'
   gruplamasız) — yani hiçbir alanda ne yazarken ne çıkarken gruplama vardı.

   KURALLAR (hepsi ölçüldü):
   · ONDALIK KISIM GRUPLANMAZ — 1234,5678 -> 1.234,5678
   · YARIM GİRİŞ BOZULMAZ — "36569," virgülü kalır, "0," sıfırı kalır,
     eksi alanlarda tek başına "-" yazılabilir
   · NOKTA = ONDALIK. Gruplama ayıracını uygulama koyar, kullanıcı yazmaz;
     bu yüzden kullanıcının yazdığı '.' ondalık ayracı sayılır ve ','a
     çevrilir ("36569.93" -> "36.569,93"). Virgül varsa noktalar bizim
     ayracımızdır, atılır.
   · MİKTAR/GRAM (bas === 3) GRUPLANMAZ — 412,950 üç ondalıkla kalır.
   ⚠ İMLEÇ: değeri her tuşta yeniden yazmak imleci sona atar ve ortadan
     düzeltmeyi imkânsız kılar — bu, gruplamamaktan kötüdür. İmleç,
     ÖNÜNDEKİ ayıraç-dışı karakter sayısı korunarak yeniden konur. */
function paraCanli(ham, eksiVar){
  const eksi = !!eksiVar && /^[-−]/.test(String(ham));
  /* ⚠ NOKTA HER ZAMAN GRUPLAMADIR — bizim koyduğumuz ayıraç. Kullanıcının
     ondalık olarak yazdığı nokta, YAZILDIĞI ANDA (paraCanliUygula) virgüle
     çevrilir; buraya gelen nokta artık yalnız ayıraçtır.
     ⚠ ÖLÇÜLDÜ: burada "virgül yoksa ilk nokta ondalıktır" denenmişti —
     "3.656" yazılınca sonraki tuşta kendi ayıracımızı ondalık sanıp
     "3,6569" üretiyordu. */
  let s = String(ham).replace(/[^\d.,]/g, '').replace(/\./g, '');
  const iv = s.indexOf(',');
  if (iv >= 0) s = s.slice(0, iv + 1) + s.slice(iv + 1).replace(/,/g, '');   // tek virgül
  const v = s.indexOf(',');
  let tam = v < 0 ? s : s.slice(0, v);
  const ond = v < 0 ? '' : s.slice(v);              // ',' DAHİL — hiç gruplanmaz
  tam = tam.replace(/^0+(?=\d)/, '');
  return (eksi ? '-' : '') + tam.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ond;
}
function paraCanliUygula(el, e, eksiVar){
  const geri = !!(e && /^delete/i.test(e.inputType || ''));
  let t = el.value;
  let p = el.selectionStart == null ? t.length : el.selectionStart;
  /* ⚠ Kullanıcı ondalık ayracı olarak NOKTA yazdıysa (masaüstü klavyesi)
     o noktayı ANINDA virgüle çevir — gruplama noktalarıyla karışmasın.
     Yalnız BU tuşta yazılan noktaya bakılır (e.data), alandaki ötekilere değil. */
  if (e && e.data === '.' && p > 0 && t[p-1] === '.') t = t.slice(0, p-1) + ',' + t.slice(p);
  /* ⚠ Backspace AYIRACIN üstündeyse: ayıraç geri gelir ve hiçbir şey
     silinmiş olmaz — kullanıcı tuşa basar, ekran değişmez. O durumda
     ayıracın önündeki RAKAM silinir; silme tuşu iş görür. */
  if (geri && p > 0 && paraCanli(t, eksiVar) === (el.__paraEski || '')){
    t = t.slice(0, p - 1) + t.slice(p); p -= 1;
  }
  const yeni = paraCanli(t, eksiVar);
  const n = t.slice(0, p).replace(/\./g, '').length;   // imleç önündeki gerçek karakter
  el.value = yeni; el.__paraEski = yeni;
  let k = 0, i = 0;
  for (; i < yeni.length && k < n; i++) if (yeni[i] !== '.') k++;
  while (i < yeni.length && yeni[i] === '.') i++;      // ayıracın sağına geç
  try { el.setSelectionRange(i, i); } catch(err){}
}
function paraBicimle(el, bas, eksiVar){
  // Alandan çıkınca tek biçime getir: kullanıcı ne kaydettiğini görsün
  if(!el || !el.value.trim()) return;
  const r = paraCoz(el.value, bas, eksiVar);
  if (!r.ok) return;
  /* ⚠ CP · bas===3 (gram/miktar) GRUPLANMAZ; para alanı yazarkenki
     biçimin AYNISINA oturur, blur gruplamayı geri almaz. */
  const m = bas === 3 ? r.metin : paraCanli(r.metin, eksiVar);
  if (el.value !== m){ el.value = m; el.__paraEski = m; }
}
function paraOku(el, bas, eksiVar){
  if(!el) return { ok:true, deger:0 };
  return paraCoz(el.value, bas, eksiVar);
}
function paraBagla(el, sonra, bas, eksiVar){
  if(!el) return;
  el.__paraEski = el.value;
  /* ⚠ CP · bas===3 MİKTAR/GRAM: eski davranış (yalnız temizle, gruplama yok).
     Para alanında paraCanliUygula paraTemizle'nin işini de yapıyor
     (geçersiz karakteri o da atıyor), üstüne imleci koruyor. */
  el.addEventListener('input', (e) => {
    if (bas === 3) paraTemizle(el, eksiVar); else paraCanliUygula(el, e, eksiVar);
    if(sonra) sonra();

/* ===== Z RAPORU OKUMA — sistem doldurur, PERSONEL DOĞRULAR ===== */
async function zRaporuOku(k){
  const inp = document.getElementById('gsZFoto_'+k);
  const drm = document.getElementById('gsOkuDurum_'+k);
  const btn = document.getElementById('gsOku_'+k);
  const yaz = (t, sinif) => { if(drm){ drm.className = 'oku-durum '+(sinif||''); drm.textContent = t; } };

  const dosyaVar = !!(inp && inp.files && inp.files[0]);
  const mevcutYol = (DUZENLE && DUZENLE.foto[k] && DUZENLE.foto[k].z) || null;
  if (!dosyaVar && !mevcutYol){ yaz('Önce Z raporu fotoğrafını seç.', 'uyari'); return; }

  btn.disabled = true; const eski = btn.textContent; btn.textContent = 'Okunuyor...';
  yaz('Fotoğraf okunuyor, birkaç saniye sürebilir...', '');
  try{
    const { data:{ session } } = await sb.auth.getSession();
    if (!session) throw new Error('Oturum bulunamadı, tekrar giriş yapın.');

    let govde;
    if (dosyaVar){
      const k = await fotoKucult(inp.files[0], 2000, 0.92);   // okuma için net kopya
      const b64 = await new Promise((coz, red)=>{
        const fr = new FileReader();
        fr.onload = ()=>coz(fr.result); fr.onerror = ()=>red(new Error('Fotoğraf okunamadı'));
        fr.readAsDataURL(k.veri);
      });
      govde = { gorsel: b64 };
    } else {
      govde = { yol: mevcutYol };
    }

    const y = await fetch(SB_URL + '/functions/v1/z-raporu-oku', {
      method:'POST',
      headers:{ 'Authorization':'Bearer '+session.access_token, 'Content-Type':'application/json' },
      body: JSON.stringify(govde)
    });
    const s = await y.json();
    if (!y.ok || !s.ok) throw new Error(s?.hata || ('Okuma başarısız ('+y.status+')'));

    const v = s.veri || {};
    const dolduruldu = [];
    const koy = (id, deger, etiket) => {
      if (deger === null || deger === undefined || deger === '') return;
      const e = document.getElementById(id); if(!e) return;
      e.value = String(deger).replace('.', ',');
      e.dispatchEvent(new Event('input', { bubbles:true }));
      e.classList.add('oku-dolu'); dolduruldu.push(etiket);
    };
    koy('gsZNo_'+k,   v.z_no,          'Z No');
    koy('gsKart_'+k,  v.kart_toplam,   'Kart');
    koy('gsNakit_'+k, v.nakit_toplam,  'Nakit');

    // KDV satırları: fişteki TOPKDV esas (sistem hesabı ezilmez)
    const kap = document.getElementById('kdvSatirlari_'+k);
    if (kap && Array.isArray(v.kdv) && v.kdv.length){
      kap.innerHTML = '';
      v.kdv.forEach(x => kdvSatirEkle(k, x.oran, x.satis_toplam, x.kdv_tutar, false));
      dolduruldu.push('KDV');
    }
    kasaHesapla();

    const eksik = Array.isArray(v.okunamayan) ? v.okunamayan.filter(Boolean) : [];
    let msj = 'Okundu → ' + (dolduruldu.join(' · ') || 'alan doldurulamadı') + '. ⚠️ Rakamları fişle KARŞILAŞTIR.';
    if (eksik.length) msj += ' Okunamayan: ' + eksik.join(', ');
    if (v.uyari) msj += ' (' + v.uyari + ')';
    yaz(msj, dolduruldu.length ? 'ok' : 'uyari');
  }catch(e){
    yaz('Okunamadı: ' + hataTr(e.message) + ' — alanları elle yaz.', 'uyari');
  }finally{
    btn.disabled = false; btn.textContent = eski;
  }
}

    <div class="kbaslik" style="color:var(--uyari)">DÜZENLEME MODU — ${new Date(data.tarih+'T00:00').toLocaleDateString('tr-TR')}</div>
    <div class="bilgi-not" style="margin:0 0 8px">Kayıt <b>silinmiyor</b>, üzerine yazılıyor. Fotoğrafları değiştirmek istemiyorsan
      dokunma — mevcutlar korunur. Tarih değiştirilemez.</div>
    <button class="btn2" style="width:100%" onclick="duzenlemeIptal()">Vazgeç</button></div>`;
  const btn = document.getElementById('gsKaydet');
  if (btn) btn.textContent = 'Değişiklikleri Kaydet';

/* Aynı kasaya ikinci/üçüncü Z — cihaz arızasında gün kaydedilebilsin diye */
function zBlokEkle(n){
  if (ZLISTE[n].length >= 9){ bildir('Bir kasaya en fazla 9 Z raporu girilebilir.', 'hata'); return; }
  const s = Math.max(...ZLISTE[n]) + 1;
  const eski = {};
  ZLISTE[n].forEach(x=>{ eski[x] = zBlokTopla(n, x); });   // yeniden çizmeden ÖNCE yedekle
  const secilenFoto = {};
  ZLISTE[n].forEach(x=>{ const f=document.getElementById('gsZFoto_'+n+'_'+x); secilenFoto[x] = !!(f&&f.files&&f.files[0]); });
  ZLISTE[n].push(s);
  const kap = document.getElementById('gsZBloklar'+n);
  // ilk blok tek başınayken başlıksız duruyordu; artık çoklu → başlıklarla yeniden kur
  kap.innerHTML = ZLISTE[n].map(x=>zBlokHtml(n,x)).join('');
  ZLISTE[n].forEach(x=>{ zBlokKur(n, x); if (x !== s) zBlokDoldur(n, x, eski[x]); });
  // Dosya seçimi HTML yeniden çizilince kaybolur — kullanıcıya açıkça söyle
  const kaybolan = ZLISTE[n].filter(x=>x!==s && secilenFoto[x]);
  if (kaybolan.length) alert(`Kasa ${n}: Z fotoğrafı seçimi sıfırlandı (${kaybolan.map(x=>x+'. Z').join(', ')}).\nTutarlar korundu; fotoğrafı yeniden seç.`);
  kasaHesapla();
  document.getElementById('zBlok_'+n+'_'+s).scrollIntoView({behavior:'smooth', block:'center'});
}
async function zBlokSil(n, s){
  if (s === 1) return;
  if (!await onaySor(`Kasa ${n} — ${s}. Z raporu kaldırılacak.`, 'Girdiğin bilgiler silinir. Devam?', 'Kaldır')) return;
  const kalan = {};
  ZLISTE[n].filter(x=>x!==s).forEach(x=>{ kalan[x] = zBlokTopla(n, x); });  // silmeden ÖNCE yedekle
  ZLISTE[n] = ZLISTE[n].filter(x=>x!==s);
  const kap = document.getElementById('gsZBloklar'+n);
  kap.innerHTML = ZLISTE[n].map(x=>zBlokHtml(n,x)).join('');
  ZLISTE[n].forEach(x=>{ zBlokKur(n, x); zBlokDoldur(n, x, kalan[x]); });
  kasaHesapla();
}

function zBlokDoldur(n, s, v){

function zDurum(n, s){
  const k = n+'_'+s;
  const zno=(document.getElementById('gsZNo_'+k)?.value||'').trim();
  const pk=paraOku(document.getElementById('gsKart_'+k));
  const pn=paraOku(document.getElementById('gsNakit_'+k));
  const kart=pk.deger, nakit=pn.deger;
  // Kart işlem adedi ve fiş iptali — hepsi isteğe bağlı, boşsa null gider.
  // Adet alanları tam sayı: "105 adet" gibi yazılsa bile rakamları alıyoruz.
  const tamSayi = id => {
    const t = (document.getElementById(id)?.value || '').replace(/\D/g,'');
    return t === '' ? null : parseInt(t, 10);
  };
  const kadet = tamSayi('gsKAdet_'+k);
  const iadet = tamSayi('gsIAdet_'+k);
  const itEl  = document.getElementById('gsITutar_'+k);
  const pit   = itEl ? paraOku(itEl) : { ok:true, deger:0 };
  const itutar = (pit.ok && pit.deger > 0) ? pit.deger : null;
  const zf=document.getElementById('gsZFoto_'+k);
  // Düzenleme modunda mevcut fotoğraf zorunluluğu karşılar (yenisi seçilmezse korunur)
  const mev = (DUZENLE && DUZENLE.foto && DUZENLE.foto[k]) || {};
  const zfVar=!!(zf&&zf.files&&zf.files[0]) || !!mev.z;
  const on = ZLISTE[n].length>1 ? s+'. Z — ' : '';
  const eksik=[];
  if(!zno) eksik.push(on+'Z No');
  if(!pk.ok) eksik.push(on+'Kart tutarı geçersiz');
  if(!pn.ok) eksik.push(on+'Nakit tutarı geçersiz');
  if(!pit.ok) eksik.push(on+'Fiş iptal tutarı geçersiz');
  if(!zfVar) eksik.push(on+'Z fotoğrafı');
  const bos=!zno && !kart && !nakit && !zfVar && pk.ok && pn.ok;
  return { k, n, s, zno, kart, nakit, kadet, iadet, itutar,
           ara:+(kart+nakit).toFixed(2), kdv:kdvToplam(k),
           eksik, bos, gecerli: pk.ok && pn.ok && pit.ok };
}
function kasaDurum(n){
  const bloklar = ZLISTE[n].map(s=>zDurum(n,s));
  return {
    bloklar,
    kart : +bloklar.reduce((a,b)=>a+b.kart ,0).toFixed(2),
    nakit: +bloklar.reduce((a,b)=>a+b.nakit,0).toFixed(2),
    ara  : +bloklar.reduce((a,b)=>a+b.ara  ,0).toFixed(2),
    kdv  : +bloklar.reduce((a,b)=>a+b.kdv  ,0).toFixed(2),
    eksik: bloklar.flatMap(b=>b.eksik),
    bos  : bloklar.every(b=>b.bos)

}
function kdvToplam(k){
  let t=0;
  document.querySelectorAll('#kdvSatirlari_'+k+' .kdv-satir').forEach(d=>{
    const n=d.id.split('_')[1];
    t += paraOku(document.getElementById('kdvV_'+n)).deger;

}
function kasaHesapla(){
  let tk=0, tn=0, tkdv=0; const eksikler=[];
  [1,2].forEach(n=>{
    const d=kasaDurum(n); tk+=d.kart; tn+=d.nakit; tkdv+=d.kdv;
    d.bloklar.forEach(b=>{
      const za=document.getElementById('gsZAra_'+b.k); if(za) za.textContent=tl(b.ara);
    });
    const kdvEl=document.getElementById('gsKdv'+n); if(kdvEl) kdvEl.textContent=tl(d.kdv);
    const ara=document.getElementById('gsAra'+n); if(ara) ara.textContent=tl(d.ara);
    const kt=document.getElementById('ksTut'+n); if(kt) kt.textContent=tl(d.ara);
    const drm=document.getElementById('kpDrm'+n), ks=document.getElementById('ksDrm'+n);
    const zEk = ZLISTE[n].length>1 ? ` · ${ZLISTE[n].length} Z` : '';
    let sinif, metin, sembol;
    if(d.bos){ sinif='bos'; metin='○ Başlanmadı'; sembol='○'; }
    else if(d.eksik.length===0){ sinif='tam'; metin='✓ Tamamlandı'+zEk; sembol='✓'; }
    else { sinif='eksik'; metin='● '+d.eksik.length+' eksik: '+d.eksik.join(', '); sembol='●'; }
    if(drm){ drm.className='kp-drm '+sinif; drm.textContent=metin; }
    if(ks) ks.textContent=sembol;
    d.eksik.forEach(e=>eksikler.push('KASA '+n+' — '+e));
  });
  // Aynı kasada aynı Z No iki kez girilmiş mi (arıza gününde kopyala-yapıştır hatası)
  [1,2].forEach(n=>{
    const nolar = ZLISTE[n].map(s=>(document.getElementById('gsZNo_'+n+'_'+s)?.value||'').trim()).filter(Boolean);
    if (new Set(nolar).size !== nolar.length) eksikler.push('KASA '+n+' — aynı Z No iki kez girilmiş');
  });
  const pz=paraOku(document.getElementById('gsKasa'));
  const zDisi=pz.deger;
  if(!pz.ok) eksikler.push('Z DIŞI KASA — tutar geçersiz');
  const set=(id,v)=>{ const e=document.getElementById(id); if(e) e.textContent=v; };
  set('gsTKart', tl(tk)); set('gsTNakit', tl(tn)); set('gsTGenel', tl(+(tk+tn).toFixed(2)));
  set('gsZDisi', tl(zDisi)); set('gsTKdv', tl(tkdv));
  const btn=document.getElementById('gsKaydet'), ek=document.getElementById('gsEksik');

}
/* ===== T · GUN SONU TASLAK KORUMA =====
   Olculdu (FAZ 4a): ekran 4.532px, ayni anda 24 alan, Kaydet 1.702px
   asagida. Mevcut koruma yalniz UYARIYORDU (formKirliMi + beforeunload);
   sekme kapanirsa 24 alan gidiyordu. Bu katman SAKLIYOR — uyarinin YERINE
   degil YANINA geliyor, ikisi de duruyor.
   ⚠ Taslak KULLANICININ TARAYICISINDA kalir, sunucuya gitmez. Bu yuzden
     basarili kayitta MUTLAKA silinir: ekranda olmayan finansal veri
     tarayicida birikmemeli.
   ⚠ SESSIZ DOLDURMA YOK. Kullanici "Geri yukle" demeden hicbir alan
     dolmaz. Sessiz doldurma en tehlikelisidir: insan kendi girdigini
     sanip uc gun onceki rakami kaydeder.
   ⚠ FOTOGRAF YAZILMAZ — dosya girdisi saklanamaz; yalniz KAC TANE
     secilmis oldugu not dusulur. */
const TASLAK_ONEK = 'gunSonuTaslak:', TASLAK_OMUR = 7*24*60*60*1000;
let TASLAK_SAYAC = null;
const taslakAnahtar = () =>
  TASLAK_ONEK + AKTIF_SUBE + ':' + (document.getElementById('gsTarih')?.value || '');
const taslakOku = () => { try{ return JSON.parse(localStorage.getItem(taslakAnahtar()) || 'null'); }
                          catch(e){ return null; } };
function taslakSil(){ try{ localStorage.removeItem(taslakAnahtar()); }catch(e){} }
function taslakYaz(){
  /* DUZENLE modunda yazilmaz: orada zaten KAYITLI bir gun aciktir,
     taslak onun uzerine binerdi. */
  if (DUZENLE || !AKTIF_SUBE || !document.getElementById('gsKaydet')) return;
  const b = {}; let foto = 0;
  [1,2].forEach(n => ZLISTE[n].forEach(s => {
    b[n+'_'+s] = zBlokTopla(n, s);                     // mevcut yardimci, aynen
    const f = document.getElementById('gsZFoto_'+n+'_'+s);
    if (f && f.files && f.files[0]) foto++;            // ⚠ DOSYA DEGIL, yalniz SAYI
  }));
  try{ localStorage.setItem(taslakAnahtar(), JSON.stringify({
    zaman: Date.now(), zliste: { 1:ZLISTE[1].slice(), 2:ZLISTE[2].slice() },
    kasa: document.getElementById('gsKasa').value, not: document.getElementById('gsNot').value,
    bloklar: b, foto })); }catch(e){}
}
function taslakEskileriAt(){
  try{ Object.keys(localStorage).filter(k => k.indexOf(TASLAK_ONEK) === 0).forEach(k => {
    let t; try{ t = JSON.parse(localStorage.getItem(k)); }catch(e){ t = null; }
    if (!t || !t.zaman || Date.now() - t.zaman > TASLAK_OMUR) localStorage.removeItem(k);
  }); }catch(e){}
}
function taslakSeridi(){
  const yer = document.getElementById('gsTaslakBar'); if (!yer) return;
  yer.innerHTML = '';
  const t = DUZENLE ? null : taslakOku();
  if (!t || !kasaDurum(1).bos || !kasaDurum(2).bos) return;   // yalniz form BOSSA sorulur
  const z = new Date(t.zaman);
  const g = new Date(document.getElementById('gsTarih').value + 'T00:00').toLocaleDateString('tr-TR');
  yer.innerHTML = `<div class="kart" style="border-color:var(--uyari)">

      ${t.foto ? `<br>${t.foto} fotoğraf seçilmişti, yeniden seçmelisin.` : ''}</div>

function taslakGeriYukle(){
  const t = taslakOku(); if (!t) return;
  [1,2].forEach(n => { while (ZLISTE[n].length < ((t.zliste && t.zliste[n]) || [1]).length) zBlokEkle(n); });
  document.getElementById('gsKasa').value = t.kasa || '';

  [1,2].forEach(n => ZLISTE[n].forEach(s => {
    const v = t.bloklar && t.bloklar[n+'_'+s]; if (!v) return;
    zBlokDoldur(n, s, v);
    /* ⚠ zBlokDoldur bu ucunu YAZMIYOR (mevcut davranis — degistirmedim,
       ama taslakta kaybolmasinlar diye burada yaziliyor). */
    [['gsKAdet_','kadet'],['gsIAdet_','iadet'],['gsITutar_','itutar']].forEach(([p,a]) => {
      const e = document.getElementById(p+n+'_'+s); if (e) e.value = v[a] || ''; });
  }));
  kasaHesapla(); formKirlendi();
  document.getElementById('gsTaslakBar').innerHTML = '';
  mesaj('gsMsg','ok','Taslak geri yüklendi. Kontrol edip kaydet.');
}
function taslakTetik(e){
  if (!document.getElementById('gsKaydet')) return;            // yalniz gun sonu ekraninda
  if (!e.target || !e.target.closest || !e.target.closest('#icerik')) return;
  if (e.target.id === 'gsTarih'){ taslakSeridi(); return; }    // tarih degisti -> o gunun taslagi
  clearTimeout(TASLAK_SAYAC); TASLAK_SAYAC = setTimeout(taslakYaz, 800);
}

async function fotoTemizle(yollar){
  const kalan = [];
  for (const y of yollar){
    if (!y) continue;
    try{ const { error } = await sb.storage.from('belgeler').remove([y]); if (error) kalan.push(y); }
    catch(e){ kalan.push(y); }
  }
  return kalan;
}
async function gunSonuKaydet(){
  const kasalar = [];
  for (const n of [1,2]){
    const d = kasaDurum(n);
    if (d.eksik.length){ kasaSec(n); mesaj('gsMsg','hata',`KASA ${n} eksik: ${d.eksik.join(', ')}`); return; }
    for (const b of d.bloklar){
      let kdvSatir;
      try { kdvSatir = kdvOku(b.k); }
      catch(e){ kasaSec(n); mesaj('gsMsg','hata',`KASA ${n} / ${b.s}. Z: `+hataTr(e.message)); return; }
      kasalar.push({ n, s:b.s, k:b.k, zno:b.zno, kart:b.kart, nakit:b.nakit, kdv:kdvSatir,
        kadet:b.kadet, iadet:b.iadet, itutar:b.itutar,
        knot:(document.getElementById('gsKNot_'+b.k)?.value||'').trim()||null });
    }
  }
  const kart = +(kasalar.reduce((a,k)=>a+k.kart,0)).toFixed(2);
  const nakit = +(kasalar.reduce((a,k)=>a+k.nakit,0)).toFixed(2);
  const toplam = +(kart + nakit).toFixed(2);
  // KDV artık KASA BAZLI: her kasanın kendi Z vergi dökümü
  const kdv = kasalar.flatMap(k=>k.kdv);
  const kdvToplamTutar = +(kdv.reduce((a,x)=>a+x.kdv_tutar,0)).toFixed(2);
  if (toplam === 0){ mesaj('gsMsg','hata','İki kasanın toplamı 0 — kayıt yapılamaz.'); return; }
  for (const k of kasalar){
    const et = `KASA ${k.n}${ZLISTE[k.n].length>1?' / '+k.s+'. Z':''}`;
    if (k.kdv.length === 0 && (k.kart + k.nakit) > 0 &&
        !confirm(`${et} için KDV dökümü BOŞ. O Z raporundaki VERGİ DÖKÜMÜ girilmedi — beyana giden KDV eksik kalır. Yine de kaydedilsin mi?`)) return;
  }
  // AKIL KONTROLLERİ (KÜM. TOPLAM tuzağı + KDV tutarlılığı)
  const kdvSatisToplami = kdv.reduce((a,x)=>a+x.satis_toplam,0);
  if (kdvSatisToplami > toplam*1.5 + 100){
    bildir(`HATALI GİRİŞ OLABİLİR: KDV dökümündeki satış toplamı (${tl(kdvSatisToplami)}) günün cirosundan (${tl(toplam)}) çok büyük.\n\nZ kağıdındaki "KÜM. TOPLAM" satırını yazmış olabilirsiniz — o satır kasanın TÜM GEÇMİŞ toplamıdır, kullanılmaz.\n\n"%10 TOPLAM" gibi GÜNLÜK satırı girin.`, 'hata');
    return;
  }
  for (const x of kdv){
    const beklenen = x.satis_toplam - x.satis_toplam/(1 + x.oran/100);
    if (x.satis_toplam > 0 && Math.abs(x.kdv_tutar - beklenen) > Math.max(5, beklenen*0.15) &&
        !confirm(`KDV kontrolü: %${x.oran} için ${tl(x.satis_toplam)} satışın KDV'si yaklaşık ${tl(beklenen)} olmalı, siz ${tl(x.kdv_tutar)} girdiniz.\nZ kağıdındaki TOPKDV satırıyla karşılaştırın. Yine de kaydedilsin mi?`)) return;
  }
  const pKasa = paraOku(document.getElementById('gsKasa'));
  if (!pKasa.ok){ mesaj('gsMsg','hata','Kasadaki Para alanı geçersiz — örnek: 4400 veya 4400,50'); return; }
  const kasa = pKasa.deger;
  if (kasa === 0 &&
      !confirm('Kasadaki Para girilmedi (kasa sayımı yapılmadı mı?). Boş kaydedilirse o günün gerçek nakit takibi eksik kalır. Yine de kaydedilsin mi?')) return;
  const ozet = kasalar.map(k=>{
    const kv = k.kdv.reduce((a,x)=>a+x.kdv_tutar,0);
    const et = `Kasa ${k.n}${ZLISTE[k.n].length>1?' ('+k.s+'. Z)':''}`;
    return `${et} — Z ${k.zno}: ${tl(k.kart+k.nakit)}   KDV ${tl(kv)}`;
  }).join('\n');
  if (!confirm(`GÜN SONU KAYDEDİLECEK\n\n${ozet}\n──────────────\nGenel Toplam: ${tl(toplam)}\nTOPLAM KDV (beyana giden): ${tl(kdvToplamTutar)}\n\nZ dışı kasa nakdi: ${tl(kasa)}\n(vergiye DAHİL DEĞİL — gerçek nakit takibi için)\n\nKayıttan sonra gün kilitlenir. Onaylıyor musun?`)) return;

  const btn = document.getElementById('gsKaydet');
  const eskiBtnMetin = DUZENLE ? 'Değişiklikleri Kaydet' : 'Gün Sonunu Kaydet';
  btn.disabled = true;
  const yuklenen = [];
  try{
    for (const k of kasalar){
      const mev = (DUZENLE && DUZENLE.foto[k.k]) || {};
      const yeniZ = document.getElementById('gsZFoto_'+k.k);
      const zSecili = !!(yeniZ && yeniZ.files && yeniZ.files[0]);
      if (zSecili) btn.textContent = `Kasa ${k.n} Z fotoğrafı yükleniyor...`;
      // Yeni seçildiyse yükle, seçilmediyse MEVCUDU koru
      k.zf = zSecili ? await fotoYukle('gsZFoto_'+k.k, 'z') : mev.z;
      if (zSecili) yuklenen.push(k.zf);
      k.sf = mev.s || null;             // POS slip artık toplanmıyor; eski kayıtta varsa korunur
    }
  }catch(e){
    const kalan = await fotoTemizle(yuklenen);
    if (kalan.length) console.warn('YETİM DOSYA (temizlenemedi):', kalan);
    mesaj('gsMsg','hata', hataTr(e.message) + (kalan.length ? ` — ${kalan.length} dosya temizlenemedi (yönetici bilgilendirilmeli)` : ' — yüklenenler temizlendi'));
    btn.disabled=false; btn.textContent='Gün Sonunu Kaydet'; return;
  }
  btn.textContent = eskiBtnMetin;
  window.__sonRpcHataHam = '';
  // DÜZENLEME: kaydı silmeden güncelle
  if (DUZENLE){
    const gData = await rpcCagir('rpc_gun_sonu_guncelle', {
      /* ⚠ GUNCELLEME kaydin KIMLIGINE baglanir, ICERIGINE degil. Icerik
         anahtara girseydi kullanici rakami duzeltip tekrar gonderdiginde
         anahtar degisir ve koruma bosa cikardi. */
      p_idem: await idemKararli('gun_sonu_guncelle',[DUZENLE.id]), p_id: DUZENLE.id,
      p_not: document.getElementById('gsNot').value.trim()||null,
      p_kasa: kasa > 0 ? kasa : null,
      p_kasalar: kasalar.map(k=>({ kasa_no:k.n, sira:k.s, z_no:k.zno, kart_toplam:k.kart, nakit_toplam:k.nakit,
        kart_adet:k.kadet, fis_iptal_adet:k.iadet, fis_iptal_tutar:k.itutar,
        z_foto_path:k.zf, pos_slip_foto_path:k.sf, notlar:k.knot, kdv:k.kdv }))
    }, 'gsKaydet','gsMsg','Değişiklikler kaydedildi ✓');
    if (gData && gData.ok){ taslakSil(); DUZENLE = null; vGunSonu(); mesaj('gsMsg','ok','Değişiklikler kaydedildi ✓'); }

  const data = await rpcCagir('rpc_gun_sonu_kaydet', {
    /* ⚠ TUTAR ANAHTARA GIRMEZ. Gun sonu zaten sube+tarih icin tekil

       kullanici rakami duzeltip tekrar gonderdiginde anahtar degisir ve

    p_idem: await idemKararli('gun_sonu',[AKTIF_SUBE, document.getElementById('gsTarih').value]),
    p_sube: AKTIF_SUBE, p_tarih: document.getElementById('gsTarih').value,
    p_kart: kart, p_nakit: nakit, p_toplam: toplam,
    p_iptal_adet: 0, p_iptal_tutar: 0,
    p_z_no: null, p_kdv: null, p_z_foto: null, p_slip_foto: null,
    p_not: document.getElementById('gsNot').value.trim()||null,
    p_kasa: kasa > 0 ? kasa : null,
    p_kasalar: kasalar.map(k=>({ kasa_no:k.n, sira:k.s, z_no:k.zno, kart_toplam:k.kart, nakit_toplam:k.nakit,
      kart_adet:k.kadet, fis_iptal_adet:k.iadet, fis_iptal_tutar:k.itutar,
      z_foto_path:k.zf, pos_slip_foto_path:k.sf, notlar:k.knot, kdv:k.kdv }))
  }, 'gsKaydet','gsMsg','Gün sonu kaydedildi ✓');
  if (data && data.ok){
    taslakSil();                    // ⚠ YALNIZ basarida. Basarisizlikta taslak DURUR.

    mesaj('gsMsg','ok', duzenlemeydi ? 'Değişiklikler kaydedildi ✓' : 'Gün sonu kaydedildi ✓ (2 kasa)');
  } else {
    btn.textContent = eskiBtnMetin;
    // Ağ belirsizse kayıt gitmiş OLABİLİR -> fotoğrafları SİLME. Kesin hatada temizle.
    const belirsiz = /Failed to fetch|NetworkError|timeout|bağlantı/i.test(window.__sonRpcHataHam||'');
    if (belirsiz){
      console.warn('BELİRSİZ SONUÇ — fotoğraflar korundu:', yuklenen);
      mesaj('gsMsg','hata','Bağlantı belirsiz — kayıt gitmiş olabilir. Fotoğraflar silinmedi. Tekrar denemeden önce listeyi kontrol edin.');
    } else {
      const kalan = await fotoTemizle(yuklenen);
      if (kalan.length) console.warn('YETİM DOSYA (temizlenemedi):', kalan);
      /* ⚠ CM · CAKISMADA O GUNDE NE KAYITLI OLDUGUNU GOSTER.
         Eski mesaj yalniz "zaten girilmiş" diyordu; personel kendi
         hatasi mi (yanlis gune yazmis) yoksa gercekten girilmis mi
         AYIRT EDEMIYORDU. Tutar + Z no gorunce "bu dunun rakami,
         yanlis gune yazilmis" diyebiliyor.
         ⚠ YETKI GENISLEMEDI: burada YALNIZ OKUMA var, uzerine yazma
           yolu acilmadi. Okunan satir zaten personelin gordugu bir
           satir — gun sonu listesi ayni tabloyu ayni sutunlarla
           listeliyor — ve sb.from suzgeci sorguyu AKTIF_SUBE'ye
           kilitliyor, baska subenin kaydi gelmez.
         ⚠ Okuma basarisiz olursa MEVCUT MESAJ DURUR; uydurma yok. */
      if (/GUN_ZATEN_GIRILMIS/.test(window.__sonRpcHataHam || ''))
        await gsCakismaAnlat(document.getElementById('gsTarih').value);
    }
  }
}
async function gsCakismaAnlat(tarih){
  try{
    const { data } = await sb.from('gun_sonu')
      .select('tarih,toplam,gun_sonu_kasa(kasa_no,sira,z_no,is_deleted)')
      .eq('tarih', tarih).eq('is_deleted', false).maybeSingle();
    if (!data) return;
    const zler = (data.gun_sonu_kasa || []).filter(k => !k.is_deleted)
      .sort((a,b) => (a.kasa_no-b.kasa_no) || ((a.sira||1)-(b.sira||1)))
      .map(k => k.z_no).filter(Boolean);
    /* ⚠ "SEN DEGISTIREMEZSIN" DEMIYORUZ — OLCULDU, YANLIS OLURDU:
       personelin KENDI girdigi son 3 gun asagidaki "Son Girdiğin
       Günler" kartinda Düzelt/Sil dugmeleriyle duruyor (RLS o
       pencereyi aciyor). Mesaj neyin YAPILABILIR oldugunu soyluyor,
       yetkiyi kendisi tarif etmeye kalkmiyor. */
    mesaj('gsMsg', 'hata',
      tarih.slice(8,10) + '.' + tarih.slice(5,7) + '.' + tarih.slice(0,4)
      + ' zaten girilmiş: ' + tl(data.toplam)
      + (zler.length ? ' · Z ' + zler.join(', ') : ' · Z no girilmemiş')
      + '.\nYanlış günü seçtiysen tarihi düzelt — formdaki rakamlar duruyor.'
      + '\nKayıtlı rakam yanlışsa: aşağıdaki gün listesinden düzeltebiliyorsan düzelt, '
      + 'düzeltemiyorsan yöneticiye bildir.');
  }catch(e){ /* okunamadi -> rpcCagir'in yazdigi mesaj kalir */ }
}
let GS_AY = null;                                    // hangi ay listeleniyor
function gsAyDegisti(){ GS_AY = document.getElementById('gsListeAy').value; gunSonuListe(); }
async function gunSonuListe(){
  const el = document.getElementById('gsListe'); if(!el) return;
  const ay  = GS_AY || bugun().slice(0,7);
  const bas = ay + '-01';
  const sonGun = new Date(+ay.slice(0,4), +ay.slice(5,7), 0).getDate();
  const son = ay + '-' + String(sonGun).padStart(2,'0');
  // AY BAZLI: limit yok, o ayın tamamı gelir (eskiden son 14 kayıt geliyordu, ayın başı düşüyordu)
  const { data, error } = await sb.from('gun_sonu')
    .select('*, gun_sonu_kasa(kasa_no,sira,z_no,kart_toplam,nakit_toplam,toplam,z_foto_path,pos_slip_foto_path,is_deleted), gun_sonu_kdv(kasa_no,sira,oran,satis_toplam,kdv_tutar,is_deleted)')
    .eq('is_deleted',false).gte('tarih',bas).lte('tarih',son).order('tarih',{ascending:false});
  const gunler = data||[];
  // Kasadan ödenen giderler: sayım o kadar eksik çıkar, gerçek ciroya geri eklenir
  const kasadanMap = {};
  const [kg, no] = await Promise.all([
    sb.from('gider').select('tarih,tutar').eq('kasadan',true).eq('is_deleted',false).gte('tarih',bas).lte('tarih',son),
    sb.from('tedarikci_odeme').select('tarih,tutar').eq('yontem','nakit').eq('is_deleted',false).gte('tarih',bas).lte('tarih',son)
  ]);
  [...(kg.data||[]), ...(no.data||[])].forEach(x=>{ kasadanMap[x.tarih] = (kasadanMap[x.tarih]||0) + (+x.tutar); });

  // Ay toplamı + girilmeyen günler (bugünden sonrası beklenmez)
  const tKart  = gunler.reduce((a,g)=>a+ +g.kart_toplam,0);
  const tNakit = gunler.reduce((a,g)=>a+ +g.nakit_toplam,0);
  const tKdv   = gunler.reduce((a,g)=>a+(g.gun_sonu_kdv||[]).filter(x=>!x.is_deleted).reduce((b,x)=>b+ +x.kdv_tutar,0),0);
  const tZDisi = gunler.reduce((a,g)=>a+(g.kasa_nakit===null?0:+g.kasa_nakit),0);
  const girilen = new Set(gunler.map(g=>g.tarih));
  const bugunS = bugun();
  const eksikGunler = [];
  for (let d=1; d<=sonGun; d++){
    const t = ay + '-' + String(d).padStart(2,'0');
    if (t <= bugunS && !girilen.has(t)) eksikGunler.push(d);
  }
  const ayBasligi = ayAdi(ay);   // global ayAdi() fonksiyonuyla ayni ismi kullanma: golgeliyordu

  el.innerHTML = `<div class="kart">
    ${kbaslik('', 'Gün Sonları', '')}
    <label>Ay</label>
    <input type="month" id="gsListeAy" value="${ay}" onchange="gsAyDegisti()">
    ${error?`<div class="bilgi-not" style="color:var(--hata)">Liste yüklenemedi: ${esc(hataTr(error.message))}</div>`:''}
    <div class="gs-bant" style="margin:12px 0">
      <div class="kalem"><div class="gs-et">Kart</div><div class="dg">${tl(tKart)}</div></div>
      <div class="kalem"><div class="gs-et">Z nakit</div><div class="dg">${tl(tNakit)}</div></div>
      <div class="kalem buyuk"><div class="gs-et">${esc(ayBasligi)} toplamı</div><div class="dg">${tl(tKart+tNakit)}</div></div>
      <div class="kalem"><div class="gs-et">KDV (beyana giden)</div><div class="dg">${tl(tKdv)}</div></div>
    </div>
    ${eksikGunler.length
      ? `<div class="uyari-orta">${eksikGunler.length} gün girilmemiş: ${eksikGunler.join(', ')}</div>`
      : ''}
    <div class="bilgi-not" style="margin:0 0 10px">
      <b>${gunler.length}</b> gün girildi · Z dışı kasa toplamı <b>${tl(tZDisi)}</b>${eksikGunler.length?'':' · bugüne kadar eksik gün yok'}
    </div>
    ${gunler.length===0?bosDurum('belge','Bu ayda gün sonu kaydı yok','Yukarıdan başka ay seçebilir veya bugünün Z raporlarını girebilirsin.'):gunler.map(g=>{
      const kasa = g.kasa_nakit===null ? null : +g.kasa_nakit;
      const kasadan = kasadanMap[g.tarih]||0;
      const gercek = kasa===null ? null : +g.kart_toplam + kasa + kasadan;
      const fark = kasa===null ? null : kasa + kasadan - g.nakit_toplam;
      return `
      <div class="liste-satir">
        <div class="l-sol"><div class="b">${new Date(g.tarih+'T00:00').toLocaleDateString('tr-TR')} ${g.kilitli?'🔒':'🔓'}</div>
          <div class="k">Kart ${tl(g.kart_toplam)} · Z nakit ${tl(g.nakit_toplam)}${(()=>{
            const ks=(g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted)
              .sort((a,b)=>a.kasa_no-b.kasa_no || (a.sira||1)-(b.sira||1));
            return ks.length ? '<br>'+ks.map(k=>`<b>K${k.kasa_no}${zCok(ks,k.kasa_no)?'/'+(k.sira||1):''}</b> Z:${esc(k.z_no||'—')} · ${tl(k.toplam)}`).join(' &nbsp;|&nbsp; ')
                             : ' · Z:'+esc(g.z_no||'—');
          })()}
          ${gercek!==null?`<br>Gerçek: <b>${tl(gercek)}</b> · Z-dışı nakit: <b>${fark>=0?'+':''}${tl(fark)}</b>${kasadan>0?' · kasadan ödenen: '+tl(kasadan):''}`:''}
          ${(()=>{const kd=(g.gun_sonu_kdv||[]).filter(x=>!x.is_deleted);
            const ks=(g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted);
            if(!kd.length) return '<br><span style="color:var(--uyari)">⚠ KDV girilmemiş</span>';
            const t=kd.reduce((a,x)=>a+ +x.kdv_tutar,0);
            const par=[1,2].map(no=>{const s=kd.filter(x=>x.kasa_no===no).reduce((a,x)=>a+ +x.kdv_tutar,0);
              return s>0?`K${no} ${tl(s)}`:null;}).filter(Boolean).join(' + ');
            // Satışı olup KDV'si girilmemiş kasa: beyan eksik kalır, ayrıca uyar
            const acik=[1,2].filter(no=>{
              const sat=ks.filter(k=>k.kasa_no===no).reduce((a,k)=>a+ +k.toplam,0);
              const kdv=kd.filter(x=>x.kasa_no===no).reduce((a,x)=>a+ +x.kdv_tutar,0);
              return sat>0 && kdv===0; });
            return `<br>KDV: <b>${tl(t)}</b>${par?' ('+par+')':''}`
              + (acik.length?`<br><span style="color:var(--uyari)">⚠ Kasa ${acik.join(' ve ')} satış yapmış ama KDV'si girilmemiş</span>`:'');})()}
          ${g.notlar?'<br>'+esc(g.notlar):''}
          ${(()=>{const ks=(g.gun_sonu_kasa||[]).filter(k=>!k.is_deleted)
              .sort((a,b)=>a.kasa_no-b.kasa_no || (a.sira||1)-(b.sira||1));
            const t=new Date(g.tarih+'T00:00').toLocaleDateString('tr-TR');
            if(ks.length) return '<div style="margin-top:6px">'+ks.map(k=>{
              const e=`K${k.kasa_no}${zCok(ks,k.kasa_no)?'/'+(k.sira||1):''}`;
              return belgeBtn(k.z_foto_path,`${e} Z`,`${t} — Kasa ${k.kasa_no} ${zCok(ks,k.kasa_no)?(k.sira||1)+'. Z':'Z'} Raporu`)+
                     slipBtn(k.pos_slip_foto_path,`${e} Slip`,`${t} — Kasa ${k.kasa_no} POS Slip`);}).join('')+'</div>';
            return '<div style="margin-top:6px">'+belgeBtn(g.z_foto_path,'Z Raporu',`${t} — Z Raporu`)+
                   slipBtn(g.pos_slip_foto_path,'POS Slip',`${t} — POS Slip`)+'</div>';
          })()}</div></div>
        <div class="l-sag">${tl(g.toplam)}<br>
          <button class="btn2" style="margin-top:4px" onclick="gunSonuDuzenle('${g.id}')">Düzenle</button>
          <button class="btn-kirmizi" style="margin-top:4px" onclick="gunSil('${g.id}','${g.tarih}')">Sil</button></div>
      </div>`;}).join('')}</div>`;
}
async function gunSil(id, tarih){
  const neden = await nedenSor(`${tarih} günü SİLİNECEK (kayıt audit'te kalır) ve yeniden girilebilir olacak. Neden?`, null, 1);
  if (neden===null) return;
  if (!neden.trim()){ bildir('Neden yazmak zorunlu.', 'hata'); return; }
  const { error } = await sb.rpc('rpc_gun_sonu_sil', { p_id:id, p_neden:neden.trim() });
  if (error){ bildir('Silinemedi: '+hataTr(error.message), 'hata'); return; }
  try{ localStorage.removeItem('sonGunSonu'); }catch(e){}
  vGunSonu();
}

/* ===== ÖDEMELER =====
   Ay içinde elden çıkan paranın tamamı tek listede: kime, ne zaman, neyle, ne kadar.
   İki kaynaktan gelir ve KARIŞTIRILMAZ:
     · gider           — elektrik, fiş, tüp... (kasadan ödendiyse ayrıca işaretli)
     · tedarikci_odeme — firmaya yapılan ödeme (kart/nakit/havale/çek)
   Eskiden tedarikçi ödemesi yalnız Tedarikçi ekranında, gider yalnız burada duruyordu;
   "bu ay kime ne ödedim" sorusunun tek cevabı yoktu. */
/* KASADAN NAKİT kutusuna dokununca: o ay kasadan çıkan her ödeme — hangi gün, ne için.
   Bu para elindeki nakitten çıktığı için o günün kasa sayımı o kadar düşük olur;
   "kasa neden eksik" sorusunun cevabı burada. */
async function kasadanDetay(ay){
  const ov=udKutu(), ic=document.getElementById('udIcerik');
  ic.innerHTML=`<div class="ud-ust"><div style="flex:1"><div class="ud-ad">Yükleniyor...</div></div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  ov.classList.add('acik');
  const sonGun=new Date(+ay.slice(0,4), +ay.slice(5,7), 0).getDate();
  const bas=ay+'-01', son=ay+'-'+String(sonGun).padStart(2,'0');
  const [gd, td] = await Promise.all([
    sb.from('gider').select('tarih,tutar,aciklama,gider_kategori(ad)')
      .eq('is_deleted',false).eq('kasadan',true).gte('tarih',bas).lte('tarih',son),
    sb.from('tedarikci_odeme').select('tarih,tutar,aciklama,tedarikci(ad)')
      .eq('is_deleted',false).eq('yontem','nakit').gte('tarih',bas).lte('tarih',son)
  ]);
  const bas_=(sag)=>`<div class="ud-ust"><div style="flex:1;min-width:0">
      <div class="ud-kod">KASADAN NAKİT</div><div class="ud-ad">${esc(ayAdi(ay))}</div>${sag||''}</div>
    <button class="ud-kapat" onclick="udKapat()" aria-label="Kapat">✕</button></div>`;
  if(gd.error||td.error){
    ic.innerHTML=bas_()+`<div class="ud-govde"><div class="uyari-agir">Yüklenemedi:
      ${esc(hataTr((gd.error||td.error).message))}</div></div>`; return;
  }
  const kayitlar=[
    ...(gd.data||[]).map(x=>({ tarih:x.tarih, tutar:+x.tutar,
      ne: esc(x.aciklama || x.gider_kategori?.ad || 'Gider'),
      tur: esc(x.gider_kategori?.ad || 'Gider') })),
    ...(td.data||[]).map(x=>({ tarih:x.tarih, tutar:+x.tutar,
      ne: esc(x.tedarikci?.ad || 'Tedarikçi') + (x.aciklama?' — '+esc(x.aciklama):''),
      tur: 'Tedarikçi ödemesi' }))
  ].sort((a,b)=> a.tarih<b.tarih?1:a.tarih>b.tarih?-1:0);
  const toplam=kayitlar.reduce((a,x)=>a+x.tutar,0);
  const GUNAD=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];

  ic.innerHTML=bas_()+`<div class="ud-govde">
    <div class="ud-kunye" style="grid-template-columns:1fr 1fr">
      <div><div class="ud-et">TOPLAM</div><div class="ud-dg" style="color:var(--uyari)">${tl(toplam)}</div></div>
      <div><div class="ud-et">KAYIT</div><div class="ud-dg">${kayitlar.length}</div></div>
    </div>
    ${kayitlar.length===0
      ? '<div class="ud-bos">Bu ay kasadan nakit ödeme yapılmamış.</div>'
      : kayitlar.map(x=>{
          const d=new Date(x.tarih+'T00:00');
          return `<div class="ud-satir tikla" style="grid-template-columns:44px 1fr auto"
              onclick="gunDetay('${x.tarih}')">
            <div class="ud-trh">${d.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit'})}
              <span style="display:block;font-size:10px;font-weight:700">${GUNAD[d.getDay()].slice(0,3)}</span></div>
            <div><div style="font-weight:800;font-size:13px">${x.ne}</div>
              <div class="ud-alt">${x.tur}</div></div>
            <div class="ud-tut">${tl(x.tutar)}</div>
          </div>`;
        }).join('')}
    <div class="bilgi-not" style="margin-top:12px">
      Bu ödemeler <b>elindeki nakitten</b> yapıldı. O günün kasa sayımı bu kadar düşük çıkar —
      satırın üstüne dokunursan o günün gün sonu kaydı açılır.
    </div>
  </div>`;
}
function odKimeDegisti(){

  document.getElementById('odAciklamaAlan').style.display = diger ? 'none' : 'block';
}
function odYontemDegisti(){
  const y = document.getElementById('odYontem').value;
  document.getElementById('odCekAlan').style.display  = y==='cek'  ? 'block' : 'none';
  // Taksit yalnız kartta olur; başka yöntemde alan gizlenir ve 1'e döner
  document.getElementById('odKartAlan').style.display = y==='kart' ? 'block' : 'none';
  if (y !== 'kart'){ document.getElementById('odTaksit').value = '1'; }

}
function odTaksitDegisti(){
  const n = +document.getElementById('odTaksit').value || 1;
  const alan = document.getElementById('odTaksitTarihAlan');
  alan.style.display = n > 1 ? 'block' : 'none';
  const ozet = document.getElementById('odTaksitOzet');
  if (n < 2){ ozet.textContent = ''; return; }
  const t = paraDeger('odTutar');
  if (!t){ ozet.textContent = 'Tutarı yazınca taksit dökümü burada çıkar.'; return; }
  // Kuruş kaybı olmasın: son taksit farkı alır (görünümdeki hesabın aynısı)
  const bir = Math.round((t/n)*100)/100, son = Math.round((t - bir*(n-1))*100)/100;
  ozet.innerHTML = `Ayda <b>${tl(bir)}</b>${son!==bir?` (son taksit ${tl(son)})`:''} · toplam <b>${tl(t)}</b>.
    Tedarikçinin borcu bugün kapanır; para hesabından ${n} ayda çıkar.`;
}
/* Tek form, iki kayıt yolu:
     firma seçilirse  -> tedarikci_odeme  (bakiyesi düşer)
     "Diğer" seçilirse-> gider            (firma bakiyesi yok, açıklama zorunlu)
   Nakit seçilirse her iki yolda da "kasadan ödendi" işaretlenir — o gün sayılan
   kasa o kadar eksik çıkar ve sistem bunu toplam nakde geri ekler. */
async function odemeGirisiKaydet(){
  const kime = document.getElementById('odKime').value;
  const tutar = paraDeger('odTutar');
  const yontem = document.getElementById('odYontem').value;
  const tarih = document.getElementById('odTarih').value;
  if (tutar === 0){ mesaj('odMsg','hata','Tutar boş olamaz.'); return; }

  if (kime === '__diger'){
    const ne = document.getElementById('odAciklamaDiger').value.trim();
    if (!ne){ mesaj('odMsg','hata','"Diğer" seçtiğinde ne için ödendiğini yazman gerekiyor.'); return; }
    const data = await rpcCagir('rpc_gider_kaydet',{
      p_idem: await idemKararli('gider',[AKTIF_SUBE, tarih, document.getElementById('odKategori').value, tutar, yontem]),
      p_sube: AKTIF_SUBE, p_tarih: tarih,
      p_kategori: document.getElementById('odKategori').value,
      p_aciklama: ne, p_tutar: tutar,
      p_kdv_orani: null, p_kdv_tutar: 0, p_foto: null,
      p_kasadan: yontem === 'nakit', p_tedarikci: null
    },'odKaydet','odMsg','Ödeme kaydedildi ✓');
    if (data && data.ok){
      document.getElementById('odTutar').value=''; document.getElementById('odAciklamaDiger').value='';
      gdOdeme();
    }
    return;
  }
  const cek = yontem === 'cek';
  const kart = yontem === 'kart';
  const taksit = kart ? (+document.getElementById('odTaksit').value || 1) : 1;
  const taksitIlk = document.getElementById('odTaksitIlk').value || null;
  if (taksit > 1 && !taksitIlk){
    mesaj('odMsg','hata','Taksitli ödemede ilk taksitin çıkacağı tarihi seç — yoksa nakit takvimi yanlış olur.');
    return;
  }
  const data = await rpcCagir('rpc_tedarikci_odeme_kaydet',{
    p_idem: await idemKararli('odeme',[AKTIF_SUBE, tarih, kime, tutar, yontem]),
    p_sube: AKTIF_SUBE, p_tedarikci: kime, p_tarih: tarih, p_tutar: tutar,
