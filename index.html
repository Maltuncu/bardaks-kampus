/* v79 · FİRMA YARATMANIN İKİNCİ YOLU — ölçümde İLK BAŞTA KAÇMIŞTI.
   v79 ölçüm turunda yalnız `tedarikciEkleHizli` (RPC yolu) sayılmıştı;
   kilit eklenirken burası bulundu: doğrudan `.insert`, kilit YOK, ve
   hata `hataTr`'den GEÇMEDEN ham basılıyordu.
   Bu bulgu kararı da değiştirdi: "sadece düğme kilidi" çözümü İKİ yere
   yazılmak zorunda kalacaktı ve üçüncü bir yol eklendiği gün yine açık
   kalırdı. Asıl koruma bu yüzden veritabanı kısıtı (v79 ·
   ux_tedarikci_ad) — o, bütün yolları AYNI ANDA kapatıyor. */
async function tedarikciEkle(){
  const ad = document.getElementById('ynTedAd').value.trim();
  if (!ad){ mesaj('ynTedMsg','hata','Firma adı boş.'); return; }
  const btn = document.getElementById('ynTedBtn');
  if (btn && btn.disabled) return;
  const eski = btn ? btn.textContent : null;
  if (btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  try{
    const { error } = await sb.from('tedarikci').insert({ ad, telefon: document.getElementById('ynTedTel').value.trim()||null });
    if (error){ mesaj('ynTedMsg','hata',hataTr(error.message)); return; }
    mesaj('ynTedMsg','ok','Tedarikçi eklendi ✓'); document.getElementById('ynTedAd').value='';
    await katalogYukle();
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = eski; }
  }
}
/* v80 · `tedarikciEkle` ile AYNI SINIF: kilitsiz `.insert` + ham hata.
   Kilit ve `hataTr` eklendi.
   v84 · SİLME KANALI AÇILDI — kullanıcı istedi. (v80'de sorulmuştu;
   istenmeyen kanal açmamak için beklenmişti.) Bkz. `kategoriSil`.
   ⚠ `gider_kategori`'de ad tekilliği HÂLÂ ÖLÇÜLMEDİ; aynı adla ikinci
   kategori açılabilir olabilir. Kaydedildi, kapsam dışı. */
/* ⚠ Y3 FAZ 1-b · YENI RPC YAZILMADI: `kategoriEkle` bugun de ham
     `.insert` kullaniyor ve `owner_all_gider_kategori` policy'si
     owner'a ALL veriyor (`GRANT SELECT,INSERT,UPDATE ... TO
     authenticated` duruyor). Ayni kanal.
   ⚠ HATA DURUMUNDA KUTU GERI ALINIR: RLS owner disindakini durdurur;
     isaretli gorunup kaydedilmemis bir kutu ekranin yalan soylemesi
     olurdu. Hata evin kalibiyla `ynKatMsg`e yazilir.
   ⚠ YENIDEN SORGU YOK: `KATALOG` yerinde guncelleniyor. `katalogYukle`
     cagirmak butun katalogu bosuna tazelerdi; degisen tek sey bu
     satirin bayragi.
   ⚠ DENETIM IZI KENDILIGINDEN: `trg_audit_gider_kategori` her UPDATE'te
     `audit_log`a satir yaziyor (provada olculdu: isaretleme oncesi 10,
     sonrasi 11). Yani "bu kategoriyi kim ne zaman isaretledi" kayitli. */
async function kategoriMalAlimi(id, isaretli){
  const kut = document.getElementById('katMal_' + id);
  if (kut) kut.disabled = true;
  const { error } = await sb.from('gider_kategori')
    .update({ mal_alimi: !!isaretli }).eq('id', id);
  if (kut) kut.disabled = false;
  if (error){
    if (kut) kut.checked = !isaretli;
    mesaj('ynKatMsg','hata', hataTr(error.message));
    return;
  }
  const k = (KATALOG.kategoriler||[]).find(x => x.id === id);
  if (k) k.mal_alimi = !!isaretli;
  mesaj('ynKatMsg','ok', (k ? k.ad : 'Kategori') + (isaretli
    ? ' artık mal alımı sayılıyor — gider ekranında yönlendirme çıkacak ✓'
    : ' artık işletme gideri sayılıyor ✓'));
}
async function kategoriEkle(){
  const ad = document.getElementById('ynKatAd').value.trim();
  if (!ad){ mesaj('ynKatMsg','hata','Kategori adı boş.'); return; }
  const btn = document.getElementById('ynKatBtn');
  if (btn && btn.disabled) return;
  const eski = btn ? btn.textContent : null;
  if (btn){ btn.disabled = true; btn.textContent = 'Kaydediliyor...'; }
  try{
  const { error } = await sb.from('gider_kategori').insert({ ad });
  if (error){ mesaj('ynKatMsg','hata',hataTr(error.message)); return; }
  mesaj('ynKatMsg','ok','Kategori eklendi ✓'); document.getElementById('ynKatAd').value='';
  await katalogYukle();
  } finally {
    if (btn){ btn.disabled = false; btn.textContent = eski; }
  }
}
/* v84 · H-62 · KATEGORİ SİLME KANALI
   ⚠ v80'in (tedarikçi) BAĞLI KAYIT ENGELİ buraya KOPYALANMADI ve sebebi
   ölçüldü: tedarikçide `v_tedarikci_bakiye` `WHERE NOT t.is_deleted`
   diyordu, yani silme BORCU EKRANDAN yok ediyordu. Kategori için aynı
   ölçüm koşuldu ve zarar ÇIKMADI —
     v_kdv_ay        kategorinin is_deleted'ini SÜZMÜYOR (beyan etkilenmez)
     v_belgeler      LEFT JOIN, süzmüyor
     gider listesi   `gider_kategori(ad)` ile FK üzerinden çözüyor,
                     silinen kategorinin ADI GÖRÜNMEYE DEVAM EDER
   Düşen tek şey kategori SEÇİM listesi — istenen zaten bu.
   "Simetri tek başına gerekçe değildir": engel kopyalanmadı, bunun
   yerine RPC bağlı gider sayısını DÖNÜYOR ve ekran BİLGİLENDİRİYOR. */
async function kategoriSil(id, ad){
  const btn = document.getElementById('katSil_' + id);
  if (btn && btn.disabled) return;          // çift tıklama kilidi

  const neden = await nedenSor((ad ? ad + ' — ' : '') + 'kategori neden siliniyor?',
    'Gerekçe zorunlu ve kayda geçer (denetim izine yazılır).\n' +
    'Örnek: "yanlışlıkla eklendi"', 1);
  if (!neden || !neden.trim()){
    if (neden !== null) bildir('Gerekçe boş olamaz — silinmedi.', 'hata');
    return;
  }
  if (!await onaySor((ad||'Kategori') + ' silinecek.',
             'Bu kategorideki GEÇMİŞ giderler etkilenmez — adları\n'
             + 'listelerde ve KDV raporunda görünmeye devam eder.\n'
             + 'Yalnız yeni gider bu kategoriye girilemez.\n\nDevam?', 'Sil')) return;

  if (btn){ btn.disabled = true; btn.textContent = '…'; }
  const { data, error } = await sb.rpc('rpc_gider_kategori_sil', { p_id:id, p_neden:neden.trim() });
  if (error){
    if (btn){ btn.disabled = false; btn.textContent = 'Sil'; }
    bildir('Silinemedi: ' + hataTr(error.message), 'hata');
    return;
  }
  const n = +(data && data.bagli_gider) || 0;
  mesaj('ynKatMsg','ok', (ad||'Kategori') + ' silindi ✓'
    + (n ? ` — ${n} geçmiş gider bu kategorideydi, kayıtları duruyor.` : ''));
  await katalogYukle();
  vYonetim();
}

/* ================== BAŞLAT ================== */
/* ⚠ VE · GIRIS EKRANI ARTIK GIZLI BASLIYOR (bkz. #girisEkran yorumu).
   Bu catch onun GUVENLIK AGI: baslat() herhangi bir yerde duserse
   (ag kopmasi, jeton hatasi, beklenmedik istisna) kullanici bos ekranda
   KILITLENMESIN — form gosterilir ve sebebi Turkce yazilir.
   ⚠ Ham hata metni gosterilmez, hataTr'den gecer (ev kalibi).
   ⚠ baslat()'in kendi iki dali (oturum yok / profil yok) DEGISMEDI;
     bu yalniz beklenmedik istisnayi yakalar.
   Kalip borc.html'in acilisiyla BIREBIR AYNI — yenisi icat edilmedi. */
baslat().catch(e => {
  document.getElementById('girisEkran').classList.remove('gizli');
  /* ⚠ Cevrilmis metin GENEL cumleyse ikinci kez yazma — ayni sey iki
     satirda tekrar ediyordu (olculdu). Kalip dosyanin kendi deseninden
     (bkz. `tr && tr !== HATA_GENEL`), yenisi icat edilmedi. */
  const tr = hataTr(e && e.message);
  mesaj('girisHata','hata','Bağlantı kurulamadı. Tekrar giriş yapmayı dene.'
    + (tr && tr !== HATA_GENEL ? '\n' + tr : ''));
  console.error('baslat()', e);
});
</script>
